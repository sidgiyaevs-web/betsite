<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡ OpenBet — Live Betting Simulator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0a0a14;
    --bg2: #12121f;
    --card: #1a1a2e;
    --border: #2a2a45;
    --text: #fff;
    --muted: #888;
    --accent: #7b5cff;
    --accent2: #00d4ff;
    --green: #00e676;
    --red: #ff3860;
    --gold: #ffb800;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }
  body.has-coupon { padding-bottom: 140px; }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 20% 0%, rgba(123,92,255,.15), transparent 50%),
      radial-gradient(circle at 80% 100%, rgba(0,212,255,.1), transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  header {
    background: rgba(10,10,20,.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100;
    padding: 12px 24px;
  }
  .header-inner {
    max-width: 1280px; margin: 0 auto;
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px; flex-wrap: wrap;
  }
  .logo { font-size: 20px; font-weight: 900; white-space: nowrap; }
  .logo span {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .nav { display: flex; gap: 4px; }
  .nav button {
    background: transparent; border: none; color: var(--muted);
    padding: 8px 12px; border-radius: 10px; cursor: pointer;
    font-weight: 700; font-size: 13px; font-family: inherit; transition: .2s;
  }
  .nav button:hover, .nav button.active { color: #fff; background: var(--card); }
  .header-right { display: flex; align-items: center; gap: 8px; }
  .balance {
    background: var(--card); border: 1px solid var(--border);
    padding: 8px 14px; border-radius: 12px;
    font-weight: 800; font-size: 14px;
    display: flex; align-items: center; gap: 6px;
    font-variant-numeric: tabular-nums;
  }
  .balance .reset { font-size: 10px; color: var(--muted); font-weight: 500; margin-left: 4px; }
  .icon-btn {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; width: 36px; height: 36px;
    cursor: pointer; color: #fff; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: .2s;
  }
  .icon-btn:hover { border-color: var(--accent); }
  .icon-btn.muted { opacity: .4; }

  .container {
    max-width: 1280px; margin: 0 auto;
    padding: 20px 24px; position: relative; z-index: 1;
  }

  .filters {
    display: flex; gap: 8px; margin-bottom: 16px;
    flex-wrap: wrap; align-items: center;
  }
  .filter {
    padding: 8px 16px; background: var(--card);
    border: 1px solid var(--border); border-radius: 10px;
    cursor: pointer; font-weight: 700; color: var(--muted);
    font-size: 13px; font-family: inherit; transition: .2s;
  }
  .filter:hover, .filter.active {
    color: #fff; border-color: var(--accent);
    background: rgba(123,92,255,.1);
  }
  .filter.toggle { margin-left: auto; }
  .filter.toggle.active {
    background: rgba(0,230,118,.1);
    border-color: var(--green); color: var(--green);
  }

  .session-bar {
    display: flex; gap: 16px; align-items: center;
    padding: 10px 14px; background: var(--card);
    border: 1px solid var(--border); border-radius: 10px;
    margin-bottom: 16px; font-size: 12px; flex-wrap: wrap;
  }
  .session-bar .label { color: var(--muted); font-weight: 600; }
  .session-bar .value { font-weight: 800; font-variant-numeric: tabular-nums; }
  .session-bar .value.green { color: var(--green); }
  .session-bar .value.red { color: var(--red); }

  .live-drops {
    display: flex; gap: 8px; overflow-x: auto;
    padding-bottom: 8px; margin-bottom: 16px;
  }
  .live-drops::-webkit-scrollbar { height: 6px; }
  .live-drops::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .live-drops:empty { display: none; }
  .drop {
    min-width: 140px; background: var(--card);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 10px; font-size: 11px;
  }
  .drop-match {
    font-weight: 700; margin-bottom: 4px;
    overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; font-size: 11px;
  }
  .drop-event { color: var(--green); font-size: 11px; font-weight: 700; }

  .match {
    background: linear-gradient(180deg, var(--card), var(--bg2));
    border: 1px solid var(--border); border-radius: 14px;
    padding: 14px; margin-bottom: 10px;
    display: grid; grid-template-columns: 1fr auto;
    gap: 12px; align-items: center; transition: .2s;
  }
  .match:hover { border-color: #3a3a55; }
  .match.finished { opacity: .55; }
  .match-info { min-width: 0; }
  .match-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .match-league {
    font-size: 10px; color: var(--muted);
    text-transform: uppercase; letter-spacing: .5px; font-weight: 700;
  }
  .badge {
    font-size: 9px; padding: 2px 6px; border-radius: 4px;
    font-weight: 800; text-transform: uppercase; letter-spacing: .5px;
  }
  .badge.live { background: var(--red); color: #fff; animation: pulse 1.5s infinite; }
  .badge.finished { background: #333; color: #888; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
  .sport-icon { font-size: 14px; }

  .teams {
    font-weight: 700; font-size: 15px; margin-bottom: 6px;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .score { color: var(--green); font-weight: 800; font-variant-numeric: tabular-nums; }
  .minute { font-size: 11px; color: var(--muted); font-weight: 600; }

  .momentum-bar {
    height: 3px; background: var(--border);
    border-radius: 2px; margin-top: 6px;
    overflow: hidden; position: relative;
  }
  .momentum-bar::after {
    content: ''; position: absolute;
    left: 50%; top: 0; height: 100%; width: 2px;
    background: var(--muted); transform: translateX(-50%);
  }
  .momentum-fill {
    height: 100%; background: linear-gradient(90deg, var(--red), var(--green));
    transition: .5s;
  }

  .odds { display: flex; gap: 6px; }
  .odds-btn {
    width: 80px; flex: 0 0 auto;
    background: #0f0f1a;
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 6px; text-align: center;
    cursor: pointer; transition: border-color .2s; color: #fff;
    font-family: inherit; font-variant-numeric: tabular-nums;
    overflow: hidden;
  }
  .odds-btn:hover:not(:disabled):not(.disabled) {
    border-color: var(--accent); background: var(--card);
  }
  .odds-btn:disabled, .odds-btn.disabled {
    opacity: .35; cursor: not-allowed;
  }
  .odds-label {
    font-size: 10px; color: var(--muted);
    margin-bottom: 2px; font-weight: 600;
  }
  .odds-value {
    font-size: 15px; font-weight: 800;
    color: var(--accent2);
  }

  .extras {
    grid-column: 1 / -1; margin-top: 4px;
    border-top: 1px solid var(--border); padding-top: 6px;
  }
  .extras-toggle {
    background: transparent; border: none;
    color: var(--accent2); cursor: pointer;
    font-size: 12px; font-weight: 700;
    padding: 4px 0; font-family: inherit;
  }
  .extras-toggle.open { color: var(--muted); }
  .extras-grid {
    display: none;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 6px; margin-top: 8px;
  }
  .extras-grid.open { display: grid; }
  .odds-mini {
    background: #0f0f1a; border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 8px;
    cursor: pointer; display: flex;
    justify-content: space-between; align-items: center;
    font-family: inherit; color: #fff;
    transition: border-color .2s; gap: 6px;
    min-width: 0; overflow: hidden;
  }
  .odds-mini:hover:not(.disabled) { border-color: var(--accent); background: var(--card); }
  .odds-mini.disabled { opacity: .35; cursor: not-allowed; }
  .odds-mini-label { font-size: 11px; color: var(--muted); text-align: left; }
  .odds-mini-value {
    font-size: 12px; font-weight: 800;
    color: var(--accent2); white-space: nowrap;
  }

  .history-item {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 14px;
    margin-bottom: 8px; display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 12px; align-items: center;
  }
  .history-item.won { border-left: 3px solid var(--green); }
  .history-item.lost { border-left: 3px solid var(--red); }
  .history-item.pending { border-left: 3px solid var(--gold); }
  .history-main { min-width: 0; }
  .history-match { font-weight: 700; font-size: 13px; margin-bottom: 2px; }
  .history-meta { font-size: 11px; color: var(--muted); }
  .history-stake { text-align: right; }
  .history-stake .amount {
    font-weight: 800; font-size: 14px;
    font-variant-numeric: tabular-nums;
  }
  .history-status {
    font-weight: 800; padding: 4px 10px;
    border-radius: 6px; text-transform: uppercase;
    letter-spacing: .5px; font-size: 10px;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .history-status.won { background: rgba(0,230,118,.15); color: var(--green); }
  .history-status.lost { background: rgba(255,56,96,.15); color: var(--red); }
  .history-status.pending { background: rgba(255,184,0,.15); color: var(--gold); }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px; margin-bottom: 24px;
  }
  .stat {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px;
  }
  .stat-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
  .stat-value { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .stat-value.green { color: var(--green); }
  .stat-value.red { color: var(--red); }
  .stat-value.gold { color: var(--gold); }

  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.8); backdrop-filter: blur(6px);
    display: none; align-items: center; justify-content: center;
    z-index: 1000; padding: 16px;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: linear-gradient(180deg, var(--card), var(--bg2));
    border: 1px solid var(--border); border-radius: 18px;
    padding: 24px; max-width: 440px; width: 100%;
    animation: popIn .25s cubic-bezier(.5,1.5,.5,1);
    max-height: 90vh; overflow-y: auto;
  }
  @keyframes popIn { from { transform: scale(.9); opacity: 0; } }
  .modal h3 { font-size: 17px; margin-bottom: 6px; }
  .modal .sub {
    color: var(--muted); font-size: 12px;
    margin-bottom: 16px; line-height: 1.5;
  }
  .modal .row {
    display: flex; justify-content: space-between;
    padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px;
  }
  .modal .row:last-of-type { border-bottom: none; }
  .modal .row .label { color: var(--muted); }
  .modal .row .value { font-weight: 700; font-variant-numeric: tabular-nums; }
  .modal input {
    width: 100%; background: #0f0f1a;
    border: 1px solid var(--border); color: #fff;
    padding: 12px 14px; border-radius: 10px;
    font-size: 16px; margin: 14px 0 10px;
    font-family: inherit; font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .modal input:focus { outline: none; border-color: var(--accent); }
  .quick-stakes { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .quick-stake {
    flex: 1; min-width: 56px; padding: 8px 4px;
    background: #0f0f1a; border: 1px solid var(--border);
    border-radius: 8px; color: #fff; font-size: 12px;
    font-weight: 700; cursor: pointer; font-family: inherit; transition: .2s;
  }
  .quick-stake:hover { border-color: var(--accent); background: var(--card); }
  .modal-actions { display: flex; gap: 8px; margin-top: 16px; }
  .btn {
    flex: 1; padding: 12px; border-radius: 10px;
    border: none; font-weight: 800; cursor: pointer;
    font-family: inherit; font-size: 14px; transition: .2s;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; box-shadow: 0 6px 20px rgba(123,92,255,.35);
  }
  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(123,92,255,.5);
  }
  .btn-primary:disabled { opacity: .4; cursor: not-allowed; transform: none; }
  .btn-secondary {
    background: #0f0f1a; color: #fff;
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { border-color: var(--accent); }
  .btn-coupon {
    background: var(--card);
    border: 1px solid var(--accent);
    color: var(--accent2);
  }

  .coupon-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: linear-gradient(180deg, var(--card), var(--bg2));
    border-top: 2px solid var(--accent);
    padding: 10px 16px;
    transform: translateY(100%);
    transition: transform .3s;
    z-index: 200;
    box-shadow: 0 -10px 40px rgba(0,0,0,.5);
  }
  .coupon-bar.active { transform: translateY(0); }
  .coupon-inner { max-width: 1280px; margin: 0 auto; }
  .coupon-items {
    display: flex; gap: 6px; overflow-x: auto;
    padding-bottom: 8px; margin-bottom: 6px;
  }
  .coupon-items::-webkit-scrollbar { height: 4px; }
  .coupon-items::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .coupon-item {
    background: #0f0f1a; border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 8px;
    display: flex; align-items: center; gap: 6px;
    min-width: 180px; font-size: 11px;
  }
  .coupon-item-info { flex: 1; min-width: 0; }
  .coupon-item-match {
    font-weight: 700; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .coupon-item-pick { color: var(--accent2); font-weight: 700; font-size: 10px; }
  .coupon-item-remove {
    background: transparent; border: none;
    color: var(--red); font-size: 18px;
    cursor: pointer; padding: 0 4px;
    font-family: inherit; line-height: 1;
  }
  .coupon-actions { display: flex; gap: 6px; justify-content: flex-end; }
  .coupon-clear {
    background: transparent; border: 1px solid var(--border);
    color: var(--muted); padding: 8px 14px;
    border-radius: 8px; cursor: pointer;
    font-family: inherit; font-weight: 700; font-size: 12px;
  }
  .coupon-place {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none; color: #fff;
    padding: 8px 16px; border-radius: 8px;
    cursor: pointer; font-family: inherit;
    font-weight: 800; font-size: 12px;
    box-shadow: 0 4px 16px rgba(123,92,255,.4);
    font-variant-numeric: tabular-nums;
  }

  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--card); border: 1px solid var(--border);
    padding: 12px 20px; border-radius: 12px;
    font-weight: 700; font-size: 13px; z-index: 2000;
    transition: transform .3s cubic-bezier(.5,1.5,.5,1);
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
    max-width: 90%; text-align: center;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { border-color: var(--green); }
  .toast.error { border-color: var(--red); }

  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty .icon { font-size: 48px; margin-bottom: 12px; }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  @media (max-width: 720px) {
    header { padding: 10px 14px; }
    .nav button { padding: 6px 8px; font-size: 12px; }
    .logo { font-size: 16px; }
    .balance { padding: 6px 10px; font-size: 13px; }
    .balance .reset { display: none; }
    .match { grid-template-columns: 1fr; gap: 10px; padding: 12px; }
    .odds { justify-content: flex-start; }
    .container { padding: 14px; }
    .extras-grid { grid-template-columns: repeat(2, 1fr); }
    .history-item { grid-template-columns: 1fr auto; }
    .history-status { grid-column: 1 / -1; text-align: center; }
    .header-inner { gap: 8px; }
    .session-bar { font-size: 11px; gap: 10px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">⚡ Open<span>Bet</span></div>
    <nav class="nav">
      <button class="active" data-tab="line">📊 Линия</button>
      <button data-tab="history">📜 История</button>
      <button data-tab="stats">📈 Стата</button>
    </nav>
    <div class="header-right">
      <div class="balance">
        💰 <span id="balance">20 000</span> ₽
        <span class="reset">/ день</span>
      </div>
      <button class="icon-btn" id="soundBtn" title="Звук">🔊</button>
      <button class="icon-btn" id="resetBtn" title="Сброс">♻️</button>
    </div>
  </div>
</header>

<div class="container">
  <div class="session-bar">
    <span><span class="label">Сессия:</span> <span class="value" id="sessionProfit">0 ₽</span></span>
    <span><span class="label">Ставок:</span> <span class="value" id="sessionBets">0</span></span>
    <span><span class="label">Винрейт:</span> <span class="value" id="sessionWinrate">—</span></span>
  </div>

  <div class="live-drops" id="liveDrops"></div>

  <div class="tab-content active" id="tab-line">
    <div class="filters">
      <button class="filter active" data-sport="all">🔥 Все</button>
      <button class="filter" data-sport="football">⚽ Футбол</button>
      <button class="filter" data-sport="hockey">🏒 Хоккей</button>
      <button class="filter" data-sport="ufc">🥊 UFC</button>
      <button class="filter toggle" id="liveOnly">🔴 Только live</button>
    </div>
    <div id="matches"></div>
  </div>

  <div class="tab-content" id="tab-history">
    <div id="history"></div>
  </div>

  <div class="tab-content" id="tab-stats">
    <div class="stats-grid" id="statsGrid"></div>
  </div>
</div>

<div class="modal-overlay" id="betModal">
  <div class="modal">
    <h3 id="betModalTitle">Ставка</h3>
    <p class="sub" id="betModalSub"></p>
    <div class="row">
      <span class="label">Коэффициент</span>
      <span class="value" id="betModalOdd">—</span>
    </div>
    <div class="row">
      <span class="label">Возможный выигрыш</span>
      <span class="value" id="betModalPotential" style="color: var(--green)">—</span>
    </div>
    <input type="number" id="betModalStake" placeholder="Сумма ставки" min="10" step="10">
    <div class="quick-stakes">
      <button class="quick-stake" data-stake="100">100</button>
      <button class="quick-stake" data-stake="500">500</button>
      <button class="quick-stake" data-stake="1000">1K</button>
      <button class="quick-stake" data-stake="5000">5K</button>
      <button class="quick-stake" data-stake="all">MAX</button>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeBetModal()">Отмена</button>
      <button class="btn btn-coupon" id="betModalCoupon" style="display:none">📋 В купон</button>
      <button class="btn btn-primary" id="betModalConfirm">Поставить</button>
    </div>
  </div>
</div>

<div class="coupon-bar" id="couponBar"></div>
<div class="toast" id="toast"></div>

<script>
// ============================================================
// ДАННЫЕ — РЕАЛЬНЫЕ КЛУБЫ
// ============================================================

const FOOTBALL_TEAMS = [
  { name: 'Manchester City',     attack: 2.10, defense: 0.90, league: 'Premier League' },
  { name: 'Arsenal',             attack: 1.95, defense: 0.95, league: 'Premier League' },
  { name: 'Liverpool',           attack: 2.05, defense: 1.00, league: 'Premier League' },
  { name: 'Chelsea',             attack: 1.72, defense: 1.22, league: 'Premier League' },
  { name: 'Tottenham',           attack: 1.80, defense: 1.30, league: 'Premier League' },
  { name: 'Manchester United',   attack: 1.65, defense: 1.25, league: 'Premier League' },
  { name: 'Newcastle',           attack: 1.75, defense: 1.20, league: 'Premier League' },
  { name: 'Aston Villa',         attack: 1.68, defense: 1.28, league: 'Premier League' },
  { name: 'Brighton',            attack: 1.62, defense: 1.32, league: 'Premier League' },
  { name: 'West Ham',            attack: 1.48, defense: 1.40, league: 'Premier League' },
  { name: 'Real Madrid',         attack: 2.20, defense: 0.90, league: 'La Liga' },
  { name: 'Barcelona',           attack: 2.10, defense: 1.05, league: 'La Liga' },
  { name: 'Atletico Madrid',     attack: 1.75, defense: 0.95, league: 'La Liga' },
  { name: 'Sevilla',             attack: 1.45, defense: 1.30, league: 'La Liga' },

const pickTwo = (arr) => {

  while (a.name === b.name) b = pick(arr);
  return [a, b];
};

function poisson(k, lambda) {
  if (lambda <= 0) return k === 0 ? 1 : 0;
  let fact = 1;
  for (let i = 2; i <= k; i++) fact *= i;
  return Math.pow(lambda, k) * Math.exp(-lambda) / fact;
}

function toOdds(p, margin = 0.06) {
  if (p <= 0) return 999;
  if (p >= 1) return 1.01;
  const raw = 1 / (p * (1 + margin));
  return Math.round(raw * 100) / 100;
}

// Валидность кэфа — [1.05 … 25]
function isOddValid(odd) {
  return odd !== null && odd !== undefined &&
         odd >= 1.05 && odd <= 25 && !isNaN(odd);
}

function beep(freq, duration, type = 'sine', volume = 0.08) {
  if (!soundOn) return;
  try {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audio.createOscillator();
    const gain = audio.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume, audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + duration);
    osc.connect(gain); gain.connect(audio.destination);
    osc.start(); osc.stop(audio.currentTime + duration);
  } catch (e) {}
}

// КОЭФФИЦИЕНТЫ 1X2 / ML
// ============================================================

function computeOdds(m) {
  if (m.status === 'finished') return { home: null, draw: null, away: null };

  // UFC
  if (m.sport === 'ufc') {
    const diff = m.homeRating - m.awayRating;
    let pHome = 1 / (1 + Math.pow(10, -diff / 400));
    const progress = m.minute / m.maxMinute;
    pHome = 0.5 + (pHome - 0.5) * (1 - progress * 0.8);
    pHome = Math.max(0.02, Math.min(0.98, pHome));

    const oH = toOdds(pHome, 0.06);
    const oA = toOdds(1 - pHome, 0.06);

    return {
      home: isOddValid(oH) ? oH : null,
      away: isOddValid(oA) ? oA : null,
      draw: null,
    };
  }

  // Футбол / хоккей
  const remaining = Math.max(0, m.maxMinute - m.minute);
  let lambdaHome = m.homeAttack * (remaining / m.maxMinute);
  let lambdaAway = m.awayAttack * (remaining / m.maxMinute);
  lambdaHome *= (1 + m.momentum * 0.3);
  lambdaAway *= (1 - m.momentum * 0.3);

  let pHome = 0, pDraw = 0, pAway = 0;
  for (let h = 0; h <= 10; h++) {
    for (let a = 0; a <= 10; a++) {
      const p = poisson(h, lambdaHome) * poisson(a, lambdaAway);
      const fh = m.scoreHome + h;
      const fa = m.scoreAway + a;
      if (fh > fa) pHome += p;
      else if (fh === fa) pDraw += p;
      else pAway += p;
    }
  }
  const total = pHome + pDraw + pAway || 1;
  pHome /= total; pDraw /= total; pAway /= total;

  if (m.sport === 'hockey') {
    const t = pHome + pAway || 1;
    const oH = toOdds(pHome / t, 0.055);
    const oA = toOdds(pAway / t, 0.055);
    return {
      home: isOddValid(oH) ? oH : null,
      away: isOddValid(oA) ? oA : null,
      draw: null,
    };
  }

  const oH = toOdds(pHome);
  const oD = toOdds(pDraw);
  const oA = toOdds(pAway);
  return {
    home: isOddValid(oH) ? oH : null,
    draw: isOddValid(oD) ? oD : null,
    away: isOddValid(oA) ? oA : null,
  };
}

function computeExtraMarkets(m) {
  if (m.status === 'finished') return {};

  // UFC
  if (m.sport === 'ufc') {
    const diff = m.homeRating - m.awayRating;
    let pHome = 1 / (1 + Math.pow(10, -diff / 400));
    const progress = m.minute / m.maxMinute;
    pHome = 0.5 + (pHome - 0.5) * (1 - progress * 0.8);
    pHome = Math.max(0.02, Math.min(0.98, pHome));
    const pAway = 1 - pHome;

    const pFinish = 0.65 * (1 - progress * 0.5);
    const pKO = pFinish * 0.55;
    const pSub = pFinish * 0.35;
    const pDec = 1 - pFinish;

    const pR1 = pFinish * 0.35;
    const pR2 = pFinish * 0.25;
    const pR3 = pFinish * 0.20;
    const pR4 = pFinish * 0.20;
    const pOver15 = 1 - pR1;
    const pOver25 = 1 - (pR1 + pR2);

    const raw = {};

    raw['Метод · KO/TKO'] = toOdds(pKO, 0.06);
    raw['Метод · Сабмишн'] = toOdds(pSub, 0.06);
    raw['Метод · Решение'] = toOdds(pDec, 0.06);
    raw['Тотал Б 1.5 раундов'] = toOdds(pOver15, 0.06);
    raw['Тотал М 1.5 раундов'] = toOdds(1 - pOver15, 0.06);
    raw['Тотал Б 2.5 раундов'] = toOdds(pOver25, 0.06);
    raw['Тотал М 2.5 раундов'] = toOdds(1 - pOver25, 0.06);
    raw['Бой досрочно'] = toOdds(pFinish, 0.06);
    raw['Пройти всю дистанцию'] = toOdds(pDec, 0.06);

    raw['Финиш в R1'] = toOdds(pR1, 0.07);
    raw['Финиш в R2'] = toOdds(pR2, 0.07);
    raw['Финиш в R3'] = toOdds(pR3, 0.07);
    raw['Финиш в R4+'] = toOdds(pR4, 0.07);

    raw[`${m.home} KO/TKO`] = toOdds(pHome * pKO, 0.08);
    raw[`${m.home} Сабмишн`] = toOdds(pHome * pSub, 0.08);
    raw[`${m.home} Решение`] = toOdds(pHome * pDec, 0.08);
    raw[`${m.away} KO/TKO`] = toOdds(pAway * pKO, 0.08);
    raw[`${m.away} Сабмишн`] = toOdds(pAway * pSub, 0.08);
    raw[`${m.away} Решение`] = toOdds(pAway * pDec, 0.08);

    raw[`${m.home} в R1`] = toOdds(pHome * pR1 * 1.3, 0.09);
    raw[`${m.away} в R1`] = toOdds(pAway * pR1 * 1.3, 0.09);

    return raw;
  }

  // Футбол / хоккей
  const isFootball = m.sport === 'football';
  const remaining = Math.max(0, m.maxMinute - m.minute);
  if (remaining <= 0) return {};

  const lambdaHome = m.homeAttack * (remaining / m.maxMinute) * (1 + m.momentum * 0.3);
  const lambdaAway = m.awayAttack * (remaining / m.maxMinute) * (1 - m.momentum * 0.3);
  const lambdaTotal = lambdaHome + lambdaAway;

  const currentTotal = m.scoreHome + m.scoreAway;

  const remDist = [];
  for (let g = 0; g <= 12; g++) remDist.push(poisson(g, lambdaTotal));

  function overProb(line) {
    let p = 0;
    for (let g = 0; g <= 12; g++) {
      if (currentTotal + g > line) p += remDist[g];
    }
    return p;
  }

  function underProb(line) {
    let p = 0;
    for (let g = 0; g <= 12; g++) {
      if (currentTotal + g < line) p += remDist[g];
    }
    return p;
  }

  function handicapProb(line) {
    let p = 0;
    for (let h = 0; h <= 8; h++) {
      for (let a = 0; a <= 8; a++) {
        const diff = (m.scoreHome + h) - (m.scoreAway + a);
        if (diff > line) p += poisson(h, lambdaHome) * poisson(a, lambdaAway);
      }
    }
    return p;
  }

  let pBtts = 0;
  for (let h = 0; h <= 8; h++) {
    for (let a = 0; a <= 8; a++) {
      if (m.scoreHome + h >= 1 && m.scoreAway + a >= 1) {
        pBtts += poisson(h, lambdaHome) * poisson(a, lambdaAway);
      }
    }
  }

  const odds1X2 = computeOdds(m);
  const pHome = odds1X2.home ? 1 / odds1X2.home : 0;
  const pDraw = odds1X2.draw ? 1 / odds1X2.draw : 0;
  const pAway = odds1X2.away ? 1 / odds1X2.away : 0;

  let pEven = 0;
  for (let h = 0; h <= 10; h++) {
    for (let a = 0; a <= 10; a++) {
      const tot = m.scoreHome + h + m.scoreAway + a;
      if (tot % 2 === 0) pEven += poisson(h, lambdaHome) * poisson(a, lambdaAway);
    }
  }

  function teamOverProb(attack, line, currentScore) {
    const remLambda = attack * (remaining / m.maxMinute);
    const needed = Math.floor(line) - currentScore;
    if (needed < 0) return 1;
    if (needed >= 10) return 0;
    let p = 0;
    for (let g = needed + 1; g <= 10; g++) p += poisson(g, remLambda);
    return p;
  }

  const lines = isFootball
    ? [0.5, 1.5, 2.5, 3.5, 4.5, 5.5]
    : [3.5, 4.5, 5.5, 6.5, 7.5, 8.5];

  const raw = {};

  // Двойной шанс
  if (odds1X2.home && odds1X2.draw) raw['1X'] = toOdds(pHome + pDraw, 0.04);
  if (odds1X2.home && odds1X2.away) raw['12'] = toOdds(pHome + pAway, 0.04);
  if (odds1X2.draw && odds1X2.away) raw['X2'] = toOdds(pDraw + pAway, 0.04);

  // Тоталы — всегда
  lines.forEach(line => {
    raw[`ТБ ${line}`] = toOdds(overProb(line), 0.06);
    raw[`ТМ ${line}`] = toOdds(underProb(line), 0.06);
  });

  // Фор — всегда
  raw['Ф1 −1.5'] = toOdds(handicapProb(-1.5), 0.06);
  raw['Ф2 −1.5'] = toOdds(1 - handicapProb(1.5), 0.06);
  raw['Ф1 +1.5'] = toOdds(1 - handicapProb(-1.5), 0.06);
  raw['Ф2 +1.5'] = toOdds(handicapProb(1.5), 0.06);

  // Обе забьют — всегда
  raw['Обе · Да'] = toOdds(pBtts, 0.06);
  raw['Обе · Нет'] = toOdds(1 - pBtts, 0.06);

  // Чёт/Нечет
  raw['Чёт'] = toOdds(pEven, 0.06);
  raw['Нечет'] = toOdds(1 - pEven, 0.06);

  // Голы команд
  const teamLine = isFootball ? 0.5 : 1.5;
  const homeOver = teamOverProb(m.homeAttack, teamLine, m.scoreHome);
  const awayOver = teamOverProb(m.awayAttack, teamLine, m.scoreAway);
  raw[`${m.home} Б ${teamLine}`] = toOdds(homeOver, 0.06);
  raw[`${m.home} М ${teamLine}`] = toOdds(1 - homeOver, 0.06);
  raw[`${m.away} Б ${teamLine}`] = toOdds(awayOver, 0.06);
  raw[`${m.away} М ${teamLine}`] = toOdds(1 - awayOver, 0.06);

  // Точный счёт — только футбол, до 85'
  if (isFootball && m.minute < 85) {
    const scores = ['0:0','1:0','0:1','1:1','2:0','0:2','2:1','1:2','2:2','3:0','0:3','3:1','1:3','3:2','2:3'];
    scores.forEach(sc => {
      const [h, a] = sc.split(':').map(Number);
      const dh = Math.max(0, h - m.scoreHome);
      const da = Math.max(0, a - m.scoreAway);
      const p = poisson(dh, lambdaHome) * poisson(da, lambdaAway);
      raw[`Счёт ${sc}`] = toOdds(p, 0.08);
    });
  }

  return raw;
}

// ============================================================

function tickMatch(m) {
  m.minute += 1;
  m.momentum *= 0.95;

  if (m.sport === 'ufc') {
    if (m.minute % 5 === 0) m.round = Math.min(5, m.round + 1);
    if (Math.random() < 0.15) {
      const homeHits = Math.random() < 0.5;
      if (homeHits) {
        m.momentum = Math.min(1, m.momentum + 0.3);
        m.scoreHome += 1;
      } else {
        m.momentum = Math.max(-1, m.momentum - 0.3);
        m.scoreAway += 1;
      }
    }
    if (m.minute >= m.maxMinute) m.status = 'finished';
    return;
  }

  if (m.minute >= m.maxMinute) {
    m.status = 'finished';
    return;
  }

  const goalChance = m.sport === 'football' ? 0.035 : 0.05;
  const adjusted = goalChance + Math.abs(m.momentum) * 0.02;

  if (Math.random() < adjusted) {
    const homeScores = Math.random() < (0.55 + m.momentum * 0.1);
    const scorer = homeScores ? m.home : m.away;
    const scoreStr = homeScores
      ? `${m.scoreHome + 1}:${m.scoreAway}`
      : `${m.scoreHome}:${m.scoreAway + 1}`;

    if (homeScores) {
      m.scoreHome += 1;
      m.momentum = Math.min(1, m.momentum + 0.3);
    } else {
      m.scoreAway += 1;
      m.momentum = Math.max(-1, m.momentum - 0.3);
    }

    addLiveDrop(m, scorer, scoreStr);
  }
}

function addLiveDrop(m, scorer, score) {
  liveDrops.unshift({
    match: `${m.home} — ${m.away}`,
    event: `${sportIcon(m.sport)} ${scorer} · ${score}`,
    id: Date.now() + Math.random(),
  });
  if (liveDrops.length > 15) liveDrops.pop();
}

function renderBalance() {
  $('balance').textContent = formatMoney(wallet.balance);
  renderSession();
}

function renderSession() {
  const profit = wallet.balance - wallet.dailyLimit;
  const won = wallet.bets.filter(b => b.status === 'won').length;
  const lost = wallet.bets.filter(b => b.status === 'lost').length;
  const total = won + lost;
  const winrate = total ? ((won / total) * 100).toFixed(0) + '%' : '—';

  const profitEl = $('sessionProfit');
  profitEl.textContent = (profit >= 0 ? '+' : '') + formatMoney(profit) + ' ₽';
  profitEl.className = 'value ' + (profit >= 0 ? 'green' : 'red');

  $('sessionBets').textContent = wallet.bets.length;
  $('sessionWinrate').textContent = winrate;
}

function renderMatches() {
  let filtered = currentFilter === 'all'
    ? matches
    : matches.filter(m => m.sport === currentFilter);

  if (liveOnly) filtered = filtered.filter(m => m.status === 'live');

  filtered = [...filtered].sort((a, b) => {
    if (a.status === 'live' && b.status !== 'live') return -1;
    if (a.status !== 'live' && b.status === 'live') return 1;
    return a.minute - b.minute;
  });

  const el = $('matches');
  if (!filtered.length) {
    el.innerHTML = `<div class="empty"><div class="icon">🎯</div>Матчей нет</div>`;
    return;
  }

  el.innerHTML = filtered.map(m => {
    const odds = computeOdds(m);
    const isFinished = m.status === 'finished';
    const extras = !isFinished ? computeExtraMarkets(m) : {};
    const extrasKeys = Object.keys(extras);
    const isOpen = openExtras.has(m.id);
    const momentumWidth = Math.abs(m.momentum) * 50;

    const extrasHtml = extrasKeys.length ? `
      <div class="extras">
        <button class="extras-toggle ${isOpen ? 'open' : ''}" onclick="toggleExtras(${m.id})">
          ${isOpen ? '▲' : '▼'} Ещё ${extrasKeys.length} рынков
        </button>
        <div class="extras-grid ${isOpen ? 'open' : ''}">
          ${extrasKeys.map(label => {
            const odd = extras[label];
            const valid = isOddValid(odd);
            return `
              <button class="odds-mini ${valid ? '' : 'disabled'}"
                      ${valid ? `onclick="openBetModal(${m.id}, ${JSON.stringify(label)}, ${odd})"` : 'disabled'}>
                <span class="odds-mini-label">${label}</span>
                <span class="odds-mini-value">${valid ? odd.toFixed(2) : '—'}</span>
              </button>
            `;
          }).join('')}
        </div>
      </div>
    ` : '';

    return `
      <div class="match ${isFinished ? 'finished' : ''}">
        <div class="match-info">
          <div class="match-top">
            <span class="sport-icon">${sportIcon(m.sport)}</span>
            <span class="match-league">${m.league}</span>
            ${isFinished ? '<span class="badge finished">Завершён</span>' : '<span class="badge live">LIVE</span>'}
          </div>
          <div class="teams">
            <span>${m.home}</span>
            <span class="score">${m.scoreHome}:${m.scoreAway}</span>
            <span>${m.away}</span>
            ${!isFinished ? `<span class="minute">${m.minute}'${m.sport === 'ufc' ? ` · R${m.round}` : ''}</span>` : ''}
          </div>
          ${m.sport !== 'ufc' ? `
            <div class="momentum-bar">
              <div class="momentum-fill" style="width:${momentumWidth}%; margin-left:${m.momentum > 0 ? '50%' : (50 - momentumWidth) + '%'}"></div>
            </div>
          ` : ''}
        </div>
        <div class="odds">
          ${renderOddsBtn(m, 'home', '1', odds.home, isFinished)}
          ${m.sport !== 'hockey' && m.sport !== 'ufc' ? renderOddsBtn(m, 'draw', 'X', odds.draw, isFinished) : ''}
          ${renderOddsBtn(m, 'away', '2', odds.away, isFinished)}
        </div>
        ${extrasHtml}
      </div>
    `;
  }).join('');
}

    <div class="stat"><div class="stat-label">Винрейт</div><div class="stat-value">${winrate}%</div></div>

function openBetModal(matchId, pickKey, odd) {
  if (!isOddValid(odd)) return showToast('❌ Рынок закрыт', 'error');

  const m = matches.find(x => x.id === matchId);
  if (!m || m.status === 'finished') return showToast('❌ Матч завершён', 'error');

  activeBet = { matchId, pick: pickKey, odd };

  const pickLabel = pickKey === 'home' ? m.home
    : pickKey === 'away' ? m.away
    : pickKey === 'draw' ? 'Ничья'
    : pickKey;

  $('betModalTitle').textContent = `${m.home} — ${m.away}`;
  $('betModalSub').textContent = `${pickLabel} · ${m.scoreHome}:${m.scoreAway} · ${m.minute}'`;
  $('betModalOdd').textContent = odd.toFixed(2);
  $('betModalStake').value = '';
  $('betModalPotential').textContent = '—';
  $('betModalCoupon').style.display = 'block';
  $('betModal').classList.add('active');
  updatePotential();
}

function closeBetModal() {
  $('betModal').classList.remove('active');
  activeBet = null;
}

function updatePotential() {
  if (!activeBet) return;
  const stake = parseFloat($('betModalStake').value) || 0;
  const potential = stake * activeBet.odd;
  $('betModalPotential').textContent = potential > 0 ? `${formatMoney(potential)} ₽` : '—';
}

function placeBet() {
  if (!activeBet) return;
  const stake = parseFloat($('betModalStake').value);

  if (!stake || stake < 10) return showToast('❌ Минимум 10 ₽', 'error');
  if (stake > wallet.balance) return showToast('❌ Недостаточно средств', 'error');

  if (activeBet.isExpress) {
    const selections = activeBet.selections.map(s => ({
      matchId: s.matchId, pick: s.pick, odd: s.odd,
      label: s.label, match: s.match, status: 'pending',
    }));

    wallet.balance -= stake;
    wallet.totalBet += stake;

    wallet.bets.unshift({
      id: Date.now(), type: 'express',
      match: `Экспресс · ${selections.length}`,
      selections,
      odd: activeBet.odd, stake,
      potential: Math.round(stake * activeBet.odd * 100) / 100,
      status: 'pending',
      createdAt: new Date().toISOString(),
    });

    expressCoupon = [];
    saveCoupon();
    renderCoupon();
    saveWallet();
    renderBalance();
    renderHistory();
    renderStats();
    soundBet();
    showToast(`✅ Экспресс принят @ ${activeBet.odd.toFixed(2)}`, 'success');
    closeBetModal();
    return;
  }

  const m = matches.find(x => x.id === activeBet.matchId);
  if (!m || m.status === 'finished') return showToast('❌ Матч закрыт', 'error');

  wallet.balance -= stake;
  wallet.totalBet += stake;

  wallet.bets.unshift({
    id: Date.now(), type: 'single',
    matchId: m.id,
    match: `${m.home} — ${m.away}`,
    sport: m.sport,
    pick: activeBet.pick,
    odd: activeBet.odd,
    stake,
    potential: Math.round(stake * activeBet.odd * 100) / 100,
    status: 'pending',
    minute: m.minute,
    score: `${m.scoreHome}:${m.scoreAway}`,
    createdAt: new Date().toISOString(),
  });

  saveWallet();
  renderBalance();
  renderHistory();
  renderStats();
  soundBet();
  showToast(`✅ Ставка ${formatMoney(stake)} ₽ @ ${activeBet.odd.toFixed(2)}`, 'success');
  closeBetModal();
}

function addToCoupon(matchId, pickKey, odd, label) {
  if (!isOddValid(odd)) return showToast('❌ Рынок закрыт', 'error');
  if (expressCoupon.find(c => c.matchId === matchId && c.pick === pickKey)) {
    return showToast('Уже в купоне', 'error');
  }
  if (expressCoupon.find(c => c.matchId === matchId)) {
    return showToast('На этот матч уже есть ставка', 'error');
  }

  const m = matches.find(x => x.id === matchId);
  if (!m) return;

  expressCoupon.push({
    matchId, pick: pickKey, odd, label,
    match: `${m.home} — ${m.away}`,
  });

  saveCoupon();
  renderCoupon();
  showToast(`➕ Добавлено (${expressCoupon.length})`, 'success');
}

function removeFromCoupon(index) {
  expressCoupon.splice(index, 1);
  saveCoupon();
  renderCoupon();
}

function clearCoupon() {
  expressCoupon = [];
  saveCoupon();
  renderCoupon();
}

function renderCoupon() {
  const el = $('couponBar');

  if (expressCoupon.length === 0) {
    el.classList.remove('active');
    document.body.classList.remove('has-coupon');
    return;
  }

  el.classList.add('active');
  document.body.classList.add('has-coupon');

  const totalOdd = expressCoupon.reduce((acc, c) => acc * c.odd, 1);

  el.innerHTML = `
    <div class="coupon-inner">
      <div class="coupon-items">
        ${expressCoupon.map((c, i) => `
          <div class="coupon-item">
            <div class="coupon-item-info">
              <div class="coupon-item-match">${c.match}</div>
              <div class="coupon-item-pick">${c.label} @ ${c.odd.toFixed(2)}</div>
            </div>
            <button class="coupon-item-remove" onclick="removeFromCoupon(${i})">×</button>
          </div>
        `).join('')}
      </div>
      <div class="coupon-actions">
        <button class="coupon-clear" onclick="clearCoupon()">Очистить</button>
        <button class="coupon-place" onclick="openExpressModal()">
          Экспресс · ${expressCoupon.length} · @ ${totalOdd.toFixed(2)}
        </button>
      </div>
    </div>
  `;
}

function openExpressModal() {
  if (expressCoupon.length < 2) return showToast('Минимум 2 события', 'error');
  const totalOdd = expressCoupon.reduce((acc, c) => acc * c.odd, 1);

  activeBet = { isExpress: true, odd: totalOdd, selections: [...expressCoupon] };

  $('betModalTitle').textContent = `Экспресс · ${expressCoupon.length} событий`;
  $('betModalSub').textContent = expressCoupon.map(c => `${c.label} @ ${c.odd.toFixed(2)}`).join(' + ');
  $('betModalOdd').textContent = totalOdd.toFixed(2);
  $('betModalStake').value = '';
  $('betModalPotential').textContent = '—';
  $('betModalCoupon').style.display = 'none';
  $('betModal').classList.add('active');
  updatePotential();
}

// РАСЧЁТ СТАВОК
// ============================================================

function checkSelection(m, pick) {
  if (m.status !== 'finished') return 'pending';

  if (pick === 'home' || pick === 'away' || pick === 'draw') {
    if (m.sport === 'hockey' || m.sport === 'ufc') {
      if (m.scoreHome > m.scoreAway) return pick === 'home' ? 'won' : 'lost';
      if (m.scoreHome < m.scoreAway) return pick === 'away' ? 'won' : 'lost';
      return 'lost';
    }
    if (m.scoreHome > m.scoreAway) return pick === 'home' ? 'won' : 'lost';
    if (m.scoreHome < m.scoreAway) return pick === 'away' ? 'won' : 'lost';
    return pick === 'draw' ? 'won' : 'lost';
  }

  if (pick === '1X') return (m.scoreHome >= m.scoreAway) ? 'won' : 'lost';
  if (pick === '12') return (m.scoreHome !== m.scoreAway) ? 'won' : 'lost';
  if (pick === 'X2') return (m.scoreHome <= m.scoreAway) ? 'won' : 'lost';

  const totalGoals = m.scoreHome + m.scoreAway;
  const tOver = pick.match(/^ТБ (\d+\.?\d*)$/);
  const tUnder = pick.match(/^ТМ (\d+\.?\d*)$/);
  if (tOver) return totalGoals > parseFloat(tOver[1]) ? 'won' : 'lost';
  if (tUnder) return totalGoals < parseFloat(tUnder[1]) ? 'won' : 'lost';

  const f1 = pick.match(/^Ф1 ([−\-+]?\d+\.?\d*)$/);
  const f2 = pick.match(/^Ф2 ([−\-+]?\d+\.?\d*)$/);
  if (f1) return (m.scoreHome - m.scoreAway) > parseFloat(f1[1].replace('−', '-')) ? 'won' : 'lost';
  if (f2) return (m.scoreAway - m.scoreHome) > parseFloat(f2[1].replace('−', '-')) ? 'won' : 'lost';

  if (pick === 'Обе · Да') return (m.scoreHome >= 1 && m.scoreAway >= 1) ? 'won' : 'lost';
  if (pick === 'Обе · Нет') return !(m.scoreHome >= 1 && m.scoreAway >= 1) ? 'won' : 'lost';

  if (pick === 'Чёт') return totalGoals % 2 === 0 ? 'won' : 'lost';
  if (pick === 'Нечет') return totalGoals % 2 !== 0 ? 'won' : 'lost';

  const ht = pick.match(new RegExp(`^${escapeRegex(m.home)} (Б|М) (\\d+\\.?\\d*)$`));
  const at = pick.match(new RegExp(`^${escapeRegex(m.away)} (Б|М) (\\d+\\.?\\d*)$`));
  if (ht) {
    const line = parseFloat(ht[2]);
    if (ht[1] === 'Б') return m.scoreHome > line ? 'won' : 'lost';
    return m.scoreHome < line ? 'won' : 'lost';
  }
  if (at) {
    const line = parseFloat(at[2]);
    if (at[1] === 'Б') return m.scoreAway > line ? 'won' : 'lost';
    return m.scoreAway < line ? 'won' : 'lost';
  }

  const cs = pick.match(/^Счёт (\d+):(\d+)$/);
  if (cs) {
    return (m.scoreHome === parseInt(cs[1]) && m.scoreAway === parseInt(cs[2])) ? 'won' : 'lost';
  }

  if (pick === 'Метод · KO/TKO' || pick === 'Метод · Сабмишн' || pick === 'Метод · Решение') {
    return Math.random() < 0.35 ? 'won' : 'lost';
  }
  if (pick === 'Бой досрочно') return Math.random() < 0.6 ? 'won' : 'lost';
  if (pick === 'Пройти всю дистанцию') return Math.random() < 0.4 ? 'won' : 'lost';

  const ufcRound = pick.match(/^Тотал (Б|М) (\d+)\.5 раундов$/);
  if (ufcRound) {
    const line = parseInt(ufcRound[2]);
    const totalRounds = m.round;
    if (ufcRound[1] === 'Б') return totalRounds > line ? 'won' : 'lost';
    return totalRounds < line ? 'won' : 'lost';
  }

  if (pick.startsWith('Финиш в R')) return Math.random() < 0.3 ? 'won' : 'lost';
  if (pick.includes(' KO/TKO') || pick.includes(' Сабмишн') || pick.includes(' Решение')) {
    return Math.random() < 0.3 ? 'won' : 'lost';
  }
  if (pick.includes(' в R1')) return Math.random() < 0.2 ? 'won' : 'lost';

  return Math.random() < 0.5 ? 'won' : 'lost';
}

function escapeRegex(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function settleBets() {
  let changed = false;

  wallet.bets.forEach(b => {
    if (b.status !== 'pending') return;

    if (b.type === 'express') {
      let allFinished = true;
      let allWon = true;

      for (const sel of b.selections) {
        if (sel.status !== 'pending') {
          if (sel.status !== 'won') allWon = false;
          continue;
        }
        const m = matches.find(x => x.id === sel.matchId);
        if (!m || m.status !== 'finished') { allFinished = false; break; }

        const result = checkSelection(m, sel.pick);
        sel.status = result;
        if (result !== 'won') allWon = false;
      }

      if (allFinished && b.selections.every(s => s.status !== 'pending')) {
        if (allWon) {
          b.status = 'won';
          b.payout = Math.round(b.stake * b.odd * 100) / 100;
          wallet.balance += b.payout;
          wallet.totalWon += b.payout;
          soundWin();
          showToast(`🎉 Экспресс! +${formatMoney(b.payout)} ₽`, 'success');
        } else {
          b.status = 'lost';
          soundLose();
        }
        changed = true;
      }
      return;
    }

    const m = matches.find(x => x.id === b.matchId);
    if (!m || m.status !== 'finished') return;

    const result = checkSelection(m, b.pick);

    if (result === 'won') {
      b.status = 'won';
      b.payout = Math.round(b.stake * b.odd * 100) / 100;
      wallet.balance += b.payout;
      wallet.totalWon += b.payout;
      soundWin();
      showToast(`🎉 Выигрыш! +${formatMoney(b.payout)} ₽`, 'success');
    } else {
      b.status = 'lost';
      soundLose();
    }
    changed = true;
  });

  if (changed) {
    saveWallet();
    renderBalance();
    renderHistory();
    renderStats();
  }
}

// ============================================================
// ГЛАВНЫЙ ЦИКЛ
// ============================================================

function tick() {
  resetWalletIfNewDay();

  matches.forEach(m => { if (m.status === 'live') tickMatch(m); });

  matches = matches.map(m => {
    if (m.status === 'finished') {
      if (!m.finishedAt) m.finishedAt = Date.now();
      if (Date.now() - m.finishedAt > 8000) return createRandomMatch();
    }
    return m;
  });

  settleBets();
  renderMatches();
  renderLiveDrops();
}

document.querySelectorAll('.quick-stake').forEach(btn => {
  btn.onclick = () => {
    const v = btn.dataset.stake;
    $('betModalStake').value = v === 'all' ? Math.floor(wallet.balance) : v;
    updatePotential();
  };
});

$('betModalConfirm').onclick = placeBet;
$('betModalCoupon').onclick = () => {
  if (!activeBet) return;
  addToCoupon(activeBet.matchId, activeBet.pick, activeBet.odd,
    activeBet.pick === 'home' ? '1' : activeBet.pick === 'draw' ? 'X' : activeBet.pick === 'away' ? '2' : activeBet.pick);
  closeBetModal();
};
$('betModal').onclick = (e) => { if (e.target.id === 'betModal') closeBetModal(); };

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeBetModal();
});

$('soundBtn').onclick = () => {
  soundOn = !soundOn;
  saveSoundPref();
  $('soundBtn').textContent = soundOn ? '🔊' : '🔇';
  $('soundBtn').classList.toggle('muted', !soundOn);
  if (soundOn) beep(880, 0.1);
};

$('resetBtn').onclick = () => {
  if (!confirm('Сбросить баланс до 20 000 ₽ и очистить историю?')) return;
  wallet = {
    balance: 20000, dailyLimit: 20000,
    lastReset: todayKey(),
    bets: [], totalBet: 0, totalWon: 0,
  };
  expressCoupon = [];
  saveWallet();
  saveCoupon();
  renderBalance();
  renderHistory();
  renderStats();
  renderCoupon();
  showToast('♻️ Сброшено', 'success');
};

// ============================================================
// СТАРТ
// ============================================================

loadWallet();
loadCoupon();
loadSoundPref();

const savedMatches = loadMatches();
matches = savedMatches || createMatches(15);

$('soundBtn').textContent = soundOn ? '🔊' : '🔇';
$('soundBtn').classList.toggle('muted', !soundOn);

renderBalance();
renderMatches();
renderHistory();
renderStats();
renderCoupon();

setInterval(tick, 1000);
setInterval(saveMatches, 2000);

console.log('%c⚡ OpenBet Simulator v4.0', 'font-size: 20px; font-weight: bold; color: #7b5cff;');
console.log('%cРынки НЕ закрываются сами — только по клику на стрелку', 'color: #00d4ff;');
