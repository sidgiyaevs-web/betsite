  body.innerHTML = html;

  $$('[data-profile-action]').forEach(item => {
    item.addEventListener('click', () => {
      const action = item.dataset.profileAction;
      if (action === 'logout') {
        if (confirm('Выйти из аккаунта?')) logoutUser();
      } else if (action === 'history') {
        setTab('history');
      } else if (action === 'deposit') {
        App.user.balance += 10000;
        updateUser(App.user);
        toast('+10 000 ₽ зачислено (демо)', 'success');
        renderProfile();
      } else {
        toast('Раздел в разработке', 'info');
      }
    });
  });
}

/* ------------------------------------------------------------
   УНИВЕРСАЛЬНЫЙ ОБРАБОТЧИК КЛИКОВ ПО MAIN-BODY
   ------------------------------------------------------------ */
function bindMainBodyEvents() {
  // Кнопки котировок
  $$('[data-add-odd]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const match = getMatchById(btn.dataset.matchId);
      if (!match) return;
      addToCoupon(
        match,
        btn.dataset.marketName,
        btn.dataset.marketKey,
        btn.dataset.oddLabel,
        parseFloat(btn.dataset.oddValue)
      );
    });
  });

  // Открытие матча
  $$('[data-match-open]').forEach(row => {
    row.addEventListener('click', e => {
      if (e.target.closest('[data-add-odd]')) return;
      if (e.target.closest('[data-video-match]')) return;
      const id = row.dataset.matchOpen;
      const match = getMatchById(id);
      if (!match) return;
      App.currentMatchId = id;
      App.currentMatchTab = 'all';
      if (match.sport === 'ufc') {
        showScreen('ufc');
        renderUFC();
      } else {
        showScreen('match');
        renderMatch();
      }
    });
  });

  // Видео-иконка
  $$('[data-video-match]').forEach(ico => {
    ico.addEventListener('click', e => {
      e.stopPropagation();
      openVideoModal(ico.dataset.videoMatch);
    });
  });

  // Видео-чипы
  $$('[data-video-id]').forEach(chip => {
    chip.addEventListener('click', e => {
      e.stopPropagation();
      openVideoModal(chip.dataset.matchId, chip.dataset.videoId);
    });
  });

  // Переключение видов спорта
  $$('[data-sport-go]').forEach(chip => {
    chip.addEventListener('click', () => {
      App.currentSport = chip.dataset.sportGo;
      if (App.currentTab !== 'sport') setTab('sport');
      else renderSport();
    });
  });

  // Кнопка "Начать"
  $$('[data-tab-go]').forEach(b => {
    b.addEventListener('click', () => setTab(b.dataset.tabGo));
  });
}

/* ------------------------------------------------------------
   ОТКРЫТИЕ ВИДЕО-МОДАЛКИ
   ------------------------------------------------------------ */
function openVideoModal(matchId, videoId) {
  const match = getMatchById(matchId);
  if (!match) return;
  const moments = match.videoMoments || [];
  const vm = videoId ? moments.find(v => v.id === videoId) : moments[moments.length - 1];
  if (!vm) return;

  const body = $('#modal-video-body');
  body.innerHTML = `
    <div class="video-placeholder">
      <div class="vp-ico">${vm.icon}</div>
      <div class="vp-text">Видео-повтор момента</div>
    </div>
    <div class="video-desc">
      <b>${vm.label}</b><br>
      ${vm.teamName || ''}<br>
      ${vm.score ? 'Счёт: ' + vm.score : ''}<br>
      ${vm.minute ? 'Минута: ' + vm.minute : ''}
    </div>
  `;
  openModal('modal-video');
}

/* ------------------------------------------------------------
   РАСЧЁТ СТАВОК ПРИ ЗАВЕРШЕНИИ МАТЧА
   ------------------------------------------------------------ */
function settleBetsForMatch(match) {
  let changed = false;
  App.bets.forEach(bet => {
    if (bet.status !== 'pending') return;
    // Проверяем, все ли матчи в ставке завершены
    const allFinished = bet.items.every(it => {
      const m = getMatchById(it.matchId);
      return m && m.finished;
    });
    if (!allFinished) return;

    // Проверяем каждый исход
    let allWin = true;
    bet.items.forEach(it => {
      const m = getMatchById(it.matchId);
      const result = evaluateOutcome(m, it);
      it.result = result;
      if (!result) allWin = false;
    });

    if (allWin) {
      bet.status = 'win';
      bet.payout = bet.stake * bet.totalOdd;
      App.user.balance += bet.payout;
      App.user.wins++;
      App.user.profit += (bet.payout - bet.stake);
      toast(`Ставка выиграла! +${fmtMoney(bet.payout)} ₽`, 'success', 4000);
    } else {
      bet.status = 'lose';
      bet.payout = 0;
      App.user.losses++;
      App.user.profit -= bet.stake;
    }
    App.user.totalBets++;
    changed = true;
  });

  if (changed) {
    updateUser(App.user);
    saveJSON(STORAGE_KEYS.BETS, App.bets);
  }
}

function evaluateOutcome(match, item) {
  const label = item.oddLabel;
  const key = item.marketKey;
  const scoreA = match.scoreA || 0;
  const scoreB = match.scoreB || 0;
  const total = scoreA + scoreB;
  const diff = scoreA - scoreB;

  // 1X2
  if (key === '1x2') {
    if (label === 'П1') return diff > 0;
    if (label === 'Х') return diff === 0;
    if (label === 'П2') return diff < 0;
  }
  // Двойной шанс
  if (key === 'dc') {
    if (label === '1X') return diff >= 0;
    if (label === '12') return diff !== 0;
    if (label === 'X2') return diff <= 0;
  }
  // Тоталы
  if (key.startsWith('total_')) {
    const line = parseFloat(key.replace('total_', ''));
    if (label === 'ТБ') return total > line;
    if (label === 'ТМ') return total < line;
  }
  // Обе забьют
  if (key === 'btts') {
    if (label === 'Да') return scoreA > 0 && scoreB > 0;
    if (label === 'Нет') return !(scoreA > 0 && scoreB > 0);
  }
  // Форы
  if (key.startsWith('handicap_')) {
    const line = parseFloat(key.replace('handicap_', ''));
    if (label === '1') return diff + line > 0;
    if (label === '2') return diff + line < 0;
  }
  // Если не смогли распознать — считаем проигрышем (для безопасности)
  return false;
}

/* ------------------------------------------------------------
   РАЗМЕЩЕНИЕ СТАВКИ
   ------------------------------------------------------------ */
function placeBet() {
  if (!App.user) { toast('Войдите в аккаунт', 'error'); return; }
  if (App.coupon.length === 0) { toast('Купон пуст', 'error'); return; }
  if (App.stake < MIN_STAKE) { toast('Минимальная ставка ' + MIN_STAKE + ' ₽', 'error'); return; }
  if (App.stake > App.user.balance) { toast('Недостаточно средств', 'error'); return; }
  if (App.couponType === 'express' && App.coupon.length < 2) {
    toast('Для экспресса нужно 2+ события', 'error');
    return;
  }

  // Проверка: нет ли событий из одного матча (для экспресса)
  if (App.couponType === 'express') {
    const matchIds = App.coupon.map(c => c.matchId);
    if (new Set(matchIds).size !== matchIds.length) {
      toast('Экспресс не может содержать события из одного матча', 'error');
      return;
    }
  }

  const totalOdd = calcCouponOdd();
  const bet = {
    id: uid(),
    type: App.couponType,
    items: App.coupon.slice(),
    stake: App.stake,
    totalOdd,
    potentialPayout: App.stake * totalOdd,
    status: 'pending',
    createdAt: Date.now(),
    teams: App.coupon.map(c => c.teams).join(' + ')
  };

  App.bets.push(bet);
  saveJSON(STORAGE_KEYS.BETS, App.bets);

  // Списываем ставку
  App.user.balance -= App.stake;
  updateUser(App.user);

  // Очищаем купон
  App.coupon = [];
  saveJSON(STORAGE_KEYS.COUPON, App.coupon);
  updateCouponBadges();
  closeCoupon();

  toast(`Ставка ${fmtMoney(App.stake)} ₽ принята! Кэф: ${fmtOdd(totalOdd)}`, 'success', 3500);

  // Мгновенная проверка (если матчи уже завершены)
  App.bets.forEach(b => {
    if (b.id === bet.id && b.status === 'pending') {
      const allFinished = b.items.every(it => {
        const m = getMatchById(it.matchId);
        return m && m.finished;
      });
      if (allFinished) settleBetsForMatch(getMatchById(b.items[0].matchId));
    }
  });
}

/* ------------------------------------------------------------
   РЕНДЕР ТЕКУЩЕГО ЭКРАНА
   ------------------------------------------------------------ */
function renderCurrentScreen() {
  if (App.currentScreen === 'main') {
    if (App.currentTab === 'top') renderTop();
    else if (App.currentTab === 'sport') renderSport();
    else if (App.currentTab === 'history') renderHistory();
    else if (App.currentTab === 'profile') renderProfile();
  } else if (App.currentScreen === 'match') {
    renderMatch();
  } else if (App.currentScreen === 'ufc') {
    renderUFC();
  }
}

/* ------------------------------------------------------------
   АВТООБНОВЛЕНИЕ LIVE-МАТЧЕЙ (раз в 3 сек)
   ------------------------------------------------------------ */
setInterval(() => {
  if (App.currentScreen === 'main' && App.currentTab === 'top') {
    // Обновляем только счёт в существующих строках без полного ререндера
    App.matches.forEach(m => {
      if (m.status === 'live' && m.isLive) {
        const rows = document.querySelectorAll(`[data-match-open="${m.id}"] .team-score`);
        if (rows.length === 2) {
          if (rows[0].textContent != m.scoreA) {
            rows[0].textContent = m.scoreA;
            rows[0].classList.add('flash-green');
            setTimeout(() => rows[0].classList.remove('flash-green'), 1200);
          }
          if (rows[1].textContent != m.scoreB) {
            rows[1].textContent = m.scoreB;
            rows[1].classList.add('flash-green');
            setTimeout(() => rows[1].classList.remove('flash-green'), 1200);
          }
        }
      }
    });
  }
}, 3000);

/* ------------------------------------------------------------
   СОХРАНЕНИЕ СЕССИИ ПРИ ЗАКРЫТИИ
   ------------------------------------------------------------ */
window.addEventListener('beforeunload', () => {
  if (App.matches.length > 0) saveJSON(STORAGE_KEYS.MATCHES, App.matches);
  if (App.bets.length > 0) saveJSON(STORAGE_KEYS.BETS, App.bets);
  if (App.coupon.length > 0) saveJSON(STORAGE_KEYS.COUPON, App.coupon);
  if (App.user) updateUser(App.user);
});
/* ============================================================
   ЗАПУСК ПРИЛОЖЕНИЯ (должен быть ПОСЛЕДНИМ в скрипте)
   ============================================================ */
window.addEventListener('DOMContentLoaded', () => {
  initAuth();
  const user = getCurrentUser();
  if (user) {
    App.user = user;
    App.coupon = loadJSON(STORAGE_KEYS.COUPON, []);
    App.bets = loadJSON(STORAGE_KEYS.BETS, []);
    App.favorites = loadJSON('openbet_favorites', []);
    startApp();
  } else {
    showScreen('auth');
  }
});
