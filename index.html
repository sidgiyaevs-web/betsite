
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0f1e35">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SportLive">
<title>SportLive — Линия</title>
<style>
/* ============ ПЕРЕМЕННЫЕ ============ */
:root{
  --bg:#0f1e35;--bg2:#0b172a;--bg3:#081120;
  --card:#1a2c45;--card2:#22395c;--card3:#2c4668;
  --bd:#2a3f5e;--bd2:#3d5675;
  --t:#f0f4f9;--t2:#a9b8ce;--t3:#6e7e96;
  --yellow:#ffd94a;--yellow2:#ffe680;
  --green:#4caf50;--green2:#66d96a;
  --red:#e8453c;--red2:#f56860;
  --live:#ff3b30;--blue:#4a90e2;
  --odd:#2a3f5e;--odd-h:#3d5675;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro","Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);color:var(--t);
  min-height:100vh;font-size:14px;line-height:1.4;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;padding-bottom:90px
}
body.lock{overflow:hidden}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:5px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,select{font-family:inherit}
img,svg{display:block;max-width:100%}

@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes slideDown{from{transform:translateY(-10px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes evIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
@keyframes flashUp{0%,50%{color:var(--green2)}100%{color:var(--t)}}
@keyframes flashDn{0%,50%{color:var(--red2)}100%{color:var(--t)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes ripple{to{transform:scale(4);opacity:0}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes spin{to{transform:rotate(360deg)}}

.ripple{
  position:absolute;border-radius:50%;
  background:rgba(255,255,255,.4);
  transform:scale(0);pointer-events:none;
  animation:ripple .6s linear
}

/* ============ HEADER ============ */
.hdr{
  position:sticky;top:0;z-index:100;
  background:linear-gradient(180deg,#0e1d32 0%,#0f1e35 100%);
  border-bottom:1px solid var(--bd)
}
.hdr-top{display:flex;align-items:center;gap:10px;padding:10px 14px}
.logo{
  display:flex;align-items:center;gap:7px;
  font-size:17px;font-weight:900;letter-spacing:.6px;
  color:var(--yellow);flex-shrink:0;user-select:none
}
.logo::before{
  content:"⚡";font-size:18px;
  filter:drop-shadow(0 0 6px var(--yellow))
}
.logo span{color:var(--t);font-weight:700}
.hdr-actions{display:flex;gap:6px;align-items:center;flex-shrink:0;margin-left:auto}
.hbtn{
  width:34px;height:34px;border-radius:8px;
  background:var(--card);border:1px solid var(--bd);
  color:var(--t2);font-size:15px;
  display:flex;align-items:center;justify-content:center;
  transition:all .18s;position:relative;overflow:hidden
}
.hbtn:hover{color:var(--yellow);border-color:var(--yellow)}
.balance{
  display:flex;align-items:center;gap:5px;
  background:var(--card2);border:1px solid var(--bd);
  padding:7px 11px;border-radius:8px;
  font-size:12.5px;font-weight:700;cursor:pointer;
  white-space:nowrap;transition:all .18s
}
.balance:hover{border-color:var(--yellow)}
.balance::before{content:"₽";color:var(--t3);font-weight:900;font-size:11px}
.balance b{color:var(--yellow);font-weight:900}

/* ============ SPORTS ROW ============ */
.sports-row{
  display:flex;gap:6px;padding:0 14px 8px;
  overflow-x:auto;scrollbar-width:none
}
.sports-row::-webkit-scrollbar{display:none}
.sport-btn{
  flex-shrink:0;padding:6px 12px;border-radius:7px;
  background:var(--card);border:1px solid var(--bd);
  font-size:12px;font-weight:600;
  color:var(--t2);transition:all .18s;
  white-space:nowrap;position:relative;overflow:hidden
}
.sport-btn:hover{color:var(--t)}
.sport-btn.on{background:var(--yellow);color:var(--bg);border-color:var(--yellow)}
.sport-btn.live-dot::before{
  content:"";display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--live);margin-right:5px;
  animation:blink 1.4s infinite
}

/* ============ TIME FILTER ROW ============ */
.time-row{
  display:flex;gap:6px;padding:0 14px 12px;
  overflow-x:auto;scrollbar-width:none
}
.time-row::-webkit-scrollbar{display:none}
.time-btn{
  flex-shrink:0;padding:7px 13px;border-radius:7px;
  background:transparent;border:1px solid var(--bd);
  font-size:12px;font-weight:600;
  color:var(--t3);transition:all .18s;
  white-space:nowrap;position:relative;overflow:hidden
}
.time-btn.on{
  background:rgba(255,217,74,.14);
  color:var(--yellow);border-color:rgba(255,217,74,.4);
  font-weight:700
}

/* ============ SEARCH ============ */
.search-row{
  display:none;padding:0 14px 12px
}
.search-row.on{display:block}
.search-input{
  width:100%;
  background:var(--card);border:1px solid var(--bd);
  border-radius:8px;padding:10px 14px;
  color:var(--t);font-size:13px;
  transition:all .18s
}
.search-input:focus{outline:none;border-color:var(--yellow)}

/* ============ TICKER (бегущая строка) ============ */
.ticker{
  display:flex;gap:16px;
  padding:8px 14px;
  background:var(--bg2);
  border-bottom:1px solid var(--bd);
  overflow-x:auto;scrollbar-width:none;
  font-size:11.5px;color:var(--t2);
  white-space:nowrap;
  animation:fade .3s
}
.ticker::-webkit-scrollbar{display:none}
.ticker-item{
  display:inline-flex;gap:6px;align-items:center;
  flex-shrink:0
}
.ticker-item .t{
  color:var(--yellow);font-weight:800;
  font-variant-numeric:tabular-nums
}
.ticker-item .s{
  color:var(--t);font-weight:700
}

/* ============ PAGE ============ */
.page{max-width:1200px;margin:0 auto;padding:14px}
.sec-h{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;margin:16px 0 10px
}
.sec-t{
  display:flex;align-items:center;gap:8px;
  font-size:14px;font-weight:800
}
.sec-t::before{
  content:"";width:3px;height:14px;
  background:var(--yellow);border-radius:2px
}
.sec-t .cnt{
  font-size:11.5px;font-weight:600;
  color:var(--t3);margin-left:2px
}
.sec-more{
  font-size:12px;font-weight:700;
  color:var(--yellow);cursor:pointer
}

/* ============ MATCH CARD ============ */
.mc{
  background:var(--card);border:1px solid var(--bd);
  border-radius:10px;margin-bottom:10px;
  overflow:hidden;transition:border-color .18s;
  animation:cardIn .3s;cursor:pointer
}
.mc:hover{border-color:var(--bd2)}
.mc.live{border-left:3px solid var(--live)}
.mc.soon{border-left:3px solid var(--yellow)}

.mc-head{
  display:flex;justify-content:space-between;
  align-items:center;gap:10px;
  padding:9px 12px;
  background:var(--card2);
  border-bottom:1px solid var(--bd);
  font-size:11px
}
.mc-league{
  display:flex;align-items:center;gap:6px;
  color:var(--yellow);font-weight:800;
  text-transform:uppercase;letter-spacing:.4px;
  min-width:0;overflow:hidden
}
.mc-league span{
  overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap
}
.mc-status{
  display:flex;align-items:center;gap:5px;
  font-size:11px;font-weight:800;
  color:var(--t2);white-space:nowrap;
  font-variant-numeric:tabular-nums;
  text-transform:uppercase;letter-spacing:.3px
}
.mc-status.live{color:var(--red2)}
.mc-status.live::before{
  content:"";width:6px;height:6px;border-radius:50%;
  background:var(--live);animation:blink 1.4s infinite
}
.mc-status.soon{color:var(--yellow)}
.mc-status.pre{color:var(--t3)}

.mc-teams{
  display:flex;flex-direction:column;
  padding:11px 12px;gap:9px
}
.mc-team{
  display:flex;align-items:center;
  justify-content:space-between;gap:10px
}
.mc-tn{
  display:flex;align-items:center;gap:10px;
  flex:1;min-width:0;font-size:14px;font-weight:600
}
.mc-tn .lg-wrap{
  width:26px;height:26px;border-radius:50%;
  background:var(--card3);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;overflow:hidden;
  border:1px solid var(--bd)
}
.mc-tn .lg-wrap img{
  width:100%;height:100%;object-fit:contain;padding:2px
}
.mc-tn .lg-wrap span{
  font-size:11px;font-weight:900;color:#fff
}
.mc-tn span{
  overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap
}
.mc-score{
  font-size:18px;font-weight:900;
  min-width:22px;text-align:right;
  color:var(--yellow);
  font-variant-numeric:tabular-nums;
  height:22px;line-height:22px
}
.mc-score.pre{color:var(--t3);font-size:13px}

/* ============ ODDS ROW ============ */
.mc-odds{
  display:grid;gap:6px;
  padding:0 12px 10px;
  grid-template-columns:repeat(3,1fr)
}
.odd{
  background:var(--odd);
  border-radius:8px;
  padding:9px 6px 8px;
  cursor:pointer;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:2px;min-height:52px;
  transition:background .15s;
  position:relative;overflow:hidden;
  border:1px solid transparent
}
.odd:hover{background:var(--odd-h)}
.odd:active{transform:scale(.98)}
.odd.sel{background:var(--yellow);border-color:var(--yellow2)}
.odd.sel .olbl,
.odd.sel .oval{color:var(--bg);font-weight:900}
.odd.cl{opacity:.35;cursor:not-allowed}
.odd.cl .oval{text-decoration:line-through}

.olbl{
  font-size:10.5px;font-weight:600;
  color:var(--t2);text-align:center;
  line-height:1.2;
  white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:100%
}
.oval{
  font-size:15px;font-weight:800;
  color:var(--t);
  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum";
  display:inline-block;
  min-width:48px;text-align:center;
  letter-spacing:-.2px;
  transition:color .3s
}
.oval.up{animation:flashUp 1.4s ease-out}
.oval.dn{animation:flashDn 1.4s ease-out}
.odd.sel .oval.up,
.odd.sel .oval.dn{animation:none}

.mc-hint{
  text-align:center;padding:8px;
  font-size:11px;font-weight:600;
  color:var(--t3);
  border-top:1px solid var(--bd);
  cursor:pointer;user-select:none
}
.mc-hint::before{content:"👆";margin-right:5px}
.mc-hint:hover{
  color:var(--yellow);
  background:rgba(255,217,74,.04)
}

/* ============ MATCH CENTER ============ */
.mcc{
  position:fixed;inset:0;z-index:200;
  background:var(--bg);display:none;
  flex-direction:column;overflow-y:auto
}
.mcc.on{display:flex;animation:fade .2s}

.mcc-h{
  position:sticky;top:0;z-index:10;
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;
  background:linear-gradient(180deg,#0e1d32 0%,#0f1e35 100%);
  border-bottom:1px solid var(--bd)
}
.mcc-back{
  width:34px;height:34px;border-radius:8px;
  background:var(--card);border:1px solid var(--bd);
  color:var(--t2);font-size:16px;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;flex-shrink:0
}
.mcc-back:hover{color:var(--yellow);border-color:var(--yellow)}
.mcc-info{flex:1;min-width:0}
.mcc-info .t{
  font-size:14px;font-weight:800;
  overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap
}
.mcc-info .s{
  font-size:11.5px;color:var(--t3);
  margin-top:3px;display:flex;
  gap:8px;align-items:center
}
.mcc-info .s .dot{
  width:5px;height:5px;border-radius:50%;
  background:var(--live);
  animation:blink 1.4s infinite
}
.mcc-info .s .sc{
  color:var(--yellow);font-weight:900;
  font-size:14px;
  font-variant-numeric:tabular-nums
}
.mcc-fav{
  width:34px;height:34px;border-radius:8px;
  background:var(--card);border:1px solid var(--bd);
  color:var(--t3);font-size:15px;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;flex-shrink:0
}
.mcc-fav.on{color:var(--yellow);border-color:var(--yellow)}

.mcc-tabs{
  position:sticky;top:58px;z-index:9;
  display:flex;gap:0;background:var(--bg2);
  border-bottom:1px solid var(--bd);
  overflow-x:auto;scrollbar-width:none;
  padding:0 8px
}
.mcc-tabs::-webkit-scrollbar{display:none}
.mcc-tab{
  flex-shrink:0;padding:13px 14px;
  font-size:12.5px;font-weight:700;
  color:var(--t3);
  border-bottom:2px solid transparent;
  transition:all .18s;white-space:nowrap;
  text-transform:uppercase;
  letter-spacing:.3px
}
.mcc-tab:hover{color:var(--t2)}
.mcc-tab.on{
  color:var(--yellow);
  border-bottom-color:var(--yellow)
}

.mcc-body{
  flex:1;padding:14px;
  max-width:1100px;margin:0 auto;width:100%
}
.pane{display:none}
.pane.on{display:block;animation:fade .25s}

/* ============ MARKETS ============ */
.mkts{display:flex;flex-direction:column;gap:14px}
.mkt-title{
  font-size:15px;font-weight:900;
  color:var(--yellow);
  margin-bottom:4px;letter-spacing:.3px
}
.mkt{
  background:var(--card);
  border:1px solid var(--bd);
  border-radius:12px;padding:14px
}
.mkt-h{
  font-size:14px;font-weight:800;
  color:var(--yellow);
  margin-bottom:12px;letter-spacing:.2px
}
.mkt-row{
  display:grid;
  grid-template-columns:40px 1fr 1fr;
  gap:8px;margin-bottom:8px;
  align-items:center
}
.mkt-row:last-child{margin-bottom:0}
.mkt-line{
  font-size:13px;font-weight:700;
  color:var(--t2);text-align:center
}
.mkt-grid{
  display:grid;gap:8px;
  grid-template-columns:repeat(2,1fr)
}
.mkt-grid.g3{grid-template-columns:repeat(3,1fr)}
.mkt-grid.g4{grid-template-columns:repeat(4,1fr)}

.mkt-odd{
  background:var(--odd);
  border-radius:8px;
  padding:9px 6px 8px;
  cursor:pointer;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:2px;min-height:52px;
  transition:background .15s;
  position:relative;overflow:hidden;
  border:1px solid transparent
}
.mkt-odd:hover{background:var(--odd-h)}
.mkt-odd:active{transform:scale(.98)}
.mkt-odd.sel{
  background:var(--yellow);
  border-color:var(--yellow2)
}
.mkt-odd.sel .mkt-olbl,
.mkt-odd.sel .mkt-oval{color:var(--bg);font-weight:900}
.mkt-odd.cl{opacity:.35;cursor:not-allowed}
.mkt-odd.cl .mkt-oval{text-decoration:line-through}
.mkt-olbl{
  font-size:10.5px;font-weight:600;
  color:var(--t2);text-align:center;
  line-height:1.2
}
.mkt-oval{
  font-size:15px;font-weight:800;
  color:var(--t);
  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum";
  display:inline-block;
  min-width:48px;text-align:center;
  transition:color .3s
}
.mkt-oval.up{animation:flashUp 1.4s ease-out}
.mkt-oval.dn{animation:flashDn 1.4s ease-out}
.mkt-odd.sel .mkt-oval.up,
.mkt-odd.sel .mkt-oval.dn{animation:none}

/* ============ FEED ============ */
.feed{
  background:var(--card);
  border:1px solid var(--bd);
  border-radius:10px;
  display:flex;flex-direction:column;
  max-height:520px;overflow:hidden
}
.feed-h{
  padding:11px 12px;
  border-bottom:1px solid var(--bd);
  display:flex;justify-content:space-between;
  font-size:11.5px;font-weight:800;
  text-transform:uppercase;
  letter-spacing:.5px;color:var(--t2)
}
.feed-h::before{content:"🔴";margin-right:6px}
.feed-b{overflow-y:auto;flex:1}
.fe{
  display:flex;gap:10px;
  padding:9px 12px;
  border-bottom:1px solid var(--bd);
  font-size:12.5px;animation:evIn .35s
}
.fe:last-child{border-bottom:none}
.fe.hl{
  background:linear-gradient(90deg,rgba(255,217,74,.1),transparent 80%)
}
.fe .min{
  width:44px;flex-shrink:0;
  font-size:11px;font-weight:800;
  color:var(--yellow);
  font-variant-numeric:tabular-nums
}
.fe .ic{
  width:18px;height:18px;flex-shrink:0;
  border-radius:50%;background:var(--card2);
  display:flex;align-items:center;justify-content:center;
  font-size:10px
}
.fe .tx{
  flex:1;min-width:0;color:var(--t2);
  line-height:1.4
}
.fe .tx b{color:var(--t);font-weight:700}

/* ============ COMMENT ============ */
.comment{
  margin-top:12px;padding:14px 16px;
  background:linear-gradient(135deg,var(--card2) 0%,var(--card) 100%);
  border:1px solid var(--bd);
  border-left:3px solid var(--yellow);
  border-radius:10px;
  font-size:13px;color:var(--t2);
  font-style:italic;line-height:1.5;
  min-height:52px
}
.comment::before{
  content:"💬";margin-right:8px;
  font-style:normal;display:inline-block
}

/* ============ STATS ============ */
.stats{display:flex;flex-direction:column;gap:2px}
.st{
  display:grid;
  grid-template-columns:50px 1fr 50px;
  align-items:center;gap:10px;
  padding:10px 14px;
  background:var(--card);border:1px solid var(--bd)
}
.st+.st{margin-top:-1px}
.st:first-child{border-radius:10px 10px 0 0}
.st:last-child{border-radius:0 0 10px 10px}
.st .v{
  font-size:14px;font-weight:900;
  text-align:center;
  font-variant-numeric:tabular-nums
}
.st .v.d{color:var(--t3);font-weight:600}
.st .n{
  font-size:11.5px;font-weight:600;
  color:var(--t3);text-align:center;
  text-transform:uppercase;letter-spacing:.4px
}
.st .b{
  grid-column:1/-1;display:flex;
  height:3px;background:var(--card3);
  border-radius:3px;overflow:hidden;
  margin-top:4px
}
.st .b .h{
  background:var(--yellow);transition:width .4s
}
.st .b .a{
  background:var(--blue);margin-left:auto;
  transition:width .4s
}

/* ============ PITCH ============ */
.ov{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:900px){
  .ov{grid-template-columns:minmax(0,1fr) 320px}
}
.pitch{
  background:var(--card);border:1px solid var(--bd);
  border-radius:10px;padding:12px
}
.pitch svg{
  width:100%;height:auto;display:block;
  border-radius:8px
}

/* ============ COUPON ============ */
.cp{
  position:fixed;bottom:0;left:0;right:0;z-index:300;
  background:var(--card);
  border-top:2px solid var(--yellow);
  border-radius:16px 16px 0 0;
  transform:translateY(110%);
  transition:transform .35s cubic-bezier(.4,0,.2,1);
  max-height:80vh;display:flex;flex-direction:column;
  box-shadow:0 -8px 32px rgba(0,0,0,.6)
}
.cp.show{transform:translateY(0)}
.cp-bar{
  display:flex;align-items:center;gap:10px;
  padding:12px 14px;cursor:pointer;
  user-select:none;flex-shrink:0
}
.cp-bar .ic{font-size:18px}
.cp-bar .cnt{
  background:var(--yellow);color:var(--bg);
  font-size:11px;font-weight:900;
  padding:2px 7px;border-radius:10px;
  min-width:20px;text-align:center
}
.cp-bar .ttl{
  flex:1;font-size:13px;font-weight:700
}
.cp-bar .od{
  font-size:14px;font-weight:900;
  color:var(--yellow);
  font-variant-numeric:tabular-nums
}
.cp-close{
  width:30px;height:30px;border-radius:7px;
  background:var(--card3);border:1px solid var(--bd2);

  /* ---------- ВРЕМЯ ---------- */
  realElapsed(){ return (Date.now() - this.startedAt) / 1000; }
  rawProgress(){ return clamp(this.realElapsed() / this.realDuration, 0, 1); }

  progress(){
    let elapsed = this.realElapsed();
    let breakTime = 0;
    for(const b of this.breaks){
      if(elapsed > b.at * this.realDuration){
        breakTime += b.dur;
      }
    }
    return clamp((elapsed - breakTime) / this.realDuration, 0, 1);
  }

  isOnBreak(){
    return this.breakEndAt && Date.now() < this.breakEndAt;
  }

  gameTime(){
    const p = this.progress();
    if(this.sport === 'football') return p * 90;
    if(this.sport === 'hockey')   return p * 60;
    if(this.sport === 'ufc')      return p * 5;
    return p * 90;
  }

  displayClock(){
    if(this.finished) return 'FT';
    if(this.isOnBreak()){
      const left = Math.ceil((this.breakEndAt - Date.now()) / 1000);
      return `⏸ ${left}с`;
    }
    const t = this.gameTime();
    if(this.sport === 'football') return `${Math.floor(t)}'`;
    if(this.sport === 'hockey'){
      const per = Math.min(3, Math.floor(t/20) + 1);
      return `П${per} · ${Math.floor(t - (per-1)*20)}'`;
    }
    if(this.sport === 'ufc'){
      const r = Math.min(5, Math.floor(t) + 1);
      const inR = t - (r-1);
      const left = Math.floor((1-inR) * 300);
      return `R${r} · ${pad2(Math.floor(left/60))}:${pad2(left%60)}`;
    }
    return '00:00';
  }

  stageLabel(){
    const t = this.gameTime();
    if(this.sport === 'football') return t < 45 ? '1-й тайм' : '2-й тайм';
    if(this.sport === 'hockey') return `${Math.min(3, Math.floor(t/20)+1)}-й период`;
    if(this.sport === 'ufc') return `Раунд ${Math.min(5, Math.floor(t)+1)}/5`;
    return '';
  }

  suspend(ms){ this.suspended = true; this.suspendedUntil = Date.now() + ms; }
  isSuspended(){ return this.suspended && Date.now() < this.suspendedUntil; }
  setLiveMoment(t,s){ this.liveMoment = {title:t,sub:s,ts:Date.now()}; }
  setCommentary(text){
    if(text === this.commentary) return;
    this.commentary = text;
    if(this.onCommentary) this.onCommentary(text);
  }
  momentumShift(team, amt){
    if(team === 'h') this.momentum.h = clamp(this.momentum.h + amt, 5, 95);
    else this.momentum.a = clamp(this.momentum.a + amt, 5, 95);
    const t = this.momentum.h + this.momentum.a;
    this.momentum.h = clamp(this.momentum.h/t*100, 5, 95);
    this.momentum.a = 100 - this.momentum.h;
  }
  pushEvent(ev){
    ev.ts = Date.now();
    this.events.unshift(ev);
    if(this.events.length > 120) this.events.length = 120;
    if(this.onEvent) this.onEvent(ev);
  }

  /* ---------- TICK ---------- */
  tick(){
    if(this.finished) return;
    const now = Date.now();

    if(this.breakEndAt && now < this.breakEndAt) return;

    // Проверка перерывов
    for(const b of this.breaks){
      const bp = b.at * this.realDuration;
      if(!b.started && this.realElapsed() >= bp){
        b.started = true;
        this.breakEndAt = now + b.dur * 1000;
        this.pushEvent({type:'HALF_TIME',min:Math.floor(this.gameTime()),team:null,text:`⏸ ${b.name}`,highlight:true});
        this.setLiveMoment(`⏸ ${b.name}`, `Пауза ${b.dur} сек`);
        this.setCommentary(`⏸ ${b.name}. Скоро продолжим.`);
        return;
      }
    }

    if(this.rawProgress() >= 1){ this.finish(); return; }
    if(this.suspended && now >= this.suspendedUntil) this.suspended = false;

    if(now - this.lastEventAt >= this.nextEventIn){
      this.rollEvent();
      this.lastEventAt = now;
      this.nextEventIn = rnd(1500, 3500);
    }
    this.recalcOdds();
  }

  getWeights(){
    if(this.sport === 'football') return [
      {t:'PASS',w:34},{t:'ATTACK',w:22},{t:'DANGEROUS',w:14},
      {t:'SHOT_OFF',w:9},{t:'SHOT_ON',w:8},{t:'BLOCKED',w:4},
      {t:'CORNER',w:6},{t:'FOUL',w:5},{t:'YELLOW',w:3},
      {t:'RED',w:0.15},{t:'GOAL',w:4.5},
    ];
    if(this.sport === 'hockey') return [
      {t:'PASS',w:22},{t:'ATTACK',w:20},{t:'SHOT_OFF',w:13},
      {t:'SHOT_ON',w:12},{t:'HIT_HOCKEY',w:8},{t:'FOUL',w:6},
      {t:'YELLOW',w:5},{t:'GOAL',w:6},
    ];
    return [];
  }

  pickAttackTeam(){
    const total = this.homeStrength + this.awayStrength;
    return this.rng() < this.homeStrength / total ? 'h' : 'a';
  }

  rollEvent(){
    const evs = this.getWeights();
    if(!evs.length) return;
    const total = evs.reduce((s,e)=>s+e.w,0);
    let r = this.rng()*total;
    let chosen = evs[0];
    for(const e of evs){ r -= e.w; if(r<=0){ chosen = e; break; } }
    this.execute(chosen.t, this.pickAttackTeam());
  }

  execute(type, team){
    if(this.sport === 'football') return this.executeFootball(type, team);
    if(this.sport === 'hockey')   return this.executeHockey(type, team);
  }

  executeFootball(type, team){
    const m = Math.floor(this.gameTime());
    const tN = team === 'h' ? this.home : this.away;
    const oN = team === 'h' ? this.away : this.home;
    const switchP = () => this.possession = team === 'h' ? 'a' : 'h';

    switch(type){
      case 'PASS':
        this.attackingTeam = team; this.setBall(team, 'BUILD');
        if(this.rng() < 0.35) switchP();
        this.pushEvent({type,min:m,team,text:`Передача у <b>${tN}</b>`});
        this.setCommentary(`<b>${tN}</b> разыгрывает мяч.`);
        break;
      case 'ATTACK':
        this.attackingTeam = team; this.setBall(team, 'ATTACK');
        this.pushEvent({type,min:m,team,text:`Атака <b>${tN}</b>`});
        this.setCommentary(`<b>${tN}</b> идёт вперёд.`);
        break;
      case 'DANGEROUS':
        this.setBall(team, 'DANGER');
        this.pushEvent({type,min:m,team,text:`⚡ Опасно у ворот <b>${oN}</b>`,highlight:true});
        this.setCommentary(`🔥 <b>${tN}</b> создаёт момент!`);
        this.momentumShift(team, 6);
        this.setLiveMoment('🔥 Опасный момент', tN);
        break;
      case 'SHOT_OFF':
        this.stats.shots[team]++; this.setBall(team, 'SHOT'); switchP();
        this.pushEvent({type,min:m,team,text:`Удар мимо <b>${tN}</b>`});
        break;
      case 'SHOT_ON':
        this.stats.shots[team]++; this.stats.onT[team]++;
        this.setBall(team, 'SHOT_ON'); this.suspend(1200); switchP();
        this.pushEvent({type,min:m,team,text:`🎯 Удар в створ!`,highlight:true});
        this.setCommentary(`🎯 Вратарь <b>${oN}</b> отбивает!`);
        this.setLiveMoment('🎯 Удар в створ', tN);
        this.stats.saves[team === 'h' ? 'a' : 'h']++;
        break;
      case 'BLOCKED':
        this.stats.shots[team]++; this.stats.blocked[team]++; switchP();
        this.pushEvent({type,min:m,team,text:`Удар <b>${tN}</b> заблокирован`});
        break;
      case 'CORNER':
        this.stats.corners[team]++;
        this.pushEvent({type,min:m,team,text:`⚑ Угловой у <b>${tN}</b>`});
        break;
      case 'FOUL':
        this.stats.fouls[team === 'h' ? 'a' : 'h']++;
        this.pushEvent({type,min:m,team,text:`Свисток — нарушение`});
        switchP(); break;
      case 'YELLOW':
        this.stats.yellow[team]++;
        this.pushEvent({type,min:m,team,text:`🟨 Жёлтая <b>${tN}</b>`,highlight:true});
        this.setCommentary(`🟨 Жёлтая игроку <b>${tN}</b>.`);
        this.momentumShift(team, -3); break;
      case 'RED':
        this.stats.red[team]++; this.suspend(2000);
        this.pushEvent({type,min:m,team,text:`🟥 КРАСНАЯ! <b>${tN}</b>`,highlight:true});
        this.setCommentary(`🟥 Удаление! <b>${tN}</b> в меньшинстве.`);
        this.setLiveMoment('🟥 Удаление', tN);
        this.momentumShift(team, -12); break;
      case 'GOAL': this.scoreGoal(team); break;
    }
  }

  executeHockey(type, team){
    const m = Math.floor(this.gameTime());
    const tN = team === 'h' ? this.home : this.away;
    const switchP = () => this.possession = team === 'h' ? 'a' : 'h';

    switch(type){
      case 'PASS':
        this.setBall(team, 'BUILD');
        if(this.rng() < 0.4) switchP();
        this.pushEvent({type,min:m,team,text:`Пас у <b>${tN}</b>`});
        break;
      case 'ATTACK':
        this.attackingTeam = team; this.setBall(team, 'ATTACK');
        this.pushEvent({type,min:m,team,text:`Атака <b>${tN}</b>`});
        break;
      case 'SHOT_OFF':
        this.stats.shots[team]++; this.setBall(team, 'SHOT'); switchP();
        this.pushEvent({type,min:m,team,text:`Бросок мимо <b>${tN}</b>`});
        break;
      case 'SHOT_ON':
        this.stats.shots[team]++; this.stats.onT[team]++;
        this.suspend(1000); switchP();
        this.pushEvent({type,min:m,team,text:`🥅 Бросок в створ!`,highlight:true});
        this.stats.saves[team === 'h' ? 'a' : 'h']++;
        this.setLiveMoment('🥅 Бросок', tN);
        break;
      case 'HIT_HOCKEY':
        this.stats.hits[team]++;
        this.pushEvent({type,min:m,team,text:`💥 Силовой приём`});
        break;
      case 'FOUL':
        this.stats.fouls[team === 'h' ? 'a' : 'h']++;
        this.pushEvent({type,min:m,team,text:`Удаление 2 мин`});
        break;
      case 'YELLOW':
        this.stats.yellow[team]++;
        this.pushEvent({type,min:m,team,text:`Малый штраф`});
        break;
      case 'GOAL': this.scoreGoal(team); break;
    }
  }

  setBall(team, state){
    const isH = team === 'h';
    const pos = {
      BUILD:{x:isH?250:800,y:340},
      ATTACK:{x:isH?420:630,y:rnd(150,530)},
      DANGER:{x:isH?700:350,y:rnd(200,480)},
      SHOT:{x:isH?900:150,y:rnd(250,430)},
      SHOT_ON:{x:isH?1000:50,y:rnd(290,390)},
    }[state] || {x:525,y:340};
    this.ball.tx = pos.x; this.ball.ty = pos.y;
  }

  scoreGoal(team){
    if(team === 'h') this.hs++; else this.as++;
    const m = Math.floor(this.gameTime());
    const tN = team === 'h' ? this.home : this.away;
    this.pushEvent({type:'GOAL',min:m,team,text:`⚽ <b>ГОЛ!</b> ${tN}. ${this.hs}:${this.as}`,highlight:true});
    this.setLiveMoment('⚽ ГОЛ!', `${tN} · ${this.hs}:${this.as}`);
    this.setCommentary(`⚽ <b>ГОООЛ!</b> ${tN} забивает! Счёт ${this.hs}:${this.as}!`);
    this.suspend(2500);
    this.momentumShift(team, 10);
    setTimeout(() => {
      if(!this.finished){
        this.state = 'KICK_OFF';
        this.possession = team === 'h' ? 'a' : 'h';
      }
    }, 2000);
  }

  finish(){
    this.finished = true;
    this.finishedAt = Date.now();
    for(const mk of Object.values(this.markets)){
      mk.closed = mk.lbl.map(() => true);
    }
    const endText = this.finalNote || `🏁 Матч завершён. Итог ${this.hs}:${this.as}`;
    this.pushEvent({type:'FULL_TIME',min:90,team:null,text:endText,highlight:true});
    this.setLiveMoment('🏁 Завершён', `${this.hs}:${this.as}`);
    this.setCommentary(endText);
    if(window.saveToHistory) window.saveToHistory(this);
    if(window.checkCoupon) window.checkCoupon(this);
  }

  recalcOdds(){
    const p = this.progress();
    const remain = 1 - p;
    const lead = this.hs - this.as;
    const total = this.hs + this.as;

    for(const [name, mk] of Object.entries(this.markets)){
      if(mk.closed && mk.closed.every(x => x)) continue;
      const newVal = this.calcMarket(name, mk, {p, remain, lead, total});
      if(!newVal) continue;
      newVal.forEach((v, i) => {
        const key = name + '_' + i;
        const last = this.lastOdds[key];
        if(last != null && Math.abs(v - last) > 0.02){
          this.flashes[key] = {dir: v > last ? 'up' : 'dn', ts: Date.now()};
        }
        this.lastOdds[key] = v;
      });
      mk.val = newVal;
    }
  }

  calcMarket(name, mk, ctx){
    const {remain, lead, total} = ctx;
    let avg = this.sport === 'hockey' ? 5.5 : 2.7;

    switch(mk.type){
      case '1x2':{
        const two = mk.lbl.length === 2;
        let pH, pD = 0, pA;
        const hA = this.sport === 'football' ? 0.08 : 0.04;
        if(lead > 0){
          pH = clamp(0.5 + lead*0.15 + (1-remain)*0.22 + hA, 0.05, 0.95);
          pD = two ? 0 : 0.18*remain + 0.03;
          pA = Math.max(0.02, 1 - pH - pD);
        } else if(lead < 0){
          pA = clamp(0.5 + Math.abs(lead)*0.15 + (1-remain)*0.22, 0.05, 0.95);
          pD = two ? 0 : 0.18*remain + 0.03;
          pH = Math.max(0.02, 1 - pA - pD);
        } else {
          pH = 0.40*remain + 0.15 + hA;
          pA = 0.40*remain + 0.15;
          pD = two ? 0 : 0.30*remain + 0.05;
        }
        const sum = pH + pD + pA;
        pH/=sum; pD/=sum; pA/=sum;
        const mg = 1.06;
        if(two) return [clamp(1/pH/mg,1.02,99), clamp(1/pA/mg,1.02,99)];
        return [clamp(1/pH/mg,1.02,99), clamp(1/pD/mg,1.02,99), clamp(1/pA/mg,1.02,99)];
      }
      case 'dc':{
        let pH, pD, pA;
        if(lead > 0){ pH = 0.55 + lead*0.1 + (1-remain)*0.15; pD = 0.18*remain + 0.05; pA = Math.max(0.03, 1-pH-pD); }
        else if(lead < 0){ pA = 0.55 + Math.abs(lead)*0.1 + (1-remain)*0.15; pD = 0.18*remain + 0.05; pH = Math.max(0.03, 1-pA-pD); }
        else { pH = 0.38*remain + 0.15; pA = 0.38*remain + 0.15; pD = 0.24*remain + 0.1; }
        const s = pH+pD+pA;
        const p1X = (pH+pD)/s, p12 = (pH+pA)/s, pX2 = (pD+pA)/s;
        const mg = 1.06;
        return [
          clamp(1/Math.max(p1X,0.02)/mg,1.02,99),
          clamp(1/Math.max(p12,0.02)/mg,1.02,99),
          clamp(1/Math.max(pX2,0.02)/mg,1.02,99),
        ];
      }
      case 'win':{
        let pH, pA;
        if(lead > 0){ pH = clamp(0.5 + lead*0.15 + (1-remain)*0.25, 0.03, 0.97); pA = 1 - pH; }
        else if(lead < 0){ pA = clamp(0.5 + Math.abs(lead)*0.15 + (1-remain)*0.25, 0.03, 0.97); pH = 1 - pA; }
        else { pH = 0.5; pA = 0.5; }
        const mg = 1.05;
        return [clamp(1/pH/mg,1.02,99), clamp(1/pA/mg,1.02,99)];
      }
      case 'over':{
        if(total > mk.line) return [1.00, 1.00];
        const expected = total + avg * remain;
        const diff = expected - mk.line;
        let pO = clamp(1/(1+Math.exp(-diff*0.9)), 0.05, 0.95);
        const mg = 1.05;
        return [clamp(1/pO/mg,1.02,99), clamp(1/(1-pO)/mg,1.02,99)];
      }
      case 'btts':{
        const both = this.hs > 0 && this.as > 0;
        if(both){ mk.closed = [true,true]; mk.result = 'win'; return [1.00,1.00]; }
        if((this.hs === 0 || this.as === 0) && remain < 0.08){
          mk.closed = [true,true]; mk.result = 'lose'; return [1.00,1.00];
        }
        const pH = clamp(0.5 + this.hs*0.4 + remain*0.3, 0.1, 0.95);
        const pA = clamp(0.5 + this.as*0.4 + remain*0.3, 0.1, 0.95);
        const pYes = clamp(pH * pA, 0.05, 0.95);
        const mg = 1.06;
        return [clamp(1/pYes/mg,1.02,99), clamp(1/(1-pYes)/mg,1.02,99)];
      }
      case 'itb1':
      case 'itb2':{
        const score = mk.type === 'itb1' ? this.hs : this.as;
        if(score > mk.line) return [1.00, 1.00];
        const expected = score + (avg/2) * remain;
        const diff = expected - mk.line;
        let pO = clamp(1/(1+Math.exp(-diff*1.0)), 0.05, 0.95);
        const mg = 1.06;
        return [clamp(1/pO/mg,1.02,99), clamp(1/(1-pO)/mg,1.02,99)];
      }
      case 'hand1':
      case 'hand2':{
        const score = mk.type === 'hand1' ? this.hs - this.as : this.as - this.hs;
        const adj = score + mk.line;
        const p = clamp(0.5 + adj*0.25 + (1-remain)*0.1, 0.05, 0.95);
        if(adj > 0 && remain < 0.1) return [1.00, 1.00];
        const mg = 1.06;
        return [clamp(1/p/mg,1.02,99), clamp(1/(1-p)/mg,1.02,99)];
      }
      case 'parity':{
        let pE = 0.5;
        if(remain < 0.1) pE = (total % 2 === 0) ? 0.95 : 0.05;
        else if(remain < 0.3) pE = (total % 2 === 0) ? 0.75 : 0.25;
        const mg = 1.06;
        return [clamp(1/pE/mg,1.02,99), clamp(1/(1-pE)/mg,1.02,99)];
      }
      case 'corners':{
        const c = this.stats.corners.h + this.stats.corners.a;
        if(c > mk.line) return [1.00, 1.00];
        const proj = c + 10 * remain;
        const pO = clamp(1/(1+Math.exp(-(proj-mk.line)*0.8)), 0.05, 0.95);
        const mg = 1.06;
        return [clamp(1/pO/mg,1.02,99), clamp(1/(1-pO)/mg,1.02,99)];
      }
      case 'cards':{
        const c = this.stats.yellow.h + this.stats.yellow.a + (this.stats.red.h + this.stats.red.a) * 2;
        if(c > mk.line) return [1.00, 1.00];
        const proj = c + 5 * remain;
        const pO = clamp(1/(1+Math.exp(-(proj-mk.line)*0.8)), 0.05, 0.95);
        const mg = 1.06;
        return [clamp(1/pO/mg,1.02,99), clamp(1/(1-pO)/mg,1.02,99)];
      }
      case 'shots':{
        const s = this.stats.shots.h + this.stats.shots.a;
        const proj = s + 60 * remain;
        const pO = clamp(1/(1+Math.exp(-(proj-mk.line)*0.05)), 0.05, 0.95);
        const mg = 1.06;
        return [clamp(1/pO/mg,1.02,99), clamp(1/(1-pO)/mg,1.02,99)];
      }
    }
    return mk.val;
  }
}

/* ============================================================
   MANAGER + ПРЕМАТЧИ
   ============================================================ */
const Manager = {
  matches: [],
  nextId: 1,

  init(){
    this.matches = [];
    this.nextId = 1;
    const cycle = currentCycle();

    // ===== LIVE матчи (стартуют с разным offset) =====
    // Футбол: 5 матчей
    for(let i=0;i<5;i++) this.spawn('football', -rndInt(30,180), cycle, 'live');
    // Хоккей: 3 матча
    for(let i=0;i<3;i++) this.spawn('hockey', -rndInt(30,240), cycle, 'live');
    // UFC: 2 матча
    for(let i=0;i<2;i++) this.spawn('ufc', -rndInt(30,240), cycle, 'live');

    // ===== СКОРО (стартуют в ближайшие 5-120 минут) =====
    for(let i=0;i<4;i++) this.spawn('football', rndInt(5,60), cycle, 'soon');
    for(let i=0;i<2;i++) this.spawn('hockey', rndInt(10,90), cycle, 'soon');
    for(let i=0;i<1;i++) this.spawn('ufc', rndInt(15,120), cycle, 'soon');

    // ===== СЕГОДНЯ (вечером) =====
    for(let i=0;i<6;i++) this.spawn('football', rndInt(120,480), cycle, 'pre');
    for(let i=0;i<3;i++) this.spawn('hockey', rndInt(120,480), cycle, 'pre');

    // ===== ЗАВТРА (через 24ч ± 3ч) =====
    for(let i=0;i<8;i++) this.spawn('football', rndInt(1440,1800), cycle, 'pre');
    for(let i=0;i<4;i++) this.spawn('hockey', rndInt(1440,1800), cycle, 'pre');
    for(let i=0;i<2;i++) this.spawn('ufc', rndInt(1440,1800), cycle, 'pre');

    // ===== БУДУЩИЕ (2-7 дней) =====
    for(let i=0;i<10;i++) this.spawn('football', rndInt(2880,10080), cycle, 'pre');
    for(let i=0;i<5;i++) this.spawn('hockey', rndInt(2880,10080), cycle, 'pre');

    console.log(`[SPORTLIVE] Создано ${this.matches.length} матчей`);
  },

  spawn(sport, offsetMin, cycle, mode){
    cycle = cycle !== undefined ? cycle : currentCycle();
    const pools = {football: FOOTBALL, hockey: HOCKEY, ufc: UFC};
    const pool = pools[sport] || FOOTBALL;

    const seedBase = cycle * 7919 + Math.abs(offsetMin) * 131 + sport.charCodeAt(0)*17;
    const rng = makeRng(seedBase);
    const pair = pool[Math.floor(rng() * pool.length)];
    const league = LEAGUES[sport][Math.floor(rng() * LEAGUES[sport].length)];

    // offsetMin: отрицательный = матч уже идёт, положительный = стартует позже
    const startedAt = Date.now() + offsetMin * 60000;

    const m = new Match({
      id: this.nextId++,
      sport,
      league,
      home: pair.h,
      away: pair.a,
      homeStrength: pair.hS,
      awayStrength: pair.aS,
      startedAt,
      seed: seedBase,
    });
    m.mode = mode; // 'live' | 'soon' | 'pre'
    this.catchUp(m);
    this.matches.push(m);
    return m;
  },

  catchUp(m){
    const p = m.progress();
    if(p <= 0) return;
    let avg = m.sport === 'hockey' ? 5.5 : 2.7;
    const expected = p * avg;
    const full = Math.floor(expected);
    const frac = expected - full;
    for(let i=0;i<full;i++){
      if(m.rng() < 0.5) m.hs++; else m.as++;
    }
    if(m.rng() < frac){
      if(m.rng() < 0.5) m.hs++; else m.as++;
    }
    if(m.sport === 'football'){
      m.stats.shots.h = Math.round(p*7);
      m.stats.shots.a = Math.round(p*6);
      m.stats.onT.h = Math.round(m.stats.shots.h*0.4);
      m.stats.onT.a = Math.round(m.stats.shots.a*0.4);
      m.stats.corners.h = Math.round(p*5);
      m.stats.corners.a = Math.round(p*4);
      m.stats.yellow.h = Math.round(p*1.5);
      m.stats.yellow.a = Math.round(p*1.8);
      m.stats.pos.h = Math.round(40+m.rng()*20);
      m.stats.pos.a = 100-m.stats.pos.h;
    }
    if(m.sport === 'hockey'){
      m.stats.shots.h = Math.round(p*20);
      m.stats.shots.a = Math.round(p*18);
    }
  },

  tick(){
    this.matches.forEach(m => m.tick());
    const now = Date.now();
    const cycle = currentCycle();

    // Ротация завершённых через 30 сек
    this.matches = this.matches.map(m => {
      if(m.finished && m.finishedAt && now - m.finishedAt > PAUSE_AFTER * 1000){
        return this.spawn(m.sport, -2, cycle, 'live');
      }
      return m;
    });
  },

  liveCount(){ return this.matches.filter(m => !m.finished && m.progress() > 0 && m.progress() < 1).length; },
  find(id){ return this.matches.find(m => m.id === id); },
};

/* ============================================================
   РЫНКИ UFC
   ============================================================ */
Match.prototype.buildUfcMarkets = function(){
  const hS = this.homeStrength, aS = this.awayStrength;
  const total = hS + aS;
  const pH = clamp(hS / total, 0.15, 0.85);
  const pA = 1 - pH;

  return {
    'Победитель':           {type:'win',  lbl:['Победа 1','Победа 2'], val:[clamp(1/pH/1.05,1.05,20), clamp(1/pA/1.05,1.05,20)], closed:[false,false]},
    'Тотал 1.5 раунда':     {type:'overR',line:1.5, lbl:['Больше','Меньше'], val:[1.80, 2.00], closed:[false,false]},
    'Тотал 2.5 раунда':     {type:'overR',line:2.5, lbl:['Больше','Меньше'], val:[2.10, 1.72], closed:[false,false]},
    'Тотал 3.5 раунда':     {type:'overR',line:3.5, lbl:['Больше','Меньше'], val:[2.80, 1.42], closed:[false,false]},
    'Тотал 4.5 раунда':     {type:'overR',line:4.5, lbl:['Больше','Меньше'], val:[4.50, 1.20], closed:[false,false]},
    'Фора1 -1.5 раунда':    {type:'hand1',line:-1.5,lbl:['Да','Нет'],val:[2.20, 1.65],closed:[false,false]},
    'Метод победы':         {type:'method',lbl:['KO/TKO','Сабмишен','Решение'],val:[2.50, 4.00, 2.20],closed:[false,false,false]},
    'Раунд победы':         {type:'round',lbl:['1','2','3','4','5'],val:[4.20, 5.50, 7.00, 9.00, 12.0],closed:[false,false,false,false,false]},
    'Досрочно':             {type:'btts',lbl:['Да','Нет'],val:[1.75, 2.05],closed:[false,false]},
    'Бой дойдёт до решения':{type:'btts',lbl:['Да','Нет'],val:[2.10, 1.72],closed:[false,false]},
    'Тотал значимых ударов 120.5':{type:'hits',line:120.5,lbl:['Больше','Меньше'],val:[1.90, 1.90],closed:[false,false]},
    'Тотал тейкдаунов 2.5':  {type:'takedowns',line:2.5,lbl:['Больше','Меньше'],val:[1.90, 1.90],closed:[false,false]},
  };
};

const _origBuildMarkets = Match.prototype.buildMarkets;
Match.prototype.buildMarkets = function(){
  if(this.sport === 'ufc') return this.buildUfcMarkets();
  return _origBuildMarkets.call(this);
};

const _origGetWeights = Match.prototype.getWeights;
Match.prototype.getWeights = function(){
  if(this.sport === 'ufc') return [
    {t:'HIT',         w:38},
    {t:'ATTACK',      w:20},
    {t:'DANGEROUS',   w:15},
    {t:'SHOT_ON',     w:12},
    {t:'TAKEDOWN',    w:7},
    {t:'TAKEDOWN_OK', w:3},
    {t:'KO',          w:1.2},
    {t:'SUBMISSION',  w:0.8},
  ];
  return _origGetWeights.call(this);
};

/* ============================================================
   UFC — ЛОГИКА СОБЫТИЙ
   ============================================================ */
Match.prototype.executeUfc = function(type, team){
  const t = this.gameTime();
  const round = Math.min(5, Math.floor(t) + 1);
  const tN = team === 'h' ? this.home : this.away;

  switch(type){
    case 'HIT': {
      // Значимый удар
      this.stats.hits[team]++;
      this.stats.sigStrikes[team]++;
      this.stats.headStrikes[team]++;
      // Точность
      const totalShots = this.stats.sigStrikes[team] + rndInt(1,3);
      this.stats.strikeAcc[team] = Math.round(this.stats.sigStrikes[team] / totalShots * 100);
      this.pushEvent({type, min:round, team, text:`Удар <b>${tN}</b>`});
      break;
    }
    case 'ATTACK': {
      this.attackingTeam = team;
      this.pushEvent({type, min:round, team, text:`<b>${tN}</b> наступает`});
      break;
    }
    case 'DANGEROUS': {
      this.pushEvent({type, min:round, team, text:`⚡ Опасно! <b>${tN}</b> потрясает соперника`, highlight:true});
      this.setLiveMoment('🔥 Опасно', tN);
      this.momentumShift(team, 8);
      break;
    }
    case 'SHOT_ON': {
      this.suspend(1500);
      this.stats.sigStrikes[team]++;
      this.stats.knockdowns[team] = (this.stats.knockdowns[team] || 0) + (this.rng() < 0.3 ? 1 : 0);
      this.pushEvent({type, min:round, team, text:`Мощный удар <b>${tN}</b>`, highlight:true});
      this.momentumShift(team, 6);
      break;
    }
    case 'TAKEDOWN': {
      this.stats.takedowns[team]++;
      this.pushEvent({type, min:round, team, text:`Попытка тейкдауна <b>${tN}</b>`});
      if(this.rng() < 0.5){
        this.stats.takedownsAcc[team]++;
        this.stats.control[team] += rndInt(15,45);
      }
      break;
    }
    case 'TAKEDOWN_OK': {
      this.stats.takedowns[team]++;
      this.stats.takedownsAcc[team]++;
      this.stats.control[team] += rndInt(30,90);
      this.pushEvent({type, min:round, team, text:`Тейкдаун! <b>${tN}</b> контролирует`});
      break;
    }
    case 'KO': {
      const attackerS = team === 'h' ? this.homeStrength : this.awayStrength;
      const koChance = 0.35 + attackerS * 0.15;
      if(this.rng() > koChance) return;
      this.finishByKO(team, 'KO/TKO');
      break;
    }
    case 'SUBMISSION': {
      this.stats.subAttempts[team]++;
      const attackerS = team === 'h' ? this.homeStrength : this.awayStrength;
      const subChance = 0.25 + attackerS * 0.1;
      if(this.rng() > subChance) return;
      this.finishByKO(team, 'Сабмишен');
      break;
    }
  }
};

Match.prototype.finishByKO = function(winner, method){
  const wN = winner === 'h' ? this.home : this.away;
  const round = Math.min(5, Math.floor(this.gameTime()) + 1);
  this.hs = winner === 'h' ? 1 : 0;
  this.as = winner === 'a' ? 1 : 0;
  this.finalNote = `💥 ${wN} побеждает в раунде ${round} — ${method}`;

  this.finished = true;
  this.finishedAt = Date.now();
  for(const mk of Object.values(this.markets)){
    mk.closed = mk.lbl.map(() => true);
  }
  this.pushEvent({
    type: method === 'Сабмишен' ? 'SUBMISSION' : 'KO',
    min: round, team: winner,
    text: `💥 <b>ПОБЕДА!</b> ${wN} в раунде ${round} — ${method}`,
    highlight: true,
  });
  this.setLiveMoment(`💥 ${method}`, `${wN} — раунд ${round}`);
  this.suspend(2500);

  if(window.saveToHistory) window.saveToHistory(this);
  if(window.checkCoupon) window.checkCoupon(this);
};

/* ============================================================
   UFC — finish (по решению судей)
   ============================================================ */
const _origFinish = Match.prototype.finish;
Match.prototype.finish = function(){
  if(this.sport === 'ufc'){
    const hSig = this.stats.sigStrikes.h;
    const aSig = this.stats.sigStrikes.a;
    const total = hSig + aSig;
    let winner;
    if(total === 0){
      winner = this.rng() < 0.5 ? 'h' : 'a';
    } else {
      winner = this.rng() < hSig / total ? 'h' : 'a';
    }
    const wN = winner === 'h' ? this.home : this.away;
    const rH = 3 + Math.floor(this.rng() * 3);
    const rA = 5 - rH;
    this.hs = winner === 'h' ? 1 : 0;
    this.as = winner === 'a' ? 1 : 0;
    this.finalNote = `🏁 ${wN} побеждает решением судей (${rH}:${rA})`;

    this.finished = true;
    this.finishedAt = Date.now();
    for(const mk of Object.values(this.markets)){
      mk.closed = mk.lbl.map(() => true);
    }
    this.pushEvent({type:'FULL_TIME', min:5, team:winner, text:this.finalNote, highlight:true});
    this.setCommentary(this.finalNote);
    this.setLiveMoment('🏁 Решение судей', wN);

    if(window.saveToHistory) window.saveToHistory(this);
    if(window.checkCoupon) window.checkCoupon(this);
    return;
  }
  return _origFinish.call(this);
};

const _origExecute = Match.prototype.execute;
Match.prototype.execute = function(type, team){
  if(this.sport === 'ufc') return this.executeUfc(type, team);
  return _origExecute.call(this, type, team);
};

/* ============================================================
   UFC — КЭФЫ
   ============================================================ */
const _origCalcMarket = Match.prototype.calcMarket;
Match.prototype.calcMarket = function(name, mk, ctx){
  if(this.sport !== 'ufc') return _origCalcMarket.call(this, name, mk, ctx);
  const t = this.gameTime();
  const inRound = t - Math.floor(t);
  const round = Math.min(5, Math.floor(t) + 1);

  switch(mk.type){
    case 'win':{
      const hS = this.stats.sigStrikes.h;
      const aS = this.stats.sigStrikes.a;
      const totalS = hS + aS;
      let pH;
      if(totalS > 5){
        pH = 0.5 + (hS - aS) / (totalS * 2) + (this.homeStrength - this.awayStrength) * 0.1;
      } else {
        pH = this.homeStrength / (this.homeStrength + this.awayStrength);
      }
      pH = clamp(pH, 0.05, 0.95);
      const mg = 1.05;
      return [clamp(1/pH/mg,1.02,99), clamp(1/(1-pH)/mg,1.02,99)];
    }
    case 'overR':{
      if(t > mk.line) return [1.00, 1.00];
      let pOver;
      if(mk.line === 1.5){
        if(t >= 1.5) pOver = 0.99;
        else if(t >= 1) pOver = 0.85 + inRound * 0.14;
        else pOver = 0.65 + t * 0.20;
      } else if(mk.line === 2.5){
        if(t >= 2.5) pOver = 0.99;
        else if(t >= 2) pOver = 0.75 + inRound * 0.20;
        else if(t >= 1) pOver = 0.55 + (t - 1) * 0.20;
        else pOver = 0.40 + t * 0.15;
      } else if(mk.line === 3.5){
        if(t >= 3.5) pOver = 0.99;
        else if(t >= 3) pOver = 0.65 + inRound * 0.30;
        else if(t >= 2) pOver = 0.45 + (t - 2) * 0.20;
        else if(t >= 1) pOver = 0.30 + (t - 1) * 0.15;
        else pOver = 0.20 + t * 0.10;
      } else {
        if(t >= 4.5) pOver = 0.99;
        else if(t >= 4) pOver = 0.55 + inRound * 0.40;
        else if(t >= 3) pOver = 0.35 + (t - 3) * 0.20;
        else if(t >= 2) pOver = 0.20 + (t - 2) * 0.15;
        else if(t >= 1) pOver = 0.10 + (t - 1) * 0.10;
        else pOver = 0.05 + t * 0.05;
      }
      pOver = clamp(pOver, 0.02, 0.98);
      const mg = 1.05;
      return [clamp(1/pOver/mg,1.02,99), clamp(1/(1-pOver)/mg,1.02,99)];
    }
    case 'method':{
      const pDec = clamp(0.20 + t * 0.14, 0.20, 0.88);
      const pKO = (1 - pDec) * 0.65;
      const pSub = (1 - pDec) * 0.35;
      const mg = 1.06;
      return [
        clamp(1/Math.max(pKO,0.02)/mg,1.02,99),
        clamp(1/Math.max(pSub,0.02)/mg,1.02,99),
        clamp(1/Math.max(pDec,0.02)/mg,1.02,99),
      ];
    }
    case 'round':{
      return mk.lbl.map((l, i) => {
        const r = i + 1;
        if(t >= r) return 1.02;
        let p;
        if(r === 1) p = 0.35 * (1 - inRound) + 0.15;
        else if(r === 2) p = 0.25 * (1 - Math.max(0, t - 1)) + 0.12;
        else if(r === 3) p = 0.20 * (1 - Math.max(0, t - 2)) + 0.10;
        else if(r === 4) p = 0.15 * (1 - Math.max(0, t - 3)) + 0.08;
        else p = 0.12;
        p = clamp(p, 0.02, 0.85);
        return clamp(1/p/1.08, 1.02, 99);
      });
    }
    case 'hand1':
    case 'hand2':{
      const pH = this.homeStrength / (this.homeStrength + this.awayStrength);
      let p = (mk.type === 'hand1') ? pH : 1 - pH;
      if(mk.line < 0) p *= 0.65;
      p = clamp(p, 0.05, 0.95);
      const mg = 1.06;
      return [clamp(1/p/mg,1.02,99), clamp(1/(1-p)/mg,1.02,99)];
    }
    case 'hits':{
      const h = this.stats.sigStrikes.h + this.stats.sigStrikes.a;
      if(h > mk.line) return [1.00, 1.00];
      const proj = h + (5 - t) * 25;
      const pO = clamp(1/(1+Math.exp(-(proj-mk.line)*0.05)), 0.05, 0.95);
      const mg = 1.06;
      return [clamp(1/pO/mg,1.02,99), clamp(1/(1-pO)/mg,1.02,99)];
    }
    case 'takedowns':{
      const td = this.stats.takedowns.h + this.stats.takedowns.a;
      if(td > mk.line) return [1.00, 1.00];
      const proj = td + (5 - t) * 0.6;
      const pO = clamp(1/(1+Math.exp(-(proj-mk.line)*1.5)), 0.05, 0.95);
      const mg = 1.06;
      return [clamp(1/pO/mg,1.02,99), clamp(1/(1-pO)/mg,1.02,99)];
    }
    case 'btts':{
      if(name.includes('решения')){
        const pYes = clamp(0.20 + t * 0.14, 0.20, 0.88);
        const mg = 1.06;
        return [clamp(1/pYes/mg,1.02,99), clamp(1/(1-pYes)/mg,1.02,99)];
      }
      if(name.includes('Досрочно')){
        const pYes = clamp(0.80 - t * 0.14, 0.12, 0.80);
        const mg = 1.06;
        return [clamp(1/pYes/mg,1.02,99), clamp(1/(1-pYes)/mg,1.02,99)];
      }
    }
  }
  return mk.val;
};

/* ============================================================
   UFC — catchUp
   ============================================================ */
const _origCatchUp = Manager.catchUp;
Manager.catchUp = function(m){
  if(m.sport === 'ufc'){
    const p = m.progress();
    if(p > 0){
      m.stats.sigStrikes.h = Math.round(p * 55);
      m.stats.sigStrikes.a = Math.round(p * 50);
      m.stats.hits.h = m.stats.sigStrikes.h;
      m.stats.hits.a = m.stats.sigStrikes.a;
      m.stats.headStrikes.h = Math.round(p * 35);
      m.stats.headStrikes.a = Math.round(p * 32);
      m.stats.bodyStrikes.h = Math.round(p * 12);
      m.stats.bodyStrikes.a = Math.round(p * 11);
      m.stats.legStrikes.h = Math.round(p * 8);
      m.stats.legStrikes.a = Math.round(p * 7);
      m.stats.takedowns.h = Math.round(p * 2);
      m.stats.takedowns.a = Math.round(p * 1);
      m.stats.takedownsAcc.h = Math.round(p * 1);
      m.stats.takedownsAcc.a = Math.round(p * 1);
      m.stats.control.h = Math.round(p * 60);
      m.stats.control.a = Math.round(p * 45);
      m.stats.strikeAcc.h = 45 + Math.round(m.rng() * 15);
      m.stats.strikeAcc.a = 42 + Math.round(m.rng() * 15);
    }
    return;
  }
  return _origCatchUp.call(Manager, m);
};

function loadState(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return;
    const d = JSON.parse(raw);
    if(typeof d.balance === 'number') State.balance = d.balance;
    if(Array.isArray(d.history)) State.history = d.history;
    if(Array.isArray(d.matchHistory)) State.matchHistory = d.matchHistory;
    if(Array.isArray(d.favorites)) State.favorites = new Set(d.favorites);
    const today = new Date().toDateString();
    if(d.dailyDate === today){
      State.dailyDate = d.dailyDate;
      State.dailyAmount = d.dailyAmount || 0;
    } else {
      State.dailyDate = today;
      State.dailyAmount = 0;
    }
    State.lastBonusDate = d.lastBonusDate || '';
    State.bonusDay = d.bonusDay || 1;
    State.level = d.level || 1;
    State.xp = d.xp || 0;
  } catch(e){}
}
function saveState(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      balance: State.balance,
      history: State.history.slice(0, 100),
      matchHistory: State.matchHistory.slice(0, 50),
      favorites: [...State.favorites],
      dailyDate: State.dailyDate,
      dailyAmount: State.dailyAmount,
      lastBonusDate: State.lastBonusDate,
      bonusDay: State.bonusDay,
      level: State.level,
      xp: State.xp,
    }));
  } catch(e){}
}

/* ---------- RIPPLE ---------- */
document.addEventListener('click', e => {
  const btn = e.target.closest('.odd, .mkt-odd, .sport-btn, .time-btn, .hbtn, .cp-place, .mdl-x, .total-line, .total-value, .btts-btn');
  if(!btn) return;

  const size = Math.max(rect.width, rect.height);
  const ripple = document.createElement('span');
  ripple.className = 'ripple';
  ripple.style.width = ripple.style.height = size + 'px';
  ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
  ripple.style.top = (e.clientY - rect.top - size/2) + 'px';
  btn.appendChild(ripple);
  setTimeout(() => ripple.remove(), 600);
});

/* ---------- TIME HELPERS ---------- */
function timeUntilStart(m){
  const diff = m.startedAt - Date.now();
  if(diff <= 0) return null;
  const min = Math.ceil(diff / 60000);
  if(min < 60) return `через ${min} мин`;
  const h = Math.floor(min/60);
  const mm = min % 60;
  if(h < 24) return `через ${h}ч ${mm}м`;
  const d = Math.floor(h/24);
  return `через ${d}д`;
}

function startTimeLabel(m){
  const d = new Date(m.startedAt);
  const time = d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  const today = new Date();
  const tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate()+1);
  if(d.toDateString() === today.toDateString()) return `Сегодня ${time}`;
  if(d.toDateString() === tomorrow.toDateString()) return `Завтра ${time}`;
  return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'}) + ' ' + time;
}

function isSoon(m){
  const diff = m.startedAt - Date.now();
  return diff > 0 && diff < 3600000;
}
function isToday(m){
  const d = new Date(m.startedAt);
  return d.toDateString() === new Date().toDateString() && m.startedAt > Date.now() + 3600000;
}
function isTomorrow(m){
  const d = new Date(m.startedAt);
  const tmr = new Date(); tmr.setDate(tmr.getDate()+1);
  return d.toDateString() === tmr.toDateString();
}

/* ---------- MATCH CARD ---------- */
function renderMatchCard(m){
  const ic = SPORTS.find(s => s.id === m.sport)?.ic || '🏆';
  const live = m.progress() > 0 && m.progress() < 1;
  const soon = isSoon(m);
  const finished = m.finished;
  const pre = !live && !finished;
  const isExpanded = State.expandedCards.has(m.id);

  // Главные кэфы
  const mainMktName = m.markets['1X2'] ? '1X2' : 'Победитель';
  const mkt = m.markets[mainMktName];
  let oddsHTML = '';
  if(mkt){
    oddsHTML = mkt.lbl.map((l, i) => {
      const sel = State.coupon.find(c => c.matchId === m.id && c.market === mainMktName && c.pickIdx === i);
      const closed = mkt.closed[i];
      const susp = m.isSuspended();
      return `<div class="odd ${sel?'sel':''} ${closed||susp?'cl':''}" data-mid="${m.id}" data-mkt="${mainMktName}" data-pick="${i}" ${susp?`data-susp="⏸ ${Math.ceil((m.suspendedUntil-Date.now())/1000)}с"`:''}>
        <span class="olbl">${esc(l)}</span>
        <span class="oval" data-key="${m.id}_${mainMktName}_${i}">${mkt.val[i].toFixed(2)}</span>
      </div>`;
    }).join('');
  }

  // Статус
  let statusHTML = '';
  let statusClass = '';
  if(finished){ statusHTML = 'FT'; }
  else if(live){ statusHTML = m.displayClock(); statusClass = 'live'; }
  else if(soon){ statusHTML = timeUntilStart(m); statusClass = 'soon'; }
  else { statusHTML = startTimeLabel(m); statusClass = 'pre'; }

  const scoreH = live || finished ? m.hs : '—';
  const scoreA = live || finished ? m.as : '—';

  // Раскрытая часть
  let expandedHTML = '';
  if(isExpanded){
    expandedHTML = `<div class="mc-expanded">`;

    // Тотал
    if(m.sport === 'football'){
      expandedHTML += renderTotalSection(m, 'Тотал голов', m.markets['Тотал 2.5'], [0.5,1.5,2.5,3.5]);
      expandedHTML += renderBttsSection(m, 'Обе забьют', m.markets['Обе забьют']);
      expandedHTML += renderBttsSection(m, 'Двойной шанс', m.markets['Двойной шанс'], true);
    }
    if(m.sport === 'hockey'){
      expandedHTML += renderTotalSection(m, 'Тотал шайб', m.markets['Тотал 4.5'], [3.5,4.5,5.5,6.5]);
      expandedHTML += renderBttsSection(m, 'Обе забьют', m.markets['Обе забьют']);
      expandedHTML += renderBttsSection(m, 'Двойной шанс', m.markets['Двойной шанс'], true);
    }
    if(m.sport === 'ufc'){
      expandedHTML += renderTotalSection(m, 'Тотал раундов', m.markets['Тотал 2.5 раунда'], [1.5,2.5,3.5,4.5]);
      expandedHTML += renderBttsSection(m, 'Метод победы', m.markets['Метод победы'], true);
    }

    expandedHTML += `</div>`;
  }

  return `
    <div class="mc ${live?'live':''} ${soon?'soon':''} ${isExpanded?'expanded':''}" data-card="${m.id}">
      <div class="mc-head" data-mid="${m.id}" data-toggle="1">
        <div class="mc-league">${ic} <span>${esc(m.league)}</span></div>
        <div class="mc-status ${statusClass}">${statusHTML}</div>
      </div>
      <div class="mc-teams" data-mid="${m.id}" data-toggle="1">
        <div class="mc-team">
          <div class="mc-tn">
            <div class="lg-wrap">${renderLogo(m.home)}</div>
            <span>${esc(m.home)}</span>
          </div>
          <div class="mc-score ${pre?'pre':''}">${scoreH}</div>
        </div>
        <div class="mc-team">
          <div class="mc-tn">
            <div class="lg-wrap">${renderLogo(m.away)}</div>
            <span>${esc(m.away)}</span>
          </div>
          <div class="mc-score ${pre?'pre':''}">${scoreA}</div>
        </div>
      </div>
      <div class="mc-odds">${oddsHTML}</div>
      ${isExpanded ? '' : `<div class="mc-hint" data-mid="${m.id}" data-toggle="1">Открыть все рынки</div>`}
      ${expandedHTML}
    </div>
  `;
}

/* ---------- СПИСКИ ---------- */
function getFilteredMatches(){
  let list = Manager.matches.slice();
  if(State.currentSport !== 'all') list = list.filter(m => m.sport === State.currentSport);
  if(State.currentTime === 'live') list = list.filter(m => m.progress() > 0 && m.progress() < 1);
  else if(State.currentTime === 'soon') list = list.filter(m => isSoon(m));
  else if(State.currentTime === 'today') list = list.filter(m => isToday(m));
  else if(State.currentTime === 'tomorrow') list = list.filter(m => isTomorrow(m));
  if(State.search){
    const q = State.search.toLowerCase();
    list = list.filter(m =>
      m.home.toLowerCase().includes(q) ||
      m.away.toLowerCase().includes(q) ||
      m.league.toLowerCase().includes(q)
    );
  }
  if(State.sort === 'time'){
    list.sort((a,b) => a.startedAt - b.startedAt);
  } else {
    list.sort((a,b) => {
      const aS = a.progress() > 0 && a.progress() < 1 ? 0 : (isSoon(a) ? 1 : 2);
      const bS = b.progress() > 0 && b.progress() < 1 ? 0 : (isSoon(b) ? 1 : 2);
      if(aS !== bS) return aS - bS;
      return a.startedAt - b.startedAt;
    });
  }
  return list;
}

function renderLiveSection(){
  const box = $('liveSection');
  if(!box) return;
  let list = Manager.matches.filter(m => m.progress() > 0 && m.progress() < 1);
  if(State.currentSport !== 'all') list = list.filter(m => m.sport === State.currentSport);
  const cnt = $('liveCount');
  if(cnt) cnt.textContent = list.length;
  if(!list.length){
    box.innerHTML = '<div class="cp-empty"><div class="em">💤</div>Нет активных матчей</div>';
    return;
  }
  box.innerHTML = list.slice(0, 8).map(m => renderMatchCard(m)).join('');
}

function renderSoonSection(){
  const box = $('soonSection');
  if(!box) return;
  let list = Manager.matches.filter(m => isSoon(m));
  if(State.currentSport !== 'all') list = list.filter(m => m.sport === State.currentSport);
  const cnt = $('soonCount');
  if(cnt) cnt.textContent = list.length;
  if(!list.length){
    box.innerHTML = '<div class="cp-empty"><div class="em">⏰</div>Скоро ничего не начнётся</div>';
    return;
  }
  list.sort((a,b) => a.startedAt - b.startedAt);
  box.innerHTML = list.slice(0, 6).map(m => renderMatchCard(m)).join('');
}

function renderMatchesList(){
  const box = $('matchesList');
  if(!box) return;
  const list = getFilteredMatches();
  const cnt = $('listCount');
  if(cnt) cnt.textContent = list.length;
  if(!list.length){
    box.innerHTML = '<div class="cp-empty"><div class="em">🔍</div>Ничего не найдено</div>';
    return;
  }
  box.innerHTML = list.map(m => renderMatchCard(m)).join('');
}

/* ---------- ОБНОВЛЕНИЕ КЭФОВ ---------- */
function updateOddsInCards(){
  $$('.oval, .val-num, .btts-val').forEach(el => {
    const key = el.dataset.key;
    if(!key) return;
    const parts = key.split('_');
    const mid = parseInt(parts[0]);
    const pickIdx = parseInt(parts[parts.length-1]);
    const mktName = parts.slice(1, -1).join('_');
    const m = Manager.find(mid);
    if(!m || !m.markets[mktName]) return;
    const newVal = m.markets[mktName].val[pickIdx];
    const oldVal = parseFloat(el.textContent);
    if(Math.abs(newVal - oldVal) > 0.005){
      el.classList.remove('up','dn');
      void el.offsetWidth;
      el.classList.add(newVal > oldVal ? 'up' : 'dn');
      el.textContent = newVal.toFixed(2);
    }
  });
  // Обновляем suspension таймеры
  $$('.odd.cl[data-susp]').forEach(el => {
    const mid = parseInt(el.dataset.mid);
    const m = Manager.find(mid);
    if(m){
      el.dataset.susp = `⏸ ${Math.ceil((m.suspendedUntil-Date.now())/1000)}с`;
    }
  });
}

function updateStatusesInCards(){
  $$('.mc').forEach(card => {
    const mid = parseInt(card.dataset.card);
    const m = Manager.find(mid);
    if(!m) return;
    const status = card.querySelector('.mc-status');
    const scores = card.querySelectorAll('.mc-score');
    const live = m.progress() > 0 && m.progress() < 1;
    const soon = isSoon(m);
    const finished = m.finished;

    if(status){
      let txt = '', cls = '';
      if(finished){ txt = 'FT'; }
      else if(live){ txt = m.displayClock(); cls = 'live'; }
      else if(soon){ txt = timeUntilStart(m); cls = 'soon'; }
      else { txt = startTimeLabel(m); cls = 'pre'; }
      if(status.textContent !== txt){
        status.textContent = txt;
        status.className = 'mc-status ' + cls;
      }
    }
    if(scores[0] && scores[1]){
      const h = live || finished ? m.hs : '—';
      const a = live || finished ? m.as : '—';
      if(scores[0].textContent !== String(h)) scores[0].textContent = h;
      if(scores[1].textContent !== String(a)) scores[1].textContent = a;
    }
  });
}

/* ---------- MATCH CENTER ---------- */
function currentMatch(){
  return Manager.matches.find(m => m.id === State.currentMatchId) || null;
}

function openMatchCenter(id){
  const m = Manager.find(id);
  if(!m) return;
  State.currentMatchId = id;
  State.currentTab = 'markets';

  const mc = $('mcc');
  if(!mc) return;
  mc.classList.add('on');
  document.body.classList.add('lock');

  setMccTab('markets');
  updateMatchCenter();

  const pw = $('pitchWrap');
  if(pw){
    if(m.sport === 'football' || m.sport === 'hockey'){
      pw.style.display = '';
      if(!window._raf) window._raf = requestAnimationFrame(pitchLoop);
    } else {
      pw.style.display = 'none';
      if(window._raf){ cancelAnimationFrame(window._raf); window._raf = null; }
    }
  }

  m.onCommentary = (text) => {
    if(State.currentMatchId === m.id){
      const el = $('comment');
      if(el) el.textContent = text;
    }
  };
}

function closeMatchCenter(){
  $('mcc').classList.remove('on');
  document.body.classList.remove('lock');
  if(window._raf){ cancelAnimationFrame(window._raf); window._raf = null; }
  State.currentMatchId = null;
}

function setMccTab(tab){
  State.currentTab = tab;
  $$('.mcc-tab').forEach(t => t.classList.toggle('on', t.dataset.tab === tab));
  $$('.pane').forEach(p => p.classList.toggle('on', p.dataset.pane === tab));

/* ---------- PITCH ---------- */
let lastT = 0;
function pitchLoop(t){
  window._raf = requestAnimationFrame(pitchLoop);
  if(!lastT) lastT = t;
  const dt = Math.min(0.05, (t-lastT)/1000);
  lastT = t;
  const m = currentMatch();
  if(!m) return;
  if(m.ball){
    const k = 1 - Math.pow(0.001, dt);
    m.ball.x += (m.ball.tx - m.ball.x) * k;
    m.ball.y += (m.ball.ty - m.ball.y) * k;
  }
  m.players.forEach(p => {
    const pull = 0.08;
    const tx = p.baseX + (m.ball.x - p.baseX) * pull;
    const ty = p.baseY + (m.ball.y - p.baseY) * pull;
    const k2 = 1 - Math.pow(0.02, dt);
    p.x += (tx - p.x) * k2;
    p.y += (ty - p.y) * k2;
  });
  renderPitch();
}

function renderPitch(){
  const m = currentMatch();
  if(!m) return;
  const svg = $('pitchSvg');
  if(!svg) return;
  const g = svg.querySelector('#pitchPlayers');
  const b = svg.querySelector('#pitchBall');
  if(!g || !b) return;

  const rect = svg.querySelector('rect');
  if(rect) rect.setAttribute('fill', m.sport === 'hockey' ? '#0d1f2e' : '#0d2818');

  if(g.childElementCount !== m.players.length){
    g.innerHTML = '';
    m.players.forEach(() => {
      const gg = document.createElementNS('http://www.w3.org/2000/svg','g');
      const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
      c.setAttribute('r','13'); c.setAttribute('stroke-width','2');
      const t = document.createElementNS('http://www.w3.org/2000/svg','text');
      t.setAttribute('text-anchor','middle'); t.setAttribute('dy','4');
      t.setAttribute('font-size','10'); t.setAttribute('font-weight','900');
      t.setAttribute('fill','#0f1e35');
      gg.appendChild(c); gg.appendChild(t);
      g.appendChild(gg);
    });
  }

  m.players.forEach((p,i)=>{
    const gg = g.children[i];
    if(!gg) return;
    gg.setAttribute('transform',`translate(${p.x.toFixed(1)} ${p.y.toFixed(1)})`);
    const c = gg.children[0];
    const t = gg.children[1];
    c.setAttribute('fill', p.team === 'h' ? '#ffd94a' : '#4a90e2');
    c.setAttribute('stroke', p.team === 'h' ? '#a89020' : '#2a5a9e');
    t.textContent = p.num;
  });

  b.setAttribute('transform',`translate(${m.ball.x.toFixed(1)} ${m.ball.y.toFixed(1)})`);
  b.style.display = m.players.length ? '' : 'none';
}

/* ---------- КЛИКИ ---------- */
document.addEventListener('click', e => {
  // Раскрыть тотал
  const totalLine = e.target.closest('.total-line');
  if(totalLine){
    e.preventDefault(); e.stopPropagation();
    const mid = parseInt(totalLine.dataset.mid);
    const line = totalLine.dataset.total;
    if(State.openTotal[mid] === line){
      delete State.openTotal[mid];
    } else {
      State.openTotal[mid] = line;
    }
    renderLiveSection(); renderSoonSection(); renderMatchesList();
    return;
  }

  // Спорты
  const sp = e.target.closest('.sport-btn');
  if(sp){
    State.currentSport = sp.dataset.sport;
    renderSportsRow();
    renderLiveSection();
    renderSoonSection();
    renderMatchesList();
    return;
  }

  // Время
  const tm = e.target.closest('.time-btn');
  if(tm){
    State.currentTime = tm.dataset.time;
    renderTimeRow();
    renderLiveSection();
    renderSoonSection();
    renderMatchesList();
    return;
  }

  // Кэфы
  const odd = e.target.closest('.odd, .mkt-odd, .total-value, .btts-btn');
  if(odd && !odd.classList.contains('cl')){
    const mid = parseInt(odd.dataset.mid);
    const mkt = odd.dataset.mkt;
    const pick = parseInt(odd.dataset.pick);
    const m = Manager.find(mid);
    if(!m || !m.markets[mkt]) return;
    e.preventDefault(); e.stopPropagation();
    addToCoupon(mid, mkt, pick, m.markets[mkt].lbl[pick], m.markets[mkt].val[pick]);
    return;
  }

  // Раскрыть карточку
  const toggle = e.target.closest('[data-toggle]');
  if(toggle){
    e.preventDefault(); e.stopPropagation();
    const mid = parseInt(toggle.dataset.mid);
    if(State.expandedCards.has(mid)){
      State.expandedCards.delete(mid);
    } else {
      State.expandedCards.add(mid);
    }
    renderLiveSection(); renderSoonSection(); renderMatchesList();
    return;
  }

  // Удалить из купона
  const x = e.target.closest('.cp-item .x');
  if(x){
    const mid = parseInt(x.dataset.mid);
    const mkt = x.dataset.mkt;
    const pick = parseInt(x.dataset.pick);
    State.coupon = State.coupon.filter(c => !(c.matchId===mid && c.market===mkt && c.pickIdx===pick));
    updateCoupon();
    updateMarketSel();
    saveState();
    if(!State.coupon.length) hideCoupon();
    return;
  }

  // Тип ставки
  const ct = e.target.closest('.cp-type button');
  if(ct){ setBetType(ct.dataset.type); return; }

  // Быстрая сумма
  const q = e.target.closest('.cp-stake .q');
  if(q){ $('cpStake').value = q.dataset.s; updateCoupon(); return; }

  // Ставка
  if(e.target.closest('#cpPlace')){ placeBet(); return; }
  if(e.target.closest('#cpClose')){ hideCoupon(); return; }
  if(e.target.closest('#cpBar') && !e.target.closest('#cpClose')){
    $('coupon').classList.toggle('open');
    return;
  }

  // Навигация
  const bn = e.target.closest('.bn');
  if(bn){
    const nav = bn.dataset.nav;
    $$('.bn').forEach(b => b.classList.toggle('on', b.dataset.nav === nav));
    if(nav === 'home'){ closeMatchCenter(); window.scrollTo({top:0,behavior:'smooth'}); }
    if(nav === 'live'){ State.currentTime = 'live'; renderTimeRow(); renderLiveSection(); renderSoonSection(); renderMatchesList(); window.scrollTo({top:0,behavior:'smooth'}); }
    if(nav === 'coupon'){ $('coupon').classList.add('show','open'); }
    if(nav === 'history'){ openHistory(); }
    if(nav === 'profile'){ openProfile(); }
    return;
  }

  if(e.target.closest('#mccBack')){ closeMatchCenter(); return; }

  const mt = e.target.closest('.mcc-tab');
  if(mt){ setMccTab(mt.dataset.tab); return; }

  if(e.target.closest('#btnSearch')){
    $('searchRow').classList.toggle('on');
    const inp = $('searchInput');
    if(inp && $('searchRow').classList.contains('on')) inp.focus();
    return;
  }

  if(e.target.closest('#btnProfile') || e.target.closest('#balanceBtn')){
    openProfile();
    return;
  }

  if(e.target.closest('#seeAllLive')){
    State.currentTime = 'live';
    renderTimeRow();
    renderLiveSection();
    renderSoonSection();
    renderMatchesList();
    return;
  }

  if(e.target.id === 'modalBg') closeModal();
});

/* === КОНЕЦ ЧАСТИ 4 === */
