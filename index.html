<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a0a12">
<title>⚡ OpenBet Pro — Real Simulation Engine v4</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
:root{--bg:#0a0a12;--bg2:#12121f;--bg3:#1a1a2e;--card:#14142a;--card-hover:#1c1c38;--border:rgba(100,100,150,.12);--border-2:rgba(120,120,180,.3);--text:#f0f0ff;--text-2:#b0b0d0;--muted:#5a5a7a;--accent:#7c5cff;--accent-2:#00d4ff;--green:#00e676;--red:#ff3860;--gold:#ffb800;--r-sm:10px;--r-md:14px;--r-lg:18px;--r-xl:24px}
body.light{--bg:#f2f3f9;--bg2:#e8eaf2;--bg3:#dce0ec;--card:#fff;--card-hover:#f5f6fc;--border:rgba(90,90,130,.1);--border-2:rgba(90,90,130,.22);--text:#0e0e1c;--text-2:#3a3a55;--muted:#7a7a95}
html{scroll-behavior:smooth}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .3s,color .3s}
body.has-coupon{padding-bottom:140px}
.header{position:sticky;top:0;z-index:100;border-bottom:1px solid var(--border);padding:14px 20px;backdrop-filter:blur(20px);background:rgba(10,10,18,.85)}
body.light .header{background:rgba(242,243,249,.9)}
.header-inner{max-width:1280px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:14px}
.logo{font-size:20px;font-weight:900;letter-spacing:-.5px;cursor:pointer;white-space:nowrap;user-select:none;display:flex;align-items:center;gap:10px}
.logo-icon{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#7c5cff,#00d4ff);display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:0 4px 16px rgba(124,92,255,.4)}
.logo span{background:linear-gradient(135deg,#7c5cff,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-actions{display:flex;align-items:center;gap:8px}
.balance{background:var(--card);border:1px solid var(--border);padding:9px 16px;border-radius:var(--r-md);font-weight:800;font-size:13.5px;display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;cursor:pointer;user-select:none;transition:all .25s;white-space:nowrap}
.balance:hover{border-color:var(--accent);transform:translateY(-1px)}
.balance.flash-bonus{border-color:var(--gold);box-shadow:0 0 28px rgba(255,184,0,.5);transform:scale(1.03)}
.balance.flash-win{border-color:var(--green);box-shadow:0 0 24px rgba(0,230,118,.5);transform:scale(1.03)}
.balance.flash-lose{border-color:var(--red);box-shadow:0 0 24px rgba(255,56,96,.5)}
.icon-btn{width:40px;height:40px;border-radius:var(--r-md);background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .15s}
.icon-btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.icon-btn.muted{opacity:.5}
.container{max-width:1280px;margin:0 auto;padding:20px}
.nav-tabs{display:flex;gap:8px;margin-bottom:18px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.nav-tabs::-webkit-scrollbar{display:none}
.nav-tab{padding:10px 18px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);font-weight:700;color:var(--muted);font-size:13px;white-space:nowrap;transition:all .2s;display:flex;align-items:center;gap:7px}
.nav-tab:hover{color:var(--text);transform:translateY(-1px)}
.nav-tab.active{color:var(--text);border-color:var(--accent);background:rgba(124,92,255,.12);box-shadow:0 4px 16px rgba(124,92,255,.15)}
.session{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 20px;margin-bottom:18px;display:flex;gap:22px;align-items:center;flex-wrap:wrap;font-size:13px;box-shadow:0 4px 20px rgba(0,0,0,.15)}
.session .label{color:var(--muted);font-weight:600}
.session .value{font-weight:800;font-variant-numeric:tabular-nums}
.session .value.green{color:var(--green)}
.session .value.red{color:var(--red)}
.session .value.gold{color:var(--gold)}
.session .spacer{margin-left:auto}
.bonus-hint{font-size:12px;color:var(--gold);font-weight:700;cursor:pointer;padding:6px 12px;border-radius:8px;background:rgba(255,184,0,.1);border:1px solid rgba(255,184,0,.2);transition:all .2s}
.bonus-hint:hover{background:rgba(255,184,0,.2)}
.sport-filters{display:flex;gap:8px;margin-bottom:18px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.sport-filters::-webkit-scrollbar{display:none}
.sport-chip{padding:10px 18px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);font-weight:700;color:var(--muted);font-size:13px;white-space:nowrap;transition:all .2s;display:flex;align-items:center;gap:7px}
.sport-chip:hover{color:var(--text);transform:translateY(-1px)}
.sport-chip.active{color:var(--text);border-color:var(--accent);background:rgba(124,92,255,.12);box-shadow:0 4px 16px rgba(124,92,255,.15)}
.matches-list{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:900px){.matches-list{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1400px){.matches-list{grid-template-columns:repeat(3,1fr)}}
.match{background:var(--card);border:1px solid var(--border);border-radius:var(--r-xl);padding:20px;display:flex;flex-direction:column;gap:16px;transition:all .25s;box-shadow:0 4px 20px rgba(0,0,0,.15)}
.match:hover{border-color:var(--border-2);transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,0,0,.25)}
.match.finished{opacity:.5}
.match-head{display:flex;align-items:center;gap:10px}
.match-sport{font-size:18px}
.match-league{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.match-status{font-size:10px;padding:5px 12px;border-radius:8px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;white-space:nowrap}
.match-status.live{background:var(--red);color:#fff;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
.match-status.live::before{content:'●';margin-right:5px;font-size:9px}
.match-status.finished{background:rgba(120,120,140,.2);color:var(--muted)}
.match-status.countdown{background:var(--accent-2);color:#000}
.teams{display:flex;flex-direction:column;gap:12px}
.team-line{display:flex;align-items:center;justify-content:space-between;gap:12px}
.team-info{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.team-logo-wrap{position:relative;flex-shrink:0}
.team-logo{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;color:#fff;border:2px solid rgba(255,255,255,.12);box-shadow:0 4px 12px rgba(0,0,0,.3)}
.team-logo.scored{animation:avScore 1.2s ease}
@keyframes avScore{0%,100%{transform:scale(1)}40%{transform:scale(1.4);box-shadow:0 0 28px var(--green)}}
.team-rating{position:absolute;top:-4px;right:-4px;background:var(--bg);border:1px solid var(--border);border-radius:6px;font-size:9px;font-weight:800;padding:2px 6px;color:var(--accent-2)}
.team-flag{position:absolute;bottom:-4px;right:-4px;font-size:14px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.team-name{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team-score{font-weight:900;font-size:28px;font-variant-numeric:tabular-nums;letter-spacing:-1.5px;min-width:36px;text-align:right;transition:all .3s}
.team-score.scored{animation:scFlash 1.2s ease}
@keyframes scFlash{0%,100%{transform:scale(1)}30%{transform:scale(1.6);text-shadow:0 0 28px var(--green);color:var(--green)}}
.match-info{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);padding:10px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);font-weight:600;flex-wrap:wrap}
.match-info .time{font-weight:800;color:var(--text-2);font-variant-numeric:tabular-nums}
.prob-bar{display:flex;height:5px;border-radius:3px;overflow:hidden;margin-top:4px;background:rgba(120,120,160,.15)}
.prob-bar i{display:block;height:100%;transition:width .5s}
.prob-bar .ph{background:var(--accent-2)}
.prob-bar .pd{background:var(--muted)}
.prob-bar .pa{background:var(--red)}
.progress{display:flex;gap:4px;height:5px}
.progress-seg{flex:1;background:rgba(120,120,160,.15);border-radius:3px;overflow:hidden;position:relative}
.progress-seg.done{background:var(--green)}
.progress-seg.active::after{content:'';position:absolute;left:0;top:0;bottom:0;width:var(--p,0%);background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .5s}
.ufc-result{background:linear-gradient(135deg,rgba(255,184,0,.15),rgba(255,56,96,.08));border:1px solid rgba(255,184,0,.4);border-radius:var(--r-md);padding:14px;font-size:13px;font-weight:700;line-height:1.5}
.ufc-result .win{color:var(--gold);font-weight:900}
.odds-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.odds-row.two-col{grid-template-columns:1fr 1fr}
.odd-btn{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-md);padding:14px 10px;text-align:center;display:flex;flex-direction:column;gap:5px;transition:all .2s;font-family:inherit;color:var(--text)}
.odd-btn:hover:not(:disabled):not(.disabled){border-color:var(--accent);background:var(--card-hover);transform:translateY(-2px);box-shadow:0 6px 20px rgba(124,92,255,.2)}
.odd-btn:active:not(:disabled):not(.disabled){transform:scale(.97)}
.odd-btn:disabled,.odd-btn.disabled{opacity:.25;cursor:not-allowed}
.odd-btn.up{border-color:rgba(0,230,118,.5);background:rgba(0,230,118,.05)}
.odd-btn.down{border-color:rgba(255,56,96,.5);background:rgba(255,56,96,.05)}
.odd-label{font-size:11px;color:var(--muted);font-weight:700}
.odd-value{font-size:18px;font-weight:800;color:var(--accent-2);font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.extras{border-top:1px solid var(--border);padding-top:14px}
.extras-toggle{color:var(--accent-2);font-size:13px;font-weight:800;display:flex;align-items:center;gap:8px;padding:6px 0;transition:color .2s}
.extras-toggle:hover{color:var(--accent)}
.extras-toggle.open{color:var(--muted)}
.extras-grid{display:none;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.extras-grid.open{display:grid;animation:fadeIn .3s}
@media(min-width:600px){.extras-grid{grid-template-columns:repeat(3,1fr)}}
.odd-mini{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;min-width:0;transition:all .2s;font-family:inherit;color:var(--text)}
.odd-mini:hover:not(.disabled){border-color:var(--accent);transform:translateY(-1px);box-shadow:0 4px 12px rgba(124,92,255,.15)}
.odd-mini.disabled{opacity:.25;cursor:not-allowed}
.odd-mini-label{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;font-weight:600}
.odd-mini-value{font-size:13px;font-weight:800;color:var(--accent-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:80px 20px;color:var(--muted)}
.empty-icon{font-size:56px;margin-bottom:16px;opacity:.4}
.empty-text{font-size:15px;font-weight:600}
.history-filters{display:flex;gap:8px;margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.history-filters::-webkit-scrollbar{display:none}
.history-chip{padding:9px 16px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);font-weight:700;color:var(--muted);font-size:12.5px;white-space:nowrap;transition:all .2s}
.history-chip:hover{color:var(--text);transform:translateY(-1px)}
.history-chip.active{color:var(--text);border-color:var(--accent);background:rgba(124,92,255,.1)}
.history-list{display:flex;flex-direction:column;gap:12px}
.history-item{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 18px;display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:all .2s;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.history-item:hover{border-color:var(--border-2);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.history-item.won{border-left:4px solid var(--green)}
.history-item.lost{border-left:4px solid var(--red)}
.history-item.pending{border-left:4px solid var(--gold)}
.history-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.history-match{font-weight:700;font-size:14.5px;line-height:1.35}
.history-meta{font-size:11.5px;color:var(--muted);margin-top:4px;font-weight:600}
.history-amount{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.history-foot{display:flex;justify-content:space-between;align-items:center;gap:14px;padding-top:12px;border-top:1px solid var(--border)}
.history-odd{font-size:12.5px;color:var(--muted);font-weight:600}
.history-odd b{color:var(--accent-2);font-weight:800}
.history-status{font-weight:800;padding:5px 14px;border-radius:8px;text-transform:uppercase;letter-spacing:.5px;font-size:10.5px;white-space:nowrap}
.history-status.won{background:rgba(0,230,118,.15);color:var(--green)}
.history-status.lost{background:rgba(255,56,96,.15);color:var(--red)}
.history-status.pending{background:rgba(255,184,0,.15);color:var(--gold)}
.cashout-btn{background:linear-gradient(135deg,var(--green),#00b050);color:#000;padding:11px 20px;border-radius:var(--r-md);font-weight:800;font-size:13px;align-self:flex-start;transition:all .2s;box-shadow:0 4px 16px rgba(0,230,118,.3)}
.cashout-btn:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(0,230,118,.4)}
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:22px}
@media(min-width:700px){.stats-grid{grid-template-columns:repeat(4,1fr)}}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;box-shadow:0 4px 16px rgba(0,0,0,.12);transition:all .2s}
.stat-card:hover{border-color:var(--border-2);transform:translateY(-2px)}
.stat-label{font-size:11.5px;color:var(--muted);margin-bottom:8px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.stat-value{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.8px}
.stat-value.green{color:var(--green)}
.stat-value.red{color:var(--red)}
.stat-value.gold{color:var(--gold)}
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:22px;margin-bottom:18px;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.chart-title{font-size:12.5px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.8px;margin-bottom:18px}
.chart-canvas{width:100%;height:220px;display:block}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.ach{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px 14px;text-align:center;opacity:.35;transition:all .3s;box-shadow:0 4px 16px rgba(0,0,0,.1)}
.ach.unlocked{opacity:1;border-color:var(--gold);box-shadow:0 0 32px rgba(255,184,0,.2);transform:translateY(-2px)}
.ach-icon{font-size:36px;margin-bottom:12px}
.ach-name{font-size:12.5px;font-weight:800;margin-bottom:4px}
.ach-desc{font-size:10.5px;color:var(--muted);font-weight:600}
.leaderboard{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.lb-header{color:var(--muted);font-size:13px;margin-bottom:16px;font-weight:700}
.lb-header b{color:var(--gold);font-weight:900}
.lb-row{display:grid;grid-template-columns:48px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--border);font-size:13.5px;transition:all .2s}
.lb-row:last-child{border-bottom:none}
.lb-row.me{background:rgba(124,92,255,.12);margin:0 -20px;padding:14px 20px;border-radius:var(--r-md);border-bottom:none;box-shadow:0 0 20px rgba(124,92,255,.15)}
.lb-rank{font-weight:900;font-size:17px;color:var(--muted);text-align:center}
.lb-rank.top1{color:var(--gold)}
.lb-rank.top2{color:#c0c0c0}
.lb-rank.top3{color:#cd7f32}
.lb-name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-name.me{color:var(--accent-2)}
.lb-value{font-weight:800;color:var(--green);font-variant-numeric:tabular-nums;font-size:13.5px}
.tab-content{display:none}
.tab-content.active{display:block;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal-overlay.active{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border-2);border-radius:var(--r-xl);padding:28px;max-width:460px;width:100%;max-height:90vh;overflow-y:auto;animation:popIn .3s;box-shadow:0 20px 60px rgba(0,0,0,.5)}
@keyframes popIn{from{transform:scale(.93);opacity:0}}
.modal h3{font-size:18px;margin-bottom:8px;font-weight:800}
.modal-sub{color:var(--muted);font-size:13px;margin-bottom:22px;line-height:1.5;font-weight:600}
.modal-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);font-size:13.5px}
.modal-row:last-of-type{border-bottom:none}
.modal-row .label{color:var(--muted);font-weight:600}
.modal-row .value{font-weight:800;font-variant-numeric:tabular-nums}
.modal input[type="number"]{width:100%;background:var(--card);border:1px solid var(--border);padding:16px;border-radius:var(--r-md);font-size:17px;margin:18px 0 14px;font-weight:800;font-variant-numeric:tabular-nums;transition:all .2s}
.modal input[type="number"]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,92,255,.15)}
.quick-stakes{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:18px}
.quick-stake{padding:11px 4px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);font-size:11.5px;font-weight:800;text-align:center;transition:all .2s}
.quick-stake:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 4px 12px rgba(124,92,255,.15)}
.modal-actions{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;padding:15px;border-radius:var(--r-md);font-weight:800;font-size:14px;transition:all .2s}
.btn:active:not(:disabled){transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;box-shadow:0 4px 20px rgba(124,92,255,.35)}
.btn-primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 28px rgba(124,92,255,.45)}
.btn-secondary{background:var(--card);border:1px solid var(--border)}
.btn-secondary:hover{border-color:var(--border-2)}
.btn-coupon{background:rgba(124,92,255,.15);border:1px solid var(--accent);color:var(--accent-2)}
.btn-coupon:hover{background:rgba(124,92,255,.25)}
.btn-builder{background:rgba(255,184,0,.15);border:1px solid var(--gold);color:var(--gold)}
.btn-builder:hover{background:rgba(255,184,0,.25)}
.coupon-bar{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:2px solid var(--accent);padding:14px 20px;transform:translateY(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);z-index:200;box-shadow:0 -12px 48px rgba(0,0,0,.5)}
.coupon-bar.active{transform:translateY(0)}
.coupon-inner{max-width:1280px;margin:0 auto}
.coupon-items{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;margin-bottom:10px}
.coupon-items::-webkit-scrollbar{height:4px}
.coupon-items::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:2px}
.coupon-item{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:10px 14px;display:flex;align-items:center;gap:12px;min-width:220px;font-size:12px;transition:all .2s}
.coupon-item-info{flex:1;min-width:0}
.coupon-item-match{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

function poissonP(k, l) {
  if (k < 0) return 0;
  if (k > 20) return 0;
  if (l <= 1e-9) return k === 0 ? 1 : 0;
  let lf = 0;
  for (let i = 2; i <= k; i++) lf += Math.log(i);
  return Math.exp(k * Math.log(l) - l - lf);
}

/* Маржа 4% накладывается ПОСЛЕ нормализации. Все кэфы = 1/p * (1 - margin).
   Это даёт сумму вероятностей рынка ≈ 1.04, что = 4% маржа. */
const MARGIN = 0.04;
function probToOdd(p) {
  if (p <= 0.001) return null;
  if (p >= 0.985) return null;
  const odd = (1 / p) * (1 - MARGIN);
  if (odd < 1.05) return null;
  if (odd > 30) return null;       // ЖЁСТКИЙ КЭП
  return Math.floor(odd * 100) / 100;
}
const isValid = (o) => typeof o === 'number' && !isNaN(o) && o >= 1.05 && o <= 30;

/* Базовый xG: средняя команда забивает BASE_XG голов за матч
   Футбол: 1.35 (это среднее по топ-лигам)
   Хоккей: 2.9 (среднее по NHL) — но в пересчёте на 60 мин
*/
const BASE_XG = { football: 1.35, hockey: 2.9 };

/* Домашнее преимущество — применяется как множитель */
const HOME_ADV = { football: 1.15, hockey: 1.10 };

/* Ожидаемое число голов за оставшееся время
   xG_total_home = BASE_XG * atkHome * defAway * homeAdv
   lambda = xG_total_home * (rem / totalMin)
*/
function expectedLambdas(m) {
  const sport = m.sport;
  const totalMin = sport === 'football' ? 90 : 60;
  const rem = Math.max(0.01, m.maxMinute - m.minute);
  const frac = rem / totalMin;

  const base = BASE_XG[sport];
  // xG на весь матч
  const xgHomeFull = base * m.homeAtk * m.awayDef * HOME_ADV[sport];
  const xgAwayFull = base * m.awayAtk * m.homeDef / HOME_ADV[sport];

  // Momentum влияет ±15%
  const momBoost = 1 + m.momentum * 0.15;

  const lamHome = xgHomeFull * frac * momBoost;
  const lamAway = xgAwayFull * frac / momBoost;

  return { lamHome, lamAway };
}

/* Футбол/хоккей — вероятность победы хозяев из текущего счёта
   Через интегрирование Пуассона остатка */
function probHomeWinFootball(m) {
  const { lamHome, lamAway } = expectedLambdas(m);
  const MAXG = 12;
  let pH = 0, pD = 0, pA = 0;
  for (let h = 0; h <= MAXG; h++) {
    const ph = poissonP(h, lamHome);
    if (ph < 1e-9) continue;
    for (let a = 0; a <= MAXG; a++) {
      const pa = poissonP(a, lamAway);
      if (pa < 1e-9) continue;
      const p = ph * pa;
      const fh = m.scoreHome + h, fa = m.scoreAway + a;
      if (fh > fa) pH += p; else if (fh === fa) pD += p; else pA += p;
    }
  }
  const t = pH + pD + pA || 1;
  return { pH: pH/t, pD: pD/t, pA: pA/t };
}

/* UFC — вероятность победы хозяина
   Разница рейтингов → логистическая функция
   Прогресс боя сжимает к 0.5 только если никто не финишировал */
function probHomeWinUFC(m) {
  const diff = (m.homeRating - m.awayRating) / 300;
  let pH = 1 / (1 + Math.pow(10, -diff));
  // Прогресс уменьшает уверенность
  const progress = m.minute / m.maxMinute;
  pH = 0.5 + (pH - 0.5) * (1 - progress * 0.5);
  return clamp(pH, 0.05, 0.95);
}

/* Волейбол — вероятность победы в матче
   Считаем через: вероятность выиграть текущий сет × вероятность на оставшиеся */
function probHomeWinVolley(m) {
  // Сила команд
  const atkDiff = m.homeAtk - m.awayAtk;
  // Вероятность выиграть розыгрыш
  const pRally = clamp(0.5 + atkDiff * 0.15, 0.35, 0.65);

  function probHomeWinVolley(m) {
  const atkDiff = m.homeAtk - m.awayAtk;
  const pRally = clamp(0.5 + atkDiff * 0.15, 0.35, 0.65);

  /* Вероятность выиграть текущий сет из счёта (h, a) до target.
     DP со строгими границами: сет гарантированно закончится к h+a = 2*target.
  */
  function probWinSet(h, a, target, pRally) {
    const memo = {};
    function f(h, a) {
      // Завершение
      if (h >= target && h - a >= 2) return 1;
      if (a >= target && a - h >= 2) return 0;
      // Жёсткий предохранитель: не больше чем 2*target + 5 суммарных очков
      if (h + a >= 2 * target + 5) {
        return h > a ? 1 : 0;
      }
      const key = h * 100 + a;
      if (memo[key] !== undefined) return memo[key];
      const r = pRally * f(h + 1, a) + (1 - pRally) * f(h, a + 1);
      memo[key] = r;
      return r;
    }
    return f(h, a);
  }

  const target = (m.setsHome === 2 && m.setsAway === 2) ? 15 : 25;
  const pCurrentSet = probWinSet(m.pointsHome, m.pointsAway, target, pRally);

  // Вероятность выиграть отдельно взятый сет (для будущих сетов)
  const pSetWin = clamp(0.5 + atkDiff * 0.20, 0.30, 0.70);

  // Считаем сколько сетов осталось выиграть каждой команде
  const setsToWinH = 3 - m.setsHome;
  const setsToWinA = 3 - m.setsAway;

  // Вероятность выиграть матч из позиции "нужно needW сетов, у соперника needL"
  // через биномиальное распределение
  function binomP(n, k, p) {
    if (k < 0 || k > n) return 0;
    let c = 1;
    for (let i = 1; i <= k; i++) c = c * (n - i + 1) / i;
    return c * Math.pow(p, k) * Math.pow(1 - p, n - k);
  }
  function probWinSeries(needW, needL, p) {
    if (needW <= 0) return 1;
    if (needL <= 0) return 0;
    let total = 0;
    for (let losses = 0; losses < needL; losses++) {
      const other = needW + losses - 1;
      total += binomP(other, needW - 1, p) * Math.pow(1 - p, losses) * p;
    }
    return total;
  }

  const pWinRestIfTakeSet = probWinSeries(setsToWinH - 1, setsToWinA, pSetWin);
  const pWinRestIfLoseSet = probWinSeries(setsToWinH, setsToWinA - 1, pSetWin);

  return clamp(
    pCurrentSet * pWinRestIfTakeSet + (1 - pCurrentSet) * pWinRestIfLoseSet,
    0.02, 0.98
  );
}
  const target = (m.setsHome === 2 && m.setsAway === 2) ? 15 : 25;
  let pCurrentSet = probWinSet(m.pointsHome, m.pointsAway, target);

  // Сколько сетов осталось выиграть команде для победы в матче
  const setsToWinH = 3 - m.setsHome;
  const setsToWinA = 3 - m.setsAway;

  // Упрощённая модель оставшихся сетов:
  // Если команда выигрывает текущий сет, дальше ей нужно меньше
  // Используем простую формулу: P(win match) = P(win cur) * P(win needed from sets-1)
  // Заменяем: считаем что в каждом новом сете pH = pRally_adjusted (чуть ближе к 0.5)
  const pSetWin = clamp(0.5 + atkDiff * 0.20, 0.30, 0.70);

  // Число оставшихся сетов: setsToWinH - 1 (если выиграет текущий) + 0
  // Считаем через биномиалку: сколько сетов из оставшихся нужно выиграть
  function binomP(n, k, p) {
    if (k < 0 || k > n) return 0;
    let c = 1;
    for (let i = 1; i <= k; i++) c = c * (n - i + 1) / i;
    return c * Math.pow(p, k) * Math.pow(1 - p, n - k);
  }
  function probWinRemaining(needW, needL, p) {
    // Вероятность выиграть needW сетов прежде чем проиграть needL
    if (needW <= 0) return 1;
    if (needL <= 0) return 0;
    let total = 0;
    // Выигрыш в i+1 сетах (i проигрышей подряд перед победой)
    for (let losses = 0; losses < needL; losses++) {
      const winsNeeded = needW;
      // Всего сетов: winsNeeded + losses; последний — победа
      const other = winsNeeded + losses - 1;
      total += binomP(other, winsNeeded - 1, p) * Math.pow(1 - p, losses) * p;
    }
    return total;
  }

  // P(win match) = P(win cur) * P(win rest given we won) + (1-P) * P(win rest given we lost)
  const pWinCur = pCurrentSet;
  const pWinRestIfWin = probWinRemaining(setsToWinH - 1, setsToWinA, pSetWin);
  const pWinRestIfLose = probWinRemaining(setsToWinH, setsToWinA - 1, pSetWin);

  return clamp(pWinCur * pWinRestIfWin + (1 - pWinCur) * pWinRestIfLose, 0.02, 0.98);
}

/* Общая функция вероятностей исходов */
function computeProbs(m) {
  if (m.status === 'finished' || m.status === 'countdown') {
    return { home: null, draw: null, away: null, pH: null, pD: null, pA: null };
  }

  if (m.sport === 'ufc') {
    const pH = probHomeWinUFC(m);
    const pA = 1 - pH;
    return { home: probToOdd(pH), away: probToOdd(pA), draw: null, pH, pD: null, pA };
  }

  if (m.sport === 'volleyball') {
    const pH = probHomeWinVolley(m);
    const pA = 1 - pH;
    return { home: probToOdd(pH), away: probToOdd(pA), draw: null, pH, pD: null, pA };
  }

  // Футбол/хоккей
  const { pH, pD, pA } = probHomeWinFootball(m);
  return {
    home: probToOdd(pH), draw: probToOdd(pD), away: probToOdd(pA),
    pH, pD, pA
  };
}

/* ============ РАСШИРЕННЫЕ РЫНКИ ============ */
function computeExtras(m) {
  if (m.status === 'finished' || m.status === 'countdown') return {};
  const out = {};
  const add = (label, p) => {
    const o = probToOdd(p);
    if (o !== null) out[label] = o;
  };

  /* ---------- UFC ---------- */
  if (m.sport === 'ufc') {
    const pH = probHomeWinUFC(m);
    const pA = 1 - pH;
    const roundNum = m.round;
    const minInRound = m.minute - (roundNum - 1) * 24;

    // Если раунд уже прошёл — соответствующие ТБ уже зашли
    // ТБ 2.5 раундов = бой прошёл 2.5 раунда = находится в 3-м и далее
    // ТБ 3.5 раундов = в 4-м и далее
    const finished = m.finalResult;
    const method = finished ? finished.method : null;
    const winR = finished ? finished.round : roundNum;
    const isFin = method && method !== 'Решение';

    // Метод победы:
    // Если бой уже закончился — всё определено, не показываем
    // Если идёт:
    //   pFinishing = шанс что бой закончится досрочно
    //   pDecision = шанс что дойдёт до решения
    //   Шанс финиша за оставшиеся раунды
    const roundsLeft = 5 - roundNum + 1;
    // Базовая интенсивность финиша на раунд:
    // 1-й раунд: 0.35, 2-й: 0.30, 3-й: 0.22, 4-й: 0.15, 5-й: 0.10
    const finRateByRound = [0.35, 0.30, 0.22, 0.15, 0.10];
    let pFinTotal = 1;
    for (let r = roundNum; r <= 5; r++) {
      // Скорректировать на разницу рейтингов: фаворит чаще финиширует
      const rIdx = r - 1;
      const rate = finRateByRound[rIdx];
      // Если в текущем раунде уже прошла часть — уменьшаем
      let curRate = rate;
      if (r === roundNum) {
        const remainInRound = (24 - minInRound) / 24;
        curRate = rate * remainInRound;
      }
      pFinTotal *= (1 - curRate);
    }
    let pFinishFuture = 1 - pFinTotal;
    // Калибровка: шанс решения ограничен
    pFinishFuture = clamp(pFinishFuture, 0.05, 0.85);
    const pDec = 1 - pFinishFuture;
    const pKO = pFinishFuture * 0.65;
    const pSub = pFinishFuture * 0.35;

    add('KO/TKO', pKO);
    add('Сабмишн', pSub);
    add('Решение', pDec);
    add('Бой досрочно', pFinishFuture);
    add('Вся дистанция', pDec);

    // Тоталы раундов: если раунд уже в прошлом — рынок закрыт
    if (roundNum < 3) {
      const pOver = pFinishFuture < 0.5 ? 0.55 : 0.45;
      const pOver25 = clamp(0.6 + (roundNum - 1) * 0.05 - pFinishFuture * 0.3, 0.2, 0.85);
      add('ТБ 2.5 раундов', pOver25);
      add('ТМ 2.5 раундов', 1 - pOver25);
    }
    if (roundNum < 4) {
      const pOver35 = clamp(0.55 + (roundNum - 1) * 0.05 - pFinishFuture * 0.4, 0.15, 0.85);
      add('ТБ 3.5 раундов', pOver35);
      add('ТМ 3.5 раундов', 1 - pOver35);
    }

    // Метод + победитель (убрать устаревшие)
    if (roundNum < 5) {
      add(m.home + ' KO/TKO', pH * pKO * 0.95);
      add(m.home + ' Сабмишн', pH * pSub * 0.95);
      add(m.home + ' Решение', pH * pDec * 0.95);
      add(m.away + ' KO/TKO', pA * pKO * 0.95);
      add(m.away + ' Сабмишн', pA * pSub * 0.95);
      add(m.away + ' Решение', pA * pDec * 0.95);
    }
    return out;
  }

  /* ---------- ВОЛЕЙБОЛ ---------- */
  if (m.sport === 'volleyball') {
    const pH = probHomeWinVolley(m);
    const pA = 1 - pH;
    const setsPlayed = m.setsHome + m.setsAway;
    const setsToWinH = 3 - m.setsHome;
    const setsToWinA = 3 - m.setsAway;
    const totalSetsMin = setsPlayed + Math.min(setsToWinH, setsToWinA);

    // ТБ/ТМ по сетам
    // Всего сетов будет: минимум setsPlayed + 1, максимум 5
    // Если сетов уже 4 — тотал почти определён
    // Считаем распределение числа сетов
    if (setsPlayed < 5) {
      // P(матч закончится в N сетах) где N = setsPlayed + k
      const pSetWin = clamp(0.5 + (m.homeAtk - m.awayAtk) * 0.20, 0.30, 0.70);
      // Вероятность что матч закончится за 1 сет (setsPlayed+1):
      // = P(H выиграет setsToWinH сетов подряд) + P(A выиграет setsToWinA подряд)
      function binomP(n, k, p) {
        if (k < 0 || k > n) return 0;
        let c = 1;
        for (let i = 1; i <= k; i++) c = c * (n - i + 1) / i;
        return c * Math.pow(p, k) * Math.pow(1 - p, n - k);
      }
      // Вероятность что матч закончится за N сетов (N от setsPlayed+1 до 5)
      let distr = {};
      let remainingP = 1;
      for (let finalSets = setsPlayed + 1; finalSets <= 5; finalSets++) {
        const extraSets = finalSets - setsPlayed;
        if (extraSets === 1) {
          // Закончится следующим сетом
          const pH_Win = (m.setsHome + 1 >= 3) ? 1 : 0;
          const pA_Win = (m.setsAway + 1 >= 3) ? 1 : 0;
          // Реально: матч закончится только если кто-то набирает 3 сета
          // Если pH 2 и pA 0: нужен 1 сет
          const h = m.setsHome, a = m.setsAway;
          const pFinish = (h === 2 ? pSetWin : 0) + (a === 2 ? (1 - pSetWin) : 0);
          distr[finalSets] = pFinish;
          remainingP = 1 - pFinish;
        } else {
          // 2+ сетов впереди
          distr[finalSets] = remainingP * 0; // будет учтено
        }
      }
      // Упрощённо: вероятность что тотал < 3.5 / 4.5 / 5.5
      // Считаем через Монте-Карло 500 итераций
      let cnt = { 3: 0, 4: 0, 5: 0 };
      for (let trial = 0; trial < 300; trial++) {
        let sh = m.setsHome, sa = m.setsAway;
        let guard = 0;
        while (sh < 3 && sa < 3 && guard++ < 10) {
          if (Math.random() < pSetWin) sh++; else sa++;
        }
        const total = sh + sa;
        if (total <= 3) cnt[3]++;
        else if (total === 4) cnt[4]++;
        else cnt[5]++;
      }
      const p3 = cnt[3] / 300;
      const p4 = cnt[4] / 300;
      const p5 = cnt[5] / 300;
      // ТБ 3.5 = больше 3.5 сетов = 4 или 5
      add('ТБ 3.5 сетов', p4 + p5);
      add('ТМ 3.5 сетов', p3);
      // ТБ 4.5 = ровно 5
      add('ТБ 4.5 сетов', p5);
      add('ТМ 4.5 сетов', p3 + p4);

      // Победа в следующем сете
      const nextSet = setsPlayed + 1;
      if (nextSet <= 5) {
        // Вероятность победы в след сете через силу
        const pNextH = clamp(0.5 + (m.homeAtk - m.awayAtk) * 0.18, 0.30, 0.70);
        add('Победа в ' + nextSet + '-м сете · П1', pNextH);
        add('Победа в ' + nextSet + '-м сете · П2', 1 - pNextH);
      }
    }

    // Точный счёт (из оставшихся сценариев)
    // H выиграл 3:0, 3:1, 3:2 / A выиграл 0:3, 1:3, 2:3
    const pH_win_30 = (m.setsAway === 0 && m.setsHome <= 2) ? Math.pow(pSetWinCalc(m), 3 - m.setsHome) * 0.5 : 0;
    // Упростим через симуляцию
    let scores = {};
    for (let trial = 0; trial < 500; trial++) {
      let sh = m.setsHome, sa = m.setsAway;
      let guard = 0;
      const pSW = clamp(0.5 + (m.homeAtk - m.awayAtk) * 0.20, 0.30, 0.70);
      while (sh < 3 && sa < 3 && guard++ < 10) {
        if (Math.random() < pSW) sh++; else sa++;
      }
      const key = sh + ':' + sa;
      scores[key] = (scores[key] || 0) + 1;
    }
    Object.keys(scores).forEach(k => {
      const p = scores[k] / 500;
      if (p > 0.02) add('Счёт ' + k, p * 1.02);
    });

    return out;
  }

  /* ---------- ФУТБОЛ / ХОККЕЙ ---------- */
  const { lamHome, lamAway } = expectedLambdas(m);
  const MAXG = 10;
  // Матрица вероятностей итогового счёта
  const matrix = {};
  let totalP = 0;
  for (let h = 0; h <= MAXG; h++) {
    const ph = poissonP(h, lamHome);
    if (ph < 1e-10) continue;
    for (let a = 0; a <= MAXG; a++) {
      const pa = poissonP(a, lamAway);
      if (pa < 1e-10) continue;
      const p = ph * pa;
      const fh = m.scoreHome + h, fa = m.scoreAway + a;
      const key = fh + ':' + fa;
      matrix[key] = (matrix[key] || 0) + p;
      totalP += p;
    }
  }
  for (const k in matrix) matrix[k] /= totalP;

  const isF = m.sport === 'football';

  // Двойной шанс
  let pH = 0, pD = 0, pA = 0;
  for (const [k, p] of Object.entries(matrix)) {
    const [h, a] = k.split(':').map(Number);
    if (h > a) pH += p; else if (h === a) pD += p; else pA += p;
  }
  if (isF) {
    add('1X', pH + pD);
    add('12', pH + pA);
    add('X2', pD + pA);
  }

  // Тоталы
  const sumOver = (line) => {
    let s = 0;
    for (const [k, p] of Object.entries(matrix)) {
      const [h, a] = k.split(':').map(Number);
      if (h + a > line) s += p;
    }
    return s;
  };
  const lines = isF ? [0.5, 1.5, 2.5, 3.5, 4.5] : [3.5, 4.5, 5.5, 6.5, 7.5];
  lines.forEach(l => {
    const pO = sumOver(l);
    if (pO > 0.01 && pO < 0.99) {
      add('ТБ ' + l, pO);
      add('ТМ ' + l, 1 - pO);
    }
  });

  // Форы
  const sumHand = (line) => {
    let s = 0;
    for (const [k, p] of Object.entries(matrix)) {
      const [h, a] = k.split(':').map(Number);
      if (h - a > line) s += p;
    }
    return s;
  };
  const linesH = isF ? [1.5, 2.5] : [1.5, 2.5];
  linesH.forEach(l => {
    const p1 = sumHand(l);
    const p2 = 1 - sumHand(-l);
    add('Ф1 −' + l, p1);
    add('Ф1 +' + l, 1 - p1);
    add('Ф2 −' + l, p2);
    add('Ф2 +' + l, 1 - p2);
  });

  // Обе забьют
  let pBtts = 0;
  for (const [k, p] of Object.entries(matrix)) {
    const [h, a] = k.split(':').map(Number);
    if (h >= 1 && a >= 1) pBtts += p;
  }
  add('Обе · Да', pBtts);
  add('Обе · Нет', 1 - pBtts);

  // Чёт/Нечет
  let pEven = 0;
  for (const [k, p] of Object.entries(matrix)) {
    const [h, a] = k.split(':').map(Number);
    if ((h + a) % 2 === 0) pEven += p;
  }
  add('Чёт', pEven);
  add('Нечет', 1 - pEven);

  // Точные счета — топ 5
  const topScores = Object.entries(matrix)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 5);
  topScores.forEach(([k, p]) => {
    if (p > 0.02) add('Счёт ' + k, p * 1.03);
  });

  return out;
}

function pSetWinCalc(m) {
  return clamp(0.5 + (m.homeAtk - m.awayAtk) * 0.20, 0.30, 0.70);
}

let audio = null;
function beep(f, d, t, v) {
  if (!soundOn) return;
  t = t || 'sine'; v = v || 0.08;
  try {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = t; o.frequency.value = f;
    g.gain.setValueAtTime(v, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + d);
    o.connect(g); g.connect(audio.destination);
    o.start(); o.stop(audio.currentTime + d);
  } catch (e) {}
}

/* ============ СИМУЛЯЦИЯ ============ */

function simulateMinute(m, fast) {
  if (m.status !== 'live') return;
  m.minute += 1;
  m.momentum *= 0.94;
  m.justScored = null;

  if (m.sport === 'ufc') return simulateUFC(m);
  if (m.sport === 'volleyball') return simulateVolley(m);

  // Футбол/хоккей
  if (m.minute >= m.maxMinute) {
    m.status = 'finished';
    m.finishedAt = Date.now();
    return;
  }
  const { lamHome, lamAway } = expectedLambdas(m);
  const totalMin = m.sport === 'football' ? 90 : 60;
  // Ожидаемое за 1 минуту
  const perMinHome = lamHome / (m.maxMinute - m.minute + 1);
  const perMinAway = lamAway / (m.maxMinute - m.minute + 1);
  // По формуле Пуассона P(k>=1) ≈ λ при λ << 1
  if (Math.random() < perMinHome) {
    m.scoreHome += 1;
    m.momentum = Math.min(1, m.momentum + 0.5);
    m.justScored = 'home';
  } else if (Math.random() < perMinAway) {
    m.scoreAway += 1;
    m.momentum = Math.max(-1, m.momentum - 0.5);
    m.justScored = 'away';
  }
}

function simulateUFC(m) {
  const cycle = 24;
  m.round = Math.min(5, Math.floor(m.minute / cycle) + 1);
  const minInRound = m.minute - (m.round - 1) * cycle;

  if (m.minute >= 120) {
    // Решение
    const pH = probHomeWinUFC(m);
    const winner = Math.random() < pH ? 'home' : 'away';
    m.finalResult = { winner, method: 'Решение', round: 5 };
    if (winner === 'home') { m.scoreHome = 1; m.scoreAway = 0; }
    else { m.scoreHome = 0; m.scoreAway = 1; }
    m.status = 'finished';
    m.finishedAt = Date.now();
    return;
  }

  // Вероятность финиша в эту минуту
  // На раунд:
  const finRateByRound = [0.35, 0.30, 0.22, 0.15, 0.10];
  const ratePerRound = finRateByRound[m.round - 1];
  const ratePerMin = ratePerRound / 24;

  const pH = probHomeWinUFC(m);
  const pA = 1 - pH;

  // Кто финиширует — пропорционально силе
  if (Math.random() < ratePerMin) {
    // Метод финиша
    const method = Math.random() < 0.6 ? 'KO/TKO' : 'Сабмишн';
    // Победитель
    const winner = Math.random() < pH ? 'home' : 'away';
    m.finalResult = { winner, method, round: m.round };
    if (winner === 'home') { m.scoreHome = 1; m.scoreAway = 0; m.justScored = 'home'; }
    else { m.scoreHome = 0; m.scoreAway = 1; m.justScored = 'away'; }
    m.status = 'finished';
    m.finishedAt = Date.now();
  }
}

function simulateVolley(m) {
  if (m.minute >= m.maxMinute) {
    if (m.setsHome === m.setsAway) m.setsHome += 1;
    m.status = 'finished';
    m.finishedAt = Date.now();
    return;
  }
  if (m.setsHome >= 3 || m.setsAway >= 3) {
    m.status = 'finished';
    m.finishedAt = Date.now();
    return;
  }
  const isFifth = (m.setsHome === 2 && m.setsAway === 2);
  const target = isFifth ? 15 : 25;

  // Вероятность выиграть розыгрыш
  const pRally = clamp(0.5 + (m.homeAtk - m.awayAtk) * 0.15, 0.35, 0.65);

  // 1-2 розыгрыша за минуту
  const rallies = 1 + (Math.random() < 0.4 ? 1 : 0);
  for (let i = 0; i < rallies; i++) {
    if (Math.random() < pRally) m.pointsHome++;
    else m.pointsAway++;

    // Проверка окончания сета
    if (m.pointsHome >= target && m.pointsHome - m.pointsAway >= 2) {
      m.setsHome++; m.pointsHome = 0; m.pointsAway = 0;
      m.justScored = 'home'; return;
    }
    if (m.pointsAway >= target && m.pointsAway - m.pointsHome >= 2) {
      m.setsAway++; m.pointsHome = 0; m.pointsAway = 0;
      m.justScored = 'away'; return;
    }
  }
}

function renderProgress(m) {
  if (m.status === 'countdown') return '';
  if (m.sport === 'football') {
    const h1 = Math.min(1, m.minute / 45);
    const h2 = Math.max(0, Math.min(1, (m.minute - 45) / 45));
    return '<div class="progress"><div class="progress-seg ' + (h1 >= 1 ? 'done' : 'active') + '" style="--p:' + (h1 * 100) + '%"></div><div class="progress-seg ' + (h2 >= 1 ? 'done' : 'active') + '" style="--p:' + (h2 * 100) + '%"></div></div>';
  }
  if (m.sport === 'hockey') {
    const p1 = Math.min(1, m.minute / 20);
    const p2 = Math.max(0, Math.min(1, (m.minute - 20) / 20));
    const p3 = Math.max(0, Math.min(1, (m.minute - 40) / 20));
    return '<div class="progress"><div class="progress-seg ' + (p1 >= 1 ? 'done' : 'active') + '" style="--p:' + (p1 * 100) + '%"></div><div class="progress-seg ' + (p2 >= 1 ? 'done' : 'active') + '" style="--p:' + (p2 * 100) + '%"></div><div class="progress-seg ' + (p3 >= 1 ? 'done' : 'active') + '" style="--p:' + (p3 * 100) + '%"></div></div>';
  }
  if (m.sport === 'ufc') {
    let segs = '';
    for (let i = 1; i <= 5; i++) {
      const done = m.round > i || (m.status === 'finished' && m.round >= i);
      const active = m.round === i && m.status === 'live';
      let p = 0;
      if (active) p = ((m.minute % 24) / 24) * 100;
      if (done) p = 100;
      segs += '<div class="progress-seg ' + (done ? 'done' : active ? 'active' : '') + '" style="--p:' + Math.min(100, p) + '%"></div>';
    }
    return '<div class="progress">' + segs + '</div>';
  }
  if (m.sport === 'volleyball') {
    let segs = '';
    const totalPlayed = m.setsHome + m.setsAway;
    for (let i = 1; i <= 5; i++) {
      const homeWon = m.setsHome >= i;
      const awayWon = m.setsAway >= (i - m.setsHome) && !homeWon;
      const isCurrent = (totalPlayed + 1) === i && m.status === 'live';
      let cls = '';
      if (homeWon) cls = 'done';
      else if (isCurrent) cls = 'active';
      segs += '<div class="progress-seg ' + cls + '" style="--p:' + (homeWon ? 100 : 0) + '%"></div>';
    }
    return '<div class="progress">' + segs + '</div>';
  }
  return '';
}

  }

    '<div class="stat-card"><div class="stat-label">Баланс</div><div class="stat-value gold">' + fmt(wallet.balance) + ' ₽</div></div>' +
    '<div class="stat-card"><div class="stat-label">Поставлено</div><div class="stat-value">' + fmt(wallet.totalBet) + ' ₽</div></div>' +
    '<div class="stat-card"><div class="stat-label">Выиграно</div><div class="stat-value green">' + fmt(wallet.totalWon) + ' ₽</div></div>' +
    '<div class="stat-card"><div class="stat-label">Профит</div><div class="stat-value ' + (prof >= 0 ? 'green' : 'red') + '">' + (prof >= 0 ? '+' : '') + fmt(prof) + ' ₽</div></div>' +
    '<div class="stat-card"><div class="stat-label">Винрейт</div><div class="stat-value">' + wr + '%</div></div>' +
    '<div class="stat-card"><div class="stat-label">ROI</div><div class="stat-value ' + (parseFloat(roi) >= 0 ? 'green' : 'red') + '">' + roi + '%</div></div>' +

    '<div class="stat-card"><div class="stat-label">Ожидание</div><div class="stat-value gold">' + pend + '</div></div>';

  drawChart();
}

function drawChart() {
  const c = $('profitChart');
  if (!c) return;
  const ctx = c.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const r = c.getBoundingClientRect();
  c.width = r.width * dpr; c.height = r.height * dpr;
  ctx.scale(dpr, dpr);
  const w = r.width, h = r.height;
  ctx.clearRect(0, 0, w, h);
  const hist = wallet.profitHistory;
  if (!hist || hist.length < 2) {
    ctx.fillStyle = '#5a5a7a';
    ctx.font = '13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Играй — график появится', w / 2, h / 2);
    return;
  }
  const min = Math.min.apply(null, hist.map(p => p.v).concat([0]));
  const max = Math.max.apply(null, hist.map(p => p.v).concat([0]));
  const range = max - min || 1;
  ctx.strokeStyle = 'rgba(100,100,140,.1)';
  for (let i = 0; i <= 4; i++) { const y = (h / 4) * i; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
  const step = w / (hist.length - 1);
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, 'rgba(124,92,255,.35)');
  grad.addColorStop(1, 'rgba(124,92,255,0)');
  ctx.beginPath();
  hist.forEach((p, i) => {
    const x = i * step;
    const y = h - ((p.v - min) / range) * h * 0.85 - h * 0.075;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.strokeStyle = '#7c5cff';
  ctx.lineWidth = 2.5;
  ctx.stroke();
  ctx.lineTo(w, h);
  ctx.lineTo(0, h);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();
}

/* ============ СТАВКИ ============ */
function openBetModal(mid, pk, odd) {
  if (!isValid(odd)) return;
  const m = matches.find(x => x.id === mid);
  if (!m || m.status === 'finished' || m.status === 'countdown') return;
  activeBet = { matchId: mid, pick: pk, odd: odd, isBuilder: false, isExpress: false };
  const lbl = pk === 'home' ? m.home : pk === 'away' ? m.away : pk === 'draw' ? 'Ничья' : pk;
  const pl = pk === 'home' ? 'П1' : pk === 'away' ? 'П2' : pk === 'draw' ? 'X' : pk;
  const probs = computeProbs(m);
  let pShown = '—';
  if (pk === 'home' && probs.pH != null) pShown = (probs.pH * 100).toFixed(1) + '%';
  else if (pk === 'draw' && probs.pD != null) pShown = (probs.pD * 100).toFixed(1) + '%';
  else if (pk === 'away' && probs.pA != null) pShown = (probs.pA * 100).toFixed(1) + '%';
  else pShown = ((1 / odd) * 100).toFixed(1) + '%';
  $('betModalTitle').textContent = m.home + ' — ' + m.away;
  $('betModalSub').textContent = pl + ' · ' + lbl;
  $('betModalOdd').textContent = odd.toFixed(2);
  $('betModalProb').textContent = pShown;
  $('betModalStake').value = '';
  $('betModalPotential').textContent = '—';
  $('betModalCoupon').style.display = 'block';
  $('betModalBuilder').style.display = 'block';
  $('betModal').classList.add('active');
  updatePotential();
}

function closeBetModal() {
  $('betModal').classList.remove('active');
  activeBet = null;
}

function updatePotential() {
  if (!activeBet) return;
  const s = parseFloat($('betModalStake').value) || 0;
  $('betModalPotential').textContent = s > 0 ? fmt(s * activeBet.odd) + ' ₽' : '—';
}

function placeBet() {
  if (!activeBet) return;
  const stake = parseFloat($('betModalStake').value);
  if (!stake || stake < 10 || stake > wallet.balance) return;

  if (activeBet.isExpress) {
    const sel = activeBet.selections.map(s => ({ matchId: s.matchId, pick: s.pick, odd: s.odd, label: s.label, match: s.match, status: 'pending' }));
    wallet.balance -= stake;
    wallet.totalBet += stake;
    wallet.bets.unshift({
      id: Date.now(), type: 'express', match: 'Экспресс · ' + sel.length,
      selections: sel, odd: activeBet.odd, stake: stake,
      potential: Math.round(stake * activeBet.odd * 100) / 100,
      status: 'pending', createdAt: new Date().toISOString()
    });
    coupon = [];
    saveCoupon();
    renderCoupon();
  } else if (activeBet.isBuilder) {
    const m = matches.find(x => x.id === activeBet.matchId);
    if (!m) return;
    const sel = activeBet.selections.map(s => ({ matchId: m.id, pick: s.pick, odd: s.odd, label: s.label, match: m.home + ' — ' + m.away, status: 'pending' }));
    wallet.balance -= stake;
    wallet.totalBet += stake;
    wallet.bets.unshift({
      id: Date.now(), type: 'builder', matchId: m.id,
      match: m.home + ' — ' + m.away + ' (билдер)',
      sport: m.sport, selections: sel, odd: activeBet.odd, stake: stake,
      potential: Math.round(stake * activeBet.odd * 100) / 100,
      status: 'pending', createdAt: new Date().toISOString()
    });
    delete builderBets[activeBet.matchId];
  } else {
    const m = matches.find(x => x.id === activeBet.matchId);
    if (!m || m.status === 'finished') return;
    wallet.balance -= stake;
    wallet.totalBet += stake;
    wallet.bets.unshift({
      id: Date.now(), type: 'single', matchId: m.id,
      match: m.home + ' — ' + m.away, sport: m.sport,
      pick: activeBet.pick, odd: activeBet.odd, stake: stake,
      potential: Math.round(stake * activeBet.odd * 100) / 100,
      status: 'pending', minute: m.minute,
      score: (m.scoreHome || 0) + ':' + (m.scoreAway || 0),
      createdAt: new Date().toISOString()
    });
  }
  saveWallet();
  flashBalance('win');
  renderBalance();
  renderHistory();
  renderStats();
  renderAchiv();
  sBet();
  vibe(20);
  closeBetModal();
}

function addBuilder() {
  if (!activeBet) return;
  const mid = activeBet.matchId, pk = activeBet.pick, odd = activeBet.odd;
  if (!builderBets[mid]) builderBets[mid] = [];
  for (let i = 0; i < builderBets[mid].length; i++) {
    const b = builderBets[mid][i];
    if (b.pick === pk) return;
    const t1 = b.pick.match(/^(ТБ|ТМ)\s+([\d.]+)/);
    const t2 = pk.match(/^(ТБ|ТМ)\s+([\d.]+)/);
    if (t1 && t2 && t1[2] === t2[2] && t1[1] !== t2[1]) { alert('Конфликт: ТБ и ТМ на одну линию'); return; }
  }
  builderBets[mid].push({ pick: pk, odd: odd, label: pk === 'home' ? 'П1' : pk === 'away' ? 'П2' : pk === 'draw' ? 'X' : pk });
  const total = builderBets[mid].reduce((a, c) => a * c.odd, 1);
  const m = matches.find(x => x.id === mid);
  closeBetModal();
  activeBet = { matchId: mid, isBuilder: true, odd: total, selections: builderBets[mid].slice() };
  $('betModalTitle').textContent = '🧩 Билдер · ' + m.home + ' — ' + m.away;
  $('betModalSub').textContent = builderBets[mid].map(b => b.label + ' @ ' + b.odd.toFixed(2)).join(' + ');
  $('betModalOdd').textContent = total.toFixed(2);

  $('betModalStake').value = '';
  $('betModalPotential').textContent = '—';
  $('betModalCoupon').style.display = 'none';
  $('betModalBuilder').style.display = 'none';
  $('betModal').classList.add('active');
  updatePotential();
}

/* ============ КЭШАУТ ============ */
function cashoutValue(b, m) {
  if (!m || m.status !== 'live' || b.status !== 'pending') return 0;

  if (b.type === 'express') {
    let cv = 1;
    for (let i = 0; i < b.selections.length; i++) {
      const sel = b.selections[i];
      const sm = matches.find(x => Number(x.id) === Number(sel.matchId));
      if (!sm) return 0;
      if (sm.status === 'finished') {
        if (sel.status === 'lost') return 0;
        if (sel.status !== 'won') return 0;
        continue;
      }
      if (sm.status === 'live') {
        const probs = computeProbs(sm);
        let curOdd = null;
        if (sel.pick === 'home') curOdd = probs.home;
        else if (sel.pick === 'away') curOdd = probs.away;
        else if (sel.pick === 'draw') curOdd = probs.draw;
        else {
          // Рынок из extras — оценим через 1/odd
          curOdd = sel.odd;
        }
        if (!isValid(curOdd)) return 0;
        cv *= 1 / curOdd;
      } else return 0;
    }
    const fairValue = b.potential * cv;
    const pay = Math.max(b.stake * 0.05, fairValue * 0.92);
    return Math.min(pay, b.potential * 0.98);
  }

  if (b.type === 'builder') {
    const sm = matches.find(x => Number(x.id) === Number(b.matchId));
    if (!sm || sm.status !== 'live') return 0;
    const remaining = 1 - sm.minute / sm.maxMinute;
    return Math.round(b.stake * (0.4 + remaining * 0.4) * 100) / 100;
  }

  const probs = computeProbs(m);
  let curOdd = null;
  if (b.pick === 'home') curOdd = probs.home;
  else if (b.pick === 'away') curOdd = probs.away;
  else if (b.pick === 'draw') curOdd = probs.draw;
  else {
    // Рынок из extras — берём fair из последнего расчёта
    const extras = computeExtras(m);
    curOdd = extras[b.pick] || b.odd;
  }
  if (!isValid(curOdd)) return Math.round(b.stake * 0.4 * 100) / 100;
  const fairValue = b.potential / curOdd;
  const pay = Math.max(b.stake * 0.05, fairValue * 0.93);
  return Math.min(pay, b.potential * 0.98);
}

function doCashout(id) {
  const b = wallet.bets.find(x => x.id === id);
  if (!b || b.status !== 'pending') return;
  let co = 0;
  if (b.type === 'express' || b.type === 'builder') {
    for (let i = 0; i < b.selections.length; i++) {
      const sel = b.selections[i];
      const sm = matches.find(x => Number(x.id) === Number(sel.matchId));
      if (sm && sm.status === 'live') { co = cashoutValue(b, sm); break; }
    }
  } else {
    const m = matches.find(x => x.id === b.matchId);
    if (m) co = cashoutValue(b, m);
  }
  if (co <= 0) return;
  b.status = 'won';
  b.payout = co;
  b.cashout = true;
  wallet.balance += co;
  wallet.totalWon += co;
  saveWallet();
  flashBalance('win');
  renderBalance();
  renderHistory();
  renderStats();
  renderAchiv();
  sBet();
}

/* ============ РАСЧЁТ СТАВОК ============ */
function checkSel(m, pick) {
  if (!m || m.status !== 'finished') return 'pending';
  const tot = (m.scoreHome || 0) + (m.scoreAway || 0);

  if (m.sport === 'ufc') {
    const fr = m.finalResult || { winner: m.scoreHome > m.scoreAway ? 'home' : 'away', method: 'Решение', round: 5 };
    const isH = fr.winner === 'home', isA = fr.winner === 'away';
    const md = fr.method, rr = fr.round, fin = md !== 'Решение';

    if (pick === 'home') return isH ? 'won' : 'lost';
    if (pick === 'away') return isA ? 'won' : 'lost';
    if (pick === 'KO/TKO') return md === 'KO/TKO' ? 'won' : 'lost';
    if (pick === 'Сабмишн') return md === 'Сабмишн' ? 'won' : 'lost';
    if (pick === 'Решение') return md === 'Решение' ? 'won' : 'lost';
    if (pick === 'Бой досрочно') return fin ? 'won' : 'lost';
    if (pick === 'Вся дистанция') return !fin ? 'won' : 'lost';

    const o25 = pick.match(/^(ТБ|ТМ)\s*2\.5 раундов$/);
    if (o25) { if (o25[1] === 'ТБ') return rr > 2.5 ? 'won' : 'lost'; return rr < 2.5 ? 'won' : 'lost'; }
    const o35 = pick.match(/^(ТБ|ТМ)\s*3\.5 раундов$/);
    if (o35) { if (o35[1] === 'ТБ') return rr > 3.5 ? 'won' : 'lost'; return rr < 3.5 ? 'won' : 'lost'; }

    if (pick === m.home + ' KO/TKO') return (isH && md === 'KO/TKO') ? 'won' : 'lost';
    if (pick === m.home + ' Сабмишн') return (isH && md === 'Сабмишн') ? 'won' : 'lost';
    if (pick === m.home + ' Решение') return (isH && md === 'Решение') ? 'won' : 'lost';
    if (pick === m.away + ' KO/TKO') return (isA && md === 'KO/TKO') ? 'won' : 'lost';
    if (pick === m.away + ' Сабмишн') return (isA && md === 'Сабмишн') ? 'won' : 'lost';
    if (pick === m.away + ' Решение') return (isA && md === 'Решение') ? 'won' : 'lost';
    return 'lost';
  }

  if (m.sport === 'volleyball') {
    if (pick === 'home') return m.setsHome > m.setsAway ? 'won' : 'lost';
    if (pick === 'away') return m.setsAway > m.setsHome ? 'won' : 'lost';
    const totS = m.setsHome + m.setsAway;
    const t35 = pick.match(/^(ТБ|ТМ)\s*3\.5 сетов$/);
    if (t35) { if (t35[1] === 'ТБ') return totS > 3.5 ? 'won' : 'lost'; return totS < 3.5 ? 'won' : 'lost'; }
    const t45 = pick.match(/^(ТБ|ТМ)\s*4\.5 сетов$/);
    if (t45) { if (t45[1] === 'ТБ') return totS > 4.5 ? 'won' : 'lost'; return totS < 4.5 ? 'won' : 'lost'; }
    const cs = pick.match(/^Счёт (\d+):(\d+)$/);
    if (cs) return (m.setsHome === +cs[1] && m.setsAway === +cs[2]) ? 'won' : 'lost';
    const setWin = pick.match(/^Победа в (\d+)-м сете · (П1|П2)$/);
    if (setWin) {
      const setNum = +setWin[1];
      if (m.setScores && m.setScores[setNum - 1]) {
        const [sh, sa] = m.setScores[setNum - 1];
        if (setWin[2] === 'П1') return sh > sa ? 'won' : 'lost';
        else return sa > sh ? 'won' : 'lost';
      }
      // Fallback
      const winnerHome = m.setsHome > m.setsAway;
      if (setWin[2] === 'П1') return winnerHome ? 'won' : 'lost';
      return winnerHome ? 'lost' : 'won';
    }
    return 'lost';
  }

  if (pick === 'home') return m.scoreHome > m.scoreAway ? 'won' : 'lost';
  if (pick === 'away') return m.scoreAway > m.scoreHome ? 'won' : 'lost';
  if (pick === 'draw') return m.scoreHome === m.scoreAway ? 'won' : 'lost';
  if (pick === '1X') return m.scoreHome >= m.scoreAway ? 'won' : 'lost';
  if (pick === '12') return m.scoreHome !== m.scoreAway ? 'won' : 'lost';
  if (pick === 'X2') return m.scoreHome <= m.scoreAway ? 'won' : 'lost';
  const tO = pick.match(/^ТБ\s*([\d.]+)$/);
  const tU = pick.match(/^ТМ\s*([\d.]+)$/);
  if (tO) return tot > parseFloat(tO[1]) ? 'won' : 'lost';
  if (tU) return tot < parseFloat(tU[1]) ? 'won' : 'lost';
  const f1 = pick.match(/^Ф1\s*[−\-]?([\d.]+)$/);
  const f2 = pick.match(/^Ф2\s*[−\-]?([\d.]+)$/);
  if (f1) {
    const line = parseFloat(f1[1]);
    return (m.scoreHome - m.scoreAway) > line ? 'won' : 'lost';
  }
  if (f2) {
    const line = parseFloat(f2[1]);
    return (m.scoreAway - m.scoreHome) > line ? 'won' : 'lost';
  }
  const f1p = pick.match(/^Ф1\s*\+([\d.]+)$/);
  const f2p = pick.match(/^Ф2\s*\+([\d.]+)$/);
  if (f1p) {
    const line = parseFloat(f1p[1]);
    return (m.scoreHome - m.scoreAway) > -line ? 'won' : 'lost';
  }
  if (f2p) {
    const line = parseFloat(f2p[1]);
    return (m.scoreAway - m.scoreHome) > -line ? 'won' : 'lost';
  }
  if (pick === 'Обе · Да') return (m.scoreHome >= 1 && m.scoreAway >= 1) ? 'won' : 'lost';
  if (pick === 'Обе · Нет') return !(m.scoreHome >= 1 && m.scoreAway >= 1) ? 'won' : 'lost';
  if (pick === 'Чёт') return tot % 2 === 0 ? 'won' : 'lost';
  if (pick === 'Нечет') return tot % 2 !== 0 ? 'won' : 'lost';
  const cs = pick.match(/^Счёт\s+(\d+):(\d+)$/);
  if (cs) return (m.scoreHome === +cs[1] && m.scoreAway === +cs[2]) ? 'won' : 'lost';
  return 'lost';
}

function settleBets() {
  let changed = false;
  wallet.bets.forEach(b => {
    if (b.status !== 'pending') return;
    if (b.type === 'express' || b.type === 'builder') {
      let anyL = false, allW = true, allFin = true;
      for (let i = 0; i < b.selections.length; i++) {
        const sel = b.selections[i];
        if (sel.status === 'lost') { anyL = true; continue; }
        if (sel.status === 'won') continue;
        const m = matches.find(x => Number(x.id) === Number(sel.matchId));
        if (!m || m.status !== 'finished') { allFin = false; allW = false; continue; }
        const r = checkSel(m, sel.pick);
        sel.status = r;
        if (r === 'lost') { anyL = true; allW = false; }
      }
      if (anyL) {
        b.status = 'lost';
        sLose(); flashBalance('lose');
        changed = true;
        wallet.profitHistory.push({ t: Date.now(), v: wallet.totalWon - wallet.totalBet });
        return;
      }
      if (allFin && allW && b.selections.every(s => s.status === 'won')) {
        b.status = 'won';
        b.payout = Math.round(b.stake * b.odd * 100) / 100;
        wallet.balance += b.payout;
        wallet.totalWon += b.payout;
        sWin(); vibe(50); flashBalance('win');
        changed = true;
        wallet.profitHistory.push({ t: Date.now(), v: wallet.totalWon - wallet.totalBet });
        if (wallet.profitHistory.length > 100) wallet.profitHistory.shift();
      }
      return;
    }
    const m = matches.find(x => Number(x.id) === Number(b.matchId));
    if (!m || m.status !== 'finished') return;
    const r = checkSel(m, b.pick);
    if (r === 'won') {
      b.status = 'won';
      b.payout = Math.round(b.stake * b.odd * 100) / 100;
      wallet.balance += b.payout;
      wallet.totalWon += b.payout;
      sWin(); vibe(50); flashBalance('win');
    } else {
      b.status = 'lost';
      sLose(); flashBalance('lose');
    }
    changed = true;
    wallet.profitHistory.push({ t: Date.now(), v: wallet.totalWon - wallet.totalBet });
    if (wallet.profitHistory.length > 100) wallet.profitHistory.shift();
  });
  if (changed) {
    saveWallet();
    renderBalance();
    renderHistory();
    renderStats();
    renderAchiv();
  }
}

/* ============ CSV ============ */
function exportCSV() {
  const rows = [['Дата', 'Матч', 'Тип', 'Исход', 'Кэф', 'Ставка', 'Потенциал', 'Статус', 'Выплата']];
  wallet.bets.forEach(b => {
    rows.push([
      new Date(b.createdAt).toLocaleString('ru-RU'),
      b.match, b.type || 'single', b.pick || '',
      b.odd, b.stake, b.potential, b.status, b.payout || 0
    ]);
  });
  const csv = rows.map(r => r.map(v => '"' + v + '"').join(',')).join('\n');
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'openbet_' + Date.now() + '.csv';
  a.click();
}

/* ============ ГЛАВНЫЙ ЦИКЛ ============ */
function tick() {
  resetDaily();
  matches.forEach(m => { if (m.status === 'live') simulateMinute(m); });
  matches.forEach(m => {
    if (m.status === 'finished' && !m.countdownStarted) {
      m.finishedAt = m.finishedAt || Date.now();
      if (Date.now() - m.finishedAt > 4000) {
        m.countdownStarted = true;
        m.status = 'countdown';
        m.countdownLeft = 45;
      }
    }
    if (m.status === 'countdown') {
      m.countdownLeft -= 1;
      if (m.countdownLeft <= 0) {
        const nm = m.sport === 'football' ? newFootball()
          : m.sport === 'hockey' ? newHockey()
          : m.sport === 'volleyball' ? newVolleyball()
          : newUFC();
        nm.id = m.id;
        Object.assign(m, nm);
      }
    }
  });

  settleBets();

  const cnt = { football: 0, hockey: 0, volleyball: 0, ufc: 0 };
  matches.forEach(m => {
    if ((m.status === 'live' || m.status === 'countdown') && cnt[m.sport] !== undefined) cnt[m.sport]++;
  });
  const targets = { football: 5, hockey: 3, volleyball: 3, ufc: 3 };
  ['football', 'hockey', 'volleyball', 'ufc'].forEach(sp => {
    if (cnt[sp] < targets[sp] - 1) {
      const need = targets[sp] - cnt[sp];
      for (let i = 0; i < need; i++) {
        let m;
        if (sp === 'football') m = newFootball();
        else if (sp === 'hockey') m = newHockey();
        else if (sp === 'volleyball') m = newVolleyball();
        else m = newUFC();
        matches.push(m);
      }
    }
  });

  if (matches.length > 30) {
    const seen = new Set();
    matches = matches.filter(m => {
      const k = m.home + '|' + m.away + '|' + m.sport;
      if (seen.has(k)) return false;
      seen.add(k);
      return true;
    });
    if (matches.length > 30) matches = matches.slice(0, 30);
  }

  renderMatches();
  if (currentTab === 'stats') renderStats();
  if (currentTab === 'history') renderHistory();
  if (currentTab === 'top') renderTop();
  if (currentTab === 'achiv') renderAchiv();
}

/* ============ ДЕЛЕГИРОВАНИЕ ============ */
document.addEventListener('click', (e) => {
  const mb = e.target.closest('.odd-btn[data-match-id]');
  if (mb && !mb.disabled && !mb.classList.contains('disabled')) {
    const mid = parseInt(mb.dataset.matchId);
    const pk = mb.dataset.pick;
    const odd = parseFloat(mb.dataset.odd);
    if (!isNaN(mid) && pk && isValid(odd)) { openBetModal(mid, pk, odd); return; }
  }
  const minb = e.target.closest('.odd-mini[data-mid]');
  if (minb && !minb.disabled && !minb.classList.contains('disabled')) {
    const mid = parseInt(minb.dataset.mid);
    const pk = decodeURIComponent(minb.dataset.mk);
    const odd = parseFloat(minb.dataset.odd);
    if (!isNaN(mid) && pk && isValid(odd)) { openBetModal(mid, pk, odd); return; }
  }
  const eb = e.target.closest('[data-extras]');
  if (eb) {
    const id = parseInt(eb.dataset.extras);
    if (openExtras.has(id)) openExtras.delete(id);
    else openExtras.add(id);
    renderMatches();
    return;
  }
  const cb = e.target.closest('[data-cashout]');
  if (cb) { e.stopPropagation(); doCashout(parseInt(cb.dataset.cashout)); return; }
  const hi = e.target.closest('[data-history]');
  if (hi && !e.target.closest('[data-cashout]')) {
    const bid = parseInt(hi.dataset.history);
    const bet = wallet.bets.find(x => x.id === bid);
    if (bet && bet.matchId) {
      const m = matches.find(x => x.id === bet.matchId);
      if (!m) alert('Матч не найден — заменён');
      else if (m.status === 'finished') alert('Завершён: ' + m.home + ' — ' + m.away);
      else if (m.status === 'countdown') alert('Новый через ' + ft(m.countdownLeft));
      else alert(m.home + ' — ' + m.away + '\n' + (m.sport === 'volleyball' ? 'Сеты ' + m.setsHome + ':' + m.setsAway : m.scoreHome + ':' + m.scoreAway) + ' · live');
    }
    return;
  }
  if (e.target.closest('#balanceBox')) { claimBonus(); return; }
});

      '<div style="padding:40px;text-align:center;color:#ff3860;grid-column:1/-1">' +

      '<small style="opacity:.6">' + (err.stack || '').slice(0, 300) + '</small></div>';
  }
}, 100);
