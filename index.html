<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡ OpenBet — Live Betting Simulator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0a0a14;
    --bg2: #12121f;
    --card: #1a1a2e;
    --border: #2a2a45;
    --text: #fff;
    --muted: #888;
    --accent: #7b5cff;
    --accent2: #00d4ff;
    --green: #00e676;
    --red: #ff3860;
    --gold: #ffb800;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    padding-bottom: 0;
  }
  body.has-coupon { padding-bottom: 140px; }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 20% 0%, rgba(123,92,255,.15), transparent 50%),
      radial-gradient(circle at 80% 100%, rgba(0,212,255,.1), transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  /* HEADER */
  header {
    background: rgba(10,10,20,.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
    padding: 12px 24px;
  }
  .header-inner {
    max-width: 1280px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .logo { font-size: 20px; font-weight: 900; white-space: nowrap; }
  .logo span {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .nav { display: flex; gap: 4px; }
  .nav button {
    background: transparent;
    border: none;
    color: var(--muted);
    padding: 8px 12px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 700;
    font-size: 13px;
    font-family: inherit;
    transition: .2s;
  }
  .nav button:hover, .nav button.active { color: #fff; background: var(--card); }

  .header-right { display: flex; align-items: center; gap: 8px; }
  .balance {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 8px 14px;
    border-radius: 12px;
    font-weight: 800;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-variant-numeric: tabular-nums;
  }
  .balance .reset {
    font-size: 10px;
    color: var(--muted);
    font-weight: 500;
    margin-left: 4px;
  }
  .icon-btn {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    width: 36px;
    height: 36px;
    cursor: pointer;
    color: #fff;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: .2s;
  }
  .icon-btn:hover { border-color: var(--accent); }
  .icon-btn.muted { opacity: .4; }

  /* LAYOUT */
  .container {
    max-width: 1280px;
    margin: 0 auto;
    padding: 20px 24px;
    position: relative;
    z-index: 1;
  }

  /* FILTERS */
  .filters {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    align-items: center;
  }
  .filter {
    padding: 8px 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    font-weight: 700;
    color: var(--muted);
    font-size: 13px;
    font-family: inherit;
    transition: .2s;
  }
  .filter:hover, .filter.active {
    color: #fff;
    border-color: var(--accent);
    background: rgba(123,92,255,.1);
  }
  .filter.toggle { margin-left: auto; }
  .filter.toggle.active {
    background: rgba(0,230,118,.1);
    border-color: var(--green);
    color: var(--green);
  }

  /* SESSION PROFIT */
  .session-bar {
    display: flex;
    gap: 16px;
    align-items: center;
    padding: 10px 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 16px;
    font-size: 12px;
    flex-wrap: wrap;
  }
  .session-bar .label { color: var(--muted); font-weight: 600; }
  .session-bar .value { font-weight: 800; font-variant-numeric: tabular-nums; }
  .session-bar .value.green { color: var(--green); }
  .session-bar .value.red { color: var(--red); }

  /* LIVE DROPS */
  .live-drops {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 8px;
    margin-bottom: 16px;
  }
  .live-drops::-webkit-scrollbar { height: 6px; }
  .live-drops::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .live-drops:empty { display: none; }
  .drop {
    min-width: 140px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    font-size: 11px;
    animation: slideIn .4s;
  }
  @keyframes slideIn { from { opacity: 0; transform: translateX(30px); } }
  .drop-match {
    font-weight: 700;
    margin-bottom: 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 11px;
  }
  .drop-event { color: var(--green); font-size: 11px; font-weight: 700; }

  /* MATCH */
  .match {
    background: linear-gradient(180deg, var(--card), var(--bg2));
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 10px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px;
    align-items: center;
    transition: .2s;
    animation: fadeIn .3s;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } }
  .match:hover { border-color: #3a3a55; }
  .match.finished { opacity: .55; }

  .match-info { min-width: 0; }
  .match-top {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .match-league {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .5px;
    font-weight: 700;
  }
  .badge {
    font-size: 9px;
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .5px;
  }
  .badge.live { background: var(--red); color: #fff; animation: pulse 1.5s infinite; }
  .badge.finished { background: #333; color: #888; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
  .sport-icon { font-size: 14px; }

  .teams {
    font-weight: 700;
    font-size: 15px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .score { color: var(--green); font-weight: 800; font-variant-numeric: tabular-nums; }
  .minute { font-size: 11px; color: var(--muted); font-weight: 600; }

  .momentum-bar {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    margin-top: 6px;
    overflow: hidden;
    position: relative;
  }
  .momentum-bar::after {
    content: '';
    position: absolute;
    left: 50%;
    top: 0;
    height: 100%;
    width: 2px;
    background: var(--muted);
    transform: translateX(-50%);
  }
  .momentum-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--red), var(--green));
    transition: .5s;
  }

  /* ODDS */
  .odds { display: flex; gap: 6px; }
  .odds-btn {
    min-width: 76px;
    background: #0f0f1a;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 6px;
    text-align: center;
    cursor: pointer;
    transition: .2s;
    color: #fff;
    font-family: inherit;
    font-variant-numeric: tabular-nums;
  }
  .odds-btn:hover:not(:disabled) {
    border-color: var(--accent);
    background: var(--card);
    transform: translateY(-1px);
  }
  .odds-btn:disabled { opacity: .3; cursor: not-allowed; }
  .odds-label {
    font-size: 10px;
    color: var(--muted);
    margin-bottom: 2px;
    font-weight: 600;
  }
  .odds-value {
    font-size: 15px;
    font-weight: 800;
    color: var(--accent2);
    transition: color .3s;
  }
  .odds-btn.up .odds-value { color: var(--green); }
  .odds-btn.down .odds-value { color: var(--red); }

  .flash-up { animation: flashGreen .8s; }
  .flash-down { animation: flashRed .8s; }
  @keyframes flashGreen { 0% { background: rgba(0,230,118,.25); } 100% { background: #0f0f1a; } }
  @keyframes flashRed { 0% { background: rgba(255,56,96,.25); } 100% { background: #0f0f1a; } }

  /* EXTRAS */
  .extras {
    grid-column: 1 / -1;
    margin-top: 4px;
    border-top: 1px solid var(--border);
    padding-top: 6px;
  }
  .extras-toggle {
    background: transparent;
    border: none;
    color: var(--accent2);
    cursor: pointer;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 0;
    font-family: inherit;
    transition: .2s;
  }
  .extras-toggle.open { color: var(--muted); }
  .extras-grid {
    display: none;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 6px;
    margin-top: 8px;
  }
  .extras-grid.open { display: grid; }
  .odds-mini {
    background: #0f0f1a;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: inherit;
    color: #fff;
    transition: .2s;
    gap: 6px;
  }
  .odds-mini:hover { border-color: var(--accent); background: var(--card); }
  .odds-mini-label { font-size: 11px; color: var(--muted); text-align: left; }
  .odds-mini-value { font-size: 12px; font-weight: 800; color: var(--accent2); white-space: nowrap; }

  /* HISTORY */
  .history-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 12px;
    align-items: center;
  }
  .history-item.won { border-left: 3px solid var(--green); }
  .history-item.lost { border-left: 3px solid var(--red); }
  .history-item.pending { border-left: 3px solid var(--gold); }
  .history-main { min-width: 0; }
  .history-match { font-weight: 700; font-size: 13px; margin-bottom: 2px; }
  .history-meta { font-size: 11px; color: var(--muted); }
  .history-stake { text-align: right; }
  .history-stake .amount { font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }
  .history-stake .odd { font-size: 11px; color: var(--accent2); font-weight: 700; }
  .history-status {
    font-weight: 800;
    padding: 4px 10px;
    border-radius: 6px;
    text-transform: uppercase;
    letter-spacing: .5px;
    font-size: 10px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .history-status.won { background: rgba(0,230,118,.15); color: var(--green); }
  .history-status.lost { background: rgba(255,56,96,.15); color: var(--red); }
  .history-status.pending { background: rgba(255,184,0,.15); color: var(--gold); }

  /* STATS */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }
  .stat-label {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
    font-weight: 600;
  }
  .stat-value {
    font-size: 22px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .stat-value.green { color: var(--green); }
  .stat-value.red { color: var(--red); }
  .stat-value.gold { color: var(--gold); }

  /* MODAL */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.8);
    backdrop-filter: blur(6px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 16px;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: linear-gradient(180deg, var(--card), var(--bg2));
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 24px;
    max-width: 440px;
    width: 100%;
    animation: popIn .25s cubic-bezier(.5,1.5,.5,1);
    max-height: 90vh;
    overflow-y: auto;
  }
  @keyframes popIn { from { transform: scale(.9); opacity: 0; } }
  .modal h3 { font-size: 17px; margin-bottom: 6px; }
  .modal .sub { color: var(--muted); font-size: 12px; margin-bottom: 16px; line-height: 1.5; }
  .modal .row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .modal .row:last-of-type { border-bottom: none; }
  .modal .row .label { color: var(--muted); }
  .modal .row .value { font-weight: 700; font-variant-numeric: tabular-nums; }
  .modal input {
    width: 100%;
    background: #0f0f1a;
    border: 1px solid var(--border);
    color: #fff;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 16px;
    margin: 14px 0 10px;
    font-family: inherit;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .modal input:focus { outline: none; border-color: var(--accent); }
  .quick-stakes { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .quick-stake {
    flex: 1;
    min-width: 56px;
    padding: 8px 4px;
    background: #0f0f1a;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: .2s;
  }
  .quick-stake:hover { border-color: var(--accent); background: var(--card); }
  .modal-actions { display: flex; gap: 8px; margin-top: 16px; }
  .btn {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: none;
    font-weight: 800;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    transition: .2s;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    box-shadow: 0 6px 20px rgba(123,92,255,.35);
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(123,92,255,.5); }
  .btn-primary:disabled { opacity: .4; cursor: not-allowed; transform: none; }
  .btn-secondary {
    background: #0f0f1a;
    color: #fff;
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { border-color: var(--accent); }
  .btn-coupon {
    background: var(--card);
    border: 1px solid var(--accent);
    color: var(--accent2);
  }

  /* COUPON BAR */
  .coupon-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(180deg, var(--card), var(--bg2));
    border-top: 2px solid var(--accent);
    padding: 10px 16px;
    transform: translateY(100%);
    transition: transform .3s;
    z-index: 200;
    box-shadow: 0 -10px 40px rgba(0,0,0,.5);
  }
  .coupon-bar.active { transform: translateY(0); }
  .coupon-inner { max-width: 1280px; margin: 0 auto; }
  .coupon-items {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 8px;
    margin-bottom: 6px;
  }
  .coupon-items::-webkit-scrollbar { height: 4px; }
  .coupon-items::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .coupon-item {
    background: #0f0f1a;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 8px;
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 180px;
    font-size: 11px;
  }
  .coupon-item-info { flex: 1; min-width: 0; }
  .coupon-item-match {
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .coupon-item-pick { color: var(--accent2); font-weight: 700; font-size: 10px; }
  .coupon-item-remove {
    background: transparent;
    border: none;
    color: var(--red);
    font-size: 18px;
    cursor: pointer;
    padding: 0 4px;
    font-family: inherit;
    line-height: 1;
  }
  .coupon-actions { display: flex; gap: 6px; justify-content: flex-end; }
  .coupon-clear {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 700;
    font-size: 12px;
  }
  .coupon-place {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    color: #fff;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 800;
    font-size: 12px;
    box-shadow: 0 4px 16px rgba(123,92,255,.4);
    font-variant-numeric: tabular-nums;
  }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--card);
    border: 1px solid var(--border);
    padding: 12px 20px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 13px;
    z-index: 2000;
    transition: transform .3s cubic-bezier(.5,1.5,.5,1);
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
    max-width: 90%;
    text-align: center;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { border-color: var(--green); }
  .toast.error { border-color: var(--red); }

  /* GOAL NOTIFICATION */
  .goal-popup {
    position: fixed;
    top: 80px;
    right: 20px;
    background: linear-gradient(135deg, rgba(0,230,118,.95), rgba(0,212,255,.95));
    color: #000;
    padding: 14px 20px;
    border-radius: 12px;
    font-weight: 800;
    font-size: 14px;
    z-index: 2000;
    box-shadow: 0 10px 40px rgba(0,230,118,.5);
    animation: goalIn .5s cubic-bezier(.5,1.5,.5,1);
    max-width: 320px;
  }
  @keyframes goalIn {
    from { transform: translateX(400px) rotate(15deg); opacity: 0; }
    to { transform: translateX(0) rotate(0); opacity: 1; }
  }
  .goal-popup.fade-out { animation: goalOut .4s forwards; }
  @keyframes goalOut {
    to { transform: translateX(400px); opacity: 0; }
  }

  /* EMPTY */
  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty .icon { font-size: 48px; margin-bottom: 12px; }

  /* TABS */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* RESPONSIVE */
  @media (max-width: 720px) {
    header { padding: 10px 14px; }
    .nav button { padding: 6px 8px; font-size: 12px; }
    .logo { font-size: 16px; }
    .balance { padding: 6px 10px; font-size: 13px; }
    .balance .reset { display: none; }
    .match { grid-template-columns: 1fr; gap: 10px; padding: 12px; }
    .odds { justify-content: stretch; }
    .odds-btn { flex: 1; min-width: 0; }
    .container { padding: 14px; }
    .extras-grid { grid-template-columns: repeat(2, 1fr); }
    .history-item { grid-template-columns: 1fr auto; }
    .history-status { grid-column: 1 / -1; text-align: center; }
    .header-inner { gap: 8px; }
    .session-bar { font-size: 11px; gap: 10px; }
    .goal-popup { right: 10px; left: 10px; max-width: none; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">⚡ Open<span>Bet</span></div>
    <nav class="nav">
      <button class="active" data-tab="line">📊 Линия</button>
      <button data-tab="history">📜 История</button>
      <button data-tab="stats">📈 Стата</button>
    </nav>
    <div class="header-right">
      <div class="balance">
        💰 <span id="balance">20 000</span> ₽
        <span class="reset">/ день</span>
      </div>
      <button class="icon-btn" id="soundBtn" title="Звук">🔊</button>
      <button class="icon-btn" id="resetBtn" title="Сбросить баланс">♻️</button>
    </div>
  </div>
</header>

<div class="container">

  <div class="session-bar">
    <span><span class="label">Сессия:</span> <span class="value" id="sessionProfit">0 ₽</span></span>
    <span><span class="label">Ставок:</span> <span class="value" id="sessionBets">0</span></span>
    <span><span class="label">Винрейт:</span> <span class="value" id="sessionWinrate">—</span></span>
  </div>

  <div class="live-drops" id="liveDrops"></div>

  <!-- LINE TAB -->
  <div class="tab-content active" id="tab-line">
    <div class="filters">
      <button class="filter active" data-sport="all">🔥 Все</button>

function poisson(k, lambda) {
  if (lambda <= 0) return k === 0 ? 1 : 0;
  let fact = 1;
  for (let i = 2; i <= k; i++) fact *= i;
  return Math.pow(lambda, k) * Math.exp(-lambda) / fact;
}

const audioCtx = window.AudioContext || window.webkitAudioContext;
let audio = null;
function initAudio() { if (!audio && audioCtx) audio = new audioCtx(); }

function beep(freq, duration, type = 'sine', volume = 0.1) {
  if (!soundOn) return;
  initAudio();
  if (!audio) return;
  try {
    const osc = audio.createOscillator();
    const gain = audio.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume, audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + duration);
    osc.connect(gain);
    gain.connect(audio.destination);
    osc.start();
    osc.stop(audio.currentTime + duration);
  } catch (e) {}
}

function computeOdds(m) {
  if (m.sport === 'ufc') {
    const diff = m.homeRating - m.awayRating;
    let pHome = 1 / (1 + Math.pow(10, -diff / 400));
    pHome = Math.max(0.05, Math.min(0.95, pHome));
    return {
      home: toOdds(pHome, 0.06),
      away: toOdds(1 - pHome, 0.06),
      draw: null,
    };
  }

  const remaining = Math.max(0, m.maxMinute - m.minute);
  let lambdaHome = m.homeAttack * (remaining / m.maxMinute);
  let lambdaAway = m.awayAttack * (remaining / m.maxMinute);
  lambdaHome *= (1 + m.momentum * 0.3);
  lambdaAway *= (1 - m.momentum * 0.3);

  let pHome = 0, pDraw = 0, pAway = 0;
  for (let h = 0; h <= 8; h++) {
    for (let a = 0; a <= 8; a++) {
      const p = poisson(h, lambdaHome) * poisson(a, lambdaAway);
      const fh = m.scoreHome + h;
      const fa = m.scoreAway + a;
      if (fh > fa) pHome += p;
      else if (fh === fa) pDraw += p;
      else pAway += p;
    }
  }
  const total = pHome + pDraw + pAway || 1;
  pHome /= total; pDraw /= total; pAway /= total;

  if (m.sport === 'hockey') {
    const t = pHome + pAway || 1;
    return {
      home: toOdds(pHome / t, 0.055),
      away: toOdds(pAway / t, 0.055),
      draw: null,
    };
  }
  return {
    home: toOdds(pHome),
    draw: toOdds(pDraw),
    away: toOdds(pAway),
  };
}

// ============================================================
// РАСШИРЕННЫЕ РЫНКИ
// ============================================================

function computeExtraMarkets(m) {
  // ============ UFC ============
  if (m.sport === 'ufc') {
    const diff = m.homeRating - m.awayRating;
    let pHome = 1 / (1 + Math.pow(10, -diff / 400));
    pHome = Math.max(0.05, Math.min(0.95, pHome));
    const pAway = 1 - pHome;

    const progress = m.minute / m.maxMinute;
    const pFinish = 0.65 * (1 - progress * 0.5);

    const pKO = pFinish * 0.55;
    const pSub = pFinish * 0.35;
    const pDec = 1 - pFinish;

    const pR1 = pFinish * 0.35;
    const pR2 = pFinish * 0.25;
    const pR3 = pFinish * 0.20;
    const pR4 = pFinish * 0.20;

    const pOver15 = 1 - pR1;
    const pOver25 = 1 - (pR1 + pR2);

    return {
      'Метод · KO/TKO': toOdds(pKO, 0.06),
      'Метод · Сабмишн': toOdds(pSub, 0.06),
      'Метод · Решение': toOdds(pDec, 0.06),
      'Финиш в R1': toOdds(pR1, 0.07),
      'Финиш в R2': toOdds(pR2, 0.07),
      'Финиш в R3': toOdds(pR3, 0.07),
      'Финиш в R4+': toOdds(pR4, 0.07),
      'Тотал Б 1.5 раундов': toOdds(pOver15, 0.06),
      'Тотал М 1.5 раундов': toOdds(1 - pOver15, 0.06),
      'Тотал Б 2.5 раундов': toOdds(pOver25, 0.06),
      'Тотал М 2.5 раундов': toOdds(1 - pOver25, 0.06),
      'Бой досрочно': toOdds(pFinish, 0.06),
      'Пройти всю дистанцию': toOdds(pDec, 0.06),
      [`${m.home} KO/TKO`]: toOdds(pHome * pKO, 0.08),
      [`${m.home} Сабмишн`]: toOdds(pHome * pSub, 0.08),
      [`${m.home} Решение`]: toOdds(pHome * pDec, 0.08),
      [`${m.away} KO/TKO`]: toOdds(pAway * pKO, 0.08),
      [`${m.away} Сабмишн`]: toOdds(pAway * pSub, 0.08),
      [`${m.away} Решение`]: toOdds(pAway * pDec, 0.08),
      [`${m.home} в R1`]: toOdds(pHome * pR1 * 1.3, 0.09),
      [`${m.away} в R1`]: toOdds(pAway * pR1 * 1.3, 0.09),
    };
  }

  // ============ ФУТБОЛ И ХОККЕЙ ============
  const isFootball = m.sport === 'football';
  const remaining = Math.max(0, m.maxMinute - m.minute);

  const lambdaHome = m.homeAttack * (remaining / m.maxMinute) * (1 + m.momentum * 0.3);
  const lambdaAway = m.awayAttack * (remaining / m.maxMinute) * (1 - m.momentum * 0.3);
  const lambdaTotal = lambdaHome + lambdaAway;

  function overProb(line) {
    const currentTotal = m.scoreHome + m.scoreAway;
    const needed = Math.floor(line) - currentTotal;
    if (needed < 0) return 1;
    if (needed >= 15) return 0;
    let p = 0;
    for (let goals = needed + 1; goals <= 15; goals++) {
      p += poisson(goals, lambdaTotal);
    }
    return Math.min(1, Math.max(0, p));
  }

  function handicapProb(line) {
    let p = 0;
    for (let h = 0; h <= 8; h++) {
      for (let a = 0; a <= 8; a++) {
        const diff = (m.scoreHome + h) - (m.scoreAway + a);
        if (diff > line) p += poisson(h, lambdaHome) * poisson(a, lambdaAway);
      }
    }
    return p;
  }

  let pBtts = 0;
  for (let h = 0; h <= 8; h++) {
    for (let a = 0; a <= 8; a++) {
      if (m.scoreHome + h >= 1 && m.scoreAway + a >= 1) {
        pBtts += poisson(h, lambdaHome) * poisson(a, lambdaAway);
      }
    }
  }

  const odds1X2 = computeOdds(m);
  const pHome = 1 / odds1X2.home;
  const pDraw = odds1X2.draw ? 1 / odds1X2.draw : 0;
  const pAway = 1 / odds1X2.away;

  let pEven = 0;
  for (let h = 0; h <= 10; h++) {
    for (let a = 0; a <= 10; a++) {
      const total = m.scoreHome + h + m.scoreAway + a;
      if (total % 2 === 0) pEven += poisson(h, lambdaHome) * poisson(a, lambdaAway);
    }
  }

  function teamOverProb(attack, line, currentScore) {
    const remainingLambda = attack * (remaining / m.maxMinute);
    const needed = Math.floor(line) - currentScore;
    if (needed < 0) return 1;
    if (needed >= 10) return 0;
    let p = 0;
    for (let g = needed + 1; g <= 10; g++) {
      p += poisson(g, remainingLambda);
    }
    return p;
  }

  const line1 = isFootball ? 2.5 : 5.5;
  const line2 = isFootball ? 1.5 : 4.5;
  const line3 = isFootball ? 3.5 : 6.5;
  const line4 = isFootball ? 4.5 : 7.5;

  const markets = {};

  // Двойной шанс
  markets['1X'] = toOdds(pHome + pDraw, 0.04);
  markets['12'] = toOdds(pHome + pAway, 0.04);
  markets['X2'] = toOdds(pDraw + pAway, 0.04);

  // Тоталы
  markets[`ТБ ${line2}`] = toOdds(overProb(line2), 0.06);
  markets[`ТМ ${line2}`] = toOdds(1 - overProb(line2), 0.06);
  markets[`ТБ ${line1}`] = toOdds(overProb(line1), 0.06);
  markets[`ТМ ${line1}`] = toOdds(1 - overProb(line1), 0.06);
  markets[`ТБ ${line3}`] = toOdds(overProb(line3), 0.06);
  markets[`ТМ ${line3}`] = toOdds(1 - overProb(line3), 0.06);
  markets[`ТБ ${line4}`] = toOdds(overProb(line4), 0.06);
  markets[`ТМ ${line4}`] = toOdds(1 - overProb(line4), 0.06);

  // Фор
  markets['Ф1 −1.5'] = toOdds(handicapProb(-1.5), 0.06);
  markets['Ф2 −1.5'] = toOdds(1 - handicapProb(1.5), 0.06);
  markets['Ф1 +1.5'] = toOdds(1 - handicapProb(-1.5), 0.06);
  markets['Ф2 +1.5'] = toOdds(handicapProb(1.5), 0.06);

  // Обе забьют
  markets['Обе · Да'] = toOdds(pBtts, 0.06);
  markets['Обе · Нет'] = toOdds(1 - pBtts, 0.06);

  // Чёт/Нечет
  markets['Чёт'] = toOdds(pEven, 0.06);
  markets['Нечет'] = toOdds(1 - pEven, 0.06);

  // Голы команд
  const teamLine = isFootball ? 0.5 : 1.5;
  markets[`${m.home} Б ${teamLine}`] = toOdds(teamOverProb(m.homeAttack, teamLine, m.scoreHome), 0.06);
  markets[`${m.home} М ${teamLine}`] = toOdds(1 - teamOverProb(m.homeAttack, teamLine, m.scoreHome), 0.06);
  markets[`${m.away} Б ${teamLine}`] = toOdds(teamOverProb(m.awayAttack, teamLine, m.scoreAway), 0.06);
  markets[`${m.away} М ${teamLine}`] = toOdds(1 - teamOverProb(m.awayAttack, teamLine, m.scoreAway), 0.06);

  // Точный счёт
  if (m.minute < 80) {
    const scores = isFootball
      ? ['0:0','1:0','0:1','1:1','2:0','0:2','2:1','1:2','2:2','3:0','0:3','3:1','1:3','3:2','2:3']
      : ['0:0','1:0','0:1','1:1','2:0','0:2','2:1','1:2','2:2','3:0','0:3','3:1','1:3','3:2','2:3','3:3','4:1','4:2','5:2'];
    scores.forEach(sc => {
      const [h, a] = sc.split(':').map(Number);
      if (h < m.scoreHome || a < m.scoreAway) return;
      const dh = h - m.scoreHome;
      const da = a - m.scoreAway;
      const p = poisson(dh, lambdaHome) * poisson(da, lambdaAway);
      if (p > 0.001) markets[`Счёт ${sc}`] = toOdds(p, 0.08);
    });
  }

  return markets;
}

function tickMatch(m) {
  m.minute += 1;
  m.momentum *= 0.95;

  if (m.sport === 'ufc') {
    if (m.minute % 5 === 0) m.round = Math.min(5, m.round + 1);
    if (Math.random() < 0.15) {
      const homeHits = Math.random() < 0.5;
      if (homeHits) {
        m.momentum = Math.min(1, m.momentum + 0.3);
        m.scoreHome += 1;
      } else {
        m.momentum = Math.max(-1, m.momentum - 0.3);
        m.scoreAway += 1;
      }
    }
    if (m.minute >= m.maxMinute) m.status = 'finished';
    return;
  }

  if (m.minute >= m.maxMinute) {
    m.status = 'finished';
    return;
  }

  const goalChance = m.sport === 'football' ? 0.035 : 0.05;
  const adjusted = goalChance + Math.abs(m.momentum) * 0.02;

  if (Math.random() < adjusted) {
    const homeScores = Math.random() < (0.55 + m.momentum * 0.1);
    const scorer = homeScores ? m.home : m.away;
    const scoreStr = homeScores
      ? `${m.scoreHome + 1}:${m.scoreAway}`
      : `${m.scoreHome}:${m.scoreAway + 1}`;

    if (homeScores) {
      m.scoreHome += 1;
      m.momentum = Math.min(1, m.momentum + 0.3);
    } else {
      m.scoreAway += 1;
      m.momentum = Math.max(-1, m.momentum - 0.3);
    }

    addLiveDrop(m, scorer, scoreStr);
    soundGoal();
    showGoalPopup(m, scorer, scoreStr);
  }
}

function addLiveDrop(m, scorer, score) {
  liveDrops.unshift({
    match: `${m.home} — ${m.away}`,
    event: `${sportIcon(m.sport)} ${scorer} · ${score}`,
    id: Date.now() + Math.random(),
  });
  if (liveDrops.length > 15) liveDrops.pop();
}

function showGoalPopup(m, scorer, score) {
  const popup = document.createElement('div');
  popup.className = 'goal-popup';
  popup.innerHTML = `⚽ ГОЛ!<br><b>${scorer}</b><br>${score}`;
  document.body.appendChild(popup);
  setTimeout(() => popup.classList.add('fade-out'), 2500);
  setTimeout(() => popup.remove(), 3000);
}

function renderSession() {

function renderMatches() {
  let filtered = currentFilter === 'all'
    ? matches
    : matches.filter(m => m.sport === currentFilter);

  if (liveOnly) filtered = filtered.filter(m => m.status === 'live');

  // Живые сначала, потом завершённые
  filtered = [...filtered].sort((a, b) => {
    if (a.status === 'live' && b.status !== 'live') return -1;
    if (a.status !== 'live' && b.status === 'live') return 1;
    return a.minute - b.minute;
  });

  const el = $('matches');
  if (!filtered.length) {
    el.innerHTML = `<div class="empty"><div class="icon">🎯</div>Матчей нет</div>`;
    return;
  }

  el.innerHTML = filtered.map(m => {
    const odds = computeOdds(m);
    const isFinished = m.status === 'finished';
    const extras = !isFinished ? computeExtraMarkets(m) : {};
    const extrasKeys = Object.keys(extras);
    const momentumWidth = Math.abs(m.momentum) * 50;

    const extrasHtml = extrasKeys.length ? `
      <div class="extras">
        <button class="extras-toggle" onclick="this.classList.toggle('open'); this.nextElementSibling.classList.toggle('open')">
          ▼ Ещё ${extrasKeys.length} рынков
        </button>
        <div class="extras-grid">
          ${extrasKeys.map(label => `
            <button class="odds-mini" onclick="openBetModal(${m.id}, '${label.replace(/'/g, "\\'")}', ${extras[label]})">
              <span class="odds-mini-label">${label}</span>
              <span class="odds-mini-value">${extras[label].toFixed(2)}</span>
            </button>
          `).join('')}
        </div>
      </div>
    ` : '';

    return `
      <div class="match ${isFinished ? 'finished' : ''}">
        <div class="match-info">
          <div class="match-top">
            <span class="sport-icon">${sportIcon(m.sport)}</span>
            <span class="match-league">${m.league}</span>
            ${isFinished
              ? '<span class="badge finished">Завершён</span>'
              : '<span class="badge live">LIVE</span>'}
          </div>
          <div class="teams">
            <span>${m.home}</span>
            <span class="score">${m.scoreHome}:${m.scoreAway}</span>
            <span>${m.away}</span>
            ${!isFinished ? `<span class="minute">${m.minute}'${m.sport === 'ufc' ? ` · R${m.round}` : ''}</span>` : ''}
          </div>
          ${m.sport !== 'ufc' ? `
            <div class="momentum-bar">
              <div class="momentum-fill" style="width:${momentumWidth}%; margin-left:${m.momentum > 0 ? '50%' : (50 - momentumWidth) + '%'}"></div>
            </div>
          ` : ''}
        </div>
        <div class="odds">
          ${renderOddsBtn(m.id, 'home', '1', odds.home, isFinished)}
          ${odds.draw !== null ? renderOddsBtn(m.id, 'draw', 'X', odds.draw, isFinished) : ''}
          ${renderOddsBtn(m.id, 'away', '2', odds.away, isFinished)}
        </div>
        ${extrasHtml}
      </div>
    `;
  }).join('');
}

function renderOddsBtn(matchId, pickKey, label, value, disabled) {
  const key = `${matchId}-${pickKey}`;
  const prev = previousOdds[key];
  let flashClass = '';
  let arrow = '';
  if (prev !== undefined && prev !== value) {
    if (value > prev) { flashClass = 'flash-up'; arrow = ' ↑'; }
    else { flashClass = 'flash-down'; arrow = ' ↓'; }
  }
  previousOdds[key] = value;

  return `
    <button class="odds-btn ${flashClass}" ${disabled ? 'disabled' : ''} onclick="openBetModal(${matchId}, '${pickKey}', ${value})">
      <div class="odds-label">${label}${arrow}</div>
      <div class="odds-value">${value.toFixed(2)}</div>
    </button>
  `;
}

}

function renderStats() {

function openBetModal(matchId, pickKey, odd) {
  const m = matches.find(x => x.id === matchId);
  if (!m || m.status === 'finished') return;

  activeBet = { matchId, pick: pickKey, odd };

  $('betModalTitle').textContent = `${m.home} — ${m.away}`;
  $('betModalSub').textContent = `${pickKey === 'home' ? m.home : pickKey === 'away' ? m.away : pickKey === 'draw' ? 'Ничья' : pickKey} · ${m.scoreHome}:${m.scoreAway} · ${m.minute}'`;
  $('betModalOdd').textContent = odd.toFixed(2);
  $('betModalStake').value = '';
  $('betModalPotential').textContent = '—';
  $('betModalCoupon').style.display = 'block';
  $('betModal').classList.add('active');
  updatePotential();
}

function closeBetModal() {
  $('betModal').classList.remove('active');
  activeBet = null;
}

function updatePotential() {
  if (!activeBet) return;
  const stake = parseFloat($('betModalStake').value) || 0;
  const potential = stake * activeBet.odd;
  $('betModalPotential').textContent = potential > 0 ? `${formatMoney(potential)} ₽` : '—';
}

function placeBet() {
  if (!activeBet) return;
  const stake = parseFloat($('betModalStake').value);

  if (!stake || stake < 10) return showToast('❌ Минимум 10 ₽', 'error');
  if (stake > wallet.balance) return showToast('❌ Недостаточно средств', 'error');

  if (activeBet.isExpress) {
    const selections = activeBet.selections.map(s => ({
      matchId: s.matchId, pick: s.pick, odd: s.odd,
      label: s.label, match: s.match, status: 'pending',
    }));

    wallet.balance -= stake;
    wallet.totalBet += stake;

    wallet.bets.unshift({
      id: Date.now(), type: 'express',
      match: `Экспресс · ${selections.length}`,
      selections,
      odd: activeBet.odd, stake,
      potential: Math.round(stake * activeBet.odd * 100) / 100,
      status: 'pending',
      createdAt: new Date().toISOString(),
    });

    expressCoupon = [];
    saveCoupon();
    renderCoupon();
    saveWallet();
    renderBalance();
    renderHistory();
    renderStats();
    soundBet();
    showToast(`✅ Экспресс принят @ ${activeBet.odd.toFixed(2)}`, 'success');
    closeBetModal();
    return;
  }

  const m = matches.find(x => x.id === activeBet.matchId);
  if (!m || m.status === 'finished') {
    showToast('❌ Матч закрыт', 'error');
    return closeBetModal();
  }

  wallet.balance -= stake;
  wallet.totalBet += stake;

  wallet.bets.unshift({
    id: Date.now(), type: 'single',
    matchId: m.id,
    match: `${m.home} — ${m.away}`,
    sport: m.sport,
    pick: activeBet.pick,
    odd: activeBet.odd,
    stake,
    potential: Math.round(stake * activeBet.odd * 100) / 100,
    status: 'pending',
    minute: m.minute,
    score: `${m.scoreHome}:${m.scoreAway}`,
    createdAt: new Date().toISOString(),
  });

  saveWallet();
  renderBalance();
  renderHistory();
  renderStats();
  soundBet();
  showToast(`✅ Ставка ${formatMoney(stake)} ₽ @ ${activeBet.odd.toFixed(2)}`, 'success');
  closeBetModal();
}

function addToCoupon(matchId, pickKey, odd, label) {
  if (expressCoupon.find(c => c.matchId === matchId && c.pick === pickKey)) {
    return showToast('Уже в купоне', 'error');
  }
  if (expressCoupon.find(c => c.matchId === matchId)) {
    return showToast('На этот матч уже есть ставка', 'error');
  }

  const m = matches.find(x => x.id === matchId);
  if (!m) return;

  expressCoupon.push({
    matchId, pick: pickKey, odd, label,
    match: `${m.home} — ${m.away}`,
  });

  saveCoupon();
  renderCoupon();
  showToast(`➕ Добавлено (${expressCoupon.length})`, 'success');
}

function removeFromCoupon(index) {
  expressCoupon.splice(index, 1);
  saveCoupon();
  renderCoupon();
}

function clearCoupon() {
  expressCoupon = [];
  saveCoupon();
  renderCoupon();
}

function renderCoupon() {
  const el = $('couponBar');

  if (expressCoupon.length === 0) {
    el.classList.remove('active');
    document.body.classList.remove('has-coupon');

  }

  el.classList.add('active');

  el.innerHTML = `

        ${expressCoupon.map((c, i) => `
          <div class="coupon-item">
            <div class="coupon-item-info">
              <div class="coupon-item-match">${c.match}</div>

            </div>

          </div>

        <button class="coupon-place" onclick="openExpressModal()">
          Экспресс · ${expressCoupon.length} · @ ${totalOdd.toFixed(2)}
        </button>

}

function openExpressModal() {
  if (expressCoupon.length < 2) return showToast('Минимум 2 события', 'error');
  const totalOdd = expressCoupon.reduce((acc, c) => acc * c.odd, 1);

  activeBet = { isExpress: true, odd: totalOdd, selections: [...expressCoupon] };

  $('betModalTitle').textContent = `Экспресс · ${expressCoupon.length} событий`;
  $('betModalSub').textContent = expressCoupon.map(c => `${c.label} @ ${c.odd.toFixed(2)}`).join(' + ');
  $('betModalOdd').textContent = totalOdd.toFixed(2);

  $('betModal').classList.add('active');
  updatePotential();
}

// ============================================================
// РАСЧЁТ СТАВОК
// ============================================================

function settleBets() {
  let changed = false;

  wallet.bets.forEach(b => {
    if (b.status !== 'pending') return;

    if (b.type === 'express') {
      let allFinished = true;
      let allWon = true;

      for (const sel of b.selections) {
        if (sel.status !== 'pending') continue;
        const m = matches.find(x => x.id === sel.matchId);
        if (!m || m.status !== 'finished') { allFinished = false; break; }

        let winner;
        if (m.scoreHome > m.scoreAway) winner = 'home';
        else if (m.scoreHome < m.scoreAway) winner = 'away';
        else winner = 'draw';

        // Проверка совпадения пика
        const isWin = (sel.pick === 'home' && winner === 'home')
                   || (sel.pick === 'away' && winner === 'away')
                   || (sel.pick === 'draw' && winner === 'draw');
        // Для не-1X2 рынков (тоталы, форы и т.д.) — упрощённая логика
        // (в реальном приложении был бы полноценный расчёт)
        if (sel.pick !== 'home' && sel.pick !== 'away' && sel.pick !== 'draw') {
          // Пока считаем выигрышем с шансом 50% (для демо)
          const fake = Math.random() < 0.5;
          if (!fake) { allWon = false; sel.status = 'lost'; }
          else sel.status = 'won';
          continue;
        }

        if (isWin) sel.status = 'won';
        else { sel.status = 'lost'; allWon = false; }
      }

      if (allFinished && b.selections.every(s => s.status !== 'pending')) {
        if (allWon && b.selections.every(s => s.status === 'won')) {
          b.status = 'won';
          b.payout = Math.round(b.stake * b.odd * 100) / 100;
          wallet.balance += b.payout;
          wallet.totalWon += b.payout;
          soundWin();
          showToast(`🎉 Экспресс! +${formatMoney(b.payout)} ₽`, 'success');
        } else {
          b.status = 'lost';
          soundLose();
        }
        changed = true;
      }
      return;
    }

    // Одиночная
    const m = matches.find(x => x.id === b.matchId);
    if (!m || m.status !== 'finished') return;

    let winner;
    if (m.scoreHome > m.scoreAway) winner = 'home';
    else if (m.scoreHome < m.scoreAway) winner = 'away';
    else winner = 'draw';

    let isWin = false;
    if (b.pick === 'home' || b.pick === 'away' || b.pick === 'draw') {
      isWin = b.pick === winner;
    } else {
      // Для расширенных рынков — упрощённо 50/50
      isWin = Math.random() < 0.5;
    }

    if (isWin) {
      b.status = 'won';
      b.payout = Math.round(b.stake * b.odd * 100) / 100;
      wallet.balance += b.payout;
      wallet.totalWon += b.payout;
      soundWin();
      showToast(`🎉 Выигрыш! +${formatMoney(b.payout)} ₽`, 'success');
    } else {
      b.status = 'lost';
      soundLose();
    }
    changed = true;
  });

  if (changed) {
    saveWallet();
    renderBalance();
    renderHistory();
    renderStats();
  }
}

// ============================================================
// ГЛАВНЫЙ ЦИКЛ
// ============================================================

function tick() {
  resetWalletIfNewDay();

  matches.forEach(m => { if (m.status === 'live') tickMatch(m); });

  // Заменяем завершённые через 8 сек
  matches = matches.map(m => {
    if (m.status === 'finished') {
      if (!m.finishedAt) m.finishedAt = Date.now();
      if (Date.now() - m.finishedAt > 8000) return createRandomMatch();
    }
    return m;
  });

  settleBets();
  renderMatches();
  renderLiveDrops();
}

function showToast(text, type = 'success') {
  const el = $('toast');
  el.textContent = text;
  el.className = `toast ${type} show`;
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 3000);
}

document.querySelectorAll('.nav button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    $(`tab-${btn.dataset.tab}`).classList.add('active');
    if (btn.dataset.tab === 'history') renderHistory();
    if (btn.dataset.tab === 'stats') renderStats();
  };
});

document.querySelectorAll('.filter:not(.toggle)').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.filter:not(.toggle)').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.sport;
    renderMatches();
  };
});

$('liveOnly').onclick = () => {
  liveOnly = !liveOnly;
  $('liveOnly').classList.toggle('active', liveOnly);
  renderMatches();
};

$('betModalStake').addEventListener('input', updatePotential);

document.querySelectorAll('.quick-stake').forEach(btn => {
  btn.onclick = () => {
    const v = btn.dataset.stake;
    $('betModalStake').value = v === 'all' ? Math.floor(wallet.balance) : v;
    updatePotential();
  };
});

$('betModalConfirm').onclick = placeBet;
$('betModalCoupon').onclick = () => {
  if (!activeBet) return;
  addToCoupon(activeBet.matchId, activeBet.pick, activeBet.odd,
    activeBet.pick === 'home' ? '1' : activeBet.pick === 'draw' ? 'X' : '2');
  closeBetModal();
};
$('betModal').onclick = (e) => { if (e.target.id === 'betModal') closeBetModal(); };

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeBetModal();
});

$('soundBtn').onclick = () => {
  soundOn = !soundOn;
  saveSoundPref();
  $('soundBtn').textContent = soundOn ? '🔊' : '🔇';
  $('soundBtn').classList.toggle('muted', !soundOn);
  if (soundOn) beep(880, 0.1);
};

$('resetBtn').onclick = () => {
  if (!confirm('Сбросить баланс до 20 000 ₽ и очистить историю?')) return;
  wallet = {
    balance: 20000,
    dailyLimit: 20000,
    lastReset: todayKey(),
    bets: [],
    totalBet: 0,
    totalWon: 0,
    sessionStart: todayKey(),
  };
  expressCoupon = [];
  saveWallet();
  saveCoupon();
  renderBalance();
  renderHistory();
  renderStats();
  renderCoupon();
  showToast('♻️ Сброшено', 'success');
};

// ============================================================
// СТАРТ
// ============================================================

loadWallet();
loadCoupon();
loadSoundPref();

const savedMatches = loadMatches();
matches = savedMatches || createMatches(15);

$('soundBtn').textContent = soundOn ? '🔊' : '🔇';
$('soundBtn').classList.toggle('muted', !soundOn);

renderBalance();
renderMatches();
renderHistory();
renderStats();
renderCoupon();

setInterval(tick, 1000);
setInterval(saveMatches, 2000);

console.log('%c⚡ OpenBet Simulator v2.0', 'font-size: 20px; font-weight: bold; color: #7b5cff;');
console.log('%cФейковые матчи · Реальные клубы · Виртуальные рубли', 'color: #00d4ff;');
console.log('%c20 000 ₽ каждый день в 00:00 UTC', 'color: #00e676;');
