/* ---------- КУПОН ---------- */
function showCoupon(){ $('coupon').classList.add('show'); }
function hideCoupon(){ $('coupon').classList.remove('show'); }

function addToCoupon(matchId, market, pickIdx, pickLbl, odds){
  const ex = State.coupon.findIndex(c => c.matchId === matchId && c.market === market && c.pickIdx === pickIdx);
  if(ex > -1){
    State.coupon.splice(ex, 1);
  } else {
    if(State.betType === 'single') State.coupon = [];
    else {
      const same = State.coupon.find(c => c.matchId === matchId);
      if(same){ toast('В экспрессе одна ставка на матч','err'); return; }
      if(State.coupon.length >= 12){ toast('Максимум 12 событий','err'); return; }
    }
    const m = Manager.find(matchId);
    if(!m) return;
    State.coupon.push({
      matchId, market, pickIdx, pickLbl, odds,
      home: m.home, away: m.away, sport: m.sport,
      startAt: m.startedAt,
    });
  }
  saveState();
  updateCoupon();
  updateMarketSel();
  if(State.coupon.length) showCoupon();
  else hideCoupon();
}

function updateCoupon(){
  const n = State.coupon.length;
  const cEl = $('cpCount'); if(cEl) cEl.textContent = n;

  let odds = State.betType === 'single' ? (n ? State.coupon[0].odds : 0)
    : (n ? State.coupon.reduce((a,c)=>a*c.odds,1) : 0);

  const oEl = $('cpOdds'); if(oEl) oEl.textContent = odds.toFixed(2);
  const soEl = $('cpSumOdds'); if(soEl) soEl.textContent = odds.toFixed(2);

  const items = $('cpItems');
  if(items){
    if(!n){
      items.innerHTML = '<div class="cp-empty"><div class="em">🎫</div>Купон пуст.<br>Нажмите на коэффициент.</div>';
    } else {
      items.innerHTML = State.coupon.map(c => {
        const ic = SPORTS.find(s => s.id === c.sport)?.ic || '🏆';
        return `<div class="cp-item">
          <div class="info">
            <div class="pick">${ic} ${esc(c.pickLbl)}</div>
            <div class="teams">${esc(c.home)} — ${esc(c.away)}</div>
            <div class="mkt">${esc(c.market)}</div>
          </div>
          <div class="coef">${c.odds.toFixed(2)}</div>
          <div class="x" data-mid="${c.matchId}" data-mkt="${esc(c.market)}" data-pick="${c.pickIdx}">✕</div>
        </div>`;
      }).join('');
    }
  }

  const stakeEl = $('cpStake');
  const stake = parseFloat(stakeEl?.value) || 0;
  const ss = $('cpSumStake'); if(ss) ss.textContent = fmtMoney(stake);
  const sw = $('cpSumWin'); if(sw) sw.textContent = fmtMoney(stake * odds);
  const p = $('cpPlace'); if(p) p.disabled = !n || stake < 10 || stake > State.balance;

  const navCoupon = $('bnavCoupon');
  if(navCoupon){
    navCoupon.textContent = n;
    navCoupon.style.display = n ? 'flex' : 'none';
  }
}

function updateMarketSel(){
  $$('.odd, .mkt-odd, .total-value, .btts-btn').forEach(el => {
    const mid = parseInt(el.dataset.mid);
    const mkt = el.dataset.mkt;
    const pick = parseInt(el.dataset.pick);
    if(!mkt) return;
    const sel = State.coupon.find(c => c.matchId === mid && c.market === mkt && c.pickIdx === pick);
    el.classList.toggle('sel', !!sel);
  });
}

function setBetType(type){
  State.betType = type;
  $$('.cp-type button').forEach(b => b.classList.toggle('on', b.dataset.type === type));
  if(type === 'single' && State.coupon.length > 1){
    State.coupon = [State.coupon[State.coupon.length-1]];
  }
  updateCoupon();
  saveState();
}

/* ---------- СТАВКА ---------- */
function placeBet(){
  if(!State.coupon.length) return;
  const stake = parseFloat($('cpStake').value) || 100;
  if(stake < 10){ toast('Минимум 10 ₽','err'); return; }
  if(stake > State.balance){ toast('Недостаточно средств','err'); return; }

  let odds = State.betType === 'single' ? State.coupon[0].odds : State.coupon.reduce((a,c)=>a*c.odds,1);
  const potential = stake * odds;

  State.balance -= stake;
  updateBalance();

  const id = Date.now() + Math.floor(Math.random()*1000);
  State.history.unshift({
    id, type: State.betType, stake, odds, potential,
    status: 'pending', createdAt: new Date().toISOString(),
    bets: State.coupon.map(c => ({...c})),
    result: null, cashoutAmount: null,
  });
  if(State.history.length > 200) State.history.length = 200;

  addTransaction('bet', -stake, `Ставка #${id}`);

  State.xp += Math.round(stake / 10);
  if(window.checkLevelUp) checkLevelUp();

  toast(`Ставка ${fmtMoney(stake)} принята`,'ok');
  State.coupon = [];
  updateCoupon();
  updateMarketSel();
  hideCoupon();
  saveState();
}

/* ---------- ПРОВЕРКА КУПОНА ---------- */
function checkCoupon(match){
  State.history.forEach(h => {
    if(h.status !== 'pending') return;
    h.bets.forEach(b => {
      if(b.matchId === match.id && !b.result){
        const mk = match.markets[b.market];
        if(!mk){ b.result = 'lose'; return; }
        b.result = determineResult(mk, b.pickIdx, match);
      }
    });
    if(h.bets.every(b => b.result)){
      const allWin = h.bets.every(b => b.result === 'win');
      h.status = allWin ? 'win' : 'lose';
      if(allWin){
        State.balance += h.potential;
        updateBalance();
        addTransaction('win', h.potential, `Выигрыш #${h.id}`);
        State.xp += Math.round(h.potential / 5);
        if(window.checkLevelUp) checkLevelUp();
        toast(`🎉 Купон! +${fmtMoney(h.potential)}`,'ok');
      } else {
        addTransaction('lose', 0, `Проигрыш #${h.id}`);
      }
      saveState();
    }
  });
}
window.checkCoupon = checkCoupon;

function determineResult(mk, idx, m){
  if(!mk) return 'lose';
  const h = m.hs, a = m.as, t = h+a;
  switch(mk.type){
    case '1x2':
      if(idx===0) return h>a?'win':'lose';
      if(idx===1) return h===a?'win':'lose';
      return a>h?'win':'lose';
    case 'dc':
      if(idx===0) return h>=a?'win':'lose';
      if(idx===1) return h!==a?'win':'lose';
      return a>=h?'win':'lose';
    case 'win':
      return idx===0 ? (h>a?'win':'lose') : (a>h?'win':'lose');
    case 'over':
      return ((t>mk.line)===(idx===0))?'win':'lose';
    case 'overR':{
      const rounds = m.finalNote ? (m.finalNote.match(/раунде (\d)/i) ? parseInt(m.finalNote.match(/раунде (\d)/i)[1]) : 5) : Math.min(5, Math.floor(m.gameTime()));
      return ((rounds>mk.line)===(idx===0))?'win':'lose';
    }
    case 'btts':{
      const both = h>0 && a>0;
      return ((idx===0)===both)?'win':'lose';
    }
    case 'itb1': return ((h>mk.line)===(idx===0))?'win':'lose';
    case 'itb2': return ((a>mk.line)===(idx===0))?'win':'lose';
    case 'hand1': return ((h+mk.line-a>0)===(idx===0))?'win':'lose';
    case 'hand2': return ((a+mk.line-h>0)===(idx===0))?'win':'lose';
    case 'parity': return ((t%2===0)===(idx===0))?'win':'lose';
    case 'corners':{
      const c = m.stats.corners.h+m.stats.corners.a;
      return ((c>mk.line)===(idx===0))?'win':'lose';
    }
    case 'cards':{
      const c = m.stats.yellow.h+m.stats.yellow.a+(m.stats.red.h+m.stats.red.a)*2;
      return ((c>mk.line)===(idx===0))?'win':'lose';
    }
    case 'shots':{
      const s = m.stats.shots.h+m.stats.shots.a;
      return ((s>mk.line)===(idx===0))?'win':'lose';
    }
    case 'hits':{
      const hits = m.stats.sigStrikes.h+m.stats.sigStrikes.a;
      return ((hits>mk.line)===(idx===0))?'win':'lose';
    }
    case 'takedowns':{
      const td = m.stats.takedowns.h+m.stats.takedowns.a;
      return ((td>mk.line)===(idx===0))?'win':'lose';
    }
    case 'method':{
      const note = m.finalNote || '';
      if(idx===0) return note.includes('KO/TKO') ? 'win' : 'lose';
      if(idx===1) return note.includes('Сабмишен') ? 'win' : 'lose';
      if(idx===2) return note.includes('решением') ? 'win' : 'lose';
    }
    case 'round':{
      const note = m.finalNote || '';
      const match = note.match(/раунде (\d)/i);
      const r = match ? match[1] : '';
      return mk.lbl[idx] === r ? 'win' : 'lose';
    }
  }
  return 'lose';
}

/* ---------- КЭШАУТ ---------- */
function calcCashout(h){
  if(h.status !== 'pending' || !h.bets.length) return 0;
  if(h.type === 'single') return calcSingle(h, h.bets[0]);
  return calcExpress(h);
}
function calcSingle(h, b){
  const m = Manager.find(b.matchId);
  if(!m) return h.stake*0.5;
  const mk = m.markets[b.market];
  if(!mk) return h.stake*0.5;
  if(mk.closed && mk.closed[b.pickIdx]) return mk.result==='win' ? h.potential*0.98 : 0;
  let o = mk.val[b.pickIdx]; if(!o || o<1.01) o = 1.01;
  const p = 1/o;
  let c = h.potential * p * 0.94;
  c = Math.min(c, h.potential*0.98);
  c = Math.max(c, h.stake*0.3);
  return Math.max(0, Math.round(c/10)*10);
}
function calcExpress(h){
  let prob = 1, anyLose = false, allWon = true;
  for(const b of h.bets){
    const m = Manager.find(b.matchId);
    if(!m){ prob*=0.5; continue; }
    const mk = m.markets[b.market];
    if(!mk){ prob*=0.5; continue; }
    if(mk.closed && mk.closed[b.pickIdx]){
      if(mk.result==='win') continue;
      anyLose = true; break;
    }
    allWon = false;
    let o = mk.val[b.pickIdx]; if(!o || o<1.01) o = 1.01;
    prob *= 1/o;
  }
  if(anyLose) return 0;
  if(allWon) return h.potential * 0.97;
  let c = h.potential * prob * 0.92;
  c = Math.min(c, h.potential*0.97);
  c = Math.max(c, h.stake*0.25);
  return Math.max(0, Math.round(c/10)*10);
}

function doCashout(id){
  const h = State.history.find(x=>x.id===id);
  if(!h || h.status!=='pending'){ toast('Недоступно','err'); return; }
  const amt = calcCashout(h);
  if(amt <= 0){ toast('Кэшаут недоступен','err'); return; }
  if(!confirm(`Кэшаут ${fmtMoney(amt)}?`)) return;
  h.status = 'cashout';
  h.cashoutAmount = amt;
  State.balance += amt;
  updateBalance();
  addTransaction('cashout', amt, `Кэшаут #${h.id}`);
  saveState();
  toast(`💰 Кэшаут +${fmtMoney(amt)}`,'ok');
  openHistory();
}

function updateCashouts(){
  let changed = false;
  State.history.forEach(h => {
    if(h.status !== 'pending') return;
    const a = calcCashout(h);
    if(a !== h.cashoutAmount){ h.cashoutAmount = a; changed = true; }
  });
  if(changed) saveState();
}

/* ---------- ТРАНЗАКЦИИ ---------- */
function addTransaction(type, amount, note){
  try {
    const key = STORAGE_KEY + '_transactions';
    let list = JSON.parse(localStorage.getItem(key) || '[]');
    list.unshift({
      id: Date.now() + Math.random(),
      type, amount, note,
      date: new Date().toISOString(),
    });
    if(list.length > 200) list.length = 200;
    localStorage.setItem(key, JSON.stringify(list));
  } catch(e){}
}
function getTransactions(){
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY + '_transactions') || '[]');
  } catch(e){ return []; }
}

function renderHistoryList(){

  const box = $('histList');

  if(!list.length){
    box.innerHTML = '<div class="cp-empty"><div class="em">📭</div>Ставок нет</div>';
    return;
  }
  box.innerHTML = list.map(h => {
    const dt = new Date(h.createdAt);
    const time = dt.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});

    const statusL = {win:'Выигрыш', lose:'Проигрыш', pending:'В игре', cashout:'Кэшаут'}[h.status];
    const statusClr = h.status==='win'?'var(--green2)':h.status==='lose'?'var(--red2)':'var(--yellow)';
    const co = h.status==='pending' ? calcCashout(h) : 0;
    let amount = '';
    if(h.status==='win') amount = `<span style="color:var(--green2);font-weight:800">+${fmtMoney(h.potential)}</span>`;
    else if(h.status==='lose') amount = `<span style="color:var(--red2);font-weight:800">-${fmtMoney(h.stake)}</span>`;
    else if(h.status==='cashout') amount = `<span style="color:var(--yellow);font-weight:800">+${fmtMoney(h.cashoutAmount||0)}</span>`;
    else amount = `<span style="color:var(--yellow);font-weight:800">${fmtMoney(h.potential)}</span>`;

    return `<div style="background:var(--card2);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--t3);margin-bottom:6px">
        <span>${day} · ${time} · ${typeL}</span>
        <span style="font-weight:800;color:${statusClr}">${statusL}</span>
      </div>
      ${h.bets.map(b => `<div style="font-size:12.5px;font-weight:700;margin-bottom:2px">${esc(b.pickLbl)} · ${esc(b.market)}</div>
        <div style="font-size:11px;color:var(--t3)">${esc(b.home)} — ${esc(b.away)}</div>`).join('')}
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:8px;border-top:1px solid var(--bd)">
        <span style="font-size:11.5px;color:var(--t3)">${fmtMoney(h.stake)} · коэф ${h.odds.toFixed(2)}</span>
        <span>${amount}</span>
      </div>
      ${co > 0 ? `<button style="width:100%;margin-top:8px;padding:9px;background:linear-gradient(135deg,#f0b840,#e8a020);color:#0b172a;font-weight:800;border-radius:8px;font-size:12.5px;cursor:pointer" onclick="doCashout(${h.id})">💰 Кэшаут ${fmtMoney(co)}</button>` : ''}
    </div>`;
  }).join('');
}

/* ---------- ТРАНЗАКЦИИ UI ---------- */
function openTransactions(){
  const list = getTransactions();
  const labels = {
    deposit:'Пополнение', win:'Выигрыш', bet:'Ставка',
    lose:'Проигрыш', cashout:'Кэшаут', bonus:'Бонус'
  };
  openModal(`
    <div class="mdl-grip"></div>
    <div class="mdl-h">
      <div><div class="t">Транзакции</div><div class="s">Всего: ${list.length}</div></div>
      <div class="mdl-x" onclick="closeModal()">✕</div>
    </div>
    ${!list.length ? '<div class="cp-empty"><div class="em">💳</div>Транзакций нет</div>' :
      list.map(t => {
        const d = new Date(t.date);
        const dt = d.toLocaleDateString('ru-RU') + ' ' + d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
        const pos = ['deposit','win','cashout','bonus'].includes(t.type);
        const clr = pos ? 'var(--green2)' : 'var(--red2)';
        const sign = pos ? '+' : '';
        return `<div style="background:var(--card2);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center">
          <div>
            <div style="font-size:13px;font-weight:700">${labels[t.type] || t.type}</div>
            <div style="font-size:11px;color:var(--t3);margin-top:2px">${dt}</div>
          </div>
          <div style="font-size:14px;font-weight:900;color:${clr}">${sign}${fmtMoney(Math.abs(t.amount))}</div>
        </div>`;
      }).join('')
    }
  `);
}

/* ---------- СОХРАНЕНИЕ МАТЧА ---------- */
function saveToHistory(m){
  State.matchHistory.unshift({
    id: m.id, sport: m.sport, league: m.league,
    home: m.home, away: m.away, hs: m.hs, as: m.as,
    finalNote: m.finalNote || '',
    finishedAt: Date.now(),
  });
  if(State.matchHistory.length > 50) State.matchHistory.length = 50;
  saveState();
}
window.saveToHistory = saveToHistory;

/* ---------- ЭКСПОРТ ---------- */
window.openHistory = openHistory;
window.openTransactions = openTransactions;
window.closeModal = closeModal;
window.doCashout = doCashout;

/* ---------- КЛИКИ ПО ИСТОРИИ ---------- */
document.addEventListener('click', e => {
  const h = e.target.closest('[data-hist]');
  if(h){ State.histFilter = h.dataset.hist; openHistory(); return; }
});

/* === КОНЕЦ ЧАСТИ 5 === */
  /* === ЧАСТЬ 6: УРОВНИ + БОНУС + SUSPENSION + PWA + INIT === */

/* ---------- УРОВНИ ---------- */
function xpForLevel(l){ return l * 1000; }

const LEVEL_NAMES = {
  1:'Новичок',
  2:'Бронза',
  3:'Серебро',
  4:'Золото',
  5:'Платина',
};

function checkLevelUp(){
  const needed = xpForLevel(State.level);
  if(State.xp >= needed){
    State.xp -= needed;
    State.level++;
    if(State.level > 5) State.level = 5;
    // Бонус за уровень
    const bonuses = {2:500, 3:1000, 4:2500, 5:5000};
    const bonus = bonuses[State.level];
    if(bonus){
      State.balance += bonus;
      updateBalance();
      addTransaction('bonus', bonus, `Бонус уровня ${State.level}`);
      toast(`🏅 Уровень ${State.level} — ${LEVEL_NAMES[State.level]}! +${fmtMoney(bonus)}`, 'ok');
    } else {
      toast(`🏅 Новый уровень: ${State.level}`, 'ok');
    }
    saveState();
  }
}
window.checkLevelUp = checkLevelUp;

/* ---------- ЕЖЕДНЕВНЫЙ БОНУС 7 ДНЕЙ ---------- */
const BONUS_DAYS = [500, 700, 1000, 1500, 2000, 3000, 5000];

function canClaimBonus(){
  const today = new Date().toDateString();
  return State.lastBonusDate !== today;
}

function claimBonus(){
  const today = new Date().toDateString();
  if(State.lastBonusDate === today){ toast('Бонус уже получен','err'); return; }
  
  // Проверяем был ли вчера — если пропустил, начинаем с 1
  const yesterday = new Date();
  yesterday.setDate(yesterday.getDate() - 1);
  const wasYesterday = State.lastBonusDate === yesterday.toDateString();
  
  if(!wasYesterday && State.lastBonusDate){
    // Пропустил день — начинаем с 1
    State.bonusDay = 1;
  }
  
  if(State.bonusDay > 7) State.bonusDay = 1;
  
  const amount = BONUS_DAYS[State.bonusDay - 1];
  State.balance += amount;
  State.lastBonusDate = today;
  State.xp += 100;
  checkLevelUp();
  
  // Переходим на следующий день
  State.bonusDay = State.bonusDay >= 7 ? 1 : State.bonusDay + 1;
  
  updateBalance();
  addTransaction('bonus', amount, `Бонус дня ${State.bonusDay - 1 || 7}`);
  saveState();
  toast(`🎁 Бонус +${fmtMoney(amount)}`, 'ok');
  openProfile();
}
window.claimBonus = claimBonus;

/* ---------- ПРОФИЛЬ ---------- */
function openProfile(){
  const total = State.history.length;
  const win = State.history.filter(h=>h.status==='win').length;
  const lose = State.history.filter(h=>h.status==='lose').length;
  const totalStake = State.history.reduce((a,h)=>a+h.stake, 0);
  const totalWin = State.history.filter(h=>h.status==='win').reduce((a,h)=>a+h.potential, 0);
  const totalCO = State.history.filter(h=>h.status==='cashout').reduce((a,h)=>a+(h.cashoutAmount||0), 0);
  const profit = (totalWin + totalCO) - totalStake;
  const roi = totalStake > 0 ? ((profit/totalStake)*100).toFixed(1) : '0.0';
  const remain = MAX_DAILY_DEPOSIT - State.dailyAmount;
  const canBonus = canClaimBonus();
  const xpNeeded = xpForLevel(State.level);
  const xpPct = Math.min(100, (State.xp / xpNeeded) * 100);
  const levelName = LEVEL_NAMES[State.level] || 'Новичок';

  // Календарь бонусов
  let bonusCalendar = '';
  for(let i=1; i<=7; i++){
    const isActive = i === State.bonusDay;
    const isPast = i < State.bonusDay;
    const isClaimed = i < State.bonusDay;
    bonusCalendar += `<div style="flex:1;min-width:0;padding:8px 2px;text-align:center;border-radius:6px;background:${isActive?'var(--yellow)':'var(--card3)'};border:1px solid ${isActive?'var(--yellow)':'var(--bd)'}">
      <div style="font-size:9px;font-weight:800;color:${isActive?'var(--bg)':'var(--t3)'};margin-bottom:2px">День ${i}</div>
      <div style="font-size:10px;font-weight:900;color:${isActive?'var(--bg)':'var(--t2)'}">${BONUS_DAYS[i-1]}</div>
    </div>`;
  }

  openModal(`
    <div class="mdl-grip"></div>
    <div class="mdl-h">
      <div>
        <div class="t">Профиль</div>
        <div class="s">${levelName} · Уровень ${State.level} · ${State.xp}/${xpNeeded} XP</div>
      </div>
      <div class="mdl-x" onclick="closeModal()">✕</div>
    </div>

    <div style="height:4px;background:var(--card3);border-radius:2px;margin-bottom:14px;overflow:hidden">
      <div style="height:100%;width:${xpPct}%;background:linear-gradient(90deg,var(--yellow),var(--yellow2));transition:width .3s"></div>
    </div>

    ${canBonus ? `
      <div style="background:linear-gradient(135deg,rgba(255,217,74,.2),rgba(255,217,74,.05));border:1px solid var(--yellow);border-radius:10px;padding:14px;margin-bottom:12px">
        <div style="font-size:13px;font-weight:800;margin-bottom:8px;color:var(--yellow);text-align:center">🎁 Бонус дня ${State.bonusDay}!</div>
        <div style="display:flex;gap:4px;margin-bottom:10px">${bonusCalendar}</div>
        <button style="width:100%;padding:11px;background:var(--yellow);color:var(--bg);font-weight:900;border-radius:8px;font-size:13px;cursor:pointer" onclick="claimBonus()">Забрать ${BONUS_DAYS[State.bonusDay-1]} ₽</button>
      </div>
    ` : `
      <div style="background:var(--card2);border-radius:10px;padding:12px;margin-bottom:12px">
        <div style="font-size:11px;color:var(--t3);text-transform:uppercase;font-weight:700;margin-bottom:8px">Календарь бонусов</div>
        <div style="display:flex;gap:4px">${bonusCalendar}</div>
      </div>
    `}

    <div style="background:var(--card2);border-radius:10px;padding:14px;margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px">
        <span style="color:var(--t3)">Баланс</span>
        <span style="color:var(--yellow);font-weight:900;font-size:16px">${fmtMoney(State.balance)}</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px">
        <span style="color:var(--t3)">ROI</span>
        <span style="color:${profit>=0?'var(--green2)':'var(--red2)'};font-weight:800">${roi}%</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:12px">
        <span style="color:var(--t3)">Прибыль</span>
        <span style="color:${profit>=0?'var(--green2)':'var(--red2)'};font-weight:800">${fmtMoney(profit)}</span>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">
      ${[['Ставок',total],['Побед',win],['Проигр.',lose],['Сумма',fmtMoney(totalStake)]].map(([l,v])=>
        `<div style="background:var(--card2);border:1px solid var(--bd);border-radius:8px;padding:10px">
          <div style="font-size:10.5px;color:var(--t3);text-transform:uppercase;font-weight:700;margin-bottom:4px">${l}</div>
          <div style="font-size:15px;font-weight:900">${v}</div>
        </div>`
      ).join('')}
    </div>

    <div style="background:var(--card2);border-radius:10px;padding:12px;margin-bottom:12px">
      <div style="font-size:11px;color:var(--t3);text-transform:uppercase;font-weight:700;margin-bottom:8px">Пополнение · лимит ${fmtMoney(MAX_DAILY_DEPOSIT)}/день</div>
      <div style="font-size:12px;margin-bottom:10px">Осталось: <b style="color:var(--yellow)">${fmtMoney(remain)}</b></div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px">
        ${[500,1000,5000,10000].map(v=>`<button class="time-btn" onclick="deposit(${v})" style="justify-content:center">${v.toLocaleString('ru-RU')}</button>`).join('')}
      </div>
    </div>

    <button style="width:100%;padding:12px;border-radius:8px;background:var(--card2);border:1px solid var(--bd);color:var(--t);font-weight:700;font-size:13px;cursor:pointer;margin-bottom:8px" onclick="closeModal();openHistory()">📜 История ставок</button>
    <button style="width:100%;padding:12px;border-radius:8px;background:var(--card2);border:1px solid var(--bd);color:var(--t);font-weight:700;font-size:13px;cursor:pointer" onclick="closeModal();openTransactions()">💳 Транзакции</button>
  `);
}
window.openProfile = openProfile;

/* ---------- ДЕПОЗИТ ---------- */
function deposit(amount){
  const remain = MAX_DAILY_DEPOSIT - State.dailyAmount;
  if(amount > remain){ toast(`Лимит. Осталось ${fmtMoney(remain)}`,'err'); return; }
  State.balance += amount;
  State.dailyAmount += amount;
  updateBalance();
  addTransaction('deposit', amount, 'Пополнение');
  saveState();
  toast(`+${fmtMoney(amount)}`,'ok');
  openProfile();
}
window.deposit = deposit;

/* ---------- SUSPENSION ТАЙМЕР (обновление каждые 100мс) ---------- */
setInterval(() => {
  // Обновляем data-susp у заблокированных кэфов
  $$('.odd.cl[data-susp]').forEach(el => {
    const mid = parseInt(el.dataset.mid);
    const m = Manager.find(mid);
    if(m && m.isSuspended()){
      const left = Math.ceil((m.suspendedUntil - Date.now()) / 1000);
      const newText = `⏸ ${left}с`;
      if(el.dataset.susp !== newText){
        el.dataset.susp = newText;
        // Обновляем отображение через ::after — не можем изменить напрямую, поэтому перезаписываем через style
        el.style.setProperty('--susp', `"${newText}"`);
      }
    }
  });
  // Перерисовать рынки если таб открыт и что-то suspended
  if(State.currentMatchId && State.currentTab === 'markets'){
    const m = currentMatch();
    if(m && m.isSuspended()){
      const box = $('marketsContainer');
      const notice = box.querySelector('div[style*="rgba(232,69,60"]');
      if(notice){
        const left = Math.ceil((m.suspendedUntil - Date.now()) / 1000);
        notice.textContent = `⚠️ Котировки недоступны · ${left}с`;
      }
    }
  }
}, 100);

/* ---------- PWA МАНИФЕСТ ---------- */
(function(){
  try {
    const manifest = {
      name: 'SportLive — Линия',
      short_name: 'SportLive',
      start_url: '.',
      display: 'standalone',
      background_color: '#0f1e35',
      theme_color: '#0f1e35',
      icons: [{
        src: 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 fill=%22%230f1e35%22/%3E%3Ctext x=%2250%22 y=%2265%22 font-size=%2260%22 text-anchor=%22middle%22 fill=%22%23ffd94a%22%3E%E2%9A%A1%3C/text%3E%3C/svg%3E',
        sizes: '192x192',
        type: 'image/svg+xml'
      }]
    };
    const blob = new Blob([JSON.stringify(manifest)], {type: 'application/manifest+json'});
    const url = URL.createObjectURL(blob);
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = url;
    document.head.appendChild(link);
  } catch(e){}
})();

/* ---------- КЛИКИ ПО ПРОФИЛЮ ---------- */
document.addEventListener('click', e => {
  if(e.target.closest('#btnProfile') || e.target.closest('#balanceBtn')){
    e.preventDefault();
    openProfile();
    return;

  loadState();
  updateBalance();
  Manager.init();

  renderSportsRow();

  renderLiveSection();

  setInterval(mainTick, 500);

  setInterval(saveState, 10000);

  setTimeout(() => toast('👋 Добро пожаловать в SportLive!','ok'), 700);

  // Напоминание о бонусе
  setTimeout(() => {
    if(canClaimBonus()){
      toast('🎁 Бонус дня ждёт в профиле','ok');
    }
  }, 3500);

  console.log(`%c✅ Готово. Матчей: ${Manager.matches.length}`, 'color:#66d96a;font-size:12px');
}

init();
