<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1a1c2e">
<title>⚡ OpenBet</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
input{outline:none}
:root{--bg:#f4f5f8;--card:#fff;--border:#e8eaf0;--text:#0d0e1c;--text-2:#4a4d63;--muted:#878a9e;--accent:#e60023;--green:#00a854;--gold:#f0b400;--header:#1a1c2e;--odd:#f0f2f6;--odd-hover:#e5e8ef}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.coupon-open{overflow:hidden}

/* ============ AUTH SCREEN ============ */
.auth-screen{position:fixed;inset:0;background:linear-gradient(160deg,#1a1c2e 0%,#2a2d45 100%);display:flex;align-items:center;justify-content:center;padding:20px;z-index:1000}
.auth-card{background:#fff;border-radius:20px;padding:28px 24px;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.auth-logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px}
.auth-logo-icon{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#e60023,#ff6b6b);display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 4px 20px rgba(230,0,35,.4)}
.auth-logo span{font-size:26px;font-weight:900;letter-spacing:-.5px;background:linear-gradient(135deg,#1a1c2e,#4a4d63);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.auth-sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:24px;font-weight:600}
.auth-tabs{display:flex;background:#f0f2f6;border-radius:10px;padding:4px;margin-bottom:20px}
.auth-tab{flex:1;padding:10px;border-radius:8px;font-size:14px;font-weight:700;color:var(--muted);transition:all .2s;text-align:center}
.auth-tab.active{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.auth-form{display:flex;flex-direction:column;gap:12px}
.auth-input{background:#f8f9fc;border:1.5px solid transparent;padding:14px 16px;border-radius:10px;font-size:15px;font-weight:600;transition:all .15s}
.auth-input:focus{border-color:var(--accent);background:#fff}
.auth-input::placeholder{color:var(--muted);font-weight:500}
.auth-error{color:var(--accent);font-size:12px;font-weight:700;padding:8px 12px;background:#ffe5e9;border-radius:8px;display:none}
.auth-error.show{display:block}
.auth-submit{background:linear-gradient(135deg,#e60023,#ff3860);color:#fff;padding:16px;border-radius:10px;font-size:16px;font-weight:800;margin-top:8px;box-shadow:0 4px 20px rgba(230,0,35,.35);transition:transform .15s}
.auth-submit:active{transform:scale(.98)}
.auth-hint{text-align:center;color:var(--muted);font-size:12px;margin-top:16px;line-height:1.5}

/* ============ APP ============ */
.app-wrap{display:none}
.app-wrap.active{display:block}

/* TOP HEADER */
.top-header{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid var(--border);color:var(--text);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:60px}
.top-header .title{font-size:20px;font-weight:800;letter-spacing:-.4px}
.top-header .title.center{flex:1;text-align:center}
.top-header .back-btn{width:36px;height:36px;border-radius:50%;background:#f0f2f6;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--text);cursor:pointer;flex-shrink:0}
.balance-pill{background:#f0f2f6;padding:8px 14px;border-radius:20px;font-weight:800;font-size:13px;color:var(--text);font-variant-numeric:tabular-nums;cursor:pointer}
.top-tabs{display:flex;gap:16px;padding:0 16px;background:#fff;border-bottom:1px solid var(--border)}
.top-tab{padding:12px 0;font-size:15px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;background:none}
.top-tab.active{color:var(--text);border-bottom-color:var(--text)}
.top-icons{display:flex;gap:14px;align-items:center}
.top-icons .icon{font-size:20px;cursor:pointer;color:var(--text-2)}

/* SPORT TABS */
.sport-tabs{background:#fff;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;position:sticky;top:60px;z-index:99}
.sport-tabs::-webkit-scrollbar{display:none}
.sport-tabs-inner{display:flex;padding:0 8px;min-width:max-content}
.sport-tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 18px;font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px;transition:color .15s;background:none;cursor:pointer}
.sport-tab.active{color:var(--text);border-bottom-color:var(--accent)}
.sport-tab .icon{font-size:22px;line-height:1}
.sport-tab .count{font-size:10px;font-weight:500}
.sport-tab.active .count{color:var(--accent)}

/* FILTER */
.filter-row{background:#fff;padding:12px 16px;display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--border)}
.filter-row::-webkit-scrollbar{display:none}
.filter-chip{padding:8px 16px;border-radius:20px;background:#f0f2f6;font-size:13px;font-weight:600;color:var(--text-2);white-space:nowrap;display:flex;align-items:center;gap:6px;cursor:pointer}
.filter-chip.active{background:var(--accent);color:#fff}
.filter-chip .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.filter-chip.active .dot{background:#fff}

/* MAIN */
.main{padding-bottom:80px}
.league-block{background:#fff;margin-bottom:8px}
.league-head{background:#eef0f5;padding:10px 16px;display:flex;align-items:center;gap:10px}
.league-head .league-icon{width:26px;height:26px;border-radius:4px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:14px}
.league-head .league-name{font-size:13px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.league-head .league-filter{font-size:16px;color:var(--muted);padding:4px;background:none;cursor:pointer}

/* MATCH ROW */
.match-row{display:grid;grid-template-columns:18px 1fr 62px 62px 62px;border-bottom:1px solid var(--border);background:#fff;cursor:pointer;position:relative;transition:background .12s}
.match-row:last-child{border-bottom:none}
.match-row:active{background:#fafbfd}
.match-row .arrow{color:#c0c4d0;font-size:16px;display:flex;align-items:center;justify-content:center;padding-left:4px}
.match-row .teams{display:flex;flex-direction:column;gap:3px;min-width:0;padding:12px 8px 12px 4px}
.match-row .team-line{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;overflow:hidden}
.match-row .team-logo{width:18px;height:18px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;color:#fff}
.match-row .team-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.match-row .team-score{font-weight:800;font-size:14px;margin-left:auto;padding-left:6px;font-variant-numeric:tabular-nums}
.match-row .team-score.red{color:var(--accent)}
.match-row .time{font-size:11px;color:var(--muted);font-weight:500;padding-left:26px;margin-top:2px;display:flex;align-items:center;gap:4px}
.match-row .time.live{color:var(--green);font-weight:700}
.match-row .time.prematch{color:var(--text-2)}
.match-row .live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.odd-cell{display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;border-left:1px solid var(--border);cursor:pointer;min-height:60px;padding:8px 4px;transition:background .12s;font-variant-numeric:tabular-nums;color:var(--text)}
.odd-cell:active{background:var(--odd-hover)}
.odd-cell.selected{background:var(--accent);color:#fff}
.odd-cell.disabled,.odd-cell.dash{color:#c0c4d0;cursor:default}
.show-all{display:block;margin:12px 16px;padding:14px;text-align:center;background:#fff;border-radius:12px;font-size:14px;font-weight:600;border:1px solid var(--border);width:calc(100% - 32px);cursor:pointer}

/* MATCH HEADER (Fonbet style — green gradient) */
.match-top{padding:14px 16px;background:linear-gradient(135deg,#2a5c2a 0%,#1d4420 100%);color:#fff;position:relative}
.match-top .mt-crumbs{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;font-weight:600}
.match-top .mt-icons{display:flex;gap:16px;font-size:20px}
.match-top .mt-tabs{display:flex;gap:20px;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.15)}
.match-top .mt-tab{font-size:13px;font-weight:700;color:rgba(255,255,255,.6);padding-bottom:6px;border-bottom:2px solid transparent;cursor:pointer;background:none}
.match-top .mt-tab.active{color:#fff;border-bottom-color:#fff}
.match-top .mt-team{display:flex;align-items:center;gap:12px;padding:8px 0;font-size:16px;font-weight:700}
.match-top .mt-team .flag{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;background:rgba(255,255,255,.15);flex-shrink:0}
.match-top .mt-team .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.match-top .mt-team .score{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.match-top .mt-time{font-size:13px;color:rgba(255,255,255,.8);margin-top:8px;font-variant-numeric:tabular-nums}

/* MARKET LIST (Fonbet style — big list with stars) */
.market-list{background:#fff}
.market-row{display:flex;align-items:center;gap:12px;padding:16px;border-bottom:1px solid var(--border);cursor:pointer;background:#fff;transition:background .12s}
.market-row:active{background:#fafbfd}
.market-row .mstar{font-size:18px;color:#c0c4d0;flex-shrink:0}
.market-row .mstar.active{color:var(--gold)}
.market-row .mtitle{flex:1;font-size:15px;font-weight:600;color:var(--text)}
.market-row .mchevron{font-size:14px;color:var(--muted)}
.market-body-open{display:block;padding:0 16px 16px;border-bottom:1px solid var(--border)}
.market-body-closed{display:none}

.market-tabs-sub{display:flex;background:#fff;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;padding:0 8px}
.market-tabs-sub::-webkit-scrollbar{display:none}
.mt-sub{padding:12px 14px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;background:none}
.mt-sub.active{color:var(--text);border-bottom-color:var(--accent)}

/* ODD BUTTONS */
.odds-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.odds-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.odd-btn{background:var(--odd);border-radius:8px;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;font-weight:700;min-height:48px;text-align:left;transition:background .12s;cursor:pointer;color:var(--text);border:none}
.odd-btn:active:not(.disabled){background:var(--odd-hover)}
.odd-btn.selected{background:var(--accent);color:#fff}
.odd-btn .lbl{color:var(--muted);font-weight:600;font-size:13px;flex-shrink:0}
.odd-btn.selected .lbl{color:rgba(255,255,255,.85)}
.odd-btn .val{font-weight:800;font-size:15px;margin-left:auto;font-variant-numeric:tabular-nums}
.odd-btn.disabled{opacity:.35;cursor:not-allowed}
.odds-labeled{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px}
.odds-labeled .col-head{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;padding:0 4px;margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.line-selector{display:flex;gap:4px;padding:10px 0;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--border);margin-bottom:10px}
.line-selector::-webkit-scrollbar{display:none}
.line-opt{padding:8px 14px;background:#f0f2f6;border-radius:8px;font-size:13px;font-weight:700;color:var(--text-2);white-space:nowrap;border:1.5px solid transparent;cursor:pointer}
.line-opt.active{background:#fff;color:var(--text);border-color:var(--text);font-weight:800}

/* STATS */
.stat-params{display:flex;background:#fff;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;padding:0 8px}
.stat-params::-webkit-scrollbar{display:none}
.stat-param{padding:12px 14px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;background:none}
.stat-param.active{color:var(--text);border-bottom-color:var(--accent)}
.stat-counter{display:flex;justify-content:center;align-items:center;gap:16px;padding:16px;background:#f8f9fc;border-radius:12px;margin:8px;text-align:center}
.stat-counter .cnt-h,.stat-counter .cnt-a{font-size:26px;font-weight:900;min-width:40px;font-variant-numeric:tabular-nums}
.stat-counter .cnt-h{color:var(--accent)}
.stat-counter .lbl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}

/* BOTTOM TAB BAR */
.tab-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(4,1fr);z-index:200;padding-bottom:env(safe-area-inset-bottom)}
.tab-bar-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 8px;font-size:10px;font-weight:600;color:var(--muted);position:relative;cursor:pointer;background:none;border:none}
.tab-bar-item.active{color:var(--accent)}
.tab-bar-item .tab-icon{font-size:22px;line-height:1}
.tab-bar-item .badge{position:absolute;top:4px;right:calc(50% - 20px);min-width:18px;height:18px;background:var(--accent);color:#fff;border-radius:9px;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px;box-sizing:border-box}

/* FLOATING COUPON */
.floating-coupon{position:fixed;bottom:70px;left:8px;right:8px;background:#fff;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 32px rgba(20,20,40,.18);z-index:190;cursor:pointer;border:1px solid var(--border)}
.floating-coupon .fc-icon{width:34px;height:34px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;flex-shrink:0}
.floating-coupon .fc-info{flex:1;min-width:0}
.floating-coupon .fc-match{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.floating-coupon .fc-pick{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.floating-coupon .fc-odd{font-size:18px;font-weight:900;flex-shrink:0;font-variant-numeric:tabular-nums}

/* COUPON PANEL */
.coupon-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;opacity:0;pointer-events:none;transition:opacity .3s}
.coupon-overlay.active{opacity:1;pointer-events:auto}
.coupon-panel{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:20px 20px 0 0;z-index:310;transform:translateY(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);max-height:88vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.coupon-panel.active{transform:translateY(0)}
.coupon-head{padding:18px 16px 8px;display:flex;align-items:center;gap:12px;position:relative}
.coupon-head .grab{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:36px;height:4px;background:#e0e2ea;border-radius:2px}
.coupon-head .settings{font-size:18px;color:var(--muted);width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:none}
.coupon-head .tabs{display:flex;gap:20px;flex:1;justify-content:center}
.coupon-head .ct{font-size:15px;font-weight:600;color:var(--muted);padding-bottom:8px;border-bottom:2px solid transparent;cursor:pointer;background:none}
.coupon-head .ct.active{color:var(--text);border-bottom-color:var(--accent)}
.coupon-head .close-btn{font-size:20px;color:var(--muted);width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:#f0f2f6;cursor:pointer;border:none}
.coupon-body{flex:1;overflow-y:auto;padding:8px 16px 16px}
.coupon-empty{padding:40px 20px;text-align:center;color:var(--muted)}
.coupon-empty .icon{font-size:48px;margin-bottom:12px;opacity:.4}
.coupon-empty .txt{font-size:14px;font-weight:600}
.coupon-item{background:#f8f9fc;border-radius:12px;padding:14px;margin-bottom:10px}
.coupon-item .ci-head{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:8px}
.coupon-item .ci-score{background:#dbeafe;color:#2563eb;font-weight:800;padding:2px 8px;border-radius:4px;font-size:11px}
.coupon-item .ci-league{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.coupon-item .ci-remove{font-size:22px;color:var(--muted);width:24px;height:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:none;border:none}
.coupon-item .ci-pick{font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.coupon-item .ci-odd{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.coupon-type{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.coupon-type .ct-btn{padding:10px 16px;background:#f0f2f6;border-radius:8px;font-size:14px;font-weight:700;color:var(--text-2);border:1.5px solid transparent;cursor:pointer}
.coupon-type .ct-btn.active{background:#fff;border-color:var(--text);color:var(--text)}
.coupon-stake{display:flex;align-items:stretch;background:#fff;border:1px solid #dfe2ea;border-radius:12px;margin-bottom:8px;overflow:hidden}
.coupon-stake .stake-input{flex:1;padding:14px 16px;font-size:16px;font-weight:700;border:none;background:transparent;width:100%}
.coupon-stake .stake-input::placeholder{color:var(--muted);font-weight:500}
.coupon-stake .stake-right{display:flex;flex-direction:column;justify-content:center;align-items:flex-end;padding:8px 12px;border-left:1px solid var(--border);gap:2px}
.coupon-stake .balance-label{font-size:10px;color:var(--muted);font-weight:500}
.coupon-stake .balance-val{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.coupon-stake .add-btn{width:24px;height:24px;background:var(--accent);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;margin-top:2px;cursor:pointer}
.coupon-limits{display:flex;gap:8px;font-size:11px;color:var(--muted);margin-bottom:12px;padding:0 4px;align-items:center}
.coupon-limits .lmt{padding:6px 10px;background:#f0f2f6;border-radius:6px;font-weight:700;color:var(--text-2);cursor:pointer;border:1px solid transparent}
.coupon-limits .lmt b{color:var(--text);font-weight:800}
.coupon-actions{display:flex;gap:10px;margin-bottom:8px}
.coupon-actions .potential{flex:1;background:#f8f9fc;border-radius:12px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);font-weight:600}
.coupon-actions .potential b{color:var(--text);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.coupon-place{width:100%;padding:16px;background:var(--accent);color:#fff;border-radius:12px;font-size:16px;font-weight:800;cursor:pointer;border:none}
.coupon-place:disabled{background:#e0e2ea;color:var(--muted);cursor:not-allowed}

/* HISTORY */
.history-item{background:#fff;border-radius:12px;padding:14px 16px;margin:8px 8px 0;box-shadow:0 1px 3px rgba(20,20,40,.06);position:relative;overflow:hidden}
.history-item::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px}
.history-item.won::before{background:var(--green)}
.history-item.lost::before{background:var(--accent)}
.history-item.pending::before{background:var(--gold)}
.history-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px}
.history-match{font-weight:700;font-size:14px;line-height:1.3}
.history-meta{font-size:11.5px;color:var(--muted);margin-top:3px;font-weight:600}
.history-amount{font-weight:800;font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.history-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:10px;border-top:1px solid var(--border)}
.history-odd{font-size:12px;color:var(--muted);font-weight:600}
.history-odd b{color:var(--text);font-weight:800}
.history-status{font-weight:800;padding:4px 12px;border-radius:6px;text-transform:uppercase;letter-spacing:.3px;font-size:10.5px}
.history-status.won{background:#e6f7ee;color:var(--green)}
.history-status.lost{background:#ffe5e9;color:var(--accent)}
.history-status.pending{background:#fff8e1;color:var(--gold)}
.cashout-btn{background:var(--green);color:#fff;padding:10px 18px;border-radius:8px;font-weight:800;font-size:12.5px;margin-top:10px;cursor:pointer;border:none;width:100%}

/* PROFILE */
.profile-head{padding:20px 16px;background:linear-gradient(135deg,#1a1c2e,#3a3d52);color:#fff;display:flex;align-items:center;gap:14px}
.profile-avatar{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#e60023,#ff6b6b);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;color:#fff;flex-shrink:0}
.profile-info{flex:1;min-width:0}
.profile-name{font-size:18px;font-weight:800;margin-bottom:4px}
.profile-balance{font-size:22px;font-weight:900;color:#00e676;font-variant-numeric:tabular-nums}
.profile-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border-top:1px solid var(--border)}
.profile-stat{background:#fff;padding:14px 8px;text-align:center}
.profile-stat .ps-label{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.profile-stat .ps-value{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.profile-stat .ps-value.green{color:var(--green)}
.profile-stat .ps-value.red{color:var(--accent)}
.menu-item{padding:18px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;cursor:pointer;font-size:15px;font-weight:600;background:#fff}
.menu-item:last-child{border-bottom:none}
.menu-item .mi-icon{font-size:22px;width:32px;text-align:center}
.menu-item .mi-arrow{margin-left:auto;color:var(--muted);font-size:16px}
.logout-btn{margin:16px;padding:14px;background:#fff;border:1.5px solid var(--accent);color:var(--accent);border-radius:12px;font-size:15px;font-weight:800;width:calc(100% - 32px);cursor:pointer}

/* EMPTY / TOAST */
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-icon{font-size:56px;margin-bottom:16px;opacity:.4}
.empty-text{font-size:15px;font-weight:600}
.toast-container{position:fixed;top:80px;right:16px;z-index:2000;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:320px}
.toast{background:#1a1c2e;color:#fff;border-radius:12px;padding:14px 18px;font-size:13px;font-weight:600;box-shadow:0 8px 32px rgba(20,20,40,.2);animation:toastIn .3s;pointer-events:auto;display:flex;align-items:center;gap:10px}
.toast.win{background:#00a854}
.toast.lose{background:#e60023}
.toast.gold{background:#f0b400;color:#1a1c2e}
@keyframes toastIn{from{transform:translateX(120%);opacity:0}}

@media(min-width:768px){
  body{max-width:480px;margin:0 auto;box-shadow:0 0 40px rgba(0,0,0,.08)}
  .tab-bar{max-width:480px;left:50%;transform:translateX(-50%)}
  .floating-coupon{max-width:464px;left:50%;transform:translateX(-50%)}
  .coupon-panel{max-width:480px;left:50%;transform:translateX(-50%) translateY(100%)}
  .coupon-panel.active{transform:translateX(-50%) translateY(0)}
  .toast-container{right:calc(50% - 240px + 16px)}
}

    phase: 'calm', phaseSecLeft: 15 + rand(0, 25),
    baseTempo: 0.75 + Math.random() * 0.65,
    xgHome: 0, xgAway: 0, shotsHome: 0, shotsAway: 0,
    shotsOnTargetHome: 0, shotsOnTargetAway: 0,

    justScored: null, status: 'live', momentum: 0
  };
}

function footballPhaseIntensity(m) {
  var phase = m.phase, intensity = 1.0, goalBoost = 1.0;
  if (phase === 'calm') { intensity = 0.55; goalBoost = 0.6; }
  else if (phase === 'pressure_home' || phase === 'pressure_away') { intensity = 1.7; goalBoost = 1.9; }
  else if (phase === 'chaos') { intensity = 2.4; goalBoost = 2.3; }
  else if (phase === 'endgame') { intensity = 2.0; goalBoost = 1.7; }
  intensity *= m.baseTempo;
  if (m.minute >= 75 && phase !== 'endgame') { intensity *= 1.4; goalBoost *= 1.35; }
  return { intensity: intensity, goalBoost: goalBoost };
}

function switchFootballPhase(m) {
  m.phaseSecLeft -= 1;
  if (m.phaseSecLeft > 0) return;
  var roll = Math.random();
  var newPhase;
  if (m.minute >= 80) { newPhase = 'endgame'; m.phaseSecLeft = 999; }
  else if (roll < 0.30) { newPhase = 'calm'; m.phaseSecLeft = 18 + rand(0, 25); }
  else if (roll < 0.55) { newPhase = 'pressure_home'; m.phaseSecLeft = 15 + rand(0, 20); }
  else if (roll < 0.80) { newPhase = 'pressure_away'; m.phaseSecLeft = 15 + rand(0, 20); }
  else { newPhase = 'chaos'; m.phaseSecLeft = 12 + rand(0, 15); }
  if (m.redHome) newPhase = 'pressure_away';
  if (m.redAway) newPhase = 'pressure_home';
  m.phase = newPhase;
}

function simulateFootball(m) {
  if (m.isBreak) {
    m.breakTimer += 1;
    if (m.breakTimer >= FT_BREAK_SEC) { m.isBreak = false; m.half = 2; m.minute = 45; }
    return;
  }
  m.realTick += 1;
  m.minute += 1 / FT_TICK_PER_MIN;
  m.justScored = null;
  if (m.minute >= 45 && m.half === 1) { m.minute = 45; m.isBreak = true; m.breakTimer = 0; return; }
  if (m.minute >= 90) { m.minute = 90; m.status = 'finished'; m.finishedAt = Date.now(); return; }

  switchFootballPhase(m);
  var I = footballPhaseIntensity(m);
  var intensity = I.intensity, goalBoost = I.goalBoost;

  m.nextFoul -= intensity * 3;
  if (m.nextFoul <= 0) {
    var side = Math.random() < 0.5 ? 'home' : 'away';
    if (side === 'home') m.foulsHome++; else m.foulsAway++;
    if (Math.random() < 0.12) {
      if (side === 'home') m.cardsHome++; else m.cardsAway++;
      if (Math.random() < 0.03) { if (side === 'home') m.redHome = true; else m.redAway = true; }
    }
    m.nextFoul = 20 + rand(0, 60);
  }
  m.nextCorner -= intensity * 2;
  if (m.nextCorner <= 0) {
    if (Math.random() < 0.55) m.cornersHome++; else m.cornersAway++;
    m.nextCorner = 60 + rand(0, 180);
  }
  m.nextShot -= intensity * 3;
  if (m.nextShot <= 0) {
    var s5 = Math.random() < 0.5 ? 'home' : 'away';
    var onT = Math.random() < 0.42;
    if (s5 === 'home') {
      m.shotsHome++; m.xgHome += 0.05 + Math.random() * 0.2;
      if (onT) { m.shotsOnTargetHome++; if (Math.random() < 0.65) m.savesAway++; }
    } else {
      m.shotsAway++; m.xgAway += 0.05 + Math.random() * 0.2;
      if (onT) { m.shotsOnTargetAway++; if (Math.random() < 0.65) m.savesHome++; }
    }
    m.nextShot = 30 + rand(0, 120);
  }
  m.nextOffside -= intensity * 1.5;
  if (m.nextOffside <= 0) {
    if (Math.random() < 0.5) m.offsidesHome++; else m.offsidesAway++;
    m.nextOffside = 150 + rand(0, 350);
  }
  m.nextGoalKick -= intensity * 2;
  if (m.nextGoalKick <= 0) {
    if (Math.random() < 0.5) m.goalKicksHome++; else m.goalKicksAway++;
    m.nextGoalKick = 60 + rand(0, 150);
  }
  m.nextThrowIn -= intensity * 3;
  if (m.nextThrowIn <= 0) {
    if (Math.random() < 0.5) m.throwInsHome++; else m.throwInsAway++;
    m.nextThrowIn = 30 + rand(0, 90);
  }

  var targetPoss = 50 + (m.homeAtk - m.awayAtk) * 12;
  if (m.phase === 'pressure_home') targetPoss += 12;
  if (m.phase === 'pressure_away') targetPoss -= 12;
  m.possessionHome = Math.round(m.possessionHome * 0.96 + targetPoss * 0.04);
  m.possessionHome = clamp(m.possessionHome, 25, 75);

  var pGoal = 0.0035 * goalBoost;
  var lh = footballFullXG(m, 'home') / 90 / FT_TICK_PER_MIN * 3;
  var la = footballFullXG(m, 'away') / 90 / FT_TICK_PER_MIN * 3;
  if (Math.random() < pGoal) {
    if (Math.random() < lh / (lh + la)) {
      m.scoreHome++; m.xgHome += 0.4; m.shotsOnTargetHome++;
      m.justScored = 'home';
      m.phase = 'pressure_away'; m.phaseSecLeft = 20 + rand(0, 20);
    } else {
      m.scoreAway++; m.xgAway += 0.4; m.shotsOnTargetAway++;
      m.justScored = 'away';
      m.phase = 'pressure_home'; m.phaseSecLeft = 20 + rand(0, 20);
    }
  }
}

function newHockey() {

  HOCKEY.forEach(function(t) { if (!seen[t.lg]) { seen[t.lg] = 1; lgs.push(t.lg); } });
  var lg = pick(lgs);
  var pool = HOCKEY.filter(function(t) { return t.lg === lg; });

    homeCountry: h.country, awayCountry: a.country,
    scoreHome: 0, scoreAway: 0,
    periodScores: [{h:0,a:0},{h:0,a:0},{h:0,a:0}],
    period: 1, periodSec: 0, minute: 0, maxMinute: 60,
    penaltyHome: 0, penaltyAway: 0, emptyNet: null,

  };

function simulateHockey(m) {
  if (m.isBreak) {
    m.breakTimer += 1;
    if (m.breakTimer >= HK_BREAK_SEC) {
      m.isBreak = false; m.period += 1; m.periodSec = 0;
      m.penaltyHome = 0; m.penaltyAway = 0; m.emptyNet = null;
      if (m.period > 3) {
        if (m.scoreHome === m.scoreAway) { m.overtime = true; m.period = 4; }
        else { m.status = 'finished'; m.finishedAt = Date.now(); }
        return;
      }
    }
    return;
  }
  m.periodSec += 1; m.minute += 1; m.justScored = null;

  if (m.period === 4 && m.periodSec >= 5) {
    var hG = 0, aG = 0;
    for (var i = 0; i < 5; i++) { if (Math.random() < 0.35) hG++; if (Math.random() < 0.35) aG++; }
    var guard = 0;
    while (hG === aG && guard++ < 30) { if (Math.random() < 0.4) hG++; if (Math.random() < 0.4) aG++; }
    if (hG > aG) m.scoreHome++; else m.scoreAway++;
    m.finalResult = {winner: hG > aG ? 'home' : 'away', method: 'Буллиты', round: 4};
    m.status = 'finished'; m.finishedAt = Date.now(); return;
  }
  if (m.period <= 3 && m.periodSec >= HK_PERIOD_SEC) {
    m.isBreak = true; m.breakTimer = 0; return;
  }
  if (m.penaltyHome > 0) m.penaltyHome--;
  if (m.penaltyAway > 0) m.penaltyAway--;
  if (m.period === 3 && m.periodSec >= 18 && m.scoreHome !== m.scoreAway) {
    m.emptyNet = m.scoreHome < m.scoreAway ? 'home' : 'away';
  }
  if (Math.random() < 0.06 && m.penaltyHome === 0 && m.penaltyAway === 0) {
    if (Math.random() < 0.5) m.penaltyHome = 4; else m.penaltyAway = 4;
  }

  // Простая λ на 20 сек: среднее за матч ~5.5 голов, делим на 3 периода, на 20 секунд
  // Итого ~1.83 голов за период, что даёт за 20 секунд = ~0.09
  var lamBase = 3.00; // базовое xG на матч для средней команды
  var lh = lamBase * m.homeAtk * (1.0 / m.awayDef) * 1.10 / 60 * 1.5;
  var la = lamBase * m.awayAtk * (1.0 / m.homeDef) * 0.90 / 60 * 1.5;
  if (m.penaltyAway > 0) lh *= 2.6;
  if (m.penaltyHome > 0) la *= 2.6;
  if (m.emptyNet === 'away') lh *= 4;
  if (m.emptyNet === 'home') la *= 4;

  if (Math.random() < lh) {
    m.scoreHome++; m.shotsHome++; m.justScored = 'home';
    if (m.period <= 3) m.periodScores[m.period - 1].h++;
  } else if (Math.random() < la) {
    m.scoreAway++; m.shotsAway++; m.justScored = 'away';
    if (m.period <= 3) m.periodScores[m.period - 1].a++;
  } else {
    if (Math.random() < 0.35) { m.shotsHome++; m.savesAway++; }
    else if (Math.random() < 0.7) { m.shotsAway++; m.savesHome++; }
  }
}

function simulateUFC(m) {
  if (m.phase === 'break') {
    m.roundSec += 1;
    if (m.roundSec >= UFC_BREAK_SEC) {
      m.phase = 'fight'; m.roundSec = 0;
      m.homeStam = Math.min(m.homeFighter.stamMax, m.homeStam + 18);
      m.awayStam = Math.min(m.awayFighter.stamMax, m.awayStam + 18);
    }
    return;
  }
  m.roundSec += 1; m.minute += 1;
  var hAcc = m.homeFighter.acc * (m.homeStam / m.homeFighter.stamMax);
  var aAcc = m.awayFighter.acc * (m.awayStam / m.awayFighter.stamMax);
  var hPow = m.homeFighter.power * (0.7 + 0.3 * (m.homeStam / m.homeFighter.stamMax));
  var aPow = m.awayFighter.power * (0.7 + 0.3 * (m.awayStam / m.awayFighter.stamMax));

  if (Math.random() < m.homeFighter.td / 100 * 0.05 && m.homeFighter.style !== 'striker') {
    m.awayHP -= hPow * 0.35; m.homeStam -= 2;
    if (Math.random() < 0.10 && m.awayHP < 40) { finishUFC(m, 'home', 'Сабмишн', m.round); return; }
  }
  if (Math.random() < m.awayFighter.td / 100 * 0.05 && m.awayFighter.style !== 'striker') {
    m.homeHP -= aPow * 0.35; m.awayStam -= 2;
    if (Math.random() < 0.10 && m.homeHP < 40) { finishUFC(m, 'away', 'Сабмишн', m.round); return; }
  }
  if (Math.random() < hAcc / 100 * 0.35) {
    if (Math.random() < hAcc / 100 * 0.55) {
      m.awayHP -= hPow * 0.18; m.homeStam -= 1.2; m.awayStam -= 0.8;
      if (Math.random() < 0.02 && m.awayHP < 15) { finishUFC(m, 'home', 'KO/TKO', m.round); return; }
    } else m.homeStam -= 1.5;
  }

    if (r === 0) haz = perRound * ((UFC_ROUND_SEC - m.roundSec) / UFC_ROUND_SEC);
    pNoFin *= (1 - haz);
  }
  return clamp(1 - pNoFin, 0.04, 0.96);
}
function computeUFCExtras(m) {
  if (m.status === 'finished' || m.status === 'countdown') return {};
  var out = {};
  function add(l, p, mar) { var o = toOdd(p, mar || 0.05); if (o !== null) out[l] = o; }
  var pH = ufcProbHome(m);
  var pA = 1 - pH;
  var pFin = ufcFinishProb(m);
  var pDec = 1 - pFin;
  var pKO = pFin * 0.62, pSub = pFin * 0.38;
  add('KO/TKO', pKO, 0.06);
  add('Сабмишн', pSub, 0.06);
  add('Решение', pDec, 0.05);
  add('Бой досрочно', pFin, 0.05);
  add('Вся дистанция', pDec, 0.05);
  var roundsPlayed = (m.round - 1) + (m.roundSec / UFC_ROUND_SEC);
  if (m.phase === 'break') roundsPlayed = m.round;
  [[1.5,'ТБ 1.5 раундов'], [2.5,'ТБ 2.5 раундов'], [3.5,'ТБ 3.5 раундов'], [4.5,'ТБ 4.5 раундов']].forEach(function(pair) {
    var line = pair[0];
    if (roundsPlayed < line) {
      var need = line - roundsPlayed;
      var perRound = 0.26;
      if (m.homeHP < 30 || m.awayHP < 30) perRound *= 1.7;
      var pReach = Math.pow(1 - perRound, need);
      pReach = clamp(pReach, 0.02, 0.98);
      add(pair[1], pReach, 0.05);
      add(pair[1].replace('ТБ', 'ТМ'), 1 - pReach, 0.05);
    }
  });
  add(m.home + ' KO/TKO', pH * pKO * 0.95, 0.07);
  add(m.home + ' Сабмишн', pH * pSub * 0.95, 0.07);
  add(m.home + ' Решение', pH * pDec * 0.95, 0.07);
  add(m.away + ' KO/TKO', pA * pKO * 0.95, 0.07);
  add(m.away + ' Сабмишн', pA * pSub * 0.95, 0.07);
  add(m.away + ' Решение', pA * pDec * 0.95, 0.07);
  return out;
}
function volleyProbHome(m) {
  if (m.status === 'finished') return m.setsHome > m.setsAway ? 1 : 0;
  if (m.status === 'countdown') {
    var d0 = (m.homeAtk - m.awayAtk) * 0.20 + (m.homeServe - m.awayServe) * 0.08 - (m.homeBlock - m.awayBlock) * 0.05;
    return clamp(0.5 + d0, 0.20, 0.80);
  }
  var d = (m.homeAtk - m.awayAtk) * 0.20 + (m.homeServe - m.awayServe) * 0.08 - (m.homeBlock - m.awayBlock) * 0.05;
  var base = clamp(0.5 + d, 0.15, 0.85);
  var isFifth = (m.setsHome === 2 && m.setsAway === 2);
  var target = isFifth ? 15 : 25;
  var curScore = (m.pointsHome - m.pointsAway) / target;
  var setScore = (m.setsHome - m.setsAway) * 0.12;

}
function computeVolleyballOdds(m) {
  if (m.status === 'finished') return {home: null, draw: null, away: null};
  var pH = volleyProbHome(m);
  return {home: toOdd(pH, 0.045), away: toOdd(1 - pH, 0.045), draw: null};
}
function computeVolleyballExtras(m) {
  if (m.status === 'finished' || m.status === 'countdown') return {};
  var out = {};
  function add(l, p, mar) { var o = toOdd(p, mar || 0.05); if (o !== null) out[l] = o; }
  var pH = volleyProbHome(m);
  var pA = 1 - pH;
  var setsPlayed = m.setsHome + m.setsAway;
  if (setsPlayed < 5) {
    var cnt3 = 0, cnt4 = 0, cnt5 = 0;
    for (var t = 0; t < 300; t++) {
      var sh = m.setsHome, sa = m.setsAway, g = 0;
      while (sh < 3 && sa < 3 && g++ < 10) { if (Math.random() < pH) sh++; else sa++; }
      var tot = sh + sa;
      if (tot <= 3) cnt3++; else if (tot === 4) cnt4++; else cnt5++;
    }
    var p3 = cnt3 / 300, p4 = cnt4 / 300, p5 = cnt5 / 300;
    if (p3 > 0.02) { add('ТМ 3.5 сетов', p3, 0.06); add('ТБ 3.5 сетов', p4 + p5, 0.06); }
    if (p5 > 0.02) { add('ТБ 4.5 сетов', p5, 0.06); add('ТМ 4.5 сетов', p3 + p4, 0.06); }
  }
  add('Победа в сете · П1', pH, 0.06);
  add('Победа в сете · П2', pA, 0.06);
  add('Счёт 3:0', Math.pow(pH, 3) * 0.55, 0.10);
  add('Счёт 3:1', pH * pH * (1 - pH) * 1.15, 0.10);
  add('Счёт 3:2', pH * (1 - pH) * (1 - pH) * 0.85, 0.10);
  add('Счёт 0:3', Math.pow(1 - pH, 3) * 0.55, 0.10);
  add('Счёт 1:3', (1 - pH) * (1 - pH) * pH * 1.15, 0.10);
  add('Счёт 2:3', (1 - pH) * pH * pH * 0.85, 0.10);

}

function computeOdds(m) {
  if (m.sport === 'football') return computeFootballOdds(m);
  if (m.sport === 'hockey') return computeHockeyOdds(m);
  if (m.sport === 'ufc') return computeUFCOdds(m);
  if (m.sport === 'volleyball') return computeVolleyballOdds(m);
  return {home: null, draw: null, away: null};
}
function computeExtras(m) {
  if (m.sport === 'football') return computeFootballExtras(m);
  if (m.sport === 'hockey') return computeHockeyExtras(m);
  if (m.sport === 'ufc') return computeUFCExtras(m);
  if (m.sport === 'volleyball') return computeVolleyballExtras(m);
  return {};
}

/* ============================================================
   ФОРМАТ ВРЕМЕНИ
   ============================================================ */
function formatTimeLeft(m) {
  if (m.status === 'countdown') {
    if (!m.startTime) m.startTime = Date.now() + 60000;
    var d = new Date(m.startTime);
    var now = new Date();
    var isToday = d.toDateString() === now.toDateString();
    var tomorrow = new Date(now.getTime() + 86400000);
    var isTomorrow = d.toDateString() === tomorrow.toDateString();
    var hh = String(d.getHours()).padStart(2, '0');
    var mm = String(d.getMinutes()).padStart(2, '0');
    if (isToday) return 'Сегодня ' + hh + ':' + mm;
    if (isTomorrow) return 'Завтра ' + hh + ':' + mm;
    return d.getDate() + ' ' + ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'][d.getMonth()] + ' ' + hh + ':' + mm;
  }
  if (m.status === 'finished') return 'Завершён';
  if (m.sport === 'football') {
    if (m.isBreak) return 'Перерыв';
    return (m.minute < 45 ? '1-й · ' : '2-й · ') + Math.floor(m.minute) + "'";
  }
  if (m.sport === 'hockey') {
    if (m.isBreak) return 'Перерыв';
    if (m.period === 4) return 'ОТ · ' + ft(m.periodSec);
    return m.period + '-й · ' + ft(m.periodSec);
  }
  if (m.sport === 'ufc') {
    if (m.phase === 'break') return 'Перерыв';
    return 'R' + m.round + ' · ' + ft(m.roundSec);
  }
  if (m.sport === 'volleyball') {
    var sn = m.setsHome + m.setsAway + 1;
    return 'Сет ' + Math.min(5, sn) + ' · ' + m.pointsHome + ':' + m.pointsAway;
  }
  return '';
}

function tickMatch(m) {
  if (m.status === 'countdown') {
    if (!m.startTime) m.startTime = Date.now() + 60000;
    if (Date.now() >= m.startTime) {
      var nm;
      if (m.sport === 'football') nm = newFootball();
      else if (m.sport === 'hockey') nm = newHockey();
      else if (m.sport === 'volleyball') nm = newVolleyball();
      else nm = newUFC();
      nm.id = m.id;
      for (var k in m) delete m[k];
      for (var k2 in nm) m[k2] = nm[k2];
    }
    return;
  }
  if (m.status !== 'live') return;
  if (m.sport === 'football') simulateFootball(m);
  else if (m.sport === 'hockey') simulateHockey(m);
  else if (m.sport === 'volleyball') simulateVolleyball(m);
  else if (m.sport === 'ufc') simulateUFC(m);
}

/* ============================================================
   РАСЧЁТ СТАВОК
   ============================================================ */
function checkSel(m, pick) {
  if (!m || m.status !== 'finished') return 'pending';
  if (m.sport === 'ufc') {
    var fr = m.finalResult;
    if (!fr) return 'pending';
    if (pick === 'home') return fr.winner === 'home' ? 'won' : 'lost';
    if (pick === 'away') return fr.winner === 'away' ? 'won' : 'lost';
    if (pick === 'KO/TKO') return fr.method === 'KO/TKO' ? 'won' : 'lost';
    if (pick === 'Сабмишн') return fr.method === 'Сабмишн' ? 'won' : 'lost';
    if (pick === 'Решение') return fr.method === 'Решение' ? 'won' : 'lost';
    if (pick === 'Бой досрочно') return fr.method !== 'Решение' ? 'won' : 'lost';
    if (pick === 'Вся дистанция') return fr.method === 'Решение' ? 'won' : 'lost';
    return 'lost';
  }
  if (m.sport === 'volleyball') {
    if (pick === 'home') return m.setsHome > m.setsAway ? 'won' : 'lost';
    if (pick === 'away') return m.setsAway > m.setsHome ? 'won' : 'lost';
    var totS = m.setsHome + m.setsAway;
    var t35 = pick.match(/^(ТБ|ТМ)\s*3\.5 сетов$/);
    if (t35) { if (t35[1] === 'ТБ') return totS > 3.5 ? 'won' : 'lost'; return totS < 3.5 ? 'won' : 'lost'; }
    var t45 = pick.match(/^(ТБ|ТМ)\s*4\.5 сетов$/);
    if (t45) { if (t45[1] === 'ТБ') return totS > 4.5 ? 'won' : 'lost'; return totS < 4.5 ? 'won' : 'lost'; }
    var cs = pick.match(/^Счёт (\d+):(\d+)$/);
    if (cs) return (m.setsHome === +cs[1] && m.setsAway === +cs[2]) ? 'won' : 'lost';
    return 'lost';
  }
  var tot = (m.scoreHome || 0) + (m.scoreAway || 0);
  if (pick === 'home') return m.scoreHome > m.scoreAway ? 'won' : 'lost';
  if (pick === 'away') return m.scoreAway > m.scoreHome ? 'won' : 'lost';
  if (pick === 'draw') return m.scoreHome === m.scoreAway ? 'won' : 'lost';
  if (pick === '1X') return m.scoreHome >= m.scoreAway ? 'won' : 'lost';
  if (pick === '12') return m.scoreHome !== m.scoreAway ? 'won' : 'lost';
  if (pick === 'X2') return m.scoreHome <= m.scoreAway ? 'won' : 'lost';
  var tO = pick.match(/^ТБ\s*([\d.]+)$/);
  var tU = pick.match(/^ТМ\s*([\d.]+)$/);
  if (tO) return tot > parseFloat(tO[1]) ? 'won' : 'lost';
  if (tU) return tot < parseFloat(tU[1]) ? 'won' : 'lost';
  var f1 = pick.match(/^Ф1\s*[−\-]([\d.]+)$/);
  if (f1) return (m.scoreHome - m.scoreAway) > parseFloat(f1[1]) ? 'won' : 'lost';
  var f2 = pick.match(/^Ф2\s*[−\-]([\d.]+)$/);
  if (f2) return (m.scoreAway - m.scoreHome) > parseFloat(f2[1]) ? 'won' : 'lost';
  var f1p = pick.match(/^Ф1\s*\+([\d.]+)$/);
  if (f1p) return (m.scoreHome - m.scoreAway) > -parseFloat(f1p[1]) ? 'won' : 'lost';
  var f2p = pick.match(/^Ф2\s*\+([\d.]+)$/);
  if (f2p) return (m.scoreAway - m.scoreHome) > -parseFloat(f2p[1]) ? 'won' : 'lost';
  if (pick === 'Обе · Да') return (m.scoreHome >= 1 && m.scoreAway >= 1) ? 'won' : 'lost';
  if (pick === 'Обе · Нет') return !(m.scoreHome >= 1 && m.scoreAway >= 1) ? 'won' : 'lost';
  var statT = pick.match(/^(ТБ|ТМ)\s*([\d.]+)\s+(фолов|угловых|жёлтых|ударов|в створ|офсайдов)$/);
  if (statT) {
    var line = parseFloat(statT[2]);
    var val = 0;
    if (statT[3] === 'фолов') val = (m.foulsHome || 0) + (m.foulsAway || 0);
    if (statT[3] === 'угловых') val = (m.cornersHome || 0) + (m.cornersAway || 0);
    if (statT[3] === 'жёлтых') val = (m.cardsHome || 0) + (m.cardsAway || 0);
    if (statT[3] === 'ударов') val = (m.shotsHome || 0) + (m.shotsAway || 0);
    if (statT[3] === 'в створ') val = (m.shotsOnTargetHome || 0) + (m.shotsOnTargetAway || 0);
    if (statT[3] === 'офсайдов') val = (m.offsidesHome || 0) + (m.offsidesAway || 0);
    if (statT[1] === 'ТБ') return val > line ? 'won' : 'lost';
    return val < line ? 'won' : 'lost';
  }
  return 'lost';
}

function settleBets() {
  var changed = false;
  W.bets.forEach(function(b) {
    if (b.status !== 'pending') return;
    var m = findMatch(b.matchId);
    if (!m || m.status !== 'finished') return;
    var allWon = true, anyLost = false;
    b.selections.forEach(function(sel) {
      var r = checkSel(m, sel.pick);
      if (r === 'lost') { anyLost = true; allWon = false; }
      else if (r === 'pending') { allWon = false; }
    });
    if (anyLost) {
      b.status = 'lost';
      toast('lose', '❌', 'Не зашла: -' + fmt(b.stake) + ' ₽');
      changed = true;
    } else if (allWon) {
      b.status = 'won';
      b.payout = Math.round(b.stake * b.odd * 100) / 100;
      W.balance = W.balance + b.payout;
      W.totalWon = W.totalWon + b.payout;
      toast('win', '✅', 'Зашла: +' + fmt(b.payout) + ' ₽');
      changed = true;
    }
  });
  if (changed) {
    saveUserState();
    renderBalance();
    if (STATE.screen === 'history') renderHistoryScreen();
  }
}

function saveMatches() {
  if (!AUTH.currentUser) return;
  AUTH.currentUser.matchesState = {
    matches: STATE.matches,
    nextId: STATE.nextId,
    usedPairs: STATE.usedPairs,
    ts: Date.now()
  };
  saveUserState();
}
function loadMatches() {
  if (!AUTH.currentUser || !AUTH.currentUser.matchesState) return false;
  var st = AUTH.currentUser.matchesState;
  if (!st.matches || !st.matches.length) return false;
  var elapsed = Math.floor((Date.now() - (st.ts || Date.now())) / 1000);
  elapsed = Math.min(elapsed, 3600);
  STATE.matches = st.matches;
  STATE.nextId = st.nextId || 100;
  STATE.usedPairs = st.usedPairs || {};
  for (var i = 0; i < elapsed; i++) {
    for (var j = 0; j < STATE.matches.length; j++) {
      if (STATE.matches[j].status === 'live' || STATE.matches[j].status === 'countdown') {
        try { tickMatch(STATE.matches[j]); } catch (e) {}
      }
    }
  }
  return true;
}

function createInitialMatches() {
  STATE.matches = [];
  STATE.nextId = 1;
  STATE.usedPairs = {};
  for (var i = 0; i < 12; i++) STATE.matches.push(newFootball());
  for (var j = 0; j < 8; j++) STATE.matches.push(newHockey());
  for (var k = 0; k < 5; k++) STATE.matches.push(newVolleyball());
  for (var l = 0; l < 5; l++) STATE.matches.push(newUFC());
  for (var q = STATE.matches.length - 1; q > 0; q--) {
    var r = Math.floor(Math.random() * (q + 1));
    var t = STATE.matches[q]; STATE.matches[q] = STATE.matches[r]; STATE.matches[r] = t;
  }
  STATE.matches.forEach(function(m) {
    var skip = rand(3, 30);
    for (var ii = 0; ii < skip && m.status === 'live'; ii++) {
      try { tickMatch(m); } catch (e) {}
    }
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function renderMatchRow(m) {

      awayScore = '<span class="team-score">' + m.setsAway + '</span>';
    } else {
      var wH = m.scoreHome > m.scoreAway, wA = m.scoreAway > m.scoreHome;
      homeScore = '<span class="team-score' + (wH ? ' red' : '') + '">' + m.scoreHome + '</span>';
      awayScore = '<span class="team-score' + (wA ? ' red' : '') + '">' + m.scoreAway + '</span>';

function renderOddCell(m, pick, odd, disabled) {

  return '<div class="' + cls + '" data-match-id="' + m.id + '" data-pick="' + pick + '">' + odd.toFixed(2) + '</div>';
}

function renderMainScreen() {
  var html = renderTopHeader({title: 'Главная'});
  html += renderSportTabs();
  html += renderFilterRow();
  var filtered = [];
  for (var i = 0; i < STATE.matches.length; i++) {
    var m = STATE.matches[i];
    if (STATE.currentSport !== 'all' && m.sport !== STATE.currentSport) continue;
    if (STATE.currentFilter === 'live' && m.status !== 'live') continue;
    filtered.push(m);
  }
  filtered.sort(function(a, b) {
    var ord = {live: 0, countdown: 1, finished: 2};
    if (ord[a.status] !== ord[b.status]) return ord[a.status] - ord[b.status];
    return a.minute - b.minute;
  });
  var groups = {}, groupOrder = [];
  filtered.forEach(function(m) {
    var key = m.sport + '|' + m.league;
    if (!groups[key]) { groups[key] = {sport: m.sport, league: m.league, matches: []}; groupOrder.push(key); }
    groups[key].matches.push(m);
  });
  html += '<div class="main">';
  if (!groupOrder.length) {
    html += '<div class="empty"><div class="empty-icon">🎯</div><div class="empty-text">Матчей нет</div></div>';
  } else {
    groupOrder.forEach(function(key) {
      var g = groups[key];
      html += '<div class="league-block">' +
        '<div class="league-head">' +
          '<div class="league-icon">' + sIcon(g.sport) + '</div>' +
          '<div class="league-name">' + escapeHtml(g.league) + '</div>' +
          '<button class="league-filter">⚙︎</button>' +
        '</div>';
      g.matches.forEach(function(m) { html += renderMatchRow(m); });
      html += '</div>';
    });
    html += '<button class="show-all" id="btnShowAll">Все события</button>';
  }
  html += '</div>';
  $('app').innerHTML = html;
  bindMainScreen();
}

function renderMatchScreen() {
  var m = STATE.currentMatch;
  if (!m) { STATE.screen = 'main'; renderApp(); return; }
  var html = renderTopHeader({title: sName(m.sport), back: true});
  html += renderMatchTop(m);
  html += renderMatchTabs(m);
  html += '<div class="main" style="padding-bottom:16px">' + renderMatchBody(m) + '</div>';
  $('app').innerHTML = html;
  bindMatchScreen();
}

function renderMatchTop(m) {
  var hDisp = rusName(m.home), aDisp = rusName(m.away);
  var hColor = teamColor(m.home), aColor = teamColor(m.away);
  var timeText;
  if (m.status === 'countdown') timeText = formatTimeLeft(m);
  else if (m.status === 'finished') timeText = 'Завершён';
  else timeText = formatTimeLeft(m);

  return '<div class="match-top">' +
    '<div class="mt-crumbs"><span>' + escapeHtml(m.league) + '</span>' +
      '<span class="mt-icons"><span>⭐</span><span>⚙️</span></span></div>' +
    '<div class="mt-tabs">' +
      '<button class="mt-tab active">Все</button>' +
      '<button class="mt-tab">Матч</button>' +
      '<button class="mt-tab">1-й тайм</button>' +
      '<button class="mt-tab">2-й тайм</button>' +
      '<button class="mt-tab">Показатели</button>' +
    '</div>' +
    '<div class="mt-team">' +
      '<div class="flag" style="background:' + hColor + '">' + teamInit(m.home) + '</div>' +
      '<div class="name">' + escapeHtml(hDisp) + '</div>' +
      '<div class="score">' + (m.sport === 'volleyball' ? m.setsHome : m.scoreHome) + '</div>' +
    '</div>' +
    '<div class="mt-team">' +
      '<div class="flag" style="background:' + aColor + '">' + teamInit(m.away) + '</div>' +
      '<div class="name">' + escapeHtml(aDisp) + '</div>' +
      '<div class="score">' + (m.sport === 'volleyball' ? m.setsAway : m.scoreAway) + '</div>' +
    '</div>' +
    '<div class="mt-time">🕐 ' + timeText + '</div>' +
  '</div>';
}

function renderMatchTabs(m) {
  return '<div class="market-tabs-sub">' +
    '<button class="mt-sub active" data-mtab="all">Все</button>' +
    '<button class="mt-sub" data-mtab="match">Матч</button>' +
    '<button class="mt-sub" data-mtab="1h">1-й тайм</button>' +
    '<button class="mt-sub" data-mtab="2h">2-й тайм</button>' +
    '<button class="mt-sub" data-mtab="stats">Показатели</button>' +
  '</div>';
}

function renderMatchBody(m) {
  if (STATE.currentMarketTab === 'stats') return renderStatsTab(m);
  var odds = computeOdds(m);
  var extras = computeExtras(m);
  var isTwo = (m.sport === 'ufc' || m.sport === 'volleyball');
  var html = '<div class="market-list">';

  // Исход матча
  html += '<div class="market-row" data-toggle-market="iss"><span class="mstar">⭐</span><span class="mtitle">Исход матча (основное время)</span><span class="mchevron">▼</span></div>';
  html += '<div class="market-body-open" id="body-iss">';
  if (isTwo) {
    html += '<div class="odds-grid-2">' + renderOdd(m, 'home', 'П1', odds.home) + renderOdd(m, 'away', 'П2', odds.away) + '</div>';
  } else {
    html += '<div class="odds-grid-3">' + renderOdd(m, 'home', '1', odds.home) + renderOdd(m, 'draw', 'X', odds.draw) + renderOdd(m, 'away', '2', odds.away) + '</div>';
  }
  html += '</div>';

  // Основные
  html += '<div class="market-row" data-toggle-market="main"><span class="mstar">⭐</span><span class="mtitle">Основные</span><span class="mchevron">▼</span></div>';
  html += '<div class="market-body-closed" id="body-main">';
  if (m.sport === 'football' || m.sport === 'hockey') {
    html += renderTotalSelector(m, m.sport);
    html += renderHandicapSelector(m, m.sport);
  }
  html += '</div>';

  // Тотал голов
  html += '<div class="market-row" data-toggle-market="tot"><span class="mstar">⭐</span><span class="mtitle">Тотал голов</span><span class="mchevron">▼</span></div>';
  html += '<div class="market-body-closed" id="body-tot">' + renderTotalSelector(m, m.sport) + '</div>';

  // Фора
  html += '<div class="market-row" data-toggle-market="hcp"><span class="mstar">⭐</span><span class="mtitle">Исход с учетом форы</span><span class="mchevron">▼</span></div>';
  html += '<div class="market-body-closed" id="body-hcp">' + renderHandicapSelector(m, m.sport) + '</div>';

  // Обе забьют (футбол/хоккей)
  if (m.sport === 'football' || m.sport === 'hockey') {
    if (extras['Обе · Да']) {
      html += '<div class="market-row" data-toggle-market="btts"><span class="mstar">⭐</span><span class="mtitle">Обе забьют</span><span class="mchevron">▼</span></div>';
      html += '<div class="market-body-closed" id="body-btts"><div class="odds-grid-2">' + renderExtras('Обе · Да', extras) + renderExtras('Обе · Нет', extras) + '</div></div>';
    }
  }

  // Двойной шанс
  if ((m.sport === 'football' || m.sport === 'hockey') && extras['1X']) {
    html += '<div class="market-row" data-toggle-market="dc"><span class="mstar">⭐</span><span class="mtitle">Двойной шанс</span><span class="mchevron">▼</span></div>';
    html += '<div class="market-body-closed" id="body-dc"><div class="odds-grid-3">' + renderExtras('1X', extras) + renderExtras('12', extras) + renderExtras('X2', extras) + '</div></div>';
  }

  // Точный счёт
  var scoreKeys = Object.keys(extras).filter(function(k) { return k.indexOf('Счёт ') === 0; });
  if (scoreKeys.length) {
    html += '<div class="market-row" data-toggle-market="sc"><span class="mstar">⭐</span><span class="mtitle">Точный счет</span><span class="mchevron">▼</span></div>';
    var sh = '';
    scoreKeys.forEach(function(k) { sh += renderExtras(k, extras); });
    html += '<div class="market-body-closed" id="body-sc"><div class="odds-grid-3">' + sh + '</div></div>';
  }

  // UFC
  if (m.sport === 'ufc') {
    html += '<div class="market-row" data-toggle-market="ufc1"><span class="mstar">⭐</span><span class="mtitle">Метод победы</span><span class="mchevron">▼</span></div>';
    html += '<div class="market-body-closed" id="body-ufc1"><div class="odds-grid-3">' + renderExtras('KO/TKO', extras) + renderExtras('Сабмишн', extras) + renderExtras('Решение', extras) + '</div></div>';
    html += '<div class="market-row" data-toggle-market="ufc2"><span class="mstar">⭐</span><span class="mtitle">Тотал раундов</span><span class="mchevron">▼</span></div>';
    var totR = '';
    ['ТБ 1.5 раундов', 'ТБ 2.5 раундов', 'ТБ 3.5 раундов', 'ТБ 4.5 раундов'].forEach(function(l) {
      if (extras[l]) totR += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px">' + renderExtras(l, extras) + renderExtras(l.replace('ТБ','ТМ'), extras) + '</div>';
    });
    html += '<div class="market-body-closed" id="body-ufc2">' + (totR || '<div style="padding:8px;color:var(--muted)">Нет доступных линий</div>') + '</div>';
  }

  // Волейбол
  if (m.sport === 'volleyball') {
    if (extras['Победа в сете · П1']) {
      html += '<div class="market-row" data-toggle-market="vb1"><span class="mstar">⭐</span><span class="mtitle">Победа в текущем сете</span><span class="mchevron">▼</span></div>';
      html += '<div class="market-body-closed" id="body-vb1"><div class="odds-grid-2">' + renderExtras('Победа в сете · П1', extras) + renderExtras('Победа в сете · П2', extras) + '</div></div>';
    }
    if (extras['ТБ 3.5 сетов']) {
      html += '<div class="market-row" data-toggle-market="vb2"><span class="mstar">⭐</span><span class="mtitle">Тотал сетов</span><span class="mchevron">▼</span></div>';
      html += '<div class="market-body-closed" id="body-vb2"><div class="odds-grid-2">' + renderExtras('ТБ 3.5 сетов', extras) + renderExtras('ТМ 3.5 сетов', extras) + renderExtras('ТБ 4.5 сетов', extras) + renderExtras('ТМ 4.5 сетов', extras) + '</div></div>';
    }
    if (extras['Счёт 3:0']) {
      html += '<div class="market-row" data-toggle-market="vb3"><span class="mstar">⭐</span><span class="mtitle">Точный счет</span><span class="mchevron">▼</span></div>';
      html += '<div class="market-body-closed" id="body-vb3"><div class="odds-grid-3">' +
        renderExtras('Счёт 3:0', extras) + renderExtras('Счёт 3:1', extras) + renderExtras('Счёт 3:2', extras) +
        renderExtras('Счёт 0:3', extras) + renderExtras('Счёт 1:3', extras) + renderExtras('Счёт 2:3', extras) +
      '</div></div>';
    }
  }

  html += '</div>';
  return html;
}

function renderTotalSelector(m, sport) {
  var lines = sport === 'football' ? [1.5, 2, 2.5, 3, 3.5, 4] : (sport === 'hockey' ? [3.5, 4, 4.5, 5, 5.5, 6] : [1.5, 2, 2.5]);
  var curLine = STATE.currentLine[m.id + '_tot'] || lines[2];
  if (lines.indexOf(curLine) < 0) curLine = lines[2];
  var extras = computeExtras(m);
  var html = '<div class="line-selector">';
  lines.forEach(function(l) {
    var active = Math.abs(l - curLine) < 0.01 ? ' active' : '';
    html += '<div class="line-opt' + active + '" data-total-line="' + l + '">' + l + '</div>';
  });
  html += '</div>';
  html += '<div class="odds-grid-2">' +
    renderExtras('ТБ ' + curLine, extras) +
    renderExtras('ТМ ' + curLine, extras) +
  '</div>';
  return html;
}

function renderHandicapSelector(m, sport) {
  var lines = [0.5, 1, 1.5, 2, 2.5];
  var curLine = STATE.currentLine[m.id + '_hcp'] || 1.5;
  var extras = computeExtras(m);
  var html = '<div class="line-selector">';
  lines.forEach(function(l) {
    var active = Math.abs(l - curLine) < 0.01 ? ' active' : '';
    html += '<div class="line-opt' + active + '" data-hcp-line="' + l + '">' + l + '</div>';
  });
  html += '</div>';
  html += '<div class="odds-labeled">' +
    '<div><div class="col-head">' + escapeHtml(rusName(m.home)) + '</div>' + renderExtras('Ф1 −' + curLine, extras) + '</div>' +
    '<div><div class="col-head">' + escapeHtml(rusName(m.away)) + '</div>' + renderExtras('Ф2 +' + curLine, extras) + '</div>' +
  '</div>';
  return html;
}

function renderStatsTab(m) {
  if (m.sport !== 'football') {
    return '<div class="empty"><div class="empty-icon">📊</div><div class="empty-text">Показатели только для футбола</div></div>';
  }
  var params = [
    {key:'fouls', label:'Фолы'},
    {key:'corners', label:'Угловые'},
    {key:'cards', label:'Жёлтые'},
    {key:'shots', label:'Удары'},
    {key:'ontarget', label:'В створ'},
    {key:'offsides', label:'Офсайды'}
  ];
  var html = '<div class="stat-params">';
  params.forEach(function(p) {
    var active = STATE.currentStatParam === p.key ? ' active' : '';
    html += '<button class="stat-param' + active + '" data-stat-param="' + p.key + '">' + p.label + '</button>';
  });
  html += '</div>';
  var cntH = 0, cntA = 0, lbl = '';
  if (STATE.currentStatParam === 'fouls') { cntH = m.foulsHome; cntA = m.foulsAway; lbl = 'ФОЛЫ'; }
  if (STATE.currentStatParam === 'corners') { cntH = m.cornersHome; cntA = m.cornersAway; lbl = 'УГЛОВЫЕ'; }
  if (STATE.currentStatParam === 'cards') { cntH = m.cardsHome; cntA = m.cardsAway; lbl = 'ЖЁЛТЫЕ'; }
  if (STATE.currentStatParam === 'shots') { cntH = m.shotsHome; cntA = m.shotsAway; lbl = 'УДАРЫ'; }
  if (STATE.currentStatParam === 'ontarget') { cntH = m.shotsOnTargetHome; cntA = m.shotsOnTargetAway; lbl = 'В СТВОР'; }
  if (STATE.currentStatParam === 'offsides') { cntH = m.offsidesHome; cntA = m.offsidesAway; lbl = 'ОФСАЙДЫ'; }
  html += '<div class="stat-counter">' +
    '<div class="cnt-h">' + cntH + '</div>' +
    '<div class="lbl">' + lbl + '</div>' +
    '<div class="cnt-a">' + cntA + '</div>' +
  '</div>';
  var lines = getStatLines(STATE.currentStatParam);
  var curLine = STATE.currentLine[m.id + '_stat_' + STATE.currentStatParam] || lines[1];
  html += '<div style="padding:12px">';
  html += '<div class="line-selector">';
  lines.forEach(function(l) {
    var active = Math.abs(l - curLine) < 0.01 ? ' active' : '';
    html += '<div class="line-opt' + active + '" data-stat-line="' + l + '">' + l + '</div>';
  });
  html += '</div>';
  var total = cntH + cntA;
  if (total >= curLine) {
    html += '<div class="odd-btn disabled" style="justify-content:center"><span class="lbl">Линия пройдена</span></div>';
  } else {
    var pO = footballStatOverProb(m, STATE.currentStatParam, curLine);
    html += '<div class="odds-grid-2">' +
      renderOddBtnRaw('stat_over_' + STATE.currentStatParam + '_' + curLine, 'Больше ' + curLine, toOdd(pO, 0.06), m) +
      renderOddBtnRaw('stat_under_' + STATE.currentStatParam + '_' + curLine, 'Меньше ' + curLine, toOdd(1 - pO, 0.06), m) +
    '</div>';
  }
  html += '</div>';
  return html;
}

function getStatLines(param) {
  if (param === 'fouls') return [20.5, 22.5, 24.5, 26.5];
  if (param === 'corners') return [6.5, 8.5, 10.5, 12.5];
  if (param === 'cards') return [1.5, 2.5, 3.5, 4.5];
  if (param === 'shots') return [18.5, 22.5, 26.5, 30.5];
  if (param === 'ontarget') return [6.5, 8.5, 10.5, 12.5];
  if (param === 'offsides') return [1.5, 2.5, 3.5, 4.5];
  return [1.5, 2.5, 3.5];
}

function renderOdd(m, pick, label, odd) {
  if (!isValid(odd)) return '<div class="odd-btn disabled"><span class="lbl">' + escapeHtml(label) + '</span><span class="val">—</span></div>';
  var isSel = isInCoupon(m.id, pick);
  return '<button class="odd-btn' + (isSel ? ' selected' : '') + '" data-match-id="' + m.id + '" data-pick="' + escapeHtml(pick) + '" data-odd="' + odd + '">' +
    '<span class="lbl">' + escapeHtml(label) + '</span>' +
    '<span class="val">' + odd.toFixed(2) + '</span>' +
  '</button>';
}

function renderExtras(label, extras) {
  var o = extras[label];
  if (!isValid(o)) return '<div class="odd-btn disabled"><span class="lbl">' + escapeHtml(label) + '</span><span class="val">—</span></div>';
  var isSel = isInCoupon(STATE.currentMatch ? STATE.currentMatch.id : 0, label);
  return '<button class="odd-btn' + (isSel ? ' selected' : '') + '" data-pick="extras|' + encodeURIComponent(label) + '" data-odd="' + o + '">' +
    '<span class="lbl">' + escapeHtml(label) + '</span>' +
    '<span class="val">' + o.toFixed(2) + '</span>' +
  '</button>';
}

function renderOddBtnRaw(pick, label, odd, m) {
  if (!isValid(odd)) return '<div class="odd-btn disabled"><span class="lbl">' + escapeHtml(label) + '</span><span class="val">—</span></div>';
  var isSel = isInCoupon(m.id, pick);
  return '<button class="odd-btn' + (isSel ? ' selected' : '') + '" data-match-id="' + m.id + '" data-pick="' + escapeHtml(pick) + '" data-odd="' + odd + '">' +
    '<span class="lbl">' + escapeHtml(label) + '</span>' +
    '<span class="val">' + odd.toFixed(2) + '</span>' +
  '</button>';
}

/* PROFILE */
function renderProfileScreen() {

  var lost = W.bets.filter(function(b) { return b.status === 'lost'; }).length;
  var t = won + lost;
  var wr = t ? ((won / t) * 100).toFixed(0) + '%' : '—';

  html += '<div class="profile-head">' +
    '<div class="profile-avatar">' + escapeHtml(AUTH.currentUser.username[0].toUpperCase()) + '</div>' +
    '<div class="profile-info">' +
      '<div class="profile-name">' + escapeHtml(AUTH.currentUser.username) + '</div>' +
      '<div class="profile-balance">' + fmt(W.balance) + ' ₽</div>' +
    '</div>' +
  '</div>' +
  '<div class="profile-stats">' +
    '<div class="profile-stat"><div class="ps-label">Ставок</div><div class="ps-value">' + W.bets.length + '</div></div>' +
    '<div class="profile-stat"><div class="ps-label">Винрейт</div><div class="ps-value">' + wr + '</div></div>' +
    '<div class="profile-stat"><div class="ps-label">Профит</div><div class="ps-value ' + (prof >= 0 ? 'green' : 'red') + '">' + (prof >= 0 ? '+' : '') + fmt(prof) + '</div></div>' +
  '</div>' +

    menuItem('📜', 'История ставок', 'history') +
    menuItem('💰', 'Получить бонус', 'bonus') +

  '<button class="logout-btn" id="btnLogout">Выйти из аккаунта</button>';
