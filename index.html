<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a1a">
<title>RubWin — Игры</title>
<style>
:root{
  --bg:#0a0a1a;--bg2:#12122a;--card:#1a1a35;--card2:#252547;
  --text:#fff;--text2:#8a8ab8;--text3:#4a4a7a;
  --blue:#4f6bff;--purple:#8b5cf6;--pink:#ec4899;
  --green:#22c55e;--red:#ef4444;--yellow:#fbbf24;
  --border:#2a2a4a;--border2:#3a3a6a;
  --grad:linear-gradient(135deg,#4f6bff 0%,#8b5cf6 100%);
  --grad-green:linear-gradient(135deg,#22c55e 0%,#16a34a 100%);
  --grad-red:linear-gradient(135deg,#ef4444 0%,#dc2626 100%);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;user-select:none;-webkit-font-smoothing:antialiased;padding-bottom:80px}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:none;outline:none;background:none}
button:active{opacity:.85}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}
.hidden{display:none!important}

/* ВЕРХНЯЯ ПАНЕЛЬ */
.topbar{position:sticky;top:0;z-index:100;background:var(--bg);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.logo{font-size:24px;font-weight:900;letter-spacing:-1px;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.topbar-right{display:flex;gap:8px;align-items:center}
.balance-pill{background:var(--card);padding:7px 14px;border-radius:24px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;border:1px solid var(--border2)}
.balance-pill .coin{width:20px;height:20px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.topup-btn{background:var(--grad);color:#fff;padding:9px 16px;border-radius:24px;font-weight:700;font-size:13px;border:none}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:16px}

/* ПРОМО */
.promo{margin:16px;border-radius:20px;background:linear-gradient(135deg,#5b3df5 0%,#7c3aed 50%,#a855f7 100%);padding:20px;position:relative;overflow:hidden;min-height:170px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 8px 32px rgba(91,61,245,.35)}
.promo h2{font-size:26px;font-weight:900;letter-spacing:-.5px;margin-bottom:6px;position:relative;z-index:1}
.promo p{font-size:14px;opacity:.9;margin-bottom:16px;position:relative;z-index:1}
.promo-btn{background:rgba(255,255,255,.2);backdrop-filter:blur(10px);color:#fff;padding:12px 24px;border-radius:24px;font-weight:700;font-size:14px;align-self:flex-start;position:relative;z-index:1;border:1px solid rgba(255,255,255,.3)}
.promo-emoji{position:absolute;right:-10px;bottom:-10px;font-size:120px;opacity:.25;z-index:0}

/* LIVE */
.live-section{padding:0 16px;margin-bottom:8px}
.live-label{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:var(--red);margin-bottom:8px;letter-spacing:1px}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--red);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.live-scroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.live-scroll::-webkit-scrollbar{display:none}
.live-card{min-width:150px;background:var(--card);border-radius:12px;padding:10px;display:flex;align-items:center;gap:10px;border:1px solid var(--border2);flex-shrink:0}
.live-avatar{width:34px;height:34px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.live-info{flex:1;min-width:0}
.live-name{font-size:11px;font-weight:600;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live-amount{font-size:13px;font-weight:800;color:var(--green)}

/* ЗАГОЛОВКИ */
.section-title{font-size:20px;font-weight:800;padding:0 16px;margin:20px 0 12px;letter-spacing:-.3px}

/* ИГРЫ */
.games-grid{padding:0 16px;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.game-card{background:var(--card);border-radius:16px;overflow:hidden;border:1px solid var(--border2);cursor:pointer;position:relative;min-height:130px;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;transition:transform .15s}
.game-card:active{transform:scale(.97)}
.game-card.wide{grid-column:1 / -1;min-height:150px}
.game-card-bg{position:absolute;inset:0;z-index:0}
.game-card.cow .game-card-bg{background:linear-gradient(135deg,#4f6bff 0%,#8b5cf6 100%)}
.game-card.rocket .game-card-bg{background:linear-gradient(135deg,#7c3aed 0%,#ec4899 100%)}
.game-card.mines .game-card-bg{background:linear-gradient(135deg,#1e3a8a 0%,#312e81 100%)}
.game-card.upgrade .game-card-bg{background:linear-gradient(135deg,#f59e0b 0%,#ef4444 100%)}
.game-card-overlay{position:absolute;inset:0;background:linear-gradient(180deg,transparent 0%,rgba(0,0,0,.55) 100%);z-index:1}
.game-emoji{position:absolute;top:10px;right:12px;font-size:56px;z-index:2;filter:drop-shadow(0 4px 12px rgba(0,0,0,.3))}
.game-players{position:relative;z-index:3;font-size:11px;opacity:.85;margin-bottom:4px;display:flex;align-items:center;gap:4px}
.game-players .dot{width:6px;height:6px;border-radius:50%;background:#4ade80}
.game-name{position:relative;z-index:3;font-size:17px;font-weight:800}

/* НИЖНИЙ ТАБ-БАР */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);display:flex;justify-content:space-around;padding:10px 0 14px;border-top:1px solid var(--border2);z-index:200}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--text3);flex:1;padding:4px 0;position:relative;transition:color .15s;cursor:pointer}
.nav-item.active{color:var(--text)}
.nav-item .icon{font-size:22px;line-height:1}
.nav-item .free-tag{position:absolute;top:-4px;right:50%;transform:translateX(14px);background:var(--yellow);color:#000;font-size:9px;font-weight:800;padding:2px 6px;border-radius:8px}

/* ИГРОВОЙ ЭКРАН */
.game-screen{position:fixed;inset:0;background:var(--bg);z-index:300;display:none;flex-direction:column;overflow-y:auto;padding-bottom:100px}
.game-screen.open{display:flex}
.game-header{position:sticky;top:0;background:var(--bg);padding:14px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);z-index:10}
.back-btn{font-size:20px;color:var(--text);padding:4px 8px;font-weight:600}
.game-title{font-size:18px;font-weight:800;flex:1}
.game-header-icons{display:flex;gap:12px;font-size:18px}
.game-content{padding:16px;flex:1;display:flex;flex-direction:column}

/* АРЕНА */
.arena{flex:1;min-height:280px;background:radial-gradient(ellipse at 50% 100%,rgba(79,107,255,.25) 0%,transparent 60%),#050510;border-radius:16px;position:relative;overflow:hidden;border:1px solid var(--border);margin-bottom:16px}
.arena.rocket-bg{background:radial-gradient(ellipse at 50% 100%,rgba(124,58,237,.3) 0%,transparent 60%),#050510}
.arena.cow-bg{background:linear-gradient(180deg,#1a1a35 0%,#252547 100%)}
.stars{position:absolute;inset:0;overflow:hidden}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:.6;animation:twinkle 3s infinite}
@keyframes twinkle{0%,100%{opacity:.3}50%{opacity:.9}}
.planet{position:absolute;border-radius:50%;opacity:.25;filter:blur(2px)}
.planet.p1{width:80px;height:80px;background:radial-gradient(circle at 30% 30%,#8b5cf6,#4c1d95);right:-20px;top:15%}
.planet.p2{width:50px;height:50px;background:radial-gradient(circle at 30% 30%,#ec4899,#831843);left:-10px;top:45%}
.planet.p3{width:120px;height:120px;background:radial-gradient(circle at 30% 30%,#4f6bff,#1e3a8a);left:30%;bottom:-40px}
.rocket{position:absolute;font-size:60px;left:20%;bottom:15%;transition:transform .1s linear;filter:drop-shadow(0 8px 20px rgba(79,107,255,.6));z-index:5}
.multiplier{position:absolute;top:15%;left:50%;transform:translateX(-50%);font-size:64px;font-weight:900;letter-spacing:-3px;z-index:4;text-shadow:0 0 40px rgba(79,107,255,.6)}
.multiplier.growing{background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.multiplier.crashed{color:var(--red)}
.status-text{position:absolute;bottom:20%;left:50%;transform:translateX(-50%);font-size:14px;color:var(--text2);z-index:4;text-align:center;padding:0 20px;width:100%}
.countdown-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:72px;font-weight:900;color:rgba(255,255,255,.9);z-index:6;text-shadow:0 0 40px rgba(79,107,255,.8)}
.crash-history{position:absolute;top:12px;left:12px;display:flex;gap:6px;flex-wrap:wrap;z-index:3;max-width:80%}
.crash-history-pill{background:rgba(255,255,255,.08);padding:4px 10px;border-radius:12px;font-size:11px;font-weight:700}
.crash-history-pill.red{color:var(--red)}
.crash-history-pill.green{color:var(--green)}
.crash-history-pill.yellow{color:var(--yellow)}

/* MINES */
.mines-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:16px 0}
.mine-cell{aspect-ratio:1;background:var(--card2);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;transition:all .15s;border:1px solid var(--border2)}
.mine-cell:active{transform:scale(.95)}
.mine-cell.opened{background:var(--grad);border-color:transparent}
.mine-cell.mine{background:var(--red);border-color:transparent}
.mine-cell.gem{background:var(--green);border-color:transparent}

/* КОРОВКА */
.cow-road{position:absolute;top:50%;transform:translateY(-50%);width:100%;height:80px;background:linear-gradient(180deg,#2a2a4a 0%,#1a1a35 100%);border-top:2px dashed #4a4a7a;border-bottom:2px dashed #4a4a7a}
.cow-lane{position:absolute;top:0;bottom:0;width:100%;display:flex;align-items:center;font-size:32px;transition:left .5s linear}
.cow-sprite{position:absolute;bottom:15%;left:50%;transform:translateX(-50%);font-size:52px;transition:left .4s ease;z-index:10}
.cow-finish{position:absolute;right:5%;top:0;bottom:0;width:30px;background:repeating-linear-gradient(0deg,#000 0 10px,#fff 10px 20px);opacity:.3}
.cow-distance{position:absolute;top:12px;left:12px;font-size:13px;font-weight:800;color:var(--green)}

/* UPGRADE */
.upgrade-wheel-wrap{display:flex;flex-direction:column;align-items:center;margin:20px 0}
.wheel-container{width:260px;height:260px;position:relative;margin-bottom:20px}
.wheel{width:100%;height:100%;border-radius:50%;position:relative;transition:transform 4s cubic-bezier(.17,.67,.25,1);background:conic-gradient(from 0deg,#4f6bff 0deg 45deg,#8b5cf6 45deg 90deg,#ec4899 90deg 135deg,#f59e0b 135deg 180deg,#22c55e 180deg 225deg,#4f6bff 225deg 270deg,#8b5cf6 270deg 315deg,#ec4899 315deg 360deg)}
.wheel-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:80px;height:80px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;border:4px solid var(--card2);z-index:3}
.wheel-pointer{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-size:32px;z-index:10;filter:drop-shadow(0 2px 8px rgba(0,0,0,.5))}

/* УПРАВЛЕНИЕ */
.controls{background:var(--card);border-radius:16px;padding:14px;border:1px solid var(--border2);margin-top:auto}
.control-tabs{display:flex;gap:6px;margin-bottom:10px}
.tab-btn{flex:1;background:var(--card2);color:var(--text2);padding:9px;border-radius:10px;font-weight:600;font-size:12px;border:1px solid var(--border2);text-align:center;cursor:pointer}
.tab-btn.active{background:var(--grad);color:#fff;border-color:transparent}
.bet-input-row{display:flex;gap:8px;align-items:center;background:var(--card2);border-radius:12px;padding:4px;border:1px solid var(--border2);margin-bottom:10px}
.bet-input-row input{flex:1;background:none;border:none;color:var(--text);font-size:16px;font-weight:700;padding:10px 12px;outline:none;min-width:0;font-family:inherit}
.quick-btn{background:var(--bg2);color:var(--text2);padding:8px 12px;border-radius:8px;font-size:12px;font-weight:700;border:1px solid var(--border2)}
.quick-btn:active{background:var(--card2)}
.play-btn{width:100%;background:var(--grad);color:#fff;padding:16px;border-radius:12px;font-size:17px;font-weight:800;margin-top:12px;border:none;box-shadow:0 8px 24px rgba(79,107,255,.4)}
.play-btn:disabled{opacity:.5;box-shadow:none}
.play-btn.cashout{background:var(--grad-green);box-shadow:0 8px 24px rgba(34,197,94,.4)}
.play-btn.danger{background:var(--grad-red);box-shadow:0 8px 24px rgba(239,68,68,.4)}
.play-btn.wait{background:var(--card2);color:var(--text2);box-shadow:none}

/* ПРОФИЛЬ */
.profile-header{background:var(--grad);padding:32px 16px 24px;text-align:center;border-radius:0 0 24px 24px;margin-bottom:16px}
.profile-avatar{width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:40px;margin:0 auto 12px}
.profile-name{font-size:20px;font-weight:800;margin-bottom:4px}
.profile-balance{font-size:32px;font-weight:900;letter-spacing:-1px}
.profile-balance-label{font-size:12px;opacity:.8;margin-bottom:16px}
.stat-row{display:flex;gap:12px;padding:0 16px;margin-bottom:16px}
.stat-card{flex:1;background:var(--card);border-radius:12px;padding:14px;border:1px solid var(--border2);text-align:center}
.stat-value{font-size:18px;font-weight:800;margin-bottom:2px}
.stat-value.green{color:var(--green)}
.stat-value.red{color:var(--red)}
.stat-label{font-size:11px;color:var(--text2)}

/* ИСТОРИЯ */
.history-item{background:var(--card);border-radius:12px;padding:14px;margin:8px 16px;border:1px solid var(--border2);display:flex;justify-content:space-between;align-items:center;gap:12px}
.history-item .h-left{flex:1;min-width:0}
.history-item .h-game{font-size:13px;font-weight:700;margin-bottom:2px}
.history-item .h-info{font-size:11px;color:var(--text2)}
.history-item .h-amount{font-weight:800;font-size:15px}
.history-item .h-amount.win{color:var(--green)}
.history-item .h-amount.lose{color:var(--red)}

/* МОДАЛКА */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;display:none;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.modal-content{background:var(--card);border-radius:20px;padding:24px;max-width:380px;width:100%;border:1px solid var(--border2);text-align:center}
.modal-title{font-size:20px;font-weight:800;margin-bottom:8px}
.modal-text{color:var(--text2);font-size:14px;margin-bottom:20px;white-space:pre-line}
.modal-btn{background:var(--grad);color:#fff;padding:14px;border-radius:12px;font-size:15px;font-weight:700;width:100%;margin-bottom:8px;border:none}
.modal-btn.secondary{background:var(--card2);border:1px solid var(--border2)}

/* ТОСТ */
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--card2);color:#fff;padding:12px 22px;border-radius:24px;font-size:13px;font-weight:600;z-index:1000;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;border:1px solid var(--border2);max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{background:var(--green);border-color:transparent}
.toast.error{background:var(--red);border-color:transparent}

@media(max-width:360px){
  .multiplier{font-size:48px}
  .rocket{font-size:44px}
  .game-name{font-size:15px}
  .game-emoji{font-size:44px}
}
</style>
</head>
<body>

<!-- ВЕРХНЯЯ ПАНЕЛЬ -->
<div class="topbar">
  <div class="logo">RubWin</div>
  <div class="topbar-right">
    <div class="balance-pill"><div class="coin">₽</div><span id="balanceText">0</span></div>
    <button class="topup-btn" id="topupBtn">Пополнить</button>
    <div class="avatar">👤</div>
  </div>
</div>

<!-- ГЛАВНАЯ -->
<div id="mainScreen">
  <div class="promo">
    <h2>Подарок<br>за пополнение</h2>
    <p>Получи 5 000 ₽ раз в сутки</p>
    <button class="promo-btn" id="promoTopup">Пополнить →</button>
    <div class="promo-emoji">🎁</div>
  </div>

  <div class="live-section">
    <div class="live-label"><span class="live-dot"></span>LIVE</div>
    <div class="live-scroll" id="liveScroll"></div>
  </div>

  <div class="section-title">Игры</div>
  <div class="games-grid">
    <div class="game-card wide cow" data-game="cow">
      <div class="game-card-bg"></div>
      <div class="game-card-overlay"></div>
      <div class="game-emoji">🐮</div>
      <div class="game-players"><span class="dot"></span><span>50 играют</span></div>
      <div class="game-name">Коровка</div>
    </div>
    <div class="game-card rocket" data-game="rocket">
      <div class="game-card-bg"></div>
      <div class="game-card-overlay"></div>
      <div class="game-emoji">🚀</div>
      <div class="game-players"><span class="dot"></span><span>64 играют</span></div>
      <div class="game-name">Ракета</div>
    </div>
    <div class="game-card mines" data-game="mines">
      <div class="game-card-bg"></div>
      <div class="game-card-overlay"></div>
      <div class="game-emoji">💣</div>
      <div class="game-players"><span class="dot"></span><span>35 играют</span></div>
      <div class="game-name">Mines</div>
    </div>
    <div class="game-card upgrade" data-game="upgrade">
      <div class="game-card-bg"></div>
      <div class="game-card-overlay"></div>
      <div class="game-emoji">🎡</div>
      <div class="game-players"><span class="dot"></span><span>21 играют</span></div>
      <div class="game-name">Апгрейд</div>
    </div>
  </div>
</div>

<!-- ЭКРАН ИГРЫ -->
<div class="game-screen" id="gameScreen">
  <div class="game-header">
    <button class="back-btn" id="gameBack">←</button>
    <div class="game-title" id="gameTitle">Игра</div>
    <div class="game-header-icons"><span>🔊</span><span>🛡️</span><span>❓</span></div>
  </div>
  <div class="game-content" id="gameContent"></div>
</div>

<!-- ПРОФИЛЬ -->
<div class="game-screen" id="profileScreen">
  <div class="game-header">
    <button class="back-btn" id="profileBack">←</button>
    <div class="game-title">Профиль</div>
  </div>
  <div class="profile-header">
    <div class="profile-avatar">👤</div>
    <div class="profile-name">Игрок</div>
    <div class="profile-balance" id="profileBalance">0 ₽</div>
    <div class="profile-balance-label">Текущий баланс</div>
  </div>
  <div class="stat-row">
    <div class="stat-card"><div class="stat-value" id="statGames">0</div><div class="stat-label">Игр</div></div>
    <div class="stat-card"><div class="stat-value green" id="statWins">0</div><div class="stat-label">Побед</div></div>
    <div class="stat-card"><div class="stat-value red" id="statLoses">0</div><div class="stat-label">Проигрышей</div></div>
  </div>
</div>

<!-- ИСТОРИЯ -->
<div class="game-screen" id="historyScreen">
  <div class="game-header">
    <button class="back-btn" id="historyBack">←</button>
    <div class="game-title">История</div>
  </div>
  <div id="historyList" style="padding:8px 0;"></div>
</div>

<!-- НИЖНИЙ ТАБ-БАР -->
<div class="bottom-nav" id="bottomNav">
  <div class="nav-item active" data-page="main"><span class="icon">🎮</span><span>Игры</span></div>
  <div class="nav-item" data-page="cases"><span class="icon">📦</span><span class="free-tag">FREE</span><span>Кейсы</span></div>
  <div class="nav-item" data-page="history"><span class="icon">📜</span><span>История</span></div>
  <div class="nav-item" data-page="profile"><span class="icon">👤</span><span>Профиль</span></div>
</div>

<!-- МОДАЛКА -->
<div class="modal" id="modal">
  <div class="modal-content">
    <div class="modal-title" id="modalTitle">Заголовок</div>
    <div class="modal-text" id="modalText">Текст</div>
    <button class="modal-btn" id="modalBtn">ОК</button>
    <button class="modal-btn secondary" id="modalBtn2" style="display:none">Отмена</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   СОСТОЯНИЕ
   ============================================================ */
const State = {
  balance: 1000,
  gamesPlayed: 0,
  wins: 0,
  loses: 0,
  history: [],
  lastTopupDate: ''
};

const Storage = {
  save() {
    try {
      localStorage.setItem('rubwin_state', JSON.stringify({
        balance: State.balance,
        gamesPlayed: State.gamesPlayed,
        wins: State.wins,
        loses: State.loses,
        history: State.history.slice(0, 100),
        lastTopupDate: State.lastTopupDate
      }));
    } catch(e) {}
  },
  load() {
    try {
      const s = localStorage.getItem('rubwin_state');
      if (s) Object.assign(State, JSON.parse(s));
    } catch(e) {}
  }
};

const Utils = {
  rand(a, b) { return Math.random() * (b - a) + a; },
  randInt(a, b) { return Math.floor(this.rand(a, b + 1)); },
  choice(arr) { return arr[Math.floor(Math.random() * arr.length)]; },
  fmt(n) { return Math.round(n).toLocaleString('ru-RU'); },
  uid() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 6); }
};

const UI = {
  _t: null,
  toast(msg, type = '') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show ' + type;
    clearTimeout(this._t);
    this._t = setTimeout(() => { t.className = 'toast ' + type; }, 2000);
  },
  modal(title, text, onConfirm, onCancel) {
    const m = document.getElementById('modal');
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalText').textContent = text;
    document.getElementById('modalBtn2').style.display = onCancel ? 'block' : 'none';
    m.classList.add('open');
    document.getElementById('modalBtn').onclick = () => { m.classList.remove('open'); if (onConfirm) onConfirm(); };
    document.getElementById('modalBtn2').onclick = () => { m.classList.remove('open'); if (onCancel) onCancel(); };
  },
  updateBalance() {
    document.getElementById('balanceText').textContent = Utils.fmt(State.balance);
    document.getElementById('profileBalance').textContent = Utils.fmt(State.balance) + ' ₽';
  },
  updateProfile() {
    document.getElementById('statGames').textContent = State.gamesPlayed;
    document.getElementById('statWins').textContent = State.wins;
    document.getElementById('statLoses').textContent = State.loses;
  },
  addHistory(game, detail, amount, win) {
    State.history.unshift({ id: Utils.uid(), game, detail, amount, win, time: Date.now() });
    if (State.history.length > 100) State.history.pop();
    Storage.save();
  }
};

/* LIVE */
const LiveFeed = {
  names: ['Никус', '@qwak1', 'Spectrum', 'lexa', 'Erop', 'NightMors', 'Феникс', 'Лис', 'Соня', 'Кекс'],
  avatars: ['🐮','🚀','💎','🔥','⭐','🎯','🍀','🎲','👑','💣'],
  init() { this.render(); setInterval(() => this.render(), 4000); },
  render() {
    const el = document.getElementById('liveScroll');
    if (!el) return;
    let html = '';
    for (let i = 0; i < 5; i++) {
      html += `<div class="live-card">
        <div class="live-avatar">${Utils.choice(this.avatars)}</div>
        <div class="live-info">
          <div class="live-name">${Utils.choice(this.names)}</div>
          <div class="live-amount">${Utils.fmt(Utils.randInt(100, 5000))} ₽</div>
        </div>
      </div>`;
    }
    el.innerHTML = html;
  }
};

/* ============================================================
   ИГРА: РАКЕТА (Aviator / Crash)
   ============================================================ */
const RocketGame = {
  phase: 'idle', active: false, bet: 0, multiplier: 1, crashAt: 2,
  startTime: 0, cashouted: false, waitTimer: null, tickTimer: null, history: [],
  render() {
    return `
      <div class="arena rocket-bg">
        <div class="stars" id="stars"></div>
        <div class="planet p1"></div><div class="planet p2"></div><div class="planet p3"></div>
        <div class="crash-history" id="crashHistory"></div>
        <div class="multiplier growing" id="rocketMultiplier">1.00x</div>
        <div class="rocket" id="rocket">🚀</div>
        <div class="status-text" id="rocketStatus">Ожидание раунда</div>
        <div class="countdown-text hidden" id="rocketCountdown">7</div>
      </div>
      <div class="controls">
        <div class="control-tabs">
          <div class="tab-btn active" data-bet="10">10 ₽</div>
          <div class="tab-btn" data-bet="50">50 ₽</div>
          <div class="tab-btn" data-bet="100">100 ₽</div>
          <div class="tab-btn" data-bet="500">500 ₽</div>
        </div>
        <div class="bet-input-row">
          <input type="number" id="rocketBet" value="10" min="1" step="1">
          <button class="quick-btn" data-act="half">½</button>
          <button class="quick-btn" data-act="double">2×</button>
          <button class="quick-btn" data-act="max">МАКС</button>
        </div>
        <button class="play-btn wait" id="rocketPlay" disabled>Ожидание</button>
      </div>
    `;
  },
  init() {
    this.initStars();
    this.updateHistory();
    document.querySelectorAll('#gameContent .tab-btn').forEach(t => {
      t.onclick = () => {
        document.querySelectorAll('#gameContent .tab-btn').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        document.getElementById('rocketBet').value = t.dataset.bet;
      };
    });
    document.querySelectorAll('#gameContent .quick-btn').forEach(b => {
      b.onclick = () => {
        const input = document.getElementById('rocketBet');
        const v = parseFloat(input.value) || 0;
        if (b.dataset.act === 'half') input.value = Math.max(1, Math.floor(v / 2));
        else if (b.dataset.act === 'double') input.value = Math.min(State.balance, Math.floor(v * 2));
        else input.value = Math.floor(State.balance);
      };
    });
    document.getElementById('rocketPlay').onclick = () => this.onPlayClick();
    this.startRound();
  },
  initStars() {
    const s = document.getElementById('stars');
    if (!s) return;
    let html = '';
    for (let i = 0; i < 60; i++) {
      html += `<div class="star" style="left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*3}s"></div>`;
    }
    s.innerHTML = html;
  },
  generateCrash() {
    const r = Math.random();
    if (r < 0.03) return 1.00;
    return Math.max(1.00, Math.min(0.97 / (1 - r), 1000));
  },
  updateHistory() {
    const el = document.getElementById('crashHistory');
    if (!el) return;
    el.innerHTML = this.history.slice(0, 6).map(h => {
      let cls = h < 2 ? 'red' : h < 10 ? 'yellow' : 'green';
      return `<span class="crash-history-pill ${cls}">${h.toFixed(2)}x</span>`;
    }).join('');
  },
  startRound() {
    this.phase = 'waiting';
    this.active = false;
    this.cashouted = false;
    this.multiplier = 1.00;
    this.crashAt = this.generateCrash();

    const btn = document.getElementById('rocketPlay');
    const cd = document.getElementById('rocketCountdown');
    const mult = document.getElementById('rocketMultiplier');
    const rocket = document.getElementById('rocket');
    const status = document.getElementById('rocketStatus');

    mult.textContent = '1.00x';
    mult.className = 'multiplier growing';
    rocket.textContent = '🚀';
    rocket.style.transform = 'translate(0,0) rotate(-45deg)';
    status.textContent = 'Приём ставок';
    btn.textContent = 'Сделать ставку';
    btn.className = 'play-btn';
    btn.disabled = false;

    let count = 7;
    cd.textContent = count;
    cd.classList.remove('hidden');
    this.waitTimer = setInterval(() => {
      count--;
      cd.textContent = count;
      if (count <= 0) {
        clearInterval(this.waitTimer);
        cd.classList.add('hidden');
        this.startFlight();
      }
    }, 1000);
  },
  startFlight() {
    this.phase = 'flying';
    this.startTime = Date.now();
    const btn = document.getElementById('rocketPlay');
    const status = document.getElementById('rocketStatus');
    status.textContent = 'Летит!';
    if (this.active) {
      btn.className = 'play-btn cashout';
    } else {
      btn.textContent = 'Раунд идёт';
      btn.className = 'play-btn wait';
      btn.disabled = true;
    }
    this.tickTimer = setInterval(() => {
      const elapsed = (Date.now() - this.startTime) / 1000;
      this.multiplier = Math.pow(1.06, elapsed * 3);
      document.getElementById('rocketMultiplier').textContent = this.multiplier.toFixed(2) + 'x';
      const rocket = document.getElementById('rocket');
      rocket.style.transform = `translate(${Math.min(elapsed*12, window.innerWidth*0.5)}px, ${-Math.min(elapsed*25, window.innerHeight*0.45)}px) rotate(-45deg)`;
      if (this.active && !this.cashouted) {
        const win = this.bet * this.multiplier;
        document.getElementById('rocketPlay').textContent = `Забрать ${Utils.fmt(win)} ₽`;
      }
      if (this.multiplier >= this.crashAt) this.crash();
    }, 50);
  },
  crash() {
    clearInterval(this.tickTimer);
    this.phase = 'crashed';
    const mult = document.getElementById('rocketMultiplier');
    mult.textContent = this.crashAt.toFixed(2) + 'x';
    mult.className = 'multiplier crashed';
    document.getElementById('rocket').textContent = '💥';
    document.getElementById('rocketStatus').textContent = `Улетела на ${this.crashAt.toFixed(2)}x`;

    this.history.unshift(this.crashAt);
    if (this.history.length > 20) this.history.pop();
    this.updateHistory();

    if (this.active && !this.cashouted) {
      this.active = false;
      State.loses++;
      State.gamesPlayed++;
      UI.toast(`Краш на ${this.crashAt.toFixed(2)}x`, 'error');
      UI.addHistory('Ракета', `×${this.crashAt.toFixed(2)}`, -this.bet, false);
    }
    Storage.save();
    setTimeout(() => this.startRound(), 3000);
  },
  onPlayClick() {
    if (this.phase === 'waiting') this.placeBet();
    else if (this.phase === 'flying' && this.active) this.cashout();
  },
  placeBet() {
    if (this.active) {
      State.balance += this.bet;
      this.active = false;
      UI.updateBalance();
      UI.toast('Ставка отменена');
      const btn = document.getElementById('rocketPlay');
      btn.textContent = 'Сделать ставку';
      btn.className = 'play-btn';
      return;
    }
    const bet = parseFloat(document.getElementById('rocketBet').value);
    if (!bet || bet < 1) { UI.toast('Мин. ставка 1 ₽', 'error'); return; }
    if (bet > State.balance) { UI.toast('Недостаточно средств', 'error'); return; }
    this.bet = bet;
    State.balance -= bet;
    this.active = true;
    UI.updateBalance();
    Storage.save();
    const btn = document.getElementById('rocketPlay');
    btn.textContent = 'Отменить ставку';
    btn.className = 'play-btn wait';
    UI.toast(`Ставка ${Utils.fmt(bet)} ₽ принята`, 'success');
  },
  cashout() {
    if (!this.active || this.cashouted) return;
    this.cashouted = true;
    this.active = false;
    const win = this.bet * this.multiplier;
    State.balance += win;
    State.wins++;
    State.gamesPlayed++;
    UI.updateBalance();
    UI.toast(`Забрали ${Utils.fmt(win)} ₽ при ${this.multiplier.toFixed(2)}x`, 'success');
    UI.addHistory('Ракета', `×${this.multiplier.toFixed(2)}`, win, true);
    const btn = document.getElementById('rocketPlay');
    btn.textContent = 'Забрали!';
    btn.className = 'play-btn wait';
  }
};

/* ============================================================
   ИГРА: КОРОВКА (перебегает дорогу)
   ============================================================ */
const CowGame = {
  active: false, bet: 0, steps: 0, multiplier: 1, cars: [],
  carTimer: null, distTimer: null,
  render() {
    return `
      <div class="arena cow-bg">
        <div class="cow-distance" id="cowDist">Дистанция: 0 / 10</div>
        <div class="cow-road">
          <div class="cow-lane" id="cowLane1"></div>
          <div class="cow-lane" id="cowLane2" style="top:40px"></div>
        </div>
        <div class="cow-finish"></div>
        <div class="cow-sprite" id="cowSprite">🐮</div>
        <div class="status-text" id="cowStatus">Переведи коровку через дорогу</div>
      </div>
      <div class="controls">
        <div class="bet-input-row">
          <input type="number" id="cowBet" value="10" min="1" step="1">
          <button class="quick-btn" data-act="half">½</button>
          <button class="quick-btn" data-act="double">2×</button>
          <button class="quick-btn" data-act="max">МАКС</button>
        </div>
        <button class="play-btn" id="cowPlay">Начать</button>
      </div>
    `;
  },
  init() {
    document.querySelectorAll('#gameContent .quick-btn').forEach(b => {
      b.onclick = () => {
        const input = document.getElementById('cowBet');
        const v = parseFloat(input.value) || 0;
        if (b.dataset.act === 'half') input.value = Math.max(1, Math.floor(v / 2));
        else if (b.dataset.act === 'double') input.value = Math.min(State.balance, Math.floor(v * 2));
        else input.value = Math.floor(State.balance);
      };
    });
    document.getElementById('cowPlay').onclick = () => {
      if (this.active) this.step();
      else this.start();
    };
  },
  start() {
    const bet = parseFloat(document.getElementById('cowBet').value);
    if (!bet || bet < 1) { UI.toast('Мин. ставка 1 ₽', 'error'); return; }
    if (bet > State.balance) { UI.toast('Недостаточно средств', 'error'); return; }
    this.bet = bet;
    this.steps = 0;
    this.multiplier = 1;
    this.active = true;
    State.balance -= bet;
    UI.updateBalance();
    const btn = document.getElementById('cowPlay');
    btn.textContent = 'Идти!';
    btn.className = 'play-btn cashout';
    document.getElementById('cowStatus').textContent = 'Коровка идёт...';
    document.getElementById('cowSprite').textContent = '🐮';
    document.getElementById('cowSprite').style.left = '10%';
    this.updateDist();
    this.startCars();
    btn.onclick = () => this.step();
  },
  updateDist() {
    document.getElementById('cowDist').textContent = `Дистанция: ${this.steps} / 10`;
    document.getElementById('cowPlay').textContent = `Идти (×${this.multiplier.toFixed(2)})`;
  },
  startCars() {
    this.cars = [];
    const lanes = [document.getElementById('cowLane1'), document.getElementById('cowLane2')];
    this.carTimer = setInterval(() => {
      if (!this.active) return;
      const laneIdx = Utils.randInt(0, 1);
      const lane = lanes[laneIdx];
      const fromRight = Math.random() < 0.5;
      const car = document.createElement('div');
      car.style.position = 'absolute';
      car.style.top = '50%';
      car.style.transform = 'translateY(-50%)';
      car.style.fontSize = '36px';
      car.style.transition = 'left 2.5s linear';
      car.textContent = Utils.choice(['🚗','🚙','🚕','🚌','🚓','🏎️']);
      car.style.left = fromRight ? '110%' : '-20%';
      lane.appendChild(car);
      setTimeout(() => { car.style.left = fromRight ? '-20%' : '110%'; }, 50);
      setTimeout(() => car.remove(), 3000);
      // Проверка столкновения
      const cowPos = parseFloat(document.getElementById('cowSprite').style.left) || 10;
      const carPos = fromRight ? 110 : -20;
      const collision = Math.abs(cowPos - carPos) < 8 && laneIdx === Math.floor(this.steps / 5);
      if (collision) {
        this.hit();
      }
    }, 900);
  },
  step() {
    if (!this.active) return;
    this.steps++;
    this.multiplier = 1 + this.steps * 0.15;
    document.getElementById('cowSprite').style.left = (10 + this.steps * 8) + '%';
    this.updateDist();
    if (this.steps >= 10) {
      this.win();
    }
  },
  hit() {
    if (!this.active) return;
    this.active = false;
    clearInterval(this.carTimer);
    State.loses++;
    State.gamesPlayed++;
    document.getElementById('cowSprite').textContent = '💥';
    document.getElementById('cowStatus').textContent = 'Машина сбила коровку!';
    UI.toast('Сбила машина!', 'error');
    UI.addHistory('Коровка', `${this.steps} шагов`, -this.bet, false);
    Storage.save();
    setTimeout(() => this.reset(), 2000);
  },
  win() {
    this.active = false;
    clearInterval(this.carTimer);
    const win = this.bet * this.multiplier;
    State.balance += win;
    State.wins++;
    State.gamesPlayed++;
    UI.updateBalance();
    document.getElementById('cowSprite').textContent = '🏆';
    document.getElementById('cowStatus').textContent = `Победа! ×${this.multiplier.toFixed(2)}`;
    UI.toast(`+${Utils.fmt(win)} ₽`, 'success');
    UI.addHistory('Коровка', `${this.steps} шагов`, win, true);
    Storage.save();
    setTimeout(() => this.reset(), 2000);
  },
  reset() {
    this.active = false;
    clearInterval(this.carTimer);
    document.getElementById('cowPlay').textContent = 'Начать';
    document.getElementById('cowPlay').className = 'play-btn';
    document.getElementById('cowStatus').textContent = 'Переведи коровку через дорогу';
    document.getElementById('cowDist').textContent = 'Дистанция: 0 / 10';
    document.getElementById('cowSprite').textContent = '🐮';
    document.getElementById('cowSprite').style.left = '10%';
    ['cowLane1','cowLane2'].forEach(id => { const el = document.getElementById(id); if (el) el.innerHTML = ''; });
  }
};

/* ============================================================
   ИГРА: MINES
   ============================================================ */
const MinesGame = {
  active: false, bet: 0, mines: 3, grid: [], opened: 0, multiplier: 1,
  render() {
    return `
      <div class="arena" style="min-height:100px;padding:16px;display:flex;align-items:center;justify-content:center">
        <div class="multiplier" id="minesMultiplier" style="font-size:42px;position:static">1.00x</div>
      </div>
      <div class="mines-grid" id="minesGrid"></div>
      <div class="controls">
        <div class="control-tabs">
          <div class="tab-btn" data-mines="1">1 💣</div>
          <div class="tab-btn active" data-mines="3">3 💣</div>
          <div class="tab-btn" data-mines="5">5 💣</div>
          <div class="tab-btn" data-mines="10">10 💣</div>
        </div>
        <div class="bet-input-row">
          <input type="number" id="minesBet" value="10" min="1" step="1">
          <button class="quick-btn" data-act="half">½</button>
          <button class="quick-btn" data-act="double">2×</button>
          <button class="quick-btn" data-act="max">МАКС</button>
        </div>
        <button class="play-btn" id="minesPlay">Начать</button>
      </div>
    `;
  },
  init() {
    this.renderGrid();
    document.querySelectorAll('#gameContent .tab-btn').forEach(t => {
      t.onclick = () => {
        if (this.active) return;
        document.querySelectorAll('#gameContent .tab-btn').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        this.mines = parseInt(t.dataset.mines);
      };
    });
    document.querySelectorAll('#gameContent .quick-btn').forEach(b => {
      b.onclick = () => {
        const input = document.getElementById('minesBet');
        const v = parseFloat(input.value) || 0;
        if (b.dataset.act === 'half') input.value = Math.max(1, Math.floor(v / 2));
        else if (b.dataset.act === 'double') input.value = Math.min(State.balance, Math.floor(v * 2));
        else input.value = Math.floor(State.balance);
      };
    });
    document.getElementById('minesPlay').onclick = () => {
      if (this.active) this.cashout();
      else this.start();
    };
  },
  renderGrid() {
    const g = document.getElementById('minesGrid');
    if (!g) return;
    let html = '';
    for (let i = 0; i < 25; i++) html += `<div class="mine-cell" data-idx="${i}"></div>`;
    g.innerHTML = html;
  },
  start() {
    const bet = parseFloat(document.getElementById('minesBet').value);
    if (!bet || bet < 1) { UI.toast('Мин. ставка 1 ₽', 'error'); return; }
    if (bet > State.balance) { UI.toast('Недостаточно средств', 'error'); return; }
    this.bet = bet;
    this.active = true;
    this.opened = 0;
    this.multiplier = 1;
    State.balance -= bet;
    UI.updateBalance();
    this.renderGrid();
    this.grid = Array(25).fill(false);
    let placed = 0;
    while (placed < this.mines) {
      const i = Utils.randInt(0, 24);
      if (!this.grid[i]) { this.grid[i] = true; placed++; }
    }
    const btn = document.getElementById('minesPlay');
    btn.textContent = 'Забрать';
    btn.className = 'play-btn cashout';
    document.querySelectorAll('.mine-cell').forEach(c => {
      c.onclick = () => {
        if (!this.active) return;
        const i = parseInt(c.dataset.idx);
        if (c.classList.contains('opened') || c.classList.contains('mine')) return;
        if (this.grid[i]) {
          c.classList.add('mine'); c.textContent = '💣';
          this.lose();
        } else {
          c.classList.add('opened', 'gem'); c.textContent = '💎';
          this.opened++;
          this.updateMult();
        }
      };
    });
  },
  updateMult() {
    const total = 25, safe = total - this.mines;
    let m = 1;
    for (let i = 0; i < this.opened; i++) m *= (total - i) / (safe - i);
    m *= 0.97;
    this.multiplier = m;
    document.getElementById('minesMultiplier').textContent = m.toFixed(2) + 'x';
    document.getElementById('minesPlay').textContent = `Забрать ${Utils.fmt(this.bet * m)} ₽`;
  },
  cashout() {
    if (!this.active) return;
    if (this.opened === 0) { UI.toast('Открой хотя бы одну клетку', 'error'); return; }
    const win = this.bet * this.multiplier;
    State.balance += win;
    State.wins++;
    State.gamesPlayed++;
    UI.updateBalance();
    UI.toast(`+${Utils.fmt(win)} ₽`, 'success');
    UI.addHistory('Mines', `${this.opened} клеток ×${this.multiplier.toFixed(2)}`, win, true);
    this.reset();
  },
  lose() {
    this.active = false;
    State.loses++;
    State.gamesPlayed++;
    UI.toast('Мина!', 'error');
    UI.addHistory('Mines', 'Мина', -this.bet, false);
    document.querySelectorAll('.mine-cell').forEach(c => {
      const i = parseInt(c.dataset.idx);
      if (this.grid[i] && !c.classList.contains('mine')) { c.classList.add('mine'); c.textContent = '💣'; }
    });
    Storage.save();
    setTimeout(() => this.reset(), 2000);
  },
  reset() {
    this.active = false;
    this.opened = 0;
    this.multiplier = 1;
    const btn = document.getElementById('minesPlay');
    if (btn) { btn.textContent = 'Начать'; btn.className = 'play-btn'; }
    const m = document.getElementById('minesMultiplier');
    if (m) m.textContent = '1.00x';
    this.renderGrid();
  }
};

/* ============================================================
   ИГРА: АПГРЕЙД
   ============================================================ */
const UpgradeGame = {
  active: false, target: 2,
  render() {
    return `
      <div class="upgrade-wheel-wrap">
        <div class="wheel-container">
          <div class="wheel-pointer">▼</div>
          <div class="wheel" id="upgradeWheel"></div>
          <div class="wheel-center" id="upgradeCenter">×2</div>
        </div>
      </div>
      <div class="controls">
        <div class="control-tabs">
          <div class="tab-btn" data-mult="1.5">×1.5</div>
          <div class="tab-btn active" data-mult="2">×2</div>
          <div class="tab-btn" data-mult="3">×3</div>
          <div class="tab-btn" data-mult="5">×5</div>
          <div class="tab-btn" data-mult="10">×10</div>
        </div>
        <div class="bet-input-row">
          <input type="number" id="upgradeBet" value="10" min="1" step="1">
          <button class="quick-btn" data-act="half">½</button>
          <button class="quick-btn" data-act="double">2×</button>
          <button class="quick-btn" data-act="max">МАКС</button>
        </div>
        <button class="play-btn" id="upgradePlay">Крутить</button>
      </div>
    `;
  },
  init() {
    document.querySelectorAll('#gameContent .tab-btn').forEach(t => {
      t.onclick = () => {
        if (this.active) return;
        document.querySelectorAll('#gameContent .tab-btn').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        this.target = parseFloat(t.dataset.mult);
        document.getElementById('upgradeCenter').textContent = '×' + this.target;
      };
    });
    document.querySelectorAll('#gameContent .quick-btn').forEach(b => {
      b.onclick = () => {
        const input = document.getElementById('upgradeBet');
        const v = parseFloat(input.value) || 0;
        if (b.dataset.act === 'half') input.value = Math.max(1, Math.floor(v / 2));
        else if (b.dataset.act === 'double') input.value = Math.min(State.balance, Math.floor(v * 2));
        else input.value = Math.floor(State.balance);
      };
    });
    document.getElementById('upgradePlay').onclick = () => this.play();
  },
  play() {
    if (this.active) return;
    const bet = parseFloat(document.getElementById('upgradeBet').value);
    if (!bet || bet < 1) { UI.toast('Мин. ставка 1 ₽', 'error'); return; }
    if (bet > State.balance) { UI.toast('Недостаточно средств', 'error'); return; }
    this.active = true;
    State.balance -= bet;
    UI.updateBalance();
    const winChance = (1 / this.target) * 0.97;
    const win = Math.random() < winChance;
    const wheel = document.getElementById('upgradeWheel');
    const fullSpins = 5;
    const targetAngle = win ? Utils.rand(0, 30) : Utils.rand(60, 300);
    wheel.style.transform = `rotate(${fullSpins * 360 + targetAngle}deg)`;
    const btn = document.getElementById('upgradePlay');
    btn.textContent = 'Крутится...';
    btn.disabled = true;
    setTimeout(() => {
      if (win) {
        const winAmount = bet * this.target;
        State.balance += winAmount;
        State.wins++;
        State.gamesPlayed++;
        UI.updateBalance();
        UI.toast(`Победа! +${Utils.fmt(winAmount)} ₽`, 'success');
        UI.addHistory('Апгрейд', `×${this.target}`, winAmount, true);
      } else {
        State.loses++;
        State.gamesPlayed++;
        UI.toast(`Минус ${Utils.fmt(bet)} ₽`, 'error');
        UI.addHistory('Апгрейд', `×${this.target}`, -bet, false);
      }
      this.active = false;
      btn.textContent = 'Крутить';
      btn.disabled = false;
      Storage.save();
    }, 4200);
  }
};

/* ============================================================
   ИСТОРИЯ
   ============================================================ */
const History = {
  render() {
    const el = document.getElementById('historyList');
    if (!el) return;
    if (State.history.length === 0) {
      el.innerHTML = '<div style="text-align:center;padding:60px 20px;color:var(--text2)">История пуста</div>';
      return;
    }
    el.innerHTML = State.history.map(h => `
      <div class="history-item">
        <div class="h-left">
          <div class="h-game">${h.game}</div>
          <div class="h-info">${h.detail} · ${new Date(h.time).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}</div>
        </div>
        <div class="h-amount ${h.win ? 'win' : 'lose'}">${h.win ? '+' : ''}${Utils.fmt(h.amount)} ₽</div>
      </div>
    `).join('');
  }
};

/* ============================================================
   РОУТЕР
   ============================================================ */
const Router = {
  openGame(id) {
    const screen = document.getElementById('gameScreen');
    const content = document.getElementById('gameContent');
    const title = document.getElementById('gameTitle');
    let game, t;
    if (id === 'cow') { game = CowGame; t = '🐮 Коровка'; }
    else if (id === 'rocket') { game = RocketGame; t = '🚀 Ракета'; }
    else if (id === 'mines') { game = MinesGame; t = '💣 Mines'; }
    else if (id === 'upgrade') { game = UpgradeGame; t = '🎡 Апгрейд'; }
    title.textContent = t;
    content.innerHTML = game.render();
    screen.classList.add('open');
    game.init();
  },
  closeGame() {
    document.getElementById('gameScreen').classList.remove('open');
    if (RocketGame.waitTimer) clearInterval(RocketGame.waitTimer);
    if (RocketGame.tickTimer) clearInterval(RocketGame.tickTimer);
    if (CowGame.carTimer) clearInterval(CowGame.carTimer);
  },
  openProfile() {
    UI.updateProfile();
    UI.updateBalance();
    document.getElementById('profileScreen').classList.add('open');
  },
  openHistory() {
    History.render();
    document.getElementById('historyScreen').classList.add('open');
  }
};

/* ============================================================
   ПОПОЛНЕНИЕ — раз в сутки 5000 ₽
   ============================================================ */
function handleTopup() {
  const today = new Date().toDateString();
  if (State.lastTopupDate === today) {
    UI.toast('Уже получали сегодня. Возвращайтесь завтра!', 'error');
    return;
  }
  UI.modal('Пополнить баланс', 'Зачислить 5 000 ₽?\nСледующее пополнение — завтра.', () => {
    State.balance += 5000;
    State.lastTopupDate = today;
    UI.updateBalance();
    Storage.save();
    UI.toast('+5 000 ₽ зачислено!', 'success');
  });
}

/* ============================================================
   ИНИЦИАЛИЗАЦИЯ
   ============================================================ */
document.addEventListener('DOMContentLoaded', () => {
  Storage.load();
  UI.updateBalance();
  LiveFeed.init();

  document.getElementById('topupBtn').onclick = handleTopup;
  document.getElementById('promoTopup').onclick = handleTopup;

  document.querySelectorAll('.game-card').forEach(c => {
    c.onclick = () => Router.openGame(c.dataset.game);
  });

  document.getElementById('gameBack').onclick = () => Router.closeGame();
  document.getElementById('profileBack').onclick = () => document.getElementById('profileScreen').classList.remove('open');
  document.getElementById('historyBack').onclick = () => document.getElementById('historyScreen').classList.remove('open');

  document.querySelectorAll('.nav-item').forEach(item => {
    item.onclick = () => {
      document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active'));
      item.classList.add('active');
      const p = item.dataset.page;
      if (p === 'profile') Router.openProfile();
      else if (p === 'history') Router.openHistory();
      else if (p === 'cases') UI.toast('Кейсы скоро');
    };
  });
});
</script>
</body>
