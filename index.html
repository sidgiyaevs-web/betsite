<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d0d1a">
<title>RubWin — Мини-приложение</title>
<style>
:root{
  --bg:#0d0d1a;--bg2:#15162a;--card:#1c1d35;--card2:#25264a;
  --text:#ffffff;--text2:#9a9bb8;--text3:#5f6080;
  --blue:#4f6bff;--blue2:#6b4fff;--purple:#8b5cf6;
  --green:#22c55e;--red:#ef4444;--yellow:#fbbf24;
  --border:#2a2b4a;--border2:#343560;
  --grad:linear-gradient(135deg,#4f6bff 0%,#8b5cf6 100%);
  --grad2:linear-gradient(135deg,#8b5cf6 0%,#ec4899 100%);
  --grad-green:linear-gradient(135deg,#22c55e 0%,#16a34a 100%);
  --radius-sm:8px;--radius:12px;--radius-lg:16px;--radius-xl:20px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.4;user-select:none;-webkit-font-smoothing:antialiased;padding-bottom:80px}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:none;outline:none;background:none;transition:transform .1s,opacity .15s,background-color .15s}
button:active{opacity:.85;transform:scale(.98)}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}
.hidden{display:none!important}

/* ВЕРХНЯЯ ПАНЕЛЬ */
.topbar{position:sticky;top:0;z-index:100;background:var(--bg);padding:14px 16px 10px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.logo{font-size:24px;font-weight:900;letter-spacing:-1px;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.topbar-right{display:flex;gap:8px;align-items:center}
.balance-pill{background:var(--card);padding:8px 14px;border-radius:24px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;border:1px solid var(--border2)}
.balance-pill .coin{width:20px;height:20px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.topup-btn{background:var(--grad);color:#fff;padding:9px 16px;border-radius:24px;font-weight:700;font-size:13px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--grad2);display:flex;align-items:center;justify-content:center;font-size:16px;border:2px solid var(--border2)}

/* ПРОМО */
.promo{margin:16px;border-radius:var(--radius-xl);background:linear-gradient(135deg,#5b3df5 0%,#7c3aed 50%,#a855f7 100%);padding:20px;position:relative;overflow:hidden;min-height:170px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 8px 32px rgba(91,61,245,.35)}
.promo::before{content:'';position:absolute;top:-50%;right:-30%;width:250px;height:250px;background:radial-gradient(circle,rgba(255,255,255,.15) 0%,transparent 70%)}
.promo h2{font-size:26px;font-weight:900;letter-spacing:-.5px;margin-bottom:6px;position:relative;z-index:1}
.promo p{font-size:14px;opacity:.9;margin-bottom:16px;position:relative;z-index:1}
.promo-btn{background:rgba(255,255,255,.2);backdrop-filter:blur(10px);color:#fff;padding:12px 24px;border-radius:24px;font-weight:700;font-size:14px;align-self:flex-start;position:relative;z-index:1;border:1px solid rgba(255,255,255,.3)}
.promo-emoji{position:absolute;right:-10px;bottom:-10px;font-size:120px;opacity:.25;z-index:0}
.promo-dots{position:absolute;bottom:12px;right:20px;display:flex;gap:4px;z-index:2}
.promo-dots span{width:20px;height:3px;border-radius:2px;background:rgba(255,255,255,.3)}
.promo-dots span.active{background:#fff}

/* LIVE ЛЕНТА */
.live-section{padding:0 16px;margin-bottom:16px}
.live-label{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:var(--red);margin-bottom:8px;letter-spacing:1px}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--red);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.live-scroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.live-scroll::-webkit-scrollbar{display:none}
.live-card{min-width:160px;background:var(--card);border-radius:var(--radius);padding:10px 12px;display:flex;align-items:center;gap:10px;border:1px solid var(--border2);flex-shrink:0}
.live-avatar{width:36px;height:36px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.live-info{flex:1;min-width:0}
.live-name{font-size:12px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live-amount{font-size:13px;font-weight:800;color:var(--green)}

/* ЗАГОЛОВКИ */
.section-title{font-size:20px;font-weight:800;padding:0 16px;margin:20px 0 12px;letter-spacing:-.3px}

/* ИГРЫ */
.games-grid{padding:0 16px;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.game-card{background:var(--card);border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--border2);cursor:pointer;position:relative;min-height:130px;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;transition:transform .15s}
.game-card:active{transform:scale(.97)}
.game-card.wide{grid-column:1 / -1;min-height:150px}
.game-card-bg{position:absolute;inset:0;opacity:.9;z-index:0}
.game-card.cow .game-card-bg{background:linear-gradient(135deg,#4f6bff 0%,#8b5cf6 100%)}
.game-card.rocket .game-card-bg{background:linear-gradient(135deg,#7c3aed 0%,#ec4899 100%)}
.game-card.mines .game-card-bg{background:linear-gradient(135deg,#1e3a8a 0%,#312e81 100%)}
.game-card.upgrade .game-card-bg{background:linear-gradient(135deg,#f59e0b 0%,#ef4444 100%)}
.game-card-overlay{position:absolute;inset:0;background:linear-gradient(180deg,transparent 0%,rgba(0,0,0,.5) 100%);z-index:1}
.game-emoji{position:absolute;top:10px;right:12px;font-size:56px;z-index:2;filter:drop-shadow(0 4px 12px rgba(0,0,0,.3))}
.game-players{position:relative;z-index:3;font-size:11px;opacity:.85;margin-bottom:4px;display:flex;align-items:center;gap:4px}
.game-players .dot{width:6px;height:6px;border-radius:50%;background:#4ade80}
.game-name{position:relative;z-index:3;font-size:17px;font-weight:800}

/* НИЖНИЙ ТАБ-БАР */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);display:flex;justify-content:space-around;padding:10px 0 14px;border-top:1px solid var(--border2);z-index:200;backdrop-filter:blur(20px)}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--text3);flex:1;padding:4px 0;position:relative;transition:color .15s}
.nav-item.active{color:var(--text)}
.nav-item .icon{font-size:22px;line-height:1}
.nav-item .free-tag{position:absolute;top:-4px;right:50%;transform:translateX(14px);background:var(--yellow);color:#000;font-size:9px;font-weight:800;padding:2px 6px;border-radius:8px}

/* ИГРОВОЙ ЭКРАН */
.game-screen{position:fixed;inset:0;background:var(--bg);z-index:300;display:none;flex-direction:column;overflow-y:auto;padding-bottom:100px}
.game-screen.open{display:flex}
.game-header{position:sticky;top:0;background:var(--bg);padding:14px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);z-index:10}
.back-btn{font-size:20px;color:var(--text);padding:4px 8px;font-weight:600}
.game-title{font-size:18px;font-weight:800;flex:1}
.game-header-icons{display:flex;gap:12px;font-size:18px}

.game-content{padding:16px;flex:1;display:flex;flex-direction:column}

/* CRASH ARENA */
.crash-arena{flex:1;min-height:280px;background:radial-gradient(ellipse at center,rgba(79,107,255,.15) 0%,transparent 70%);border-radius:var(--radius-lg);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;margin-bottom:16px;overflow:hidden;border:1px solid var(--border)}
.crash-multiplier{font-size:64px;font-weight:900;letter-spacing:-2px;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;z-index:2}
.crash-emoji{font-size:80px;margin:12px 0;z-index:2}
.crash-status{font-size:14px;color:var(--text2);margin-top:8px;z-index:2}
.crash-history{position:absolute;top:12px;left:12px;display:flex;gap:6px;flex-wrap:wrap;z-index:3}
.crash-history-pill{background:rgba(255,255,255,.08);padding:4px 10px;border-radius:12px;font-size:11px;font-weight:700}
.crash-history-pill.red{color:var(--red)}
.crash-history-pill.green{color:var(--green)}

/* MINES */
.mines-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:16px 0}
.mine-cell{aspect-ratio:1;background:var(--card2);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;transition:all .15s;border:1px solid var(--border2)}
.mine-cell:active{transform:scale(.95)}
.mine-cell.opened{background:var(--grad);border-color:transparent}
.mine-cell.mine{background:var(--red);border-color:transparent}
.mine-cell.gem{background:var(--green);border-color:transparent}

/* UPGRADE WHEEL */
.upgrade-wheel-wrap{display:flex;flex-direction:column;align-items:center;margin:20px 0}
.wheel-container{width:260px;height:260px;position:relative;margin-bottom:20px}
.wheel{width:100%;height:100%;border-radius:50%;background:conic-gradient(from 0deg,#4f6bff 0deg 30deg,#8b5cf6 30deg 60deg,#ec4899 60deg 90deg,#f59e0b 90deg 120deg,#22c55e 120deg 150deg,#4f6bff 150deg 180deg,#8b5cf6 180deg 210deg,#ec4899 210deg 240deg,#f59e0b 240deg 270deg,#22c55e 270deg 300deg,#4f6bff 300deg 330deg,#8b5cf6 330deg 360deg);position:relative;transition:transform 4s cubic-bezier(.17,.67,.25,1)}
.wheel-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:80px;height:80px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;border:4px solid var(--card2)}
.wheel-pointer{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-size:32px;z-index:10;filter:drop-shadow(0 2px 8px rgba(0,0,0,.5))}

/* УПРАВЛЕНИЕ */
.controls{background:var(--card);border-radius:var(--radius-lg);padding:14px;border:1px solid var(--border2);margin-top:auto}
.control-row{display:flex;gap:8px;margin-bottom:10px}
.control-row:last-child{margin-bottom:0}
.tab-btn{flex:1;background:var(--card2);color:var(--text2);padding:10px;border-radius:var(--radius);font-weight:600;font-size:13px;border:1px solid var(--border2)}
.tab-btn.active{background:var(--grad);color:#fff;border-color:transparent}
.bet-input-row{display:flex;gap:8px;align-items:center;background:var(--card2);border-radius:var(--radius);padding:4px;border:1px solid var(--border2)}
.bet-input-row input{flex:1;background:none;border:none;color:var(--text);font-size:16px;font-weight:700;padding:10px 12px;outline:none;min-width:0;font-family:inherit}
.quick-btn{background:var(--bg2);color:var(--text2);padding:8px 12px;border-radius:var(--radius-sm);font-size:12px;font-weight:700;border:1px solid var(--border2)}
.quick-btn:active{background:var(--card2)}
.play-btn{width:100%;background:var(--grad);color:#fff;padding:16px;border-radius:var(--radius);font-size:17px;font-weight:800;margin-top:12px;box-shadow:0 8px 24px rgba(79,107,255,.4)}
.play-btn:disabled{opacity:.5;box-shadow:none}
.play-btn.cashout{background:var(--grad-green);box-shadow:0 8px 24px rgba(34,197,94,.4)}
.play-btn.danger{background:linear-gradient(135deg,#ef4444 0%,#dc2626 100%);box-shadow:0 8px 24px rgba(239,68,68,.4)}

/* МОДАЛКА */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal.open{display:flex}
.modal-content{background:var(--card);border-radius:var(--radius-xl);padding:24px;max-width:380px;width:100%;border:1px solid var(--border2);text-align:center;animation:modalIn .25s ease}
@keyframes modalIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.modal-title{font-size:20px;font-weight:800;margin-bottom:8px}
.modal-text{color:var(--text2);font-size:14px;margin-bottom:20px}
.modal-btn{background:var(--grad);color:#fff;padding:14px;border-radius:var(--radius);font-size:15px;font-weight:700;width:100%;margin-bottom:8px}
.modal-btn.secondary{background:var(--card2);border:1px solid var(--border2)}

/* ПРОФИЛЬ */
.profile-header{background:var(--grad);padding:32px 16px 24px;text-align:center;border-radius:0 0 24px 24px;margin-bottom:16px}
.profile-avatar{width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:40px;margin:0 auto 12px;backdrop-filter:blur(10px)}
.profile-name{font-size:20px;font-weight:800;margin-bottom:4px}
.profile-balance{font-size:32px;font-weight:900;letter-spacing:-1px}
.profile-balance-label{font-size:12px;opacity:.8;margin-bottom:16px}
.stat-row{display:flex;gap:12px;padding:0 16px;margin-bottom:16px}
.stat-card{flex:1;background:var(--card);border-radius:var(--radius);padding:14px;border:1px solid var(--border2);text-align:center}
.stat-value{font-size:18px;font-weight:800;margin-bottom:2px}
.stat-value.green{color:var(--green)}
.stat-value.red{color:var(--red)}
.stat-label{font-size:11px;color:var(--text2)}

/* ИСТОРИЯ */
.history-item{background:var(--card);border-radius:var(--radius);padding:14px;margin:8px 16px;border:1px solid var(--border2);display:flex;justify-content:space-between;align-items:center;gap:12px}
.history-item .h-left{flex:1;min-width:0}
.history-item .h-game{font-size:13px;font-weight:700;margin-bottom:2px}
.history-item .h-info{font-size:11px;color:var(--text2)}
.history-item .h-amount{font-weight:800;font-size:15px}
.history-item .h-amount.win{color:var(--green)}
.history-item .h-amount.lose{color:var(--red)}

/* ТОСТ */
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--card2);color:#fff;padding:12px 22px;border-radius:24px;font-size:13px;font-weight:600;z-index:1000;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;border:1px solid var(--border2);max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{background:var(--green);border-color:transparent}
.toast.error{background:var(--red);border-color:transparent}

/* АДАПТИВ */
@media (max-width:360px){
  .crash-multiplier{font-size:48px}
  .crash-emoji{font-size:60px}
  .game-name{font-size:15px}
  .game-emoji{font-size:44px}
}
</style>
</head>
<body>

<!-- ВЕРХНЯЯ ПАНЕЛЬ -->
<div class="topbar">
  <div class="logo">RubWin</div>
  <div class="topbar-right">
    <div class="balance-pill" id="balancePill">
      <div class="coin">₽</div>
      <span id="balanceText">0</span>
    </div>
    <button class="topup-btn" id="topupBtn">Пополнить</button>
    <div class="avatar">👤</div>
  </div>
</div>

<!-- ГЛАВНАЯ -->
<div id="mainScreen">
  <!-- ПРОМО -->
  <div class="promo">
    <h2>Подарок<br>за пополнение</h2>
    <p>Получи бонус до 10 000 ₽</p>
    <button class="promo-btn" id="promoTopup">Пополнить →</button>
    <div class="promo-emoji">🎁</div>
    <div class="promo-dots">
      <span class="active"></span><span></span><span></span><span></span><span></span>
    </div>
  </div>

  <!-- LIVE ЛЕНТА -->
  <div class="live-section">
    <div class="live-label"><span class="live-dot"></span>LIVE</div>
    <div class="live-scroll" id="liveScroll"></div>
  </div>

  <!-- ЗАГОЛОВОК -->
  <div class="section-title">Игры</div>

  <!-- СЕТКА ИГР -->
  <div class="games-grid">
    <div class="game-card wide cow" data-game="cow">
      <div class="game-card-bg"></div>
      <div class="game-card-overlay"></div>
      <div class="game-emoji">🐮</div>
      <div class="game-players"><span class="dot"></span><span id="cowPlayers">50 играют</span></div>
      <div class="game-name">Коровка</div>
    </div>

    <div class="game-card rocket" data-game="rocket">
      <div class="game-card-bg"></div>
      <div class="game-card-overlay"></div>
      <div class="game-emoji">🚀</div>
      <div class="game-players"><span class="dot"></span><span>64 играют</span></div>
      <div class="game-name">Ракета</div>
    </div>

    <div class="game-card mines" data-game="mines">
      <div class="game-card-bg"></div>
      <div class="game-card-overlay"></div>
      <div class="game-emoji">💣</div>
      <div class="game-players"><span class="dot"></span><span>35 играют</span></div>
      <div class="game-name">Mines</div>
    </div>

    <div class="game-card upgrade" data-game="upgrade">
      <div class="game-card-bg"></div>
      <div class="game-card-overlay"></div>
      <div class="game-emoji">🎡</div>
      <div class="game-players"><span class="dot"></span><span>21 играют</span></div>
      <div class="game-name">Апгрейд</div>
    </div>
  </div>
</div>

<!-- ЭКРАН ИГРЫ -->
<div class="game-screen" id="gameScreen">
  <div class="game-header">
    <button class="back-btn" id="gameBack">←</button>
    <div class="game-title" id="gameTitle">Игра</div>
    <div class="game-header-icons">
      <span>🔊</span>
      <span>🛡️</span>
      <span>❓</span>
    </div>
  </div>
  <div class="game-content" id="gameContent"></div>
</div>

<!-- ЭКРАН ПРОФИЛЯ -->
<div class="game-screen" id="profileScreen">
  <div class="game-header">
    <button class="back-btn" id="profileBack">←</button>
    <div class="game-title">Профиль</div>
  </div>
  <div class="profile-header">
    <div class="profile-avatar">👤</div>
    <div class="profile-name" id="profileName">Игрок</div>
    <div class="profile-balance" id="profileBalance">0 ₽</div>
    <div class="profile-balance-label">Текущий баланс</div>
  </div>
  <div class="stat-row">
    <div class="stat-card">
      <div class="stat-value" id="statGames">0</div>
      <div class="stat-label">Игр</div>
    </div>
    <div class="stat-card">
      <div class="stat-value green" id="statWins">0</div>
      <div class="stat-label">Побед</div>
    </div>
    <div class="stat-card">
      <div class="stat-value red" id="statLoses">0</div>
      <div class="stat-label">Проигрышей</div>
    </div>
  </div>
</div>

<!-- ЭКРАН ИСТОРИИ -->
<div class="game-screen" id="historyScreen">
  <div class="game-header">
    <button class="back-btn" id="historyBack">←</button>
    <div class="game-title">История</div>
  </div>
  <div id="historyList" style="padding:8px 0;"></div>
</div>

<!-- НИЖНИЙ ТАБ-БАР -->
<div class="bottom-nav" id="bottomNav">
  <div class="nav-item active" data-page="main">
    <span class="icon">🎮</span>
    <span>Игры</span>
  </div>
  <div class="nav-item" data-page="cases">
    <span class="icon">📦</span>
    <span class="free-tag">FREE</span>
    <span>Кейсы</span>
  </div>
  <div class="nav-item" data-page="history">
    <span class="icon">📜</span>
    <span>История</span>
  </div>
  <div class="nav-item" data-page="profile">
    <span class="icon">👤</span>
    <span>Профиль</span>
  </div>
</div>

<!-- МОДАЛКА -->
<div class="modal" id="modal">
  <div class="modal-content">
    <div class="modal-title" id="modalTitle">Заголовок</div>
    <div class="modal-text" id="modalText">Текст</div>
    <button class="modal-btn" id="modalBtn">ОК</button>
    <button class="modal-btn secondary" id="modalBtn2">Отмена</button>
  </div>
</div>

<!-- ТОСТ -->
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   СОСТОЯНИЕ
   ============================================================ */
const State = {
  balance: 1000,
  gamesPlayed: 0,
  wins: 0,
  loses: 0,
  history: [],
  dailyTopups: 0,
  dailyTopupAmount: 0,
  lastTopupDate: '',
  playerName: 'Игрок'
};

/* ============================================================
   ХРАНИЛИЩЕ
   ============================================================ */
const Storage = {
  save() {
    try {
      localStorage.setItem('rubwin_state', JSON.stringify({
        balance: State.balance,
        gamesPlayed: State.gamesPlayed,
        wins: State.wins,
        loses: State.loses,
        history: State.history.slice(0, 100),
        dailyTopups: State.dailyTopups,
        dailyTopupAmount: State.dailyTopupAmount,
        lastTopupDate: State.lastTopupDate,
        playerName: State.playerName
      }));
    } catch(e) {}
  },
  load() {
    try {
      const s = localStorage.getItem('rubwin_state');
      if (!s) return;
      const d = JSON.parse(s);
      Object.assign(State, d);
      // Проверка дня
      const today = new Date().toDateString();
      if (State.lastTopupDate !== today) {
        State.dailyTopups = 0;
        State.dailyTopupAmount = 0;
        State.lastTopupDate = today;
      }
    } catch(e) {}
  }
};

/* ============================================================
   УТИЛИТЫ
   ============================================================ */
const Utils = {
  rand(min, max) { return Math.random() * (max - min) + min; },
  randInt(min, max) { return Math.floor(this.rand(min, max + 1)); },
  choice(arr) { return arr[Math.floor(Math.random() * arr.length)]; },
  fmt(n) { return Math.round(n).toLocaleString('ru-RU'); },
  uid() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 6); }
};

/* ============================================================
   UI
   ============================================================ */
const UI = {
  toast(msg, type = '') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show ' + type;
    clearTimeout(this._toastTimer);
    this._toastTimer = setTimeout(() => { t.className = 'toast ' + type; }, 2000);
  },
  modal(title, text, onConfirm, onCancel) {
    const m = document.getElementById('modal');
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalText').textContent = text;
    document.getElementById('modalBtn').textContent = 'ОК';
    document.getElementById('modalBtn2').style.display = onCancel ? 'block' : 'none';
    m.classList.add('open');
    document.getElementById('modalBtn').onclick = () => {
      m.classList.remove('open');

    };
    document.getElementById('modalBtn2').onclick = () => {
      m.classList.remove('open');
      if (onCancel) onCancel();
    };

  updateBalance() {
    document.getElementById('balanceText').textContent = Utils.fmt(State.balance);

   ИГРА: КОРОВКА (Crash)
   ============================================================ */
const CowGame = {
  active: false,
  bet: 0,
  multiplier: 1,
  crashed: false,
  cashouted: false,
  interval: null,
  history: [],
  crashAt: 1,
  render() {
    return `
      <div class="crash-arena">
        <div class="crash-history" id="cowHistory"></div>
        <div class="crash-multiplier" id="cowMultiplier">1.00x</div>
        <div class="crash-emoji" id="cowEmoji">🐮</div>
        <div class="crash-status" id="cowStatus">Сделайте ставку</div>
      </div>
      <div class="controls">
        <div class="bet-input-row">
          <input type="number" id="cowBet" value="10" min="1" step="1">
          <button class="quick-btn" data-bet="10">10</button>
          <button class="quick-btn" data-bet="100">100</button>
          <button class="quick-btn" data-bet="max">МАКС</button>
        </div>
        <button class="play-btn" id="cowPlay">Начать игру</button>
      </div>
    `;
  },
  init() {
    this.updateHistory();
    const playBtn = document.getElementById('cowPlay');
    playBtn.onclick = () => this.play();
    document.querySelectorAll('#gameContent .quick-btn[data-bet]').forEach(b => {
      b.onclick = () => {
        const input = document.getElementById('cowBet');
        if (b.dataset.bet === 'max') input.value = Math.floor(State.balance);
        else input.value = b.dataset.bet;
      };
    });
  },
  updateHistory() {
    const el = document.getElementById('cowHistory');
    if (!el) return;
    el.innerHTML = this.history.slice(0, 5).map(h =>
      `<span class="crash-history-pill ${h < 2 ? 'red' : 'green'}">${h.toFixed(2)}x</span>`
    ).join('');
  },
  play() {
    if (this.active) {
      // Кэшаут
      this.cashout();
      return;
    }
    const bet = parseFloat(document.getElementById('cowBet').value);
    if (!bet || bet < 1) { UI.toast('Мин. ставка 1 ₽', 'error'); return; }
    if (bet > State.balance) { UI.toast('Недостаточно средств', 'error'); return; }

    this.bet = bet;
    this.active = true;
    this.crashed = false;
    this.cashouted = false;
    this.multiplier = 1.00;
    State.balance -= bet;
    UI.updateBalance();
    Storage.save();

    // Кэф краха по распределению
    const r = Math.random();
    if (r < 0.05) this.crashAt = Utils.rand(1.0, 1.1);
    else if (r < 0.5) this.crashAt = Utils.rand(1.1, 2.0);
    else if (r < 0.85) this.crashAt = Utils.rand(2.0, 5.0);
    else if (r < 0.97) this.crashAt = Utils.rand(5.0, 15.0);
    else this.crashAt = Utils.rand(15.0, 50.0);

    const btn = document.getElementById('cowPlay');
    btn.textContent = 'Забрать 0 ₽';
    btn.classList.add('cashout');

    this.interval = setInterval(() => {
      const elapsed = (Date.now() - this.startTime) / 1000;
      this.multiplier = Math.pow(1.06, elapsed * 3);
      document.getElementById('cowMultiplier').textContent = this.multiplier.toFixed(2) + 'x';
      document.getElementById('cowStatus').textContent = 'Растёт...';

      const currentWin = this.bet * this.multiplier;
      btn.textContent = `Забрать ${Utils.fmt(currentWin)} ₽`;

      if (this.multiplier >= this.crashAt) {
        this.crash();
      }
    }, 50);
    this.startTime = Date.now();
  },
  cashout() {
    if (!this.active || this.crashed) return;
    clearInterval(this.interval);
    const win = this.bet * this.multiplier;
    State.balance += win;
    State.wins++;
    State.gamesPlayed++;
    this.history.unshift(this.multiplier);
    if (this.history.length > 10) this.history.pop();
    this.updateHistory();
    UI.updateBalance();
    UI.toast(`Забрали ${Utils.fmt(win)} ₽ при ${this.multiplier.toFixed(2)}x`, 'success');
    this.addHistory('Коровка', `×${this.multiplier.toFixed(2)}`, win, true);
    this.reset();
  },
  crash() {
    clearInterval(this.interval);
    this.crashed = true;
    this.active = false;
    this.history.unshift(this.crashAt);
    if (this.history.length > 10) this.history.pop();
    this.updateHistory();
    State.loses++;
    State.gamesPlayed++;
    document.getElementById('cowEmoji').textContent = '💥';
    document.getElementById('cowStatus').textContent = `Краш на ${this.crashAt.toFixed(2)}x`;
    UI.toast(`Краш на ${this.crashAt.toFixed(2)}x`, 'error');
    this.addHistory('Коровка', `×${this.crashAt.toFixed(2)}`, -this.bet, false);
    Storage.save();
    setTimeout(() => this.reset(), 2000);
  },
  reset() {
    this.active = false;
    this.crashed = false;
    this.cashouted = false;
    this.multiplier = 1.00;
    clearInterval(this.interval);
    const btn = document.getElementById('cowPlay');
    if (btn) {
      btn.textContent = 'Начать игру';
      btn.classList.remove('cashout');
    }
    const m = document.getElementById('cowMultiplier');
    if (m) m.textContent = '1.00x';
    const e = document.getElementById('cowEmoji');
    if (e) e.textContent = '🐮';
    const s = document.getElementById('cowStatus');
    if (s) s.textContent = 'Сделайте ставку';
    Storage.save();
  },
  addHistory(game, detail, amount, win) {
    State.history.unshift({
      id: Utils.uid(),
      game: game,
      detail: detail,
      amount: amount,
      win: win,
      time: Date.now()
    });
    if (State.history.length > 100) State.history.pop();
  }
};

const MinesGame = {
  active: false,
  bet: 0,
  mines: 3,
  grid: [],
  opened: 0,
  multiplier: 1,
  totalCells: 25,
  render() {
    return `
      <div class="crash-arena" style="min-height:100px;padding:16px">
        <div class="crash-multiplier" id="minesMultiplier" style="font-size:42px">1.00x</div>
        <div class="crash-status" id="minesStatus">Выберите ставку и жмите Играть</div>
      </div>
      <div class="mines-grid" id="minesGrid"></div>
      <div class="controls">
        <div class="tab-btn-row" style="display:flex;gap:6px;margin-bottom:10px">
          <button class="tab-btn" data-mines="1">1 💣</button>
          <button class="tab-btn active" data-mines="3">3 💣</button>
          <button class="tab-btn" data-mines="5">5 💣</button>
          <button class="tab-btn" data-mines="10">10 💣</button>
        </div>
        <div class="bet-input-row">
          <input type="number" id="minesBet" value="10" min="1" step="1">
          <button class="quick-btn" data-bet="10">10</button>
          <button class="quick-btn" data-bet="100">100</button>
          <button class="quick-btn" data-bet="max">МАКС</button>
        </div>
        <button class="play-btn" id="minesPlay">Начать игру</button>
      </div>
    `;
  },
  init() {
    this.renderGrid();
    document.querySelectorAll('#gameContent .tab-btn[data-mines]').forEach(b => {
      b.onclick = () => {
        if (this.active) return;
        document.querySelectorAll('#gameContent .tab-btn[data-mines]').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        this.mines = parseInt(b.dataset.mines);
      };
    });
    document.querySelectorAll('#gameContent .quick-btn[data-bet]').forEach(b => {
      b.onclick = () => {
        const input = document.getElementById('minesBet');
        if (b.dataset.bet === 'max') input.value = Math.floor(State.balance);
        else input.value = b.dataset.bet;
      };
    });
    document.getElementById('minesPlay').onclick = () => {
      if (this.active) this.cashout();
      else this.play();
    };
  },
  renderGrid() {
    const grid = document.getElementById('minesGrid');
    if (!grid) return;
    let html = '';
    for (let i = 0; i < 25; i++) {
      html += `<div class="mine-cell" data-idx="${i}"></div>`;
    }
    grid.innerHTML = html;
  },
  play() {
    const bet = parseFloat(document.getElementById('minesBet').value);
    if (!bet || bet < 1) { UI.toast('Мин. ставка 1 ₽', 'error'); return; }
    if (bet > State.balance) { UI.toast('Недостаточно средств', 'error'); return; }

    this.bet = bet;
    this.active = true;
    this.opened = 0;
    this.multiplier = 1;
    State.balance -= bet;
    UI.updateBalance();
    this.renderGrid();

    // Генерация мин
    this.grid = Array(25).fill(false);
    let placed = 0;
    while (placed < this.mines) {
      const idx = Utils.randInt(0, 24);
      if (!this.grid[idx]) { this.grid[idx] = true; placed++; }
    }

    document.getElementById('minesPlay').textContent = 'Забрать';
    document.getElementById('minesPlay').classList.add('cashout');
    document.getElementById('minesStatus').textContent = 'Открывайте клетки';

    document.querySelectorAll('.mine-cell').forEach(cell => {
      cell.onclick = () => {
        if (!this.active) return;
        const idx = parseInt(cell.dataset.idx);
        if (cell.classList.contains('opened') || cell.classList.contains('mine')) return;
        if (this.grid[idx]) {
          cell.classList.add('mine');
          cell.textContent = '💣';
          this.lose();
        } else {
          cell.classList.add('opened', 'gem');
          cell.textContent = '💎';
          this.opened++;
          this.updateMultiplier();
        }
      };
    });
  },
  updateMultiplier() {
    // Формула множителя
    const total = 25;
    const safe = total - this.mines;
    let mult = 1;
    for (let i = 0; i < this.opened; i++) {
      mult *= (total - i) / (safe - i);
    }
    mult *= 0.97; // house edge
    this.multiplier = mult;
    document.getElementById('minesMultiplier').textContent = mult.toFixed(2) + 'x';
    const win = this.bet * mult;
    document.getElementById('minesPlay').textContent = `Забрать ${Utils.fmt(win)} ₽`;
  },
  cashout() {
    if (!this.active) return;
    if (this.opened === 0) { UI.toast('Откройте хотя бы одну клетку', 'error'); return; }
    const win = this.bet * this.multiplier;
    State.balance += win;
    State.wins++;
    State.gamesPlayed++;
    UI.updateBalance();
    UI.toast(`Забрали ${Utils.fmt(win)} ₽`, 'success');
    this.addHistory('Mines', `${this.opened} клеток ×${this.multiplier.toFixed(2)}`, win, true);
    this.reset();
  },
  lose() {
    this.active = false;
    State.loses++;
    State.gamesPlayed++;
    UI.toast('Попали на мину!', 'error');
    this.addHistory('Mines', 'Мина', -this.bet, false);
    // Показать все мины
    document.querySelectorAll('.mine-cell').forEach(cell => {
      const idx = parseInt(cell.dataset.idx);
      if (this.grid[idx] && !cell.classList.contains('mine')) {
        cell.classList.add('mine');
        cell.textContent = '💣';
      }
    });
    Storage.save();
    setTimeout(() => this.reset(), 2200);
  },
  reset() {
    this.active = false;
    this.opened = 0;
    this.multiplier = 1;
    const btn = document.getElementById('minesPlay');
    if (btn) { btn.textContent = 'Начать игру'; btn.classList.remove('cashout'); }
    const m = document.getElementById('minesMultiplier');
    if (m) m.textContent = '1.00x';
    const s = document.getElementById('minesStatus');
    if (s) s.textContent = 'Выберите ставку и жмите Играть';
    this.renderGrid();
    Storage.save();
  },
  addHistory(game, detail, amount, win) {
    State.history.unshift({ id: Utils.uid(), game, detail, amount, win, time: Date.now() });
    if (State.history.length > 100) State.history.pop();
  }
};

      };
    });
    document.querySelectorAll('#gameContent .quick-btn[data-bet]').forEach(b => {
      b.onclick = () => {
        const input = document.getElementById('upgradeBet');
        if (b.dataset.bet === 'max') input.value = Math.floor(State.balance);
        else input.value = b.dataset.bet;
      };
    });
    document.getElementById('upgradePlay').onclick = () => this.play();
  },
  play() {
    if (this.active) return;
    const bet = parseFloat(document.getElementById('upgradeBet').value);
    if (!bet || bet < 1) { UI.toast('Мин. ставка 1 ₽', 'error'); return; }
    if (bet > State.balance) { UI.toast('Недостаточно средств', 'error'); return; }

    this.bet = bet;
    this.active = true;
    State.balance -= bet;
    UI.updateBalance();

    // Шанс = 1 / targetMultiplier (с house edge)
    const winChance = (1 / this.targetMultiplier) * 0.97;
    const win = Math.random() < winChance;

    // Крутим
    const wheel = document.getElementById('upgradeWheel');
    const fullSpins = 5;
    const targetAngle = win
      ? Utils.rand(0, 30) // Попадаем в зелёный сектор (первый)
      : Utils.rand(60, 300); // Не попадаем
    const totalAngle = fullSpins * 360 + targetAngle;
    wheel.style.transform = `rotate(${totalAngle}deg)`;

    document.getElementById('upgradePlay').textContent = 'Крутится...';
    document.getElementById('upgradePlay').disabled = true;

    setTimeout(() => {
      if (win) {
        const winAmount = bet * this.targetMultiplier;
        State.balance += winAmount;
        State.wins++;
        State.gamesPlayed++;
        UI.updateBalance();
        UI.toast(`Победа! +${Utils.fmt(winAmount)} ₽`, 'success');
        this.addHistory('Апгрейд', `×${this.targetMultiplier}`, winAmount, true);
      } else {
        State.loses++;
        State.gamesPlayed++;
        UI.toast(`Не повезло. Минус ${Utils.fmt(bet)} ₽`, 'error');
        this.addHistory('Апгрейд', `×${this.targetMultiplier}`, -bet, false);
      }
      this.active = false;
      document.getElementById('upgradePlay').textContent = 'Крутить';
      document.getElementById('upgradePlay').disabled = false;
      Storage.save();
    }, 4200);
  },
  addHistory(game, detail, amount, win) {
    State.history.unshift({ id: Utils.uid(), game, detail, amount, win, time: Date.now() });
    if (State.history.length > 100) State.history.pop();
  }
};

/* ============================================================
   ИСТОРИЯ
   ============================================================ */
const History = {
  render() {
    const el = document.getElementById('historyList');
    if (!el) return;
    if (State.history.length === 0) {
      el.innerHTML = '<div style="text-align:center;padding:60px 20px;color:var(--text2)">История пуста</div>';
      return;
    }
    el.innerHTML = State.history.map(h => `
      <div class="history-item">
        <div class="h-left">
          <div class="h-game">${h.game}</div>
          <div class="h-info">${h.detail} · ${new Date(h.time).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}</div>
        </div>
        <div class="h-amount ${h.win ? 'win' : 'lose'}">${h.win ? '+' : ''}${Utils.fmt(h.amount)} ₽</div>
      </div>
    `).join('');
  }
};

/* ============================================================
   РОУТЕР ЭКРАНОВ
   ============================================================ */
const Router = {
  openGame(gameId) {
    const screen = document.getElementById('gameScreen');
    const content = document.getElementById('gameContent');
    const title = document.getElementById('gameTitle');

    let game, titleText;
    if (gameId === 'cow') { game = CowGame; titleText = '🐮 Коровка'; }
    else if (gameId === 'rocket') { game = RocketGame; titleText = '🚀 Ракета'; }
    else if (gameId === 'mines') { game = MinesGame; titleText = '💣 Mines'; }
    else if (gameId === 'upgrade') { game = UpgradeGame; titleText = '🎡 Апгрейд'; }

    title.textContent = titleText;
    content.innerHTML = game.render();
    screen.classList.add('open');
    game.init();
  },
  closeGame() {
    document.getElementById('gameScreen').classList.remove('open');
    CowGame.reset();
    RocketGame.reset();
    MinesGame.reset();
  },
  openProfile() {
    UI.updateProfile();
    UI.updateBalance();
    document.getElementById('profileScreen').classList.add('open');
  },
  openHistory() {
    History.render();
    document.getElementById('historyScreen').classList.add('open');
  }
};

/* ============================================================
   ПОПОЛНЕНИЕ
   ============================================================ */
const Topup = {
  handle() {
    const today = new Date().toDateString();
    if (State.lastTopupDate !== today) {
      State.dailyTopups = 0;
      State.dailyTopupAmount = 0;
      State.lastTopupDate = today;
    }
    if (State.dailyTopups >= 3) {
      UI.toast('Лимит пополнений на сегодня исчерпан (3/3)', 'error');
      return;
    }
    if (State.dailyTopupAmount >= 10000) {
      UI.toast('Дневной лимит 10 000 ₽ исчерпан', 'error');
      return;
    }
    const remaining = 10000 - State.dailyTopupAmount;
    const amount = Math.min(1000, remaining);
    UI.modal(
      'Пополнить баланс',
      `Зачислить ${Utils.fmt(amount)} ₽?\nОсталось пополнений сегодня: ${3 - State.dailyTopups}\nОсталось суммы: ${Utils.fmt(remaining)} ₽`,
      () => {
        State.balance += amount;
        State.dailyTopups++;
        State.dailyTopupAmount += amount;
        UI.updateBalance();
        Storage.save();
        UI.toast(`+${Utils.fmt(amount)} ₽ зачислено`, 'success');
      }
    );
  }
};

/* ============================================================
   ИНИЦИАЛИЗАЦИЯ
   ============================================================ */
document.addEventListener('DOMContentLoaded', () => {
  Storage.load();
  UI.updateBalance();
  LiveFeed.init();

  // Кнопки пополнения
  document.getElementById('topupBtn').onclick = () => Topup.handle();
  document.getElementById('promoTopup').onclick = () => Topup.handle();

  // Клик по игре
  document.querySelectorAll('.game-card').forEach(card => {
    card.onclick = () => {
      const game = card.dataset.game;
      if (game === 'rocket' || game === 'cow' || game === 'mines' || game === 'upgrade') {
        Router.openGame(game);
      } else {
        UI.toast('Игра в разработке');
      }
    };
  });

  // Кнопка назад
  document.getElementById('gameBack').onclick = () => Router.closeGame();
  document.getElementById('profileBack').onclick = () => {
    document.getElementById('profileScreen').classList.remove('open');
  };
  document.getElementById('historyBack').onclick = () => {
    document.getElementById('historyScreen').classList.remove('open');
  };

  // Нижний таб-бар
  document.querySelectorAll('.nav-item').forEach(item => {
    item.onclick = () => {
      const page = item.dataset.page;
      document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active'));
      item.classList.add('active');
      if (page === 'main') {
        document.getElementById('mainScreen').style.display = 'block';
      } else if (page === 'profile') {
        Router.openProfile();
      } else if (page === 'history') {
        Router.openHistory();
      } else if (page === 'cases') {
        UI.toast('Кейсы в разработке');
      }
    };
  });
});
</script>
</body>
