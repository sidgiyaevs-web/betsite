<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="OpenBet — live betting simulator with real clubs, realistic odds, and full analytics">
<title>⚡ OpenBet — Live Betting Platform</title>
<style>
/* ==========================================================================
   OPenBet — Design System
   Стек: чистый CSS, две темы, адаптив, анимации
   ========================================================================== */

/* ============ RESET ============ */
*, *::before, *::after {
  margin: 0; padding: 0; box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea {
  font-family: inherit;
  color: inherit;
}
button { cursor: pointer; border: none; background: none; }
a { color: inherit; text-decoration: none; }
ul, ol { list-style: none; }
img, svg { display: block; max-width: 100%; }

/* ============ CSS VARIABLES ============ */
:root {
  /* Dark theme (default) */
  --bg: #07070f;
  --bg2: #0d0d1a;
  --bg3: #12121f;
  --card: rgba(22, 22, 40, 0.72);
  --card-solid: #161628;
  --card-hover: rgba(30, 30, 55, 0.9);
  --card-active: rgba(123, 92, 255, 0.08);
  --border: rgba(90, 90, 140, 0.22);
  --border-2: rgba(110, 110, 170, 0.38);
  --border-focus: rgba(123, 92, 255, 0.6);

  --text: #ffffff;
  --text-2: #b8b8d0;
  --muted: #7a7a95;
  --muted-2: #55557040;

  --accent: #7b5cff;
  --accent-2: #00d4ff;
  --accent-glow: rgba(123, 92, 255, 0.4);
  --accent-glow-2: rgba(0, 212, 255, 0.35);

  --green: #00e676;
  --green-glow: rgba(0, 230, 118, 0.4);
  --red: #ff3860;
  --red-glow: rgba(255, 56, 96, 0.4);
  --gold: #ffb800;
  --gold-glow: rgba(255, 184, 0, 0.35);
  --orange: #ff9500;

  --shadow-xs: 0 1px 3px rgba(0,0,0,.3);
  --shadow-sm: 0 2px 8px rgba(0,0,0,.35);
  --shadow-md: 0 6px 24px rgba(0,0,0,.4);
  --shadow-lg: 0 12px 48px rgba(0,0,0,.55);
  --shadow-xl: 0 24px 64px rgba(0,0,0,.65);
  --shadow-inner: inset 0 1px 0 rgba(255,255,255,.05);

  --radius-xs: 4px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-full: 9999px;

  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, 'Helvetica Neue', sans-serif;
  --font-mono: 'SF Mono', 'Fira Code', 'JetBrains Mono', Consolas, monospace;

  --transition-fast: .12s ease;
  --transition-base: .2s ease;
  --transition-slow: .35s cubic-bezier(.4, 0, .2, 1);
  --transition-bounce: .3s cubic-bezier(.5, 1.5, .5, 1);

  --header-height: 62px;
  --max-width: 1440px;
}

/* ============ LIGHT THEME ============ */
body.light {
  --bg: #f4f5fa;
  --bg2: #eceef5;
  --bg3: #e4e6f0;
  --card: rgba(255, 255, 255, 0.85);
  --card-solid: #ffffff;
  --card-hover: rgba(245, 246, 250, 0.95);
  --card-active: rgba(123, 92, 255, 0.06);
  --border: rgba(90, 90, 140, 0.15);
  --border-2: rgba(90, 90, 140, 0.28);
  --text: #0e0e1c;
  --text-2: #2a2a3c;
  --muted: #6a6a80;
  --muted-2: #a0a0b040;

  --shadow-xs: 0 1px 3px rgba(0,0,0,.06);
  --shadow-sm: 0 2px 8px rgba(0,0,0,.08);
  --shadow-md: 0 6px 24px rgba(0,0,0,.10);
  --shadow-lg: 0 12px 48px rgba(0,0,0,.14);
  --shadow-xl: 0 24px 64px rgba(0,0,0,.18);
}

/* ============ BASE ============ */
html { scroll-behavior: smooth; }

body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  min-height: 100dvh;
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
  transition: background var(--transition-slow), color var(--transition-slow);
}

body.has-coupon { padding-bottom: 130px; }

/* Background gradient */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 60% 40% at 15% -10%, rgba(123, 92, 255, 0.22), transparent 60%),
    radial-gradient(ellipse 50% 40% at 85% 110%, rgba(0, 212, 255, 0.14), transparent 60%),
    radial-gradient(ellipse 40% 30% at 50% 50%, rgba(123, 92, 255, 0.04), transparent 70%);
  pointer-events: none;
  z-index: 0;
  transition: opacity var(--transition-slow);
}
body.light::before { opacity: .6; }

/* Custom scrollbar */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--border-2);
  border-radius: 4px;
  border: 2px solid transparent;
  background-clip: padding-box;
}
::-webkit-scrollbar-thumb:hover { background: var(--accent); background-clip: padding-box; }

/* Selection */
::selection { background: var(--accent); color: white; }

/* ============ HEADER ============ */
.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(7, 7, 15, 0.82);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 1px solid var(--border);
  padding: 10px 20px;
  transition: background var(--transition-slow);
}
body.light .header { background: rgba(255, 255, 255, 0.82); }

.header-inner {
  max-width: var(--max-width);
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.logo {
  font-size: 20px;
  font-weight: 900;
  letter-spacing: -0.4px;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  user-select: none;
}
.logo-mark {
  width: 28px; height: 28px;
  border-radius: var(--radius-sm);
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  box-shadow: 0 4px 12px var(--accent-glow);
  transition: transform var(--transition-base);
}
.logo:hover .logo-mark { transform: rotate(-10deg) scale(1.05); }
.logo-text span {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

.nav {
  display: flex;
  gap: 2px;
  overflow-x: auto;
  scrollbar-width: none;
  -ms-overflow-style: none;
}
.nav::-webkit-scrollbar { display: none; }
.nav-btn {
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  color: var(--muted);
  font-weight: 700;
  font-size: 12.5px;
  white-space: nowrap;
  transition: color var(--transition-fast), background var(--transition-fast);
  display: flex; align-items: center; gap: 5px;
  position: relative;
}
.nav-btn:hover { color: var(--text); background: var(--card); }
.nav-btn.active {
  color: var(--text);
  background: var(--card);
  box-shadow: var(--shadow-inner);
}
.nav-btn.active::after {
  content: '';
  position: absolute;
  bottom: -10px; left: 20%; right: 20%;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
}

.header-right {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: nowrap;
}

.balance {
  background: var(--card);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  padding: 8px 14px;
  border-radius: var(--radius-md);
  font-weight: 800;
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 6px;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
  user-select: none;
  transition:
    box-shadow var(--transition-slow),
    border-color var(--transition-slow),
    transform var(--transition-fast);
  white-space: nowrap;
  position: relative;
  overflow: hidden;
}
.balance::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, transparent, rgba(123, 92, 255, 0.08), transparent);
  opacity: 0;
  transition: opacity var(--transition-base);
}
.balance:hover {
  border-color: var(--accent);
  transform: translateY(-1px);
  box-shadow: 0 4px 16px var(--accent-glow);
}
.balance:hover::before { opacity: 1; }
.balance:active { transform: translateY(0); }
.balance.flash-bonus {
  animation: balanceBonus 1s ease;
  border-color: var(--gold);
  box-shadow: 0 0 32px var(--gold-glow);
}
.balance.flash-win {
  animation: balanceWin 0.8s ease;
  border-color: var(--green);
  box-shadow: 0 0 24px var(--green-glow);
}
.balance.flash-lose {
  animation: balanceLose 0.8s ease;
  border-color: var(--red);
  box-shadow: 0 0 24px var(--red-glow);
}
.balance .coin { font-size: 14px; filter: drop-shadow(0 0 6px var(--gold-glow)); }
.balance .label-small { font-size: 10px; color: var(--muted); font-weight: 600; }

@keyframes balanceBonus {
  0%, 100% { transform: scale(1); }
  30% { transform: scale(1.08); }
}
@keyframes balanceWin {
  0%, 100% { transform: scale(1); }
  30% { transform: scale(1.05); }
}
@keyframes balanceLose {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-4px); }
  75% { transform: translateX(4px); }
}

.icon-btn {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-md);
  background: var(--card);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  transition:
    border-color var(--transition-fast),
    background var(--transition-fast),
    transform var(--transition-fast);
  position: relative;
}
.icon-btn:hover {
  border-color: var(--accent);
  background: var(--card-hover);
  transform: translateY(-1px);
}
.icon-btn:active { transform: translateY(0) scale(.96); }
.icon-btn.muted { opacity: .45; }
.icon-btn .notif-dot {
  position: absolute;
  top: 6px; right: 6px;
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--red);
  box-shadow: 0 0 8px var(--red-glow);
  animation: dotPulse 1.5s infinite;
}
@keyframes dotPulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.3); opacity: .7; }
}

/* ============ CONTAINER ============ */
.container {
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 18px 20px 40px;
  position: relative;
  z-index: 1;
}

/* ============ SESSION BAR ============ */
.session-bar {
  display: flex;
  gap: 18px;
  align-items: center;
  padding: 11px 16px;
  background: var(--card);
  backdrop-filter: blur(14px);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  margin-bottom: 14px;
  font-size: 12.5px;
  flex-wrap: wrap;
  box-shadow: var(--shadow-sm);
}
.session-bar .label { color: var(--muted); font-weight: 600; }
.session-bar .value { font-weight: 800; font-variant-numeric: tabular-nums; }
.session-bar .value.green { color: var(--green); }
.session-bar .value.red { color: var(--red); }
.session-bar .value.gold { color: var(--gold); }
.session-bar .spacer { margin-left: auto; }
.session-bar .bonus-hint {
  font-size: 11.5px;
  color: var(--gold);
  font-weight: 700;
  animation: bonusPulse 2s infinite;
}
@keyframes bonusPulse {
  0%, 100% { opacity: 1; }
  50% { opacity: .55; }
}

/* ============ LIVE DROPS ============ */
.live-drops {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 8px;
  margin-bottom: 14px;
  scrollbar-width: thin;
}
.live-drops::-webkit-scrollbar { height: 3px; }
.live-drops:empty { display: none; }

.drop {
  min-width: 175px;
  background: var(--card);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 9px 12px;
  font-size: 11.5px;
  animation: dropSlideIn var(--transition-bounce);
  position: relative;
  overflow: hidden;
}
.drop::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 2px;
  background: var(--green);
}
@keyframes dropSlideIn {
  from { opacity: 0; transform: translateX(30px) scale(.9); }
  to { opacity: 1; transform: translateX(0) scale(1); }
}
.drop-match {
  font-weight: 700;
  margin-bottom: 4px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 10.5px;
  color: var(--muted);
}
.drop-event { color: var(--green); font-size: 11.5px; font-weight: 700; }

/* ============ SEARCH ROW ============ */
.search-row {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
  flex-wrap: wrap;
  align-items: center;
}

.search-input {
  flex: 1;
  min-width: 180px;
  background: var(--card);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  padding: 10px 14px;
  border-radius: var(--radius-md);
  font-size: 13px;
  transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
}
.search-input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--card-active);
}
.search-input::placeholder { color: var(--muted); }

.filter {
  padding: 8px 14px;
  background: var(--card);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-weight: 700;
  color: var(--muted);
  font-size: 12px;
  white-space: nowrap;
  transition:
    color var(--transition-fast),
    border-color var(--transition-fast),
    background var(--transition-fast),
    transform var(--transition-fast);
  display: flex;
  align-items: center;
  gap: 5px;
}
.filter:hover { color: var(--text); transform: translateY(-1px); }
.filter:active { transform: translateY(0); }
.filter.active {
  color: var(--text);
  border-color: var(--accent);
  background: var(--card-active);
}
.filter.star.active {
  background: rgba(255, 184, 0, 0.12);
  border-color: var(--gold);
  color: var(--gold);
}
.filter.toggle.active {
  background: rgba(0, 230, 118, 0.1);
  border-color: var(--green);
  color: var(--green);
}

.filters-row {
  display: flex;
  gap: 6px;
  margin-bottom: 12px;
  flex-wrap: wrap;
  align-items: center;
}
.filters-row .label {
  font-size: 10.5px;
  color: var(--muted);
  text-transform: uppercase;
  font-weight: 700;
  letter-spacing: 0.5px;
  margin-right: 4px;
}

/* ============ MATCH CARD ============ */
.match {
  background: var(--card);
  backdrop-filter: blur(16px) saturate(180%);
  -webkit-backdrop-filter: blur(16px) saturate(180%);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 14px;
  margin-bottom: 10px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px;
  align-items: center;
  box-shadow: var(--shadow-sm);
  transition:
    border-color var(--transition-fast),
    transform var(--transition-fast),
    box-shadow var(--transition-fast);
  position: relative;
}
.match:hover {
  border-color: var(--border-2);
  box-shadow: var(--shadow-md);
}
.match.finished { opacity: 0.6; }
.match.highlight { animation: matchHighlight 2s ease; }
@keyframes matchHighlight {
  0%, 100% { box-shadow: var(--shadow-sm); }
  50% { box-shadow: 0 0 0 2px var(--accent), var(--shadow-lg); }
}

.match-info { min-width: 0; }

.match-top {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}
.match-league {
  font-size: 10.5px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-weight: 700;
}
.sport-icon { font-size: 14px; }

.badge {
  font-size: 9.5px;
  padding: 3px 8px;
  border-radius: var(--radius-xs);
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.badge.live {
  background: var(--red);
  color: white;
  box-shadow: 0 0 10px var(--red-glow);
}
.badge.live::before {
  content: '';
  width: 5px; height: 5px;
  border-radius: 50%;
  background: white;
  animation: liveDot 1.2s infinite;
}
@keyframes liveDot {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}
.badge.finished { background: rgba(100, 100, 120, 0.3); color: #aaa; }
.badge.prematch { background: var(--accent); color: white; }
.badge.break { background: var(--gold); color: #000; }
.badge.countdown { background: var(--accent-2); color: #000; }

.star-btn {
  margin-left: auto;
  font-size: 17px;
  padding: 4px;
  color: #444;
  transition: color var(--transition-fast), transform var(--transition-fast);
}
.star-btn:hover { transform: scale(1.2); }
.star-btn.active { color: var(--gold); filter: drop-shadow(0 0 6px var(--gold-glow)); }

/* ============ TEAMS ROW ============ */
.teams-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}
.team {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 700;
  font-size: 13.5px;
}

.team-avatar {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: 10px;
  color: white;
  flex-shrink: 0;
  border: 2px solid rgba(255, 255, 255, 0.12);
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
  transition: transform var(--transition-base), box-shadow var(--transition-base);
}
.team-avatar.scored { animation: avatarScored 1.2s ease; }
@keyframes avatarScored {
  0% { transform: scale(1); box-shadow: 0 0 0 0 var(--green); }
  40% { transform: scale(1.4); box-shadow: 0 0 24px var(--green); }
  100% { transform: scale(1); box-shadow: 0 2px 6px rgba(0,0,0,.3); }
}

.team-name { white-space: nowrap; }

.team-score {
  color: var(--green);
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  font-size: 16px;
  padding: 0 6px;
  letter-spacing: -0.5px;
  transition: transform var(--transition-base), color var(--transition-base);
}
.team-score.scored { animation: scoreFlash 1.2s ease; }
@keyframes scoreFlash {
  0% { transform: scale(1); }
  30% { transform: scale(1.5); color: var(--green); text-shadow: 0 0 20px var(--green); }
  100% { transform: scale(1); }
}

.time-info {
  font-size: 11px;
  color: var(--muted);
  font-weight: 600;
}

/* ============ PERIOD PROGRESS ============ */
.period-progress {
  display: flex;
  gap: 4px;
  margin: 8px 0 6px;
  height: 4px;
}
.period-seg {
  flex: 1;
  background: rgba(120, 120, 160, 0.2);
  border-radius: 2px;
  position: relative;
  overflow: hidden;
}
.period-seg.done { background: var(--green); }
.period-seg.active { background: rgba(123, 92, 255, 0.28); }
.period-seg.active::after {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: var(--p, 0%);
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  border-radius: 2px;
  transition: width 1s linear;
}

/* ============ STATS BAR ============ */
.stats-bar {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin: 8px 0 4px;
  padding: 7px 10px;
  background: rgba(0, 0, 0, 0.15);
  border-radius: var(--radius-sm);
  font-size: 10.5px;
}
body.light .stats-bar { background: rgba(0, 0, 0, 0.04); }
.stat-item { display: flex; align-items: center; gap: 4px; color: var(--muted); }
.stat-item b { color: var(--text); font-weight: 700; font-variant-numeric: tabular-nums; }

/* ============ UFC FINAL ============ */
.ufc-final {
  display: flex;
  gap: 10px;
  align-items: center;
  margin: 10px 0 4px;
  padding: 10px 12px;
  background: linear-gradient(135deg, rgba(255, 184, 0, 0.18), rgba(255, 56, 96, 0.08));
  border: 1px solid rgba(255, 184, 0, 0.45);
  border-radius: var(--radius-md);
  font-size: 12px;
  font-weight: 700;
  box-shadow: 0 0 20px rgba(255, 184, 0, 0.15);
}
.ufc-final-icon { font-size: 22px; }
.ufc-final-text { flex: 1; line-height: 1.5; }
.ufc-final-text b { color: var(--gold); }
.ufc-final-sub { color: var(--muted); font-weight: 600; font-size: 11px; }

/* ============ ODDS ============ */
.odds { display: flex; gap: 6px; }

.odds-btn {
  width: 90px;
  background: rgba(15, 15, 30, 0.7);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 9px 6px;
  text-align: center;
  transition:
    border-color var(--transition-fast),
    background var(--transition-fast),
    transform var(--transition-fast);
  font-variant-numeric: tabular-nums;
  overflow: hidden;
  position: relative;
}
body.light .odds-btn { background: rgba(245, 246, 250, 0.9); }
.odds-btn:hover:not(:disabled):not(.disabled) {
  border-color: var(--accent);
  background: var(--card-hover);
  transform: translateY(-1px);
}
.odds-btn:active:not(:disabled):not(.disabled) { transform: translateY(0) scale(0.97); }
.odds-btn:disabled,
.odds-btn.disabled { opacity: 0.35; cursor: not-allowed; }

.odds-btn.up { border-color: rgba(0, 230, 118, 0.4); }
.odds-btn.down { border-color: rgba(255, 56, 96, 0.4); }

.odds-label {
  font-size: 10.5px;
  color: var(--muted);
  margin-bottom: 2px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
}
.odds-arrow { font-size: 9px; }
.odds-arrow.up { color: var(--green); }
.odds-arrow.down { color: var(--red); }

.odds-value {
  font-size: 15px;
  font-weight: 800;
  color: var(--accent-2);
  transition: color var(--transition-fast);
}
.odds-btn.up .odds-value { color: var(--green); }
.odds-btn.down .odds-value { color: var(--red); }

/* ============ EXTRAS ============ */
.extras {
  grid-column: 1 / -1;
  margin-top: 6px;
  border-top: 1px solid var(--border);
  padding-top: 8px;
}
.extras-toggle {
  color: var(--accent-2);
  font-size: 11.5px;
  font-weight: 700;
  padding: 4px 0;
  transition: color var(--transition-fast);
  display: flex;
  align-items: center;
  gap: 5px;
}
.extras-toggle:hover { color: var(--text); }
.extras-toggle.open { color: var(--muted); }

.extras-grid {
  display: none;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 6px;
  margin-top: 10px;
}
.extras-grid.open { display: grid; }

.odds-mini {
  background: rgba(15, 15, 30, 0.7);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 7px 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  min-width: 0;
  overflow: hidden;
  transition:
    border-color var(--transition-fast),
    background var(--transition-fast),
    transform var(--transition-fast);
}
body.light .odds-mini { background: rgba(245, 246, 250, 0.9); }
.odds-mini:hover:not(.disabled) {
  border-color: var(--accent);
  background: var(--card-hover);
  transform: translateY(-1px);
}
.odds-mini:active:not(.disabled) { transform: translateY(0) scale(0.98); }
.odds-mini.disabled { opacity: 0.35; cursor: not-allowed; }

.odds-mini-label {
  font-size: 11px;
  color: var(--muted);
  text-align: left;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.odds-mini-value {
  font-size: 12.5px;
  font-weight: 800;
  color: var(--accent-2);
  white-space: nowrap;
}

/* ============ HISTORY ============ */
.history-filters {
  display: flex;
  gap: 6px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}

.history-item {
  background: var(--card);
  backdrop-filter: blur(14px);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 12px 14px;
  margin-bottom: 8px;
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 12px;
  align-items: center;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition:
    border-color var(--transition-fast),
    transform var(--transition-fast);
}
.history-item:hover { border-color: var(--border-2); transform: translateX(2px); }
.history-item.won { border-left: 3px solid var(--green); }
.history-item.lost { border-left: 3px solid var(--red); }
.history-item.pending { border-left: 3px solid var(--gold); }

.history-main { min-width: 0; }
.history-match {
  font-weight: 700;
  font-size: 12.5px;
  margin-bottom: 3px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.history-meta { font-size: 10.5px; color: var(--muted); }

.history-stake { text-align: right; }
.history-stake .amount {
  font-weight: 800;
  font-size: 13px;
  font-variant-numeric: tabular-nums;
}

.history-status {
  font-weight: 800;
  padding: 4px 10px;
  border-radius: var(--radius-xs);
  text-transform: uppercase;
  letter-spacing: 0.4px;
  font-size: 9.5px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.history-status.won { background: rgba(0, 230, 118, 0.15); color: var(--green); }
.history-status.lost { background: rgba(255, 56, 96, 0.15); color: var(--red); }
.history-status.pending { background: rgba(255, 184, 0, 0.15); color: var(--gold); }

.cashout-row {
  grid-column: 1 / -1;
  display: flex;
  gap: 8px;
  align-items: center;
  padding-top: 8px;
  border-top: 1px solid var(--border);
  margin-top: 4px;
  flex-wrap: wrap;
}
.cashout-btn {
  background: linear-gradient(135deg, var(--green), #00b050);
  color: #000;
  padding: 7px 14px;
  border-radius: var(--radius-sm);
  font-weight: 800;
  font-size: 11px;
  transition: transform var(--transition-fast), box-shadow var(--transition-fast);
  display: flex;
  align-items: center;
  gap: 5px;
}
.cashout-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 14px var(--green-glow);
}
.cashout-btn:active { transform: translateY(0); }
.cashout-info { font-size: 11px; color: var(--muted); }
.cashout-info b { color: var(--gold); }

/* ============ STATS ============ */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(165px, 1fr));
  gap: 10px;
  margin-bottom: 20px;
}
.stat {
  background: var(--card);
  backdrop-filter: blur(14px);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  box-shadow: var(--shadow-sm);
  transition: border-color var(--transition-fast), transform var(--transition-fast);
}
.stat:hover { border-color: var(--border-2); transform: translateY(-2px); }
.stat-label {
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}
.stat-value {
  font-size: 20px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.5px;
}
.stat-value.green { color: var(--green); }
.stat-value.red { color: var(--red); }
.stat-value.gold { color: var(--gold); }

/* ============ CHART ============ */
.chart-container {
  background: var(--card);
  backdrop-filter: blur(14px);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 16px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
}
.chart-title {
  font-size: 11.5px;
  color: var(--muted);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.chart-canvas { width: 100%; height: 180px; display: block; }

/* ============ ACHIEVEMENTS ============ */
.achievements-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
  gap: 10px;
  margin-bottom: 20px;
}
.achievement {
  background: var(--card);
  backdrop-filter: blur(14px);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 14px 10px;
  text-align: center;
  opacity: 0.4;
  transition:
    opacity var(--transition-base),
    border-color var(--transition-base),
    box-shadow var(--transition-base),
    transform var(--transition-base);
}
.achievement.unlocked {
  opacity: 1;
  border-color: var(--gold);
  box-shadow: 0 0 24px var(--gold-glow);
}
.achievement.unlocked:hover { transform: translateY(-3px) scale(1.03); }
.achievement-icon { font-size: 30px; margin-bottom: 8px; display: block; }
.achievement-name {
  font-size: 10.5px;
  font-weight: 700;
  margin-bottom: 3px;
  display: block;
}
.achievement-desc { font-size: 9.5px; color: var(--muted); display: block; }

/* ============ LEADERBOARD ============ */
.leaderboard {
  background: var(--card);
  backdrop-filter: blur(14px);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 16px;
  box-shadow: var(--shadow-sm);
}
.lb-header {
  color: var(--muted);
  font-size: 12px;
  margin-bottom: 14px;
  font-weight: 600;
}
.lb-header b { color: var(--gold); font-weight: 800; }

.lb-row {
  display: grid;
  grid-template-columns: 44px 1fr auto;
  gap: 12px;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
  font-size: 12.5px;
}
.lb-row:last-child { border-bottom: none; }
.lb-row.me {
  background: rgba(123, 92, 255, 0.12);
  margin: 0 -16px;
  padding: 10px 16px;
  border-radius: var(--radius-sm);
  border-bottom: none;
}
.lb-rank {
  font-weight: 900;
  font-size: 15px;
  color: var(--muted);
  text-align: center;
}
.lb-rank.top1 { color: var(--gold); text-shadow: 0 0 12px var(--gold-glow); }
.lb-rank.top2 { color: #c0c0c0; }
.lb-rank.top3 { color: #cd7f32; }
.lb-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb-name.me { color: var(--accent-2); }
.lb-value {
  font-weight: 800;
  color: var(--green);
  font-variant-numeric: tabular-nums;
  font-size: 12.5px;
}

/* ============ MODAL ============ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.75);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 16px;
  animation: fadeIn .18s ease;
}
@keyframes fadeIn { from { opacity: 0; } }
.modal-overlay.active { display: flex; }

.modal {
  background: linear-gradient(180deg, var(--card-solid), var(--bg3));
  border: 1px solid var(--border-2);
  border-radius: var(--radius-xl);
  padding: 24px;
  max-width: 460px;
  width: 100%;
  box-shadow: var(--shadow-xl);
  animation: modalPop var(--transition-bounce);
  max-height: 90vh;
  overflow-y: auto;
}
body.light .modal { background: linear-gradient(180deg, #fff, #f5f6fa); }
@keyframes modalPop {
  from { transform: scale(0.92) translateY(20px); opacity: 0; }
  to { transform: scale(1) translateY(0); opacity: 1; }
}

.modal h3 {
  font-size: 17px;
  margin-bottom: 6px;
  letter-spacing: -0.3px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.modal .sub {
  color: var(--muted);
  font-size: 12.5px;
  margin-bottom: 18px;
  line-height: 1.5;
}
.modal .row {
  display: flex;
  justify-content: space-between;
  padding: 9px 0;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.modal .row:last-of-type { border-bottom: none; }
.modal .row .label { color: var(--muted); }
.modal .row .value { font-weight: 700; font-variant-numeric: tabular-nums; }

.modal input[type="number"],
.modal input[type="text"] {
  width: 100%;
  background: rgba(15, 15, 30, 0.7);
  border: 1px solid var(--border);
  padding: 12px 14px;
  border-radius: var(--radius-md);
  font-size: 15px;
  margin: 14px 0 10px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
}
body.light .modal input { background: rgba(245, 246, 250, 0.9); }
.modal input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--card-active);
}

.quick-stakes {
  display: flex;
  gap: 6px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.quick-stake {
  flex: 1;
  min-width: 54px;
  padding: 8px 4px;
  background: rgba(15, 15, 30, 0.7);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 11.5px;
  font-weight: 700;
  transition: border-color var(--transition-fast), background var(--transition-fast);
}
body.light .quick-stake { background: rgba(245, 246, 250, 0.9); }
.quick-stake:hover {
  border-color: var(--accent);
  background: var(--card-hover);
}

.modal-actions {
  display: flex;
  gap: 8px;
  margin-top: 16px;
}
.btn {
  flex: 1;
  padding: 12px;
  border-radius: var(--radius-md);
  font-weight: 800;
  font-size: 13px;
  transition: transform var(--transition-fast), box-shadow var(--transition-fast);
}
.btn:active:not(:disabled) { transform: scale(0.98); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

.btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: white;
  box-shadow: 0 4px 16px var(--accent-glow);
}
.btn-primary:hover:not(:disabled) {
  box-shadow: 0 6px 22px var(--accent-glow);
  transform: translateY(-1px);
}
.btn-secondary {
  background: rgba(15, 15, 30, 0.7);
  border: 1px solid var(--border);
  color: var(--text);
}
body.light .btn-secondary { background: rgba(245, 246, 250, 0.9); }
.btn-secondary:hover { border-color: var(--accent); }

.btn-coupon {
  background: rgba(123, 92, 255, 0.12);
  border: 1px solid var(--accent);
  color: var(--accent-2);
}
.btn-builder {
  background: rgba(255, 184, 0, 0.12);
  border: 1px solid var(--gold);
  color: var(--gold);
}

/* ============ COUPON BAR ============ */
.coupon-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: linear-gradient(180deg, var(--card-solid), var(--bg3));
  backdrop-filter: blur(20px);
  border-top: 2px solid var(--accent);
  padding: 12px 16px;
  transform: translateY(100%);
  transition: transform var(--transition-slow);
  z-index: 200;
  box-shadow: 0 -12px 48px rgba(0, 0, 0, 0.6);
}
body.light .coupon-bar { background: linear-gradient(180deg, #fff, #f5f6fa); }
.coupon-bar.active { transform: translateY(0); }

.coupon-inner { max-width: var(--max-width); margin: 0 auto; }
.coupon-items {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 8px;
  margin-bottom: 8px;
}
.coupon-items::-webkit-scrollbar { height: 4px; }
.coupon-item {
  background: rgba(15, 15, 30, 0.7);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 8px 10px;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 190px;
  font-size: 11.5px;
}
body.light .coupon-item { background: rgba(245, 246, 250, 0.9); }
.coupon-item-info { flex: 1; min-width: 0; }
.coupon-item-match {
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 11.5px;
}
.coupon-item-pick { color: var(--accent-2); font-weight: 700; font-size: 10.5px; }
.coupon-item-remove {
  color: var(--red);
  font-size: 18px;
  padding: 0 4px;
  line-height: 1;
  transition: transform var(--transition-fast);
}
.coupon-item-remove:hover { transform: scale(1.2); }

.coupon-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  align-items: center;
}
.coupon-clear {
  border: 1px solid var(--border);
  color: var(--muted);
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  font-weight: 700;
  font-size: 12px;
  transition: border-color var(--transition-fast), color var(--transition-fast);
}
.coupon-clear:hover { border-color: var(--red); color: var(--red); }

.coupon-place {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: white;
  padding: 9px 18px;
  border-radius: var(--radius-sm);
  font-weight: 800;
  font-size: 12px;
  box-shadow: 0 4px 16px var(--accent-glow);
  transition: transform var(--transition-fast), box-shadow var(--transition-fast);
}
.coupon-place:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 22px var(--accent-glow);
}

/* ============ EMPTY STATE ============ */
.empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--muted);
}
.empty .icon {
  font-size: 48px;
  margin-bottom: 12px;
  opacity: 0.6;
}
.empty .text { font-size: 13.5px; font-weight: 600; }

/* ============ SKELETON ============ */
.skeleton {
  background: linear-gradient(
    90deg,
    var(--card) 25%,
    var(--card-hover) 50%,
    var(--card) 75%
  );
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
  border-radius: var(--radius-lg);
}
@keyframes shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
.skeleton-match {
  height: 130px;
  margin-bottom: 10px;
}

/* ============ TABS ============ */
.tab-content {
  display: none;
  animation: fadeSlide 0.25s ease;
}
.tab-content.active { display: block; }
@keyframes fadeSlide {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ============ MULTI-VIEW ============ */
.multi-view {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 10px;
  min-height: 70vh;
}
.multi-view .match {
  margin-bottom: 0;
  grid-template-columns: 1fr;
  overflow-y: auto;
  max-height: 45vh;
}
.multi-view .odds {
  flex-wrap: wrap;
  justify-content: stretch;
}
.multi-view .odds-btn { flex: 1; min-width: 0; width: auto; }

/* ============ AI COMMENTATOR PANEL ============ */
.ai-panel {
  background: linear-gradient(135deg, rgba(123, 92, 255, 0.1), rgba(0, 212, 255, 0.06));
  border: 1px solid var(--border-2);
  border-radius: var(--radius-md);
  padding: 12px 14px;
  margin: 8px 0 4px;
  font-size: 12px;
  line-height: 1.5;
  position: relative;
  overflow: hidden;
}
.ai-panel::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: linear-gradient(180deg, var(--accent), var(--accent-2));
}
.ai-panel-header {
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: 800;
  font-size: 11px;
  color: var(--accent-2);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}
.ai-panel-body {
  color: var(--text-2);
}
.ai-panel-body b { color: var(--text); }

/* ============ HEATMAP ============ */
.heatmap {
  display: flex;
  height: 20px;
  border-radius: var(--radius-sm);
  overflow: hidden;
  margin: 8px 0 4px;
  border: 1px solid var(--border);
}
.heatmap-seg {
  flex: 1;
  transition: flex var(--transition-slow);
  position: relative;
}
.heatmap-seg.home { background: linear-gradient(90deg, var(--accent), rgba(123, 92, 255, 0.4)); }
.heatmap-seg.draw { background: linear-gradient(90deg, rgba(255, 184, 0, 0.3), rgba(255, 184, 0, 0.6)); }
.heatmap-seg.away { background: linear-gradient(90deg, rgba(0, 212, 255, 0.4), var(--accent-2)); }
.heatmap-legend {
  display: flex;
  gap: 12px;
  font-size: 10px;
  color: var(--muted);
  margin-bottom: 4px;
}
.heatmap-legend span {
  display: flex;
  align-items: center;
  gap: 4px;
}
.heatmap-legend i {
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 2px;
  font-style: normal;
}

/* ============ VALUE DETECTOR ============ */
.value-badge {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 9.5px;
  padding: 2px 6px;
  border-radius: var(--radius-xs);
  font-weight: 800;
  letter-spacing: 0.3px;
  background: rgba(0, 230, 118, 0.15);
  color: var(--green);
}
.value-badge.hot {
  background: rgba(255, 56, 96, 0.15);
  color: var(--red);
  animation: valuePulse 1.5s infinite;
}
@keyframes valuePulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

/* ============ XG GRAPH ============ */
.xg-graph {
  height: 40px;
  margin: 6px 0 4px;
  position: relative;
  background: rgba(0, 0, 0, 0.15);
  border-radius: var(--radius-sm);
  overflow: hidden;
}
body.light .xg-graph { background: rgba(0, 0, 0, 0.04); }
.xg-bar {
  position: absolute;
  bottom: 0;
  width: 6px;
  border-radius: 2px 2px 0 0;
  transition: height 0.5s ease;
}
.xg-bar.home {
  left: 50%;
  margin-left: -8px;

  if (k < 0) return 0;
  if (lambda <= 0) return k === 0 ? 1 : 0;
  if (k > 25) return 0;
  let logFact = 0;
  for (let i = 2; i <= k; i++) logFact += Math.log(i);
  return Math.exp(k * Math.log(lambda) - lambda - logFact);
}

  if (!soundOn) return;
  try {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audio.createOscillator();
    const gain = audio.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume, audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + duration);
    osc.connect(gain); gain.connect(audio.destination);
    osc.start(); osc.stop(audio.currentTime + duration);
  } catch (e) {}
}

function loadMatches() {

    if (!saved) return null;
    const data = JSON.parse(saved);
    const arr = data.matches || data;
    if (!arr || !arr.length) return null;
    const savedAt = data.savedTimestamp || arr[0].savedAt || 0;
    const elapsed = Math.floor((Date.now() - savedAt) / 1000);
    const restored = arr.map(m => {
      if (m.status === 'finished' || m.status === 'countdown') return m;
      if (m.status === 'prematch') {
        const newStartsIn = m.startsIn - elapsed;

/* ============ КОЭФФИЦИЕНТЫ ============ */
function expectedGoalsRemaining(m) {
  const remaining = Math.max(0, m.maxMinute - m.minute);
  const isFootball = m.sport === 'football';
  let intensity;
  if (isFootball) {
    if (m.minute < 15) intensity = 0.65;
    else if (m.minute < 30) intensity = 0.95;
    else if (m.minute < 45) intensity = 1.15;
    else if (m.minute < 60) intensity = 0.85;
    else if (m.minute < 75) intensity = 1.10;
    else intensity = 1.45;
  } else {
    if (m.minute < 20) intensity = 0.9;
    else if (m.minute < 40) intensity = 1.05;
    else intensity = 1.2;
  }
  const homeRate = (m.homeAttack / m.maxMinute) * intensity;
  const awayRate = (m.awayAttack / m.maxMinute) * intensity;
  return {
    lambdaHome: Math.max(0, homeRate * remaining * (1 + m.momentum * 0.25)),
    lambdaAway: Math.max(0, awayRate * remaining * (1 - m.momentum * 0.25)),
  };
}

function computeOdds(m) {
  if (m.status === 'finished' || m.status === 'countdown') {
    return { home: null, draw: null, away: null };
  }

  if (m.sport === 'ufc') {
    const diff = m.homeRating - m.awayRating;
    let pHome = 1 / (1 + Math.pow(10, -diff / 400));
    const progress = m.minute / m.maxMinute;
    pHome = 0.5 + (pHome - 0.5) * (1 - progress * 0.85);
    pHome = clamp(pHome, 0.03, 0.97);
    const oH = toOdds(pHome, 0.05);
    const oA = toOdds(1 - pHome, 0.05);
    return {
      home: isOddValid(oH) ? oH : null,
      away: isOddValid(oA) ? oA : null,
      draw: null,
    };
  }

  const { lambdaHome, lambdaAway } = expectedGoalsRemaining(m);
  let pHome = 0, pDraw = 0, pAway = 0;
  for (let h = 0; h <= 12; h++) {
    for (let a = 0; a <= 12; a++) {
      const p = poisson(h, lambdaHome) * poisson(a, lambdaAway);
      const fh = m.scoreHome + h;
      const fa = m.scoreAway + a;
      if (fh > fa) pHome += p;
      else if (fh === fa) pDraw += p;
      else pAway += p;
    }
  }
  const total = pHome + pDraw + pAway || 1;
  pHome /= total; pDraw /= total; pAway /= total;

  // Хоккей — 3 исхода (как в реальных БК с учётом ничьей в основное время)
  const oH = toOdds(pHome, 0.05);
  const oD = toOdds(pDraw, 0.05);
  const oA = toOdds(pAway, 0.05);
  return {
    home: isOddValid(oH) ? oH : null,
    draw: isOddValid(oD) ? oD : null,
    away: isOddValid(oA) ? oA : null,
  };
}

function computeExtraMarkets(m) {
  if (m.status === 'finished' || m.status === 'countdown') return {};

  // UFC
  if (m.sport === 'ufc') {
    const diff = m.homeRating - m.awayRating;
    let pHome = 1 / (1 + Math.pow(10, -diff / 400));
    const progress = m.minute / m.maxMinute;
    pHome = 0.5 + (pHome - 0.5) * (1 - progress * 0.85);
    pHome = clamp(pHome, 0.03, 0.97);
    const pAway = 1 - pHome;

    const round = m.round;
    let pFinish;
    if (round === 1) pFinish = 0.55;
    else if (round === 2) pFinish = 0.45;
    else if (round === 3) pFinish = 0.32;
    else if (round === 4) pFinish = 0.22;
    else pFinish = 0.12;
    if (m.minute >= m.maxMinute - 3) pFinish *= 0.5;

    const pKO = pFinish * 0.62;
    const pSub = pFinish * 0.32;
    const pDec = 1 - pFinish;

    const raw = {};
    raw['Метод · KO/TKO'] = toOdds(pKO, 0.06);
    raw['Метод · Сабмишн'] = toOdds(pSub, 0.06);
    raw['Метод · Решение'] = toOdds(pDec, 0.06);

    const pOver15 = round >= 2 ? 1 : 1 - pFinish * 0.85;
    const pOver25 = round >= 3 ? 1 : 1 - pFinish * 0.95;
    raw['Тотал Б 1.5 раундов'] = toOdds(pOver15, 0.06);
    raw['Тотал М 1.5 раундов'] = toOdds(1 - pOver15, 0.06);
    raw['Тотал Б 2.5 раундов'] = toOdds(pOver25, 0.06);
    raw['Тотал М 2.5 раундов'] = toOdds(1 - pOver25, 0.06);

    raw['Бой досрочно'] = toOdds(pFinish, 0.06);
    raw['Пройти всю дистанцию'] = toOdds(pDec, 0.06);

    if (round <= 1) raw['Финиш в R1'] = toOdds(pFinish * 0.40, 0.08);
    if (round <= 2) raw['Финиш в R2'] = toOdds(pFinish * 0.28, 0.08);
    if (round <= 3) raw['Финиш в R3'] = toOdds(pFinish * 0.20, 0.08);
    if (round <= 4) raw['Финиш в R4+'] = toOdds(pFinish * 0.12, 0.08);

    raw[`${m.home} KO/TKO`] = toOdds(pHome * pKO, 0.08);
    raw[`${m.home} Сабмишн`] = toOdds(pHome * pSub, 0.08);
    raw[`${m.home} Решение`] = toOdds(pHome * pDec, 0.08);
    raw[`${m.away} KO/TKO`] = toOdds(pAway * pKO, 0.08);
    raw[`${m.away} Сабмишн`] = toOdds(pAway * pSub, 0.08);
    raw[`${m.away} Решение`] = toOdds(pAway * pDec, 0.08);

    return raw;
  }

  // Футбол / хоккей
  const isFootball = m.sport === 'football';
  const { lambdaHome, lambdaAway } = expectedGoalsRemaining(m);
  const currentTotal = m.scoreHome + m.scoreAway;

  const MAX_GOALS = 12;
  const homeDist = [], awayDist = [];
  for (let g = 0; g <= MAX_GOALS; g++) {
    homeDist.push(poisson(g, lambdaHome));
    awayDist.push(poisson(g, lambdaAway));
  }

  const scoreMatrix = {};
  let sumAll = 0;
  for (let h = 0; h <= MAX_GOALS; h++) {
    for (let a = 0; a <= MAX_GOALS; a++) {
      const p = homeDist[h] * awayDist[a];
      const fh = m.scoreHome + h;
      const fa = m.scoreAway + a;
      const key = `${fh}:${fa}`;
      scoreMatrix[key] = (scoreMatrix[key] || 0) + p;
      sumAll += p;
    }
  }
  for (const k in scoreMatrix) scoreMatrix[k] /= sumAll;

  let pHome = 0, pDraw = 0, pAway = 0, pEven = 0, pBtts = 0;
  for (const [score, p] of Object.entries(scoreMatrix)) {
    const [h, a] = score.split(':').map(Number);
    if (h > a) pHome += p;
    else if (h === a) pDraw += p;
    else pAway += p;
    if ((h + a) % 2 === 0) pEven += p;
    if (h >= 1 && a >= 1) pBtts += p;
  }

  function pOver(line) {
    let p = 0;
    for (const [score, prob] of Object.entries(scoreMatrix)) {
      const [h, a] = score.split(':').map(Number);
      if (h + a > line) p += prob;
    }
    return p;
  }

  function pHandicap(line) {
    let p = 0;
    for (const [score, prob] of Object.entries(scoreMatrix)) {
      const [h, a] = score.split(':').map(Number);
      if (h - a > line) p += prob;
    }
    return p;
  }

  function pTeamOver(side, line) {
    let p = 0;
    for (const [score, prob] of Object.entries(scoreMatrix)) {
      const [h, a] = score.split(':').map(Number);
      const goals = side === 'home' ? h : a;
      if (goals > line) p += prob;
    }
    return p;
  }

  const lines = isFootball
    ? [0.5, 1.5, 2.5, 3.5, 4.5, 5.5]
    : [3.5, 4.5, 5.5, 6.5, 7.5, 8.5];

  const raw = {};

  if (isFootball) {
    raw['1X'] = toOdds(pHome + pDraw, 0.04);
    raw['12'] = toOdds(pHome + pAway, 0.04);
    raw['X2'] = toOdds(pDraw + pAway, 0.04);
  }

  lines.forEach(line => {
    const pO = pOver(line);
    const pU = 1 - pO;
    if (pO > 0.01 && pO < 0.99) {
      raw[`ТБ ${line}`] = toOdds(pO, 0.05);
      raw[`ТМ ${line}`] = toOdds(pU, 0.05);
    }
  });

  if (isFootball) {
    const pF1m15 = pHandicap(-1.5);
    const pF2p15 = 1 - pF1m15;
    const pF2m15 = 1 - pHandicap(1.5);
    const pF1p15 = 1 - pF2m15;
    if (pF1m15 > 0.01 && pF1m15 < 0.99) raw['Ф1 −1.5'] = toOdds(pF1m15, 0.05);
    if (pF1p15 > 0.01 && pF1p15 < 0.99) raw['Ф1 +1.5'] = toOdds(pF1p15, 0.05);
    if (pF2m15 > 0.01 && pF2m15 < 0.99) raw['Ф2 −1.5'] = toOdds(pF2m15, 0.05);
    if (pF2p15 > 0.01 && pF2p15 < 0.99) raw['Ф2 +1.5'] = toOdds(pF2p15, 0.05);
  } else {
    const pF1m15 = pHandicap(-1.5);
    const pF2m15 = 1 - pHandicap(1.5);
    raw['Ф1 −1.5'] = toOdds(pF1m15, 0.05);
    raw['Ф1 +1.5'] = toOdds(1 - pF1m15, 0.05);
    raw['Ф2 −1.5'] = toOdds(pF2m15, 0.05);
    raw['Ф2 +1.5'] = toOdds(1 - pF2m15, 0.05);
  }

  if (pBtts > 0.01 && pBtts < 0.99) {
    raw['Обе · Да'] = toOdds(pBtts, 0.05);
    raw['Обе · Нет'] = toOdds(1 - pBtts, 0.05);
  }

  if (pEven > 0.01 && pEven < 0.99) {
    raw['Чёт'] = toOdds(pEven, 0.05);
    raw['Нечет'] = toOdds(1 - pEven, 0.05);
  }

  const teamLine = isFootball ? 0.5 : 1.5;
  const homeOver = pTeamOver('home', teamLine);
  const awayOver = pTeamOver('away', teamLine);
  if (homeOver > 0.01 && homeOver < 0.99) {
    raw[`${m.home} Б ${teamLine}`] = toOdds(homeOver, 0.05);
    raw[`${m.home} М ${teamLine}`] = toOdds(1 - homeOver, 0.05);
  }
  if (awayOver > 0.01 && awayOver < 0.99) {
    raw[`${m.away} Б ${teamLine}`] = toOdds(awayOver, 0.05);
    raw[`${m.away} М ${teamLine}`] = toOdds(1 - awayOver, 0.05);
  }

  if (isFootball && m.minute < 85) {
    for (const [score, p] of Object.entries(scoreMatrix)) {
      const [h, a] = score.split(':').map(Number);
      if (h > 4 || a > 4) continue;
      if (p < 0.003) continue;
      raw[`Счёт ${score}`] = toOdds(p, 0.08);
    }
  }

  return raw;
}

function createRandomMatch(isPrematch = false, startsIn = 0) {

  if (r < 0.55) return createFootballMatch(isPrematch, startsIn);
  if (r < 0.85) return createHockeyMatch(isPrematch, startsIn);
  return createUFCMatch(isPrematch, startsIn);
}

function createMatches(count = 15) {
  const list = [];
  const prematchCount = Math.floor(count * 0.4);

  // Прематчи: разное время 30 сек – 5 минут
  for (let i = 0; i < prematchCount; i++) {
    let seconds;
    const bucket = Math.floor(i / prematchCount * 3);
    if (bucket === 0) seconds = rand(30, 90);
    else if (bucket === 1) seconds = rand(90, 180);
    else seconds = rand(180, 300);
    list.push(createRandomMatch(true, seconds));
  }

  // Live — часть уже идёт
  const liveCount = Math.floor(count * 0.2);
  for (let i = 0; i < liveCount; i++) {
    const m = createRandomMatch(false, 0);
    m.minute = rand(5, 40);
    list.push(m);
  }

  // Live — только что стартовали
  while (list.length < count) {
    const m = createRandomMatch(false, 0);
    m.minute = rand(0, 5);
    list.push(m);
  }

  // Перемешиваем
  for (let i = list.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [list[i], list[j]] = [list[j], list[i]];
  }
  return list;
}

/* ============ СИМУЛЯЦИЯ ============ */
function tickMatch(m) {
  if (m.status === 'countdown') {
    m.countdownLeft -= 1;
    if (m.countdownLeft <= 0) {
      const newM = createRandomMatch(false, 0);
      newM.id = m.id;
      Object.assign(m, newM);
    }
    return;
  }

  if (m.status === 'prematch') {
    m.startsIn -= 1;
    if (m.startsIn <= 0) { m.status = 'live'; m.minute = 0; }
    return;
  }

  if (m.status !== 'live') return;

  if (m.breakLeft > 0) {
    m.breakLeft -= 1;
    if (m.breakLeft === 0) {
      if (m.sport === 'football' && m.period === 'HT') m.period = '2H';
      else if (m.sport === 'hockey' && m.period === 'BR1') m.period = 'P2';
      else if (m.sport === 'hockey' && m.period === 'BR2') m.period = 'P3';
    }
    return;
  }

  m.minute += 1;
  m.momentum *= 0.93;
  m.justScoredSide = null;

  // UFC
  if (m.sport === 'ufc') {
    const cycle = 7;
    const tick = m.minute % cycle;
    m.round = Math.min(5, Math.floor(m.minute / cycle) + 1);

    if (tick >= 5 && m.round < 5) {
      m.breakLeft = 1;
      return;
    }

    const homeAdv = (m.homeRating - m.awayRating) / 400;
    const homeWins = Math.random() < (0.5 + homeAdv * 0.3);
    if (homeWins) m.momentum = Math.min(1, m.momentum + 0.25);
    else m.momentum = Math.max(-1, m.momentum - 0.25);

    if (Math.random() < 0.06) {
      const winner = Math.random() < (0.5 + homeAdv) ? 'home' : 'away';
      const method = Math.random() < 0.6 ? 'KO/TKO' : 'Сабмишн';
      if (winner === 'home') { m.scoreHome = 1; m.scoreAway = 0; m.justScoredSide = 'home'; }
      else { m.scoreHome = 0; m.scoreAway = 1; m.justScoredSide = 'away'; }
      m.finalResult = { winner, method, round: m.round };
      m.status = 'finished';
      m.finishedAt = Date.now();
      return;
    }

    if (m.minute >= 33) {
      const winner = m.momentum > 0 ? 'home' : 'away';
      if (winner === 'home') { m.scoreHome = 1; m.scoreAway = 0; }
      else { m.scoreHome = 0; m.scoreAway = 1; }
      m.finalResult = { winner, method: 'Решение', round: 5 };
      m.status = 'finished';
      m.finishedAt = Date.now();
      return;
    }
    return;
  }

  // Футбол
  if (m.sport === 'football') {
    if (m.minute === 45 && m.period === '1H') {
      m.period = 'HT';
      m.breakLeft = 3;
      return;
    }
    if (m.minute >= 90) {
      m.status = 'finished';
      m.finishedAt = Date.now();
      return;
    }

    const { lambdaHome, lambdaAway } = expectedGoalsRemaining(m);
    const remaining = Math.max(1, m.maxMinute - m.minute);
    const pHome = lambdaHome / remaining;
    const pAway = lambdaAway / remaining;

    if (Math.random() < pHome) {
      m.scoreHome += 1;
      m.momentum = Math.min(1, m.momentum + 0.35);
      m.justScoredSide = 'home';
      addLiveDrop(m, m.home, `${m.scoreHome}:${m.scoreAway}`);
    } else if (Math.random() < pAway) {
      m.scoreAway += 1;
      m.momentum = Math.max(-1, m.momentum - 0.35);
      m.justScoredSide = 'away';
      addLiveDrop(m, m.away, `${m.scoreHome}:${m.scoreAway}`);
    }
    return;
  }

  // Хоккей
  if (m.sport === 'hockey') {
    if (m.minute === 20 && m.period === 'P1') {
      m.period = 'BR1';
      m.breakLeft = 3;
      return;
    }
    if (m.minute === 40 && m.period === 'P2') {
      m.period = 'BR2';
      m.breakLeft = 3;
      return;
    }
    if (m.minute >= 60) {
      m.status = 'finished';
      m.finishedAt = Date.now();
      return;
    }

    const { lambdaHome, lambdaAway } = expectedGoalsRemaining(m);
    const remaining = Math.max(1, m.maxMinute - m.minute);
    const pHome = lambdaHome / remaining;
    const pAway = lambdaAway / remaining;

    if (Math.random() < pHome) {
      m.scoreHome += 1;
      m.momentum = Math.min(1, m.momentum + 0.35);
      m.justScoredSide = 'home';
      addLiveDrop(m, m.home, `${m.scoreHome}:${m.scoreAway}`);
    } else if (Math.random() < pAway) {
      m.scoreAway += 1;
      m.momentum = Math.max(-1, m.momentum - 0.35);
      m.justScoredSide = 'away';
      addLiveDrop(m, m.away, `${m.scoreHome}:${m.scoreAway}`);
    }
    return;
  }
}

function addLiveDrop(m, scorer, score) {
  liveDrops.unshift({
    match: `${m.home} — ${m.away}`,
    event: `${sportIcon(m.sport)} ${scorer} · ${score}`,
    id: Date.now() + Math.random(),
  });
  if (liveDrops.length > 15) liveDrops.pop();
}

/* ============ AI КОММЕНТАТОР ============ */
function generateAIComment(m) {
  if (m.status === 'prematch') {
    const favorite = m.sport === 'ufc'
      ? (m.homeRating > m.awayRating ? m.home : m.away)
      : (m.homeAttack > m.awayAttack ? m.home : m.away);
    return `Матч начнётся через ${formatTime(m.startsIn)}. Букмекеры отдают предпочтение <b>${favorite}</b>.`;
  }
  if (m.status === 'finished') {
    if (m.sport === 'ufc' && m.finalResult) {
      const winnerName = m.finalResult.winner === 'home' ? m.home : m.away;
      return `Бой завершён. <b>${winnerName}</b> побеждает методом ${m.finalResult.method} в R${m.finalResult.round}.`;
    }
    const winner = m.scoreHome > m.scoreAway ? m.home
      : m.scoreAway > m.scoreHome ? m.away : null;
    if (winner) return `Матч завершён. Победа <b>${winner}</b> со счётом ${m.scoreHome}:${m.scoreAway}.`;
    return `Матч завершён вничью ${m.scoreHome}:${m.scoreAway}.`;
  }
  if (m.status === 'countdown') {
    return `Новый матч начнётся через ${formatTime(m.countdownLeft)}.`;
  }

  // Live
  const absMomentum = Math.abs(m.momentum);
  const dominant = m.momentum > 0 ? m.home : m.away;
  const other = m.momentum > 0 ? m.away : m.home;

  if (m.sport === 'ufc') {
    if (absMomentum > 0.5) return `Раунд ${m.round}. <b>${dominant}</b> контролирует бой, наносит удары.`;
    if (absMomentum > 0.2) return `Раунд ${m.round}. Небольшое преимущество у <b>${dominant}</b>.`;
    return `Раунд ${m.round}. Равный бой, оба бойца осторожны.`;
  }

  const period = m.sport === 'football'
    ? (m.period === '1H' ? 'первый тайм' : m.period === '2H' ? 'второй тайм' : 'перерыв')
    : (m.period === 'P1' ? 'первый период' : m.period === 'P2' ? 'второй период' : m.period === 'P3' ? 'третий период' : 'перерыв');

  if (absMomentum > 0.5) return `${period}, ${m.minute}'. <b>${dominant}</b> доминирует, создаёт опасные моменты. ${other} в защите.`;
  if (absMomentum > 0.2) return `${period}, ${m.minute}'. <b>${dominant}</b> немного активнее, но ${other} отвечает контратаками.`;
  return `${period}, ${m.minute}'. Равная борьба, команды обмениваются атаками.`;
}

/* ============ HEATMAP (где деньги в линии) ============ */
function computeHeatmap(m) {
  // Эмуляция: чем ниже кэф, тем больше денег
  const odds = computeOdds(m);
  const invHome = odds.home ? 1 / odds.home : 0;
  const invDraw = odds.draw ? 1 / odds.draw : 0;
  const invAway = odds.away ? 1 / odds.away : 0;
  const total = invHome + invDraw + invAway || 1;
  return {
    home: (invHome / total * 100).toFixed(0),
    draw: (invDraw / total * 100).toFixed(0),
    away: (invAway / total * 100).toFixed(0),
  };
}

/* ============ VALUE DETECTOR ============ */
function computeValue(m, pick) {
  const odds = computeOdds(m);
  const ourOdd = odds[pick];
  if (!ourOdd || !isOddValid(ourOdd)) return null;
  // Эмулируем "средний рынок" — небольшой сдвиг
  const marketOdd = Math.round((ourOdd * (0.97 + Math.random() * 0.04)) * 100) / 100;
  const diff = ((ourOdd - marketOdd) / marketOdd * 100).toFixed(1);
  return {
    ourOdd,
    marketOdd,
    diff,
    isValue: ourOdd > marketOdd,
    isHot: Math.abs(parseFloat(diff)) > 3,
  };
}

function setSort() {

  $('sortBtn').textContent = labels[next];
  renderMatches();
}

function renderPeriodProgress(m) {
  if (m.status !== 'live' && m.status !== 'finished') return '';

  if (m.sport === 'football') {
    const h1 = Math.min(1, m.minute / 45);
    const h2 = Math.max(0, Math.min(1, (m.minute - 45) / 45));
    return `<div class="period-progress">
      <div class="period-seg ${h1 >= 1 ? 'done' : 'active'}" style="--p: ${h1 * 100}%"></div>
      <div class="period-seg ${h2 >= 1 ? 'done' : 'active'}" style="--p: ${h2 * 100}%"></div>
    </div>`;
  }
  if (m.sport === 'hockey') {
    const p1 = Math.min(1, m.minute / 20);
    const p2 = Math.max(0, Math.min(1, (m.minute - 20) / 20));
    const p3 = Math.max(0, Math.min(1, (m.minute - 40) / 20));
    return `<div class="period-progress">
      <div class="period-seg ${p1 >= 1 ? 'done' : 'active'}" style="--p: ${p1 * 100}%"></div>
      <div class="period-seg ${p2 >= 1 ? 'done' : 'active'}" style="--p: ${p2 * 100}%"></div>
      <div class="period-seg ${p3 >= 1 ? 'done' : 'active'}" style="--p: ${p3 * 100}%"></div>
    </div>`;
  }
  if (m.sport === 'ufc') {
    const segs = [];
    for (let i = 1; i <= 5; i++) {
      const done = m.round > i || (m.status === 'finished' && m.round >= i);
      const active = m.round === i && m.status === 'live';
      let p = 0;
      if (active) p = ((m.minute % 7) / 5) * 100;
      if (done) p = 100;
      segs.push(`<div class="period-seg ${done ? 'done' : active ? 'active' : ''}" style="--p: ${Math.min(100, p)}%"></div>`);
    }
    return `<div class="period-progress">${segs.join('')}</div>`;
  }
  return '';
}

function renderXGGraph(m) {
  if (m.sport === 'ufc' || m.status === 'prematch' || m.status === 'countdown') return '';
  const homeXg = (m.homeAttack * m.minute / m.maxMinute) || 0;
  const awayXg = (m.awayAttack * m.minute / m.maxMinute) || 0;
  const maxXg = Math.max(homeXg, awayXg, 1);
  const homeH = (homeXg / maxXg) * 30 + 4;
  const awayH = (awayXg / maxXg) * 30 + 4;
  return `
    <div class="xg-graph">
      <div class="xg-bar home" style="height: ${homeH}px"></div>
      <div class="xg-bar away" style="height: ${awayH}px"></div>
      <span class="xg-label home">xG ${homeXg.toFixed(2)}</span>
      <span class="xg-label away">xG ${awayXg.toFixed(2)}</span>
    </div>
  `;
}

function renderHeatmap(m) {
  if (m.status === 'prematch' || m.status === 'countdown') return '';
  const hm = computeHeatmap(m);
  if (m.sport === 'ufc') return '';
  const isHockey = m.sport === 'hockey';
  return `
    <div class="heatmap-legend">
      <span><i style="background: var(--accent)"></i>1: ${hm.home}%</span>
      ${!isHockey ? `<span><i style="background: var(--gold)"></i>X: ${hm.draw}%</span>` : ''}
      <span><i style="background: var(--accent-2)"></i>2: ${hm.away}%</span>
    </div>
    <div class="heatmap">
      <div class="heatmap-seg home" style="flex: ${hm.home}"></div>
      ${!isHockey ? `<div class="heatmap-seg draw" style="flex: ${hm.draw}"></div>` : ''}
      <div class="heatmap-seg away" style="flex: ${hm.away}"></div>
    </div>
  `;
}

function renderAIPanel(m) {
  if (m.status === 'prematch' && m.startsIn > 120) return '';
  const comment = generateAIComment(m);
  return `
    <div class="ai-panel">
      <div class="ai-panel-header">🤖 AI-аналитик</div>
      <div class="ai-panel-body">${comment}</div>
    </div>
  `;
}

function renderMatches() {
  let filtered = [...matches];

  if (currentFilter !== 'all') filtered = filtered.filter(m => m.sport === currentFilter);
  if (currentLeagueFilter !== 'all') filtered = filtered.filter(m => m.league === currentLeagueFilter);
  if (liveOnly) filtered = filtered.filter(m => m.status === 'live');
  if (favOnly) filtered = filtered.filter(m => favorites.has(m.id));
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    filtered = filtered.filter(m =>
      m.home.toLowerCase().includes(q) ||
      m.away.toLowerCase().includes(q) ||
      m.league.toLowerCase().includes(q)
    );
  }

  filtered.sort((a, b) => {
    const order = { live: 0, prematch: 1, countdown: 2, finished: 3 };
    if (currentSort === 'time') {
      if (order[a.status] !== order[b.status]) return order[a.status] - order[b.status];
      return a.minute - b.minute;
    }
    if (currentSort === 'odd-high' || currentSort === 'odd-low') {
      const oa = computeOdds(a).home || 99;
      const ob = computeOdds(b).home || 99;
      return currentSort === 'odd-high' ? ob - oa : oa - ob;
    }
    return 0;
  });

  const el = $('matches');
  if (!filtered.length) {
    el.innerHTML = `<div class="empty"><div class="icon">🎯</div><div class="text">Матчей нет</div></div>`;
    return;
  }

  el.innerHTML = filtered.map(m => renderMatchCard(m, false)).join('');
}

function renderMatchCard(m, mini = false) {
  const odds = computeOdds(m);
  const isFinished = m.status === 'finished';
  const isPrematch = m.status === 'prematch';
  const isCountdown = m.status === 'countdown';
  const extras = (!isFinished && !isCountdown) ? computeExtraMarkets(m) : {};
  const extrasKeys = Object.keys(extras);
  const isOpen = openExtras.has(m.id);
  const isFav = favorites.has(m.id);

  const extrasHtml = extrasKeys.length && !mini ? `
    <div class="extras">
      <button class="extras-toggle ${isOpen ? 'open' : ''}" data-extras-toggle="${m.id}">
        ${isOpen ? '▲' : '▼'} Ещё ${extrasKeys.length} рынков
      </button>
      <div class="extras-grid ${isOpen ? 'open' : ''}">
        ${extrasKeys.map(label => {
          const odd = extras[label];
          const valid = isOddValid(odd);
          return `<button class="odds-mini ${valid ? '' : 'disabled'}"
            data-mid="${m.id}"
            data-mk="${encodeURIComponent(label)}"
            data-odd="${valid ? odd : ''}"
            ${valid ? '' : 'disabled'}>
            <span class="odds-mini-label">${label}</span>
            <span class="odds-mini-value">${valid ? odd.toFixed(2) : '—'}</span>
          </button>`;
        }).join('')}
      </div>
    </div>
  ` : '';

  const homeAvatar = `<div class="team-avatar ${m.justScoredSide === 'home' ? 'scored' : ''}" style="background:${teamColor(m.home)}">${teamInitials(m.home)}</div>`;
  const awayAvatar = `<div class="team-avatar ${m.justScoredSide === 'away' ? 'scored' : ''}" style="background:${teamColor(m.away)}">${teamInitials(m.away)}</div>`;

  const statsHtml = (m.status === 'live' || isFinished) && m.sport !== 'ufc' ? `
    <div class="stats-bar">
      <span class="stat-item">Влад: <b>${Math.round(50 + m.momentum * 30)}% — ${Math.round(50 - m.momentum * 30)}%</b></span>
      <span class="stat-item">Удары: <b>${Math.max(0, Math.round(m.minute * 0.15 + m.scoreHome * 2))} — ${Math.max(0, Math.round(m.minute * 0.12 + m.scoreAway * 2))}</b></span>
      <span class="stat-item">Углы: <b>${Math.max(0, Math.round(m.minute * 0.08))} — ${Math.max(0, Math.round(m.minute * 0.06))}</b></span>
    </div>
  ` : '';

  let statusBadge;
  if (isFinished) statusBadge = '<span class="badge finished">Завершён</span>';
  else if (isCountdown) statusBadge = '<span class="badge countdown">⏱ Следующий</span>';
  else if (isPrematch) statusBadge = '<span class="badge prematch">Скоро</span>';
  else if (m.breakLeft > 0) statusBadge = '<span class="badge break">⏸ Перерыв</span>';
  else statusBadge = '<span class="badge live">LIVE</span>';

  let timeInfo = '';
  if (isCountdown) {
    timeInfo = `<span class="time-info" style="color:var(--accent-2);font-weight:800">⏱ Новый через ${formatTime(m.countdownLeft)}</span>`;
  } else if (isPrematch) {
    timeInfo = `<span class="time-info">⏰ через ${formatTime(m.startsIn)}</span>`;
  } else if (m.status === 'live') {
    let label = '';
    if (m.sport === 'football') label = m.period === '1H' ? '1-й тайм' : m.period === 'HT' ? 'перерыв' : '2-й тайм';
    else if (m.sport === 'hockey') label = m.period === 'P1' ? '1-й период' : m.period === 'P2' ? '2-й период' : m.period === 'P3' ? '3-й период' : 'перерыв';
    else if (m.sport === 'ufc') label = `R${m.round}/5`;
    timeInfo = `<span class="time-info">${label} · ${m.minute}'</span>`;
  }

  let ufcFinalHtml = '';
  if (m.sport === 'ufc' && isFinished && m.finalResult) {
    const winnerName = m.finalResult.winner === 'home' ? m.home : m.away;
    const methodIcon = m.finalResult.method === 'KO/TKO' ? '💥'
      : m.finalResult.method === 'Сабмишн' ? '🤼' : '📋';
    ufcFinalHtml = `
      <div class="ufc-final">
        <span class="ufc-final-icon">${methodIcon}</span>
        <div class="ufc-final-text">
          Победа: <b>${winnerName}</b><br>
          <span class="ufc-final-sub">${m.finalResult.method} · R${m.finalResult.round} · ${m.scoreHome}:${m.scoreAway}</span>
        </div>
      </div>
    `;
  }

  let scoreDisplay;
  if (isCountdown) {
    scoreDisplay = `<span class="team-score" style="color:var(--muted)">—:—</span>`;
  } else if (m.sport === 'ufc' && !isFinished) {
    scoreDisplay = `<span class="team-score" style="color:var(--muted)">—</span>`;
  } else {
    scoreDisplay = `<span class="team-score ${m.justScoredSide ? 'scored' : ''}">${m.scoreHome}:${m.scoreAway}</span>`;
  }

  const aiPanel = !mini && (m.status === 'live' || (m.status === 'prematch' && m.startsIn <= 120)) ? renderAIPanel(m) : '';
  const xgGraph = !mini ? renderXGGraph(m) : '';
  const heatmapHtml = !mini ? renderHeatmap(m) : '';

  return `
    <div class="match ${isFinished ? 'finished' : ''}" data-match-id="${m.id}">
      <div class="match-info">
        <div class="match-top">
          <span class="sport-icon">${sportIcon(m.sport)}</span>
          <span class="match-league">${m.league}</span>
          ${statusBadge}
          <button class="star-btn ${isFav ? 'active' : ''}" data-star="${m.id}">${isFav ? '★' : '☆'}</button>
        </div>
        <div class="teams-row">
          <div class="team">${homeAvatar}<span class="team-name">${m.home}</span></div>
          ${scoreDisplay}
          <div class="team">${awayAvatar}<span class="team-name">${m.away}</span></div>
          ${timeInfo}
        </div>
        ${renderPeriodProgress(m)}
        ${ufcFinalHtml}
        ${statsHtml}
        ${xgGraph}
        ${heatmapHtml}
        ${aiPanel}
      </div>
      <div class="odds">
        ${renderOddsBtn(m, 'home', '1', odds.home, isFinished || isPrematch || isCountdown)}
        ${m.sport !== 'ufc' ? renderOddsBtn(m, 'draw', 'X', odds.draw, isFinished || isPrematch || isCountdown) : ''}
        ${renderOddsBtn(m, 'away', '2', odds.away, isFinished || isPrematch || isCountdown)}
      </div>
      ${extrasHtml}
    </div>
  `;
}

function renderStats() {
  const won = wallet.bets.filter(b => b.status === 'won').length;
  const lost = wallet.bets.filter(b => b.status === 'lost').length;
  const pending = wallet.bets.filter(b => b.status === 'pending').length;
  const total = won + lost;
  const winrate = total ? ((won / total) * 100).toFixed(1) : '0.0';
  const profit = wallet.totalWon - wallet.totalBet;
  const roi = wallet.totalBet ? ((profit / wallet.totalBet) * 100).toFixed(1) : '0.0';

  $('statsGrid').innerHTML = `
    <div class="stat"><div class="stat-label">Баланс</div><div class="stat-value gold">${fmtMoney(wallet.balance)} ₽</div></div>
    <div class="stat"><div class="stat-label">Поставлено</div><div class="stat-value">${fmtMoney(wallet.totalBet)} ₽</div></div>
    <div class="stat"><div class="stat-label">Выиграно</div><div class="stat-value green">${fmtMoney(wallet.totalWon)} ₽</div></div>
    <div class="stat"><div class="stat-label">Профит</div><div class="stat-value ${profit >= 0 ? 'green' : 'red'}">${profit >= 0 ? '+' : ''}${fmtMoney(profit)} ₽</div></div>
    <div class="stat"><div class="stat-label">Винрейт</div><div class="stat-value">${winrate}%</div></div>
    <div class="stat"><div class="stat-label">ROI</div><div class="stat-value ${parseFloat(roi) >= 0 ? 'green' : 'red'}">${roi}%</div></div>
    <div class="stat"><div class="stat-label">Ставок</div><div class="stat-value">${wallet.bets.length}</div></div>
    <div class="stat"><div class="stat-label">В ожидании</div><div class="stat-value gold">${pending}</div></div>
  `;

  // По спортам
  const bySport = {};
  wallet.bets.forEach(b => {
    if (b.status !== 'won' && b.status !== 'lost') return;
    const sport = b.sport || (b.selections ? 'mixed' : 'other');
    if (!bySport[sport]) bySport[sport] = { won: 0, lost: 0, profit: 0 };
    if (b.status === 'won') { bySport[sport].won++; bySport[sport].profit += (b.payout - b.stake); }
    else { bySport[sport].lost++; bySport[sport].profit -= b.stake; }
  });

  const sportNames = { football: '⚽ Футбол', hockey: '🏒 Хоккей', ufc: '🥊 UFC', mixed: '🎰 Смешанный', other: '🎯 Прочее' };
  const sportEl = $('sportStatsGrid');
  if (sportEl) {
    const entries = Object.entries(bySport);
    if (!entries.length) {
      sportEl.innerHTML = '<div class="stat" style="grid-column:1/-1;text-align:center;color:var(--muted)">Пока нет данных</div>';
    } else {
      sportEl.innerHTML = entries.map(([sport, data]) => {
        const total = data.won + data.lost;
        const wr = total ? ((data.won / total) * 100).toFixed(0) + '%' : '—';
        return `<div class="stat">
          <div class="stat-label">${sportNames[sport] || sport}</div>
          <div class="stat-value ${data.profit >= 0 ? 'green' : 'red'}">${data.profit >= 0 ? '+' : ''}${fmtMoney(data.profit)} ₽</div>
          <div style="font-size:11px;color:var(--muted);margin-top:4px">${data.won}W / ${data.lost}L · ${wr}</div>
        </div>`;
      }).join('');
    }
  }

  // Топ рынков
  const byMarket = {};
  wallet.bets.forEach(b => {
    if (b.status !== 'won' && b.status !== 'lost') return;
    const pick = b.pick || (b.type === 'express' ? 'Экспресс' : 'Билдер');
    const key = pick.startsWith('ТБ') || pick.startsWith('ТМ') ? 'Тотал' :
                pick.startsWith('Ф') ? 'Фора' :
                pick.startsWith('Счёт') ? 'Точный счёт' :
                pick === 'Обе · Да' || pick === 'Обе · Нет' ? 'Обе забьют' :
                pick === 'home' || pick === 'away' || pick === 'draw' ? '1X2' :
                pick === '1X' || pick === '12' || pick === 'X2' ? 'Двойной шанс' :
                pick === 'Чёт' || pick === 'Нечет' ? 'Чёт/Нечет' :
                b.type === 'express' ? 'Экспресс' :
                b.type === 'builder' ? 'Билдер' : 'Прочее';
    if (!byMarket[key]) byMarket[key] = { count: 0, won: 0, profit: 0 };
    byMarket[key].count++;
    if (b.status === 'won') { byMarket[key].won++; byMarket[key].profit += (b.payout - b.stake); }
    else byMarket[key].profit -= b.stake;
  });

  const marketEl = $('marketStatsList');
  if (marketEl) {
    const entries = Object.entries(byMarket).sort((a, b) => b[1].count - a[1].count).slice(0, 5);
    if (!entries.length) {
      marketEl.innerHTML = '<div style="color:var(--muted);text-align:center;padding:16px">Пока нет данных</div>';
    } else {
      marketEl.innerHTML = entries.map(([name, data]) => `
        <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:12.5px">
          <span style="font-weight:700">${name}</span>
          <span style="color:var(--muted)">${data.count} ставок · ${((data.won / data.count) * 100).toFixed(0)}% win</span>
          <span style="font-weight:800;color:${data.profit >= 0 ? 'var(--green)' : 'var(--red)'}">${data.profit >= 0 ? '+' : ''}${fmtMoney(data.profit)} ₽</span>
        </div>
      `).join('');
    }
  }

  drawProfitChart();
}

function drawProfitChart() {
  const canvas = $('profitChart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);

  const w = rect.width, h = rect.height;
  const history = wallet.profitHistory;
  ctx.clearRect(0, 0, w, h);

  if (!history || history.length < 2) {
    ctx.fillStyle = '#7a7a95';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Играй — график появится', w / 2, h / 2);
    return;
  }

  const min = Math.min(...history.map(p => p.v), 0);
  const max = Math.max(...history.map(p => p.v), 0);
  const range = max - min || 1;

  ctx.strokeStyle = 'rgba(120,120,160,.1)';
  for (let i = 0; i <= 4; i++) {
    const y = (h / 4) * i;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  }

  const step = w / (history.length - 1);
  const gradient = ctx.createLinearGradient(0, 0, 0, h);
  gradient.addColorStop(0, 'rgba(123,92,255,.45)');
  gradient.addColorStop(1, 'rgba(123,92,255,0)');

  ctx.beginPath();
  history.forEach((p, i) => {
    const x = i * step;
    const y = h - ((p.v - min) / range) * h * 0.9 - h * 0.05;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.strokeStyle = '#7b5cff';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.lineTo(w, h);
  ctx.lineTo(0, h);
  ctx.closePath();
  ctx.fillStyle = gradient;
  ctx.fill();
}
