const CFG=[
{k:'rpl',sp:'soccer',n:'Россия · РПЛ',t:N('rpl'),c:[3,1,0,0,0,2,3],s:['19:00','17:30','15:00','20:00','12:30'],off:[0,1,5,6]},

/* ---------- генерация расписания и «результатов» (демо) ---------- */
const lam=(sp,eh,ea)=>{const hk=sp==='hockey',d=(eh-ea)/(hk?40:35);return hk?[3.1*Math.exp(.35*d),2.8*Math.exp(-.35*d),d]:[1.5*Math.exp(.45*d),1.2*Math.exp(-.45*d),d]};
function gen(L,id,t,h,a){const r=rng(id),hk=L.sp==='hockey',m={id,sp:L.sp,ln:L.n,t,st:'pre',void:r()<.02,h:{n:h,R:T[h],sc:0},a:{n:a,R:T[a],sc:0}};
const[lh,la,d]=lam(L.sp,m.h.R,m.a.R),gh=pois(lh,r),ga=pois(la,r),g=[];
for(let i=0;i<gh;i++)g.push({s:'h',m:1+r()*(hk?59:89)});for(let i=0;i<ga;i++)g.push({s:'a',m:1+r()*(hk?59:89)});
let ot=0,w=gh>ga?'h':'a';if(hk&&gh===ga){ot=1;w=r()<1/(1+Math.exp(-.3*d))?'h':'a';g.push({s:w,m:61+r()*4})}
m.g=g;m.fin={h:gh,a:ga,w,ot};return m}
function build(){const M=[];for(let off=-7;off<=6;off++){const x=new Date(Date.now()+MSK+off*864e5),y=x.getUTCFullYear(),mo=x.getUTCMonth(),dd=x.getUTCDate(),wd=x.getUTCDay();
CFG.forEach(L=>{if(L.off.includes(mo))return;const n=Math.min(L.c[wd],L.t.length>>1);if(!n)return;const r=rng(L.k+y+'-'+mo+'-'+dd),a=[...L.t];
for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
for(let i=0;i<n;i++){const[hh,mm]=L.s[(i+wd)%L.s.length].split(':').map(Number);M.push(gen(L,`${L.k}${y}${mo}${dd}_${i}`,Date.UTC(y,mo,dd,hh,mm)-MSK,a[2*i],a[2*i+1]))}})}
return M.sort((a,b)=>a.t-b.t)}
function upd(m){const e=(Date.now()-m.t)/6e4,hk=m.sp==='hockey',end=hk?150+(m.fin.ot?12.5:0):105;let st='pre',gm=0;
if(e>=0)st=(m.void||e>=end)?'post':'in';
if(st==='in'){if(hk){gm=e/2.5;m.per=gm>=60?4:Math.floor(gm/20)+1;const s=Math.floor(gm%20*60);m.clk=gm>=60?'ОТ':`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}else{gm=e<=45?e:e<60?45:e-15;m.clk=e>45&&e<60?'Перерыв':Math.floor(gm)+"'"}}else if(st==='post')gm=999;
const was=m.st;m.st=st;m.done=st==='post';
if(!m.void){let a=0,b=0;m.g.forEach(g=>{if(g.m<=gm)g.s==='h'?a++:b++});m.h.sc=a;m.a.sc=b}
if(st!=='pre'&&!m.void){const f=Math.min(1,gm/(hk?60:90)),q=rng(m.id+'s'),ph=Math.max(30,Math.min(70,50+(m.h.R-m.a.R)*.5+(q()-.5)*10)),k=x=>Math.floor(x*f),sc=(b,v)=>Math.round(b*v/50);

const combos=(a,k)=>k>a.length?[]:k===0?[[]]:[...combos(a.slice(1),k-1).map(c=>[a[0],...c]),...combos(a.slice(1),k)];
function res(k,s){const[t,x]=k.split('|'),L=parseFloat(x),d=s.h-s.a,T=s.h+s.a;
const c=v=>v>0?[1,0]:v===0?[0,1]:[0,0],W=b=>[b?1:0,0];
const as=f=>{if(Math.abs(L*4)%2!==1)return f(L);const a=f(L-.25),b=f(L+.25);return[(a[0]+b[0])/2,(a[1]+b[1])/2]};
switch(t){case'1':return W(d>0);case'X':return W(d===0);case'2':return W(d<0);case'1X':return W(d>=0);case'12':return W(d!==0);case'X2':return W(d<=0);
case'ML1':return W(s.w==='h');case'ML2':return W(s.w==='a');
case'H1':return as(l=>c(d+l));case'H2':return as(l=>c(-d+l));
case'O':return as(l=>c(T-l));case'U':return as(l=>c(l-T));
case'T1O':return as(l=>c(s.h-l));case'T1U':return as(l=>c(l-s.h));case'T2O':return as(l=>c(s.a-l));case'T2U':return as(l=>c(l-s.a));

const MM={'1':1.2,X:1.2,'2':1.2,'1X':1.3,'12':1.3,X2:1.3,ML1:1.2,ML2:1.2,BTS:1.2,CS:3.5,OT:1.2,T1O:1.1,T1U:1.1,T2O:1.1,T2U:1.1};

function mdl(m){if(m.md&&m.mt===TK)return m.md;const hk=m.sp==='hockey',dk=dstr(Date.now()),ef=t=>t.R+(rng(t.n+'f'+dk)()-.5)*8+(rng(t.n+TK)()-.5)*3;

for(let i=0;i<n;i++)for(let j=0;j<n;j++){const p=ph[i]*pa[j];t+=p;if(hk&&i===j)st.push({h:i,a:j,ot:1,w:'h',p:p*q},{h:i,a:j,ot:1,w:'a',p:p*(1-q)});else st.push({h:i,a:j,ot:0,w:i>j?'h':'a',p})}
st.forEach(s=>s.p/=t);m.mt=TK;return m.md={lh,la,eh,ea,st,oc:{}}}

if(w<.004||w>.985)v=null;else{v={f:+((1-c)/w).toFixed(2),o:Math.min(500,Math.max(1.01,+(((1/(1+mg(k)))-c)/w).toFixed(2))),p:w,m:mg(k)};
const key=m.id+'|'+k,h=HI[key]||(HI[key]=[]),l=h[h.length-1];if(!l||l.o!==v.o){h.push({t:Date.now(),o:v.o});if(h.length>30)h.shift()}}o.oc[k]=v}return v}

function modal(){const m=D.by[D.modal],el=$('#modal');if(!m){D.modal=null;el.className='';el.innerHTML='';return}
const old=el.querySelector('.mb2'),sc=old?old.scrollTop:0,mo=mdl(m),G=mkts(m);
el.className='on';el.innerHTML=`<div class="mb2"><div style="display:flex;justify-content:space-between"><b>${esc(m.ln)} · ${tm(m.t)}</b><button class="x" data-act="close">✕</button></div><h2>${esc(m.h.n)} — ${esc(m.a.n)}</h2>${m.st!=='pre'&&!m.void?`<div class="sc">${m.h.sc} : ${m.a.sc} ${m.st==='in'?'· '+esc(m.clk||''):'· завершён'}</div>`:''}${locked(m)?'<div class="warn">Приём ставок закрыт (матч начался, завершён или перенесён).</div>':''}
${m.stat?`<details open><summary>Статистика (демо)</summary><div>${m.stat.map(s=>`<div class="row"><b>${esc(s[1])}</b><span class="mu">${esc(s[0])}</span><b>${esc(s[2])}</b></div>`).join('')}</div></details>`:''}
${G.map((g,i)=>`<details data-g="g${i}"${D.op.has('g'+i)?' open':''}><summary>${esc(g.n)}</summary><div class="mg" style="grid-template-columns:repeat(${g.c},1fr)">${g.o.map(x=>ob(m,x[0],x[1])).join('')}</div></details>`).join('')}
<details data-g="mdl"${D.op.has('mdl')?' open':''}><summary>Модель, вероятности и маржа</summary><div class="mu">Ожидаемые ${m.sp==='hockey'?'шайбы':'голы'}: ${mo.lh.toFixed(2)} — ${mo.la.toFixed(2)}. Сила с учётом формы: ${mo.eh.toFixed(1)} / ${mo.ea.toFixed(1)}.
${[['1','П1'],['X','Х'],['2','П2']].map(([k,n])=>{const o=od(m,k);return o?`<div class="row"><span>${n}: ${(o.p*100).toFixed(1)}%</span><span>честный ${o.f.toFixed(2)} → ${o.o.toFixed(2)} (маржа ${(o.m*100).toFixed(1)}%)</span></div>`:''}).join('')}
Источник: модель BETAPP, демо-данные. Обновление котировок: каждые 5 минут.</div></details></div>`;
const n=el.querySelector('.mb2');if(n)n.scrollTop=sc}
function head(){$('#bal').textContent=fmt(S.bal);$('#upd').textContent='Демо · МСК '+new Date().toLocaleTimeString('ru-RU',{timeZone:'Europe/Moscow'})}
function render(){$('#nav').innerHTML=TABS.map(([id,ic,n])=>`<a data-act="tab" data-v="${id}" class="${V===id?'on':''}">${ic}<span>${n}${id==='slip'&&S.slip.length?` <i>${S.slip.length}</i>`:''}</span></a>`).join('');
const f=document.activeElement;if(!(f&&(f.id==='stake'||f.id==='mg')))$('#app').innerHTML=VW[V]();head();modal()}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2800)}

/* ---------- купон ---------- */
function place(){const L=S.slip;if(!L.length)return toast('Купон пуст');let ch=0;
for(const l of L){const m=D.by[l.mid];if(!m||locked(m))return toast('Исход недоступен: '+l.h+' — '+l.a);const o=od(m,l.k);if(!o)return toast('Рынок закрыт: '+l.lab);if(o.o!==l.odds){l.odds=o.o;ch=1}}
if(ch){save();render();return toast('Коэффициенты изменились — проверьте купон и подтвердите снова')}
const st=+S.stake;if(!(st>=10))return toast('Минимальная сумма — 10 ₽');
if(S.mode!=='single'&&new Set(L.map(l=>l.mid)).size<L.length)return toast('В экспрессе и системе нельзя брать два исхода одного матча');
if(S.mode==='express'&&L.length<2)return toast('Для экспресса нужно минимум 2 события');
if(S.mode==='system'&&(L.length<3||S.k<2||S.k>=L.length))return toast('Для системы нужно 3+ события и размер комбинации меньше их числа');
const c=calc();if(c.tot>S.bal+1e-9)return toast('Недостаточно средств на балансе');
const mk=(ty,legs,stake,pot,k)=>({id:S.bets.reduce((a,b)=>Math.max(a,b.id),0)+1,t:Date.now(),ty,stake,pot:Math.round(pot*100)/100,k,st:'open',legs:legs.map(l=>({...l,f:null}))});
if(S.mode==='single')L.forEach(l=>S.bets.push(mk('single',[l],st,st*l.odds)));else S.bets.push(mk(S.mode,L,st,c.pot,S.k));
S.bal-=c.tot;S.led.unshift({t:Date.now(),y:'stake',a:-c.tot,n:S.mode==='single'?L.length+' одинар(ов)':S.mode==='express'?'экспресс':'система'});S.slip=[];save();toast('Пари принято');V='bets';render()}

/* ---------- события ---------- */
document.addEventListener('click',e=>{if(e.target.id==='modal'){D.modal=null;render();return}
const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,v=el.dataset.v;
switch(a){case'tab':V=v;render();scrollTo(0,0);break;case'day':D.day=v;render();break;case'hf':D.hf=v;render();break;
case'open':D.modal=el.dataset.m;D.op=new Set(['g0','g1']);render();break;case'close':D.modal=null;render();break;
case'pick':{const m=D.by[el.dataset.m],k=el.dataset.k,i=S.slip.findIndex(l=>l.mid===m.id&&l.k===k);if(i>=0)S.slip.splice(i,1);else{const o=od(m,k);if(locked(m)||!o)return;S.slip.push({mid:m.id,k,lab:labelOf(m,k),odds:o.o,sp:m.sp,h:m.h.n,a:m.a.n,t:m.t})}save();render();break}
case'rm':S.slip.splice(+el.dataset.i,1);save();render();break;case'clear':S.slip=[];save();render();break;
case'mode':S.mode=v;save();render();break;case'place':place();break;
case'reset':if(confirm('Сбросить баланс до 100 000 ₽? История пари сохранится.')){const d=100000-S.bal;S.bal=100000;S.led.unshift({t:Date.now(),y:'reset',a:d,n:'Восстановление баланса'});save();render();toast('Баланс восстановлен')}break;
case'wipe':if(confirm('Удалить все данные: баланс, пари, историю?')){localStorage.removeItem('betapp2');localStorage.removeItem('betapp_h2');location.reload()}break}});
document.addEventListener('toggle',e=>{const g=e.target.dataset&&e.target.dataset.g;if(g){e.target.open?D.op.add(g):D.op.delete(g)}},true);
document.addEventListener('input',e=>{if(e.target.id==='stake'){S.stake=+e.target.value;save();$('#sum').innerHTML=sumHtml(calc())}});
document.addEventListener('change',e=>{if(e.target.id==='k'){S.k=+e.target.value;save();render()}
if(e.target.id==='mg'){S.mg=Math.min(25,Math.max(0,+e.target.value))/5;D.m.forEach(m=>{if(m.md)m.md.oc={}});S.slip.forEach(l=>{const m=D.by[l.mid],o=m&&od(m,l.k);if(o)l.odds=o.o});save();render()}});

/* ---------- цикл: каждую секунду ---------- */
setInterval(()=>{sec++;daily();if(dstr(Date.now())!==D.d0){init();settle();render();return}
let fl=0;D.m.forEach(m=>{if(upd(m))fl=1});const tk=Math.floor(Date.now()/3e5);if(tk!==TK){TK=tk;fl=1}
if(fl)settle();head();if(fl||(sec%5===0&&D.m.some(m=>m.st==='in')))render()},1000);
init();settle();render();
</script>
</body>
</html>
