<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenBet — Live Betting Simulator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0a14;
    --bg2: #12121f;
    --card: #1a1a2e;
    --border: #2a2a45;
    --text: #fff;
    --muted: #888;
    --accent: #7b5cff;
    --accent2: #00d4ff;
    --green: #00e676;
    --red: #ff3860;
    --gold: #ffb800;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 20% 0%, rgba(123,92,255,.15), transparent 50%),
      radial-gradient(circle at 80% 100%, rgba(0,212,255,.1), transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  /* HEADER */
  header {
    background: rgba(10,10,20,.9);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
    padding: 14px 24px;
  }
  .header-inner {
    max-width: 1280px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }
  .logo {
    font-size: 20px;
    font-weight: 900;
    white-space: nowrap;
  }
  .logo span {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .balance {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 10px 18px;
    border-radius: 12px;
    font-weight: 800;
    font-size: 15px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .balance .icon { font-size: 16px; }
  .balance .reset {
    font-size: 11px;
    color: var(--muted);
    font-weight: 500;
    margin-left: 6px;
  }
  .nav {
    display: flex;
    gap: 4px;
  }
  .nav button {
    background: transparent;
    border: none;
    color: var(--muted);
    padding: 8px 14px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 700;
    font-size: 13px;
    font-family: inherit;
    transition: .2s;
  }
  .nav button:hover, .nav button.active {
    color: #fff;
    background: var(--card);
  }

  /* LAYOUT */
  .container {
    max-width: 1280px;
    margin: 0 auto;
    padding: 24px;
    position: relative;
    z-index: 1;
  }

  /* FILTERS */
  .filters {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .filter {
    padding: 10px 18px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    font-weight: 700;
    color: var(--muted);
    font-size: 13px;
    font-family: inherit;
    transition: .2s;
  }
  .filter:hover, .filter.active {
    color: #fff;
    border-color: var(--accent);
    background: rgba(123,92,255,.1);
  }

  /* MATCHES */
  .match {
    background: linear-gradient(180deg, var(--card), var(--bg2));
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 10px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 16px;
    align-items: center;
    transition: .2s;
  }
  .match:hover { border-color: #3a3a55; }
  .match.finished { opacity: .55; }

  .match-info { min-width: 0; }
  .match-top {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .match-league {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .5px;
    font-weight: 700;
  }
  .badge {
    font-size: 9px;
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .5px;
  }
  .badge.live {
    background: var(--red);
    color: #fff;
    animation: pulse 1.5s infinite;
  }
  .badge.finished {
    background: #333;
    color: #888;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .5; }
  }
  .sport-icon {
    font-size: 14px;
  }

  .teams {
    font-weight: 700;
    font-size: 15px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .score {
    color: var(--green);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .minute {
    font-size: 11px;
    color: var(--muted);
    font-weight: 600;
  }

  .momentum-bar {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    margin-top: 8px;
    overflow: hidden;
    position: relative;
  }
  .momentum-bar::after {
    content: '';
    position: absolute;
    left: 50%;
    top: 0;
    height: 100%;
    width: 2px;
    background: var(--muted);
    transform: translateX(-50%);
  }
  .momentum-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--red), var(--green));
    transition: .5s;
  }

  /* ODDS */
  .odds {
    display: flex;
    gap: 6px;
  }
  .odds-btn {
    min-width: 76px;
    background: #0f0f1a;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 6px;
    text-align: center;
    cursor: pointer;
    transition: .2s;
    color: #fff;
    font-family: inherit;
    font-variant-numeric: tabular-nums;
  }
  .odds-btn:hover:not(:disabled) {
    border-color: var(--accent);
    background: var(--card);
    transform: translateY(-1px);
  }
  .odds-btn:disabled {
    opacity: .3;
    cursor: not-allowed;
  }
  .odds-label {
    font-size: 10px;
    color: var(--muted);
    margin-bottom: 2px;
    font-weight: 600;
  }
  .odds-value {
    font-size: 15px;
    font-weight: 800;
    color: var(--accent2);
    transition: color .3s;
  }
  .odds-btn.up .odds-value { color: var(--green); }
  .odds-btn.down .odds-value { color: var(--red); }

  .flash-up { animation: flashGreen .8s; }
  .flash-down { animation: flashRed .8s; }
  @keyframes flashGreen {
    0% { background: rgba(0,230,118,.25); }
    100% { background: #0f0f1a; }
  }
  @keyframes flashRed {
    0% { background: rgba(255,56,96,.25); }
    100% { background: #0f0f1a; }
  }

  /* HISTORY */
  .history-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 8px;
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 12px;
    align-items: center;
  }
  .history-item.won { border-left: 3px solid var(--green); }
  .history-item.lost { border-left: 3px solid var(--red); }
  .history-item.pending { border-left: 3px solid var(--gold); }
  .history-main { min-width: 0; }
  .history-match { font-weight: 700; font-size: 13px; margin-bottom: 2px; }
  .history-meta { font-size: 11px; color: var(--muted); }
  .history-stake { text-align: right; }
  .history-stake .amount { font-weight: 800; font-size: 14px; }
  .history-stake .odd { font-size: 11px; color: var(--accent2); font-weight: 700; }
  .history-status {
    font-weight: 800;
    font-size: 13px;
    padding: 4px 10px;
    border-radius: 6px;
    text-transform: uppercase;
    letter-spacing: .5px;
    font-size: 10px;
  }
  .history-status.won { background: rgba(0,230,118,.15); color: var(--green); }
  .history-status.lost { background: rgba(255,56,96,.15); color: var(--red); }
  .history-status.pending { background: rgba(255,184,0,.15); color: var(--gold); }

  /* STATS */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
  }
  .stat-label {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
    font-weight: 600;
  }
  .stat-value {
    font-size: 24px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .stat-value.green { color: var(--green); }
  .stat-value.red { color: var(--red); }
  .stat-value.gold { color: var(--gold); }

  /* MODAL */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.8);
    backdrop-filter: blur(6px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 16px;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: linear-gradient(180deg, var(--card), var(--bg2));
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 28px;
    max-width: 420px;
    width: 100%;
    animation: popIn .25s cubic-bezier(.5,1.5,.5,1);
    position: relative;
  }
  @keyframes popIn {
    from { transform: scale(.9); opacity: 0; }
  }
  .modal h3 {
    font-size: 18px;
    margin-bottom: 6px;
  }
  .modal .sub {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 20px;
  }
  .modal .row {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .modal .row:last-of-type { border-bottom: none; }
  .modal .row .label { color: var(--muted); }
  .modal .row .value { font-weight: 700; }
  .modal input {
    width: 100%;
    background: #0f0f1a;
    border: 1px solid var(--border);
    color: #fff;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 16px;
    margin: 16px 0;
    font-family: inherit;
    font-weight: 700;
  }
  .modal input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .quick-stakes {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .quick-stake {
    flex: 1;
    min-width: 60px;
    padding: 8px;
    background: #0f0f1a;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: .2s;
  }
  .quick-stake:hover {
    border-color: var(--accent);
    background: var(--card);
  }
  .modal-actions {
    display: flex;
    gap: 8px;
    margin-top: 20px;
  }
  .btn {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: none;
    font-weight: 800;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    transition: .2s;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    box-shadow: 0 6px 20px rgba(123,92,255,.35);
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(123,92,255,.5); }
  .btn-primary:disabled { opacity: .4; cursor: not-allowed; transform: none; }
  .btn-secondary {
    background: #0f0f1a;
    color: #fff;
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { border-color: var(--accent); }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--card);
    border: 1px solid var(--border);
    padding: 12px 20px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 13px;
    z-index: 2000;
    transition: transform .3s cubic-bezier(.5,1.5,.5,1);
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
    max-width: 90%;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { border-color: var(--green); }
  .toast.error { border-color: var(--red); }

  /* LIVE DROPS */
  .live-drops {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 8px;
    margin-bottom: 20px;
  }
  .live-drops::-webkit-scrollbar { height: 6px; }
  .live-drops::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .drop {
    min-width: 120px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    font-size: 12px;
    animation: slideIn .4s;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(30px); }
  }
  .drop-match {
    font-weight: 700;
    margin-bottom: 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .drop-event { color: var(--green); font-size: 11px; font-weight: 700; }

  /* EMPTY */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .empty .icon { font-size: 48px; margin-bottom: 12px; }

  /* TABS */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* RESPONSIVE */
  @media (max-width: 720px) {
    .nav button { padding: 6px 10px; font-size: 12px; }
    .logo { font-size: 16px; }
    .balance { padding: 8px 12px; font-size: 13px; }
    .balance .reset { display: none; }
    .match {
      grid-template-columns: 1fr;
      gap: 12px;
    }
    .odds { justify-content: stretch; }
    .odds-btn { flex: 1; min-width: 0; }
    .container { padding: 16px; }
    .header-inner { padding: 0; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">⚡ Open<span>Bet</span></div>
    <nav class="nav">
      <button class="active" data-tab="line">📊 Линия</button>
      <button data-tab="history">📜 История</button>
      <button data-tab="stats">📈 Стата</button>
    </nav>
    <div class="balance">
      <span class="icon">💰</span>
      <span id="balance">20 000</span> ₽
      <span class="reset">/ день</span>
    </div>
  </div>
</header>

<div class="container">

  <!-- LIVE DROPS -->
  <div class="live-drops" id="liveDrops"></div>

  <!-- LINE TAB -->
  <div class="tab-content active" id="tab-line">
    <div class="filters">
      <button class="filter active" data-sport="all">🔥 Все</button>
      <button class="filter" data-sport="football">⚽ Футбол</button>
      <button class="filter" data-sport="hockey">🏒 Хоккей</button>
      <button class="filter" data-sport="ufc">🥊 UFC</button>

    <div id="matches"></div>
  </div>

  <!-- HISTORY TAB -->
  <div class="tab-content" id="tab-history">

  </div>

  <!-- STATS TAB -->
  <div class="tab-content" id="tab-stats">
    <div class="stats-grid" id="statsGrid"></div>
  </div>

</div>

<!-- BET MODAL -->
<div class="modal-overlay" id="betModal">
  <div class="modal">
    <h3 id="betModalTitle">Ставка</h3>
    <p class="sub" id="betModalSub"></p>
    <div class="row">
      <span class="label">Коэффициент</span>
      <span class="value" id="betModalOdd">—</span>
    </div>
    <div class="row">
      <span class="label">Потенциальный выигрыш</span>
      <span class="value" id="betModalPotential" style="color: var(--green)">—</span>
    </div>
    <input type="number" id="betModalStake" placeholder="Сумма ставки" min="10" step="10">
    <div class="quick-stakes">
      <button class="quick-stake" data-stake="100">100 ₽</button>
      <button class="quick-stake" data-stake="500">500 ₽</button>
      <button class="quick-stake" data-stake="1000">1 000 ₽</button>
      <button class="quick-stake" data-stake="5000">5 000 ₽</button>
      <button class="quick-stake" data-stake="all">MAX</button>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeBetModal()">Отмена</button>
      <button class="btn btn-primary" id="betModalConfirm">Поставить</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================

const FOOTBALL_TEAMS = [

const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const pick = (arr) => arr[rand(0, arr.length - 1)];
const pickTwo = (arr) => {
  let a = pick(arr), b = pick(arr);
  while (a.name === b.name) b = pick(arr);
  return [a, b];
};

function poisson(k, lambda) {
  if (lambda <= 0) return k === 0 ? 1 : 0;
  let fact = 1;
  for (let i = 2; i <= k; i++) fact *= i;
  return Math.pow(lambda, k) * Math.exp(-lambda) / fact;
}

function toOdds(p, margin = 0.06) {
  if (p <= 0) return 999;
  const raw = 1 / (p * (1 + margin));
  return Math.round(raw * 100) / 100;
}

function resetWalletIfNewDay() {
  const today = todayKey();
  if (wallet.lastReset !== today) {
    wallet.balance = wallet.dailyLimit;
    wallet.lastReset = today;
    localStorage.setItem('openbet_wallet', JSON.stringify(wallet));
    showToast('💰 Новый день — баланс пополнен на 20 000 ₽', 'success');
  }
}

function loadWallet() {

      wallet = { ...wallet, ...parsed };

    scoreHome: 0,

    minute: 0,
    maxMinute: 90,

}

function createHockeyMatch() {
  const [home, away] = pickTwo(HOCKEY_TEAMS);
  return {
    id: nextId++,
    sport: 'hockey',
    league: home.league,
    home: home.name,
    away: away.name,
    homeAttack: home.attack / 3,
    awayAttack: away.attack / 3,
    homeDefense: home.defense / 3,
    awayDefense: away.defense / 3,
    scoreHome: 0,
    scoreAway: 0,
    minute: 0,
    maxMinute: 60,
    status: 'live',

  };
}

function createUFCMatch() {
  const [home, away] = pickTwo(UFC_FIGHTERS);
  return {
    id: nextId++,
    sport: 'ufc',
    league: `UFC · ${home.division}`,
    home: home.name,
    away: away.name,
    homeRating: home.rating,
    awayRating: away.rating,
    scoreHome: 0,
    scoreAway: 0,
    minute: 0,
    maxMinute: 25,
    round: 1,
    status: 'live',
    momentum: 0,
  };
}

function createMatches(count = 15) {
  const list = [];
  for (let i = 0; i < count; i++) {
    const r = Math.random();
    if (r < 0.55) list.push(createFootballMatch());
    else if (r < 0.85) list.push(createHockeyMatch());
    else list.push(createUFCMatch());
  }
  return list;
}

// ============================================================
// КОЭФФИЦИЕНТЫ
// ============================================================

function computeOdds(m) {
  if (m.sport === 'ufc') {
    const diff = m.homeRating - m.awayRating;
    let pHome = 1 / (1 + Math.pow(10, -diff / 400));
    pHome = Math.max(0.05, Math.min(0.95, pHome));
    return {
      home: toOdds(pHome, 0.06),
      away: toOdds(1 - pHome, 0.06),
      draw: null,
    };
  }

  const remaining = Math.max(0, m.maxMinute - m.minute);
  let lambdaHome = m.homeAttack * (remaining / m.maxMinute);
  let lambdaAway = m.awayAttack * (remaining / m.maxMinute);

  lambdaHome *= (1 + m.momentum * 0.3);
  lambdaAway *= (1 - m.momentum * 0.3);

  let pHome = 0, pDraw = 0, pAway = 0;
  for (let h = 0; h <= 8; h++) {
    for (let a = 0; a <= 8; a++) {
      const p = poisson(h, lambdaHome) * poisson(a, lambdaAway);
      const fh = m.scoreHome + h;
      const fa = m.scoreAway + a;
      if (fh > fa) pHome += p;
      else if (fh === fa) pDraw += p;
      else pAway += p;
    }
  }
  const total = pHome + pDraw + pAway || 1;
  pHome /= total;
  pDraw /= total;
  pAway /= total;

  if (m.sport === 'hockey') {
    const t = pHome + pAway || 1;
    return {
      home: toOdds(pHome / t, 0.055),
      away: toOdds(pAway / t, 0.055),
      draw: null,
    };
  }
  return {
    home: toOdds(pHome),
    draw: toOdds(pDraw),
    away: toOdds(pAway),
  };
}

// ============================================================
// СИМУЛЯЦИЯ
// ============================================================

function tickMatch(m) {
  m.minute += 1;
  m.momentum *= 0.95;

  if (m.sport === 'ufc') {
    if (m.minute % 5 === 0) m.round = Math.min(5, m.round + 1);
    // "Урон" — рандомные очки для momentum
    if (Math.random() < 0.15) {
      if (Math.random() < 0.5) {
        m.momentum = Math.min(1, m.momentum + 0.3);
        m.scoreHome += 1;
      } else {
        m.momentum = Math.max(-1, m.momentum - 0.3);
        m.scoreAway += 1;
      }
    }
    if (m.minute >= m.maxMinute) m.status = 'finished';
    return;
  }

  if (m.minute >= m.maxMinute) {
    m.status = 'finished';
    return;
  }

  const goalChance = m.sport === 'football' ? 0.035 : 0.05;
  const adjusted = goalChance + Math.abs(m.momentum) * 0.02;

  if (Math.random() < adjusted) {
    const homeScores = Math.random() < (0.55 + m.momentum * 0.1);
    if (homeScores) {
      m.scoreHome += 1;
      m.momentum = Math.min(1, m.momentum + 0.3);
      addLiveDrop(m, 'home');
    } else {
      m.scoreAway += 1;
      m.momentum = Math.max(-1, m.momentum - 0.3);
      addLiveDrop(m, 'away');
    }
  }
}

function addLiveDrop(m, side) {
  liveDrops.unshift({
    match: `${m.home} — ${m.away}`,
    event: side === 'home' ? `⚽ ${m.home}` : `⚽ ${m.away}`,
    sport: m.sport,
    id: Date.now() + Math.random(),
  });
  if (liveDrops.length > 15) liveDrops.pop();
}

// РЕНДЕР
// ============================================================

const $ = (id) => document.getElementById(id);

function formatMoney(v) {
  return Math.round(v).toLocaleString('ru-RU');
}

function renderBalance() {
  $('balance').textContent = formatMoney(wallet.balance);
}

function sportIcon(sport) {
  return sport === 'football' ? '⚽' : sport === 'hockey' ? '🏒' : '🥊';
}

function renderMatches() {
  const filtered = currentFilter === 'all'
    ? matches
    : matches.filter(m => m.sport === currentFilter);

  const el = $('matches');
  if (!filtered.length) {
    el.innerHTML = `<div class="empty"><div class="icon">🎯</div>Матчей нет</div>`;
    return;
  }

  el.innerHTML = filtered.map(m => {
    const odds = computeOdds(m);
    const isFinished = m.status === 'finished';
    const momentumLeft = m.momentum > 0 ? 50 + m.momentum * 50 : 50;
    const momentumWidth = Math.abs(m.momentum) * 50;

    return `
      <div class="match ${isFinished ? 'finished' : ''}">
        <div class="match-info">
          <div class="match-top">
            <span class="sport-icon">${sportIcon(m.sport)}</span>
            <span class="match-league">${m.league}</span>
            ${isFinished
              ? '<span class="badge finished">Завершён</span>'
              : '<span class="badge live">LIVE</span>'}
          </div>
          <div class="teams">
            <span>${m.home}</span>
            <span class="score">${m.scoreHome}:${m.scoreAway}</span>
            <span>${m.away}</span>
            ${!isFinished ? `<span class="minute">${m.minute}'${m.sport === 'ufc' ? ` · R${m.round}` : ''}</span>` : ''}
          </div>
          ${m.sport !== 'ufc' ? `
            <div class="momentum-bar">
              <div class="momentum-fill" style="width: ${momentumWidth}%; margin-left: ${m.momentum > 0 ? '50%' : (50 - momentumWidth) + '%'}"></div>
            </div>
          ` : ''}
        </div>
        <div class="odds">
          ${renderOddsBtn(m.id, 'home', '1', odds.home, isFinished)}
          ${odds.draw !== null ? renderOddsBtn(m.id, 'draw', 'X', odds.draw, isFinished) : ''}
          ${renderOddsBtn(m.id, 'away', '2', odds.away, isFinished)}
        </div>
      </div>
    `;
  }).join('');
}

function renderOddsBtn(matchId, pickKey, label, value, disabled) {
  const key = `${matchId}-${pickKey}`;
  const prev = previousOdds[key];
  let flashClass = '';
  let arrow = '';
  if (prev !== undefined && prev !== value) {
    if (value > prev) { flashClass = 'flash-up'; arrow = '↑'; }
    else { flashClass = 'flash-down'; arrow = '↓'; }
  }
  previousOdds[key] = value;

  return `
    <button class="odds-btn ${flashClass}" 
            ${disabled ? 'disabled' : ''} 
            onclick="openBetModal(${matchId}, '${pickKey}', ${value})">
      <div class="odds-label">${label} ${arrow}</div>
      <div class="odds-value">${value.toFixed(2)}</div>
    </button>
  `;
}

function renderLiveDrops() {
  const el = $('liveDrops');
  if (!liveDrops.length) {
    el.innerHTML = '';
    return;
  }
  el.innerHTML = liveDrops.map(d => `
    <div class="drop">
      <div class="drop-match">${d.match}</div>
      <div class="drop-event">${d.event}</div>
    </div>
  `).join('');
}

function renderHistory() {
  const el = $('history');
  if (!wallet.bets.length) {
    el.innerHTML = `<div class="empty"><div class="icon">📜</div>Ставок пока нет</div>`;
    return;
  }
  el.innerHTML = wallet.bets.map(b => `
    <div class="history-item ${b.status}">
      <div class="history-main">
        <div class="history-match">${b.match}</div>
        <div class="history-meta">
          ${b.pick === 'home' ? '1' : b.pick === 'draw' ? 'X' : '2'} 
          · ${new Date(b.createdAt).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' })}
        </div>
      </div>
      <div class="history-stake">
        <div class="amount">${formatMoney(b.stake)} ₽</div>
        <div class="odd">@ ${b.odd.toFixed(2)}</div>
      </div>
      <div class="history-status ${b.status}">
        ${b.status === 'won' ? `+${formatMoney(b.payout)}` : 
          b.status === 'lost' ? `-${formatMoney(b.stake)}` : 'ожидание'}
      </div>
    </div>
  `).join('');
}

function renderStats() {
  const won = wallet.bets.filter(b => b.status === 'won').length;
  const lost = wallet.bets.filter(b => b.status === 'lost').length;
  const pending = wallet.bets.filter(b => b.status === 'pending').length;
  const total = won + lost;
  const winrate = total ? ((won / total) * 100).toFixed(1) : '0.0';
  const profit = wallet.totalWon - wallet.totalBet;
  const roi = wallet.totalBet ? ((profit / wallet.totalBet) * 100).toFixed(1) : '0.0';

  const el = $('statsGrid');
  el.innerHTML = `
    <div class="stat">
      <div class="stat-label">Баланс</div>
      <div class="stat-value gold">${formatMoney(wallet.balance)} ₽</div>
    </div>
    <div class="stat">
      <div class="stat-label">Поставлено всего</div>
      <div class="stat-value">${formatMoney(wallet.totalBet)} ₽</div>
    </div>
    <div class="stat">
      <div class="stat-label">Выиграно</div>
      <div class="stat-value green">${formatMoney(wallet.totalWon)} ₽</div>
    </div>
    <div class="stat">
      <div class="stat-label">Профит</div>
      <div class="stat-value ${profit >= 0 ? 'green' : 'red'}">
        ${profit >= 0 ? '+' : ''}${formatMoney(profit)} ₽
      </div>
    </div>
    <div class="stat">
      <div class="stat-label">Винрейт</div>
      <div class="stat-value">${winrate}%</div>
    </div>
    <div class="stat">
      <div class="stat-label">ROI</div>
      <div class="stat-value ${parseFloat(roi) >= 0 ? 'green' : 'red'}">${roi}%</div>
    </div>
    <div class="stat">
      <div class="stat-label">Ставок всего</div>
      <div class="stat-value">${wallet.bets.length}</div>
    </div>
    <div class="stat">
      <div class="stat-label">В ожидании</div>
      <div class="stat-value gold">${pending}</div>
    </div>
  `;
}

// СТАВКИ
// ============================================================

function openBetModal(matchId, pickKey, odd) {
  const m = matches.find(x => x.id === matchId);
  if (!m || m.status === 'finished') return;

  activeBet = { matchId, pick: pickKey, odd };

  $('betModalTitle').textContent = `${m.home} — ${m.away}`;
  $('betModalSub').textContent = 
    `${pickKey === 'home' ? m.home : pickKey === 'away' ? m.away : 'Ничья'} · ${m.scoreHome}:${m.scoreAway} · ${m.minute}'`;
  $('betModalOdd').textContent = odd.toFixed(2);
  $('betModalStake').value = '';
  $('betModalPotential').textContent = '—';
  $('betModal').classList.add('active');

  updatePotential();
}

function closeBetModal() {
  $('betModal').classList.remove('active');
  activeBet = null;
}

function updatePotential() {
  if (!activeBet) return;
  const stake = parseFloat($('betModalStake').value) || 0;
  const potential = stake * activeBet.odd;
  $('betModalPotential').textContent = potential > 0 ? `${formatMoney(potential)} ₽` : '—';
}

function placeBet() {
  if (!activeBet) return;
  const stake = parseFloat($('betModalStake').value);

  if (!stake || stake < 10) {
    showToast('❌ Минимальная ставка 10 ₽', 'error');
    return;
  }
  if (stake > wallet.balance) {
    showToast('❌ Недостаточно средств', 'error');
    return;
  }

  const m = matches.find(x => x.id === activeBet.matchId);
  if (!m || m.status === 'finished') {
    showToast('❌ Матч закрыт', 'error');
    closeBetModal();
    return;
  }

  wallet.balance -= stake;
  wallet.totalBet += stake;

  wallet.bets.unshift({
    id: Date.now(),
    matchId: m.id,
    match: `${m.home} — ${m.away}`,
    sport: m.sport,
    pick: activeBet.pick,
    odd: activeBet.odd,
    stake,
    potential: Math.round(stake * activeBet.odd * 100) / 100,
    status: 'pending',
    minute: m.minute,
    score: `${m.scoreHome}:${m.scoreAway}`,
    createdAt: new Date().toISOString(),
  });

  saveWallet();
  renderBalance();
  renderHistory();
  renderStats();

  showToast(`✅ Ставка ${formatMoney(stake)} ₽ принята @ ${activeBet.odd.toFixed(2)}`, 'success');
  closeBetModal();
}

// ============================================================
// РАСЧЁТ ЗАВЕРШЁННЫХ СТАВОК
// ============================================================

function settleBets() {
  let changed = false;
  wallet.bets.forEach(b => {
    if (b.status !== 'pending') return;
    const m = matches.find(x => x.id === b.matchId);
    if (!m || m.status !== 'finished') return;

    let winner;
    if (m.scoreHome > m.scoreAway) winner = 'home';
    else if (m.scoreHome < m.scoreAway) winner = 'away';
    else winner = 'draw';

    if (b.pick === winner) {
      b.status = 'won';
      b.payout = Math.round(b.stake * b.odd * 100) / 100;
      wallet.balance += b.payout;
      wallet.totalWon += b.payout;
      showToast(`🎉 Выигрыш! ${b.match} · +${formatMoney(b.payout)} ₽`, 'success');
    } else {
      b.status = 'lost';
    }
    changed = true;
  });
  if (changed) {
    saveWallet();
    renderBalance();
    renderHistory();
    renderStats();
  }
}

// ============================================================
// ГЛАВНЫЙ ЦИКЛ
// ============================================================

function tick() {
  resetWalletIfNewDay();

  matches.forEach(m => {
    if (m.status === 'live') tickMatch(m);
  });

  // Заменяем завершённые матчи новыми (чтобы линия всегда жила)
  matches = matches.map(m => {
    if (m.status === 'finished') {
      // Небольшая задержка прежде чем заменить
      if (!m.finishedAt) m.finishedAt = Date.now();
      if (Date.now() - m.finishedAt > 8000) {
        const r = Math.random();
        if (r < 0.55) return createFootballMatch();
        if (r < 0.85) return createHockeyMatch();
        return createUFCMatch();
      }
    }
    return m;
  });

  settleBets();
  renderMatches();
  renderLiveDrops();
}

function showToast(text, type = 'success') {
  const el = $('toast');
  el.textContent = text;
  el.className = `toast ${type} show`;
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 3000);
}

    document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

    if (btn.dataset.tab === 'stats') renderStats();

document.querySelectorAll('.filter').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.filter').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.sport;
    renderMatches();
  };
});

// Modal

document.querySelectorAll('.quick-stake').forEach(btn => {
