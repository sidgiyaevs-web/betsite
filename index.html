    nx(){const e=getEv(CE),l=evs().filter(x=>x.L.n===e.L.n),i=l.findIndex(x=>x.k===CE);if(l.length>1)openMatch(l[(i+1)%l.length].k)},
    mtab(d){MT=d.v;MST=0;MSO=0;OVV=0;mpTick()},
    srch(){MSO=!MSO;mpTick();if(MSO&&$('#msq'))$('#msq').focus()},
    stat(){MST=!MST;mpTick()},
    bmf(){MBO=!MBO;mpTick()},
    ovv(d){OVV=+d.v;mpTick()},
    mk(d){COL[d.id]=d.d?0:1;mpTick()},
    bm(d){BM.has(d.t)?BM.delete(d.t):BM.add(d.t);U.bm=[...BM];saveDB();mpTick()},
    line(d){TLN[d.k]=d.v;mpTick();},
    seg(d){TLN[d.k]=+d.v;mpTick()},
    bell(){HID.has('bell'+CE)?HID.delete('bell'+CE):HID.add('bell'+CE);mpTick()},
    favm(){FAV.has(CE)?FAV.delete(CE):FAV.add(CE);U.favs=[...FAV];saveDB();renderList();mpTick()},
    odd(d){
        const e=getEv(d.ek);if(!e)return;const st=state(e);if(lockR(e,st)||st.fin)return toast('Приём ставок приостановлен',0);
        const p=price(e,st,d.key);if(!p.o)return toast('Рынок недоступен',0);
        const i=SLP.findIndex(b=>b.ek===d.ek&&b.key===d.key);if(i>=0){SLP.splice(i,1);toast('Убрано из купона')}
        else{const g=grp(d.key),c=SLP.find(b=>b.ek===d.ek&&grp(b.key)===g);if(c){c.key=d.key;c.odds=p.o;c.lab=lab(e,d.key);c.n0=(d.key.split('|')[2]?+d.key.split('|')[2]:0);toast('Исход заменён')}
        else{const n0=/^cs\|/.test(d.key)?parseInt(d.key.split('|')[2].split('-')[0]+d.key.split('|')[2].split('-')[1]):0;SLP.push({ek:d.ek,key:d.key,odds:p.o,lab:lab(e,d.key),h:e.h.n,a:e.a.n,n0})}}
        if(SLP.length>1&&SM==='ex'&&new Set(SLP.map(x=>x.ek)).size<SLP.length){SM='sg';toast('Разные исходы одного матча — включены одинары')}
        renderTop();mpTick();if($('#slip').classList.contains('on'))slipTick(1)
    },
    slipopen(){slipOpen()},
    slipclose(){$('#slip').classList.remove('on')},
    rm(d){SLP.splice(+d.i,1);renderTop();slipTick(1);mpTick()},
    smode(){SM=SM==='ex'?'sg':'ex';slipTick(1)},
    usefb(){FBU=!FBU;slipTick(1)},
    q(d){STK=+d.v;slipTick(1)},
    place,
    co(d){const b=H.find(x=>x.id==d.id);if(!b||b.status!=='pending')return;const v=cashVal(b);if(!v)return toast('Кэшаут недоступен',0);
        if(!confirm('Забрать '+money(v)+'?'))return;b.status='cashout';b.paid=v;bal(v);saveDB();toast('💸 Кэшаут: '+money(v));renderPage()
    },
    btab(d){BTAB=+d.v;renderPage()},
    spin,resclose(){$('#res').className=''},
    logout(){localStorage.removeItem('betapp_current');location.reload()},
    srclose(){$('#sr').className='full'},
    srgo(d){$('#sr').className='full';openMatch(d.ek)},
    fab(){openSearch()}
};

/* ================= ЦИКЛ ================= */
let lastT=0,lastSettle=0,lastRender=0;
function tick(){const n=Date.now();TS=Math.floor(n/1000);NOW=n;
 if(n-lastSettle>1000){lastSettle=n;settleAll()}
 if(CE)mpTick();
 if(n-lastRender>700&&(page==='home'||page==='sport'||page==='bets')){lastRender=n;renderList()}
 if(dirty&&n-lastT>400){lastT=n;dirty=0;saveDB();renderList();if(CE)mpTick()}
}
setInterval(tick,500);

/* маршрутизация кликов */
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-act]');if(!t)return;const a=ACT[t.dataset.act];if(!a)return;ev.stopPropagation();a(t.dataset)});
$('#sb').addEventListener('click',submit);
$('#pi').addEventListener('keydown',e=>{if(e.key==='Enter')submit()});
$('#pi2').addEventListener('keydown',e=>{if(e.key==='Enter')submit()});

/* старт */
if(cur&&DB[cur])login(cur);
window.addEventListener('beforeunload',saveDB);
</script>
