<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Арена</title>
<style>
:root{--bg:#0d1b24;--p:#142632;--l:#223a49;--tx:#e9f0f4;--m:#8aa3b3;--ac:#ffb227;--ok:#3ecf8e;--bad:#ff6b6b;--b:#1c3544}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.35 "Trebuchet MS",system-ui,sans-serif;padding-bottom:80px}
#app{max-width:520px;margin:0 auto}
header{position:sticky;top:0;z-index:5;background:var(--p);border-bottom:2px solid var(--ac);padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:20px}.bal{color:var(--ac);font-weight:700}
button{font:inherit;color:var(--tx);background:var(--b);border:1px solid var(--l);border-radius:6px;padding:7px 10px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--p);border-top:1px solid var(--l);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:14px 4px;color:var(--m)}
nav button.on{color:var(--ac);font-weight:700}
nav i{font-style:normal;background:var(--ac);color:#1a1200;border-radius:9px;padding:0 6px;font-size:12px}
.pad{padding:12px}.chips{display:flex;gap:6px;overflow-x:auto;padding:12px}.chips button{white-space:nowrap}
button.on{border-color:var(--ac);color:var(--ac)}
.lg h3{margin:0;padding:8px 14px;background:#102029;font-size:14px;border-top:1px solid var(--l)}
.m{display:flex;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:1px solid var(--l);cursor:pointer}
.tm{flex:1;min-width:0}.tm div{display:flex;justify-content:space-between;gap:6px}
.t{color:var(--m);font-size:13px}.lv{color:var(--bad);font-weight:700}.tm b{color:var(--ac)}
.od{display:flex;gap:4px}
.od button{min-width:54px;padding:6px 2px;text-align:center;font-variant-numeric:tabular-nums;font-weight:700}
button span{display:block;font-size:10px;color:var(--m);font-weight:400}
.mh{padding:14px;background:var(--p)}.mh h2{margin:6px 0}.big{font-size:22px;font-weight:700;color:var(--ac)}
.tabs{display:flex;gap:6px;padding:10px 12px}.tabs button{flex:1}
.bk{margin:0 12px 12px;background:var(--p);border:1px solid var(--l);border-radius:8px;padding:10px}
.bk h3{margin:0 0 8px;font-size:15px}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.g.two{grid-template-columns:1fr 1fr}
.g button{display:flex;justify-content:space-between;padding:10px;font-weight:700;font-variant-numeric:tabular-nums}
.g button span{display:inline;font-size:13px;color:var(--tx);font-weight:400}
.ch{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px}.ch button{flex:0 0 auto}
button.sel{background:var(--ac);color:#1a1200;border-color:var(--ac)}button.sel span{color:#4a3500}
button.up{box-shadow:inset 0 -3px var(--ok)}button.dn{box-shadow:inset 0 -3px var(--bad)}
.leg{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:8px 0;border-bottom:1px solid var(--l);font-size:13px}
.leg b{color:var(--ac)}.leg button{grid-row:span 2;align-self:center}
.row{display:flex;justify-content:space-between;margin:8px 0}
input[type=number],select{width:100%;background:#0a141b;border:1px solid var(--l);color:var(--tx);border-radius:6px;padding:9px;font:inherit}
.quick{display:flex;gap:5px;margin:8px 0}.quick button{flex:1;padding:5px 0}
.go{width:100%;background:var(--ac);color:#1a1200;font-weight:700;border-color:var(--ac);padding:11px}.go:disabled{opacity:.4}
.bet{background:var(--p);border:1px solid var(--l);border-left:4px solid var(--m);border-radius:8px;padding:12px;margin-bottom:10px}
.bet.won{border-left-color:var(--ok)}.bet.lost{border-left-color:var(--bad)}
.hd{display:flex;justify-content:space-between;margin-bottom:6px}.won .st{color:var(--ok)}.lost .st{color:var(--bad)}.pending .st{color:var(--ac)}
.empty{color:var(--m);padding:14px 0}.danger{border-color:var(--bad);color:var(--bad);margin-top:14px}
label{display:block;margin:12px 0 5px;color:var(--m);font-size:13px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ac);color:#1a1200;padding:10px 16px;border-radius:8px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9;max-width:90vw}
#toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body><div id="app">
<header><h1>Арена</h1><div class="bal" id="bal"></div></header>
<main id="view"></main>
<nav><button data-tab="home">Линия</button><button data-tab="cp">Купон <i id="cpn"></i></button><button data-tab="bets">Ставки</button><button data-tab="set">Меню</button></nav>
</div><div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),KEY='arena_v2',DAILY=20000,today=new Date().toISOString().slice(0,10);
let S=JSON.parse(localStorage.getItem(KEY)||'null')||{bal:0,last:'',bets:[],fmt:'dec',stake:100};
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
let tab='home',sport='all',cur=null,mtab=0,mode='single',cp={},stake=S.stake,lines={},prev={};

/* команды (рейтинги условные) */
const LG=[
{id:'khl',sp:'hockey',n:'Хоккей · КХЛ',tot:5.5,teams:{'ЦСКА':88,'СКА':86,'Ак Барс':84,'Локомотив':83,'Металлург Мг':84,'Авангард':82,'Салават Юлаев':80,'Динамо Москва':79,'Спартак':76,'Трактор':77,'Торпедо':75,'Сибирь':70,'Нефтехимик':72,'Автомобилист':78,'Северсталь':73,'Витязь':68,'Амур':66,'Адмирал':65,'Лада':67,'Барыс':71}},
{id:'rpl',sp:'football',n:'Футбол · Россия, Премьер-лига',tot:2.5,teams:{'Зенит':85,'Краснодар':84,'Спартак':78,'ЦСКА':79,'Динамо Москва':80,'Локомотив':79,'Рубин':72,'Ахмат':70,'Крылья Советов':68,'Ростов':70}},
{id:'epl',sp:'football',n:'Футбол · Англия, Премьер-лига',tot:2.5,teams:{'Манчестер Сити':92,'Арсенал':90,'Ливерпуль':89,'Челси':82,'Манчестер Юнайтед':80,'Тоттенхэм':80,'Ньюкасл':79,'Астон Вилла':78,'Лидс':74}},
{id:'vtb',sp:'basket',n:'Баскетбол · Лига ВТБ',tot:158.5,T:158,teams:{'ЦСКА':88,'УНИКС':82,'Зенит':80,'Парма':76,'Локомотив-Кубань':74,'Автодор':70,'МБА':68,'Нижний Новгород':66,'Енисей':64,'Самара':62}},
{id:'nba',sp:'basket',n:'Баскетбол · НБА',tot:224.5,T:224,teams:{'Бостон':90,'Оклахома-Сити':88,'Денвер':86,'Миннесота':83,'Нью-Йорк':82,'Милуоки':82,'Лейкерс':80,'Голден Стэйт':80,'Даллас':80,'Финикс':78,'Филадельфия':77,'Майами':76}}];
const SP=[['all','Всё'],['live','Live'],['football','Футбол'],['hockey','Хоккей'],['basket','Баскетбол']];

/* математика */
const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const poisson=l=>{let L=Math.exp(-l),k=0,p=1;do{k++;p*=Math.random()}while(p>L);return k-1};
const gauss=()=>Math.sqrt(-2*Math.log(1-Math.random()))*Math.cos(2*Math.PI*Math.random());
const pois=(l,n=13)=>{let p=Math.exp(-l),a=[p];for(let k=1;k<n;k++){p*=l/k;a.push(p)}return a};
const Phi=x=>{const t=1/(1+.2316419*Math.abs(x)),d=.3989423*Math.exp(-x*x/2),p=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return x>0?1-p:p};
/* исход рынка при счёте h:a (число от 0 до 1; дробное только для «итоговой победы» при ничьей) */
function test(mk,s,ln,h,a,q){
  if(mk==='1x2')return({'1':h>a,X:h==a,'2':h<a,'1X':h>=a,'12':h!=a,X2:h<=a})[s]?1:0;
  if(mk==='tot')return(s==='O'?h+a>ln:h+a<ln)?1:0;
  if(mk==='hcp')return(s==='1'?h+ln>a:h+ln<a)?1:0;
  return h>a?(s==='1'?1:0):h<a?(s==='2'?1:0):(s==='1'?q:1-q)}
function prob(m,mk,sc,s,ln){
  if(m.L.sp==='basket'){
    if(mk==='tot'){const u=Phi((ln-m.T)/17);return s==='U'?u:1-u}
    const p=Phi((m.mu+(mk==='hcp'?ln:0))/12);return s==='2'?1-p:p}
  const lv=m.live&&sc==='m'?m.live:null,f=sc==='p1'?m.f1:lv?(m.T-lv.min)/m.T:1;
  const ph=pois(m.lh*f),pa=pois(m.la*f),bh=lv?lv.h:0,ba=lv?lv.a:0;let r=0;
  for(let i=0;i<13;i++)for(let j=0;j<13;j++)r+=ph[i]*pa[j]*test(mk,s,ln,bh+i,ba+j,m.q);
  return r}
const odd=(m,mk,sc,s,ln)=>Math.max(1.01,+(1/(Math.max(prob(m,mk,sc,s,ln),.012)*1.06)).toFixed(2));
const fmtN=n=>Math.round(n).toLocaleString('ru-RU');
const fo=o=>S.fmt==='us'?(o>=2?'+'+Math.round((o-1)*100):String(Math.round(-100/(o-1)))):o.toFixed(2);
const sg=n=>(n>0?'+':'')+n;
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),3200)}

/* линия на день */
function build(){
  const R=rng([...today].reduce((a,c)=>a*31+c.charCodeAt(0),7)),out=[];
  LG.forEach(L=>{
    const nm=Object.keys(L.teams);
    for(let i=nm.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[nm[i],nm[j]]=[nm[j],nm[i]]}
    const n=Math.min(L.sp==='hockey'?5:4,nm.length>>1);
    for(let i=0;i<n;i++){
      const h=nm[2*i],a=nm[2*i+1],rh=L.teams[h],ra=L.teams[a],d=(rh-ra)/100;
      const m={id:L.id+i,L,h,a,rh,ra,q:.5+(rh-ra)/200,time:String(12+Math.floor(R()*11)).padStart(2,'0')+':'+['00','15','30','45'][Math.floor(R()*4)]};
      if(L.sp==='hockey'){m.lh=2.9*Math.exp((d+.03)*1.2);m.la=2.9*Math.exp(-(d+.03)*1.2);m.T=60;m.f1=.33}
      else if(L.sp==='football'){m.lh=1.4*Math.exp((d+.04)*1.8);m.la=1.2*Math.exp(-(d+.04)*1.8);m.T=90;m.f1=.45}
      else{m.mu=(rh-ra+2.5)*.9;m.T=L.T}
      if(i===0&&L.sp!=='basket')m.live={min:10+Math.floor(R()*40),h:Math.floor(R()*3),a:Math.floor(R()*2)};
      out.push(m)}});
  return out}
const MATCHES=build();

/* кнопка коэффициента */
function ob(m,mk,sc,s,ln,lab){
  const key=[m.id,mk,sc,s,ln].join('|'),o=odd(m,mk,sc,s,ln),pv=prev[key];prev[key]=o;
  const c=(cp[m.id]&&cp[m.id].key===key?'sel ':'')+(pv&&o>pv?'up':pv&&o<pv?'dn':'');
  return `<button class="${c}" data-o="${key}"><span>${lab}</span>${fo(o)}</button>`}
function pick(key){
  const[id,mk,sc,s,l]=key.split('|'),m=MATCHES.find(x=>x.id===id);
  if(cp[id]&&cp[id].key===key)delete cp[id];else cp[id]={key,m,mk,sc,sel:s,ln:l===''?null:+l}}
function lab(m,mk,sc,s,ln){
  const p=sc==='p1'?(m.L.sp==='hockey'?'1-й период: ':'1-й тайм: '):'';
  const t={'1':m.h,'2':m.a,X:'Ничья','1X':m.h+' или ничья','12':'Победа любой','X2':m.a+' или ничья'};
  if(mk==='tot')return p+'Тотал '+(s==='O'?'больше ':'меньше ')+ln;
  if(mk==='hcp')return 'Фора '+(s==='1'?m.h:m.a)+' ('+sg(s==='1'?ln:-ln)+')';
  return p+(mk==='win'?'Победа с ОТ: ':'')+t[s]}

/* экраны */
function row(m){
  const k=m.L.sp==='basket'?['1','2']:['1','X','2'],lv=m.live;
  return `<div class="m" data-go="${m.id}"><div class="tm"><div class="t">${lv?`<span class="lv">● ${lv.min}'</span>`:m.time}</div>
  <div><span>${m.h}</span>${lv?`<b>${lv.h}</b>`:''}</div><div><span>${m.a}</span>${lv?`<b>${lv.a}</b>`:''}</div></div>
  <div class="od">${k.map(x=>ob(m,'1x2','m',x,'',x==='X'?'Х':x)).join('')}</div></div>`}
function home(){
  let h=`<div class="chips">${SP.map(([k,n])=>`<button data-sp="${k}" class="${sport===k?'on':''}">${n}</button>`).join('')}</div>`;
  LG.forEach(L=>{
    const ms=MATCHES.filter(m=>m.L===L&&(sport==='all'||sport===L.sp||(sport==='live'&&m.live)));
    if(ms.length)h+=`<div class="lg"><h3>${L.n}</h3>${ms.map(row).join('')}</div>`});
  return h}
function matchPage(m){
  const sp=m.L.sp,per=sp==='hockey'?'период':'тайм',lv=m.live;
  let h=`<div class="mh"><button data-back>‹ Назад</button><div class="t" style="margin-top:8px">${m.L.n}</div><h2>${m.h} — ${m.a}</h2>
  <div class="big">${lv?lv.h+':'+lv.a+" · "+lv.min+"'":m.time}</div></div>`;
  const tabs=(!lv&&sp!=='basket')?['Популярное','1-й '+per]:['Популярное'];
  h+=`<div class="tabs">${tabs.map((t,i)=>`<button data-mt="${i}" class="${i==mtab?'on':''}">${t}</button>`).join('')}</div>`;
  const sc=mtab?'p1':'m',bk=(t,b)=>`<div class="bk"><h3>${t}</h3>${b}</div>`;
  if(sp==='basket')h+=bk('Исход',`<div class="g two">${ob(m,'1x2','m','1','',m.h)}${ob(m,'1x2','m','2','',m.a)}</div>`);
  else{
    h+=bk(mtab?'Исход 1-го '+per+'а':'Исход'+(sp==='football'?' (основное время)':''),
      `<div class="g">${[['1','1'],['X','Х'],['2','2'],['1X','1Х'],['12','12'],['X2','Х2']].map(([s,l])=>ob(m,'1x2',sc,s,'',l)).join('')}</div>`);
    if(sp==='hockey'&&!mtab)h+=bk('Итоговая победа (с овертаймом)',`<div class="g two">${ob(m,'win','m','1','',m.h)}${ob(m,'win','m','2','',m.a)}</div>`)}
  /* тотал с выбором линии */
  let arr=sp==='basket'?[-6,-4,-2,0,2,4,6].map(d=>m.L.tot+d):mtab?[.5,1.5,2.5]:(sp==='hockey'?[3.5,4.5,5.5,6.5,7.5]:[.5,1.5,2.5,3.5,4.5]);
  if(lv)arr=arr.map(x=>x+lv.h+lv.a);
  const lk=m.id+'t'+sc,tl=arr.includes(lines[lk])?lines[lk]:arr[arr.length>>1];
  h+=bk(sp==='basket'?'Тотал очков':'Тотал голов',`<div class="ch">${arr.map(l=>`<button data-ln="t${sc}|${l}" class="${l==tl?'on':''}">${l}</button>`).join('')}</div>
    <div class="g two">${ob(m,'tot',sc,'O',tl,'Больше')}${ob(m,'tot',sc,'U',tl,'Меньше')}</div>`);
  /* фора */
  if(!mtab){
    const ha=sp==='basket'?[-9.5,-7.5,-5.5,-3.5,-1.5,1.5,3.5,5.5,7.5,9.5]:sp==='hockey'?[-3.5,-2.5,-1.5,-.5,.5,1.5,2.5,3.5]:[-1.5,-.5,.5,1.5];
    const fair=sp==='basket'?-m.mu:-(m.lh-m.la),hk=m.id+'h',
      hl=ha.includes(lines[hk])?lines[hk]:ha.reduce((b,x)=>Math.abs(x-fair)<Math.abs(b-fair)?x:b);
    h+=bk('Исход с учётом форы',`<div class="ch">${ha.map(l=>`<button data-ln="h|${l}" class="${l==hl?'on':''}">${sg(l)}</button>`).join('')}</div>
      <div class="g two">${ob(m,'hcp','m','1',hl,m.h+' ('+sg(hl)+')')}${ob(m,'hcp','m','2',hl,m.a+' ('+sg(-hl)+')')}</div>`)}
  return h}
const lo=x=>odd(x.m,x.mk,x.sc,x.sel,x.ln);
function couponView(){
  const L=Object.values(cp),n=L.length,tot=L.reduce((a,x)=>a*lo(x),1);
  const cost=mode==='express'?stake:stake*n,win=mode==='express'?stake*tot:L.reduce((a,x)=>a+stake*lo(x),0);
  const bad=!n||stake<1||cost>S.bal||(mode==='express'&&n<2);
  return `<div class="pad"><h2 style="margin-top:0">Купон (${n})</h2>
  <div class="tabs" style="padding:0 0 8px"><button data-mode="single" class="${mode==='single'?'on':''}">Одиночные</button><button data-mode="express" class="${mode==='express'?'on':''}">Экспресс</button></div>
  ${n?L.map(x=>`<div class="leg"><span>${x.m.h} — ${x.m.a}</span><button data-rm="${x.m.id}" aria-label="Убрать">✕</button><span>${lab(x.m,x.mk,x.sc,x.sel,x.ln)} <b>${fo(lo(x))}</b></span></div>`).join(''):'<div class="empty">Нажмите на коэффициент в линии или на странице матча.</div>'}
  <label for="st">Сумма ставки</label><input id="st" type="number" min="1" value="${stake}">
  <div class="quick">${[100,500,1000,5000].map(v=>`<button data-q="${v}">${fmtN(v)}</button>`).join('')}<button data-q="max">Макс</button></div>
  ${mode==='express'&&n>1?`<div class="row"><span>Общий коэффициент</span><b>${fo(tot)}</b></div>`:''}
  <div class="row"><span>Спишется</span><b>${fmtN(cost)}</b></div>
  <div class="row"><span>Возможный выигрыш</span><b style="color:var(--ok)">${fmtN(win)}</b></div>
  <button class="go" id="place" ${bad?'disabled':''}>${mode==='express'&&n<2?'Для экспресса нужно 2+ исхода':cost>S.bal?'Не хватает очков':'Сделать ставку'}</button></div>`}
function betsView(){
  const b=S.bets.slice().reverse();
  return '<div class="pad"><h2 style="margin-top:0">Мои ставки</h2>'+(b.length?b.map(x=>`<div class="bet ${x.status}"><div class="hd"><b>${x.legs.length>1?'Экспресс':'Одиночная'} · ${fo(x.odd)}</b>
  <span class="st">${x.status==='pending'?'Идёт расчёт…':x.status==='won'?'Выигрыш +'+fmtN(x.payout):'Проигрыш'}</span></div>
  ${x.legs.map(l=>`<div class="t">${l.h} — ${l.a}${l.score?' ('+l.score[0]+':'+l.score[1]+')':''}: <span style="color:var(--tx)">${l.name}</span> @ ${fo(l.odd)}${l.res===undefined?'':l.res?' ✔':' ✘'}</div>`).join('')}
  <div class="t" style="margin-top:6px">Ставка ${fmtN(x.stake)} · ${new Date(x.t).toLocaleString('ru-RU')}</div></div>`).join(''):'<div class="empty">Ставок пока нет.</div>')+'</div>'}
function setView(){
  return `<div class="pad"><h2 style="margin-top:0">Меню</h2>
  <label for="fmt">Формат коэффициентов</label><select id="fmt"><option value="dec" ${S.fmt==='dec'?'selected':''}>Десятичный (2.50)</option><option value="us" ${S.fmt==='us'?'selected':''}>Американский (+150)</option></select>
  <label for="dst">Сумма ставки по умолчанию</label><input id="dst" type="number" min="1" value="${S.stake}">
  <p class="t">Каждый день при первом заходе начисляется ${fmtN(DAILY)} виртуальных очков. Данные хранятся только в этом браузере. Вывода нет.</p>
  <button class="danger" id="reset">Сбросить прогресс</button></div>`}
function render(){
  $('#bal').textContent=fmtN(S.bal)+' очков';
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  $('#cpn').textContent=Object.keys(cp).length||'';
  $('#view').innerHTML=tab==='home'?(cur?matchPage(cur):home()):tab==='cp'?couponView():tab==='bets'?betsView():setView()}

/* расчёт ставок */
function simRes(st,sc){
  if(st.sp==='basket'){const tt=st.T+17*gauss(),df=st.mu+12*gauss();let h=Math.round((tt+df)/2),a=Math.round((tt-df)/2);if(h==a)Math.random()<.5?h++:a++;return{h,a}}
  const f=sc==='p1'?st.f1:st.lv?(st.T-st.lv.min)/st.T:1,b=sc==='m'&&st.lv?st.lv:{h:0,a:0};
  return{h:b.h+poisson(st.lh*f),a:b.a+poisson(st.la*f)}}
function settle(b){
  b.legs.forEach(l=>{const r=simRes(l.st,l.sc),v=test(l.mk,l.sel,l.ln,r.h,r.a,l.st.q);l.score=[r.h,r.a];l.res=v===1||(v>0&&v<1&&Math.random()<v)});
  const ok=b.legs.every(l=>l.res);b.status=ok?'won':'lost';b.payout=ok?Math.round(b.stake*b.odd):0;
  if(ok)S.bal+=b.payout;save();toast(ok?'Ставка сыграла! +'+fmtN(b.payout):'Ставка не сыграла');render()}
setInterval(()=>S.bets.filter(b=>b.status==='pending'&&b.settleAt<=Date.now()).forEach(settle),1000);
function place(){
  const L=Object.values(cp);if(!L.length)return;
  const mk=x=>({h:x.m.h,a:x.m.a,mk:x.mk,sc:x.sc,sel:x.sel,ln:x.ln,name:lab(x.m,x.mk,x.sc,x.sel,x.ln),odd:lo(x),
    st:{sp:x.m.L.sp,lh:x.m.lh,la:x.m.la,mu:x.m.mu,T:x.m.T,q:x.m.q,f1:x.m.f1,lv:x.m.live?{...x.m.live}:null}});
  const g=mode==='express'?[L]:L.map(x=>[x]),cost=stake*g.length;if(cost>S.bal)return;
  S.bal-=cost;
  g.forEach((a,i)=>S.bets.push({id:Date.now()+i,t:Date.now(),stake,legs:a.map(mk),odd:a.reduce((p,x)=>p*lo(x),1),status:'pending',settleAt:Date.now()+6000+i*800}));
  cp={};save();toast('Ставка принята, результат через несколько секунд')}

/* live: время идёт, голы падают, коэффициенты меняются */
setInterval(()=>{
  MATCHES.forEach(m=>{const v=m.live;if(!v)return;
    if(++v.min>=m.T){v.min=1;v.h=0;v.a=0}
    if(Math.random()<(m.lh+m.la)/m.T)Math.random()<m.lh/(m.lh+m.la)?v.h++:v.a++});
  if(tab==='home'&&(!cur||cur.live))render()},2500);

/* события */
document.addEventListener('click',e=>{
  const b=e.target.closest('button,[data-go]');if(!b)return;const d=b.dataset;
  if(d.o)pick(d.o);
  else if(d.go){cur=MATCHES.find(x=>x.id===d.go);mtab=0;scrollTo(0,0)}
  else if('back' in d)cur=null;
  else if(d.mt)mtab=+d.mt;
  else if(d.ln){const[k,l]=d.ln.split('|');lines[cur.id+k]=+l}
  else if(d.sp)sport=d.sp;
  else if(d.tab){tab=d.tab;cur=null}
  else if(d.mode)mode=d.mode;
  else if(d.rm)delete cp[d.rm];
  else if(d.q)stake=d.q==='max'?Math.max(1,Math.floor(S.bal/(mode==='express'?1:Math.max(1,Object.keys(cp).length)))):+d.q;
  else if(b.id==='place')place();
  else if(b.id==='reset'){if(confirm('Удалить баланс и историю ставок?')){localStorage.removeItem(KEY);location.reload()}return}
  render()});
document.addEventListener('input',e=>{
  if(e.target.id==='st'){stake=Math.max(0,Math.floor(+e.target.value||0));const p=e.target.selectionStart;render();const i=$('#st');i.focus();i.setSelectionRange(p,p)}});
document.addEventListener('change',e=>{
  if(e.target.id==='fmt'){S.fmt=e.target.value;save()}
  if(e.target.id==='dst'){S.stake=Math.max(1,Math.floor(+e.target.value||100));stake=S.stake;save()}});
if(S.last!==today){S.bal+=DAILY;S.last=today;save();setTimeout(()=>toast('Ежедневный бонус: +'+fmtN(DAILY)+' очков'),400)}
render();
</script></body></html>
