<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1d24">
<title>FONBET</title>
<style>
:root{
  --bg:#f3f4f6;--card:#fff;--card2:#f9fafb;--soft:#f0f2f5;
  --text:#111827;--dim:#6b7280;--mute:#9ca3af;
  --dark:#1a1d24;--dark2:#232730;--dark3:#2d323c;
  --green:#0e8a3a;--green-bg:#e8f5ee;--green-light:#f0f9f3;
  --red:#e31e24;--red2:#ff2a2a;
  --border:#e5e7eb;--border2:#d1d5db;
  --blue:#3b82f6;--yellow:#f59e0b;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,'SF Pro Display','Inter','Roboto',sans-serif;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;}
html,body{background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom));}

/* ============ TOP BAR ============ */
.topbar{background:var(--dark);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));position:sticky;top:0;z-index:50;}
.topbar .brand{font-size:22px;font-weight:900;letter-spacing:-0.8px;font-style:italic;}
.topbar .right{display:flex;gap:10px;align-items:center;}
.topbar .add-btn{background:var(--red);color:#fff;border:none;width:32px;height:32px;border-radius:50%;font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.topbar .profile{background:var(--dark3);width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;font-size:15px;}
.topbar .profile::after{content:'';position:absolute;top:-2px;right:-2px;width:9px;height:9px;background:var(--yellow);border-radius:50%;border:2px solid var(--dark);}

/* ============ SPORT ICONS ============ */
.sport-tabs{background:#fff;display:flex;gap:2px;overflow-x:auto;padding:8px 6px;border-bottom:1px solid var(--border);scrollbar-width:none;}
.sport-tabs::-webkit-scrollbar{display:none;}
.sport-tab{flex:0 0 auto;background:transparent;border:none;color:var(--dim);font-size:11px;font-weight:600;padding:6px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border-radius:10px;min-width:56px;transition:all 0.15s;}
.sport-tab .ico{font-size:22px;line-height:1;filter:grayscale(1) opacity(0.55);transition:all 0.15s;}
.sport-tab.active{color:var(--text);}
.sport-tab.active .ico{filter:none;}

/* ============ SECTIONS ============ */
.section-title{padding:14px 16px 8px;display:flex;justify-content:space-between;align-items:center;}
.section-title h2{font-size:22px;font-weight:800;letter-spacing:-0.5px;}
.live-btn{background:#fff;border:1px solid var(--border);border-radius:20px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--text);cursor:pointer;display:flex;align-items:center;gap:5px;}
.live-btn .dot{width:7px;height:7px;background:var(--red);border-radius:50%;display:inline-block;}
.live-btn.active{background:var(--red);color:#fff;border-color:var(--red);}
.live-btn.active .dot{background:#fff;}

/* ============ LEAGUE ============ */
.league-h{background:var(--green-light);padding:10px 16px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--text);border-top:1px solid var(--border);border-bottom:1px solid var(--border);}
.league-h .logo{width:22px;height:22px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:11px;flex-shrink:0;}
.league-h .name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ============ MATCH ROW ============ */
.match-row{background:#fff;padding:12px 16px;display:flex;gap:10px;border-bottom:1px solid var(--border);cursor:pointer;transition:background 0.15s;}
.match-row:active{background:var(--card2);}
.match-row .left{flex:1;min-width:0;}
.match-row .team{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:15px;font-weight:600;color:var(--text);}
.match-row .team .t-logo{width:20px;height:20px;border-radius:50%;background:var(--soft);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;border:1px solid var(--border);}
.match-row .team .t-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.match-row .time-line{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);margin-top:6px;font-weight:500;}
.match-row .time-line .live-t{color:var(--green);font-weight:700;display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums;}
.match-row .time-line .live-dot{width:7px;height:7px;background:var(--green);border-radius:50%;display:inline-block;animation:pulse 1.4s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.35;}}
.match-row .score{display:flex;flex-direction:column;justify-content:center;align-items:flex-end;padding-right:8px;font-size:15px;font-weight:800;color:var(--red);gap:3px;min-width:26px;}
.match-row .score span{line-height:1;}
.match-row .odds{display:flex;gap:4px;min-width:0;flex-shrink:0;flex-direction:column;justify-content:center;}
.match-row .odds.h3{width:196px;}
.match-row .odds.h2{width:130px;}
.match-row .odds.hh{width:196px;}
.match-row .odds-row{display:flex;gap:4px;}
.match-row .odd{flex:1;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;min-width:0;transition:all 0.12s;}
.match-row .odd:active{background:var(--soft);transform:scale(0.97);}
.match-row .odd.sel{background:var(--green);border-color:var(--green);}
.match-row .odd.sel .o-val,.match-row .odd.sel .o-lbl,.match-row .odd.sel .o-hcp{color:#fff;}
.match-row .odd .o-lbl{font-size:10px;color:var(--dim);font-weight:600;line-height:1;}
.match-row .odd .o-val{font-size:14px;color:var(--text);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;}
.match-row .odd .o-hcp{font-size:11px;color:var(--green);font-weight:700;line-height:1;}

/* ============ BOTTOM NAV ============ */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);display:flex;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:100;}
.bottom-nav .nav{flex:1;background:none;border:none;color:var(--dim);font-size:10px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;position:relative;}
.bottom-nav .nav.active{color:var(--dark);}
.bottom-nav .nav .ico{font-size:22px;line-height:1;}
.bottom-nav .nav .badge{position:absolute;top:-1px;right:22%;background:var(--red);color:#fff;font-size:9px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid #fff;}

/* ============ DETAIL ============ */
.detail{display:none;position:fixed;inset:0;background:var(--bg);z-index:200;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(64px + env(safe-area-inset-bottom));}
.detail.show{display:block;}
.detail-header{background:var(--dark);color:#fff;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));position:sticky;top:0;z-index:10;}
.detail-header .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.detail-header .back{background:transparent;border:none;color:#fff;font-size:22px;cursor:pointer;padding:0;width:32px;}
.detail-header .brand-s{font-size:16px;font-weight:900;font-style:italic;letter-spacing:-0.5px;}
.detail-header .league-line{font-size:11px;color:var(--mute);margin-top:4px;display:flex;align-items:center;gap:4px;}
.detail-header .league-line b{color:#fff;font-size:13px;font-weight:700;display:block;margin-top:2px;}
.detail-score{background:var(--dark);color:#fff;padding:12px 16px;padding-top:0;}
.detail-score .row{display:flex;justify-content:space-between;align-items:center;font-size:16px;font-weight:700;padding:4px 0;}
.detail-score .row .live{color:#4ade80;font-variant-numeric:tabular-nums;font-size:12px;font-weight:600;display:flex;align-items:center;gap:4px;}
.detail-score .row .live .dot{width:6px;height:6px;background:#4ade80;border-radius:50%;display:inline-block;animation:pulse 1.4s infinite;}
.detail-tabs{background:#fff;border-bottom:1px solid var(--border);display:flex;overflow-x:auto;scrollbar-width:none;position:sticky;top:calc(60px + env(safe-area-inset-top));z-index:9;}
.detail-tabs::-webkit-scrollbar{display:none;}
.detail-tab{flex:0 0 auto;background:none;border:none;color:var(--dim);font-size:14px;font-weight:700;padding:14px 16px;border-bottom:3px solid transparent;cursor:pointer;transition:all 0.15s;}
.detail-tab.active{color:var(--text);border-bottom-color:var(--green);}
.market-card{background:#fff;margin:10px 12px;border-radius:10px;overflow:hidden;border:1px solid var(--border);}
.market-head{padding:12px 14px;font-size:14px;font-weight:800;color:var(--text);display:flex;justify-content:space-between;align-items:center;}
.market-head .tog{color:var(--dim);font-size:12px;cursor:pointer;}
.market-body{padding:0 8px 10px;display:flex;flex-direction:column;gap:6px;}
.m-row{display:flex;gap:6px;}
.m-cell{flex:1;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:10px 8px;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700;color:var(--text);cursor:pointer;transition:all 0.12s;min-width:0;}
.m-cell:active{background:var(--soft);}
.m-cell.sel{background:var(--green);color:#fff;border-color:var(--green);}
.m-cell .lbl{font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.m-cell.sel .lbl{color:#fff;}
.m-cell .val{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;}
.total-line{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--border);}
.total-line::-webkit-scrollbar{display:none;}
.tl-btn{flex:0 0 auto;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;color:var(--text);cursor:pointer;}
.tl-btn.active{background:var(--dark);color:#fff;border-color:var(--dark);}

/* ============ COUPON (BOTTOM SHEET) ============ */
.coupon-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:300;display:none;opacity:0;transition:opacity 0.25s;}
.coupon-overlay.show{display:block;opacity:1;}
.coupon{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:16px 16px 0 0;z-index:301;transform:translateY(100%);transition:transform 0.3s cubic-bezier(0.4,0,0.2,1);max-height:90vh;overflow-y:auto;padding-bottom:calc(12px + env(safe-area-inset-bottom));}
.coupon.show{transform:translateY(0);}
.coupon .handle{width:40px;height:4px;background:var(--border2);border-radius:2px;margin:8px auto 6px;}
.coupon-head{display:flex;align-items:center;gap:16px;padding:8px 20px 14px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;z-index:2;}
.coupon-head .ico-c{font-size:18px;color:var(--dim);}
.coupon-head .ctab{background:none;border:none;font-size:18px;font-weight:700;color:var(--dim);cursor:pointer;padding:4px 0;position:relative;}
.coupon-head .ctab.active{color:var(--text);}
.coupon-head .ctab.active::after{content:'';position:absolute;bottom:-14px;left:0;right:0;height:2px;background:var(--dark);border-radius:2px;}
.coupon-head .chev{background:var(--soft);border:none;width:32px;height:32px;border-radius:8px;font-size:16px;color:var(--dim);cursor:pointer;margin-left:auto;display:flex;align-items:center;justify-content:center;}

.coupon-body{padding:14px 20px 20px;}
.coupon-item{background:var(--card2);border-radius:10px;padding:12px 14px;margin-bottom:10px;position:relative;}
.coupon-item .ci-head{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600;margin-bottom:6px;gap:8px;}
.coupon-item .ci-head .ci-name{flex:1;display:flex;align-items:center;gap:6px;min-width:0;}
.coupon-item .ci-head .ci-name .dot-r{width:8px;height:8px;background:var(--red);border-radius:50%;flex-shrink:0;}
.coupon-item .ci-head .ci-name span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.coupon-item .ci-head .ci-x{background:none;border:none;font-size:18px;color:var(--dim);cursor:pointer;padding:0;line-height:1;}
.coupon-item .ci-row{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:700;color:var(--text);}
.coupon-item .ci-row .ci-lbl{color:var(--text);}
.coupon-item .ci-row .ci-odds{font-variant-numeric:tabular-nums;}

.coupon-mode{display:flex;gap:8px;margin:14px 0 10px;align-items:center;}
.coupon-mode .m-btn{background:#fff;border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:14px;font-weight:700;color:var(--text);cursor:pointer;}
.coupon-mode .m-btn.active{border-color:var(--dark);}
.coupon-mode .toggle-dbl{margin-left:auto;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px;cursor:pointer;color:var(--dim);}

.stake-wrap{position:relative;margin-bottom:6px;}
.stake-row{display:flex;border:2px solid var(--red);border-radius:10px;overflow:hidden;background:#fff;}
.stake-row .st-input{flex:1;padding:14px 12px;border:none;font-size:20px;font-weight:700;outline:none;color:var(--text);background:transparent;min-width:0;}
.stake-row .st-arrow{padding:0 6px;display:flex;align-items:center;color:var(--dim);font-size:16px;}
.stake-row .st-win{padding:14px 8px;display:flex;align-items:center;font-size:18px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;border-right:1px solid var(--border);background:#fff;min-width:50px;}
.stake-row .st-balance{padding:8px 12px;display:flex;flex-direction:column;justify-content:center;background:#fff;min-width:90px;position:relative;}
.stake-row .st-balance .b-lbl{font-size:10px;color:var(--dim);font-weight:600;line-height:1;}
.stake-row .st-balance .b-val{font-size:15px;font-weight:800;color:var(--text);line-height:1;margin-top:2px;}
.stake-row .st-balance .b-add{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:var(--red);color:#fff;width:24px;height:24px;border-radius:50%;border:none;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;}

.err-line{color:var(--red);font-size:13px;font-weight:600;margin-bottom:10px;padding-left:4px;display:none;}
.err-line.show{display:block;}

.quick-sums{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
.quick-sums::-webkit-scrollbar{display:none;}
.qs{flex:0 0 auto;background:#fff;border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:700;color:var(--text);cursor:pointer;position:relative;}
.qs.min{border-color:var(--border);}
.qs.min::before{content:'min';position:absolute;top:-8px;left:6px;background:#fff;padding:0 4px;font-size:9px;color:var(--mute);font-weight:600;}
.qs.max::before{content:'max';position:absolute;top:-8px;left:6px;background:#fff;padding:0 4px;font-size:9px;color:var(--mute);font-weight:600;}
.qs.set{background:var(--dark);color:#fff;border-color:var(--dark);font-size:15px;padding:8px 10px;}
.qs:active{background:var(--soft);}

.btn-deposit{width:100%;background:var(--red);color:#fff;border:none;border-radius:10px;padding:16px;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform 0.1s;}
.btn-deposit:active{transform:scale(0.99);}

/* ============ TOAST ============ */
.toast{position:fixed;top:calc(20px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-120px);background:var(--dark);color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;font-weight:600;z-index:1000;transition:transform 0.3s;max-width:90%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,0.25);}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast.err{background:var(--red);}
.toast.ok{background:var(--green);}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="brand">FONBET</div>
  <div class="right">
    <button class="add-btn" onclick="openCoupon()">+</button>
    <div class="profile" onclick="showToast('Профиль')">👤</div>
  </div>
</div>

<!-- SPORT TABS -->
<div class="sport-tabs" id="sportTabs"></div>

<!-- MATCHES -->
<div id="matchesWrap"></div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <button class="nav active" id="navHome" onclick="navTo('home')"><span class="ico">🏠</span>Главная</button>
  <button class="nav" id="navSport" onclick="navTo('sport')"><span class="ico">⚽</span>Спорт</button>
  <button class="nav" id="navCoupon" onclick="openCoupon()"><span class="ico">🎟</span>Купон<span class="badge" id="couponBadge" style="display:none">0</span></button>
  <button class="nav" id="navMedia" onclick="showToast('Медиа')"><span class="ico">📄</span>Медиа</button>
  <button class="nav" id="navMenu" onclick="showToast('Меню')"><span class="ico">☰</span>Меню</button>
</div>

<!-- COUPON -->
<div class="coupon-overlay" id="couponOverlay" onclick="closeCoupon()"></div>
<div class="coupon" id="couponSheet">
  <div class="handle"></div>
  <div class="coupon-head">
    <span class="ico-c">⚙</span>
    <button class="ctab active">Купон</button>
    <button class="ctab" onclick="showToast('Прогнозы')">Прогнозы</button>
    <button class="ctab" onclick="showToast('Промо')">Промо</button>
    <button class="chev" onclick="closeCoupon()">⌄</button>
  </div>
  <div class="coupon-body" id="couponBody"></div>
</div>

<!-- DETAIL PAGE -->
<div class="detail" id="detailPage">
  <div class="detail-header">
    <div class="top">
      <button class="back" onclick="closeDetail()">←</button>
      <div class="brand-s">FONBET</div>
      <div style="width:32px"></div>
    </div>
    <div class="league-line" id="detailLeague"></div>
  </div>
  <div class="detail-score" id="detailScore"></div>
  <div class="detail-tabs" id="detailTabs"></div>
  <div id="detailBody"></div>
</div>

<div class="toast" id="toast"></div>

<script>

  },
  {

   ===================================================== */
function toMsk(date){
  const msk = new Date(date.getTime() + MSK_OFFSET - date.getTimezoneOffset()*60000);
  return msk;
}
function fmtMsk(date){
  const d = new Date(date);
  const mskDate = new Date(d.getTime() + MSK_OFFSET - d.getTimezoneOffset()*60000);
  const hh = String(mskDate.getUTCHours()).padStart(2,'0');
  const mm = String(mskDate.getUTCMinutes()).padStart(2,'0');
  const today = new Date();
  const dToday = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  const dMatch = new Date(mskDate.getUTCFullYear(), mskDate.getUTCMonth(), mskDate.getUTCDate());
  const diffDays = Math.round((dMatch - dToday) / 86400000);
  if(diffDays === 0) return 'Сегодня в ' + hh + ':' + mm;
  if(diffDays === 1) return 'Завтра в ' + hh + ':' + mm;
  return hh + ':' + mm + ' ' + mskDate.getUTCDate() + '.' + String(mskDate.getUTCMonth()+1).padStart(2,'0');
}
function tickMSK(startTime, isLive, baseMinute){
  const now = Date.now();
  const elapsed = Math.max(0, now - startTime);
  if(isLive){
    const totalSec = baseMinute * 60 + Math.floor(elapsed / 1000);
    const m = Math.floor(totalSec / 60);
    const s = totalSec % 60;
    return {
      live: true,
      text: m + ':' + String(s).padStart(2,'0'),
      min: m,
      sec: s
    };
  }
  return { live: false, text: fmtMsk(new Date(startTime)) };
}

  if(m.live || m.finished){
    scoreHtml = `<div class="score"><span>${m.homeScore}</span><span>${m.awayScore}</span></div>`;
  }

  let oddsHtml = '';
  if(m.odds && m.odds.length === 3 && m.odds.some(o => o !== null)){

      <div class="odds-row">
        <div class="odd" style="opacity:0"></div>
        <div class="odd" style="opacity:0"></div>
        ${renderOdd(league.id, idx, 2, '2', m.odds[2], '')}

    </div>`;

      <div class="team"><span class="t-logo">${teamEmoji(m.home)}</span><span class="t-name">${m.home}</span></div>

}

function renderOdd(leagueId, idx, outcome, label, val, hcp){

function findMatch(leagueId, idx){
  const lg = LEAGUES.find(l => l.id === leagueId);
  if(!lg) return null;
  return {league: lg, match: lg.matches[idx], idx};
}

function pickOdd(leagueId, idx, outcome, label, val){
  const key = leagueId + '-' + idx + '-' + outcome;
  const found = selectedBets.findIndex(b => b.key === key);
  if(found !== -1){
    selectedBets.splice(found, 1);
  } else {
    const data = findMatch(leagueId, idx);
    if(!data) return;
    selectedBets = selectedBets.filter(b => !(b.leagueId === leagueId && b.idx === idx));
    selectedBets.push({
      key,
      leagueId, idx, outcome,
      label,
      odds: val,
      home: data.match.home,
      away: data.match.away,
      leagueName: data.league.name,
      market: label === '1' ? 'П1' : label === 'X' ? 'Ничья' : label === '2' ? 'П2' : label
    });
  }
  renderMatches();
  if(currentDetail) renderDetailMarkets();
  updateCouponBadge();
}

function updateCouponBadge(){
  const b = document.getElementById('couponBadge');
  if(selectedBets.length > 0){
    b.style.display = 'flex';
    b.textContent = selectedBets.length;
  } else {

}

    </div>
    <div style="display:flex;height:6px;background:var(--soft);border-radius:3px;overflow:hidden">
      <div style="width:${pH}%;background:var(--green)"></div>
      <div style="width:${pA}%;background:var(--red)"></div>
    </div>
  </div>`;
}

        </div>
        <div class="ci-row">
          <span class="ci-lbl">${b.market || b.label}</span>
          <span class="ci-odds">${b.odds.toFixed(2)}</span>
        </div>
      </div>
    `).join('')}
    <div class="coupon-mode">
      <button class="m-btn active">${selectedBets.length > 1 ? 'Экспресс' : 'Одинар'}</button>
      <button class="toggle-dbl">⇅</button>
    </div>
    <div class="stake-wrap">
      <div class="stake-row">
        <input class="st-input" type="number" value="${stakeValue}" id="stakeInput" oninput="updateStake(this.value)">
        <span class="st-arrow">→</span>
        <span class="st-win">${win}</span>
        <div class="st-balance">
          <span class="b-lbl">Баланс</span>
          <span class="b-val">${balance.toLocaleString('ru-RU')}</span>
          <button class="b-add" onclick="depositPrompt()">+</button>
        </div>
      </div>
    </div>
    ${balance < stakeValue ? `<div class="err-line show">Недостаточно средств</div>` : ''}
    <div class="quick-sums">
      <button class="qs min" onclick="setStake(30)">30</button>
      <button class="qs" onclick="setStake(50)">50</button>
      <button class="qs" onclick="setStake(500)">500</button>
      <button class="qs" onclick="setStake(1000)">1 000</button>
      <button class="qs" onclick="setStake(2000)">2 000</button>
      <button class="qs max" onclick="setStake(2142900)">2 142 900</button>
      <button class="qs set">⚙</button>
    </div>
    ${balance < stakeValue
      ? `<button class="btn-deposit" onclick="depositPrompt()">⊕ Пополнить на ${stakeValue}</button>`
      : `<button class="btn-deposit" onclick="placeBet()">Сделать ставку ${stakeValue}</button>`}
  `;
}

function setStake(v){ stakeValue = v; renderCoupon(); }
function updateStake(v){ stakeValue = Math.max(0, Number(v) || 0); renderCoupon(); }
function removeCouponItem(i){ selectedBets.splice(i,1); renderCoupon(); updateCouponBadge(); renderMatches(); if(currentDetail) renderDetailMarkets(); }
function depositPrompt(){
  const sum = prompt('Сумма пополнения', '1000');
  if(sum && !isNaN(Number(sum))){
    balance += Number(sum);
    showToast('✅ Баланс пополнен на ' + Number(sum).toLocaleString('ru-RU') + ' ₽', true);
    renderCoupon();
  }
}
function placeBet(){
  if(balance < stakeValue) return showToast('Недостаточно средств', false);
  balance -= stakeValue;
  showToast('✅ Ставка ' + stakeValue + ' ₽ принята', true);
  selectedBets = [];
  closeCoupon();
  renderMatches();
  updateCouponBadge();
}

/* =====================================================
   НАВИГАЦИЯ
   ===================================================== */
function navTo(page){
  document.querySelectorAll('.bottom-nav .nav').forEach(n => n.classList.remove('active'));
  document.getElementById('nav' + page.charAt(0).toUpperCase() + page.slice(1)).classList.add('active');
  if(page === 'home' || page === 'sport'){
    currentSport = 'top';
    renderSportTabs();
    renderMatches();
  }
}

/* =====================================================
   TOAST
   ===================================================== */
let toastTimer;
function showToast(text, ok){
  const t = document.getElementById('toast');
  t.textContent = text;
  t.className = 'toast show ' + (ok === true ? 'ok' : ok === false ? 'err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

/* =====================================================
   ТИКЕР LIVE
   ===================================================== */
setInterval(() => {
  document.querySelectorAll('[data-live-time]').forEach(el => {
    const start = Number(el.dataset.start);
    const elapsed = Date.now() - start;
    const baseMin = 0;
    const totalSec = baseMin * 60 + Math.floor(elapsed / 1000);
    const m = Math.floor(totalSec / 60);
    const s = totalSec % 60;
    el.textContent = m + ':' + String(s).padStart(2,'0');
  });
}, 1000);

/* =====================================================
   INIT
   ===================================================== */
renderSportTabs();
renderMatches();
updateCouponBadge();
</script>
</body>
</html>
