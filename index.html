<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="OpenBet — live betting platform with Fonbet-grade odds">
<title>⚡ OpenBet — Live Betting</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }

:root {
  --bg: #0a0a0f;
  --bg2: #101018;
  --bg3: #181822;
  --card: rgba(24, 24, 36, 0.85);
  --card-solid: #181822;
  --card-hover: rgba(34, 34, 50, 0.95);
  --border: rgba(90, 90, 130, 0.18);
  --border-2: rgba(110, 110, 160, 0.32);
  --text: #ffffff;
  --text-2: #c8c8d8;
  --muted: #8585a0;
  --accent: #7b5cff;
  --accent-2: #00d4ff;
  --accent-glow: rgba(123, 92, 255, 0.4);
  --green: #00e676;
  --green-glow: rgba(0, 230, 118, 0.4);
  --red: #ff3860;
  --red-glow: rgba(255, 56, 96, 0.4);
  --gold: #ffb800;
  --gold-glow: rgba(255, 184, 0, 0.35);
  --orange: #ff9500;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.4);
  --shadow-md: 0 4px 16px rgba(0,0,0,.45);
  --shadow-lg: 0 12px 40px rgba(0,0,0,.6);
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;
  --r-xl: 18px;
}

body.light {
  --bg: #f2f3f8;
  --bg2: #e8eaf2;
  --bg3: #dde0ea;
  --card: rgba(255, 255, 255, 0.9);
  --card-solid: #ffffff;
  --card-hover: rgba(245, 246, 250, 0.98);
  --border: rgba(90, 90, 130, 0.12);
  --border-2: rgba(90, 90, 130, 0.25);
  --text: #0e0e1c;
  --text-2: #2a2a3c;
  --muted: #6a6a80;
}

html { scroll-behavior: smooth; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 13.5px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  transition: background .3s, color .3s;
}
body.has-coupon { padding-bottom: 130px; }
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 60% 40% at 15% -10%, rgba(123, 92, 255, 0.15), transparent 60%),
    radial-gradient(ellipse 50% 40% at 85% 110%, rgba(0, 212, 255, 0.1), transparent 60%);
  pointer-events: none;
  z-index: 0;
}
body.light::before { opacity: .4; }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 3px; }

.header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(10, 10, 15, 0.9);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 8px 16px;
}
body.light .header { background: rgba(255, 255, 255, 0.9); }

.header-inner {
  max-width: 1440px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}
.logo {
  font-size: 18px;
  font-weight: 900;
  letter-spacing: -0.5px;
  white-space: nowrap;
  cursor: pointer;
}
.logo span {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav-btn {
  padding: 7px 11px;
  border-radius: var(--r-sm);
  color: var(--muted);
  font-weight: 700;
  font-size: 12px;
  white-space: nowrap;
  transition: all .15s;
}
.nav-btn:hover { color: var(--text); background: var(--card); }
.nav-btn.active { color: var(--text); background: var(--card); }

.header-right { display: flex; align-items: center; gap: 5px; }
.balance {
  background: var(--card);
  border: 1px solid var(--border);
  padding: 7px 12px;
  border-radius: var(--r-md);
  font-weight: 800;
  font-size: 12.5px;
  display: flex;
  align-items: center;
  gap: 5px;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
  user-select: none;
  transition: all .2s;
}
.balance:hover { border-color: var(--accent); transform: translateY(-1px); }
.balance.flash-bonus { border-color: var(--gold); box-shadow: 0 0 24px var(--gold-glow); animation: pulseB .8s; }
.balance.flash-win { border-color: var(--green); box-shadow: 0 0 20px var(--green-glow); }
.balance.flash-lose { border-color: var(--red); box-shadow: 0 0 20px var(--red-glow); }
@keyframes pulseB { 0%,100%{transform:scale(1)} 40%{transform:scale(1.06)} }

.icon-btn {
  width: 34px; height: 34px;
  border-radius: var(--r-md);
  background: var(--card);
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  transition: all .15s;
}
.icon-btn:hover { border-color: var(--accent); transform: translateY(-1px); }
.icon-btn.muted { opacity: .5; }

.container {
  max-width: 1440px;
  margin: 0 auto;
  padding: 14px 16px 30px;
  position: relative;
  z-index: 1;
}

.session-bar {
  display: flex;
  gap: 14px;
  align-items: center;
  padding: 9px 14px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  margin-bottom: 12px;
  font-size: 12px;
  flex-wrap: wrap;
}
.session-bar .label { color: var(--muted); font-weight: 600; }
.session-bar .value { font-weight: 800; font-variant-numeric: tabular-nums; }
.session-bar .value.green { color: var(--green); }
.session-bar .value.red { color: var(--red); }
.session-bar .value.gold { color: var(--gold); }
.session-bar .spacer { margin-left: auto; }
.bonus-hint { font-size: 11.5px; color: var(--gold); font-weight: 700; animation: bp 2s infinite; }
@keyframes bp { 0%,100%{opacity:1} 50%{opacity:.55} }

.live-drops {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 6px;
  margin-bottom: 12px;
}
.live-drops::-webkit-scrollbar { height: 3px; }
.live-drops:empty { display: none; }
.drop {
  min-width: 160px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  padding: 7px 10px;
  font-size: 11px;
  animation: dIn .3s;
}
@keyframes dIn { from { opacity: 0; transform: translateX(20px); } }
.drop-match { font-weight: 700; margin-bottom: 3px; color: var(--muted); font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.drop-event { color: var(--green); font-weight: 700; }

.search-row {
  display: flex;
  gap: 6px;
  margin-bottom: 10px;
  flex-wrap: wrap;
  align-items: center;
}
.search-input {
  flex: 1;
  min-width: 160px;
  background: var(--card);
  border: 1px solid var(--border);
  padding: 9px 12px;
  border-radius: var(--r-md);
  font-size: 12.5px;
  transition: all .15s;
}
.search-input:focus { outline: none; border-color: var(--accent); }
.search-input::placeholder { color: var(--muted); }

.filter {
  padding: 7px 12px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  font-weight: 700;
  color: var(--muted);
  font-size: 11.5px;
  white-space: nowrap;
  transition: all .15s;
  display: flex;
  align-items: center;
  gap: 4px;
}
.filter:hover { color: var(--text); }
.filter.active { color: var(--text); border-color: var(--accent); background: rgba(123, 92, 255, 0.1); }
.filter.star.active { background: rgba(255, 184, 0, 0.12); border-color: var(--gold); color: var(--gold); }
.filter.toggle.active { background: rgba(0, 230, 118, 0.1); border-color: var(--green); color: var(--green); }

.filters-row { display: flex; gap: 5px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
.filters-row .label { font-size: 10px; color: var(--muted); text-transform: uppercase; font-weight: 700; letter-spacing: .5px; margin-right: 3px; }

/* MATCH CARD */
.match {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 12px;
  margin-bottom: 8px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 10px;
  align-items: center;
  box-shadow: var(--shadow-sm);
  transition: border-color .15s;
}
.match:hover { border-color: var(--border-2); }
.match.finished { opacity: .55; }
.match.ufc-priority { border-left: 3px solid var(--red); }

.match-info { min-width: 0; }
.match-top {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 7px;
  flex-wrap: wrap;
}
.match-league {
  font-size: 10px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .4px;
  font-weight: 700;
}
.sport-icon { font-size: 13px; }

.badge {
  font-size: 9px;
  padding: 2px 7px;
  border-radius: 4px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .4px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.badge.live { background: var(--red); color: white; }
.badge.live::before { content: ''; width: 4px; height: 4px; border-radius: 50%; background: white; animation: ld 1.2s infinite; }
@keyframes ld { 0%,100%{opacity:1} 50%{opacity:.3} }
.badge.finished { background: rgba(100,100,120,.3); color: #aaa; }
.badge.prematch { background: var(--accent); color: white; }
.badge.break { background: var(--gold); color: #000; }
.badge.countdown { background: var(--accent-2); color: #000; }

.star-btn {
  margin-left: auto;
  font-size: 15px;
  padding: 3px;
  color: #444;
  transition: all .15s;
}
.star-btn:hover { transform: scale(1.15); }
.star-btn.active { color: var(--gold); }

.teams-row {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-bottom: 6px;
  flex-wrap: wrap;
}
.team { display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: 13px; }

.team-avatar {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: 9.5px;
  color: white;
  flex-shrink: 0;
  border: 2px solid rgba(255,255,255,.1);
}
.team-avatar.scored { animation: avS 1s ease; }
@keyframes avS { 0%,100%{transform:scale(1)} 40%{transform:scale(1.3); box-shadow: 0 0 16px var(--green);} }
.team-name { white-space: nowrap; }

.team-score {
  color: var(--green);
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  font-size: 15px;
  padding: 0 5px;
  letter-spacing: -.5px;
}
.team-score.scored { animation: scF 1s; }
@keyframes scF { 0%,100%{transform:scale(1)} 30%{transform:scale(1.4); text-shadow: 0 0 16px var(--green);} }

.time-info { font-size: 10.5px; color: var(--muted); font-weight: 600; }

.period-progress { display: flex; gap: 3px; margin: 7px 0 5px; height: 3px; }
.period-seg { flex: 1; background: rgba(120,120,160,.15); border-radius: 2px; position: relative; overflow: hidden; }
.period-seg.done { background: var(--green); }
.period-seg.active { background: rgba(123,92,255,.25); }
.period-seg.active::after {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: var(--p, 0%);
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  border-radius: 2px;
}

.stats-bar {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin: 7px 0 4px;
  padding: 6px 9px;
  background: rgba(0,0,0,.15);
  border-radius: var(--r-sm);
  font-size: 10px;
}
body.light .stats-bar { background: rgba(0,0,0,.04); }
.stat-item { display: flex; align-items: center; gap: 3px; color: var(--muted); }
.stat-item b { color: var(--text); font-weight: 700; font-variant-numeric: tabular-nums; }

.ufc-final {
  display: flex;
  gap: 9px;
  align-items: center;
  margin: 9px 0 4px;
  padding: 9px 11px;
  background: linear-gradient(135deg, rgba(255,184,0,.16), rgba(255,56,96,.06));
  border: 1px solid rgba(255,184,0,.4);
  border-radius: var(--r-md);
  font-size: 11.5px;
  font-weight: 700;
}
.ufc-final-icon { font-size: 20px; }
.ufc-final-text { flex: 1; line-height: 1.4; }
.ufc-final-text b { color: var(--gold); }
.ufc-final-sub { color: var(--muted); font-weight: 600; font-size: 10.5px; }

/* ODDS */
.odds { display: flex; gap: 5px; }
.odds-btn {
  width: 82px;
  background: rgba(15,15,22,.85);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  padding: 8px 5px;
  text-align: center;
  transition: all .15s;
  font-variant-numeric: tabular-nums;
}
body.light .odds-btn { background: rgba(245,246,250,.95); }
.odds-btn:hover:not(:disabled):not(.disabled) {
  border-color: var(--accent);
  background: var(--card-hover);
  transform: translateY(-1px);
}
.odds-btn:active:not(:disabled):not(.disabled) { transform: translateY(0) scale(.97); }
.odds-btn:disabled, .odds-btn.disabled { opacity: .3; cursor: not-allowed; }

.odds-label {
  font-size: 10px;
  color: var(--muted);
  margin-bottom: 2px;
  font-weight: 600;
}
.odds-value {
  font-size: 14.5px;
  font-weight: 800;
  color: var(--accent-2);
}

.extras {
  grid-column: 1 / -1;
  margin-top: 4px;
  border-top: 1px solid var(--border);
  padding-top: 7px;
}
.extras-toggle {
  color: var(--accent-2);
  font-size: 11px;
  font-weight: 700;
  padding: 3px 0;
  display: flex;
  align-items: center;
  gap: 4px;
}
.extras-toggle.open { color: var(--muted); }

.extras-grid {
  display: none;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 5px;
  margin-top: 8px;
}
.extras-grid.open { display: grid; }

.odds-mini {
  background: rgba(15,15,22,.85);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  padding: 6px 9px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 6px;
  min-width: 0;
  overflow: hidden;
  transition: all .15s;
}
body.light .odds-mini { background: rgba(245,246,250,.95); }
.odds-mini:hover:not(.disabled) {
  border-color: var(--accent);
  background: var(--card-hover);
}
.odds-mini.disabled { opacity: .3; cursor: not-allowed; }
.odds-mini-label { font-size: 10.5px; color: var(--muted); text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.odds-mini-value { font-size: 12px; font-weight: 800; color: var(--accent-2); white-space: nowrap; }

/* HISTORY */
.history-filters { display: flex; gap: 5px; margin-bottom: 10px; flex-wrap: wrap; }
.history-item {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 10px 12px;
  margin-bottom: 7px;
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 10px;
  align-items: center;
  cursor: pointer;
  transition: all .15s;
}
.history-item:hover { border-color: var(--border-2); }
.history-item.won { border-left: 3px solid var(--green); }
.history-item.lost { border-left: 3px solid var(--red); }
.history-item.pending { border-left: 3px solid var(--gold); }

.history-main { min-width: 0; }
.history-match { font-weight: 700; font-size: 12px; margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.history-meta { font-size: 10px; color: var(--muted); }
.history-stake { text-align: right; }
.history-stake .amount { font-weight: 800; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.history-status {
  font-weight: 800;
  padding: 3px 9px;
  border-radius: 4px;
  text-transform: uppercase;
  letter-spacing: .3px;
  font-size: 9.5px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.history-status.won { background: rgba(0,230,118,.15); color: var(--green); }
.history-status.lost { background: rgba(255,56,96,.15); color: var(--red); }
.history-status.pending { background: rgba(255,184,0,.15); color: var(--gold); }

.cashout-row {
  grid-column: 1 / -1;
  display: flex;
  gap: 7px;
  align-items: center;
  padding-top: 7px;
  border-top: 1px solid var(--border);
  margin-top: 3px;
  flex-wrap: wrap;
}
.cashout-btn {
  background: linear-gradient(135deg, var(--green), #00b050);
  color: #000;
  padding: 6px 12px;
  border-radius: var(--r-sm);
  font-weight: 800;
  font-size: 10.5px;
  transition: all .15s;
}
.cashout-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px var(--green-glow); }
.cashout-info { font-size: 10.5px; color: var(--muted); }
.cashout-info b { color: var(--gold); }

/* STATS */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 8px;
  margin-bottom: 16px;
}
.stat {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 12px 14px;
}
.stat-label { font-size: 10.5px; color: var(--muted); margin-bottom: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: .3px; }
.stat-value { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.4px; }
.stat-value.green { color: var(--green); }
.stat-value.red { color: var(--red); }
.stat-value.gold { color: var(--gold); }

.chart-container {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 14px;
  margin-bottom: 14px;
}
.chart-title { font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 10px; }
.chart-canvas { width: 100%; height: 160px; display: block; }

/* ACHIEVEMENTS */
.achievements-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(125px, 1fr));
  gap: 8px;
  margin-bottom: 16px;
}
.achievement {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 12px 8px;
  text-align: center;
  opacity: 0.35;
  transition: all .2s;
}
.achievement.unlocked { opacity: 1; border-color: var(--gold); box-shadow: 0 0 20px var(--gold-glow); }
.achievement-icon { font-size: 26px; margin-bottom: 6px; display: block; }
.achievement-name { font-size: 10px; font-weight: 700; margin-bottom: 2px; }
.achievement-desc { font-size: 9px; color: var(--muted); }

/* LEADERBOARD */
.leaderboard {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 14px;
}
.lb-header { color: var(--muted); font-size: 11.5px; margin-bottom: 10px; font-weight: 600; }
.lb-header b { color: var(--gold); font-weight: 800; }
.lb-row {
  display: grid;
  grid-template-columns: 40px 1fr auto;
  gap: 10px;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
}
.lb-row:last-child { border-bottom: none; }
.lb-row.me { background: rgba(123,92,255,.12); margin: 0 -14px; padding: 8px 14px; border-radius: var(--r-sm); border-bottom: none; }
.lb-rank { font-weight: 900; font-size: 14px; color: var(--muted); text-align: center; }
.lb-rank.top1 { color: var(--gold); }
.lb-rank.top2 { color: #c0c0c0; }
.lb-rank.top3 { color: #cd7f32; }
.lb-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb-name.me { color: var(--accent-2); }
.lb-value { font-weight: 800; color: var(--green); font-variant-numeric: tabular-nums; font-size: 12px; }

/* MODAL */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.8);
  backdrop-filter: blur(10px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 14px;
}
.modal-overlay.active { display: flex; }
.modal {
  background: linear-gradient(180deg, var(--card-solid), var(--bg3));
  border: 1px solid var(--border-2);
  border-radius: var(--r-xl);
  padding: 22px;
  max-width: 440px;
  width: 100%;
  box-shadow: var(--shadow-lg);

    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = t; o.frequency.value = f;
    g.gain.setValueAtTime(v, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + d);
    o.connect(g); g.connect(audio.destination);
    o.start(); o.stop(audio.currentTime + d);
  } catch (e) {}
}

/* ============ КОЭФФИЦИЕНТЫ (FONBET-STYLE) ============ */
function goalsRemaining(m) {
  const rem = Math.max(0, m.maxMinute - m.minute);
  const isF = m.sport === 'football';
  let intensity;
  if (isF) {
    if (m.minute < 15) intensity = 0.65;
    else if (m.minute < 30) intensity = 0.95;
    else if (m.minute < 45) intensity = 1.15;
    else if (m.minute < 60) intensity = 0.85;
    else if (m.minute < 75) intensity = 1.10;
    else intensity = 1.45;
  } else {
    if (m.minute < 20) intensity = 0.9;
    else if (m.minute < 40) intensity = 1.05;
    else intensity = 1.2;
  }
  const rate = m.homeAttack / m.maxMinute * intensity;
  const rateA = m.awayAttack / m.maxMinute * intensity;
  return {
    lh: Math.max(0, rate * rem * (1 + m.momentum * 0.25)),
    la: Math.max(0, rateA * rem * (1 - m.momentum * 0.25)),
  };
}

function computeOdds(m) {
  if (m.status === 'finished' || m.status === 'countdown' || m.status === 'prematch') {
    if (m.status !== 'prematch') return { home: null, draw: null, away: null };
  }

  // UFC
  if (m.sport === 'ufc') {
    const diff = m.homeRating - m.awayRating;
    let pH = 1 / (1 + Math.pow(10, -diff / 400));
    const prog = m.minute / m.maxMinute;
    pH = 0.5 + (pH - 0.5) * (1 - prog * 0.85);
    pH = clamp(pH, 0.03, 0.97);
    return {
      home: toOdd(pH, 0.05),
      away: toOdd(1 - pH, 0.05),
      draw: null,
    };
  }

  const { lh, la } = goalsRemaining(m);
  let pH = 0, pD = 0, pA = 0;
  for (let h = 0; h <= 12; h++) {
    for (let a = 0; a <= 12; a++) {
      const p = poisson(h, lh) * poisson(a, la);
      const fh = m.scoreHome + h;
      const fa = m.scoreAway + a;
      if (fh > fa) pH += p;
      else if (fh === fa) pD += p;
      else pA += p;
    }
  }
  const t = pH + pD + pA || 1;
  pH /= t; pD /= t; pA /= t;

  return {
    home: toOdd(pH, 0.05),
    draw: toOdd(pD, 0.05),
    away: toOdd(pA, 0.05),
  };
}

function computeExtras(m) {
  if (m.status === 'finished' || m.status === 'countdown') return {};
  const raw = {};

  // UFC
  if (m.sport === 'ufc') {
    const diff = m.homeRating - m.awayRating;
    let pH = 1 / (1 + Math.pow(10, -diff / 400));
    const prog = m.minute / m.maxMinute;
    pH = 0.5 + (pH - 0.5) * (1 - prog * 0.85);
    pH = clamp(pH, 0.03, 0.97);
    const pA = 1 - pH;
    const r = m.round;

    let pFin;
    if (r === 1) pFin = 0.55;
    else if (r === 2) pFin = 0.45;
    else if (r === 3) pFin = 0.32;
    else if (r === 4) pFin = 0.22;
    else pFin = 0.12;
    if (m.minute >= m.maxMinute - 3) pFin *= 0.5;

    const pKO = pFin * 0.62;
    const pSub = pFin * 0.32;
    const pDec = 1 - pFin;

    const add = (l, p, mar = 0.06) => { const o = toOdd(p, mar); if (o) raw[l] = o; };

    add('Метод · KO/TKO', pKO);
    add('Метод · Сабмишн', pSub);
    add('Метод · Решение', pDec);

    const pO15 = r >= 2 ? 1 : 1 - pFin * 0.85;
    const pO25 = r >= 3 ? 1 : 1 - pFin * 0.95;
    add('Тотал Б 1.5 раундов', pO15);
    add('Тотал М 1.5 раундов', 1 - pO15);
    add('Тотал Б 2.5 раундов', pO25);
    add('Тотал М 2.5 раундов', 1 - pO25);

    add('Бой досрочно', pFin);
    add('Пройти всю дистанцию', pDec);

    if (r <= 1) add('Финиш в R1', pFin * 0.4, 0.08);
    if (r <= 2) add('Финиш в R2', pFin * 0.28, 0.08);
    if (r <= 3) add('Финиш в R3', pFin * 0.2, 0.08);
    if (r <= 4) add('Финиш в R4+', pFin * 0.12, 0.08);

    add(`${m.home} KO/TKO`, pH * pKO, 0.08);
    add(`${m.home} Сабмишн`, pH * pSub, 0.08);
    add(`${m.home} Решение`, pH * pDec, 0.08);
    add(`${m.away} KO/TKO`, pA * pKO, 0.08);
    add(`${m.away} Сабмишн`, pA * pSub, 0.08);
    add(`${m.away} Решение`, pA * pDec, 0.08);

    return raw;
  }

  // Футбол / хоккей
  const isF = m.sport === 'football';
  const { lh, la } = goalsRemaining(m);
  const cur = m.scoreHome + m.scoreAway;

  const MAX = 12;
  const hD = [], aD = [];
  for (let g = 0; g <= MAX; g++) { hD.push(poisson(g, lh)); aD.push(poisson(g, la)); }

  const matrix = {};
  let sum = 0;
  for (let h = 0; h <= MAX; h++) {
    for (let a = 0; a <= MAX; a++) {
      const p = hD[h] * aD[a];
      const fh = m.scoreHome + h;
      const fa = m.scoreAway + a;
      matrix[`${fh}:${fa}`] = (matrix[`${fh}:${fa}`] || 0) + p;
      sum += p;
    }
  }
  for (const k in matrix) matrix[k] /= sum;

  let pH = 0, pD = 0, pA = 0, pEven = 0, pBtts = 0;
  for (const [k, p] of Object.entries(matrix)) {
    const [h, a] = k.split(':').map(Number);
    if (h > a) pH += p; else if (h === a) pD += p; else pA += p;
    if ((h + a) % 2 === 0) pEven += p;
    if (h >= 1 && a >= 1) pBtts += p;
  }

  const pOver = (l) => {
    let p = 0;
    for (const [k, pr] of Object.entries(matrix)) {
      const [h, a] = k.split(':').map(Number);
      if (h + a > l) p += pr;
    }
    return p;
  };
  const pHand = (l) => {
    let p = 0;
    for (const [k, pr] of Object.entries(matrix)) {
      const [h, a] = k.split(':').map(Number);
      if (h - a > l) p += pr;
    }
    return p;
  };
  const pTeamOver = (side, l) => {
    let p = 0;
    for (const [k, pr] of Object.entries(matrix)) {
      const [h, a] = k.split(':').map(Number);
      const g = side === 'home' ? h : a;
      if (g > l) p += pr;
    }
    return p;
  };

  const add = (l, p, mar = 0.05) => { const o = toOdd(p, mar); if (o) raw[l] = o; };

  if (isF) {
    add('1X', pH + pD, 0.04);
    add('12', pH + pA, 0.04);
    add('X2', pD + pA, 0.04);
  }

  const lines = isF ? [0.5, 1.5, 2.5, 3.5, 4.5, 5.5] : [3.5, 4.5, 5.5, 6.5, 7.5, 8.5];
  lines.forEach(l => {
    const pO = pOver(l);
    const pU = 1 - pO;
    add(`ТБ ${l}`, pO, 0.05);
    add(`ТМ ${l}`, pU, 0.05);
  });

  if (isF) {
    const pF1m15 = pHand(-1.5);
    const pF1p15 = 1 - pF1m15;
    const pF2m15 = 1 - pHand(1.5);
    const pF2p15 = 1 - pF2m15;
    add('Ф1 −1.5', pF1m15, 0.05);
    add('Ф1 +1.5', pF1p15, 0.05);
    add('Ф2 −1.5', pF2m15, 0.05);
    add('Ф2 +1.5', pF2p15, 0.05);
  } else {
    const pF1m15 = pHand(-1.5);
    const pF2m15 = 1 - pHand(1.5);
    add('Ф1 −1.5', pF1m15, 0.05);
    add('Ф1 +1.5', 1 - pF1m15, 0.05);
    add('Ф2 −1.5', pF2m15, 0.05);
    add('Ф2 +1.5', 1 - pF2m15, 0.05);
  }

  add('Обе · Да', pBtts, 0.05);
  add('Обе · Нет', 1 - pBtts, 0.05);
  add('Чёт', pEven, 0.05);
  add('Нечет', 1 - pEven, 0.05);

  const tLine = isF ? 0.5 : 1.5;
  const hO = pTeamOver('home', tLine);
  const aO = pTeamOver('away', tLine);
  add(`${m.home} Б ${tLine}`, hO, 0.05);
  add(`${m.home} М ${tLine}`, 1 - hO, 0.05);
  add(`${m.away} Б ${tLine}`, aO, 0.05);
  add(`${m.away} М ${tLine}`, 1 - aO, 0.05);

  if (isF && m.minute < 85) {
    for (const [k, p] of Object.entries(matrix)) {
      const [h, a] = k.split(':').map(Number);
      if (h > 4 || a > 4) continue;
      if (h === m.scoreHome && a === m.scoreAway) continue;
      if (h < m.scoreHome || a < m.scoreAway) continue;
      add(`Счёт ${k}`, p, 0.08);
    }
  }

  return raw;
}

function createMatches(count = 15) {
  const list = [];

  // === UFC СЕРИЯ: 3 боя подряд с интервалом 100 сек (1:40) ===
  // Бой 1 — сейчас live
  // Бой 2 — через 100 сек
  // Бой 3 — через 200 сек
  for (let i = 0; i < 3; i++) {
    const m = newUFC(i > 0, i * 100);
    if (i === 0) m.minute = rand(0, 15);
    list.push(m);
  }

  // === ОСТАЛЬНЫЕ ===
  const remaining = count - 3;
  const prematchCount = Math.floor(remaining * 0.5);

  for (let i = 0; i < prematchCount; i++) {
    const sport = Math.random() < 0.55 ? 'football' : 'hockey';
    let sec;
    const b = Math.floor(i / prematchCount * 3);
    if (b === 0) sec = rand(20, 90);
    else if (b === 1) sec = rand(90, 240);
    else sec = rand(240, 480);
    const m = sport === 'football' ? newFootball(true, sec) : newHockey(true, sec);
    list.push(m);
  }

  while (list.length < count) {
    const m = newRandom(false, 0);
    m.minute = rand(0, 30);
    list.push(m);
  }

  // UFC серия остаётся вверху
  const ufc = list.slice(0, 3);
  const rest = list.slice(3);
  for (let i = rest.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [rest[i], rest[j]] = [rest[j], rest[i]];
  }
  return [...ufc, ...rest];
}

/* ============ СИМУЛЯЦИЯ ============ */
function tickMatch(m) {
  if (m.status === 'countdown') {
    m.countdownLeft -= 1;
    if (m.countdownLeft <= 0) {
      const nm = newRandom(false, 0);
      nm.id = m.id;
      Object.assign(m, nm);
    }
    return;
  }

  if (m.status === 'prematch') {
    m.startsIn -= 1;
    if (m.startsIn <= 0) { m.status = 'live'; m.minute = 0; }
    return;
  }

  if (m.status !== 'live') return;

  if (m.breakLeft > 0) {
    m.breakLeft -= 1;
    if (m.breakLeft === 0) {
      if (m.sport === 'football' && m.period === 'HT') m.period = '2H';
      else if (m.sport === 'hockey' && m.period === 'BR1') m.period = 'P2';
      else if (m.sport === 'hockey' && m.period === 'BR2') m.period = 'P3';
    }
    return;
  }

  m.minute += 1;
  m.momentum *= 0.93;
  m.justScoredSide = null;

  // UFC — 5 раундов × 12 тиков + 3 перерыв = 75 тиков
  if (m.sport === 'ufc') {
    const cycle = 15;
    const tk = m.minute % cycle;
    m.round = Math.min(5, Math.floor(m.minute / cycle) + 1);

    if (tk >= 12 && m.round < 5) {
      m.breakLeft = 3;
      return;
    }

    const adv = (m.homeRating - m.awayRating) / 400;
    if (Math.random() < 0.5 + adv * 0.3) m.momentum = Math.min(1, m.momentum + 0.25);
    else m.momentum = Math.max(-1, m.momentum - 0.25);

    if (Math.random() < 0.06) {
      const w = Math.random() < (0.5 + adv) ? 'home' : 'away';
      const method = Math.random() < 0.6 ? 'KO/TKO' : 'Сабмишн';
      if (w === 'home') { m.scoreHome = 1; m.scoreAway = 0; m.justScoredSide = 'home'; }
      else { m.scoreHome = 0; m.scoreAway = 1; m.justScoredSide = 'away'; }
      m.finalResult = { winner: w, method, round: m.round };
      m.status = 'finished';
      m.finishedAt = Date.now();
      return;
    }

    if (m.minute >= 70) {
      const w = m.momentum > 0 ? 'home' : 'away';
      if (w === 'home') { m.scoreHome = 1; m.scoreAway = 0; }
      else { m.scoreHome = 0; m.scoreAway = 1; }
      m.finalResult = { winner: w, method: 'Решение', round: 5 };
      m.status = 'finished';
      m.finishedAt = Date.now();
      return;
    }
    return;
  }

  // Футбол
  if (m.sport === 'football') {
    if (m.minute === 45 && m.period === '1H') { m.period = 'HT'; m.breakLeft = 3; return; }
    if (m.minute >= 90) { m.status = 'finished'; m.finishedAt = Date.now(); return; }

    const { lh, la } = goalsRemaining(m);
    const rem = Math.max(1, m.maxMinute - m.minute);
    if (Math.random() < lh / rem) {
      m.scoreHome += 1;
      m.momentum = Math.min(1, m.momentum + 0.35);
      m.justScoredSide = 'home';
      addDrop(m, m.home, `${m.scoreHome}:${m.scoreAway}`);
    } else if (Math.random() < la / rem) {
      m.scoreAway += 1;
      m.momentum = Math.max(-1, m.momentum - 0.35);
      m.justScoredSide = 'away';
      addDrop(m, m.away, `${m.scoreHome}:${m.scoreAway}`);
    }
    return;
  }

  // Хоккей
  if (m.sport === 'hockey') {
    if (m.minute === 20 && m.period === 'P1') { m.period = 'BR1'; m.breakLeft = 3; return; }
    if (m.minute === 40 && m.period === 'P2') { m.period = 'BR2'; m.breakLeft = 3; return; }
    if (m.minute >= 60) { m.status = 'finished'; m.finishedAt = Date.now(); return; }

    const { lh, la } = goalsRemaining(m);
    const rem = Math.max(1, m.maxMinute - m.minute);
    if (Math.random() < lh / rem) {
      m.scoreHome += 1;
      m.momentum = Math.min(1, m.momentum + 0.35);
      m.justScoredSide = 'home';
      addDrop(m, m.home, `${m.scoreHome}:${m.scoreAway}`);
    } else if (Math.random() < la / rem) {
      m.scoreAway += 1;
      m.momentum = Math.max(-1, m.momentum - 0.35);
      m.justScoredSide = 'away';
      addDrop(m, m.away, `${m.scoreHome}:${m.scoreAway}`);
    }
    return;
  }
}

function addDrop(m, scorer, score) {
  liveDrops.unshift({ match: `${m.home} — ${m.away}`, event: `${sIcon(m.sport)} ${scorer} · ${score}`, id: Date.now() + Math.random() });
  if (liveDrops.length > 15) liveDrops.pop();
}

/* ============ AI КОММЕНТАТОР ============ */
function aiComment(m) {
  if (m.status === 'prematch') {
    const fav = m.sport === 'ufc' ? (m.homeRating > m.awayRating ? m.home : m.away) : (m.homeAttack > m.awayAttack ? m.home : m.away);
    return `Матч начнётся через ${fmtTime(m.startsIn)}. Фаворит — <b>${fav}</b>.`;
  }
  if (m.status === 'finished') {
    if (m.sport === 'ufc' && m.finalResult) {
      const w = m.finalResult.winner === 'home' ? m.home : m.away;
      return `Победа <b>${w}</b> — ${m.finalResult.method} в R${m.finalResult.round}.`;
    }
    const w = m.scoreHome > m.scoreAway ? m.home : m.scoreAway > m.scoreHome ? m.away : null;
    return w ? `Матч завершён. Победа <b>${w}</b> ${m.scoreHome}:${m.scoreAway}.` : `Ничья ${m.scoreHome}:${m.scoreAway}.`;
  }
  if (m.status === 'countdown') return `Новый матч через ${fmtTime(m.countdownLeft)}.`;

  const abs = Math.abs(m.momentum);
  const dom = m.momentum > 0 ? m.home : m.away;
  const oth = m.momentum > 0 ? m.away : m.home;

  if (m.sport === 'ufc') {
    if (abs > 0.5) return `Раунд ${m.round}. <b>${dom}</b> доминирует в стойке.`;
    return `Раунд ${m.round}. Равный бой.`;
  }

  const pr = m.sport === 'football'
    ? (m.period === '1H' ? '1-й тайм' : m.period === 'HT' ? 'перерыв' : '2-й тайм')
    : (m.period === 'P1' ? '1-й период' : m.period === 'P2' ? '2-й период' : m.period === 'P3' ? '3-й период' : 'перерыв');

  if (abs > 0.5) return `${pr}, ${m.minute}'. <b>${dom}</b> доминирует, ${oth} в защите.`;
  if (abs > 0.2) return `${pr}, ${m.minute}'. <b>${dom}</b> немного активнее.`;
  return `${pr}, ${m.minute}'. Равная борьба.`;
}

function renderLeagueFilters() {

  `;

function renderProgress(m) {
  if (m.status !== 'live' && m.status !== 'finished') return '';
  if (m.sport === 'football') {
    const h1 = Math.min(1, m.minute / 45);
    const h2 = Math.max(0, Math.min(1, (m.minute - 45) / 45));
    return `<div class="period-progress">
      <div class="period-seg ${h1 >= 1 ? 'done' : 'active'}" style="--p:${h1 * 100}%"></div>
      <div class="period-seg ${h2 >= 1 ? 'done' : 'active'}" style="--p:${h2 * 100}%"></div>
    </div>`;
  }
  if (m.sport === 'hockey') {
    const p1 = Math.min(1, m.minute / 20);
    const p2 = Math.max(0, Math.min(1, (m.minute - 20) / 20));
    const p3 = Math.max(0, Math.min(1, (m.minute - 40) / 20));
    return `<div class="period-progress">
      <div class="period-seg ${p1 >= 1 ? 'done' : 'active'}" style="--p:${p1 * 100}%"></div>
      <div class="period-seg ${p2 >= 1 ? 'done' : 'active'}" style="--p:${p2 * 100}%"></div>
      <div class="period-seg ${p3 >= 1 ? 'done' : 'active'}" style="--p:${p3 * 100}%"></div>
    </div>`;
  }
  if (m.sport === 'ufc') {
    const segs = [];
    for (let i = 1; i <= 5; i++) {
      const done = m.round > i || (m.status === 'finished' && m.round >= i);
      const active = m.round === i && m.status === 'live';
      let p = 0;
      if (active) p = ((m.minute % 15) / 12) * 100;
      if (done) p = 100;
      segs.push(`<div class="period-seg ${done ? 'done' : active ? 'active' : ''}" style="--p:${Math.min(100, p)}%"></div>`);
    }
    return `<div class="period-progress">${segs.join('')}</div>`;
  }
  return '';
}

function renderMatches() {
  let list = [...matches];
  if (currentFilter !== 'all') list = list.filter(m => m.sport === currentFilter);
  if (currentLeague !== 'all') list = list.filter(m => m.league === currentLeague);
  if (liveOnly) list = list.filter(m => m.status === 'live');
  if (favOnly) list = list.filter(m => favorites.has(m.id));
  if (search) {
    const q = search.toLowerCase();
    list = list.filter(m => m.home.toLowerCase().includes(q) || m.away.toLowerCase().includes(q) || m.league.toLowerCase().includes(q));
  }

  // UFC приоритет — сначала live UFC, потом остальные
  list.sort((a, b) => {
    const ord = { live: 0, prematch: 1, countdown: 2, finished: 3 };
    if (sortMode === 'time') {
      // UFC live первыми
      if (a.sport === 'ufc' && a.status === 'live' && !(b.sport === 'ufc' && b.status === 'live')) return -1;
      if (b.sport === 'ufc' && b.status === 'live' && !(a.sport === 'ufc' && a.status === 'live')) return 1;
      if (ord[a.status] !== ord[b.status]) return ord[a.status] - ord[b.status];
      return a.minute - b.minute;
    }
    if (sortMode === 'odd-high' || sortMode === 'odd-low') {
      const oa = computeOdds(a).home || 99;
      const ob = computeOdds(b).home || 99;
      return sortMode === 'odd-high' ? ob - oa : oa - ob;
    }
    return 0;
  });

  const el = $('matches');
  if (!list.length) {
    el.innerHTML = `<div class="empty"><div class="icon">🎯</div><div class="text">Матчей нет</div></div>`;
    return;
  }

  el.innerHTML = list.map(m => renderCard(m)).join('');
}

function renderCard(m, mini = false) {
  const odds = computeOdds(m);
  const isFin = m.status === 'finished';
  const isPre = m.status === 'prematch';
  const isCd = m.status === 'countdown';
  const extras = (!isFin && !isCd) ? computeExtras(m) : {};
  const keys = Object.keys(extras);
  const isOpen = openExtras.has(m.id);
  const isFav = favorites.has(m.id);

  const extrasH = keys.length && !mini ? `
    <div class="extras">
      <button class="extras-toggle ${isOpen ? 'open' : ''}" data-extras="${m.id}">
        ${isOpen ? '▲' : '▼'} Ещё ${keys.length} рынков
      </button>
      <div class="extras-grid ${isOpen ? 'open' : ''}">
        ${keys.map(l => {
          const o = extras[l];
          return `<button class="odds-mini" data-mid="${m.id}" data-mk="${encodeURIComponent(l)}" data-odd="${o}">
            <span class="odds-mini-label">${l}</span>
            <span class="odds-mini-value">${o.toFixed(2)}</span>
          </button>`;
        }).join('')}
      </div>
    </div>
  ` : '';

  const hA = `<div class="team-avatar ${m.justScoredSide === 'home' ? 'scored' : ''}" style="background:${teamColor(m.home)}">${teamInit(m.home)}</div>`;
  const aA = `<div class="team-avatar ${m.justScoredSide === 'away' ? 'scored' : ''}" style="background:${teamColor(m.away)}">${teamInit(m.away)}</div>`;

  const statsH = (m.status === 'live' || isFin) && m.sport !== 'ufc' ? `
    <div class="stats-bar">
      <span class="stat-item">Влад: <b>${Math.round(50 + m.momentum * 30)}—${Math.round(50 - m.momentum * 30)}%</b></span>
      <span class="stat-item">Удары: <b>${Math.max(0, Math.round(m.minute * 0.15 + m.scoreHome * 2))}—${Math.max(0, Math.round(m.minute * 0.12 + m.scoreAway * 2))}</b></span>
    </div>
  ` : '';

  let badge;
  if (isFin) badge = '<span class="badge finished">Завершён</span>';
  else if (isCd) badge = '<span class="badge countdown">⏱ Далее</span>';
  else if (isPre) badge = '<span class="badge prematch">Скоро</span>';
  else if (m.breakLeft > 0) badge = '<span class="badge break">⏸ Перерыв</span>';
  else badge = '<span class="badge live">LIVE</span>';

  let time = '';
  if (isCd) time = `<span class="time-info" style="color:var(--accent-2);font-weight:800">⏱ ${fmtTime(m.countdownLeft)}</span>`;
  else if (isPre) time = `<span class="time-info">⏰ через ${fmtTime(m.startsIn)}</span>`;
  else if (m.status === 'live') {
    let l = '';
    if (m.sport === 'football') l = m.period === '1H' ? '1-й' : m.period === 'HT' ? 'перерыв' : '2-й';
    else if (m.sport === 'hockey') l = m.period === 'P1' ? '1-й' : m.period === 'P2' ? '2-й' : m.period === 'P3' ? '3-й' : 'перерыв';
    else if (m.sport === 'ufc') l = `R${m.round}/5`;
    time = `<span class="time-info">${l} · ${m.minute}'</span>`;
  }

  let ufcFinal = '';
  if (m.sport === 'ufc' && isFin && m.finalResult) {
    const w = m.finalResult.winner === 'home' ? m.home : m.away;
    const ic = m.finalResult.method === 'KO/TKO' ? '💥' : m.finalResult.method === 'Сабмишн' ? '🤼' : '📋';
    ufcFinal = `<div class="ufc-final"><span class="ufc-final-icon">${ic}</span><div class="ufc-final-text">Победа: <b>${w}</b><br><span class="ufc-final-sub">${m.finalResult.method} · R${m.finalResult.round} · ${m.scoreHome}:${m.scoreAway}</span></div></div>`;
  }

  let score;
  if (isCd) score = `<span class="team-score" style="color:var(--muted)">—:—</span>`;
  else if (m.sport === 'ufc' && !isFin) score = `<span class="team-score" style="color:var(--muted)">—</span>`;
  else score = `<span class="team-score ${m.justScoredSide ? 'scored' : ''}">${m.scoreHome}:${m.scoreAway}</span>`;

  const ai = !mini && (m.status === 'live' || (isPre && m.startsIn <= 180)) ? `<div class="ai-panel" style="background:linear-gradient(135deg,rgba(123,92,255,.1),rgba(0,212,255,.06));border:1px solid var(--border-2);border-radius:var(--r-md);padding:10px 12px;margin:7px 0 4px;font-size:11.5px;line-height:1.4;position:relative;overflow:hidden;padding-left:15px"><div style="font-weight:800;font-size:10px;color:var(--accent-2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">🤖 AI</div><div style="color:var(--text-2)">${aiComment(m)}</div></div>` : '';

  const ufcClass = m.sport === 'ufc' && m.status === 'live' ? 'ufc-priority' : '';

  return `
    <div class="match ${isFin ? 'finished' : ''} ${ufcClass}">
      <div class="match-info">
        <div class="match-top">
          <span class="sport-icon">${sIcon(m.sport)}</span>
          <span class="match-league">${m.league}</span>
          ${badge}
          <button class="star-btn ${isFav ? 'active' : ''}" data-star="${m.id}">${isFav ? '★' : '☆'}</button>
        </div>
        <div class="teams-row">
          <div class="team">${hA}<span class="team-name">${m.home}</span></div>
          ${score}
          <div class="team">${aA}<span class="team-name">${m.away}</span></div>
          ${time}
        </div>
        ${renderProgress(m)}
        ${ufcFinal}
        ${statsH}
        ${ai}
      </div>
      <div class="odds">
        ${renderOddBtn(m, 'home', '1', odds.home, isFin || isPre || isCd)}
        ${m.sport !== 'ufc' ? renderOddBtn(m, 'draw', 'X', odds.draw, isFin || isPre || isCd) : ''}
        ${renderOddBtn(m, 'away', '2', odds.away, isFin || isPre || isCd)}
      </div>
      ${extrasH}
    </div>
  `;
}

    <div class="stat"><div class="stat-label">Профит</div><div class="stat-value ${prof >= 0 ? 'green' : 'red'}">${prof >= 0 ? '+' : ''}${fmt(prof)} ₽</div></div>
    <div class="stat"><div class="stat-label">Винрейт</div><div class="stat-value">${wr}%</div></div>
    <div class="stat"><div class="stat-label">ROI</div><div class="stat-value ${parseFloat(roi) >= 0 ? 'green' : 'red'}">${roi}%</div></div>
    <div class="stat"><div class="stat-label">Ставок</div><div class="stat-value">${wallet.bets.length}</div></div>
    <div class="stat"><div class="stat-label">Ожидание</div><div class="stat-value gold">${pend}</div></div>
  `;

  // По спортам
  const bySport = {};
  wallet.bets.forEach(b => {

    const s = b.sport || 'other';
    if (!bySport[s]) bySport[s] = { w: 0, l: 0, p: 0 };

    else { bySport[s].l++; bySport[s].p -= b.stake; }
  });
  const names = { football: '⚽ Футбол', hockey: '🏒 Хоккей', ufc: '🥊 UFC', other: '📦 Прочее' };
  const entries = Object.entries(bySport);
  $('sportStatsGrid').innerHTML = !entries.length
    ? '<div class="stat" style="grid-column:1/-1;text-align:center;color:var(--muted)">Пока нет данных</div>'
    : entries.map(([s, d]) => `<div class="stat"><div class="stat-label">${names[s] || s}</div><div class="stat-value ${d.p >= 0 ? 'green' : 'red'}">${d.p >= 0 ? '+' : ''}${fmt(d.p)} ₽</div><div style="font-size:10.5px;color:var(--muted);margin-top:3px">${d.w}W / ${d.l}L</div></div>`).join('');

  drawChart();
}

function drawChart() {
  const c = $('profitChart');
  if (!c) return;
  const ctx = c.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const r = c.getBoundingClientRect();
  c.width = r.width * dpr; c.height = r.height * dpr;
  ctx.scale(dpr, dpr);
  const w = r.width, h = r.height;
  ctx.clearRect(0, 0, w, h);

  const hist = wallet.profitHistory;
  if (!hist || hist.length < 2) {
    ctx.fillStyle = '#8585a0';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Играй — график появится', w / 2, h / 2);
    return;
  }

  const min = Math.min(...hist.map(p => p.v), 0);
  const max = Math.max(...hist.map(p => p.v), 0);
  const range = max - min || 1;

  ctx.strokeStyle = 'rgba(120,120,160,.08)';
  for (let i = 0; i <= 4; i++) {
    const y = (h / 4) * i;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  }

  const step = w / (hist.length - 1);
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, 'rgba(123,92,255,.4)');
  grad.addColorStop(1, 'rgba(123,92,255,0)');

  ctx.beginPath();
  hist.forEach((p, i) => {
    const x = i * step;
    const y = h - ((p.v - min) / range) * h * 0.9 - h * 0.05;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.strokeStyle = '#7b5cff';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.lineTo(w, h);
  ctx.lineTo(0, h);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();
}

function openBetModal(mid, pk, odd) {
  if (!isOddValid(odd)) return;
  const m = matches.find(x => x.id === mid);
  if (!m || m.status === 'finished' || m.status === 'countdown') return;

  activeBet = { matchId: mid, pick: pk, odd, isBuilder: false, isExpress: false };

  const lbl = pk === 'home' ? m.home : pk === 'away' ? m.away : pk === 'draw' ? 'Ничья' : pk;
  $('betModalTitle').textContent = `${m.home} — ${m.away}`;
  $('betModalSub').textContent = `${lbl} · ${m.scoreHome}:${m.scoreAway} · ${m.minute}'`;
  $('betModalOdd').textContent = odd.toFixed(2);
  $('betModalStake').value = '';
  $('betModalPotential').textContent = '—';
  $('betModalCoupon').style.display = 'block';
  $('betModalBuilder').style.display = (m.sport === 'football' || m.sport === 'hockey') ? 'block' : 'none';
  $('betModal').classList.add('active');
  updatePotential();
}

function closeBetModal() {
  $('betModal').classList.remove('active');
  activeBet = null;
}

function updatePotential() {
  if (!activeBet) return;
  const s = parseFloat($('betModalStake').value) || 0;
  $('betModalPotential').textContent = s > 0 ? `${fmt(s * activeBet.odd)} ₽` : '—';
}

function placeBet() {
  if (!activeBet) return;
  const stake = parseFloat($('betModalStake').value);
  if (!stake || stake < 10 || stake > wallet.balance) return;

  if (activeBet.isExpress) {
    const sel = activeBet.selections.map(s => ({ matchId: s.matchId, pick: s.pick, odd: s.odd, label: s.label, match: s.match, status: 'pending' }));
    wallet.balance -= stake;
    wallet.totalBet += stake;
    wallet.bets.unshift({
      id: Date.now(), type: 'express', match: `Экспресс · ${sel.length}`, selections: sel,
      odd: activeBet.odd, stake, potential: Math.round(stake * activeBet.odd * 100) / 100,
      status: 'pending', createdAt: new Date().toISOString(),
    });
    coupon = [];
    saveCoupon();
    renderCoupon();
  } else if (activeBet.isBuilder) {
    const m = matches.find(x => x.id === activeBet.matchId);
    if (!m) return;
    const sel = activeBet.selections.map(s => ({ matchId: m.id, pick: s.pick, odd: s.odd, label: s.label, match: `${m.home} — ${m.away}`, status: 'pending' }));
    wallet.balance -= stake;
    wallet.totalBet += stake;
    wallet.bets.unshift({
      id: Date.now(), type: 'builder', matchId: m.id, match: `${m.home} — ${m.away} (билдер)`,
      sport: m.sport, selections: sel, odd: activeBet.odd, stake,
      potential: Math.round(stake * activeBet.odd * 100) / 100,
      status: 'pending', createdAt: new Date().toISOString(),
    });
    delete builderBets[activeBet.matchId];
  } else {
    const m = matches.find(x => x.id === activeBet.matchId);
    if (!m || m.status === 'finished') return;
    wallet.balance -= stake;
    wallet.totalBet += stake;
    wallet.bets.unshift({
      id: Date.now(), type: 'single', matchId: m.id, match: `${m.home} — ${m.away}`,
      sport: m.sport, pick: activeBet.pick, odd: activeBet.odd, stake,
      potential: Math.round(stake * activeBet.odd * 100) / 100,
      status: 'pending', minute: m.minute, score: `${m.scoreHome}:${m.scoreAway}`,
      createdAt: new Date().toISOString(),
    });
  }

  saveWallet();
  flashBalance('win');
  renderBalance();
  renderHistory();
  renderStats();
  renderAchiv();
  sBet();
  vibe(20);
  closeBetModal();
}

function addBuilder() {
  if (!activeBet) return;
  const { matchId, pick, odd } = activeBet;
  if (!builderBets[matchId]) builderBets[matchId] = [];

  for (const b of builderBets[matchId]) {
    if (b.pick === pick) return;
    const t1 = b.pick.match(/^(ТБ|ТМ)\s+([\d.]+)$/);
    const t2 = pick.match(/^(ТБ|ТМ)\s+([\d.]+)$/);
    if (t1 && t2 && t1[2] === t2[2] && t1[1] !== t2[1]) { alert('Конфликт ТБ/ТМ'); return; }
  }

  builderBets[matchId].push({ pick, odd, label: pick === 'home' ? '1' : pick === 'away' ? '2' : pick === 'draw' ? 'X' : pick });
  const total = builderBets[matchId].reduce((a, c) => a * c.odd, 1);
  const m = matches.find(x => x.id === matchId);

  closeBetModal();
  activeBet = { matchId, isBuilder: true, odd: total, selections: [...builderBets[matchId]] };
  $('betModalTitle').textContent = `🧩 Билдер · ${m.home} — ${m.away}`;
  $('betModalSub').textContent = builderBets[matchId].map(b => `${b.label} @ ${b.odd.toFixed(2)}`).join(' + ');
  $('betModalOdd').textContent = total.toFixed(2);
  $('betModalStake').value = '';
  $('betModalPotential').textContent = '—';
  $('betModalCoupon').style.display = 'none';
  $('betModalBuilder').style.display = 'none';
  $('betModal').classList.add('active');
  updatePotential();
}

/* ============ КУПОН ============ */
function addCoupon(mid, pk, odd, lbl) {
  if (!isOddValid(odd)) return;
  if (coupon.find(c => c.matchId === mid)) return;
  const m = matches.find(x => x.id === mid);
  if (!m) return;
  coupon.push({ matchId: mid, pick: pk, odd, label: lbl, match: `${m.home} — ${m.away}` });
  saveCoupon();
  renderCoupon();
}

function renderCoupon() {
  const el = $('couponBar');
  if (!coupon.length) {
    el.classList.remove('active');
    document.body.classList.remove('has-coupon');
    return;
  }
  el.classList.add('active');
  document.body.classList.add('has-coupon');
  const total = coupon.reduce((a, c) => a * c.odd, 1);
  el.innerHTML = `
    <div class="coupon-inner">
      <div class="coupon-items">
        ${coupon.map((c, i) => `
          <div class="coupon-item">
            <div class="coupon-item-info">
              <div class="coupon-item-match">${c.match}</div>
              <div class="coupon-item-pick">${c.label} @ ${c.odd.toFixed(2)}</div>
            </div>
            <button class="coupon-item-remove" data-rm="${i}">×</button>
          </div>
        `).join('')}
      </div>
      <div class="coupon-actions">
        <button class="coupon-clear" id="couponClear">Очистить</button>
        <button class="coupon-place" id="couponPlace">Экспресс · ${coupon.length} · @ ${total.toFixed(2)}</button>
      </div>
    </div>

  el.querySelectorAll('[data-rm]').forEach(b => {

  });
  const cb = $('couponClear'); if (cb) cb.onclick = () => { coupon = []; saveCoupon(); renderCoupon(); };
  const pb = $('couponPlace'); if (pb) pb.onclick = openExpress;

function openExpress() {
  if (coupon.length < 2) return;
  const total = coupon.reduce((a, c) => a * c.odd, 1);
  activeBet = { isExpress: true, odd: total, selections: [...coupon] };
  $('betModalTitle').textContent = `Экспресс · ${coupon.length}`;
  $('betModalSub').textContent = coupon.map(c => `${c.label} @ ${c.odd.toFixed(2)}`).join(' + ');
  $('betModalOdd').textContent = total.toFixed(2);
  $('betModalStake').value = '';
  $('betModalPotential').textContent = '—';
  $('betModalCoupon').style.display = 'none';
  $('betModalBuilder').style.display = 'none';
  $('betModal').classList.add('active');
  updatePotential();
}

/* ============ КЭШАУТ ============ */
function cashoutValue(b, m) {
  if (!m || m.status !== 'live' || b.status !== 'pending') return 0;

  if (b.type === 'express') {
    let cv = 1;
    for (const sel of b.selections) {
      const sm = matches.find(x => Number(x.id) === Number(sel.matchId));
      if (!sm) return 0;
      if (sm.status === 'finished') { if (sel.status === 'lost') return 0; continue; }
      if (sm.status === 'live') {
        const odds = computeOdds(sm);
        const cur = odds[sel.pick];
        if (!isOddValid(cur)) return 0;
        cv *= 1 / cur;
      } else return 0;
    }
    const fair = b.potential * cv;
    const pay = Math.max(b.stake * 0.1, Math.round(fair * 0.9 * 100) / 100);
    return Math.min(pay, b.potential * 0.98);
  }

  if (b.type === 'builder') {
    const sm = matches.find(x => Number(x.id) === Number(b.matchId));
    if (!sm || sm.status !== 'live') return 0;
    return Math.round(b.stake * 0.5 * 100) / 100;
  }

  const cur = computeOdds(m);
  if (!b.pick || !isOddValid(cur[b.pick])) return Math.round(b.stake * 0.5 * 100) / 100;
  const fair = b.potential / cur[b.pick];
  const pay = Math.max(b.stake * 0.1, Math.round(fair * 0.92 * 100) / 100);
  return Math.min(pay, b.potential);
}

function doCashout(id) {
  const b = wallet.bets.find(x => x.id === id);
  if (!b || b.status !== 'pending') return;
  let co = 0;
  if (b.type === 'express' || b.type === 'builder') {
    for (const sel of b.selections) {
      const sm = matches.find(x => Number(x.id) === Number(sel.matchId));
      if (sm && sm.status === 'live') { co = cashoutValue(b, sm); break; }
    }
  } else {
    const m = matches.find(x => x.id === b.matchId);
    if (m) co = cashoutValue(b, m);
  }
  if (co <= 0) return;
  b.status = 'won';
  b.payout = co;
  b.cashout = true;
  wallet.balance += co;
  wallet.totalWon += co;
  saveWallet();
  flashBalance('win');
  renderBalance();
  renderHistory();
  renderStats();
  renderAchiv();
  sBet();
}

/* ============ РАСЧЁТ ============ */
function checkSel(m, pick) {
  if (!m || m.status !== 'finished') return 'pending';
  const tot = m.scoreHome + m.scoreAway;

  if (m.sport === 'ufc') {
    if (!m.finalResult) {
      const w = m.scoreHome > m.scoreAway ? 'home' : m.scoreAway > m.scoreHome ? 'away' : 'home';
      m.finalResult = { winner: w, method: 'Решение', round: 5 };
    }
    const fr = m.finalResult;
    const isH = fr.winner === 'home', isA = fr.winner === 'away';
    const md = fr.method, rr = fr.round, fin = md !== 'Решение';

    if (pick === 'home') return isH ? 'won' : 'lost';
    if (pick === 'away') return isA ? 'won' : 'lost';
    if (pick === 'Метод · KO/TKO') return md === 'KO/TKO' ? 'won' : 'lost';
    if (pick === 'Метод · Сабмишн') return md === 'Сабмишн' ? 'won' : 'lost';
    if (pick === 'Метод · Решение') return md === 'Решение' ? 'won' : 'lost';
    if (pick === 'Бой досрочно') return fin ? 'won' : 'lost';
    if (pick === 'Пройти всю дистанцию') return !fin ? 'won' : 'lost';
    const uR = pick.match(/^Тотал (Б|М) (\d+)\.5 раундов$/);
    if (uR) { const l = +uR[2]; return uR[1] === 'Б' ? (rr > l ? 'won' : 'lost') : (rr < l ? 'won' : 'lost'); }
    const fR = pick.match(/^Финиш в R(\d+)\+?$/);
    if (fR) { const t = +fR[1]; if (pick.includes('+')) return (fin && rr >= t) ? 'won' : 'lost'; return (fin && rr === t) ? 'won' : 'lost'; }
    if (pick === `${m.home} KO/TKO`) return (isH && md === 'KO/TKO') ? 'won' : 'lost';
    if (pick === `${m.home} Сабмишн`) return (isH && md === 'Сабмишн') ? 'won' : 'lost';
    if (pick === `${m.home} Решение`) return (isH && md === 'Решение') ? 'won' : 'lost';
    if (pick === `${m.away} KO/TKO`) return (isA && md === 'KO/TKO') ? 'won' : 'lost';
    if (pick === `${m.away} Сабмишн`) return (isA && md === 'Сабмишн') ? 'won' : 'lost';
    if (pick === `${m.away} Решение`) return (isA && md === 'Решение') ? 'won' : 'lost';
    return 'lost';
  }

  if (pick === 'home') return m.scoreHome > m.scoreAway ? 'won' : 'lost';
  if (pick === 'away') return m.scoreAway > m.scoreHome ? 'won' : 'lost';
  if (pick === 'draw') return m.scoreHome === m.scoreAway ? 'won' : 'lost';
  if (pick === '1X') return m.scoreHome >= m.scoreAway ? 'won' : 'lost';
  if (pick === '12') return m.scoreHome !== m.scoreAway ? 'won' : 'lost';
  if (pick === 'X2') return m.scoreHome <= m.scoreAway ? 'won' : 'lost';

  const tO = pick.match(/^ТБ\s*([\d.]+)$/);
  const tU = pick.match(/^ТМ\s*([\d.]+)$/);
  if (tO) return tot > parseFloat(tO[1]) ? 'won' : 'lost';
  if (tU) return tot < parseFloat(tU[1]) ? 'won' : 'lost';

  const f1 = pick.match(/^Ф1\s*([−\-+]?[\d.]+)$/);
  const f2 = pick.match(/^Ф2\s*([−\-+]?[\d.]+)$/);
  if (f1) return (m.scoreHome - m.scoreAway) > parseFloat(f1[1].replace('−', '-')) ? 'won' : 'lost';
  if (f2) return (m.scoreAway - m.scoreHome) > parseFloat(f2[1].replace('−', '-')) ? 'won' : 'lost';

  if (pick === 'Обе · Да') return (m.scoreHome >= 1 && m.scoreAway >= 1) ? 'won' : 'lost';
  if (pick === 'Обе · Нет') return !(m.scoreHome >= 1 && m.scoreAway >= 1) ? 'won' : 'lost';
  if (pick === 'Чёт') return tot % 2 === 0 ? 'won' : 'lost';
  if (pick === 'Нечет') return tot % 2 !== 0 ? 'won' : 'lost';

  const hT = pick.match(new RegExp(`^${m.home.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\s+(Б|М)\\s+([\\d.]+)$`));
  const aT = pick.match(new RegExp(`^${m.away.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\s+(Б|М)\\s+([\\d.]+)$`));
  if (hT) { const l = parseFloat(hT[2]); return hT[1] === 'Б' ? (m.scoreHome > l ? 'won' : 'lost') : (m.scoreHome < l ? 'won' : 'lost'); }
  if (aT) { const l = parseFloat(aT[2]); return aT[1] === 'Б' ? (m.scoreAway > l ? 'won' : 'lost') : (m.scoreAway < l ? 'won' : 'lost'); }

  const cs = pick.match(/^Счёт\s+(\d+):(\d+)$/);
  if (cs) return (m.scoreHome === +cs[1] && m.scoreAway === +cs[2]) ? 'won' : 'lost';

  return 'lost';
}

function settleBets() {
  let changed = false;
  wallet.bets.forEach(b => {
    if (b.status !== 'pending') return;

    if (b.type === 'express' || b.type === 'builder') {
      let anyL = false, allW = true, allD = true;
      for (const sel of b.selections) {
        if (sel.status === 'lost') { anyL = true; continue; }
        if (sel.status === 'won') continue;
        const m = matches.find(x => Number(x.id) === Number(sel.matchId));
        if (!m || m.status !== 'finished') { allD = false; allW = false; continue; }
        const r = checkSel(m, sel.pick);
        sel.status = r;
        if (r === 'lost') { anyL = true; allW = false; }
      }
      if (anyL) {
        b.status = 'lost'; sLose(); flashBalance('lose'); changed = true;
        wallet.profitHistory.push({ t: Date.now(), v: wallet.totalWon - wallet.totalBet });
        return;
      }
      if (allD && allW && b.selections.every(s => s.status === 'won')) {
        b.status = 'won';
        b.payout = Math.round(b.stake * b.odd * 100) / 100;
        wallet.balance += b.payout;
        wallet.totalWon += b.payout;
        sWin(); vibe(50); flashBalance('win'); changed = true;
        wallet.profitHistory.push({ t: Date.now(), v: wallet.totalWon - wallet.totalBet });
        if (wallet.profitHistory.length > 100) wallet.profitHistory.shift();
      }
      return;
    }

    const m = matches.find(x => Number(x.id) === Number(b.matchId));
    if (!m || m.status !== 'finished') return;
    const r = checkSel(m, b.pick);
    if (r === 'won') {
      b.status = 'won';
      b.payout = Math.round(b.stake * b.odd * 100) / 100;
      wallet.balance += b.payout;
      wallet.totalWon += b.payout;
      sWin(); vibe(50); flashBalance('win');
    } else {
      b.status = 'lost'; sLose(); flashBalance('lose');
    }
    changed = true;
    wallet.profitHistory.push({ t: Date.now(), v: wallet.totalWon - wallet.totalBet });
    if (wallet.profitHistory.length > 100) wallet.profitHistory.shift();
  });
  if (changed) {
    saveWallet();
    renderBalance();
    renderHistory();
    renderStats();
    renderAchiv();
  }
}

/* ============ CSV ============ */
function exportCSV() {
  const rows = [['Дата', 'Матч', 'Тип', 'Исход', 'Кэф', 'Ставка', 'Потенциал', 'Статус', 'Выплата']];
  wallet.bets.forEach(b => {
    rows.push([new Date(b.createdAt).toLocaleString('ru-RU'), b.match, b.type || 'single', b.pick || '', b.odd, b.stake, b.potential, b.status, b.payout || 0]);
  });
  const csv = rows.map(r => r.map(v => `"${v}"`).join(',')).join('\n');
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `openbet_${Date.now()}.csv`;
  a.click();
}

/* ============ ГЛАВНЫЙ ЦИКЛ ============ */
function tick() {
  resetDaily();

  matches.forEach(m => {
    if (m.status === 'live' || m.status === 'prematch' || m.status === 'countdown') tickMatch(m);
  });

  matches.forEach(m => {
    if (m.status === 'finished' && !m.countdownStarted) {
      m.finishedAt = m.finishedAt || Date.now();
      if (Date.now() - m.finishedAt > 5000) {
        m.countdownStarted = true;
        m.status = 'countdown';
        m.countdownLeft = 30;
      }
    }
  });

  settleBets();

  // Поддержание линии: всегда 3 UFC + 4+ других
  const ufcActive = matches.filter(m => m.sport === 'ufc' && (m.status === 'live' || m.status === 'prematch')).length;
  const otherActive = matches.filter(m => m.sport !== 'ufc' && (m.status === 'live' || m.status === 'prematch')).length;

  // UFC — добиваем до 3 всегда
  if (ufcActive < 3) {
    const need = 3 - ufcActive;
    for (let i = 0; i < need; i++) {
      const startsIn = i === 0 ? 0 : (ufcActive + i) * 100;
      const m = newUFC(i > 0, startsIn);
      if (i === 0) m.minute = 0;
      matches.push(m);
    }
    renderLeagueFilters();
  }

  // Остальные — минимум 6 активных
  if (otherActive < 6) {
    const need = 6 - otherActive;
    for (let i = 0; i < need; i++) {
      const startsIn = rand(20, 120);
      matches.push(newRandom(true, startsIn));
    }
    renderLeagueFilters();
  }

  // Чистим старые завершённые (больше 10 штук)
  if (matches.length > 25) {
    matches = matches.filter(m => m.status !== 'finished').concat(matches.filter(m => m.status === 'finished').slice(0, 5));
  }

  renderMatches();
  renderDrops();
  if ($('tab-stats').classList.contains('active')) renderStats();
  if ($('tab-history').classList.contains('active')) renderHistory();
  if ($('tab-multi').classList.contains('active')) renderMulti();
  if ($('tab-top').classList.contains('active')) renderTop();
  if ($('tab-achiv').classList.contains('active')) renderAchiv();
}

/* ============ ДЕЛЕГИРОВАНИЕ ============ */
document.addEventListener('click', (e) => {
  const mainBtn = e.target.closest('.odds-btn[data-match-id]');
  if (mainBtn && !mainBtn.disabled && !mainBtn.classList.contains('disabled')) {
    const mid = parseInt(mainBtn.dataset.matchId);
    const pk = mainBtn.dataset.pick;
    const odd = parseFloat(mainBtn.dataset.odd);
    if (!isNaN(mid) && pk && isOddValid(odd)) { openBetModal(mid, pk, odd); return; }
  }

  const miniBtn = e.target.closest('.odds-mini[data-mid]');
  if (miniBtn && !miniBtn.disabled && !miniBtn.classList.contains('disabled')) {
    const mid = parseInt(miniBtn.dataset.mid);
    const pk = decodeURIComponent(miniBtn.dataset.mk);
    const odd = parseFloat(miniBtn.dataset.odd);
    if (!isNaN(mid) && pk && isOddValid(odd)) { openBetModal(mid, pk, odd); return; }
  }

  const exBtn = e.target.closest('[data-extras]');
  if (exBtn) {
    const id = parseInt(exBtn.dataset.extras);
    if (openExtras.has(id)) openExtras.delete(id);
    else openExtras.add(id);
    renderMatches();
    return;
  }

  const stBtn = e.target.closest('[data-star]');
  if (stBtn) {
    e.stopPropagation();
    const id = parseInt(stBtn.dataset.star);
    if (favorites.has(id)) favorites.delete(id);
    else favorites.add(id);
    saveFavs();
    renderMatches();
    return;
  }

  const coBtn = e.target.closest('[data-cashout]');
  if (coBtn) {
    e.stopPropagation();
    doCashout(parseInt(coBtn.dataset.cashout));
    return;
  }

  const hItem = e.target.closest('[data-history]');
  if (hItem && !e.target.closest('[data-cashout]')) {
    const bid = parseInt(hItem.dataset.history);
    const bet = wallet.bets.find(x => x.id === bid);
    if (bet && bet.matchId) {
      const m = matches.find(x => x.id === bet.matchId);
      if (!m) alert('Матч не найден — заменён');
      else if (m.status === 'finished') alert(`Завершён: ${m.home} ${m.scoreHome}:${m.scoreAway} ${m.away}`);
      else if (m.status === 'prematch') alert(`Начнётся через ${fmtTime(m.startsIn)}`);
      else if (m.status === 'countdown') alert(`Новый через ${fmtTime(m.countdownLeft)}`);
      else alert(`${m.home} ${m.scoreHome}:${m.scoreAway} ${m.away}\n${m.minute}' · live`);
    }
    return;
  }

  if (e.target.closest('#balanceBox')) { claimBonus(); return; }
});

$('liveOnly').onclick = () => { liveOnly = !liveOnly; $('liveOnly').classList.toggle('active', liveOnly); renderMatches(); };
$('favOnly').onclick = () => { favOnly = !favOnly; $('favOnly').classList.toggle('active', favOnly); renderMatches(); };

$('sortBtn').onclick = () => {
  const modes = ['time', 'odd-high', 'odd-low'];
  sortMode = modes[(modes.indexOf(sortMode) + 1) % modes.length];
  const lbl = { time: '↕ Время', 'odd-high': '↕ Кэф ↑', 'odd-low': '↕ Кэф ↓' };
  $('sortBtn').textContent = lbl[sortMode];
  renderMatches();
};

$('searchInput').addEventListener('input', (e) => { search = e.target.value; renderMatches(); });
$('csvBtn').onclick = exportCSV;

$('betModalStake').addEventListener('input', updatePotential);
$$('.quick-stake').forEach(btn => {
  btn.onclick = () => {
    const v = btn.dataset.stake;
    $('betModalStake').value = v === 'all' ? Math.floor(wallet.balance) : v;
    updatePotential();
  };
});

$('betModalConfirm').onclick = placeBet;
$('betModalCancel').onclick = closeBetModal;
$('betModalBuilder').onclick = addBuilder;
$('betModalCoupon').onclick = () => {
  if (!activeBet) return;
  const lbl = activeBet.pick === 'home' ? '1' : activeBet.pick === 'draw' ? 'X' : activeBet.pick === 'away' ? '2' : activeBet.pick;
  addCoupon(activeBet.matchId, activeBet.pick, activeBet.odd, lbl);
  closeBetModal();
};
$('betModal').onclick = (e) => { if (e.target.id === 'betModal') closeBetModal(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeBetModal(); });

$('soundBtn').onclick = () => {
  soundOn = !soundOn;
  saveSound();
  $('soundBtn').textContent = soundOn ? '🔊' : '🔇';
  $('soundBtn').classList.toggle('muted', !soundOn);
};

$('themeBtn').onclick = () => {
  theme = theme === 'dark' ? 'light' : 'dark';
  applyTheme();
  saveTheme();
};

function applyTheme() {
  if (theme === 'light') { document.body.classList.add('light'); $('themeBtn').textContent = '☀️'; }
  else { document.body.classList.remove('light'); $('themeBtn').textContent = '🌙'; }
}

$('newLineBtn').onclick = () => {
  matches = createMatches(15);
  openExtras.clear();
  builderBets = {};
  saveMatches();
  renderMatches();
  renderLeagueFilters();
};

window.addEventListener('resize', () => {
  if ($('tab-stats').classList.contains('active')) drawChart();
});

/* ============ СТАРТ ============ */
loadWallet();
loadCoupon();
loadSound();
loadTheme();
loadFavs();

$('matches').innerHTML = Array(5).fill('<div class="skeleton skeleton-match"></div>').join('');

setTimeout(() => {
  const saved = loadMatches();
  matches = saved || createMatches(15);

  $('soundBtn').textContent = soundOn ? '🔊' : '🔇';
  $('soundBtn').classList.toggle('muted', !soundOn);
  applyTheme();

  renderBalance();
  renderLeagueFilters();
  renderMatches();
  renderHistory();
  renderStats();
  renderCoupon();
  renderAchiv();
  updateBonus();

  setInterval(tick, 1000);
  setInterval(saveMatches, 2000);
}, 300);
