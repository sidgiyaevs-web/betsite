<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ballon d'Or 2027 — VIP Голосование</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #d4af37;
    --gold-light: #f5d76e;
    --gold-dark: #b8860b;
    --bg-dark: #08080c;
    --card-bg: rgba(25, 25, 35, 0.7);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Montserrat', sans-serif;
    background-color: var(--bg-dark);
    min-height: 100vh;
    color: #fff;
    overflow-x: hidden;
    padding-bottom: 80px;
  }

  /* Фоновые свечения */
  body::before {
    content: ''; position: fixed; top: -20%; left: -10%;
    width: 50vw; height: 50vw;
    background: radial-gradient(circle, rgba(212,175,55,0.1) 0%, transparent 70%);
    z-index: -1; pointer-events: none;
  }
  body::after {
    content: ''; position: fixed; bottom: -20%; right: -10%;
    width: 60vw; height: 60vw;
    background: radial-gradient(circle, rgba(212,175,55,0.08) 0%, transparent 70%);
    z-index: -1; pointer-events: none;
  }

  /* Шапка */
  header {
    text-align: center;
    padding: 70px 20px 40px;
    position: relative;
  }

  .ballon-icon {
    font-size: 70px;
    display: inline-block;
    animation: float 4s ease-in-out infinite;
    filter: drop-shadow(0 0 30px rgba(212,175,55,0.8));
  }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-15px) rotate(5deg); }
  }

  h1 {
    font-size: clamp(32px, 6vw, 64px);
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 4px;
    background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin: 15px 0 10px;
    animation: shine 4s linear infinite;
    background-size: 200% auto;
  }

  @keyframes shine {
    to { background-position: 200% center; }
  }

  .subtitle {
    color: #888;
    font-size: 16px;
    font-weight: 400;
    max-width: 600px;
    margin: 0 auto;
    line-height: 1.6;
    letter-spacing: 0.5px;
  }

  /* Статус */
  .vote-status {
    text-align: center;
    margin: 30px auto;
    max-width: 650px;
    padding: 16px 30px;
    border-radius: 50px;
    background: rgba(212,175,55,0.05);
    border: 1px solid rgba(212,175,55,0.2);
    backdrop-filter: blur(10px);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.5px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    transition: all 0.4s ease;
  }

  .vote-status.voted {
    background: rgba(46,204,113,0.1);
    border-color: rgba(46,204,113,0.4);
    color: #7bed9f;
    box-shadow: 0 4px 20px rgba(46,204,113,0.15);
  }

  /* Сетка */
  .players-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 30px;
    max-width: 1200px;
    margin: 40px auto;
    padding: 0 30px;
  }

  /* Карточка */
  .player-card {
    background: var(--card-bg);
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.05);
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    position: relative;
    backdrop-filter: blur(15px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }

  .player-card::before {
    content: ''; position: absolute; inset: 0;
    border-radius: 20px; padding: 2px;
    background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent, rgba(255,255,255,0.05));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    pointer-events: none; z-index: 3;
  }

  .player-card:hover {
    transform: translateY(-10px) scale(1.02);
    box-shadow: 0 20px 40px rgba(212,175,55,0.2);
    border-color: rgba(212,175,55,0.3);
  }

  .player-card.selected {
    transform: translateY(-10px) scale(1.02);
    box-shadow: 0 0 40px rgba(212,175,55,0.4), inset 0 0 20px rgba(212,175,55,0.1);
    border-color: var(--gold);
  }

  .player-card.disabled {
    cursor: default;
    opacity: 0.6;
    filter: grayscale(40%);
  }

  .player-card.disabled:hover {
    transform: none;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    border-color: rgba(255,255,255,0.05);
  }

  /* Фото */
  .photo-wrap {
    width: 100%;
    aspect-ratio: 1/1;
    background: #111;
    position: relative;
    overflow: hidden;
  }

  .player-photo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    display: block;
    transition: all 0.5s ease;
    opacity: 0;
    transform: scale(1.05);
  }

  .player-card:hover .player-photo { transform: scale(1.1); }
  .player-photo.loaded { opacity: 1; transform: scale(1); }

  .photo-loader {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--gold);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;
    background: linear-gradient(45deg, #111, #1a1a24, #111);
    background-size: 200% 200%;
    animation: gradientMove 2s infinite;
  }

  @keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* Градиент поверх фото снизу */
  .photo-wrap::after {
    content: ''; position: absolute; bottom: 0; left: 0; right: 0;
    height: 40%; background: linear-gradient(to top, #14141f, transparent);
    pointer-events: none;
  }

  /* Инфо */
  .player-info {
    padding: 20px;
    text-align: center;
    position: relative;
    z-index: 2;
  }

  .player-name {
    font-size: 18px;
    font-weight: 800;
    margin-bottom: 4px;
    letter-spacing: 0.5px;
  }

  .player-club {
    font-size: 12px;
    color: var(--gold);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 15px;
    font-weight: 600;
  }

  /* Прогресс-бар */
  .votes-bar {
    height: 8px;
    background: rgba(255,255,255,0.05);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 10px;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
  }

  .votes-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold-dark), var(--gold-light), var(--gold));
    width: 0%;
    transition: width 1s cubic-bezier(0.2, 0.8, 0.2, 1);
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(212,175,55,0.5);
  }

  .votes-count {
    font-size: 13px;
    color: #aaa;
    font-weight: 600;
  }
  
  .votes-count span {
    color: var(--gold-light);
    font-size: 15px;
    font-weight: 800;
  }

  /* Бейдж выбора */
  .selected-badge {
    position: absolute;
    top: 15px;
    right: 15px;
    background: linear-gradient(135deg, var(--gold-light), var(--gold-dark));
    color: #000;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 20px;
    box-shadow: 0 4px 15px rgba(212,175,55,0.6);
    animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 4;
  }

  @keyframes pop {
    0% { transform: scale(0) rotate(-45deg); }
    80% { transform: scale(1.2) rotate(10deg); }
    100% { transform: scale(1) rotate(0); }
  }

  /* Кнопка */
  .btn-container {
    text-align: center;
    margin: 50px 20px;
  }

  .vote-btn {
    background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-dark));
    color: #000;
    border: none;
    padding: 18px 60px;
    font-size: 18px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 2px;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 10px 30px rgba(212,175,55,0.3);
    position: relative;
    overflow: hidden;
    font-family: inherit;
  }

  .vote-btn::after {
    content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
    transition: left 0.5s ease;
  }

  .vote-btn:hover:not(:disabled) {
    transform: translateY(-4px);
    box-shadow: 0 15px 40px rgba(212,175,55,0.5);
  }

  .vote-btn:hover:not(:disabled)::after { left: 100%; }

  .vote-btn:disabled {
    background: #222;
    color: #555;
    cursor: not-allowed;
    box-shadow: none;
    border: 1px solid #333;
  }

  footer {
    text-align: center;
    color: #444;
    font-size: 12px;
    margin-top: 50px;
    padding: 0 20px;
    line-height: 1.8;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* Тост */
  .toast {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%) translateY(150px);
    background: rgba(46, 204, 113, 0.9);
    backdrop-filter: blur(10px);
    color: #fff;
    padding: 16px 36px;
    border-radius: 50px;
    font-weight: 800;
    font-size: 15px;
    letter-spacing: 1px;
    box-shadow: 0 10px 40px rgba(46, 204, 113, 0.4);
    transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 1000;
    border: 1px solid rgba(255,255,255,0.2);
  }

  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <div class="ballon-icon">🏆</div>
  <h1>Ballon d'Or 2027</h1>
  <p class="subtitle">Эксклюзивное народное голосование. Кто достоин «Золотого мяча» 2027 года?</p>
</header>

<div class="vote-status" id="voteStatus">Загрузка данных...</div>

<div class="players-grid" id="playersGrid"></div>

<div class="btn-container">
  <button class="vote-btn" id="voteBtn" disabled>Проголосовать</button>
</div>

<footer>
  VIP Демо-версия · Голос сохраняется в вашем браузере<br>
  Фото загружаются с Wikimedia Commons
</footer>

<div class="toast" id="toast">✅ ГОЛОС УЧТЁН</div>

<script>
  const players = [
    { id: 1, name: "Ламин Ямаль", club: "Барселона", wiki: "Lamine Yamal" },
    { id: 2, name: "Килиан Мбаппе", club: "Реал Мадрид", wiki: "Kylian Mbappé" },
    { id: 3, name: "Гарри Кейн", club: "Бавария", wiki: "Harry Kane" },
    { id: 4, name: "Лионель Месси", club: "Интер Майами", wiki: "Lionel Messi" }
  ];

  let selectedId = null;
  let hasVoted = localStorage.getItem('vip_voted') === 'true';
  let myVote = parseInt(localStorage.getItem('vip_myVote') || '0');
  
  let votes = JSON.parse(localStorage.getItem('vip_votes') || 'null');
  if (!votes) votes = { 1: 1420, 2: 1890, 3: 960, 4: 2100 };

  const grid = document.getElementById('playersGrid');
  const voteBtn = document.getElementById('voteBtn');
  const voteStatus = document.getElementById('voteStatus');
  const toast = document.getElementById('toast');

  async function fetchPhoto(wikiTitle) {
    const url = `https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*` +
      `&prop=pageimages&piprop=original&titles=${encodeURIComponent(wikiTitle)}`;
    try {
      const res = await fetch(url);
      const data = await res.json();
      const page = Object.values(data.query.pages)[0];
      return page?.original?.source || null;
    } catch { return null; }
  }

  function render() {
    const maxVotes = Math.max(...Object.values(votes), 1);
    grid.innerHTML = '';

    for (const p of players) {
      const card = document.createElement('div');
      card.className = 'player-card';
      
      // Если голос уже отдан, блокируем все, кроме выбранного (чтобы показать за кого голосовали)
      if (hasVoted) {
        if (p.id === myVote) {
          card.classList.add('selected');
        } else {
          card.classList.add('disabled');
        }
      } else if (p.id === selectedId) {
        card.classList.add('selected');
      }

      const pct = Math.round((votes[p.id] || 0) / maxVotes * 100);

      card.innerHTML = `
        ${(p.id === selectedId || (hasVoted && p.id === myVote)) ? '<div class="selected-badge">✓</div>' : ''}
        <div class="photo-wrap">
          <div class="photo-loader" id="loader-${p.id}">ЗАГРУЗКА...</div>
          <img class="player-photo" id="photo-${p.id}" alt="${p.name}">
        </div>
        <div class="player-info">
          <div class="player-name">${p.name}</div>
          <div class="player-club">${p.club}</div>
          <div class="votes-bar"><div class="votes-fill" id="fill-${p.id}" style="width:0%"></div></div>
          <div class="votes-count"><span>${(votes[p.id] || 0).toLocaleString('ru-RU')}</span> голосов</div>
        </div>
      `;

      if (!hasVoted) {
        card.addEventListener('click', () => {
          selectedId = (selectedId === p.id) ? null : p.id;
          voteBtn.disabled = selectedId === null;
          render();
        });
      }
      grid.appendChild(card);
    }

    // Анимация прогресс-баров (небольшая задержка для плавности)
    setTimeout(() => {
      players.forEach(p => {
        const fill = document.getElementById(`fill-${p.id}`);
        if (fill) fill.style.width = `${Math.round((votes[p.id] || 0) / maxVotes * 100)}%`;
      });
    }, 100);

    // Загрузка фото
    players.forEach(async p => {
      const img = document.getElementById(`photo-${p.id}`);
      const loader = document.getElementById(`loader-${p.id}`);
      const url = await fetchPhoto(p.wiki);
      if (url && img) {
        img.src = url;
        img.onload = () => { img.classList.add('loaded'); loader?.remove(); };
        img.onerror = () => { if (loader) loader.textContent = 'НЕТ ФОТО'; };
      } else if (loader) loader.textContent = 'НЕТ ФОТО';
    });

    if (hasVoted) {
      const vp = players.find(p => p.id === myVote);
      voteStatus.classList.add('voted');
      voteStatus.textContent = vp ? `✅ ВЫ ПРОГОЛОСОВАЛИ ЗА ${vp.name.toUpperCase()}. СПАСИБО!` : '✅ ВЫ УЖЕ ПРОГОЛОСОВАЛИ.';
      voteBtn.disabled = true;
      voteBtn.textContent = 'Голос учтён';
    } else {
      voteStatus.textContent = 'ВЫБЕРИТЕ ОДНОГО ИГРОКА И НАЖМИТЕ «ПРОГОЛОСОВАТЬ»';
    }
  }

  voteBtn.addEventListener('click', () => {
    if (selectedId === null || hasVoted) return;
    
    votes[selectedId]++;
    localStorage.setItem('vip_votes', JSON.stringify(votes));
    localStorage.setItem('vip_voted', 'true');
    localStorage.setItem('vip_myVote', selectedId.toString());
    
    hasVoted = true;
    myVote = selectedId;

    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3500);
    render();
  });

  render();
</script>
</body>
</html>
