<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0e1a">
<title>🏁 Formula Racing Mobile</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0e1a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#fff}
#game-container{position:relative;width:100vw;height:100vh;overflow:hidden}
#canvas{display:block;width:100%;height:100%;background:#1a6b2e}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(10,14,26,.95),rgba(30,40,80,.95));z-index:10;padding:20px;text-align:center}
.overlay.hidden{display:none}
.overlay h1{font-size:clamp(28px,8vw,54px);font-weight:900;letter-spacing:2px;background:linear-gradient(45deg,#ffd700,#ff6b00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:10px}
.subtitle{font-size:clamp(14px,3vw,20px);color:#8899bb;margin-bottom:40px;letter-spacing:4px;text-transform:uppercase}
.btn{padding:18px 50px;font-size:clamp(18px,4vw,24px);font-weight:800;letter-spacing:2px;border:none;border-radius:14px;cursor:pointer;transition:transform .15s;color:#fff;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.btn:active{transform:scale(.95)}
.btn-start{background:linear-gradient(135deg,#00c853,#00a041);margin-bottom:40px}
.btn-restart{background:linear-gradient(135deg,#2196f3,#1565c0);margin-top:30px}
.controls-hint{font-size:clamp(12px,2.5vw,16px);color:#6a7a99;line-height:1.8}
#results{font-size:clamp(16px,3.5vw,22px);line-height:2;margin-top:20px;padding:20px 40px;background:rgba(255,255,255,.08);border-radius:16px;border:1px solid rgba(255,255,255,.15)}
#results .highlight{color:#ffd700;font-weight:800;font-size:1.3em}
#hud{position:absolute;inset:0;pointer-events:none;z-index:5}
#hud.hidden{display:none}
.hud-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:10px 15px;background:linear-gradient(to bottom,rgba(0,0,0,.7),transparent)}
.hud-bottom{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-end;padding:10px 15px;background:linear-gradient(to top,rgba(0,0,0,.7),transparent)}
.hud-item{display:flex;flex-direction:column;align-items:center;padding:6px 12px;background:rgba(0,0,0,.55);border-radius:10px;border:1px solid rgba(255,255,255,.1);min-width:70px}
.hud-item .label{font-size:10px;color:#8899bb;letter-spacing:1px;font-weight:600}
.hud-item .value{font-size:20px;font-weight:900;color:#fff;line-height:1.1}
.hud-item.pos .value{color:#ffd700}
.hud-item.speed .value{color:#00e676;font-size:28px}
.hud-item.best .value{color:#ff9800}
.touch-zone{position:absolute;bottom:0;height:60%;width:50%;pointer-events:auto;opacity:0}
#touch-left{left:0}
#touch-right{right:0}
@media(max-width:500px){.hud-item{min-width:55px;padding:4px 8px}.hud-item .value{font-size:16px}.hud-item.speed .value{font-size:22px}.hud-item .label{font-size:8px}}
</style>
</head>
<body>
<div id="game-container">
  <canvas id="canvas"></canvas>

  <div id="menu" class="overlay">
    <h1>🏁 FORMULA RACING</h1>
    <p class="subtitle">Mobile Edition</p>
    <button id="btn-start" class="btn btn-start">▶ СТАРТ</button>
    <div class="controls-hint">
      <p>📱 Тап слева — руль</p>
      <p>📱 Тап справа — газ</p>
      <p>⌨️ Стрелки на ПК</p>
    </div>
  </div>

  <div id="finish" class="overlay hidden">
    <h1>🏆 ФИНИШ!</h1>
    <div id="results"></div>
    <button id="btn-restart" class="btn btn-restart">↻ РЕСТАРТ</button>
  </div>

  <div id="hud" class="hidden">
    <div class="hud-top">
      <div class="hud-item pos"><span class="label">POS</span><span id="hud-pos" class="value">1/5</span></div>
      <div class="hud-item lap"><span class="label">LAP</span><span id="hud-lap" class="value">1/3</span></div>
      <div class="hud-item time"><span class="label">TIME</span><span id="hud-time" class="value">0:00.00</span></div>
    </div>
    <div class="hud-bottom">
      <div class="hud-item speed"><span id="hud-speed" class="value">0</span><span class="label">KM/H</span></div>
      <div class="hud-item best"><span class="label">BEST LAP</span><span id="hud-best" class="value">—</span></div>
    </div>
    <div id="touch-left" class="touch-zone"></div>
    <div id="touch-right" class="touch-zone"></div>
  </div>
</div>

<script>
const TOTAL_LAPS = 3;
const NUM_AI = 4;
const TRACK_RAW = [
  [150,120],[420,120],[600,180],[680,300],
  [650,420],[540,470],[430,450],[380,560],
  [300,660],[180,640],[110,540],[120,400],
  [160,300],[120,200],[150,120],
];
const TRACK_WIDTH = 100;
const BASE_W = 800, BASE_H = 700;
const TEAMS = [
  {color:'#e61919',name:'Ferrari'},
  {color:'#1a66e6',name:'Red Bull'},
  {color:'#00d94d',name:'Mercedes'},
  {color:'#ff8c00',name:'McLaren'},
  {color:'#f2f2f2',name:'Williams'},
];

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W,H,scaleX,scaleY;

function resize(){
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * devicePixelRatio;
  canvas.height = H * devicePixelRatio;
  canvas.style.width = W+'px';
  canvas.style.height = H+'px';
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  scaleX = W/BASE_W; scaleY = H/BASE_H;
}
window.addEventListener('resize', resize);
resize();

function bezier(p0,p1,p2,p3,t){
  const mt = 1-t;
  return [
    mt*mt*mt*p0[0] + 3*mt*mt*t*p1[0] + 3*mt*t*t*p2[0] + t*t*t*p3[0],
    mt*mt*mt*p0[1] + 3*mt*mt*t*p1[1] + 3*mt*t*t*p2[1] + t*t*t*p3[1],
  ];
}
function smoothTrack(points,seg){
  seg = seg||14;
  const out=[], n=points.length;
  for(let i=0;i<n-1;i++){
    const p0=i>0?points[i-1]:points[i];
    const p1=points[i], p2=points[i+1];
    const p3=i+2<n?points[i+2]:points[i+1];
    for(let s=0;s<seg;s++) out.push(bezier(p0,p1,p2,p3,s/seg));
  }
  out.push(points[n-1]);
  return out;
}
function dist(a,b){return Math.hypot(a[0]-b[0],a[1]-b[1]);}
function fmtTime(t){
  const m=Math.floor(t/60), s=t-m*60;
  return m+':'+s.toFixed(2).padStart(5,'0');
}

class Track {
  constructor(){
    this.points = smoothTrack(TRACK_RAW,14);
    this.width = TRACK_WIDTH;
    this.checkpoints=[];
    for(let i=0;i<8;i++)
      this.checkpoints.push(this.points[Math.floor(i*this.points.length/8)]);
    const a=this.points[0], b=this.points[3];
    this.startAngle = Math.atan2(b[1]-a[1],b[0]-a[0])*180/Math.PI;
  }
  isOnTrack(x,y){
    for(let i=0;i<this.points.length-1;i+=2)
      if(dist([x,y],this.points[i])<this.width*0.6) return true;
    return false;
  }
}

class F1Car {
  constructor(x,y,angle,color,name,isPlayer){
    this.x=x; this.y=y; this.angle=angle;
    this.speed=0;
    this.maxSpeed = isPlayer?8:7;
    this.accel=0.20; this.brakePower=0.35; this.friction=0.04; this.turnSpeed=4.5;
    this.color=color; this.name=name; this.isPlayer=!!isPlayer;
    this.lap=0; this.nextCp=1; this.lapTime=0; this.bestLap=null;
    this.finished=false; this.finishTime=0; this.raceTime=0;
  }
  update(dt,throttle,brake,steer,track){
    if(this.finished) this.speed*=0.92;
    else{
      if(throttle) this.speed+=this.accel;
      if(brake) this.speed-=this.brakePower;
    }
    this.speed-=this.friction;
    this.speed=Math.max(0,Math.min(this.speed,this.maxSpeed));
    if(Math.abs(this.speed)>0.15){
      const f=this.speed/this.maxSpeed;
      this.angle+=steer*this.turnSpeed*f;
    }
    const rad=this.angle*Math.PI/180;
    const nx=this.x+Math.cos(rad)*this.speed;
    const ny=this.y+Math.sin(rad)*this.speed;
    if(track && !track.isOnTrack(nx,ny)) this.speed*=0.5;
    else { this.x=nx; this.y=ny; }
    if(track && !this.finished){
      this.raceTime+=dt; this.lapTime+=dt;
      const cp=track.checkpoints[this.nextCp];
      if(dist([this.x,this.y],cp)<65){
        this.nextCp++;
        if(this.nextCp>=track.checkpoints.length){
          this.nextCp=1; this.lap++;
          if(this.bestLap===null||this.lapTime<this.bestLap) this.bestLap=this.lapTime;
          this.lapTime=0;
          if(this.lap>=TOTAL_LAPS){ this.finished=true; this.finishTime=this.raceTime; }
        }
      }
    }
  }
  aiDrive(dt,track,cars){
    if(this.finished){ this.update(dt,0,1,0,track); return; }
    const t=track.checkpoints[this.nextCp];
    const tAng=Math.atan2(t[1]-this.y,t[0]-this.x)*180/Math.PI;
    const diff=((tAng-this.angle+540)%360)-180;
    let steer=0;
    if(diff>5) steer=1; else if(diff<-5) steer=-1;
    let throttle=1, brake=0;
    if(Math.abs(diff)>45){ throttle=0; brake=1; }
    for(const c of cars){
      if(c===this) continue;
      if(dist([this.x,this.y],[c.x,c.y])<45 && c.speed<this.speed){ throttle=0; brake=1; }
    }
    this.update(dt,throttle,brake,steer,track);
  }
  draw(ctx){
    ctx.save();
    ctx.translate(this.x,this.y);
    ctx.rotate(-this.angle*Math.PI/180);
    ctx.fillStyle='#141414';
    ctx.fillRect(-14,-12,10,6); ctx.fillRect(-14,6,10,6);
    ctx.fillRect(8,-12,8,6);    ctx.fillRect(8,6,8,6);
    ctx.fillStyle=this.color;
    ctx.beginPath(); ctx.moveTo(20,0); ctx.lineTo(-10,-8); ctx.lineTo(-10,8); ctx.closePath(); ctx.fill();
    ctx.fillRect(-18,-5,18,10);
    ctx.fillStyle='#0d0d0d';
    ctx.beginPath(); ctx.ellipse(-1,0,5,4,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=this.color;
    ctx.fillRect(-22,-9,4,18); ctx.fillRect(18,-10,4,20);
    ctx.fillStyle=this.isPlayer?'#ffe633':'#e6e6e6';
    ctx.beginPath(); ctx.ellipse(-1,0,3,3,0,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

class Fan {
  constructor(x,y,color){ this.x=x; this.y=y; this.color=color; this.phase=Math.random()*6.28; }
}
class Stand {
  constructor(x,y,w,h,teamColor){
    this.x=x; this.y=y; this.w=w; this.h=h; this.fans=[];
    const rows=Math.max(1,Math.floor(h/16));
    const cols=Math.max(1,Math.floor(w/11));
    const palette=TEAMS.map(t=>t.color);
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      const col = Math.random()>0.25 ? teamColor : palette[Math.floor(Math.random()*palette.length)];
      this.fans.push(new Fan(x+5+c*11,y+4+r*16,col));
    }
  }
  draw(ctx,t){
    ctx.fillStyle='#52525e'; ctx.fillRect(this.x,this.y,this.w,this.h);
    ctx.fillStyle='#38384a';
    for(let r=0;r<this.h/16;r++) ctx.fillRect(this.x,this.y+r*16,this.w,1);
    for(const f of this.fans){
      const wave=Math.sin(t*6+f.phase)*2;
      ctx.fillStyle='#33333f'; ctx.fillRect(f.x,f.y,7,11);
      ctx.fillStyle='#f2cc9f'; ctx.beginPath(); ctx.arc(f.x+3.5,f.y+12,2.5,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=f.color;
      ctx.beginPath();
      ctx.moveTo(f.x+7,f.y+9);
      ctx.lineTo(f.x+16,f.y+11+wave);
      ctx.lineTo(f.x+7,f.y+15);
      ctx.closePath(); ctx.fill();
    }
  }
}

const game = {
  state:'menu', raceTime:0, crowdTime:0, lastTime:0,
  track:new Track(), player:null, cars:[], stands:[],
  keys:{}, touchSteer:0, touchThrottle:false,

  init(){
    this.stands = [
      new Stand(30,30,520,60,'#e61919'),
      new Stand(30,520,520,60,'#1a66e6'),
      new Stand(60,180,60,280,'#00d94d'),
      new Stand(720,180,60,280,'#ff8c00'),
    ];
    window.addEventListener('keydown', e=>this.keys[e.key]=true);
    window.addEventListener('keyup',   e=>this.keys[e.key]=false);

    const tl=document.getElementById('touch-left');
    const tr=document.getElementById('touch-right');

    const handleLeft=e=>{
      e.preventDefault();
      const r=tl.getBoundingClientRect();
      const x = e.touches ? e.touches[0].clientX : e.clientX;
      const rel = (x-r.left)/r.width;
      this.touchSteer = rel<0.5 ? -1 : 1;
    };
    const handleRight=e=>{ e.preventDefault(); this.touchThrottle=true; };
    const endLeft=e=>{ e.preventDefault(); this.touchSteer=0; };
    const endRight=e=>{ e.preventDefault(); this.touchThrottle=false; };

    ['touchstart','mousedown'].forEach(ev=>{
      tl.addEventListener(ev,handleLeft);
      tr.addEventListener(ev,handleRight);
    });
    ['touchend','touchcancel','mouseup','mouseleave'].forEach(ev=>{
      tl.addEventListener(ev,endLeft);
      tr.addEventListener(ev,endRight);
    });

    document.getElementById('btn-start').addEventListener('click',()=>this.startRace());
    document.getElementById('btn-restart').addEventListener('click',()=>this.startRace());

    requestAnimationFrame(t=>this.loop(t));
  },

  startRace(){
    this.state='race'; this.raceTime=0;
    const sx=this.track.points[0][0];
    const sy=this.track.points[0][1];
    const ang=this.track.startAngle;
    this.player=new F1Car(sx,sy,ang,TEAMS[0].color,'YOU',true);
    this.cars=[this.player];
    const offsets=[[-30,-30],[30,-30],[-30,30],[30,30]];
    for(let i=0;i<NUM_AI;i++){
      const t=TEAMS[i+1], o=offsets[i];
      this.cars.push(new F1Car(sx+o[0],sy+o[1],ang,t.color,t.name,false));
    }
    document.getElementById('menu').classList.add('hidden');
    document.getElementById('finish').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
  },

  positions(){ return [...this.cars].sort((a,b)=>(b.lap*8+b.nextCp)-(a.lap*8+a.nextCp)); },

  update(dt){
    this.crowdTime+=dt;
    if(this.state!=='race'||!this.player) return;
    this.raceTime+=dt;
    const k=this.keys;
    const throttle=(k['ArrowUp']||k['w']||k['W']||this.touchThrottle)?1:0;
    const brake=(k['ArrowDown']||k['s']||k['S'])?1:0;
    let steer=0;
    if(k['ArrowLeft']||k['a']||k['A']) steer=-1;
    if(k['ArrowRight']||k['d']||k['D']) steer=1;
    if(this.touchSteer) steer=this.touchSteer;
    this.player.update(dt,throttle,brake,steer,this.track);
    for(const c of this.cars) if(!c.isPlayer) c.aiDrive(dt,this.track,this.cars);
    this.updateHUD();
    if(this.player.finished && this.state==='race'){ this.state='finish'; this.showFinish(); }
  },

  updateHUD(){
    const pos=this.positions().indexOf(this.player)+1;
    document.getElementById('hud-pos').textContent=pos+'/'+this.cars.length;
    document.getElementById('hud-lap').textContent=Math.min(this.player.lap+1,TOTAL_LAPS)+'/'+TOTAL_LAPS;
    document.getElementById('hud-time').textContent=fmtTime(this.raceTime);
    document.getElementById('hud-speed').textContent=Math.floor(this.player.speed*40);
    document.getElementById('hud-best').textContent=this.player.bestLap?fmtTime(this.player.bestLap):'—';
  },

  showFinish(){
    const pos=this.positions().indexOf(this.player)+1;
    const r=document.getElementById('results');
    r.innerHTML =
      '<div>Ваше место: <span class="highlight">'+pos+' / '+this.cars.length+'</span></div>'+
      '<div>Время: '+fmtTime(this.player.finishTime)+'</div>'+
      (this.player.bestLap?'<div>Лучший круг: '+fmtTime(this.player.bestLap)+'</div>':'');
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('finish').classList.remove('hidden');
  },

  render(){
    ctx.fillStyle='#1c6b2e'; ctx.fillRect(0,0,W,H);

    ctx.save(); ctx.scale(scaleX,scaleY);
    for(const s of this.stands) s.draw(ctx,this.crowdTime);
    ctx.restore();

    ctx.save(); ctx.scale(scaleX,scaleY);

    ctx.strokeStyle='#383840';
    ctx.lineWidth=this.track.width;
    ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath();
    for(let i=0;i<this.track.points.length;i++){
      const p=this.track.points[i];
      if(i===0) ctx.moveTo(p[0],p[1]); else ctx.lineTo(p[0],p[1]);
    }
    ctx.stroke();

    ctx.strokeStyle='rgba(255,255,255,.7)'; ctx.lineWidth=2;
    for(let i=0;i<this.track.points.length-1;i+=6){
      const a=this.track.points[i];
      const b=this.track.points[Math.min(i+2,this.track.points.length-1)];
      ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
    }

    const sx=this.track.points[0][0], sy=this.track.points[0][1];
    for(let i=0;i<8;i++) for(let j=0;j<2;j++){
      ctx.fillStyle=(i+j)%2===0?'#fff':'#000';
      ctx.fillRect(sx-40+i*10, sy-10+j*10, 10, 10);
    }

    for(const c of this.cars) if(!c.isPlayer) c.draw(ctx);
    if(this.player) this.player.draw(ctx);
    ctx.restore();

    if(this.state==='race'){
      const mw=125, mh=110, mx=W-mw-15, my=15;
      ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(mx,my,mw,mh);
      ctx.strokeStyle='rgba(255,255,255,.2)'; ctx.strokeRect(mx,my,mw,mh);
      ctx.strokeStyle='rgba(200,200,200,.7)'; ctx.lineWidth=2;
      ctx.beginPath();
      for(let i=0;i<this.track.points.length;i++){
        const p=this.track.points[i];
        const px=mx+5+p[0]*(mw-10)/BASE_W;
        const py=my+5+p[1]*(mh-10)/BASE_H;
        if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.stroke();
      for(const c of this.cars){
        ctx.fillStyle=c.color; ctx.beginPath();
        ctx.arc(mx+5+c.x*(mw-10)/BASE_W, my+5+c.y*(mh-10)/BASE_H, c.isPlayer?5:3, 0, Math.PI*2);
        ctx.fill();
      }
    }
  },

  loop(t){
    const dt=Math.min((t-this.lastTime)/1000,0.05);
    this.lastTime=t;
    this.update(dt); this.render();
    requestAnimationFrame(tt=>this.loop(tt));
  },
};

game.init();
</script>
</body>
</html>
