  bindProfileScreen();
}

function menuItem(icon, label, key) {
  return '<div class="menu-item" ' + (key ? 'data-menu-key="' + key + '"' : '') + '>' +
    '<span class="mi-icon">' + icon + '</span>' +
    '<span>' + label + '</span>' +
    '<span class="mi-arrow">›</span>' +
  '</div>';
}

function bindProfileScreen() {
  var back = $('btnBack');
  if (back) back.addEventListener('click', function() { STATE.screen = 'main'; renderApp(); });
  document.querySelectorAll('[data-menu-key]').forEach(function(el) {
    el.addEventListener('click', function() {
      var key = this.dataset.menuKey;
      if (key === 'history') { STATE.screen = 'history'; renderApp(); }
      if (key === 'bonus') { claimBonus(); }
    });
  });
  var lo = $('btnLogout');
  if (lo) lo.addEventListener('click', function() {
    if (confirm('Выйти из аккаунта?')) logoutUser();
  });
}

function renderMenuScreen() {
  var html = renderTopHeader({title: 'Меню', back: true});
  html += '<div style="background:#fff">' +
    menuItem('👤', 'Профиль', 'profile') +
    menuItem('📜', 'История ставок', 'history') +
    menuItem('💰', 'Получить бонус +100 000 ₽', 'bonus') +
    menuItem('ℹ️', 'О приложении', 'about') +
  '</div>';
  $('app').innerHTML = html;
  bindMenuScreen();
}

function bindMenuScreen() {
  var back = $('btnBack');
  if (back) back.addEventListener('click', function() { STATE.screen = 'main'; renderApp(); });
  document.querySelectorAll('[data-menu-key]').forEach(function(el) {
    el.addEventListener('click', function() {
      var key = this.dataset.menuKey;
      if (key === 'profile') { STATE.screen = 'profile'; renderApp(); }
      if (key === 'history') { STATE.screen = 'history'; renderApp(); }
      if (key === 'bonus') { claimBonus(); }
      if (key === 'about') { toast('info', '⚡', 'OpenBet · Демо'); }
    });
  });
}

function claimBonus() {
  if (AUTH.currentUser.lastBonus === todayKey()) {
    toast('info', '💎', 'Бонус уже получен сегодня');
    return;
  }
  W.balance = W.balance + 100000;
  AUTH.currentUser.lastBonus = todayKey();
  saveUserState();
  toast('gold', '💎', '+100 000 ₽ бонус!');
  renderBalance();
}

/* HISTORY */
function renderHistoryScreen() {
  var html = renderTopHeader({title: 'История ставок', back: true});
  html += '<div class="main" style="padding-top:8px">';
  if (!W.bets.length) {
    html += '<div class="empty"><div class="empty-icon">📜</div><div class="empty-text">Ставок нет</div></div>';
  } else {
    W.bets.forEach(function(b) {
      var statusLabel = b.status === 'won' ? '+' + fmt(b.payout) : b.status === 'lost' ? '-' + fmt(b.stake) : 'ОЖИДАНИЕ';
      var cashoutHtml = '';
      if (b.status === 'pending') {
        var m = findMatch(b.matchId);
        if (m && m.status === 'live') {
          var coVal = cashoutValue(b, m);
          if (coVal > 0) cashoutHtml = '<button class="cashout-btn" data-cashout="' + b.id + '">💰 Забрать ' + fmt(coVal) + ' ₽</button>';
        }
      }
      var timeStr = '';
      try { timeStr = new Date(b.createdAt).toLocaleString('ru-RU', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); } catch(e) {}
      html += '<div class="history-item ' + b.status + '">' +
        '<div class="history-head">' +
          '<div><div class="history-match">' + escapeHtml(b.matchName) + '</div>' +
          '<div class="history-meta">' + escapeHtml(b.pickLabel || '') + ' · ' + timeStr + '</div></div>' +
          '<div class="history-amount">' + fmt(b.stake) + ' ₽</div>' +
        '</div>' +
        '<div class="history-foot">' +
          '<div class="history-odd">Кэф <b>' + b.odd.toFixed(2) + '</b> · потенц. <b>' + fmt(b.potential) + ' ₽</b></div>' +
          '<div class="history-status ' + b.status + '">' + statusLabel + '</div>' +
        '</div>' +
        cashoutHtml +
      '</div>';
    });
  }
  html += '</div>';
  $('app').innerHTML = html;
  var back = $('btnBack');
  if (back) back.addEventListener('click', function() { STATE.screen = 'main'; renderApp(); });
  document.querySelectorAll('[data-cashout]').forEach(function(btn) {
    btn.addEventListener('click', function() { doCashout(parseInt(this.dataset.cashout)); });
  });
}

function cashoutValue(b, m) {
  if (!m || m.status !== 'live' || b.status !== 'pending') return 0;
  var sel = b.selections[0];
  var odds = computeOdds(m);
  var cur = odds[sel.pick];
  if (!isValid(cur)) return 0;
  var fair = b.potential / cur;
  var pay = Math.max(b.stake * 0.1, Math.round(fair * 0.92 * 100) / 100);
  return Math.min(pay, b.potential * 0.98);
}

function doCashout(id) {
  var b = null;
  for (var i = 0; i < W.bets.length; i++) if (W.bets[i].id === id) { b = W.bets[i]; break; }
  if (!b || b.status !== 'pending') return;
  var m = findMatch(b.matchId);
  var co = m ? cashoutValue(b, m) : 0;
  if (co <= 0) { toast('lose', '⚠️', 'Кэшаут недоступен'); return; }
  b.status = 'won';
  b.payout = co;
  b.cashout = true;
  W.balance = W.balance + co;
  W.totalWon = W.totalWon + co;
  saveUserState();
  toast('win', '💰', 'Кэшаут: +' + fmt(co) + ' ₽');
  renderBalance();
  renderHistoryScreen();
}

/* BIND */
function bindMainScreen() {
  document.querySelectorAll('.match-row').forEach(function(row) {
    row.addEventListener('click', function(e) {
      if (e.target.closest('.odd-cell')) return;
      openMatch(parseInt(this.dataset.matchId));
    });
  });
  document.querySelectorAll('.odd-cell[data-match-id]').forEach(function(cell) {
    cell.addEventListener('click', function(e) {
      e.stopPropagation();
      addToCouponFromCell(parseInt(this.dataset.matchId), this.dataset.pick);
    });
  });
  document.querySelectorAll('.sport-tab').forEach(function(t) {
    t.addEventListener('click', function() { STATE.currentSport = this.dataset.sport; renderMainScreen(); });
  });
  document.querySelectorAll('.filter-chip').forEach(function(f) {
    f.addEventListener('click', function() { STATE.currentFilter = this.dataset.filter; renderMainScreen(); });
  });
  var sa = $('btnShowAll');
  if (sa) sa.addEventListener('click', function() { STATE.currentSport = 'all'; STATE.currentFilter = 'top'; renderMainScreen(); });
}

function bindMatchScreen() {
  var back = $('btnBack');
  if (back) back.addEventListener('click', function() { STATE.screen = 'main'; renderApp(); });
  document.querySelectorAll('.mt-sub').forEach(function(t) {
    t.addEventListener('click', function() { STATE.currentMarketTab = this.dataset.mtab; renderMatchScreen(); });
  });
  document.querySelectorAll('.stat-param').forEach(function(p) {
    p.addEventListener('click', function() { STATE.currentStatParam = this.dataset.statParam; renderMatchScreen(); });
  });
  document.querySelectorAll('.market-row[data-toggle-market]').forEach(function(row) {
    row.addEventListener('click', function() {
      var key = this.dataset.toggleMarket;
      var body = $('body-' + key);
      if (!body) return;
      var isOpen = body.classList.contains('market-body-open');
      body.classList.toggle('market-body-open', !isOpen);
      body.classList.toggle('market-body-closed', isOpen);
      var chev = this.querySelector('.mchevron');
      if (chev) chev.textContent = isOpen ? '▼' : '▲';
    });
  });
  document.querySelectorAll('[data-total-line]').forEach(function(li) {
    li.addEventListener('click', function() {
      STATE.currentLine[STATE.currentMatch.id + '_tot'] = parseFloat(this.dataset.totalLine);
      renderMatchScreen();
    });
  });
  document.querySelectorAll('[data-hcp-line]').forEach(function(li) {
    li.addEventListener('click', function() {
      STATE.currentLine[STATE.currentMatch.id + '_hcp'] = parseFloat(this.dataset.hcpLine);
      renderMatchScreen();
    });
  });
  document.querySelectorAll('[data-stat-line]').forEach(function(li) {
    li.addEventListener('click', function() {
      STATE.currentLine[STATE.currentMatch.id + '_stat_' + STATE.currentStatParam] = parseFloat(this.dataset.statLine);
      renderMatchScreen();
    });
  });
  document.querySelectorAll('.odd-btn[data-match-id]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      if (this.classList.contains('disabled')) return;
      addToCouponFull(parseInt(this.dataset.matchId), this.dataset.pick, parseFloat(this.dataset.odd));
    });
  });
  document.querySelectorAll('.odd-btn[data-pick^="extras|"]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      if (this.classList.contains('disabled')) return;
      var m = STATE.currentMatch;
      if (!m) return;
      var label = decodeURIComponent(this.dataset.pick.slice(7));
      addToCouponFull(m.id, label, parseFloat(this.dataset.odd));
    });
  });
}

function openMatch(id) {
  var m = findMatch(id);
  if (!m) return;
  STATE.currentMatch = m;
  STATE.screen = 'match';
  STATE.currentMarketTab = 'all';
  renderApp();
  window.scrollTo(0, 0);
}

/* TAB BAR */
function renderTabBar() {
  var tabs = [
    {key:'main', icon:'🏠', label:'Главная'},
    {key:'coupon', icon:'📋', label:'Купон', badge: W.coupon.length},
    {key:'history', icon:'📜', label:'История'},
    {key:'menu', icon:'☰', label:'Меню'}
  ];
  var html = '<div class="tab-bar" id="tabBar">';
  tabs.forEach(function(t) {
    var active = ((t.key === 'main' && STATE.screen === 'main') || (t.key === 'menu' && (STATE.screen === 'menu' || STATE.screen === 'profile')) || (t.key === 'history' && STATE.screen === 'history')) ? ' active' : '';
    html += '<button class="tab-bar-item' + active + '" data-tab-key="' + t.key + '">' +
      '<span class="tab-icon">' + t.icon + '</span>' +
      '<span>' + t.label + '</span>' +
      (t.badge > 0 ? '<span class="badge">' + t.badge + '</span>' : '') +
    '</button>';
  });
  html += '</div>';
  var existing = $('tabBar');
  if (existing) existing.outerHTML = html;
  else document.querySelector('.app-wrap').insertAdjacentHTML('beforeend', html);
  document.querySelectorAll('.tab-bar-item').forEach(function(t) {
    t.addEventListener('click', function() {
      var key = this.dataset.tabKey;
      if (key === 'coupon') openCoupon();
      else if (key === 'main') { STATE.screen = 'main'; renderApp(); }
      else if (key === 'history') { STATE.screen = 'history'; renderApp(); }
      else if (key === 'menu') { STATE.screen = 'menu'; renderApp(); }
    });
  });
}

/* FLOATING COUPON */
function renderFloatingCoupon() {
  var existing = $('floatingCoupon');
  if (existing) existing.remove();
  var c = W.coupon;
  if (!c.length) return;
  var last = c[c.length - 1];
  var html = '<div class="floating-coupon" id="floatingCoupon">' +
    '<div class="fc-icon">🅱</div>' +
    '<div class="fc-info">' +
      '<div class="fc-match">' + escapeHtml(last.matchName) + '</div>' +
      '<div class="fc-pick">' + escapeHtml(last.pickLabel) + '</div>' +
    '</div>' +
    '<div class="fc-odd">' + last.odd.toFixed(2) + '</div>' +
  '</div>';
  document.querySelector('.app-wrap').insertAdjacentHTML('beforeend', html);
  var w = $('floatingCoupon');
  if (w) w.addEventListener('click', openCoupon);
}

/* COUPON */
function openCoupon() {
  $('couponPanel').classList.add('active');
  $('couponOverlay').classList.add('active');
  document.body.classList.add('coupon-open');
  renderCouponBody();
}
function closeCoupon() {
  $('couponPanel').classList.remove('active');
  $('couponOverlay').classList.remove('active');
  document.body.classList.remove('coupon-open');
}

function renderCouponBody() {
  var c = W.coupon;
  var html = '';
  if (!c.length) {
    $('couponBody').innerHTML = '<div class="coupon-empty"><div class="icon">📋</div><div class="txt">Купон пуст</div></div>';
    return;
  }
  c.forEach(function(item, idx) {
    html += '<div class="coupon-item">' +
      '<div class="ci-head">' +
        '<span class="ci-score">' + escapeHtml(item.score || '') + '</span>' +
        '<span class="ci-league">' + escapeHtml(item.matchName) + '</span>' +
        '<button class="ci-remove" data-remove-coupon="' + idx + '">×</button>' +
      '</div>' +
      '<div class="ci-pick"><span>' + escapeHtml(item.pickLabel) + '</span><span class="ci-odd">' + item.odd.toFixed(2) + '</span></div>' +
    '</div>';
  });
  html += '<div class="coupon-type"><button class="ct-btn active">' + (c.length > 1 ? 'Экспресс' : 'Одинар') + '</button></div>';
  html += '<div class="coupon-stake">' +
    '<input type="number" class="stake-input" id="couponStakeInput" placeholder="Введите сумму">' +
    '<div class="stake-right"><div class="balance-label">Баланс</div><div class="balance-val">' + fmt(W.balance) + ' ₽</div><div class="add-btn" id="couponAddFunds">+</div></div>' +
  '</div>';
  html += '<div class="coupon-limits">' +
    '<div class="lmt" data-set-stake="30">min <b>30</b></div>' +
    '<div class="lmt" data-set-stake="max">max <b>' + fmt(W.balance) + '</b></div>' +
    '<div class="lmt" data-set-stake="500">500</div>' +
    '<div class="lmt" data-set-stake="1000">1K</div>' +
  '</div>';
  html += '<div class="coupon-actions"><div class="potential">Возможный выигрыш <b id="couponPotential">—</b></div></div>';
  html += '<button class="coupon-place" id="couponPlace">Поставить</button>';
  $('couponBody').innerHTML = html;
  var inp = $('couponStakeInput');
  var pot = $('couponPotential');
  var totalOdd = c.reduce(function(a, b) { return a * b.odd; }, 1);
  if (inp) {
    inp.addEventListener('input', function() {
      var v = parseFloat(this.value) || 0;
      pot.textContent = v > 0 ? fmt(v * totalOdd) + ' ₽' : '—';
    });
  }
  document.querySelectorAll('[data-set-stake]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var v = this.dataset.setStake;
      if (v === 'max') $('couponStakeInput').value = Math.floor(W.balance);
      else $('couponStakeInput').value = v;
      $('couponStakeInput').dispatchEvent(new Event('input'));
    });
  });
  document.querySelectorAll('[data-remove-coupon]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      W.coupon.splice(parseInt(this.dataset.removeCoupon), 1);
      saveUserState();
      renderCouponBody();
      renderFloatingCoupon();
      renderTabBar();
      if (STATE.screen === 'main') renderMainScreen();
      else if (STATE.screen === 'match') renderMatchScreen();
    });
  });
  var af = $('couponAddFunds');
  if (af) af.addEventListener('click', claimBonus);
  var pl = $('couponPlace');
  if (pl) pl.addEventListener('click', placeCouponBet);
}

function isInCoupon(mid, pick) {
  return W.coupon.some(function(c) { return c.matchId === mid && c.pick === pick; });
}
function findMatch(id) {
  for (var i = 0; i < STATE.matches.length; i++) if (STATE.matches[i].id === id) return STATE.matches[i];
  return null;
}
function addToCouponFromCell(mid, pick) {
  var m = findMatch(mid);
  if (!m) return;
  var odds = computeOdds(m);
  var odd = odds[pick];
  if (!isValid(odd)) return;
  addToCouponFull(mid, pick, odd);
}

function addToCouponFull(mid, pick, odd) {
  var m = findMatch(mid);
  if (!m) return;
  if (m.status === 'finished') return;
  if (isInCoupon(mid, pick)) {
    W.coupon = W.coupon.filter(function(c) { return !(c.matchId === mid && c.pick === pick); });
  } else {
    W.coupon = W.coupon.filter(function(c) { return c.matchId !== mid; });
    var newC = W.coupon.slice();
    newC.push({
      matchId: mid, pick: pick, odd: odd,
      matchName: rusName(m.home) + ' – ' + rusName(m.away),
      pickLabel: pickToLabel(m, pick),
      score: m.sport === 'volleyball' ? (m.setsHome + ':' + m.setsAway) : ((m.scoreHome || 0) + ':' + (m.scoreAway || 0))
    });
    W.coupon = newC;
  }
  saveUserState();
  renderFloatingCoupon();
  renderTabBar();
  if (STATE.screen === 'main') renderMainScreen();
  else if (STATE.screen === 'match') renderMatchScreen();
  if ($('couponPanel').classList.contains('active')) renderCouponBody();
}

function pickToLabel(m, pick) {
  if (pick === 'home') return 'П1 · ' + rusName(m.home);
  if (pick === 'away') return 'П2 · ' + rusName(m.away);
  if (pick === 'draw') return 'X (ничья)';
  if (pick === '1X') return '1X';
  if (pick === '12') return '12';
  if (pick === 'X2') return 'X2';
  return pick;
}

function placeCouponBet() {
  var c = W.coupon;
  if (!c.length) return;
  var stake = parseFloat(($('couponStakeInput') || {}).value) || 0;
  if (stake < 30) { toast('lose', '⚠️', 'Минимум 30 ₽'); return; }
  if (stake > W.balance) { toast('lose', '⚠️', 'Недостаточно средств'); return; }
  var totalOdd = c.reduce(function(a, b) { return a * b.odd; }, 1);
  var newBets = W.bets.slice();
  newBets.unshift({
    id: Date.now(),
    type: c.length > 1 ? 'express' : 'single',
    selections: c.slice(),
    matchName: c.length > 1 ? ('Экспресс · ' + c.length) : c[0].matchName,
    matchId: c[0].matchId,
    pickLabel: c.length > 1 ? c.length + ' событий' : c[0].pickLabel,
    odd: totalOdd, stake: stake,
    potential: Math.round(stake * totalOdd * 100) / 100,
    status: 'pending',
    createdAt: new Date().toISOString()
  });
  W.bets = newBets;
  W.balance = W.balance - stake;
  W.totalBet = W.totalBet + stake;
  W.coupon = [];
  saveUserState();
  toast('info', '📋', 'Ставка принята · ' + fmt(stake) + ' ₽');
  closeCoupon();
  renderBalance();
  renderTabBar();
  renderFloatingCoupon();
  if (STATE.screen === 'main') renderMainScreen();
  else if (STATE.screen === 'match') renderMatchScreen();
}

/* ============================================================
   ГЛАВНЫЙ ЦИКЛ
   ============================================================ */
var tickCounter = 0;
function tick() {
  tickCounter++;
  for (var i = 0; i < STATE.matches.length; i++) {
    var m = STATE.matches[i];
    if (m.status === 'live' || m.status === 'countdown') {
      try { tickMatch(m); }
      catch (e) { console.error('tick err', m.id, e); m.status = 'finished'; }
    }
  }
  for (var j = 0; j < STATE.matches.length; j++) {
    var m2 = STATE.matches[j];
    if (m2.status === 'finished' && !m2.countdownStarted) {
      m2.finishedAt = m2.finishedAt || Date.now();
      if (Date.now() - m2.finishedAt > 5000) {
        m2.countdownStarted = true;
        m2.status = 'countdown';
        m2.startTime = Date.now() + 60000;
      }
    }
  }
  var liveCnt = STATE.matches.filter(function(mm) { return mm.status === 'live' || mm.status === 'countdown'; }).length;
  if (liveCnt < 25) {
    var cnt = {football: 0, hockey: 0, volleyball: 0, ufc: 0};
    STATE.matches.forEach(function(mm) {
      if ((mm.status === 'live' || mm.status === 'countdown') && cnt[mm.sport] !== undefined) cnt[mm.sport]++;
    });
    var targets = {football: 12, hockey: 8, volleyball: 5, ufc: 5};
    ['football', 'hockey', 'volleyball', 'ufc'].forEach(function(sp) {
      if (cnt[sp] < targets[sp]) {
        var need = Math.min(targets[sp] - cnt[sp], 1);
        for (var n = 0; n < need; n++) {
          if (sp === 'football') STATE.matches.push(newFootball());
          else if (sp === 'hockey') STATE.matches.push(newHockey());
          else if (sp === 'volleyball') STATE.matches.push(newVolleyball());
          else STATE.matches.push(newUFC());
        }
      }
    });
  }
  if (STATE.matches.length > 35) STATE.matches = STATE.matches.slice(0, 35);
  settleBets();
  if (tickCounter % 2 === 0) {
    if (STATE.screen === 'main') renderMainScreen();
    else if (STATE.screen === 'match' && STATE.currentMatch) {
      var m3 = findMatch(STATE.currentMatch.id);
      if (m3) { STATE.currentMatch = m3; if (tickCounter % 6 === 0) renderMatchScreen(); }
    } else if (STATE.screen === 'history') {
      renderHistoryScreen();
    }
  }
  if (tickCounter % 5 === 0) saveMatches();
  if (tickCounter % 10 === 0) saveUserState();
}

/* ============================================================
   AUTH UI
   ============================================================ */
function initAuthUI() {
  document.querySelectorAll('.auth-tab').forEach(function(t) {
    t.addEventListener('click', function() {
      document.querySelectorAll('.auth-tab').forEach(function(x) { x.classList.remove('active'); });
      this.classList.add('active');
      var tab = this.dataset.authTab;
      $('loginForm').style.display = tab === 'login' ? 'flex' : 'none';
      $('registerForm').style.display = tab === 'register' ? 'flex' : 'none';
    });
  });
  $('loginSubmit').addEventListener('click', function() {
    var u = $('loginUsername').value, p = $('loginPassword').value;
    var err = $('loginError');
    if (!u || !p) { err.textContent = 'Заполни логин и пароль'; err.classList.add('show'); return; }
    var res = loginUser(u, p);
    if (!res.ok) { err.textContent = res.error; err.classList.add('show'); return; }
    startApp();
  });
  $('regSubmit').addEventListener('click', function() {
    var u = $('regUsername').value, p = $('regPassword').value, p2 = $('regPassword2').value;
    var err = $('regError');
    if (p !== p2) { err.textContent = 'Пароли не совпадают'; err.classList.add('show'); return; }
    var res = registerUser(u, p);
    if (!res.ok) { err.textContent = res.error; err.classList.add('show'); return; }
    startApp();
  });
}

function startApp() {
  if (!initUser()) return;
  $('authScreen').style.display = 'none';
  $('appWrap').classList.add('active');
  if (!loadMatches()) {
    createInitialMatches();
    saveMatches();
  }
  $('couponOverlay').addEventListener('click', closeCoupon);
  $('couponClose').addEventListener('click', closeCoupon);
  renderApp();
  setInterval(tick, 1000);
  console.log('✅ OpenBet запущен — ' + STATE.matches.length + ' матчей, юзер: ' + AUTH.currentUser.username);
}

document.addEventListener('DOMContentLoaded', function() {
  initAuthUI();
  var userId = getCurrentUser();
  if (userId) {
    var u = loadUserState(userId);
    if (u) { startApp(); return; }
    else setCurrentUser(null);
  }
});
</script>
