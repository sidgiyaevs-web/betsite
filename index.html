<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BetDemo — Букмекерский макет</title>
<style>
  :root{
    --bg:#0f1419;
    --panel:#1a2029;
    --panel-2:#232b36;
    --border:#2d3743;
    --text:#e8edf3;
    --muted:#8a96a5;
    --accent:#00d97e;
    --accent-2:#00b368;
    --danger:#ff4d5e;
    --gold:#ffb800;
    --blue:#3a8dff;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;
    padding-bottom:90px;
  }
  /* HEADER */
  header{
    position:sticky;top:0;z-index:100;background:var(--panel);
    border-bottom:1px solid var(--border);padding:12px 16px;
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  }
  .logo{font-size:22px;font-weight:800;color:var(--accent);letter-spacing:.5px;}
  .logo span{color:var(--gold);}
  .search{
    flex:1;min-width:180px;background:var(--panel-2);border:1px solid var(--border);
    border-radius:8px;padding:8px 12px;color:var(--text);font-size:14px;
  }
  .search:focus{outline:none;border-color:var(--accent);}
  .balance{
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    color:#031a0f;font-weight:800;padding:8px 14px;border-radius:8px;
    font-size:14px;white-space:nowrap;
  }
  /* CATEGORIES */
  .cats{
    display:flex;gap:8px;overflow-x:auto;padding:12px 16px;
    background:var(--panel);border-bottom:1px solid var(--border);
    scrollbar-width:none;
  }
  .cats::-webkit-scrollbar{display:none;}
  .cat{
    background:var(--panel-2);border:1px solid var(--border);color:var(--muted);
    padding:8px 14px;border-radius:20px;font-size:13px;cursor:pointer;
    white-space:nowrap;transition:.15s;font-weight:600;
  }
  .cat.active,.cat:hover{background:var(--accent);color:#031a0f;border-color:var(--accent);}
  /* FILTERS */
  .filters{
    display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none;
  }
  .filters::-webkit-scrollbar{display:none;}
  .filter{
    background:transparent;border:1px solid var(--border);color:var(--muted);
    padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer;white-space:nowrap;
  }
  .filter.active{background:var(--blue);color:#fff;border-color:var(--blue);}
  /* MAIN */
  main{padding:12px 16px;max-width:1100px;margin:0 auto;}
  .section-title{
    font-size:16px;font-weight:700;margin:20px 0 10px;
    display:flex;align-items:center;gap:8px;
  }
  .section-title .dot{width:8px;height:8px;background:var(--accent);border-radius:50%;}
  /* MATCH CARD */
  .match{
    background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px;margin-bottom:12px;
  }
  .match-head{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:12px;font-size:12px;color:var(--muted);
  }
  .match-head .live{
    display:flex;align-items:center;gap:5px;color:var(--danger);font-weight:700;
  }
  .match-head .live::before{
    content:"";width:7px;height:7px;background:var(--danger);border-radius:50%;
    animation:pulse 1.2s infinite;
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .teams{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
  .team{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:600;}
  .team .score{font-size:18px;font-weight:800;color:var(--accent);}
  .markets{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:6px;}
  .market-group{margin-bottom:8px;}
  .market-label{font-size:11px;color:var(--muted);text-transform:uppercase;margin-bottom:4px;font-weight:600;}
  .odds-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:6px;}
  .odd{
    background:var(--panel-2);border:1px solid var(--border);border-radius:8px;
    padding:8px;text-align:center;cursor:pointer;transition:.15s;
  }
  .odd:hover{border-color:var(--accent);}
  .odd.selected{background:var(--accent);border-color:var(--accent);color:#031a0f;}
  .odd.selected .val,.odd.selected .lbl{color:#031a0f;}
  .odd .lbl{font-size:10px;color:var(--muted);display:block;margin-bottom:2px;}
  .odd .val{font-size:14px;font-weight:800;}
  .more{
    display:block;text-align:center;margin-top:10px;font-size:12px;
    color:var(--blue);cursor:pointer;text-decoration:underline;
  }
  /* COUPON */
  .coupon{
    position:fixed;bottom:0;left:0;right:0;background:var(--panel);
    border-top:2px solid var(--accent);z-index:200;max-height:70vh;overflow-y:auto;
    transition:transform .3s;box-shadow:0 -10px 40px rgba(0,0,0,.5);
  }
  .coupon-bar{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 16px;cursor:pointer;gap:12px;
  }
  .coupon-info{display:flex;gap:12px;align-items:center;font-size:14px;}
  .coupon-info b{color:var(--accent);font-size:16px;}
  .coupon-btn{
    background:var(--accent);color:#031a0f;font-weight:800;border:none;
    padding:10px 20px;border-radius:8px;cursor:pointer;font-size:14px;
  }
  .coupon-btn:disabled{opacity:.4;cursor:not-allowed;}
  .coupon-body{display:none;padding:0 16px 16px;border-top:1px solid var(--border);}
  .coupon.open .coupon-body{display:block;}
  .coupon-item{
    display:flex;justify-content:space-between;align-items:start;gap:10px;
    padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;
  }
  .coupon-item .rm{color:var(--danger);cursor:pointer;font-weight:800;padding:0 5px;}
  .coupon-item .info{flex:1;}
  .coupon-item .info small{color:var(--muted);display:block;margin-top:2px;}
  .coupon-item .odds{color:var(--accent);font-weight:800;white-space:nowrap;}
  .coupon-type{
    display:flex;gap:8px;padding:10px 0;border-bottom:1px solid var(--border);
  }
  .coupon-type button{
    flex:1;background:var(--panel-2);border:1px solid var(--border);color:var(--muted);
    padding:8px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;
  }
  .coupon-type button.active{background:var(--accent);color:#031a0f;border-color:var(--accent);}
  .stake-row{display:flex;gap:8px;padding:12px 0;}
  .stake-row input{
    flex:1;background:var(--panel-2);border:1px solid var(--border);
    border-radius:6px;padding:10px;color:var(--text);font-size:14px;
  }
  .stake-row button{
    background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    padding:0 12px;border-radius:6px;cursor:pointer;font-weight:700;
  }
  .coupon-result{
    background:var(--panel-2);border-radius:8px;padding:12px;
    display:flex;justify-content:space-between;font-size:14px;margin-top:8px;
  }
  .coupon-result b{color:var(--accent);font-size:16px;}
  /* MODAL */
  .modal-bg{
    position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:300;
    display:none;align-items:center;justify-content:center;padding:16px;
  }
  .modal-bg.open{display:flex;}
  .modal{
    background:var(--panel);border-radius:14px;padding:20px;width:100%;max-width:600px;
    max-height:85vh;overflow-y:auto;
  }
  .modal h2{font-size:18px;margin-bottom:14px;display:flex;justify-content:space-between;}
  .modal .close{color:var(--muted);cursor:pointer;font-size:22px;line-height:1;}
  .modal-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .modal-row .lbl{color:var(--muted);}
  /* ADMIN */
  .admin-form{display:flex;flex-direction:column;gap:10px;margin-top:10px;}
  .admin-form input,.admin-form select{
    background:var(--panel-2);border:1px solid var(--border);border-radius:6px;
    padding:10px;color:var(--text);font-size:14px;width:100%;
  }
  .admin-form button{
    background:var(--accent);color:#031a0f;font-weight:800;border:none;
    padding:12px;border-radius:8px;cursor:pointer;font-size:14px;
  }
  .fab{
    position:fixed;bottom:80px;right:16px;background:var(--blue);color:#fff;
    width:52px;height:52px;border-radius:50%;border:none;font-size:24px;
    cursor:pointer;z-index:150;box-shadow:0 6px 20px rgba(58,141,255,.5);
  }
  /* TOAST */
  .toast{
    position:fixed;top:80px;left:50%;transform:translateX(-50%);
    background:var(--accent);color:#031a0f;padding:12px 22px;border-radius:8px;
    font-weight:700;z-index:400;opacity:0;pointer-events:none;transition:.3s;
    font-size:14px;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(10px);}
  .empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:14px;}
  @media (max-width:600px){
    .balance{font-size:12px;padding:6px 10px;}
    .logo{font-size:18px;}
    .teams .team{font-size:14px;}
  }
</style>
</head>
<body>

<header>
  <div class="logo">Bet<span>Demo</span></div>
  <input class="search" id="search" placeholder="🔎 Поиск команды или матча…">
  <div class="balance" id="balance">💰 10 000 ₽</div>
</header>

<div class="cats" id="cats">
  <div class="cat active" data-cat="all">🔥 Все</div>
  <div class="cat" data-cat="football">⚽ Футбол</div>
  <div class="cat" data-cat="basketball">🏀 Баскетбол</div>
  <div class="cat" data-cat="hockey">🏒 Хоккей</div>
  <div class="cat" data-cat="mma">🥊 UFC / MMA</div>
  <div class="cat" data-cat="tennis">🎾 Теннис</div>
  <div class="cat" data-cat="cyber">🎮 Киберспорт</div>
  <div class="cat" data-cat="live">🔴 Live</div>
</div>

<div class="filters">
  <div class="filter active" data-filter="all">Все</div>
  <div class="filter" data-filter="today">Сегодня</div>
  <div class="filter" data-filter="live">Live</div>
  <div class="filter" data-filter="top">Топ</div>
</div>

<main id="matches"></main>

<button class="fab" onclick="openAdmin()">＋</button>

<!-- COUPON -->
<div class="coupon" id="coupon">
  <div class="coupon-bar" onclick="toggleCoupon()">
    <div class="coupon-info">
      🎟️ <span id="couponCount">0</span> · Коэф: <b id="couponOdds">0.00</b>
    </div>
    <button class="coupon-btn" id="placeBtn" disabled onclick="placeBet(event)">Сделать ставку</button>
  </div>
  <div class="coupon-body">
    <div class="coupon-type">
      <button class="active" data-type="single" onclick="setBetType('single')">Одиночная</button>
      <button data-type="express" onclick="setBetType('express')">Экспресс</button>
    </div>
    <div id="couponItems"></div>
    <div class="stake-row">
      <input type="number" id="stake" value="100" min="10" oninput="updateCoupon()">
      <button onclick="setStake(100)">100</button>
      <button onclick="setStake(500)">500</button>
      <button onclick="setStake(1000)">1000</button>
    </div>
    <div class="coupon-result">
      <span>Возможный выигрыш:</span>
      <b id="potential">0 ₽</b>
    </div>
  </div>
</div>

<!-- MODAL: MATCH DETAILS -->
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalContent"></div>
</div>

<!-- MODAL: ADMIN -->
<div class="modal-bg" id="adminBg" onclick="if(event.target===this)closeAdmin()">
  <div class="modal">
    <h2>⚙️ Демо-админка <span class="close" onclick="closeAdmin()">✕</span></h2>
    <p style="color:var(--muted);font-size:13px;margin-bottom:12px;">
      Добавьте новое событие — оно появится в списке матчей.
    </p>
    <div class="admin-form">
      <select id="aSport">
        <option value="football">⚽ Футбол</option>
        <option value="basketball">🏀 Баскетбол</option>
        <option value="hockey">🏒 Хоккей</option>
        <option value="mma">🥊 UFC / MMA</option>
        <option value="tennis">🎾 Теннис</option>
        <option value="cyber">🎮 Киберспорт</option>
      </select>
      <input id="aHome" placeholder="Команда 1 (хозяева)">
      <input id="aAway" placeholder="Команда 2 (гости)">
      <input id="aLeague" placeholder="Турнир / лига">
      <label style="font-size:12px;color:var(--muted);">
        <input type="checkbox" id="aLive" style="width:auto;"> Live-матч
      </label>
      <button onclick="addEvent()">Добавить событие</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ ДАННЫЕ ============ */
let events = [
  {id:1, sport:'football', live:true, minute:"67'", league:'АПЛ', home:'Арсенал', away:'Челси', hs:2, as:1,
    markets:{'1X2':{lbl:['1','X','2'],val:[1.85,3.60,4.20]},
             'Тотал 2.5':{lbl:['Б','М'],val:[1.70,2.10]},
             'Фора 1 (-1)':{lbl:['Да','Нет'],val:[2.40,1.55]},
             'Обе забьют':{lbl:['Да','Нет'],val:[1.55,2.35]}}},
  {id:2, sport:'football', live:false, minute:'20:45', league:'Ла Лига', home:'Реал Мадрид', away:'Барселона', hs:0, as:0,
    markets:{'1X2':{lbl:['1','X','2'],val:[2.10,3.40,3.30]},
             'Тотал 3.5':{lbl:['Б','М'],val:[2.05,1.75]},
             'Обе забьют':{lbl:['Да','Нет'],val:[1.45,2.60]},
             'Точный счёт':{lbl:['2:1','1:1','1:2'],val:[8.50,6.20,9.00]}}},
  {id:3, sport:'basketball', live:true, minute:"3-я четв.", league:'NBA', home:'Лейкерс', away:'Голден Стэйт', hs:78, as:82,
    markets:{'Победитель':{lbl:['1','2'],val:[2.05,1.75]},
             'Фора 1 (-3.5)':{lbl:['Да','Нет'],val:[1.90,1.90]},
             'Тотал 220.5':{lbl:['Б','М'],val:[1.85,1.95]},
             '4-я четверть':{lbl:['1','2'],val:[2.10,1.70]}}},
  {id:4, sport:'hockey', live:true, minute:"2-й период", league:'НХЛ', home:'Тампа-Бэй', away:'Бостон', hs:3, as:2,
    markets:{'Победитель':{lbl:['1','X','2'],val:[1.75,4.20,3.10]},
             'Тотал 5.5':{lbl:['Б','М'],val:[1.95,1.85]},
             'Фора 1 (-1.5)':{lbl:['Да','Нет'],val:[2.60,1.50]},
             'Период 3':{lbl:['1','X','2'],val:[2.30,3.80,2.70]}}},
  {id:5, sport:'mma', live:false, minute:'23:00', league:'UFC 305', home:'Махачев', away:'Порье', hs:0, as:0,
    markets:{'Победитель':{lbl:['1','2'],val:[1.35,3.20]},
             'Тотал раундов 2.5':{lbl:['Б','М'],val:[1.80,2.00]},
             'Метод победы':{lbl:['Нокаут','Сабмишн','Решение'],val:[3.50,2.80,4.10]}}},
  {id:6, sport:'tennis', live:true, minute:'2-й сет', league:'ATP Мастерс', home:'Джокович', away:'Алькарас', hs:1, as:1,
    markets:{'Победитель':{lbl:['1','2'],val:[2.10,1.75]},
             'Фора 1 (-1.5 сета)':{lbl:['Да','Нет'],val:[3.40,1.30]},
             'Тотал 22.5 геймов':{lbl:['Б','М'],val:[1.90,1.90]},
             'Счёт по сетам':{lbl:['2:0','2:1','1:2','0:2'],val:[3.80,3.20,4.20,2.60]}}},
  {id:7, sport:'cyber', live:true, minute:'Map 2', league:'CS2 Major', home:'NAVI', away:'FaZe', hs:1, as:0,
    markets:{'Победитель':{lbl:['1','2'],val:[1.65,2.25]},
             'Фора 1 (-1.5 карт)':{lbl:['Да','Нет'],val:[2.50,1.55]},
             'Тотал 2.5 карт':{lbl:['Б','М'],val:[2.20,1.65]},
             'Тотал раундов 26.5':{lbl:['Б','М'],val:[1.90,1.90]}}},
  {id:8, sport:'football', live:false, minute:'Завтра 21:00', league:'Лига Чемпионов', home:'Бавария', away:'ПСЖ', hs:0, as:0,
    markets:{'1X2':{lbl:['1','X','2'],val:[1.95,3.80,3.60]},
             'Тотал 3.5':{lbl:['Б','М'],val:[1.90,1.90]},
             'Обе забьют':{lbl:['Да','Нет'],val:[1.40,2.80]},
             'Точный счёт':{lbl:['2:1','2:2','1:2'],val:[7.50,11.0,10.0]}}},
];

/* ============ СОСТОЯНИЕ ============ */
let currentCat = 'all';
let currentFilter = 'all';
let searchQuery = '';
let coupon = [];
let betType = 'single';
let balance = 10000;

/* ============ ОТРИСОВКА ============ */
const sportIcon = {football:'⚽',basketball:'🏀',hockey:'🏒',mma:'🥊',tennis:'🎾',cyber:'🎮'};

function render(){
  const box = document.getElementById('matches');
  let list = events.slice();

  if(currentCat==='live') list = list.filter(e=>e.live);
  else if(currentCat!=='all') list = list.filter(e=>e.sport===currentCat);

  if(currentFilter==='live') list = list.filter(e=>e.live);
  if(currentFilter==='top') list = list.filter(e=>e.id<=4);

  if(searchQuery){
    const q = searchQuery.toLowerCase();
    list = list.filter(e=>
      e.home.toLowerCase().includes(q) ||
      e.away.toLowerCase().includes(q) ||
      e.league.toLowerCase().includes(q)
    );
  }

  if(!list.length){
    box.innerHTML = '<div class="empty">Ничего не найдено 🤷</div>';
    return;
  }

  box.innerHTML = list.map(e=>{
    const icon = sportIcon[e.sport]||'🏆';
    let marketsHTML = '';
    for(const [name,m] of Object.entries(e.markets)){
      const oddsHTML = m.lbl.map((l,i)=>{
        const key = `${e.id}::${name}::${l}::${m.val[i]}`;
        const sel = coupon.find(c=>c.key===key)?'selected':'';
        return `<div class="odd ${sel}" onclick="addBet('${key.replace(/'/g,"\\'")}','${name}','${l}',${m.val[i]})">
                  <span class="lbl">${l}</span>
                  <span class="val">${m.val[i].toFixed(2)}</span>
                </div>`;
      }).join('');
      marketsHTML += `<div class="market-group">
        <div class="market-label">${name}</div>
        <div class="odds-row">${oddsHTML}</div>
      </div>`;
    }

    const liveBadge = e.live
      ? `<div class="live">LIVE ${e.minute}</div>`
      : `<div>${e.minute}</div>`;

    const scoreLine = e.live && e.hs!==null
      ? `<div class="teams">
           <div class="team"><span>${e.home}</span><span class="score">${e.hs}</span></div>
           <div class="team"><span>${e.away}</span><span class="score">${e.as}</span></div>
         </div>`
      : `<div class="teams">
           <div class="team"><span>${e.home}</span></div>
           <div class="team"><span>${e.away}</span></div>
         </div>`;

    return `<div class="match" data-id="${e.id}">
      <div class="match-head">
        ${liveBadge}
        <span>${icon} ${e.league}</span>
      </div>
      ${scoreLine}
      ${marketsHTML}
      <span class="more" onclick="openMatch(${e.id})">Все рынки →</span>
    </div>`;
  }).join('');
}

/* ============ КАТЕГОРИИ / ФИЛЬТРЫ ============ */
document.getElementById('cats').addEventListener('click',e=>{
  if(!e.target.classList.contains('cat'))return;
  document.querySelectorAll('.cat').forEach(c=>c.classList.remove('active'));
  e.target.classList.add('active');
  currentCat = e.target.dataset.cat;
  render();
});

document.querySelector('.filters').addEventListener('click',e=>{
  if(!e.target.classList.contains('filter'))return;
  document.querySelectorAll('.filter').forEach(c=>c.classList.remove('active'));
  e.target.classList.add('active');
  currentFilter = e.target.dataset.filter;
  render();
});

document.getElementById('search').addEventListener('input',e=>{
  searchQuery = e.target.value.trim();
  render();
});

/* ============ КУПОН ============ */
function addBet(key,name,pick,odds){
  // если уже выбрано в одиночной — снимаем
  const idx = coupon.findIndex(c=>c.key===key);
  if(idx>-1){ coupon.splice(idx,1); }
  else{
    if(betType==='single') coupon = [];  // одиночная — одна ставка
    if(!coupon.find(c=>c.key===key)){
      coupon.push({key,name,pick,odds});
    }
  }
  updateCoupon();
  render();
  toggleCoupon(true);
}

function removeBet(key){
  coupon = coupon.filter(c=>c.key!==key);
  updateCoupon();
  render();
}

function setBetType(type){
  betType = type;
  document.querySelectorAll('.coupon-type button').forEach(b=>{
    b.classList.toggle('active', b.dataset.type===type);
  });
  if(type==='single' && coupon.length>1){
    coupon = [coupon[coupon.length-1]];
  }
  updateCoupon();
  render();
}

function setStake(v){
  document.getElementById('stake').value = v;
  updateCoupon();
}

function updateCoupon(){
  document.getElementById('couponCount').textContent = coupon.length;
  const totalOdds = coupon.reduce((a,c)=>a*c.odds,1);
  document.getElementById('couponOdds').textContent = totalOdds.toFixed(2);

  const items = document.getElementById('couponItems');
  if(!coupon.length){
    items.innerHTML = '<div class="empty" style="padding:20px;">Купон пуст</div>';
  } else {
    items.innerHTML = coupon.map(c=>{
      const parts = c.key.split('::');
      const ev = events.find(e=>e.id==parts[0]);
      const title = ev ? `${ev.home} — ${ev.away}` : '';
      return `<div class="coupon-item">
        <div class="info">
          <b>${c.name}: ${c.pick}</b>
          <small>${title}</small>
        </div>
        <div class="odds">${c.odds.toFixed(2)}</div>
        <span class="rm" onclick="removeBet('${c.key.replace(/'/g,"\\'")}')">✕</span>
      </div>`;
    }).join('');
  }

  const stake = parseFloat(document.getElementById('stake').value)||0;
  const potential = coupon.length ? stake * totalOdds : 0;
  document.getElementById('potential').textContent = potential.toFixed(0)+' ₽';
  document.getElementById('placeBtn').disabled = !coupon.length || stake<10 || stake>balance;
}

function toggleCoupon(force){
  const c = document.getElementById('coupon');
  if(force) c.classList.add('open');
  else c.classList.toggle('open');
}

function placeBet(e){
  e.stopPropagation();
  const stake = parseFloat(document.getElementById('stake').value)||0;
  const totalOdds = coupon.reduce((a,c)=>a*c.odds,1);
  const win = stake * totalOdds;
  if(stake>balance){ toast('Недостаточно средств'); return; }
  balance -= stake;
  document.getElementById('balance').textContent = '💰 '+balance.toFixed(0)+' ₽';
  toast(`✅ Ставка ${stake} ₽ принята. Возможный выигрыш: ${win.toFixed(0)} ₽`);
  coupon = [];
  updateCoupon();
  render();
}

/* ============ МОДАЛКА МАТЧА ============ */
function openMatch(id){
  const e = events.find(x=>x.id===id);
  if(!e)return;
  const icon = sportIcon[e.sport]||'🏆';
  let marketsHTML = '';
  for(const [name,m] of Object.entries(e.markets)){
    marketsHTML += `<div style="margin-top:14px;">
      <div class="market-label">${name}</div>
      <div class="odds-row">${m.lbl.map((l,i)=>{
        const key = `${e.id}::${name}::${l}::${m.val[i]}`;
        return `<div class="odd" onclick="addBet('${key.replace(/'/g,"\\'")}','${name}','${l}',${m.val[i]});closeModal();">
          <span class="lbl">${l}</span><span class="val">${m.val[i].toFixed(2)}</span>
        </div>`;
      }).join('')}</div>
    </div>`;
  }
  document.getElementById('modalContent').innerHTML = `
    <h2>${icon} ${e.home} — ${e.away}
      <span class="close" onclick="closeModal()">✕</span>
    </h2>
    <div class="modal-row"><span class="lbl">Турнир</span><span>${e.league}</span></div>
    <div class="modal-row"><span class="lbl">Статус</span><span>${e.live?'🔴 LIVE '+e.minute:e.minute}</span></div>
    <div class="modal-row"><span class="lbl">Счёт</span><span>${e.live?e.hs+':'+e.as:'—'}</span></div>
    ${marketsHTML}
  `;
  document.getElementById('modalBg').classList.add('open');
}
function closeModal(){ document.getElementById('modalBg').classList.remove('open'); }

/* ============ АДМИНКА ============ */
function openAdmin(){ document.getElementById('adminBg').classList.add('open'); }
function closeAdmin(){ document.getElementById('adminBg').classList.remove('open'); }

function addEvent(){
  const sport = document.getElementById('aSport').value;
  const home = document.getElementById('aHome').value.trim();
  const away = document.getElementById('aAway').value.trim();
  const league = document.getElementById('aLeague').value.trim() || 'Товарищеский';
  const live = document.getElementById('aLive').checked;
  if(!home || !away){ toast('Заполните команды'); return; }

  const defaults = {
    football:{'1X2':{lbl:['1','X','2'],val:[2.00,3.20,3.50]},'Тотал 2.5':{lbl:['Б','М'],val:[1.85,1.95]},'Обе забьют':{lbl:['Да','Нет'],val:[1.70,2.10]}},
    basketball:{'Победитель':{lbl:['1','2'],val:[1.85,1.95]},'Фора 1 (-4.5)':{lbl:['Да','Нет'],val:[1.90,1.90]},'Тотал 210.5':{lbl:['Б','М'],val:[1.90,1.90]}},
    hockey:{'Победитель':{lbl:['1','X','2'],val:[2.00,4.00,3.00]},'Тотал 5.5':{lbl:['Б','М'],val:[1.90,1.90]}},
    mma:{'Победитель':{lbl:['1','2'],val:[1.80,2.00]},'Тотал раундов 2.5':{lbl:['Б','М'],val:[1.85,1.95]}},
    tennis:{'Победитель':{lbl:['1','2'],val:[1.90,1.90]},'Тотал 22.5':{lbl:['Б','М'],val:[1.90,1.90]}},
    cyber:{'Победитель':{lbl:['1','2'],val:[1.80,2.00]},'Тотал 2.5 карт':{lbl:['Б','М'],val:[2.00,1.80]}}
  };

  events.push({
    id: Date.now(),
    sport, live, minute: live ? "1'" : 'Скоро',
    league, home, away,
    hs: live?0:0, as: live?0:0,
    markets: defaults[sport]
  });

  document.getElementById('aHome').value = '';
  document.getElementById('aAway').value = '';
  document.getElementById('aLeague').value = '';
  closeAdmin();
  render();
  toast('✅ Событие добавлено');
}

/* ============ ТОСТ ============ */
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2500);
}

/* ============ LIVE-ОБНОВЛЕНИЕ СЧЁТА ============ */
setInterval(()=>{
  events.forEach(e=>{
    if(e.live && e.sport==='football' && Math.random()<0.05){
      if(Math.random()<0.5) e.hs++; else e.as++;
      // обновим минуту
      const m = parseInt(e.minute)||1;
      e.minute = Math.min(90,m+1)+"'";
    }
    if(e.live && (e.sport==='basketball'||e.sport==='hockey') && Math.random()<0.3){
      if(Math.random()<0.5) e.hs += e.sport==='basketball'?2:1;
      else e.as += e.sport==='basketball'?2:1;
    }
  });
  if(currentCat==='live' || events.some(e=>e.live)) render();
}, 5000);

/* ============ СТАРТ ============ */
render();
updateCoupon();
</script>
