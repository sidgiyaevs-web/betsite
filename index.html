<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a0a12">
<title>⚡ OpenBet Pro v5</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
:root{--bg:#0a0a12;--bg2:#12121f;--card:#14142a;--card-hover:#1c1c38;--border:rgba(100,100,150,.12);--border-2:rgba(120,120,180,.3);--text:#f0f0ff;--text-2:#b0b0d0;--muted:#5a5a7a;--accent:#7c5cff;--accent-2:#00d4ff;--green:#00e676;--red:#ff3860;--gold:#ffb800;--r-sm:10px;--r-md:14px;--r-lg:18px;--r-xl:24px}
body.light{--bg:#f2f3f9;--bg2:#e8eaf2;--card:#fff;--card-hover:#f5f6fc;--border:rgba(90,90,130,.1);--border-2:rgba(90,90,130,.22);--text:#0e0e1c;--text-2:#3a3a55;--muted:#7a7a95}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .3s,color .3s}
body.has-coupon{padding-bottom:140px}
.header{position:sticky;top:0;z-index:100;border-bottom:1px solid var(--border);padding:14px 20px;backdrop-filter:blur(20px);background:rgba(10,10,18,.85)}
body.light .header{background:rgba(242,243,249,.9)}
.header-inner{max-width:1280px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:14px}
.logo{font-size:20px;font-weight:900;cursor:pointer;user-select:none;display:flex;align-items:center;gap:10px}
.logo-icon{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#7c5cff,#00d4ff);display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:0 4px 16px rgba(124,92,255,.4)}
.logo span{background:linear-gradient(135deg,#7c5cff,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-actions{display:flex;align-items:center;gap:8px}
.balance{background:var(--card);border:1px solid var(--border);padding:9px 16px;border-radius:var(--r-md);font-weight:800;font-size:13.5px;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;transition:all .25s;white-space:nowrap}
.balance:hover{border-color:var(--accent)}
.balance.flash-bonus{border-color:var(--gold);box-shadow:0 0 28px rgba(255,184,0,.5)}
.balance.flash-win{border-color:var(--green);box-shadow:0 0 24px rgba(0,230,118,.5)}
.balance.flash-lose{border-color:var(--red);box-shadow:0 0 24px rgba(255,56,96,.5)}
.icon-btn{width:40px;height:40px;border-radius:var(--r-md);background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .15s}
.icon-btn:hover{border-color:var(--accent)}
.icon-btn.muted{opacity:.5}
.container{max-width:1280px;margin:0 auto;padding:20px}
.nav-tabs{display:flex;gap:8px;margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.nav-tabs::-webkit-scrollbar{display:none}
.nav-tab{padding:10px 18px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);font-weight:700;color:var(--muted);font-size:13px;white-space:nowrap;transition:all .2s}
.nav-tab.active{color:var(--text);border-color:var(--accent);background:rgba(124,92,255,.12)}
.session{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 20px;margin-bottom:18px;display:flex;gap:22px;align-items:center;flex-wrap:wrap;font-size:13px}
.session .label{color:var(--muted);font-weight:600}
.session .value{font-weight:800}
.session .value.green{color:var(--green)}
.session .value.red{color:var(--red)}
.session .value.gold{color:var(--gold)}
.session .spacer{margin-left:auto}
.bonus-hint{font-size:12px;color:var(--gold);font-weight:700;cursor:pointer;padding:6px 12px;border-radius:8px;background:rgba(255,184,0,.1);border:1px solid rgba(255,184,0,.2)}
.sport-filters{display:flex;gap:8px;margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.sport-filters::-webkit-scrollbar{display:none}
.sport-chip{padding:10px 18px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);font-weight:700;color:var(--muted);font-size:13px;white-space:nowrap;transition:all .2s}
.sport-chip.active{color:var(--text);border-color:var(--accent);background:rgba(124,92,255,.12)}
.matches-list{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:900px){.matches-list{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1400px){.matches-list{grid-template-columns:repeat(3,1fr)}}
.match{background:var(--card);border:1px solid var(--border);border-radius:var(--r-xl);padding:20px;display:flex;flex-direction:column;gap:16px;transition:all .25s}
.match:hover{border-color:var(--border-2)}
.match.finished{opacity:.5}
.match-head{display:flex;align-items:center;gap:10px}
.match-sport{font-size:18px}
.match-league{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.match-status{font-size:10px;padding:5px 12px;border-radius:8px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;white-space:nowrap}
.match-status.live{background:var(--red);color:#fff;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
.match-status.live::before{content:'●';margin-right:5px;font-size:9px}
.match-status.finished{background:rgba(120,120,140,.2);color:var(--muted)}
.match-status.countdown{background:var(--accent-2);color:#000}
.teams{display:flex;flex-direction:column;gap:12px}
.team-line{display:flex;align-items:center;justify-content:space-between;gap:12px}
.team-info{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.team-logo-wrap{position:relative;flex-shrink:0}
.team-logo{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;color:#fff;border:2px solid rgba(255,255,255,.12)}
.team-logo.scored{animation:avScore 1.2s ease}
@keyframes avScore{0%,100%{transform:scale(1)}40%{transform:scale(1.4)}}
.team-rating{position:absolute;top:-4px;right:-4px;background:var(--bg);border:1px solid var(--border);border-radius:6px;font-size:9px;font-weight:800;padding:2px 6px;color:var(--accent-2)}
.team-flag{position:absolute;bottom:-4px;right:-4px;font-size:14px}
.team-name{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team-score{font-weight:900;font-size:28px;min-width:36px;text-align:right;transition:all .3s}
.team-score.scored{animation:scFlash 1.2s ease;color:var(--green)}
@keyframes scFlash{0%,100%{transform:scale(1)}30%{transform:scale(1.6)}}
.match-info{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);padding:10px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);font-weight:600;flex-wrap:wrap}
.match-info .time{font-weight:800;color:var(--text-2)}
.prob-bar{display:flex;height:5px;border-radius:3px;overflow:hidden;margin-top:4px;background:rgba(120,120,160,.15)}
.prob-bar i{display:block;height:100%;transition:width .5s}
.prob-bar .ph{background:var(--accent-2)}
.prob-bar .pd{background:var(--muted)}
.prob-bar .pa{background:var(--red)}
.progress{display:flex;gap:4px;height:5px}
.progress-seg{flex:1;background:rgba(120,120,160,.15);border-radius:3px;overflow:hidden;position:relative}
.progress-seg.done{background:var(--green)}
.progress-seg.active::after{content:'';position:absolute;left:0;top:0;bottom:0;width:var(--p,0%);background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.ufc-result{background:linear-gradient(135deg,rgba(255,184,0,.15),rgba(255,56,96,.08));border:1px solid rgba(255,184,0,.4);border-radius:var(--r-md);padding:14px;font-size:13px;font-weight:700}
.ufc-result .win{color:var(--gold);font-weight:900}
.odds-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.odds-row.two-col{grid-template-columns:1fr 1fr}
.odd-btn{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-md);padding:14px 10px;text-align:center;display:flex;flex-direction:column;gap:5px;transition:all .2s;font-family:inherit;color:var(--text)}
.odd-btn:hover:not(:disabled):not(.disabled){border-color:var(--accent);background:var(--card-hover)}
.odd-btn:disabled,.odd-btn.disabled{opacity:.25;cursor:not-allowed}
.odd-btn.up{border-color:rgba(0,230,118,.5)}
.odd-btn.down{border-color:rgba(255,56,96,.5)}
.odd-label{font-size:11px;color:var(--muted);font-weight:700}
.odd-value{font-size:18px;font-weight:800;color:var(--accent-2)}
.extras{border-top:1px solid var(--border);padding-top:14px}
.extras-toggle{color:var(--accent-2);font-size:13px;font-weight:800;display:flex;align-items:center;gap:8px;padding:6px 0}
.extras-toggle.open{color:var(--muted)}
.extras-grid{display:none;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.extras-grid.open{display:grid}
@media(min-width:600px){.extras-grid{grid-template-columns:repeat(3,1fr)}}
.odd-mini{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;transition:all .2s;font-family:inherit;color:var(--text)}
.odd-mini:hover:not(.disabled){border-color:var(--accent)}
.odd-mini-label{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;font-weight:600}
.odd-mini-value{font-size:13px;font-weight:800;color:var(--accent-2);white-space:nowrap}
.empty{text-align:center;padding:80px 20px;color:var(--muted)}
.empty-icon{font-size:56px;margin-bottom:16px;opacity:.4}
.history-filters{display:flex;gap:8px;margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.history-filters::-webkit-scrollbar{display:none}
.history-chip{padding:9px 16px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);font-weight:700;color:var(--muted);font-size:12.5px;white-space:nowrap}
.history-chip.active{color:var(--text);border-color:var(--accent);background:rgba(124,92,255,.1)}
.history-list{display:flex;flex-direction:column;gap:12px}
.history-item{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 18px;display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:all .2s}
.history-item.won{border-left:4px solid var(--green)}
.history-item.lost{border-left:4px solid var(--red)}
.history-item.pending{border-left:4px solid var(--gold)}
.history-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.history-match{font-weight:700;font-size:14.5px}
.history-meta{font-size:11.5px;color:var(--muted);margin-top:4px;font-weight:600}
.history-amount{font-weight:800;font-size:16px;white-space:nowrap}
.history-foot{display:flex;justify-content:space-between;align-items:center;gap:14px;padding-top:12px;border-top:1px solid var(--border)}
.history-odd{font-size:12.5px;color:var(--muted);font-weight:600}
.history-odd b{color:var(--accent-2);font-weight:800}
.history-status{font-weight:800;padding:5px 14px;border-radius:8px;text-transform:uppercase;font-size:10.5px;white-space:nowrap}
.history-status.won{background:rgba(0,230,118,.15);color:var(--green)}
.history-status.lost{background:rgba(255,56,96,.15);color:var(--red)}
.history-status.pending{background:rgba(255,184,0,.15);color:var(--gold)}
.cashout-btn{background:linear-gradient(135deg,var(--green),#00b050);color:#000;padding:11px 20px;border-radius:var(--r-md);font-weight:800;font-size:13px;align-self:flex-start}
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:22px}
@media(min-width:700px){.stats-grid{grid-template-columns:repeat(4,1fr)}}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px}
.stat-label{font-size:11.5px;color:var(--muted);margin-bottom:8px;font-weight:700;text-transform:uppercase}
.stat-value{font-size:24px;font-weight:800}
.stat-value.green{color:var(--green)}
.stat-value.red{color:var(--red)}
.stat-value.gold{color:var(--gold)}
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:22px}
.chart-title{font-size:12.5px;color:var(--muted);font-weight:800;text-transform:uppercase;margin-bottom:18px}
.chart-canvas{width:100%;height:220px;display:block}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.ach{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px 14px;text-align:center;opacity:.35;transition:all .3s}
.ach.unlocked{opacity:1;border-color:var(--gold);box-shadow:0 0 32px rgba(255,184,0,.2)}
.ach-icon{font-size:36px;margin-bottom:12px}
.ach-name{font-size:12.5px;font-weight:800;margin-bottom:4px}
.ach-desc{font-size:10.5px;color:var(--muted);font-weight:600}
.leaderboard{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px}
.lb-header{color:var(--muted);font-size:13px;margin-bottom:16px;font-weight:700}
.lb-header b{color:var(--gold);font-weight:900}
.lb-row{display:grid;grid-template-columns:48px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--border);font-size:13.5px}
.lb-row:last-child{border-bottom:none}
.lb-row.me{background:rgba(124,92,255,.12);margin:0 -20px;padding:14px 20px;border-radius:var(--r-md);border-bottom:none}
.lb-rank{font-weight:900;font-size:17px;color:var(--muted);text-align:center}
.lb-rank.top1{color:var(--gold)}
.lb-rank.top2{color:#c0c0c0}
.lb-rank.top3{color:#cd7f32}
.lb-name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-name.me{color:var(--accent-2)}
.lb-value{font-weight:800;color:var(--green);font-size:13.5px}
.tab-content{display:none}
.tab-content.active{display:block;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal-overlay.active{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border-2);border-radius:var(--r-xl);padding:28px;max-width:460px;width:100%;max-height:90vh;overflow-y:auto}
.modal h3{font-size:18px;margin-bottom:8px;font-weight:800}
.modal-sub{color:var(--muted);font-size:13px;margin-bottom:22px;font-weight:600}
.modal-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);font-size:13.5px}
.modal-row:last-of-type{border-bottom:none}
.modal-row .label{color:var(--muted);font-weight:600}
.modal-row .value{font-weight:800}
.modal input[type="number"]{width:100%;background:var(--card);border:1px solid var(--border);padding:16px;border-radius:var(--r-md);font-size:17px;margin:18px 0 14px;font-weight:800}
.modal input[type="number"]:focus{outline:none;border-color:var(--accent)}
.quick-stakes{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:18px}
.quick-stake{padding:11px 4px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);font-size:11.5px;font-weight:800;text-align:center}
.modal-actions{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;padding:15px;border-radius:var(--r-md);font-weight:800;font-size:14px;transition:all .2s}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff}
.btn-secondary{background:var(--card);border:1px solid var(--border)}
.btn-coupon{background:rgba(124,92,255,.15);border:1px solid var(--accent);color:var(--accent-2)}
.btn-builder{background:rgba(255,184,0,.15);border:1px solid var(--gold);color:var(--gold)}
.coupon-bar{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:2px solid var(--accent);padding:14px 20px;transform:translateY(100%);transition:transform .35s;z-index:200}
.coupon-bar.active{transform:translateY(0)}
.coupon-inner{max-width:1280px;margin:0 auto}
.coupon-items{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;margin-bottom:10px}
.coupon-item{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:10px 14px;display:flex;align-items:center;gap:12px;min-width:220px;font-size:12px}
.coupon-item-info{flex:1;min-width:0}
.coupon-item-match{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.coupon-item-pick{color:var(--accent-2);font-weight:800;font-size:11px;margin-top:3px}
.coupon-item-remove{color:var(--red);font-size:22px;padding:0 6px;line-height:1}
.coupon-actions{display:flex;gap:10px;justify-content:flex-end}
.coupon-clear{border:1px solid var(--border);color:var(--muted);padding:11px 18px;border-radius:var(--r-md);font-weight:700;font-size:13px}
.coupon-place{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;padding:11px 24px;border-radius:var(--r-md);font-weight:800;font-size:13.5px}
.skeleton{background:linear-gradient(90deg,var(--card) 25%,var(--card-hover) 50%,var(--card) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:var(--r-xl);height:220px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media(max-width:600px){
.header{padding:12px 14px}.logo{font-size:18px}.logo span{display:none}
.balance{padding:8px 12px;font-size:12.5px}.icon-btn{width:38px;height:38px}
.container{padding:14px}.match{padding:16px}.team-logo{width:40px;height:40px}.team-score{font-size:24px}
.quick-stakes{grid-template-columns:repeat(3,1fr)}.stats-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="logo" onclick="location.reload()">
      <div class="logo-icon">⚡</div>
      <span>OpenBet Pro</span>
    </div>
    <div class="header-actions">
      <div class="balance" id="balanceBox">💰 <span id="balance">100 000</span> ₽</div>
      <button class="icon-btn" id="themeBtn">🌙</button>
      <button class="icon-btn" id="soundBtn">🔊</button>
      <button class="icon-btn" id="newLineBtn">🔄</button>
    </div>
  </div>
</header>

<div class="container" style="padding-bottom:0">
  <div class="nav-tabs" id="navTabs">
    <button class="nav-tab active" data-tab="line">📊 Линия</button>
    <button class="nav-tab" data-tab="history">📜 История</button>
    <button class="nav-tab" data-tab="stats">📈 Статистика</button>
    <button class="nav-tab" data-tab="achiv">🏆 Достижения</button>
    <button class="nav-tab" data-tab="top">🏅 Рейтинг</button>
  </div>
</div>

<div class="container">
  <div class="session">
    <span><span class="label">Сессия:</span> <span class="value" id="sessionProfit">0 ₽</span></span>
    <span><span class="label">Ставок:</span> <span class="value" id="sessionBets">0</span></span>
    <span><span class="label">Винрейт:</span> <span class="value" id="sessionWinrate">—</span></span>
    <span class="spacer"></span>
    <span class="bonus-hint" id="bonusHint">💎 +100 000 ₽</span>
  </div>

  <div class="tab-content active" id="tab-line">
    <div class="sport-filters" id="sportFilters">
      <button class="sport-chip active" data-sport="all">🔥 Все</button>
      <button class="sport-chip" data-sport="football">⚽ Футбол</button>
      <button class="sport-chip" data-sport="hockey">🏒 Хоккей</button>
      <button class="sport-chip" data-sport="volleyball">🏐 Волейбол</button>
      <button class="sport-chip" data-sport="ufc">🥊 UFC</button>
    </div>
    <div class="matches-list" id="matches"></div>
  </div>

  <div class="tab-content" id="tab-history">
    <div class="history-filters">
      <button class="history-chip active" data-hfilter="all">Все</button>
      <button class="history-chip" data-hfilter="pending">Ожидание</button>
      <button class="history-chip" data-hfilter="won">Выигрыш</button>
      <button class="history-chip" data-hfilter="lost">Проигрыш</button>
      <button class="history-chip" id="csvBtn" style="margin-left:auto">📥 CSV</button>
    </div>

function poissonP(k, l) {
  if (k < 0 || k > 20) return 0;
  if (l <= 1e-9) return k === 0 ? 1 : 0;
  var lf = 0;
  for (var i = 2; i <= k; i++) lf += Math.log(i);
  return Math.exp(k * Math.log(l) - l - lf);
}

var MARGIN = 0.04;
function probToOdd(p) {
  if (p <= 0.003 || p >= 0.985) return null;
  var odd = (1 / p) * (1 - MARGIN);
  if (odd < 1.05 || odd > 30) return null;
  return Math.floor(odd * 100) / 100;
}

/* Ожидаемые лямбды на остаток матча */
function expectedLambdas(m) {
  var isF = m.sport === 'football';
  var base = isF ? 1.35 : 2.9;
  var homeAdv = isF ? 1.15 : 1.10;
  var totalMin = isF ? 90 : 60;
  var rem = Math.max(0.01, m.maxMinute - m.minute);
  var frac = rem / totalMin;

  var xgHomeFull = base * m.homeAtk * m.awayDef * homeAdv;
  var xgAwayFull = base * m.awayAtk * m.homeDef / homeAdv;
  var momBoost = 1 + m.momentum * 0.15;

  return {
    lamHome: xgHomeFull * frac * momBoost,
    lamAway: xgAwayFull * frac / momBoost
  };
}

/* Футбол/хоккей: интегрируем Poisson на остаток */
function probFootball(m) {
  var L = expectedLambdas(m);
  var pH = 0, pD = 0, pA = 0;
  var MAXG = 10;
  var distH = [], distA = [];
  for (var i = 0; i <= MAXG; i++) {
    distH.push(poissonP(i, L.lamHome));
    distA.push(poissonP(i, L.lamAway));
  }
  for (var h = 0; h <= MAXG; h++) {
    for (var a = 0; a <= MAXG; a++) {
      var p = distH[h] * distA[a];
      var fh = m.scoreHome + h, fa = m.scoreAway + a;
      if (fh > fa) pH += p;
      else if (fh === fa) pD += p;
      else pA += p;
    }
  }
  var t = pH + pD + pA || 1;
  return { pH: pH/t, pD: pD/t, pA: pA/t };
}

/* UFC: чистая логистика + прогресс */
function probUFC(m) {
  var diff = (m.homeRating - m.awayRating) / 300;
  var pH = 1 / (1 + Math.pow(10, -diff));
  var prog = m.minute / m.maxMinute;
  pH = 0.5 + (pH - 0.5) * (1 - prog * 0.5);
  return clamp(pH, 0.05, 0.95);
}

/* Волейбол: вычисляем ИТЕРАТИВНО, без рекурсии.
   Вероятность выиграть матч:
   - Сначала победа в текущем сете (через DP-таблицу)
   - Затем учёт оставшихся сетов
*/
function probVolley(m) {
  var atkDiff = m.homeAtk - m.awayAtk;
  var pRally = clamp(0.5 + atkDiff * 0.15, 0.35, 0.65);
  var isFifth = (m.setsHome === 2 && m.setsAway === 2);
  var target = isFifth ? 15 : 25;
  var h = m.pointsHome, a = m.pointsAway;

  /* DP для победы в текущем сете из (h, a) до target.
     Идём ИТЕРАТИВНО, снизу вверх: заполняем таблицу от краёв к началу.
     Размер таблицы: target+2 x target+2 (защита от бесконечности).
  */
  var SZ = target + 2;
  var dp = [];
  for (var i = 0; i < SZ; i++) {
    dp.push([]);
    for (var j = 0; j < SZ; j++) dp[i].push(0);
  }
  // Граничные условия для "h > target-1 и a > target-1":
  // Победа — если h >= target и h-a >= 2. То же для a.
  // Идём с (SZ-1, SZ-1) вниз.
  for (var hi = SZ - 1; hi >= 0; hi--) {
    for (var ai = SZ - 1; ai >= 0; ai--) {
      var isWinH = (hi >= target && hi - ai >= 2);
      var isWinA = (ai >= target && ai - hi >= 2);
      if (isWinH) { dp[hi][ai] = 1; continue; }
      if (isWinA) { dp[hi][ai] = 0; continue; }
      // Если рядом край — устанавливаем по принципу "next point"
      var rh = (hi + 1 < SZ) ? dp[hi+1][ai] : (hi > ai ? 1 : 0);
      var ra = (ai + 1 < SZ) ? dp[hi][ai+1] : (hi > ai ? 1 : 0);
      dp[hi][ai] = pRally * rh + (1 - pRally) * ra;
    }
  }
  var pCurrentSet = (h < SZ && a < SZ) ? dp[h][a] : (h > a ? 1 : 0);

  /* Оставшиеся сеты. pSetWin — вероятность выиграть отдельный будущий сет */
  var pSetWin = clamp(0.5 + atkDiff * 0.20, 0.30, 0.70);
  var needH = 3 - m.setsHome;
  var needA = 3 - m.setsAway;

  /* probWinSeries(needW, needL, p) — вероятность выиграть needW сетов
     до того как проиграешь needL. Формула через биномиалку. */
  function binomP(n, k, p) {
    if (k < 0 || k > n) return 0;
    var c = 1;
    for (var ii = 1; ii <= k; ii++) c = c * (n - ii + 1) / ii;
    return c * Math.pow(p, k) * Math.pow(1 - p, n - k);
  }
  function probWinSeries(needW, needL, p) {
    if (needW <= 0) return 1;
    if (needL <= 0) return 0;
    var total = 0;
    for (var losses = 0; losses < needL; losses++) {
      var other = needW + losses - 1;
      total += binomP(other, needW - 1, p) * Math.pow(1 - p, losses) * p;
    }
    return total;
  }

  var pWinRestIfTakeSet = probWinSeries(needH - 1, needA, pSetWin);
  var pWinRestIfLoseSet = probWinSeries(needH, needA - 1, pSetWin);

  var res = pCurrentSet * pWinRestIfTakeSet + (1 - pCurrentSet) * pWinRestIfLoseSet;
  return clamp(res, 0.02, 0.98);
}

/* Универсальный расчёт исходов */
function computeProbs(m) {
  if (m.status === 'finished' || m.status === 'countdown') {
    return { home: null, draw: null, away: null, pH: null, pD: null, pA: null };
  }
  if (m.sport === 'ufc') {
    var pHu = probUFC(m);
    return { home: probToOdd(pHu), away: probToOdd(1 - pHu), draw: null, pH: pHu, pD: null, pA: 1 - pHu };
  }
  if (m.sport === 'volleyball') {
    var pHv = probVolley(m);
    return { home: probToOdd(pHv), away: probToOdd(1 - pHv), draw: null, pH: pHv, pD: null, pA: 1 - pHv };
  }
  var f = probFootball(m);
  return {
    home: probToOdd(f.pH), draw: probToOdd(f.pD), away: probToOdd(f.pA),
    pH: f.pH, pD: f.pD, pA: f.pA
  };
}

/* ============ РАСШИРЕННЫЕ РЫНКИ ============ */
function computeExtras(m) {
  if (m.status === 'finished' || m.status === 'countdown') return {};
  var out = {};
  function add(label, p) {
    var o = probToOdd(p);
    if (o !== null) out[label] = o;
  }

  /* UFC */
  if (m.sport === 'ufc') {
    var pHu = probUFC(m);
    var pAu = 1 - pHu;
    var roundNum = m.round;
    var minInRound = m.minute - (roundNum - 1) * 24;

    // Шанс финиша за оставшиеся раунды
    var finRateByRound = [0.35, 0.30, 0.22, 0.15, 0.10];
    var pNoFin = 1;
    for (var r = roundNum; r <= 5; r++) {
      var rate = finRateByRound[r - 1];
      if (r === roundNum) rate = rate * ((24 - minInRound) / 24);
      pNoFin *= (1 - rate);
    }
    var pFinishFuture = 1 - pNoFin;
    pFinishFuture = clamp(pFinishFuture, 0.05, 0.85);
    var pDec = 1 - pFinishFuture;
    var pKO = pFinishFuture * 0.65;
    var pSub = pFinishFuture * 0.35;

    add('KO/TKO', pKO);
    add('Сабмишн', pSub);
    add('Решение', pDec);
    add('Бой досрочно', pFinishFuture);
    add('Вся дистанция', pDec);

    // Рынки ТБ раундов — только если ещё НЕ прошли
    if (roundNum < 3) {
      var pO25 = clamp(0.6 + (roundNum - 1) * 0.05 - pFinishFuture * 0.3, 0.2, 0.85);
      add('ТБ 2.5 раундов', pO25);
      add('ТМ 2.5 раундов', 1 - pO25);
    }
    if (roundNum < 4) {
      var pO35 = clamp(0.55 + (roundNum - 1) * 0.05 - pFinishFuture * 0.4, 0.15, 0.85);
      add('ТБ 3.5 раундов', pO35);
      add('ТМ 3.5 раундов', 1 - pO35);
    }

    if (roundNum < 5) {
      add(m.home + ' KO/TKO', pHu * pKO * 0.95);
      add(m.home + ' Сабмишн', pHu * pSub * 0.95);
      add(m.home + ' Решение', pHu * pDec * 0.95);
      add(m.away + ' KO/TKO', pAu * pKO * 0.95);
      add(m.away + ' Сабмишн', pAu * pSub * 0.95);
      add(m.away + ' Решение', pAu * pDec * 0.95);
    }
    return out;
  }

  /* ВОЛЕЙБОЛ */
  if (m.sport === 'volleyball') {
    var pHvol = probVolley(m);
    var setsPlayed = m.setsHome + m.setsAway;

    // Симуляция 300 раз для распределения сетов
    var pSW = clamp(0.5 + (m.homeAtk - m.awayAtk) * 0.20, 0.30, 0.70);
    var cnt3 = 0, cnt4 = 0, cnt5 = 0;
    for (var trial = 0; trial < 300; trial++) {
      var sh = m.setsHome, sa = m.setsAway;
      var guard = 0;
      while (sh < 3 && sa < 3 && guard++ < 10) {
        if (Math.random() < pSW) sh++; else sa++;
      }
      var total = sh + sa;
      if (total <= 3) cnt3++;
      else if (total === 4) cnt4++;
      else cnt5++;
    }
    var p3 = cnt3/300, p4 = cnt4/300, p5 = cnt5/300;
    if (p3 > 0.02) { add('ТМ 3.5 сетов', p3); add('ТБ 3.5 сетов', p4 + p5); }
    if (p5 > 0.02) { add('ТБ 4.5 сетов', p5); add('ТМ 4.5 сетов', p3 + p4); }

    // Победа в следующем сете
    if (setsPlayed < 5) {
      var nextSet = setsPlayed + 1;
      var pNextH = clamp(0.5 + (m.homeAtk - m.awayAtk) * 0.18, 0.30, 0.70);
      add('Победа в ' + nextSet + '-м сете · П1', pNextH);
      add('Победа в ' + nextSet + '-м сете · П2', 1 - pNextH);
    }

    // Точный счёт через симуляцию
    var scores = {};
    for (var tr = 0; tr < 400; tr++) {
      var sh2 = m.setsHome, sa2 = m.setsAway;
      var g2 = 0;
      while (sh2 < 3 && sa2 < 3 && g2++ < 10) {
        if (Math.random() < pSW) sh2++; else sa2++;
      }
      var key = sh2 + ':' + sa2;
      scores[key] = (scores[key] || 0) + 1;
    }
    for (var sc in scores) {
      var psc = scores[sc] / 400;
      if (psc > 0.03) add('Счёт ' + sc, psc * 1.03);
    }
    return out;
  }

  /* ФУТБОЛ / ХОККЕЙ */
  var L = expectedLambdas(m);
  var MAXG = 10;
  var distH = [], distA = [];
  for (var i2 = 0; i2 <= MAXG; i2++) {
    distH.push(poissonP(i2, L.lamHome));
    distA.push(poissonP(i2, L.lamAway));
  }
  // Соберём матрицу
  var matrix = {};
  var totalP = 0;
  for (var h2 = 0; h2 <= MAXG; h2++) {
    for (var a2 = 0; a2 <= MAXG; a2++) {
      var pp = distH[h2] * distA[a2];
      var fh = m.scoreHome + h2, fa = m.scoreAway + a2;
      var kk = fh + ':' + fa;
      matrix[kk] = (matrix[kk] || 0) + pp;
      totalP += pp;
    }
  }
  for (var k2 in matrix) matrix[k2] /= totalP;

  var isF = m.sport === 'football';

  // Двойной шанс
  var pH2 = 0, pD2 = 0, pA2 = 0;
  for (var kk2 in matrix) {
    var parts = kk2.split(':');
    var hh = parseInt(parts[0]), aa = parseInt(parts[1]);
    if (hh > aa) pH2 += matrix[kk2];
    else if (hh === aa) pD2 += matrix[kk2];
    else pA2 += matrix[kk2];
  }
  if (isF) {
    add('1X', pH2 + pD2);
    add('12', pH2 + pA2);
    add('X2', pD2 + pA2);
  }

  // Тоталы
  var linesT = isF ? [0.5, 1.5, 2.5, 3.5, 4.5] : [3.5, 4.5, 5.5, 6.5, 7.5];
  for (var li = 0; li < linesT.length; li++) {
    var lv = linesT[li];
    var pO = 0;
    for (var kk3 in matrix) {
      var p3b = kk3.split(':');
      if (parseInt(p3b[0]) + parseInt(p3b[1]) > lv) pO += matrix[kk3];
    }
    if (pO > 0.01 && pO < 0.99) {
      add('ТБ ' + lv, pO);
      add('ТМ ' + lv, 1 - pO);
    }
  }

  // Форы -1.5 / +1.5
  var pF1_15 = 0, pF1_15plus = 0;
  for (var kk4 in matrix) {
    var p4 = kk4.split(':');
    var diff = parseInt(p4[0]) - parseInt(p4[1]);
    if (diff > 1.5) pF1_15 += matrix[kk4];
    if (diff > -1.5) pF1_15plus += matrix[kk4];
  }
  add('Ф1 −1.5', pF1_15);
  add('Ф1 +1.5', pF1_15plus);
  add('Ф2 −1.5', 1 - pF1_15plus);
  add('Ф2 +1.5', 1 - pF1_15);

  // Обе забьют
  var pBtts = 0;
  for (var kk5 in matrix) {
    var p5 = kk5.split(':');
    if (parseInt(p5[0]) >= 1 && parseInt(p5[1]) >= 1) pBtts += matrix[kk5];
  }
  add('Обе · Да', pBtts);
  add('Обе · Нет', 1 - pBtts);

  // Чёт/Нечет
  var pEven = 0;
  for (var kk6 in matrix) {
    var p6 = kk6.split(':');
    if ((parseInt(p6[0]) + parseInt(p6[1])) % 2 === 0) pEven += matrix[kk6];
  }
  add('Чёт', pEven);
  add('Нечет', 1 - pEven);

  // Точные счета
  var sorted = [];
  for (var kk7 in matrix) sorted.push([kk7, matrix[kk7]]);
  sorted.sort(function(a, b) { return b[1] - a[1]; });
  for (var si = 0; si < Math.min(5, sorted.length); si++) {
    if (sorted[si][1] > 0.02) add('Счёт ' + sorted[si][0], sorted[si][1] * 1.03);
  }

  return out;
}

/* ============ СИМУЛЯЦИЯ ============ */
function simulateMinute(m) {
  if (m.status !== 'live') return;
  m.minute += 1;
  m.momentum *= 0.94;
  m.justScored = null;

  if (m.sport === 'ufc') { simulateUFC(m); return; }
  if (m.sport === 'volleyball') { simulateVolley(m); return; }

  if (m.minute >= m.maxMinute) {
    m.status = 'finished';
    m.finishedAt = Date.now();
    return;
  }
  var L = expectedLambdas(m);
  var rem = m.maxMinute - m.minute + 1;
  var perMinHome = L.lamHome / rem;
  var perMinAway = L.lamAway / rem;
  if (Math.random() < perMinHome) {
    m.scoreHome += 1;
    m.momentum = Math.min(1, m.momentum + 0.5);
    m.justScored = 'home';
  } else if (Math.random() < perMinAway) {
    m.scoreAway += 1;
    m.momentum = Math.max(-1, m.momentum - 0.5);
    m.justScored = 'away';
  }
}

function simulateUFC(m) {
  var cycle = 24;
  m.round = Math.min(5, Math.floor(m.minute / cycle) + 1);
  var minInRound = m.minute - (m.round - 1) * cycle;

  if (m.minute >= 120) {
    var pH = probUFC(m);
    var winner = Math.random() < pH ? 'home' : 'away';
    m.finalResult = { winner: winner, method: 'Решение', round: 5 };
    if (winner === 'home') { m.scoreHome = 1; m.scoreAway = 0; }
    else { m.scoreHome = 0; m.scoreAway = 1; }
    m.status = 'finished';
    m.finishedAt = Date.now();
    return;
  }

  var finRateByRound = [0.35, 0.30, 0.22, 0.15, 0.10];
  var ratePerRound = finRateByRound[m.round - 1];
  var ratePerMin = ratePerRound / 24;

  if (Math.random() < ratePerMin) {
    var pH2 = probUFC(m);
    var method = Math.random() < 0.6 ? 'KO/TKO' : 'Сабмишн';
    var winner2 = Math.random() < pH2 ? 'home' : 'away';
    m.finalResult = { winner: winner2, method: method, round: m.round };
    if (winner2 === 'home') { m.scoreHome = 1; m.scoreAway = 0; m.justScored = 'home'; }
    else { m.scoreHome = 0; m.scoreAway = 1; m.justScored = 'away'; }
    m.status = 'finished';
    m.finishedAt = Date.now();
  }
}

function simulateVolley(m) {
  if (m.minute >= m.maxMinute) {
    if (m.setsHome === m.setsAway) m.setsHome += 1;
    m.status = 'finished';
    m.finishedAt = Date.now();
    return;
  }
  if (m.setsHome >= 3 || m.setsAway >= 3) {
    m.status = 'finished';
    m.finishedAt = Date.now();
    return;
  }
  var isFifth = (m.setsHome === 2 && m.setsAway === 2);
  var target = isFifth ? 15 : 25;
  var pRally = clamp(0.5 + (m.homeAtk - m.awayAtk) * 0.15, 0.35, 0.65);

  var rallies = 1 + (Math.random() < 0.4 ? 1 : 0);
  for (var i = 0; i < rallies; i++) {
    if (Math.random() < pRally) m.pointsHome++;
    else m.pointsAway++;

    if (m.pointsHome >= target && m.pointsHome - m.pointsAway >= 2) {
      m.setsHome++; m.pointsHome = 0; m.pointsAway = 0;
      m.justScored = 'home'; return;
    }
    if (m.pointsAway >= target && m.pointsAway - m.pointsHome >= 2) {
      m.setsAway++; m.pointsHome = 0; m.pointsAway = 0;
      m.justScored = 'away'; return;
    }
  }
}

}

function renderProgress(m) {
  if (m.status === 'countdown') return '';
  if (m.sport === 'football') {
    var h1 = Math.min(1, m.minute / 45);
    var h2 = Math.max(0, Math.min(1, (m.minute - 45) / 45));
    return '<div class="progress"><div class="progress-seg ' + (h1 >= 1 ? 'done' : 'active') + '" style="--p:' + (h1 * 100) + '%"></div><div class="progress-seg ' + (h2 >= 1 ? 'done' : 'active') + '" style="--p:' + (h2 * 100) + '%"></div></div>';
  }
  if (m.sport === 'hockey') {
    var p1 = Math.min(1, m.minute / 20);
    var p2 = Math.max(0, Math.min(1, (m.minute - 20) / 20));
    var p3 = Math.max(0, Math.min(1, (m.minute - 40) / 20));
    return '<div class="progress"><div class="progress-seg ' + (p1 >= 1 ? 'done' : 'active') + '" style="--p:' + (p1 * 100) + '%"></div><div class="progress-seg ' + (p2 >= 1 ? 'done' : 'active') + '" style="--p:' + (p2 * 100) + '%"></div><div class="progress-seg ' + (p3 >= 1 ? 'done' : 'active') + '" style="--p:' + (p3 * 100) + '%"></div></div>';
  }
  if (m.sport === 'ufc') {
    var segs = '';
    for (var i = 1; i <= 5; i++) {
      var done = m.round > i || (m.status === 'finished' && m.round >= i);
      var active = m.round === i && m.status === 'live';
      var p = 0;
      if (active) p = ((m.minute % 24) / 24) * 100;
      if (done) p = 100;
      segs += '<div class="progress-seg ' + (done ? 'done' : active ? 'active' : '') + '" style="--p:' + Math.min(100, p) + '%"></div>';
    }
    return '<div class="progress">' + segs + '</div>';
  }
  if (m.sport === 'volleyball') {
    var segs2 = '';
    var totalPlayed = m.setsHome + m.setsAway;
    for (var j = 1; j <= 5; j++) {
      var homeWon = m.setsHome >= j;
      var isCurrent = (totalPlayed + 1) === j && m.status === 'live';
      var cls = '';
      if (homeWon) cls = 'done';
      else if (isCurrent) cls = 'active';
      segs2 += '<div class="progress-seg ' + cls + '" style="--p:' + (homeWon ? 100 : 0) + '%"></div>';
    }
    return '<div class="progress">' + segs2 + '</div>';
  }
  return '';
}

function renderMatches() {
  var list = matches.slice();
  if (currentSport !== 'all') list = list.filter(function(m) { return m.sport === currentSport; });

  list.sort(function(a, b) {
    var ord = { live: 0, countdown: 1, finished: 2 };
    if (ord[a.status] !== ord[b.status]) return ord[a.status] - ord[b.status];
    var so = { ufc: 0, football: 1, hockey: 2, volleyball: 3 };
    if (a.sport !== b.sport) return (so[a.sport] || 9) - (so[b.sport] || 9);
    return a.minute - b.minute;
  });

  var el = $('matches');
  if (!list.length) {
    el.innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="empty-icon">🎯</div><div class="empty-text">Матчей нет</div></div>';
    return;
  }
  var html = '';
  for (var i = 0; i < list.length; i++) {
    try {
      html += renderCard(list[i]);
    } catch (e) {
      console.error('renderCard error', list[i].id, e);
      html += '<div class="match"><div style="padding:20px;color:var(--red)">Ошибка карточки #' + list[i].id + '</div></div>';
    }
  }
  el.innerHTML = html;
}

function renderCard(m) {
  var probs = computeProbs(m);
  var isFin = m.status === 'finished';
  var isCd = m.status === 'countdown';
  var extras = (!isFin && !isCd) ? computeExtras(m) : {};
  var keys = Object.keys(extras);
  var isOpen = !!openExtras[m.id];

  var extrasH = '';
  if (keys.length) {
    extrasH = '<div class="extras"><button class="extras-toggle ' + (isOpen ? 'open' : '') + '" data-extras="' + m.id + '">' +
      (isOpen ? '▲ Скрыть' : '▼ Ещё ' + keys.length + ' рынков') + '</button><div class="extras-grid ' + (isOpen ? 'open' : '') + '">';
    for (var i = 0; i < keys.length; i++) {
      var l = keys[i];
      var o = extras[l];
      extrasH += '<button class="odd-mini" data-mid="' + m.id + '" data-mk="' + encodeURIComponent(l) + '" data-odd="' + o + '"><span class="odd-mini-label">' + l + '</span><span class="odd-mini-value">' + o.toFixed(2) + '</span></button>';
    }
    extrasH += '</div></div>';
  }

  var badge;
  if (isFin) badge = '<span class="match-status finished">Финиш</span>';
  else if (isCd) badge = '<span class="match-status countdown">⏱ Далее</span>';
  else badge = '<span class="match-status live">LIVE</span>';

  var infoText = '';
  if (isCd) infoText = '<span class="time" style="color:var(--accent-2);font-weight:800">⏱ ' + ft(m.countdownLeft) + '</span>';
  else if (isFin) infoText = '<span>Завершён</span>';
  else if (m.sport === 'football') infoText = '<span>' + (m.minute < 45 ? '1-й тайм' : '2-й тайм') + '</span> · <span class="time">' + m.minute + "'" + '</span>';
  else if (m.sport === 'hockey') {
    var per = m.minute < 20 ? '1-й' : m.minute < 40 ? '2-й' : '3-й';
    infoText = '<span>' + per + ' период</span> · <span class="time">' + m.minute + "'" + '</span>';
  }
  else if (m.sport === 'ufc') {
    var minInR = m.minute - (m.round - 1) * 24;
    infoText = '<span>Раунд ' + m.round + '/5</span> · <span class="time">' + Math.max(0, 24 - minInR) + 's</span>';
  }
  else if (m.sport === 'volleyball') {
    var sn = m.setsHome + m.setsAway + 1;
    infoText = '<span>Сет ' + Math.min(5, sn) + '</span> · <span class="time">' + m.pointsHome + ':' + m.pointsAway + '</span>';
  }

  var ufcResult = '';
  if (m.sport === 'ufc' && isFin && m.finalResult) {
    var w = m.finalResult.winner === 'home' ? m.home : m.away;
    ufcResult = '<div class="ufc-result">🏆 Победа: <span class="win">' + w + '</span> · ' + m.finalResult.method + ' · Раунд ' + m.finalResult.round + '</div>';
  }

  var scoreH, scoreA;
  if (isCd) { scoreH = '—'; scoreA = '—'; }
  else if (m.sport === 'ufc' && !isFin) { scoreH = '—'; scoreA = '—'; }
  else if (m.sport === 'volleyball') { scoreH = m.setsHome; scoreA = m.setsAway; }
  else { scoreH = m.scoreHome; scoreA = m.scoreAway; }

  var hFlag = FLAGS[m.homeCountry] || '';
  var aFlag = FLAGS[m.awayCountry] || '';

  var homeLogo = '<div class="team-logo-wrap"><div class="team-logo ' + (m.justScored === 'home' ? 'scored' : '') + '" style="background:' + teamColor(m.home) + '">' + teamInit(m.home) + '</div><div class="team-rating">' + (m.homeRating || 80) + '</div>' + (hFlag ? '<div class="team-flag">' + hFlag + '</div>' : '') + '</div>';
  var awayLogo = '<div class="team-logo-wrap"><div class="team-logo ' + (m.justScored === 'away' ? 'scored' : '') + '" style="background:' + teamColor(m.away) + '">' + teamInit(m.away) + '</div><div class="team-rating">' + (m.awayRating || 80) + '</div>' + (aFlag ? '<div class="team-flag">' + aFlag + '</div>' : '') + '</div>';

  var isUFC = m.sport === 'ufc';
  var twoCols = isUFC || probs.draw === null;
  var oddsRowCls = twoCols ? 'odds-row two-col' : 'odds-row';

  var probBar = '';
  if (!isFin && !isCd && probs.pH !== null && probs.pH !== undefined) {
    var pH = probs.pH * 100;
    var pD = (probs.pD !== null && probs.pD !== undefined) ? probs.pD * 100 : 0;
    var pA = (probs.pA !== null && probs.pA !== undefined) ? probs.pA * 100 : (1 - probs.pH) * 100;
    var title = probs.pD !== null ? 'P1: ' + pH.toFixed(0) + '% · X: ' + pD.toFixed(0) + '% · P2: ' + pA.toFixed(0) + '%' : 'P1: ' + pH.toFixed(0) + '% · P2: ' + pA.toFixed(0) + '%';
    probBar = '<div class="prob-bar" title="' + title + '">' +
      '<i class="ph" style="width:' + pH + '%"></i>' +
      (probs.pD !== null ? '<i class="pd" style="width:' + pD + '%"></i>' : '') +
      '<i class="pa" style="width:' + pA + '%"></i>' +
      '</div>';
  }

  return '<div class="match ' + (isFin ? 'finished' : '') + '">' +
    '<div class="match-head"><span class="match-sport">' + sIcon(m.sport) + '</span><span class="match-league">' + m.league + '</span>' + badge + '</div>' +
    '<div class="teams">' +
    '<div class="team-line"><div class="team-info">' + homeLogo + '<span class="team-name">' + m.home + '</span></div><span class="team-score ' + (m.justScored === 'home' ? 'scored' : '') + '">' + scoreH + '</span></div>' +
    '<div class="team-line"><div class="team-info">' + awayLogo + '<span class="team-name">' + m.away + '</span></div><span class="team-score ' + (m.justScored === 'away' ? 'scored' : '') + '">' + scoreA + '</span></div>' +
    '</div>' +
    probBar +
    '<div class="match-info">' + infoText + '</div>' +
    renderProgress(m) +
    ufcResult +
    '<div class="' + oddsRowCls + '">' +
    renderOddBtn(m, 'home', isUFC ? 'П1' : '1', probs.home, isFin || isCd) +
    (!isUFC && probs.draw !== null ? renderOddBtn(m, 'draw', 'X', probs.draw, isFin || isCd) : '') +
    renderOddBtn(m, 'away', isUFC ? 'П2' : '2', probs.away, isFin || isCd) +
    '</div>' +
    extrasH +
    '</div>';
}

function renderOddBtn(m, pk, l, v, dis) {
  if (!isValid(v)) return '<div class="odd-btn disabled"><span class="odd-label">' + l + '</span><span class="odd-value" style="color:var(--muted)">—</span></div>';
  var k = m.id + '-' + pk;
  var prev = prevOdds[k];
  var cls = '';
  if (prev !== undefined && Math.abs(prev - v) > 0.01) cls = v > prev ? 'up' : 'down';
  prevOdds[k] = v;
  return '<button class="odd-btn ' + cls + '" data-match-id="' + m.id + '" data-pick="' + pk + '" data-odd="' + v + '" ' + (dis ? 'disabled' : '') + '><span class="odd-label">' + l + '</span><span class="odd-value">' + v.toFixed(2) + '</span></button>';
}

function renderHistory() {
  var el = $('history');
  var list = wallet.bets.slice();
  if (currentHistory !== 'all') list = list.filter(function(b) { return b.status === currentHistory; });
  if (!list.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">📜</div><div class="empty-text">Ставок нет</div></div>';
    return;
  }
  var html = '';
  for (var i = 0; i < list.length; i++) {
    var b = list[i];
    var meta = '';
    if (b.type === 'express') meta = b.selections.length + ' событий';
    else if (b.type === 'builder') meta = b.selections.length + ' в билдере';
    else {
      var pl = b.pick === 'home' ? 'П1' : b.pick === 'draw' ? 'X' : b.pick === 'away' ? 'П2' : b.pick;
      meta = pl;
    }
    var m = matches.find(function(x) { return x.id === b.matchId; });
    var ch = '';
    if (b.status === 'pending' && m && m.status === 'live') {
      var co = cashoutValue(b, m);
      if (co > 0) ch = '<button class="cashout-btn" data-cashout="' + b.id + '">💰 Забрать ' + fmt(co) + ' ₽</button>';
    }
    var timeStr = '';
    try { timeStr = new Date(b.createdAt).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }); } catch(e) {}
    html += '<div class="history-item ' + b.status + '" data-history="' + b.id + '">' +
      '<div class="history-head"><div><div class="history-match">' + b.match + '</div><div class="history-meta">' + meta + ' · ' + timeStr + '</div></div><div class="history-amount">' + fmt(b.stake) + ' ₽</div></div>' +
      '<div class="history-foot"><div class="history-odd">Кэф <b>' + b.odd.toFixed(2) + '</b> · потенц. <b>' + fmt(b.potential) + ' ₽</b></div><div class="history-status ' + b.status + '">' + (b.status === 'won' ? '+' + fmt(b.payout) : b.status === 'lost' ? '-' + fmt(b.stake) : 'ожидание') + '</div></div>' +
      ch + '</div>';
  }
  el.innerHTML = html;
}

function renderStats() {
  var won = 0, lost = 0, pend = 0;
  for (var i = 0; i < wallet.bets.length; i++) {
    if (wallet.bets[i].status === 'won') won++;
    else if (wallet.bets[i].status === 'lost') lost++;
    else pend++;
  }
  var t = won + lost;
  var wr = t ? ((won / t) * 100).toFixed(1) : '0.0';
  var prof = wallet.totalWon - wallet.totalBet;
  var roi = wallet.totalBet ? ((prof / wallet.totalBet) * 100).toFixed(1) : '0.0';

  $('statsGrid').innerHTML =
    '<div class="stat-card"><div class="stat-label">Баланс</div><div class="stat-value gold">' + fmt(wallet.balance) + ' ₽</div></div>' +
    '<div class="stat-card"><div class="stat-label">Поставлено</div><div class="stat-value">' + fmt(wallet.totalBet) + ' ₽</div></div>' +
    '<div class="stat-card"><div class="stat-label">Выиграно</div><div class="stat-value green">' + fmt(wallet.totalWon) + ' ₽</div></div>' +
    '<div class="stat-card"><div class="stat-label">Профит</div><div class="stat-value ' + (prof >= 0 ? 'green' : 'red') + '">' + (prof >= 0 ? '+' : '') + fmt(prof) + ' ₽</div></div>' +
    '<div class="stat-card"><div class="stat-label">Винрейт</div><div class="stat-value">' + wr + '%</div></div>' +
    '<div class="stat-card"><div class="stat-label">ROI</div><div class="stat-value ' + (parseFloat(roi) >= 0 ? 'green' : 'red') + '">' + roi + '%</div></div>' +
    '<div class="stat-card"><div class="stat-label">Ставок</div><div class="stat-value">' + wallet.bets.length + '</div></div>' +
    '<div class="stat-card"><div class="stat-label">Ожидание</div><div class="stat-value gold">' + pend + '</div></div>';

  drawChart();
}

function drawChart() {
  var c = $('profitChart');
  if (!c) return;
  var ctx = c.getContext('2d');
  var dpr = window.devicePixelRatio || 1;
  var r = c.getBoundingClientRect();
  c.width = r.width * dpr; c.height = r.height * dpr;
  ctx.scale(dpr, dpr);
  var w = r.width, h = r.height;
  ctx.clearRect(0, 0, w, h);
  var hist = wallet.profitHistory;
  if (!hist || hist.length < 2) {
    ctx.fillStyle = '#5a5a7a';
    ctx.font = '13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Играй — график появится', w / 2, h / 2);
    return;
  }
  var min = 0, max = 0;
  for (var i = 0; i < hist.length; i++) { if (hist[i].v < min) min = hist[i].v; if (hist[i].v > max) max = hist[i].v; }
  var range = max - min || 1;
  ctx.strokeStyle = 'rgba(100,100,140,.1)';
  for (var g = 0; g <= 4; g++) { var y = (h / 4) * g; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
  var step = w / (hist.length - 1);
  var grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, 'rgba(124,92,255,.35)');
  grad.addColorStop(1, 'rgba(124,92,255,0)');
  ctx.beginPath();
  for (var j = 0; j < hist.length; j++) {
    var x = j * step;
    var yy = h - ((hist[j].v - min) / range) * h * 0.85 - h * 0.075;
    if (j === 0) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
  }
  ctx.strokeStyle = '#7c5cff';
  ctx.lineWidth = 2.5;
  ctx.stroke();
  ctx.lineTo(w, h);
  ctx.lineTo(0, h);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();
}

function renderAchiv() {

    var a = ACH[i];

function renderTop() {

  var all = BOTS.slice();
  all.push({ name: 'ТЫ', p: myProf, me: true });
  all.sort(function(a, b) { return b.p - a.p; });

  }
  $('leaderboard').innerHTML = html;
}

/* ============ СТАВКИ ============ */
function openBetModal(mid, pk, odd) {
  if (!isValid(odd)) return;
  var m = matches.find(function(x) { return x.id === mid; });
  if (!m || m.status === 'finished' || m.status === 'countdown') return;
  activeBet = { matchId: mid, pick: pk, odd: odd, isBuilder: false, isExpress: false };
  var lbl = pk === 'home' ? m.home : pk === 'away' ? m.away : pk === 'draw' ? 'Ничья' : pk;
  var pl = pk === 'home' ? 'П1' : pk === 'away' ? 'П2' : pk === 'draw' ? 'X' : pk;
  var probs = computeProbs(m);
  var pShown = '—';
  if (pk === 'home' && probs.pH != null) pShown = (probs.pH * 100).toFixed(1) + '%';
  else if (pk === 'draw' && probs.pD != null) pShown = (probs.pD * 100).toFixed(1) + '%';
  else if (pk === 'away' && probs.pA != null) pShown = (probs.pA * 100).toFixed(1) + '%';
  else pShown = ((1 / odd) * 100).toFixed(1) + '%';
  $('betModalTitle').textContent = m.home + ' — ' + m.away;
  $('betModalSub').textContent = pl + ' · ' + lbl;
  $('betModalOdd').textContent = odd.toFixed(2);
  $('betModalProb').textContent = pShown;
  $('betModalStake').value = '';
  $('betModalPotential').textContent = '—';
  $('betModalCoupon').style.display = 'block';
  $('betModalBuilder').style.display = 'block';
  $('betModal').classList.add('active');
  updatePotential();
}

function closeBetModal() {
  $('betModal').classList.remove('active');
  activeBet = null;
}

function updatePotential() {
  if (!activeBet) return;
  var s = parseFloat($('betModalStake').value) || 0;
  $('betModalPotential').textContent = s > 0 ? fmt(s * activeBet.odd) + ' ₽' : '—';
}

function placeBet() {
  if (!activeBet) return;
  var stake = parseFloat($('betModalStake').value);
  if (!stake || stake < 10 || stake > wallet.balance) return;

  if (activeBet.isExpress) {
    var sel = activeBet.selections.map(function(s) { return { matchId: s.matchId, pick: s.pick, odd: s.odd, label: s.label, match: s.match, status: 'pending' }; });
    wallet.balance -= stake;
    wallet.totalBet += stake;
    wallet.bets.unshift({
      id: Date.now(), type: 'express', match: 'Экспресс · ' + sel.length,
      selections: sel, odd: activeBet.odd, stake: stake,
      potential: Math.round(stake * activeBet.odd * 100) / 100,
      status: 'pending', createdAt: new Date().toISOString()
    });
    coupon = [];
    saveCoupon();
    renderCoupon();
  } else if (activeBet.isBuilder) {
    var m = matches.find(function(x) { return x.id === activeBet.matchId; });
    if (!m) return;
    var sel2 = activeBet.selections.map(function(s) { return { matchId: m.id, pick: s.pick, odd: s.odd, label: s.label, match: m.home + ' — ' + m.away, status: 'pending' }; });
    wallet.balance -= stake;
    wallet.totalBet += stake;
    wallet.bets.unshift({
      id: Date.now(), type: 'builder', matchId: m.id,
      match: m.home + ' — ' + m.away + ' (билдер)',
      sport: m.sport, selections: sel2, odd: activeBet.odd, stake: stake,
      potential: Math.round(stake * activeBet.odd * 100) / 100,
      status: 'pending', createdAt: new Date().toISOString()
    });
    delete builderBets[activeBet.matchId];
  } else {
    var m2 = matches.find(function(x) { return x.id === activeBet.matchId; });
    if (!m2 || m2.status === 'finished') return;
    wallet.balance -= stake;
    wallet.totalBet += stake;
    wallet.bets.unshift({
      id: Date.now(), type: 'single', matchId: m2.id,
      match: m2.home + ' — ' + m2.away, sport: m2.sport,
      pick: activeBet.pick, odd: activeBet.odd, stake: stake,
      potential: Math.round(stake * activeBet.odd * 100) / 100,
      status: 'pending', minute: m2.minute,
      score: (m2.scoreHome || 0) + ':' + (m2.scoreAway || 0),
      createdAt: new Date().toISOString()
    });
  }
  saveWallet();
  flashBalance('win');
  renderBalance();
  renderHistory();
  renderStats();
  renderAchiv();
  sBet();
  vibe(20);
  closeBetModal();
}

function addBuilder() {
  if (!activeBet) return;
  var mid = activeBet.matchId, pk = activeBet.pick, odd = activeBet.odd;
  if (!builderBets[mid]) builderBets[mid] = [];
  for (var i = 0; i < builderBets[mid].length; i++) {
    var b = builderBets[mid][i];
    if (b.pick === pk) return;
  }
  builderBets[mid].push({ pick: pk, odd: odd, label: pk === 'home' ? 'П1' : pk === 'away' ? 'П2' : pk === 'draw' ? 'X' : pk });
  var total = 1;
  for (var j = 0; j < builderBets[mid].length; j++) total *= builderBets[mid][j].odd;
  var m = matches.find(function(x) { return x.id === mid; });
  closeBetModal();
  activeBet = { matchId: mid, isBuilder: true, odd: total, selections: builderBets[mid].slice() };
  $('betModalTitle').textContent = '🧩 Билдер · ' + m.home + ' — ' + m.away;
  $('betModalSub').textContent = builderBets[mid].map(function(b) { return b.label + ' @ ' + b.odd.toFixed(2); }).join(' + ');
  $('betModalOdd').textContent = total.toFixed(2);
  $('betModalProb').textContent = '—';
  $('betModalStake').value = '';
  $('betModalPotential').textContent = '—';
  $('betModalCoupon').style.display = 'none';
  $('betModalBuilder').style.display = 'none';
  $('betModal').classList.add('active');
  updatePotential();
}

/* ============ КУПОН ============ */
function addCoupon(mid, pk, odd, lbl) {
  if (!isValid(odd)) return;
  for (var i = 0; i < coupon.length; i++) if (coupon[i].matchId === mid) return;
  var m = matches.find(function(x) { return x.id === mid; });
  if (!m) return;
  coupon.push({ matchId: mid, pick: pk, odd: odd, label: lbl, match: m.home + ' — ' + m.away });
  saveCoupon();
  renderCoupon();
}

function renderCoupon() {
  var el = $('couponBar');
  if (!coupon.length) {
    el.classList.remove('active');
    document.body.classList.remove('has-coupon');
    return;
  }
  el.classList.add('active');
  document.body.classList.add('has-coupon');
  var total = 1;
  for (var i = 0; i < coupon.length; i++) total *= coupon[i].odd;
  var itemsH = '';
  for (var j = 0; j < coupon.length; j++) {
    itemsH += '<div class="coupon-item"><div class="coupon-item-info"><div class="coupon-item-match">' + coupon[j].match + '</div><div class="coupon-item-pick">' + coupon[j].label + ' @ ' + coupon[j].odd.toFixed(2) + '</div></div><button class="coupon-item-remove" data-rm="' + j + '">×</button></div>';
  }
  el.innerHTML = '<div class="coupon-inner"><div class="coupon-items">' + itemsH + '</div><div class="coupon-actions"><button class="coupon-clear" id="couponClear">Очистить</button><button class="coupon-place" id="couponPlace">Экспресс · ' + coupon.length + ' · @ ' + total.toFixed(2) + '</button></div></div>';
  var rmBtns = el.querySelectorAll('[data-rm]');
  for (var k = 0; k < rmBtns.length; k++) {
    rmBtns[k].onclick = function() { coupon.splice(parseInt(this.dataset.rm), 1); saveCoupon(); renderCoupon(); };
  }
  var cb = $('couponClear');
  if (cb) cb.onclick = function() { coupon = []; saveCoupon(); renderCoupon(); };
  var pb = $('couponPlace');
  if (pb) pb.onclick = openExpress;
}

function openExpress() {
  if (coupon.length < 2) return;
  var total = 1;
  for (var i = 0; i < coupon.length; i++) total *= coupon[i].odd;
  activeBet = { isExpress: true, odd: total, selections: coupon.slice() };
  $('betModalTitle').textContent = 'Экспресс · ' + coupon.length;
  $('betModalSub').textContent = coupon.map(function(c) { return c.label + ' @ ' + c.odd.toFixed(2); }).join(' + ');
  $('betModalOdd').textContent = total.toFixed(2);
  $('betModalProb').textContent = (100 / total).toFixed(1) + '%';
  $('betModalStake').value = '';
  $('betModalPotential').textContent = '—';
  $('betModalCoupon').style.display = 'none';
  $('betModalBuilder').style.display = 'none';
  $('betModal').classList.add('active');
  updatePotential();
}

/* ============ КЭШАУТ ============ */
function cashoutValue(b, m) {
  if (!m || m.status !== 'live' || b.status !== 'pending') return 0;
  if (b.type === 'express') {
    var cv = 1;
    for (var i = 0; i < b.selections.length; i++) {
      var sel = b.selections[i];
      var sm = matches.find(function(x) { return Number(x.id) === Number(sel.matchId); });
      if (!sm) return 0;
      if (sm.status === 'finished') {
        if (sel.status === 'lost') return 0;
        if (sel.status !== 'won') return 0;
        continue;
      }
      if (sm.status === 'live') {
        var probs = computeProbs(sm);
        var curOdd = null;
        if (sel.pick === 'home') curOdd = probs.home;
        else if (sel.pick === 'away') curOdd = probs.away;
        else if (sel.pick === 'draw') curOdd = probs.draw;
        else curOdd = sel.odd;
        if (!isValid(curOdd)) return 0;
        cv *= 1 / curOdd;
      } else return 0;
    }
    var fair = b.potential * cv;
    var pay = Math.max(b.stake * 0.05, fair * 0.92);
    return Math.min(pay, b.potential * 0.98);
  }
  if (b.type === 'builder') {
    var sm2 = matches.find(function(x) { return Number(x.id) === Number(b.matchId); });
    if (!sm2 || sm2.status !== 'live') return 0;
    var remain = 1 - sm2.minute / sm2.maxMinute;
    return Math.round(b.stake * (0.4 + remain * 0.4) * 100) / 100;
  }
  var probs2 = computeProbs(m);
  var curOdd2 = null;
  if (b.pick === 'home') curOdd2 = probs2.home;
  else if (b.pick === 'away') curOdd2 = probs2.away;
  else if (b.pick === 'draw') curOdd2 = probs2.draw;
  else {
    var extras = computeExtras(m);
    curOdd2 = extras[b.pick] || b.odd;
  }
  if (!isValid(curOdd2)) return Math.round(b.stake * 0.4 * 100) / 100;
  var fair2 = b.potential / curOdd2;
  var pay2 = Math.max(b.stake * 0.05, fair2 * 0.93);
  return Math.min(pay2, b.potential * 0.98);
}

function doCashout(id) {
  var b = wallet.bets.find(function(x) { return x.id === id; });
  if (!b || b.status !== 'pending') return;
  var co = 0;
  if (b.type === 'express' || b.type === 'builder') {
    for (var i = 0; i < b.selections.length; i++) {
      var sel = b.selections[i];
      var sm = matches.find(function(x) { return Number(x.id) === Number(sel.matchId); });
      if (sm && sm.status === 'live') { co = cashoutValue(b, sm); break; }
    }
  } else {
    var m = matches.find(function(x) { return x.id === b.matchId; });
    if (m) co = cashoutValue(b, m);
  }
  if (co <= 0) return;
  b.status = 'won';
  b.payout = co;
  b.cashout = true;
  wallet.balance += co;
  wallet.totalWon += co;
  saveWallet();
  flashBalance('win');
  renderBalance();
  renderHistory();
  renderStats();
  renderAchiv();
  sBet();
}

/* ============ РАСЧЁТ СТАВОК ============ */
function checkSel(m, pick) {
  if (!m || m.status !== 'finished') return 'pending';
  var tot = (m.scoreHome || 0) + (m.scoreAway || 0);

  if (m.sport === 'ufc') {
    var fr = m.finalResult || { winner: m.scoreHome > m.scoreAway ? 'home' : 'away', method: 'Решение', round: 5 };
    var isH = fr.winner === 'home', isA = fr.winner === 'away';
    var md = fr.method, rr = fr.round, fin = md !== 'Решение';

    if (pick === 'home') return isH ? 'won' : 'lost';
    if (pick === 'away') return isA ? 'won' : 'lost';
    if (pick === 'KO/TKO') return md === 'KO/TKO' ? 'won' : 'lost';
    if (pick === 'Сабмишн') return md === 'Сабмишн' ? 'won' : 'lost';
    if (pick === 'Решение') return md === 'Решение' ? 'won' : 'lost';
    if (pick === 'Бой досрочно') return fin ? 'won' : 'lost';
    if (pick === 'Вся дистанция') return !fin ? 'won' : 'lost';

    var o25 = pick.match(/^(ТБ|ТМ)\s*2\.5 раундов$/);
    if (o25) { if (o25[1] === 'ТБ') return rr > 2.5 ? 'won' : 'lost'; return rr < 2.5 ? 'won' : 'lost'; }
    var o35 = pick.match(/^(ТБ|ТМ)\s*3\.5 раундов$/);
    if (o35) { if (o35[1] === 'ТБ') return rr > 3.5 ? 'won' : 'lost'; return rr < 3.5 ? 'won' : 'lost'; }

    if (pick === m.home + ' KO/TKO') return (isH && md === 'KO/TKO') ? 'won' : 'lost';
    if (pick === m.home + ' Сабмишн') return (isH && md === 'Сабмишн') ? 'won' : 'lost';
    if (pick === m.home + ' Решение') return (isH && md === 'Решение') ? 'won' : 'lost';
    if (pick === m.away + ' KO/TKO') return (isA && md === 'KO/TKO') ? 'won' : 'lost';
    if (pick === m.away + ' Сабмишн') return (isA && md === 'Сабмишн') ? 'won' : 'lost';
    if (pick === m.away + ' Решение') return (isA && md === 'Решение') ? 'won' : 'lost';
    return 'lost';
  }

  if (m.sport === 'volleyball') {
    if (pick === 'home') return m.setsHome > m.setsAway ? 'won' : 'lost';
    if (pick === 'away') return m.setsAway > m.setsHome ? 'won' : 'lost';
    var totS = m.setsHome + m.setsAway;
    var t35 = pick.match(/^(ТБ|ТМ)\s*3\.5 сетов$/);
    if (t35) { if (t35[1] === 'ТБ') return totS > 3.5 ? 'won' : 'lost'; return totS < 3.5 ? 'won' : 'lost'; }
    var t45 = pick.match(/^(ТБ|ТМ)\s*4\.5 сетов$/);
    if (t45) { if (t45[1] === 'ТБ') return totS > 4.5 ? 'won' : 'lost'; return totS < 4.5 ? 'won' : 'lost'; }
    var cs = pick.match(/^Счёт (\d+):(\d+)$/);
    if (cs) return (m.setsHome === +cs[1] && m.setsAway === +cs[2]) ? 'won' : 'lost';
    var setWin = pick.match(/^Победа в (\d+)-м сете · (П1|П2)$/);
    if (setWin) {
      var winnerHome = m.setsHome > m.setsAway;
      if (setWin[2] === 'П1') return winnerHome ? 'won' : 'lost';
      return winnerHome ? 'lost' : 'won';
    }
    return 'lost';
  }

  if (pick === 'home') return m.scoreHome > m.scoreAway ? 'won' : 'lost';
  if (pick === 'away') return m.scoreAway > m.scoreHome ? 'won' : 'lost';
  if (pick === 'draw') return m.scoreHome === m.scoreAway ? 'won' : 'lost';
  if (pick === '1X') return m.scoreHome >= m.scoreAway ? 'won' : 'lost';
  if (pick === '12') return m.scoreHome !== m.scoreAway ? 'won' : 'lost';
  if (pick === 'X2') return m.scoreHome <= m.scoreAway ? 'won' : 'lost';
  var tO = pick.match(/^ТБ\s*([\d.]+)$/);
  var tU = pick.match(/^ТМ\s*([\d.]+)$/);
  if (tO) return tot > parseFloat(tO[1]) ? 'won' : 'lost';
  if (tU) return tot < parseFloat(tU[1]) ? 'won' : 'lost';
  var f1 = pick.match(/^Ф1\s*[−\-]([\d.]+)$/);
  if (f1) return (m.scoreHome - m.scoreAway) > parseFloat(f1[1]) ? 'won' : 'lost';
  var f2 = pick.match(/^Ф2\s*[−\-]([\d.]+)$/);
  if (f2) return (m.scoreAway - m.scoreHome) > parseFloat(f2[1]) ? 'won' : 'lost';
  var f1p = pick.match(/^Ф1\s*\+([\d.]+)$/);
  if (f1p) return (m.scoreHome - m.scoreAway) > -parseFloat(f1p[1]) ? 'won' : 'lost';
  var f2p = pick.match(/^Ф2\s*\+([\d.]+)$/);
  if (f2p) return (m.scoreAway - m.scoreHome) > -parseFloat(f2p[1]) ? 'won' : 'lost';
  if (pick === 'Обе · Да') return (m.scoreHome >= 1 && m.scoreAway >= 1) ? 'won' : 'lost';
  if (pick === 'Обе · Нет') return !(m.scoreHome >= 1 && m.scoreAway >= 1) ? 'won' : 'lost';
  if (pick === 'Чёт') return tot % 2 === 0 ? 'won' : 'lost';
  if (pick === 'Нечет') return tot % 2 !== 0 ? 'won' : 'lost';
  var cs2 = pick.match(/^Счёт\s+(\d+):(\d+)$/);
  if (cs2) return (m.scoreHome === +cs2[1] && m.scoreAway === +cs2[2]) ? 'won' : 'lost';
  return 'lost';
}

function settleBets() {
  var changed = false;
  for (var bi = 0; bi < wallet.bets.length; bi++) {
    var b = wallet.bets[bi];
    if (b.status !== 'pending') continue;

    if (b.type === 'express' || b.type === 'builder') {
      var anyL = false, allW = true, allFin = true;
      for (var i = 0; i < b.selections.length; i++) {
        var sel = b.selections[i];
        if (sel.status === 'lost') { anyL = true; continue; }
        if (sel.status === 'won') continue;
        var m = matches.find(function(x) { return Number(x.id) === Number(sel.matchId); });
        if (!m || m.status !== 'finished') { allFin = false; allW = false; continue; }
        var r = checkSel(m, sel.pick);
        sel.status = r;
        if (r === 'lost') { anyL = true; allW = false; }
      }
      if (anyL) {
        b.status = 'lost';
        sLose(); flashBalance('lose');
        changed = true;
        wallet.profitHistory.push({ t: Date.now(), v: wallet.totalWon - wallet.totalBet });
        continue;
      }
      if (allFin && allW && b.selections.every(function(s) { return s.status === 'won'; })) {
        b.status = 'won';
        b.payout = Math.round(b.stake * b.odd * 100) / 100;
        wallet.balance += b.payout;
        wallet.totalWon += b.payout;
        sWin(); vibe(50); flashBalance('win');
        changed = true;
        wallet.profitHistory.push({ t: Date.now(), v: wallet.totalWon - wallet.totalBet });
        if (wallet.profitHistory.length > 100) wallet.profitHistory.shift();
      }
      continue;
    }
    var m2 = matches.find(function(x) { return Number(x.id) === Number(b.matchId); });
    if (!m2 || m2.status !== 'finished') continue;
    var r2 = checkSel(m2, b.pick);
    if (r2 === 'won') {
      b.status = 'won';
      b.payout = Math.round(b.stake * b.odd * 100) / 100;
      wallet.balance += b.payout;
      wallet.totalWon += b.payout;
      sWin(); vibe(50); flashBalance('win');
    } else {
      b.status = 'lost';
      sLose(); flashBalance('lose');
    }
    changed = true;
    wallet.profitHistory.push({ t: Date.now(), v: wallet.totalWon - wallet.totalBet });
    if (wallet.profitHistory.length > 100) wallet.profitHistory.shift();
  }
  if (changed) {
    saveWallet();
    renderBalance();
    renderHistory();
    renderStats();
    renderAchiv();
  }
}

/* ============ CSV ============ */
function exportCSV() {
  var rows = [['Дата', 'Матч', 'Тип', 'Исход', 'Кэф', 'Ставка', 'Потенциал', 'Статус', 'Выплата']];
  for (var i = 0; i < wallet.bets.length; i++) {
    var b = wallet.bets[i];
    rows.push([
      new Date(b.createdAt).toLocaleString('ru-RU'),
      b.match, b.type || 'single', b.pick || '',
      b.odd, b.stake, b.potential, b.status, b.payout || 0
    ]);
  }
  var csv = rows.map(function(r) { return r.map(function(v) { return '"' + v + '"'; }).join(','); }).join('\n');
  var blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'openbet_' + Date.now() + '.csv';
  a.click();
}

/* ============ ГЛАВНЫЙ ЦИКЛ ============ */
function tick() {
  resetDaily();
  for (var i = 0; i < matches.length; i++) {
    var m = matches[i];
    if (m.status === 'live') {
      try { simulateMinute(m); }
      catch (e) { console.error('sim error', m.id, e); m.status = 'finished'; }
    }
  }
  for (var j = 0; j < matches.length; j++) {
    var m2 = matches[j];
    if (m2.status === 'finished' && !m2.countdownStarted) {
      m2.finishedAt = m2.finishedAt || Date.now();
      if (Date.now() - m2.finishedAt > 4000) {
        m2.countdownStarted = true;
        m2.status = 'countdown';
        m2.countdownLeft = 45;
      }
    }
    if (m2.status === 'countdown') {
      m2.countdownLeft -= 1;
      if (m2.countdownLeft <= 0) {
        var nm;
        if (m2.sport === 'football') nm = newFootball();
        else if (m2.sport === 'hockey') nm = newHockey();
        else if (m2.sport === 'volleyball') nm = newVolleyball();
        else nm = newUFC();
        nm.id = m2.id;
        for (var k in m2) delete m2[k];
        for (var k2 in nm) m2[k2] = nm[k2];
      }
    }
  }

  settleBets();

  var cnt = { football: 0, hockey: 0, volleyball: 0, ufc: 0 };
  for (var q = 0; q < matches.length; q++) {
    var mm = matches[q];
    if ((mm.status === 'live' || mm.status === 'countdown') && cnt[mm.sport] !== undefined) cnt[mm.sport]++;
  }
  var targets = { football: 5, hockey: 3, volleyball: 3, ufc: 3 };
  var sports = ['football', 'hockey', 'volleyball', 'ufc'];
  for (var si = 0; si < sports.length; si++) {
    var sp = sports[si];
    if (cnt[sp] < targets[sp] - 1) {
      var need = targets[sp] - cnt[sp];
      for (var n = 0; n < need; n++) {
        var mn;
        if (sp === 'football') mn = newFootball();
        else if (sp === 'hockey') mn = newHockey();
        else if (sp === 'volleyball') mn = newVolleyball();
        else mn = newUFC();
        matches.push(mn);
      }
    }
  }

  if (matches.length > 30) {
    var seen = {};
    var filtered = [];
    for (var fi = 0; fi < matches.length; fi++) {
      var kk = matches[fi].home + '|' + matches[fi].away + '|' + matches[fi].sport;
      if (seen[kk]) continue;
      seen[kk] = true;
      filtered.push(matches[fi]);
    }
    matches = filtered.slice(0, 30);
  }

  renderMatches();
  if (currentTab === 'stats') renderStats();
  if (currentTab === 'history') renderHistory();
  if (currentTab === 'top') renderTop();
  if (currentTab === 'achiv') renderAchiv();
}

/* ============ ДЕЛЕГИРОВАНИЕ ============ */
document.addEventListener('click', function(e) {
  var mb = e.target.closest('.odd-btn[data-match-id]');
  if (mb && !mb.disabled && !mb.classList.contains('disabled')) {
    var mid = parseInt(mb.dataset.matchId);
    var pk = mb.dataset.pick;
    var odd = parseFloat(mb.dataset.odd);
    if (!isNaN(mid) && pk && isValid(odd)) { openBetModal(mid, pk, odd); return; }
  }
  var minb = e.target.closest('.odd-mini[data-mid]');
  if (minb && !minb.disabled && !minb.classList.contains('disabled')) {
    var mid2 = parseInt(minb.dataset.mid);
    var pk2 = decodeURIComponent(minb.dataset.mk);
    var odd2 = parseFloat(minb.dataset.odd);
    if (!isNaN(mid2) && pk2 && isValid(odd2)) { openBetModal(mid2, pk2, odd2); return; }
  }
  var eb = e.target.closest('[data-extras]');
  if (eb) {
    var id = parseInt(eb.dataset.extras);
    if (openExtras[id]) delete openExtras[id];
    else openExtras[id] = true;
    renderMatches();
    return;
  }
  var cb = e.target.closest('[data-cashout]');
  if (cb) { e.stopPropagation(); doCashout(parseInt(cb.dataset.cashout)); return; }
  var hi = e.target.closest('[data-history]');
  if (hi && !e.target.closest('[data-cashout]')) {
    var bid = parseInt(hi.dataset.history);
    var bet = wallet.bets.find(function(x) { return x.id === bid; });
    if (bet && bet.matchId) {
      var m = matches.find(function(x) { return x.id === bet.matchId; });
      if (!m) alert('Матч не найден — заменён');
      else if (m.status === 'finished') alert('Завершён: ' + m.home + ' — ' + m.away);
      else if (m.status === 'countdown') alert('Новый через ' + ft(m.countdownLeft));
      else alert(m.home + ' — ' + m.away + '\n' + (m.sport === 'volleyball' ? 'Сеты ' + m.setsHome + ':' + m.setsAway : m.scoreHome + ':' + m.scoreAway) + ' · live');
    }
    return;
  }
  if (e.target.closest('#balanceBox')) { claimBonus(); return; }
});
