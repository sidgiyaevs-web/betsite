          <div style="font-size:15px;font-weight:900;">${v}</div>
        </div>`
      ).join('')}
    </div>

    <div style="background:var(--card2);border-radius:10px;padding:12px;margin-bottom:12px;">
      <div style="font-size:11px;color:var(--t3);text-transform:uppercase;font-weight:700;margin-bottom:8px;">Пополнение · лимит ${fmtMoney(MAX_DAILY_DEPOSIT)}/день</div>
      <div style="font-size:12px;margin-bottom:10px;">Осталось сегодня: <b style="color:var(--yellow);">${fmtMoney(remain)}</b></div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;">
        ${[500,1000,5000,10000].map(v=>`<button class="fchip" onclick="deposit(${v})" style="justify-content:center;">${v.toLocaleString('ru-RU')}</button>`).join('')}
      </div>
    </div>

    <button style="width:100%;padding:12px;border-radius:8px;background:var(--card2);border:1px solid var(--bd);color:var(--t);font-weight:700;font-size:13px;cursor:pointer;" onclick="closeModal();openHistory()">История ставок</button>
  `);
}

function deposit(amount){
  const remain = MAX_DAILY_DEPOSIT - State.dailyAmount;
  if(amount > remain){ toast(`Лимит. Осталось ${fmtMoney(remain)}`,'err'); return; }
  State.balance += amount;
  State.dailyAmount += amount;
  updateBalance();
  saveState();
  toast(`+${fmtMoney(amount)}`,'ok');
  openProfile();
}

function claimBonus(){
  const today = new Date().toDateString();
  if(State.lastBonusDate === today){ toast('Бонус уже получен','err'); return; }
  State.balance += 500;
  State.lastBonusDate = today;
  updateBalance();
  saveState();
  toast('🎁 Бонус +500 ₽','ok');
  openProfile();
}

/* ---------- СОХРАНЕНИЕ МАТЧА ---------- */
function saveToHistory(m){
  State.matchHistory.unshift({
    id: m.id, sport: m.sport, league: m.league,
    home: m.home, away: m.away, hs: m.hs, as: m.as,
    finalNote: m.finalNote || '',
    finishedAt: Date.now(),
  });
  if(State.matchHistory.length > 50) State.matchHistory.length = 50;
  saveState();
}
window.saveToHistory = saveToHistory;

/* ---------- MAIN TICK ---------- */
function mainTick(){
  Manager.tick();
  renderLiveStrip();

  if(State.currentMatchId){
    updateMatchCenter();
  } else {
    renderMatchesList();
    updateOddsInCards();
  }
  const navL = $('bnavLive');
  if(navL){
    const n = Manager.liveCount();
    navL.textContent = n;
    navL.style.display = n ? 'flex' : 'none';
  }
}

function updateOddsInCards(){
  $$('.mc .oval').forEach(el => {
    const key = el.dataset.key;
    if(!key) return;
    const parts = key.split('_');
    const mid = parseInt(parts[0]);
    const pickIdx = parseInt(parts[parts.length-1]);
    const mktName = parts.slice(1, -1).join('_');
    const m = Manager.find(mid);
    if(!m || !m.markets[mktName]) return;
    const newVal = m.markets[mktName].val[pickIdx];
    const oldText = parseFloat(el.textContent);
    if(Math.abs(newVal - oldText) > 0.005){
      el.classList.remove('up','dn');
      void el.offsetWidth;
      el.classList.add(newVal > oldText ? 'up' : 'dn');
      el.textContent = newVal.toFixed(2);
    }
  });
}

/* ---------- СОБЫТИЯ UI ---------- */
document.addEventListener('click', e => {
  const lc = e.target.closest('.lcard');
  if(lc){
    const mid = parseInt(lc.dataset.mid);
    if(mid) openMatchCenter(mid);
    return;
  }

  const hint = e.target.closest('.mc-hint');
  if(hint){
    e.preventDefault(); e.stopPropagation();
    const mid = parseInt(hint.dataset.mid);
    if(mid) openMatchCenter(mid);
    return;
  }

  const odd = e.target.closest('.odd, .mkt-odd');
  if(odd && !odd.classList.contains('cl')){
    const mid = parseInt(odd.dataset.mid);
    const mkt = odd.dataset.mkt;
    const pick = parseInt(odd.dataset.pick);
    const m = Manager.find(mid);
    if(!m || !m.markets[mkt]) return;
    e.preventDefault(); e.stopPropagation();
    addToCoupon(mid, mkt, pick, m.markets[mkt].lbl[pick], m.markets[mkt].val[pick]);
    return;
  }

  const x = e.target.closest('.cp-item .x');
  if(x){
    const mid = parseInt(x.dataset.mid);
    const mkt = x.dataset.mkt;
    const pick = parseInt(x.dataset.pick);
    State.coupon = State.coupon.filter(c => !(c.matchId===mid && c.market===mkt && c.pickIdx===pick));
    updateCoupon();
    updateMarketSel();
    saveState();
    if(!State.coupon.length) hideCoupon();
    return;
  }

  const ct = e.target.closest('.cp-type button');
  if(ct){ setBetType(ct.dataset.type); return; }

  const q = e.target.closest('.cp-stake .q');
  if(q){ $('cpStake').value = q.dataset.s; updateCoupon(); return; }

  if(e.target.closest('#cpPlace')){ placeBet(); return; }
  if(e.target.closest('#cpClose')){ hideCoupon(); return; }
  if(e.target.closest('#cpBar') && !e.target.closest('#cpClose')){
    $('coupon').classList.toggle('open');
    return;
  }

  const ht = e.target.closest('#hdrTabs .htab');
  if(ht){ navTo(ht.dataset.nav); return; }

  const bn = e.target.closest('.bn');
  if(bn){ navTo(bn.dataset.nav); return; }

  const fc = e.target.closest('.fchip[data-sport]');
  if(fc){ State.currentSport = fc.dataset.sport; renderFiltersBar(); renderMatchesList(); return; }

  const hf = e.target.closest('[data-hist]');
  if(hf){ State.histFilter = hf.dataset.hist; openHistory(); return; }

  const mt = e.target.closest('.mcc-tab');
  if(mt){ setMccTab(mt.dataset.tab); return; }

  if(e.target.closest('#mccBack')){ closeMatchCenter(); return; }

  if(e.target.closest('#btnSearch')){ toast('Поиск скоро','inf'); return; }

  if(e.target.closest('#btnProfile') || e.target.closest('#balanceBtn')){
    openProfile();
    return;
  }

  if(e.target.closest('#seeAllLive')){
    State.currentSport = 'live';
    renderFiltersBar();
    renderMatchesList();
    return;
  }

  if(e.target.id === 'modalBg') closeModal();
});

document.addEventListener('change', e => {
  if(e.target.id === 'sortSelect'){
    State.sort = e.target.value;
    renderMatchesList();
  }
});

document.addEventListener('input', e => {
  if(e.target.id === 'cpStake') updateCoupon();
});

window.openHistory = openHistory;
window.openProfile = openProfile;
window.closeModal = closeModal;
window.deposit = deposit;
window.doCashout = doCashout;
window.claimBonus = claimBonus;

/* ---------- INIT ---------- */
function init(){
  console.log('%c⚡ SPORTLIVE v4', 'color:#ffd94a;font-size:16px;font-weight:900;');

  loadState();
  updateBalance();
  Manager.init();

  renderFiltersBar();
  renderMatchesList();
  renderLiveStrip();
  updateCoupon();

  // Основной цикл
  setInterval(mainTick, 500);

  // Форсированный пересчёт кэфов каждую секунду
  setInterval(() => {
    Manager.matches.forEach(m => { if(!m.finished) m.recalcOdds(); });
  }, 1000);

  // Кэшаут + история
  setInterval(() => {
    updateCashouts();
    if($('modalBg').classList.contains('on')){
      const t = $('modalContent').querySelector('.t');
      if(t && t.textContent.includes('История')) renderHistoryList();
    }
  }, 2000);

  // Автосохранение
  setInterval(saveState, 10000);

  // Приветствие
  setTimeout(() => toast('👋 Добро пожаловать в SportLive!','ok'), 700);

  // Бонус
  setTimeout(() => {
    const today = new Date().toDateString();
    if(State.lastBonusDate !== today){
      toast('🎁 Ежедневный бонус ждёт в профиле','ok');
    }
  }, 3200);

  console.log(`%c✅ Готово. Матчей: ${Manager.matches.length}`, 'color:#66d96a;font-size:12px;');
}

init();

/* === КОНЕЦ ЧАСТИ 4 === */
</script>

</body>
</html>
