<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RubUP — играй с друзьями</title>
<style>
:root{--bg:#0a0e1a;--border:rgba(255,255,255,.06);--text:#e8ecf5;--muted:#7c88a3}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:#0a0e1a;color:#e8ecf5;min-height:100vh;overflow-x:hidden;max-width:520px;margin:0 auto;padding-bottom:80px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;gap:8px;position:sticky;top:0;background:#0a0e1a;z-index:50}
.logo{font-size:26px;font-weight:900;letter-spacing:-1.5px;background:linear-gradient(90deg,#fff,#facc15);-webkit-background-clip:text;background-clip:text;color:transparent;font-style:italic;padding-right:20px;position:relative}
.logo::after{content:'↗';font-style:normal;font-size:22px;color:#facc15;position:absolute;right:0;top:2px;-webkit-text-fill-color:#facc15}
.top-right{display:flex;align-items:center;gap:6px}
.balance-pill{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:24px;background:rgba(99,102,241,.15);border:1px solid rgba(99,102,241,.35);font-weight:700;font-size:13px;cursor:pointer}
.coin{width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,#818cf8,#6366f1);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900}
.deposit-btn{padding:9px 16px;border-radius:22px;background:linear-gradient(135deg,#818cf8,#6366f1);color:#fff;font-weight:800;font-size:13px;box-shadow:0 6px 20px -6px rgba(99,102,241,.8)}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#f97316,#ef4444);display:flex;align-items:center;justify-content:center;font-size:16px;border:2px solid rgba(255,255,255,.15)}
.history-bar{display:flex;gap:6px;padding:8px 16px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--border)}
.history-bar::-webkit-scrollbar{display:none}
.icon-btn{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.hx{padding:6px 12px;border-radius:9px;font-size:13px;font-weight:800;flex-shrink:0;border:1px solid;animation:pop .3s;font-variant-numeric:tabular-nums}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.hx.blue{background:rgba(99,102,241,.15);border-color:rgba(99,102,241,.4);color:#818cf8}
.hx.red{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.4);color:#f87171}
.hx.green{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.4);color:#4ade80}
.game-area{position:relative;height:42vh;min-height:320px;overflow:hidden;background:linear-gradient(180deg,#0a0e1a 0%,#0f1424 60%,#1a1f35 100%)}
.stars{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle 3s infinite}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}
.clouds{position:absolute;bottom:0;left:0;right:0;height:130px;pointer-events:none}
.clouds svg{width:100%;height:100%;display:block}
.timer-wrap{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:180px;height:180px;z-index:5}
.timer-svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer-track{fill:none;stroke:rgba(99,102,241,.12);stroke-width:6}
.timer-prog{fill:none;stroke:url(#grad);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .15s linear}
.timer-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.timer-num{font-size:78px;font-weight:900;line-height:1;letter-spacing:-4px;color:#fff;font-variant-numeric:tabular-nums}
.timer-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-top:5px}
.timer-mult{font-size:52px;font-weight:900;line-height:1;letter-spacing:-2px;background:linear-gradient(90deg,#facc15,#f97316);-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
.timer-mult.crashed{background:linear-gradient(90deg,#ef4444,#b91c1c);-webkit-background-clip:text;background-clip:text;color:transparent}
.cow{position:absolute;font-size:60px;line-height:1;z-index:4;filter:drop-shadow(0 10px 20px rgba(0,0,0,.5));pointer-events:none;left:0;top:0;transition:transform .06s linear}
.cow.flying{animation:bob .5s ease-in-out infinite}
@keyframes bob{50%{margin-top:-6px}}
.flash{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:100px;z-index:20;opacity:0;pointer-events:none}
.flash.show{animation:crashA .8s ease-out}
@keyframes crashA{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}40%{opacity:1;transform:translate(-50%,-50%) scale(1.4)}100%{opacity:0;transform:translate(-50%,-50%) scale(2.2)}}
.main{padding:14px}
.bet-btn{width:100%;padding:17px;border-radius:16px;background:linear-gradient(135deg,#818cf8,#6366f1);color:#fff;font-size:17px;font-weight:800;box-shadow:0 10px 30px -10px rgba(99,102,241,.8);transition:.2s;display:flex;align-items:center;justify-content:center;gap:8px}
.bet-btn:hover:not(:disabled){transform:translateY(-2px)}
.bet-btn:disabled{opacity:.5;cursor:not-allowed}
.bet-btn.cash{background:linear-gradient(135deg,#facc15,#f59e0b);color:#1a1408}
.bet-btn.waiting{background:rgba(255,255,255,.06);color:var(--muted);box-shadow:none}
.bet-controls{display:flex;gap:8px;margin-top:10px;align-items:center}
.bet-input-wrap{flex:1;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:12px;padding:4px}
.bet-input-wrap button{width:38px;height:38px;border-radius:9px;background:rgba(255,255,255,.06);font-size:20px;font-weight:700}
.bet-input-wrap input{flex:1;border:none;background:transparent;color:#fff;font-size:16px;font-weight:800;text-align:center;outline:none;width:60px;font-variant-numeric:tabular-nums}
.quick{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.quick button{flex:1;min-width:46px;padding:8px 4px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--border);font-size:13px;font-weight:700;color:#b6c0d6}
.players-section{margin-top:16px}
.players-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:13px;font-weight:700;color:var(--muted)}
.players-head b{color:#fff}
.bank-pill{padding:3px 9px;border-radius:8px;background:rgba(250,204,21,.12);border:1px solid rgba(250,204,21,.3);color:#facc15;font-size:11px;font-weight:800}
.players-list{display:flex;flex-direction:column;gap:7px;max-height:320px;overflow-y:auto;padding-right:4px}
.players-list::-webkit-scrollbar{width:4px}
.players-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}
.player-row{display:flex;align-items:center;gap:10px;padding:9px 12px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:12px;font-size:13px;animation:slideIn .35s ease-out}
@keyframes slideIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.player-row.me{background:linear-gradient(135deg,rgba(99,102,241,.18),rgba(99,102,241,.06));border-color:rgba(99,102,241,.4)}
.player-row.win{background:linear-gradient(135deg,rgba(34,197,94,.12),transparent);border-color:rgba(34,197,94,.3)}
.player-row.lose{background:linear-gradient(135deg,rgba(239,68,68,.1),transparent);border-color:rgba(239,68,68,.25);opacity:.85}
.player-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0;border:2px solid rgba(255,255,255,.1)}
.player-info{flex:1;min-width:0}
.player-name{font-weight:700;font-size:13px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-bet{color:var(--muted);font-size:12px;font-weight:600}
.player-coef{font-weight:800;font-size:14px;color:#4ade80;font-variant-numeric:tabular-nums;flex-shrink:0}
.player-coef.lost{color:#f87171;text-decoration:line-through;opacity:.6}
.player-coef.waiting{color:var(--muted)}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:rgba(10,14,26,.96);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;padding:8px 4px 14px;z-index:100}
.bottom-nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:12px;font-size:10px;font-weight:700;color:var(--muted)}
.bottom-nav button.active{color:#fff;background:rgba(99,102,241,.15)}
.bottom-nav .ico{font-size:20px;line-height:1}
.bottom-nav .free-badge{position:absolute;transform:translate(22px,-6px);background:#facc15;color:#1a1408;font-size:8px;font-weight:900;padding:2px 4px;border-radius:4px}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-30px);padding:11px 20px;border-radius:13px;background:rgba(10,14,26,.96);border:1px solid rgba(99,102,241,.5);backdrop-filter:blur(14px);font-weight:800;font-size:13px;z-index:300;opacity:0;pointer-events:none;transition:.3s;white-space:nowrap;max-width:92vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.win{border-color:rgba(34,197,94,.5);color:#4ade80}
.toast.lose{border-color:rgba(239,68,68,.5);color:#f87171}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.show{display:flex}
.modal{background:linear-gradient(160deg,#1a2234,#0f1424);border:1px solid var(--border);border-radius:20px;padding:22px;max-width:400px;width:100%;text-align:center;animation:mp .3s}
@keyframes mp{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.modal h3{font-size:20px;font-weight:800;margin-bottom:6px}
.modal p{color:var(--muted);font-size:13px;margin-bottom:16px}
.modal input{width:100%;padding:13px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--border);color:#fff;font-size:16px;font-weight:700;text-align:center;margin-bottom:10px;outline:none}
.modal .btn-primary{width:100%;padding:13px;border-radius:12px;background:linear-gradient(135deg,#818cf8,#6366f1);color:#fff;font-weight:800;font-size:15px;margin-top:6px}
.host-badge{position:fixed;bottom:90px;right:12px;padding:6px 12px;border-radius:20px;background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.4);color:#4ade80;font-size:11px;font-weight:800;z-index:90;display:none;align-items:center;gap:6px}
.host-badge.show{display:flex}
.host-badge::before{content:'';width:6px;height:6px;border-radius:50%;background:#4ade80;animation:pd 1.5s infinite}
@keyframes pd{50%{opacity:.3}}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">RubUP</div>
  <div class="top-right">
    <div class="balance-pill" onclick="openModal()">
      <div class="coin">₽</div><span id="balance">1 000</span>
    </div>
    <button class="deposit-btn" onclick="openModal()">Пополнить</button>
    <div class="avatar">🌅</div>
  </div>
</div>

<div class="history-bar" id="histBar"><button class="icon-btn">🔊</button></div>

<div class="game-area">
  <div class="stars" id="stars"></div>
  <div class="clouds">
    <svg viewBox="0 0 520 140" preserveAspectRatio="none">
      <defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e2a44"/><stop offset="1" stop-color="#0f1424"/></linearGradient></defs>
      <path d="M0 70 Q40 25 90 55 Q130 15 190 50 Q240 20 300 55 Q360 25 420 60 Q470 35 520 65 L520 140 L0 140 Z" fill="url(#cg)"/>
      <path d="M0 95 Q60 65 120 90 Q180 60 250 90 Q310 65 380 95 Q440 70 520 100 L520 140 L0 140 Z" fill="#0a0e1a" opacity="0.92"/>
    </svg>
  </div>
  <div class="cow" id="cow">🐮</div>
  <div class="flash" id="flash">💥</div>
  <div class="timer-wrap">
    <svg class="timer-svg" viewBox="0 0 190 190">
      <defs><linearGradient id="grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#6366f1"/></linearGradient></defs>
      <circle class="timer-track" cx="95" cy="95" r="86"/>
      <circle class="timer-prog" id="timerProg" cx="95" cy="95" r="86" stroke-dasharray="540" stroke-dashoffset="0"/>
    </svg>
    <div class="timer-inner" id="timerInner">
      <div class="timer-num" id="timerNum">10</div>
      <div class="timer-label" id="timerLabel">до старта</div>
    </div>
  </div>
</div>

<div class="main">
  <button class="bet-btn" id="betBtn" onclick="onBetClick()">Сделать ставку</button>
  <div class="bet-controls">
    <div class="bet-input-wrap">
      <button onclick="adjustBet(-10)">−</button>
      <input type="number" id="betInput" value="10" min="1">
      <button onclick="adjustBet(10)">+</button>
    </div>
  </div>
  <div class="quick">
    <button onclick="setBet(1)">1 ₽</button>
    <button onclick="setBet(5)">5 ₽</button>
    <button onclick="setBet(10)">10 ₽</button>
    <button onclick="setBet(50)">50 ₽</button>
    <button onclick="setBet(100)">100 ₽</button>
    <button onclick="setBet('max')">MAX</button>
  </div>
  <div class="players-section">
    <div class="players-head">
      <span>Игроков <b id="pCount">0</b> · банк <b id="pBank">0</b> ₽</span>
      <span class="bank-pill" id="roundState">Ждём сервер...</span>
    </div>
    <div class="players-list" id="playersList"></div>
  </div>
</div>

<nav class="bottom-nav">
  <button class="active"><span class="ico">🎮</span>Игры</button>
  <button><span class="ico">🎁</span><span class="free-badge">FREE</span>Кейсы</button>
  <button><span class="ico">💰</span>Заработок</button>
  <button><span class="ico">🎉</span>Бонусы</button>
</nav>

<div class="host-badge" id="hostBadge">🟢 Ты — сервер раундов</div>
<div class="toast" id="toast"></div>

<div class="modal-bg" id="modal">
  <div class="modal">
    <h3>Профиль</h3>
    <p>Введи ник и баланс</p>
    <input type="text" id="nickInput" placeholder="Твой ник" maxlength="16">
    <input type="number" id="balInput" placeholder="Баланс (фейковые ₽)" value="1000">
    <button class="btn-primary" onclick="saveProfile()">Сохранить</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, set, update, onDisconnect, serverTimestamp, runTransaction, get }
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyALlhAOBT5zQFtZuUIReR57l9xDadqBC5A",
  authDomain: "betsite-4e6e8.firebaseapp.com",
  databaseURL: "https://betsite-4e6e8-default-rtdb.firebaseio.com",
  projectId: "betsite-4e6e8",
  storageBucket: "betsite-4e6e8.firebasestorage.app",
  messagingSenderId: "574363288522",
  appId: "1:574363288522:web:fdcf0bb7b0bfadf6634533"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* ============ КОНСТАНТЫ ============ */
const WAIT_SEC = 10;
const FLY_SEC = 0.6;
const GROWTH = 1.075;
const CRASH_WEIGHTS = [
  [1.00,5],[1.10,10],[1.20,12],[1.35,12],[1.50,10],[1.70,9],[2.00,8],
  [2.50,7],[3.00,6],[4.00,5],[5.00,4],[7.00,3],[10.00,2],[15.00,1.5],
  [25.00,1],[50.00,0.5],[100.00,0.3]
];
const TOTAL_W = CRASH_WEIGHTS.reduce((s,[,w])=>s+w,0);
function pickCrash(){let r=Math.random()*TOTAL_W;for(const[c,w]of CRASH_WEIGHTS){r-=w;if(r<=0)return c}return 1}

/* ============ Я ============ */
const MY_ID = (()=>{
  let id = localStorage.getItem('rub_uid');
  if(!id){ id = 'u'+Math.random().toString(36).slice(2,10); localStorage.setItem('rub_uid', id); }
  return id;
})();
let myNick = localStorage.getItem('rub_nick') || 'Игрок'+MY_ID.slice(1,4);
let myBalance = parseFloat(localStorage.getItem('rub_balance')) || 1000;

/* ============ СОСТОЯНИЕ ============ */
const S = {
  phase:'waiting', mult:1, crashAt:2, roundId:0,
  waitStartAt:0, flyStartAt:0,
  players:{}, history:[],
  myBet:0, myCashed:false, lastRound:0
};

/* ============ ПИШЕМ СЕБЯ В БАЗУ ============ */
set(ref(db,'players/'+MY_ID), { nick:myNick, balance:myBalance, ts:serverTimestamp() });
set(ref(db,'online/'+MY_ID), { nick:myNick, ts:serverTimestamp() });
onDisconnect(ref(db,'online/'+MY_ID)).remove();
setInterval(()=> set(ref(db,'online/'+MY_ID), { nick:myNick, ts:serverTimestamp() }), 20000);

onValue(ref(db,'players/'+MY_ID+'/balance'), snap=>{
  const v = snap.val();
  if(typeof v==='number'){ myBalance=v; localStorage.setItem('rub_balance',v); renderBalance(); }
});

/* ============ HOST: КТО ЗАПУСКАЕТ РАУНДЫ ============ */
// каждый клиент претендует. Кто взял lock и держит — тот хост.
const HOST_LOCK = ref(db,'host/lock');
let iAmHost = false;
let hostHeartbeat = null;

async function tryClaimHost(){
  try {
    const snap = await get(HOST_LOCK);
    const data = snap.val() || {};
    const now = Date.now();
    // если лок свободен или просрочен (>15 сек без обновления) — забираем
    if(!data.id || !data.ts || (now - data.ts) > 15000){
      await set(HOST_LOCK, { id: MY_ID, ts: now });
      iAmHost = true;
      setHostBadge(true);
      startHostLoop();
    } else if(data.id === MY_ID){
      iAmHost = true;
      setHostBadge(true);
    } else {
      iAmHost = false;
      setHostBadge(false);
    }
  } catch(e){ console.warn(e); }
}

function setHostBadge(v){
  document.getElementById('hostBadge').classList.toggle('show', v);
}

// хост держит свой lock живым
setInterval(async ()=>{
  if(iAmHost){
    await set(HOST_LOCK, { id: MY_ID, ts: Date.now() });
  } else {
    tryClaimHost();
  }
}, 5000);

tryClaimHost();

/* ============ ЛОГИКА ХОСТА (запуск раундов) ============ */
let hostRunning = false;
async function startHostLoop(){
  if(hostRunning) return;
  hostRunning = true;
  while(iAmHost){
    try {
      await runOneRound();
    } catch(e){ console.warn('host err', e); }
    // пауза после краха
    await sleep(3000);
  }
  hostRunning = false;
}

async function runOneRound(){
  const now = Date.now();
  const roundId = now;
  const crashAt = pickCrash();

  // waiting
  await set(ref(db,'game/current'), {
    roundId, phase:'waiting', crashAt, mult:1,
    waitStartAt: now, flyStartAt: 0, players:{}
  });

  // 10 сек приём
  await sleep(WAIT_SEC*1000);
  if(!iAmHost) return;

  const flyStartAt = Date.now();
  await update(ref(db,'game/current'), { phase:'flying', flyStartAt });

  // длительность полёта
  const flyMs = crashAt<=1.0001 ? 200 :
    Math.round(FLY_SEC * Math.log(crashAt) / Math.log(GROWTH) / 60 * 1000);

  const step = 200;
  const steps = Math.max(1, Math.floor(flyMs/step));
  for(let i=1;i<=steps;i++){
    if(!iAmHost) return;
    const t = i*step;
    const m = Math.pow(GROWTH, (t/1000)*60/FLY_SEC);
    if(m >= crashAt) break;
    await update(ref(db,'game/current'), { mult: m });
    await sleep(step);
  }

  // crash
  if(!iAmHost) return;
  await update(ref(db,'game/current'), { phase:'crashed', mult: crashAt });
  const histRef = ref(db,'history').push();
  await set(histRef, { crash: crashAt, ts: Date.now() });

  // чистим старую историю (>40 записей)
  try {
    const allSnap = await get(ref(db,'history'));
    const all = allSnap.val() || {};
    const keys = Object.keys(all);
    if(keys.length > 40){
      // оставим только последние 40 по ts
      const arr = keys.map(k=>({k, ts: all[k].ts||0})).sort((a,b)=>b.ts-a.ts);
      for(const item of arr.slice(40)) await ref(db,'history/'+item.k).remove();
    }
  } catch(e){}
}

/* ============ ПОДПИСКИ ============ */
onValue(ref(db,'game/current'), snap=>{
  const g = snap.val();
  if(!g){ 
    document.getElementById('roundState').textContent = 'Ждём сервер...';
    return;
  }
  handleRound(g);
});

onValue(ref(db,'game/current/players'), snap=>{
  S.players = snap.val() || {};
  renderPlayers();
});

onValue(ref(db,'history'), snap=>{
  const h = snap.val() || {};
  S.history = Object.values(h).sort((a,b)=>(b.ts||0)-(a.ts||0)).slice(0,15);
  renderHistory();
});

/* ============ ОБРАБОТКА РАУНДА НА КЛИЕНТЕ ============ */
let raf = null;
function handleRound(g){
  if(g.roundId !== S.lastRound){
    S.lastRound = g.roundId;
    S.myBet = 0;
    S.myCashed = false;
  }
  S.phase = g.phase;
  S.crashAt = g.crashAt || 2;
  S.waitStartAt = g.waitStartAt || 0;
  S.flyStartAt = g.flyStartAt || 0;

  if(raf) cancelAnimationFrame(raf);

  if(g.phase==='waiting') loopWaiting();
  else if(g.phase==='flying') loopFlying();
  else if(g.phase==='crashed') renderCrash();
}

function loopWaiting(){
  const total = WAIT_SEC*1000;
  const el = Date.now()-S.waitStartAt;
  const left = Math.max(0, total-el);
  const sec = Math.ceil(left/1000);
  document.getElementById('timerInner').innerHTML =
    `<div class="timer-num">${sec}</div><div class="timer-label">до старта</div>`;
  document.getElementById('timerProg').style.strokeDashoffset = (540*(1-left/total)).toString();
  const rs = document.getElementById('roundState');
  rs.textContent = 'Приём ставок';
  rs.style.background='rgba(250,204,21,.12)'; rs.style.color='#facc15';
  updateBetBtn();
  if(left>0) raf = requestAnimationFrame(loopWaiting);
}

function loopFlying(){
  const el = (Date.now()-S.flyStartAt)/1000;
  const m = Math.pow(GROWTH, el*60/FLY_SEC);
  S.mult = Math.min(m, S.crashAt);

  document.getElementById('timerInner').innerHTML =
    `<div class="timer-mult">${S.mult.toFixed(2)}x</div>`;
  document.getElementById('timerProg').style.strokeDashoffset = '0';

  // корова
  const wrap = document.querySelector('.game-area');
  const wW = wrap.offsetWidth, wH = wrap.offsetHeight;
  const t = Math.min(1, (S.mult-1)/Math.max(0.5,(S.crashAt-1)));
  const x = 20 + (wW-130)*t;
  const y = wH-140 - (wH-200)*t*0.7;
  const cow = document.getElementById('cow');
  cow.classList.add('flying');
  cow.style.transform = `translate(${x}px, ${y}px) rotate(-10deg)`;

  const rs = document.getElementById('roundState');
  rs.textContent = 'Полёт';
  rs.style.background='rgba(99,102,241,.15)'; rs.style.color='#818cf8';
  updateBetBtn();
  raf = requestAnimationFrame(loopFlying);
}

function renderCrash(){
  document.getElementById('timerInner').innerHTML =
    `<div class="timer-mult crashed">${S.crashAt.toFixed(2)}x</div><div class="timer-label" style="color:#f87171;margin-top:6px">КРАХ</div>`;
  const rs = document.getElementById('roundState');
  rs.textContent = 'Крах';
  rs.style.background='rgba(239,68,68,.15)'; rs.style.color='#f87171';

  const fl = document.getElementById('flash');
  fl.classList.remove('show'); void fl.offsetWidth; fl.classList.add('show');
  document.getElementById('cow').classList.remove('flying');

  if(S.myBet>0 && !S.myCashed){
    toast('💥 Крах на '+S.crashAt.toFixed(2)+'x — проигрыш '+S.myBet+' ₽','lose');
  }
  updateBetBtn();
}

/* ============ СТАВКА ============ */
function onBetClick(){
  if(S.phase==='waiting') placeBet();
  else if(S.phase==='flying' && S.myBet>0 && !S.myCashed) cashOut();
  else if(S.myBet>0 && S.myCashed) toast('Ты уже забрал в этом раунде','win');
}

async function placeBet(){
  const bet = parseInt(document.getElementById('betInput').value);
  if(isNaN(bet)||bet<1) return toast('Мин. 1 ₽','lose');
  if(bet>myBalance) return toast('Недостаточно средств','lose');
  if(S.myBet>0) return toast('Ставка уже сделана','lose');

  const balRef = ref(db,'players/'+MY_ID+'/balance');
  const res = await runTransaction(balRef, cur => {
    if((cur||0) < bet) return;
    return (cur||0) - bet;
  });
  if(!res.committed) return toast('Ошибка списания','lose');

  S.myBet = bet;
  S.myCashed = false;
  await update(ref(db,'game/current/players/'+MY_ID), {
    nick: myNick, bet, cashed:false, cashout:null,
    color: pickColor(MY_ID), ts: serverTimestamp()
  });
  toast('✅ Ставка '+bet+' ₽ принята','win');
  updateBetBtn();
}

async function cashOut(){
  if(S.myCashed||S.myBet<=0) return;
  const coef = S.mult;
  const win = Math.round(S.myBet*coef);
  S.myCashed = true;

  const balRef = ref(db,'players/'+MY_ID+'/balance');
  await runTransaction(balRef, cur => (cur||0)+win);
  await update(ref(db,'game/current/players/'+MY_ID), { cashed:true, cashout:coef });
  toast('💰 Забрал '+win+' ₽ на '+coef.toFixed(2)+'x','win');
  updateBetBtn();
}

/* ============ КНОПКА ============ */
function updateBetBtn(){
  const b = document.getElementById('betBtn');
  if(S.phase==='waiting'){
    if(S.myBet>0){ b.textContent = 'Ставка '+S.myBet+' ₽ принята'; b.className='bet-btn waiting'; b.disabled=true; }
    else { b.textContent = 'Сделать ставку'; b.className='bet-btn'; b.disabled=false; }
  } else if(S.phase==='flying'){
    if(S.myBet>0 && !S.myCashed){
      const win = Math.round(S.myBet*S.mult);
      b.textContent = `Забрать ${win} ₽ (${S.mult.toFixed(2)}x)`;
      b.className='bet-btn cash'; b.disabled=false;
    } else if(S.myCashed){
      b.textContent = '✅ Забрано'; b.className='bet-btn waiting'; b.disabled=true;
    } else {
      b.textContent = 'Ждём раунд...'; b.className='bet-btn waiting'; b.disabled=true;
    }
  } else {
    b.textContent = 'Ждём следующий раунд...'; b.className='bet-btn waiting'; b.disabled=true;
  }
}

/* ============ РЕНДЕР ============ */
function renderBalance(){ document.getElementById('balance').textContent = Math.round(myBalance).toLocaleString('ru'); }

function renderHistory(){
  const bar = document.getElementById('histBar');
  bar.innerHTML = '<button class="icon-btn">🔊</button>';
  S.history.forEach(h=>{
    const v = h.crash||1;
    const el = document.createElement('span');
    el.className = 'hx '+(v<1.5?'red':v<3?'blue':'green');
    el.textContent = v.toFixed(2)+'x';
    bar.appendChild(el);
  });
}

function renderPlayers(){
  const list = document.getElementById('playersList');
  const ids = Object.keys(S.players);
  document.getElementById('pCount').textContent = ids.length;
  let bank = 0; ids.forEach(id=> bank += S.players[id].bet||0);
  document.getElementById('pBank').textContent = bank.toLocaleString('ru');

  if(ids.length===0){
    list.innerHTML = '<div style="text-align:center;color:#7c88a3;padding:20px;font-size:13px">Пока никто не поставил</div>';
    return;
  }

  ids.sort((a,b)=>{
    const A=S.players[a], B=S.players[b];
    if(!!A.cashed !== !!B.cashed) return A.cashed?1:-1;
    return (B.bet||0)-(A.bet||0);
  });

  list.innerHTML = ids.map(id=>{
    const p = S.players[id];
    const isMe = id===MY_ID;
    const cls = isMe?'me':(p.cashed?'win':(S.phase==='crashed'?'lose':''));
    const initials = (p.nick||'?').slice(0,2).toUpperCase();
    const color = p.color || pickColor(id);
    let right = '';
    if(p.cashed){
      const win = Math.round(p.bet*p.cashout);
      right = `<span class="player-coef">${p.cashout.toFixed(2)}x +${win}₽</span>`;
    } else if(S.phase==='crashed'){
      right = `<span class="player-coef lost">−${p.bet}₽</span>`;
    } else {
      right = `<span class="player-coef waiting">в игре</span>`;
    }
    return `<div class="player-row ${cls}">
      <div class="player-avatar" style="background:${color}">${initials}</div>
      <div class="player-info">
        <div class="player-name">${esc(p.nick||'Игрок')}${isMe?' <span style="color:#818cf8;font-size:11px">(ты)</span>':''}</div>
        <div class="player-bet">${p.bet} ₽</div>
      </div>
      ${right}
    </div>`;
  }).join('');
}

function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pickColor(id){
  const c=['#6366f1','#8b5cf6','#ec4899','#f97316','#f59e0b','#10b981','#14b8a6','#06b6d4','#3b82f6','#ef4444'];
  let h=0; for(let i=0;i<id.length;i++) h=(h*31+id.charCodeAt(i))>>>0;
  return c[h%c.length];
}

/* ============ УПРАВЛЕНИЕ СТАВКОЙ ============ */
function adjustBet(d){ const i=document.getElementById('betInput'); i.value=Math.max(1,(parseInt(i.value)||0)+d); }
function setBet(v){ const i=document.getElementById('betInput'); if(v==='max') i.value=Math.max(1,Math.floor(myBalance)); else i.value=v; }

/* ============ МОДАЛКА ============ */
function openModal(){
  document.getElementById('nickInput').value = myNick;
  document.getElementById('balInput').value = Math.floor(myBalance);
  document.getElementById('modal').classList.add('show');
}
function saveProfile(){
  const n = document.getElementById('nickInput').value.trim().slice(0,16);
  const b = parseInt(document.getElementById('balInput').value);
  if(n) myNick = n;
  if(!isNaN(b) && b>=0) myBalance = b;
  localStorage.setItem('rub_nick', myNick);
  localStorage.setItem('rub_balance', myBalance);
  set(ref(db,'players/'+MY_ID), { nick:myNick, balance:myBalance, ts:serverTimestamp() });
  renderBalance();
  document.getElementById('modal').classList.remove('show');
  toast('✅ Сохранено','win');
}

/* ============ TOAST ============ */
let tt=null;
function toast(msg,type=''){
  const t = document.getElementById('toast');
  t.textContent=msg; t.className='toast show '+type;
  clearTimeout(tt); tt=setTimeout(()=>{t.className='toast '+type},2200);
}

/* ============ ЗВЁЗДЫ ============ */
(function(){
  const box = document.getElementById('stars');
  for(let i=0;i<40;i++){
    const s=document.createElement('div'); s.className='star';
    const sz=Math.random()*2+1;
    s.style.width=s.style.height=sz+'px';
    s.style.left=Math.random()*100+'%';
    s.style.top=Math.random()*100+'%';
    s.style.animationDelay=(Math.random()*3)+'s';
    box.appendChild(s);
  }
})();

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

renderBalance();
updateBetBtn();
</script>
</body>
