<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🏎️ F1 3D Racing</title>
<style>
  body { margin: 0; overflow: hidden; background: #87CEEB; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas { display: block; }
  
  /* UI */
  #ui { position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
  .top-bar { display: flex; justify-content: space-between; padding: 20px; color: white; font-weight: 900; font-size: 24px; text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000; }
  .panel { background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 10px; border: 2px solid rgba(255,255,255,0.3); backdrop-filter: blur(5px); }
  .controls { display: flex; justify-content: space-between; padding: 30px; pointer-events: auto; }
  .ctrl-btn { width: 80px; height: 80px; background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.5); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 36px; color: white; margin: 0 10px; backdrop-filter: blur(5px); box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
  .ctrl-btn:active { background: rgba(255,255,255,0.5); transform: scale(0.95); }
  
  /* Меню */
  #menu { position: absolute; inset: 0; background: linear-gradient(135deg, rgba(0,0,0,0.9), rgba(20,30,50,0.9)); display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; z-index: 100; pointer-events: auto; }
  h1 { font-size: 50px; margin-bottom: 10px; font-style: italic; background: linear-gradient(45deg, #ff0000, #ffd700); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 20px rgba(255,0,0,0.5); }
  .btn { padding: 15px 50px; font-size: 24px; font-weight: 900; background: #e10600; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 20px; box-shadow: 0 6px 15px rgba(225,6,0,0.5); text-transform: uppercase; letter-spacing: 2px; }
  .btn:hover { background: #ff1a1a; }
</style>
</head>
<body>

<div id="menu">
  <h1>F1 RACING 3D</h1>
  <p style="opacity: 0.7; font-size: 18px;">Готов к гонке?</p>
  <button class="btn" id="btn-start">Старт</button>
</div>

<div id="ui" style="display:none;">
  <div class="top-bar">
    <div class="panel">LAP: <span id="ui-lap">1/3</span></div>
    <div class="panel" style="color:#00ff00;">SPD: <span id="ui-speed">0</span> KM/H</div>
    <div class="panel">TIME: <span id="ui-time">0:00.00</span></div>
  </div>
  <div class="controls">
    <div style="display:flex;">
      <div class="ctrl-btn" id="btn-left">◀</div>
      <div class="ctrl-btn" id="btn-right">▶</div>
    </div>
    <div style="display:flex;">
      <div class="ctrl-btn" id="btn-brake" style="background:rgba(255,0,0,0.3); font-size:24px;">STOP</div>
      <div class="ctrl-btn" id="btn-gas" style="background:rgba(0,255,0,0.3);">▲</div>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';

// ==========================================
// 1. НАСТРОЙКА THREE.JS
// ==========================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.Fog(0x87CEEB, 100, 400);

const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// Свет
const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
scene.add(hemiLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
dirLight.position.set(100, 200, 100);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 2048;
dirLight.shadow.mapSize.height = 2048;
dirLight.shadow.camera.near = 0.5;
dirLight.shadow.camera.far = 500;
dirLight.shadow.camera.left = -150;
dirLight.shadow.camera.right = 150;
dirLight.shadow.camera.top = 150;
dirLight.shadow.camera.bottom = -150;
scene.add(dirLight);

// ==========================================
// 2. ФИЗИКА (CANNON-ES)
// ==========================================
const world = new CANNON.World({
  gravity: new CANNON.Vec3(0, -9.81, 0),
});
world.defaultContactMaterial.friction = 0.1;

// Материал земли (сцепление)
const groundMaterial = new CANNON.Material('ground');
const carMaterial = new CANNON.Material('car');

const contactMat = new CANNON.ContactMaterial(
  groundMaterial,
  carMaterial,
  { friction: 0.5, restitution: 0.1 }
);
world.addContactMaterial(contactMat);

// Плоскость земли
const groundBody = new CANNON.Body({
  type: CANNON.Body.STATIC,
  shape: new CANNON.Plane(),
  material: groundMaterial,
});
groundBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
world.addBody(groundBody);

// ==========================================
// 3. ГЕНЕРАЦИЯ ТРАССЫ
// ==========================================
// Красивая плавная трасса (очки в 3D)
const trackPoints = [
  new THREE.Vector3(0, 0, 0),
  new THREE.Vector3(100, 0, 0),
  new THREE.Vector3(150, 0, -100),
  new THREE.Vector3(100, 0, -200),
  new THREE.Vector3(-50, 0, -200),
  new THREE.Vector3(-100, 0, -100),
  new THREE.Vector3(-50, 0, 0)
];
const trackCurve = new THREE.CatmullRomCurve3(trackPoints, true, 'catmullrom', 0.5);
const TRACK_WIDTH = 20;

// Земля
const groundGeo = new THREE.PlaneGeometry(1000, 1000);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x2d6a29, roughness: 1 });
const groundMesh = new THREE.Mesh(groundGeo, groundMat);
groundMesh.rotation.x = -Math.PI / 2;
groundMesh.receiveShadow = true;
scene.add(groundMesh);

// Асфальт (строим ленту)
const roadPositions = [];
const roadIndices = [];
const roadNormals = [];
const divisions = 400;

for (let i = 0; i <= divisions; i++) {
  const t = i / divisions;
  const pt = trackCurve.getPointAt(t);
  const tan = trackCurve.getTangentAt(t);
  const norm = new THREE.Vector3(-tan.z, 0, tan.x).normalize();

  const left = pt.clone().addScaledVector(norm, -TRACK_WIDTH/2);
  const right = pt.clone().addScaledVector(norm, TRACK_WIDTH/2);

  roadPositions.push(left.x, 0.02, left.z);
  roadPositions.push(right.x, 0.02, right.z);
  roadNormals.push(0, 1, 0, 0, 1, 0);

  if (i < divisions) {
    const idx = i * 2;
    roadIndices.push(idx, idx + 1, idx + 2);
    roadIndices.push(idx + 1, idx + 3, idx + 2);
  }
}

const roadGeo = new THREE.BufferGeometry();
roadGeo.setAttribute('position', new THREE.Float32BufferAttribute(roadPositions, 3));
roadGeo.setAttribute('normal', new THREE.Float32BufferAttribute(roadNormals, 3));
roadGeo.setIndex(roadIndices);
const roadMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.9 });
const roadMesh = new THREE.Mesh(roadGeo, roadMat);
roadMesh.receiveShadow = true;
scene.add(roadMesh);

// Разметка по центру
const lineMat = new THREE.LineDashedMaterial({ color: 0xffffff, dashSize: 3, gapSize: 3 });
const lineGeo = new THREE.BufferGeometry().setFromPoints(trackCurve.getSpacedPoints(200));
const centerLine = new THREE.Line(lineGeo, lineMat);
centerLine.computeLineDistances();
centerLine.position.y = 0.05;
scene.add(centerLine);

// ==========================================
// 4. МОДЕЛЬ БОЛИДА F1
// ==========================================
function createF1Car(colorHex, isPlayer) {
  const carGroup = new THREE.Group();
  
  // Материалы
  const bodyMat = new THREE.MeshStandardMaterial({ color: colorHex, metalness: 0.6, roughness: 0.2 });
  const carbonMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });
  const tireMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 1 });
  const rimMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.9, roughness: 0.1 });

  // Основное шасси (нос)
  const noseGeo = new THREE.BoxGeometry(0.8, 0.6, 3);
  const nose = new THREE.Mesh(noseGeo, bodyMat);
  nose.position.set(0, 0.5, 1.5);
  nose.castShadow = true;
  carGroup.add(nose);

  // Кокпит (кабина)
  const cockpitGeo = new THREE.BoxGeometry(1.2, 0.8, 1.5);
  const cockpit = new THREE.Mesh(cockpitGeo, bodyMat);
  cockpit.position.set(0, 0.6, -0.5);
  cockpit.castShadow = true;
  carGroup.add(cockpit);

  // Шлем пилота
  const helmetMat = new THREE.MeshStandardMaterial({ color: isPlayer ? 0xffd700 : 0xffffff, metalness: 0.3 });
  const helmet = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 16), helmetMat);
  helmet.position.set(0, 1.1, -0.3);
  helmet.castShadow = true;
  carGroup.add(helmet);

  // Боковые понтоны (радиаторы)
  const sideGeo = new THREE.BoxGeometry(0.6, 0.5, 2);
  const sideL = new THREE.Mesh(sideGeo, bodyMat);
  sideL.position.set(-0.9, 0.4, -0.5);
  sideL.castShadow = true;
  carGroup.add(sideL);
  
  const sideR = sideL.clone();
  sideR.position.x = 0.9;
  carGroup.add(sideR);

  // Заднее антикрыло
  const rearWingGeo = new THREE.BoxGeometry(2.2, 0.15, 0.5);
  const rearWing = new THREE.Mesh(rearWingGeo, carbonMat);
  rearWing.position.set(0, 1.2, -2.2);
  rearWing.castShadow = true;
  carGroup.add(rearWing);
  
  // Стойки крыла
  const wingStandGeo = new THREE.BoxGeometry(0.1, 0.8, 0.1);
  const wingStandL = new THREE.Mesh(wingStandGeo, carbonMat);
  wingStandL.position.set(-0.8, 0.8, -2.2);
  carGroup.add(wingStandL);
  const wingStandR = wingStandL.clone();
  wingStandR.position.x = 0.8;
  carGroup.add(wingStandR);

  // Переднее антикрыло
  const frontWingGeo = new THREE.BoxGeometry(2.0, 0.1, 0.6);
  const frontWing = new THREE.Mesh(frontWingGeo, carbonMat);
  frontWing.position.set(0, 0.2, 2.8);
  carGroup.add(frontWing);

  // Колеса
  const wheelGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.6, 24);
  wheelGeo.rotateZ(Math.PI / 2); // Поворачиваем цилиндр горизонтально
  
  const wheels = [];
  const wheelPositions = [
    [-1.2, 0.5, 1.8], [1.2, 0.5, 1.8],   // Передние
    [-1.2, 0.5, -1.5], [1.2, 0.5, -1.5]  // Задние
  ];

  wheelPositions.forEach(pos => {
    const wheel = new THREE.Group();
    
    // Покрышка
    const tire = new THREE.Mesh(wheelGeo, tireMat);
    tire.castShadow = true;
    wheel.add(tire);
    
    // Диск
    const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.65, 12).rotateZ(Math.PI/2), rimMat);
    wheel.add(rim);

    wheel.position.set(...pos);
    carGroup.add(wheel);
    wheels.push(wheel);
  });

  carGroup.userData = { wheels };
  return carGroup;
}

// ==========================================
// 5. СОЗДАНИЕ МАШИНЫ ИГРОКА
// ==========================================
const startPos = trackCurve.getPointAt(0);
const startTan = trackCurve.getTangentAt(0);
const startAngle = Math.atan2(startTan.x, startTan.z);

const carBody = new CANNON.Body({
  mass: 150,
  shape: new CANNON.Box(new CANNON.Vec3(1, 0.5, 2.5)), // Хитбокс
  position: new CANNON.Vec3(startPos.x, 1, startPos.z),
  material: carMaterial,
  linearDamping: 0.5,
  angularDamping: 0.5,
});
world.addBody(carBody);

const carMesh = createF1Car(0xff0000, true);
scene.add(carMesh);

// ==========================================
// 6. ОКРУЖЕНИЕ (Трибуны, деревья)
// ==========================================
// Трибуны
const standGeo = new THREE.BoxGeometry(40, 10, 15);
const standMat = new THREE.MeshStandardMaterial({ color: 0xcccccc });
for (let i = 0; i < 6; i++) {
  const t = i / 6;
  const pt = trackCurve.getPointAt(t);
  const tan = trackCurve.getTangentAt(t);
  const norm = new THREE.Vector3(-tan.z, 0, tan.x);
  
  const pos = pt.clone().addScaledVector(norm, 25);
  const stand = new THREE.Mesh(standGeo, standMat);
  stand.position.set(pos.x, 5, pos.z);
  stand.lookAt(pt);
  stand.castShadow = true;
  stand.receiveShadow = true;
  scene.add(stand);
  
  // Болельщики (разноцветные точки)
  for(let j=0; j<100; j++) {
    const fanGeo = new THREE.BoxGeometry(0.5, 1, 0.5);
    const fanMat = new THREE.MeshBasicMaterial({ color: Math.random() * 0xffffff });
    const fan = new THREE.Mesh(fanGeo, fanMat);
    const fanPos = pos.clone().addScaledVector(tan, Math.random()*30 - 15);
    fanPos.y = 1 + Math.random() * 8;
    fan.position.copy(fanPos);
    scene.add(fan);
  }
}

// Деревья
const treeGeo = new THREE.ConeGeometry(3, 10, 8);
const treeMat = new THREE.MeshStandardMaterial({ color: 0x1e5631 });
for (let i = 0; i < 150; i++) {
  const x = (Math.random() - 0.5) * 600;
  const z = (Math.random() - 0.5) * 600;
  
  // Не ставим на трассу
  let onTrack = false;
  for (let t = 0; t < 1; t += 0.05) {
    const p = trackCurve.getPointAt(t);
    if (Math.hypot(p.x - x, p.z - z) < 30) { onTrack = true; break; }
  }
  if (onTrack) continue;

  const tree = new THREE.Mesh(treeGeo, treeMat);
  tree.position.set(x, 5, z);
  tree.castShadow = true;
  scene.add(tree);
}

// ==========================================
// 7. УПРАВЛЕНИЕ И ЦИКЛ
// ==========================================
const keys = {};
window.addEventListener('keydown', e => keys[e.key] = true);
window.addEventListener('keyup', e => keys[e.key] = false);

// Тач
const touchState = { left: false, right: false, gas: false, brake: false };
const bindBtn = (id, prop) => {
  const el = document.getElementById(id);
  el.addEventListener('touchstart', e => { e.preventDefault(); touchState[prop] = true; });
  el.addEventListener('touchend', e => { e.preventDefault(); touchState[prop] = false; });
  el.addEventListener('mousedown', () => touchState[prop] = true);
  el.addEventListener('mouseup', () => touchState[prop] = false);
};
bindBtn('btn-left', 'left');
bindBtn('btn-right', 'right');
bindBtn('btn-gas', 'gas');
bindBtn('btn-brake', 'brake');

let raceTime = 0;
let lastTime = performance.now();
const clock = new THREE.Clock();

function updatePhysics(dt) {
  const forward = new CANNON.Vec3(0, 0, -1);
  carBody.quaternion.vmult(forward, forward);

  const speed = carBody.velocity.length();
  
  // Газ
  if (keys['ArrowUp'] || keys['w'] || touchState.gas) {
    if (speed < 40) {
      carBody.applyForce(forward.scale(2000), carBody.position);
    }
  }
  
  // Тормоз / Задний ход
  if (keys['ArrowDown'] || keys['s'] || touchState.brake) {
    if (speed > 1) {
      carBody.applyForce(forward.scale(-3000), carBody.position);
    } else {
      carBody.applyForce(forward.scale(-1000), carBody.position);
    }
  }

  // Руль
  const steerSpeed = 2.5;
  if (keys['ArrowLeft'] || keys['a'] || touchState.left) {
    carBody.angularVelocity.y = steerSpeed * (speed / 20 + 0.5);
  } else if (keys['ArrowRight'] || keys['d'] || touchState.right) {
    carBody.angularVelocity.y = -steerSpeed * (speed / 20 + 0.5);
  }

  // Обновление мира физики
  world.step(1 / 60, dt, 3);

  // Синхронизация 3D-модели и физики
  carMesh.position.copy(carBody.position);
  carMesh.quaternion.copy(carBody.quaternion);

  // Вращение колес
  carMesh.userData.wheels.forEach(w => {
    w.rotation.x += speed * dt * 2;
    // Поворот передних колес
    if (w.position.z > 0) {
      if (keys['ArrowLeft'] || keys['a'] || touchState.left) w.rotation.y = 0.5;
      else if (keys['ArrowRight'] || keys['d'] || touchState.right) w.rotation.y = -0.5;
      else w.rotation.y = 0;
    }
  });

  // Обновление камеры (следим за машиной)
  const camOffset = new THREE.Vector3(0, 8, 15);
  camOffset.applyQuaternion(carMesh.quaternion);
  const targetCamPos = carMesh.position.clone().add(camOffset);
  
  camera.position.lerp(targetCamPos, 0.1);
  
  const lookAtTarget = carMesh.position.clone();
  lookAtTarget.y += 2;
  camera.lookAt(lookAtTarget);

  // HUD
  document.getElementById('ui-speed').textContent = Math.floor(speed * 3.6 * 2);
}

function animate() {
  requestAnimationFrame(animate);
  
  const dt = clock.getDelta();
  if (document.getElementById('ui').style.display !== 'none') {
    raceTime += dt;
    document.getElementById('ui-time').textContent = fmtTime(raceTime);
    updatePhysics(dt);
  }
  
  renderer.render(scene, camera);
}

function fmtTime(t) {
  const m = Math.floor(t / 60);
  const s = t % 60;
  return m + ':' + s.toFixed(2).padStart(5, '0');
}

// Старт игры
document.getElementById('btn-start').addEventListener('click', () => {
  document.getElementById('menu').style.display = 'none';
  document.getElementById('ui').style.display = 'flex';
});

animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
