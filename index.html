am(d){am=d.v;$('#tL').className=am==='login'?'on':'';$('#tR').className=am==='reg'?'on':'';$('#pi2').style.display=am==='reg'?'block':'none';$('#sb').textContent=am==='reg'?'Зарегистрироваться':'Войти';$('#amsg').className='amsg'},
submit,
tab(d){go(d.v)},dep:deposit,mode(d){MODE=d.v;renderTop();renderList()},spf(d){SPF=d.v;renderTop();renderList()},soon(){SOON=!SOON;renderTop();renderList()},favf(){FAVF=!FAVF;renderTop();renderList()},
theme(){const t=THEMES[(THEMES.indexOf(localStorage.getItem('betapp_theme')||'light')+1)%5];applyTheme(t);toast('Тема: '+t)},settheme(d){applyTheme(d.v);$('#pg').innerHTML=profH()},
hsp(d){HSP=d.v;go('home')},hlive(){MODE='live';SPF='all';go('sport')},
lg(d){COLL.has(d.k)?COLL.delete(d.k):COLL.add(d.k);renderList()},
open(d){openMatch(d.ek)},back(){CE=null;$('#mp').className='full';refresh()},
nx(){const e=getEv(CE),l=evs().filter(x=>x.lg===e.lg),i=l.findIndex(x=>x.k===CE);if(l.length>1)openMatch(l[(i+1)%l.length].k)},
mtab(d){MT=d.v;MST=0;mpTick()},srch(){MSO=!MSO;mpTick(1);if(MSO&&$('#msq'))$('#msq').focus()},stat(){MST=!MST;mpTick()},bmf(){MBO=!MBO;mpTick()},
mk(d){const c=COL[d.id]!==undefined?COL[d.id]:d.d==='0';COL[d.id]=!c;mpTick()},
bm(d,el,ev){ev.stopPropagation();BM.has(d.t)?BM.delete(d.t):BM.add(d.t);U.bm=[...BM];saveDB();mpTick()},
line(d){TL[d.k]=parseFloat(d.v);mpTick()},bell(){toast('🔔 Уведомления включены')},
favm(){FAV.has(CE)?FAV.delete(CE):FAV.add(CE);U.favs=[...FAV];saveDB();mpTick(1)},
odd(d){const e=getEv(d.ek);if(!e)return;const st=state(e),r=lockR(e,st);if(r)return toast('⏸ '+r,0);const i=SLP.findIndex(b=>b.ek===d.ek&&b.key===d.key);
 if(i>=0)SLP.splice(i,1);else{const ng=d.key.includes('|ng|'),p=price(e,st,d.key);if(!p.o)return toast('Исход закрыт',0);const g=grp(e,d.key);for(let j=SLP.length-1;j>=0;j--)if(SLP[j].ek===d.ek&&grp(e,SLP[j].key)===g)SLP.splice(j,1);
  SLP.push({ek:d.ek,key:d.key,odds:p.o,ng0:ng?st.sc[0]+st.sc[1]:undefined,h:e.h,a:e.a,lg:e.lg,sp:e.sp,lab:lbl(e,d.key)})}refresh()},
slipopen:slipOpen,slipclose(){$('#slip').classList.remove('on')},rm(d){SLP.splice(+d.i,1);refresh()},smode(d){SM=d.v;slipTick()},q(d){$('#stk').value=d.v;STK=+d.v;slipTick()},usefb(){FBU=!FBU;slipTick()},place,
co(d){const b=H.find(x=>x.id==d.id);if(!b||b.status!=='pending')return;const v=cashVal(b);if(!v)return toast('Кэшаут недоступен',0);if(!confirm('Забрать '+money(v)+' вместо '+money(b.pot)+'?'))return;
 b.status='cashout';b.paid=v;bal(Math.max(0,v-(b.fb||0)));toast('💸 Кэшаут +'+money(v));$('#pg').innerHTML=profH()},
fab:openSearch,srclose(){$('#sr').className='full'},srgo(d){$('#sr').className='full';openMatch(d.ek)},
logout(){if(!confirm('Выйти?'))return;localStorage.removeItem('betapp_current');location.reload()},
spin,resclose(){$('#res').className='';const w=$('#wheel');if(w){w.style.transition='none';w.style.transform='rotate(0)';setTimeout(()=>w.style.transition='transform 5s cubic-bezier(.17,.67,.15,1)',50)}},
game(d){openGame(d.v)},gclose,
dpick(d){dPick=+d.v;gr()},dplay(){if(!canG()||!dPick)return;const s=gStake();if(!s)return;bal(-s);const roll=Math.floor(Math.random()*6)+1;let t=0;const iv=setInterval(()=>{const x=$('#dd');if(x)x.textContent=['⚀','⚁','⚂','⚃','⚄','⚅'][Math.floor(Math.random()*6)];if(++t>=8){clearInterval(iv);if($('#dd'))$('#dd').textContent='🎲 '+roll;if(roll===dPick){bal(s*5);toast('🎉 Угадал! +'+money(s*5))}else toast('😔 Выпало '+roll,0);dPick=null;setTimeout(()=>{if(G==='dice')gr()},1200)}},150)},
cpick(d){cPick=d.v;gr()},cplay(){if(!canG()||!cPick)return;const s=gStake();if(!s)return;bal(-s);const r=Math.random()<.5?'h':'t';let t=0;const iv=setInterval(()=>{const x=$('#cd2');if(x)x.textContent=t%2?'🦅':'🪙';if(++t>=10){clearInterval(iv);if($('#cd2'))$('#cd2').textContent=r==='h'?'🦅':'🪙';if(r===cPick){bal(s*2);toast('🎉 Угадал! +'+money(s*2))}else toast('😔 Не угадал',0);cPick=null;setTimeout(()=>{if(G==='coin')gr()},1200)}},120)},
bjs(){if(!canG())return;const s=gStake();if(!s)return;bal(-s);const k=cdk();bj={k,p:[k.pop(),k.pop()],d:[k.pop(),k.pop()],hid:1,s,fin:0};if(hv(bj.p)===21)bjStand();else gr()},
bjh(){bj.p.push(bj.k.pop());const v=hv(bj.p);if(v>21)bjEnd('l');else if(v===21)bjStand();else gr()},bjt:bjStand,bjr(){bj=null;gr()},
crs(){if(!canG())return;const s=gStake();if(!s)return;bal(-s);const cp=Math.min(50,Math.max(1.01,.97/(1-Math.random())));cr={on:1,s,m:1,cp,crashed:0,f:1};gr();
 cr.t=setInterval(()=>{cr.m*=1.012+cr.m*.0012;if(cr.m>=cr.cp){cr.m=cr.cp;clearInterval(cr.t);cr.on=0;cr.crashed=1;cr.f=cr.m;toast('💥 Краш на '+cr.f.toFixed(2)+'×',0);gr();return}
  if($('#crd'))$('#crd').textContent=cr.m.toFixed(2)+'×';if($('#crb'))$('#crb').textContent='💰 ЗАБРАТЬ '+money(cr.s*cr.m)},80)},
cro(){if(!cr||!cr.on)return;clearInterval(cr.t);cr.on=0;cr.f=cr.m;bal(cr.s*cr.m);toast('💰 Забрали '+money(cr.s*cr.m));gr()},crr(){cr=null;gr()}};
document.addEventListener('click',ev=>{if(ev.target.id==='slip')return ACT.slipclose();const el=ev.target.closest('[data-act]');if(!el)return;const f=ACT[el.dataset.act];if(f)f(el.dataset,el,ev)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&$('#auth').style.display!=='none')submit()});

/* ================= ЦИКЛ: проверка каждую секунду ================= */
setInterval(()=>{if(!U)return;sec++;PRC={};SCC={};
 if(page==='sport'||page==='home')renderList();if(CE)mpTick();slipTick();settleAll();goalWatch();hdr();
 document.querySelectorAll('[data-cob]').forEach(el=>{const b=H.find(x=>x.id==el.dataset.cob);if(!b)return;const v=cashVal(b);el.style.display=v?'':'none';if(v)el.querySelector('span').textContent=money(v)});
 if(page==='roul')roulUpd()},1000);
if(cur&&DB[cur])login(cur);
