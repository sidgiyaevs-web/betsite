<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1a1c2e">
<title>⚡ OpenBet</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
input{outline:none}
:root{--bg:#f4f5f8;--card:#fff;--border:#e8eaf0;--border-2:#dfe2ea;--text:#0d0e1c;--text-2:#4a4d63;--muted:#878a9e;--accent:#e60023;--green:#00a854;--gold:#f0b400;--header:#1a1c2e;--odd:#f0f2f6;--odd-hover:#e5e8ef}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.coupon-open{overflow:hidden}
.top-header{position:sticky;top:0;z-index:100;background:var(--header);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:60px}
.top-header .title{font-size:22px;font-weight:800;letter-spacing:-.4px}
.top-header .title.center{flex:1;text-align:center}
.top-header .action-btn{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;transition:background .15s}
.top-header .action-btn:hover{background:rgba(255,255,255,.18)}
.top-header .action-btn.with-dot{position:relative}
.top-header .action-btn.with-dot::after{content:'';position:absolute;top:6px;right:6px;width:8px;height:8px;background:var(--accent);border-radius:50%;border:1.5px solid var(--header)}
.top-header .back-btn{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;transition:background .15s}
.sport-tabs{background:#fff;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;position:sticky;top:60px;z-index:99}
.sport-tabs::-webkit-scrollbar{display:none}
.sport-tabs-inner{display:flex;padding:0 8px;min-width:max-content}
.sport-tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 18px;font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px;transition:color .15s}
.sport-tab.active{color:var(--text);border-bottom-color:var(--accent)}
.sport-tab .icon{font-size:22px;line-height:1}
.sport-tab .count{font-size:10px;font-weight:500}
.sport-tab.active .count{color:var(--accent)}
.filter-row{background:#fff;padding:12px 16px;display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--border)}
.filter-row::-webkit-scrollbar{display:none}
.filter-chip{padding:8px 16px;border-radius:20px;background:#f0f2f6;font-size:13px;font-weight:600;color:var(--text-2);white-space:nowrap;display:flex;align-items:center;gap:6px}
.filter-chip.active{background:var(--accent);color:#fff}
.filter-chip .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.filter-chip.active .dot{background:#fff}
.main{padding-bottom:80px}
.league-block{background:#fff;margin-bottom:8px}
.league-head{background:#eef0f5;padding:10px 16px;display:flex;align-items:center;gap:10px}
.league-head .league-icon{width:26px;height:26px;border-radius:4px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:14px}
.league-head .league-name{font-size:13px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.league-head .league-filter{font-size:16px;color:var(--muted);padding:4px;background:none;cursor:pointer}
.match-row{display:grid;grid-template-columns:18px 1fr 60px 60px 60px;border-bottom:1px solid var(--border);background:#fff;cursor:pointer;position:relative;transition:background .12s}
.match-row:last-child{border-bottom:none}
.match-row:hover{background:#fafbfd}
.match-row .arrow{color:#c0c4d0;font-size:16px;display:flex;align-items:center;justify-content:center;padding-left:4px}
.match-row .teams{display:flex;flex-direction:column;gap:3px;min-width:0;padding:12px 8px 12px 4px;position:relative}
.match-row .team-line{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;overflow:hidden}
.match-row .team-line.loser{color:var(--text-2);font-weight:500}
.match-row .team-logo{width:18px;height:18px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;color:#fff}
.match-row .team-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.match-row .team-score{font-weight:800;font-size:14px;margin-left:auto;padding-left:6px;font-variant-numeric:tabular-nums}
.match-row .team-score.red{color:var(--accent)}
.match-row .time{font-size:11px;color:var(--muted);font-weight:500;padding-left:26px;margin-top:2px;display:flex;align-items:center;gap:4px}
.match-row .time.live{color:var(--green);font-weight:700}
.match-row .time.prematch{color:var(--text-2)}
.match-row .live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.match-row .cards-indicators{position:absolute;left:0;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:3px;padding-left:2px}
.match-row .ind-yellow{width:3px;height:14px;background:#ffc107;border-radius:1px}
.match-row .ind-red{width:3px;height:14px;background:var(--accent);border-radius:1px}
.odd-cell{display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;border-left:1px solid var(--border);cursor:pointer;min-height:60px;padding:8px 4px;transition:background .12s;font-variant-numeric:tabular-nums}
.odd-cell:hover{background:var(--odd-hover)}
.odd-cell.selected{background:var(--accent);color:#fff}
.odd-cell.disabled,.odd-cell.dash{color:#c0c4d0;cursor:default}
.odd-cell.dash:hover{background:transparent}
.show-all{display:block;margin:12px 16px;padding:14px;text-align:center;background:#fff;border-radius:12px;font-size:14px;font-weight:600;border:1px solid var(--border);width:calc(100% - 32px);cursor:pointer}
.show-all:hover{background:#fafbfd}
.match-header{padding:16px;background:linear-gradient(180deg,#3a3d52 0%,#282a3d 100%);color:#fff}
.match-header .crumbs{font-size:11px;color:rgba(255,255,255,.6);margin-bottom:6px}
.match-header .league-line{display:flex;justify-content:space-between;font-size:15px;font-weight:700;margin-bottom:14px}
.match-header .updown{background:rgba(255,255,255,.1);border-radius:6px;padding:6px 10px;font-size:13px}
.match-header .match-meta{display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.7);margin-bottom:12px}
.match-header .icons{display:flex;gap:14px;font-size:20px}
.match-header .score-line{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:6px 0}
.match-header .team-big{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700;min-width:0}
.match-header .team-big.right{flex-direction:row-reverse;text-align:right}
.match-header .team-big .logo{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;background:rgba(255,255,255,.15);flex-shrink:0;color:#fff}
.match-header .team-big .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.match-header .score-center{font-size:24px;font-weight:900;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:70px;font-variant-numeric:tabular-nums}
.match-header .score-center .timer{font-size:12px;color:rgba(255,255,255,.7);font-weight:600}
.match-header .score-center .timer.live{color:#00e676}
.match-header .half-scores{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.12);font-size:10px;color:rgba(255,255,255,.55);text-align:center}
.match-header .half-scores b{color:#fff;font-weight:800;font-size:14px;display:block;margin-top:2px;font-variant-numeric:tabular-nums}
.market-tabs{display:flex;background:#fff;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;position:sticky;top:60px;z-index:50}
.market-tabs::-webkit-scrollbar{display:none}
.market-tabs-inner{display:flex;padding:0 4px;min-width:max-content}
.market-tab{padding:14px 16px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;background:none}
.market-tab.active{color:var(--text);border-bottom-color:var(--text)}
.market-card{background:#fff;margin:8px 8px 0;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(20,20,40,.06)}
.market-card:last-child{margin-bottom:16px}
.market-head{display:flex;align-items:center;padding:14px 16px;cursor:pointer;user-select:none}
.market-head .star{font-size:16px;color:#c0c4d0;margin-right:8px;cursor:pointer}
.market-head .star.active{color:var(--gold)}
.market-head .title{font-size:15px;font-weight:700;flex:1}
.market-head .chevron{font-size:14px;color:var(--muted);transition:transform .2s}
.market-card.collapsed .chevron{transform:rotate(180deg)}
.market-card.collapsed .market-body{display:none}
.market-body{padding:0 12px 12px}
.odds-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.odds-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.odds-pair{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.odd-btn{background:var(--odd);border-radius:8px;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;font-weight:700;min-height:48px;text-align:left;transition:background .12s;cursor:pointer;color:var(--text)}
.odd-btn:hover:not(.disabled){background:var(--odd-hover)}
.odd-btn.selected{background:var(--accent);color:#fff}
.odd-btn .lbl{color:var(--muted);font-weight:600;font-size:13px;flex-shrink:0}
.odd-btn.selected .lbl{color:rgba(255,255,255,.85)}
.odd-btn .val{font-weight:800;font-size:15px;margin-left:auto;font-variant-numeric:tabular-nums}
.odd-btn.disabled{opacity:.35;cursor:not-allowed}
.odds-labeled{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px}
.odds-labeled .col-head{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;padding:0 4px;margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.line-selector{display:flex;gap:4px;padding:0 0 10px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--border);margin-bottom:10px}
.line-selector::-webkit-scrollbar{display:none}
.line-opt{padding:8px 14px;background:#f0f2f6;border-radius:8px;font-size:13px;font-weight:700;color:var(--text-2);white-space:nowrap;border:1.5px solid transparent;cursor:pointer}
.line-opt.active{background:#fff;color:var(--text);border-color:var(--text);font-weight:800}
.stat-params{display:flex;background:#fff;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;padding:0 8px}
.stat-params::-webkit-scrollbar{display:none}
.stat-param{padding:12px 14px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;background:none}
.stat-param.active{color:var(--text);border-bottom-color:var(--accent)}
.stat-counter{display:flex;justify-content:center;align-items:center;gap:16px;padding:16px;background:#f8f9fc;border-radius:12px;margin:8px;text-align:center}
.stat-counter .cnt-h,.stat-counter .cnt-a{font-size:26px;font-weight:900;min-width:40px;font-variant-numeric:tabular-nums}
.stat-counter .cnt-h{color:var(--accent)}
.stat-counter .lbl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.tab-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr);z-index:200;padding-bottom:env(safe-area-inset-bottom)}
.tab-bar-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 8px;font-size:10px;font-weight:600;color:var(--muted);position:relative;cursor:pointer;background:none;border:none}
.tab-bar-item.active{color:var(--text)}
.tab-bar-item .tab-icon{font-size:20px;line-height:1}
.tab-bar-item .badge{position:absolute;top:4px;right:calc(50% - 20px);min-width:18px;height:18px;background:var(--accent);color:#fff;border-radius:9px;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px;box-sizing:border-box}
.floating-coupon{position:fixed;bottom:70px;left:8px;right:8px;background:#fff;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 32px rgba(20,20,40,.14);z-index:190;cursor:pointer;border:1px solid var(--border);transition:transform .2s}
.floating-coupon:hover{transform:translateY(-2px)}
.floating-coupon .fc-icon{width:34px;height:34px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;flex-shrink:0}
.floating-coupon .fc-info{flex:1;min-width:0}
.floating-coupon .fc-match{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.floating-coupon .fc-pick{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.floating-coupon .fc-odd{font-size:18px;font-weight:900;flex-shrink:0;font-variant-numeric:tabular-nums}
.coupon-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;opacity:0;pointer-events:none;transition:opacity .3s}
.coupon-overlay.active{opacity:1;pointer-events:auto}
.coupon-panel{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:20px 20px 0 0;z-index:310;transform:translateY(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);max-height:88vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.coupon-panel.active{transform:translateY(0)}
.coupon-head{padding:18px 16px 8px;display:flex;align-items:center;gap:12px;position:relative}
.coupon-head .grab{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:36px;height:4px;background:#e0e2ea;border-radius:2px}
.coupon-head .settings{font-size:18px;color:var(--muted);width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.coupon-head .tabs{display:flex;gap:20px;flex:1;justify-content:center}
.coupon-head .ct{font-size:15px;font-weight:600;color:var(--muted);padding-bottom:8px;border-bottom:2px solid transparent;cursor:pointer;background:none}
.coupon-head .ct.active{color:var(--text);border-bottom-color:var(--accent)}
.coupon-head .close-btn{font-size:20px;color:var(--muted);width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:#f0f2f6;cursor:pointer}
.coupon-body{flex:1;overflow-y:auto;padding:8px 16px 16px}
.coupon-empty{padding:40px 20px;text-align:center;color:var(--muted)}
.coupon-empty .icon{font-size:48px;margin-bottom:12px;opacity:.4}
.coupon-empty .txt{font-size:14px;font-weight:600}
.coupon-item{background:#f8f9fc;border-radius:12px;padding:14px;margin-bottom:10px}
.coupon-item .ci-head{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:8px}
.coupon-item .ci-score{background:#dbeafe;color:#2563eb;font-weight:800;padding:2px 8px;border-radius:4px;font-size:11px}
.coupon-item .ci-league{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.coupon-item .ci-remove{font-size:22px;color:var(--muted);width:24px;height:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:none}
.coupon-item .ci-pick{font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.coupon-item .ci-odd{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.coupon-type{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.coupon-type .ct-btn{padding:10px 16px;background:#f0f2f6;border-radius:8px;font-size:14px;font-weight:700;color:var(--text-2);border:1.5px solid transparent;cursor:pointer}
.coupon-type .ct-btn.active{background:#fff;border-color:var(--text);color:var(--text)}
.coupon-type .swap{margin-left:auto;width:36px;height:36px;background:#f0f2f6;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer}
.coupon-stake{display:flex;align-items:stretch;background:#fff;border:1px solid var(--border-2);border-radius:12px;margin-bottom:8px;overflow:hidden}
.coupon-stake .stake-input{flex:1;padding:14px 16px;font-size:16px;font-weight:700;border:none;background:transparent;width:100%}
.coupon-stake .stake-input::placeholder{color:var(--muted);font-weight:500}
.coupon-stake .stake-right{display:flex;flex-direction:column;justify-content:center;align-items:flex-end;padding:8px 12px;border-left:1px solid var(--border);gap:2px}
.coupon-stake .balance-label{font-size:10px;color:var(--muted);font-weight:500}
.coupon-stake .balance-val{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.coupon-stake .add-btn{width:24px;height:24px;background:var(--accent);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;margin-top:2px;cursor:pointer}
.coupon-limits{display:flex;gap:8px;font-size:11px;color:var(--muted);margin-bottom:12px;padding:0 4px;align-items:center}
.coupon-limits .lmt{padding:6px 10px;background:#f0f2f6;border-radius:6px;font-weight:700;color:var(--text-2)}
.coupon-limits .lmt b{color:var(--text);font-weight:800}
.coupon-limits .settings-btn{margin-left:auto;width:32px;height:32px;background:#f0f2f6;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer}
.coupon-actions{display:flex;gap:10px;margin-bottom:8px}
.coupon-actions .potential{flex:1;background:#f8f9fc;border-radius:12px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);font-weight:600}
.coupon-actions .potential b{color:var(--text);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.coupon-place{width:100%;padding:16px;background:var(--accent);color:#fff;border-radius:12px;font-size:16px;font-weight:800;cursor:pointer;transition:background .15s}
.coupon-place:hover{background:#c50020}
.coupon-place:disabled{background:#e0e2ea;color:var(--muted);cursor:not-allowed}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-icon{font-size:56px;margin-bottom:16px;opacity:.4}
.empty-text{font-size:15px;font-weight:600}
.toast-container{position:fixed;top:80px;right:16px;z-index:2000;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:320px}
.toast{background:#1a1c2e;color:#fff;border-radius:12px;padding:14px 18px;font-size:13px;font-weight:600;box-shadow:0 8px 32px rgba(20,20,40,.2);animation:toastIn .3s;pointer-events:auto;display:flex;align-items:center;gap:10px}
.toast.win{background:#00a854}
.toast.lose{background:#e60023}
.toast.gold{background:#f0b400;color:#1a1c2e}
@keyframes toastIn{from{transform:translateX(120%);opacity:0}}
.menu-screen{padding:16px;background:#fff;min-height:calc(100vh - 60px)}
.menu-item{padding:18px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;cursor:pointer;font-size:15px;font-weight:600}
.menu-item:last-child{border-bottom:none}
.menu-item .mi-icon{font-size:22px;width:32px;text-align:center}
.menu-item .mi-arrow{margin-left:auto;color:var(--muted);font-size:16px}
.history-item{background:#fff;border-radius:12px;padding:14px 16px;margin:0 8px 8px;box-shadow:0 1px 3px rgba(20,20,40,.06);position:relative;overflow:hidden}
.history-item::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px}
.history-item.won::before{background:var(--green)}
.history-item.lost::before{background:var(--accent)}
.history-item.pending::before{background:var(--gold)}
.history-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px}
.history-match{font-weight:700;font-size:14px;line-height:1.3}
.history-meta{font-size:11.5px;color:var(--muted);margin-top:3px;font-weight:600}
.history-amount{font-weight:800;font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.history-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:10px;border-top:1px solid var(--border)}
.history-odd{font-size:12px;color:var(--muted);font-weight:600}
.history-odd b{color:var(--text);font-weight:800}

function uniquePair(pool) {
  var s = 0;
  while (s++ < 200) {
    var a = pick(pool), b = pick(pool);
    if (a.n === b.n) continue;
    var key = [a.n, b.n].sort().join('|');
    if (!STATE.usedPairs[key]) {

      return [a, b];
    }
  }
  return [pick(pool), pick(pool)];
}

function footballPhaseIntensity(m) {
  var phase = m.phase, intensity = 1.0, goalBoost = 1.0;
  if (phase === 'calm') { intensity = 0.35; goalBoost = 0.5; }
  else if (phase === 'pressure_home' || phase === 'pressure_away') { intensity = 1.7; goalBoost = 1.9; }
  else if (phase === 'chaos') { intensity = 2.6; goalBoost = 2.4; }
  else if (phase === 'endgame') { intensity = 2.1; goalBoost = 1.7; }
  intensity *= m.baseTempo;
  if (m.minute >= 75 && phase !== 'endgame') { intensity *= 1.4; goalBoost *= 1.35; }
  if (Math.abs(m.scoreHome - m.scoreAway) <= 1 && m.minute > 70) { intensity *= 1.5; goalBoost *= 1.4; }
  return { intensity: intensity, goalBoost: goalBoost };
}

function switchFootballPhase(m) {
  m.phaseSecLeft -= 1;
  if (m.phaseSecLeft > 0) return;
  var roll = Math.random();
  var newPhase;
  if (m.minute >= 80) { newPhase = 'endgame'; m.phaseSecLeft = 999; }
  else if (roll < 0.30) { newPhase = 'calm'; m.phaseSecLeft = 18 + rand(0, 25); }
  else if (roll < 0.55) { newPhase = 'pressure_home'; m.phaseSecLeft = 15 + rand(0, 20); }
  else if (roll < 0.80) { newPhase = 'pressure_away'; m.phaseSecLeft = 15 + rand(0, 20); }
  else { newPhase = 'chaos'; m.phaseSecLeft = 12 + rand(0, 15); }
  if (m.redHome) newPhase = 'pressure_away';
  if (m.redAway) newPhase = 'pressure_home';
  m.phase = newPhase;
  if (newPhase === 'calm') m.commentary = 'Игра успокоилась';
  else if (newPhase === 'pressure_home') m.commentary = '🔥 ' + m.home + ' давит';
  else if (newPhase === 'pressure_away') m.commentary = '🔥 ' + m.away + ' давит';
  else if (newPhase === 'chaos') m.commentary = '⚡ Открытый футбол';
  else if (newPhase === 'endgame') m.commentary = '⏱ Финальный штурм';
}

function footballLambda(m, side) {
  var base = side === 'home' ? m.homeAtk : m.awayAtk;
  var oppDef = side === 'home' ? m.awayDef : m.homeDef;
  var homeAdv = side === 'home' ? 1.20 : 0.90;
  var lambda = base * oppDef * homeAdv * 1.35;
  if (side === 'home' && m.redHome) lambda *= 0.35;
  if (side === 'away' && m.redAway) lambda *= 0.35;
  var mom = side === 'home' ? m.momentum : -m.momentum;
  lambda *= (1 + mom * 0.35);
  return Math.max(0.05, lambda);
}

function simulateFootball(m) {
  if (m.isBreak) {
    m.breakTimer += 1;
    if (m.breakTimer >= FT_BREAK_SEC) {
      m.isBreak = false; m.half = 2; m.minute = 45;
      m.commentary = '⚽ Второй тайм начался';
    }
    return;
  }
  m.realTick += 1;
  m.minute += 1 / FT_TICK_PER_MIN;
  m.justScored = null;

  if (m.minute >= 45 && m.half === 1) {
    m.minute = 45; m.isBreak = true; m.breakTimer = 0;
    m.commentary = '⏸ Перерыв';
    return;
  }
  if (m.minute >= 90) {
    m.minute = 90; m.status = 'finished'; m.finishedAt = Date.now();
    return;
  }
  switchFootballPhase(m);
  var I = footballPhaseIntensity(m);
  var intensity = I.intensity, goalBoost = I.goalBoost;

  m.nextThrowIn -= intensity * 1.5;
  if (m.nextThrowIn <= 0) {
    if (Math.random() < 0.5) m.throwInsHome++; else m.throwInsAway++;
    m.nextThrowIn = Math.random() < 0.35 ? 8 + rand(0, 25) : 60 + rand(0, 180);
  }
  m.nextGoalKick -= intensity;
  if (m.nextGoalKick <= 0) {
    if (Math.random() < 0.5) m.goalKicksHome++; else m.goalKicksAway++;
    m.nextGoalKick = 90 + rand(0, 240);
  }
  m.nextFoul -= intensity * 1.3;
  if (m.nextFoul <= 0) {
    var side = Math.random() < 0.5 ? 'home' : 'away';
    if (side === 'home') m.foulsHome++; else m.foulsAway++;
    if (Math.random() < 0.10) {
      if (side === 'home') m.cardsHome++; else m.cardsAway++;
      m.commentary = '🟨 Жёлтая — ' + (side === 'home' ? m.home : m.away);
    }
    m.nextFoul = Math.random() < 0.4 ? 15 + rand(0, 40) : 100 + rand(0, 240);
  }
  m.nextCorner -= intensity;
  if (m.nextCorner <= 0) {
    if (Math.random() < 0.5) m.cornersHome++; else m.cornersAway++;
    m.nextCorner = 200 + rand(0, 400);
  }
  m.nextShot -= intensity * 1.4;
  if (m.nextShot <= 0) {
    var s5 = Math.random() < 0.5 ? 'home' : 'away';
    var onT = Math.random() < 0.4;
    if (s5 === 'home') {
      m.shotsHome++; m.xgHome += 0.05 + Math.random() * 0.2;
      if (onT) { m.shotsOnTargetHome++; if (Math.random() < 0.65) m.savesAway++; }
    } else {
      m.shotsAway++; m.xgAway += 0.05 + Math.random() * 0.2;
      if (onT) { m.shotsOnTargetAway++; if (Math.random() < 0.65) m.savesHome++; }
    }
    m.nextShot = 60 + rand(0, 180);
  }
  m.nextOffside -= intensity;
  if (m.nextOffside <= 0) {
    if (Math.random() < 0.5) m.offsidesHome++; else m.offsidesAway++;
    m.nextOffside = 300 + rand(0, 600);
  }

  var targetPoss = 50 + (m.homeAtk - m.awayAtk) * 10;
  if (m.phase === 'pressure_home') targetPoss += 10;
  if (m.phase === 'pressure_away') targetPoss -= 10;
  targetPoss += (m.scoreHome - m.scoreAway) * 3;
  m.possessionHome = Math.round(m.possessionHome * 0.97 + targetPoss * 0.03);
  m.possessionHome = clamp(m.possessionHome, 25, 75);

  var pGoal = 0.0035 * goalBoost;
  var lamH = footballLambda(m, 'home'), lamA = footballLambda(m, 'away');
  var totalLam = lamH + lamA;
  if (totalLam > 0 && Math.random() < pGoal) {
    if (Math.random() < lamH / totalLam) {
      m.scoreHome++; m.xgHome += 0.4; m.shotsOnTargetHome++;
      m.justScored = 'home';
      m.commentary = '⚽ ГОЛ! ' + m.home + ' — ' + m.scoreHome + ':' + m.scoreAway;
      m.phase = 'pressure_away'; m.phaseSecLeft = 20 + rand(0, 20);
    } else {
      m.scoreAway++; m.xgAway += 0.4; m.shotsOnTargetAway++;
      m.justScored = 'away';
      m.commentary = '⚽ ГОЛ! ' + m.away + ' — ' + m.scoreHome + ':' + m.scoreAway;
      m.phase = 'pressure_home'; m.phaseSecLeft = 20 + rand(0, 20);
    }
  }
}

/* ============================================================
   ХОККЕЙ — 3 периода × 20 "минут"
   ============================================================ */
var HK_PERIOD_SEC = 20;
var HK_BREAK_SEC = 2;

function newHockey() {
  var lgs = [], seen = {};
  HOCKEY.forEach(function(t) { if (!seen[t.lg]) { seen[t.lg] = 1; lgs.push(t.lg); } });
  var lg = pick(lgs);
  var pool = HOCKEY.filter(function(t) { return t.lg === lg; });
  var pair = uniquePair(pool);
  var h = pair[0], a = pair[1];
  return {
    id: STATE.nextId++, sport: 'hockey', league: lg,
    home: h.n, away: a.n,
    homeAtk: h.atk, awayAtk: a.atk, homeDef: h.def, awayDef: a.def,
    homeRating: h.rt, awayRating: a.rt,
    homeCountry: h.country, awayCountry: a.country,
    scoreHome: 0, scoreAway: 0,
    periodScores: [{h:0,a:0},{h:0,a:0},{h:0,a:0}],
    period: 1, periodSec: 0, minute: 0, maxMinute: 60,
    penaltyHome: 0, penaltyAway: 0, emptyNet: null,
    shotsHome: 0, shotsAway: 0, savesHome: 0, savesAway: 0,
    hitsHome: 0, hitsAway: 0,
    isBreak: false, breakTimer: 0,
    overtime: false, shootout: false, finalResult: null,
    justScored: null, status: 'live', momentum: 0,
    commentary: 'Матч начинается'
  };
}

function hockeyLambda(m, side) {
  var base = side === 'home' ? m.homeAtk : m.awayAtk;
  var oppDef = side === 'home' ? m.awayDef : m.homeDef;
  var homeAdv = side === 'home' ? 1.08 : 0.94;
  var lambda = base * (oppDef / 3.0) * homeAdv * 0.55;
  if (side === 'home' && m.penaltyAway > 0) lambda *= 2.8;
  if (side === 'away' && m.penaltyHome > 0) lambda *= 2.8;
  if (side === 'home' && m.emptyNet === 'away') lambda *= 5;
  if (side === 'away' && m.emptyNet === 'home') lambda *= 5;
  return Math.max(0.03, lambda);
}

function simulateHockey(m) {
  if (m.isBreak) {
    m.breakTimer += 1;
    if (m.breakTimer >= HK_BREAK_SEC) {
      m.isBreak = false; m.period += 1; m.periodSec = 0;
      m.penaltyHome = 0; m.penaltyAway = 0; m.emptyNet = null;
      if (m.period > 3) {
        if (m.scoreHome === m.scoreAway) {
          m.overtime = true; m.period = 4;
          m.commentary = '🔥 Овертайм!';
        } else {
          m.status = 'finished'; m.finishedAt = Date.now();
        }
        return;
      }
    }
    return;
  }
  m.periodSec += 1; m.minute += 1; m.justScored = null;

  if (m.period === 4 && m.periodSec >= 5) {
    var hG = 0, aG = 0;
    for (var i = 0; i < 5; i++) {
      if (Math.random() < 0.35) hG++;
      if (Math.random() < 0.35) aG++;
    }
    var guard = 0;
    while (hG === aG && guard++ < 30) {
      if (Math.random() < 0.4) hG++;
      if (Math.random() < 0.4) aG++;
    }
    if (hG > aG) m.scoreHome++; else m.scoreAway++;
    m.status = 'finished'; m.finishedAt = Date.now();
    m.commentary = '🎯 Буллиты!';
    return;
  }
  if (m.period <= 3 && m.periodSec >= HK_PERIOD_SEC) {
    m.isBreak = true; m.breakTimer = 0;
    return;
  }
  if (m.penaltyHome > 0) m.penaltyHome--;
  if (m.penaltyAway > 0) m.penaltyAway--;
  if (m.period === 3 && m.periodSec >= 18 && m.scoreHome !== m.scoreAway) {
    m.emptyNet = m.scoreHome < m.scoreAway ? 'home' : 'away';
  }
  if (Math.random() < 0.03 && m.penaltyHome === 0 && m.penaltyAway === 0) {
    if (Math.random() < 0.5) { m.penaltyHome = 4; m.commentary = '🟨 Удаление — ' + m.home; }
    else { m.penaltyAway = 4; m.commentary = '🟨 Удаление — ' + m.away; }
  }
  var lamH = hockeyLambda(m, 'home') / 60;
  var lamA = hockeyLambda(m, 'away') / 60;
  if (Math.random() < lamH) {
    m.scoreHome++; m.shotsHome++; m.justScored = 'home';
    m.commentary = '🏒 ГОЛ! ' + m.home;
    if (m.period <= 3) m.periodScores[m.period - 1].h++;
  } else if (Math.random() < lamA) {
    m.scoreAway++; m.shotsAway++; m.justScored = 'away';
    m.commentary = '🏒 ГОЛ! ' + m.away;
    if (m.period <= 3) m.periodScores[m.period - 1].a++;
  } else {
    if (Math.random() < 0.15) { m.shotsHome++; m.savesAway++; }
    else if (Math.random() < 0.3) { m.shotsAway++; m.savesHome++; }
  }
}

/* ============================================================
   UFC — 5 раундов по 300 сек
   ============================================================ */
var UFC_ROUND_SEC = 300;
var UFC_BREAK_SEC = 60;
var UFC_MAX_ROUNDS = 5;

function newUFC() {
  var divs = [], seen = {};
  UFC.forEach(function(f) { if (!seen[f.div]) { seen[f.div] = 1; divs.push(f.div); } });
  var div = pick(divs);
  var pool = UFC.filter(function(f) { return f.div === div; });
  var pair = uniquePair(pool);
  var h = pair[0], a = pair[1];
  return {
    id: STATE.nextId++, sport: 'ufc', league: 'UFC · ' + div,
    home: h.n, away: a.n,
    homeRating: h.rt, awayRating: a.rt,
    homeCountry: h.country, awayCountry: a.country,
    homeFighter: {power: h.power, acc: h.acc, td: h.td, style: h.style, hpMax: h.hpMax, stamMax: h.stamMax},
    awayFighter: {power: a.power, acc: a.acc, td: a.td, style: a.style, hpMax: a.hpMax, stamMax: a.stamMax},
    homeHP: h.hpMax, awayHP: a.hpMax,
    homeStam: h.stamMax, awayStam: a.stamMax,
    round: 1, roundSec: 0, minute: 0, maxMinute: UFC_MAX_ROUNDS * UFC_ROUND_SEC,
    phase: 'fight',
    scoreHome: 0, scoreAway: 0, roundScores: [],
    status: 'live', momentum: 0,
    finalResult: null, justScored: null, commentary: 'Начало боя'
  };
}

function simulateUFC(m) {
  if (m.phase === 'break') {
    m.roundSec += 1;
    if (m.roundSec >= UFC_BREAK_SEC) {
      m.phase = 'fight'; m.roundSec = 0;
      m.homeStam = Math.min(m.homeFighter.stamMax, m.homeStam + 18);
      m.awayStam = Math.min(m.awayFighter.stamMax, m.awayStam + 18);
    }
    return;
  }
  m.roundSec += 1; m.minute += 1;
  var hAcc = m.homeFighter.acc * (m.homeStam / m.homeFighter.stamMax);
  var aAcc = m.awayFighter.acc * (m.awayStam / m.awayFighter.stamMax);
  var hPow = m.homeFighter.power * (0.7 + 0.3 * (m.homeStam / m.homeFighter.stamMax));
  var aPow = m.awayFighter.power * (0.7 + 0.3 * (m.awayStam / m.awayFighter.stamMax));

  if (Math.random() < m.homeFighter.td / 100 * 0.05 && m.homeFighter.style !== 'striker') {
    m.awayHP -= hPow * 0.35; m.homeStam -= 2;
    if (Math.random() < 0.10 && m.awayHP < 40) { finishUFC(m, 'home', 'Сабмишн', m.round); return; }
  }
  if (Math.random() < m.awayFighter.td / 100 * 0.05 && m.awayFighter.style !== 'striker') {
    m.homeHP -= aPow * 0.35; m.awayStam -= 2;
    if (Math.random() < 0.10 && m.homeHP < 40) { finishUFC(m, 'away', 'Сабмишн', m.round); return; }
  }
  if (Math.random() < hAcc / 100 * 0.35) {
    if (Math.random() < hAcc / 100 * 0.55) {
      m.awayHP -= hPow * 0.18; m.homeStam -= 1.2; m.awayStam -= 0.8;
      if (Math.random() < 0.02 && m.awayHP < 15) { finishUFC(m, 'home', 'KO/TKO', m.round); return; }
    } else m.homeStam -= 1.5;
  }
  if (Math.random() < aAcc / 100 * 0.35) {
    if (Math.random() < aAcc / 100 * 0.55) {
      m.homeHP -= aPow * 0.18; m.awayStam -= 1.2; m.homeStam -= 0.8;
      if (Math.random() < 0.02 && m.homeHP < 15) { finishUFC(m, 'away', 'KO/TKO', m.round); return; }
    } else m.awayStam -= 1.5;
  }
  if (m.homeStam < 5) m.homeStam = 5;
  if (m.awayStam < 5) m.awayStam = 5;
  if (m.homeHP < 0) m.homeHP = 0;
  if (m.awayHP < 0) m.awayHP = 0;

  if (m.roundSec >= UFC_ROUND_SEC) {
    var diff = (m.homeHP - m.awayHP) + (m.homeStam - m.awayStam) * 0.3;
    var rh = 10, ra = 10;
    if (diff > 15) ra = 8; else if (diff > 3) ra = 9;
    else if (diff < -15) rh = 8; else if (diff < -3) rh = 9;
    m.roundScores.push({h: rh, a: ra});
    if (m.round >= UFC_MAX_ROUNDS) {
      var totH = 0, totA = 0;
      m.roundScores.forEach(function(rs) { totH += rs.h; totA += rs.a; });
      finishUFC(m, totH >= totA ? 'home' : 'away', 'Решение', 5);
      return;
    }
    m.round++; m.phase = 'break'; m.roundSec = 0;
  }
}

function finishUFC(m, winner, method, round) {
  m.finalResult = {winner: winner, method: method, round: round};
  if (winner === 'home') m.scoreHome = 1; else m.scoreAway = 1;
  m.status = 'finished'; m.finishedAt = Date.now();
  m.commentary = '🏆 ' + (winner === 'home' ? m.home : m.away) + ' · ' + method + ' · R' + round;
}

function simulateVolleyball(m) {

  var pHome;
  if (m.serving === 'home') pHome = 0.5 + (m.homeServe - 1) * 0.18 - (m.awayBlock - 1) * 0.10;
  else pHome = 0.5 - (m.awayServe - 1) * 0.18 + (m.homeBlock - 1) * 0.10;

  else { m.pointsAway++; m.serving = 'away'; }

    m.setsHome++;
    m.setHistory.push({winner: 'home', h: m.pointsHome, a: m.pointsAway});
    m.justScored = 'home';
    m.pointsHome = 0; m.pointsAway = 0;
  } else if (m.pointsAway >= target && m.pointsAway - m.pointsHome >= 2) {
    m.setsAway++;
    m.setHistory.push({winner: 'away', h: m.pointsHome, a: m.pointsAway});
    m.justScored = 'away';
    m.pointsHome = 0; m.pointsAway = 0;
  }
  if (m.setsHome >= 3 || m.setsAway >= 3) {
    m.status = 'finished'; m.finishedAt = Date.now();
  }
}

/* ============================================================
   ТИК
   ============================================================ */
function tickMatch(m) {
  if (m.status === 'countdown') {
    m.countdownLeft = (m.countdownLeft || 45) - 1;
    if (m.countdownLeft <= 0) {
      var nm;
      if (m.sport === 'football') nm = newFootball();
      else if (m.sport === 'hockey') nm = newHockey();
      else if (m.sport === 'volleyball') nm = newVolleyball();
      else nm = newUFC();
      nm.id = m.id;
      for (var k in m) delete m[k];
      for (var k2 in nm) m[k2] = nm[k2];
    }
    return;
  }
  if (m.status !== 'live') return;
  if (m.sport === 'football') simulateFootball(m);
  else if (m.sport === 'hockey') simulateHockey(m);
  else if (m.sport === 'volleyball') simulateVolleyball(m);
  else if (m.sport === 'ufc') simulateUFC(m);
}

/* ============================================================
   КОЭФЫ — ГЛАВНОЕ
   Все кэфы считаются ОТ ТЕКУЩЕГО СЧЁТА + ВРЕМЕНИ + СИЛЫ
   ============================================================ */

/* === ФУТБОЛ 1X2 ===
   Интегрируем Poisson от текущего счёта до конца 90 минут */
function computeFootballOdds(m) {
  if (m.status === 'finished' || m.status === 'countdown') {
    if (m.status === 'countdown') return prematchFootballOdds(m);
    return {home: null, draw: null, away: null};
  }
  var rem = Math.max(0.5, m.maxMinute - m.minute);
  var lamH = footballLambda(m, 'home') * rem / 90;
  var lamA = footballLambda(m, 'away') * rem / 90;

  var pH = 0, pD = 0, pA = 0;
  for (var h = 0; h <= 12; h++) {
    var ph = poisson(h, lamH);
    if (ph < 1e-9) continue;
    for (var a = 0; a <= 12; a++) {
      var pa = poisson(a, lamA);
      if (pa < 1e-9) continue;
      var p = ph * pa;
      var fh = m.scoreHome + h, fa = m.scoreAway + a;
      if (fh > fa) pH += p; else if (fh === fa) pD += p; else pA += p;
    }
  }
  var t = pH + pD + pA || 1;
  return {home: toOdd(pH / t), draw: toOdd(pD / t), away: toOdd(pA / t)};
}

/* Прематчевые кэфы */
function prematchFootballOdds(m) {
  var lamH = m.homeAtk * m.awayDef * 1.20 * 1.35;
  var lamA = m.awayAtk * m.homeDef * 0.90 * 1.35;
  var pH = 0, pD = 0, pA = 0;
  for (var h = 0; h <= 10; h++) {
    for (var a = 0; a <= 10; a++) {
      var p = poisson(h, lamH) * poisson(a, lamA);
      if (h > a) pH += p; else if (h === a) pD += p; else pA += p;
    }
  }
  var t = pH + pD + pA || 1;
  return {home: toOdd(pH / t), draw: toOdd(pD / t), away: toOdd(pA / t)};
}

/* === ХОККЕЙ 1X2 === */
function computeHockeyOdds(m) {
  if (m.status === 'countdown') return prematchHockeyOdds(m);
  if (m.status === 'finished') return {home: null, draw: null, away: null};
  var rem;
  if (m.period === 4) rem = 5;
  else rem = 60 - m.minute;
  if (rem <= 0) rem = 0.5;
  var lamH = hockeyLambda(m, 'home') * rem / 60;
  var lamA = hockeyLambda(m, 'away') * rem / 60;
  var pH = 0, pD = 0, pA = 0;
  for (var h = 0; h <= 10; h++) {
    var ph = poisson(h, lamH);
    if (ph < 1e-9) continue;
    for (var a = 0; a <= 10; a++) {
      var pa = poisson(a, lamA);
      if (pa < 1e-9) continue;
      var p = ph * pa;
      var fh = m.scoreHome + h, fa = m.scoreAway + a;
      if (fh > fa) pH += p; else if (fh === fa) pD += p; else pA += p;
    }
  }
  var t = pH + pD + pA || 1;
  return {home: toOdd(pH / t), draw: toOdd(pD / t), away: toOdd(pA / t)};
}
function prematchHockeyOdds(m) {
  var lamH = m.homeAtk * (m.awayDef / 3) * 1.08 * 0.55;
  var lamA = m.awayAtk * (m.homeDef / 3) * 0.94 * 0.55;
  var pH = 0, pD = 0, pA = 0;
  for (var h = 0; h <= 8; h++) {
    for (var a = 0; a <= 8; a++) {
      var p = poisson(h, lamH) * poisson(a, lamA);
      if (h > a) pH += p; else if (h === a) pD += p; else pA += p;
    }
  }
  var t = pH + pD + pA || 1;
  return {home: toOdd(pH / t), draw: toOdd(pD / t), away: toOdd(pA / t)};
}

/* === UFC — только П1/П2 === */
function ufcProbHome(m) {
  if (m.status === 'finished') return m.finalResult && m.finalResult.winner === 'home' ? 1 : 0;
  if (m.status === 'countdown') return 0.5;
  var hpDiff = (m.homeHP - m.awayHP) / Math.max(1, m.homeFighter.hpMax);
  var stamDiff = (m.homeStam - m.awayStam) / Math.max(1, m.homeFighter.stamMax);
  var rDiff = (m.homeRating - m.awayRating) / 400;
  var base = 1 / (1 + Math.pow(10, -rDiff));
  var prog = m.minute / Math.max(1, m.maxMinute);
  var pH = base + hpDiff * 0.4 + stamDiff * 0.15;
  pH = 0.5 + (clamp(pH, 0.05, 0.95) - 0.5) * (1 - prog * 0.3);
  return clamp(pH, 0.05, 0.95);
}
function computeUFCOdds(m) {
  if (m.status === 'countdown') {
    var rDiff0 = (m.homeRating - m.awayRating) / 400;
    var pH0 = 1 / (1 + Math.pow(10, -rDiff0));
    return {home: toOdd(pH0), away: toOdd(1 - pH0), draw: null};
  }
  if (m.status === 'finished') return {home: null, draw: null, away: null};
  var pH = ufcProbHome(m);
  return {home: toOdd(pH), away: toOdd(1 - pH), draw: null};
}

/* === ВОЛЕЙБОЛ — только П1/П2 === */
function volleyProbHome(m) {
  if (m.status === 'finished') return m.setsHome > m.setsAway ? 1 : 0;
  if (m.status === 'countdown') return 0.5;
  var atkDiff = (m.homeAtk - m.awayAtk) * 0.20;
  var serveDiff = (m.homeServe - m.awayServe) * 0.08;
  var blockDiff = (m.homeBlock - m.awayBlock) * 0.05;
  var base = clamp(0.5 + atkDiff + serveDiff - blockDiff, 0.15, 0.85);
  var isFifth = (m.setsHome === 2 && m.setsAway === 2);
  var target = isFifth ? 15 : 25;
  var curScore = (m.pointsHome - m.pointsAway) / target;
  var setScore = (m.setsHome - m.setsAway) * 0.12;
  var pH = base + curScore * 0.18 + setScore;
  return clamp(pH, 0.05, 0.95);
}
function computeVolleyballOdds(m) {
  if (m.status === 'countdown') {
    var d = (m.homeAtk - m.awayAtk) * 0.20 + (m.homeServe - m.awayServe) * 0.08 - (m.homeBlock - m.awayBlock) * 0.05;
    var pH0 = clamp(0.5 + d, 0.2, 0.8);
    return {home: toOdd(pH0), away: toOdd(1 - pH0), draw: null};
  }
  if (m.status === 'finished') return {home: null, draw: null, away: null};
  var pH = volleyProbHome(m);
  return {home: toOdd(pH), away: toOdd(1 - pH), draw: null};
}

function computeOdds(m) {
  if (m.sport === 'football') return computeFootballOdds(m);
  if (m.sport === 'hockey') return computeHockeyOdds(m);
  if (m.sport === 'ufc') return computeUFCOdds(m);
  if (m.sport === 'volleyball') return computeVolleyballOdds(m);
  return {home: null, draw: null, away: null};
}

/* ============================================================
   ХЕЛПЕРЫ
   ============================================================ */
function formatTimeLeft(m) {
  if (m.status === 'countdown') {
    // показываем через сколько начнётся
    if (!m.startTime) m.startTime = Date.now() + rand(15 * 60, 6 * 3600) * 1000;
    var diff = Math.floor((m.startTime - Date.now()) / 1000);
    if (diff <= 0) return 'Сейчас';
    if (diff < 3600) return 'Через ' + Math.ceil(diff / 60) + ' мин';
    var h = Math.floor(diff / 3600);
    var mins = Math.floor((diff % 3600) / 60);
    return 'Через ' + h + 'ч ' + mins + 'мин';
  }
  if (m.status === 'finished') return 'Завершён';
  if (m.sport === 'football') {
    if (m.isBreak) return 'Перерыв';
    var mins = Math.floor(m.minute);
    return (m.minute < 45 ? '1-й · ' : '2-й · ') + mins + "'";
  }
  if (m.sport === 'hockey') {
    if (m.isBreak) return 'Перерыв';
    if (m.period === 4) return 'ОТ · ' + ft(m.periodSec);
    return m.period + '-й · ' + ft(m.periodSec);
  }
  if (m.sport === 'ufc') {
    if (m.phase === 'break') return 'Перерыв';
    return 'R' + m.round + ' · ' + ft(m.roundSec);
  }
  if (m.sport === 'volleyball') {
    var sn = m.setsHome + m.setsAway + 1;
    return 'Сет ' + Math.min(5, sn) + ' · ' + m.pointsHome + ':' + m.pointsAway;
  }
  return '';
}

/* Футбол: тотал X.5 — вероятность перевалить линию */
function footballTotalOverProb(m, line) {
  var rem = Math.max(0.5, m.maxMinute - m.minute);
  var lamH = footballLambda(m, 'home') * rem / 90;
  var lamA = footballLambda(m, 'away') * rem / 90;
  var currentTotal = m.scoreHome + m.scoreAway;
  var need = line - currentTotal; // сколько голов нужно чтобы пробить линию
  if (need <= 0) return 1; // уже пробит
  if (need >= 12) return 0; // не реально

  // Вероятность что суммарно забьют >= need
  var pOver = 0;
  for (var h = 0; h <= 12; h++) {
    var ph = poisson(h, lamH);
    if (ph < 1e-9) continue;
    for (var a = 0; a <= 12; a++) {
      var pa = poisson(a, lamA);
      if (pa < 1e-9) continue;
      if (h + a >= need) pOver += ph * pa;
    }
  }
  return clamp(pOver, 0.01, 0.99);
}

/* Хоккей: тотал X.5 */
function hockeyTotalOverProb(m, line) {
  var rem;
  if (m.period === 4) rem = 5;
  else rem = Math.max(0.5, 60 - m.minute);
  var lamH = hockeyLambda(m, 'home') * rem / 60;
  var lamA = hockeyLambda(m, 'away') * rem / 60;
  var currentTotal = m.scoreHome + m.scoreAway;
  var need = line - currentTotal;
  if (need <= 0) return 1;
  if (need >= 12) return 0;

  var pOver = 0;
  for (var h = 0; h <= 12; h++) {
    var ph = poisson(h, lamH);
    if (ph < 1e-9) continue;
    for (var a = 0; a <= 12; a++) {
      var pa = poisson(a, lamA);
      if (pa < 1e-9) continue;
      if (h + a >= need) pOver += ph * pa;
    }
  }
  return clamp(pOver, 0.01, 0.99);
}

/* Футбол: фора — вероятность что хозяин победит с учётом форы */
function footballHandicapProb(m, line, side) {
  var rem = Math.max(0.5, m.maxMinute - m.minute);
  var lamH = footballLambda(m, 'home') * rem / 90;
  var lamA = footballLambda(m, 'away') * rem / 90;
  var diff = m.scoreHome - m.scoreAway;
  var p = 0;
  for (var h = 0; h <= 12; h++) {
    var ph = poisson(h, lamH);
    if (ph < 1e-9) continue;
    for (var a = 0; a <= 12; a++) {
      var pa = poisson(a, lamA);
      if (pa < 1e-9) continue;
      var total = diff + h - a;
      var res = side === 'home' ? (total + line) : (-total + line);
      if (res > 0) p += ph * pa;
    }
  }
  return clamp(p, 0.02, 0.98);
}

/* Хоккей: фора */
function hockeyHandicapProb(m, line, side) {
  var rem;
  if (m.period === 4) rem = 5;
  else rem = Math.max(0.5, 60 - m.minute);
  var lamH = hockeyLambda(m, 'home') * rem / 60;
  var lamA = hockeyLambda(m, 'away') * rem / 60;
  var diff = m.scoreHome - m.scoreAway;
  var p = 0;
  for (var h = 0; h <= 12; h++) {
    var ph = poisson(h, lamH);
    if (ph < 1e-9) continue;
    for (var a = 0; a <= 12; a++) {
      var pa = poisson(a, lamA);
      if (pa < 1e-9) continue;
      var total = diff + h - a;
      var res = side === 'home' ? (total + line) : (-total + line);
      if (res > 0) p += ph * pa;
    }
  }
  return clamp(p, 0.02, 0.98);
}

/* ==== UFC РЫНКИ ==== */
function ufcFinishProb(m) {
  // вероятность досрочного финиша от текущего момента
  if (m.status === 'finished') return m.finalResult && m.finalResult.method !== 'Решение' ? 1 : 0;
  if (m.status === 'countdown') return 0.55;
  var roundsLeft = UFC_MAX_ROUNDS - m.round + 1;
  // средний шанс финиша за раунд ~0.25
  var perRound = 0.25;
  // если у кого-то мало HP — растёт
  if (m.homeHP < 30 || m.awayHP < 30) perRound *= 1.6;
  if (m.homeHP < 15 || m.awayHP < 15) perRound *= 2;
  var pNoFin = 1;
  for (var r = 0; r < roundsLeft; r++) {
    var haz = perRound;
    if (r === 0) {
      var secLeft = UFC_ROUND_SEC - m.roundSec;
      haz = perRound * (secLeft / UFC_ROUND_SEC);
    }
    pNoFin *= (1 - haz);
  }
  return clamp(1 - pNoFin, 0.05, 0.95);
}

function computeUFCExtras(m) {
  if (m.status === 'finished' || m.status === 'countdown') return {};
  var out = {};
  function add(l, p, mar) { var o = toOdd(p, mar || 0.05); if (o !== null) out[l] = o; }
  var pH = ufcProbHome(m);
  var pA = 1 - pH;
  var pFin = ufcFinishProb(m);
  var pDec = 1 - pFin;
  var pKO = pFin * 0.6;
  var pSub = pFin * 0.4;

  add('KO/TKO', pKO, 0.06);
  add('Сабмишн', pSub, 0.06);
  add('Решение', pDec, 0.05);
  add('Бой досрочно', pFin, 0.05);
  add('Вся дистанция', pDec, 0.05);

  // Тотал раундов — от текущего раунда
  var roundsPlayed = (m.round - 1) + (m.roundSec / UFC_ROUND_SEC);
  if (m.phase === 'break') roundsPlayed = m.round;

  [[1.5, 'ТБ 1.5 раундов'], [2.5, 'ТБ 2.5 раундов'], [3.5, 'ТБ 3.5 раундов'], [4.5, 'ТБ 4.5 раундов']].forEach(function(pair) {
    var line = pair[0];
    if (roundsPlayed < line) {
      // вероятность что бой дойдёт до этой линии
      var need = line - roundsPlayed;
      var pReach = Math.pow(1 - 0.25, need);
      if (m.homeHP < 30 || m.awayHP < 30) pReach *= 0.6;
      pReach = clamp(pReach, 0.05, 0.95);
      add(pair[1], pReach, 0.05);
      add(pair[1].replace('ТБ', 'ТМ'), 1 - pReach, 0.05);
    }
  });

  // Победа KO/Саб в разрезе кто
  add(m.home + ' KO/TKO', pH * pKO * 0.95, 0.08);
  add(m.home + ' Сабмишн', pH * pSub * 0.95, 0.08);
  add(m.home + ' Решение', pH * pDec * 0.95, 0.08);
  add(m.away + ' KO/TKO', pA * pKO * 0.95, 0.08);
  add(m.away + ' Сабмишн', pA * pSub * 0.95, 0.08);
  add(m.away + ' Решение', pA * pDec * 0.95, 0.08);

  return out;
}

/* ==== ВОЛЕЙБОЛ РЫНКИ ==== */
function computeVolleyballExtras(m) {
  if (m.status === 'finished' || m.status === 'countdown') return {};
  var out = {};
  function add(l, p, mar) { var o = toOdd(p, mar || 0.05); if (o !== null) out[l] = o; }
  var pH = volleyProbHome(m);
  var pA = 1 - pH;

  // Тотал сетов (используем простую оценку)
  var setsPlayed = m.setsHome + m.setsAway;
  // Вероятность что матч закончится в 3, 4, 5 сетах — приближение
  if (setsPlayed < 5) {
    // Разыграем 500 раз для оценки
    var cnt3 = 0, cnt4 = 0, cnt5 = 0;
    var pSet = pH; // вероятность выиграть сет
    for (var t = 0; t < 300; t++) {
      var sh = m.setsHome, sa = m.setsAway, g = 0;
      while (sh < 3 && sa < 3 && g++ < 10) {
        if (Math.random() < pSet) sh++; else sa++;
      }
      var tot = sh + sa;
      if (tot <= 3) cnt3++;
      else if (tot === 4) cnt4++;
      else cnt5++;
    }
    var p3 = cnt3 / 300, p4 = cnt4 / 300, p5 = cnt5 / 300;
    if (p3 > 0.02) { add('ТМ 3.5 сетов', p3, 0.06); add('ТБ 3.5 сетов', p4 + p5, 0.06); }
    if (p5 > 0.02) { add('ТБ 4.5 сетов', p5, 0.06); add('ТМ 4.5 сетов', p3 + p4, 0.06); }
  }

  // Победа в текущем сете
  var isFifth = (m.setsHome === 2 && m.setsAway === 2);
  var target = isFifth ? 15 : 25;
  var remainPoints = target - Math.max(m.pointsHome, m.pointsAway);
  var pHomeSet = clamp(pH + ((m.pointsHome - m.pointsAway) / Math.max(1, remainPoints)) * 0.05, 0.1, 0.9);
  add('Победа в сете · П1', pHomeSet, 0.06);
  add('Победа в сете · П2', 1 - pHomeSet, 0.06);

  // Точный счёт матча
  add('Счёт 3:0', pH * pH * pH * 0.6, 0.10);
  add('Счёт 3:1', pH * pH * (1 - pH) * 1.2, 0.10);
  add('Счёт 3:2', pH * (1 - pH) * (1 - pH) * 0.9, 0.10);
  add('Счёт 0:3', (1 - pH) * (1 - pH) * (1 - pH) * 0.6, 0.10);
  add('Счёт 1:3', (1 - pH) * (1 - pH) * pH * 1.2, 0.10);
  add('Счёт 2:3', (1 - pH) * pH * pH * 0.9, 0.10);

  return out;
}

/* ==== ФУТБОЛ РАСШИРЕННЫЕ РЫНКИ ==== */
function computeFootballExtras(m) {
  if (m.status === 'finished' || m.status === 'countdown') return {};
  var out = {};
  function add(l, p, mar) { var o = toOdd(p, mar || 0.05); if (o !== null) out[l] = o; }

  // Двойной шанс — считается от 1X2
  var odds = computeFootballOdds(m);
  if (odds.home && odds.draw) {
    var p1x = 1 / odds.home + 1 / odds.draw;
    if (p1x < 1) add('1X', 1 - p1x, 0.04);
  }
  if (odds.home && odds.away) {
    var p12 = 1 / odds.home + 1 / odds.away;
    if (p12 < 1) add('12', 1 - p12, 0.04);
  }
  if (odds.draw && odds.away) {
    var px2 = 1 / odds.draw + 1 / odds.away;
    if (px2 < 1) add('X2', 1 - px2, 0.04);
  }

  // Тоталы голов — от текущего счёта
  var rem = m.maxMinute - m.minute;
  var totalCurrent = m.scoreHome + m.scoreAway;
  [0.5, 1.5, 2.5, 3.5, 4.5, 5.5].forEach(function(line) {
    if (line > totalCurrent) {
      var pOver = footballTotalOverProb(m, line);
      add('ТБ ' + line, pOver, 0.05);
      add('ТМ ' + line, 1 - pOver, 0.05);
    }
  });

  // Форы
  [[-1.5, 'Ф1 −1.5'], [-2.5, 'Ф1 −2.5'], [1.5, 'Ф2 −1.5'], [2.5, 'Ф2 −2.5']].forEach(function(pair) {
    var line = pair[0];
    var side = pair[1].indexOf('Ф1') === 0 ? 'home' : 'away';
    var p = footballHandicapProb(m, line, side);
    add(pair[1], p, 0.05);
  });

  // Форы +
  [[1.5, 'Ф1 +1.5'], [2.5, 'Ф1 +2.5'], [-1.5, 'Ф2 +1.5'], [-2.5, 'Ф2 +2.5']].forEach(function(pair) {
    var line = pair[0];
    var side = pair[1].indexOf('Ф1') === 0 ? 'home' : 'away';
    var p = footballHandicapProb(m, line, side);
    add(pair[1], p, 0.05);
  });

  // Обе забьют
  var lamH = footballLambda(m, 'home') * rem / 90;
  var lamA = footballLambda(m, 'away') * rem / 90;
  var hScored0 = m.scoreHome > 0;
  var aScored0 = m.scoreAway > 0;
  var pH0 = hScored0 ? 1 : (1 - poisson(0, lamH));
  var pA0 = aScored0 ? 1 : (1 - poisson(0, lamA));
  var pBtts = pH0 * pA0;
  add('Обе · Да', pBtts, 0.05);
  add('Обе · Нет', 1 - pBtts, 0.05);

  // Показатели команд — от текущего счёта показателя
  var statsParams = [
    {key: 'fouls', label: 'фолов', currentH: m.foulsHome, currentA: m.foulsAway, rate: 24, sigma: 0.3},
    {key: 'corners', label: 'угловых', currentH: m.cornersHome, currentA: m.cornersAway, rate: 10, sigma: 0.35},
    {key: 'cards', label: 'жёлтых', currentH: m.cardsHome, currentA: m.cardsAway, rate: 4, sigma: 0.5},
    {key: 'shots', label: 'ударов', currentH: m.shotsHome, currentA: m.shotsAway, rate: 22, sigma: 0.3},
    {key: 'ontarget', label: 'в створ', currentH: m.shotsOnTargetHome, currentA: m.shotsOnTargetAway, rate: 8, sigma: 0.35},
    {key: 'offsides', label: 'офсайдов', currentH: m.offsidesHome, currentA: m.offsidesAway, rate: 4, sigma: 0.4}
  ];

  statsParams.forEach(function(sp) {
    var now = sp.currentH + sp.currentA;
    var minPlayed = Math.max(1, m.minute);
    var rateActual = now > 0 ? (now / minPlayed) * 90 : sp.rate;
    var expected = now + (rateActual * (rem / 90));
    // Тоталы
    var lines = sp.key === 'fouls' ? [20.5, 24.5, 28.5] :
                sp.key === 'corners' ? [7.5, 9.5, 11.5] :
                sp.key === 'cards' ? [2.5, 3.5, 4.5] :
                sp.key === 'shots' ? [18.5, 22.5, 26.5] :
                sp.key === 'ontarget' ? [6.5, 8.5, 10.5] :
                [2.5, 3.5, 4.5];
    var sigma = Math.max(1, Math.sqrt(expected * sp.sigma));
    lines.forEach(function(line) {
      if (now < line) {
        var z = (line - expected) / sigma;
        var pOver = 1 - normalCDF(z);
        pOver = clamp(pOver, 0.05, 0.95);
        add('ТБ ' + line + ' ' + sp.label, pOver, 0.08);
        add('ТМ ' + line + ' ' + sp.label, 1 - pOver, 0.08);
      }
    });
  });

  return out;
}

/* ==== ХОККЕЙ РАСШИРЕННЫЕ РЫНКИ ==== */
function computeHockeyExtras(m) {
  if (m.status === 'finished' || m.status === 'countdown') return {};
  var out = {};
  function add(l, p, mar) { var o = toOdd(p, mar || 0.05); if (o !== null) out[l] = o; }

  var odds = computeHockeyOdds(m);
  if (odds.home && odds.draw) {
    var p1x = 1 / odds.home + 1 / odds.draw;
    if (p1x < 1) add('1X', 1 - p1x, 0.04);
  }
  if (odds.home && odds.away) {
    var p12 = 1 / odds.home + 1 / odds.away;
    if (p12 < 1) add('12', 1 - p12, 0.04);
  }
  if (odds.draw && odds.away) {
    var px2 = 1 / odds.draw + 1 / odds.away;
    if (px2 < 1) add('X2', 1 - px2, 0.04);
  }

  var totalCurrent = m.scoreHome + m.scoreAway;
  [3.5, 4.5, 5.5, 6.5, 7.5].forEach(function(line) {
    if (line > totalCurrent) {
      var pOver = hockeyTotalOverProb(m, line);
      add('ТБ ' + line, pOver, 0.05);
      add('ТМ ' + line, 1 - pOver, 0.05);
    }
  });

  // Форы
  [[-1.5, 'Ф1 −1.5'], [1.5, 'Ф1 +1.5']].forEach(function(pair) {
    var side = pair[1].indexOf('Ф1') === 0 ? 'home' : 'away';
    var p = hockeyHandicapProb(m, pair[0], side);
    add(pair[1], p, 0.05);
  });

  // Обе забьют
  var rem = Math.max(0.5, 60 - m.minute);
  var lamH = hockeyLambda(m, 'home') * rem / 60;
  var lamA = hockeyLambda(m, 'away') * rem / 60;
  var pH0 = m.scoreHome > 0 ? 1 : (1 - poisson(0, lamH));
  var pA0 = m.scoreAway > 0 ? 1 : (1 - poisson(0, lamA));
  var pBtts = pH0 * pA0;
  add('Обе · Да', pBtts, 0.06);
  add('Обе · Нет', 1 - pBtts, 0.06);

  // Большинство
  if (m.penaltyHome > 0) add(m.away + ' в большинстве', 0.45, 0.08);
  if (m.penaltyAway > 0) add(m.home + ' в большинстве', 0.45, 0.08);

  return out;
}

function computeExtras(m) {
  if (m.sport === 'football') return computeFootballExtras(m);
  if (m.sport === 'hockey') return computeHockeyExtras(m);
  if (m.sport === 'ufc') return computeUFCExtras(m);
  if (m.sport === 'volleyball') return computeVolleyballExtras(m);
  return {};
}

  }

  var cellH = renderOddCell(m, 'home', odds.home, isFin);
  var cellD = (m.sport === 'ufc' || m.sport === 'volleyball') ? '<div class="odd-cell dash"></div>' : renderOddCell(m, 'draw', odds.draw, isFin);
  var cellA = renderOddCell(m, 'away', odds.away, isFin);

  return '<div class="match-row" data-match-id="' + m.id + '">' +
    '<div class="arrow">›</div>' +
    '<div class="teams">' +
      '<div class="team-line"><span class="team-logo" style="background:' + hColor + '">' + teamInit(m.home) + '</span><span class="team-name">' + escapeHtml(m.home) + '</span>' + homeScore + '</div>' +
      '<div class="team-line"><span class="team-logo" style="background:' + aColor + '">' + teamInit(m.away) + '</span><span class="team-name">' + escapeHtml(m.away) + '</span>' + awayScore + '</div>' +
      timeHtml +
    '</div>' + cellH + cellD + cellA +
  '</div>';
}

function renderOddCell(m, pick, odd, disabled) {
  if (!isValid(odd)) return '<div class="odd-cell dash">—</div>';
  var isSel = isInCoupon(m.id, pick);
  var cls = 'odd-cell' + (isSel ? ' selected' : '') + (disabled ? ' disabled' : '');
  return '<div class="' + cls + '" data-match-id="' + m.id + '" data-pick="' + pick + '">' + odd.toFixed(2) + '</div>';
}

/* ============ MAIN SCREEN ============ */
function renderMainScreen() {
  var html = renderTopHeader({title: 'Главная'});
  html += renderSportTabs();
  html += renderFilterRow();

  var filtered = [];
  for (var i = 0; i < STATE.matches.length; i++) {
    var m = STATE.matches[i];
    if (STATE.currentSport !== 'all' && m.sport !== STATE.currentSport) continue;
    if (STATE.currentFilter === 'live' && m.status !== 'live') continue;
    filtered.push(m);
  }
  filtered.sort(function(a, b) {
    var ord = {live: 0, countdown: 1, finished: 2};
    if (ord[a.status] !== ord[b.status]) return ord[a.status] - ord[b.status];
    return a.minute - b.minute;
  });

  var groups = {}, groupOrder = [];
  filtered.forEach(function(m) {
    var key = m.sport + '|' + m.league;
    if (!groups[key]) { groups[key] = {sport: m.sport, league: m.league, matches: []}; groupOrder.push(key); }
    groups[key].matches.push(m);
  });

  html += '<div class="main">';
  if (!groupOrder.length) {
    html += '<div class="empty"><div class="empty-icon">🎯</div><div class="empty-text">Матчей нет</div></div>';
  } else {
    groupOrder.forEach(function(key) {
      var g = groups[key];
      html += '<div class="league-block">' +
        '<div class="league-head">' +
          '<div class="league-icon">' + sIcon(g.sport) + '</div>' +
          '<div class="league-name">' + escapeHtml(g.league) + '</div>' +
          '<button class="league-filter">⚙︎</button>' +
        '</div>';
      g.matches.forEach(function(m) { html += renderMatchRow(m); });
      html += '</div>';
    });
    html += '<button class="show-all" id="btnShowAll">Все события</button>';
  }
  html += '</div>';
  $('app').innerHTML = html;
  bindMainScreen();
}

/* ============ MATCH SCREEN ============ */
function renderMatchScreen() {
  var m = STATE.currentMatch;
  if (!m) { STATE.screen = 'main'; renderApp(); return; }
  var html = renderTopHeader({title: sName(m.sport), back: true});
  html += renderMatchHeader(m);
  html += renderMarketTabs(m);
  html += '<div class="main" style="padding-bottom:16px">' + renderMarketsBody(m) + '</div>';
  $('app').innerHTML = html;
  bindMatchScreen();
}

function renderMatchHeader(m) {

  var aColor = teamColor(m.away);
  var scoreCenter;

    scoreCenter = '<div class="score-center"><span>— : —</span><span class="timer">' + formatTimeLeft(m) + '</span></div>';
  } else if (m.sport === 'volleyball') {
    scoreCenter = '<div class="score-center"><span>' + m.setsHome + ' : ' + m.setsAway + '</span><span class="timer ' + (m.status === 'live' ? 'live' : '') + '">' + formatTimeLeft(m) + '</span></div>';
  } else if (m.sport === 'ufc') {
    scoreCenter = '<div class="score-center"><span>— : —</span><span class="timer ' + (m.status === 'live' ? 'live' : '') + '">' + formatTimeLeft(m) + '</span></div>';
  } else {
    scoreCenter = '<div class="score-center"><span>' + m.scoreHome + ' : ' + m.scoreAway + '</span><span class="timer ' + (m.status === 'live' ? 'live' : '') + '">' + formatTimeLeft(m) + '</span></div>';
  }

  if (m.sport === 'football' && m.status !== 'countdown') {

      '<div>Красные<b>' + (m.redHome ? 1 : 0) + '-' + (m.redAway ? 1 : 0) + '</b></div>' +

    '</div>';
  }
  if (m.sport === 'hockey' && m.status !== 'countdown') {

      '<div>2-й<b>' + m.periodScores[1].h + ':' + m.periodScores[1].a + '</b></div>' +
      '<div>3-й<b>' + m.periodScores[2].h + ':' + m.periodScores[2].a + '</b></div>' +
      '<div>Броски<b>' + m.shotsHome + '-' + m.shotsAway + '</b></div>' +
      '<div>Удал.<b>' + (m.penaltyHome > 0 ? 1 : 0) + '-' + (m.penaltyAway > 0 ? 1 : 0) + '</b></div>' +

  }

  return '<div class="match-header">' +
    '<div class="crumbs">' + sName(m.sport) + ' / ' + escapeHtml(m.league) + '</div>' +
    '<div class="league-line"><span>' + escapeHtml(m.league) + '</span><span class="updown">⇅</span></div>' +

    '<div class="score-line">' +

function renderMarketTabs(m) {
  var tabs = [
    {key: 'popular', label: 'Популярное'},
    {key: 'match', label: 'Матч'},
    {key: 'stats', label: 'Показатели'}
  ];
  var html = '<div class="market-tabs"><div class="market-tabs-inner">';

  });

function renderMarketsBody(m) {
  if (STATE.currentMarketTab === 'popular') return renderMarketsPopular(m);
  if (STATE.currentMarketTab === 'match') return renderMarketsMatch(m);
  if (STATE.currentMarketTab === 'stats') return renderMarketsStats(m);
  return '';
}

/* ============ MARKET: POPULAR ============ */
function renderMarketsPopular(m) {
  var html = '';
  var odds = computeOdds(m);
  var isTwo = (m.sport === 'ufc' || m.sport === 'volleyball');

  html += renderMarketCard('Исход',
    isTwo
      ? '<div class="odds-grid-2">' +
          renderOddBtn(m, 'home', 'П1', odds.home) +
          renderOddBtn(m, 'away', 'П2', odds.away) +
        '</div>'
      : '<div class="odds-grid-3">' +
          renderOddBtn(m, 'home', '1', odds.home) +
          renderOddBtn(m, 'draw', 'X', odds.draw) +
          renderOddBtn(m, 'away', '2', odds.away) +
        '</div>'
  );

  // Двойной шанс для футбола/хоккея
  if (!isTwo) {
    var p1x = odds.home && odds.draw ? (1 / odds.home + 1 / odds.draw) : null;
    var p12 = odds.home && odds.away ? (1 / odds.home + 1 / odds.away) : null;
    var px2 = odds.draw && odds.away ? (1 / odds.draw + 1 / odds.away) : null;
    html += renderMarketCard('Двойной шанс',
      '<div class="odds-grid-3">' +
        renderOddBtn(m, '1X', '1X', p1x && p1x < 1 ? toOdd(1 - p1x, 0.04) : null) +
        renderOddBtn(m, '12', '12', p12 && p12 < 1 ? toOdd(1 - p12, 0.04) : null) +
        renderOddBtn(m, 'X2', 'X2', px2 && px2 < 1 ? toOdd(1 - px2, 0.04) : null) +
      '</div>'
    );
  }

  // Итоговая победа (без ничьей) — для футбола/хоккея
  if (m.sport === 'football' || m.sport === 'hockey') {
    var pH = odds.home ? 1 / odds.home : 0;
    var pA = odds.away ? 1 / odds.away : 0;
    var tot = pH + pA || 1;
    var oddH = toOdd(pH / tot, 0.06);
    var oddA = toOdd(pA / tot, 0.06);
    html += renderMarketCard('Итоговая победа (без ничьей)',
      '<div class="odds-grid-2">' +
        renderOddBtn(m, 'win_home', escapeHtml(m.home), oddH) +
        renderOddBtn(m, 'win_away', escapeHtml(m.away), oddA) +
      '</div>'
    );
  }

  // Для футбола/хоккея — тоталы и форы
  if (m.sport === 'football' || m.sport === 'hockey') {
    html += renderMarketTotalGoals(m);
    html += renderMarketHandicap(m);
  }

  // Для UFC — раунды и метод
  if (m.sport === 'ufc') {
    html += renderUFCMarkets(m);
  }

  // Для волейбола — сеты и счёт
  if (m.sport === 'volleyball') {
    html += renderVolleyballMarkets(m);
  }

  return html;
}

/* ============ MARKET: MATCH (все рынки) ============ */
function renderMarketsMatch(m) {
  var html = '';
  var odds = computeOdds(m);
  var isTwo = (m.sport === 'ufc' || m.sport === 'volleyball');

  html += renderMarketCard('Основные',
    isTwo
      ? '<div class="odds-grid-2">' +
          renderOddBtn(m, 'home', 'П1', odds.home) +
          renderOddBtn(m, 'away', 'П2', odds.away) +
        '</div>'
      : '<div class="odds-grid-3">' +
          renderOddBtn(m, 'home', '1', odds.home) +
          renderOddBtn(m, 'draw', 'X', odds.draw) +
          renderOddBtn(m, 'away', '2', odds.away) +
        '</div>'
  );

  if (m.sport === 'football' || m.sport === 'hockey') {
    html += renderMarketTotalGoals(m);
    html += renderMarketHandicap(m);
    html += renderFootballAllTotals(m);
  }

  if (m.sport === 'ufc') {
    html += renderUFCMarkets(m);
  }

  if (m.sport === 'volleyball') {
    html += renderVolleyballMarkets(m);
  }

  return html;
}

/* ============ UFC MARKETS ============ */
function renderUFCMarkets(m) {
  var html = '';
  var extras = computeUFCExtras(m);
  var pH = ufcProbHome(m);
  var pA = 1 - pH;

  // Метод победы
  html += renderMarketCard('Метод победы',
    '<div class="odds-grid-3">' +
      renderExtrasOdd('KO/TKO', extras) +
      renderExtrasOdd('Сабмишн', extras) +
      renderExtrasOdd('Решение', extras) +
    '</div>' +
    '<div class="odds-grid-2" style="margin-top:6px">' +
      renderExtrasOdd('Бой досрочно', extras) +
      renderExtrasOdd('Вся дистанция', extras) +
    '</div>'
  );

  // Тотал раундов
  var totalsHtml = '<div class="odds-grid-2">';
  ['ТБ 1.5 раундов', 'ТБ 2.5 раундов', 'ТБ 3.5 раундов', 'ТБ 4.5 раундов'].forEach(function(l) {
    if (extras[l]) {
      totalsHtml += '<div style="display:flex;gap:6px;width:100%">' +
        '<div style="flex:1">' + renderExtrasOdd(l, extras) + '</div>' +
        '<div style="flex:1">' + renderExtrasOdd(l.replace('ТБ', 'ТМ'), extras) + '</div>' +
      '</div>';
    }
  });
  totalsHtml += '</div>';
  if (totalsHtml.indexOf('odd-btn') > -1 || totalsHtml.indexOf('коэф') > -1) {
    html += renderMarketCard('Тотал раундов', totalsHtml);
  }

  // Победа + метод
  html += renderMarketCard('Победа и метод',
    '<div class="odds-labeled">' +
      '<div><div class="col-head">' + escapeHtml(m.home) + '</div>' +
        '<div class="odds-grid-3" style="grid-template-columns:1fr;gap:6px">' +
          renderExtrasOdd(m.home + ' KO/TKO', extras) +
          renderExtrasOdd(m.home + ' Сабмишн', extras) +
          renderExtrasOdd(m.home + ' Решение', extras) +
        '</div>' +
      '</div>' +
      '<div><div class="col-head">' + escapeHtml(m.away) + '</div>' +
        '<div class="odds-grid-3" style="grid-template-columns:1fr;gap:6px">' +
          renderExtrasOdd(m.away + ' KO/TKO', extras) +
          renderExtrasOdd(m.away + ' Сабмишн', extras) +
          renderExtrasOdd(m.away + ' Решение', extras) +
        '</div>' +
      '</div>' +
    '</div>'
  );

  return html;
}

function renderExtrasOdd(label, extras) {
  var o = extras[label];
  if (!isValid(o)) return '<div class="odd-btn disabled"><span class="lbl">' + escapeHtml(label) + '</span><span class="val">—</span></div>';
  return '<button class="odd-btn" data-pick="extras|' + encodeURIComponent(label) + '" data-odd="' + o + '">' +
    '<span class="lbl">' + escapeHtml(label) + '</span>' +
    '<span class="val">' + o.toFixed(2) + '</span>' +
  '</button>';
}

/* ============ VOLLEYBALL MARKETS ============ */
function renderVolleyballMarkets(m) {
  var html = '';
  var extras = computeVolleyballExtras(m);

  // Тотал сетов
  var t1 = '';
  ['ТБ 3.5 сетов', 'ТМ 3.5 сетов', 'ТБ 4.5 сетов', 'ТМ 4.5 сетов'].forEach(function(l) {
    if (extras[l]) t1 += renderExtrasOdd(l, extras);
  });
  if (t1) html += renderMarketCard('Тотал сетов', '<div class="odds-grid-2">' + t1 + '</div>');

  // Точный счёт
  var t2 = '';
  ['Счёт 3:0', 'Счёт 3:1', 'Счёт 3:2', 'Счёт 0:3', 'Счёт 1:3', 'Счёт 2:3'].forEach(function(l) {
    if (extras[l]) t2 += renderExtrasOdd(l, extras);
  });
  if (t2) html += renderMarketCard('Точный счёт', '<div class="odds-grid-3">' + t2 + '</div>');

  // Победа в сете
  var t3 = '';
  ['Победа в сете · П1', 'Победа в сете · П2'].forEach(function(l) {
    if (extras[l]) t3 += renderExtrasOdd(l, extras);
  });
  if (t3) html += renderMarketCard('Победа в текущем сете', '<div class="odds-grid-2">' + t3 + '</div>');

  return html;
}

/* ============ TOTAL GOALS (селектор) ============ */
function renderMarketTotalGoals(m) {
  var lines = m.sport === 'football' ? [1.5, 2, 2.5, 3, 3.5, 4] : [3.5, 4, 4.5, 5, 5.5, 6];
  var curLine = STATE.currentLine[m.id + '_tot'] || 2.5;
  if (lines.indexOf(curLine) < 0) curLine = lines[2];

  var pOver;
  if (m.sport === 'football') pOver = footballTotalOverProb(m, curLine);
  else pOver = hockeyTotalOverProb(m, curLine);
  pOver = clamp(pOver, 0.02, 0.98);

  return renderMarketCard('Тотал голов',
    '<div class="line-selector">' +
      lines.map(function(l) {
        var active = Math.abs(l - curLine) < 0.01 ? ' active' : '';
        return '<div class="line-opt' + active + '" data-total-line="' + l + '">' + l + '</div>';
      }).join('') +
    '</div>' +
    '<div class="odds-grid-2">' +
      renderOddBtn(m, 'tot_over_' + curLine, 'Больше ' + curLine, toOdd(pOver, 0.05)) +
      renderOddBtn(m, 'tot_under_' + curLine, 'Меньше ' + curLine, toOdd(1 - pOver, 0.05)) +
    '</div>'
  );
}

/* ============ HANDICAP (селектор) ============ */
function renderMarketHandicap(m) {
  var lines = m.sport === 'football' ? [0, 0.5, 1, 1.5, 2] : [0, 0.5, 1, 1.5, 2];
  var curLine = STATE.currentLine[m.id + '_hcp'] || 1.5;
  var pH = m.sport === 'football'
    ? footballHandicapProb(m, -curLine, 'home')
    : hockeyHandicapProb(m, -curLine, 'home');
  pH = clamp(pH, 0.05, 0.95);

  return renderMarketCard('Исход с учётом форы',
    '<div class="line-selector">' +
      lines.map(function(l) {
        var active = Math.abs(l - curLine) < 0.01 ? ' active' : '';
        return '<div class="line-opt' + active + '" data-hcp-line="' + l + '">' + l + '</div>';
      }).join('') +
    '</div>' +
    '<div class="odds-labeled">' +
      '<div><div class="col-head">' + escapeHtml(m.home) + '</div>' + renderOddBtn(m, 'hcp_home_' + curLine, 'Ф1 (-' + curLine + ')', toOdd(pH, 0.05)) + '</div>' +
      '<div><div class="col-head">' + escapeHtml(m.away) + '</div>' + renderOddBtn(m, 'hcp_away_' + curLine, 'Ф2 (+' + curLine + ')', toOdd(1 - pH, 0.05)) + '</div>' +
    '</div>'
  );
}

/* ============ ВСЕ ТОТАЛЫ ФУТБОЛА ============ */
function renderFootballAllTotals(m) {
  var totalCur = m.scoreHome + m.scoreAway;
  var html = '<div class="odds-grid-2">';
  [0.5, 1.5, 2.5, 3.5, 4.5, 5.5].forEach(function(l) {
    if (l > totalCur) {
      var pO = footballTotalOverProb(m, l);
      html += renderOddBtn(m, 'fall_over_' + l, 'ТБ ' + l, toOdd(pO, 0.05));
      html += renderOddBtn(m, 'fall_under_' + l, 'ТМ ' + l, toOdd(1 - pO, 0.05));
    }
  });
  html += '</div>';
  return renderMarketCard('Все тоталы', html);
}

/* ============ MARKET CARD ============ */
function renderMarketCard(title, bodyHtml) {
  var key = title;
  var isOpen = STATE.openMarkets[key] !== false;
  var starActive = STATE.favorites[key] ? ' active' : '';
  return '<div class="market-card' + (isOpen ? '' : ' collapsed') + '">' +
    '<div class="market-head" data-toggle-market="' + escapeHtml(key) + '">' +
      '<span class="star' + starActive + '" data-star-market="' + escapeHtml(key) + '">★</span>' +
      '<span class="title">' + escapeHtml(title) + '</span>' +
      '<span class="chevron">▲</span>' +
    '</div>' +
    '<div class="market-body">' + bodyHtml + '</div>' +
  '</div>';
}

function renderOddBtn(m, pick, label, odd) {
  if (!isValid(odd)) return '<div class="odd-btn disabled"><span class="lbl">' + escapeHtml(label) + '</span><span class="val">—</span></div>';
  var isSel = isInCoupon(m.id, pick);
  return '<button class="odd-btn' + (isSel ? ' selected' : '') + '" data-match-id="' + m.id + '" data-pick="' + escapeHtml(pick) + '" data-odd="' + odd + '">' +
    '<span class="lbl">' + escapeHtml(label) + '</span>' +
    '<span class="val">' + odd.toFixed(2) + '</span>' +
  '</button>';
}

/* ============ STATS TAB ============ */
function renderMarketsStats(m) {
  var params = [
    {key: 'fouls', label: 'Фолы'},
    {key: 'corners', label: 'Угловые'},
    {key: 'cards', label: 'Жёлтые'},
    {key: 'shots', label: 'Удары'},
    {key: 'ontarget', label: 'В створ'},
    {key: 'offsides', label: 'Офсайды'}
  ];
  var html = '<div class="stat-params">';
  params.forEach(function(p) {
    var active = STATE.currentStatParam === p.key ? ' active' : '';
    html += '<button class="stat-param' + active + '" data-stat-param="' + p.key + '">' + p.label + '</button>';
  });
  html += '</div>';

  var cntH = 0, cntA = 0, lbl = '';
  if (STATE.currentStatParam === 'fouls') { cntH = m.foulsHome || 0; cntA = m.foulsAway || 0; lbl = 'ФОЛЫ'; }
  if (STATE.currentStatParam === 'corners') { cntH = m.cornersHome || 0; cntA = m.cornersAway || 0; lbl = 'УГЛОВЫЕ'; }
  if (STATE.currentStatParam === 'cards') { cntH = m.cardsHome || 0; cntA = m.cardsAway || 0; lbl = 'ЖЁЛТЫЕ'; }
  if (STATE.currentStatParam === 'shots') { cntH = m.shotsHome || 0; cntA = m.shotsAway || 0; lbl = 'УДАРЫ'; }
  if (STATE.currentStatParam === 'ontarget') { cntH = m.shotsOnTargetHome || 0; cntA = m.shotsOnTargetAway || 0; lbl = 'В СТВОР'; }
  if (STATE.currentStatParam === 'offsides') { cntH = m.offsidesHome || 0; cntA = m.offsidesAway || 0; lbl = 'ОФСАЙДЫ'; }

  html += '<div class="stat-counter">' +
    '<div class="cnt-h">' + cntH + '</div>' +
    '<div class="lbl">' + lbl + '</div>' +
    '<div class="cnt-a">' + cntA + '</div>' +
  '</div>';

  // Исход по показателю
  var pH = cntH + cntA > 0 ? (cntH + 0.5) / (cntH + cntA + 1) : 0.5;
  var pD = cntH + cntA > 0 ? 0.20 / (1 + cntH + cntA) : 0.18;
  var pH1 = pH * (1 - pD);
  var pA1 = (1 - pH) * (1 - pD);

  html += renderMarketCard('Исход · ' + lbl.toLowerCase(),
    '<div class="odds-grid-3">' +
      renderOddBtn(m, 'stat_home', '1', toOdd(pH1, 0.07)) +
      renderOddBtn(m, 'stat_draw', 'X', toOdd(pD, 0.07)) +
      renderOddBtn(m, 'stat_away', '2', toOdd(pA1, 0.07)) +
    '</div>'
  );

  // Тотал показателя с селектором
  var lines = getStatLines(STATE.currentStatParam);
  var curLine = STATE.currentLine[m.id + '_stat_' + STATE.currentStatParam] || lines[1];
  var now = cntH + cntA;
  var minPlayed = Math.max(1, m.minute);
  var rate = now > 0 ? (now / minPlayed) * 90 : (STATE.currentStatParam === 'fouls' ? 24 : STATE.currentStatParam === 'corners' ? 10 : STATE.currentStatParam === 'cards' ? 4 : STATE.currentStatParam === 'shots' ? 22 : STATE.currentStatParam === 'ontarget' ? 8 : 4);
  var rem = m.maxMinute - m.minute;
  var expected = now + (rate * (rem / 90));
  var sigma = Math.max(1, Math.sqrt(expected * 0.35));

  html += renderMarketCard('Тотал · ' + lbl.toLowerCase(),
    '<div class="line-selector">' +
      lines.map(function(l) {
        var active = Math.abs(l - curLine) < 0.01 ? ' active' : '';
        return '<div class="line-opt' + active + '" data-stat-line="' + l + '">' + l + '</div>';
      }).join('') +
    '</div>' +
    (function() {
      if (now >= curLine) return '<div class="odds-grid-2"><div class="odd-btn" style="background:#f8f9fc"><span class="lbl">Линия пройдена</span><span class="val">' + now + '&gt;' + curLine + '</span></div></div>';
      var z = (curLine - expected) / sigma;
      var pOver = clamp(1 - normalCDF(z), 0.05, 0.95);
      return '<div class="odds-grid-2">' +
        renderOddBtn(m, 'stat_over_' + curLine, 'Больше', toOdd(pOver, 0.06)) +
        renderOddBtn(m, 'stat_under_' + curLine, 'Меньше', toOdd(1 - pOver, 0.06)) +
      '</div>';
    })()
  );

  return html;
}

function getStatLines(param) {
  if (param === 'fouls') return [20.5, 22.5, 24.5, 26.5];
  if (param === 'corners') return [6.5, 8.5, 10.5, 12.5];
  if (param === 'cards') return [1.5, 2.5, 3.5, 4.5];
  if (param === 'shots') return [18.5, 22.5, 26.5, 30.5];
  if (param === 'ontarget') return [6.5, 8.5, 10.5, 12.5];
  if (param === 'offsides') return [1.5, 2.5, 3.5, 4.5];
  return [1.5, 2.5, 3.5];
}

function isInCoupon(mid, pick) {
  return STATE.wallet.coupon.some(function(c) { return c.matchId === mid && c.pick === pick; });
}
function findMatch(id) {
  for (var i = 0; i < STATE.matches.length; i++) if (STATE.matches[i].id === id) return STATE.matches[i];
  return null;
}
function addToCouponFromCell(mid, pick) {
  var m = findMatch(mid);
  if (!m) return;
  var odds = computeOdds(m);
  var odd = odds[pick];
  if (!isValid(odd)) return;
  addToCouponFull(mid, pick, odd);
}

function addToCouponFull(mid, pick, odd) {
  var m = findMatch(mid);
  if (!m) return;
  if (m.status === 'finished') return;
  if (isInCoupon(mid, pick)) {
    STATE.wallet.coupon = STATE.wallet.coupon.filter(function(c) { return !(c.matchId === mid && c.pick === pick); });
  } else {
    STATE.wallet.coupon = STATE.wallet.coupon.filter(function(c) { return c.matchId !== mid; });
    var pickLabel = pickToLabel(m, pick);
    STATE.wallet.coupon.push({
      matchId: mid, pick: pick, odd: odd,
      matchName: m.home + ' – ' + m.away,
      pickLabel: pickLabel,
      score: m.sport === 'volleyball' ? (m.setsHome + ':' + m.setsAway) : ((m.scoreHome || 0) + ':' + (m.scoreAway || 0))
    });
  }
  saveWallet();
  renderFloatingCoupon();
  renderTabBar();
  if (STATE.screen === 'main') renderMainScreen();
  else if (STATE.screen === 'match') renderMatchScreen();
  if ($('couponPanel').classList.contains('active')) renderCouponBody();
}

function pickToLabel(m, pick) {
  if (pick === 'home') return m.home;
  if (pick === 'away') return m.away;
  if (pick === 'draw') return 'Ничья';
  if (pick === '1X') return '1X';
  if (pick === '12') return '12';
  if (pick === 'X2') return 'X2';
  if (pick === 'win_home') return 'Победа ' + m.home;
  if (pick === 'win_away') return 'Победа ' + m.away;
  if (pick.indexOf('tot_over_') === 0) return 'Больше ' + pick.split('_')[2];
  if (pick.indexOf('tot_under_') === 0) return 'Меньше ' + pick.split('_')[2];
  return pick;
}

function placeCouponBet() {
  var c = STATE.wallet.coupon;
  if (!c.length) return;
  var stake = parseFloat(($('couponStakeInput') || {}).value) || 0;
  if (stake < 30) { toast('lose', '⚠️', 'Минимум 30 ₽'); return; }
  if (stake > STATE.wallet.balance) { toast('lose', '⚠️', 'Недостаточно средств'); return; }
  var totalOdd = c.reduce(function(a, b) { return a * b.odd; }, 1);
  STATE.wallet.bets.unshift({
    id: Date.now(),
    type: c.length === 1 ? 'single' : 'express',
    selections: c.slice(),
    matchName: c.length === 1 ? c[0].matchName : ('Экспресс · ' + c.length),
    odd: totalOdd, stake: stake,
    potential: Math.round(stake * totalOdd * 100) / 100,
    status: 'pending',
    createdAt: new Date().toISOString()
  });
  STATE.wallet.balance -= stake;
  STATE.wallet.totalBet += stake;
  STATE.wallet.coupon = [];
  saveWallet();
  toast('info', '📋', 'Ставка принята · ' + fmt(stake) + ' ₽');

/* ============ СОЗДАНИЕ МАТЧЕЙ ============ */
function createInitialMatches() {
  STATE.matches = [];
  STATE.nextId = 1;
  STATE.usedPairs = {};
  // 12 футбола
  for (var i = 0; i < 12; i++) STATE.matches.push(newFootball());
  // 8 хоккея
  for (var j = 0; j < 8; j++) STATE.matches.push(newHockey());
  // 5 волейбола
  for (var k = 0; k < 5; k++) STATE.matches.push(newVolleyball());
  // 5 UFC
  for (var l = 0; l < 5; l++) STATE.matches.push(newUFC());
  // перемешаем
  for (var q = STATE.matches.length - 1; q > 0; q--) {
    var r = Math.floor(Math.random() * (q + 1));
    var t = STATE.matches[q]; STATE.matches[q] = STATE.matches[r]; STATE.matches[r] = t;
  }
  // проматываем немного
  STATE.matches.forEach(function(m) {
    var skip = rand(3, 30);
    for (var ii = 0; ii < skip && m.status === 'live'; ii++) {
      try { tickMatch(m); } catch (e) {}
    }
  });
}

/* ============ ГЛАВНЫЙ ЦИКЛ ============ */
var tickCounter = 0;
function tick() {
  tickCounter++;
  for (var i = 0; i < STATE.matches.length; i++) {
    var m = STATE.matches[i];
    if (m.status === 'live' || m.status === 'countdown') {
      try { tickMatch(m); }
      catch (e) { console.error('tick err', m.id, e); m.status = 'finished'; }
    }
  }
  // завершение
  for (var j = 0; j < STATE.matches.length; j++) {
    var m2 = STATE.matches[j];
    if (m2.status === 'finished' && !m2.countdownStarted) {
      m2.finishedAt = m2.finishedAt || Date.now();
      if (Date.now() - m2.finishedAt > 5000) {
        m2.countdownStarted = true;
        m2.status = 'countdown';
        m2.countdownLeft = 45;
        m2.startTime = Date.now() + rand(15 * 60, 6 * 3600) * 1000;
      }
    }
  }
  // новые матчи
  var liveCnt = STATE.matches.filter(function(mm) { return mm.status === 'live' || mm.status === 'countdown'; }).length;
  if (liveCnt < 25) {
    var cnt = {football: 0, hockey: 0, volleyball: 0, ufc: 0};
    STATE.matches.forEach(function(mm) {
      if ((mm.status === 'live' || mm.status === 'countdown') && cnt[mm.sport] !== undefined) cnt[mm.sport]++;
    });
    var targets = {football: 12, hockey: 8, volleyball: 5, ufc: 5};
    ['football', 'hockey', 'volleyball', 'ufc'].forEach(function(sp) {
      if (cnt[sp] < targets[sp]) {
        var need = Math.min(targets[sp] - cnt[sp], 2);
        for (var n = 0; n < need; n++) {
          if (sp === 'football') STATE.matches.push(newFootball());
          else if (sp === 'hockey') STATE.matches.push(newHockey());
          else if (sp === 'volleyball') STATE.matches.push(newVolleyball());
          else STATE.matches.push(newUFC());
        }
      }
    });
  }
  if (STATE.matches.length > 35) STATE.matches = STATE.matches.slice(0, 35);

  if (tickCounter % 2 === 0) {
    if (STATE.screen === 'main') renderMainScreen();
    else if (STATE.screen === 'match' && STATE.currentMatch) {
      var m3 = findMatch(STATE.currentMatch.id);
      if (m3) {
        STATE.currentMatch = m3;
        if (tickCounter % 6 === 0) renderMatchScreen();
      }
    }
  }
}

/* ============ СТАРТ ============ */
function init() {
  initWallet();
  createInitialMatches();
  renderApp();

  var co = $('couponOverlay');
  if (co) co.addEventListener('click', closeCoupon);
  var cc = $('couponClose');
  if (cc) cc.addEventListener('click', closeCoupon);

  document.querySelectorAll('.ct').forEach(function(t) {
    t.addEventListener('click', function() {
      document.querySelectorAll('.ct').forEach(function(x) { x.classList.remove('active'); });
      this.classList.add('active');
    });
  });

  setInterval(tick, 1000);
  console.log('✅ OpenBet запущен — ' + STATE.matches.length + ' матчей');
}
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
