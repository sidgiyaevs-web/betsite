<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Gravitas — a gravity sandbox in your browser</title>
<meta name="description" content="Fling planets, collide galaxies, solve the three-body problem. A zero-dependency N-body gravity sandbox in one HTML file.">
<meta property="og:title" content="Gravitas — gravity sandbox">
<meta property="og:description" content="Fling planets, collide galaxies, solve the three-body problem. One HTML file, zero dependencies.">
<meta name="theme-color" content="#05061a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2222%22 fill=%22%23ffc857%22/><circle cx=%2284%22 cy=%2232%22 r=%2210%22 fill=%22%236ee7f2%22/></svg>">
<style>
:root{--bg:#05061a;--ink:#eceaff;--mute:#8f8bc4;--panel:rgba(18,16,58,.72);--line:rgba(236,234,255,.16);--hot:#ff5c8a;--sun:#ffc857;--ice:#6ee7f2;
--font:'Avenir Next','Segoe UI',system-ui,-apple-system,Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{pointer-events:none}
.top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:max(16px,env(safe-area-inset-top)) 18px 0;gap:12px;pointer-events:none}
.brand h1{font-size:1.5rem;font-weight:800;letter-spacing:-.03em}
.brand h1 span{background:linear-gradient(100deg,var(--hot),var(--sun),var(--ice));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand p{color:var(--mute);font-size:.85rem;margin-top:2px}
.star{pointer-events:auto;text-decoration:none;color:var(--ink);background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);padding:9px 16px;border-radius:99px;font-weight:700;font-size:.9rem;white-space:nowrap;transition:border-color .2s,transform .2s}
.star:hover{border-color:var(--sun);transform:translateY(-2px)}
.star b{color:var(--sun)}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));width:min(960px,calc(100% - 20px));background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.dock button{font:inherit;font-size:.9rem;font-weight:700;color:var(--ink);background:rgba(236,234,255,.07);border:1px solid var(--line);padding:9px 14px;border-radius:12px;cursor:pointer;transition:background .2s,border-color .2s,transform .15s}
.dock button:hover{background:rgba(236,234,255,.16);transform:translateY(-1px)}
.dock button.on{border-color:var(--ice);color:var(--ice)}
.dock button:focus-visible,.star:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.sep{width:1px;height:26px;background:var(--line)}
.mass{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--mute);font-weight:700}
.mass input{width:110px;accent-color:var(--hot)}
.mass output{min-width:44px;color:var(--ink);text-align:left}
.hud{position:fixed;left:18px;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 118px);color:var(--mute);font-size:.8rem;pointer-events:none;line-height:1.5}
.hint{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);text-align:center;color:var(--ink);pointer-events:none;transition:opacity 1s;font-size:1.05rem;text-shadow:0 2px 20px #000}
.hint small{display:block;color:var(--mute);margin-top:6px;font-size:.85rem}
@media(max-width:640px){.brand p{display:none}.hud{display:none}.sep{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="ui"></canvas>

<div class="top">
  <div class="brand"><h1><span>Gravitas</span></h1><p>Drag anywhere to launch a body</p></div>
  <a class="star" href="https://github.com/YOUR_NAME/gravitas" target="_blank" rel="noopener"><b>★</b> Star on GitHub</a>
</div>

<div class="hint" id="hint">Click and drag to fling a planet<small>The longer the drag, the faster it flies</small></div>
<div class="hud" id="hud"></div>

<div class="dock" role="toolbar" aria-label="Controls">
  <button data-p="solar" class="on">Solar system</button>
  <button data-p="fig8">Figure-8</button>
  <button data-p="galaxy">Galaxy</button>
  <button data-p="collide">Collision</button>
  <span class="sep"></span>
  <button id="pause">Pause</button>
  <button id="trails" class="on">Trails</button>
  <button id="speed">1×</button>
  <button id="clear">Clear</button>
  <button id="shot">Save PNG</button>
  <span class="sep"></span>
  <label class="mass">Mass <input id="ms" type="range" min="0" max="100" value="33"><output id="mo"></output></label>
</div>

<script>
(function(){
'use strict';
var cv=document.getElementById('c'),ctx=cv.getContext('2d'),uc=document.getElementById('ui'),uctx=uc.getContext('2d');
var DPR=Math.min(window.devicePixelRatio||1,2),W=0,H=0;
var G=1,k=4,dt=.02,eps2=.01,rk=.3,vf=.2,speed=1,paused=false,trails=true,preset='solar';
var B=[];           // bodies
var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

function resize(){
  W=innerWidth;H=innerHeight;
  [cv,uc].forEach(function(c){c.width=W*DPR;c.height=H*DPR});
  ctx.setTransform(DPR,0,0,DPR,0,0);uctx.setTransform(DPR,0,0,DPR,0,0);
  wipe();
}
function wipe(){ctx.globalCompositeOperation='source-over';ctx.fillStyle='#05061a';ctx.fillRect(0,0,W,H)}
addEventListener('resize',resize);

/* ---------- bodies ---------- */
function mk(x,y,vx,vy,m){
  var heavy=m>=.5;
  return {x:x,y:y,vx:vx,vy:vy,m:m,h:heavy,r:heavy?rk*Math.cbrt(m):0,hue:heavy?Math.random()*360:0,dead:false};
}
function addDisk(cx,cy,bvx,bvy,M,n,r0,r1,dir){
  for(var i=0;i<n;i++){
    var r=r0+(r1-r0)*Math.sqrt(Math.random()),a=Math.random()*6.2832;
    var v=Math.sqrt(G*M/r)*(.96+Math.random()*.08)*dir;
    B.push(mk(cx+Math.cos(a)*r,cy+Math.sin(a)*r,bvx-Math.sin(a)*v,bvy+Math.cos(a)*v,.01));
  }
}
var PRESETS={
solar:function(){
  G=1;k=4;dt=.02;eps2=.01;rk=.3;vf=.2;
  B=[mk(0,0,0,0,1000)];B[0].hue=45;
  var R=[14,22,32,45,66,88,112],M=[.5,.8,1,.6,12,9,4];
  R.forEach(function(r,i){var a=Math.random()*6.2832,v=Math.sqrt(1000/r);
    B.push(mk(Math.cos(a)*r,Math.sin(a)*r,-Math.sin(a)*v,Math.cos(a)*v,M[i]))});
  addDisk(0,0,0,0,1000,160,50,59,1);
},
fig8:function(){
  G=1;k=170;dt=.004;eps2=1e-6;rk=.03;vf=1.4;
  var a=mk(.97000436,-.24308753,.466203685,.43236573,1),
      b=mk(-.97000436,.24308753,.466203685,.43236573,1),
      c=mk(0,0,-.93240737,-.86473146,1);
  a.hue=340;b.hue=190;c.hue=48;B=[a,b,c];
},
galaxy:function(){
  G=1;k=3.2;dt=.02;eps2=2;rk=.12;vf=.2;
  B=[mk(0,0,0,0,3000)];B[0].hue=45;
  addDisk(0,0,0,0,3000,1100,10,125,1);
},
collide:function(){
  G=1;k=2.6;dt=.02;eps2=2;rk=.12;vf=.2;
  var a=mk(-95,-25,3.2,.9,1600),b=mk(95,25,-3.2,-.9,1600);a.hue=330;b.hue=190;B=[a,b];
  addDisk(-95,-25,3.2,.9,1600,600,8,75,1);
  addDisk(95,25,-3.2,-.9,1600,600,8,75,-1);
}};
function load(name){
  preset=name;PRESETS[name]();
  document.querySelectorAll('[data-p]').forEach(function(b){b.classList.toggle('on',b.dataset.p===name)});
  wipe();
}

/* ---------- physics ---------- */
function step(h){
  var Hv=[],i,j,b,o;
  for(i=0;i<B.length;i++)if(B[i].h&&!B[i].dead)Hv.push(B[i]);
  for(i=0;i<B.length;i++){
    b=B[i];var ax=0,ay=0;
    for(j=0;j<Hv.length;j++){
      o=Hv[j];if(o===b)continue;
      var dx=o.x-b.x,dy=o.y-b.y,d2=dx*dx+dy*dy+eps2,f=G*o.m/(d2*Math.sqrt(d2));
      ax+=dx*f;ay+=dy*f;
    }
    b.vx+=ax*h;b.vy+=ay*h;
  }
  for(i=0;i<B.length;i++){b=B[i];b.x+=b.vx*h;b.y+=b.vy*h}
}
function collide(){
  var i,j,a,b;
  for(i=0;i<B.length;i++){
    a=B[i];if(!a.h||a.dead)continue;
    for(j=0;j<B.length;j++){
      b=B[j];if(b===a||b.dead)continue;
      if(b.h&&j<i)continue;
      var dx=a.x-b.x,dy=a.y-b.y,rr=a.r+(b.h?b.r:0);
      if(dx*dx+dy*dy<rr*rr){
        if(b.h){ // merge: conserve momentum, keep the heavier hue
          var m=a.m+b.m;
          if(b.m>a.m)a.hue=b.hue;
          a.vx=(a.vx*a.m+b.vx*b.m)/m;a.vy=(a.vy*a.m+b.vy*b.m)/m;
          a.x=(a.x*a.m+b.x*b.m)/m;a.y=(a.y*a.m+b.y*b.m)/m;
          a.m=m;a.r=rk*Math.cbrt(m);
        }else{a.m+=b.m;a.r=rk*Math.cbrt(a.m)}
        b.dead=true;
      }
    }
  }
  var out=[];
  for(i=0;i<B.length;i++){b=B[i];
    if(!b.dead&&Math.abs(b.x)<4000&&Math.abs(b.y)<4000)out.push(b)}
  B=out;
}

/* ---------- render ---------- */
function draw(){
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle=trails?'rgba(5,6,26,.14)':'#05061a';
  ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';
  var cx=W/2,cy=H/2,i,b,heavy=[];
  for(i=0;i<B.length;i++){
    b=B[i];var sx=cx+b.x*k,sy=cy+b.y*k;
    if(sx<-20||sy<-20||sx>W+20||sy>H+20)continue;
    if(b.h){heavy.push(b);continue}
    var sp=Math.sqrt(b.vx*b.vx+b.vy*b.vy);
    ctx.fillStyle='hsl('+(215-Math.min(sp*14,175))+',100%,'+(55+Math.min(sp*3,25))+'%)';
    ctx.fillRect(sx,sy,1.6,1.6);
  }
  for(i=0;i<heavy.length;i++){
    b=heavy[i];
    var x=cx+b.x*k,y=cy+b.y*k,r=Math.max(2.2,b.r*k);
    var g=ctx.createRadialGradient(x,y,0,x,y,r*3.4);
    g.addColorStop(0,'hsla('+b.hue+',100%,72%,.9)');
    g.addColorStop(.35,'hsla('+b.hue+',100%,60%,.28)');
    g.addColorStop(1,'hsla('+b.hue+',100%,50%,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*3.4,0,6.2832);ctx.fill();
    ctx.fillStyle='hsl('+b.hue+',100%,88%)';ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.fill();
  }
  ctx.globalCompositeOperation='source-over';
}

/* ---------- input: sling-shot ---------- */
var drag=null,massEl=document.getElementById('ms'),moEl=document.getElementById('mo');
function curMass(){return .3*Math.pow(10,massEl.value/33.3)}
function updMass(){var m=curMass();moEl.textContent=(m<10?m.toFixed(1):Math.round(m))}
massEl.addEventListener('input',updMass);updMass();

function ui(){
  uctx.clearRect(0,0,W,H);
  if(!drag)return;
  uctx.strokeStyle='rgba(110,231,242,.9)';uctx.lineWidth=2;uctx.setLineDash([6,6]);
  uctx.beginPath();uctx.moveTo(drag.x0,drag.y0);uctx.lineTo(drag.x1,drag.y1);uctx.stroke();
  uctx.setLineDash([]);uctx.fillStyle='#ffc857';
  uctx.beginPath();uctx.arc(drag.x0,drag.y0,Math.max(3,rk*Math.cbrt(curMass())*k),0,6.2832);uctx.fill();
}
uc.style.pointerEvents='none';
cv.addEventListener('pointerdown',function(e){
  cv.setPointerCapture(e.pointerId);
  drag={x0:e.clientX,y0:e.clientY,x1:e.clientX,y1:e.clientY};hideHint();
});
cv.addEventListener('pointermove',function(e){if(drag){drag.x1=e.clientX;drag.y1=e.clientY;ui()}});
function release(e){
  if(!drag)return;
  var wx=(drag.x0-W/2)/k,wy=(drag.y0-H/2)/k;
  // drag direction = launch direction
  var b=mk(wx,wy,(drag.x1-drag.x0)/k*vf,(drag.y1-drag.y0)/k*vf,curMass());
  B.push(b);drag=null;ui();
}
cv.addEventListener('pointerup',release);
cv.addEventListener('pointercancel',function(){drag=null;ui()});
cv.addEventListener('wheel',function(e){
  e.preventDefault();k*=e.deltaY<0?1.1:1/1.1;k=Math.max(.3,Math.min(k,600));wipe();
},{passive:false});

/* ---------- controls ---------- */
var hint=document.getElementById('hint');
function hideHint(){hint.style.opacity=0}
setTimeout(hideHint,9000);
document.querySelectorAll('[data-p]').forEach(function(b){b.addEventListener('click',function(){load(b.dataset.p)})});
var pb=document.getElementById('pause'),tb=document.getElementById('trails'),sb=document.getElementById('speed');
function togglePause(){paused=!paused;pb.textContent=paused?'Play':'Pause'}
function toggleTrails(){trails=!trails;tb.classList.toggle('on',trails);wipe()}
function cycleSpeed(){var s=[.25,.5,1,2,4],i=(s.indexOf(speed)+1)%s.length;speed=s[i];sb.textContent=speed+'×'}
function clearAll(){B=[];wipe()}
function save(){
  cv.toBlob(function(bl){var a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='gravitas.png';a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},2000)});
}
pb.onclick=togglePause;tb.onclick=toggleTrails;sb.onclick=cycleSpeed;
document.getElementById('clear').onclick=clearAll;document.getElementById('shot').onclick=save;
addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT')return;
  var key=e.key.toLowerCase();
  if(key===' '){e.preventDefault();togglePause()}
  else if(key==='c')clearAll();
  else if(key==='t')toggleTrails();
  else if(key==='s')save();
  else if(key==='r')load(preset);
  else if(key==='1')load('solar');
  else if(key==='2')load('fig8');
  else if(key==='3')load('galaxy');
  else if(key==='4')load('collide');
});

/* ---------- loop ---------- */
var hud=document.getElementById('hud'),last=performance.now(),acc=0,frames=0,fps=60,tHud=0;
function loop(t){
  var d=t-last;last=t;frames++;
  if(t-tHud>500){fps=Math.round(frames*1000/(t-tHud));frames=0;tHud=t;
    hud.innerHTML=B.length+' bodies · '+fps+' fps<br>Wheel: zoom · Space: pause · 1–4: presets · R: reset';}
  if(!paused){
    var n=Math.max(1,Math.round(3*speed)),h=dt*3*speed/n;
    for(var i=0;i<n;i++)step(h);
    collide();
  }
  draw();
  requestAnimationFrame(loop);
}
resize();load('solar');requestAnimationFrame(loop);
})();
</script>
</body>
</html>
