/* ---------- ФОРА 1 ---------- */
function oddsHand1(match, market, ctx){
  const {remain, lead} = ctx;
  const adjusted = match.hs + market.line - match.as;

  let pHome;
  if(adjusted > 0){
    pHome = clamp(0.5 + adjusted * 0.2 + (1 - remain) * 0.15, 0.03, 0.97);
  } else if(adjusted < 0){
    pHome = clamp(0.5 + adjusted * 0.2 + (1 - remain) * 0.15, 0.03, 0.97);
  } else {
    pHome = 0.5;
  }

  // Если фора уже накрыта — закрываем
  if(adjusted > 0 && remain < 0.15){
    return [1.00, 1.00];
  }

  const margin = 1.06;
  return [
    clamp(1 / pHome / margin, 1.02, 99),
    clamp(1 / (1 - pHome) / margin, 1.02, 99),
  ];
}

/* ---------- ФОРА 2 ---------- */
function oddsHand2(match, market, ctx){
  const {remain, lead} = ctx;
  const adjusted = match.as + market.line - match.hs;

  let pAway;
  if(adjusted > 0){
    pAway = clamp(0.5 + adjusted * 0.2 + (1 - remain) * 0.15, 0.03, 0.97);
  } else if(adjusted < 0){
    pAway = clamp(0.5 + adjusted * 0.2 + (1 - remain) * 0.15, 0.03, 0.97);
  } else {
    pAway = 0.5;
  }

  if(adjusted > 0 && remain < 0.15){
    return [1.00, 1.00];
  }

  const margin = 1.06;
  return [
    clamp(1 / pAway / margin, 1.02, 99),
    clamp(1 / (1 - pAway) / margin, 1.02, 99),
  ];
}

/* ---------- ЧЁТ / НЕЧЁТ ---------- */
function oddsParity(match, market, ctx){
  const {remain} = ctx;
  const total = match.hs + match.as;

  // Чем меньше времени — тем меньше вероятность изменений
  // Если счёт чётный и осталось мало — "Чёт" выигрывает с высокой вероятностью
  let pEven;
  if(remain < 0.1){
    pEven = (total % 2 === 0) ? 0.95 : 0.05;
  } else if(remain < 0.3){
    pEven = (total % 2 === 0) ? 0.75 : 0.25;
  } else if(remain < 0.6){
    pEven = (total % 2 === 0) ? 0.6 : 0.4;
  } else {
    pEven = 0.5;
  }

  const margin = 1.06;
  return [
    clamp(1 / pEven / margin, 1.02, 99),
    clamp(1 / (1 - pEven) / margin, 1.02, 99),
  ];
}

/* ---------- ТОЧНЫЙ СЧЁТ ---------- */
function oddsExact(match, market, ctx){
  const {g, remain} = ctx;
  const currentScore = `${match.hs}:${match.as}`;

  // Если текущий счёт совпадает с одним из вариантов — шанс растёт
  return market.lbl.map((lbl, i) => {
    let baseOdds = market.val[i];

    if(lbl === currentScore){
      // Счёт уже такой — вероятность сохраниться растёт с временем
      baseOdds = 1.05 + remain * 3;
    } else {
      // Иначе растёт с временем
      baseOdds = baseOdds * (0.9 + remain * 0.5);
    }

    return clamp(baseOdds, 1.02, 99);
  });
}

/* ---------- ПЕРВЫЙ ГОЛ ---------- */
function oddsFirstGoal(match, market, ctx){
  const {remain} = ctx;
  const already = match.events.some(e => e.type === 'GOAL');

  if(already){
    // Рынок закрыт — был гол
    market.closed = [true, true, true];
    market.result = 'win';
    return [1.00, 1.00, 1.00];
  }

  // Чем меньше времени — тем выше шанс "без гола"
  const pH = clamp(0.5 + (match.stats.possession.h - 50) / 200, 0.2, 0.8);
  const pA = 1 - pH - (0.02 + remain * 0.03);

  const margin = 1.06;
  return [
    clamp(1 / pH / margin, 1.02, 99),
    clamp(1 / Math.max(pA, 0.05) / margin, 1.02, 99),
    clamp(1 / (0.02 + remain * 0.03) / margin, 1.02, 99),
  ];
}

/* ---------- УГЛОВЫЕ ---------- */
function oddsCorners(match, market, ctx){
  const {g, remain} = ctx;
  const current = match.stats.corners.h + match.stats.corners.a;
  const rate = 0.12;  // угловых в минуту
  const proj = current + (match.gameDuration - g) * rate;
  const diff = proj - market.line;

  let pOver = 1 / (1 + Math.exp(-diff * 1.2));
  pOver = clamp(pOver, 0.03, 0.97);

  if(current > market.line){
    return [1.00, 1.00];
  }

  const margin = 1.06;
  return [
    clamp(1 / pOver / margin, 1.02, 99),
    clamp(1 / (1 - pOver) / margin, 1.02, 99),
  ];
}

/* ---------- КАРТОЧКИ / УДАЛЕНИЯ ---------- */
function oddsCards(match, market, ctx){
  const {g, remain} = ctx;
  const current = match.stats.yellow.h + match.stats.yellow.a +
                  (match.stats.red.h + match.stats.red.a) * 2;
  const rate = 0.06;
  const proj = current + (match.gameDuration - g) * rate;
  const diff = proj - market.line;

  let pOver = 1 / (1 + Math.exp(-diff * 1.0));
  pOver = clamp(pOver, 0.03, 0.97);

  if(current > market.line){
    return [1.00, 1.00];
  }

  const margin = 1.06;
  return [
    clamp(1 / pOver / margin, 1.02, 99),
    clamp(1 / (1 - pOver) / margin, 1.02, 99),
  ];
}

/* ---------- БРОСКИ (хоккей) ---------- */
function oddsShots(match, market, ctx){
  const {g, remain} = ctx;
  const current = match.stats.shots.h + match.stats.shots.a;
  const rate = 0.35;  // бросков в минуту
  const proj = current + (match.gameDuration - g) * rate;
  const diff = proj - market.line;

  let pOver = 1 / (1 + Math.exp(-diff * 0.8));
  pOver = clamp(pOver, 0.03, 0.97);

  const margin = 1.06;
  return [
    clamp(1 / pOver / margin, 1.02, 99),
    clamp(1 / (1 - pOver) / margin, 1.02, 99),
  ];
}

/* ---------- МЕТОД ПОБЕДЫ (UFC) ---------- */
function oddsMethod(match, market, ctx){
  const {remain} = ctx;
  const current = match.hs + match.as;

  // Чем больше раундов прошло — тем выше шанс решения
  const pDecision = 0.3 + (1 - remain) * 0.5;
  const pKO = (1 - pDecision) * 0.6;
  const pSub = (1 - pDecision) * 0.4;

  const margin = 1.06;
  return [
    clamp(1 / Math.max(pKO, 0.02) / margin, 1.02, 99),
    clamp(1 / Math.max(pSub, 0.02) / margin, 1.02, 99),
    clamp(1 / Math.max(pDecision, 0.02) / margin, 1.02, 99),
  ];
}

/* ---------- РАУНД ПОБЕДЫ (UFC) ---------- */
function oddsRound(match, market, ctx){
  const {remain} = ctx;
  const elapsed = 1 - remain;

  // Чем дольше идёт бой — тем меньше шанс что победа в 1-м раунде
  return market.lbl.map((lbl, i) => {
    const roundNum = i + 1;
    let p;
    if(roundNum === 1){
      p = 0.35 * remain + 0.05;
    } else if(roundNum === 2){
      p = 0.25 * remain + 0.08;
    } else if(roundNum === 3){
      p = 0.20 * remain + 0.10;
    } else if(roundNum === 4){
      p = 0.15 * remain + 0.15;
    } else {
      p = 0.10 * remain + 0.20;
    }

    // Нормализация
    const total = 0.85;
    p = p / total;

    const margin = 1.08;
    return clamp(1 / Math.max(p, 0.02) / margin, 1.02, 99);
  });
}

/* ---------- ПОЛУЧИТЬ ФЛЭШ ДЛЯ КЭФА ---------- */
function getFlashClass(match, marketName, pickIdx){
  if(!match.flashes) return '';
  const key = `${marketName}_${pickIdx}`;
  const f = match.flashes[key];
  if(!f) return '';
  // Флэш живёт 1.4 сек
  if(Date.now() - f.ts > 1400) return '';
  return f.dir === 'up' ? 'up' : 'dn';
}

/* ---------- ЗАПИСЬ ИСТОРИИ КОЭФОВ ---------- */
Match.prototype.recordOdds = function(){
  const g = this.gameMinutes();
  if(!this.oddsHistory) this.oddsHistory = {};

  for(const [name, market] of Object.entries(this.markets)){
    if(!this.oddsHistory[name]) this.oddsHistory[name] = [];

    const hist = this.oddsHistory[name];
    const last = hist[hist.length - 1];

    // Пишем не чаще чем раз в 3 игровых минуты
    if(!last || g - last.gameTime > 3){
      hist.push({
        gameTime: Math.floor(g),
        val: [...market.val],
        ts: Date.now(),
      });
      if(hist.length > 100) hist.shift();
    }
  }
};

/* ---------- ПРИВЯЗКА К МАТЧУ ---------- */
Match.prototype._recalcOddsImpl = recalcOddsImpl;

/* ---------- ПУБЛИЧНЫЙ API: ПЕРЕСЧЁТ ВСЕХ МАТЧЕЙ ---------- */
function recalcAllMatchesOdds(){
  if(!window.Manager) return;
  Manager.matches.forEach(m => {
    if(!m.finished) m.recalcOdds();

}

  if(!window.Manager) return;
  Manager.matches.forEach(m => {

const Daily = {
  today(){

    return n.getFullYear() + '-' + (n.getMonth() + 1) + '-' + n.getDate();
  },
  load(){
    const d = lsGet(DAILY_KEY, null);
    if(!d || d.date !== this.today()) return {date: this.today(), amount: 0};
    return d;
  },
  save(d){
    lsSet(DAILY_KEY, d);
  },
  canDeposit(amount){
    return (this.load().amount + amount) <= MAX_DAILY_DEPOSIT;
  },
  addDeposit(amount){
    const d = this.load();
    d.amount = Math.min(MAX_DAILY_DEPOSIT, d.amount + amount);

  },
  remaining(){
    return MAX_DAILY_DEPOSIT - this.load().amount;
  },
};

/* ---------- ПОЛЕ 2D: RAF-ЦИКЛ ---------- */
let rafId = null;
let lastFrameTime = 0;

function pitchLoop(ts){
  rafId = requestAnimationFrame(pitchLoop);
  if(!lastFrameTime) lastFrameTime = ts;
  const dt = Math.min(0.05, (ts - lastFrameTime) / 1000);
  lastFrameTime = ts;

  const m = currentMatch();
  if(!m) return;

  // Движение мяча
  const ball = m.ballPos;
  const k = 1 - Math.pow(0.001, dt);
  ball.x = ball.x + (ball.tx - ball.x) * k;
  ball.y = ball.y + (ball.ty - ball.y) * k;

  // Игроки
  m.players.forEach(p => {
    if(p.off || p.red) return;
    const attackBonus = (m.attackingTeam === p.team && m.possession === p.team) ? 1 : 0;
    const tx = p.baseX + (ball.x - p.baseX) * 0.08 * attackBonus;
    const ty = p.baseY + (ball.y - p.baseY) * 0.08 * attackBonus;
    const k2 = 1 - Math.pow(0.02, dt);
    p.x = p.x + (tx - p.x) * k2;
    p.y = p.y + (ty - p.y) * k2;
  });

  renderPitch();
}

function renderPitch(){
  const m = currentMatch();
  if(!m) return;
  const svg = $('pitchSvg');
  if(!svg) return;

  const playersG = svg.querySelector('#pitchPlayers');
  const ballG = svg.querySelector('#pitchBall');
  if(!playersG || !ballG) return;

  const svgNS = 'http://www.w3.org/2000/svg';

  // Создаём игроков если нужно
  if(playersG.childElementCount !== m.players.length){
    playersG.innerHTML = '';
    m.players.forEach(p => {
      const g = document.createElementNS(svgNS, 'g');
      g.setAttribute('class', 'player-marker');

      const circle = document.createElementNS(svgNS, 'circle');
      circle.setAttribute('r', '13');
      circle.setAttribute('stroke-width', '2');

      const txt = document.createElementNS(svgNS, 'text');
      txt.setAttribute('text-anchor', 'middle');
      txt.setAttribute('dy', '4');
      txt.setAttribute('font-size', '10');
      txt.setAttribute('font-weight', '800');
      txt.setAttribute('fill', '#0b0e12');

      g.appendChild(circle);
      g.appendChild(txt);
      playersG.appendChild(g);
    });
  }

  // Обновляем позиции
  m.players.forEach((p, i) => {
    const g = playersG.children[i];
    if(!g) return;
    g.style.display = (p.off || p.red) ? 'none' : '';
    g.setAttribute('transform', `translate(${p.x.toFixed(1)} ${p.y.toFixed(1)})`);

    const circle = g.children[0];
    const txt = g.children[1];

    const isHome = p.team === 'h';
    let fill = isHome ? '#d4af5c' : '#5c94dd';
    let stroke = isHome ? '#8b7340' : '#3a6099';

    if(p.red){
      fill = '#e04a56';
      stroke = '#8b1a22';
    } else if(p.yellow){
      stroke = '#e5c342';
    }

    circle.setAttribute('fill', fill);
    circle.setAttribute('stroke', stroke);
    txt.textContent = p.num;
  });

  // Мяч
  ballG.style.display = m.ballPos.visible ? '' : 'none';
  ballG.setAttribute('transform', `translate(${m.ballPos.x.toFixed(1)} ${m.ballPos.y.toFixed(1)})`);
}

/* ---------- НАВИГАЦИЯ ---------- */
function navTo(section){
  const isResults = section === 'results';
  const main = $('pageMain');
  const results = $('pageResults');
  if(main) main.classList.toggle('hidden', isResults);
  if(results) results.classList.toggle('hidden', !isResults);

  $$('#hdrNav button').forEach(b => b.classList.toggle('on', b.dataset.nav === section));
  $$('.bnav-item').forEach(b => b.classList.toggle('on', b.dataset.nav === section));

  if(section === 'home' || section === 'sports') State.currentSport = 'all';
  else if(section === 'live') State.currentSport = 'live';
  else if(SPORTS.find(s => s.id === section)) State.currentSport = section;
  else if(section === 'results'){
    renderResults();
    return;
  } else if(section === 'profile'){
    if(typeof openProfile === 'function') openProfile();
    return;
  }

  renderFiltersBar();
  renderMatchesList();
  renderLiveStrip();
}

/* ---------- СОБЫТИЯ UI ---------- */
document.addEventListener('click', e => {
  // Карточка матча
  const card = e.target.closest('.mc, .live-card');
  if(card && !e.target.closest('.rm')){
    const mid = parseInt(card.dataset.mid);
    if(mid) openMatchCenter(mid);
    return;
  }

  // Результат
  const res = e.target.closest('.res-item');
  if(res){
    const rid = parseInt(res.dataset.rid);
    if(typeof openResultProtocol === 'function') openResultProtocol(rid);
    return;
  }

  // Nav
  const nav = e.target.closest('.bnav-item');
  if(nav){
    navTo(nav.dataset.nav);
    return;
  }

  const hnav = e.target.closest('#hdrNav button');
  if(hnav){
    navTo(hnav.dataset.nav);
    return;
  }

  // Filter chips
  const fchip = e.target.closest('.fchip');
  if(fchip){
    if(fchip.dataset.sport) State.currentSport = fchip.dataset.sport;
    if(fchip.dataset.filter) State.currentFilter = fchip.dataset.filter;
    renderFiltersBar();
    renderMatchesList();
    return;
  }

  // Match Center tabs
  const tab = e.target.closest('.mcc-tab');
  if(tab){
    setMccTab(tab.dataset.tab);
    return;
  }

  // Back
  if(e.target.closest('#mccBack')){
    closeMatchCenter();
    return;
  }

  // Favorite в Match Center
  if(e.target.closest('#mccFav')){
    const m = currentMatch();
    if(m){
      Favorites.toggle('match:' + m.id);
      updateMatchCenter();
    }
    return;
  }

  // ODD
  const odd = e.target.closest('.odd');
  if(odd && !odd.classList.contains('closed')){
    const m = currentMatch();
    if(!m) return;
    const marketName = odd.dataset.market;
    const pickIdx = parseInt(odd.dataset.pick);
    const market = m.markets[marketName];
    if(!market) return;
    e.preventDefault();
    e.stopPropagation();
    if(typeof addToCoupon === 'function'){
      addToCoupon(m.id, marketName, pickIdx, market.lbl[pickIdx], market.val[pickIdx]);
    }
    return;
  }

  // Coupon bar toggle
  if(e.target.closest('#couponBar') && !e.target.closest('#couponClose') && !e.target.closest('#couponBtn')){
    if(typeof toggleCoupon === 'function') toggleCoupon();
    return;
  }

  // Coupon close
  if(e.target.closest('#couponClose')){
    e.stopPropagation();
    if(typeof toggleCoupon === 'function') toggleCoupon(false);
    return;
  }

  // Coupon place
  if(e.target.closest('#couponBtn')){
    e.stopPropagation();
    if(typeof placeBet === 'function') placeBet();
    return;
  }

  // Ctype
  const ctype = e.target.closest('.ctype-b');
  if(ctype){
    if(typeof setBetType === 'function') setBetType(ctype.dataset.type);
    return;
  }

  // Stake quick
  const sq = e.target.closest('.stake-q[data-stake]');
  if(sq){
    const input = $('stakeInput');
    if(input){
      input.value = sq.dataset.stake;
      if(typeof updateCoupon === 'function') updateCoupon();
    }
    return;
  }

  // Remove from coupon
  const rm = e.target.closest('.citem .rm');
  if(rm){
    if(typeof removeFromCoupon === 'function'){
      removeFromCoupon(parseInt(rm.dataset.mid), rm.dataset.market, parseInt(rm.dataset.pick));
    }
    return;
  }

  // Search
  if(e.target.closest('#btnSearch')){
    const bar = $('searchBar');
    if(bar){
      bar.classList.toggle('hidden');
      const inp = $('searchInput');
      if(inp && !bar.classList.contains('hidden')) inp.focus();
    }
    return;
  }

  // Favorites open
  if(e.target.closest('#btnFav')){
    if(typeof openFavorites === 'function') openFavorites();
    return;
  }

  // Profile
  if(e.target.closest('#btnProfile')){
    if(typeof openProfile === 'function') openProfile();
    return;
  }

  // Balance
  if(e.target.closest('#balanceBtn')){
    if(typeof openDeposit === 'function') openDeposit();
    return;
  }

  // Modal close
  if(e.target.id === 'modalBg'){
    closeModal();
    return;
  }

  // Modal close btn
  if(e.target.closest('.mdl-close')){
    closeModal();
    return;
  }
});

/* ---------- TOGGLE COUPON ---------- */
function toggleCoupon(force){
  const c = $('coupon');
  if(!c) return;
  if(force === true) c.classList.add('on');
  else if(force === false) c.classList.remove('on');
  else c.classList.toggle('on');
}

/* ---------- ADD TO COUPON ---------- */
function addToCoupon(matchId, marketName, pickIdx, pickLbl, odds){
  const existing = State.coupon.findIndex(c =>
    c.matchId === matchId && c.market === marketName && c.pickIdx === pickIdx
  );

  if(existing > -1){
    // Уже есть — удаляем (toggle)
    State.coupon.splice(existing, 1);
  } else {
    // Если одиночная — заменяем
    if(State.betType === 'single'){
      State.coupon = [];
    } else {
      // Экспресс: только одна ставка на матч
      const sameMatch = State.coupon.find(c => c.matchId === matchId);
      if(sameMatch){
        toast('В экспрессе одна ставка на матч', 'err');
        return;
      }
      if(State.coupon.length >= 12){
        toast('Максимум 12 событий', 'err');
        return;
      }
    }

    const m = Manager.matches.find(x => x.id === matchId);
    if(!m) return;

    State.coupon.push({
      matchId,
      market: marketName,
      pickIdx,
      pickLbl,
      odds,
      home: m.home,
      away: m.away,
      sport: m.sport,
      matchStart: m.startedAt,
    });
  }

  State.save();
  updateCoupon();
  updateMarketsUI();
  if(State.coupon.length) toggleCoupon(true);
}

/* ---------- REMOVE FROM COUPON ---------- */
function removeFromCoupon(matchId, market, pickIdx){
  State.coupon = State.coupon.filter(c =>
    !(c.matchId === matchId && c.market === market && c.pickIdx === pickIdx)
  );
  State.save();
  updateCoupon();
  updateMarketsUI();
}
window.removeFromCoupon = removeFromCoupon;

/* ---------- SET BET TYPE ---------- */
function setBetType(type){
  State.betType = type;
  $$('.ctype-b').forEach(b => b.classList.toggle('on', b.dataset.type === type));

  // Если одиночная — оставляем только последнюю
  if(type === 'single' && State.coupon.length > 1){
    State.coupon = [State.coupon[State.coupon.length - 1]];
  }

  updateCoupon();
  State.save();
}
window.setBetType = setBetType;

/* ---------- UPDATE COUPON UI ---------- */
function updateCoupon(){
  const n = State.coupon.length;
  const cntEl = $('couponCount');
  if(cntEl){
    cntEl.textContent = n;
    cntEl.classList.toggle('has', n > 0);
  }

  // Общий коэффициент
  let odds = 0;
  if(State.betType === 'single'){
    odds = n ? State.coupon[0].odds : 0;
  } else {
    odds = n ? State.coupon.reduce((a, c) => a * c.odds, 1) : 0;
  }

  const oddsEl = $('couponOdds');
  if(oddsEl) oddsEl.textContent = odds.toFixed(2);

  const sumOddsEl = $('sumOdds');
  if(sumOddsEl) sumOddsEl.textContent = odds.toFixed(2);

  // Список ставок
  const items = $('couponItems');
  if(items){
    if(!n){
      items.innerHTML = `
        <div class="cp-empty">
          <span class="em">🎟️</span>
          Купон пуст.<br>Нажмите на коэффициент в матче.
        </div>`;
    } else {
      items.innerHTML = State.coupon.map(c => {
        const ic = SPORTS.find(s => s.id === c.sport)?.ic || '🏆';
        return `<div class="citem">
          <div class="info">
            <div class="pick">
              <span class="bdg">${ic}</span>
              <span>${esc(c.pickLbl)}</span>
            </div>
            <div class="teams">${esc(c.home)} — ${esc(c.away)}</div>
            <div class="mk">${esc(c.market)}</div>
          </div>
          <div class="coef">${c.odds.toFixed(2)}</div>
          <div class="rm" data-mid="${c.matchId}" data-market="${esc(c.market)}" data-pick="${c.pickIdx}">✕</div>
        </div>`;
      }).join('');
    }
  }

  // Сумма
  const stake = parseFloat($('stakeInput')?.value) || 0;
  const sumStakeEl = $('sumStake');
  if(sumStakeEl) sumStakeEl.textContent = fmtMoney(stake);

  const potential = n ? stake * odds : 0;
  const sumPotEl = $('sumPotential');
  if(sumPotEl) sumPotEl.textContent = fmtMoney(potential);

  // Кнопка
  const btn = $('couponBtn');
  if(btn){
    btn.disabled = !n || stake < 10 || stake > State.balance;
  }
}

  const m = currentMatch();
  if(!m) return;

  $$('.odd').forEach(el => {

/* ---------- PLACE BET (демо) ---------- */
function placeBet(){
  if(!State.coupon.length) return;

  const stake = parseFloat($('stakeInput')?.value) || 100;

  if(stake < 10){
    toast('Минимальная ставка — 10 ₽', 'err');
    return;
  }
  if(stake > State.balance){
    toast('Недостаточно средств', 'err');
    return;
  }

  let odds = 0;
  if(State.betType === 'single'){
    odds = State.coupon[0].odds;
  } else {
    odds = State.coupon.reduce((a, c) => a * c.odds, 1);
  }
  const potential = stake * odds;

  // Списываем
  State.balance -= stake;
  updateBalanceUI();

  // Создаём запись
  const histId = Date.now() + Math.floor(Math.random() * 1000);
  const bet = {
    id: histId,
    type: State.betType,
    stake,
    odds,
    potential,
    status: 'pending',
    createdAt: new Date().toISOString(),
    bets: State.coupon.map(c => ({...c})),
    result: null,
    cashoutAmount: null,
  };

  State.history.unshift(bet);
  if(State.history.length > 200) State.history.length = 200;

  toast(`Ставка ${fmtMoney(stake)} принята`, 'ok');

  // Очищаем купон
  State.coupon = [];
  updateCoupon();
  State.save();

  // Симуляция результата через 15-35 секунд
  const delay = 15000 + Math.random() * 20000;
  setTimeout(() => {
    const item = State.history.find(h => h.id === histId);
    if(!item || item.status !== 'pending') return;

    const win = Math.random() < 0.45;
    item.status = win ? 'win' : 'lose';
    item.result = win ? 'win' : 'lose';

    if(win){
      State.balance += item.potential;
      updateBalanceUI();
      toast(`🎉 Выигрыш ${fmtMoney(item.potential)}`, 'ok');
    } else {
      toast('Ставка проиграла', 'err');
    }
    State.save();
  }, delay);
}
window.placeBet = placeBet;

/* ---------- ПРОВЕРКА РЕЗУЛЬТАТОВ ПРИ ЗАВЕРШЕНИИ МАТЧА ---------- */
function checkCouponResults(match){
  if(!match) return;

  State.history.forEach(h => {
    if(h.status !== 'pending') return;

    // Проверяем каждую ставку в купоне
    h.bets.forEach(b => {
      if(b.matchId === match.id && !b.result){
        const market = match.markets[b.market];
        if(market){
          b.result = determineResult(market, b.pickIdx, match);
        } else {
          b.result = 'lose';
        }
      }
    });

    // Если все ставки определены — финализируем
    if(h.bets.every(b => b.result)){
      const allWin = h.bets.every(b => b.result === 'win');
      if(allWin){
        h.status = 'win';
        h.result = 'win';
        State.balance += h.potential;
        updateBalanceUI();
        toast(`🎉 Купон выиграл! ${fmtMoney(h.potential)}`, 'ok');
      } else {
        h.status = 'lose';
        h.result = 'lose';
      }
      State.save();
    }
  });
}
window.checkCouponResults = checkCouponResults;

  /* === ЧАСТЬ 13: УМНЫЙ КЭШАУТ === */

/* ---------- РАСЧЁТ КЭШАУТА ДЛЯ ОДИНОЧНОЙ СТАВКИ ----------
   Формула: текущий live-кэф → вероятность → доля от потенциального выигрыша
   Если ставка выигрывает (live-кэф упал) — кэшаут растёт
   Если ставка проигрывает (live-кэф вырос) — кэшаут падает
*/
function calcCashout(bet){
  if(!bet || bet.status !== 'pending') return 0;
  if(!bet.bets || !bet.bets.length) return 0;

  const firstBet = bet.bets[0];

  // Для одиночной — считаем по текущему live-кэфу
  if(bet.type === 'single'){
    return calcSingleCashout(bet, firstBet);
  }

  // Для экспресса — перемножаем вероятности всех исходов
  return calcExpressCashout(bet);
}

/* ---------- ОДИНОЧНАЯ ---------- */
function calcSingleCashout(bet, b){
  const match = Manager.matches.find(m => m.id === b.matchId);
  if(!match) return bet.stake * 0.5;

  const market = match.markets[b.market];
  if(!market) return bet.stake * 0.5;

  // Текущий live-кэф на этот исход
  let currentOdds = market.val[b.pickIdx];
  if(!currentOdds || currentOdds < 1.01){
    currentOdds = 1.01;
  }

  // Проверяем — был ли рынок уже решён
  if(market.closed && market.closed[b.pickIdx]){
    if(market.result === 'win'){
      return bet.potential * 0.98; // почти полный выигрыш
    }
    return 0; // проиграл
  }

  // Вероятность текущего исхода
  const p = 1 / currentOdds;

  // Кэшаут = потенциальный выигрыш × вероятность × коэффициент удержания
  const houseEdge = 0.94; // 6% маржа букмекера

  let cashout = bet.potential * p * houseEdge;

  // Никогда не больше 0.98 потенциального выигрыша
  cashout = Math.min(cashout, bet.potential * 0.98);

  // И не меньше 30% от ставки (если совсем плохо — всё равно даём что-то)
  cashout = Math.max(cashout, bet.stake * 0.3);

  // Округляем до 10
  cashout = Math.round(cashout / 10) * 10;

  return Math.max(0, cashout);
}

/* ---------- ЭКСПРЕСС ---------- */
function calcExpressCashout(bet){
  let totalProb = 1;
  let anyLost = false;
  let allWon = true;

  for(const b of bet.bets){
    const match = Manager.matches.find(m => m.id === b.matchId);
    if(!match){
      totalProb *= 0.5;
      continue;
    }

    const market = match.markets[b.market];
    if(!market){
      totalProb *= 0.5;
      continue;
    }

    // Проверка на завершённость
    if(market.closed && market.closed[b.pickIdx]){
      if(market.result === 'win'){
        // Уже выигран — множитель не меняется (1)
        continue;
      } else {
        // Проигран — весь экспресс проиграл
        anyLost = true;
        break;
      }
    }

    allWon = false;

    // Текущий live-кэф
    let currentOdds = market.val[b.pickIdx];
    if(!currentOdds || currentOdds < 1.01){
      currentOdds = 1.01;
    }

    const p = 1 / currentOdds;
    totalProb *= p;
  }

  if(anyLost) return 0;

  // Все выиграли — почти полный выигрыш
  if(allWon){
    return bet.potential * 0.97;
  }

  const houseEdge = 0.92;

  let cashout = bet.potential * totalProb * houseEdge;

  cashout = Math.min(cashout, bet.potential * 0.97);
  cashout = Math.max(cashout, bet.stake * 0.25);
  cashout = Math.round(cashout / 10) * 10;

  return Math.max(0, cashout);
}

/* ---------- ОБНОВЛЕНИЕ КЭШАУТА ДЛЯ ВСЕХ PENDING-СТАВОК ---------- */
function updateAllCashouts(){
  let changed = false;
  State.history.forEach(h => {
    if(h.status !== 'pending') return;
    const newAmount = calcCashout(h);
    if(newAmount !== h.cashoutAmount){
      h.cashoutAmount = newAmount;
      changed = true;
    }
    // Автоматический проигрыш если кэшаут = 0
    if(newAmount === 0 && !h.result){
      // Не спешим — только если все рынки закрыты как lose
      // Проверка ниже
    }
  });
  if(changed) State.save();
}

/* ---------- ВЫПОЛНЕНИЕ КЭШАУТА ---------- */
function doCashout(histId){
  const h = State.history.find(x => x.id === histId);
  if(!h){
    toast('Ставка не найдена', 'err');
    return;
  }
  if(h.status !== 'pending'){
    toast('Ставка уже закрыта', 'err');
    return;
  }

  const amount = calcCashout(h);
  if(amount <= 0){
    toast('Кэшаут недоступен', 'err');
    return;
  }

  // Подтверждение
  if(!confirm(`Подтвердите кэшаут ${fmtMoney(amount)}?\n\nСтавка: ${fmtMoney(h.stake)}\nПотенциальный выигрыш: ${fmtMoney(h.potential)}`)){
    return;
  }

  // Выплачиваем
  h.status = 'cashout';
  h.cashoutAmount = amount;
  h.cashoutAt = new Date().toISOString();
  State.balance += amount;
  updateBalanceUI();
  State.save();

  toast(`💰 Кэшаут: +${fmtMoney(amount)}`, 'ok');

  // Если открыто модальное окно истории — обновляем
  if($('modalBg')?.classList.contains('on')){
    if(typeof openHistory === 'function') openHistory();
  }
}
window.doCashout = doCashout;

  return `<button class="cashout-btn" onclick="event.stopPropagation();doCashout(${bet.id})">

/* ---------- ОДНА ЗАПИСЬ ИСТОРИИ ---------- */
function renderHistoryItem(h){
  const date = new Date(h.createdAt);
  const time = date.toLocaleTimeString('ru-RU', {hour: '2-digit', minute: '2-digit'});
  const day = date.toLocaleDateString('ru-RU');
  const typeLabel = {single: 'Одиночная', express: 'Экспресс'}[h.type] || h.type;

  // Кнопка кэшаута (только для pending)
  const cashoutBtn = renderCashoutButton(h);

  // Сумма выигрыша/проигрыша
  let amountClass = '';
  let amountText = '';

  if(h.status === 'win'){
    amountClass = '';
    amountText = '+' + fmtMoney(h.potential);
  } else if(h.status === 'lose'){
    amountClass = 'neg';
    amountText = '-' + fmtMoney(h.stake);
  } else if(h.status === 'cashout'){
    amountClass = 'gold';
    amountText = '+' + fmtMoney(h.cashoutAmount || 0);
  } else {
    // pending — показываем потенциальный
    amountClass = 'gold';
    amountText = fmtMoney(h.potential);
  }

  return `<div class="hitem">
    <div class="htop">
      <span>${day} · ${time} · ${typeLabel}</span>
      ${formatBetStatus(h)}
    </div>
    ${h.bets.map(b => `
      <div class="hpick">${esc(b.pickLbl)} · ${esc(b.market)}</div>
      <div class="hteams">${esc(b.home)} — ${esc(b.away)}</div>
    `).join('')}
    <div class="hbot">
      <div>
        <span>${fmtMoney(h.stake)} · коэф. ${h.odds.toFixed(2)}</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <span class="amt ${amountClass}">${amountText}</span>
        ${cashoutBtn}
      </div>
    </div>
  </div>`;
}

/* ---------- АВТОМАТИЧЕСКОЕ ЗАКРЫТИЕ ПРОИГРАННЫХ КУПОНОВ ---------- */
function autoCloseLostBets(){
  State.history.forEach(h => {
    if(h.status !== 'pending') return;

    // Проверяем — все ли матчи завершены
    const allFinished = h.bets.every(b => {
      const m = Manager.matches.find(x => x.id === b.matchId);
      return m && m.finished;
    });

    if(allFinished){
      // Определяем результат
      let allWin = true;
      h.bets.forEach(b => {
        const m = Manager.matches.find(x => x.id === b.matchId);
        if(!m) return;
        const market = m.markets[b.market];
        if(market){
          b.result = determineResult(market, b.pickIdx, m);
          if(b.result !== 'win') allWin = false;
        }
      });

      if(allWin){
        h.status = 'win';
        State.balance += h.potential;
        updateBalanceUI();
        toast(`🎉 Купон выиграл! ${fmtMoney(h.potential)}`, 'ok');
      } else {
        h.status = 'lose';
      }
      State.save();
    }
  });
}

  const amount = parseFloat(input.value) || 0;

  if(amount < 100){
    toast('Минимальная сумма — 100 ₽', 'err');
    return;
  }

  if(amount > Daily.remaining()){
    toast(`Превышен дневной лимит. Осталось: ${fmtMoney(Daily.remaining())}`, 'err');

  if(!Daily.canDeposit(amount)){

  State.balance += amount;
  Daily.addDeposit(amount);
  updateBalanceUI();

  closeModal();

      <div class="feed-text">${e.text}</div>
    </div>
  `).join('');

  openModal(`
    <div class="mdl-grip"></div>
    <div class="mdl-head">
      <div>
        <div class="mdl-title">${esc(r.home)} ${r.hs} : ${r.as} ${esc(r.away)}</div>
        <div class="mdl-sub">${ic} ${esc(r.league)} · ${dateStr}</div>
      </div>
      <div class="mdl-close" onclick="closeModal()">✕</div>
    </div>

    <div class="res-protocol-score" style="margin-bottom:16px;">
      ${r.hs} : ${r.as}
    </div>

    <div class="section-head" style="margin-top:8px;">
      <div class="section-title">
        <span class="dot"></span>Статистика
      </div>
    </div>

    <div class="stats-grid">
      ${statRows.map(([name, h, a, unit]) => {
        const total = (h + a) || 1;
        return `<div class="stat-row">
          <div class="stat-val">${h}${unit}</div>
          <div class="stat-name">${name}</div>
          <div class="stat-val dim">${a}${unit}</div>
          <div class="stat-bar">
            <div class="stat-bar-home" style="width:${(h/total*100).toFixed(0)}%"></div>
            <div class="stat-bar-away" style="width:${(a/total*100).toFixed(0)}%"></div>
          </div>
        </div>`;
      }).join('')}
    </div>

    <div class="section-head" style="margin-top:18px;">
      <div class="section-title">
        <span class="dot"></span>Ключевые события
      </div>
    </div>

    <div style="background:var(--p);border:1px solid var(--bd);border-radius:14px;overflow:hidden;">
      ${eventsHTML || '<div style="padding:20px;text-align:center;color:var(--t3);">Нет событий</div>'}
    </div>

    <button class="btn-ghost" style="margin-top:14px;" onclick="closeModal()">Закрыть</button>
  `);
}
window.openResultProtocol = openResultProtocol;

/* ---------- НАВИГАЦИЯ: РЕЗУЛЬТАТЫ ---------- */
function showResultsPage(){
  const main = $('pageMain');
  const results = $('pageResults');
  if(main) main.classList.add('hidden');
  if(results) results.classList.remove('hidden');
  renderResults();

  $$('#hdrNav button').forEach(b => b.classList.toggle('on', b.dataset.nav === 'results'));
  $$('.bnav-item').forEach(b => b.classList.toggle('on', b.dataset.nav === 'results'));
}
window.showResultsPage = showResultsPage;

/* === КОНЕЦ ЧАСТИ 14 === */
  /* === ЧАСТЬ 15: INIT + СВЯЗКА (ФИНАЛ) === */

/* ---------- НАВИГАЦИЯ: ПОЛНАЯ ВЕРСИЯ ---------- */
function navTo(section){
  const isResults = section === 'results';
  const main = $('pageMain');
  const results = $('pageResults');
  if(main) main.classList.toggle('hidden', isResults);
  if(results) results.classList.toggle('hidden', !isResults);

  $$('#hdrNav button').forEach(b => b.classList.toggle('on', b.dataset.nav === section));
  $$('.bnav-item').forEach(b => b.classList.toggle('on', b.dataset.nav === section));

  if(section === 'home' || section === 'sports'){
    State.currentSport = 'all';
    State.currentFilter = 'all';
  } else if(section === 'live'){
    State.currentSport = 'live';
  } else if(SPORTS.find(s => s.id === section)){
    State.currentSport = section;
  } else if(section === 'results'){
    renderResults();
    return;
  } else if(section === 'profile'){
    openProfile();
    return;
  }

  renderFiltersBar();
  renderMatchesList();
  renderLiveStrip();
}
window.navTo = navTo;

/* ---------- ОБРАБОТЧИК: кнопка "Все LIVE" ---------- */
function bindSeeAllLive(){
  const el = $('seeAllLive');
  if(el){
    el.onclick = () => {
      State.currentSport = 'live';
      renderFiltersBar();

}

/* ---------- ОБРАБОТЧИК: сортировка ---------- */
function bindSortSelect(){

  if(el){
    el.onchange = (e) => {
      State.sort = e.target.value;

/* ---------- ОБРАБОТЧИК: поиск ---------- */
function bindSearch(){
  const input = $('searchInput');

      State.search = e.target.value.trim().toLowerCase();

/* ---------- ОБРАБОТЧИК: ввод суммы в купон ---------- */
function bindStakeInput(){

  if(el){
    el.oninput = () => updateCoupon();

/* ---------- ОБРАБОТЧИК: кнопки навигации в хедере ---------- */
function bindHeaderNav(){
  $$('#hdrNav button').forEach(b => {
    b.onclick = () => navTo(b.dataset.nav);
  });
}

/* ---------- ОБРАБОТЧИК: нижняя навигация ---------- */
function bindBottomNav(){
  $$('.bnav-item').forEach(b => {
    b.onclick = () => navTo(b.dataset.nav);
  });
}

/* ---------- ОБРАБОТЧИК: кнопки в шапке ---------- */
function bindHeaderActions(){
  const btnSearch = $('btnSearch');
  if(btnSearch){
    btnSearch.onclick = () => {
      const bar = $('searchBar');
      if(!bar) return;
      bar.classList.toggle('hidden');
      const inp = $('searchInput');
      if(inp && !bar.classList.contains('hidden')) inp.focus();
    };
  }

  const btnFav = $('btnFav');
  if(btnFav){
    btnFav.onclick = () => openFavorites();
  }

  const btnProfile = $('btnProfile');
  if(btnProfile){
    btnProfile.onclick = () => openProfile();
  }

  const balanceBtn = $('balanceBtn');
  if(balanceBtn){
    balanceBtn.onclick = () => openDeposit();
  }
}

/* ---------- ОБРАБОТЧИК: модалка ---------- */
function bindModalBg(){
  const bg = $('modalBg');
  if(bg){
    bg.onclick = (e) => {
      if(e.target === bg) closeModal();
    };
  }
}

/* ---------- ОБРАБОТЧИК: кнопки в купоне ---------- */
function bindCouponControls(){
  const bar = $('couponBar');
  if(bar){
    bar.onclick = (e) => {
      // Не срабатывает если клик по кнопке
      if(e.target.closest('#couponClose')) return;
      if(e.target.closest('#couponBtn')) return;
      toggleCoupon();
    };
  }

  const closeBtn = $('couponClose');
  if(closeBtn){
    closeBtn.onclick = (e) => {
      e.stopPropagation();
      toggleCoupon(false);
    };
  }

  const btn = $('couponBtn');
  if(btn){
    btn.onclick = (e) => {
      e.stopPropagation();
      placeBet();
    };
  }

  $$('.ctype-b').forEach(b => {
    b.onclick = () => setBetType(b.dataset.type);
  });

  $$('.stake-q[data-stake]').forEach(b => {
    b.onclick = () => {
      const input = $('stakeInput');
      if(input){
        input.value = b.dataset.stake;
        updateCoupon();
      }
    };
  });
}

/* ---------- ОБРАБОТЧИК: кнопка "назад" в Match Center ---------- */
function bindMccControls(){
  const back = $('mccBack');
  if(back){
    back.onclick = () => closeMatchCenter();
  }

  const fav = $('mccFav');
  if(fav){
    fav.onclick = () => {
      const m = currentMatch();
      if(!m) return;
      Favorites.toggle('match:' + m.id);
      updateMatchCenter();
    };
  }

  // Табы Match Center
  $$('.mcc-tab').forEach(t => {
    t.onclick = () => setMccTab(t.dataset.tab);
  });
}

/* ---------- ОБРАБОТЧИК: клики по карточкам и кэфам (делегирование) ---------- */
function bindDelegatedClicks(){
  document.addEventListener('click', (e) => {
    // Карточка матча
    const card = e.target.closest('.mc, .live-card');
    if(card && !e.target.closest('.rm')){
      const mid = parseInt(card.dataset.mid);
      if(mid){
        openMatchCenter(mid);
        return;
      }
    }

    // Результат
    const res = e.target.closest('.res-item');
    if(res){
      const rid = parseInt(res.dataset.rid);
      if(rid) openResultProtocol(rid);
      return;
    }

    // Фильтр-чип
    const fchip = e.target.closest('.fchip');
    if(fchip){
      if(fchip.dataset.sport !== undefined){
        State.currentSport = fchip.dataset.sport;
      }
      if(fchip.dataset.filter !== undefined){
        State.currentFilter = fchip.dataset.filter;
      }
      renderFiltersBar();
      renderMatchesList();
      return;
    }

    // ODD (коэффициент)
    const odd = e.target.closest('.odd');
    if(odd && !odd.classList.contains('closed')){
      const m = currentMatch();
      if(!m) return;
      const marketName = odd.dataset.market;
      const pickIdx = parseInt(odd.dataset.pick);
      const market = m.markets[marketName];
      if(!market) return;
      e.preventDefault();
      e.stopPropagation();
      addToCoupon(m.id, marketName, pickIdx, market.lbl[pickIdx], market.val[pickIdx]);
      return;
    }

    // Удалить из купона
    const rm = e.target.closest('.citem .rm');
    if(rm){
      e.stopPropagation();
      removeFromCoupon(
        parseInt(rm.dataset.mid),
        rm.dataset.market,
        parseInt(rm.dataset.pick)
      );
      return;
    }

    // Фильтр истории
    const htab = e.target.closest('.htab[data-hist]');
    if(htab){
      State.histFilter = htab.dataset.hist;
      openHistory();
      return;
    }
  }, false);

  // Клик по оdd внутри Match Center — тоже работает
  document.addEventListener('click', (e) => {
    const odd = e.target.closest('.odd');
    if(!odd) return;
    if(odd.classList.contains('closed')) return;
    // Проверяем что это НЕ наш делегированный выше — уже обработали
    // (кнопки внутри .odd нет, поэтому достаточно одного обработчика)
  });
}

/* ---------- ОБРАБОТЧИК: keyboard ---------- */
function bindKeyboard(){
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape'){
      if($('modalBg')?.classList.contains('on')){
        closeModal();
      } else if($('mcCenter')?.classList.contains('on')){
        closeMatchCenter();
      }
    }
  });
}

/* ---------- ОБНОВЛЕНИЕ MATCH CENTER (каждые 500 мс если открыт) ---------- */
let mccInterval = null;
function startMccInterval(){
  if(mccInterval) return;
  mccInterval = setInterval(() => {
    if(State.currentMatchId){
      updateMatchCenter();
    }
  }, 500);
}

/* ---------- ОБНОВЛЕНИЕ ВСЕХ КЭФОВ (каждые 1 сек) ---------- */
let oddsInterval = null;
function startOddsInterval(){
  if(oddsInterval) return;
  oddsInterval = setInterval(() => {
    Manager.matches.forEach(m => {
      if(!m.finished) m.recalcOdds();
    });
  }, 1000);
}

/* ---------- ОБНОВЛЕНИЕ КЭШАУТОВ (каждые 2 сек) ---------- */
let cashoutInterval = null;
function startCashoutInterval(){
  if(cashoutInterval) return;
  cashoutInterval = setInterval(() => {
    updateAllCashouts();
    refreshHistoryIfOpen();
  }, 2000);
}

/* ---------- АВТОПРОВЕРКА РЕЗУЛЬТАТОВ (каждые 5 сек) ---------- */
let resultsCheckInterval = null;
function startResultsCheckInterval(){
  if(resultsCheckInterval) return;
  resultsCheckInterval = setInterval(() => {
    autoCloseLostBets();
  }, 5000);
}

/* ---------- ГЛАВНЫЙ ЦИКЛ ---------- */
function startMainTick(){
  setInterval(() => {
    mainTick();
  }, TICK_MS);
}

/* ---------- СОХРАНЕНИЕ СОСТОЯНИЯ ПЕРИОДИЧЕСКИ ---------- */
function startAutoSave(){
  setInterval(() => {
    State.save();
  }, 10000);
}

/* ---------- INIT ---------- */
function init(){
  console.log('%c🎮 LIVEZONE ENGINE START', 'color:#d4af5c;font-size:14px;font-weight:900;');

  // Загружаем состояние
  State.load();
  Favorites.load();

  // Инициализируем матчи
  Manager.init();

  // Привязываем пересчёт кэфов
  Manager.matches.forEach(m => {
    m._recalcOddsImpl = recalcOddsImpl;
    m.recordOdds = Match.prototype.recordOdds;
  });

  // Привязки
  bindHeaderNav();
  bindBottomNav();
  bindHeaderActions();
  bindModalBg();
  bindCouponControls();
  bindMccControls();
  bindDelegatedClicks();
  bindKeyboard();
  bindSeeAllLive();
  bindSortSelect();
  bindSearch();
  bindStakeInput();

  // Рендер начального состояния
  renderFiltersBar();
  renderMatchesList();
  renderLiveStrip();
  updateBalanceUI();
  updateCoupon();

  // Настройка активной вкладки type ставки
  $$('.ctype-b').forEach(b => {
    b.classList.toggle('on', b.dataset.type === State.betType);
  });

  // Запускаем интервалы
  startMainTick();
  startMccInterval();
  startOddsInterval();
  startCashoutInterval();
  startResultsCheckInterval();
  startAutoSave();

  console.log(`%c✅ Готово. Матчей: ${Manager.matches.length}, LIVE: ${Manager.liveCount()}`,
              'color:#6ed09a;font-size:12px;');
  console.log('%c💡 Совет: клик на матч → Match Center. Клик на кэф → купон.',
              'color:#a9b4c3;font-size:11px;');

  // Приветственное уведомление
  setTimeout(() => {
    if(!State.user){
      toast('👋 Добро пожаловать в LIVEZONE!', 'ok');
    }
  }, 800);
}

/* ---------- ЗАПУСК ---------- */
if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

/* === КОНЕЦ ЧАСТИ 15 === */
</script>
