<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🏎️ Race Master 3D Clone</title>
<style>
  body { margin: 0; overflow: hidden; background: #1a0033; font-family: 'Segoe UI', Arial, sans-serif; user-select: none; touch-action: none; }
  canvas { display: block; }
  
  /* UI */
  #ui { position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
  
  /* Верхняя панель (как на скрине) */
  .top-bar { display: flex; justify-content: center; padding: 20px; gap: 10px; }
  .panel { background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 10px; border: 2px solid rgba(255,255,255,0.2); color: white; font-weight: 900; font-size: 20px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); text-align: center; }
  .panel span { display: block; font-size: 14px; color: #aaa; margin-bottom: 5px; }
  
  /* Кнопки управления */
  .controls { display: flex; justify-content: space-between; padding: 30px; pointer-events: auto; }
  .ctrl-btn { width: 90px; height: 90px; background: rgba(255,255,255,0.1); border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; color: white; margin: 0 10px; backdrop-filter: blur(10px); box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
  .ctrl-btn:active { background: rgba(255,255,255,0.4); transform: scale(0.9); }
  #btn-gas { border-color: #00ff00; background: rgba(0,255,0,0.2); }
  #btn-left { border-color: #00ccff; }
  #btn-right { border-color: #00ccff; }

  /* Меню */
  #menu { position: absolute; inset: 0; background: linear-gradient(135deg, #1a0033, #330066); display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; z-index: 100; pointer-events: auto; }
  h1 { font-size: 50px; margin-bottom: 10px; font-style: italic; background: linear-gradient(45deg, #00ffff, #ff00ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 30px rgba(255,0,255,0.5); font-weight: 900; }
  .btn { padding: 20px 60px; font-size: 24px; font-weight: 900; background: linear-gradient(90deg, #ff00ff, #00ffff); color: white; border: none; border-radius: 50px; cursor: pointer; margin-top: 30px; box-shadow: 0 10px 30px rgba(255,0,255,0.5); text-transform: uppercase; letter-spacing: 3px; }
  .btn:active { transform: scale(0.95); }
</style>
</head>
<body>

<div id="menu">
  <h1>RACE MASTER 3D</h1>
  <p style="opacity: 0.7; font-size: 18px; letter-spacing: 2px;">WEB CLONE</p>
  <button class="btn" id="btn-start">СТАРТ</button>
</div>

<div id="ui" style="display:none;">
  <div class="top-bar">
    <div class="panel"><span>LAP</span>1/3</div>
    <div class="panel" style="color:#00ff00;"><span>SPEED</span><span id="ui-speed" style="color:#00ff00; font-size:24px;">0</span></div>
    <div class="panel"><span>DISTANCE</span><span id="ui-dist" style="font-size:24px;">0</span>m</div>
  </div>
  
  <div class="controls">
    <div style="display:flex;">
      <div class="ctrl-btn" id="btn-left">◀</div>
      <div class="ctrl-btn" id="btn-right">▶</div>
    </div>
    <div style="display:flex;">
      <div class="ctrl-btn" id="btn-gas">▲</div>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ==========================================
// 1. НАСТРОЙКА СЦЕНЫ (НЕОНОВЫЙ ГОРОД)
// ==========================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a0033); // Темно-фиолетовый
scene.fog = new THREE.Fog(0x1a0033, 50, 200);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// Свет
const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 2);
dirLight.position.set(10, 20, 10);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 2048;
dirLight.shadow.mapSize.height = 2048;
dirLight.shadow.camera.left = -20;
dirLight.shadow.camera.right = 20;
dirLight.shadow.camera.top = 20;
dirLight.shadow.camera.bottom = -20;
scene.add(dirLight);

// Неоновый свет снизу
const neonLight = new THREE.PointLight(0xff00ff, 5, 50);
neonLight.position.set(0, -2, 0);
scene.add(neonLight);

// ==========================================
// 2. МОДЕЛЬ СПОРТКАРА (ЖЕЛТЫЙ)
// ==========================================
function createSportsCar() {
  const carGroup = new THREE.Group();
  
  // Материалы
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0xffcc00, metalness: 0.8, roughness: 0.2 }); // Желтый
  const glassMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 1, roughness: 0.1, transparent: true, opacity: 0.8 });
  const blackMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });
  const tireMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 1 });
  const rimMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 1, roughness: 0.1 });
  const lightMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
  const frontLightMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

  // Кузов (сглаженный параллелепипед)
  const bodyGeo = new THREE.BoxGeometry(2.2, 0.7, 4.5);
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.y = 0.6;
  body.castShadow = true;
  carGroup.add(body);

  // Капот (сзади)
  const rearGeo = new THREE.BoxGeometry(2, 0.4, 1.5);
  const rear = new THREE.Mesh(rearGeo, bodyMat);
  rear.position.set(0, 0.9, -1.5);
  rear.castShadow = true;
  carGroup.add(rear);

  // Кабина (стекло)
  const cabinGeo = new THREE.BoxGeometry(1.8, 0.6, 1.8);
  const cabin = new THREE.Mesh(cabinGeo, glassMat);
  cabin.position.set(0, 1.25, 0.2);
  cabin.castShadow = true;
  carGroup.add(cabin);

  // Крыша (желтая)
  const roofGeo = new THREE.BoxGeometry(1.6, 0.1, 1.2);
  const roof = new THREE.Mesh(roofGeo, bodyMat);
  roof.position.set(0, 1.55, 0.2);
  carGroup.add(roof);

  // Задние фары (неоновые)
  const tailLightL = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.15, 0.1), lightMat);
  tailLightL.position.set(-0.6, 0.8, -2.26);
  carGroup.add(tailLightL);
  
  const tailLightR = tailLightL.clone();
  tailLightR.position.x = 0.6;
  carGroup.add(tailLightR);

  // Передние фары
  const headLightL = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.15, 0.1), frontLightMat);
  headLightL.position.set(-0.6, 0.7, 2.26);
  carGroup.add(headLightL);
  
  const headLightR = headLightL.clone();
  headLightR.position.x = 0.6;
  carGroup.add(headLightR);

  // Задний бампер
  const bumperGeo = new THREE.BoxGeometry(2.2, 0.3, 0.3);
  const bumper = new THREE.Mesh(bumperGeo, blackMat);
  bumper.position.set(0, 0.3, -2.2);
  carGroup.add(bumper);

  // Выхлопные трубы
  const exhaustGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.3, 8);
  exhaustGeo.rotateX(Math.PI / 2);
  const exhaustMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 1 });
  const ex1 = new THREE.Mesh(exhaustGeo, exhaustMat);
  ex1.position.set(-0.4, 0.3, -2.3);
  carGroup.add(ex1);
  const ex2 = ex1.clone();
  ex2.position.x = 0.4;
  carGroup.add(ex2);

  // Колеса
  const wheelGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.4, 24);
  wheelGeo.rotateZ(Math.PI / 2);
  
  const wheels = [];
  const wheelPositions = [
    [-1.1, 0.45, 1.4], [1.1, 0.45, 1.4],   // Передние
    [-1.1, 0.45, -1.4], [1.1, 0.45, -1.4]  // Задние
  ];

  wheelPositions.forEach(pos => {
    const wheel = new THREE.Group();
    
    const tire = new THREE.Mesh(wheelGeo, tireMat);
    tire.castShadow = true;
    wheel.add(tire);
    
    const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.42, 12).rotateZ(Math.PI/2), rimMat);
    wheel.add(rim);

    wheel.position.set(...pos);
    carGroup.add(wheel);
    wheels.push(wheel);
  });

  carGroup.userData = { wheels };
  return carGroup;
}

const carMesh = createSportsCar();
scene.add(carMesh);

// ==========================================
// 3. ДОРОГА И ОКРУЖЕНИЕ
// ==========================================
const roadWidth = 12;
const roadLength = 1000;
let roadOffset = 0;
let currentCurveX = 0;
let targetCurveX = 0;

// Материал асфальта
const roadMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 });

// Две части дороги (для бесконечной прокрутки)
const road1 = new THREE.Mesh(new THREE.PlaneGeometry(roadWidth, roadLength), roadMat);
road1.rotation.x = -Math.PI / 2;
road1.position.z = -roadLength / 2 + 10;
road1.receiveShadow = true;
scene.add(road1);

const road2 = new THREE.Mesh(new THREE.PlaneGeometry(roadWidth, roadLength), roadMat);
road2.rotation.x = -Math.PI / 2;
road2.position.z = -roadLength * 1.5 + 10;
road2.receiveShadow = true;
scene.add(road2);

// Разметка (неоновая)
const lineMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
const lineGeo = new THREE.PlaneGeometry(0.3, 3);

for (let i = 0; i < 100; i++) {
  const line = new THREE.Mesh(lineGeo, lineMat);
  line.rotation.x = -Math.PI / 2;
  line.position.set(0, 0.02, -i * 10 + 5);
  scene.add(line);
}

// Фонари по бокам
const poleMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
const lampMat = new THREE.MeshBasicMaterial({ color: 0xff00ff });

for (let i = 0; i < 50; i++) {
  const z = -i * 20;
  
  // Левый
  const poleL = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 4), poleMat);
  poleL.position.set(-roadWidth/2 - 1, 2, z);
  scene.add(poleL);
  const lampL = new THREE.Mesh(new THREE.SphereGeometry(0.3), lampMat);
  lampL.position.set(-roadWidth/2 - 1, 4, z);
  scene.add(lampL);

  // Правый
  const poleR = poleL.clone();
  poleR.position.x = roadWidth/2 + 1;
  scene.add(poleR);
  const lampR = lampL.clone();
  lampR.position.x = roadWidth/2 + 1;
  scene.add(lampR);
}

// ==========================================
// 4. УПРАВЛЕНИЕ И ЛОГИКА
// ==========================================
const keys = {};
window.addEventListener('keydown', e => keys[e.key] = true);
window.addEventListener('keyup', e => keys[e.key] = false);

const touchState = { left: false, right: false, gas: false };
const bindBtn = (id, prop) => {
  const el = document.getElementById(id);
  el.addEventListener('touchstart', e => { e.preventDefault(); touchState[prop] = true; });
  el.addEventListener('touchend', e => { e.preventDefault(); touchState[prop] = false; });
  el.addEventListener('mousedown', () => touchState[prop] = true);
  el.addEventListener('mouseup', () => touchState[prop] = false);
};
bindBtn('btn-left', 'left');
bindBtn('btn-right', 'right');
bindBtn('btn-gas', 'gas');

let speed = 0;
const maxSpeed = 60;
const acceleration = 30;
const turnSpeed = 15;
let distance = 0;
let isPlaying = false;

const clock = new THREE.Clock();

function update() {
  requestAnimationFrame(update);
  
  const dt = Math.min(clock.getDelta(), 0.1);
  
  if (isPlaying) {
    // Газ
    if (keys['ArrowUp'] || keys['w'] || touchState.gas) {
      speed += acceleration * dt;
    } else {
      speed -= acceleration * 0.5 * dt; // Замедление
    }
    speed = Math.max(0, Math.min(speed, maxSpeed));
    
    // Движение
    distance += speed * dt;
    
    // Руль (смещение по X)
    if (keys['ArrowLeft'] || keys['a'] || touchState.left) {
      carMesh.position.x -= turnSpeed * dt * (speed / maxSpeed + 0.2);
    }
    if (keys['ArrowRight'] || keys['d'] || touchState.right) {
      carMesh.position.x += turnSpeed * dt * (speed / maxSpeed + 0.2);
    }
    
    // Ограничение дороги
    carMesh.position.x = Math.max(-roadWidth/2 + 1.2, Math.min(roadWidth/2 - 1.2, carMesh.position.x));
    
    // Наклон машины при повороте (визуальный эффект)
    const targetRoll = ((keys['ArrowRight'] || keys['d'] || touchState.right) ? -0.2 : 0) + 
                       ((keys['ArrowLeft'] || keys['a'] || touchState.left) ? 0.2 : 0);
    carMesh.rotation.z += (targetRoll - carMesh.rotation.z) * 10 * dt;

    // Вращение колес
    carMesh.userData.wheels.forEach(w => {
      w.rotation.x += speed * dt * 2;
    });

    // Прокрутка дороги и окружения (иллюзия движения)
    road1.position.z += speed * dt;
    road2.position.z += speed * dt;
    
    if (road1.position.z > roadLength / 2 + 10) road1.position.z -= roadLength * 2;
    if (road2.position.z > roadLength / 2 + 10) road2.position.z -= roadLength * 2;

    // Прокрутка разметки
    scene.children.forEach(c => {
      if (c.geometry && c.geometry.type === 'PlaneGeometry' && c !== road1 && c !== road2) {
        c.position.z += speed * dt;
        if (c.position.z > 20) c.position.z -= 1000;
      }
    });

    // Прокрутка фонарей
    scene.children.forEach(c => {
      if (c.position.z > 20 && !c.geometry.type.includes('Plane')) {
        c.position.z -= 1000;
      }
    });

    // Камера (плавно следует за машиной)
    camera.position.x += (carMesh.position.x * 0.5 - camera.position.x) * 5 * dt;
    camera.position.y = 4;
    camera.position.z = 8;
    camera.lookAt(carMesh.position.x * 0.3, 1, -10);

    // HUD
    document.getElementById('ui-speed').textContent = Math.floor(speed * 3);
    document.getElementById('ui-dist').textContent = Math.floor(distance);
  }

  renderer.render(scene, camera);
}

// Старт
document.getElementById('btn-start').addEventListener('click', () => {
  document.getElementById('menu').style.display = 'none';
  document.getElementById('ui').style.display = 'flex';
  isPlaying = true;
  clock.getDelta(); // Сброс таймера
});

update();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
