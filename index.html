/* ============ СТАВКИ ============ */
function openBetModal(mid,pk,odd){
  if(!isValid(odd)) return;
  var m = matches.find(function(x){ return x.id===mid; });
  if(!m||m.status==='finished'||m.status==='countdown') return;
  activeBet = {matchId:mid, pick:pk, odd:odd, isBuilder:false, isExpress:false};
  var lbl = pk==='home'?m.home:pk==='away'?m.away:pk==='draw'?'Ничья':pk;
  var pl = pk==='home'?'П1':pk==='away'?'П2':pk==='draw'?'X':pk;
  $('betModalTitle').textContent = m.home+' — '+m.away;
  $('betModalSub').textContent = pl+' · '+lbl;
  $('betModalOdd').textContent = odd.toFixed(2);
  $('betModalProb').textContent = ((1/odd)*100).toFixed(1)+'%';
  $('betModalStake').value='';
  $('betModalPotential').textContent='—';
  $('betModalCoupon').style.display = 'block';
  $('betModalBuilder').style.display = (m.sport==='football'||m.sport==='hockey') ? 'block' : 'none';
  $('betModal').classList.add('active');
  updatePotential();
}
function closeBetModal(){ $('betModal').classList.remove('active'); activeBet=null; }
function updatePotential(){
  if(!activeBet) return;
  var s = parseFloat($('betModalStake').value)||0;
  $('betModalPotential').textContent = s>0?fmt(s*activeBet.odd)+' ₽':'—';
}
function placeBet(){
  if(!activeBet) return;
  var stake = parseFloat($('betModalStake').value);
  if(!stake||stake<10||stake>wallet.balance){ toast('lose','⚠️','Некорректная сумма'); return; }

  if(activeBet.isExpress){
    var sel = activeBet.selections.map(function(s){ return {matchId:s.matchId,pick:s.pick,odd:s.odd,label:s.label,match:s.match,status:'pending',sport:s.sport}; });
    wallet.balance -= stake; wallet.totalBet += stake;
    wallet.bets.unshift({id:Date.now(),type:'express',match:'Экспресс · '+sel.length,selections:sel,odd:activeBet.odd,stake:stake,potential:Math.round(stake*activeBet.odd*100)/100,status:'pending',createdAt:new Date().toISOString()});
    coupon = []; saveCoupon(); renderCoupon();
  } else if(activeBet.isBuilder){
    var m = matches.find(function(x){ return x.id===activeBet.matchId; });
    if(!m) return;
    var sel2 = activeBet.selections.map(function(s){ return {matchId:m.id,pick:s.pick,odd:s.odd,label:s.label,match:m.home+' — '+m.away,status:'pending',sport:m.sport}; });
    wallet.balance -= stake; wallet.totalBet += stake;
    wallet.bets.unshift({id:Date.now(),type:'builder',matchId:m.id,match:m.home+' — '+m.away+' (билдер)',sport:m.sport,selections:sel2,odd:activeBet.odd,stake:stake,potential:Math.round(stake*activeBet.odd*100)/100,status:'pending',createdAt:new Date().toISOString()});
    delete builderBets[activeBet.matchId];
  } else {
    var m2 = matches.find(function(x){ return x.id===activeBet.matchId; });
    if(!m2||m2.status==='finished') return;
    wallet.balance -= stake; wallet.totalBet += stake;
    wallet.bets.unshift({id:Date.now(),type:'single',matchId:m2.id,match:m2.home+' — '+m2.away,sport:m2.sport,pick:activeBet.pick,odd:activeBet.odd,stake:stake,potential:Math.round(stake*activeBet.odd*100)/100,status:'pending',minute:m2.minute,score:(m2.scoreHome||0)+':'+(m2.scoreAway||0),createdAt:new Date().toISOString()});
  }
  saveWallet(); flashBalance('win'); renderBalance(); renderHistory(); renderStats(); renderAchiv();
  sBet(); vibe(20);
  toast('info','📋','Ставка принята');
  closeBetModal();
}

function addBuilder(){
  if(!activeBet) return;
  var mid = activeBet.matchId, pk = activeBet.pick, odd = activeBet.odd;
  if(!builderBets[mid]) builderBets[mid] = [];
  for(var i=0;i<builderBets[mid].length;i++) if(builderBets[mid][i].pick===pk) return;
  builderBets[mid].push({pick:pk, odd:odd, label: pk==='home'?'П1':pk==='away'?'П2':pk==='draw'?'X':pk});
  var total = builderBets[mid].reduce(function(a,c){ return a*c.odd; },1);
  var m = matches.find(function(x){ return x.id===mid; });
  closeBetModal();
  activeBet = {matchId:mid, isBuilder:true, odd:total, selections:builderBets[mid].slice()};
  $('betModalTitle').textContent = '🧩 Билдер · '+m.home+' — '+m.away;
  $('betModalSub').textContent = builderBets[mid].map(function(b){ return b.label+' @ '+b.odd.toFixed(2); }).join(' + ');
  $('betModalOdd').textContent = total.toFixed(2);
  $('betModalStake').value='';
  $('betModalPotential').textContent='—';
  $('betModalCoupon').style.display = 'none';
  $('betModalBuilder').style.display = 'none';
  $('betModal').classList.add('active');
  updatePotential();
}

/* ============ КУПОН ============ */
function addCoupon(mid,pk,odd,lbl){
  if(!isValid(odd)) return;
  if(coupon.find(function(c){ return c.matchId===mid; })) return;
  var m = matches.find(function(x){ return x.id===mid; });
  if(!m) return;
  coupon.push({matchId:mid, pick:pk, odd:odd, label:lbl, match:m.home+' — '+m.away, sport:m.sport});
  saveCoupon(); renderCoupon();
}
function renderCoupon(){
  var el = $('couponBar');
  if(!coupon.length){ el.classList.remove('active'); document.body.classList.remove('has-coupon'); return; }
  el.classList.add('active'); document.body.classList.add('has-coupon');
  var total = coupon.reduce(function(a,c){ return a*c.odd; },1);
  el.innerHTML = '<div class="coupon-inner"><div class="coupon-items">'+
    coupon.map(function(c,i){ return '<div class="coupon-item"><div class="coupon-item-info"><div class="coupon-item-match">'+c.match+'</div><div class="coupon-item-pick">'+c.label+' @ '+c.odd.toFixed(2)+'</div></div><button class="coupon-item-remove" data-rm="'+i+'">×</button></div>'; }).join('')+
    '</div><div class="coupon-actions"><button class="coupon-clear" id="couponClear">Очистить</button><button class="coupon-place" id="couponPlace">Экспресс · '+coupon.length+' · @ '+total.toFixed(2)+'</button></div></div>';
  el.querySelectorAll('[data-rm]').forEach(function(b){ b.onclick = function(){ coupon.splice(parseInt(this.dataset.rm),1); saveCoupon(); renderCoupon(); }; });
  var cb = $('couponClear'); if(cb) cb.onclick = function(){ coupon=[]; saveCoupon(); renderCoupon(); };
  var pb = $('couponPlace'); if(pb) pb.onclick = openExpress;
}
function openExpress(){
  if(coupon.length<2) return;
  var total = coupon.reduce(function(a,c){ return a*c.odd; },1);
  activeBet = {isExpress:true, odd:total, selections:coupon.slice()};
  $('betModalTitle').textContent = 'Экспресс · '+coupon.length;
  $('betModalSub').textContent = coupon.map(function(c){ return c.label+' @ '+c.odd.toFixed(2); }).join(' + ');
  $('betModalOdd').textContent = total.toFixed(2);
  $('betModalStake').value='';
  $('betModalPotential').textContent='—';
  $('betModalCoupon').style.display = 'none';
  $('betModalBuilder').style.display = 'none';
  $('betModal').classList.add('active');
  updatePotential();
}

/* ============ КЭШАУТ ============ */
function cashoutValue(b,m){
  if(!m||m.status!=='live'||b.status!=='pending') return 0;
  if(b.type==='express'){
    var cv=1;
    for(var i=0;i<b.selections.length;i++){
      var sel=b.selections[i];
      var sm = matches.find(function(x){ return Number(x.id)===Number(sel.matchId); });
      if(!sm) return 0;
      if(sm.status==='finished'){ if(sel.status==='lost') return 0; continue; }
      if(sm.status==='live'){
        var ods = computeOdds(sm);
        var cur = ods[sel.pick];
        if(!isValid(cur)) return 0;
        cv *= 1/cur;
      } else return 0;
    }
    var fair = b.potential * cv;
    var pay = Math.max(b.stake*0.1, Math.round(fair*0.9*100)/100);
    return Math.min(pay, b.potential*0.98);
  }
  if(b.type==='builder'){
    var sm2 = matches.find(function(x){ return Number(x.id)===Number(b.matchId); });
    if(!sm2||sm2.status!=='live') return 0;
    return Math.round(b.stake*0.5*100)/100;
  }
  var cur2 = computeOdds(m)[b.pick];
  if(!isValid(cur2)) return Math.round(b.stake*0.5*100)/100;
  var fair2 = b.potential / cur2;
  var pay2 = Math.max(b.stake*0.1, Math.round(fair2*0.92*100)/100);
  return Math.min(pay2, b.potential);
}
function doCashout(id){
  var b = wallet.bets.find(function(x){ return x.id===id; });
  if(!b||b.status!=='pending') return;
  var co=0;
  if(b.type==='express'||b.type==='builder'){
    for(var i=0;i<b.selections.length;i++){
      var sel=b.selections[i];
      var sm = matches.find(function(x){ return Number(x.id)===Number(sel.matchId); });
      if(sm&&sm.status==='live'){ co = cashoutValue(b,sm); break; }
    }
  } else {
    var m = matches.find(function(x){ return x.id===b.matchId; });
    if(m) co = cashoutValue(b,m);
  }
  if(co<=0) return;
  b.status='won'; b.payout=co; b.cashout=true;
  wallet.balance += co; wallet.totalWon += co;
  saveWallet(); flashBalance('win'); renderBalance(); renderHistory(); renderStats(); renderAchiv();
  sBet();
  toast('win','💰','Кэшаут: +'+fmt(co)+' ₽');
}

/* ============ РАСЧЁТ СТАВОК ============ */
function checkSel(m, pick){
  if(!m||m.status!=='finished') return 'pending';
  var tot = (m.scoreHome||0)+(m.scoreAway||0);

  // Футбол/хоккей
  if(pick==='home') return m.scoreHome > m.scoreAway ? 'won' : 'lost';
  if(pick==='away') return m.scoreAway > m.scoreHome ? 'won' : 'lost';
  if(pick==='draw') return m.scoreHome===m.scoreAway?'won':'lost';
  if(pick==='1X') return m.scoreHome >= m.scoreAway ? 'won' : 'lost';
  if(pick==='12') return m.scoreHome !== m.scoreAway ? 'won' : 'lost';
  if(pick==='X2') return m.scoreHome <= m.scoreAway ? 'won' : 'lost';
  var tO = pick.match(/^ТБ\s*([\d.]+)$/);
  var tU = pick.match(/^ТМ\s*([\d.]+)$/);
  if(tO) return tot > parseFloat(tO[1]) ? 'won' : 'lost';
  if(tU) return tot < parseFloat(tU[1]) ? 'won' : 'lost';
  var f1 = pick.match(/^Ф1\s*[−\-]([\d.]+)$/);
  if(f1) return (m.scoreHome-m.scoreAway) > parseFloat(f1[1]) ? 'won' : 'lost';
  var f2 = pick.match(/^Ф2\s*[−\-]([\d.]+)$/);
  if(f2) return (m.scoreAway-m.scoreHome) > parseFloat(f2[1]) ? 'won' : 'lost';
  var f1p = pick.match(/^Ф1\s*\+([\d.]+)$/);
  if(f1p) return (m.scoreHome-m.scoreAway) > -parseFloat(f1p[1]) ? 'won' : 'lost';
  var f2p = pick.match(/^Ф2\s*\+([\d.]+)$/);
  if(f2p) return (m.scoreAway-m.scoreHome) > -parseFloat(f2p[1]) ? 'won' : 'lost';
  if(pick==='Обе · Да') return (m.scoreHome >= 1 && m.scoreAway >= 1)?'won':'lost';
  if(pick==='Обе · Нет') return !(m.scoreHome >= 1 && m.scoreAway >= 1)?'won':'lost';
  if(pick==='Чёт') return tot % 2 === 0?'won':'lost';
  if(pick==='Нечет') return tot % 2 !== 0?'won':'lost';
  var cs = pick.match(/^Счёт\s+(\d+):(\d+)$/);
  if(cs) return (m.scoreHome === +cs[1] && m.scoreAway === +cs[2])?'won':'lost';
  // 1-й тайм — не отслеживаем отдельно (упрощённо — считаем через финал)
  return 'lost';
}

function settleBets(){
  var changed=false;
  wallet.bets.forEach(function(b){
    if(b.status!=='pending') return;
    if(b.type==='express'||b.type==='builder'){
      var anyL=false, allW=true, allD=true;
      for(var i=0;i<b.selections.length;i++){
        var sel = b.selections[i];
        if(sel.status==='lost'){ anyL=true; continue; }
        if(sel.status==='won') continue;
        var m = matches.find(function(x){ return Number(x.id)===Number(sel.matchId); });
        if(!m || m.status!=='finished'){ allD=false; allW=false; continue; }
        var r = checkSel(m, sel.pick);
        sel.status = r;
        if(r==='lost'){ anyL=true; allW=false; }
      }
      if(anyL){ b.status='lost'; sLose(); flashBalance('lose'); changed=true; wallet.profitHistory.push({t:Date.now(),v:wallet.totalWon-wallet.totalBet}); return; }
      if(allD && allW && b.selections.every(function(s){ return s.status==='won'; })){
        b.status='won';
        b.payout = Math.round(b.stake*b.odd*100)/100;
        wallet.balance += b.payout;
        wallet.totalWon += b.payout;
        sWin(); vibe(50); flashBalance('win');
        changed=true;
        wallet.profitHistory.push({t:Date.now(),v:wallet.totalWon-wallet.totalBet});
        if(wallet.profitHistory.length>100) wallet.profitHistory.shift();
        toast('win','🏆','Экспресс зашёл: +'+fmt(b.payout)+' ₽');
      }
      return;
    }
    var m2 = matches.find(function(x){ return Number(x.id)===Number(b.matchId); });
    if(!m2 || m2.status!=='finished') return;
    var r2 = checkSel(m2, b.pick);
    if(r2==='won'){
      b.status='won';
      b.payout = Math.round(b.stake*b.odd*100)/100;
      wallet.balance += b.payout;
      wallet.totalWon += b.payout;
      sWin(); vibe(50); flashBalance('win');
      toast('win','✅','Зашла: +'+fmt(b.payout)+' ₽');
    } else {
      b.status='lost';
      sLose(); flashBalance('lose');
      toast('lose','❌','Не зашла: -'+fmt(b.stake)+' ₽');
    }
    changed=true;
    wallet.profitHistory.push({t:Date.now(),v:wallet.totalWon-wallet.totalBet});
    if(wallet.profitHistory.length>100) wallet.profitHistory.shift();
  });
  if(changed){
    saveWallet(); renderBalance(); renderHistory(); renderStats(); renderAchiv();
  }
}

/* ============ CSV ============ */
function exportCSV(){
  var rows = [['Дата','Матч','Тип','Исход','Кэф','Ставка','Потенциал','Статус','Выплата']];
  wallet.bets.forEach(function(b){
    rows.push([new Date(b.createdAt).toLocaleString('ru-RU'), b.match, b.type||'single', b.pick||'', b.odd, b.stake, b.potential, b.status, b.payout||0]);
  });
  var csv = rows.map(function(r){ return r.map(function(v){ return '"'+v+'"'; }).join(','); }).join('\n');
  var blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'openbet_'+Date.now()+'.csv';
  a.click();
}

/* ============ ГЛАВНЫЙ ЦИКЛ ============ */
function tick(){
  resetDaily();
  for(var i=0;i<matches.length;i++){
    if(matches[i].status==='live' || matches[i].status==='countdown'){
      try{ tickMatch(matches[i]); }
      catch(e){ console.error('tick err', matches[i].id, e); matches[i].status='finished'; }
    }
  }
  for(var j=0;j<matches.length;j++){
    var m2 = matches[j];
    if(m2.status==='finished' && !m2.countdownStarted){
      m2.finishedAt = m2.finishedAt || Date.now();
      if(Date.now()-m2.finishedAt > 5000){
        m2.countdownStarted = true;
        m2.status='countdown';
        m2.countdownLeft = 45;
      }
    }
  }
  settleBets();
  // Добавляем новые матчи
  if(matches.filter(function(m){ return m.status==='live'||m.status==='countdown'; }).length < 8){
    var cnt = {football:0, hockey:0, volleyball:0, ufc:0};
    matches.forEach(function(m){
      if((m.status==='live'||m.status==='countdown') && cnt[m.sport]!==undefined) cnt[m.sport]++;
    });
    var targets = {football:4, hockey:2, volleyball:2, ufc:2};
    ['football','hockey','volleyball','ufc'].forEach(function(sp){
      if(cnt[sp] < targets[sp]){
        var need = targets[sp]-cnt[sp];
        for(var n=0;n<need;n++){
          if(sp==='football') matches.push(newFootball());
          else if(sp==='hockey') matches.push(newHockey());
          else if(sp==='volleyball') matches.push(newVolleyball());
          else matches.push(newUFC());
        }
      }
    });
  }
  if(matches.length > 25){
    var seen = new Set();
    matches = matches.filter(function(m){
      var k = m.home+'|'+m.away+'|'+m.sport;
      if(seen.has(k)) return false;
      seen.add(k);
      return true;
    });
    if(matches.length > 25) matches = matches.slice(0,25);
  }
  renderMatches();
  if(currentTab==='stats') renderStats();
  if(currentTab==='history') renderHistory();
  if(currentTab==='top') renderTop();
  if(currentTab==='achiv') renderAchiv();
}

/* ============ ДЕЛЕГИРОВАНИЕ ============ */
document.addEventListener('click', function(e){
  var tb = e.target.closest('[data-toggle-match]');
  if(tb){
    var tid = parseInt(tb.dataset.toggleMatch);
    if(expandedMatches.has(tid)) expandedMatches.delete(tid);
    else expandedMatches.add(tid);
    renderMatches();
    return;
  }
  var mb = e.target.closest('.odd-btn[data-match-id]');
  if(mb && !mb.disabled && !mb.classList.contains('disabled')){
    var mid = parseInt(mb.dataset.matchId);
    var pk = mb.dataset.pick;
    var odd = parseFloat(mb.dataset.odd);
    if(!isNaN(mid) && pk && isValid(odd)){ openBetModal(mid,pk,odd); return; }
  }
  var minb = e.target.closest('.odd-mini[data-mid]');
  if(minb && !minb.disabled && !minb.classList.contains('disabled')){
    var mid2 = parseInt(minb.dataset.mid);
    var pk2 = decodeURIComponent(minb.dataset.mk);
    var odd2 = parseFloat(minb.dataset.odd);
    if(!isNaN(mid2) && pk2 && isValid(odd2)){ openBetModal(mid2,pk2,odd2); return; }
  }
  var eb = e.target.closest('[data-extras]');
  if(eb){
    var id = parseInt(eb.dataset.extras);
    if(openExtras.has(id)) openExtras.delete(id);
    else openExtras.add(id);
    renderMatches();
    return;
  }
  var cb = e.target.closest('[data-cashout]');
  if(cb){ e.stopPropagation(); doCashout(parseInt(cb.dataset.cashout)); return; }
  var hi = e.target.closest('[data-history]');
  if(hi && !e.target.closest('[data-cashout]')){
    var bid = parseInt(hi.dataset.history);
    var bet = wallet.bets.find(function(x){ return x.id===bid; });
    if(bet && bet.matchId){
      var m = matches.find(function(x){ return x.id===bet.matchId; });
      if(!m) toast('info','ℹ️','Матч заменён');
      else if(m.status==='finished') toast('info','ℹ️','Завершён: '+m.home+' — '+m.away);
      else toast('info','ℹ️',m.home+' — '+m.away+' · live');
    }
    return;
  }
  if(e.target.closest('#balanceBox')){ claimBonus(); return; }
});

  }
}, 100);
