<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b0b12">
<title>⚡ OpenBet v25 — Real Engine</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
:root{--bg:#0b0b12;--bg2:#131320;--bg3:#1a1a2a;--card:#181826;--card-hover:#1e1e30;--border:rgba(90,90,130,.15);--border-2:rgba(110,110,160,.3);--text:#fff;--text-2:#b8b8d0;--muted:#6e6e88;--accent:#7b5cff;--accent-2:#00d4ff;--green:#00e676;--red:#ff3860;--gold:#ffb800;--r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:20px}
body.light{--bg:#f5f6fa;--bg2:#ebeef5;--bg3:#e2e6f0;--card:#fff;--card-hover:#f8f9fc;--border:rgba(90,90,130,.12);--border-2:rgba(90,90,130,.25);--text:#0e0e1c;--text-2:#4a4a60;--muted:#8585a0}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .3s,color .3s}
body.has-coupon{padding-bottom:130px}
.header{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);padding:12px 16px}
.header-inner{max-width:1240px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{font-size:19px;font-weight:900;letter-spacing:-.4px;cursor:pointer;white-space:nowrap;user-select:none;display:flex;align-items:center;gap:8px}
.logo-icon{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#7b5cff,#00d4ff);display:flex;align-items:center;justify-content:center;font-size:15px}
.logo span{background:linear-gradient(135deg,#7b5cff,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-actions{display:flex;align-items:center;gap:6px}
.balance{background:var(--card);border:1px solid var(--border);padding:8px 14px;border-radius:var(--r-md);font-weight:800;font-size:13px;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;cursor:pointer;user-select:none;transition:border-color .2s,box-shadow .2s;white-space:nowrap}
.balance:hover{border-color:var(--accent)}
.balance.flash-bonus{border-color:var(--gold);box-shadow:0 0 24px rgba(255,184,0,.4)}
.balance.flash-win{border-color:var(--green);box-shadow:0 0 20px rgba(0,230,118,.4)}
.balance.flash-lose{border-color:var(--red);box-shadow:0 0 20px rgba(255,56,96,.4)}
.icon-btn{width:38px;height:38px;border-radius:var(--r-md);background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:15px;transition:all .15s}
.icon-btn:hover{border-color:var(--accent)}
.icon-btn.muted{opacity:.5}
.container{max-width:1240px;margin:0 auto;padding:16px}
.nav-tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.nav-tabs::-webkit-scrollbar{display:none}
.nav-tab{padding:9px 16px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);font-weight:700;color:var(--muted);font-size:13px;white-space:nowrap;transition:all .15s;display:flex;align-items:center;gap:6px}
.nav-tab:hover{color:var(--text)}
.nav-tab.active{color:var(--text);border-color:var(--accent);background:rgba(123,92,255,.1)}
.session{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:12px 16px;margin-bottom:14px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;font-size:12.5px}
.session .label{color:var(--muted);font-weight:600}
.session .value{font-weight:800;font-variant-numeric:tabular-nums}
.session .value.green{color:var(--green)}
.session .value.red{color:var(--red)}
.session .value.gold{color:var(--gold)}
.session .spacer{margin-left:auto}
.bonus-hint{font-size:11.5px;color:var(--gold);font-weight:700}
.sport-filters{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.sport-filters::-webkit-scrollbar{display:none}
.sport-chip{padding:9px 16px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);font-weight:700;color:var(--muted);font-size:13px;white-space:nowrap;transition:all .15s;display:flex;align-items:center;gap:6px}
.sport-chip:hover{color:var(--text)}
.sport-chip.active{color:var(--text);border-color:var(--accent);background:rgba(123,92,255,.1)}
.matches-list{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:900px){.matches-list{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1300px){.matches-list{grid-template-columns:repeat(3,1fr)}}
.match{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:14px;transition:border-color .15s}
.match:hover{border-color:var(--border-2)}
.match.finished{opacity:.55}
.match-head{display:flex;align-items:center;gap:10px}
.match-sport{font-size:16px}
.match-league{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.match-status{font-size:10px;padding:4px 10px;border-radius:6px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.match-status.live{background:var(--red);color:#fff}
.match-status.live::before{content:'●';margin-right:4px;font-size:8px}
.match-status.finished{background:rgba(120,120,140,.25);color:var(--muted)}
.match-status.countdown{background:var(--accent-2);color:#000}
.teams{display:flex;flex-direction:column;gap:10px}
.team-line{display:flex;align-items:center;justify-content:space-between;gap:10px}
.team-info{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.team-logo-wrap{position:relative;flex-shrink:0}
.team-logo{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:#fff;border:2px solid rgba(255,255,255,.1)}
.team-logo.scored{animation:avScore 1s ease}
@keyframes avScore{0%,100%{transform:scale(1)}40%{transform:scale(1.35);box-shadow:0 0 20px var(--green)}}
.team-rating{position:absolute;top:-3px;right:-3px;background:var(--bg);border:1px solid var(--border);border-radius:5px;font-size:9px;font-weight:800;padding:1px 5px;color:var(--accent-2)}
.team-flag{position:absolute;bottom:-3px;right:-3px;font-size:13px}
.team-name{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team-score{font-weight:900;font-size:26px;font-variant-numeric:tabular-nums;letter-spacing:-1px;min-width:32px;text-align:right;transition:transform .3s,color .3s}
.team-score.scored{animation:scFlash 1s ease}
@keyframes scFlash{0%,100%{transform:scale(1)}30%{transform:scale(1.5);text-shadow:0 0 20px var(--green)}}
.match-info{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);padding:8px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);flex-wrap:wrap}
.match-info .time{font-weight:700;color:var(--text-2);font-variant-numeric:tabular-nums}
.match-commentary{font-size:11.5px;color:var(--accent-2);font-weight:600;padding:6px 10px;background:rgba(0,212,255,.06);border-radius:6px;font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stats-bar{display:flex;gap:8px;padding:8px 0;font-size:11px;color:var(--muted);font-weight:700;justify-content:space-between}
.stats-bar .s-val{color:var(--text);font-variant-numeric:tabular-nums}
.xg-bar{display:flex;height:5px;border-radius:3px;overflow:hidden;background:rgba(120,120,160,.15);position:relative}
.xg-bar .h{background:linear-gradient(90deg,var(--accent-2),var(--accent-2))}
.xg-bar .a{background:linear-gradient(90deg,var(--red),var(--red))}
.hp-row{display:flex;gap:6px;align-items:center;font-size:10px;font-weight:700;color:var(--muted)}
.hp-bar{flex:1;height:4px;background:rgba(120,120,160,.2);border-radius:2px;overflow:hidden;position:relative}
.hp-bar i{display:block;height:100%;transition:width .3s}
.hp-bar .hp-h{background:linear-gradient(90deg,var(--green),var(--green))}
.hp-bar .hp-a{background:linear-gradient(90deg,var(--gold),var(--gold))}
.hp-bar.low i{background:var(--red)!important}
.progress{display:flex;gap:3px;height:4px}
.progress-seg{flex:1;background:rgba(120,120,160,.18);border-radius:2px;overflow:hidden;position:relative}
.progress-seg.done{background:var(--green)}
.progress-seg.active::after{content:'';position:absolute;left:0;top:0;bottom:0;width:var(--p,0%);background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.period-score{display:flex;gap:14px;font-size:11px;color:var(--muted);font-weight:700;padding:6px 0}
.period-score span b{color:var(--text);font-variant-numeric:tabular-nums}
.ufc-result{background:linear-gradient(135deg,rgba(255,184,0,.12),rgba(255,56,96,.05));border:1px solid rgba(255,184,0,.35);border-radius:var(--r-md);padding:12px;font-size:12.5px;font-weight:700;line-height:1.5}
.ufc-result .win{color:var(--gold);font-weight:800}
.odds-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.odds-row.two-col{grid-template-columns:1fr 1fr}
.odd-btn{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-md);padding:12px 8px;text-align:center;display:flex;flex-direction:column;gap:4px;transition:all .15s;font-family:inherit;color:var(--text)}
.odd-btn:hover:not(:disabled):not(.disabled){border-color:var(--accent);background:var(--card-hover)}
.odd-btn:active:not(:disabled):not(.disabled){transform:scale(.98)}
.odd-btn:disabled,.odd-btn.disabled{opacity:.3;cursor:not-allowed}
.odd-btn.up{border-color:rgba(0,230,118,.4)}
.odd-btn.down{border-color:rgba(255,56,96,.4)}
.odd-label{font-size:11px;color:var(--muted);font-weight:600}
.odd-value{font-size:17px;font-weight:800;color:var(--accent-2);font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.extras{border-top:1px solid var(--border);padding-top:12px}
.extras-toggle{color:var(--accent-2);font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px;padding:4px 0}
.extras-toggle.open{color:var(--muted)}
.extras-grid{display:none;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:10px}
.extras-grid.open{display:grid}
@media(min-width:600px){.extras-grid{grid-template-columns:repeat(3,1fr)}}
.odd-mini{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0;transition:all .15s;font-family:inherit;color:var(--text)}
.odd-mini:hover:not(.disabled){border-color:var(--accent)}
.odd-mini.disabled{opacity:.3;cursor:not-allowed}
.odd-mini-label{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.odd-mini-value{font-size:12.5px;font-weight:800;color:var(--accent-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-icon{font-size:48px;margin-bottom:12px;opacity:.5}
.empty-text{font-size:14px;font-weight:600}
.history-filters{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.history-filters::-webkit-scrollbar{display:none}
.history-chip{padding:8px 14px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);font-weight:700;color:var(--muted);font-size:12.5px;white-space:nowrap}
.history-chip.active{color:var(--text);border-color:var(--accent)}
.history-list{display:flex;flex-direction:column;gap:10px}
.history-item{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:border-color .15s}
.history-item:hover{border-color:var(--border-2)}
.history-item.won{border-left:4px solid var(--green)}
.history-item.lost{border-left:4px solid var(--red)}
.history-item.pending{border-left:4px solid var(--gold)}
.history-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.history-match{font-weight:700;font-size:14px;line-height:1.3}
.history-meta{font-size:11.5px;color:var(--muted);margin-top:2px}
.history-amount{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.history-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:10px;border-top:1px solid var(--border)}
.history-odd{font-size:12px;color:var(--muted)}
.history-odd b{color:var(--accent-2);font-weight:800}
.history-status{font-weight:800;padding:4px 12px;border-radius:6px;text-transform:uppercase;letter-spacing:.3px;font-size:10.5px;white-space:nowrap}
.history-status.won{background:rgba(0,230,118,.15);color:var(--green)}
.history-status.lost{background:rgba(255,56,96,.15);color:var(--red)}
.history-status.pending{background:rgba(255,184,0,.15);color:var(--gold)}
.cashout-btn{background:linear-gradient(135deg,var(--green),#00b050);color:#000;padding:10px 18px;border-radius:var(--r-md);font-weight:800;font-size:12.5px;align-self:flex-start}
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px}
@media(min-width:700px){.stats-grid{grid-template-columns:repeat(4,1fr)}}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px}
.stat-label{font-size:11.5px;color:var(--muted);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.stat-value{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.stat-value.green{color:var(--green)}
.stat-value.red{color:var(--red)}
.stat-value.gold{color:var(--gold)}
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;margin-bottom:16px}
.chart-title{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px}
.chart-canvas{width:100%;height:200px;display:block}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ach{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 12px;text-align:center;opacity:.4;transition:all .2s}
.ach.unlocked{opacity:1;border-color:var(--gold);box-shadow:0 0 24px rgba(255,184,0,.15)}
.ach-icon{font-size:32px;margin-bottom:10px}
.ach-name{font-size:12px;font-weight:700;margin-bottom:3px}
.ach-desc{font-size:10.5px;color:var(--muted)}
.leaderboard{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px}
.lb-header{color:var(--muted);font-size:12.5px;margin-bottom:14px;font-weight:600}
.lb-header b{color:var(--gold);font-weight:800}
.lb-row{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);font-size:13px}
.lb-row:last-child{border-bottom:none}
.lb-row.me{background:rgba(123,92,255,.12);margin:0 -16px;padding:12px 16px;border-radius:var(--r-md);border-bottom:none}
.lb-rank{font-weight:900;font-size:16px;color:var(--muted);text-align:center}
.lb-rank.top1{color:var(--gold)}
.lb-rank.top2{color:#c0c0c0}
.lb-rank.top3{color:#cd7f32}
.lb-name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-name.me{color:var(--accent-2)}
.lb-value{font-weight:800;color:var(--green);font-variant-numeric:tabular-nums;font-size:13px}
.tab-content{display:none}
.tab-content.active{display:block;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal-overlay.active{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border-2);border-radius:var(--r-xl);padding:24px;max-width:440px;width:100%;max-height:90vh;overflow-y:auto;animation:popIn .25s}
@keyframes popIn{from{transform:scale(.94);opacity:0}}
.modal h3{font-size:17px;margin-bottom:6px}
.modal-sub{color:var(--muted);font-size:13px;margin-bottom:20px;line-height:1.5}
.modal-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.modal-row:last-of-type{border-bottom:none}
.modal-row .label{color:var(--muted)}
.modal-row .value{font-weight:800;font-variant-numeric:tabular-nums}
.modal input[type="number"]{width:100%;background:var(--card);border:1px solid var(--border);padding:14px 16px;border-radius:var(--r-md);font-size:16px;margin:16px 0 12px;font-weight:800;font-variant-numeric:tabular-nums}
.modal input[type="number"]:focus{outline:none;border-color:var(--accent)}
.quick-stakes{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:16px}
.quick-stake{padding:10px 4px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);font-size:11.5px;font-weight:700;text-align:center}
.quick-stake:hover{border-color:var(--accent)}
.modal-actions{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;padding:14px;border-radius:var(--r-md);font-weight:800;font-size:14px;transition:all .15s}
.btn:active:not(:disabled){transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff}
.btn-secondary{background:var(--card);border:1px solid var(--border)}
.btn-coupon{background:rgba(123,92,255,.15);border:1px solid var(--accent);color:var(--accent-2)}
.btn-builder{background:rgba(255,184,0,.15);border:1px solid var(--gold);color:var(--gold)}
.coupon-bar{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:2px solid var(--accent);padding:12px 16px;transform:translateY(100%);transition:transform .3s;z-index:200;box-shadow:0 -8px 40px rgba(0,0,0,.5)}
.coupon-bar.active{transform:translateY(0)}
.coupon-inner{max-width:1240px;margin:0 auto}
.coupon-items{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px}
.coupon-items::-webkit-scrollbar{height:4px}
.coupon-item{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:8px 12px;display:flex;align-items:center;gap:10px;min-width:200px;font-size:12px}
.coupon-item-info{flex:1;min-width:0}
.coupon-item-match{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.coupon-item-pick{color:var(--accent-2);font-weight:700;font-size:11px;margin-top:2px}
.coupon-item-remove{color:var(--red);font-size:20px;padding:0 4px;line-height:1}
.coupon-actions{display:flex;gap:8px;justify-content:flex-end}
.coupon-clear{border:1px solid var(--border);color:var(--muted);padding:10px 16px;border-radius:var(--r-md);font-weight:700;font-size:12.5px}
.coupon-place{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;padding:10px 20px;border-radius:var(--r-md);font-weight:800;font-size:13px}
.skeleton{background:linear-gradient(90deg,var(--card) 25%,var(--card-hover) 50%,var(--card) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:var(--r-lg)}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skeleton-match{height:200px}
.toast-container{position:fixed;top:80px;right:16px;z-index:2000;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:300px}
.toast{background:var(--bg2);border:1px solid var(--border-2);border-radius:var(--r-md);padding:12px 16px;font-size:12.5px;font-weight:700;box-shadow:0 8px 30px rgba(0,0,0,.5);animation:toastIn .3s;pointer-events:auto;display:flex;align-items:center;gap:8px}
.toast.win{border-color:var(--green);color:var(--green)}
.toast.lose{border-color:var(--red);color:var(--red)}
.toast.info{border-color:var(--accent-2);color:var(--accent-2)}
.toast.gold{border-color:var(--gold);color:var(--gold)}
@keyframes toastIn{from{transform:translateX(120%);opacity:0}}
@media(max-width:600px){
.header{padding:10px 12px}
.logo{font-size:17px}

var audio = null;
function beep(f,d,t,v){
  if(!soundOn) return;
  t=t||'sine'; v=v||0.08;
  try{
    if(!audio) audio=new (window.AudioContext||window.webkitAudioContext)();
    var o=audio.createOscillator(),g=audio.createGain();
    o.type=t; o.frequency.value=f;
    g.gain.setValueAtTime(v,audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audio.currentTime+d);
    o.connect(g); g.connect(audio.destination);
    o.start(); o.stop(audio.currentTime+d);
  }catch(e){}
}

var UFC_ROUND_SEC = 300;
var UFC_BREAK_SEC = 60;
var UFC_MAX_ROUNDS = 5;

function newUFC(){
  var divs=[...new Set(UFC.map(function(f){return f.div;}))];
  var div=pick(divs);
  var fighters=UFC.filter(function(f){return f.div===div;});
  var pair=pickTwo(fighters);
  var h=pair[0], a=pair[1];
  return {
    id: nextId++, sport:'ufc', league:'UFC · '+div,
    home: h.n, away: a.n,
    homeRating: h.rt, awayRating: a.rt,
    homeCountry: h.country, awayCountry: a.country,
    homeFighter: {power:h.power,acc:h.acc,td:h.td,style:h.style,hpMax:h.hp,stamMax:h.stam},
    awayFighter: {power:a.power,acc:a.acc,td:a.td,style:a.style,hpMax:a.hp,stamMax:a.stam},
    homeHP: h.hp, awayHP: a.hp,
    homeStam: h.stam, awayStam: a.stam,
    round: 1, roundSec: 0, minute: 0, maxMinute: UFC_MAX_ROUNDS*UFC_ROUND_SEC,
    phase: 'fight',
    scoreHome: 0, scoreAway: 0,
    roundScores: [],
    status: 'live', momentum: 0,
    finalResult: null, justScored: null,
    commentary: 'Начало боя'
  };
}

function simulateUFCTick(m){
  if(m.phase==='break'){
    m.roundSec += 1;
    if(m.roundSec >= UFC_BREAK_SEC){
      m.phase='fight'; m.roundSec=0;
      m.homeStam = Math.min(m.homeFighter.stamMax, m.homeStam + 18);
      m.awayStam = Math.min(m.awayFighter.stamMax, m.awayStam + 18);
      m.commentary = 'Раунд ' + m.round + ' начинается';
    }
    return;
  }
  m.roundSec += 1;
  m.minute += 1;
  var secInRound = m.roundSec;

  // Оба бойца могут действовать
  var hAcc = m.homeFighter.acc * (m.homeStam/m.homeFighter.stamMax);
  var aAcc = m.awayFighter.acc * (m.awayStam/m.awayFighter.stamMax);
  var hPow = m.homeFighter.power * (0.7 + 0.3 * (m.homeStam/m.homeFighter.stamMax));
  var aPow = m.awayFighter.power * (0.7 + 0.3 * (m.awayStam/m.awayFighter.stamMax));

  // Шанс активности в секунду
  var hAct = hAcc / 100 * 0.35;
  var aAct = aAcc / 100 * 0.35;
  var hTd = m.homeFighter.td / 100 * 0.04 * (m.homeStam/m.homeFighter.stamMax);
  var aTd = m.awayFighter.td / 100 * 0.04 * (m.awayStam/m.awayFighter.stamMax);

  var rng = Math.random;

  // Takedown attempt (grappler / mixed)
  if(rng() < hTd && m.homeFighter.style !== 'striker'){
    m.commentary = m.home + ' проходит в партер!';
    // Добивание в партере
    var dmg = hPow * 0.35;
    m.awayHP -= dmg;
    m.homeStam -= 2;
    // Шанс субмишена
    if(rng() < 0.08 && m.awayHP < 40){
      finishUFC(m, 'home', 'Сабмишн', m.round);
      return;
    }
  }
  if(rng() < aTd && m.awayFighter.style !== 'striker'){
    m.commentary = m.away + ' проходит в партер!';
    var dmg2 = aPow * 0.35;
    m.homeHP -= dmg2;
    m.awayStam -= 2;
    if(rng() < 0.08 && m.homeHP < 40){
      finishUFC(m, 'away', 'Сабмишн', m.round);
      return;
    }
  }

  // Удар хозяина
  if(rng() < hAct){
    if(rng() < hAcc/100 * 0.55){
      var dmg3 = hPow * 0.18;
      m.awayHP -= dmg3;
      m.homeStam -= 1.2;
      m.awayStam -= 0.8;
      if(rng() < 0.02 && m.awayHP < 15){
        finishUFC(m, 'home', 'KO/TKO', m.round);
        return;
      }
    } else {
      m.homeStam -= 1.5;
    }
  }
  // Удар гостя
  if(rng() < aAct){
    if(rng() < aAcc/100 * 0.55){
      var dmg4 = aPow * 0.18;
      m.homeHP -= dmg4;
      m.awayStam -= 1.2;
      m.homeStam -= 0.8;
      if(rng() < 0.02 && m.homeHP < 15){
        finishUFC(m, 'away', 'KO/TKO', m.round);
        return;
      }
    } else {
      m.awayStam -= 1.5;
    }
  }

  // Ограничение
  if(m.homeStam < 5) m.homeStam = 5;
  if(m.awayStam < 5) m.awayStam = 5;
  if(m.homeHP < 0) m.homeHP = 0;
  if(m.awayHP < 0) m.awayHP = 0;

  // Конец раунда
  if(secInRound >= UFC_ROUND_SEC){
    // Оценка раунда
    var scoreDiff = (m.homeHP - m.awayHP) + (m.homeStam - m.awayStam) * 0.3;
    var rh = 10, ra = 10;
    if(scoreDiff > 15){ rh = 10; ra = 9; }
    else if(scoreDiff > 8){ rh = 10; ra = 9; }
    else if(scoreDiff > 2){ rh = 10; ra = 9; }
    else if(scoreDiff < -15){ ra = 10; rh = 8; }
    else if(scoreDiff < -8){ ra = 10; rh = 9; }
    else if(scoreDiff < -2){ ra = 10; rh = 9; }
    m.roundScores.push({h:rh, a:ra});

    if(m.round >= UFC_MAX_ROUNDS){
      // Решение
      var totalH = 0, totalA = 0;
      m.roundScores.forEach(function(rs){ totalH+=rs.h; totalA+=rs.a; });
      if(m.homeHP < 15 && m.awayHP > m.homeHP*2){
        finishUFC(m, 'away', 'KO/TKO', m.round);
        return;
      }
      if(m.awayHP < 15 && m.homeHP > m.awayHP*2){
        finishUFC(m, 'home', 'KO/TKO', m.round);
        return;
      }
      var winner = totalH >= totalA ? 'home' : 'away';
      finishUFC(m, winner, 'Решение', 5);
      return;
    }

    m.round += 1;
    m.phase = 'break';
    m.roundSec = 0;
    m.commentary = 'Перерыв. Раунд ' + (m.round-1) + ' завершён';
  }
}

function finishUFC(m, winner, method, round){
  m.finalResult = {winner:winner, method:method, round:round};
  if(winner==='home'){ m.scoreHome=1; m.scoreAway=0; m.justScored='home'; }
  else{ m.scoreHome=0; m.scoreAway=1; m.justScored='away'; }
  m.status='finished';
  m.finishedAt=Date.now();
  var name = winner==='home'?m.home:m.away;
  m.commentary = '🏆 ' + name + ' побеждает · ' + method + ' · R' + round;
}

var VOLLEY_ROUNDSEC = 300;
function newVolleyball(){
  var pair=pickTwo(VOLLEYBALL);
  var h=pair[0], a=pair[1];
  return {
    id: nextId++, sport:'volleyball', league:h.lg,
    home:h.n, away:a.n,
    homeAtk:h.atk, awayAtk:a.atk,
    homeServe:h.serve, awayServe:a.serve,
    homeBlock:h.block, awayBlock:a.block,
    homeRating:h.rt, awayRating:a.rt,
    homeCountry:h.country, awayCountry:a.country,
    setsHome:0, setsAway:0, pointsHome:0, pointsAway:0,
    setHistory: [],         // массив строк 'home'|'away' — кто взял сет
    pointHistory: [],       // массив [h, a] — история очков текущего сета
    roundSec:0,
    minute:0, maxMinute:2400,
    serving: 'home',
    timeoutHomeUsed: false, timeoutAwayUsed: false,
    status:'live', momentum:0, justScored:null,
    commentary: 'Матч начинается. Подача у ' + h.n
  };
}

function simulateVolleyballTick(m){
  m.roundSec += 1;
  m.minute += 1;
  if(m.roundSec < 5) return; // очко каждые ~5 сек
  m.roundSec = 0;

  var isFifth = (m.setsHome===2 && m.setsAway===2);
  var target = isFifth ? 15 : 25;

  // Вероятность выиграть очко в зависимости от подачи/приёма/атаки
  var pHome;
  if(m.serving==='home'){
    // Хозяин подаёт — у него чуть больше шансов, зависит от его подачи и приёма гостя
    pHome = 0.5 + (m.homeServe - 1) * 0.18 - (m.awayBlock - 1) * 0.10;
  } else {
    pHome = 0.5 - (m.awayServe - 1) * 0.18 + (m.homeBlock - 1) * 0.10;
  }
  pHome = clamp(pHome, 0.30, 0.70);

  if(Math.random() < pHome){
    m.pointsHome++;
    m.serving = 'home';
  } else {
    m.pointsAway++;
    m.serving = 'away';
  }

  // Тайм-аут при отрыве 8+
  if(!m.timeoutHomeUsed && m.pointsAway - m.pointsHome >= 8 && m.setsHome+m.setsAway<3){
    m.timeoutHomeUsed = true;
    m.commentary = '⏸ Тайм-аут ' + m.home;
  }
  if(!m.timeoutAwayUsed && m.pointsHome - m.pointsAway >= 8 && m.setsHome+m.setsAway<3){
    m.timeoutAwayUsed = true;
    m.commentary = '⏸ Тайм-аут ' + m.away;
  }

  // Проверка окончания сета
  if(m.pointsHome >= target && m.pointsHome - m.pointsAway >= 2){
    m.setsHome++;
    m.setHistory.push({ winner:'home', h:m.pointsHome, a:m.pointsAway });
    m.justScored = 'home';
    m.commentary = '🎯 ' + m.home + ' берёт сет ' + m.pointsHome + ':' + m.pointsAway;
    m.pointsHome = 0; m.pointsAway = 0;
    m.timeoutHomeUsed = false; m.timeoutAwayUsed = false;
  } else if(m.pointsAway >= target && m.pointsAway - m.pointsHome >= 2){
    m.setsAway++;
    m.setHistory.push({ winner:'away', h:m.pointsHome, a:m.pointsAway });
    m.justScored = 'away';
    m.commentary = '🎯 ' + m.away + ' берёт сет ' + m.pointsHome + ':' + m.pointsAway;
    m.pointsHome = 0; m.pointsAway = 0;
    m.timeoutHomeUsed = false; m.timeoutAwayUsed = false;
  }

  if(m.setsHome >= 3 || m.setsAway >= 3){
    m.status = 'finished';
    m.finishedAt = Date.now();
    m.commentary = '🏆 ' + (m.setsHome>m.setsAway ? m.home : m.away) + ' побеждает ' + m.setsHome + ':' + m.setsAway;
  }
}
/* ============================================================
   ФУТБОЛ — событийная симуляция с xG, карточками, интервалами голов
   ============================================================ */
function newFootball(){
  var lgs = [...new Set(FOOTBALL.map(function(t){ return t.lg; }))];
  var lg = pick(lgs);
  var teams = FOOTBALL.filter(function(t){ return t.lg===lg; });
  var pair = pickTwo(teams);
  var h = pair[0], a = pair[1];
  return {
    id: nextId++, sport:'football', league:lg,
    home:h.n, away:a.n,
    homeAtk:h.atk, awayAtk:a.atk,
    homeDef:h.def, awayDef:a.def,
    homeRating:h.rt, awayRating:a.rt,
    homeCountry:h.country, awayCountry:a.country,
    scoreHome:0, scoreAway:0,
    minute:0, maxMinute:90,
    // xG и статистика матча
    xgHome:0, xgAway:0,
    shotsHome:0, shotsAway:0,
    cornersHome:0, cornersAway:0,
    possessionHome:50,
    cardsHome:0, cardsAway:0,          // жёлтые
    redHome:false, redAway:false,
    goals: [],                          // [{min, side, xg}]
    // Карточки-события для рендера
    justScored:null, justCard:null, justRed:null,
    status:'live', momentum:0,
    commentary:'Матч начинается'
  };
}

function footballExpectedLambda(m, side){
  // Базовая сила атаки × оборона соперника, с поправкой на карточки
  var base = side==='home' ? m.homeAtk : m.awayAtk;
  var oppDef = side==='home' ? m.awayDef : m.homeDef;
  var homeAdv = side==='home' ? 1.20 : 0.90;
  var lambda = base * oppDef * homeAdv * 1.35; // xG за полный матч
  // Красная карточка уменьшает атаку в 2.5 раза
  if(side==='home' && m.redHome) lambda *= 0.4;
  if(side==='away' && m.redAway) lambda *= 0.4;
  // Momentum
  var mom = side==='home' ? m.momentum : -m.momentum;
  lambda *= (1 + mom * 0.35);
  return Math.max(0.05, lambda);
}

function simulateFootballTick(m){
  m.minute += 1;
  m.momentum *= 0.94;
  m.justScored = null;
  m.justCard = null;
  m.justRed = null;

  if(m.minute >= m.maxMinute){
    m.status = 'finished';
    m.finishedAt = Date.now();
    m.commentary = '🏁 Матч завершён: ' + m.scoreHome + ':' + m.scoreAway;
    return;
  }

  // Ожидание за оставшееся время
  var rem = m.maxMinute - m.minute;
  var lamH = footballExpectedLambda(m, 'home') * rem / 90;
  var lamA = footballExpectedLambda(m, 'away') * rem / 90;

  // Ставка на гол
  var pH = lamH / (rem+1) * 0.9;
  var pA = lamA / (rem+1) * 0.9;
  var rng = Math.random;

  // Угловые и удары (визуальные события)
  if(rng() < 0.15){
    if(rng() < 0.55){ m.shotsHome++; m.xgHome += 0.05 + Math.random()*0.15; m.cornersHome += (rng()<0.3?1:0); }
    else { m.shotsAway++; m.xgAway += 0.05 + Math.random()*0.15; m.cornersAway += (rng()<0.3?1:0); }
  }

  // Владение мячом пересчёт
  var targetPoss = 50 + (m.homeAtk - m.awayAtk) * 10 + (m.scoreHome - m.scoreAway) * 3;
  targetPoss += m.momentum * 5;
  if(m.redHome) targetPoss -= 15;
  if(m.redAway) targetPoss += 15;
  m.possessionHome = Math.round(m.possessionHome * 0.9 + targetPoss * 0.1);
  m.possessionHome = clamp(m.possessionHome, 25, 75);

  // Голы
  if(rng() < pH){
    m.scoreHome += 1;
    m.xgHome += 0.35 + Math.random()*0.4;
    m.goals.push({min:m.minute, side:'home', xg:0.35});
    m.momentum = Math.min(1, m.momentum + 0.55);
    m.justScored = 'home';
    m.commentary = '⚽ ГОЛ! ' + m.home + ' забивает на ' + m.minute + "'";
  } else if(rng() < pA){
    m.scoreAway += 1;
    m.xgAway += 0.35 + Math.random()*0.4;
    m.goals.push({min:m.minute, side:'away', xg:0.35});
    m.momentum = Math.max(-1, m.momentum - 0.55);
    m.justScored = 'away';
    m.commentary = '⚽ ГОЛ! ' + m.away + ' забивает на ' + m.minute + "'";
  } else {
    // Комментарий для событий без гола
    var r = rng();
    if(r < 0.03){
      var side = rng() < 0.5 ? 'home' : 'away';
      var team = side==='home' ? m.home : m.away;
      m.commentary = '🔥 Момент у ' + team + '!';
    } else if(r < 0.05){
      var side2 = rng() < 0.5 ? 'home' : 'away';
      var team2 = side2==='home' ? m.home : m.away;
      m.commentary = '🟨 Жёлтая карточка — ' + team2;
      if(side2==='home') m.cardsHome++; else m.cardsAway++;
    } else if(r < 0.06 && m.minute > 20){
      // Красная карточка (редко)
      var side3 = rng() < 0.5 ? 'home' : 'away';
      var team3 = side3==='home' ? m.home : m.away;
      if(side3==='home' && !m.redHome){ m.redHome = true; m.commentary = '🟥 Удаление! ' + team3 + ' вдесятером'; }
      else if(side3==='away' && !m.redAway){ m.redAway = true; m.commentary = '🟥 Удаление! ' + team3 + ' вдесятером'; }
    } else if(r < 0.10){
      m.commentary = 'Контроль мяча: ' + m.possessionHome + '% — ' + m.home;
    } else if(r < 0.12){
      m.commentary = m.home + ' усиливает давление';
    } else if(r < 0.14){
      m.commentary = m.away + ' ищет момент для контратаки';
    } else {
      m.commentary = 'Игра в центре поля · ' + m.minute + "'";
    }
  }
}

function computeFootballOdds(m){
  if(m.status==='finished' || m.status==='countdown') return {home:null, draw:null, away:null};
  var rem = m.maxMinute - m.minute;
  if(rem <= 0) return {home:null, draw:null, away:null};
  var lamH = footballExpectedLambda(m, 'home') * rem / 90;
  var lamA = footballExpectedLambda(m, 'away') * rem / 90;

  var pH = 0, pD = 0, pA = 0;
  for(var h=0; h<=10; h++){
    var ph = poisson(h, lamH);
    if(ph < 1e-9) continue;
    for(var a=0; a<=10; a++){
      var pa = poisson(a, lamA);
      if(pa < 1e-9) continue;
      var p = ph*pa;
      var fh = m.scoreHome + h, fa = m.scoreAway + a;
      if(fh > fa) pH += p;
      else if(fh === fa) pD += p;
      else pA += p;
    }
  }
  var t = pH + pD + pA || 1;
  return {
    home: toOdd(pH/t, 0.05),
    draw: toOdd(pD/t, 0.05),
    away: toOdd(pA/t, 0.05)
  };
}

function computeFootballExtras(m){
  if(m.status==='finished' || m.status==='countdown') return {};
  var out = {};
  function add(l, p, mar){ var o = toOdd(p, mar||0.05); if(o!==null) out[l]=o; }

  var rem = m.maxMinute - m.minute;
  if(rem <= 0) return out;
  var lamH = footballExpectedLambda(m, 'home') * rem / 90;
  var lamA = footballExpectedLambda(m, 'away') * rem / 90;

  // Матрица вероятностей итогового счёта
  var matrix = {};
  var totalP = 0;
  for(var h=0; h<=10; h++){
    var ph = poisson(h, lamH);
    if(ph < 1e-9) continue;
    for(var a=0; a<=10; a++){
      var pa = poisson(a, lamA);
      if(pa < 1e-9) continue;
      var p = ph*pa;
      var fh = m.scoreHome + h, fa = m.scoreAway + a;
      var k = fh + ':' + fa;
      matrix[k] = (matrix[k]||0) + p;
      totalP += p;
    }
  }
  for(var k2 in matrix) matrix[k2] /= totalP;

  var pH = 0, pD = 0, pA = 0, pEven = 0, pBtts = 0;
  for(var k3 in matrix){
    var pp = k3.split(':');
    var hh = parseInt(pp[0]), aa = parseInt(pp[1]);
    if(hh > aa) pH += matrix[k3];
    else if(hh === aa) pD += matrix[k3];
    else pA += matrix[k3];
    if((hh+aa)%2===0) pEven += matrix[k3];
    if(hh >= 1 && aa >= 1) pBtts += matrix[k3];
  }

  // Двойной шанс
  add('1X', pH + pD, 0.04);
  add('12', pH + pA, 0.04);
  add('X2', pD + pA, 0.04);

  // Тоталы
  [0.5,1.5,2.5,3.5,4.5,5.5].forEach(function(line){
    var pOver = 0;
    for(var k in matrix){
      var pr = k.split(':');
      if(parseInt(pr[0]) + parseInt(pr[1]) > line) pOver += matrix[k];
    }
    add('ТБ ' + line, pOver, 0.05);
    add('ТМ ' + line, 1-pOver, 0.05);
  });

  // Тотал первого тайма (только до 45')
  if(m.minute < 45){
    var rem1 = 45 - m.minute;
    var lamH1 = footballExpectedLambda(m, 'home') * rem1 / 90;
    var lamA1 = footballExpectedLambda(m, 'away') * rem1 / 90;
    var matrix1 = {};
    var t1 = 0;
    for(var h1=0; h1<=8; h1++){
      for(var a1=0; a1<=8; a1++){
        var p1 = poisson(h1, lamH1) * poisson(a1, lamA1);
        var kk = (m.scoreHome+h1) + ':' + (m.scoreAway+a1);
        matrix1[kk] = (matrix1[kk]||0) + p1;
        t1 += p1;
      }
    }
    [0.5, 1.5, 2.5].forEach(function(line){
      var pOver = 0;
      for(var kk2 in matrix1){
        var pr2 = kk2.split(':');
        if(parseInt(pr2[0]) + parseInt(pr2[1]) > line) pOver += matrix1[kk2]/t1;
      }
      add('ТБ 1-й тайм ' + line, pOver, 0.06);
      add('ТМ 1-й тайм ' + line, 1-pOver, 0.06);
    });
    // Исход 1-го тайма
    var pH1=0, pD1=0, pA1=0;
    for(var kk3 in matrix1){
      var pr3 = kk3.split(':');
      var hh3 = parseInt(pr3[0]), aa3 = parseInt(pr3[1]);
      if(hh3 > aa3) pH1 += matrix1[kk3]/t1;
      else if(hh3 === aa3) pD1 += matrix1[kk3]/t1;
      else pA1 += matrix1[kk3]/t1;
    }
    add('1-й тайм · П1', pH1, 0.06);
    add('1-й тайм · X', pD1, 0.06);
    add('1-й тайм · П2', pA1, 0.06);
  }

  // Форы
  var pF1_15 = 0, pF1_15plus = 0;
  for(var k4 in matrix){
    var pr4 = k4.split(':');
    var d = parseInt(pr4[0]) - parseInt(pr4[1]);
    if(d > 1.5) pF1_15 += matrix[k4];
    if(d > -1.5) pF1_15plus += matrix[k4];
  }
  add('Ф1 −1.5', pF1_15, 0.05);
  add('Ф1 +1.5', pF1_15plus, 0.05);
  add('Ф2 −1.5', 1-pF1_15plus, 0.05);
  add('Ф2 +1.5', 1-pF1_15, 0.05);

  // Обе забьют
  add('Обе · Да', pBtts, 0.05);
  add('Обе · Нет', 1-pBtts, 0.05);

  // Чёт / нечет
  add('Чёт', pEven, 0.05);
  add('Нечет', 1-pEven, 0.05);

  // Гол в интервале
  if(m.minute < 90){
    var intervals = [
      {from:0, to:15, label:'0-15'},
      {from:15, to:30, label:'15-30'},
      {from:30, to:45, label:'30-45'},
      {from:45, to:60, label:'45-60'},
      {from:60, to:75, label:'60-75'},
      {from:75, to:90, label:'75-90'}
    ];
    intervals.forEach(function(iv){
      if(m.minute < iv.to){
        var from = Math.max(iv.from, m.minute);
        var span = iv.to - from;
        var lamHi = footballExpectedLambda(m, 'home') * span / 90;
        var lamAi = footballExpectedLambda(m, 'away') * span / 90;
        var pGoal = 1 - Math.exp(-(lamHi+lamAi));
        add('Гол ' + iv.label + ' мин', pGoal, 0.06);
      }
    });
  }

  // Точный счёт (топ-5)
  var sorted = [];
  for(var k5 in matrix) sorted.push([k5, matrix[k5]]);
  sorted.sort(function(a,b){ return b[1]-a[1]; });
  sorted.slice(0,5).forEach(function(s){
    if(s[1] > 0.02) add('Счёт ' + s[0], s[1]*1.03, 0.06);
  });

  // ТБ команды
  [0.5, 1.5, 2.5].forEach(function(line){
    var hOver = 0, aOver = 0;
    for(var k6 in matrix){
      var pr6 = k6.split(':');
      if(parseInt(pr6[0]) > line) hOver += matrix[k6];
      if(parseInt(pr6[1]) > line) aOver += matrix[k6];
    }
    add(m.home + ' ТБ ' + line, hOver, 0.06);
    add(m.away + ' ТБ ' + line, aOver, 0.06);
  });

  return out;
}

/* ============================================================
   ХОККЕЙ — периоды, удаления, овертайм, буллиты
   ============================================================ */
function newHockey(){
  var lgs = [...new Set(HOCKEY.map(function(t){ return t.lg; }))];
  var lg = pick(lgs);
  var teams = HOCKEY.filter(function(t){ return t.lg===lg; });
  var pair = pickTwo(teams);
  var h = pair[0], a = pair[1];
  return {
    id: nextId++, sport:'hockey', league:lg,
    home:h.n, away:a.n,
    homeAtk:h.atk, awayAtk:a.atk,
    homeDef:h.def, awayDef:a.def,
    homeRating:h.rt, awayRating:a.rt,
    homeCountry:h.country, awayCountry:a.country,
    scoreHome:0, scoreAway:0,
    periodScores: [ {h:0,a:0}, {h:0,a:0}, {h:0,a:0} ],
    period:1, periodSec:0,
    minute:0, maxMinute:60,  // 3 периода по 20
    // Удаления
    penaltyHome:0, penaltyAway:0,  // секунды до конца удаления
    shotsHome:0, shotsAway:0,
    savesHome:0, savesAway:0,
    powerplay: null,  // 'home' | 'away' | null
    emptyNet: null,   // 'home' | 'away' | null — кто снял вратаря
    justScored:null,
    status:'live', momentum:0,
    commentary:'Матч начинается',
    overtime: false,
    shootout: false
  };
}

function hockeyExpectedLambda(m, side){
  var base = side==='home' ? m.homeAtk : m.awayAtk;
  var oppDef = side==='home' ? m.awayDef : m.homeDef;
  var homeAdv = side==='home' ? 1.10 : 0.92;
  var lambda = base * (oppDef / 3.0) * homeAdv * 0.55;
  // Power play — если у соперника удаление
  if(side==='home' && m.penaltyAway > 0) lambda *= 2.5;
  if(side==='away' && m.penaltyHome > 0) lambda *= 2.5;
  // Пустые ворота соперника — огромное преимущество
  if(side==='home' && m.emptyNet === 'away') lambda *= 4;
  if(side==='away' && m.emptyNet === 'home') lambda *= 4;
  var mom = side==='home' ? m.momentum : -m.momentum;
  lambda *= (1 + mom * 0.3);
  return Math.max(0.03, lambda);
}

function simulateHockeyTick(m){
  m.minute += 1;
  m.periodSec += 1;
  m.momentum *= 0.94;
  m.justScored = null;

  // Уменьшаем таймеры удалений
  if(m.penaltyHome > 0) m.penaltyHome = Math.max(0, m.penaltyHome - 1);
  if(m.penaltyAway > 0) m.penaltyAway = Math.max(0, m.penaltyAway - 1);

  // Проверка периода
  if(m.periodSec >= 20){
    m.period += 1;
    m.periodSec = 0;
    if(m.period > 3){
      // Конец 3 периодов
      if(m.scoreHome === m.scoreAway){
        m.overtime = true;
        m.period = 4;
        m.commentary = '🔥 Овертайм! 5 минут';
        // Продолжаем с овертаймом
      } else {
        m.status = 'finished';
        m.finishedAt = Date.now();
        m.commentary = '🏁 Матч завершён: ' + m.scoreHome + ':' + m.scoreAway;
        return;
      }
    }
  }

  // Овертайм (период 4, 5 минут)
  if(m.period === 4 && m.periodSec >= 5){
    // Ничья после овертайма → буллиты
    m.shootout = true;
    // Симуляция буллитов: 5 попыток
    var hGoals = 0, aGoals = 0;
    for(var i=0; i<5; i++){
      if(Math.random() < 0.35) hGoals++;
      if(Math.random() < 0.35) aGoals++;
    }
    // Если равно — до первого промаха
    var guard = 0;
    while(hGoals === aGoals && guard++ < 20){
      if(Math.random() < 0.4) hGoals++;
      if(Math.random() < 0.4) aGoals++;
    }
    if(hGoals > aGoals) m.scoreHome += 1;
    else m.scoreAway += 1;
    m.status = 'finished';
    m.finishedAt = Date.now();
    m.commentary = '🎯 Буллиты! Победа ' + (hGoals>aGoals ? m.home : m.away);
    return;
  }

  // Empty net в последние 2 минуты 3 периода
  if(m.period === 3 && m.periodSec > 18 && m.scoreHome !== m.scoreAway){
    if(m.scoreHome < m.scoreAway) m.emptyNet = 'home';
    else m.emptyNet = 'away';
  }

  // Удаления (2 минуты = 40 секунд в игровой симуляции)
  if(Math.random() < 0.008 && m.penaltyHome === 0 && m.penaltyAway === 0){
    if(Math.random() < 0.5){
      m.penaltyHome = 40;
      m.commentary = '🟨 Удаление — ' + m.home + ' (2 мин)';
    } else {
      m.penaltyAway = 40;
      m.commentary = '🟨 Удаление — ' + m.away + ' (2 мин)';
    }
  }

  // Ожидание голов за минуту
  var lamH = hockeyExpectedLambda(m, 'home') / 60;
  var lamA = hockeyExpectedLambda(m, 'away') / 60;

  if(Math.random() < lamH){
    m.scoreHome += 1;
    m.shotsHome += 1;
    m.justScored = 'home';
    m.momentum = Math.min(1, m.momentum + 0.4);
    m.commentary = '🏒 ГОЛ! ' + m.home + ' на ' + m.minute + "'" + (m.penaltyAway>0 ? ' (большинство)' : '');
    if(m.period <= 3) m.periodScores[m.period-1].h += 1;
  } else if(Math.random() < lamA){
    m.scoreAway += 1;
    m.shotsAway += 1;
    m.justScored = 'away';
    m.momentum = Math.max(-1, m.momentum - 0.4);
    m.commentary = '🏒 ГОЛ! ' + m.away + ' на ' + m.minute + "'" + (m.penaltyHome>0 ? ' (большинство)' : '');
    if(m.period <= 3) m.periodScores[m.period-1].a += 1;
  } else {
    // События без гола
    var r = Math.random();
    if(r < 0.10){
      m.shotsHome++;
      m.savesAway++;
    } else if(r < 0.20){
      m.shotsAway++;
      m.savesHome++;
    } else if(r < 0.24){
      m.commentary = m.home + ' бросает по воротам';
    } else if(r < 0.28){
      m.commentary = m.away + ' контратакует';
    } else if(m.penaltyHome > 0){
      m.commentary = '🔥 Большинство у ' + m.away;
    } else if(m.penaltyAway > 0){
      m.commentary = '🔥 Большинство у ' + m.home;
    }
  }
}

function computeHockeyOdds(m){
  if(m.status==='finished' || m.status==='countdown') return {home:null, draw:null, away:null};
  var rem = Math.max(0, (m.period===4 ? 5 : 60 - m.minute));
  if(rem <= 0) return {home:null, draw:null, away:null};

  // Для хоккея — вероятности с учётом остатка и овертайма
  var lamH = hockeyExpectedLambda(m, 'home') * rem / 60;
  var lamA = hockeyExpectedLambda(m, 'away') * rem / 60;

  var pH = 0, pD = 0, pA = 0;
  for(var h=0; h<=8; h++){
    for(var a=0; a<=8; a++){
      var p = poisson(h, lamH) * poisson(a, lamA);
      var fh = m.scoreHome + h, fa = m.scoreAway + a;
      if(fh > fa) pH += p;
      else if(fh === fa) pD += p;
      else pA += p;
    }
  }
  var t = pH + pD + pA || 1;
  // В NHL/KHL ничья → овертайм, но основное время = ничья
  return {
    home: toOdd(pH/t, 0.05),
    draw: toOdd(pD/t, 0.05),
    away: toOdd(pA/t, 0.05)
  };
}

function computeHockeyExtras(m){
  if(m.status==='finished' || m.status==='countdown') return {};
  var out = {};
  function add(l, p, mar){ var o = toOdd(p, mar||0.05); if(o!==null) out[l]=o; }

  var rem = Math.max(0, 60 - m.minute);
  var lamH = hockeyExpectedLambda(m, 'home') * rem / 60;
  var lamA = hockeyExpectedLambda(m, 'away') * rem / 60;

  var matrix = {};
  var totalP = 0;
  for(var h=0; h<=8; h++){
    for(var a=0; a<=8; a++){
      var p = poisson(h, lamH) * poisson(a, lamA);
      var fh = m.scoreHome + h, fa = m.scoreAway + a;
      var k = fh + ':' + fa;
      matrix[k] = (matrix[k]||0) + p;
      totalP += p;
    }
  }
  for(var k2 in matrix) matrix[k2] /= totalP;

  // Тоталы
  [3.5,4.5,5.5,6.5,7.5].forEach(function(line){
    var pOver = 0;
    for(var k in matrix){
      var pr = k.split(':');
      if(parseInt(pr[0]) + parseInt(pr[1]) > line) pOver += matrix[k];
    }
    add('ТБ ' + line, pOver, 0.05);
    add('ТМ ' + line, 1-pOver, 0.05);
  });

  // Форы
  var pF1 = 0, pF1plus = 0;
  for(var k3 in matrix){
    var pr3 = k3.split(':');
    var d = parseInt(pr3[0]) - parseInt(pr3[1]);
    if(d > 1.5) pF1 += matrix[k3];
    if(d > -1.5) pF1plus += matrix[k3];
  }
  add('Ф1 −1.5', pF1, 0.06);
  add('Ф1 +1.5', pF1plus, 0.06);
  add('Ф2 −1.5', 1-pF1plus, 0.06);
  add('Ф2 +1.5', 1-pF1, 0.06);

  // Двойной шанс
  var pH = 0, pD = 0, pA = 0;
  for(var k4 in matrix){
    var pr4 = k4.split(':');
    var hh = parseInt(pr4[0]), aa = parseInt(pr4[1]);
    if(hh > aa) pH += matrix[k4];
    else if(hh === aa) pD += matrix[k4];
    else pA += matrix[k4];
  }
  add('1X', pH+pD, 0.05);
  add('12', pH+pA, 0.05);
  add('X2', pD+pA, 0.05);

  // Тотал периода
  if(m.period <= 3 && m.periodSec < 20){
    var remP = 20 - m.periodSec;
    var lamHp = hockeyExpectedLambda(m, 'home') * remP / 60;
    var lamAp = hockeyExpectedLambda(m, 'away') * remP / 60;
    [0.5,1.5,2.5].forEach(function(line){
      var pOver = 0;
      for(var h2=0; h2<=6; h2++){
        for(var a2=0; a2<=6; a2++){
          if(h2+a2 > line) pOver += poisson(h2, lamHp) * poisson(a2, lamAp);
        }
      }
      add('ТБ ' + m.period + '-й период ' + line, pOver, 0.07);
      add('ТМ ' + m.period + '-й период ' + line, 1-pOver, 0.07);
    });
  }

  // Обе забьют
  var pBtts = 0;
  for(var k5 in matrix){
    var pr5 = k5.split(':');
    if(parseInt(pr5[0]) >= 1 && parseInt(pr5[1]) >= 1) pBtts += matrix[k5];
  }
  add('Обе · Да', pBtts, 0.06);
  add('Обе · Нет', 1-pBtts, 0.06);

  // ТБ бросков
  var totalShots = m.shotsHome + m.shotsAway;
  add('ТБ 55.5 бросков', clamp(0.5 + (totalShots - 55) * 0.02, 0.2, 0.8), 0.08);
  add('ТМ 55.5 бросков', clamp(0.5 - (totalShots - 55) * 0.02, 0.2, 0.8), 0.08);

  // Точный счёт (топ-5)
  var sorted = [];
  for(var k6 in matrix) sorted.push([k6, matrix[k6]]);
  sorted.sort(function(a,b){ return b[1]-a[1]; });
  sorted.slice(0,5).forEach(function(s){
    if(s[1] > 0.02) add('Счёт ' + s[0], s[1]*1.03, 0.06);
  });

  return out;
}

/* ============ КОЭФЫ UFC ============ */
function ufcProbHome(m){
  if(m.status==='finished'){
    if(!m.finalResult) return 0.5;
    return m.finalResult.winner==='home'?1:0;
  }
  if(m.status==='countdown') return 0.5;
  // Из текущего состояния: HP и stamina
  var hpDiff = (m.homeHP - m.awayHP) / Math.max(1, m.homeFighter.hpMax);
  var stamDiff = (m.homeStam - m.awayStam) / Math.max(1, m.homeFighter.stamMax);
  var ratingDiff = (m.homeRating - m.awayRating) / 400;
  var base = 1 / (1 + Math.pow(10, -ratingDiff));
  // Корректировка по ходу боя
  var prog = m.minute / Math.max(1, m.maxMinute);
  var pH = base + hpDiff * 0.4 + stamDiff * 0.15;
  pH = clamp(pH, 0.05, 0.95);
  // Сжатие к 0.5 при равенстве
  pH = 0.5 + (pH - 0.5) * (1 - prog * 0.3);
  return clamp(pH, 0.05, 0.95);
}

function computeUFCOdds(m){
  if(m.status==='finished'||m.status==='countdown') return {home:null, draw:null, away:null, pH:null, pA:null};
  var pH = ufcProbHome(m);
  return {home: toOdd(pH, 0.05), away: toOdd(1-pH, 0.05), draw: null, pH: pH, pA: 1-pH, pD: null};
}

function computeUFCExtras(m){
  if(m.status==='finished'||m.status==='countdown') return {};
  var out = {};
  function add(l, p, mar){ var o = toOdd(p, mar||0.05); if(o!==null) out[l]=o; }
  var pH = ufcProbHome(m);
  var pA = 1-pH;
  var roundLeft = UFC_MAX_ROUNDS - m.round + 1;
  var secInRound = m.roundSec;
  var secLeftInRound = UFC_ROUND_SEC - secInRound;

  // Шанс финиша до конца боя
  var remainingRounds = roundLeft;
  var pFinishFuture = 0;
  // Прикидка: ~25% за полный раунд × оставшиеся
  var perRound = 0.25;
  for(var r=m.round; r<=UFC_MAX_ROUNDS; r++){
    var hazard = perRound;
    if(r===m.round) hazard = perRound * (secLeftInRound/UFC_ROUND_SEC);
    // если у кого-то HP низкое — шанс выше
    if(m.homeHP<30||m.awayHP<30) hazard *= 1.8;
    if(m.homeHP<15||m.awayHP<15) hazard *= 2.5;
    pFinishFuture = pFinishFuture + (1-pFinishFuture) * hazard;
  }
  pFinishFuture = clamp(pFinishFuture, 0.05, 0.85);
  var pDec = 1-pFinishFuture;
  var pKO = pFinishFuture * 0.6;
  var pSub = pFinishFuture * 0.4;

  add('KO/TKO', pKO, 0.06);
  add('Сабмишн', pSub, 0.06);
  add('Решение', pDec, 0.05);
  add('Бой досрочно', pFinishFuture, 0.05);
  add('Вся дистанция', pDec, 0.05);

  // Победа в текущем раунде
  if(m.round <= UFC_MAX_ROUNDS){
    var pWinThisRoundH = pH * pFinishFuture * (secLeftInRound/UFC_ROUND_SEC) * 1.5;
    var pWinThisRoundA = pA * pFinishFuture * (secLeftInRound/UFC_ROUND_SEC) * 1.5;
    var total = pWinThisRoundH + pWinThisRoundA;
    if(total > 0.05){
      add('Победа в R' + m.round + ' · ' + m.home, pWinThisRoundH, 0.08);
      add('Победа в R' + m.round + ' · ' + m.away, pWinThisRoundA, 0.08);
    }
    add('Бой дойдёт до R' + (m.round+1), 1 - (pFinishFuture * 0.5), 0.08);
  }

  // ТБ X.5 раундов — только для будущих
  for(var line=0.5; line<5; line+=1){
    var lineR = Math.ceil(line);
    if(m.round <= lineR || (m.round===lineR+1 && m.roundSec < 1)){
      var pOver = 1;
      for(var rr=m.round; rr<=Math.ceil(line); rr++){
        pOver *= 1 - (perRound * 0.6);
      }
      pOver = clamp(pOver, 0.05, 0.95);
      add('ТБ ' + line + ' раундов', pOver, 0.07);
      add('ТМ ' + line + ' раундов', 1-pOver, 0.07);
    }
  }

  add(m.home + ' KO/TKO', pH * pKO * 0.9, 0.08);
  add(m.home + ' Сабмишн', pH * pSub * 0.9, 0.08);
  add(m.home + ' Решение', pH * pDec * 0.9, 0.08);
  add(m.away + ' KO/TKO', pA * pKO * 0.9, 0.08);
  add(m.away + ' Сабмишн', pA * pSub * 0.9, 0.08);
  add(m.away + ' Решение', pA * pDec * 0.9, 0.08);

  return out;
}

/* ============ КОЭФЫ ВОЛЕЙБОЛ ============ */
function volleyProbHome(m){
  if(m.status==='finished') return m.setsHome>m.setsAway?1:0;
  if(m.status==='countdown') return 0.5;

  var d = (m.homeAtk - m.awayAtk) * 0.18 + (m.homeServe - m.awayServe) * 0.08 - (m.homeBlock - m.awayBlock) * 0.05;
  var base = clamp(0.5 + d, 0.15, 0.85);
  // Корректировка по счёту в сете
  var isFifth = (m.setsHome===2 && m.setsAway===2);
  var target = isFifth ? 15 : 25;
  var curScore = (m.pointsHome - m.pointsAway) / target;
  // Учёт счёта по сетам
  var setScore = m.setsHome - m.setsAway;
  var pH = base + curScore * 0.15 + setScore * 0.10;

  // Если сет на исходе — влияние счёта в сете растёт
  var remainPoints = target - Math.max(m.pointsHome, m.pointsAway);
  if(remainPoints < 5){
    pH += (m.pointsHome - m.pointsAway) * 0.04;
  }
  return clamp(pH, 0.05, 0.95);
}

function computeVolleyOdds(m){
  if(m.status==='finished'||m.status==='countdown') return {home:null, draw:null, away:null, pH:null, pA:null};
  var pH = volleyProbHome(m);
  return {home: toOdd(pH, 0.05), away: toOdd(1-pH, 0.05), draw: null, pH: pH, pA: 1-pH, pD: null};
}

function computeVolleyExtras(m){
  if(m.status==='finished'||m.status==='countdown') return {};
  var out = {};
  function add(l, p, mar){ var o = toOdd(p, mar||0.05); if(o!==null) out[l]=o; }
  var pH = volleyProbHome(m);
  var pA = 1-pH;

  // Тоталы сетов
  var setsPlayed = m.setsHome + m.setsAway;
  if(setsPlayed < 5){
    var pHomeSet = clamp(0.5 + (m.homeAtk - m.awayAtk) * 0.18, 0.3, 0.7);
    // Распределение по числу сетов — через симуляцию
    var cnt = {3:0, 4:0, 5:0};
    for(var t=0; t<200; t++){
      var sh = m.setsHome, sa = m.setsAway, g=0;
      while(sh<3 && sa<3 && g++<10){
        if(Math.random()<pHomeSet) sh++; else sa++;
      }
      var total = sh+sa;
      if(total<=3) cnt[3]++;
      else if(total===4) cnt[4]++;
      else cnt[5]++;
    }
    var p3=cnt[3]/200, p4=cnt[4]/200, p5=cnt[5]/200;
    if(p3>0.02){ add('ТМ 3.5 сетов', p3, 0.06); add('ТБ 3.5 сетов', p4+p5, 0.06); }
    if(p5>0.02){ add('ТБ 4.5 сетов', p5, 0.06); add('ТМ 4.5 сетов', p3+p4, 0.06); }
  }

  // Тотал очков в текущем сете
  var curTotal = m.pointsHome + m.pointsAway;
  var isFifth = (m.setsHome===2 && m.setsAway===2);
  var target = isFifth ? 15 : 25;
  var expectedFinish = target * 2 - 3; // типично ~47 для сета до 25
  // Вероятность что суммарное число очков в сете перевалит линию
  var lines = isFifth ? [24.5, 26.5, 28.5] : [44.5, 46.5, 48.5];
  lines.forEach(function(line){
    if(curTotal < line){
      var remain = line - curTotal;
      // примерно 1 очко в 5 секунд, "предполагаемое" число очков до конца сета ~ remain
      var pOver = clamp(0.5 + (expectedFinish - line) * 0.06, 0.15, 0.85);
      add('ТБ ' + line + ' (сет)', pOver, 0.07);
      add('ТМ ' + line + ' (сет)', 1-pOver, 0.07);
    }
  });

  // Победа в текущем сете
  add('Победа в сете · П1', pH, 0.06);
  add('Победа в сете · П2', pA, 0.06);

  // Точный счёт матча
  if(setsPlayed < 5){
    add('Счёт 3:0', 0.15, 0.10);
    add('Счёт 3:1', 0.20, 0.10);
    add('Счёт 3:2', 0.15, 0.10);
    add('Счёт 0:3', 0.15, 0.10);
    add('Счёт 1:3', 0.20, 0.10);
    add('Счёт 2:3', 0.15, 0.10);
  }

  // Обе выиграют хотя бы 1 сет
  if(m.setsHome===0 && m.setsAway===0){
    add('Обе возьмут сет · Да', 0.88, 0.06);
    add('Обе возьмут сет · Нет', 0.12, 0.06);
  }

  return out;
}

/* ============ УНИВЕРСАЛЬНЫЕ ОБЁРТКИ ============ */
function computeOdds(m){
  if(m.sport==='ufc') return computeUFCOdds(m);
  if(m.sport==='volleyball') return computeVolleyOdds(m);
  if(m.sport==='football') return computeFootballOdds(m);
  if(m.sport==='hockey') return computeHockeyOdds(m);
  return {home:null, draw:null, away:null};
}
function computeExtras(m){
  if(m.sport==='ufc') return computeUFCExtras(m);
  if(m.sport==='volleyball') return computeVolleyExtras(m);
  if(m.sport==='football') return computeFootballExtras(m);
  if(m.sport==='hockey') return computeHockeyExtras(m);
  return {};
}

/* ============ СОЗДАНИЕ ПАРТИИ ============ */
function createBatch(){
  matches = [];
  nextId = 1;
  for(var i=0;i<4;i++) matches.push(newFootball());
  for(var j=0;j<3;j++) matches.push(newHockey());
  for(var k=0;k<3;k++) matches.push(newVolleyball());
  for(var l=0;l<3;l++) matches.push(newUFC());
  for(var m=matches.length-1;m>0;m--){
    var r=Math.floor(Math.random()*(m+1));
    var tmp=matches[m]; matches[m]=matches[r]; matches[r]=tmp;
  }
}

/* ============ ТИК МАТЧА ============ */
function tickMatch(m){
  if(m.status==='countdown'){
    m.countdownLeft -= 1;
    if(m.countdownLeft <= 0){
      var nm;
      if(m.sport==='football') nm=newFootball();
      else if(m.sport==='hockey') nm=newHockey();
      else if(m.sport==='volleyball') nm=newVolleyball();
      else nm=newUFC();
      nm.id = m.id;
      for(var k in m) delete m[k];
      for(var k2 in nm) m[k2]=nm[k2];
    }
    return;
  }
  if(m.status!=='live') return;

  if(m.sport==='ufc'){ simulateUFCTick(m); return; }
  if(m.sport==='volleyball'){ simulateVolleyballTick(m); return; }
  if(m.sport==='football'){ simulateFootballTick(m); return; }
  if(m.sport==='hockey'){ simulateHockeyTick(m); return; }
}

function renderSession(){
  var prof = wallet.balance - wallet.sessionStart;
  var won=0, lost=0;
  for(var i=0;i<wallet.bets.length;i++){
    if(wallet.bets[i].status==='won') won++;

function flashBalance(t){
  var b=$('balanceBox');
  b.classList.remove('flash-bonus','flash-win','flash-lose');
  void b.offsetWidth;
  b.classList.add('flash-'+t);
  setTimeout(function(){ b.classList.remove('flash-'+t); },900);
}

function renderProgress(m){
  if(m.status==='countdown') return '';
  if(m.sport==='ufc'){
    var segs='';
    for(var i=1;i<=5;i++){
      var done = m.round>i || (m.status==='finished' && m.round>=i);
      var active = m.round===i && m.phase==='fight';
      var p = 0;
      if(active) p = (m.roundSec/UFC_ROUND_SEC)*100;
      if(done) p=100;
      segs += '<div class="progress-seg '+(done?'done':active?'active':'')+'" style="--p:'+Math.min(100,p)+'%"></div>';
    }
    return '<div class="progress">'+segs+'</div>';
  }
  if(m.sport==='volleyball'){
    var segs2='';
    for(var j=1;j<=5;j++){
      var won = m.setsHome>=j || m.setsAway>=j;
      var current = (m.setsHome+m.setsAway+1)===j && m.status==='live';
      segs2 += '<div class="progress-seg '+(won?'done':current?'active':'')+'" style="--p:'+(won?100:0)+'%"></div>';
    }
    return '<div class="progress">'+segs2+'</div>';
  }
  return renderSportProgress(m);
}

function renderCard(m){

  var isCd = m.status==='countdown';
  var extras = (!isFin && !isCd) ? computeExtras(m) : {};
  var keys = Object.keys(extras);
  var isOpen = openExtras.has(m.id);

  var extrasH = keys.length ? (
    '<div class="extras">'+
    '<button class="extras-toggle '+(isOpen?'open':'')+'" data-extras="'+m.id+'">'+
    (isOpen?'▲ Скрыть':'▼ Ещё '+keys.length+' рынков')+
    '</button>'+
    '<div class="extras-grid '+(isOpen?'open':'')+'">'+
    keys.map(function(l){
      var o = extras[l];
      return '<button class="odd-mini" data-mid="'+m.id+'" data-mk="'+encodeURIComponent(l)+'" data-odd="'+o+'"><span class="odd-mini-label">'+l+'</span><span class="odd-mini-value">'+o.toFixed(2)+'</span></button>';
    }).join('')+
    '</div></div>'
  ) : '';

  var badge;
  if(isFin) badge = '<span class="match-status finished">Финиш</span>';
  else if(isCd) badge = '<span class="match-status countdown">⏱ Далее</span>';
  else badge = '<span class="match-status live">LIVE</span>';

  var infoText = '';
  if(isCd) infoText = '<span class="time" style="color:var(--accent-2);font-weight:800">⏱ '+ft(m.countdownLeft)+'</span>';
  else if(isFin) infoText = '<span>Завершён</span>';
  else if(m.sport==='ufc'){
    if(m.phase==='break') infoText = '<span>Перерыв</span> · <span class="time">'+ft(m.roundSec)+'</span>';
    else infoText = '<span>Раунд '+m.round+'/5</span> · <span class="time">'+ft(m.roundSec)+'</span>';
  }
  else if(m.sport==='volleyball'){
    var sn = m.setsHome+m.setsAway+1;
    infoText = '<span>Сет '+Math.min(5,sn)+'</span> · <span class="time">'+m.pointsHome+':'+m.pointsAway+'</span>';
  }
  else infoText = sportInfoText(m);

  // Комментарий
  var commentaryH = m.commentary && !isCd ? '<div class="match-commentary">'+m.commentary+'</div>' : '';

  // UFC — HP бары
  var hpRowH = '';
  if(m.sport==='ufc' && !isCd && !isFin){
    var hpHp = m.homeHP/m.homeFighter.hpMax*100;
    var aHp = m.awayHP/m.awayFighter.hpMax*100;
    var hSt = m.homeStam/m.homeFighter.stamMax*100;
    var aSt = m.awayStam/m.awayFighter.stamMax*100;
    hpRowH = '<div class="hp-row">'+
      '<span style="min-width:24px">HP</span>'+
      '<div class="hp-bar '+(hpHp<30?'low':'')+'"><i class="hp-h" style="width:'+hpHp+'%"></i></div>'+
      '<span style="min-width:30px;text-align:right">'+Math.round(m.homeHP)+'/'+Math.round(m.awayHP)+'</span>'+
      '<div class="hp-bar '+(aHp<30?'low':'')+'"><i class="hp-a" style="width:'+aHp+'%"></i></div>'+
      '</div>'+
      '<div class="hp-row">'+
      '<span style="min-width:24px">ST</span>'+
      '<div class="hp-bar"><i class="hp-h" style="width:'+hSt+'%"></i></div>'+
      '<span style="min-width:30px;text-align:right">'+Math.round(m.homeStam)+'/'+Math.round(m.awayStam)+'</span>'+
      '<div class="hp-bar"><i class="hp-a" style="width:'+aSt+'%"></i></div>'+
      '</div>';
  }

  // Волейбол — счёт по сетам
  var setHistH = '';
  if(m.sport==='volleyball' && m.setHistory && m.setHistory.length){
    setHistH = '<div class="period-score">'+
      m.setHistory.map(function(s,i){
        return '<span>Сет '+(i+1)+': <b>'+s.h+':'+s.a+'</b></span>';
      }).join('')+
      '</div>';
  }

  var resultH = '';
  if(isFin){
    if(m.sport==='ufc' && m.finalResult){
      var w = m.finalResult.winner==='home' ? m.home : m.away;
      resultH = '<div class="ufc-result">🏆 Победа: <span class="win">'+w+'</span> · '+m.finalResult.method+' · Раунд '+m.finalResult.round+'</div>';
    } else if(m.sport==='volleyball'){
      var wv = m.setsHome>m.setsAway ? m.home : m.away;
      resultH = '<div class="ufc-result">🏆 Победа: <span class="win">'+wv+'</span> · '+m.setsHome+':'+m.setsAway+'</div>';
    } else {
      resultH = sportResultH(m);
    }
  }

  var scoreH, scoreA;
  if(isCd){ scoreH='—'; scoreA='—'; }
  else if(m.sport==='ufc' && !isFin){ scoreH='—'; scoreA='—'; }
  else if(m.sport==='volleyball'){ scoreH=m.setsHome; scoreA=m.setsAway; }
  else { scoreH=m.scoreHome; scoreA=m.scoreAway; }

  var hFlag = FLAGS[m.homeCountry]||'';
  var aFlag = FLAGS[m.awayCountry]||'';
  var homeLogo = '<div class="team-logo-wrap"><div class="team-logo '+(m.justScored==='home'?'scored':'')+'" style="background:'+teamColor(m.home)+'">'+teamInit(m.home)+'</div><div class="team-rating">'+(m.homeRating||80)+'</div>'+(hFlag?'<div class="team-flag">'+hFlag+'</div>':'')+'</div>';
  var awayLogo = '<div class="team-logo-wrap"><div class="team-logo '+(m.justScored==='away'?'scored':'')+'" style="background:'+teamColor(m.away)+'">'+teamInit(m.away)+'</div><div class="team-rating">'+(m.awayRating||80)+'</div>'+(aFlag?'<div class="team-flag">'+aFlag+'</div>':'')+'</div>';

  var isUFC = m.sport==='ufc';
  var isVB = m.sport==='volleyball';
  var twoCols = isUFC || isVB || odds.draw===null;
  var oddsRowCls = twoCols ? 'odds-row two-col' : 'odds-row';

  return '<div class="match '+(isFin?'finished':'')+'">'+
    '<div class="match-head"><span class="match-sport">'+sIcon(m.sport)+'</span><span class="match-league">'+m.league+'</span>'+badge+'</div>'+
    '<div class="teams">'+
    '<div class="team-line"><div class="team-info">'+homeLogo+'<span class="team-name">'+m.home+'</span></div><span class="team-score '+(m.justScored==='home'?'scored':'')+'">'+scoreH+'</span></div>'+
    '<div class="team-line"><div class="team-info">'+awayLogo+'<span class="team-name">'+m.away+'</span></div><span class="team-score '+(m.justScored==='away'?'scored':'')+'">'+scoreA+'</span></div>'+
    '</div>'+
    commentaryH+
    setHistH+
    hpRowH+
    '<div class="match-info">'+infoText+'</div>'+
    renderProgress(m)+
    resultH+
    '<div class="'+oddsRowCls+'">'+
    renderOddBtn(m,'home',isUFC?'П1':isVB?'1':'1',odds.home,isFin||isCd)+
    (!twoCols && odds.draw!==null ? renderOddBtn(m,'draw','X',odds.draw,isFin||isCd) : '')+
    renderOddBtn(m,'away',isUFC?'П2':isVB?'2':'2',odds.away,isFin||isCd)+
    '</div>'+
    extrasH+
    '</div>';
}

function renderOddBtn(m,pk,l,v,dis){
  if(!isValid(v)) return '<div class="odd-btn disabled"><span class="odd-label">'+l+'</span><span class="odd-value" style="color:var(--muted)">—</span></div>';
  var k=m.id+'-'+pk;
  var prev=prevOdds[k];
  var cls='';
  if(prev!==undefined && Math.abs(prev-v)>0.001) cls = v>prev?'up':'down';
  prevOdds[k]=v;
  return '<button class="odd-btn '+cls+'" data-match-id="'+m.id+'" data-pick="'+pk+'" data-odd="'+v+'" '+(dis?'disabled':'')+'><span class="odd-label">'+l+'</span><span class="odd-value">'+v.toFixed(2)+'</span></button>';
}

function renderMatches(){
  var list = matches.slice();
  if(currentSport!=='all') list = list.filter(function(m){ return m.sport===currentSport; });
  list.sort(function(a,b){
    var ord={live:0,countdown:1,finished:2};
    if(ord[a.status]!==ord[b.status]) return ord[a.status]-ord[b.status];
    var so={ufc:0,football:1,hockey:2,volleyball:3};
    if(a.sport!==b.sport) return (so[a.sport]||9)-(so[b.sport]||9);
    return a.minute-b.minute;
  });
  var el=$('matches');
  if(!list.length){
    el.innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="empty-icon">🎯</div><div class="empty-text">Матчей нет</div></div>';
    return;
  }
  var html='';
  for(var i=0;i<list.length;i++){
    try{ html += renderCard(list[i]); }
    catch(e){ console.error('card err', e); html += '<div class="match" style="padding:20px;color:var(--red)">Ошибка #'+list[i].id+'</div>'; }
  }
  el.innerHTML = html;
}

function drawChart(){
  var c=$('profitChart'); if(!c) return;
  var ctx=c.getContext('2d');
  var dpr=window.devicePixelRatio||1;
  var r=c.getBoundingClientRect();
  c.width=r.width*dpr; c.height=r.height*dpr;
  ctx.scale(dpr,dpr);
  var w=r.width,h=r.height;
  ctx.clearRect(0,0,w,h);
  var hist = wallet.profitHistory;
  if(!hist || hist.length<2){
    ctx.fillStyle='#6e6e88';
    ctx.font='13px sans-serif';
    ctx.textAlign='center';
    ctx.fillText('Играй — график появится', w/2, h/2);
    return;
  }
  var min=Math.min.apply(null,hist.map(function(p){return p.v;}).concat([0]));
  var max=Math.max.apply(null,hist.map(function(p){return p.v;}).concat([0]));
  var range=max-min||1;
  ctx.strokeStyle='rgba(110,110,140,.1)';
  for(var i=0;i<=4;i++){ var y=(h/4)*i; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
  var step=w/(hist.length-1);
  var grad=ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,'rgba(123,92,255,.35)');
  grad.addColorStop(1,'rgba(123,92,255,0)');
  ctx.beginPath();
  hist.forEach(function(p,i){
    var x=i*step;
    var yy=h-((p.v-min)/range)*h*0.85-h*0.075;
    if(i===0) ctx.moveTo(x,yy); else ctx.lineTo(x,yy);
  });
  ctx.strokeStyle='#7b5cff';
  ctx.lineWidth=2.5;
  ctx.stroke();
  ctx.lineTo(w,h); ctx.lineTo(0,h); ctx.closePath();
  ctx.fillStyle=grad; ctx.fill();
}

/* ============ КЭШАУТ ============ */
function cashoutValue(b,m){
  if(!m||m.status!=='live'||b.status!=='pending') return 0;
  if(b.type==='express'){
    var cv=1;
    for(var i=0;i<b.selections.length;i++){
      var sel=b.selections[i];
      var sm = matches.find(function(x){ return Number(x.id)===Number(sel.matchId); });
      if(!sm) return 0;
      if(sm.status==='finished'){
        if(sel.status==='lost') return 0;
        continue;
      }
      if(sm.status==='live'){
        var ods = computeOdds(sm);
        var cur = ods[sel.pick];
        if(!isValid(cur)) return 0;
        cv *= 1/cur;
      } else return 0;
    }
    var fair = b.potential * cv;
    var pay = Math.max(b.stake*0.1, Math.round(fair*0.9*100)/100);
    return Math.min(pay, b.potential*0.98);
  }
  if(b.type==='builder'){
    var sm2 = matches.find(function(x){ return Number(x.id)===Number(b.matchId); });
    if(!sm2||sm2.status!=='live') return 0;
    return Math.round(b.stake*0.5*100)/100;
  }
  var cur2 = computeOdds(m)[b.pick];
  if(!isValid(cur2)) return Math.round(b.stake*0.5*100)/100;
  var fair2 = b.potential / cur2;
  var pay2 = Math.max(b.stake*0.1, Math.round(fair2*0.92*100)/100);
  return Math.min(pay2, b.potential);
}
function doCashout(id){
  var b = wallet.bets.find(function(x){ return x.id===id; });
  if(!b||b.status!=='pending') return;
  var co=0;
  if(b.type==='express'||b.type==='builder'){
    for(var i=0;i<b.selections.length;i++){
      var sel=b.selections[i];
      var sm = matches.find(function(x){ return Number(x.id)===Number(sel.matchId); });
      if(sm&&sm.status==='live'){ co = cashoutValue(b,sm); break; }
    }
  } else {
    var m = matches.find(function(x){ return x.id===b.matchId; });
    if(m) co = cashoutValue(b,m);
  }
  if(co<=0) return;
  b.status='won'; b.payout=co; b.cashout=true;
  wallet.balance += co; wallet.totalWon += co;
  saveWallet(); flashBalance('win'); renderBalance(); renderHistory(); renderStats(); renderAchiv();
  sBet();
  toast('win','💰','Кэшаут: +'+fmt(co)+' ₽');
}

/* ============ РАСЧЁТ СТАВОК ============ */
function checkSel(m, pick){
  if(!m||m.status!=='finished') return 'pending';

  // UFC
  if(m.sport==='ufc'){
    if(!m.finalResult) return 'pending';
    var fr = m.finalResult;
    var isH = fr.winner==='home', isA = fr.winner==='away';
    var md = fr.method, rr = fr.round, fin = md!=='Решение';

    if(pick==='home') return isH?'won':'lost';
    if(pick==='away') return isA?'won':'lost';
    if(pick==='KO/TKO') return md==='KO/TKO'?'won':'lost';
    if(pick==='Сабмишн') return md==='Сабмишн'?'won':'lost';
    if(pick==='Решение') return md==='Решение'?'won':'lost';
    if(pick==='Бой досрочно') return fin?'won':'lost';
    if(pick==='Вся дистанция') return !fin?'won':'lost';

    // Победа в RN · Кто
    var winR = pick.match(/^Победа в R(\d+)\s*·\s*(.+)$/);
    if(winR){
      var rnum = parseInt(winR[1]);
      var who = winR[2];
      if(rr !== rnum || !fin) return 'lost';
      if(who===m.home) return isH?'won':'lost';
      if(who===m.away) return isA?'won':'lost';
      return 'lost';
    }

    // ТБ/ТМ X.5 раундов
    var rTot = pick.match(/^(ТБ|ТМ)\s*([\d.]+)\s*раундов$/);
    if(rTot){
      var line = parseFloat(rTot[2]);
      var finalRound = fr.round;
      if(rTot[1]==='ТБ') return finalRound > line ? 'won' : 'lost';
      return finalRound < line ? 'won' : 'lost';
    }

    // Бой дойдёт до RN
    var reachR = pick.match(/^Бой дойдёт до R(\d+)$/);
    if(reachR){
      var rn = parseInt(reachR[1]);
      return fr.round >= rn ? 'won' : 'lost';
    }

    if(pick===m.home+' KO/TKO') return (isH&&md==='KO/TKO')?'won':'lost';
    if(pick===m.home+' Сабмишн') return (isH&&md==='Сабмишн')?'won':'lost';
    if(pick===m.home+' Решение') return (isH&&md==='Решение')?'won':'lost';
    if(pick===m.away+' KO/TKO') return (isA&&md==='KO/TKO')?'won':'lost';
    if(pick===m.away+' Сабмишн') return (isA&&md==='Сабмишн')?'won':'lost';
    if(pick===m.away+' Решение') return (isA&&md==='Решение')?'won':'lost';
    return 'lost';
  }

  // Волейбол
  if(m.sport==='volleyball'){
    if(pick==='home') return m.setsHome>m.setsAway?'won':'lost';
    if(pick==='away') return m.setsAway>m.setsHome?'won':'lost';

    var tot = pick.match(/^(ТБ|ТМ)\s*([\d.]+)\s*сетов$/);
    if(tot){
      var line2 = parseFloat(tot[2]);
      var totS = m.setsHome+m.setsAway;
      if(tot[1]==='ТБ') return totS > line2 ? 'won' : 'lost';
      return totS < line2 ? 'won' : 'lost';
    }

    var cs = pick.match(/^Счёт (\d+):(\d+)$/);
    if(cs) return (m.setsHome===+cs[1] && m.setsAway===+cs[2])?'won':'lost';

    if(pick==='Победа в сете · П1') return m.setsHome>m.setsAway?'won':'lost';
    if(pick==='Победа в сете · П2') return m.setsAway>m.setsHome?'won':'lost';

    var tPoint = pick.match(/^(ТБ|ТМ)\s*([\d.]+)\s*\(сет\)$/);
    if(tPoint){
      var line3 = parseFloat(tPoint[2]);
      var totalPoints = 0;
      for(var i=0;i<m.setHistory.length;i++){
        totalPoints += m.setHistory[i].h + m.setHistory[i].a;
      }
      // последний сет
      var last = m.setHistory[m.setHistory.length-1];
      var lastTotal = last ? (last.h + last.a) : (m.pointsHome+m.pointsAway);
      if(tPoint[1]==='ТБ') return lastTotal > line3 ? 'won' : 'lost';
      return lastTotal < line3 ? 'won' : 'lost';
    }

    if(pick.indexOf('Обе возьмут сет')>-1){
      if(pick.indexOf('Да')>-1) return (m.setsHome>0 && m.setsAway>0)?'won':'lost';
      return (m.setsHome===0 || m.setsAway===0)?'won':'lost';
    }
    return 'lost';
  }

  // Футбол / хоккей
  if(pick==='home') return m.scoreHome > m.scoreAway ? 'won' : 'lost';
  if(pick==='away') return m.scoreAway > m.scoreHome ? 'won' : 'lost';
  if(pick==='draw') return m.scoreHome===m.scoreAway?'won':'lost';
  if(pick==='1X') return m.scoreHome >= m.scoreAway ? 'won' : 'lost';
  if(pick==='12') return m.scoreHome !== m.scoreAway ? 'won' : 'lost';
  if(pick==='X2') return m.scoreHome <= m.scoreAway ? 'won' : 'lost';
  var totG = (m.scoreHome||0)+(m.scoreAway||0);
  var tO = pick.match(/^ТБ\s*([\d.]+)$/);
  var tU = pick.match(/^ТМ\s*([\d.]+)$/);
  if(tO) return totG > parseFloat(tO[1]) ? 'won' : 'lost';
  if(tU) return totG < parseFloat(tU[1]) ? 'won' : 'lost';
  return 'lost';
}

function settleBets(){
  var changed=false;
  wallet.bets.forEach(function(b){
    if(b.status!=='pending') return;
    if(b.type==='express'||b.type==='builder'){
      var anyL=false, allW=true, allD=true;
      for(var i=0;i<b.selections.length;i++){
        var sel = b.selections[i];
        if(sel.status==='lost'){ anyL=true; continue; }
        if(sel.status==='won') continue;
        var m = matches.find(function(x){ return Number(x.id)===Number(sel.matchId); });
        if(!m || m.status!=='finished'){ allD=false; allW=false; continue; }
        var r = checkSel(m, sel.pick);
        sel.status = r;
        if(r==='lost'){ anyL=true; allW=false; }
      }
      if(anyL){ b.status='lost'; sLose(); flashBalance('lose'); changed=true; return; }
      if(allD && allW && b.selections.every(function(s){ return s.status==='won'; })){
        b.status='won';
        b.payout = Math.round(b.stake*b.odd*100)/100;
        wallet.balance += b.payout;
        wallet.totalWon += b.payout;
        sWin(); vibe(50); flashBalance('win');
        changed=true;
        wallet.profitHistory.push({t:Date.now(),v:wallet.totalWon-wallet.totalBet});
        if(wallet.profitHistory.length>100) wallet.profitHistory.shift();
        toast('win','🏆','Экспресс зашёл: +'+fmt(b.payout)+' ₽');
      }
      return;
    }
    var m2 = matches.find(function(x){ return Number(x.id)===Number(b.matchId); });
    if(!m2 || m2.status!=='finished') return;
    var r2 = checkSel(m2, b.pick);
    if(r2==='won'){
      b.status='won';
      b.payout = Math.round(b.stake*b.odd*100)/100;
      wallet.balance += b.payout;
      wallet.totalWon += b.payout;
      sWin(); vibe(50); flashBalance('win');
      toast('win','✅','Зашла: +'+fmt(b.payout)+' ₽');
    } else {
      b.status='lost';
      sLose(); flashBalance('lose');
      toast('lose','❌','Не зашла: -'+fmt(b.stake)+' ₽');
    }
    changed=true;
    wallet.profitHistory.push({t:Date.now(),v:wallet.totalWon-wallet.totalBet});
    if(wallet.profitHistory.length>100) wallet.profitHistory.shift();
  });
  if(changed){
    saveWallet(); renderBalance(); renderHistory(); renderStats(); renderAchiv();
  }
}

/* ============ ГЛАВНЫЙ ЦИКЛ ============ */
function tick(){
  resetDaily();
  for(var i=0;i<matches.length;i++){
    if(matches[i].status==='live' || matches[i].status==='countdown'){
      try{ tickMatch(matches[i]); }
      catch(e){ console.error('tick err', matches[i].id, e); matches[i].status='finished'; }
    }
  }
  for(var j=0;j<matches.length;j++){
    var m2 = matches[j];
    if(m2.status==='finished' && !m2.countdownStarted){
      m2.finishedAt = m2.finishedAt || Date.now();
      if(Date.now()-m2.finishedAt > 4000){
        m2.countdownStarted = true;
        m2.status='countdown';
        m2.countdownLeft = 45;
      }
    }
  }
  settleBets();
  if(matches.filter(function(m){ return m.status==='live'||m.status==='countdown'; }).length < 12){
    var cnt = {football:0, hockey:0, volleyball:0, ufc:0};
    matches.forEach(function(m){
      if((m.status==='live'||m.status==='countdown') && cnt[m.sport]!==undefined) cnt[m.sport]++;
    });
    var targets = {football:4, hockey:3, volleyball:3, ufc:3};
    ['football','hockey','volleyball','ufc'].forEach(function(sp){
      if(cnt[sp] < targets[sp]-1){
        var need = targets[sp]-cnt[sp];
        for(var n=0;n<need;n++){
          if(sp==='football') matches.push(newFootball());
          else if(sp==='hockey') matches.push(newHockey());
          else if(sp==='volleyball') matches.push(newVolleyball());
          else matches.push(newUFC());
        }
      }
    });
  }
  if(matches.length > 30){
    var seen = new Set();
    matches = matches.filter(function(m){
      var k = m.home+'|'+m.away+'|'+m.sport;
      if(seen.has(k)) return false;
      seen.add(k);
      return true;
    });
    if(matches.length > 30) matches = matches.slice(0,30);
  }
  renderMatches();
  if(currentTab==='stats') renderStats();
  if(currentTab==='history') renderHistory();
  if(currentTab==='top') renderTop();
  if(currentTab==='achiv') renderAchiv();
}
