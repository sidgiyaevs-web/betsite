<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ЛинияБет — демо-ставки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0B1220;
    --panel: #121B2C;
    --panel-2: #17233A;
    --line: #24314A;
    --text: #EDEFF3;
    --muted: #7C8797;
    --accent: #E8A33D;
    --accent-dim: #4A3A1E;
    --up: #3DDC97;
    --down: #FF5D5D;
    --live: #FF5D5D;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Manrope',sans-serif;
    min-height:100vh;
    padding-bottom:100px;
  }
  .odds{font-family:'Space Mono',monospace;font-variant-numeric:tabular-nums;}

  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 24px;border-bottom:1px solid var(--line);
    background:var(--panel);position:sticky;top:0;z-index:20;
    flex-wrap:wrap;gap:12px;
  }
  .brand{display:flex;align-items:baseline;gap:8px;}
  .brand .mark{
    width:34px;height:34px;border-radius:9px;
    background:linear-gradient(135deg,var(--accent),#c97a1f);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;color:#1a1206;font-size:18px;
  }
  .brand .name{font-weight:800;font-size:19px;letter-spacing:-0.01em;}
  .brand .name span{color:var(--accent);}
  .brand .tag{color:var(--muted);font-size:12px;margin-left:6px;}

  .wallet{display:flex;align-items:center;gap:14px;}
  .balance-box{
    background:var(--panel-2);border:1px solid var(--line);
    border-radius:10px;padding:8px 14px;text-align:right;
  }
  .balance-box .label{font-size:11px;color:var(--muted);}
  .balance-box .amount{font-size:17px;font-weight:700;font-family:'Space Mono',monospace;}
  #bonusBtn{
    border:none;border-radius:10px;padding:10px 16px;
    background:var(--accent);color:#1a1206;font-weight:700;
    cursor:pointer;font-size:13px;font-family:inherit;
    transition:transform .08s ease;
  }
  #bonusBtn:active{transform:scale(.97);}
  #bonusBtn.disabled{
    background:transparent;border:1px solid var(--line);color:var(--muted);
    cursor:default;
  }

  nav{
    display:flex;gap:6px;padding:14px 24px 0 24px;border-bottom:1px solid var(--line);
    background:var(--bg);position:sticky;top:73px;z-index:19;overflow-x:auto;
  }
  .tab{
    padding:10px 18px;border-radius:10px 10px 0 0;cursor:pointer;
    color:var(--muted);font-weight:600;font-size:14px;white-space:nowrap;
    border-bottom:2px solid transparent;
  }
  .tab.active{color:var(--text);border-bottom:2px solid var(--accent);background:var(--panel);}

  main{padding:20px 24px;max-width:900px;margin:0 auto;}
  .disclaimer{
    font-size:12px;color:var(--muted);background:var(--panel-2);
    border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:18px;
  }

  .match{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:16px 18px;margin-bottom:12px;
  }
  .match-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .live-badge{
    display:flex;align-items:center;gap:6px;color:var(--live);font-size:12px;font-weight:700;
  }
  .live-dot{width:7px;height:7px;border-radius:50%;background:var(--live);animation:pulse 1.2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
  .clock{color:var(--muted);font-size:12px;font-family:'Space Mono',monospace;}

  .teams{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .team{flex:1;font-weight:700;font-size:15px;}
  .team.right{text-align:right;}
  .score{
    font-family:'Space Mono',monospace;font-weight:700;font-size:20px;
    background:var(--panel-2);border-radius:8px;padding:4px 12px;min-width:56px;text-align:center;
  }
  .round-info{color:var(--muted);font-size:12px;margin-top:4px;text-align:center;}

  .odds-row{display:flex;gap:8px;margin-top:14px;}
  .odd-btn{
    flex:1;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;
    padding:8px 6px;text-align:center;cursor:pointer;position:relative;
    transition:background .15s ease, border-color .15s ease;
  }
  .odd-btn:hover{border-color:var(--accent);}
  .odd-btn.selected{background:var(--accent-dim);border-color:var(--accent);}
  .odd-btn .k-label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px;}
  .odd-btn .k-val{display:block;font-size:15px;font-weight:700;}
  .odd-btn .k-val.flash-up{animation:flashUp .8s ease;}
  .odd-btn .k-val.flash-down{animation:flashDown .8s ease;}
  @keyframes flashUp{0%{color:var(--up);}100%{color:var(--text);}}
  @keyframes flashDown{0%{color:var(--down);}100%{color:var(--text);}}

  /* bet slip */
  #slip{
    position:fixed;right:20px;bottom:20px;width:320px;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    box-shadow:0 12px 30px rgba(0,0,0,.4);z-index:30;
    max-height:70vh;display:flex;flex-direction:column;overflow:hidden;
  }
  #slip.empty{display:none;}
  .slip-head{
    padding:12px 16px;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;font-weight:700;
  }
  .slip-head .clear{color:var(--muted);font-size:12px;cursor:pointer;font-weight:500;}
  .slip-legs{overflow-y:auto;padding:8px 16px;flex:1;}
  .leg{padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .leg:last-child{border-bottom:none;}
  .leg-top{display:flex;justify-content:space-between;color:var(--muted);}
  .leg-top .rm{cursor:pointer;color:var(--down);}
  .leg-mid{font-weight:600;margin:2px 0;}
  .leg-odd{color:var(--accent);font-family:'Space Mono',monospace;}
  .slip-foot{padding:14px 16px;border-top:1px solid var(--line);}
  .slip-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;color:var(--muted);}
  .slip-row b{color:var(--text);font-family:'Space Mono',monospace;}
  #stakeInput{
    width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--text);font-family:'Space Mono',monospace;font-size:14px;
    margin-bottom:8px;
  }
  #placeBtn{
    width:100%;padding:11px;border:none;border-radius:10px;background:var(--accent);
    color:#1a1206;font-weight:700;cursor:pointer;font-size:14px;font-family:inherit;
  }
  #placeBtn:disabled{background:var(--panel-2);color:var(--muted);cursor:not-allowed;}

  /* my bets */
  #betsPanel{max-width:900px;margin:28px auto 0 auto;padding:0 24px;}
  #betsPanel h2{font-size:16px;margin-bottom:10px;color:var(--muted);font-weight:700;}
  .bet-row{
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:10px 14px;margin-bottom:8px;font-size:13px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;
  }
  .bet-row .legs-txt{color:var(--muted);flex:1;min-width:180px;}
  .bet-status{font-weight:700;padding:3px 10px;border-radius:6px;font-size:12px;white-space:nowrap;height:fit-content;}
  .st-pending{background:var(--panel-2);color:var(--muted);}
  .st-win{background:rgba(61,220,151,.15);color:var(--up);}
  .st-lose{background:rgba(255,93,93,.15);color:var(--down);}

  .toast{
    position:fixed;top:90px;left:50%;transform:translateX(-50%);
    background:var(--panel-2);border:1px solid var(--accent);color:var(--text);
    padding:10px 18px;border-radius:10px;font-size:13px;z-index:50;
    opacity:0;pointer-events:none;transition:opacity .3s ease, top .3s ease;
  }
  .toast.show{opacity:1;top:100px;}

  @media (max-width:640px){
    #slip{left:12px;right:12px;width:auto;bottom:12px;}
    header{padding:12px 14px;}
    main{padding:14px;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="mark">Л</div>
    <div class="name">Линия<span>Бет</span></div>
    <div class="tag">демо-режим · игра на виртуальные ₽</div>
  </div>
  <div class="wallet">
    <div class="balance-box">
      <div class="label">Баланс</div>
      <div class="amount" id="balanceView">0 ₽</div>
    </div>
    <button id="bonusBtn">Получить 100 000 ₽</button>
  </div>
</header>

<nav>
  <div class="tab active" data-sport="football">Футбол</div>
  <div class="tab" data-sport="hockey">Хоккей</div>
  <div class="tab" data-sport="ufc">UFC</div>
</nav>

<main>
  <div class="disclaimer">Это демо-симулятор для себя: деньги виртуальные, вывод недоступен, все матчи и результаты — сгенерированы случайно.</div>
  <div id="matchList"></div>
</main>

<div id="betsPanel">
  <h2>Мои ставки</h2>
  <div id="betsList"></div>
</div>

<div id="slip" class="empty">
  <div class="slip-head">
    <span>Купон (<span id="legCount">0</span>)</span>
    <span class="clear" id="clearSlip">очистить</span>
  </div>
  <div class="slip-legs" id="slipLegs"></div>
  <div class="slip-foot">
    <div class="slip-row"><span>Коэффициент</span><b id="totalOdd">1.00</b></div>
    <input id="stakeInput" type="number" min="10" step="10" value="100" placeholder="Сумма ставки">
    <div class="slip-row"><span>Возможный выигрыш</span><b id="potWin">0 ₽</b></div>
    <button id="placeBtn">Сделать ставку</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  /* ---------- persistence ---------- */
  const STORAGE_KEY = 'linebet_demo_v1';
  function todayStr(){ return new Date().toISOString().slice(0,10); }

  function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return { balance: 0, lastBonusDate: null, bets: [] };
  }
  function saveState(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }
  let state = loadState();

  /* ---------- data pools ---------- */
  const FOOTBALL_TEAMS = ['Спартак','Зенит','ЦСКА','Динамо','Локомотив','Краснодар','Ростов','Ахмат','Рубин','Урал'];
  const HOCKEY_TEAMS = ['СКА','Ак Барс','Металлург','Авангард','Динамо Мск','Локомотив Яр','Салават Юлаев','Трактор','Барыс','ЦСКА'];
  const UFC_FIGHTERS = ['Д.Волин','Р.Куреш','М.Батыров','Т.Шевцов','И.Ярыгин','К.Демченко','А.Носов','П.Гринько','С.Медведь','О.Ханов'];

  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
  function pickTwo(arr){
    const a = pick(arr);
    let b = pick(arr);
    while(b===a) b = pick(arr);
    return [a,b];
  }
  function rnd(min,max){ return Math.random()*(max-min)+min; }
  function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }

  /* ---------- match factories ---------- */
  let matchSeq = 1;
  const CYCLE_SECONDS = 300; // 5 minutes per match/fight

  function newFootball(slot){
    const [h,a] = pickTwo(FOOTBALL_TEAMS);
    return {
      id: 'f'+slot, sport:'football', roundId: matchSeq++,
      home:h, away:a, scoreH:0, scoreA:0, elapsed:0, cycle:CYCLE_SECONDS,
      odds:{H: rnd(1.6,2.6), D: rnd(3.0,3.8), A: rnd(2.2,4.5)},
      nextTick: rnd(3,7)
    };
  }
  function newHockey(slot){
    const [h,a] = pickTwo(HOCKEY_TEAMS);
    return {
      id:'h'+slot, sport:'hockey', roundId: matchSeq++,
      home:h, away:a, scoreH:0, scoreA:0, elapsed:0, cycle:CYCLE_SECONDS,
      odds:{H: rnd(1.7,2.5), D: rnd(4.5,6.0), A: rnd(2.0,3.6)},
      nextTick: rnd(3,7)
    };
  }
  function newUfc(slot){
    const [f1,f2] = pickTwo(UFC_FIGHTERS);
    return {
      id:'u'+slot, sport:'ufc', roundId: matchSeq++,
      f1:f1, f2:f2, round:1, elapsed:0, cycle:CYCLE_SECONDS, roundLen:60,
      odds:{F1: rnd(1.4,2.8), F2: rnd(1.4,2.8)},
      nextTick: rnd(3,7)
    };
  }

  const matches = {
    football: [newFootball(1), newFootball(2), newFootball(3)],
    hockey: [newHockey(1), newHockey(2), newHockey(3)],
    ufc: [newUfc(1), newUfc(2)]
  };

  /* ---------- odds drift ---------- */
  function driftOdds(m){
    const keys = Object.keys(m.odds);
    keys.forEach(k=>{
      const delta = rnd(-0.12,0.12);
      m.odds[k] = clamp(+(m.odds[k]+delta).toFixed(2), 1.05, 12.0);
      m.flash = m.flash || {};
      m.flash[k] = delta >= 0 ? 'up' : 'down';
    });
  }

  function maybeScore(m){
    if(m.sport==='ufc') return;
    // small chance per tick of a goal, biased toward the team with lower (favourite) odds
    if(Math.random() < 0.012){
      const favHome = m.odds.H <= m.odds.A;
      if(Math.random() < (favHome?0.55:0.45)){ m.scoreH++; m.odds.A += rnd(0.1,0.4); m.odds.H = clamp(m.odds.H-rnd(0.05,0.15),1.05,12); }
      else { m.scoreA++; m.odds.H += rnd(0.1,0.4); m.odds.A = clamp(m.odds.A-rnd(0.05,0.15),1.05,12); }
    }
  }

  /* ---------- settlement ---------- */
  function weightedWinner(oddsMap){
    // lower odd -> higher implied probability -> more likely to win
    const entries = Object.entries(oddsMap);
    const weights = entries.map(([k,v])=>1/v);
    const total = weights.reduce((a,b)=>a+b,0);
    let r = Math.random()*total;
    for(let i=0;i<entries.length;i++){
      r -= weights[i];
      if(r<=0) return entries[i][0];
    }
    return entries[entries.length-1][0];
  }

  function settleMatch(m){
    let outcome;
    if(m.sport==='ufc'){
      outcome = weightedWinner(m.odds); // 'F1' or 'F2'
    } else {
      // use current score as primary signal, odds as tiebreak flavour
      if(m.scoreH>m.scoreA) outcome='H';
      else if(m.scoreA>m.scoreH) outcome='A';
      else outcome = weightedWinner({H:m.odds.H,D:m.odds.D,A:m.odds.A});
    }
    resolveLegsForMatch(m.id, m.roundId, outcome);
    return outcome;
  }

  function resolveLegsForMatch(matchId, roundId, outcome){
    state.bets.forEach(bet=>{
      if(bet.status !== 'pending') return;
      bet.legs.forEach(leg=>{
        if(leg.matchId===matchId && leg.roundId===roundId && leg.result==='pending'){
          leg.result = (leg.outcomeKey===outcome) ? 'win' : 'lose';
        }
      });
      const allDone = bet.legs.every(l=>l.result!=='pending');
      if(allDone){
        const won = bet.legs.every(l=>l.result==='win');
        bet.status = won ? 'win' : 'lose';
        if(won){
          state.balance += bet.potentialWin;
          showToast('Экспресс сыгран! +'+fmt(bet.potentialWin)+' ₽');
        } else {
          showToast('Ставка не сыграла');
        }
      }
    });
  }

  function resetMatch(sport, idx){
    if(sport==='football') matches.football[idx] = newFootball(idx+1);
    else if(sport==='hockey') matches.hockey[idx] = newHockey(idx+1);
    else matches.ufc[idx] = newUfc(idx+1);
  }

  /* ---------- tick loop ---------- */
  function tick(){
    ['football','hockey','ufc'].forEach(sport=>{
      matches[sport].forEach((m, idx)=>{
        m.elapsed += 1;
        m.flash = {};
        m.nextTick -= 1;
        if(m.nextTick <= 0){
          driftOdds(m);
          m.nextTick = rnd(3,7);
        }
        maybeScore(m);
        if(m.sport==='ufc'){
          const newRound = Math.min(5, Math.floor(m.elapsed / m.roundLen) + 1);
          m.round = newRound;
        }
        if(m.elapsed >= m.cycle){
          const outcome = settleMatch(m);
          resetMatch(sport, idx);
        }
      });
    });
    saveState();
    render();
  }
  setInterval(tick, 1000);

  /* ---------- bet slip state ---------- */
  let slip = []; // {matchId, roundId, sport, outcomeKey, odd, label}

  function toggleSelection(m, outcomeKey, odd, label){
    const existingIdx = slip.findIndex(s=>s.matchId===m.id);
    if(existingIdx>=0 && slip[existingIdx].outcomeKey===outcomeKey){
      slip.splice(existingIdx,1);
    } else if(existingIdx>=0){
      slip[existingIdx] = {matchId:m.id, roundId:m.roundId, sport:m.sport, outcomeKey, odd, label};
    } else {
      slip.push({matchId:m.id, roundId:m.roundId, sport:m.sport, outcomeKey, odd, label});
    }
    renderSlip();
    render();
  }

  function renderSlip(){
    const slipEl = document.getElementById('slip');
    if(slip.length===0){ slipEl.classList.add('empty'); return; }
    slipEl.classList.remove('empty');
    document.getElementById('legCount').textContent = slip.length;
    const legsEl = document.getElementById('slipLegs');
    legsEl.innerHTML = slip.map((s,i)=>`
      <div class="leg">
        <div class="leg-top"><span>${s.matchLabel||''}</span><span class="rm" data-i="${i}">убрать</span></div>
        <div class="leg-mid">${s.label}</div>
        <div class="leg-odd">${s.odd.toFixed(2)}</div>
      </div>`).join('');
    legsEl.querySelectorAll('.rm').forEach(el=>{
      el.addEventListener('click', ()=>{
        slip.splice(+el.dataset.i,1);
        renderSlip(); render();
      });
    });
    const totalOdd = slip.reduce((a,s)=>a*s.odd,1);
    document.getElementById('totalOdd').textContent = totalOdd.toFixed(2);
    const stake = +document.getElementById('stakeInput').value || 0;
    document.getElementById('potWin').textContent = fmt(Math.round(stake*totalOdd))+' ₽';
    const placeBtn = document.getElementById('placeBtn');
    placeBtn.disabled = stake<=0 || stake>state.balance;
  }

  document.getElementById('clearSlip').addEventListener('click', ()=>{
    slip = []; renderSlip(); render();
  });
  document.getElementById('stakeInput').addEventListener('input', renderSlip);

  document.getElementById('placeBtn').addEventListener('click', ()=>{
    const stake = +document.getElementById('stakeInput').value || 0;
    if(stake<=0 || stake>state.balance || slip.length===0) return;
    const totalOdd = slip.reduce((a,s)=>a*s.odd,1);
    const bet = {
      id: 'b'+Date.now(),
      placedAt: Date.now(),
      stake,
      totalOdd,
      potentialWin: Math.round(stake*totalOdd),
      status: 'pending',
      legs: slip.map(s=>({matchId:s.matchId, roundId:s.roundId, outcomeKey:s.outcomeKey, label:s.label, matchLabel:s.matchLabel, result:'pending'}))
    };
    state.balance -= stake;
    state.bets.unshift(bet);
    slip = [];
    saveState();
    renderSlip();
    render();
    showToast('Ставка принята: '+fmt(stake)+' ₽');
  });

  /* ---------- bonus ---------- */
  function updateBonusBtn(){
    const btn = document.getElementById('bonusBtn');
    if(state.lastBonusDate === todayStr()){
      btn.classList.add('disabled');
      btn.textContent = 'Бонус получен сегодня';
    } else {
      btn.classList.remove('disabled');
      btn.textContent = 'Получить 100 000 ₽';
    }
  }
  document.getElementById('bonusBtn').addEventListener('click', ()=>{
    if(state.lastBonusDate === todayStr()) return;
    state.balance += 100000;
    state.lastBonusDate = todayStr();
    saveState();
    render();
    showToast('Начислено 100 000 ₽ демо-баланса');
  });

  /* ---------- tabs ---------- */
  let activeSport = 'football';
  document.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click', ()=>{
      document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      activeSport = t.dataset.sport;
      render();
    });
  });

  /* ---------- render ---------- */
  function fmt(n){ return Math.round(n).toLocaleString('ru-RU'); }
  function mmss(sec){
    const remain = Math.max(0, 300-sec);
    const m = Math.floor(remain/60), s = remain%60;
    return m+':' + String(s).padStart(2,'0');
  }

  function oddBtnHtml(m, key, label, val){
    const isSel = slip.some(s=>s.matchId===m.id && s.outcomeKey===key);
    const flashClass = m.flash && m.flash[key] ? ('flash-'+m.flash[key]) : '';
    return `<div class="odd-btn ${isSel?'selected':''}" data-mid="${m.id}" data-key="${key}">
      <span class="k-label">${label}</span>
      <span class="k-val ${flashClass}">${val.toFixed(2)}</span>
    </div>`;
  }

  function renderMatchList(){
    const list = matches[activeSport];
    const el = document.getElementById('matchList');
    if(activeSport==='ufc'){
      el.innerHTML = list.map(m=>`
        <div class="match">
          <div class="match-top">
            <div class="live-badge"><span class="live-dot"></span>LIVE · раунд ${m.round}/5</div>
            <div class="clock">${mmss(m.elapsed)}</div>
          </div>
          <div class="teams">
            <div class="team">${m.f1}</div>
            <div class="round-info">vs</div>
            <div class="team right">${m.f2}</div>
          </div>
          <div class="odds-row">
            ${oddBtnHtml(m,'F1', m.f1+' побеждает', m.odds.F1)}
            ${oddBtnHtml(m,'F2', m.f2+' побеждает', m.odds.F2)}
          </div>
        </div>`).join('');
    } else {
      el.innerHTML = list.map(m=>`
        <div class="match">
          <div class="match-top">
            <div class="live-badge"><span class="live-dot"></span>LIVE</div>
            <div class="clock">${mmss(m.elapsed)}</div>
          </div>
          <div class="teams">
            <div class="team">${m.home}</div>
            <div class="score">${m.scoreH} : ${m.scoreA}</div>
            <div class="team right">${m.away}</div>
          </div>
          <div class="odds-row">
            ${oddBtnHtml(m,'H', 'П1', m.odds.H)}
            ${oddBtnHtml(m,'D', 'Х', m.odds.D)}
            ${oddBtnHtml(m,'A', 'П2', m.odds.A)}
          </div>
        </div>`).join('');
    }
    el.querySelectorAll('.odd-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const mid = btn.dataset.mid, key = btn.dataset.key;
        const m = list.find(x=>x.id===mid);
        if(!m) return;
        const label = key==='F1' ? m.f1+' побеждает'
                    : key==='F2' ? m.f2+' побеждает'
                    : key==='H' ? m.home+' — П1'
                    : key==='D' ? 'Ничья'
                    : m.away+' — П2';
        const matchLabel = m.sport==='ufc' ? (m.f1+' vs '+m.f2) : (m.home+' — '+m.away);
        const sel = {matchId:m.id, roundId:m.roundId, sport:m.sport, outcomeKey:key, odd:m.odds[key], label, matchLabel};
        const idx = slip.findIndex(s=>s.matchId===m.id);
        if(idx>=0 && slip[idx].outcomeKey===key) slip.splice(idx,1);
        else if(idx>=0) slip[idx]=sel;
        else slip.push(sel);
        renderSlip();
        render();
      });
    });
  }

  function renderBets(){
    const el = document.getElementById('betsList');
    if(state.bets.length===0){
      el.innerHTML = '<div class="bet-row"><span class="legs-txt">Ставок пока нет — выбери коэффициент вверху.</span></div>';
      return;
    }
    el.innerHTML = state.bets.slice(0,20).map(b=>{
      const legsTxt = b.legs.map(l=>l.matchLabel+': '+l.label).join(' · ');
      const statusClass = b.status==='pending' ? 'st-pending' : b.status==='win' ? 'st-win' : 'st-lose';
      const statusTxt = b.status==='pending' ? 'в игре' : b.status==='win' ? '+'+fmt(b.potentialWin)+' ₽' : 'не сыграла';
      return `<div class="bet-row">
        <span class="legs-txt">${legsTxt} · ставка ${fmt(b.stake)} ₽ · кф ${b.totalOdd.toFixed(2)}</span>
        <span class="bet-status ${statusClass}">${statusTxt}</span>
      </div>`;
    }).join('');
  }

  function render(){
    document.getElementById('balanceView').textContent = fmt(state.balance)+' ₽';
    updateBonusBtn();
    renderMatchList();
    renderBets();
    renderSlip();
  }

  let toastTimer;
  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> t.classList.remove('show'), 2200);
  }

  render();
})();
</script>
</body>
</html>
