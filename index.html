<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="OpenBet — live betting platform">
<title>⚡ OpenBet — Live Betting</title>
<style>
/* ============================================================
   OPenBet v22 — Чистый просторный дизайн
   ============================================================ */

*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
button, input { font-family: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }

:root {
  --bg: #0b0b12;
  --bg2: #131320;
  --card: #181826;
  --card-hover: #1e1e30;
  --border: rgba(90, 90, 130, 0.15);
  --border-2: rgba(110, 110, 160, 0.3);
  --text: #ffffff;
  --text-2: #b0b0c8;
  --muted: #6e6e88;
  --accent: #7b5cff;
  --accent-2: #00d4ff;
  --green: #00e676;
  --red: #ff3860;
  --gold: #ffb800;
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
  --r-xl: 20px;
}
body.light {
  --bg: #f5f6fa;
  --bg2: #ebeef5;
  --card: #ffffff;
  --card-hover: #f8f9fc;
  --border: rgba(90, 90, 130, 0.12);
  --border-2: rgba(90, 90, 130, 0.25);
  --text: #0e0e1c;
  --text-2: #4a4a60;
  --muted: #8585a0;
}

html { scroll-behavior: smooth; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
body.has-coupon { padding-bottom: 120px; }

/* ============ HEADER ============ */
.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
}
.header-inner {
  max-width: 1240px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}
.logo {
  font-size: 19px;
  font-weight: 900;
  letter-spacing: -0.4px;
  cursor: pointer;
  white-space: nowrap;
}
.logo span {
  background: linear-gradient(135deg, #7b5cff, #00d4ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.header-actions {
  display: flex;
  align-items: center;
  gap: 6px;
}
.balance {
  background: var(--card);
  border: 1px solid var(--border);
  padding: 8px 14px;
  border-radius: var(--r-md);
  font-weight: 800;
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 6px;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
  user-select: none;
  transition: border-color .2s, box-shadow .2s;
  white-space: nowrap;
}
.balance:hover { border-color: var(--accent); }
.balance.flash-bonus { border-color: var(--gold); box-shadow: 0 0 24px rgba(255,184,0,.4); }
.balance.flash-win { border-color: var(--green); box-shadow: 0 0 20px rgba(0,230,118,.4); }
.balance.flash-lose { border-color: var(--red); box-shadow: 0 0 20px rgba(255,56,96,.4); }

.icon-btn {
  width: 38px;
  height: 38px;
  border-radius: var(--r-md);
  background: var(--card);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  transition: border-color .15s;
}
.icon-btn:hover { border-color: var(--accent); }
.icon-btn.muted { opacity: .5; }

/* ============ CONTAINER ============ */
.container {
  max-width: 1240px;
  margin: 0 auto;
  padding: 16px;
}

/* ============ SESSION ============ */
.session {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 12px 16px;
  margin-bottom: 14px;
  display: flex;
  gap: 18px;
  align-items: center;
  flex-wrap: wrap;
  font-size: 12.5px;
}
.session .label { color: var(--muted); font-weight: 600; }
.session .value { font-weight: 800; font-variant-numeric: tabular-nums; }
.session .value.green { color: var(--green); }
.session .value.red { color: var(--red); }
.session .value.gold { color: var(--gold); }
.session .spacer { margin-left: auto; }
.bonus-hint { font-size: 11.5px; color: var(--gold); font-weight: 700; }

/* ============ SPORT FILTERS (1 строка) ============ */
.sports {
  display: flex;
  gap: 6px;
  margin-bottom: 14px;
  overflow-x: auto;
  padding-bottom: 2px;
  scrollbar-width: none;
}
.sports::-webkit-scrollbar { display: none; }
.sport-chip {
  padding: 9px 16px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  font-weight: 700;
  color: var(--muted);
  font-size: 13px;
  white-space: nowrap;
  transition: all .15s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.sport-chip:hover { color: var(--text); }
.sport-chip.active {
  color: var(--text);
  border-color: var(--accent);
  background: rgba(123, 92, 255, 0.1);
}

/* ============ MATCH CARD ============ */
.matches-list {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
}
@media (min-width: 900px) {
  .matches-list {
    grid-template-columns: repeat(2, 1fr);
  }
}
@media (min-width: 1300px) {
  .matches-list {
    grid-template-columns: repeat(3, 1fr);
  }
}

.match {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  transition: border-color .15s;
}
.match:hover { border-color: var(--border-2); }
.match.finished { opacity: .55; }

/* Match header */
.match-head {
  display: flex;
  align-items: center;
  gap: 10px;
}
.match-sport {
  font-size: 16px;
}
.match-league {
  font-size: 11px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .5px;
  font-weight: 700;
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.match-status {
  font-size: 10px;
  padding: 4px 10px;
  border-radius: 6px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .5px;
  white-space: nowrap;
}
.match-status.live {
  background: var(--red);
  color: white;
  animation: pulse 1.5s infinite;
}
.match-status.live::before {
  content: '●';
  margin-right: 4px;
  font-size: 8px;
}
.match-status.break {
  background: var(--gold);
  color: #000;
}
.match-status.prematch {
  background: var(--accent);
  color: white;
}
.match-status.finished {
  background: rgba(120, 120, 140, 0.25);
  color: var(--muted);
}
.match-status.countdown {
  background: var(--accent-2);
  color: #000;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: .6; }
}

/* Teams */
.teams {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.team-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.team-info {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  flex: 1;
}
.team-logo {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: 12px;
  color: white;
  flex-shrink: 0;
}
.team-name {
  font-weight: 700;
  font-size: 15px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.team-score {
  font-weight: 900;
  font-size: 24px;
  font-variant-numeric: tabular-nums;
  color: var(--text);
  letter-spacing: -1px;
  min-width: 32px;
  text-align: right;
}

/* Separator between teams */
.vs-sep {
  display: none;
}

/* Match info row */
.match-info {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  color: var(--muted);
  padding: 8px 0;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}
.match-info .time {
  font-weight: 700;
  color: var(--text-2);
  font-variant-numeric: tabular-nums;
}
.match-info .period-name {
  font-weight: 600;
}
.match-info .right {
  margin-left: auto;
  display: flex;
  gap: 12px;
}

/* Period progress */
.progress {
  display: flex;
  gap: 3px;
  height: 4px;
}
.progress-seg {
  flex: 1;
  background: rgba(120, 120, 160, 0.18);
  border-radius: 2px;
  overflow: hidden;
  position: relative;
}
.progress-seg.done { background: var(--green); }
.progress-seg.active::after {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: var(--p, 0%);
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
}

/* UFC result block */
.ufc-result {
  background: linear-gradient(135deg, rgba(255, 184, 0, 0.12), rgba(255, 56, 96, 0.05));
  border: 1px solid rgba(255, 184, 0, 0.35);
  border-radius: var(--r-md);
  padding: 12px;
  font-size: 12.5px;
  font-weight: 700;
  line-height: 1.5;
}
.ufc-result .win {
  color: var(--gold);
  font-weight: 800;
}

/* Odds buttons */
.odds-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
}
.odds-row.two-col {
  grid-template-columns: 1fr 1fr;
}
.odd-btn {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 12px 8px;
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 4px;
  transition: all .15s;
  font-family: inherit;
  color: var(--text);
}
.odd-btn:hover:not(:disabled):not(.disabled) {
  border-color: var(--accent);
  background: var(--card-hover);
}
.odd-btn:active:not(:disabled):not(.disabled) {
  transform: scale(0.98);
}
.odd-btn:disabled, .odd-btn.disabled {
  opacity: .3;
  cursor: not-allowed;
}
.odd-btn.up { border-color: rgba(0, 230, 118, 0.4); }
.odd-btn.down { border-color: rgba(255, 56, 96, 0.4); }
.odd-label {
  font-size: 11px;
  color: var(--muted);
  font-weight: 600;
}
.odd-value {
  font-size: 17px;
  font-weight: 800;
  color: var(--accent-2);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.3px;
}

/* Extras */
.extras {
  border-top: 1px solid var(--border);
  padding-top: 12px;
}
.extras-toggle {
  color: var(--accent-2);
  font-size: 12.5px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 0;
  transition: color .15s;
}
.extras-toggle:hover { color: var(--text); }
.extras-grid {
  display: none;
  grid-template-columns: repeat(2, 1fr);
  gap: 6px;
  margin-top: 10px;
}
.extras-grid.open { display: grid; }
@media (min-width: 600px) {
  .extras-grid { grid-template-columns: repeat(3, 1fr); }
}
.odd-mini {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  padding: 9px 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  min-width: 0;
  transition: all .15s;
}
.odd-mini:hover:not(.disabled) { border-color: var(--accent); }
.odd-mini.disabled { opacity: .3; cursor: not-allowed; }
.odd-mini-label {
  font-size: 11px;
  color: var(--muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  text-align: left;
}
.odd-mini-value {
  font-size: 12.5px;
  font-weight: 800;
  color: var(--accent-2);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

/* ============ EMPTY ============ */
.empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--muted);
}
.empty-icon { font-size: 48px; margin-bottom: 12px; opacity: .5; }
.empty-text { font-size: 14px; font-weight: 600; }

/* ============ HISTORY ============ */
.history-filters {
  display: flex;
  gap: 6px;
  margin-bottom: 14px;
  overflow-x: auto;
  scrollbar-width: none;
}
.history-filters::-webkit-scrollbar { display: none; }
.history-chip {
  padding: 8px 14px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  font-weight: 700;
  color: var(--muted);
  font-size: 12.5px;
  white-space: nowrap;
}
.history-chip.active { color: var(--text); border-color: var(--accent); }

.history-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.history-item {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  cursor: pointer;
  transition: border-color .15s;
}
.history-item:hover { border-color: var(--border-2); }
.history-item.won { border-left: 4px solid var(--green); }
.history-item.lost { border-left: 4px solid var(--red); }
.history-item.pending { border-left: 4px solid var(--gold); }
.history-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
}
.history-match {
  font-weight: 700;
  font-size: 14px;
  line-height: 1.3;
}
.history-meta {
  font-size: 11.5px;
  color: var(--muted);
  margin-top: 2px;
}
.history-amount {
  font-weight: 800;
  font-size: 15px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.history-foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
}
.history-odd {
  font-size: 12px;
  color: var(--muted);
}
.history-odd b { color: var(--accent-2); font-weight: 800; }
.history-status {
  font-weight: 800;
  padding: 4px 12px;
  border-radius: 6px;
  text-transform: uppercase;
  letter-spacing: .3px;
  font-size: 10.5px;
  white-space: nowrap;
}
.history-status.won { background: rgba(0, 230, 118, 0.15); color: var(--green); }
.history-status.lost { background: rgba(255, 56, 96, 0.15); color: var(--red); }
.history-status.pending { background: rgba(255, 184, 0, 0.15); color: var(--gold); }

.cashout-btn {
  background: linear-gradient(135deg, var(--green), #00b050);
  color: #000;
  padding: 10px 18px;
  border-radius: var(--r-md);
  font-weight: 800;
  font-size: 12.5px;
  align-self: flex-start;
  transition: transform .15s;
}
.cashout-btn:hover { transform: translateY(-1px); }

/* ============ STATS ============ */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-bottom: 20px;
}
@media (min-width: 700px) {
  .stats-grid { grid-template-columns: repeat(4, 1fr); }
}
.stat-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 16px;
}
.stat-label {
  font-size: 11.5px;
  color: var(--muted);
  margin-bottom: 6px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .3px;
}
.stat-value {
  font-size: 22px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.5px;
}
.stat-value.green { color: var(--green); }
.stat-value.red { color: var(--red); }
.stat-value.gold { color: var(--gold); }

.chart-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 18px;
  margin-bottom: 16px;
}
.chart-title {
  font-size: 12px;
  color: var(--muted);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .5px;
  margin-bottom: 14px;
}
.chart-canvas {
  width: 100%;
  height: 200px;
  display: block;
}

/* ============ ACHIEVEMENTS ============ */
.ach-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 10px;
}
.ach {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 18px 12px;
  text-align: center;
  opacity: 0.4;
  transition: all .2s;
}
.ach.unlocked {
  opacity: 1;
  border-color: var(--gold);
  box-shadow: 0 0 24px rgba(255, 184, 0, 0.15);
}
.ach-icon { font-size: 32px; margin-bottom: 10px; }
.ach-name { font-size: 12px; font-weight: 700; margin-bottom: 3px; }
.ach-desc { font-size: 10.5px; color: var(--muted); }

/* ============ LEADERBOARD ============ */
.leaderboard {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 16px;
}
.lb-header {
  color: var(--muted);
  font-size: 12.5px;
  margin-bottom: 14px;
  font-weight: 600;
}
.lb-header b { color: var(--gold); font-weight: 800; }
.lb-row {
  display: grid;
  grid-template-columns: 44px 1fr auto;
  gap: 12px;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.lb-row:last-child { border-bottom: none; }
.lb-row.me {
  background: rgba(123, 92, 255, 0.12);
  margin: 0 -16px;
  padding: 12px 16px;
  border-radius: var(--r-md);
  border-bottom: none;
}
.lb-rank { font-weight: 900; font-size: 16px; color: var(--muted); text-align: center; }
.lb-rank.top1 { color: var(--gold); }
.lb-rank.top2 { color: #c0c0c0; }
.lb-rank.top3 { color: #cd7f32; }
.lb-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb-name.me { color: var(--accent-2); }
.lb-value {
  font-weight: 800;
  color: var(--green);
  font-variant-numeric: tabular-nums;
  font-size: 13px;
}

/* ============ MULTI-VIEW ============ */
.multi-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
@media (max-width: 900px) {
  .multi-grid { grid-template-columns: 1fr; }
}

/* ============ TABS ============ */
.tab-content { display: none; }
.tab-content.active { display: block; }

/* ============ MODAL ============ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.8);
  backdrop-filter: blur(8px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 16px;
}
.modal-overlay.active { display: flex; }
.modal {
  background: var(--bg2);
  border: 1px solid var(--border-2);
  border-radius: var(--r-xl);
  padding: 24px;
  max-width: 440px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  animation: popIn .25s;
}
@keyframes popIn { from { transform: scale(.94); opacity: 0; } }
.modal h3 { font-size: 17px; margin-bottom: 6px; }
.modal-sub {
  color: var(--muted);
  font-size: 13px;
  margin-bottom: 20px;
  line-height: 1.5;
}
.modal-row {
  display: flex;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.modal-row:last-of-type { border-bottom: none; }
.modal-row .label { color: var(--muted); }
.modal-row .value { font-weight: 800; font-variant-numeric: tabular-nums; }
.modal input[type="number"] {
  width: 100%;
  background: var(--card);
  border: 1px solid var(--border);
  padding: 14px 16px;
  border-radius: var(--r-md);
  font-size: 16px;
  margin: 16px 0 12px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}
.modal input[type="number"]:focus {
  outline: none;
  border-color: var(--accent);
}
.quick-stakes {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 6px;
  margin-bottom: 16px;
}
.quick-stake {
  padding: 10px 4px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  font-size: 11.5px;
  font-weight: 700;
  text-align: center;
}
.quick-stake:hover { border-color: var(--accent); }
.modal-actions {

    if (m.minute < 40) intensity = 0.9;
    else if (m.minute < 80) intensity = 1.0;
    else intensity = 1.15;
  }
  const rateH = m.homeAttack / m.maxMinute * intensity;
  const rateA = m.awayAttack / m.maxMinute * intensity;
  return {
    lh: Math.max(0, rateH * rem * (1 + m.momentum * 0.3)),
    la: Math.max(0, rateA * rem * (1 - m.momentum * 0.3)),
  };
}

function computeOdds(m) {
  if (m.status === 'finished' || m.status === 'countdown') return { home: null, draw: null, away: null };

  if (m.sport === 'ufc') {
    const diff = m.homeRating - m.awayRating;
    let pH = 1 / (1 + Math.pow(10, -diff / 400));
    const prog = m.minute / m.maxMinute;
    pH = 0.5 + (pH - 0.5) * (1 - prog * 0.7);
    // Реалистичный "шум" — фаворит не всегда выигрывает
    pH += (Math.random() - 0.5) * 0.02;
    pH = clamp(pH, 0.15, 0.85);
    return {
      home: toOdd(pH, 0.05),
      away: toOdd(1 - pH, 0.05),
      draw: null,
    };
  }

  const { lh, la } = goalsRemaining(m);
  let pH = 0, pD = 0, pA = 0;
  for (let h = 0; h <= 12; h++) {
    for (let a = 0; a <= 12; a++) {
      const p = poisson(h, lh) * poisson(a, la);
      const fh = m.scoreHome + h;
      const fa = m.scoreAway + a;
      if (fh > fa) pH += p;
      else if (fh === fa) pD += p;
      else pA += p;
    }
  }
  const t = pH + pD + pA || 1;
  pH /= t; pD /= t; pA /= t;

  return {
    home: toOdd(pH, 0.05),
    draw: toOdd(pD, 0.05),
    away: toOdd(pA, 0.05),
  };
}

function computeExtras(m) {
  if (m.status === 'finished' || m.status === 'countdown') return {};
  const raw = {};

  if (m.sport === 'ufc') {
    const diff = m.homeRating - m.awayRating;
    let pH = 1 / (1 + Math.pow(10, -diff / 400));
    const prog = m.minute / m.maxMinute;
    pH = 0.5 + (pH - 0.5) * (1 - prog * 0.7);
    pH = clamp(pH, 0.15, 0.85);
    const pA = 1 - pH;
    const r = m.round;

    let pFin;
    if (r === 1) pFin = 0.5;
    else if (r === 2) pFin = 0.42;
    else if (r === 3) pFin = 0.3;
    else if (r === 4) pFin = 0.2;
    else pFin = 0.1;

    const pKO = pFin * 0.6;
    const pSub = pFin * 0.4;
    const pDec = 1 - pFin;

    const add = (l, p, mar = 0.06) => { const o = toOdd(p, mar); if (o) raw[l] = o; };

    add('KO/TKO', pKO);
    add('Сабмишн', pSub);
    add('Решение', pDec);
    add('Бой досрочно', pFin);
    add('Вся дистанция', pDec);

    if (r <= 1) add('Финиш в R1', pFin * 0.4, 0.08);
    if (r <= 2) add('Финиш в R2', pFin * 0.28, 0.08);
    if (r <= 3) add('Финиш в R3', pFin * 0.2, 0.08);
    if (r <= 4) add('Финиш в R4+', pFin * 0.12, 0.08);

    add(`${m.home} KO/TKO`, pH * pKO, 0.08);
    add(`${m.home} Сабмишн`, pH * pSub, 0.08);
    add(`${m.home} Решение`, pH * pDec, 0.08);
    add(`${m.away} KO/TKO`, pA * pKO, 0.08);
    add(`${m.away} Сабмишн`, pA * pSub, 0.08);
    add(`${m.away} Решение`, pA * pDec, 0.08);

    return raw;
  }

  const isF = m.sport === 'football';
  const { lh, la } = goalsRemaining(m);
  const cur = m.scoreHome + m.scoreAway;

  const MAX = 12;
  const hD = [], aD = [];
  for (let g = 0; g <= MAX; g++) { hD.push(poisson(g, lh)); aD.push(poisson(g, la)); }

  const matrix = {};
  let sum = 0;
  for (let h = 0; h <= MAX; h++) {
    for (let a = 0; a <= MAX; a++) {
      const p = hD[h] * aD[a];
      const fh = m.scoreHome + h;
      const fa = m.scoreAway + a;
      matrix[`${fh}:${fa}`] = (matrix[`${fh}:${fa}`] || 0) + p;
      sum += p;
    }
  }
  for (const k in matrix) matrix[k] /= sum;

  let pH = 0, pD = 0, pA = 0, pEven = 0, pBtts = 0;
  for (const [k, p] of Object.entries(matrix)) {
    const [h, a] = k.split(':').map(Number);
    if (h > a) pH += p; else if (h === a) pD += p; else pA += p;
    if ((h + a) % 2 === 0) pEven += p;
    if (h >= 1 && a >= 1) pBtts += p;
  }

  const pOver = (l) => { let p = 0; for (const [k, pr] of Object.entries(matrix)) { const [h, a] = k.split(':').map(Number); if (h + a > l) p += pr; } return p; };
  const pHand = (l) => { let p = 0; for (const [k, pr] of Object.entries(matrix)) { const [h, a] = k.split(':').map(Number); if (h - a > l) p += pr; } return p; };
  const pTeamOver = (side, l) => { let p = 0; for (const [k, pr] of Object.entries(matrix)) { const [h, a] = k.split(':').map(Number); const g = side === 'home' ? h : a; if (g > l) p += pr; } return p; };

  const add = (l, p, mar = 0.05) => { const o = toOdd(p, mar); if (o) raw[l] = o; };

  if (isF) { add('1X', pH + pD, 0.04); add('12', pH + pA, 0.04); add('X2', pD + pA, 0.04); }

  const lines = isF ? [0.5, 1.5, 2.5, 3.5, 4.5, 5.5] : [3.5, 4.5, 5.5, 6.5, 7.5, 8.5];
  lines.forEach(l => {
    add(`ТБ ${l}`, pOver(l), 0.05);
    add(`ТМ ${l}`, 1 - pOver(l), 0.05);
  });

  if (isF) {
    const f1m = pHand(-1.5), f2m = 1 - pHand(1.5);
    add('Ф1 −1.5', f1m, 0.05);
    add('Ф1 +1.5', 1 - f1m, 0.05);
    add('Ф2 −1.5', f2m, 0.05);
    add('Ф2 +1.5', 1 - f2m, 0.05);
  } else {
    const f1m = pHand(-1.5), f2m = 1 - pHand(1.5);
    add('Ф1 −1.5', f1m, 0.05);
    add('Ф1 +1.5', 1 - f1m, 0.05);
    add('Ф2 −1.5', f2m, 0.05);
    add('Ф2 +1.5', 1 - f2m, 0.05);
  }

  add('Обе · Да', pBtts, 0.05);
  add('Обе · Нет', 1 - pBtts, 0.05);
  add('Чёт', pEven, 0.05);
  add('Нечет', 1 - pEven, 0.05);

  const tLine = isF ? 0.5 : 1.5;
  const hO = pTeamOver('home', tLine);
  const aO = pTeamOver('away', tLine);
  add(`${m.home} Б ${tLine}`, hO, 0.05);
  add(`${m.home} М ${tLine}`, 1 - hO, 0.05);
  add(`${m.away} Б ${tLine}`, aO, 0.05);
  add(`${m.away} М ${tLine}`, 1 - aO, 0.05);

  if (isF && m.minute < 150) {
    for (const [k, p] of Object.entries(matrix)) {
      const [h, a] = k.split(':').map(Number);
      if (h > 4 || a > 4) continue;
      if (h === m.scoreHome && a === m.scoreAway) continue;
      if (h < m.scoreHome || a < m.scoreAway) continue;
      add(`Счёт ${k}`, p, 0.08);
    }
  }

  return raw;
}

/* ============ СОЗДАНИЕ МАТЧЕЙ ============ */
function newFootball() {
  const leagues = [...new Set(FOOTBALL.map(t => t.league))];
  const lg = pick(leagues);
  const teams = FOOTBALL.filter(t => t.league === lg);
  const [h, a] = pickTwo(teams);
  return {
    id: nextId++, sport: 'football', league: lg,
    home: h.name, away: a.name,
    homeAttack: h.attack, awayAttack: a.attack,
    scoreHome: 0, scoreAway: 0,
    minute: 0, maxMinute: 180, // 3 минуты
    period: '1H',
    status: 'live',
    momentum: 0,
    justScored: null,
  };
}

function newHockey() {
  const leagues = [...new Set(HOCKEY.map(t => t.league))];
  const lg = pick(leagues);
  const teams = HOCKEY.filter(t => t.league === lg);
  const [h, a] = pickTwo(teams);
  return {
    id: nextId++, sport: 'hockey', league: lg,
    home: h.name, away: a.name,
    homeAttack: h.attack, awayAttack: a.attack,
    scoreHome: 0, scoreAway: 0,
    minute: 0, maxMinute: 120, // 3 периода × 40 сек
    period: 'P1',
    status: 'live',
    momentum: 0,
    justScored: null,
  };
}

function newUFC() {
  const divs = [...new Set(UFC.map(f => f.division))];
  const div = pick(divs);
  const fighters = UFC.filter(f => f.division === div);
  const [h, a] = pickTwo(fighters);
  return {
    id: nextId++, sport: 'ufc', league: `UFC · ${div}`,
    home: h.name, away: a.name,
    homeRating: h.rating, awayRating: a.rating,
    scoreHome: 0, scoreAway: 0,
    minute: 0, maxMinute: 125, // 5 раундов × 25 сек
    round: 1,
    status: 'live',
    momentum: 0,
    finalResult: null,
    justScored: null,
  };
}

function createInitialBatch() {
  const list = [];
  // 5 футбольных
  for (let i = 0; i < 5; i++) list.push(newFootball());
  // 3 хоккейных
  for (let i = 0; i < 3; i++) list.push(newHockey());
  // 3 UFC
  for (let i = 0; i < 3; i++) list.push(newUFC());
  // Перемешиваем
  for (let i = list.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [list[i], list[j]] = [list[j], list[i]];
  }
  return list;
}

/* ============ СИМУЛЯЦИЯ ============ */
function tickMatch(m) {
  if (m.status === 'countdown') {
    m.countdownLeft -= 1;
    if (m.countdownLeft <= 0) {
      const nm = m.sport === 'football' ? newFootball() : m.sport === 'hockey' ? newHockey() : newUFC();
      nm.id = m.id;
      Object.assign(m, nm);
    }
    return;
  }

  if (m.status !== 'live') return;

  m.minute += 1;
  m.momentum *= 0.94;
  m.justScored = null;

  // UFC
  if (m.sport === 'ufc') {
    const cycle = 25;
    const tk = m.minute % cycle;
    m.round = Math.min(5, Math.floor(m.minute / cycle) + 1);

    const adv = (m.homeRating - m.awayRating) / 400;
    if (Math.random() < 0.5 + adv * 0.3) m.momentum = Math.min(1, m.momentum + 0.2);
    else m.momentum = Math.max(-1, m.momentum - 0.2);

    // Досрочный финиш ~4% на тик (≈40% боёв заканчиваются досрочно)
    if (Math.random() < 0.04) {
      const w = Math.random() < (0.5 + adv * 0.5) ? 'home' : 'away';
      const method = Math.random() < 0.6 ? 'KO/TKO' : 'Сабмишн';
      if (w === 'home') { m.scoreHome = 1; m.scoreAway = 0; m.justScored = 'home'; }
      else { m.scoreHome = 0; m.scoreAway = 1; m.justScored = 'away'; }
      m.finalResult = { winner: w, method, round: m.round };
      m.status = 'finished';
      m.finishedAt = Date.now();
      return;
    }

    // Конец боя — решение
    if (m.minute >= 125) {
      const w = m.momentum > 0 ? 'home' : 'away';
      if (w === 'home') { m.scoreHome = 1; m.scoreAway = 0; }
      else { m.scoreHome = 0; m.scoreAway = 1; }
      m.finalResult = { winner: w, method: 'Решение', round: 5 };
      m.status = 'finished';
      m.finishedAt = Date.now();
      return;
    }
    return;
  }

  // Футбол
  if (m.sport === 'football') {
    if (m.minute >= 180) { m.status = 'finished'; m.finishedAt = Date.now(); return; }

    const { lh, la } = goalsRemaining(m);
    const rem = Math.max(1, m.maxMinute - m.minute);
    // Более реалистичный — фаворит не всегда забивает
    if (Math.random() < lh / rem * 1.2) {
      m.scoreHome += 1;
      m.momentum = Math.min(1, m.momentum + 0.4);
      m.justScored = 'home';
    } else if (Math.random() < la / rem * 1.2) {
      m.scoreAway += 1;
      m.momentum = Math.max(-1, m.momentum - 0.4);
      m.justScored = 'away';
    }
    return;
  }

  // Хоккей
  if (m.sport === 'hockey') {
    if (m.minute >= 120) { m.status = 'finished'; m.finishedAt = Date.now(); return; }

    const { lh, la } = goalsRemaining(m);
    const rem = Math.max(1, m.maxMinute - m.minute);
    if (Math.random() < lh / rem * 1.3) {
      m.scoreHome += 1;
      m.momentum = Math.min(1, m.momentum + 0.4);
      m.justScored = 'home';
    } else if (Math.random() < la / rem * 1.3) {
      m.scoreAway += 1;
      m.momentum = Math.max(-1, m.momentum - 0.4);
      m.justScored = 'away';
    }
    return;
  }
}

/* ============ РЕНДЕР ============ */
function renderBalance() {
  $('balance').textContent = fmt(wallet.balance);
  renderSession();
}

function renderSession() {
  const prof = wallet.balance - wallet.sessionStart;
  const won = wallet.bets.filter(b => b.status === 'won').length;
  const lost = wallet.bets.filter(b => b.status === 'lost').length;
  const t = won + lost;
  const wr = t ? ((won / t) * 100).toFixed(0) + '%' : '—';

  const p = $('sessionProfit');
  p.textContent = (prof >= 0 ? '+' : '') + fmt(prof) + ' ₽';
  p.className = 'value ' + (prof >= 0 ? 'green' : 'red');
  $('sessionBets').textContent = wallet.bets.length;
  $('sessionWinrate').textContent = wr;
}

function flashBalance(type) {
  const b = $('balanceBox');
  b.classList.remove('flash-bonus', 'flash-win', 'flash-lose');
  void b.offsetWidth;
  b.classList.add(`flash-${type}`);
  setTimeout(() => b.classList.remove(`flash-${type}`), 900);
}

function renderProgress(m) {
  if (m.status === 'countdown') return '';
  if (m.sport === 'football') {
    // 1 тайм: 0-90 сек, 2 тайм: 90-180
    const h1 = Math.min(1, m.minute / 90);
    const h2 = Math.max(0, Math.min(1, (m.minute - 90) / 90));
    return `<div class="progress">
      <div class="progress-seg ${h1 >= 1 ? 'done' : 'active'}" style="--p:${h1 * 100}%"></div>
      <div class="progress-seg ${h2 >= 1 ? 'done' : 'active'}" style="--p:${h2 * 100}%"></div>
    </div>`;
  }
  if (m.sport === 'hockey') {
    // 3 периода по 40 сек
    const p1 = Math.min(1, m.minute / 40);
    const p2 = Math.max(0, Math.min(1, (m.minute - 40) / 40));
    const p3 = Math.max(0, Math.min(1, (m.minute - 80) / 40));
    return `<div class="progress">
      <div class="progress-seg ${p1 >= 1 ? 'done' : 'active'}" style="--p:${p1 * 100}%"></div>
      <div class="progress-seg ${p2 >= 1 ? 'done' : 'active'}" style="--p:${p2 * 100}%"></div>
      <div class="progress-seg ${p3 >= 1 ? 'done' : 'active'}" style="--p:${p3 * 100}%"></div>
    </div>`;
  }
  if (m.sport === 'ufc') {
    const segs = [];
    for (let i = 1; i <= 5; i++) {
      const done = m.round > i || (m.status === 'finished' && m.round >= i);
      const active = m.round === i && m.status === 'live';
      let p = 0;
      if (active) p = ((m.minute % 25) / 25) * 100;
      if (done) p = 100;
      segs.push(`<div class="progress-seg ${done ? 'done' : active ? 'active' : ''}" style="--p:${Math.min(100, p)}%"></div>`);
    }
    return `<div class="progress">${segs.join('')}</div>`;
  }
  return '';
}

function renderMatches() {
  let list = [...matches];

  if (currentSport !== 'all') list = list.filter(m => m.sport === currentSport);

  // Сортировка: live → countdown → finished
  list.sort((a, b) => {
    const ord = { live: 0, countdown: 1, finished: 2 };
    if (ord[a.status] !== ord[b.status]) return ord[a.status] - ord[b.status];
    if (a.sport !== b.sport) {
      // UFC первым, потом футбол, потом хоккей
      const sportOrder = { ufc: 0, football: 1, hockey: 2 };
      return (sportOrder[a.sport] || 9) - (sportOrder[b.sport] || 9);
    }
    return a.minute - b.minute;
  });

  const el = $('matches');
  if (!list.length) {
    el.innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="empty-icon">🎯</div><div class="empty-text">Матчей нет</div></div>`;
    return;
  }

  el.innerHTML = list.map(m => renderMatchCard(m)).join('');
}

function renderMatchCard(m) {
  const odds = computeOdds(m);
  const isFin = m.status === 'finished';
  const isCd = m.status === 'countdown';
  const extras = (!isFin && !isCd) ? computeExtras(m) : {};
  const keys = Object.keys(extras);
  const isOpen = openExtras.has(m.id);

  const extrasH = keys.length ? `
    <div class="extras">
      <button class="extras-toggle" data-extras="${m.id}">
        ${isOpen ? '▲ Скрыть' : `▼ Ещё ${keys.length} рынков`}
      </button>
      <div class="extras-grid ${isOpen ? 'open' : ''}">
        ${keys.map(l => {
          const o = extras[l];
          return `<button class="odd-mini" data-mid="${m.id}" data-mk="${encodeURIComponent(l)}" data-odd="${o}">
            <span class="odd-mini-label">${l}</span>
            <span class="odd-mini-value">${o.toFixed(2)}</span>
          </button>`;
        }).join('')}
      </div>
    </div>
  ` : '';

  // Статус
  let statusBadge;
  if (isFin) statusBadge = '<span class="match-status finished">Финиш</span>';
  else if (isCd) statusBadge = '<span class="match-status countdown">⏱ Далее</span>';
  else statusBadge = '<span class="match-status live">LIVE</span>';

  // Доп. инфо
  let infoText = '';
  if (isCd) {
    infoText = `<span class="time" style="color:var(--accent-2);font-weight:800">⏱ ${fmtTime(m.countdownLeft)}</span>`;
  } else if (isFin) {
    infoText = `<span class="period-name">Завершён</span>`;
  } else if (m.sport === 'football') {
    const period = m.minute < 90 ? '1-й тайм' : '2-й тайм';
    infoText = `<span class="period-name">${period}</span> · <span class="time">${m.minute}'</span>`;
  } else if (m.sport === 'hockey') {
    const p = m.minute < 40 ? '1-й' : m.minute < 80 ? '2-й' : '3-й';
    infoText = `<span class="period-name">${p} период</span> · <span class="time">${m.minute}'</span>`;
  } else if (m.sport === 'ufc') {
    infoText = `<span class="period-name">Раунд ${m.round}/5</span> · <span class="time">${m.minute}'</span>`;
  }

  // UFC финальный блок
  let ufcResult = '';
  if (m.sport === 'ufc' && isFin && m.finalResult) {
    const w = m.finalResult.winner === 'home' ? m.home : m.away;
    ufcResult = `<div class="ufc-result">🏆 Победа: <span class="win">${w}</span> · ${m.finalResult.method} · Раунд ${m.finalResult.round}</div>`;
  }

  // Отображение счёта
  let scoreH, scoreA;
  if (isCd) {
    scoreH = '—'; scoreA = '—';
  } else if (m.sport === 'ufc' && !isFin) {
    scoreH = '—'; scoreA = '—';
  } else {
    scoreH = m.scoreHome; scoreA = m.scoreAway;
  }

  const homeLogo = `<div class="team-logo" style="background:${teamColor(m.home)}">${teamInit(m.home)}</div>`;
  const awayLogo = `<div class="team-logo" style="background:${teamColor(m.away)}">${teamInit(m.away)}</div>`;

  // Кэфы — если UFC, то 2 колонки, иначе 3
  const isUFC = m.sport === 'ufc';
  const twoCols = isUFC || (odds.draw === null);
  const oddsRowClass = twoCols ? 'odds-row two-col' : 'odds-row';

  return `
    <div class="match ${isFin ? 'finished' : ''}">
      <div class="match-head">
        <span class="match-sport">${sIcon(m.sport)}</span>
        <span class="match-league">${m.league}</span>
        ${statusBadge}
      </div>

      <div class="teams">
        <div class="team-line">
          <div class="team-info">
            ${homeLogo}
            <span class="team-name">${m.home}</span>
          </div>
          <span class="team-score">${scoreH}</span>
        </div>
        <div class="team-line">
          <div class="team-info">
            ${awayLogo}
            <span class="team-name">${m.away}</span>
          </div>
          <span class="team-score">${scoreA}</span>
        </div>
      </div>

      ${!isCd ? `<div class="match-info">${infoText}</div>` : `<div class="match-info">${infoText}</div>`}
      ${!isCd ? renderProgress(m) : ''}
      ${ufcResult}

      <div class="${oddsRowClass}">
        ${renderOddBtn(m, 'home', isUFC ? 'П1' : '1', odds.home, isFin || isCd)}
        ${!isUFC && odds.draw !== null ? renderOddBtn(m, 'draw', 'X', odds.draw, isFin || isCd) : ''}
        ${renderOddBtn(m, 'away', isUFC ? 'П2' : '2', odds.away, isFin || isCd)}
      </div>

      ${extrasH}
    </div>
  `;
}

function renderOddBtn(m, pk, l, v, dis) {
  if (!isOddValid(v)) {
    return `<div class="odd-btn disabled">
      <span class="odd-label">${l}</span>
      <span class="odd-value" style="color:var(--muted)">—</span>
    </div>`;
  }
  const key = `${m.id}-${pk}`;
  const prev = previousOdds[key];
  let cls = '';
  if (prev !== undefined && prev !== v) {
    cls = v > prev ? 'up' : 'down';
  }
  previousOdds[key] = v;

  return `<button class="odd-btn ${cls}" data-match-id="${m.id}" data-pick="${pk}" data-odd="${v}" ${dis ? 'disabled' : ''}>
    <span class="odd-label">${l}</span>
    <span class="odd-value">${v.toFixed(2)}</span>
  </button>`;
}

function drawChart() {
  const c = $('profitChart');
  if (!c) return;
  const ctx = c.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const r = c.getBoundingClientRect();
  c.width = r.width * dpr; c.height = r.height * dpr;
  ctx.scale(dpr, dpr);
  const w = r.width, h = r.height;
  ctx.clearRect(0, 0, w, h);

  const hist = wallet.profitHistory;
  if (!hist || hist.length < 2) {
    ctx.fillStyle = '#6e6e88';
    ctx.font = '13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Играй — график появится', w / 2, h / 2);
    return;
  }

  const min = Math.min(...hist.map(p => p.v), 0);
  const max = Math.max(...hist.map(p => p.v), 0);
  const range = max - min || 1;

  ctx.strokeStyle = 'rgba(110, 110, 140, .1)';
  for (let i = 0; i <= 4; i++) {
    const y = (h / 4) * i;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  }

  const step = w / (hist.length - 1);
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, 'rgba(123,92,255,.35)');
  grad.addColorStop(1, 'rgba(123,92,255,0)');

  ctx.beginPath();
  hist.forEach((p, i) => {
    const x = i * step;
    const y = h - ((p.v - min) / range) * h * 0.85 - h * 0.075;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.strokeStyle = '#7b5cff';
  ctx.lineWidth = 2.5;
  ctx.stroke();
  ctx.lineTo(w, h);
  ctx.lineTo(0, h);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();
}

function openBetModal(mid, pk, odd) {
  if (!isOddValid(odd)) return;
  const m = matches.find(x => x.id === mid);
  if (!m || m.status === 'finished' || m.status === 'countdown') return;

  activeBet = { matchId: mid, pick: pk, odd, isBuilder: false, isExpress: false };

  const lbl = pk === 'home' ? m.home : pk === 'away' ? m.away : pk === 'draw' ? 'Ничья' : pk;
  const pickLabel = pk === 'home' ? 'П1' : pk === 'away' ? 'П2' : pk === 'draw' ? 'X' : pk;

  $('betModalTitle').textContent = `${m.home} — ${m.away}`;
  $('betModalSub').textContent = `${pickLabel} · ${lbl} · ${m.scoreHome}:${m.scoreAway}`;
  $('betModalOdd').textContent = odd.toFixed(2);
  $('betModalStake').value = '';
  $('betModalPotential').textContent = '—';
  $('betModalCoupon').style.display = 'block';
  $('betModalBuilder').style.display = (m.sport === 'football' || m.sport === 'hockey') ? 'block' : 'none';
  $('betModal').classList.add('active');
  updatePotential();
}

function closeBetModal() {
  $('betModal').classList.remove('active');
  activeBet = null;
}

function updatePotential() {
  if (!activeBet) return;
  const s = parseFloat($('betModalStake').value) || 0;
  $('betModalPotential').textContent = s > 0 ? `${fmt(s * activeBet.odd)} ₽` : '—';
}

function placeBet() {
  if (!activeBet) return;
  const stake = parseFloat($('betModalStake').value);
  if (!stake || stake < 10 || stake > wallet.balance) return;

  if (activeBet.isExpress) {
    const sel = activeBet.selections.map(s => ({ matchId: s.matchId, pick: s.pick, odd: s.odd, label: s.label, match: s.match, status: 'pending' }));
    wallet.balance -= stake;
    wallet.totalBet += stake;
    wallet.bets.unshift({
      id: Date.now(), type: 'express', match: `Экспресс · ${sel.length}`, selections: sel,
      odd: activeBet.odd, stake, potential: Math.round(stake * activeBet.odd * 100) / 100,
      status: 'pending', createdAt: new Date().toISOString(),
    });
    coupon = [];
    saveCoupon();
    renderCoupon();
  } else if (activeBet.isBuilder) {
    const m = matches.find(x => x.id === activeBet.matchId);
    if (!m) return;
    const sel = activeBet.selections.map(s => ({ matchId: m.id, pick: s.pick, odd: s.odd, label: s.label, match: `${m.home} — ${m.away}`, status: 'pending' }));
    wallet.balance -= stake;
    wallet.totalBet += stake;
    wallet.bets.unshift({
      id: Date.now(), type: 'builder', matchId: m.id, match: `${m.home} — ${m.away} (билдер)`,
      sport: m.sport, selections: sel, odd: activeBet.odd, stake,
      potential: Math.round(stake * activeBet.odd * 100) / 100,
      status: 'pending', createdAt: new Date().toISOString(),
    });
    delete builderBets[activeBet.matchId];
  } else {
    const m = matches.find(x => x.id === activeBet.matchId);
    if (!m || m.status === 'finished') return;
    wallet.balance -= stake;
    wallet.totalBet += stake;
    wallet.bets.unshift({
      id: Date.now(), type: 'single', matchId: m.id, match: `${m.home} — ${m.away}`,
      sport: m.sport, pick: activeBet.pick, odd: activeBet.odd, stake,
      potential: Math.round(stake * activeBet.odd * 100) / 100,
      status: 'pending', minute: m.minute, score: `${m.scoreHome}:${m.scoreAway}`,
      createdAt: new Date().toISOString(),
    });
  }

  saveWallet();
  flashBalance('win');
  renderBalance();
  renderHistory();
  renderStats();
  renderAchiv();
  sBet();
  vibe(20);
  closeBetModal();
}

function addBuilder() {
  if (!activeBet) return;
  const { matchId, pick, odd } = activeBet;
  if (!builderBets[matchId]) builderBets[matchId] = [];

  for (const b of builderBets[matchId]) {
    if (b.pick === pick) return;
    const t1 = b.pick.match(/^(ТБ|ТМ)\s+([\d.]+)$/);
    const t2 = pick.match(/^(ТБ|ТМ)\s+([\d.]+)$/);
    if (t1 && t2 && t1[2] === t2[2] && t1[1] !== t2[1]) { alert('Конфликт ТБ/ТМ'); return; }
  }

  builderBets[matchId].push({ pick, odd, label: pick === 'home' ? 'П1' : pick === 'away' ? 'П2' : pick === 'draw' ? 'X' : pick });
  const total = builderBets[matchId].reduce((a, c) => a * c.odd, 1);
  const m = matches.find(x => x.id === matchId);

  closeBetModal();
  activeBet = { matchId, isBuilder: true, odd: total, selections: [...builderBets[matchId]] };
  $('betModalTitle').textContent = `🧩 Билдер · ${m.home} — ${m.away}`;
  $('betModalSub').textContent = builderBets[matchId].map(b => `${b.label} @ ${b.odd.toFixed(2)}`).join(' + ');
  $('betModalOdd').textContent = total.toFixed(2);
  $('betModalStake').value = '';
  $('betModalPotential').textContent = '—';
  $('betModalCoupon').style.display = 'none';
  $('betModalBuilder').style.display = 'none';
  $('betModal').classList.add('active');
  updatePotential();
}

/* ============ КЭШАУТ ============ */
function cashoutValue(b, m) {
  if (!m || m.status !== 'live' || b.status !== 'pending') return 0;

  if (b.type === 'express') {
    let cv = 1;
    for (const sel of b.selections) {
      const sm = matches.find(x => Number(x.id) === Number(sel.matchId));
      if (!sm) return 0;
      if (sm.status === 'finished') { if (sel.status === 'lost') return 0; continue; }
      if (sm.status === 'live') {
        const odds = computeOdds(sm);
        const cur = odds[sel.pick];
        if (!isOddValid(cur)) return 0;
        cv *= 1 / cur;
      } else return 0;
    }
    const fair = b.potential * cv;
    const pay = Math.max(b.stake * 0.1, Math.round(fair * 0.9 * 100) / 100);
    return Math.min(pay, b.potential * 0.98);
  }

  if (b.type === 'builder') {
    const sm = matches.find(x => Number(x.id) === Number(b.matchId));
    if (!sm || sm.status !== 'live') return 0;
    return Math.round(b.stake * 0.5 * 100) / 100;
  }

  const cur = computeOdds(m);
  if (!b.pick || !isOddValid(cur[b.pick])) return Math.round(b.stake * 0.5 * 100) / 100;
  const fair = b.potential / cur[b.pick];
  const pay = Math.max(b.stake * 0.1, Math.round(fair * 0.92 * 100) / 100);
  return Math.min(pay, b.potential);
}

function doCashout(id) {
  const b = wallet.bets.find(x => x.id === id);
  if (!b || b.status !== 'pending') return;
  let co = 0;
  if (b.type === 'express' || b.type === 'builder') {
    for (const sel of b.selections) {
      const sm = matches.find(x => Number(x.id) === Number(sel.matchId));
      if (sm && sm.status === 'live') { co = cashoutValue(b, sm); break; }
    }
  } else {
    const m = matches.find(x => x.id === b.matchId);
    if (m) co = cashoutValue(b, m);
  }
  if (co <= 0) return;
  b.status = 'won';
  b.payout = co;
  b.cashout = true;
  wallet.balance += co;
  wallet.totalWon += co;
  saveWallet();
  flashBalance('win');
  renderBalance();
  renderHistory();
  renderStats();
  renderAchiv();
  sBet();
}

/* ============ РАСЧЁТ СТАВОК ============ */
function checkSel(m, pick) {
  if (!m || m.status !== 'finished') return 'pending';
  const tot = m.scoreHome + m.scoreAway;

  if (m.sport === 'ufc') {
    if (!m.finalResult) {
      const w = m.scoreHome > m.scoreAway ? 'home' : m.scoreAway > m.scoreHome ? 'away' : 'home';
      m.finalResult = { winner: w, method: 'Решение', round: 5 };
    }
    const fr = m.finalResult;
    const isH = fr.winner === 'home', isA = fr.winner === 'away';
    const md = fr.method, rr = fr.round, fin = md !== 'Решение';

    if (pick === 'home') return isH ? 'won' : 'lost';
    if (pick === 'away') return isA ? 'won' : 'lost';
    if (pick === 'KO/TKO') return md === 'KO/TKO' ? 'won' : 'lost';
    if (pick === 'Сабмишн') return md === 'Сабмишн' ? 'won' : 'lost';
    if (pick === 'Решение') return md === 'Решение' ? 'won' : 'lost';
    if (pick === 'Бой досрочно') return fin ? 'won' : 'lost';
    if (pick === 'Вся дистанция') return !fin ? 'won' : 'lost';
    const uR = pick.match(/^Тотал (Б|М) (\d+)\.5 раундов$/);
    if (uR) { const l = +uR[2]; return uR[1] === 'Б' ? (rr > l ? 'won' : 'lost') : (rr < l ? 'won' : 'lost'); }
    const fR = pick.match(/^Финиш в R(\d+)\+?$/);
    if (fR) { const t = +fR[1]; if (pick.includes('+')) return (fin && rr >= t) ? 'won' : 'lost'; return (fin && rr === t) ? 'won' : 'lost'; }
    if (pick === `${m.home} KO/TKO`) return (isH && md === 'KO/TKO') ? 'won' : 'lost';
    if (pick === `${m.home} Сабмишн`) return (isH && md === 'Сабмишн') ? 'won' : 'lost';
    if (pick === `${m.home} Решение`) return (isH && md === 'Решение') ? 'won' : 'lost';
    if (pick === `${m.away} KO/TKO`) return (isA && md === 'KO/TKO') ? 'won' : 'lost';
    if (pick === `${m.away} Сабмишн`) return (isA && md === 'Сабмишн') ? 'won' : 'lost';
    if (pick === `${m.away} Решение`) return (isA && md === 'Решение') ? 'won' : 'lost';
    return 'lost';
  }

  if (pick === 'home') return m.scoreHome > m.scoreAway ? 'won' : 'lost';
  if (pick === 'away') return m.scoreAway > m.scoreHome ? 'won' : 'lost';
  if (pick === 'draw') return m.scoreHome === m.scoreAway ? 'won' : 'lost';
  if (pick === '1X') return m.scoreHome >= m.scoreAway ? 'won' : 'lost';
  if (pick === '12') return m.scoreHome !== m.scoreAway ? 'won' : 'lost';
  if (pick === 'X2') return m.scoreHome <= m.scoreAway ? 'won' : 'lost';

  const tO = pick.match(/^ТБ\s*([\d.]+)$/);
  const tU = pick.match(/^ТМ\s*([\d.]+)$/);
  if (tO) return tot > parseFloat(tO[1]) ? 'won' : 'lost';
  if (tU) return tot < parseFloat(tU[1]) ? 'won' : 'lost';

  const f1 = pick.match(/^Ф1\s*([−\-+]?[\d.]+)$/);
  const f2 = pick.match(/^Ф2\s*([−\-+]?[\d.]+)$/);
  if (f1) return (m.scoreHome - m.scoreAway) > parseFloat(f1[1].replace('−', '-')) ? 'won' : 'lost';
  if (f2) return (m.scoreAway - m.scoreHome) > parseFloat(f2[1].replace('−', '-')) ? 'won' : 'lost';

  if (pick === 'Обе · Да') return (m.scoreHome >= 1 && m.scoreAway >= 1) ? 'won' : 'lost';
  if (pick === 'Обе · Нет') return !(m.scoreHome >= 1 && m.scoreAway >= 1) ? 'won' : 'lost';
  if (pick === 'Чёт') return tot % 2 === 0 ? 'won' : 'lost';
  if (pick === 'Нечет') return tot % 2 !== 0 ? 'won' : 'lost';

  const hT = pick.match(new RegExp(`^${m.home.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\s+(Б|М)\\s+([\\d.]+)$`));
  const aT = pick.match(new RegExp(`^${m.away.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\s+(Б|М)\\s+([\\d.]+)$`));
  if (hT) { const l = parseFloat(hT[2]); return hT[1] === 'Б' ? (m.scoreHome > l ? 'won' : 'lost') : (m.scoreHome < l ? 'won' : 'lost'); }
  if (aT) { const l = parseFloat(aT[2]); return aT[1] === 'Б' ? (m.scoreAway > l ? 'won' : 'lost') : (m.scoreAway < l ? 'won' : 'lost'); }

  const cs = pick.match(/^Счёт\s+(\d+):(\d+)$/);
  if (cs) return (m.scoreHome === +cs[1] && m.scoreAway === +cs[2]) ? 'won' : 'lost';

  return 'lost';
}

function settleBets() {
  let changed = false;
  wallet.bets.forEach(b => {
    if (b.status !== 'pending') return;

    if (b.type === 'express' || b.type === 'builder') {
      let anyL = false, allW = true, allD = true;
      for (const sel of b.selections) {
        if (sel.status === 'lost') { anyL = true; continue; }
        if (sel.status === 'won') continue;
        const m = matches.find(x => Number(x.id) === Number(sel.matchId));
        if (!m || m.status !== 'finished') { allD = false; allW = false; continue; }
        const r = checkSel(m, sel.pick);
        sel.status = r;
        if (r === 'lost') { anyL = true; allW = false; }
      }
      if (anyL) {
        b.status = 'lost'; sLose(); flashBalance('lose'); changed = true;
        wallet.profitHistory.push({ t: Date.now(), v: wallet.totalWon - wallet.totalBet });
        return;
      }
      if (allD && allW && b.selections.every(s => s.status === 'won')) {
        b.status = 'won';
        b.payout = Math.round(b.stake * b.odd * 100) / 100;
        wallet.balance += b.payout;
        wallet.totalWon += b.payout;
        sWin(); vibe(50); flashBalance('win'); changed = true;
        wallet.profitHistory.push({ t: Date.now(), v: wallet.totalWon - wallet.totalBet });
        if (wallet.profitHistory.length > 100) wallet.profitHistory.shift();
      }
      return;
    }

    const m = matches.find(x => Number(x.id) === Number(b.matchId));
    if (!m || m.status !== 'finished') return;
    const r = checkSel(m, b.pick);
    if (r === 'won') {
      b.status = 'won';
      b.payout = Math.round(b.stake * b.odd * 100) / 100;
      wallet.balance += b.payout;
      wallet.totalWon += b.payout;
      sWin(); vibe(50); flashBalance('win');
    } else {
      b.status = 'lost'; sLose(); flashBalance('lose');
    }
    changed = true;
    wallet.profitHistory.push({ t: Date.now(), v: wallet.totalWon - wallet.totalBet });
    if (wallet.profitHistory.length > 100) wallet.profitHistory.shift();
  });
  if (changed) {
    saveWallet();
    renderBalance();
    renderHistory();
    renderStats();
    renderAchiv();
  }
}

/* ============ CSV ============ */
function exportCSV() {
  const rows = [['Дата', 'Матч', 'Тип', 'Исход', 'Кэф', 'Ставка', 'Потенциал', 'Статус', 'Выплата']];
  wallet.bets.forEach(b => {
    rows.push([new Date(b.createdAt).toLocaleString('ru-RU'), b.match, b.type || 'single', b.pick || '', b.odd, b.stake, b.potential, b.status, b.payout || 0]);
  });
  const csv = rows.map(r => r.map(v => `"${v}"`).join(',')).join('\n');
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `openbet_${Date.now()}.csv`;
  a.click();
}

/* ============ ГЛАВНЫЙ ЦИКЛ ============ */
function tick() {
  resetDaily();

  matches.forEach(m => {
    if (m.status === 'live' || m.status === 'countdown') tickMatch(m);
  });

  // Завершённые → countdown через 5 сек
  matches.forEach(m => {
    if (m.status === 'finished' && !m.countdownStarted) {
      m.finishedAt = m.finishedAt || Date.now();
      if (Date.now() - m.finishedAt > 5000) {
        m.countdownStarted = true;
        m.status = 'countdown';
        m.countdownLeft = 60;
      }
    }
  });

  settleBets();

  // Автопополнение по спортам
  const counts = { football: 0, hockey: 0, ufc: 0 };
  matches.forEach(m => {
    if ((m.status === 'live' || m.status === 'countdown') && counts[m.sport] !== undefined) counts[m.sport]++;
  });

  if (counts.football < 3) {
    const need = 5 - counts.football;
    for (let i = 0; i < need; i++) matches.push(newFootball());
  }
  if (counts.hockey < 2) {
    const need = 3 - counts.hockey;
    for (let i = 0; i < need; i++) matches.push(newHockey());
  }
  if (counts.ufc < 2) {
    const need = 3 - counts.ufc;
    for (let i = 0; i < need; i++) matches.push(newUFC());
  }

  // Обрезка завершённых
  if (matches.length > 20) {
    const seen = new Set();
    matches = matches.filter(m => {
      const key = `${m.home}|${m.away}|${m.sport}`;
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });
    if (matches.length > 20) matches = matches.slice(0, 20);
  }

  renderMatches();
  if (currentTab === 'stats') renderStats();
  if (currentTab === 'history') renderHistory();
  if (currentTab === 'top') renderTop();
  if (currentTab === 'achiv') renderAchiv();
}

/* ============ ДЕЛЕГИРОВАНИЕ ============ */
document.addEventListener('click', (e) => {
  // Кэф 1X2
  const mainBtn = e.target.closest('.odd-btn[data-match-id]');
  if (mainBtn && !mainBtn.disabled && !mainBtn.classList.contains('disabled')) {
    const mid = parseInt(mainBtn.dataset.matchId);
    const pk = mainBtn.dataset.pick;
    const odd = parseFloat(mainBtn.dataset.odd);
    if (!isNaN(mid) && pk && isOddValid(odd)) { openBetModal(mid, pk, odd); return; }
  }

  // Расширенный рынок
  const miniBtn = e.target.closest('.odd-mini[data-mid]');
  if (miniBtn && !miniBtn.disabled && !miniBtn.classList.contains('disabled')) {
    const mid = parseInt(miniBtn.dataset.mid);
    const pk = decodeURIComponent(miniBtn.dataset.mk);
    const odd = parseFloat(miniBtn.dataset.odd);
    if (!isNaN(mid) && pk && isOddValid(odd)) { openBetModal(mid, pk, odd); return; }
  }

  // Toggle extras
  const exBtn = e.target.closest('[data-extras]');
  if (exBtn) {
    const id = parseInt(exBtn.dataset.extras);
    if (openExtras.has(id)) openExtras.delete(id);
    else openExtras.add(id);
    renderMatches();
    return;
  }

  // Кэшаут
  const coBtn = e.target.closest('[data-cashout]');
  if (coBtn) {
    e.stopPropagation();
    doCashout(parseInt(coBtn.dataset.cashout));
    return;
  }

  // History item
  const hItem = e.target.closest('[data-history]');
  if (hItem && !e.target.closest('[data-cashout]')) {
    const bid = parseInt(hItem.dataset.history);
    const bet = wallet.bets.find(x => x.id === bid);
    if (bet && bet.matchId) {
      const m = matches.find(x => x.id === bet.matchId);
      if (!m) alert('Матч не найден');
      else if (m.status === 'finished') alert(`Завершён: ${m.home} ${m.scoreHome}:${m.scoreAway} ${m.away}`);
      else if (m.status === 'countdown') alert(`Новый через ${fmtTime(m.countdownLeft)}`);
      else alert(`${m.home} ${m.scoreHome}:${m.scoreAway} ${m.away}\n${m.minute}' · live`);
    }
    return;
  }

  // Баланс
  if (e.target.closest('#balanceBox')) { claimBonus(); return; }
});
