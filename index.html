<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0f1e35">
<title>SportLive — Лайв-линия</title>
<style>
/* ============ ПЕРЕМЕННЫЕ ============ */
:root{
  --bg:#0f1e35;
  --bg2:#0b172a;
  --bg3:#081120;
  --card:#1a2c45;
  --card2:#22395c;
  --card3:#2c4668;
  --bd:#2a3f5e;
  --bd2:#3d5675;
  --t:#f0f4f9;
  --t2:#a9b8ce;
  --t3:#6e7e96;
  --yellow:#ffd94a;
  --yellow2:#ffe680;
  --green:#4caf50;
  --green2:#66d96a;
  --red:#e8453c;
  --red2:#f56860;
  --live:#ff3b30;
  --blue:#4a90e2;
  --odd-bg:#2a3f5e;
  --odd-bg-hover:#3d5675;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro","Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);color:var(--t);
  min-height:100vh;font-size:14px;line-height:1.4;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;padding-bottom:80px;
}
body.lock{overflow:hidden;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:5px;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit;}
input,select{font-family:inherit;}
img,svg{display:block;max-width:100%;}

/* ============ АНИМАЦИИ ============ */
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.35;}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes slideUp{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
@keyframes slideDown{from{transform:translateY(-10px);opacity:0;}to{transform:translateY(0);opacity:1;}}
@keyframes evIn{from{opacity:0;transform:translateX(-8px);}to{opacity:1;transform:translateX(0);}}
@keyframes cardIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
@keyframes flashUp{0%,40%{color:var(--green2);}100%{color:var(--t);}}
@keyframes flashDn{0%,40%{color:var(--red2);}100%{color:var(--t);}}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.5;}}
@keyframes ripple{to{transform:scale(4);opacity:0;}}

.ripple{
  position:absolute;border-radius:50%;
  background:rgba(255,255,255,.4);
  transform:scale(0);pointer-events:none;
  animation:ripple .6s linear;
}

/* ============ HEADER ============ */
.hdr{
  position:sticky;top:0;z-index:100;
  background:linear-gradient(180deg,#0e1d32 0%,#0f1e35 100%);
  border-bottom:1px solid var(--bd);
}
.hdr-top{display:flex;align-items:center;gap:10px;padding:10px 14px;}
.logo{
  display:flex;align-items:center;gap:7px;
  font-size:17px;font-weight:900;letter-spacing:.6px;
  color:var(--yellow);flex-shrink:0;user-select:none;
}
.logo::before{
  content:"⚡";font-size:18px;
  filter:drop-shadow(0 0 6px var(--yellow));
}
.logo span{color:var(--t);font-weight:700;}
.hdr-tabs{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none;padding:0 4px;}
.hdr-tabs::-webkit-scrollbar{display:none;}
.htab{
  flex-shrink:0;padding:7px 12px;border-radius:7px;
  font-size:12.5px;font-weight:600;
  color:var(--t2);transition:all .18s;white-space:nowrap;
}
.htab:hover{color:var(--t);background:var(--card);}
.htab.on{color:var(--bg);background:var(--yellow);}
.hdr-actions{display:flex;gap:6px;align-items:center;flex-shrink:0;}
.hbtn{
  width:34px;height:34px;border-radius:8px;
  background:var(--card);border:1px solid var(--bd);
  color:var(--t2);font-size:15px;
  display:flex;align-items:center;justify-content:center;
  transition:all .18s;position:relative;overflow:hidden;
}
.hbtn:hover{color:var(--yellow);border-color:var(--yellow);}
.balance{
  display:flex;align-items:center;gap:5px;
  background:var(--card2);border:1px solid var(--bd);
  padding:7px 11px;border-radius:8px;
  font-size:12.5px;font-weight:700;cursor:pointer;
  white-space:nowrap;transition:all .18s;
  position:relative;overflow:hidden;
}
.balance:hover{border-color:var(--yellow);}
.balance::before{content:"₽";color:var(--t3);font-weight:900;font-size:11px;}
.balance b{color:var(--yellow);font-weight:900;}

/* ============ FILTERS ============ */
.fbar{display:flex;gap:6px;padding:0 14px 12px;overflow-x:auto;scrollbar-width:none;}
.fbar::-webkit-scrollbar{display:none;}
.fchip{
  flex-shrink:0;padding:6px 12px;border-radius:7px;
  background:var(--card);border:1px solid var(--bd);
  font-size:12px;font-weight:600;
  color:var(--t2);transition:all .18s;white-space:nowrap;
  position:relative;overflow:hidden;
}
.fchip:hover{color:var(--t);}
.fchip.on{background:var(--yellow);color:var(--bg);border-color:var(--yellow);}
.fchip.live-dot::before{
  content:"";display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--live);margin-right:5px;animation:blink 1.4s infinite;
}

/* ============ PAGE ============ */
.page{max-width:1200px;margin:0 auto;padding:14px;}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:16px 0 10px;}
.sec-t{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;}
.sec-t::before{content:"";width:3px;height:14px;background:var(--yellow);border-radius:2px;}
.sec-t .cnt{font-size:11.5px;font-weight:600;color:var(--t3);margin-left:2px;}
.sec-more{font-size:12px;font-weight:700;color:var(--yellow);cursor:pointer;}

/* ============ MATCH CARD (новый дизайн) ============ */
.mc{
  background:var(--card);border:1px solid var(--bd);
  border-radius:10px;margin-bottom:10px;overflow:hidden;
  transition:border-color .18s;animation:cardIn .3s;
}
.mc:hover{border-color:var(--bd2);}
.mc.live{border-left:3px solid var(--live);}

/* Шапка матча */
.mc-head{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:9px 12px;
  background:var(--card2);
  border-bottom:1px solid var(--bd);
  font-size:11px;
}
.mc-league{
  display:flex;align-items:center;gap:6px;
  color:var(--yellow);font-weight:800;
  text-transform:uppercase;letter-spacing:.4px;
  min-width:0;overflow:hidden;
}
.mc-league .flag{
  width:14px;height:10px;border-radius:2px;
  background:var(--t3);
  flex-shrink:0;overflow:hidden;
}
.mc-league span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mc-status{
  display:flex;align-items:center;gap:5px;
  font-size:11px;font-weight:800;
  color:var(--t2);white-space:nowrap;
  font-variant-numeric:tabular-nums;
  text-transform:uppercase;letter-spacing:.3px;
}
.mc-status.live{color:var(--red2);}
.mc-status.live::before{
  content:"";width:6px;height:6px;border-radius:50%;
  background:var(--live);animation:blink 1.4s infinite;
}

/* Команды + счёт */
.mc-teams{
  display:flex;flex-direction:column;
  padding:11px 12px;gap:9px;
}
.mc-team{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.mc-tn{
  display:flex;align-items:center;gap:10px;
  flex:1;min-width:0;font-size:14px;font-weight:600;
}
.mc-tn .lg-wrap{
  width:26px;height:26px;border-radius:50%;
  background:var(--card3);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;overflow:hidden;
  border:1px solid var(--bd);
}
.mc-tn .lg-wrap img{width:100%;height:100%;object-fit:cover;}
.mc-tn .lg-wrap span{font-size:11px;font-weight:900;color:#fff;}
.mc-tn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mc-score{
  font-size:18px;font-weight:900;
  min-width:22px;text-align:right;
  color:var(--yellow);
  font-variant-numeric:tabular-nums;
  height:22px;line-height:22px;
}

/* ============ ODDS (новый дизайн — как на скрине) ============ */
.mc-odds{
  display:grid;gap:6px;
  padding:0 12px 10px;
  grid-template-columns:repeat(3,1fr);
}

.odd{
  background:var(--odd-bg);
  border-radius:8px;
  padding:9px 6px 8px;
  cursor:pointer;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:2px;
  min-height:52px;
  transition:background .15s;
  position:relative;overflow:hidden;
  border:1px solid transparent;
}
.odd:hover{background:var(--odd-bg-hover);}
.odd:active{transform:scale(.98);}
.odd.sel{
  background:var(--yellow);
  border-color:var(--yellow2);
}
.odd.sel .olbl,
.odd.sel .oval{color:var(--bg);font-weight:900;}
.odd.sel .oval{font-weight:900;}
.odd.cl{opacity:.35;cursor:not-allowed;}
.odd.cl .oval{text-decoration:line-through;}

.olbl{
  font-size:10.5px;font-weight:600;
  color:var(--t2);
  text-align:center;line-height:1.2;
  white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:100%;
}
.oval{
  font-size:15px;font-weight:800;
  color:var(--t);
  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum";
  display:inline-block;
  min-width:48px;
  text-align:center;
  letter-spacing:-.2px;
  transition:color .3s;
}
.oval.up{animation:flashUp 1.4s ease-out;}
.oval.dn{animation:flashDn 1.4s ease-out;}
.odd.sel .oval.up,.odd.sel .oval.dn{animation:none;}

/* Подсказка снизу */
.mc-hint{
  text-align:center;padding:8px;
  font-size:11px;font-weight:600;
  color:var(--t3);
  border-top:1px solid var(--bd);
  cursor:pointer;
  user-select:none;
}
.mc-hint::before{content:"👆";margin-right:5px;}
.mc-hint:hover{color:var(--yellow);background:rgba(255,217,74,.04);}
.mc-hint:active{background:rgba(255,217,74,.1);}

/* ============ MATCH CENTER ============ */
.mcc{
  position:fixed;inset:0;z-index:200;
  background:var(--bg);display:none;
  flex-direction:column;overflow-y:auto;
}
.mcc.on{display:flex;}

.mcc-h{
  position:sticky;top:0;z-index:10;
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;
  background:linear-gradient(180deg,#0e1d32 0%,#0f1e35 100%);
  border-bottom:1px solid var(--bd);
}
.mcc-back{
  width:34px;height:34px;border-radius:8px;
  background:var(--card);border:1px solid var(--bd);
  color:var(--t2);font-size:16px;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;flex-shrink:0;
}
.mcc-back:hover{color:var(--yellow);border-color:var(--yellow);}
.mcc-info{flex:1;min-width:0;}
.mcc-info .t{
  font-size:14px;font-weight:800;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.mcc-info .s{
  font-size:11.5px;color:var(--t3);
  margin-top:3px;display:flex;gap:8px;align-items:center;
}
.mcc-info .s .dot{
  width:5px;height:5px;border-radius:50%;
  background:var(--live);animation:blink 1.4s infinite;
}
.mcc-info .s .sc{
  color:var(--yellow);font-weight:900;font-size:14px;
  font-variant-numeric:tabular-nums;
}
.mcc-fav{
  width:34px;height:34px;border-radius:8px;
  background:var(--card);border:1px solid var(--bd);
  color:var(--t3);font-size:15px;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;flex-shrink:0;
}
.mcc-fav.on{color:var(--yellow);border-color:var(--yellow);}

.mcc-tabs{
  position:sticky;top:58px;z-index:9;
  display:flex;gap:0;background:var(--bg2);
  border-bottom:1px solid var(--bd);
  overflow-x:auto;scrollbar-width:none;padding:0 8px;
}
.mcc-tabs::-webkit-scrollbar{display:none;}
.mcc-tab{
  flex-shrink:0;padding:13px 14px;
  font-size:12.5px;font-weight:700;color:var(--t3);
  border-bottom:2px solid transparent;
  transition:all .18s;white-space:nowrap;
  text-transform:uppercase;letter-spacing:.3px;
  position:relative;
}
.mcc-tab:hover{color:var(--t2);}
.mcc-tab.on{color:var(--yellow);border-bottom-color:var(--yellow);}

.mcc-body{flex:1;padding:14px;max-width:1100px;margin:0 auto;width:100%;}
.pane{display:none;}
.pane.on{display:block;}

/* ============ MARKETS (новый дизайн — как на скрине) ============ */
.mkts{display:flex;flex-direction:column;gap:14px;}

.mkt-title{
  font-size:15px;font-weight:900;
  color:var(--yellow);
  margin-bottom:4px;
  letter-spacing:.3px;
}

.mkt{
  background:var(--card);border:1px solid var(--bd);
  border-radius:12px;padding:14px;
}
.mkt-h{
  font-size:14px;font-weight:800;
  color:var(--yellow);
  margin-bottom:12px;
  letter-spacing:.2px;
}

.mkt-row{
  display:grid;
  grid-template-columns:40px 1fr 1fr;
  gap:8px;margin-bottom:8px;
  align-items:center;
}
.mkt-row:last-child{margin-bottom:0;}

.mkt-line{
  font-size:13px;font-weight:700;
  color:var(--t2);
  text-align:center;
}

.mkt-odd{
  background:var(--odd-bg);
  border-radius:8px;
  padding:9px 6px 8px;
  cursor:pointer;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:2px;
  min-height:52px;
  transition:background .15s;
  position:relative;overflow:hidden;
  border:1px solid transparent;
}
.mkt-odd:hover{background:var(--odd-bg-hover);}
.mkt-odd:active{transform:scale(.98);}
.mkt-odd.sel{background:var(--yellow);border-color:var(--yellow2);}
.mkt-odd.sel .mkt-olbl,
.mkt-odd.sel .mkt-oval{color:var(--bg);font-weight:900;}
.mkt-odd.cl{opacity:.35;cursor:not-allowed;}
.mkt-odd.cl .mkt-oval{text-decoration:line-through;}

.mkt-olbl{
  font-size:10.5px;font-weight:600;
  color:var(--t2);text-align:center;line-height:1.2;
}
.mkt-oval{
  font-size:15px;font-weight:800;
  color:var(--t);
  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum";
  display:inline-block;
  min-width:48px;
  text-align:center;
  transition:color .3s;
}
.mkt-oval.up{animation:flashUp 1.4s ease-out;}
.mkt-oval.dn{animation:flashDn 1.4s ease-out;}
.mkt-odd.sel .mkt-oval.up,
.mkt-odd.sel .mkt-oval.dn{animation:none;}

/* Обычный grid без линии слева (для 1X2 и т.д.) */
.mkt-grid{
  display:grid;gap:8px;
  grid-template-columns:repeat(2,1fr);
}
.mkt-grid.g3{grid-template-columns:repeat(3,1fr);}
.mkt-grid.g4{grid-template-columns:repeat(4,1fr);}

/* ============ FEED / COMMENT / MOMENT ============ */
.feed{
  background:var(--card);border:1px solid var(--bd);
  border-radius:10px;display:flex;flex-direction:column;
  max-height:520px;overflow:hidden;
}
.feed-h{
  padding:11px 12px;border-bottom:1px solid var(--bd);
  display:flex;justify-content:space-between;
  font-size:11.5px;font-weight:800;
  text-transform:uppercase;letter-spacing:.5px;color:var(--t2);
}
.feed-h::before{content:"🔴";margin-right:6px;}
.feed-b{overflow-y:auto;flex:1;}
.fe{
  display:flex;gap:10px;padding:9px 12px;
  border-bottom:1px solid var(--bd);font-size:12.5px;
  animation:evIn .35s;
}
.fe:last-child{border-bottom:none;}
.fe.hl{background:linear-gradient(90deg,rgba(255,217,74,.1),transparent 80%);}
.fe .min{
  width:44px;flex-shrink:0;font-size:11px;font-weight:800;
  color:var(--yellow);font-variant-numeric:tabular-nums;
}
.fe .ic{
  width:18px;height:18px;flex-shrink:0;border-radius:50%;
  background:var(--card2);
  display:flex;align-items:center;justify-content:center;
  font-size:10px;
}
.fe .tx{flex:1;min-width:0;color:var(--t2);line-height:1.4;}
.fe .tx b{color:var(--t);font-weight:700;}

.comment{
  margin-top:12px;padding:14px 16px;
  background:linear-gradient(135deg,var(--card2) 0%,var(--card) 100%);
  border:1px solid var(--bd);border-left:3px solid var(--yellow);
  border-radius:10px;
  font-size:13px;color:var(--t2);
  font-style:italic;line-height:1.5;min-height:52px;
}
.comment::before{
  content:"💬";margin-right:8px;font-style:normal;
  display:inline-block;
}

.moment{
  margin-top:12px;padding:16px;border-radius:10px;
  background:linear-gradient(135deg,var(--card2) 0%,var(--card) 100%);
  border:1px solid var(--yellow);display:none;
}
.moment.on{display:block;animation:slideUp .4s;}
.moment .tag{
  font-size:10.5px;font-weight:900;color:var(--yellow);
  text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;
}
.moment .m{font-size:18px;font-weight:900;margin-bottom:4px;}
.moment .s{font-size:12.5px;color:var(--t2);}

.mom{
  margin-top:12px;padding:14px;
  background:var(--card);border:1px solid var(--bd);border-radius:10px;
}
.mom-t{
  font-size:11px;font-weight:800;color:var(--t3);
  text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;
}
.mom-r{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:600;margin-bottom:6px;}
.mom-r:last-child{margin-bottom:0;}
.mom-r .nm{width:80px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--t2);}
.mom-r .bar{flex:1;height:7px;border-radius:4px;background:var(--card3);overflow:hidden;}
.mom-r .bar i{display:block;height:100%;transition:width .5s;}
.mom-r .bar .home{background:linear-gradient(90deg,var(--yellow),var(--yellow2));}
.mom-r .bar .away{background:linear-gradient(90deg,var(--blue),#7aabee);}
.mom-r .v{width:34px;flex-shrink:0;text-align:right;font-weight:800;font-variant-numeric:tabular-nums;}

/* ============ PITCH ============ */
.ov{display:grid;grid-template-columns:1fr;gap:14px;}
@media (min-width:900px){.ov{grid-template-columns:minmax(0,1fr) 320px;}}
.pitch{
  background:var(--card);border:1px solid var(--bd);
  border-radius:10px;padding:12px;
}
.pitch svg{width:100%;height:auto;display:block;border-radius:8px;}

/* ============ STATS ============ */
.stats{display:flex;flex-direction:column;gap:2px;}
.st{
  display:grid;grid-template-columns:50px 1fr 50px;
  align-items:center;gap:10px;padding:10px 14px;
  background:var(--card);border:1px solid var(--bd);
}
.st+.st{margin-top:-1px;}
.st:first-child{border-radius:10px 10px 0 0;}
.st:last-child{border-radius:0 0 10px 10px;}
.st .v{font-size:14px;font-weight:900;text-align:center;font-variant-numeric:tabular-nums;}
.st .v.d{color:var(--t3);font-weight:600;}
.st .n{
  font-size:11.5px;font-weight:600;color:var(--t3);
  text-align:center;text-transform:uppercase;letter-spacing:.4px;
}
.st .b{
  grid-column:1/-1;display:flex;height:3px;
  background:var(--card3);border-radius:3px;overflow:hidden;margin-top:4px;
}
.st .b .h{background:var(--yellow);transition:width .4s;}
.st .b .a{background:var(--blue);margin-left:auto;transition:width .4s;}

/* ============ COUPON ============ */
.cp{
  position:fixed;bottom:0;left:0;right:0;z-index:300;
  background:var(--card);border-top:2px solid var(--yellow);
  border-radius:16px 16px 0 0;
  transform:translateY(110%);
  transition:transform .35s cubic-bezier(.4,0,.2,1);
  max-height:80vh;display:flex;flex-direction:column;
  box-shadow:0 -8px 32px rgba(0,0,0,.6);
}
.cp.show{transform:translateY(0);}
.cp-bar{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;user-select:none;flex-shrink:0;}
.cp-bar .ic{font-size:18px;}
.cp-bar .cnt{
  background:var(--yellow);color:var(--bg);
  font-size:11px;font-weight:900;
  padding:2px 7px;border-radius:10px;
  min-width:20px;text-align:center;
}
.cp-bar .ttl{flex:1;font-size:13px;font-weight:700;}
.cp-bar .od{font-size:14px;font-weight:900;color:var(--yellow);font-variant-numeric:tabular-nums;}
.cp-close{
  width:30px;height:30px;border-radius:7px;

  /* ---------- ВРЕМЯ ---------- */
  realElapsed(){
    return (Date.now() - this.cycleStart) / 1000;
  }

  // Прогресс 0..1 без учёта перерывов
  rawProgress(){
    return clamp(this.realElapsed() / this.realDuration, 0, 1);
  }

  // Прогресс с учётом перерывов (паузы не идут в прогресс)
  progress(){
    let elapsed = this.realElapsed();
    // Отнимаем время, потраченное на завершённые перерывы
    let breakTime = 0;
    const breaks = this.breaks || [];
    for(const b of breaks){
      const breakPoint = b.at * this.realDuration;
      if(elapsed > breakPoint){
        // Определим, идёт ли сейчас перерыв или уже закончился
        // Для простоты — считаем что каждый перерыв длится b.dur
        breakTime += b.dur;
      }
    }
    // Если сейчас идёт перерыв — прогресс останавливается
    const p = clamp((elapsed - breakTime) / this.realDuration, 0, 1);
    return p;
  }

  isOnBreak(){
    const now = Date.now();
    if(this.breakEndAt && now < this.breakEndAt) return true;
    return false;
  }

  gameTime(){
    const p = this.progress();
    const S = this.sport;
    if(S === 'football') return p * 90;
    if(S === 'hockey')   return p * 60;
    if(S === 'ufc')      return p * 5;
    if(S === 'cyber')    return p * 3;
    return p * 90;
  }

  displayClock(){
    if(this.finished) return 'FT';
    if(this.isOnBreak()){
      const left = Math.ceil((this.breakEndAt - Date.now()) / 1000);
      return `⏸ Перерыв ${left}с`;
    }
    const S = this.sport;
    const t = this.gameTime();

    if(S === 'football'){
      const m = Math.floor(t);
      return `${m}'`;
    }
    if(S === 'hockey'){
      const per = Math.min(3, Math.floor(t/20) + 1);
      const inP = t - (per-1)*20;
      return `П${per} · ${Math.floor(inP)}'`;
    }
    if(S === 'ufc'){
      const round = Math.min(5, Math.floor(t) + 1);
      const inR = t - (round-1);
      const totalSec = 5 * 60;
      const left = Math.floor((1 - inR) * totalSec);
      const mm = Math.floor(left / 60);
      const ss = left % 60;
      return `R${round} · ${pad2(mm)}:${pad2(ss)}`;
    }
    if(S === 'cyber'){
      const map = Math.min(3, Math.floor(t) + 1);
      const inM = t - (map-1);
      const roundInMap = Math.floor(inM * 16) + 1;
      return `Карта ${map} · Р${Math.min(16, roundInMap)}`;
    }
    return '00:00';
  }

  stageLabel(){
    const S = this.sport;
    const t = this.gameTime();
    if(S === 'football') return t < 45 ? '1-й тайм' : '2-й тайм';
    if(S === 'hockey'){
      const p = Math.min(3, Math.floor(t/20) + 1);
      return `${p}-й период из 3`;
    }
    if(S === 'ufc'){
      const r = Math.min(5, Math.floor(t) + 1);
      return `Раунд ${r}/5`;
    }
    if(S === 'cyber'){
      const m = Math.min(3, Math.floor(t) + 1);
      return `Карта ${m}/3`;
    }
    return '';
  }

  simText(){
    const el = clamp(this.realElapsed(), 0, this.realDuration + 100);
    const mm = Math.floor(el/60), ss = Math.floor(el%60);
    return `Симуляция ${pad2(mm)}:${pad2(ss)} / 05:00`;
  }

  suspend(ms){ this.suspended = true; this.suspendedUntil = Date.now() + ms; }
  isSuspended(){ return this.suspended && Date.now() < this.suspendedUntil; }
  setLiveMoment(t,s){ this.liveMoment = {title:t,sub:s,ts:Date.now()}; }
  setCommentary(text){
    if(text === this.commentary) return;
    this.commentary = text;
    if(this.onCommentary) this.onCommentary(text);
  }
  momentumShift(team, amt){
    if(team === 'h') this.momentum.h = clamp(this.momentum.h + amt, 5, 95);
    else this.momentum.a = clamp(this.momentum.a + amt, 5, 95);
    const t = this.momentum.h + this.momentum.a;
    this.momentum.h = clamp(this.momentum.h/t*100, 5, 95);
    this.momentum.a = 100 - this.momentum.h;
  }
  pushEvent(ev){
    ev.ts = Date.now();
    this.events.unshift(ev);
    if(this.events.length > 120) this.events.length = 120;
    if(this.onEvent) this.onEvent(ev);
  }

  /* ---------- TICK ---------- */
  tick(){
    if(this.finished) return;
    const now = Date.now();

    // Проверка перерывов
    if(this.breakEndAt && now < this.breakEndAt){
      return; // На перерыве
    }

    const rawP = this.rawProgress();
    // Прошли ли мы точку перерыва и ещё не запустили его
    for(const b of this.breaks){
      const bp = b.at * this.realDuration;
      const elapsed = this.realElapsed();
      // Если перерыв наступил и ещё не был активирован
      if(!b.started && elapsed >= bp){
        b.started = true;
        this.breakEndAt = now + b.dur * 1000;
        this.pushEvent({type:'HALF_TIME', min:Math.floor(this.gameTime()), team:null, text:`⏸ ${b.name}`, highlight:true});
        this.setLiveMoment(`⏸ ${b.name}`, `Пауза ${b.dur} сек`);
        this.setCommentary(`⏸ ${b.name}. Скоро продолжим.`);
        return;
      }
    }

    // Реальное время вышло
    if(rawP >= 1){
      this.finish();
      return;
    }

    if(this.suspended && now >= this.suspendedUntil) this.suspended = false;

    if(now - this.lastEventAt >= this.nextEventIn){
      this.rollEvent();
      this.lastEventAt = now;
      this.nextEventIn = rnd(1500, 3500);
    }

    this.recalcOdds();
  }

  /* ---------- ВЕСА СОБЫТИЙ ---------- */
  getWeights(){
    if(this.sport === 'football') return [
      {t:'PASS',w:34},{t:'ATTACK',w:22},{t:'DANGEROUS',w:14},
      {t:'SHOT_OFF',w:9},{t:'SHOT_ON',w:8},{t:'BLOCKED',w:4},
      {t:'CORNER',w:6},{t:'FOUL',w:5},{t:'YELLOW',w:3},
      {t:'RED',w:0.15},{t:'GOAL',w:4.5},
    ];
    if(this.sport === 'hockey') return [
      {t:'PASS',w:22},{t:'ATTACK',w:20},{t:'SHOT_OFF',w:13},
      {t:'SHOT_ON',w:12},{t:'HIT_HOCKEY',w:8},{t:'FOUL',w:6},
      {t:'YELLOW',w:5},{t:'GOAL',w:6},
    ];
    return [];
  }

  pickAttackTeam(){
    const total = this.homeStrength + this.awayStrength;
    const pH = this.homeStrength / total;
    // Реальный рандом через RNG (детерминированный)
    return this.rng() < pH ? 'h' : 'a';
  }

  rollEvent(){
    const evs = this.getWeights();
    if(!evs.length) return;
    const total = evs.reduce((s,e)=>s+e.w,0);
    let r = this.rng()*total;
    let chosen = evs[0];
    for(const e of evs){ r -= e.w; if(r<=0){ chosen = e; break; } }
    this.execute(chosen.t, this.pickAttackTeam());
  }

  execute(type, team){
    if(this.sport === 'football') return this.executeFootball(type, team);
    if(this.sport === 'hockey')   return this.executeHockey(type, team);
  }

  /* ---------- ФУТБОЛ ---------- */
  executeFootball(type, team){
    const m = Math.floor(this.gameTime());
    const tN = team === 'h' ? this.home : this.away;
    const oN = team === 'h' ? this.away : this.home;
    const switchP = () => this.possession = team === 'h' ? 'a' : 'h';

    switch(type){
      case 'PASS':
        this.attackingTeam = team;
        this.setBall(team, 'BUILD');
        if(this.rng() < 0.35) switchP();
        this.pushEvent({type, min:m, team, text:`Передача у <b>${tN}</b>`});
        this.setCommentary(`<b>${tN}</b> разыгрывает мяч.`);
        break;
      case 'ATTACK':
        this.attackingTeam = team;
        this.setBall(team, 'ATTACK');
        this.pushEvent({type, min:m, team, text:`Атака <b>${tN}</b>`});
        this.setCommentary(`<b>${tN}</b> идёт вперёд.`);
        break;
      case 'DANGEROUS':
        this.setBall(team, 'DANGER');
        this.pushEvent({type, min:m, team, text:`⚡ Опасно! У ворот <b>${oN}</b>`, highlight:true});
        this.setCommentary(`🔥 <b>${tN}</b> создаёт момент!`);
        this.momentumShift(team, 6);
        this.setLiveMoment('🔥 Опасный момент', tN);
        break;
      case 'SHOT_OFF':
        this.stats.shots[team]++;
        this.setBall(team, 'SHOT');
        switchP();
        this.pushEvent({type, min:m, team, text:`Удар мимо <b>${tN}</b>`});
        this.setCommentary(`<b>${tN}</b> бьёт мимо.`);
        break;
      case 'SHOT_ON':
        this.stats.shots[team]++;
        this.stats.onT[team]++;
        this.setBall(team, 'SHOT_ON');
        this.suspend(1200);
        switchP();
        this.pushEvent({type, min:m, team, text:`🎯 Удар в створ!`, highlight:true});
        this.setCommentary(`🎯 Вратарь <b>${oN}</b> отбивает!`);
        this.setLiveMoment('🎯 Удар в створ', tN);
        this.stats.saves[team === 'h' ? 'a' : 'h']++;
        break;
      case 'BLOCKED':
        this.stats.shots[team]++;
        this.stats.blocked[team]++;
        switchP();
        this.pushEvent({type, min:m, team, text:`Удар <b>${tN}</b> заблокирован`});
        break;
      case 'CORNER':
        this.stats.corners[team]++;
        this.pushEvent({type, min:m, team, text:`⚑ Угловой у <b>${tN}</b>`});
        this.setCommentary(`Угловой у <b>${tN}</b>.`);
        break;
      case 'FOUL':
        this.stats.fouls[team === 'h' ? 'a' : 'h']++;
        this.pushEvent({type, min:m, team, text:`Свисток — нарушение`});
        switchP();
        break;
      case 'YELLOW':
        this.stats.yellow[team]++;
        this.pushEvent({type, min:m, team, text:`🟨 Жёлтая <b>${tN}</b>`, highlight:true});
        this.setCommentary(`🟨 Жёлтая игроку <b>${tN}</b>.`);
        this.momentumShift(team, -3);
        break;
      case 'RED':
        this.stats.red[team]++;
        this.suspend(2000);
        this.pushEvent({type, min:m, team, text:`🟥 КРАСНАЯ! <b>${tN}</b>`, highlight:true});
        this.setCommentary(`🟥 Удаление! <b>${tN}</b> в меньшинстве.`);
        this.setLiveMoment('🟥 Удаление', tN);
        this.momentumShift(team, -12);
        break;
      case 'GOAL':
        this.scoreGoal(team);
        break;
    }
  }

  /* ---------- ХОККЕЙ ---------- */
  executeHockey(type, team){
    const m = Math.floor(this.gameTime());
    const tN = team === 'h' ? this.home : this.away;
    const switchP = () => this.possession = team === 'h' ? 'a' : 'h';

    switch(type){
      case 'PASS':
        this.setBall(team, 'BUILD');
        if(this.rng() < 0.4) switchP();
        this.pushEvent({type, min:m, team, text:`Пас у <b>${tN}</b>`});
        this.setCommentary(`<b>${tN}</b> контролирует шайбу.`);
        break;
      case 'ATTACK':
        this.attackingTeam = team;
        this.setBall(team, 'ATTACK');
        this.pushEvent({type, min:m, team, text:`Атака <b>${tN}</b>`});
        this.setCommentary(`<b>${tN}</b> развивает атаку.`);
        break;
      case 'SHOT_OFF':
        this.stats.shots[team]++;
        this.setBall(team, 'SHOT');
        switchP();
        this.pushEvent({type, min:m, team, text:`Бросок мимо <b>${tN}</b>`});
        break;
      case 'SHOT_ON':
        this.stats.shots[team]++;
        this.stats.onT[team]++;
        this.suspend(1000);
        switchP();
        this.pushEvent({type, min:m, team, text:`🥅 Бросок в створ!`, highlight:true});
        this.setCommentary(`🥅 Опасный бросок <b>${tN}</b>!`);
        this.stats.saves[team === 'h' ? 'a' : 'h']++;
        this.setLiveMoment('🥅 Бросок в створ', tN);
        break;
      case 'HIT_HOCKEY':
        this.stats.hits[team]++;
        this.pushEvent({type, min:m, team, text:`💥 Силовой приём`});
        break;
      case 'FOUL':
        this.stats.fouls[team === 'h' ? 'a' : 'h']++;
        this.pushEvent({type, min:m, team, text:`Удаление 2 мин`});
        break;
      case 'YELLOW':
        this.stats.yellow[team]++;
        this.pushEvent({type, min:m, team, text:`Малый штраф`});
        break;
      case 'GOAL':
        this.scoreGoal(team);
        break;
    }
  }

  setBall(team, state){
    const isH = team === 'h';
    const pos = {
      BUILD:{x:isH?250:800,y:340},
      ATTACK:{x:isH?420:630,y:rnd(150,530)},
      DANGER:{x:isH?700:350,y:rnd(200,480)},
      SHOT:{x:isH?900:150,y:rnd(250,430)},
      SHOT_ON:{x:isH?1000:50,y:rnd(290,390)},
    }[state] || {x:525,y:340};
    this.ball.tx = pos.x;
    this.ball.ty = pos.y;
  }

  scoreGoal(team){
    if(team === 'h') this.hs++; else this.as++;
    const m = Math.floor(this.gameTime());
    const tN = team === 'h' ? this.home : this.away;
    this.pushEvent({type:'GOAL', min:m, team, text:`⚽ <b>ГОЛ!</b> ${tN}. ${this.hs}:${this.as}`, highlight:true});
    this.setLiveMoment('⚽ ГОЛ!', `${tN} · ${this.hs}:${this.as}`);
    this.setCommentary(`⚽ <b>ГОООЛ!</b> ${tN} забивает! Счёт ${this.hs}:${this.as}!`);
    this.suspend(2500);
    this.momentumShift(team, 10);
    setTimeout(() => {
      if(!this.finished){
        this.state = 'KICK_OFF';
        this.possession = team === 'h' ? 'a' : 'h';
      }
    }, 2000);
  }

  finish(){
    this.finished = true;
    this.finishedAt = Date.now();
    for(const mk of Object.values(this.markets)){
      mk.closed = mk.lbl.map(() => true);
    }
    const endText = this.finalNote || `🏁 Матч завершён. Итог ${this.hs}:${this.as}`;
    this.pushEvent({type:'FULL_TIME', min:90, team:null, text:endText, highlight:true});
    this.setLiveMoment('🏁 Завершён', `${this.hs}:${this.as}`);
    this.setCommentary(endText);
    if(window.saveToHistory) window.saveToHistory(this);
    if(window.checkCoupon) window.checkCoupon(this);
  }

  /* ---------- КЭФЫ ---------- */
  recalcOdds(){
    const p = this.progress();
    const remain = 1 - p;
    const lead = this.hs - this.as;
    const total = this.hs + this.as;

    for(const [name, mk] of Object.entries(this.markets)){
      if(mk.closed && mk.closed.every(x => x)) continue;
      const newVal = this.calcMarket(name, mk, {p, remain, lead, total});
      if(!newVal) continue;

      newVal.forEach((v, i) => {
        const key = name + '_' + i;
        const last = this.lastOdds[key];
        if(last != null && Math.abs(v - last) > 0.02){
          this.flashes[key] = {dir: v > last ? 'up' : 'dn', ts: Date.now()};
        }
        this.lastOdds[key] = v;
      });
      mk.val = newVal;
    }
  }

  calcMarket(name, mk, ctx){
    const {remain, lead, total} = ctx;
    const S = this.sport;
    let avgTotal = 2.7;
    if(S === 'hockey') avgTotal = 5.5;

    switch(mk.type){
      case '1x2':{
        const two = mk.lbl.length === 2;
        let pH, pD = 0, pA;
        const hAdv = S === 'football' ? 0.08 : 0.04;

        if(lead > 0){
          pH = clamp(0.5 + lead*0.15 + (1-remain)*0.22 + hAdv, 0.05, 0.95);
          pD = two ? 0 : 0.18*remain + 0.03;
          pA = Math.max(0.02, 1 - pH - pD);
        } else if(lead < 0){
          pA = clamp(0.5 + Math.abs(lead)*0.15 + (1-remain)*0.22, 0.05, 0.95);
          pD = two ? 0 : 0.18*remain + 0.03;
          pH = Math.max(0.02, 1 - pA - pD);
        } else {
          pH = 0.40*remain + 0.15 + hAdv;
          pA = 0.40*remain + 0.15;
          pD = two ? 0 : 0.30*remain + 0.05;
        }
        const sum = pH + pD + pA;
        pH/=sum; pD/=sum; pA/=sum;
        const mg = 1.06;
        if(two) return [clamp(1/pH/mg,1.02,99), clamp(1/pA/mg,1.02,99)];
        return [clamp(1/pH/mg,1.02,99), clamp(1/pD/mg,1.02,99), clamp(1/pA/mg,1.02,99)];
      }
      case 'dc':{
        let pH, pD, pA;
        if(lead > 0){ pH = 0.55 + lead*0.1 + (1-remain)*0.15; pD = 0.18*remain + 0.05; pA = Math.max(0.03, 1-pH-pD); }
        else if(lead < 0){ pA = 0.55 + Math.abs(lead)*0.1 + (1-remain)*0.15; pD = 0.18*remain + 0.05; pH = Math.max(0.03, 1-pA-pD); }
        else { pH = 0.38*remain + 0.15; pA = 0.38*remain + 0.15; pD = 0.24*remain + 0.1; }
        const s = pH+pD+pA;
        const p1X = (pH+pD)/s, p12 = (pH+pA)/s, pX2 = (pD+pA)/s;
        const mg = 1.06;
        return [clamp(1/Math.max(p1X,0.02)/mg,1.02,99), clamp(1/Math.max(p12,0.02)/mg,1.02,99), clamp(1/Math.max(pX2,0.02)/mg,1.02,99)];
      }
      case 'win':{
        let pH, pA;
        if(lead > 0){ pH = clamp(0.5 + lead*0.15 + (1-remain)*0.25, 0.03, 0.97); pA = 1 - pH; }
        else if(lead < 0){ pA = clamp(0.5 + Math.abs(lead)*0.15 + (1-remain)*0.25, 0.03, 0.97); pH = 1 - pA; }
        else { pH = 0.5; pA = 0.5; }
        const mg = 1.05;
        return [clamp(1/pH/mg,1.02,99), clamp(1/pA/mg,1.02,99)];
      }
      case 'over':{
        if(total > mk.line) return [1.00, 1.00];
        const expectedMore = avgTotal * remain;
        const projected = total + expectedMore;
        const diff = projected - mk.line;
        let pO = 1 / (1 + Math.exp(-diff * 0.9));
        pO = clamp(pO, 0.05, 0.95);
        const mg = 1.05;
        return [clamp(1/pO/mg,1.02,99), clamp(1/(1-pO)/mg,1.02,99)];
      }
      case 'btts':{
        const both = this.hs > 0 && this.as > 0;
        if(both){ mk.closed = [true,true]; mk.result = 'win'; return [1.00,1.00]; }
        if((this.hs === 0 || this.as === 0) && remain < 0.08){
          mk.closed = [true,true]; mk.result = 'lose'; return [1.00,1.00];
        }
        const pH = clamp(0.5 + this.hs*0.4 + remain*0.3, 0.1, 0.95);
        const pA = clamp(0.5 + this.as*0.4 + remain*0.3, 0.1, 0.95);
        let pYes = clamp(pH * pA, 0.05, 0.95);
        const mg = 1.06;
        return [clamp(1/pYes/mg,1.02,99), clamp(1/(1-pYes)/mg,1.02,99)];
      }
      case 'itb1':
      case 'itb2':{
        const score = mk.type === 'itb1' ? this.hs : this.as;
        if(score > mk.line) return [1.00, 1.00];
        const halfAvg = avgTotal / 2;
        const expectedMore = halfAvg * remain;
        const projected = score + expectedMore;
        const diff = projected - mk.line;
        let pO = 1 / (1 + Math.exp(-diff * 1.0));
        pO = clamp(pO, 0.05, 0.95);
        const mg = 1.06;
        return [clamp(1/pO/mg,1.02,99), clamp(1/(1-pO)/mg,1.02,99)];
      }
      case 'hand1':
      case 'hand2':{
        const score = mk.type === 'hand1' ? this.hs - this.as : this.as - this.hs;
        const adj = score + mk.line;
        const p = clamp(0.5 + adj*0.25 + (1-remain)*0.1, 0.05, 0.95);
        if(adj > 0 && remain < 0.1) return [1.00, 1.00];
        const mg = 1.06;
        return [clamp(1/p/mg,1.02,99), clamp(1/(1-p)/mg,1.02,99)];
      }
      case 'parity':{
        let pE = 0.5;
        if(remain < 0.1) pE = (total % 2 === 0) ? 0.95 : 0.05;
        else if(remain < 0.3) pE = (total % 2 === 0) ? 0.75 : 0.25;
        const mg = 1.06;
        return [clamp(1/pE/mg,1.02,99), clamp(1/(1-pE)/mg,1.02,99)];
      }
      case 'corners':{
        const c = this.stats.corners.h + this.stats.corners.a;
        if(c > mk.line) return [1.00, 1.00];
        const proj = c + 10 * remain;
        const pO = clamp(1/(1+Math.exp(-(proj-mk.line)*0.8)), 0.05, 0.95);
        const mg = 1.06;
        return [clamp(1/pO/mg,1.02,99), clamp(1/(1-pO)/mg,1.02,99)];
      }
      case 'cards':{
        const c = this.stats.yellow.h + this.stats.yellow.a + (this.stats.red.h + this.stats.red.a) * 2;
        if(c > mk.line) return [1.00, 1.00];
        const proj = c + 5 * remain;
        const pO = clamp(1/(1+Math.exp(-(proj-mk.line)*0.8)), 0.05, 0.95);
        const mg = 1.06;
        return [clamp(1/pO/mg,1.02,99), clamp(1/(1-pO)/mg,1.02,99)];
      }
      case 'shots':{
        const s = this.stats.shots.h + this.stats.shots.a;
        const proj = s + 60 * remain;
        const pO = clamp(1/(1+Math.exp(-(proj-mk.line)*0.05)), 0.05, 0.95);
        const mg = 1.06;
        return [clamp(1/pO/mg,1.02,99), clamp(1/(1-pO)/mg,1.02,99)];
      }
    }
    return mk.val;
  }
}

/* ============================================================
   MANAGER — СЕЙЧАС С SEED ОТ ВРЕМЕНИ
   Матчи одинаковые у всех
   ============================================================ */
const Manager = {
  matches: [],
  nextId: 1,

  init(){
    this.matches = [];
    this.nextId = 1;
    const cycle = currentCycle();

    // Футбол — 5 матчей с разносом 30 сек
    for(let i=0;i<5;i++){
      this.spawn('football', i*30, cycle);
    }
    // Хоккей — 3 матча
    for(let i=0;i<3;i++){
      this.spawn('hockey', i*30, cycle);
    }
    // UFC — 2 матча
    for(let i=0;i<2;i++){
      this.spawn('ufc', i*30, cycle);
    }
    // Кибер — 3 матча
    for(let i=0;i<3;i++){
      this.spawn('cyber', i*30, cycle);
    }

    console.log(`[SPORTLIVE] Цикл #${cycle} — ${this.matches.length} матчей`);
  },

  spawn(sport, offsetSec, cycle){
    cycle = cycle !== undefined ? cycle : currentCycle();
    const pools = {
      football: FOOTBALL_TEAMS,
      hockey: HOCKEY_TEAMS,
      ufc: UFC_FIGHTERS,
      cyber: CYBER_TEAMS,
    };
    const pool = pools[sport] || FOOTBALL_TEAMS;

    // Seed от (cycle + offset + sport) — детерминированный
    const seedBase = cycle * 7919 + offsetSec * 131 + sport.charCodeAt(0) * 17;
    const rng = makeRng(seedBase);
    const pairIdx = Math.floor(rng() * pool.length);
    const team = pool[pairIdx];
    const leagueIdx = Math.floor(rng() * (LEAGUES[sport]?.length || 1));
    const league = LEAGUES[sport]?.[leagueIdx] || 'Турнир';

    // Матч стартует позже на offsetSec — но мы уже прошли часть времени
    const startedAt = cycleStartTime(cycle) - offsetSec * 1000;

    const m = new Match({
      id: this.nextId++,
      sport,
      league,
      home: team.home,
      away: team.away,
      homeStrength: team.hStr || 1.0,
      awayStrength: team.aStr || 1.0,
      cycleStart: startedAt,
      seed: seedBase,
    });

    // Если offset большой и матч уже давно идёт — догоняем счёт
    this.catchUp(m);

    this.matches.push(m);
    return m;
  },

  catchUp(m){
    const p = m.progress();
    if(p <= 0) return;
    let avgTotal = 2.7;
    if(m.sport === 'hockey') avgTotal = 5.5;

    const expected = p * avgTotal;
    const full = Math.floor(expected);
    const frac = expected - full;

    for(let i=0;i<full;i++){
      if(m.rng() < 0.5) m.hs++;
      else m.as++;
    }
    if(m.rng() < frac){
      if(m.rng() < 0.5) m.hs++;
      else m.as++;
    }

    if(m.sport === 'football'){
      m.stats.shots.h = Math.round(p*7);
      m.stats.shots.a = Math.round(p*6);
      m.stats.onT.h = Math.round(m.stats.shots.h*0.4);
      m.stats.onT.a = Math.round(m.stats.shots.a*0.4);
      m.stats.corners.h = Math.round(p*5);
      m.stats.corners.a = Math.round(p*4);
      m.stats.yellow.h = Math.round(p*1.5);
      m.stats.yellow.a = Math.round(p*1.8);
      m.stats.pos.h = Math.round(40+m.rng()*20);
      m.stats.pos.a = 100-m.stats.pos.h;
    }
    if(m.sport === 'hockey'){
      m.stats.shots.h = Math.round(p*20);
      m.stats.shots.a = Math.round(p*18);
    }
  },

  tick(){
    this.matches.forEach(m => m.tick());

    // Ротация завершённых через 30 сек
    const now = Date.now();
    const cycle = currentCycle();
    this.matches = this.matches.map(m => {
      if(m.finished && m.finishedAt && now - m.finishedAt > PAUSE_BETWEEN_MATCHES * 1000){
        // Пересоздать матч со следующим cycle
        return this.spawn(m.sport, 0, cycle + 1);
      }
      return m;
    });
  },

  liveCount(){ return this.matches.filter(m => !m.finished).length; },
  find(id){ return this.matches.find(m => m.id === id); },
};

/* ============================================================
   РЫНКИ UFC
   ============================================================ */
Match.prototype.buildUfcMarkets = function(){
  const hS = this.homeStrength, aS = this.awayStrength;
  const total = hS + aS;
  const pH = clamp(hS / total, 0.15, 0.85);
  const pA = 1 - pH;

  return {
    'Победитель':       {type:'win',   lbl:['Победа 1','Победа 2'], val:[clamp(1/pH/1.05,1.05,20), clamp(1/pA/1.05,1.05,20)], closed:[false,false]},
    'Тотал 1.5 раунда': {type:'overR', line:1.5, lbl:['Больше','Меньше'], val:[1.80, 2.00], closed:[false,false]},
    'Тотал 2.5 раунда': {type:'overR', line:2.5, lbl:['Больше','Меньше'], val:[2.10, 1.72], closed:[false,false]},
    'Тотал 3.5 раунда': {type:'overR', line:3.5, lbl:['Больше','Меньше'], val:[2.80, 1.42], closed:[false,false]},
    'Тотал 4.5 раунда': {type:'overR', line:4.5, lbl:['Больше','Меньше'], val:[4.50, 1.20], closed:[false,false]},
    'Метод победы':     {type:'method', lbl:['KO/TKO','Сабмишен','Решение'], val:[2.50, 4.00, 2.20], closed:[false,false,false]},
    'Раунд победы':     {type:'round', lbl:['1','2','3','4','5'], val:[4.20, 5.50, 7.00, 9.00, 12.0], closed:[false,false,false,false,false]},
    'Досрочно':         {type:'btts', lbl:['Да','Нет'], val:[1.75, 2.05], closed:[false,false]},
    'Бой дойдёт до решения': {type:'btts', lbl:['Да','Нет'], val:[2.10, 1.72], closed:[false,false]},
    'Оба нокдауна':     {type:'btts', lbl:['Да','Нет'], val:[3.20, 1.32], closed:[false,false]},
    'Тотал ударов 150.5':{type:'hits', line:150.5, lbl:['Больше','Меньше'], val:[1.90, 1.90], closed:[false,false]},
  };
};

/* ============================================================
   РЫНКИ КИБЕР
   ============================================================ */
Match.prototype.buildCyberMarkets = function(){
  const hS = this.homeStrength, aS = this.awayStrength;
  const total = hS + aS;
  const pH = clamp(hS / total, 0.15, 0.85);
  const pA = 1 - pH;

  return {
    'Победитель':         {type:'win',   lbl:['1','2'],             val:[clamp(1/pH/1.05,1.05,20), clamp(1/pA/1.05,1.05,20)], closed:[false,false]},
    'Фора1 -1.5 карт':    {type:'hand1', line:-1.5, lbl:['Да','Нет'], val:[2.70, 1.45], closed:[false,false]},
    'Фора2 -1.5 карт':    {type:'hand2', line:-1.5, lbl:['Да','Нет'], val:[3.00, 1.38], closed:[false,false]},
    'Тотал 2.5 карт':     {type:'over',  line:2.5, lbl:['Больше','Меньше'], val:[2.00, 1.80], closed:[false,false]},
    'Обе карты':          {type:'btts',  lbl:['Да','Нет'],            val:[1.60, 2.30], closed:[false,false]},
    'Счёт по картам':     {type:'exact', lbl:['2:0','2:1','1:2','0:2'],val:[2.80, 3.40, 3.80, 4.50], closed:[false,false,false,false]},
    '1-я карта':          {type:'win',   lbl:['1','2'],               val:[1.85, 1.95], closed:[false,false]},
    'Тотал раундов 26.5': {type:'over',  line:26.5, lbl:['Больше','Меньше'], val:[1.90, 1.90], closed:[false,false]},
    'Тотал раундов 28.5': {type:'over',  line:28.5, lbl:['Больше','Меньше'], val:[2.10, 1.72], closed:[false,false]},
    'Тотал фрагов 40.5':  {type:'frags', line:40.5, lbl:['Больше','Меньше'], val:[1.90, 1.90], closed:[false,false]},
  };
};

const _origBuildMarkets = Match.prototype.buildMarkets;
Match.prototype.buildMarkets = function(){

/* ============================================================
   UFC — ЛОГИКА СОБЫТИЙ
   Любой раунд может стать последним. KO/сабмишен в любом раунде.
   ============================================================ */
Match.prototype.executeUfc = function(type, team){
  const t = this.gameTime();
  const round = Math.min(5, Math.floor(t) + 1);
  const tN = team === 'h' ? this.home : this.away;
  const oN = team === 'h' ? this.away : this.home;

  switch(type){
    case 'HIT': {
      this.stats.hits[team]++;
      this.pushEvent({type, min:round, team, text:`Удар <b>${tN}</b>`});
      this.setCommentary(`<b>${tN}</b> попадает в цель.`);
      break;
    }
    case 'ATTACK': {
      this.attackingTeam = team;
      this.pushEvent({type, min:round, team, text:`<b>${tN}</b> наступает`});
      this.setCommentary(`<b>${tN}</b> идёт вперёд.`);
      break;
    }
    case 'DANGEROUS': {
      this.pushEvent({type, min:round, team, text:`⚡ Опасно! <b>${tN}</b> потрясает соперника`, highlight:true});
      this.setCommentary(`🔥 <b>${tN}</b> наносит мощную серию!`);
      this.setLiveMoment('🔥 Опасно', tN);
      this.momentumShift(team, 8);
      break;
    }
    case 'SHOT_ON': {
      this.suspend(1500);
      this.pushEvent({type, min:round, team, text:`Мощный удар <b>${tN}</b>`, highlight:true});
      this.setCommentary(`💥 <b>${tN}</b> попадает сильно!`);
      this.momentumShift(team, 6);
      break;
    }
    case 'TAKEDOWN': {
      this.stats.hits[team]++;
      this.pushEvent({type, min:round, team, text:`Борьба <b>${tN}</b> в партере`});
      this.setCommentary(`<b>${tN}</b> переводит в партер.`);
      break;
    }
    case 'KO': {
      // KO возможен в любом раунде если момент правильный
      // Влияет сила + момент удачи
      const attackerS = team === 'h' ? this.homeStrength : this.awayStrength;
      const koChance = 0.35 + attackerS * 0.15;
      if(this.rng() > koChance) return;
      this.finishByKO(team, 'KO/TKO');
      break;
    }
    case 'SUBMISSION': {
      const attackerS = team === 'h' ? this.homeStrength : this.awayStrength;
      const subChance = 0.25 + attackerS * 0.1;
      if(this.rng() > subChance) return;
      this.finishByKO(team, 'Сабмишен');
      break;
    }
  }
};

Match.prototype.finishByKO = function(winner, method){
  const wN = winner === 'h' ? this.home : this.away;
  const round = Math.min(5, Math.floor(this.gameTime()) + 1);
  this.hs = winner === 'h' ? 1 : 0;
  this.as = winner === 'a' ? 1 : 0;
  this.finalNote = `💥 Победа ${wN} в раунде ${round} — ${method}!`;

  this.finished = true;
  this.finishedAt = Date.now();
  for(const mk of Object.values(this.markets)){
    mk.closed = mk.lbl.map(() => true);
  }
  this.pushEvent({
    type: method === 'Сабмишен' ? 'SUBMISSION' : 'KO',
    min: round,
    team: winner,
    text: `💥 <b>ПОБЕДА!</b> ${wN} в раунде ${round} — ${method}`,
    highlight: true,
  });
  this.setCommentary(`💥 <b>ПОБЕДА!</b> ${wN} выигрывает в раунде ${round} методом ${method}!`);
  this.setLiveMoment(`💥 ${method}`, `${wN} — раунд ${round}`);
  this.suspend(2500);

  if(window.saveToHistory) window.saveToHistory(this);
  if(window.checkCoupon) window.checkCoupon(this);
};

/* ============================================================
   UFC — finish по решению судей
   ============================================================ */
const _origFinish = Match.prototype.finish;
Match.prototype.finish = function(){
  if(this.sport === 'ufc'){
    // Победа решением судей
    const hScore = this.stats.hits.h || 0;
    const aScore = this.stats.hits.a || 0;
    const total = hScore + aScore;
    let winner;
    if(total === 0){
      winner = this.rng() < 0.5 ? 'h' : 'a';
    } else {
      // Может быть ничья? Нет — решаем по очкам
      const pH = hScore / total;
      // Реальный шанс с учётом рандома
      winner = this.rng() < pH ? 'h' : 'a';
    }
    const wN = winner === 'h' ? this.home : this.away;
    const rH = 3 + Math.floor(this.rng() * 3); // 3-5
    const rA = 5 - rH;
    this.hs = winner === 'h' ? 1 : 0;
    this.as = winner === 'a' ? 1 : 0;
    this.finalNote = `🏁 Победа ${wN} решением судей (${rH}:${rA})`;

    this.finished = true;
    this.finishedAt = Date.now();
    for(const mk of Object.values(this.markets)){
      mk.closed = mk.lbl.map(() => true);
    }
    this.pushEvent({type:'FULL_TIME', min:5, team:winner, text:this.finalNote, highlight:true});
    this.setCommentary(this.finalNote);
    this.setLiveMoment('🏁 Решение судей', wN);

    if(window.saveToHistory) window.saveToHistory(this);
    if(window.checkCoupon) window.checkCoupon(this);
    return;
  }
  return _origFinish.call(this);
};

/* ============================================================
   КИБЕР — ЛОГИКА (BO2/BO3)
   Карты по 16 раундов. Может быть 2:0 или 2:1.
   ============================================================ */
Match.prototype.executeCyber = function(type, team){
  const t = this.gameTime();
  const map = Math.min(3, Math.floor(t) + 1);
  const tN = team === 'h' ? this.home : this.away;

  // Текущая карта
  if(!this.mapScores[map-1]){
    this.mapScores[map-1] = {h:0, a:0, done:false};
  }
  const cur = this.mapScores[map-1];

  switch(type){
    case 'FRAG': {
      this.stats.frags[team]++;
      this.pushEvent({type, min:map, team, text:`Фраг <b>${tN}</b>`});
      this.setCommentary(`<b>${tN}</b> забирает фраг.`);
      break;
    }
    case 'ATTACK': {
      this.attackingTeam = team;
      this.pushEvent({type, min:map, team, text:`<b>${tN}</b> пушит`});
      this.setCommentary(`<b>${tN}</b> идёт в атаку.`);
      break;
    }
    case 'DANGEROUS': {
      this.pushEvent({type, min:map, team, text:`⚡ Решающий момент <b>${tN}</b>`, highlight:true});
      this.setCommentary(`🔥 <b>${tN}</b> близок к победе в раунде!`);
      this.setLiveMoment('🔥 Решающий', tN);
      this.momentumShift(team, 6);
      break;
    }
    case 'SHOT_ON': {
      this.suspend(1200);
      this.pushEvent({type, min:map, team, text:`Решающий фраг <b>${tN}</b>`, highlight:true});
      this.setCommentary(`💥 <b>${tN}</b> делает clutch!`);
      break;
    }
    case 'ROUND_WIN': {
      if(cur.done) return;
      // Кто берёт раунд — зависит от силы
      const winChance = team === 'h'
        ? this.homeStrength / (this.homeStrength + this.awayStrength)
        : this.awayStrength / (this.homeStrength + this.awayStrength);
      if(this.rng() > winChance) return;
      // Раунд выигран
      if(team === 'h') cur.h++;
      else cur.a++;
      // Матч завершается если кто-то достиг 16
      if(cur.h >= 16 || cur.a >= 16 || cur.h + cur.a >= 30){
        cur.done = true;
        const w = cur.h > cur.a ? 'h' : 'a';
        if(w === 'h') this.hs++;
        else this.as++;
        const wN = w === 'h' ? this.home : this.away;
        this.pushEvent({
          type:'MAP_END', min:map, team:w,
          text:`🗺️ <b>Карта ${map}</b>: ${wN} ${cur.h}:${cur.a}`,
          highlight:true,
        });
        this.setCommentary(`🗺️ Карта ${map} взята: <b>${wN}</b> ${cur.h}:${cur.a}.`);
        this.setLiveMoment(`🗺️ Карта ${map}`, `${wN} ${cur.h}:${cur.a}`);
        this.suspend(2000);

        // BO3 — если 2:0 или 2:1
        if(this.hs === 2 || this.as === 2 || this.mapScores.length >= 3){
          setTimeout(() => this.finishCyber(), 2000);
        }
      }
      break;
    }
    case 'MAP_END': {
      // Просто закрываем карту принудительно если долго
      if(!cur.done && cur.h + cur.a >= 25){
        // Решаем по разнице
        const w = cur.h >= cur.a ? 'h' : 'a';
        cur.done = true;
        if(w === 'h') this.hs++;
        else this.as++;
        const wN = w === 'h' ? this.home : this.away;
        this.pushEvent({
          type:'MAP_END', min:map, team:w,
          text:`🗺️ Карта ${map}: ${wN} ${cur.h}:${cur.a}`,
          highlight:true,
        });
        if(this.hs === 2 || this.as === 2){
          setTimeout(() => this.finishCyber(), 1500);
        }
      }
      break;
    }
  }
};

Match.prototype.finishCyber = function(){
  if(this.finished) return;
  const winner = this.hs > this.as ? 'h' : 'a';
  const wN = winner === 'h' ? this.home : this.away;
  const loser = winner === 'h' ? 'a' : 'h';

  // Формируем строку со счётом по картам
  const scoreStr = this.mapScores.map(m => `${m.h}:${m.a}`).join(', ');
  const mapWon = this.mapScores.filter(m => {
    if(winner === 'h') return m.h > m.a;
    return m.a > m.h;
  }).length;

  this.finalNote = `🏁 ${wN} побеждает ${this.hs}:${this.as} (${scoreStr})`;

  this.finished = true;
  this.finishedAt = Date.now();
  for(const mk of Object.values(this.markets)){
    mk.closed = mk.lbl.map(() => true);
  }
  this.pushEvent({type:'FULL_TIME', min:3, team:winner, text:this.finalNote, highlight:true});
  this.setCommentary(this.finalNote);
  this.setLiveMoment('🏁 Матч завершён', `${wN} ${this.hs}:${this.as}`);

  if(window.saveToHistory) window.saveToHistory(this);
  if(window.checkCoupon) window.checkCoupon(this);
};

/* Расширяем execute для UFC и кибер */
const _origExecute = Match.prototype.execute;
Match.prototype.execute = function(type, team){
  if(this.sport === 'ufc')   return this.executeUfc(type, team);
  if(this.sport === 'cyber') return this.executeCyber(type, team);
  return _origExecute.call(this, type, team);
};

/* ============================================================
   КЭФЫ UFC / КИБЕР — свои расчёты
   ============================================================ */
const _origCalcMarket = Match.prototype.calcMarket;
Match.prototype.calcMarket = function(name, mk, ctx){
  const S = this.sport;
  const {remain, lead, total} = ctx;

  /* ---------- UFC ---------- */
  if(S === 'ufc'){
    const t = this.gameTime();  // 0..5
    const round = Math.min(5, Math.floor(t) + 1);
    const inRound = t - (round - 1); // 0..1

    switch(mk.type){
      case 'overR': {
        if(t > mk.line) return [1.00, 1.00];

        // Ожидание: сколько раундов ещё будет
        const remaining = 5 - t;
        // Реалистичный шанс — бой обычно длится 3-5 раундов
        // Если сейчас 1-й раунд — вер. что дойдёт до 2.5 ≈ 65%
        let pOver;
        if(mk.line === 1.5){
          pOver = t < 1 ? 0.72 : t < 2 ? 0.90 : 0.97;
        } else if(mk.line === 2.5){
          pOver = t < 1 ? 0.48 : t < 2 ? 0.72 : t < 3 ? 0.92 : 0.97;
        } else if(mk.line === 3.5){
          pOver = t < 1 ? 0.30 : t < 2 ? 0.45 : t < 3 ? 0.68 : t < 4 ? 0.90 : 0.97;
        } else {
          pOver = t < 2 ? 0.18 : t < 3 ? 0.28 : t < 4 ? 0.42 : t < 5 ? 0.68 : 0.97;
        }
        pOver = clamp(pOver, 0.02, 0.98);
        const mg = 1.06;
        return [clamp(1/pOver/mg,1.02,99), clamp(1/(1-pOver)/mg,1.02,99)];
      }
      case 'method': {
        // idx 0 = KO/TKO, idx 1 = Сабмишен, idx 2 = Решение
        // Чем позже — тем выше шанс решения
        const pDecision = clamp(0.20 + t * 0.14, 0.20, 0.88);
        const pKO = (1 - pDecision) * 0.65;
        const pSub = (1 - pDecision) * 0.35;
        const mg = 1.06;
        return [
          clamp(1/Math.max(pKO,0.02)/mg,1.02,99),
          clamp(1/Math.max(pSub,0.02)/mg,1.02,99),
          clamp(1/Math.max(pDecision,0.02)/mg,1.02,99),
        ];
      }
      case 'round': {
        // Раунд победы — падает по секундам
        return mk.lbl.map((l, i) => {
          const r = i + 1;
          if(t >= r) return 1.02;   // раунд прошёл
          const leftRounds = r - t;
          let p;
          if(r === 1) p = 0.35 * (1 - inRound) + 0.15;
          else if(r === 2) p = 0.25 * (1 - Math.max(0, t - 1)) + 0.12;
          else if(r === 3) p = 0.20 * (1 - Math.max(0, t - 2)) + 0.10;
          else if(r === 4) p = 0.15 * (1 - Math.max(0, t - 3)) + 0.08;
          else p = 0.12;
          p = clamp(p, 0.02, 0.85);
          return clamp(1/p/1.08, 1.02, 99);
        });
      }
      case 'win': {
        // Победитель боя — меняется от статистики
        const hitsH = this.stats.hits.h;
        const hitsA = this.stats.hits.a;
        const totalHits = hitsH + hitsA;
        let pH;
        if(totalHits > 5){
          pH = 0.5 + (hitsH - hitsA) / (totalHits * 2) + (this.homeStrength - this.awayStrength) * 0.1;
        } else {
          pH = this.homeStrength / (this.homeStrength + this.awayStrength);
        }
        pH = clamp(pH, 0.05, 0.95);
        const pA = 1 - pH;
        const mg = 1.05;
        return [clamp(1/pH/mg,1.02,99), clamp(1/pA/mg,1.02,99)];
      }
      case 'hits': {
        const h = this.stats.hits.h + this.stats.hits.a;
        if(h > mk.line) return [1.00, 1.00];
        const proj = h + (5 - t) * 35;
        const pO = clamp(1/(1+Math.exp(-(proj-mk.line)*0.05)), 0.05, 0.95);
        const mg = 1.06;
        return [clamp(1/pO/mg,1.02,99), clamp(1/(1-pO)/mg,1.02,99)];
      }
      case 'btts': {
        // Универсально: Да/Нет — в зависимости от name
        if(name.includes('решения')){
          // Бой дойдёт до решения
          const pYes = clamp(0.20 + t * 0.14, 0.20, 0.88);
          const mg = 1.06;
          return [clamp(1/pYes/mg,1.02,99), clamp(1/(1-pYes)/mg,1.02,99)];
        }
        if(name.includes('Досрочно')){
          const pYes = clamp(0.80 - t * 0.14, 0.12, 0.80);
          const mg = 1.06;
          return [clamp(1/pYes/mg,1.02,99), clamp(1/(1-pYes)/mg,1.02,99)];
        }
        if(name.includes('нокдауна')){
          const pYes = 0.30;
          const mg = 1.06;
          return [clamp(1/pYes/mg,1.02,99), clamp(1/(1-pYes)/mg,1.02,99)];
        }
      }
    }
  }

  /* ---------- КИБЕР ---------- */
  if(S === 'cyber'){
    const t = this.gameTime();     // 0..3
    const map = Math.min(3, Math.floor(t) + 1);
    const curMap = this.mapScores[map - 1] || {h:0, a:0};

    switch(mk.type){
      case 'over': {
        if(total > mk.line) return [1.00, 1.00];
        // BO3 — 2 или 3 карты
        const remaining = 1 - this.progress();
        // Шанс что будет 3-я карта
        let pOver;
        if(mk.line === 2.5){
          // Будет ли 3-я карта
          if(this.hs === 1 && this.as === 0) pOver = 0.55;
          else if(this.hs === 0 && this.as === 1) pOver = 0.55;
          else if(this.hs === 1 && this.as === 1) return [1.00, 1.00];
          else pOver = 0.50;
        } else {
          pOver = 0.5;
        }
        pOver = clamp(pOver, 0.05, 0.95);
        const mg = 1.06;
        return [clamp(1/pOver/mg,1.02,99), clamp(1/(1-pOver)/mg,1.02,99)];
      }
      case 'hand1':
      case 'hand2': {
        const score = mk.type === 'hand1' ? this.hs - this.as : this.as - this.hs;
        const adj = score + mk.line;
        const p = clamp(0.5 + adj*0.35 + (1-remain)*0.15, 0.03, 0.97);
        if(adj > 0 && remain < 0.1) return [1.00, 1.00];
        const mg = 1.06;
        return [clamp(1/p/mg,1.02,99), clamp(1/(1-p)/mg,1.02,99)];
      }
      case 'win': {
        // Победа в матче — от счёта карт + текущая карта
        let pH = 0.5;
        // Счёт карт — главное
        if(this.hs === 2) pH = 0.98;
        else if(this.as === 2) pH = 0.02;
        else if(this.hs === 1 && this.as === 0) pH = 0.75;
        else if(this.hs === 0 && this.as === 1) pH = 0.25;
        // Скорректировать по текущей карте
        if(curMap && (curMap.h + curMap.a) > 3){
          const mapLead = (curMap.h - curMap.a) * 0.03;
          pH = clamp(pH + mapLead, 0.02, 0.98);
        }
        // Базовая сила
        const baseStrength = this.homeStrength / (this.homeStrength + this.awayStrength);
        pH = clamp(pH * 0.7 + baseStrength * 0.3, 0.02, 0.98);
        const mg = 1.05;
        return [clamp(1/pH/mg,1.02,99), clamp(1/(1-pH)/mg,1.02,99)];
      }
      case 'frags': {
        const f = this.stats.frags.h + this.stats.frags.a;
        if(f > mk.line) return [1.00, 1.00];
        const proj = f + (1 - this.progress()) * 60;
        const pO = clamp(1/(1+Math.exp(-(proj-mk.line)*0.1)), 0.05, 0.95);
        const mg = 1.06;
        return [clamp(1/pO/mg,1.02,99), clamp(1/(1-pO)/mg,1.02,99)];
      }
      case 'exact': {
        // Счёт по картам
        return mk.lbl.map((l, i) => {
          const cur = `${this.hs}:${this.as}`;
          if(l === cur) return 1.05;
          if(this.finished) return 99;
          return clamp(mk.val[i] * (0.85 + remain*0.4), 1.5, 99);
        });
      }
      case 'btts': {
        if(name.includes('карты')){
          // Обе карты
          const pYes = clamp(0.35 + (1 - this.progress()) * 0.4, 0.1, 0.85);
          const mg = 1.06;
          return [clamp(1/pYes/mg,1.02,99), clamp(1/(1-pYes)/mg,1.02,99)];
        }
      }
    }
  }

  return _origCalcMarket.call(this, name, mk, ctx);
};

/* ---------- РАСШИРЕНИЕ displayClock ---------- */
const _origDisplayClock = Match.prototype.displayClock;
Match.prototype.displayClock = function(){
  if(this.sport !== 'ufc' && this.sport !== 'cyber'){
    return _origDisplayClock.call(this);
  }
  if(this.finished) return 'FT';
  if(this.isOnBreak()){
    const left = Math.ceil((this.breakEndAt - Date.now()) / 1000);
    return `⏸ ${left}с`;
  }
  const S = this.sport;
  const t = this.gameTime();

  if(S === 'ufc'){
    const round = Math.min(5, Math.floor(t) + 1);
    const inR = t - (round - 1);
    const totalSec = 5 * 60;
    const left = Math.floor((1 - inR) * totalSec);
    const mm = Math.floor(left / 60);
    const ss = left % 60;
    return `R${round} · ${pad2(mm)}:${pad2(ss)}`;
  }
  if(S === 'cyber'){
    const map = Math.min(3, Math.floor(t) + 1);
    const curMap = this.mapScores[map - 1] || {h:0, a:0};
    return `Карта ${map} · ${curMap.h}:${curMap.a}`;
  }
  return '00:00';
};

/* ---------- РАСШИРЕНИЕ stageLabel ---------- */
const _origStageLabel = Match.prototype.stageLabel;
Match.prototype.stageLabel = function(){
  const S = this.sport;
  const t = this.gameTime();

  if(S === 'ufc'){
    const round = Math.min(5, Math.floor(t) + 1);
    return `Раунд ${round}/5 · Лёгкий`;
  }
  if(S === 'cyber'){
    const map = Math.min(3, Math.floor(t) + 1);
    return `Карта ${map}/3`;
  }
  return _origStageLabel.call(this);
};

/* ---------- РАСШИРЕНИЕ catchUp для UFC и кибера ---------- */
const _origCatchUp = Manager.catchUp;
Manager.catchUp = function(m){
  if(m.sport === 'ufc'){
    const p = m.progress();
    if(p > 0){
      const roundsPlayed = Math.floor(p * 5);
      m.stats.rounds.h = Math.floor(roundsPlayed / 2);
      m.stats.rounds.a = roundsPlayed - m.stats.rounds.h;
      m.stats.hits.h = Math.round(p * 60);
      m.stats.hits.a = Math.round(p * 55);
    }
    return;
  }
  if(m.sport === 'cyber'){
    const p = m.progress();
    if(p > 0){
      const mapsPlayed = Math.floor(p * 3);
      for(let i=0; i<mapsPlayed; i++){
        const h = 16;
        const a = Math.floor(m.rng() * 12);
        m.mapScores.push({h, a, done:true});
        if(h > a) m.hs++; else m.as++;
      }
      m.stats.frags.h = Math.round(p * 50);
      m.stats.frags.a = Math.round(p * 48);
    }
    return;
  }
  return _origCatchUp.call(Manager, m);
};

/* ---------- STATE ---------- */
const State = {
  balance: 10000,
  coupon: [],
  betType: 'single',
  history: [],
  matchHistory: [],

  lastBonusDate: '',
};

function loadState(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return;
    const d = JSON.parse(raw);
    if(typeof d.balance === 'number') State.balance = d.balance;
    if(Array.isArray(d.history)) State.history = d.history;
    if(Array.isArray(d.matchHistory)) State.matchHistory = d.matchHistory;
    const today = new Date().toDateString();
    if(d.dailyDate === today){
      State.dailyDate = d.dailyDate;
      State.dailyAmount = d.dailyAmount || 0;
    } else {
      State.dailyDate = today;
      State.dailyAmount = 0;
    }
    State.lastBonusDate = d.lastBonusDate || '';
  } catch(e){}
}
function saveState(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      balance: State.balance,
      history: State.history.slice(0, 100),
      matchHistory: State.matchHistory.slice(0, 50),
      dailyDate: State.dailyDate,
      dailyAmount: State.dailyAmount,
      lastBonusDate: State.lastBonusDate,
    }));
  } catch(e){}
}

/* ---------- RIPPLE ---------- */
document.addEventListener('click', e => {
  const btn = e.target.closest('.odd, .mkt-odd, .fchip, .hbtn, .cp-place, .mdl-x, .mc-hint');
  if(!btn) return;
  const rect = btn.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  const ripple = document.createElement('span');
  ripple.className = 'ripple';
  ripple.style.width = ripple.style.height = size + 'px';
  ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
  ripple.style.top = (e.clientY - rect.top - size/2) + 'px';
  btn.appendChild(ripple);
  setTimeout(() => ripple.remove(), 600);
});

function renderMatchesList(){
  const box = $('matchesList');

  if(State.currentSport === 'live') list = list.filter(m => !m.finished);
  else if(State.currentSport !== 'all') list = list.filter(m => m.sport === State.currentSport);

  if(State.sort === 'live') list.sort((a,b)=>(a.finished?1:0)-(b.finished?1:0));

  const title = State.currentSport === 'all' ? 'Все матчи'
    : State.currentSport === 'live' ? 'LIVE матчи'

function renderMatchCard(m){
  const ic = SPORTS.find(s => s.id === m.sport)?.ic || '🏆';
  const live = !m.finished;
  const homeWin = m.finished && m.hs > m.as;
  const awayWin = m.finished && m.as > m.hs;

  // Главные 3 кэфа
  const mainMktName = m.markets['1X2'] ? '1X2' : 'Победитель';
  const mkt = m.markets[mainMktName];
  let oddsHTML = '';
  if(mkt){
    oddsHTML = mkt.lbl.map((l,i) => {
      const sel = State.coupon.find(c => c.matchId === m.id && c.market === mainMktName && c.pickIdx === i);
      const closed = mkt.closed[i];
      return `<div class="odd ${sel?'sel':''} ${closed?'cl':''}" data-mid="${m.id}" data-mkt="${mainMktName}" data-pick="${i}">
        <span class="olbl">${esc(l)}</span>
        <span class="oval" data-key="${m.id}_${mainMktName}_${i}">${mkt.val[i].toFixed(2)}</span>
      </div>`;
    }).join('');
  }

  // Счёт-надпись
  const scoreH = live || m.finished ? m.hs : '';
  const scoreA = live || m.finished ? m.as : '';

  return `
    <div class="mc ${live?'live':''}">
      <div class="mc-head">
        <div class="mc-league">${ic} <span>${esc(m.league)}</span></div>
        <div class="mc-status ${live?'live':''}">${live ? m.displayClock() : 'FT'}</div>
      </div>
      <div class="mc-teams">
        <div class="mc-team">
          <div class="mc-tn">
            <div class="lg-wrap">${renderLogo(m.home)}</div>
            <span>${esc(m.home)}</span>
          </div>
          <div class="mc-score ${homeWin?'w':''}">${scoreH}</div>
        </div>
        <div class="mc-team">
          <div class="mc-tn">
            <div class="lg-wrap">${renderLogo(m.away)}</div>
            <span>${esc(m.away)}</span>
          </div>
          <div class="mc-score ${awayWin?'w':''}">${scoreA}</div>
        </div>
      </div>
      <div class="mc-odds">${oddsHTML}</div>
      <div class="mc-hint" data-mid="${m.id}">Тапни — открыть все рынки</div>
    </div>
  `;
}

function updateOddsInMarkets(){
  const m = currentMatch();
  if(!m) return;
  $$('#marketsContainer .mkt-oval').forEach(el => {
    const key = el.dataset.key;
    if(!key) return;
    const parts = key.split('_');
    const mid = parseInt(parts[0]);
    const pickIdx = parseInt(parts[parts.length-1]);
    const mktName = parts.slice(1, -1).join('_');
    const match = Manager.find(mid);
    if(!match || !match.markets[mktName]) return;
    const newVal = match.markets[mktName].val[pickIdx];
    const oldVal = parseFloat(el.textContent);
    if(Math.abs(newVal - oldVal) > 0.005){
      el.classList.remove('up','dn');
      void el.offsetWidth;
      el.classList.add(newVal > oldVal ? 'up' : 'dn');
      el.textContent = newVal.toFixed(2);
    }
  });
}

/* ---------- PITCH ---------- */
let lastT = 0;
function pitchLoop(t){
  window._raf = requestAnimationFrame(pitchLoop);
  if(!lastT) lastT = t;
  const dt = Math.min(0.05, (t-lastT)/1000);
  lastT = t;
  const m = currentMatch();
  if(!m) return;
  if(m.ball){
    const k = 1 - Math.pow(0.001, dt);
    m.ball.x += (m.ball.tx - m.ball.x) * k;
    m.ball.y += (m.ball.ty - m.ball.y) * k;
  }
  m.players.forEach(p => {
    const pull = 0.08;
    const tx = p.baseX + (m.ball.x - p.baseX) * pull;
    const ty = p.baseY + (m.ball.y - p.baseY) * pull;
    const k2 = 1 - Math.pow(0.02, dt);
    p.x += (tx - p.x) * k2;
    p.y += (ty - p.y) * k2;
  });
  renderPitch();
}

function renderPitch(){
  const m = currentMatch();
  if(!m) return;
  const svg = $('pitchSvg');
  if(!svg) return;
  const g = svg.querySelector('#pitchPlayers');
  const b = svg.querySelector('#pitchBall');
  if(!g || !b) return;

  const rect = svg.querySelector('rect');
  if(rect) rect.setAttribute('fill', m.sport === 'hockey' ? '#0d1f2e' : '#0d2818');

  if(g.childElementCount !== m.players.length){
    g.innerHTML = '';
    m.players.forEach(() => {
      const gg = document.createElementNS('http://www.w3.org/2000/svg','g');
      const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
      c.setAttribute('r','13'); c.setAttribute('stroke-width','2');
      const t = document.createElementNS('http://www.w3.org/2000/svg','text');
      t.setAttribute('text-anchor','middle'); t.setAttribute('dy','4');
      t.setAttribute('font-size','10'); t.setAttribute('font-weight','900');
      t.setAttribute('fill','#0f1e35');
      gg.appendChild(c); gg.appendChild(t);
      g.appendChild(gg);
    });
  }

  m.players.forEach((p,i)=>{
    const gg = g.children[i];
    if(!gg) return;
    gg.setAttribute('transform',`translate(${p.x.toFixed(1)} ${p.y.toFixed(1)})`);
    const c = gg.children[0];
    const t = gg.children[1];
    c.setAttribute('fill', p.team === 'h' ? '#ffd94a' : '#4a90e2');
    c.setAttribute('stroke', p.team === 'h' ? '#a89020' : '#2a5a9e');
    t.textContent = p.num;
  });

  b.setAttribute('transform',`translate(${m.ball.x.toFixed(1)} ${m.ball.y.toFixed(1)})`);
  b.style.display = m.players.length ? '' : 'none';
}

/* ---------- ПРОВЕРКА КУПОНА ---------- */
function checkCoupon(match){
  State.history.forEach(h => {
    if(h.status !== 'pending') return;
    h.bets.forEach(b => {
      if(b.matchId === match.id && !b.result){
        const mk = match.markets[b.market];
        if(!mk){ b.result = 'lose'; return; }
        b.result = determineResult(mk, b.pickIdx, match);
      }
    });
    if(h.bets.every(b => b.result)){
      const allWin = h.bets.every(b => b.result === 'win');
      h.status = allWin ? 'win' : 'lose';
      if(allWin){
        State.balance += h.potential;
        updateBalance();
        toast(`🎉 Купон! +${fmtMoney(h.potential)}`,'ok');
      }
      saveState();
    }
  });
}
window.checkCoupon = checkCoupon;

function determineResult(mk, idx, m){
  if(!mk) return 'lose';
  const h = m.hs, a = m.as, t = h+a;
  switch(mk.type){
    case '1x2':
      if(idx===0) return h>a?'win':'lose';
      if(idx===1) return h===a?'win':'lose';
      return a>h?'win':'lose';
    case 'dc':
      if(idx===0) return h>=a?'win':'lose';
      if(idx===1) return h!==a?'win':'lose';
      return a>=h?'win':'lose';
    case 'win':
      return idx===0 ? (h>a?'win':'lose') : (a>h?'win':'lose');
    case 'over':
      return ((t>mk.line)===(idx===0))?'win':'lose';
    case 'overR':{
      const rounds = m.stats.rounds ? (m.stats.rounds.h + m.stats.rounds.a) : 0;
      const totalRounds = rounds || Math.min(5, Math.floor(m.gameTime()));
      return ((totalRounds>mk.line)===(idx===0))?'win':'lose';
    }
    case 'btts':{
      const both = h>0 && a>0;
      return ((idx===0)===both)?'win':'lose';
    }
    case 'itb1': return ((h>mk.line)===(idx===0))?'win':'lose';
    case 'itb2': return ((a>mk.line)===(idx===0))?'win':'lose';
    case 'hand1': return ((h+mk.line-a>0)===(idx===0))?'win':'lose';
    case 'hand2': return ((a+mk.line-h>0)===(idx===0))?'win':'lose';
    case 'parity': return ((t%2===0)===(idx===0))?'win':'lose';
    case 'corners':{
      const c = m.stats.corners.h+m.stats.corners.a;
      return ((c>mk.line)===(idx===0))?'win':'lose';
    }
    case 'cards':{
      const c = m.stats.yellow.h+m.stats.yellow.a+(m.stats.red.h+m.stats.red.a)*2;
      return ((c>mk.line)===(idx===0))?'win':'lose';
    }
    case 'shots':{
      const s = m.stats.shots.h+m.stats.shots.a;
      return ((s>mk.line)===(idx===0))?'win':'lose';
    }
    case 'hits':{
      const hits = m.stats.hits.h+m.stats.hits.a;
      return ((hits>mk.line)===(idx===0))?'win':'lose';
    }
    case 'frags':{
      const f = m.stats.frags.h+m.stats.frags.a;
      return ((f>mk.line)===(idx===0))?'win':'lose';
    }
    case 'method':{
      // KO/TKO idx=0, Сабмишен idx=1, Решение idx=2
      const note = m.finalNote || '';
      if(idx===0) return note.includes('KO/TKO') || note.includes('KO') ? 'win' : 'lose';
      if(idx===1) return note.includes('Сабмишен') ? 'win' : 'lose';
      if(idx===2) return note.includes('решением') ? 'win' : 'lose';
    }
    case 'round':{
      const note = m.finalNote || '';
      const match = note.match(/раунде (\d)/i);
      const r = match ? match[1] : '';
      return mk.lbl[idx] === r ? 'win' : 'lose';
    }
    case 'exact':
      return mk.lbl[idx] === `${h}:${a}` ? 'win' : 'lose';
  }
  return 'lose';
}

/* ---------- КЭШАУТ ---------- */
function calcCashout(h){
  if(h.status !== 'pending' || !h.bets.length) return 0;
  if(h.type === 'single') return calcSingle(h, h.bets[0]);
  return calcExpress(h);
}
function calcSingle(h, b){
  const m = Manager.find(b.matchId);
  if(!m) return h.stake*0.5;
  const mk = m.markets[b.market];
  if(!mk) return h.stake*0.5;
  if(mk.closed && mk.closed[b.pickIdx]) return mk.result==='win' ? h.potential*0.98 : 0;
  let o = mk.val[b.pickIdx]; if(!o || o<1.01) o = 1.01;
  const p = 1/o;
  let c = h.potential * p * 0.94;
  c = Math.min(c, h.potential*0.98);
  c = Math.max(c, h.stake*0.3);
  return Math.max(0, Math.round(c/10)*10);
}
function calcExpress(h){
  let prob = 1, anyLose = false, allWon = true;
  for(const b of h.bets){
    const m = Manager.find(b.matchId);
    if(!m){ prob*=0.5; continue; }
    const mk = m.markets[b.market];
    if(!mk){ prob*=0.5; continue; }
    if(mk.closed && mk.closed[b.pickIdx]){
      if(mk.result==='win') continue;
      anyLose = true; break;
    }
    allWon = false;
    let o = mk.val[b.pickIdx]; if(!o || o<1.01) o = 1.01;
    prob *= 1/o;
  }
  if(anyLose) return 0;
  if(allWon) return h.potential * 0.97;
  let c = h.potential * prob * 0.92;
  c = Math.min(c, h.potential*0.97);
  c = Math.max(c, h.stake*0.25);
  return Math.max(0, Math.round(c/10)*10);
}

function doCashout(id){
  const h = State.history.find(x=>x.id===id);
  if(!h || h.status!=='pending'){ toast('Недоступно','err'); return; }
  const amt = calcCashout(h);
  if(amt <= 0){ toast('Кэшаут недоступен','err'); return; }
  if(!confirm(`Кэшаут ${fmtMoney(amt)}?`)) return;
  h.status = 'cashout';
  h.cashoutAmount = amt;
  State.balance += amt;
  updateBalance();
  saveState();
  toast(`💰 Кэшаут +${fmtMoney(amt)}`,'ok');
  openHistory();
}

function updateCashouts(){
  let changed = false;
  State.history.forEach(h => {
    if(h.status !== 'pending') return;
    const a = calcCashout(h);
    if(a !== h.cashoutAmount){ h.cashoutAmount = a; changed = true; }
  });
  if(changed) saveState();
}
