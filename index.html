<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1a1c2e">
<title>⚡ OpenBet</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
input{outline:none}
:root{--bg:#f4f5f8;--card:#fff;--border:#e8eaf0;--text:#0d0e1c;--text-2:#4a4d63;--muted:#878a9e;--accent:#e60023;--green:#00a854;--gold:#f0b400;--header:#1a1c2e;--odd:#f0f2f6}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.coupon-open{overflow:hidden}
.top-header{position:sticky;top:0;z-index:100;background:var(--header);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:60px}
.top-header .title{font-size:22px;font-weight:800;letter-spacing:-.4px}
.top-header .title.center{flex:1;text-align:center}
.top-header .action-btn{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;transition:background .15s}
.top-header .action-btn:hover{background:rgba(255,255,255,.18)}
.top-header .action-btn.with-dot{position:relative}
.top-header .action-btn.with-dot::after{content:'';position:absolute;top:6px;right:6px;width:8px;height:8px;background:var(--accent);border-radius:50%;border:1.5px solid var(--header)}
.top-header .back-btn{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff}
.sport-tabs{background:#fff;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;position:sticky;top:60px;z-index:99}
.sport-tabs::-webkit-scrollbar{display:none}
.sport-tabs-inner{display:flex;padding:0 8px;min-width:max-content}
.sport-tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 18px;font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px}
.sport-tab.active{color:var(--text);border-bottom-color:var(--accent)}
.sport-tab .icon{font-size:22px;line-height:1}
.sport-tab .count{font-size:10px;font-weight:500}
.sport-tab.active .count{color:var(--accent)}
.filter-row{background:#fff;padding:12px 16px;display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--border)}
.filter-row::-webkit-scrollbar{display:none}
.filter-chip{padding:8px 16px;border-radius:20px;background:#f0f2f6;font-size:13px;font-weight:600;color:var(--text-2);white-space:nowrap;display:flex;align-items:center;gap:6px}
.filter-chip.active{background:var(--accent);color:#fff}
.filter-chip .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.filter-chip.active .dot{background:#fff}
.main{padding-bottom:80px}
.league-block{background:#fff;margin-bottom:8px}
.league-head{background:#eef0f5;padding:10px 16px;display:flex;align-items:center;gap:10px}
.league-head .league-icon{width:26px;height:26px;border-radius:4px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:14px}
.league-head .league-name{font-size:13px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.league-head .league-filter{font-size:16px;color:var(--muted);padding:4px}
.match-row{display:grid;grid-template-columns:18px 1fr 60px 60px 60px;border-bottom:1px solid var(--border);background:#fff;cursor:pointer;position:relative}
.match-row:last-child{border-bottom:none}
.match-row .arrow{color:#c0c4d0;font-size:16px;display:flex;align-items:center;justify-content:center;padding-left:4px}
.match-row .teams{display:flex;flex-direction:column;gap:3px;min-width:0;padding:12px 8px 12px 4px;position:relative}
.match-row .team-line{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;overflow:hidden}
.match-row .team-logo{width:18px;height:18px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;color:#fff}
.match-row .team-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.match-row .team-score{font-weight:800;font-size:14px;margin-left:auto;padding-left:6px}
.match-row .team-score.red{color:var(--accent)}
.match-row .time{font-size:11px;color:var(--muted);font-weight:500;padding-left:26px;margin-top:2px;display:flex;align-items:center;gap:4px}
.match-row .time.live{color:var(--green);font-weight:700}
.match-row .time .live-dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
.odd-cell{display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;border-left:1px solid var(--border);cursor:pointer;min-height:60px;padding:8px 4px;transition:background .12s}
.odd-cell:hover{background:#e5e8ef}
.odd-cell.selected{background:var(--accent);color:#fff}
.odd-cell.dash{color:#c0c4d0;cursor:default}
.odd-cell.dash:hover{background:transparent}
.show-all{display:block;margin:12px 16px;padding:14px;text-align:center;background:#fff;border-radius:12px;font-size:14px;font-weight:600;border:1px solid var(--border);width:calc(100% - 32px)}
.match-header{padding:16px;background:linear-gradient(180deg,#3a3d52 0%,#282a3d 100%);color:#fff}
.match-header .crumbs{font-size:11px;color:rgba(255,255,255,.6);margin-bottom:6px}
.match-header .league-line{display:flex;justify-content:space-between;font-size:15px;font-weight:700;margin-bottom:14px}
.match-header .updown{background:rgba(255,255,255,.1);border-radius:6px;padding:6px 10px;font-size:13px}
.match-header .match-meta{display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.7);margin-bottom:12px}
.match-header .icons{display:flex;gap:14px;font-size:20px}
.match-header .score-line{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:6px 0}
.match-header .team-big{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700;min-width:0}
.match-header .team-big.right{flex-direction:row-reverse;text-align:right}
.match-header .team-big .logo{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;background:rgba(255,255,255,.15);flex-shrink:0}
.match-header .team-big .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.match-header .score-center{font-size:24px;font-weight:900;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:70px}
.match-header .score-center .timer{font-size:12px;color:rgba(255,255,255,.7);font-weight:600}
.match-header .score-center .timer.live{color:#00e676}
.match-header .half-scores{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.12);font-size:10px;color:rgba(255,255,255,.55);text-align:center}
.match-header .half-scores b{color:#fff;font-weight:800;font-size:14px;display:block;margin-top:2px}
.market-tabs{display:flex;background:#fff;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;position:sticky;top:60px;z-index:50}
.market-tabs::-webkit-scrollbar{display:none}
.market-tabs-inner{display:flex;padding:0 4px;min-width:max-content}
.market-tab{padding:14px 16px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.market-tab.active{color:var(--text);border-bottom-color:var(--text)}
.market-card{background:#fff;margin:8px 8px 0;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(20,20,40,.06)}
.market-card:last-child{margin-bottom:16px}
.market-head{display:flex;align-items:center;padding:14px 16px;cursor:pointer}
.market-head .star{font-size:16px;color:#c0c4d0;margin-right:8px}
.market-head .star.active{color:var(--gold)}
.market-head .title{font-size:15px;font-weight:700;flex:1}
.market-head .chevron{font-size:14px;color:var(--muted)}
.market-card.collapsed .chevron{transform:rotate(180deg)}
.market-card.collapsed .market-body{display:none}
.market-body{padding:0 12px 12px}
.odds-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.odds-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.odds-pair{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.odd-btn{background:var(--odd);border-radius:8px;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;font-weight:700;min-height:48px;text-align:left;transition:background .12s}
.odd-btn:hover:not(.disabled){background:#e5e8ef}
.odd-btn.selected{background:var(--accent);color:#fff}
.odd-btn .lbl{color:var(--muted);font-weight:600;font-size:13px}
.odd-btn.selected .lbl{color:rgba(255,255,255,.85)}
.odd-btn .val{font-weight:800;font-size:15px;margin-left:auto}
.odd-btn.disabled{opacity:.35;cursor:not-allowed}
.odds-labeled{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px}
.odds-labeled .col-head{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;padding:0 4px;margin-bottom:6px}
.line-selector{display:flex;gap:4px;padding:0 0 10px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--border);margin-bottom:10px}
.line-selector::-webkit-scrollbar{display:none}
.line-opt{padding:8px 14px;background:#f0f2f6;border-radius:8px;font-size:13px;font-weight:700;color:var(--text-2);white-space:nowrap;border:1.5px solid transparent}
.line-opt.active{background:#fff;color:var(--text);border-color:var(--text);font-weight:800}
.stat-params{display:flex;background:#fff;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;padding:0 8px}
.stat-params::-webkit-scrollbar{display:none}
.stat-param{padding:12px 14px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.stat-param.active{color:var(--text);border-bottom-color:var(--accent)}
.stat-counter{display:flex;justify-content:center;align-items:center;gap:16px;padding:16px;background:#f8f9fc;border-radius:12px;margin:8px;text-align:center}
.stat-counter .cnt-h,.stat-counter .cnt-a{font-size:26px;font-weight:900;min-width:40px}
.stat-counter .cnt-h{color:var(--accent)}
.stat-counter .lbl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.tab-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr);z-index:200}
.tab-bar-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 8px;font-size:10px;font-weight:600;color:var(--muted);position:relative}
.tab-bar-item.active{color:var(--text)}
.tab-bar-item .tab-icon{font-size:20px;line-height:1}
.tab-bar-item .badge{position:absolute;top:4px;right:calc(50% - 20px);min-width:18px;height:18px;background:var(--accent);color:#fff;border-radius:9px;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px}
.floating-coupon{position:fixed;bottom:70px;left:8px;right:8px;background:#fff;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 32px rgba(20,20,40,.14);z-index:190;cursor:pointer;border:1px solid var(--border)}
.floating-coupon .fc-icon{width:34px;height:34px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;flex-shrink:0}
.floating-coupon .fc-info{flex:1;min-width:0}
.floating-coupon .fc-match{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.floating-coupon .fc-pick{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.floating-coupon .fc-odd{font-size:18px;font-weight:900;flex-shrink:0}
.coupon-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;opacity:0;pointer-events:none;transition:opacity .3s}
.coupon-overlay.active{opacity:1;pointer-events:auto}
.coupon-panel{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:20px 20px 0 0;z-index:310;transform:translateY(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);max-height:88vh;display:flex;flex-direction:column}
.coupon-panel.active{transform:translateY(0)}
.coupon-head{padding:18px 16px 8px;display:flex;align-items:center;gap:12px;position:relative}
.coupon-head .grab{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:36px;height:4px;background:#e0e2ea;border-radius:2px}
.coupon-head .settings{font-size:18px;color:var(--muted);width:32px;height:32px;display:flex;align-items:center;justify-content:center}
.coupon-head .tabs{display:flex;gap:20px;flex:1;justify-content:center}
.coupon-head .ct{font-size:15px;font-weight:600;color:var(--muted);padding-bottom:8px;border-bottom:2px solid transparent}
.coupon-head .ct.active{color:var(--text);border-bottom-color:var(--accent)}
.coupon-head .close-btn{font-size:20px;color:var(--muted);width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:#f0f2f6}
.coupon-body{flex:1;overflow-y:auto;padding:8px 16px 16px}
.coupon-empty{padding:40px 20px;text-align:center;color:var(--muted)}
.coupon-empty .icon{font-size:48px;margin-bottom:12px;opacity:.4}
.coupon-empty .txt{font-size:14px;font-weight:600}
.coupon-item{background:#f8f9fc;border-radius:12px;padding:14px;margin-bottom:10px}
.coupon-item .ci-head{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:8px}
.coupon-item .ci-score{background:#dbeafe;color:#2563eb;font-weight:800;padding:2px 8px;border-radius:4px;font-size:11px}
.coupon-item .ci-league{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.coupon-item .ci-remove{font-size:22px;color:var(--muted);width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.coupon-item .ci-pick{font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.coupon-item .ci-odd{font-size:22px;font-weight:900}
.coupon-type{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.coupon-type .ct-btn{padding:10px 16px;background:#f0f2f6;border-radius:8px;font-size:14px;font-weight:700;color:var(--text-2);border:1.5px solid transparent}
.coupon-type .ct-btn.active{background:#fff;border-color:var(--text);color:var(--text)}
.coupon-type .swap{margin-left:auto;width:36px;height:36px;background:#f0f2f6;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px}
.coupon-stake{display:flex;align-items:stretch;background:#fff;border:1px solid #dfe2ea;border-radius:12px;margin-bottom:8px;overflow:hidden}
.coupon-stake .stake-input{flex:1;padding:14px 16px;font-size:16px;font-weight:700;border:none;background:transparent;width:100%}
.coupon-stake .stake-input::placeholder{color:var(--muted);font-weight:500}
.coupon-stake .stake-right{display:flex;flex-direction:column;justify-content:center;align-items:flex-end;padding:8px 12px;border-left:1px solid var(--border);gap:2px}
.coupon-stake .balance-label{font-size:10px;color:var(--muted);font-weight:500}
.coupon-stake .balance-val{font-size:14px;font-weight:800}
.coupon-stake .add-btn{width:24px;height:24px;background:var(--accent);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;margin-top:2px}
.coupon-limits{display:flex;gap:8px;font-size:11px;color:var(--muted);margin-bottom:12px;padding:0 4px;align-items:center}
.coupon-limits .lmt{padding:6px 10px;background:#f0f2f6;border-radius:6px;font-weight:700;color:var(--text-2)}
.coupon-limits .lmt b{color:var(--text);font-weight:800}
.coupon-limits .settings-btn{margin-left:auto;width:32px;height:32px;background:#f0f2f6;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
.coupon-actions{display:flex;gap:10px;margin-bottom:8px}
.coupon-actions .potential{flex:1;background:#f8f9fc;border-radius:12px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);font-weight:600}
.coupon-actions .potential b{color:var(--text);font-weight:800;font-size:15px}
.coupon-place{width:100%;padding:16px;background:var(--accent);color:#fff;border-radius:12px;font-size:16px;font-weight:800}
.coupon-place:disabled{background:#e0e2ea;color:var(--muted);cursor:not-allowed}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-icon{font-size:56px;margin-bottom:16px;opacity:.4}
.empty-text{font-size:15px;font-weight:600}
.toast-container{position:fixed;top:80px;right:16px;z-index:2000;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:320px}
.toast{background:#1a1c2e;color:#fff;border-radius:12px;padding:14px 18px;font-size:13px;font-weight:600;box-shadow:0 8px 32px rgba(20,20,40,.2);animation:toastIn .3s;pointer-events:auto;display:flex;align-items:center;gap:10px}
.toast.win{background:#00a854}
.toast.lose{background:#e60023}
.toast.gold{background:#f0b400;color:#1a1c2e}
@keyframes toastIn{from{transform:translateX(120%);opacity:0}}
@media(min-width:768px){
  body{max-width:480px;margin:0 auto}
  .tab-bar{max-width:480px;left:50%;transform:translateX(-50%)}
  .floating-coupon{max-width:464px;left:50%;transform:translateX(-50%)}
  .coupon-panel{max-width:480px;left:50%;transform:translateX(-50%) translateY(100%)}
  .coupon-panel.active{transform:translateX(-50%) translateY(0)}
}
</style>
</head>
<body>

<div id="app"></div>
<div class="toast-container" id="toastContainer"></div>
<div class="coupon-overlay" id="couponOverlay"></div>
<div class="coupon-panel" id="couponPanel">
  <div class="coupon-head">
    <div class="grab"></div>
    <button class="settings">⚙️</button>
    <div class="tabs">
      <button class="ct active" data-ctab="coupon">Купон</button>
      <button class="ct" data-ctab="history">История</button>
      <button class="ct" data-ctab="promo">Промо</button>
    </div>
    <button class="close-btn" id="couponClose">✕</button>
  </div>
  <div class="coupon-body" id="couponBody"></div>
</div>

<script>

/* ============================================================
   OpenBet — Real Betting Engine
   ============================================================ */
'use strict';

var $ = function(id) { return document.getElementById(id); };
var rand = function(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; };
var pick = function(a) { return a[rand(0, a.length - 1)]; };
var clamp = function(v, l, h) { return Math.max(l, Math.min(h, v)); };
var fmt = function(v) { return Math.round(v).toLocaleString('ru-RU'); };
var ft = function(s) { s = Math.max(0, s); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
var todayKey = function() { return new Date().toISOString().slice(0, 10); };

var sIcon = function(s) {
  return s === 'football' ? '⚽' : s === 'hockey' ? '🏒' : s === 'volleyball' ? '🏐' : '🥊';
};
var sName = function(s) {
  return s === 'football' ? 'Футбол' : s === 'hockey' ? 'Хоккей' : s === 'volleyball' ? 'Волейбол' : 'UFC';
};
function teamColor(n) {
  var c = ['#e60023', '#00a854', '#2563eb', '#f0b400', '#7c5cff', '#ff6b6b', '#4ecdc4', '#3b82f6'];
  var h = 0;
  for (var i = 0; i < n.length; i++) h = n.charCodeAt(i) + ((h << 5) - h);
  return c[Math.abs(h) % c.length];
}
function teamInit(n) {
  var w = n.split(/\s+/);
  return w.length === 1 ? w[0].slice(0, 2).toUpperCase() : (w[0][0] + w[1][0]).toUpperCase();
}
function pickTwo(a) {
  var x = pick(a), y = pick(a), s = 0;
  while (x.n === y.n && s++ < 100) y = pick(a);
  return [x, y];
}
function poisson(k, l) {
  if (k < 0 || k > 25) return 0;
  if (l <= 0) return k === 0 ? 1 : 0;
  var lf = 0;
  for (var i = 2; i <= k; i++) lf += Math.log(i);
  return Math.exp(k * Math.log(l) - l - lf);
}
function normalCDF(z) {

function footballPhaseIntensity(m) {
  var phase = m.phase, intensity = 1.0, goalBoost = 1.0;
  if (phase === 'calm') { intensity = 0.35; goalBoost = 0.5; }
  else if (phase === 'pressure_home' || phase === 'pressure_away') { intensity = 1.7; goalBoost = 1.9; }
  else if (phase === 'chaos') { intensity = 2.6; goalBoost = 2.4; }
  else if (phase === 'endgame') { intensity = 2.1; goalBoost = 1.7; }
  intensity *= m.baseTempo;
  if (m.minute >= 75 && phase !== 'endgame') { intensity *= 1.4; goalBoost *= 1.35; }
  return { intensity: intensity, goalBoost: goalBoost };
}

function switchFootballPhase(m) {
  m.phaseSecLeft -= 1;
  if (m.phaseSecLeft > 0) return;
  var roll = Math.random();
  var newPhase;
  if (m.minute >= 80) { newPhase = 'endgame'; m.phaseSecLeft = 999; }
  else if (roll < 0.30) { newPhase = 'calm'; m.phaseSecLeft = 18 + rand(0, 25); }
  else if (roll < 0.55) { newPhase = 'pressure_home'; m.phaseSecLeft = 15 + rand(0, 20); }
  else if (roll < 0.80) { newPhase = 'pressure_away'; m.phaseSecLeft = 15 + rand(0, 20); }
  else { newPhase = 'chaos'; m.phaseSecLeft = 12 + rand(0, 15); }
  if (m.redHome) newPhase = 'pressure_away';
  if (m.redAway) newPhase = 'pressure_home';
  m.phase = newPhase;
  if (newPhase === 'calm') m.commentary = 'Игра успокоилась · ' + Math.floor(m.minute) + "'";
  else if (newPhase === 'pressure_home') m.commentary = '🔥 ' + m.home + ' давит';
  else if (newPhase === 'pressure_away') m.commentary = '🔥 ' + m.away + ' давит';
  else if (newPhase === 'chaos') m.commentary = '⚡ Открытый футбол!';
  else if (newPhase === 'endgame') m.commentary = '⏱ Финальный штурм!';
}

function footballLambda(m, side) {
  var base = side === 'home' ? m.homeAtk : m.awayAtk;
  var oppDef = side === 'home' ? m.awayDef : m.homeDef;
  var homeAdv = side === 'home' ? 1.20 : 0.90;
  var lambda = base * oppDef * homeAdv * 1.35;
  if (side === 'home' && m.redHome) lambda *= 0.35;
  if (side === 'away' && m.redAway) lambda *= 0.35;
  var mom = side === 'home' ? m.momentum : -m.momentum;
  lambda *= (1 + mom * 0.35);
  return Math.max(0.05, lambda);
}

function simulateFootball(m) {
  if (m.isBreak) {
    m.breakTimer += 1;
    if (m.breakTimer >= FT_BREAK_SEC) {
      m.isBreak = false; m.half = 2; m.minute = 45;
      m.commentary = '⚽ Второй тайм начался!';
    }
    return;
  }
  m.realTick += 1;
  m.minute += 1 / FT_TICK_PER_MIN;
  m.justScored = null;
  if (m.minute >= 45 && m.half === 1) {
    m.minute = 45; m.isBreak = true; m.breakTimer = 0;
    m.commentary = '⏸ Перерыв. Счёт: ' + m.scoreHome + ':' + m.scoreAway;
    return;
  }
  if (m.minute >= 90) {
    m.minute = 90; m.status = 'finished'; m.finishedAt = Date.now();
    m.commentary = '🏁 Матч завершён: ' + m.scoreHome + ':' + m.scoreAway;
    return;
  }
  switchFootballPhase(m);
  var I = footballPhaseIntensity(m);
  var intensity = I.intensity, goalBoost = I.goalBoost;

  m.nextThrowIn -= intensity * 1.5;
  if (m.nextThrowIn <= 0) {
    if (Math.random() < 0.5) m.throwInsHome++; else m.throwInsAway++;
    m.nextThrowIn = Math.random() < 0.35 ? 8 + rand(0, 25) : 60 + rand(0, 180);
  }
  m.nextGoalKick -= intensity;
  if (m.nextGoalKick <= 0) {
    if (Math.random() < 0.5) m.goalKicksHome++; else m.goalKicksAway++;
    m.nextGoalKick = 90 + rand(0, 240);
  }
  m.nextFoul -= intensity * 1.3;
  if (m.nextFoul <= 0) {
    var side = Math.random() < 0.5 ? 'home' : 'away';
    if (side === 'home') m.foulsHome++; else m.foulsAway++;
    if (Math.random() < 0.10) {
      if (side === 'home') m.cardsHome++; else m.cardsAway++;
      m.commentary = '🟨 Жёлтая — ' + (side === 'home' ? m.home : m.away);
    }
    m.nextFoul = Math.random() < 0.4 ? 15 + rand(0, 40) : 100 + rand(0, 240);
  }
  m.nextCorner -= intensity;
  if (m.nextCorner <= 0) {
    if (Math.random() < 0.5) m.cornersHome++; else m.cornersAway++;
    m.nextCorner = 200 + rand(0, 400);
  }
  m.nextShot -= intensity * 1.4;
  if (m.nextShot <= 0) {
    var s5 = Math.random() < 0.5 ? 'home' : 'away';
    var onT = Math.random() < 0.4;
    if (s5 === 'home') {
      m.shotsHome++; m.xgHome += 0.05 + Math.random() * 0.2;
      if (onT) { m.shotsOnTargetHome++; if (Math.random() < 0.65) m.savesAway++; }
    } else {
      m.shotsAway++; m.xgAway += 0.05 + Math.random() * 0.2;
      if (onT) { m.shotsOnTargetAway++; if (Math.random() < 0.65) m.savesHome++; }
    }
    m.nextShot = 60 + rand(0, 180);
  }
  m.nextOffside -= intensity;
  if (m.nextOffside <= 0) {
    if (Math.random() < 0.5) m.offsidesHome++; else m.offsidesAway++;
    m.nextOffside = 300 + rand(0, 600);
  }

  var targetPoss = 50 + (m.homeAtk - m.awayAtk) * 10;
  if (m.phase === 'pressure_home') targetPoss += 10;
  if (m.phase === 'pressure_away') targetPoss -= 10;
  targetPoss += (m.scoreHome - m.scoreAway) * 3;
  m.possessionHome = Math.round(m.possessionHome * 0.97 + targetPoss * 0.03);
  m.possessionHome = clamp(m.possessionHome, 25, 75);

  var pGoal = 0.0035 * goalBoost;
  var lamH = footballLambda(m, 'home'), lamA = footballLambda(m, 'away');
  var totalLam = lamH + lamA;
  if (totalLam > 0 && Math.random() < pGoal) {
    var pHG = lamH / totalLam;
    if (Math.random() < pHG) {
      m.scoreHome++; m.xgHome += 0.4;
      m.shotsOnTargetHome++;
      m.justScored = 'home';
      m.commentary = '⚽ ГОЛ! ' + m.home + ' — ' + m.scoreHome + ':' + m.scoreAway;
      m.phase = 'pressure_away'; m.phaseSecLeft = 20 + rand(0, 20);
    } else {
      m.scoreAway++; m.xgAway += 0.4;
      m.shotsOnTargetAway++;
      m.justScored = 'away';
      m.commentary = '⚽ ГОЛ! ' + m.away + ' — ' + m.scoreHome + ':' + m.scoreAway;
      m.phase = 'pressure_home'; m.phaseSecLeft = 20 + rand(0, 20);
    }
  }
}

function hockeyLambda(m, side) {
  var base = side === 'home' ? m.homeAtk : m.awayAtk;
  var oppDef = side === 'home' ? m.awayDef : m.homeDef;
  var homeAdv = side === 'home' ? 1.08 : 0.94;
  var lambda = base * (oppDef / 3.0) * homeAdv * 0.55;
  if (side === 'home' && m.penaltyAway > 0) lambda *= 2.8;
  if (side === 'away' && m.penaltyHome > 0) lambda *= 2.8;
  if (side === 'home' && m.emptyNet === 'away') lambda *= 5;
  if (side === 'away' && m.emptyNet === 'home') lambda *= 5;
  return Math.max(0.03, lambda);
}

function simulateHockey(m) {
  if (m.isBreak) {
    m.breakTimer += 1;
    if (m.breakTimer >= HK_BREAK_SEC) {
      m.isBreak = false; m.period += 1; m.periodSec = 0;
      m.penaltyHome = 0; m.penaltyAway = 0; m.emptyNet = null;
      if (m.period > 3) {
        if (m.scoreHome === m.scoreAway) {
          m.overtime = true; m.period = 4;
          m.commentary = '🔥 Овертайм!';
        } else {
          m.status = 'finished'; m.finishedAt = Date.now();
          m.commentary = '🏁 Матч завершён: ' + m.scoreHome + ':' + m.scoreAway;
        }
        return;
      }
    }
    return;
  }
  m.periodSec += 1; m.minute += 1; m.justScored = null;

  if (m.period === 4 && m.periodSec >= 5) {
    var hG = 0, aG = 0;
    for (var i = 0; i < 5; i++) {
      if (Math.random() < 0.35) hG++;
      if (Math.random() < 0.35) aG++;
    }
    var guard = 0;
    while (hG === aG && guard++ < 30) {
      if (Math.random() < 0.4) hG++;
      if (Math.random() < 0.4) aG++;
    }
    if (hG > aG) m.scoreHome++; else m.scoreAway++;
    m.status = 'finished'; m.finishedAt = Date.now();
    m.commentary = '🎯 Буллиты! Победа ' + (hG > aG ? m.home : m.away);
    return;
  }
  if (m.period <= 3 && m.periodSec >= HK_PERIOD_SEC) {
    m.isBreak = true; m.breakTimer = 0;
    m.commentary = '⏸ Перерыв. Счёт: ' + m.scoreHome + ':' + m.scoreAway;
    return;
  }
  if (m.penaltyHome > 0) m.penaltyHome--;
  if (m.penaltyAway > 0) m.penaltyAway--;
  if (m.period === 3 && m.periodSec >= 18 && m.scoreHome !== m.scoreAway) {
    m.emptyNet = m.scoreHome < m.scoreAway ? 'home' : 'away';
  }
  if (Math.random() < 0.03 && m.penaltyHome === 0 && m.penaltyAway === 0) {
    if (Math.random() < 0.5) { m.penaltyHome = 4; m.commentary = '🟨 Удаление — ' + m.home; }
    else { m.penaltyAway = 4; m.commentary = '🟨 Удаление — ' + m.away; }
  }
  var lamH = hockeyLambda(m, 'home') / 60;
  var lamA = hockeyLambda(m, 'away') / 60;
  if (Math.random() < lamH) {
    m.scoreHome++; m.shotsHome++;
    m.justScored = 'home';
    m.commentary = '🏒 ГОЛ! ' + m.home + ' — ' + m.scoreHome + ':' + m.scoreAway;
    if (m.period <= 3) m.periodScores[m.period - 1].h++;
  } else if (Math.random() < lamA) {
    m.scoreAway++; m.shotsAway++;
    m.justScored = 'away';
    m.commentary = '🏒 ГОЛ! ' + m.away + ' — ' + m.scoreHome + ':' + m.scoreAway;
    if (m.period <= 3) m.periodScores[m.period - 1].a++;
  } else {
    if (Math.random() < 0.15) { m.shotsHome++; m.savesAway++; }
    else if (Math.random() < 0.3) { m.shotsAway++; m.savesHome++; }
  }
}

    awayFighter: {power: a.power, acc: a.acc, td: a.td, style: a.style, hpMax: a.hpMax, stamMax: a.stamMax},
    homeHP: h.hpMax, awayHP: a.hpMax,
    homeStam: h.stamMax, awayStam: a.stamMax,
    round: 1, roundSec: 0, minute: 0, maxMinute: UFC_MAX_ROUNDS * UFC_ROUND_SEC,
    phase: 'fight',
    scoreHome: 0, scoreAway: 0, roundScores: [],
    status: 'live', momentum: 0,
    finalResult: null, justScored: null, commentary: 'Начало боя'
  };
}

function simulateUFC(m) {
  if (m.phase === 'break') {
    m.roundSec += 1;
    if (m.roundSec >= UFC_BREAK_SEC) {
      m.phase = 'fight'; m.roundSec = 0;
      m.homeStam = Math.min(m.homeFighter.stamMax, m.homeStam + 18);
      m.awayStam = Math.min(m.awayFighter.stamMax, m.awayStam + 18);
      m.commentary = 'Раунд ' + m.round + ' начинается';
    }
    return;
  }
  m.roundSec += 1; m.minute += 1;
  var hAcc = m.homeFighter.acc * (m.homeStam / m.homeFighter.stamMax);
  var aAcc = m.awayFighter.acc * (m.awayStam / m.awayFighter.stamMax);
  var hPow = m.homeFighter.power * (0.7 + 0.3 * (m.homeStam / m.homeFighter.stamMax));
  var aPow = m.awayFighter.power * (0.7 + 0.3 * (m.awayStam / m.awayFighter.stamMax));

  if (Math.random() < m.homeFighter.td / 100 * 0.05 && m.homeFighter.style !== 'striker') {
    m.awayHP -= hPow * 0.35; m.homeStam -= 2;
    if (Math.random() < 0.10 && m.awayHP < 40) { finishUFC(m, 'home', 'Сабмишн', m.round); return; }
  }
  if (Math.random() < m.awayFighter.td / 100 * 0.05 && m.awayFighter.style !== 'striker') {
    m.homeHP -= aPow * 0.35; m.awayStam -= 2;
    if (Math.random() < 0.10 && m.homeHP < 40) { finishUFC(m, 'away', 'Сабмишн', m.round); return; }
  }
  if (Math.random() < hAcc / 100 * 0.35) {
    if (Math.random() < hAcc / 100 * 0.55) {
      m.awayHP -= hPow * 0.18; m.homeStam -= 1.2; m.awayStam -= 0.8;
      if (Math.random() < 0.02 && m.awayHP < 15) { finishUFC(m, 'home', 'KO/TKO', m.round); return; }
    } else m.homeStam -= 1.5;
  }
  if (Math.random() < aAcc / 100 * 0.35) {
    if (Math.random() < aAcc / 100 * 0.55) {
      m.homeHP -= aPow * 0.18; m.awayStam -= 1.2; m.homeStam -= 0.8;
      if (Math.random() < 0.02 && m.homeHP < 15) { finishUFC(m, 'away', 'KO/TKO', m.round); return; }
    } else m.awayStam -= 1.5;
  }
  if (m.homeStam < 5) m.homeStam = 5;
  if (m.awayStam < 5) m.awayStam = 5;
  if (m.homeHP < 0) m.homeHP = 0;
  if (m.awayHP < 0) m.awayHP = 0;

  if (m.roundSec >= UFC_ROUND_SEC) {
    var diff = (m.homeHP - m.awayHP) + (m.homeStam - m.awayStam) * 0.3;
    var rh = 10, ra = 10;
    if (diff > 15) ra = 8; else if (diff > 3) ra = 9;
    else if (diff < -15) rh = 8; else if (diff < -3) rh = 9;
    m.roundScores.push({h: rh, a: ra});
    if (m.round >= UFC_MAX_ROUNDS) {
      var totH = 0, totA = 0;
      m.roundScores.forEach(function(rs) { totH += rs.h; totA += rs.a; });
      finishUFC(m, totH >= totA ? 'home' : 'away', 'Решение', 5);
      return;
    }
    m.round++; m.phase = 'break'; m.roundSec = 0;
    m.commentary = 'Перерыв. Раунд ' + (m.round - 1) + ' завершён';
  }
}

function finishUFC(m, winner, method, round) {
  m.finalResult = {winner: winner, method: method, round: round};
  if (winner === 'home') m.scoreHome = 1; else m.scoreAway = 1;
  m.status = 'finished'; m.finishedAt = Date.now();
  m.commentary = '🏆 ' + (winner === 'home' ? m.home : m.away) + ' · ' + method + ' · R' + round;
}

/* ============ ВОЛЕЙБОЛ ============ */
function newVolleyball() {
  var pair = pickTwo(VOLLEYBALL);
  var h = pair[0], a = pair[1];
  return {
    id: STATE.nextId++, sport: 'volleyball', league: h.lg,
    home: h.n, away: a.n,
    homeAtk: h.atk, awayAtk: a.atk,
    homeServe: h.serve, awayServe: a.serve,
    homeBlock: h.block, awayBlock: a.block,
    homeRating: h.rt, awayRating: a.rt,
    homeCountry: h.country, awayCountry: a.country,
    setsHome: 0, setsAway: 0, pointsHome: 0, pointsAway: 0,
    setHistory: [], roundSec: 0, minute: 0, maxMinute: 2400,
    serving: 'home',
    status: 'live', momentum: 0, justScored: null,
    commentary: 'Матч начинается'
  };
}

function simulateVolleyball(m) {
  m.roundSec += 1; m.minute += 1;
  if (m.roundSec < 5) return;
  m.roundSec = 0;
  var isFifth = (m.setsHome === 2 && m.setsAway === 2);
  var target = isFifth ? 15 : 25;
  var pHome;
  if (m.serving === 'home') pHome = 0.5 + (m.homeServe - 1) * 0.18 - (m.awayBlock - 1) * 0.10;
  else pHome = 0.5 - (m.awayServe - 1) * 0.18 + (m.homeBlock - 1) * 0.10;
  pHome = clamp(pHome, 0.30, 0.70);
  if (Math.random() < pHome) { m.pointsHome++; m.serving = 'home'; }
  else { m.pointsAway++; m.serving = 'away'; }

  if (m.pointsHome >= target && m.pointsHome - m.pointsAway >= 2) {
    m.setsHome++;
    m.setHistory.push({winner: 'home', h: m.pointsHome, a: m.pointsAway});
    m.justScored = 'home';
    m.commentary = '🎯 ' + m.home + ' берёт сет ' + m.pointsHome + ':' + m.pointsAway;
    m.pointsHome = 0; m.pointsAway = 0;
  } else if (m.pointsAway >= target && m.pointsAway - m.pointsHome >= 2) {
    m.setsAway++;
    m.setHistory.push({winner: 'away', h: m.pointsHome, a: m.pointsAway});
    m.justScored = 'away';
    m.commentary = '🎯 ' + m.away + ' берёт сет ' + m.pointsHome + ':' + m.pointsAway;
    m.pointsHome = 0; m.pointsAway = 0;
  }
  if (m.setsHome >= 3 || m.setsAway >= 3) {
    m.status = 'finished'; m.finishedAt = Date.now();
    m.commentary = '🏆 ' + (m.setsHome > m.setsAway ? m.home : m.away) + ' побеждает';
  }
}

/* ============ ТИК ============ */
function tickMatch(m) {
  if (m.status === 'countdown') {
    m.countdownLeft = (m.countdownLeft || 45) - 1;
    if (m.countdownLeft <= 0) {
      var nm;
      if (m.sport === 'football') nm = newFootball();
      else if (m.sport === 'hockey') nm = newHockey();
      else if (m.sport === 'volleyball') nm = newVolleyball();
      else nm = newUFC();
      nm.id = m.id;
      for (var k in m) delete m[k];
      for (var k2 in nm) m[k2] = nm[k2];
    }
    return;
  }
  if (m.status !== 'live') return;
  if (m.sport === 'football') simulateFootball(m);
  else if (m.sport === 'hockey') simulateHockey(m);
  else if (m.sport === 'volleyball') simulateVolleyball(m);
  else if (m.sport === 'ufc') simulateUFC(m);
}

/* ============ КОЭФЫ ============ */
function computeFootballOdds(m) {
  if (m.status === 'finished' || m.status === 'countdown') return {home: null, draw: null, away: null};
  var rem = m.maxMinute - m.minute;
  if (rem <= 0) return {home: null, draw: null, away: null};
  var lamH = footballLambda(m, 'home') * rem / 90;
  var lamA = footballLambda(m, 'away') * rem / 90;
  var pH = 0, pD = 0, pA = 0;
  for (var h = 0; h <= 10; h++) for (var a = 0; a <= 10; a++) {
    var p = poisson(h, lamH) * poisson(a, lamA);
    var fh = m.scoreHome + h, fa = m.scoreAway + a;
    if (fh > fa) pH += p; else if (fh === fa) pD += p; else pA += p;
  }
  var t = pH + pD + pA || 1;
  return {home: toOdd(pH / t), draw: toOdd(pD / t), away: toOdd(pA / t)};
}
function computeHockeyOdds(m) {
  if (m.status === 'finished' || m.status === 'countdown') return {home: null, draw: null, away: null};
  var rem = m.period === 4 ? 5 : (60 - m.minute);
  if (rem <= 0) rem = 0.5;
  var lamH = hockeyLambda(m, 'home') * rem / 60;
  var lamA = hockeyLambda(m, 'away') * rem / 60;
  var pH = 0, pD = 0, pA = 0;
  for (var h = 0; h <= 8; h++) for (var a = 0; a <= 8; a++) {
    var p = poisson(h, lamH) * poisson(a, lamA);
    var fh = m.scoreHome + h, fa = m.scoreAway + a;
    if (fh > fa) pH += p; else if (fh === fa) pD += p; else pA += p;
  }
  var t = pH + pD + pA || 1;
  return {home: toOdd(pH / t), draw: toOdd(pD / t), away: toOdd(pA / t)};
}
function ufcProbHome(m) {
  if (m.status === 'finished') return m.finalResult && m.finalResult.winner === 'home' ? 1 : 0;
  if (m.status === 'countdown') return 0.5;
  var hpDiff = (m.homeHP - m.awayHP) / Math.max(1, m.homeFighter.hpMax);
  var stamDiff = (m.homeStam - m.awayStam) / Math.max(1, m.homeFighter.stamMax);
  var rDiff = (m.homeRating - m.awayRating) / 400;
  var base = 1 / (1 + Math.pow(10, -rDiff));
  var prog = m.minute / Math.max(1, m.maxMinute);
  var pH = base + hpDiff * 0.4 + stamDiff * 0.15;
  pH = 0.5 + (clamp(pH, 0.05, 0.95) - 0.5) * (1 - prog * 0.3);
  return clamp(pH, 0.05, 0.95);
}
function computeUFCOdds(m) {
  if (m.status === 'finished' || m.status === 'countdown') return {home: null, draw: null, away: null};
  var pH = ufcProbHome(m);
  return {home: toOdd(pH), away: toOdd(1 - pH), draw: null};
}
function volleyProbHome(m) {
  if (m.status === 'finished') return m.setsHome > m.setsAway ? 1 : 0;
  if (m.status === 'countdown') return 0.5;
  var d = (m.homeAtk - m.awayAtk) * 0.18 + (m.homeServe - m.awayServe) * 0.08 - (m.homeBlock - m.awayBlock) * 0.05;
  var base = clamp(0.5 + d, 0.15, 0.85);
  var isFifth = (m.setsHome === 2 && m.setsAway === 2);
  var target = isFifth ? 15 : 25;
  var pH = base + ((m.pointsHome - m.pointsAway) / target) * 0.15 + (m.setsHome - m.setsAway) * 0.10;
  return clamp(pH, 0.05, 0.95);
}
function computeVolleyballOdds(m) {
  if (m.status === 'finished' || m.status === 'countdown') return {home: null, draw: null, away: null};
  var pH = volleyProbHome(m);
  return {home: toOdd(pH), away: toOdd(1 - pH), draw: null};
}
function computeOdds(m) {
  if (m.sport === 'football') return computeFootballOdds(m);
  if (m.sport === 'hockey') return computeHockeyOdds(m);
  if (m.sport === 'ufc') return computeUFCOdds(m);
  if (m.sport === 'volleyball') return computeVolleyballOdds(m);
  return {home: null, draw: null, away: null};
}

/* ============ ХЕЛПЕРЫ ============ */
function formatTimeLeft(m) {
  if (m.status === 'countdown') return 'Далее';
  if (m.status === 'finished') return 'Завершён';
  if (m.sport === 'football') {
    if (m.isBreak) return 'Перерыв';
    var mins = Math.floor(m.minute);
    return (m.minute < 45 ? '1-й · ' : '2-й · ') + mins + "'";
  }
  if (m.sport === 'hockey') {
    if (m.isBreak) return 'Перерыв';
    if (m.period === 4) return 'ОТ · ' + ft(m.periodSec);
    return m.period + '-й · ' + ft(m.periodSec);
  }
  if (m.sport === 'ufc') {
    if (m.phase === 'break') return 'Перерыв';
    return 'R' + m.round + ' · ' + ft(m.roundSec);
  }
  if (m.sport === 'volleyball') {
    var sn = m.setsHome + m.setsAway + 1;
    return 'Сет ' + Math.min(5, sn) + ' · ' + m.pointsHome + ':' + m.pointsAway;
  }
  return '';
}

function renderMarketsStats(m) {
  var params = [
    {key:'fouls', label:'Фолы'},
    {key:'corners', label:'Угловые'},
    {key:'cards', label:'Жёлтые'},
    {key:'shots', label:'Удары'},
    {key:'ontarget', label:'В створ'},
    {key:'offsides', label:'Офсайды'}
  ];
  var html = '<div class="stat-params">';
  params.forEach(function(p) {
    var active = STATE.currentStatParam === p.key ? ' active' : '';
    html += '<button class="stat-param' + active + '" data-stat-param="' + p.key + '">' + p.label + '</button>';
  });
  html += '</div>';

  var cntH = 0, cntA = 0, lbl = '';
  if (STATE.currentStatParam === 'fouls') { cntH = m.foulsHome || 0; cntA = m.foulsAway || 0; lbl = 'ФОЛЫ'; }
  if (STATE.currentStatParam === 'corners') { cntH = m.cornersHome || 0; cntA = m.cornersAway || 0; lbl = 'УГЛОВЫЕ'; }
  if (STATE.currentStatParam === 'cards') { cntH = m.cardsHome || 0; cntA = m.cardsAway || 0; lbl = 'ЖЁЛТЫЕ'; }
  if (STATE.currentStatParam === 'shots') { cntH = m.shotsHome || 0; cntA = m.shotsAway || 0; lbl = 'УДАРЫ'; }
  if (STATE.currentStatParam === 'ontarget') { cntH = m.shotsOnTargetHome || 0; cntA = m.shotsOnTargetAway || 0; lbl = 'В СТВОР'; }
  if (STATE.currentStatParam === 'offsides') { cntH = m.offsidesHome || 0; cntA = m.offsidesAway || 0; lbl = 'ОФСАЙДЫ'; }

  html += '<div class="stat-counter">' +
    '<div class="cnt-h">' + cntH + '</div>' +
    '<div class="lbl">' + lbl + '</div>' +
    '<div class="cnt-a">' + cntA + '</div>' +
  '</div>';

  var pHome = cntH + cntA > 0 ? cntH / (cntH + cntA) : 0.5;
  var pDraw = 0.15;

  html += renderMarketCard('Исход',
    '<div class="odds-grid-3">' +
      renderOddBtnInline(m, 'stat_home_' + STATE.currentStatParam, '1', toOdd(pHome * (1 - pDraw), 0.06)) +
      renderOddBtnInline(m, 'stat_draw_' + STATE.currentStatParam, 'X', toOdd(pDraw, 0.06)) +
      renderOddBtnInline(m, 'stat_away_' + STATE.currentStatParam, '2', toOdd((1 - pHome) * (1 - pDraw), 0.06)) +
    '</div>'
  );

  var lines = getStatLines(STATE.currentStatParam);
  var curLine = STATE.currentLine[m.id + '_stat_' + STATE.currentStatParam] || lines[1];
  html += renderMarketCard('Тотал ' + lbl.toLowerCase(),
    '<div class="line-selector">' +
      lines.map(function(l) {
        var active = Math.abs(l - curLine) < 0.01 ? ' active' : '';
        return '<div class="line-opt' + active + '" data-stat-line="' + l + '">' + l + '</div>';
      }).join('') +
    '</div>' +
    '<div class="odds-grid-2">' +
      renderOddBtnInline(m, 'stat_over_' + STATE.currentStatParam + '_' + curLine, 'Больше', toOdd(0.50, 0.05)) +
      renderOddBtnInline(m, 'stat_under_' + STATE.currentStatParam + '_' + curLine, 'Меньше', toOdd(0.50, 0.05)) +
    '</div>'
  );
  return html;
}

function getStatLines(param) {
  if (param === 'fouls') return [20.5, 22.5, 24.5, 26.5];
  if (param === 'corners') return [6.5, 8.5, 10.5, 12.5];
  if (param === 'cards') return [1.5, 2.5, 3.5, 4.5];
  if (param === 'shots') return [18.5, 22.5, 26.5, 30.5];
  if (param === 'ontarget') return [6.5, 8.5, 10.5, 12.5];
  if (param === 'offsides') return [1.5, 2.5, 3.5, 4.5];
  return [1.5, 2.5, 3.5];
}

function renderMarketCard(title, bodyHtml) {
  var key = title;
  var isOpen = STATE.openMarkets[key] !== false;
  var starActive = STATE.favorites[key] ? ' active' : '';
  return '<div class="market-card' + (isOpen ? '' : ' collapsed') + '">' +
    '<div class="market-head" data-toggle-market="' + escapeHtml(key) + '">' +
      '<span class="star' + starActive + '" data-star-market="' + escapeHtml(key) + '">★</span>' +

      '<span class="chevron">▲</span>' +

function combineOdds(o1, o2) {
  if (!o1 || !o2) return null;
  var p = (1 / o1) + (1 / o2);
  if (p >= 1) return null;
  return toOdd(1 - p, 0.04);
}

function renderOddBtnInline(m, pick, label, odd) {
  if (!isValid(odd)) return '<div class="odd-btn disabled"><span class="lbl">' + escapeHtml(label) + '</span><span class="val">—</span></div>';
  var isSel = isInCoupon(m.id, pick);
  return '<button class="odd-btn' + (isSel ? ' selected' : '') + '" data-match-id="' + m.id + '" data-pick="' + escapeHtml(pick) + '" data-odd="' + odd + '">' +
    '<span class="lbl">' + escapeHtml(label) + '</span>' +
    '<span class="val">' + odd.toFixed(2) + '</span>' +
  '</button>';
}

function renderMarketTotalGoals(m) {
  var lines = m.sport === 'football' ? [1.5, 2, 2.5, 3, 3.5, 4] : [3.5, 4, 4.5, 5, 5.5, 6];
  var curLine = STATE.currentLine[m.id + '_tot'] || 2.5;
  if (lines.indexOf(curLine) < 0) curLine = lines[2];
  var pOver = 0.52;
  if (m.sport === 'football') {
    var lam = footballLambda(m, 'home') + footballLambda(m, 'away');
    var rem = m.maxMinute - m.minute;
    var totalLam = lam * rem / 90;
    pOver = 1 - normalCDF((curLine - m.scoreHome - m.scoreAway - totalLam) / Math.max(0.5, Math.sqrt(totalLam)));
  }
  pOver = clamp(pOver, 0.05, 0.95);
  return renderMarketCard('Тотал голов',
    '<div class="line-selector">' +
      lines.map(function(l) {
        var active = Math.abs(l - curLine) < 0.01 ? ' active' : '';
        return '<div class="line-opt' + active + '" data-total-line="' + l + '">' + l + '</div>';
      }).join('') +
    '</div>' +
    '<div class="odds-grid-2">' +
      renderOddBtnInline(m, 'tot_over_' + curLine, 'Больше', toOdd(pOver, 0.05)) +
      renderOddBtnInline(m, 'tot_under_' + curLine, 'Меньше', toOdd(1 - pOver, 0.05)) +
    '</div>'
  );
}

function renderMarketHandicap(m) {
  var lines = [0, 0.5, 1, 1.5, 2, 2.5];
  var curLine = STATE.currentLine[m.id + '_hcp'] || 1.5;
  var pH = 0.5;
  if (m.sport === 'football' || m.sport === 'hockey') {
    var totalMin = m.sport === 'football' ? 90 : 60;
    var rem = m.maxMinute - m.minute;
    var lamH = (m.sport === 'football' ? footballLambda(m, 'home') : hockeyLambda(m, 'home')) * rem / totalMin;
    var lamA = (m.sport === 'football' ? footballLambda(m, 'away') : hockeyLambda(m, 'away')) * rem / totalMin;
    var diff = m.scoreHome - m.scoreAway;
    var p = 0;
    for (var i = 0; i <= 8; i++) for (var j = 0; j <= 8; j++) {
      var pp = poisson(i, lamH) * poisson(j, lamA);
      if ((diff + i - j) > curLine) p += pp;
    }
    pH = clamp(p, 0.1, 0.9);
  }
  return renderMarketCard('Исход с учётом форы',
    '<div class="line-selector">' +
      lines.map(function(l) {
        var active = Math.abs(l - curLine) < 0.01 ? ' active' : '';
        return '<div class="line-opt' + active + '" data-hcp-line="' + l + '">' + l + '</div>';
      }).join('') +
    '</div>' +
    '<div class="odds-labeled">' +
      '<div><div class="col-head">' + escapeHtml(m.home) + '</div>' + renderOddBtnInline(m, 'hcp_home_' + curLine, 'Фора (-' + curLine + ')', toOdd(pH, 0.05)) + '</div>' +
      '<div><div class="col-head">' + escapeHtml(m.away) + '</div>' + renderOddBtnInline(m, 'hcp_away_' + curLine, 'Фора (+' + curLine + ')', toOdd(1 - pH, 0.05)) + '</div>' +
    '</div>'
  );
}

}

function renderCouponBody() {
  var c = STATE.wallet.coupon;
  var html = '';
  if (!c.length) {
    $('couponBody').innerHTML = '<div class="coupon-empty"><div class="icon">📋</div><div class="txt">Купон пуст</div></div>';
    return;
  }
  c.forEach(function(item, idx) {
    html += '<div class="coupon-item">' +
      '<div class="ci-head">' +
        '<span class="ci-score">' + escapeHtml(item.score) + '</span>' +
        '<span class="ci-league">' + escapeHtml(item.matchName) + '</span>' +
        '<button class="ci-remove" data-remove-coupon="' + idx + '">×</button>' +
      '</div>' +
      '<div class="ci-pick"><span>' + escapeHtml(item.pickLabel) + '</span><span class="ci-odd">' + item.odd.toFixed(2) + '</span></div>' +
    '</div>';
  });
  html += '<div class="coupon-type"><button class="ct-btn active">Одинар</button><div class="swap">⇅</div></div>';
  html += '<div class="coupon-stake">' +
    '<input type="number" class="stake-input" id="couponStakeInput" placeholder="Введите сумму">' +
    '<div class="stake-right"><div class="balance-label">Баланс</div><div class="balance-val">' + fmt(STATE.wallet.balance) + ' ₽</div><div class="add-btn" id="couponAddFunds">+</div></div>' +
  '</div>';
  html += '<div class="coupon-limits"><div class="lmt">min <b>30</b></div><div class="lmt">max <b>' + fmt(STATE.wallet.balance) + '</b></div><div class="settings-btn">⚙︎</div></div>';
  html += '<div class="coupon-actions"><div class="potential">Возможный выигрыш <b id="couponPotential">—</b></div></div>';
  html += '<button class="coupon-place" id="couponPlace">Поставить</button>';
  $('couponBody').innerHTML = html;

  var inp = $('couponStakeInput');
  var pot = $('couponPotential');
  if (inp) {
    inp.addEventListener('input', function() {
      var v = parseFloat(this.value) || 0;
      var totalOdd = c.reduce(function(a, b) { return a * b.odd; }, 1);
      pot.textContent = v > 0 ? fmt(v * totalOdd) + ' ₽' : '—';
    });
  }
  document.querySelectorAll('[data-remove-coupon]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      STATE.wallet.coupon.splice(parseInt(this.dataset.removeCoupon), 1);
      saveWallet();
      renderCouponBody();
      renderFloatingCoupon();
      renderTabBar();
      if (STATE.screen === 'main') renderMainScreen(); else renderMatchScreen();
    });
  });
  var af = $('couponAddFunds');
  if (af) af.addEventListener('click', showBonus);
  var pl = $('couponPlace');
  if (pl) pl.addEventListener('click', placeCouponBet);
}

function isInCoupon(mid, pick) {
  return STATE.wallet.coupon.some(function(c) { return c.matchId === mid && c.pick === pick; });
}

function addToCouponFromCell(mid, pick) {
  var m = findMatch(mid);
  if (!m) return;
  var odds = computeOdds(m);
  var odd = odds[pick];
  if (!isValid(odd)) return;
  addToCouponFull(mid, pick, odd);
}

function addToCouponFull(mid, pick, odd) {
  var m = findMatch(mid);
  if (!m) return;
  if (m.status === 'finished' || m.status === 'countdown') return;
  if (isInCoupon(mid, pick)) {
    STATE.wallet.coupon = STATE.wallet.coupon.filter(function(c) { return !(c.matchId === mid && c.pick === pick); });
  } else {
    STATE.wallet.coupon = STATE.wallet.coupon.filter(function(c) { return c.matchId !== mid; });
    var pickLabel = pickToLabel(m, pick);
    STATE.wallet.coupon.push({
      matchId: mid, pick: pick, odd: odd,
      matchName: m.home + ' – ' + m.away,
      pickLabel: pickLabel,
      score: m.sport === 'volleyball' ? (m.setsHome + ':' + m.setsAway) : ((m.scoreHome || 0) + ':' + (m.scoreAway || 0))
    });
  }
  saveWallet();
  renderFloatingCoupon();
  renderTabBar();
  if (STATE.screen === 'main') renderMainScreen();
  if (STATE.screen === 'match') renderMatchScreen();
  if ($('couponPanel').classList.contains('active')) renderCouponBody();
}

function pickToLabel(m, pick) {
  if (pick === 'home') return m.home;
  if (pick === 'away') return m.away;
  if (pick === 'draw') return 'Ничья';
  return pick;
}

function findMatch(id) {
  for (var i = 0; i < STATE.matches.length; i++) if (STATE.matches[i].id === id) return STATE.matches[i];
  return null;
}

function placeCouponBet() {
  var c = STATE.wallet.coupon;
  if (!c.length) return;
  var stake = parseFloat(($('couponStakeInput') || {}).value) || 0;
  if (stake < 30) { toast('lose', '⚠️', 'Минимум 30 ₽'); return; }
  if (stake > STATE.wallet.balance) { toast('lose', '⚠️', 'Недостаточно средств'); return; }
  var totalOdd = c.reduce(function(a, b) { return a * b.odd; }, 1);
  STATE.wallet.bets.unshift({
    id: Date.now(),
    type: c.length === 1 ? 'single' : 'express',
    selections: c.slice(),
    matchName: c.length === 1 ? c[0].matchName : ('Экспресс · ' + c.length),
    odd: totalOdd, stake: stake,
    potential: Math.round(stake * totalOdd * 100) / 100,
    status: 'pending',
    createdAt: new Date().toISOString()
  });
  STATE.wallet.balance -= stake;
  STATE.wallet.totalBet += stake;
  STATE.wallet.coupon = [];
  saveWallet();
  toast('info', '📋', 'Ставка принята · ' + fmt(stake) + ' ₽');
  closeCoupon();
  renderTabBar();
  renderFloatingCoupon();
  if (STATE.screen === 'main') renderMainScreen();
  else renderMatchScreen();
}

function showBonus() {
  if (STATE.wallet.lastBonus === todayKey()) { toast('info', '💎', 'Бонус уже получен'); return; }
  STATE.wallet.balance += 100000;
  STATE.wallet.lastBonus = todayKey();
  saveWallet();
  toast('gold', '💎', '+100 000 ₽ бонус!');
  renderTabBar();
  if (STATE.screen === 'main') renderMainScreen();
  else renderMatchScreen();
}

/* ============ СОЗДАНИЕ ============ */
function createInitialMatches() {
  STATE.matches = [];
  STATE.nextId = 1;
  for (var i = 0; i < 4; i++) STATE.matches.push(newFootball());
  for (var j = 0; j < 3; j++) STATE.matches.push(newHockey());
  for (var k = 0; k < 3; k++) STATE.matches.push(newVolleyball());
  for (var l = 0; l < 3; l++) STATE.matches.push(newUFC());
  for (var q = STATE.matches.length - 1; q > 0; q--) {
    var r = Math.floor(Math.random() * (q + 1));
    var t = STATE.matches[q]; STATE.matches[q] = STATE.matches[r]; STATE.matches[r] = t;
  }
}

/* ============ ГЛАВНЫЙ ЦИКЛ ============ */
var tickCounter = 0;
function tick() {
  tickCounter++;
  for (var i = 0; i < STATE.matches.length; i++) {
    var m = STATE.matches[i];
    if (m.status === 'live' || m.status === 'countdown') {
      try { tickMatch(m); }
      catch (e) { console.error('tick err', m.id, e); m.status = 'finished'; }
    }
  }
  for (var j = 0; j < STATE.matches.length; j++) {
    var m2 = STATE.matches[j];
    if (m2.status === 'finished' && !m2.countdownStarted) {
      m2.finishedAt = m2.finishedAt || Date.now();
      if (Date.now() - m2.finishedAt > 5000) {
        m2.countdownStarted = true;
        m2.status = 'countdown';
        m2.countdownLeft = 45;
      }
    }
  }
  var liveCnt = STATE.matches.filter(function(mm) { return mm.status === 'live' || mm.status === 'countdown'; }).length;
  if (liveCnt < 10) {
    var cnt = {football: 0, hockey: 0, volleyball: 0, ufc: 0};
    STATE.matches.forEach(function(mm) {
      if ((mm.status === 'live' || mm.status === 'countdown') && cnt[mm.sport] !== undefined) cnt[mm.sport]++;
    });
    var targets = {football: 4, hockey: 3, volleyball: 3, ufc: 3};
    ['football', 'hockey', 'volleyball', 'ufc'].forEach(function(sp) {
      if (cnt[sp] < targets[sp]) {
        var need = targets[sp] - cnt[sp];
        for (var n = 0; n < need; n++) {
          if (sp === 'football') STATE.matches.push(newFootball());
          else if (sp === 'hockey') STATE.matches.push(newHockey());
          else if (sp === 'volleyball') STATE.matches.push(newVolleyball());
          else STATE.matches.push(newUFC());
        }
      }
    });
  }
  if (STATE.matches.length > 30) STATE.matches = STATE.matches.slice(0, 30);
  if (tickCounter % 2 === 0) {
    if (STATE.screen === 'main') renderMainScreen();
    else if (STATE.screen === 'match' && STATE.currentMatch) {
      var m3 = findMatch(STATE.currentMatch.id);
      if (m3) {
        STATE.currentMatch = m3;
        if (tickCounter % 6 === 0) renderMatchScreen();
      }
    }
  }
}

/* ============ СТАРТ ============ */
function init() {
  initWallet();
  try {
    var s = localStorage.getItem('openbet_sound');
    if (s !== null) STATE.soundOn = s === '1';
  } catch (e) {}

  createInitialMatches();
  STATE.matches.forEach(function(m) {
    var skip = rand(3, 25);
    for (var i = 0; i < skip && m.status === 'live'; i++) {
      try { tickMatch(m); } catch (e) {}
    }
  });
  renderApp();

  var co = $('couponOverlay');
  if (co) co.addEventListener('click', closeCoupon);
  var cc = $('couponClose');
  if (cc) cc.addEventListener('click', closeCoupon);

  document.querySelectorAll('.ct').forEach(function(t) {
    t.addEventListener('click', function() {
      document.querySelectorAll('.ct').forEach(function(x) { x.classList.remove('active'); });
      this.classList.add('active');
    });
  });

  setInterval(tick, 1000);
  console.log('✅ OpenBet запущен — ' + STATE.matches.length + ' матчей');
}

document.addEventListener('DOMContentLoaded', init);
  
</script>
</body>
</html>
