<script type="module">
import * as THREE from 'three';

// =========================================================
// 1. АУДИО-ДВИЖОК (Web Audio API - без файлов)
// =========================================================
class AudioEngine {
  constructor() {
    this.ctx = null;
    this.engineOsc = null;
    this.engineGain = null;
    this.isStarted = false;
  }
  
  init() {
    if (this.isStarted) return;
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    
    // Осциллятор двигателя (пила для рокота)
    this.engineOsc = this.ctx.createOscillator();
    this.engineOsc.type = 'sawtooth';
    this.engineOsc.frequency.value = 50;
    
    // Фильтр нижних частот (чтобы звучало глухо)
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 400;
    
    // Громкость
    this.engineGain = this.ctx.createGain();
    this.engineGain.gain.value = 0.05;
    
    this.engineOsc.connect(filter);
    filter.connect(this.engineGain);
    this.engineGain.connect(this.ctx.destination);
    this.engineOsc.start();
    this.isStarted = true;
  }
  
  updateEngine(speed, maxSpeed) {
    if (!this.isStarted) return;
    // Меняем частоту в зависимости от скорости
    const baseFreq = 40;
    const maxFreq = 200;
    const ratio = speed / maxSpeed;
    this.engineOsc.frequency.setTargetAtTime(baseFreq + (maxFreq - baseFreq) * ratio, this.ctx.currentTime, 0.1);
    this.engineGain.gain.setTargetAtTime(0.02 + 0.08 * ratio, this.ctx.currentTime, 0.1);
  }

  playCrash() {
    if (!this.isStarted) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(100, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);
    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.5);
  }
}
const audio = new AudioEngine();

// =========================================================
// 2. НАСТРОЙКА THREE.JS СЦЕНЫ
// =========================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x090014);
scene.fog = new THREE.FogExp2(0x090014, 0.012);

const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Защита от лагов на телефонах
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

// Освещение
const ambient = new THREE.AmbientLight(0xffffff, 1.0);
scene.add(ambient);

const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);
dirLight.position.set(20, 40, 20);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 2048;
dirLight.shadow.mapSize.height = 2048;
dirLight.shadow.camera.left = -50;
dirLight.shadow.camera.right = 50;
dirLight.shadow.camera.top = 50;
dirLight.shadow.camera.bottom = -50;
dirLight.shadow.camera.near = 1;
dirLight.shadow.camera.far = 100;
scene.add(dirLight);

// Динамический неоновый свет (следует за игроком)
const neonLight = new THREE.PointLight(0xff00ff, 5, 25);
scene.add(neonLight);
const neonLight2 = new THREE.PointLight(0x00ffff, 5, 25);
scene.add(neonLight2);

// =========================================================
// 3. ГЕНЕРАЦИЯ 3D МОДЕЛИ МАШИНЫ (ДЕТАЛИЗИРОВАННАЯ)
// =========================================================
function createSportsCar(colorHex) {
  const car = new THREE.Group();
  
  // Красители
  const paint = new THREE.MeshStandardMaterial({ color: colorHex, metalness: 0.8, roughness: 0.15 });
  const darkGlass = new THREE.MeshStandardMaterial({ color: 0x050505, metalness: 1, roughness: 0.05 });
  const carbon = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
  const chrome = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 1, roughness: 0.1 });
  const tireMat = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 1 });
  const brakeLight = new THREE.MeshBasicMaterial({ color: 0xff0000 });
  
  // 1. Основной кузов (нижняя часть)
  const chassisGeo = new THREE.BoxGeometry(2.0, 0.5, 4.2);
  const chassis = new THREE.Mesh(chassisGeo, paint);
  chassis.position.y = 0.55;
  chassis.castShadow = true;
  chassis.receiveShadow = true;
  car.add(chassis);

  // 2. Капот и багажник (создают эффект обтекаемости)
  const hoodGeo = new THREE.BoxGeometry(1.9, 0.3, 1.5);
  const hood = new THREE.Mesh(hoodGeo, paint);
  hood.position.set(0, 0.8, 1.3);
  hood.castShadow = true;
  car.add(hood);

  const trunkGeo = new THREE.BoxGeometry(1.9, 0.35, 1.0);
  const trunk = new THREE.Mesh(trunkGeo, paint);
  trunk.position.set(0, 0.8, -1.6);
  trunk.castShadow = true;
  car.add(trunk);

  // 3. Кабина (стекла)
  const cabinGeo = new THREE.BoxGeometry(1.75, 0.65, 2.0);
  const cabin = new THREE.Mesh(cabinGeo, darkGlass);
  cabin.position.set(0, 1.25, 0.1);
  cabin.castShadow = true;
  car.add(cabin);

  // 4. Крыша (в цвет кузова)
  const roofGeo = new THREE.BoxGeometry(1.6, 0.08, 1.6);
  const roof = new THREE.Mesh(roofGeo, paint);
  roof.position.set(0, 1.6, 0.1);
  roof.castShadow = true;
  car.add(roof);

  // 5. Задние фары (горят красным)
  const tailGeo = new THREE.BoxGeometry(0.6, 0.15, 0.05);
  const tailL = new THREE.Mesh(tailGeo, brakeLight);
  tailL.position.set(-0.6, 0.85, -2.11);
  car.add(tailL);
  
  const tailR = tailL.clone();
  tailR.position.x = 0.6;
  car.add(tailR);

  // 6. Выхлопные трубы
  const exhaustGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.3, 8);
  exhaustGeo.rotateX(Math.PI / 2);
  const exhaustL = new THREE.Mesh(exhaustGeo, chrome);
  exhaustL.position.set(-0.4, 0.3, -2.15);
  car.add(exhaustL);
  const exhaustR = exhaustL.clone();
  exhaustR.position.x = 0.4;
  car.add(exhaustR);

  // 7. Антикрыло (спойлер)
  const wingGeo = new THREE.BoxGeometry(2.1, 0.06, 0.4);
  const wing = new THREE.Mesh(wingGeo, carbon);
  wing.position.set(0, 1.15, -2.0);
  wing.castShadow = true;
  car.add(wing);
  
  const wingStandGeo = new THREE.BoxGeometry(0.1, 0.3, 0.1);
  const wingStandL = new THREE.Mesh(wingStandGeo, carbon);
  wingStandL.position.set(-0.7, 1.0, -2.0);
  car.add(wingStandL);
  const wingStandR = wingStandL.clone();
  wingStandR.position.x = 0.7;
  car.add(wingStandR);

  // 8. Колеса
  const wheelGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.4, 24);
  wheelGeo.rotateZ(Math.PI / 2);
  
  const wheels = [];
  const wheelPositions = [
    [-1.05, 0.45, 1.3], [1.05, 0.45, 1.3],   // Передние
    [-1.05, 0.45, -1.3], [1.05, 0.45, -1.3]  // Задние
  ];

  wheelPositions.forEach((pos) => {
    const wheelGroup = new THREE.Group();
    
    // Резина
    const tire = new THREE.Mesh(wheelGeo, tireMat);
    tire.castShadow = true;
    wheelGroup.add(tire);
    
    // Диск (хром)
    const rimGeo = new THREE.CylinderGeometry(0.28, 0.28, 0.42, 8);
    rimGeo.rotateZ(Math.PI / 2);
    const rim = new THREE.Mesh(rimGeo, chrome);
    wheelGroup.add(rim);

    wheelGroup.position.set(...pos);
    car.add(wheelGroup);
    wheels.push(wheelGroup);
  });

  car.userData = { wheels };
  return car;
}

// =========================================================
// 4. ГЕНЕРАЦИЯ БЕСКОНЕЧНОЙ ТРАССЫ
// =========================================================
const ROAD_WIDTH = 16;
const SEGMENT_LENGTH = 20;
const NUM_SEGMENTS = 30; // Сколько сегментов держим в памяти

let trackZ = 0;
const trackGroup = new THREE.Group();
scene.add(trackGroup);

const roadMaterial = new THREE.MeshStandardMaterial({ color: 0x1a1a2e, roughness: 0.6, metalness: 0.4 });
const curbMaterial = new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x00aaaa, emissiveIntensity: 0.5, roughness: 0.3 });
const lineMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });

// Функция изгиба трассы
function getCurveX(z) {
  return Math.sin(z * 0.015) * 12 + Math.cos(z * 0.03) * 6;
}

// Создание одного сегмента дороги
function createRoadSegment(z) {
  const seg = new THREE.Group();
  
  // Асфальт
  const roadGeo = new THREE.BoxGeometry(ROAD_WIDTH, 0.5, SEGMENT_LENGTH);
  const road = new THREE.Mesh(roadGeo, roadMaterial);
  road.position.y = -0.25;
  road.receiveShadow = true;
  seg.add(road);

  // Неоновые бордюры по бокам
  const curbGeo = new THREE.BoxGeometry(0.5, 0.6, SEGMENT_LENGTH);
  const curbL = new THREE.Mesh(curbGeo, curbMaterial);
  curbL.position.set(-ROAD_WIDTH/2, 0, 0);
  seg.add(curbL);
  
  const curbR = curbL.clone();
  curbR.position.x = ROAD_WIDTH/2;
  seg.add(curbR);

  // Центральная разметка (пунктир)
  const lineGeo = new THREE.BoxGeometry(0.3, 0.52, SEGMENT_LENGTH/2);
  const line = new THREE.Mesh(lineGeo, lineMaterial);
  line.position.y = 0;
  seg.add(line);

  // Фонари (каждый второй сегмент)
  if (Math.abs(z) % 40 < 1) {
    const poleGeo = new THREE.CylinderGeometry(0.1, 0.1, 6);
    const poleMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
    
    const poleL = new THREE.Mesh(poleGeo, poleMat);
    poleL.position.set(-ROAD_WIDTH/2 - 2, 3, 0);
    seg.add(poleL);
    
    const lampMat = new THREE.MeshBasicMaterial({ color: 0xff00ff });
    const lampL = new THREE.Mesh(new THREE.SphereGeometry(0.4, 8, 8), lampMat);
    lampL.position.set(-ROAD_WIDTH/2 - 2, 6, 0);
    seg.add(lampL);

    const poleR = poleL.clone();
    poleR.position.x = ROAD_WIDTH/2 + 2;
    seg.add(poleR);
    
    const lampR = lampL.clone();
    lampR.position.x = ROAD_WIDTH/2 + 2;
    seg.add(lampR);
  }

  // Неоновые арки (каждый 4-й сегмент)
  if (Math.abs(z) % 80 < 1) {
    const archMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.3 });
    const archGeo = new THREE.TorusGeometry(ROAD_WIDTH/2 + 2, 0.5, 8, 20, Math.PI);
    const arch = new THREE.Mesh(archGeo, archMat);
    arch.position.set(0, 0, 0);
    seg.add(arch);
  }

  // Деревья снаружи
  if (Math.random() > 0.5) {
    const treeGeo = new THREE.ConeGeometry(2, 8, 8);
    const treeMat = new THREE.MeshStandardMaterial({ color: 0x0a2a10 });
    
    const treeL = new THREE.Mesh(treeGeo, treeMat);
    treeL.position.set(-ROAD_WIDTH/2 - 8, 4, 0);
    treeL.castShadow = true;
    seg.add(treeL);
    
    if (Math.random() > 0.5) {
      const treeR = treeL.clone();
      treeR.position.x = ROAD_WIDTH/2 + 8;
      seg.add(treeR);
    }
  }

  seg.position.set(getCurveX(z), 0, z);
  return seg;
}

// =========================================================
// 5. ИГРОВАЯ ЛОГИКА (Игрок, ИИ, Столкновения)
// =========================================================
const playerCar = createSportsCar(0xffcc00);
scene.add(playerCar);

// Массив соперников
const enemies = [];
const ENEMY_COLORS = [0xff0000, 0x00ff00, 0x0000ff, 0xff00ff, 0x00ffff, 0xff8800];

function spawnEnemy() {
  const color = ENEMY_COLORS[Math.floor(Math.random() * ENEMY_COLORS.length)];
  const enemy = createSportsCar(color);
  
  // Спавн впереди (дальше по Z)
  const spawnZ = -150 - Math.random() * 100;
  const lane = Math.floor(Math.random() * 3) - 1; // -1, 0, 1
  const x = getCurveX(spawnZ) + lane * (ROAD_WIDTH / 3);
  
  enemy.position.set(x, 0, spawnZ);
  enemy.userData = {
    speed: 30 + Math.random() * 20,
    lane: lane,
    targetLane: lane,
    laneChangeTimer: 0
  };
  
  scene.add(enemy);
  enemies.push(enemy);
}

// Состояние игры
const gameState = {
  speed: 0,
  maxSpeed: 80,
  acceleration: 25,
  brakePower: 40,
  distance: 0,
  lap: 1,
  maxLaps: 3,
  isPlaying: false,
  playerX: 0,
  targetPlayerX: 0,
  crashTimer: 0
};

// Ввод
const keys = {};
window.addEventListener('keydown', e => keys[e.key] = true);
window.addEventListener('keyup', e => keys[e.key] = false);

const touch = { left: false, right: false, gas: false };
const bindBtn = (id, prop) => {
  const el = document.getElementById(id);
  el.addEventListener('touchstart', e => { e.preventDefault(); touch[prop] = true; }, {passive: false});
  el.addEventListener('touchend', e => { e.preventDefault(); touch[prop] = false; }, {passive: false});
  el.addEventListener('touchcancel', e => { e.preventDefault(); touch[prop] = false; }, {passive: false});
  el.addEventListener('mousedown', () => touch[prop] = true);
  el.addEventListener('mouseup', () => touch[prop] = false);
};
bindBtn('btn-left', 'left');
bindBtn('btn-right', 'right');
bindBtn('btn-gas', 'gas');

// Управление камерой
let cameraShake = 0;

// Основной цикл обновления
function updateGame(dt) {
  if (!gameState.isPlaying) return;

  // --- 1. Физика игрока ---
  const isGas = keys['ArrowUp'] || keys['w'] || keys['W'] || touch.gas;
  const isLeft = keys['ArrowLeft'] || keys['a'] || keys['A'] || touch.left;
  const isRight = keys['ArrowRight'] || keys['d'] || keys['D'] || touch.right;

  if (isGas) {
    gameState.speed += gameState.acceleration * dt;
  } else {
    gameState.speed -= gameState.acceleration * 0.5 * dt;
  }
  gameState.speed = Math.max(0, Math.min(gameState.speed, gameState.maxSpeed));

  // Поворот руля (смещение по X)
  const steerSpeed = 25;
  if (isLeft) gameState.targetPlayerX -= steerSpeed * dt * (gameState.speed / 30 + 0.3);
  if (isRight) gameState.targetPlayerX += steerSpeed * dt * (gameState.speed / 30 + 0.3);

  // Ограничение дороги
  const currentTrackX = getCurveX(-gameState.distance);
  const roadLeft = currentTrackX - ROAD_WIDTH / 2 + 1.2;
  const roadRight = currentTrackX + ROAD_WIDTH / 2 - 1.2;
  gameState.targetPlayerX = Math.max(roadLeft, Math.min(roadRight, gameState.targetPlayerX));

  // Плавное следование за целью
  gameState.playerX += (gameState.targetPlayerX - gameState.playerX) * 12 * dt;

  // Движение вперед
  gameState.distance += gameState.speed * dt;
  if (gameState.distance > 500) {
    gameState.distance = 0;
    gameState.lap++;
    if (gameState.lap > gameState.maxLaps) gameState.lap = 1;
  }

  // Обновление позиции машины
  playerCar.position.x = gameState.playerX;
  playerCar.position.z = -gameState.distance;
  
  // Наклон кузова в поворотах
  const tilt = (gameState.targetPlayerX - gameState.playerX) * 0.15;
  playerCar.rotation.z += (-tilt - playerCar.rotation.z) * 10 * dt;
  playerCar.rotation.y = (gameState.targetPlayerX - gameState.playerX) * 0.05;

  // Вращение колес
  playerCar.userData.wheels.forEach(w => {
    w.rotation.x += gameState.speed * dt * 2;
  });

  // --- 2. Обновление соперников ---
  enemies.forEach((enemy, index) => {
    // ИИ едет вперед
    enemy.position.z -= enemy.userData.speed * dt;
    
    // ИИ меняет полосу
    enemy.userData.laneChangeTimer += dt;
    if (enemy.userData.laneChangeTimer > 2) {
      enemy.userData.laneChangeTimer = 0;
      if (Math.random() > 0.5) {
        enemy.userData.targetLane = Math.max(-1, Math.min(1, enemy.userData.targetLane + (Math.random() > 0.5 ? 1 : -1)));
      }
    }

    // Плавное смещение
    const targetX = getCurveX(enemy.position.z) + enemy.userData.targetLane * (ROAD_WIDTH / 3);
    enemy.position.x += (targetX - enemy.position.x) * 2 * dt;
    
    // Вращение колес ИИ
    enemy.userData.wheels.forEach(w => {
      w.rotation.x += enemy.userData.speed * dt * 2;
    });

    // Проверка столкновений с игроком
    const dx = playerCar.position.x - enemy.position.x;
    const dz = playerCar.position.z - enemy.position.z;
    const dist = Math.sqrt(dx*dx + dz*dz);

    if (dist < 2.5 && gameState.crashTimer <= 0) {
      // Столкновение!
      gameState.speed *= 0.5;
      gameState.crashTimer = 0.5;
      audio.playCrash();
      cameraShake = 1.0;
    }

    // Удаление уехавших далеко вперед
    if (enemy.position.z < playerCar.position.z - 200) {
      scene.remove(enemy);
      enemies.splice(index, 1);
    }
  });

  // Спавн новых врагов
  if (enemies.length < 5 && Math.random() < 0.02) {
    spawnEnemy();
  }

  // Таймеры
  if (gameState.crashTimer > 0) gameState.crashTimer -= dt;
  if (cameraShake > 0) cameraShake -= dt;

  // --- 3. Камера ---
  const camTargetX = playerCar.position.x * 0.6;
  const camTargetY = 6;
  const camTargetZ = playerCar.position.z + 12;
  
  camera.position.x += (camTargetX - camera.position.x) * 5 * dt;
  camera.position.y += (camTargetY - camera.position.y) * 5 * dt;
  camera.position.z += (camTargetZ - camera.position.z) * 8 * dt;
  
  // Тряска при аварии
  if (cameraShake > 0) {
    camera.position.x += (Math.random() - 0.5) * cameraShake;
    camera.position.y += (Math.random() - 0.5) * cameraShake;
  }
  
  camera.lookAt(playerCar.position.x * 0.5, 2, playerCar.position.z - 10);

  // --- 4. Свет (Неон) ---
  neonLight.position.set(playerCar.position.x, 1, playerCar.position.z);
  neonLight2.position.set(playerCar.position.x, 1, playerCar.position.z - 30);

  // --- 5. Обновление дороги ---
  // Перемещаем сегменты, которые уехали далеко назад
  for (let i = trackGroup.children.length - 1; i >= 0; i--) {
    const seg = trackGroup.children[i];
    if (seg.position.z > playerCar.position.z + 100) {
      trackGroup.remove(seg);
    }
  }

  // Спавн новых сегментов впереди
  let minZ = Infinity;
  trackGroup.children.forEach(s => { if (s.position.z < minZ) minZ = s.position.z; });
  
  while (minZ > playerCar.position.z - 300) {
    minZ -= SEGMENT_LENGTH;
    const seg = createRoadSegment(minZ);
    trackGroup.add(seg);
  }

  // --- 6. Аудио и HUD ---
  audio.updateEngine(gameState.speed, gameState.maxSpeed);
  
  document.getElementById('ui-speed').textContent = Math.floor(gameState.speed * 3.6);
  document.getElementById('ui-dist').textContent = Math.floor(gameState.distance);
  document.getElementById('ui-lap').textContent = gameState.lap + '/' + gameState.maxLaps;
}

// =========================================================
// 6. ЦИКЛ РЕНДЕРА (requestAnimationFrame)
// =========================================================
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  
  const dt = Math.min(clock.getDelta(), 0.1);
  
  updateGame(dt);
  
  renderer.render(scene, camera);
}

// =========================================================
// 7. ИНИЦИАЛИЗАЦИЯ И СТАРТ
// =========================================================
// Начальная генерация трассы
for (let z = 20; z > -300; z -= SEGMENT_LENGTH) {
  trackGroup.add(createRoadSegment(z));
}

// Позиция камеры по умолчанию
camera.position.set(0, 6, 12);
camera.lookAt(0, 2, -10);

// Старт по кнопке
document.getElementById('btn-start').addEventListener('click', () => {
  document.getElementById('menu').style.display = 'none';
  document.getElementById('ui').style.display = 'flex';
  
  audio.init(); // Аудио можно запустить только по клику
  
  gameState.isPlaying = true;
  clock.getDelta(); // Сброс таймера
  
  // Сразу спавним пару врагов
  for (let i = 0; i < 3; i++) spawnEnemy();
});

animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
