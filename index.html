<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>🏓 Пинг-понг онлайн</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{overflow:hidden;width:100%;height:100%}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,Arial,sans-serif;background:#0a0e1a;color:#e8ecf5;display:flex;flex-direction:column;max-width:560px;margin:0 auto;height:100vh;position:relative}

/* ТОПБАР */
.pp-top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(10,14,26,.95);border-bottom:1px solid rgba(255,255,255,.06);z-index:50}
.pp-back{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:12px;background:#131a2e;border:1px solid #1f2946;font-size:13px;font-weight:700;color:#a3aec5;cursor:pointer}
.pp-room{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:#facc15}
.pp-room .code{padding:4px 12px;background:rgba(250,204,21,.15);border:1px solid rgba(250,204,21,.4);border-radius:8px;letter-spacing:2px}
.pp-status{font-size:12px;font-weight:800;padding:6px 12px;border-radius:20px;background:rgba(99,102,241,.15);border:1px solid rgba(99,102,241,.4);color:#a5b4fc}
.pp-status.online{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.4);color:#4ade80}

/* СЧЁТ */
.pp-score{display:flex;align-items:center;justify-content:center;gap:20px;padding:8px 16px;background:#0d1424}
.pp-score-num{font-size:38px;font-weight:900;font-variant-numeric:tabular-nums;min-width:60px;text-align:center}
.pp-score-num.me{color:#4ade80;text-shadow:0 0 20px rgba(34,197,94,.6)}
.pp-score-num.enemy{color:#f87171;text-shadow:0 0 20px rgba(239,68,68,.6)}
.pp-score-label{font-size:11px;color:#7c88a3;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;text-align:center}
.pp-vs{font-size:20px;font-weight:900;color:#7c88a3}

/* СТОЛ */
.pp-field-wrap{flex:1;position:relative;overflow:hidden;background:#1e3a5f;touch-action:none}
.pp-field{position:absolute;inset:0;width:100%;height:100%}
.pp-field canvas{display:block;width:100%;height:100%}

/* ФИНАЛ */
.pp-final{position:absolute;inset:0;background:rgba(0,0,0,.9);backdrop-filter:blur(8px);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:100;padding:20px}
.pp-final.show{display:flex}
.pp-final-icon{font-size:100px;line-height:1;animation:finalPop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes finalPop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.pp-final-text{font-size:32px;font-weight:900;margin:20px 0 8px;text-align:center}
.pp-final-text.win{color:#4ade80}
.pp-final-text.lose{color:#f87171}
.pp-final-sub{color:#7c88a3;font-size:16px;margin-bottom:30px;font-weight:700}
.pp-final-btn{padding:16px 40px;border-radius:16px;background:linear-gradient(135deg,#818cf8,#6366f1);color:#fff;font-size:17px;font-weight:900;cursor:pointer;border:none;box-shadow:0 12px 30px -10px rgba(99,102,241,.9)}

/* МЕНЮ */
.pp-menu{position:absolute;inset:0;background:linear-gradient(180deg,#0a0e1a,#0d1424);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;z-index:200;gap:14px}
.pp-menu.hidden{display:none}
.pp-menu-icon{font-size:90px;line-height:1;filter:drop-shadow(0 10px 30px rgba(99,102,241,.5))}
.pp-menu-title{font-size:32px;font-weight:900;background:linear-gradient(90deg,#818cf8,#facc15);-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center}
.pp-menu-sub{font-size:14px;color:#7c88a3;text-align:center;margin-bottom:10px}
.pp-menu-btn{width:100%;max-width:340px;padding:16px;border-radius:16px;font-size:16px;font-weight:900;cursor:pointer;border:none;transition:.2s;display:flex;align-items:center;justify-content:center;gap:10px}
.pp-menu-btn:active{transform:scale(.97)}
.pp-menu-btn.primary{background:linear-gradient(135deg,#818cf8,#6366f1);color:#fff;box-shadow:0 12px 30px -10px rgba(99,102,241,.9)}
.pp-menu-btn.secondary{background:#131a2e;color:#e8ecf5;border:1px solid #2a3555}
.pp-menu-btn.gold{background:linear-gradient(135deg,#facc15,#f59e0b);color:#1a1408;box-shadow:0 12px 30px -10px rgba(250,204,21,.9)}
.pp-input-row{width:100%;max-width:340px;display:flex;gap:8px}
.pp-input{flex:1;padding:16px;border-radius:14px;background:#131a2e;border:1px solid #2a3555;color:#fff;font-size:20px;font-weight:900;text-align:center;letter-spacing:3px;text-transform:uppercase;outline:none}
.pp-input::placeholder{color:#4a5573;letter-spacing:1px;font-size:14px}

/* ХЕЛП */
.pp-help{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font-size:12px;color:#7c88a3;font-weight:700;text-align:center;padding:8px 16px;background:rgba(13,20,36,.9);border-radius:20px;border:1px solid rgba(255,255,255,.06);white-space:nowrap}

/* ПАУЗА */
.pp-pause-btn{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;background:rgba(13,20,36,.8);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;z-index:10;color:#fff}

/* ТОСТ */
.pp-toast{position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-40px);padding:12px 22px;border-radius:14px;background:rgba(13,20,36,.98);border:1px solid rgba(99,102,241,.5);backdrop-filter:blur(14px);font-weight:800;font-size:13px;z-index:300;opacity:0;pointer-events:none;transition:.3s;white-space:nowrap;max-width:92vw}
.pp-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.pp-toast.win{border-color:rgba(34,197,94,.6);color:#4ade80}
.pp-toast.lose{border-color:rgba(239,68,68,.6);color:#f87171}
</style>
</head>
<body>

<div class="pp-top">
  <button class="pp-back" onclick="ppExit()">← Назад</button>
  <div class="pp-room" id="ppRoom">🏓 <span class="code" id="ppRoomCode">—</span></div>
  <div class="pp-status" id="ppStatus">Не подключён</div>
</div>

<div class="pp-score">
  <div><div class="pp-score-num me" id="ppMyScore">0</div><div class="pp-score-label">Ты</div></div>
  <div class="pp-vs">:</div>
  <div><div class="pp-score-num enemy" id="ppEnemyScore">0</div><div class="pp-score-label">Соперник</div></div>
</div>

<div class="pp-field-wrap" id="ppField">
  <div class="pp-help">👆 Води пальцем — ракетка следует за ним</div>
</div>

<div class="pp-final" id="ppFinal">
  <div class="pp-final-icon" id="ppFinalIcon">🏆</div>
  <div class="pp-final-text win" id="ppFinalText">Победа!</div>
  <div class="pp-final-sub" id="ppFinalSub">11 : 7</div>
  <button class="pp-final-btn" onclick="ppExitFinal()">Играть снова</button>
</div>

<div class="pp-menu" id="ppMenu">
  <div class="pp-menu-icon">🏓</div>
  <div class="pp-menu-title">Пинг-понг</div>
  <div class="pp-menu-sub">Онлайн с другом или против бота</div>
  <button class="pp-menu-btn primary" onclick="ppCreateRoom()">🎮 Создать игру</button>
  <button class="pp-menu-btn secondary" onclick="ppJoinMode()">🔗 Войти по коду</button>
  <button class="pp-menu-btn gold" onclick="ppPlayBot()">🤖 Играть с ботом</button>
  <div class="pp-input-row" id="ppJoinRow" style="display:none">
    <input class="pp-input" id="ppJoinInput" placeholder="КОД" maxlength="4" autocomplete="off">
    <button class="pp-menu-btn primary" style="width:auto;padding:0 24px" onclick="ppJoinRoom()">→</button>
  </div>
</div>

<div class="pp-toast" id="ppToast"></div>

<script>
/* ============================================================
   ПИНГ-ПОНГ ОНЛАЙН + БОТ
   ============================================================ */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, set, update, onDisconnect, serverTimestamp, get }
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyALlhAOBT5zQFtZuUIReR57l9xDadqBC5A",
  authDomain: "betsite-4e6e8.firebaseapp.com",
  databaseURL: "https://betsite-4e6e8-default-rtdb.firebaseio.com",
  projectId: "betsite-4e6e8",
  storageBucket: "betsite-4e6e8.firebasestorage.app",
  messagingSenderId: "574363288522",
  appId: "1:574363288522:web:fdcf0bb7b0bfadf6634533"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* ===== КОНСТАНТЫ ===== */
const WIN_SCORE = 11;
const FIELD_W = 800;   // внутренние координаты
const FIELD_H = 1200;
const PADDLE_W = 140;
const PADDLE_H = 20;
const PADDLE_MARGIN = 60;
const BALL_R = 18;
const BALL_SPEED_START = 11;
const BALL_SPEED_MAX = 22;

/* ===== МОЙ ID ===== */
const MY_ID = (()=>{
  let id = localStorage.getItem('pp_uid');
  if(!id){ id = 'u'+Math.random().toString(36).slice(2,10); localStorage.setItem('pp_uid', id); }
  return id;
})();

/* ===== СОСТОЯНИЕ ===== */
const G = {
  mode: 'menu',          // menu | solo_bot | online
  roomCode: null,
  mySide: 'bottom',      // bottom | top
  role: 'host',          // host | guest
  running: false,
  // Игровое поле
  myY: FIELD_H - 200,
  enemyY: 200,
  ball: { x: FIELD_W/2, y: FIELD_H/2, vx: 0, vy: 0, speed: BALL_SPEED_START },
  myScore: 0,
  enemyScore: 0,
  lastHitBy: null,
  raf: null,
  lastSyncTime: 0,
  syncTick: 0,
  botEnabled: false,
  botTargetY: 200,
  pointCooldown: false
};

/* ===== DOM ===== */
const fieldWrap = document.getElementById('ppField');
const canvas = document.createElement('canvas');
canvas.style.display = 'block';
canvas.style.width = '100%';
canvas.style.height = '100%';
fieldWrap.appendChild(canvas);
const ctx = canvas.getContext('2d');

const $ = id => document.getElementById(id);

/* ===== РАЗМЕРЫ ===== */
function resizeCanvas(){
  const dpr = window.devicePixelRatio || 1;
  const rect = fieldWrap.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  canvas._w = rect.width;
  canvas._h = rect.height;
}
window.addEventListener('resize', resizeCanvas);
setTimeout(resizeCanvas, 100);

/* ===== ТОСТ ===== */
let toastT = null;
function toast(msg, type){
  type = type || '';
  const t = $('ppToast');
  t.textContent = msg;
  t.className = 'pp-toast show ' + type;
  clearTimeout(toastT);
  toastT = setTimeout(() => { t.className = 'pp-toast ' + type; }, 2200);
}

/* ===== ЗВУК ===== */
let audioCtx = null;
function initAudio(){
  if(!audioCtx){
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
  }
}
function beep(freq, dur, type, vol){
  if(!audioCtx) return;
  type = type || 'sine'; vol = vol || 0.05;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + dur);
}
function soundHit(){ beep(500, 0.05, 'sine', 0.06); }
function soundWall(){ beep(350, 0.04, 'sine', 0.04); }
function soundGoal(){ beep(800, 0.15); setTimeout(()=>beep(1000, 0.15), 100); }
function soundLoseGoal(){ beep(300, 0.2, 'sawtooth', 0.06); }
function soundWin(){ beep(600,0.1); setTimeout(()=>beep(800,0.1),80); setTimeout(()=>beep(1000,0.2),160); }

/* ===== ВИБРАЦИЯ ===== */
function vibrate(p){ if(navigator.vibrate) navigator.vibrate(p); }

/* ===== ОТРИСОВКА ПОЛЯ ===== */
function draw(){
  if(!canvas._w) resizeCanvas();
  const w = canvas._w, h = canvas._h;
  const scaleX = w / FIELD_W;
  const scaleY = h / FIELD_H;

  // Стол — синий градиент
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, '#0f4c81');
  grad.addColorStop(0.5, '#1565a0');
  grad.addColorStop(1, '#0f4c81');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);

  // Боковые линии
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 2 * scaleX;
  ctx.strokeRect(6 * scaleX, 6 * scaleY, w - 12 * scaleX, h - 12 * scaleY);

  // Центральная линия
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 3 * scaleX;
  ctx.beginPath();
  ctx.moveTo(0, h / 2);
  ctx.lineTo(w, h / 2);
  ctx.stroke();

  // Сетка (пунктиром)
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 2 * scaleX;
  ctx.setLineDash([6 * scaleX, 6 * scaleX]);
  ctx.beginPath();
  ctx.moveTo(0, h / 2 - 1);
  ctx.lineTo(w, h / 2 - 1);
  ctx.stroke();
  ctx.setLineDash([]);

  // Моя ракетка (внизу)
  ctx.shadowBlur = 20;
  ctx.shadowColor = '#4ade80';
  ctx.fillStyle = '#4ade80';
  ctx.beginPath();
  ctx.roundRect(
    (FIELD_W/2 - PADDLE_W/2) * scaleX,
    G.myY * scaleY,
    PADDLE_W * scaleX,
    PADDLE_H * scaleY,
    PADDLE_H/2 * scaleX
  );
  ctx.fill();

  // Ракетка соперника (сверху)
  ctx.shadowColor = '#f87171';
  ctx.fillStyle = '#f87171';
  ctx.beginPath();
  ctx.roundRect(
    (G.enemyY - PADDLE_W/2) * scaleX,  // enemyY здесь это X (горизонтальное положение)
    PADDLE_MARGIN * scaleY,
    PADDLE_W * scaleX,
    PADDLE_H * scaleY,
    PADDLE_H/2 * scaleX
  );
  ctx.fill();

  ctx.shadowBlur = 0;

  // Мяч
  const bx = G.ball.x * scaleX;
  const by = G.ball.y * scaleY;
  ctx.shadowBlur = 25;
  ctx.shadowColor = '#facc15';
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(bx, by, BALL_R * scaleX, 0, Math.PI * 2);
  ctx.fill();

  // Ядро мяча
  ctx.fillStyle = '#facc15';
  ctx.beginPath();
  ctx.arc(bx, by, BALL_R * 0.6 * scaleX, 0, Math.PI * 2);
  ctx.fill();

  ctx.shadowBlur = 0;
}

/* Polyfill для roundRect (Safari старый) */
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
    if(w < 2*r) r = w/2;
    if(h < 2*r) r = h/2;
    this.beginPath();
    this.moveTo(x+r, y);
    this.arcTo(x+w, y, x+w, y+h, r);
    this.arcTo(x+w, y+h, x, y+h, r);
    this.arcTo(x, y+h, x, y, r);
    this.arcTo(x, y, x+w, y, r);
    this.closePath();
    return this;
  };
}

/* ===== УПРАВЛЕНИЕ РАКЕТКОЙ ===== */
let pointerActive = false;
fieldWrap.addEventListener('pointerdown', e => {
  pointerActive = true;
  movePaddle(e);
});
fieldWrap.addEventListener('pointermove', e => {
  if(!pointerActive) return;
  movePaddle(e);
});
fieldWrap.addEventListener('pointerup', () => pointerActive = false);
fieldWrap.addEventListener('pointercancel', () => pointerActive = false);

function movePaddle(e){
  const rect = fieldWrap.getBoundingClientRect();
  const y = e.clientY - rect.top;
  const fieldY = (y / rect.height) * FIELD_H;
  // Моя ракетка — нижняя половина
  const minY = FIELD_H / 2 + 30;
  const maxY = FIELD_H - PADDLE_H - 20;
  G.myY = Math.max(minY, Math.min(maxY, fieldY - PADDLE_H/2));
}

/* ===== ФИЗИКА ===== */
function resetBall(dir){
  G.ball.x = FIELD_W / 2;
  G.ball.y = FIELD_H / 2;
  G.ball.speed = BALL_SPEED_START;
  const angle = (Math.random() * Math.PI / 3) - Math.PI / 6; // -30°..+30°
  const speed = G.ball.speed;
  G.ball.vx = Math.sin(angle) * speed;
  G.ball.vy = dir * Math.cos(angle) * speed;
}

function physicsStep(){
  if(!G.running) return;

  // Движение мяча
  G.ball.x += G.ball.vx;
  G.ball.y += G.ball.vy;

  // Отскок от боковых стен
  if(G.ball.x < BALL_R){
    G.ball.x = BALL_R;
    G.ball.vx = Math.abs(G.ball.vx);
    soundWall();
  }
  if(G.ball.x > FIELD_W - BALL_R){
    G.ball.x = FIELD_W - BALL_R;
    G.ball.vx = -Math.abs(G.ball.vx);
    soundWall();
  }

  // Верхняя ракетка соперника
  const enemyPaddleLeft = G.enemyY - PADDLE_W / 2;
  const enemyPaddleRight = G.enemyY + PADDLE_W / 2;
  const enemyTop = PADDLE_MARGIN;
  const enemyBottom = PADDLE_MARGIN + PADDLE_H;

  if(G.ball.y - BALL_R < enemyBottom && G.ball.y - BALL_R > enemyTop - 20){
    if(G.ball.x > enemyPaddleLeft && G.ball.x < enemyPaddleRight){
      if(G.ball.vy < 0){
        G.ball.vy = Math.abs(G.ball.vy);
        G.ball.y = enemyBottom + BALL_R;
        // отскок в зависимости от места удара
        const hitPos = (G.ball.x - G.enemyY) / (PADDLE_W / 2);
        G.ball.vx += hitPos * 3;
        // ускорение
        G.ball.speed = Math.min(BALL_SPEED_MAX, G.ball.speed * 1.05);
        const mag = Math.sqrt(G.ball.vx*G.ball.vx + G.ball.vy*G.ball.vy);
        G.ball.vx = G.ball.vx / mag * G.ball.speed;
        G.ball.vy = G.ball.vy / mag * G.ball.speed;
        G.lastHitBy = 'enemy';
        soundHit();
      }
    }
  }

  // Моя ракетка
  const myPaddleLeft = FIELD_W / 2 - PADDLE_W / 2;
  const myPaddleRight = FIELD_W / 2 + PADDLE_W / 2;
  const myTop = G.myY;
  const myBottom = G.myY + PADDLE_H;

  if(G.ball.y + BALL_R > myTop && G.ball.y + BALL_R < myBottom + 20){
    if(G.ball.x > myPaddleLeft && G.ball.x < myPaddleRight){
      if(G.ball.vy > 0){
        G.ball.vy = -Math.abs(G.ball.vy);
        G.ball.y = myTop - BALL_R;
        const hitPos = (G.ball.x - FIELD_W/2) / (PADDLE_W / 2);
        G.ball.vx += hitPos * 3;
        G.ball.speed = Math.min(BALL_SPEED_MAX, G.ball.speed * 1.05);
        const mag = Math.sqrt(G.ball.vx*G.ball.vx + G.ball.vy*G.ball.vy);
        G.ball.vx = G.ball.vx / mag * G.ball.speed;
        G.ball.vy = G.ball.vy / mag * G.ball.speed;
        G.lastHitBy = 'me';
        soundHit();
      }
    }
  }

  // Гол мне (мяч улетел вверх)
  if(G.ball.y < -BALL_R * 2 && !G.pointCooldown){
    G.pointCooldown = true;
    G.enemyScore++;
    updateScoreUI();
    soundLoseGoal();
    vibrate([80, 40, 80]);
    if(G.mode === 'online' && G.role === 'host'){
      syncState();
    }
    setTimeout(() => {
      if(G.enemyScore >= WIN_SCORE){ endGame(false); }
      else { resetBall(1); G.pointCooldown = false; }
    }, 800);
  }

  // Гол сопернику (мяч улетел вниз)
  if(G.ball.y > FIELD_H + BALL_R * 2 && !G.pointCooldown){
    G.pointCooldown = true;
    G.myScore++;
    updateScoreUI();
    soundGoal();
    vibrate([50]);
    if(G.mode === 'online' && G.role === 'host'){
      syncState();
    }
    setTimeout(() => {
      if(G.myScore >= WIN_SCORE){ endGame(true); }
      else { resetBall(-1); G.pointCooldown = false; }
    }, 800);
  }

  // Бот
  if(G.botEnabled){
    botStep();
  }

  // Онлайн-синхронизация
  if(G.mode === 'online'){
    syncTick++;
    if(syncTick % 3 === 0){ syncState(); }
  }

  draw();
  G.raf = requestAnimationFrame(physicsStep);
}

/* ===== БОТ ===== */
function botStep(){
  const target = G.ball.x;
  const diff = target - G.botTargetY;
  G.botTargetY += diff * 0.08;
  G.botTargetY = Math.max(PADDLE_W/2 + 10, Math.min(FIELD_W - PADDLE_W/2 - 10, G.botTargetY));
  G.enemyY = G.botTargetY;
}

/* ===== UI СЧЁТА ===== */
function updateScoreUI(){
  $('ppMyScore').textContent = G.myScore;
  $('ppEnemyScore').textContent = G.enemyScore;
}

/* ===== МЕНЮ ===== */
function ppCreateRoom(){
  initAudio();
  const code = genCode();
  G.roomCode = code;
  G.mode = 'online';
  G.role = 'host';
  G.mySide = 'bottom';

  $('ppRoomCode').textContent = code;
  $('ppStatus').textContent = 'Ждём игрока...';
  $('ppMenu').classList.add('hidden');
  $('ppFinal').classList.remove('show');

  // Подключаем Firebase
  const roomRef = ref(db, 'pingpong/rooms/' + code);
  set(roomRef, {
    hostId: MY_ID,
    createdAt: serverTimestamp(),
    state: 'waiting',
    hostScore: 0,
    guestScore: 0,
    ball: { x: FIELD_W/2, y: FIELD_H/2, vx: 0, vy: 0, speed: BALL_SPEED_START }
  });
  onDisconnect(ref(db, 'pingpong/rooms/' + code + '/hostId')).remove();

  // Слушаем присоединение гостя
  onValue(roomRef, snap => {
    const data = snap.val();
    if(!data) return;
    if(data.guestId && data.state === 'playing'){
      $('ppStatus').textContent = 'Игра началась!';
      $('ppStatus').classList.add('online');
      startOnlineGame();
    }
  });

  toast('Код комнаты: ' + code, 'win');
}

function ppJoinMode(){
  const row = $('ppJoinRow');
  row.style.display = row.style.display === 'none' ? 'flex' : 'none';
}

function ppJoinRoom(){
  const code = ($('ppJoinInput').value || '').trim().toUpperCase();
  if(code.length !== 4){ return toast('Код из 4 букв', 'lose'); }
  initAudio();

  const roomRef = ref(db, 'pingpong/rooms/' + code);
  get(roomRef).then(snap => {
    const data = snap.val();
    if(!data){ return toast('Комната не найдена', 'lose'); }
    if(data.guestId && data.guestId !== MY_ID){ return toast('Комната занята', 'lose'); }

    G.roomCode = code;
    G.mode = 'online';
    G.role = 'guest';
    G.mySide = 'top';

    $('ppRoomCode').textContent = code;
    $('ppStatus').textContent = 'Подключено!';
    $('ppStatus').classList.add('online');
    $('ppMenu').classList.add('hidden');

    update(roomRef, {
      guestId: MY_ID,
      state: 'playing',
      guestJoinedAt: serverTimestamp()
    });
    onDisconnect(ref(db, 'pingpong/rooms/' + code + '/guestId')).remove();

    onValue(roomRef, s => {
      const d = s.val();
      if(!d) return;
      // Читаем состояние хоста
      if(G.role === 'guest'){
        // Синхронизируем мяч и счёт
        if(d.ball){
          G.ball.x = d.ball.x;
          G.ball.y = d.ball.y;
          G.ball.vx = d.ball.vx;
          G.ball.vy = d.ball.vy;
          G.ball.speed = d.ball.speed || BALL_SPEED_START;
        }
        G.myScore = d.hostScore || 0;   // для гостя хост — соперник
        G.enemyScore = d.guestScore || 0;
        updateScoreUI();
        // Гость всегда видит нижнюю ракетку хостом сверху — но играет снизу
        // Поменяем местами в отображении? Нет — гость снизу.
        // На самом деле мы просто меняем стороны при отрисовке
      }
    });

    startOnlineGame();
    toast('Ты подключился!', 'win');
  }).catch(e => {
    toast('Ошибка подключения', 'lose');
  });
}

function startOnlineGame(){
  G.running = true;
  G.myScore = 0;
  G.enemyScore = 0;
  updateScoreUI();
  $('ppFinal').classList.remove('show');

  if(G.role === 'host'){
    // Хост управляет мячом
    resetBall(1);
    if(G.raf) cancelAnimationFrame(G.raf);
    physicsStep();
  } else {
    // Гость — только отрисовка, физика от хоста
    if(G.raf) cancelAnimationFrame(G.raf);
    guestRenderLoop();
  }
}

function guestRenderLoop(){
  if(!G.running) return;
  draw();
  G.raf = requestAnimationFrame(guestRenderLoop);
}

function syncState(){
  if(!G.roomCode || G.mode !== 'online' || G.role !== 'host') return;
  update(ref(db, 'pingpong/rooms/' + G.roomCode), {
    ball: { x: G.ball.x, y: G.ball.y, vx: G.ball.vx, vy: G.ball.vy, speed: G.ball.speed },
    hostScore: G.myScore,
    guestScore: G.enemyScore
  });
}

/* ===== БОТ ===== */
function ppPlayBot(){
  initAudio();
  G.mode = 'solo_bot';
  G.botEnabled = true;
  G.myScore = 0;
  G.enemyScore = 0;
  G.running = true;
  G.myY = FIELD_H - 200;
  G.botTargetY = FIELD_W / 2;
  G.enemyY = G.botTargetY;
  G.pointCooldown = false;

  $('ppRoomCode').textContent = 'БОТ';
  $('ppStatus').textContent = 'Игра с ботом';
  $('ppStatus').classList.add('online');
  $('ppMenu').classList.add('hidden');
  $('ppFinal').classList.remove('show');

  updateScoreUI();
  resetBall(1);
  if(G.raf) cancelAnimationFrame(G.raf);
  physicsStep();
}

/* ===== КОНЕЦ ИГРЫ ===== */
function endGame(win){
  G.running = false;
  if(G.raf) cancelAnimationFrame(G.raf);

  if(win){ soundWin(); vibrate([100, 50, 100, 50, 200]); }
  else { soundLoseGoal(); vibrate([200, 100, 200]); }

  $('ppFinalIcon').textContent = win ? '🏆' : '😢';
  $('ppFinalText').textContent = win ? 'Победа!' : 'Поражение';
  $('ppFinalText').className = 'pp-final-text ' + (win ? 'win' : 'lose');
  $('ppFinalSub').textContent = G.myScore + ' : ' + G.enemyScore;
  $('ppFinal').classList.add('show');
}

function ppExitFinal(){
  $('ppFinal').classList.remove('show');
  $('ppMenu').classList.remove('hidden');
  $('ppStatus').textContent = 'Не подключён';
  $('ppStatus').classList.remove('online');
  $('ppRoomCode').textContent = '—';
  G.mode = 'menu';
  G.running = false;
  G.botEnabled = false;
  if(G.raf) cancelAnimationFrame(G.raf);
  if(G.roomCode){
    set(ref(db, 'pingpong/rooms/' + G.roomCode), null);
    G.roomCode = null;
  }
}

/* ===== ГЕНЕРАЦИЯ КОДА ===== */
function genCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code = '';
  for(let i = 0; i < 4; i++){
    code += chars[Math.floor(Math.random() * chars.length)];
  }
  return code;
}

/* ===== ЗАКРЫТИЕ ===== */
function ppExit(){
  if(confirm('Выйти из игры?')){
    ppExitFinal();
    window.history.back();
  }
}

/* ===== СТАРТ ===== */
resizeCanvas();
draw();

// Если в URL есть #room-XXXX — сразу присоединяемся
const hash = window.location.hash;
if(hash && hash.startsWith('#room-')){
  const code = hash.replace('#room-', '').toUpperCase().slice(0, 4);
  $('ppJoinInput').value = code;
  setTimeout(() => { ppJoinRoom(); }, 500);
}

window.addEventListener('beforeunload', () => {
  if(G.roomCode){
    set(ref(db, 'pingpong/rooms/' + G.roomCode), null);
  }
});
</script>
</body>
</html>
