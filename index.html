<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f1e35">
<title>SportLive — Лайв-линия</title>
<style>
:root{
  --bg:#081226; --bg2:#0a1730; --card:#12233f; --card2:#1a2f52;
  --bd:#243b61; --bd2:#35507e; --t:#f2f6fc; --t2:#a9b8ce; --t3:#6e7e96;
  --yellow:#ffd94a; --green:#4caf50; --green2:#51e07c; --red:#e8322a; --red2:#ff6b62; --live:#ff3b30;
  --brand:#e8322a; --brand2:#ff6b3d;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:radial-gradient(1200px 400px at 50% -100px,rgba(232,50,42,.12),transparent),var(--bg);color:var(--t);min-height:100vh;font-size:14px;line-height:1.4;padding-bottom:120px;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
.hdr{position:sticky;top:0;z-index:100;background:linear-gradient(180deg,#0c1a36 0%,#0a1730 100%);border-bottom:1px solid var(--bd);box-shadow:0 4px 18px rgba(0,0,0,.35);}
.hdr-top{display:flex;align-items:center;gap:10px;padding:10px 14px;}
.logo{display:flex;align-items:center;gap:7px;font-size:17px;font-weight:900;color:#fff;white-space:nowrap;letter-spacing:.4px;}
.logo::before{content:"";width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 0 12px rgba(232,50,42,.7);}
.logo span{color:var(--yellow);font-weight:900;}
.hdr-tabs{display:flex;gap:4px;flex:1;overflow-x:auto;padding:0 4px;}
.hdr-tabs::-webkit-scrollbar{display:none;}
.htab{flex-shrink:0;padding:7px 12px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--t2);white-space:nowrap;border:1px solid transparent;}
.htab.on{color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 3px 10px rgba(232,50,42,.4);}
.hdr-actions{display:flex;gap:6px;align-items:center;flex-shrink:0;margin-left:auto;}
.balance{display:flex;align-items:center;gap:5px;background:#1a2f52;border:1px solid var(--yellow);padding:7px 11px;border-radius:9px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;}
.balance b{color:var(--yellow);font-weight:900;}
.hbtn{min-width:34px;height:34px;border-radius:9px;background:var(--card);border:1px solid var(--bd);color:var(--t2);font-size:15px;display:flex;align-items:center;justify-content:center;padding:0 8px;}
.page{max-width:1200px;margin:0 auto;padding:14px;}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:16px 0 10px;}
.sec-t{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;}
.sec-t::before{content:"";width:3px;height:14px;background:var(--yellow);border-radius:2px;}
.sec-t .cnt{font-size:11.5px;color:var(--t3);}
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;}
.strip::-webkit-scrollbar{display:none;}
.lcard{flex-shrink:0;min-width:210px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;cursor:pointer;}
.lcard .lt{font-size:11px;color:var(--t3);margin-bottom:4px;}
.lcard .lm{font-size:12.5px;font-weight:800;}
.lcard .ls{font-size:12px;color:var(--yellow);font-weight:800;}
.mc{background:linear-gradient(180deg,#142847,#101f3a);border:1px solid var(--bd);border-radius:14px;margin-bottom:10px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.3);}
.mc.live{border-left:3px solid var(--live);}
.mc.soon{opacity:.92;border-style:dashed;}
.mc-head{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-bottom:1px solid var(--bd);font-size:12px;color:var(--t2);background:rgba(255,255,255,.02);}
.mc-head div:first-child{color:var(--t);font-weight:800;}
.lcard:hover{border-color:var(--brand);}
.mc-hint{transition:color .15s;}
.mc[data-card]:hover .mc-hint{color:var(--yellow);}
.cp-bar{background:linear-gradient(90deg,#16294d,#231a3a);}
#cpPlace{background:linear-gradient(135deg,var(--yellow),#ff9d2e);box-shadow:0 4px 16px rgba(255,217,74,.25);}
#cpPlace:disabled{box-shadow:none;}
.modal{border-top:3px solid var(--brand);}
.mc-status.live{color:var(--live);font-weight:800;animation:blink 1.4s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.4;}}
.mc-teams{padding:10px 12px 6px;}
.mc-team{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-weight:700;font-size:14.5px;}
.mc-score{font-weight:900;font-size:19px;min-width:34px;text-align:right;background:#0b172a;border-radius:8px;padding:1px 6px;font-variant-numeric:tabular-nums;}
.mc-score.w{color:var(--green2);box-shadow:inset 0 0 0 1px rgba(81,224,124,.4);}
.lg-head{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;margin:12px 0 8px;background:linear-gradient(90deg,#16294d,#101f3a);border:1px solid var(--bd);border-radius:10px;font-size:13px;font-weight:800;}
.lg-head:first-child{margin-top:0;}
.lg-live{color:var(--live);font-size:11px;font-weight:900;animation:blink 1.4s infinite;}
.lg-n{color:var(--t3);font-size:11px;font-weight:800;background:var(--card2);border-radius:10px;padding:1px 8px;}
.mc-odds{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 12px 8px;}
.mc-odds.two{grid-template-columns:repeat(2,1fr);}
.odd{background:linear-gradient(180deg,#2b4570,#22395c);border:1px solid var(--bd2);border-radius:10px;padding:8px 4px;text-align:center;transition:transform .12s,box-shadow .12s;min-width:0;}
.odd:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.4);}
.odd:active{transform:scale(.96);}
.odd.sel{background:linear-gradient(135deg,var(--brand),var(--brand2));border-color:var(--brand);color:#fff;box-shadow:0 3px 12px rgba(232,50,42,.5);}
.odd.cl{opacity:.38;pointer-events:none;filter:grayscale(.6);}
.odd .olbl{display:block;font-size:10px;color:var(--t2);font-weight:700;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.odd.sel .olbl{color:rgba(255,255,255,.85);}
.odd .oval{display:block;font-weight:900;font-size:15px;font-variant-numeric:tabular-nums;}
.odd .oval.up{color:var(--green2);}
.odd .oval.up::after{content:" ▲";font-size:9px;}
.odd .oval.dn{color:var(--red2);}
.odd .oval.dn::after{content:" ▼";font-size:9px;}
.mc-hint{text-align:center;font-size:11.5px;color:var(--t3);padding:7px;cursor:pointer;border-top:1px solid var(--bd);}
.mkt-sec{padding:8px 12px 12px;}
.mkt-t{font-size:12px;font-weight:800;color:var(--t2);margin:8px 0 6px;text-transform:uppercase;}
.mkt-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.mkt-odd .oval.up{color:var(--green2);}
.mkt-odd .oval.up::after{content:" ▲";font-size:9px;}
.mkt-odd .oval.dn{color:var(--red2);}
.mkt-odd .oval.dn::after{content:" ▼";font-size:9px;}
.avatar{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;font-size:11px;font-weight:900;color:#fff;flex-shrink:0;margin-right:7px;vertical-align:-6px;}
.hero{background:linear-gradient(135deg,#1b2f55,#3a1530 60%,#1b2f55);border:1px solid var(--yellow);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 6px 22px rgba(255,217,74,.12);}
.hero .htag{display:inline-block;font-size:10.5px;font-weight:900;color:#0b172a;background:var(--yellow);border-radius:6px;padding:2px 8px;margin-bottom:8px;letter-spacing:.5px;}
.hero .hteams{font-size:15px;font-weight:900;text-align:center;margin:2px 0 4px;}
.hero .hscore{font-size:30px;font-weight:900;text-align:center;color:var(--yellow);}
.hero .hclock{text-align:center;font-size:12px;color:var(--t2);margin-bottom:8px;}
.hero .hodds{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.hero .hodds.two{grid-template-columns:repeat(2,1fr);}
.pagenav{display:flex;gap:6px;margin-bottom:4px;}
.pagenav button{flex:1;padding:9px;border-radius:10px;background:var(--card);border:1px solid var(--bd);font-weight:800;font-size:13px;color:var(--t2);}
.pagenav button.on{background:var(--card2);color:var(--yellow);border-color:var(--yellow);}
.bonus-card{background:linear-gradient(135deg,#233a63,#3d2a55);border:1px solid var(--bd2);border-radius:14px;padding:14px;margin-bottom:10px;}
.mission{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:13px;}
.mission .bar{height:6px;background:#0b172a;border-radius:4px;margin-top:6px;overflow:hidden;}
.mission .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--yellow),#ff9d2e);}
.stat-bars{display:flex;flex-direction:column;gap:7px;margin:6px 0;}
.sbar{display:grid;grid-template-columns:34px 1fr 34px;gap:8px;align-items:center;font-size:12px;font-weight:800;}
.sbar .mid{height:7px;background:#0b172a;border-radius:4px;overflow:hidden;display:flex;}
.sbar .mid i{display:block;height:100%;}
.mkt-odd{background:var(--bd);border-radius:8px;padding:8px;text-align:center;}
.mkt-odd.sel{background:var(--yellow);color:#0b172a;}
.mkt-odd.cl{opacity:.4;pointer-events:none;}
.mkt-odd .olbl{display:block;font-size:11px;color:var(--t2);}
.mkt-odd.sel .olbl{color:#0b172a;}
.mkt-odd .oval{display:block;font-weight:900;}
.fbar{display:flex;gap:6px;padding:0 0 12px;overflow-x:auto;}
.fbar::-webkit-scrollbar{display:none;}
.fchip{flex-shrink:0;padding:6px 12px;border-radius:7px;background:var(--card);border:1px solid var(--bd);font-size:12px;font-weight:600;color:var(--t2);white-space:nowrap;}
.fchip.on{background:var(--yellow);color:#0b172a;border-color:var(--yellow);}
.coupon{position:fixed;left:0;right:0;bottom:0;z-index:200;background:#0b172a;border-top:1px solid var(--bd);transform:translateY(calc(100% - 52px));transition:transform .25s;}
.coupon.show{transform:none;}
.coupon.open{transform:none;}
.cp-bar{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;font-weight:800;}
.cp-bar .n{background:var(--yellow);color:#0b172a;border-radius:12px;padding:1px 8px;font-size:12px;}
.cp-bar .o{margin-left:auto;color:var(--green2);}
.cp-body{max-height:46vh;overflow:auto;padding:0 14px 14px;}
.cp-item{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:12.5px;}
.cp-item .info{flex:1;}
.cp-item .pick{font-weight:800;}
.cp-item .teams{color:var(--t2);font-size:11.5px;}
.cp-item .coef{color:var(--green2);font-weight:900;white-space:nowrap;}
.cp-item .x{color:var(--t3);padding:4px 8px;font-size:16px;}
.cp-type{display:flex;gap:6px;margin:8px 0;}
.cp-type button{flex:1;padding:8px;border-radius:8px;background:var(--card);border:1px solid var(--bd);font-weight:700;color:var(--t2);}
.cp-type button.on{background:var(--yellow);color:#0b172a;}
.cp-stake{display:flex;gap:6px;margin:8px 0;}
.cp-stake .q{flex:1;padding:8px;border-radius:8px;background:var(--card);border:1px solid var(--bd);font-weight:700;color:var(--t2);}
#cpStake{width:100%;padding:10px;border-radius:8px;background:var(--card);border:1px solid var(--bd);color:var(--t);font-weight:800;font-size:15px;outline:none;}
.cp-sum{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px;margin:8px 0;font-size:13px;}
.cp-sum .row{display:flex;justify-content:space-between;padding:2px 0;}
.cp-place{width:100%;padding:13px;border-radius:10px;background:var(--yellow);color:#0b172a;font-weight:900;font-size:15px;}
.cp-place:disabled{opacity:.4;}
.cp-empty{text-align:center;color:var(--t3);padding:20px;}
.cp-empty .em{font-size:34px;margin-bottom:6px;}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:300;display:none;align-items:flex-end;justify-content:center;}
.modal-bg.on{display:flex;}
.modal{background:var(--bg2);border:1px solid var(--bd);border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:86vh;overflow:auto;padding:14px 14px 24px;}
.mdl-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.mdl-h .t{font-size:16px;font-weight:900;}
.mdl-h .s{font-size:12px;color:var(--t3);}
.mdl-x{font-size:18px;color:var(--t2);padding:6px 10px;}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--card2);border:1px solid var(--bd);padding:10px 18px;border-radius:10px;font-size:13.5px;font-weight:700;z-index:400;opacity:0;transition:all .25s;pointer-events:none;max-width:90vw;text-align:center;}
.toast.on{opacity:1;transform:translateX(-50%);}
.toast.ok{border-color:var(--green);}
.toast.err{border-color:var(--red);}
.res-row{display:flex;justify-content:space-between;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:9px 12px;margin-bottom:6px;font-size:13px;font-weight:700;}
.prog{height:5px;background:#0b172a;border-radius:4px;margin:0 12px 8px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--yellow),#ff9d2e);border-radius:4px;transition:width .8s;}
.mc[data-card]{cursor:pointer;}
.mc[data-card]:hover{border-color:var(--yellow);}
.fav:hover{transform:scale(1.2);}
.tl{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto;margin-top:8px;}
.tl-item{display:flex;gap:8px;background:var(--card);border-radius:8px;padding:7px 10px;font-size:12.5px;}
.tl-item .mn{color:var(--green2);font-weight:900;min-width:34px;}
.stat-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;font-size:12px;padding:5px 0;border-bottom:1px solid var(--bd);}
.stat-row .c{text-align:center;color:var(--t2);}
.stat-row .v{font-weight:900;text-align:center;}
.search-row{display:flex;gap:8px;margin-bottom:10px;}
#searchInput{flex:1;padding:10px 14px;border-radius:10px;background:var(--card);border:1px solid var(--bd);color:var(--t);outline:none;font-size:13.5px;}
#searchInput:focus{border-color:var(--yellow);}
#sortSel{padding:10px;border-radius:10px;background:var(--card);border:1px solid var(--bd);color:var(--t);font-size:13px;}
.center-score{display:flex;align-items:center;justify-content:center;gap:14px;padding:14px;background:var(--card);border-radius:12px;margin-bottom:10px;}
.center-score .tm{font-weight:900;font-size:14px;flex:1;text-align:center;}
.center-score .sc{font-size:32px;font-weight:900;background:#0b172a;padding:4px 16px;border-radius:10px;white-space:nowrap;}
.ctabs{display:flex;gap:4px;background:var(--card);padding:3px;border-radius:10px;margin-bottom:10px;}
.ctabs button{flex:1;padding:8px;border-radius:8px;color:var(--t2);font-weight:700;font-size:13px;}
.ctabs button.on{background:var(--yellow);color:#0b172a;}
@media(min-width:800px){.modal-bg{align-items:center;}.modal{border-radius:16px;}.mc-odds{max-width:520px;}}
</style>
</head>
<body>
<header class="hdr">
  <div class="hdr-top">
    <div class="logo">⚡ SPORT <span>LIVE</span></div>
    <nav class="hdr-tabs" id="hdrTabs"></nav>
    <div class="hdr-actions">
      <button class="balance" id="balanceBtn">₽ <b id="balanceVal">10 000</b></button>
      <button class="hbtn" id="btnProfile">👤</button>
    </div>
  </div>
</header>
<div class="page">
  <div class="pagenav"><button data-page="main" class="on" id="pgMain">⚽ Спорт</button><button data-page="bonus" id="pgBonus">🎁 Бонусы</button><button data-page="help" id="pgHelp">❓ Помощь</button></div>
  <div id="viewMain">
  <div id="heroBox"></div>
  <div class="sec-h"><div class="sec-t">LIVE сейчас <span class="cnt" id="liveCount">0</span></div><div class="sec-more" id="seeAllLive" style="font-size:12px;font-weight:700;color:var(--yellow);cursor:pointer;">Все LIVE →</div></div>
  <div class="strip" id="liveStrip"></div>
  <div class="sec-h"><div class="sec-t"><span id="listTitle">Все матчи</span> <span class="cnt" id="listCount">0</span></div></div>
  <div class="fbar" id="filterBar"></div>
  <div class="search-row"><input id="searchInput" placeholder="🔍 Поиск: Спартак, NAVI, Махачев..."><select id="sortSel"><option value="def">По умолчанию</option><option value="live">Сначала LIVE</option><option value="coef">Мин. кэф П1</option><option value="noft">Без завершенных</option></select></div>
  <div id="matchesList"></div>
  <div class="sec-h"><div class="sec-t">Результаты <span class="cnt" id="resCount">0</span></div></div>
  <div id="resList"></div>
  <div style="text-align:center;color:var(--t3);font-size:11.5px;padding:18px 10px 4px;">⚡ SPORT LIVE · демо-симулятор · не принимает реальные ставки · 18+<br>Кэфы живые · маржа 7.5% · матчи одинаковые для всех</div>
  </div>
  <div id="viewBonus" style="display:none;"></div>
  <div id="viewHelp" style="display:none;"></div>
</div>
<div class="coupon" id="coupon">
  <div class="cp-bar" id="cpBar"><span>🎫 Купон</span><span class="n" id="cpCount">0</span><span class="o" id="cpOdds">0.00</span><span id="cpClose" style="padding:4px 8px;color:var(--t3);">✕</span></div>
  <div class="cp-body">
    <div class="cp-type"><button data-type="single" class="on">Одиночная</button><button data-type="express">Экспресс</button></div>
    <div id="cpItems"></div>
    <div class="cp-stake"><button class="q" data-s="100">100</button><button class="q" data-s="500">500</button><button class="q" data-s="1000">1К</button><button class="q" data-s="5000">5К</button></div>
    <input id="cpStake" type="number" value="100" min="10">
    <div class="cp-sum"><div class="row"><span>Коэф</span><b id="cpSumOdds">0.00</b></div><div class="row"><span>Возможный выигрыш</span><b id="cpSumWin" style="color:var(--green2);">0 ₽</b></div></div>
    <button class="cp-place" id="cpPlace">Сделать ставку</button>
  </div>
</div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modalContent"></div></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
/* ================= КОНСТАНТЫ ================= */
var REAL_TICK = 1000;
var STORAGE_KEY = 'sportlive_v5';
var MAX_DAILY = 200000;
var MIN_STAKE = 10;
/* ================= УТИЛИТЫ ================= */
function $(id){ return document.getElementById(id); }
function $all(sel){ return Array.prototype.slice.call(document.querySelectorAll(sel)); }
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function pad2(n){ return String(n).padStart(2,'0'); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fmtMoney(v){ return Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ') + ' ₽'; }
function toast(msg, type){
  try{
    var t = $('toast'); if(!t) return;
    t.textContent = msg; t.className = 'toast on ' + (type || '');
    clearTimeout(window._tt); window._tt = setTimeout(function(){ t.classList.remove('on'); }, 2600);
  }catch(e){}
}
window.addEventListener('error', function(e){
  try{ toast('Ошибка: ' + (e.message || 'JS'), 'err'); }catch(_){}
});
/* ================= ДАННЫЕ ================= */
var SPORTS = [
  {id:'football', name:'Футбол', ic:'⚽'},
  {id:'ufc', name:'UFC', ic:'🥊'},
  {id:'hockey', name:'Хоккей', ic:'🏒'},
  {id:'cyber', name:'Кибер', ic:'🎮'}
];
var TEAMS = {

function checkBets(m){
  State.history.forEach(function(hh){
    if(hh.status !== 'pending') return;
    hh.bets.forEach(function(b){
      if(b.matchId === m.id && !b.result){ var mk = m.markets[b.market]; b.result = mk ? resultOf(mk, b.pick, m) : 'lose'; }
    });
    finalizeBet(hh);
  });
}
// live-расчет "следующего гола" в момент гола
function settleLiveGoal(m, home){
  var changed = false;
  State.history.forEach(function(hh){
    if(hh.status !== 'pending') return;
    var touched = false;
    hh.bets.forEach(function(b){
      if(b.matchId === m.id && !b.result && b.market === 'Следующий гол'){
        if(b.pick === 2) b.result = 'lose';
        else b.result = (((b.pick === 0) === home) ? 'win' : 'lose');
        touched = true;
      }
    });
    if(touched){ changed = true; finalizeBet(hh); }
  });
  if(changed){ saveState(); renderResults(); }
}
function cashoutOf(hh){
  if(hh.status !== 'pending') return 0;
  var p = 1;
  for(var i=0;i<hh.bets.length;i++){
    var b = hh.bets[i], m = Manager.find(b.matchId);
    if(!m || m.finished) continue;
    var mk = m.markets[b.market]; if(!mk) continue;
    var o = mk.val[b.pick] || 1.01; p *= 1/Math.max(1.01,o);
  }
  var c = Math.round(hh.potential * p * 0.93 / 10) * 10;
  return clamp(c, 0, Math.round(hh.potential*0.97));
}
function doCashout(id){
  var hh = State.history.find(function(x){return x.id===id;}); if(!hh || hh.status!=='pending') return;
  var amt = cashoutOf(hh); if(amt <= 0){ toast('Кэшаут недоступен','err'); return; }
  if(!confirm('Кэшаут '+fmtMoney(amt)+'?')) return;
  hh.status = 'cashout'; hh.cashout = amt; State.balance += amt; addTx('Кэшаут', amt); updBal(); saveState(); toast('💰 +'+fmtMoney(amt),'ok'); openHistory();
}

function updBal(){ $('balanceVal').textContent = Math.round(State.balance).toLocaleString('ru-RU'); }
function clockOf(m){
  if(m.finished){
    if(m.sport === 'ufc' && m.method === 'KO') return 'FT · KO Р' + (m.endRound || '');
    if(m.sport === 'ufc') return 'FT · Решение';
    return 'FT';
  }
  if(m.status === 'upcoming') return '🕒 ' + countdownOf(m);
  var br = m.onBreak ? (breakInfo(m) || 'Перерыв') : breakInfo(m);
  if(br) return '⏸ ' + br;
  if(m.sport==='football') return Math.floor(m.minute)+"'";
  if(m.sport==='hockey'){ var p=Math.min(3,Math.floor(m.minute/20)+1); return 'П'+p+' · '+Math.floor(m.minute-(p-1)*20)+"'"; }
  if(m.sport==='ufc'){
    var r = clamp(Math.floor(m.minute/25)+1,1,5);
    var inR = m.minute % 25;
    if(inR < 20){ var leftS = 20 - inR; return 'Раунд '+r+'/5 · 0:'+pad2(leftS); }
    return 'Раунд '+r+'/5';
  }
  var map = Math.min(3, m.mapH + m.mapA + 1), rin = m.curH + m.curA + 1;
  if(m.curH >= 12 && m.curA >= 12) return 'Овертайм · ' + m.curH + ':' + m.curA + ' (карта ' + map + ')';
  var half = (m.curH + m.curA) < 12 ? '1-я пол.' : '2-я пол.';
  return 'Карта ' + map + ' · ' + half + ' Р' + rin + ' (' + m.mapH + ':' + m.mapA + ')';
}
function mainOdds(m){

  return {name:name, mk:m.markets[name]};
}

  +'<div class="mc-teams"><div class="mc-team"><span>'+avatarHTML(m.home)+esc(m.home)+'</span><span class="mc-score'+(fin&&m.hs>m.as?' w':'')+'" data-score="'+m.id+'" data-side="h">'+m.hs+'</span></div><div class="mc-team"><span>'+avatarHTML(m.away)+esc(m.away)+'</span><span class="mc-score'+(fin&&m.as>m.hs?' w':'')+'" data-score="'+m.id+'" data-side="a">'+m.as+'</span></div></div>'

function hashStr(s){ var h = 0; for(var i = 0; i < s.length; i++){ h = ((h << 5) - h + s.charCodeAt(i)) | 0; } return Math.abs(h); }
function formBadges(name){
  var h = hashStr(name), out = '';
  for(var i = 0; i < 5; i++){
    var r = (h >> (i * 3)) % 3;
    var ch = r === 0 ? 'В' : (r === 1 ? 'Н' : 'П');
    var col = r === 0 ? 'var(--green2)' : (r === 1 ? 'var(--t3)' : 'var(--red2)');
    out += '<span style="display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;border-radius:6px;background:var(--card2);color:' + col + ';font-weight:900;font-size:11px;margin-left:3px;">' + ch + '</span>';
  }
  return out;
}
function h2hHTML(a, b){
  var h = hashStr(a + '|' + b), rows = '';
  for(var i = 0; i < 3; i++){
    var x = (h >> (i * 5)) % 4, y = (h >> (i * 5 + 2)) % 4;
    rows += '<div class="stat-row"><span>' + esc(i === 0 ? a : (i === 2 ? b : 'ничья')) + '</span><span class="v">' + x + ' : ' + y + '</span><span class="c">тов.</span></div>';
  }
  return rows;
}
var AVC = ['#e8322a','#2e7de8','#27ae60','#8e44ad','#e67e22','#16a085','#c0392b','#2980b9'];
function avatarHTML(name){
  var h = hashStr(name || '?');
  var c = AVC[h % AVC.length];
  var ch = (name || '?').trim().charAt(0).toUpperCase();
  return '<span class="avatar" style="background:' + c + ';">' + esc(ch) + '</span>';
}
function statNum(id, minute, base, spread, tag){
  var h = hashStr(id + ':' + Math.floor(minute / 3) + ':' + tag);
  return Math.max(0, Math.round(base + (h % 100) / 100 * spread));
}
function statBars(m){
  var p = clamp(m.minute / m.maxMin, 0.05, 1), rows = [];
  if(m.sport === 'football' || m.sport === 'hockey'){
    var k = m.sport === 'hockey' ? 2.6 : 1;
    var shH = statNum(m.id, m.minute, 7 * p * k * m.strH, 3, 'sh'), shA = statNum(m.id + 1, m.minute, 7 * p * k * m.strA, 3, 'sh');
    var onH = Math.round(shH * 0.38), onA = Math.round(shA * 0.38);
    var coH = statNum(m.id, m.minute, 5 * p * k, 3, 'co'), coA = statNum(m.id + 1, m.minute, 5 * p * k, 3, 'co');
    var foH = statNum(m.id, m.minute, 8 * p, 4, 'fo'), foA = statNum(m.id + 1, m.minute, 8 * p, 4, 'fo');
    var posH = clamp(Math.round(50 + (m.strH - m.strA) * 32 + (m.hs - m.as) * 2), 15, 85);
    rows = [['Владение %', posH, 100 - posH], ['Удары', shH, shA], ['В створ', onH, onA], ['Угловые', coH, coA], ['Фолы', foH, foA]];
  } else if(m.sport === 'ufc'){
    var stH = statNum(m.id, m.minute, 55 * p * m.strH, 14, 'st'), stA = statNum(m.id + 1, m.minute, 55 * p * m.strA, 14, 'st');
    var tdH = statNum(m.id, m.minute, 2.4 * p * m.strH, 2, 'td'), tdA = statNum(m.id + 1, m.minute, 2.4 * p * m.strA, 2, 'td');
    var ctH = Math.round(50 * p), ctA = Math.round(48 * p);
    rows = [['Удары', stH, stA], ['Тейкдауны', tdH, tdA], ['Контроль, сек', ctH, ctA]];
  } else {
    var frH = m.hs + statNum(m.id, m.minute, 2, 3, 'fr'), frA = m.as + statNum(m.id + 1, m.minute, 2, 3, 'fr');
    rows = [['Фраги', frH, frA], ['Раунды', m.hs, m.as], ['Карты', m.mapH, m.mapA]];
  }
  return rows.map(function(r){
    var tot = Math.max(1, r[1] + r[2]), pw = Math.round(r[1] / tot * 100);
    return '<div class="sbar"><span>' + r[1] + '</span><div class="mid" style="position:relative;"><i style="width:' + pw + '%;background:linear-gradient(90deg,#e8322a,#ff6b3d);"></i></div><span style="text-align:right;">' + r[2] + '</span></div><div style="text-align:center;font-size:10.5px;color:var(--t3);margin:-3px 0 3px;">' + esc(r[0]) + '</div>';
  }).join('');
}
function trackerHTML(m){
  var atk = clamp(50 + (m.strH - m.strA) * 40 + (m.hs - m.as) * 4, 8, 92);
  return '<div style="display:flex;align-items:center;gap:8px;font-size:11.5px;margin:4px 0 8px;"><span style="flex:1;text-align:right;font-weight:800;">' + m.hs + '</span><div style="flex:6;height:8px;background:var(--card2);border-radius:5px;overflow:hidden;display:flex;"><div style="width:' + Math.round(atk) + '%;background:linear-gradient(90deg,var(--yellow),#ff9d2e);"></div></div><span style="flex:1;font-weight:800;">' + m.as + '</span></div>';

  } else {

function filteredList(){
  var list = Manager.matches.slice();
  if(State.sort === 'noft') list = list.filter(function(m){ return !m.finished; });
  if(State.sport==='live') list = list.filter(function(m){return m.status==='live' && !m.finished;});
  else if(State.sport==='soon') list = list.filter(function(m){return m.status==='upcoming';}).sort(function(a,b){return a.startAt-b.startAt;});
  else if(State.sport==='fav') list = list.filter(function(m){return State.favs.indexOf(m.id)>-1;});
  else if(State.sport!=='all') list = list.filter(function(m){return m.sport===State.sport;});
  if(State.search) list = list.filter(function(m){return (m.home+' '+m.away+' '+m.league).toLowerCase().indexOf(State.search)>-1;});
  if(State.sort==='live') list.sort(function(a,b){return ((b.finished?1:0)-(a.finished?1:0));});
  if(State.sort==='coef') list.sort(function(a,b){ var ma=mainOdds(a).mk, mb=mainOdds(b).mk; return (ma?ma.val[0]:99)-(mb?mb.val[0]:99); });
  return list;
}
function heroPick(){

  if(!live.length) live = Manager.matches.filter(function(m){ return m.status === 'live' && !m.finished; });
  if(!live.length) return null;
  live.sort(function(a, b){ return b.events.length - a.events.length; });

  return ic + ' ' + m.league;
}
function renderList(){
  var list = filteredList();
  $('listTitle').textContent = State.sport==='all'?'Все матчи':State.sport==='live'?'LIVE матчи':State.sport==='soon'?'Скоро начнутся':State.sport==='fav'?'★ Избранное':(SPORTS.find(function(s){return s.id===State.sport;})||{}).name||'Матчи';
  $('listCount').textContent = list.length;
  if(!list.length){
    $('matchesList').innerHTML = '<div class="cp-empty"><div class="em">🔍</div>Ничего не найдено</div>';
  } else if(State.sport === 'all' && !State.search){
    var groups = {}, order = [];
    list.forEach(function(m){
      var g = leagueGroup(m);
      if(!groups[g]){ groups[g] = []; order.push(g); }
      groups[g].push(m);
    });
    order.sort(function(a, b){
      var la = groups[a].filter(function(m){ return m.status === 'live' && !m.finished; }).length;
      var lb = groups[b].filter(function(m){ return m.status === 'live' && !m.finished; }).length;
      return lb - la;
    });
    $('matchesList').innerHTML = order.map(function(g){
      var liveN = groups[g].filter(function(m){ return m.status === 'live' && !m.finished; }).length;
      var shut = State.collapsed && State.collapsed[g];

    }).join('');
  } else {
    $('matchesList').innerHTML = list.map(cardHTML).join('');
  }

function renderResults(){

function tickOdds(){

/* ================= ПРОФИЛЬ/ИСТОРИЯ ================= */
function openModal(html){ $('modalContent').innerHTML = html; $('modalBg').classList.add('on'); }
function closeModal(){ $('modalBg').classList.remove('on'); State.centerId = null; }
function openProfile(){
  var total = State.history.length, win = State.history.filter(function(h){return h.status==='win';}).length;

  var profit = get - stake, canB = State.lastBonus !== todayS(), remain = MAX_DAILY - State.dailyAmount;
  openModal('<div class="mdl-h"><div><div class="t">Профиль</div><div class="s">Игрок</div></div><div class="mdl-x" onclick="closeModal()">✕</div></div>'
    + (canB ? '<div style="border:1px solid var(--yellow);border-radius:10px;padding:12px;margin-bottom:10px;text-align:center;"><div style="font-weight:800;color:var(--yellow);margin-bottom:8px;">🎁 Бонус доступен!</div><button style="padding:10px 24px;background:var(--yellow);color:#0b172a;font-weight:900;border-radius:8px;" onclick="claimBonus()">Забрать 500 ₽</button></div>' : '')
    + '<div style="background:var(--card2);border-radius:10px;padding:12px;margin-bottom:10px;"><div style="display:flex;justify-content:space-between;"><span>Баланс</span><b style="color:var(--yellow);">'+fmtMoney(State.balance)+'</b></div><div style="display:flex;justify-content:space-between;font-size:12px;"><span>Прибыль</span><b>'+fmtMoney(profit)+'</b></div><div style="font-size:12px;">Ставок: '+total+' · Побед: '+win+'</div></div>'
    + '<div style="background:var(--card2);border-radius:10px;padding:12px;margin-bottom:10px;"><div style="font-size:11px;margin-bottom:8px;">Касса · осталось: <b style="color:var(--yellow);">'+fmtMoney(remain)+'</b></div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px;">'+[500,1000,5000,10000].map(function(v){return '<button class="fchip" onclick="deposit('+v+')">+'+v.toLocaleString('ru-RU')+'</button>';}).join('')+'</div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;">'+[500,1000,5000,10000].map(function(v){return '<button class="fchip" onclick="withdraw('+v+')">−'+v.toLocaleString('ru-RU')+'</button>';}).join('')+'</div></div>'
    + '<div style="background:var(--card2);border-radius:10px;padding:12px;margin-bottom:10px;"><div style="font-size:11px;margin-bottom:8px;">Промокод <span style="color:var(--t3)">(попробуй FONBET500)</span></div><div style="display:flex;gap:6px;"><input id="promoInput" placeholder="Код" style="flex:1;padding:9px;border-radius:8px;background:var(--card);border:1px solid var(--bd);color:var(--t);outline:none;"><button class="fchip" onclick="claimPromo()">OK</button></div></div>'
    + '<div style="background:var(--card2);border-radius:10px;padding:12px;margin-bottom:10px;"><div style="font-size:11px;margin-bottom:8px;">Операции</div>'+(State.tx.length ? State.tx.slice(0,8).map(function(t){return '<div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0;"><span style="color:var(--t2)">'+esc(t.label)+'</span><b style="color:'+(t.amount>=0?'var(--green2)':'var(--red2)')+'">'+(t.amount>=0?'+':'')+fmtMoney(t.amount)+'</b></div>';}).join('') : '<div style="font-size:12px;color:var(--t3)">Пока пусто</div>')+'</div>'
    + '<button style="width:100%;padding:12px;border-radius:8px;background:var(--card2);border:1px solid var(--bd);font-weight:700;" onclick="closeModal();openHistory()">История ставок</button>');
}
function deposit(v){
  var rem = MAX_DAILY - State.dailyAmount;
  if(v > rem){ toast('Лимит. Осталось '+fmtMoney(rem),'err'); return; }
  State.balance += v; State.dailyAmount += v; if(!State.dailyDate) State.dailyDate = todayS();
  addTx('Пополнение', v);
  updBal(); saveState(); toast('+'+fmtMoney(v),'ok'); openProfile();
}
function withdraw(v){
  if(v > State.balance){ toast('Недостаточно средств','err'); return; }
  State.balance -= v; addTx('Вывод', -v);
  updBal(); saveState(); toast('Выведено '+fmtMoney(v),'ok'); openProfile();
}
function streakInfo(){
  var st = State.streak || {count:0, last:''};
  var today = todayS();
  var y = new Date(Date.now() - 86400000).toDateString();
  var cur = (st.last === today) ? st.count : ((st.last === y) ? st.count + 1 : 1);
  return {count: st.last === today ? st.count : cur, pending: st.last !== today, next: cur};
}
function claimBonus(){
  if(State.lastBonus === todayS()){ toast('Уже получен','err'); return; }
  var si = streakInfo();
  var amt = 500 + Math.min(Math.max(si.next - 1, 0), 4) * 150;
  State.balance += amt; State.lastBonus = todayS();
  State.streak = {count: si.next, last: todayS()};
  addTx('Бонус ежедневный · стрик ' + si.next, amt);
  updBal(); saveState(); toast('🎁 +' + fmtMoney(amt) + ' · стрик ' + si.next + '!', 'ok'); openProfile();
}
function missionProgress(){
  var day = new Date().toISOString().slice(0, 10);
  var bets = State.history.filter(function(h){ return h.createdAt && h.createdAt.slice(0,10) === day; }).length;
  var exprWin = State.history.some(function(h){ return h.status === 'win' && h.type === 'express' && h.bets.length >= 3 && (h.createdAt||'').slice(0,10) === day; });
  var bigWin = State.history.some(function(h){ return h.status === 'win' && (h.potential - h.stake) >= 2000 && (h.createdAt||'').slice(0,10) === day; });
  return [
    {id:'m1', t:'Сделай 3 ставки', p:Math.min(3, bets), n:3, rw:300},
    {id:'m2', t:'Выиграй экспресс из 3+ событий', p:exprWin?1:0, n:1, rw:500},
    {id:'m3', t:'Выиграй чистыми 2 000 ₽ одной ставкой', p:bigWin?1:0, n:1, rw:400}
  ];
}
function claimMission(id){
  var today = todayS();
  State.missions = State.missions || {date:'', done:[]};
  if(State.missions.date !== today) State.missions = {date:today, done:[]};
  if(State.missions.done.indexOf(id) > -1){ toast('Уже забрано','err'); return; }
  var ms = missionProgress(), m = null;
  for(var i = 0; i < ms.length; i++) if(ms[i].id === id) m = ms[i];
  if(!m || m.p < m.n){ toast('Миссия не выполнена','err'); return; }
  State.missions.done.push(id); State.balance += m.rw; addTx('Миссия: ' + m.t, m.rw);
  updBal(); saveState(); toast('🎯 +' + fmtMoney(m.rw), 'ok'); renderBonusPage();
}
function expressDay(){
  var live = Manager.matches.filter(function(m){ return m.status === 'live' && !m.finished; });
  if(live.length < 3) return null;
  var h = hashStr(todayS()), picks = [];
  for(var i = 0; i < 3; i++){
    var m = live[(h + i * 7) % live.length];
    if(picks.some(function(p){ return p.id === m.id; })) continue;
    var mo = mainOdds(m); if(!mo.mk) continue;
    var pi = mo.mk.val[0] <= mo.mk.val[mo.mk.val.length - 1] ? 0 : mo.mk.val.length - 1;
    picks.push({m:m, market:mo.name, pick:pi, odds:Math.round(mo.mk.val[pi] * 1.1 * 100) / 100, lbl:mo.mk.lbl[pi]});
  }
  if(picks.length < 3) return null;
  var coef = Math.round(picks.reduce(function(a, c){ return a * c.odds; }, 1) * 100) / 100;
  return {picks:picks, coef:coef};
}
function takeExpress(){
  var ex = expressDay(); if(!ex) return;
  State.betType = 'express';
  $all('.cp-type button').forEach(function(b){ b.classList.toggle('on', b.dataset.type === 'express'); });
  State.coupon = ex.picks.map(function(p){
    return {matchId:p.m.id, market:p.market, pick:p.pick, pickLbl:p.lbl + ' (ДНЯ +10%)', odds:p.odds, home:p.m.home, away:p.m.away, sport:p.m.sport, sh:p.m.hs, sa:p.m.as, at:Math.floor(p.m.minute), boost:true};
  });
  saveState(); updateCoupon(); paintSel();
  $('coupon').classList.add('show');
  toast('Экспресс дня в купоне · ' + ex.coef.toFixed(2), 'ok');
}
function renderBonusPage(){
  var box = $('viewBonus'); if(!box) return;
  var si = streakInfo();
  var ms = missionProgress();
  State.missions = State.missions || {date:'', done:[]};
  if(State.missions.date !== todayS()) State.missions = {date:todayS(), done:[]};
  var ex = expressDay();
  box.innerHTML = '<div class="bonus-card"><div style="font-size:15px;font-weight:900;margin-bottom:4px;">🔥 Стрик: ' + si.count + ' дн.</div><div style="font-size:12.5px;color:var(--t2);margin-bottom:10px;">Забирай бонус каждый день — сумма растет до +1100 ₽.</div>' + (si.pending ? '<button class="cp-place" onclick="claimBonus()">Забрать бонус</button>' : '<div style="font-size:13px;font-weight:800;color:var(--green2);">✅ Сегодня забрано</div>') + '</div>'
  + '<div class="sec-h"><div class="sec-t">Миссии дня</div></div>'
  + ms.map(function(m){
      var done = m.p >= m.n, claimed = State.missions.done.indexOf(m.id) > -1;
      var pct = Math.round(m.p / m.n * 100);
      return '<div class="mission"><div style="flex:1;"><div style="font-weight:800;">' + esc(m.t) + '</div><div class="bar"><i style="width:' + pct + '%"></i></div><div style="font-size:11px;color:var(--t3);">' + m.p + '/' + m.n + ' · награда ' + fmtMoney(m.rw) + '</div></div><button class="fchip" ' + ((!done || claimed) ? 'disabled style="opacity:.4;"' : '') + ' onclick="claimMission(\'' + m.id + '\')">' + (claimed ? '✓' : 'Забрать') + '</button></div>';
    }).join('')
  + '<div class="sec-h"><div class="sec-t">Экспресс дня · x1.1</div></div>'
  + (ex ? '<div class="bonus-card">' + ex.picks.map(function(p){ return '<div style="font-size:13px;font-weight:700;margin-bottom:4px;">' + esc(p.m.home) + ' — ' + esc(p.m.away) + ' · ' + esc(p.lbl) + ' · <b style="color:var(--yellow);">' + p.odds.toFixed(2) + '</b></div>'; }).join('') + '<div style="font-size:14px;font-weight:900;margin:6px 0;">Итого: <span style="color:var(--yellow);">' + ex.coef.toFixed(2) + '</span></div><button class="cp-place" onclick="takeExpress()">В купон 🍀</button></div>' : '<div class="cp-empty">Мало live-матчей для экспресса</div>');
}
function renderHelpPage(){
  var box = $('viewHelp'); if(!box) return;
  box.innerHTML = '<div class="bonus-card"><div style="font-size:15px;font-weight:900;margin-bottom:8px;">❓ Как играть</div>'
  + ['<b>1.</b> Матчи идут live каждые ~2 минуты — счет и кэфы живые, как у буков.',
     '<b>2.</b> Тапни кэф — он упадет в купон. Тапни карточку — вся роспись, статистика и события.',
     '<b>3.</b> Ординар или экспресс (до 12 событий), сумма от 10 ₽.',
     '<b>4.</b> «Следующий гол» рассчитывается сразу в момент гола.',
     '<b>5.</b> Кэшаут доступен пока ставка в игре.',
     '<b>6.</b> Бонусы: ежедневный + стрик, миссии, промокод <b>FONBET500</b>.',
     '<b>7.</b> Вкладка «Скоро» — прематч с обратным отсчетом.'].map(function(s){ return '<div style="font-size:13px;margin-bottom:8px;">' + s + '</div>'; }).join('') + '</div>';
}
function switchPage(p){
  State.page = p;
  ['Main', 'Bonus', 'Help'].forEach(function(k){ var b = $('pg' + k); if(b) b.classList.toggle('on', k.toLowerCase() === p); });
  $('viewMain').style.display = p === 'main' ? '' : 'none';
  $('viewBonus').style.display = p === 'bonus' ? '' : 'none';
  $('viewHelp').style.display = p === 'help' ? '' : 'none';
  if(p === 'bonus') renderBonusPage();

function claimPromo(){
  var inp = $('promoInput'); if(!inp) return;
  var code = inp.value.trim().toUpperCase();
  if(!code) return;
  if(State.promos.indexOf(code) > -1){ toast('Уже использован','err'); return; }
  var bonus = (code === 'FONBET500') ? 1000 : (code === 'LIVEZONE' ? 500 : 0);
  if(!bonus){ toast('Неверный промокод','err'); return; }
  State.promos.push(code); State.balance += bonus; addTx('Промокод ' + code, bonus);
  updBal(); saveState(); toast('🎟 +' + fmtMoney(bonus),'ok'); openProfile();

function openHistory(){
  openModal('<div class="mdl-h"><div><div class="t">История ставок</div><div class="s">Всего: '+State.history.length+'</div></div><div class="mdl-x" onclick="closeModal()">✕</div></div><div id="histList"></div>');
  var box = $('histList');
  box.innerHTML = State.history.length ? State.history.slice(0,30).map(function(h){
    var st = {win:'Выигрыш',lose:'Проигрыш',pending:'В игре',cashout:'Кэшаут'}[h.status];
    var co = h.status==='pending' ? cashoutOf(h) : 0;
    return '<div style="background:var(--card2);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px;"><div style="display:flex;justify-content:space-between;font-size:11px;"><span>'+h.type+' · '+fmtMoney(h.stake)+' · '+h.odds.toFixed(2)+'</span><b>'+st+'</b></div><div style="font-size:12px;">'+h.bets.map(function(b){return esc(b.home)+' — '+esc(b.away)+' · '+esc(b.pickLbl)+' <span style="color:var(--t3)">'+esc(b.market)+'</span>'+(b.result?' <b style="color:'+(b.result==='win'?'var(--green2)':'var(--red2)')+'">'+(b.result==='win'?'✓':'✗')+'</b>':'');}).join('<br>')+'</div>'+(co>0?'<button style="width:100%;margin-top:8px;padding:9px;background:var(--yellow);color:#0b172a;font-weight:800;border-radius:8px;" onclick="doCashout('+h.id+')">💰 Кэшаут '+fmtMoney(co)+'</button>':'')+'</div>';
  }).join('') : 'Ставок нет';
}
/* ================= ТИК (без перерендера — кэфы не пропадают) ================= */
var _listSig = '';
function listSig(){
  return State.sport + '|' + State.search + '|' + State.sort + '|' + Manager.matches.map(function(m){return m.id+':'+m.status+':'+(m.finished?1:0)+':'+m.hs+'-'+m.as;}).join(',');
}
function lightUpdate(){
  var now = Date.now();
  Manager.matches.forEach(function(m){
    var els = document.querySelectorAll('[data-clock="'+m.id+'"]');
    for(var i=0;i<els.length;i++) els[i].textContent = clockOf(m);
    var sels = document.querySelectorAll('[data-score="'+m.id+'"]');
    for(var j=0;j<sels.length;j++){
      var side = sels[j].dataset.side;
      var nv = String(side==='h' ? m.hs : m.as);
      if(sels[j].textContent !== nv){
        sels[j].textContent = nv;
        try{ sels[j].animate([{transform:'scale(1.5)',color:'#51e07c'},{transform:'scale(1)'}],{duration:450}); }catch(e){}
        var card = sels[j].closest ? sels[j].closest('.mc') : null;
        if(card){ try{ card.animate([{boxShadow:'0 0 0 2px #51e07c'},{boxShadow:'0 0 0 0 transparent'}],{duration:700}); }catch(e){} }
      }
    }
    if(m.finished){
      var nx = document.querySelectorAll('[data-next="'+m.id+'"]');
      var rem = Math.max(0, 30 - Math.floor((now - (m.finishedAt || now)) / 1000));
      for(var k=0;k<nx.length;k++) nx[k].textContent = rem;
    }
  });
  tickOdds();
}
var _tickN = 0;
function mainTick(){
  try{
    _tickN++;
    Manager.tick();
    if(_tickN % 2 === 0) renderStrip();
    if(State.coupon.length){ refreshCoupon(); updateCoupon(); }
    var sig = listSig();
    if(sig !== _listSig){ renderList(); }
    else lightUpdate();
    if(State.centerId && _tickN % 3 === 0) updateCenter();
  }catch(e){ console.error(e); }
}
/* ================= СОБЫТИЯ ================= */
document.addEventListener('click', function(e){
  var pg = e.target.closest('[data-page]');
  if(pg){ switchPage(pg.dataset.page); return; }
  var lg = e.target.closest('[data-lg]');
  if(lg){
    State.collapsed = State.collapsed || {};
    var g = lg.dataset.lg;
    if(State.collapsed[g]) delete State.collapsed[g]; else State.collapsed[g] = 1;
    renderList(); return;
  }
  var nav = e.target.closest('[data-nav]');
  if(nav){ State.sport = nav.dataset.nav; renderTabs(); renderFilters(); renderList(); return; }
  var fc = e.target.closest('[data-sport]');
  if(fc){ State.sport = fc.dataset.sport; renderTabs(); renderFilters(); renderList(); return; }
  var fav = e.target.closest('[data-fav]');
  if(fav){ e.stopPropagation(); var fid = parseInt(fav.dataset.fav); var ix = State.favs.indexOf(fid); if(ix>-1) State.favs.splice(ix,1); else State.favs.push(fid); saveState(); renderList(); return; }
  var od = e.target.closest('.odd,.mkt-odd');
  if(od && !od.classList.contains('cl')){
    e.stopPropagation();
    addToCoupon(parseInt(od.dataset.mid), od.dataset.mkt, parseInt(od.dataset.pick)); return;
  }
  var ct = e.target.closest('[data-ct]');
  if(ct){ State.centerTab = ct.dataset.ct; renderCenter(); return; }
  var lc = e.target.closest('.lcard');
  if(lc){ openCenter(parseInt(lc.dataset.mid)); return; }
  var card = e.target.closest('[data-card]');
  if(card){ openCenter(parseInt(card.dataset.card)); return; }
  var x = e.target.closest('.cp-item .x');
  if(x){ State.coupon = State.coupon.filter(function(c){return !(c.matchId==x.dataset.mid && c.market==x.dataset.mkt && c.pick==x.dataset.pick);}); updateCoupon(); paintSel(); saveState(); if(!State.coupon.length) $('coupon').classList.remove('show'); return; }
  var ct = e.target.closest('.cp-type button');
  if(ct){ State.betType = ct.dataset.type; $all('.cp-type button').forEach(function(b){b.classList.toggle('on',b===ct);}); if(State.betType==='single'&&State.coupon.length>1) State.coupon=[State.coupon[State.coupon.length-1]]; updateCoupon(); saveState(); return; }
  var q = e.target.closest('.cp-stake .q');
  if(q){ $('cpStake').value = q.dataset.s; updateCoupon(); return; }
  if(e.target.closest('#cpPlace')){ placeBet(); return; }
  if(e.target.closest('#cpClose')){ $('coupon').classList.remove('show'); return; }
  if(e.target.closest('#cpBar')){ $('coupon').classList.toggle('open'); return; }
  if(e.target.closest('#balanceBtn') || e.target.closest('#btnProfile')){ openProfile(); return; }
  if(e.target.closest('#seeAllLive')){ State.sport='live'; renderTabs(); renderFilters(); renderList(); return; }
  if(e.target.id === 'modalBg') closeModal();
});
document.addEventListener('input', function(e){

});
document.addEventListener('change', function(e){

});
window.closeModal = closeModal; window.openHistory = openHistory; window.openProfile = openProfile;
window.deposit = deposit; window.withdraw = withdraw; window.doCashout = doCashout; window.claimBonus = claimBonus; window.claimPromo = claimPromo;
window.claimMission = claimMission; window.takeExpress = takeExpress; window.switchPage = switchPage;
/* ================= INIT ================= */
(function init(){
  loadState();

})();
