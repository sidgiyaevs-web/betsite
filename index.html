<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>🏓 Пинг-понг</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{overflow:hidden;width:100%;height:100%}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,Arial,sans-serif;background:#0a0e1a;color:#e8ecf5;display:flex;flex-direction:column;max-width:900px;margin:0 auto;height:100vh;position:relative}

.pp-top{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(10,14,26,.95);border-bottom:1px solid rgba(255,255,255,.06);z-index:50;flex-shrink:0}
.pp-back{padding:8px 14px;border-radius:12px;background:#131a2e;border:1px solid #1f2946;font-size:13px;font-weight:700;color:#a3aec5;cursor:pointer}
.pp-status{font-size:11px;font-weight:800;padding:6px 12px;border-radius:20px;background:rgba(99,102,241,.15);border:1px solid rgba(99,102,241,.4);color:#a5b4fc}

.pp-score{display:flex;align-items:center;justify-content:center;gap:16px;padding:6px 16px;background:#0d1424;flex-shrink:0}
.pp-score-num{font-size:32px;font-weight:900;min-width:50px;text-align:center}
.pp-score-num.me{color:#4ade80;text-shadow:0 0 20px rgba(34,197,94,.6)}
.pp-score-num.enemy{color:#f87171;text-shadow:0 0 20px rgba(239,68,68,.6)}
.pp-score-label{font-size:10px;color:#7c88a3;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;text-align:center}
.pp-vs{font-size:18px;font-weight:900;color:#7c88a3}

.pp-field-wrap{flex:1;position:relative;overflow:hidden;touch-action:none;min-height:0}
.pp-field-wrap canvas{display:block;width:100%;height:100%}

.pp-help{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-size:11px;color:#fff;font-weight:700;text-align:center;padding:6px 14px;background:rgba(13,20,36,.8);border-radius:20px;border:1px solid rgba(255,255,255,.1);white-space:nowrap;z-index:10;pointer-events:none;transition:opacity .5s}
.pp-help.hide{opacity:0}

.pp-final{position:absolute;inset:0;background:rgba(0,0,0,.92);backdrop-filter:blur(8px);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:100;padding:20px}
.pp-final.show{display:flex}
.pp-final-icon{font-size:100px}
.pp-final-text{font-size:32px;font-weight:900;margin:20px 0 8px}
.pp-final-text.win{color:#4ade80}
.pp-final-text.lose{color:#f87171}
.pp-final-sub{color:#7c88a3;font-size:16px;margin-bottom:30px;font-weight:700}
.pp-final-btn{padding:16px 40px;border-radius:16px;background:linear-gradient(135deg,#818cf8,#6366f1);color:#fff;font-size:17px;font-weight:900;cursor:pointer;border:none}

.pp-menu{position:absolute;inset:0;background:linear-gradient(180deg,#0a0e1a,#0d1424);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;z-index:200;gap:14px;overflow-y:auto}
.pp-menu.hidden{display:none}
.pp-menu-icon{font-size:80px}
.pp-menu-title{font-size:32px;font-weight:900;background:linear-gradient(90deg,#818cf8,#facc15);-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center}
.pp-menu-sub{font-size:14px;color:#7c88a3;text-align:center;margin-bottom:10px}
.pp-menu-btn{width:100%;max-width:340px;padding:18px;border-radius:16px;font-size:16px;font-weight:900;cursor:pointer;border:none;transition:.2s;display:flex;align-items:center;justify-content:center;gap:10px}
.pp-menu-btn:active{transform:scale(.97)}
.pp-menu-btn.primary{background:linear-gradient(135deg,#818cf8,#6366f1);color:#fff}
.pp-menu-btn.secondary{background:#131a2e;color:#e8ecf5;border:1px solid #2a3555}
.pp-menu-btn.gold{background:linear-gradient(135deg,#facc15,#f59e0b);color:#1a1408}
.pp-input-row{width:100%;max-width:340px;display:flex;gap:8px}
.pp-input{flex:1;padding:16px;border-radius:14px;background:#131a2e;border:1px solid #2a3555;color:#fff;font-size:20px;font-weight:900;text-align:center;letter-spacing:3px;text-transform:uppercase;outline:none}
.pp-input::placeholder{color:#4a5573;letter-spacing:1px;font-size:14px}

.pp-toast{position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-40px);padding:12px 22px;border-radius:14px;background:rgba(13,20,36,.98);border:1px solid rgba(99,102,241,.5);font-weight:800;font-size:13px;z-index:300;opacity:0;pointer-events:none;transition:.3s}
.pp-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.pp-toast.win{border-color:rgba(34,197,94,.6);color:#4ade80}
.pp-toast.lose{border-color:rgba(239,68,68,.6);color:#f87171}
</style>
</head>
<body>

<div class="pp-top">
  <button class="pp-back" onclick="ppBackToMenu()">← Назад</button>
  <div class="pp-status" id="ppStatus">Готов</div>
</div>

<div class="pp-score">
  <div><div class="pp-score-num me" id="ppMyScore">0</div><div class="pp-score-label">Ты</div></div>
  <div class="pp-vs">:</div>
  <div><div class="pp-score-num enemy" id="ppEnemyScore">0</div><div class="pp-score-label">Соперник</div></div>
</div>

<div class="pp-field-wrap" id="ppField">
  <div class="pp-help" id="ppHelp" style="display:none">👆 Води пальцем по экрану</div>
</div>

<div class="pp-final" id="ppFinal">
  <div class="pp-final-icon" id="ppFinalIcon">🏆</div>
  <div class="pp-final-text win" id="ppFinalText">Победа!</div>
  <div class="pp-final-sub" id="ppFinalSub">11 : 7</div>
  <button class="pp-final-btn" onclick="ppBackToMenu()">Играть снова</button>
</div>

<div class="pp-menu" id="ppMenu">
  <div class="pp-menu-icon">🏓</div>
  <div class="pp-menu-title">Пинг-понг</div>
  <div class="pp-menu-sub">С другом онлайн или против бота</div>
  <button class="pp-menu-btn primary" onclick="ppCreateRoom()">🎮 Создать игру с другом</button>
  <button class="pp-menu-btn secondary" onclick="ppJoinMode()">🔗 Войти по коду</button>
  <button class="pp-menu-btn gold" onclick="ppPlayBot()">🤖 Играть с ботом</button>
  <div class="pp-input-row" id="ppJoinRow" style="display:none">
    <input class="pp-input" id="ppJoinInput" placeholder="КОД" maxlength="4" autocomplete="off">
    <button class="pp-menu-btn primary" style="width:auto;padding:0 24px;max-width:none" onclick="ppJoinRoom()">→</button>
  </div>
</div>

<div class="pp-toast" id="ppToast"></div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
/* ============================================================
   ПИНГ-ПОНГ v2 — вертикальный, красивые ракетки, отбой при движении
   ============================================================ */

var firebaseConfig = {
  apiKey: "AIzaSyALlhAOBT5zQFtZuUIReR57l9xDadqBC5A",
  authDomain: "betsite-4e6e8.firebaseapp.com",
  databaseURL: "https://betsite-4e6e8-default-rtdb.firebaseio.com",
  projectId: "betsite-4e6e8",
  storageBucket: "betsite-4e6e8.firebasestorage.app",
  messagingSenderId: "574363288522",
  appId: "1:574363288522:web:fdcf0bb7b0bfadf6634533"
};
firebase.initializeApp(firebaseConfig);
var db = firebase.database();

/* ===== КОНСТАНТЫ ===== */
var WIN_SCORE = 11;
var FIELD_W = 1200;      // внутренняя ширина (горизонтальная)
var FIELD_H = 700;       // внутренняя высота
var PADDLE_H = 160;      // высота ракетки (по вертикали)
var PADDLE_W = 22;       // толщина ракетки
var PADDLE_MARGIN = 50;
var BALL_R = 16;
var BALL_SPEED_START = 9;
var BALL_SPEED_MAX = 20;
var BALL_SPEED_INC = 1.06;

var MY_ID = (function(){
  var id = localStorage.getItem('pp_uid');
  if(!id){ id = 'u'+Math.random().toString(36).slice(2,10); localStorage.setItem('pp_uid', id); }
  return id;
})();

var G = {
  mode: 'menu',
  role: 'host',
  running: false,
  myY: FIELD_H / 2,
  enemyY: FIELD_H / 2,
  prevMyY: FIELD_H / 2,
  ball: { x: FIELD_W/2, y: FIELD_H/2, vx: 0, vy: 0, speed: BALL_SPEED_START, trail: [] },
  myScore: 0,
  enemyScore: 0,
  botEnabled: false,
  botTargetY: FIELD_H / 2,
  botReaction: 0.09,
  raf: null,
  pointCooldown: false,
  roomRef: null,
  roomCode: null,
  helpHidden: false
};

var fieldWrap = document.getElementById('ppField');
var canvas = document.createElement('canvas');
canvas.style.display = 'block';
canvas.style.width = '100%';
canvas.style.height = '100%';
fieldWrap.appendChild(canvas);
var ctx = canvas.getContext('2d');

function $(id){ return document.getElementById(id); }

function resizeCanvas(){
  var dpr = window.devicePixelRatio || 1;
  var rect = fieldWrap.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  canvas._w = rect.width;
  canvas._h = rect.height;
}
window.addEventListener('resize', function(){ setTimeout(resizeCanvas, 50); });
setTimeout(resizeCanvas, 100);

/* Toast */
var toastT = null;
function toast(msg, type){
  type = type || '';
  var t = $('ppToast');
  t.textContent = msg;
  t.className = 'pp-toast show ' + type;
  clearTimeout(toastT);
  toastT = setTimeout(function(){ t.className = 'pp-toast ' + type; }, 2200);
}

/* Звук */
var audioCtx = null;
function initAudio(){
  if(!audioCtx){
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
  }
}
function beep(freq, dur, type, vol){
  if(!audioCtx) return;
  type = type || 'sine'; vol = vol || 0.05;
  var o = audioCtx.createOscillator();
  var g = audioCtx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + dur);
}
function soundHit(){ beep(600, 0.05, 'square', 0.08); beep(900, 0.03, 'sine', 0.04); }
function soundWall(){ beep(400, 0.04, 'sine', 0.05); }
function soundGoal(){ beep(800, 0.15); setTimeout(function(){ beep(1000, 0.15); }, 100); }
function soundLoseGoal(){ beep(300, 0.2, 'sawtooth', 0.06); }
function soundWin(){ beep(600,0.1); setTimeout(function(){ beep(800,0.1); },80); setTimeout(function(){ beep(1000,0.2); },160); }

function vibrate(p){ if(navigator.vibrate) navigator.vibrate(p); }

/* Polyfill roundRect */
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
    if(w < 2*r) r = w/2;
    if(h < 2*r) r = h/2;
    this.beginPath();
    this.moveTo(x+r, y);
    this.arcTo(x+w, y, x+w, y+h, r);
    this.arcTo(x+w, y+h, x, y+h, r);
    this.arcTo(x, y+h, x, y, r);
    this.arcTo(x, y, x+w, y, r);
    this.closePath();
    return this;
  };
}

/* ===== ОТРИСОВКА ===== */
function draw(){
  if(!canvas._w) resizeCanvas();
  var w = canvas._w, h = canvas._h;
  var scaleX = w / FIELD_W;
  var scaleY = h / FIELD_H;

  // Фон — тёмное помещение
  var bgGrad = ctx.createLinearGradient(0, 0, 0, h);
  bgGrad.addColorStop(0, '#0a0e1a');
  bgGrad.addColorStop(1, '#0d1424');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, w, h);

  // Стол (синяя площадка)
  var padX = 14 * scaleX;
  var padY = 14 * scaleY;
  var fieldW = w - padX * 2;
  var fieldH = h - padY * 2;

  var tableGrad = ctx.createLinearGradient(padX, padY, padX, padY + fieldH);
  tableGrad.addColorStop(0, '#1e40af');
  tableGrad.addColorStop(0.5, '#2563eb');
  tableGrad.addColorStop(1, '#1e40af');
  ctx.fillStyle = tableGrad;
  ctx.fillRect(padX, padY, fieldW, fieldH);

  // Деревянная окантовка (тёмная)
  ctx.strokeStyle = '#78350f';
  ctx.lineWidth = 12 * scaleX;
  ctx.strokeRect(padX, padY, fieldW, fieldH);
  ctx.strokeStyle = '#a16207';
  ctx.lineWidth = 3 * scaleX;
  ctx.strokeRect(padX + 6*scaleX, padY + 6*scaleY, fieldW - 12*scaleX, fieldH - 12*scaleY);

  // Белые линии стола
  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  ctx.lineWidth = 3 * scaleX;

  // Внешняя рамка (по краю стола)
  var lineInset = 20 * scaleX;
  ctx.strokeRect(padX + lineInset, padY + lineInset, fieldW - lineInset*2, fieldH - lineInset*2);

  // Центральная продольная линия
  ctx.beginPath();
  ctx.moveTo(padX + lineInset, h/2);
  ctx.lineTo(padX + fieldW - lineInset, h/2);
  ctx.stroke();

  // Сетка (вертикальная линия в центре)
  ctx.strokeStyle = 'rgba(255,255,255,0.95)';
  ctx.lineWidth = 4 * scaleX;
  var netX = w / 2;
  ctx.beginPath();
  ctx.moveTo(netX, padY + lineInset);
  ctx.lineTo(netX, padY + fieldH - lineInset);
  ctx.stroke();

  // Узор сетки
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = 1 * scaleX;
  for(var yy = padY + lineInset + 8*scaleY; yy < padY + fieldH - lineInset; yy += 10*scaleY){
    ctx.beginPath();
    ctx.moveTo(netX - 4*scaleX, yy);
    ctx.lineTo(netX + 4*scaleX, yy);
    ctx.stroke();
  }

  // Тени ракеток
  drawPaddleShadow(
    padX + 30 * scaleX,
    (G.myY - PADDLE_H/2) * scaleY + padY,
    PADDLE_W * scaleX,
    PADDLE_H * scaleY
  );
  drawPaddleShadow(
    padX + fieldW - 30 * scaleX - PADDLE_W * scaleX,
    (G.enemyY - PADDLE_H/2) * scaleY + padY,
    PADDLE_W * scaleX,
    PADDLE_H * scaleY
  );

  // Моя ракетка (слева, красная)
  drawPaddle(
    padX + 30 * scaleX,
    (G.myY - PADDLE_H/2) * scaleY + padY,
    PADDLE_W * scaleX,
    PADDLE_H * scaleY,
    '#dc2626', '#7f1d1d', 'left'
  );

  // Ракетка соперника (справа, чёрная)
  drawPaddle(
    padX + fieldW - 30 * scaleX - PADDLE_W * scaleX,
    (G.enemyY - PADDLE_H/2) * scaleY + padY,
    PADDLE_W * scaleX,
    PADDLE_H * scaleY,
    '#1f2937', '#000000', 'right'
  );

  // Шлейф мяча
  for(var i = 0; i < G.ball.trail.length; i++){
    var pt = G.ball.trail[i];
    var alpha = (i + 1) / G.ball.trail.length * 0.5;
    ctx.fillStyle = 'rgba(255,255,255,' + alpha + ')';
    ctx.beginPath();
    ctx.arc(
      pt.x * scaleX + padX,
      pt.y * scaleY + padY,
      BALL_R * scaleX * (0.4 + (i / G.ball.trail.length) * 0.6),
      0, Math.PI * 2
    );
    ctx.fill();
  }

  // Тень мяча
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(
    G.ball.x * scaleX + padX + 3*scaleX,
    G.ball.y * scaleY + padY + 3*scaleY,
    BALL_R * scaleX,
    BALL_R * 0.7 * scaleY,
    0, 0, Math.PI * 2
  );
  ctx.fill();

  // Мяч (белый с оранжевым ядром — как настоящий теннисный)
  var bx = G.ball.x * scaleX + padX;
  var by = G.ball.y * scaleY + padY;

  ctx.shadowBlur = 25;
  ctx.shadowColor = 'rgba(250,204,21,.9)';

  // Основа мяча — оранжевый
  ctx.fillStyle = '#f59e0b';
  ctx.beginPath();
  ctx.arc(bx, by, BALL_R * scaleX, 0, Math.PI * 2);
  ctx.fill();

  // Белая полоса
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2 * scaleX;
  ctx.beginPath();
  ctx.arc(bx, by, BALL_R * scaleX * 0.55, 0, Math.PI * 2);
  ctx.stroke();

  // Блик
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.beginPath();
  ctx.arc(bx - BALL_R * 0.3 * scaleX, by - BALL_R * 0.3 * scaleY, BALL_R * 0.35 * scaleX, 0, Math.PI * 2);
  ctx.fill();

  ctx.shadowBlur = 0;
}

function drawPaddle(x, y, w, h, colorLight, colorDark, side){
  // Ручка
  ctx.fillStyle = '#78350f';
  if(side === 'left'){
    ctx.fillRect(x - 30 * (w/PADDLE_W), y + h/2 - 20*(h/PADDLE_H), 30 * (w/PADDLE_W), 40 * (h/PADDLE_H));
  } else {
    ctx.fillRect(x + w, y + h/2 - 20*(h/PADDLE_H), 30 * (w/PADDLE_W), 40 * (h/PADDLE_H));
  }

  // Тело ракетки (круглая, но у нас вертикальная плашка)
  var grad = ctx.createLinearGradient(x, 0, x + w, 0);
  grad.addColorStop(0, colorDark);
  grad.addColorStop(0.5, colorLight);
  grad.addColorStop(1, colorDark);
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, w/2);
  ctx.fill();

  // Блик
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.beginPath();
  ctx.roundRect(x + w*0.3, y + h*0.1, w*0.4, h*0.8, w*0.2);
  ctx.fill();
}

function drawPaddleShadow(x, y, w, h){
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath();
  ctx.roundRect(x + 4, y + 4, w, h, w/2);
  ctx.fill();
}

/* ===== УПРАВЛЕНИЕ ===== */
var pointerActive = false;

fieldWrap.addEventListener('pointerdown', function(e){
  pointerActive = true;
  movePaddle(e);
  e.preventDefault();
}, { passive: false });

fieldWrap.addEventListener('pointermove', function(e){
  if(!pointerActive) return;
  movePaddle(e);
  e.preventDefault();
}, { passive: false });

fieldWrap.addEventListener('pointerup', function(){ pointerActive = false; });
fieldWrap.addEventListener('pointercancel', function(){ pointerActive = false; });
fieldWrap.addEventListener('pointerleave', function(){ pointerActive = false; });

function movePaddle(e){
  var rect = fieldWrap.getBoundingClientRect();
  var padY = 14 * (rect.height / FIELD_H);
  var innerH = rect.height - padY * 2;
  var y = e.clientY - rect.top - padY;
  var fieldY = (y / innerH) * FIELD_H;
  G.prevMyY = G.myY;
  G.myY = Math.max(PADDLE_H/2 + 20, Math.min(FIELD_H - PADDLE_H/2 - 20, fieldY));
}

/* ===== ФИЗИКА ===== */
function resetBall(dir){
  G.ball.x = FIELD_W / 2;
  G.ball.y = FIELD_H / 2;
  G.ball.speed = BALL_SPEED_START;
  G.ball.trail = [];
  var angle = (Math.random() - 0.5) * Math.PI / 2.5; // -36°..+36°
  G.ball.vx = dir * Math.cos(angle) * G.ball.speed;
  G.ball.vy = Math.sin(angle) * G.ball.speed;
}

function physicsStep(){
  if(!G.running) return;

  // Движение
  G.ball.x += G.ball.vx;
  G.ball.y += G.ball.vy;

  // Шлейф
  G.ball.trail.push({ x: G.ball.x, y: G.ball.y });
  if(G.ball.trail.length > 12) G.ball.trail.shift();

  // Отскок от верхней стены
  if(G.ball.y < BALL_R){
    G.ball.y = BALL_R;
    G.ball.vy = Math.abs(G.ball.vy);
    soundWall();
  }
  // Отскок от нижней стены
  if(G.ball.y > FIELD_H - BALL_R){
    G.ball.y = FIELD_H - BALL_R;
    G.ball.vy = -Math.abs(G.ball.vy);
    soundWall();
  }

  // Моя ракетка (слева, X = PADDLE_MARGIN + 30)
  var myPaddleLeft = PADDLE_MARGIN + 30;
  var myPaddleRight = myPaddleLeft + PADDLE_W;
  var myTop = G.myY - PADDLE_H/2;
  var myBottom = G.myY + PADDLE_H/2;

  if(G.ball.vx < 0){
    if(G.ball.x - BALL_R < myPaddleRight && G.ball.x - BALL_R > myPaddleLeft - 30){
      if(G.ball.y > myTop - BALL_R && G.ball.y < myBottom + BALL_R){
        // Отбил
        G.ball.vx = Math.abs(G.ball.vx);
        G.ball.x = myPaddleRight + BALL_R;
        var hitPos = (G.ball.y - G.myY) / (PADDLE_H / 2);
        G.ball.vy += hitPos * 4;
        // Ускорение
        G.ball.speed = Math.min(BALL_SPEED_MAX, G.ball.speed * BALL_SPEED_INC);
        var mag = Math.sqrt(G.ball.vx*G.ball.vx + G.ball.vy*G.ball.vy);
        G.ball.vx = G.ball.vx / mag * G.ball.speed;
        G.ball.vy = G.ball.vy / mag * G.ball.speed;
        soundHit();
        vibrate(15);
      }
    }
  }

  // Ракетка соперника (справа)
  var enemyPaddleRight = FIELD_W - (PADDLE_MARGIN + 30);
  var enemyPaddleLeft = enemyPaddleRight - PADDLE_W;
  var enemyTop = G.enemyY - PADDLE_H/2;
  var enemyBottom = G.enemyY + PADDLE_H/2;

  if(G.ball.vx > 0){
    if(G.ball.x + BALL_R > enemyPaddleLeft && G.ball.x + BALL_R < enemyPaddleRight + 30){
      if(G.ball.y > enemyTop - BALL_R && G.ball.y < enemyBottom + BALL_R){
        G.ball.vx = -Math.abs(G.ball.vx);
        G.ball.x = enemyPaddleLeft - BALL_R;
        var hitPos2 = (G.ball.y - G.enemyY) / (PADDLE_H / 2);
        G.ball.vy += hitPos2 * 4;
        G.ball.speed = Math.min(BALL_SPEED_MAX, G.ball.speed * BALL_SPEED_INC);
        var mag2 = Math.sqrt(G.ball.vx*G.ball.vx + G.ball.vy*G.ball.vy);
        G.ball.vx = G.ball.vx / mag2 * G.ball.speed;
        G.ball.vy = G.ball.vy / mag2 * G.ball.speed;
        soundHit();
      }
    }
  }

  // Гол мне (мяч улетел влево)
  if(G.ball.x < -BALL_R * 3 && !G.pointCooldown){
    G.pointCooldown = true;
    G.enemyScore++;
    updateScoreUI();
    soundLoseGoal();
    vibrate([80, 40, 80]);
    if(G.mode === 'online' && G.role === 'host') syncState();
    setTimeout(function(){
      if(G.enemyScore >= WIN_SCORE){ endGame(false); }
      else { resetBall(1); G.pointCooldown = false; }
    }, 800);
  }

  // Гол сопернику (мяч улетел вправо)
  if(G.ball.x > FIELD_W + BALL_R * 3 && !G.pointCooldown){
    G.pointCooldown = true;
    G.myScore++;
    updateScoreUI();
    soundGoal();
    vibrate([50]);
    if(G.mode === 'online' && G.role === 'host') syncState();
    setTimeout(function(){
      if(G.myScore >= WIN_SCORE){ endGame(true); }
      else { resetBall(-1); G.pointCooldown = false; }
    }, 800);
  }

  if(G.botEnabled) botStep();

  if(G.mode === 'online'){
    G.syncTick = (G.syncTick || 0) + 1;
    if(G.syncTick % 3 === 0) syncState();
  }

  draw();
  G.raf = requestAnimationFrame(physicsStep);
}

/* Бот — умный, следит за мячом и предсказывает */
function botStep(){
  // Определяем куда летит мяч
  var target = G.ball.y;
  if(G.ball.vx > 0){
    // Мяч летит к боту — предсказываем точку удара
    var timeToArrive = (FIELD_W - G.ball.x) / Math.max(0.1, G.ball.vx);
    var predictY = G.ball.y + G.ball.vy * timeToArrive * 0.9;
    // Учитываем отскоки от стен
    while(predictY < BALL_R || predictY > FIELD_H - BALL_R){
      if(predictY < BALL_R) predictY = BALL_R + (BALL_R - predictY);
      if(predictY > FIELD_H - BALL_R) predictY = (FIELD_H - BALL_R) - (predictY - (FIELD_H - BALL_R));
    }
    target = predictY;
  } else {
    // Мяч летит к игроку — бот возвращается в центр
    target = FIELD_H / 2 + (Math.random() - 0.5) * 100;
  }

  var diff = target - G.botTargetY;
  G.botTargetY += diff * G.botReaction;
  G.botTargetY = Math.max(PADDLE_H/2 + 20, Math.min(FIELD_H - PADDLE_H/2 - 20, G.botTargetY));
  G.enemyY = G.botTargetY;
}

function updateScoreUI(){
  $('ppMyScore').textContent = G.myScore;
  $('ppEnemyScore').textContent = G.enemyScore;
}

/* ===== МЕНЮ ===== */
function ppCreateRoom(){
  initAudio();
  var code = genCode();
  G.roomCode = code;
  G.mode = 'online';
  G.role = 'host';

  $('ppStatus').textContent = 'Ждём игрока...';
  $('ppMenu').classList.add('hidden');
  $('ppFinal').classList.remove('show');

  G.roomRef = db.ref('pingpong/rooms/' + code);
  G.roomRef.set({
    hostId: MY_ID,
    createdAt: Date.now(),
    state: 'waiting',
    hostScore: 0,
    guestScore: 0,
    ball: { x: FIELD_W/2, y: FIELD_H/2, vx: 0, vy: 0, speed: BALL_SPEED_START }
  });
  G.roomRef.onDisconnect().remove();

  G.roomRef.on('value', function(snap){
    var data = snap.val();
    if(!data) return;
    if(data.guestId && data.state === 'playing' && !G.running){
      $('ppStatus').textContent = 'Игра!';
      $('ppStatus').classList.add('online');
      startOnlineGame();
    }
    if(data.guestY !== undefined) G.enemyY = data.guestY;
  });

  toast('Код: ' + code, 'win');
}

function ppJoinMode(){
  var row = $('ppJoinRow');
  row.style.display = row.style.display === 'none' ? 'flex' : 'none';
}

function ppJoinRoom(){
  var code = ($('ppJoinInput').value || '').trim().toUpperCase();
  if(code.length !== 4){ return toast('Код из 4 букв', 'lose'); }
  initAudio();

  var roomRef = db.ref('pingpong/rooms/' + code);
  roomRef.once('value').then(function(snap){
    var data = snap.val();
    if(!data){ return toast('Комната не найдена', 'lose'); }
    if(data.guestId && data.guestId !== MY_ID){ return toast('Занято', 'lose'); }

    G.roomCode = code;
    G.mode = 'online';
    G.role = 'guest';
    G.roomRef = roomRef;

    $('ppStatus').textContent = 'Игра!';
    $('ppStatus').classList.add('online');
    $('ppMenu').classList.add('hidden');

    roomRef.update({
      guestId: MY_ID,
      state: 'playing',
      guestJoinedAt: Date.now()
    });
    roomRef.child('guestId').onDisconnect().remove();

    roomRef.on('value', function(s){
      var d = s.val();
      if(!d) return;
      if(d.ball){
        G.ball.x = d.ball.x;
        G.ball.y = d.ball.y;
        G.ball.vx = d.ball.vx;
        G.ball.vy = d.ball.vy;
        G.ball.speed = d.ball.speed || BALL_SPEED_START;
      }
      if(d.hostScore !== undefined){
        G.enemyScore = d.hostScore;
        G.myScore = d.guestScore || 0;
        updateScoreUI();
        if(G.enemyScore >= WIN_SCORE && G.running) endGame(false);
        if(G.myScore >= WIN_SCORE && G.running) endGame(true);
      }
      if(d.hostY !== undefined) G.enemyY = d.hostY;
    });

    startOnlineGame();
    toast('Подключено!', 'win');
  }).catch(function(){
    toast('Ошибка', 'lose');
  });
}

function startOnlineGame(){
  G.running = true;
  G.myScore = 0;
  G.enemyScore = 0;
  updateScoreUI();
  $('ppFinal').classList.remove('show');
  $('ppHelp').style.display = 'block';
  setTimeout(function(){ $('ppHelp').classList.add('hide'); }, 3000);

  if(G.raf) cancelAnimationFrame(G.raf);
  if(G.role === 'host'){
    resetBall(1);
    physicsStep();
  } else {
    guestRenderLoop();
  }
}

function guestRenderLoop(){
  if(!G.running) return;
  draw();
  G.raf = requestAnimationFrame(guestRenderLoop);
}

function syncState(){
  if(!G.roomRef || G.mode !== 'online' || !G.running) return;
  var upd = {
    ball: { x: G.ball.x, y: G.ball.y, vx: G.ball.vx, vy: G.ball.vy, speed: G.ball.speed }
  };
  if(G.role === 'host'){
    upd.hostScore = G.myScore;
    upd.guestScore = G.enemyScore;
    upd.hostY = G.myY;
  } else {
    upd.guestY = G.myY;
  }
  G.roomRef.update(upd);
}

/* ===== БОТ ===== */
function ppPlayBot(){
  initAudio();
  G.mode = 'solo';
  G.botEnabled = true;
  G.myScore = 0;
  G.enemyScore = 0;
  G.running = true;
  G.myY = FIELD_H / 2;
  G.botTargetY = FIELD_H / 2;
  G.enemyY = FIELD_H / 2;
  G.pointCooldown = false;

  $('ppStatus').textContent = 'Игра с ботом';
  $('ppStatus').classList.add('online');
  $('ppMenu').classList.add('hidden');
  $('ppFinal').classList.remove('show');
  $('ppHelp').style.display = 'block';
  setTimeout(function(){ $('ppHelp').classList.add('hide'); }, 3000);

  updateScoreUI();
  resetBall(1);
  if(G.raf) cancelAnimationFrame(G.raf);
  physicsStep();
}

/* ===== КОНЕЦ ===== */
function endGame(win){
  G.running = false;
  if(G.raf) cancelAnimationFrame(G.raf);
  if(win){ soundWin(); vibrate([100, 50, 100, 50, 200]); }
  else { soundLoseGoal(); vibrate([200, 100, 200]); }
  $('ppFinalIcon').textContent = win ? '🏆' : '😢';
  $('ppFinalText').textContent = win ? 'Победа!' : 'Поражение';
  $('ppFinalText').className = 'pp-final-text ' + (win ? 'win' : 'lose');
  $('ppFinalSub').textContent = G.myScore + ' : ' + G.enemyScore;
  $('ppFinal').classList.add('show');
}

function ppBackToMenu(){
  $('ppFinal').classList.remove('show');
  $('ppMenu').classList.remove('hidden');
  $('ppStatus').textContent = 'Готов';
  $('ppStatus').classList.remove('online');
  $('ppHelp').classList.remove('hide');
  $('ppHelp').style.display = 'none';
  G.mode = 'menu';
  G.running = false;
  G.botEnabled = false;
  G.myScore = 0;
  G.enemyScore = 0;
  updateScoreUI();
  if(G.raf) cancelAnimationFrame(G.raf);
  if(G.roomRef){
    G.roomRef.off();
    G.roomRef.remove();
    G.roomRef = null;
  }
  G.roomCode = null;
}

function genCode(){
  var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  var code = '';
  for(var i = 0; i < 4; i++){
    code += chars[Math.floor(Math.random() * chars.length)];
  }
  return code;
}

var hash = window.location.hash;
if(hash && hash.indexOf('#room-') === 0){
  var c = hash.replace('#room-', '').toUpperCase().slice(0, 4);
  $('ppJoinInput').value = c;
  $('ppJoinRow').style.display = 'flex';
  setTimeout(ppJoinRoom, 500);
}

resizeCanvas();
draw();
updateScoreUI();
</script>
</body>
