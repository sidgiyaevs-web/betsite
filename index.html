<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f1e35">
<title>SportLive — Лайв-линия</title>
<style>
:root{
  --bg:#0f1e35; --bg2:#0b172a; --card:#1a2c45; --card2:#22395c;
  --bd:#2a3f5e; --bd2:#3d5675; --t:#f0f4f9; --t2:#a9b8ce; --t3:#6e7e96;
  --yellow:#ffd94a; --green:#4caf50; --green2:#66d96a; --red:#e8453c; --red2:#f56860; --live:#ff3b30;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--t);min-height:100vh;font-size:14px;line-height:1.4;padding-bottom:120px;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
.hdr{position:sticky;top:0;z-index:100;background:linear-gradient(180deg,#0e1d32,#0f1e35);border-bottom:1px solid var(--bd);}
.hdr-top{display:flex;align-items:center;gap:10px;padding:10px 14px;}
.logo{display:flex;align-items:center;gap:7px;font-size:17px;font-weight:900;color:var(--yellow);white-space:nowrap;}
.logo span{color:var(--t);font-weight:700;}
.hdr-tabs{display:flex;gap:4px;flex:1;overflow-x:auto;padding:0 4px;}
.hdr-tabs::-webkit-scrollbar{display:none;}
.htab{flex-shrink:0;padding:7px 12px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--t2);white-space:nowrap;}
.htab.on{color:#0b172a;background:var(--yellow);}
.hdr-actions{display:flex;gap:6px;align-items:center;flex-shrink:0;margin-left:auto;}
.balance{display:flex;align-items:center;gap:5px;background:var(--card2);border:1px solid var(--bd);padding:7px 11px;border-radius:8px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;}
.balance b{color:var(--yellow);font-weight:900;}
.hbtn{min-width:34px;height:34px;border-radius:8px;background:var(--card);border:1px solid var(--bd);color:var(--t2);font-size:15px;display:flex;align-items:center;justify-content:center;padding:0 8px;}
.page{max-width:1200px;margin:0 auto;padding:14px;}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:16px 0 10px;}
.sec-t{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;}
.sec-t::before{content:"";width:3px;height:14px;background:var(--yellow);border-radius:2px;}
.sec-t .cnt{font-size:11.5px;color:var(--t3);}
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;}
.strip::-webkit-scrollbar{display:none;}
.lcard{flex-shrink:0;min-width:210px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;cursor:pointer;}
.lcard .lt{font-size:11px;color:var(--t3);margin-bottom:4px;}
.lcard .lm{font-size:12.5px;font-weight:800;}
.lcard .ls{font-size:12px;color:var(--yellow);font-weight:800;}
.mc{background:var(--card);border:1px solid var(--bd);border-radius:10px;margin-bottom:10px;overflow:hidden;}
.mc.live{border-left:3px solid var(--live);}
.mc-head{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--bd);font-size:12px;color:var(--t2);}
.mc-status.live{color:var(--live);font-weight:800;animation:blink 1.4s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.4;}}
.mc-teams{padding:10px 12px;}
.mc-team{display:flex;justify-content:space-between;align-items:center;padding:3px 0;font-weight:700;}
.mc-score{font-weight:900;font-size:16px;min-width:30px;text-align:right;}
.mc-score.w{color:var(--green2);}
.mc-odds{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 12px 8px;}
.mc-odds.two{grid-template-columns:repeat(2,1fr);}
.odd{background:var(--bd);border-radius:8px;padding:8px;text-align:center;transition:background .15s;}
.odd:hover{background:var(--bd2);}
.odd.sel{background:var(--yellow);color:#0b172a;}
.odd.cl{opacity:.4;pointer-events:none;}
.odd .olbl{display:block;font-size:10.5px;color:var(--t2);font-weight:600;}
.odd.sel .olbl{color:#0b172a;}
.odd .oval{display:block;font-weight:900;font-size:14px;font-variant-numeric:tabular-nums;}
.odd .oval.up{color:var(--green2);}
.odd .oval.dn{color:var(--red2);}
.mc-hint{text-align:center;font-size:11.5px;color:var(--t3);padding:7px;cursor:pointer;border-top:1px solid var(--bd);}
.mkt-sec{padding:8px 12px 12px;}
.mkt-t{font-size:12px;font-weight:800;color:var(--t2);margin:8px 0 6px;text-transform:uppercase;}
.mkt-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.mkt-odd{background:var(--bd);border-radius:8px;padding:8px;text-align:center;}
.mkt-odd.sel{background:var(--yellow);color:#0b172a;}
.mkt-odd.cl{opacity:.4;pointer-events:none;}
.mkt-odd .olbl{display:block;font-size:11px;color:var(--t2);}
.mkt-odd.sel .olbl{color:#0b172a;}
.mkt-odd .oval{display:block;font-weight:900;}
.fbar{display:flex;gap:6px;padding:0 0 12px;overflow-x:auto;}
.fbar::-webkit-scrollbar{display:none;}
.fchip{flex-shrink:0;padding:6px 12px;border-radius:7px;background:var(--card);border:1px solid var(--bd);font-size:12px;font-weight:600;color:var(--t2);white-space:nowrap;}
.fchip.on{background:var(--yellow);color:#0b172a;border-color:var(--yellow);}
.coupon{position:fixed;left:0;right:0;bottom:0;z-index:200;background:#0b172a;border-top:1px solid var(--bd);transform:translateY(calc(100% - 52px));transition:transform .25s;}
.coupon.show{transform:none;}
.coupon.open{transform:none;}
.cp-bar{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;font-weight:800;}
.cp-bar .n{background:var(--yellow);color:#0b172a;border-radius:12px;padding:1px 8px;font-size:12px;}
.cp-bar .o{margin-left:auto;color:var(--green2);}
.cp-body{max-height:46vh;overflow:auto;padding:0 14px 14px;}
.cp-item{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:12.5px;}
.cp-item .info{flex:1;}
.cp-item .pick{font-weight:800;}
.cp-item .teams{color:var(--t2);font-size:11.5px;}
.cp-item .coef{color:var(--green2);font-weight:900;white-space:nowrap;}
.cp-item .x{color:var(--t3);padding:4px 8px;font-size:16px;}
.cp-type{display:flex;gap:6px;margin:8px 0;}
.cp-type button{flex:1;padding:8px;border-radius:8px;background:var(--card);border:1px solid var(--bd);font-weight:700;color:var(--t2);}
.cp-type button.on{background:var(--yellow);color:#0b172a;}
.cp-stake{display:flex;gap:6px;margin:8px 0;}
.cp-stake .q{flex:1;padding:8px;border-radius:8px;background:var(--card);border:1px solid var(--bd);font-weight:700;color:var(--t2);}
#cpStake{width:100%;padding:10px;border-radius:8px;background:var(--card);border:1px solid var(--bd);color:var(--t);font-weight:800;font-size:15px;outline:none;}
.cp-sum{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px;margin:8px 0;font-size:13px;}
.cp-sum .row{display:flex;justify-content:space-between;padding:2px 0;}
.cp-place{width:100%;padding:13px;border-radius:10px;background:var(--yellow);color:#0b172a;font-weight:900;font-size:15px;}
.cp-place:disabled{opacity:.4;}
.cp-empty{text-align:center;color:var(--t3);padding:20px;}
.cp-empty .em{font-size:34px;margin-bottom:6px;}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:300;display:none;align-items:flex-end;justify-content:center;}
.modal-bg.on{display:flex;}
.modal{background:var(--bg2);border:1px solid var(--bd);border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:86vh;overflow:auto;padding:14px 14px 24px;}
.mdl-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.mdl-h .t{font-size:16px;font-weight:900;}
.mdl-h .s{font-size:12px;color:var(--t3);}
.mdl-x{font-size:18px;color:var(--t2);padding:6px 10px;}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--card2);border:1px solid var(--bd);padding:10px 18px;border-radius:10px;font-size:13.5px;font-weight:700;z-index:400;opacity:0;transition:all .25s;pointer-events:none;max-width:90vw;text-align:center;}
.toast.on{opacity:1;transform:translateX(-50%);}
.toast.ok{border-color:var(--green);}
.toast.err{border-color:var(--red);}
.res-row{display:flex;justify-content:space-between;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:9px 12px;margin-bottom:6px;font-size:13px;font-weight:700;}
.prog{height:5px;background:#0b172a;border-radius:4px;margin:0 12px 8px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--yellow),#ff9d2e);border-radius:4px;transition:width .8s;}
.mc[data-card]{cursor:pointer;}
.mc[data-card]:hover{border-color:var(--yellow);}
.fav:hover{transform:scale(1.2);}
.tl{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto;margin-top:8px;}
.tl-item{display:flex;gap:8px;background:var(--card);border-radius:8px;padding:7px 10px;font-size:12.5px;}
.tl-item .mn{color:var(--green2);font-weight:900;min-width:34px;}
.stat-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;font-size:12px;padding:5px 0;border-bottom:1px solid var(--bd);}
.stat-row .c{text-align:center;color:var(--t2);}
.stat-row .v{font-weight:900;text-align:center;}
.search-row{display:flex;gap:8px;margin-bottom:10px;}
#searchInput{flex:1;padding:10px 14px;border-radius:10px;background:var(--card);border:1px solid var(--bd);color:var(--t);outline:none;font-size:13.5px;}
#searchInput:focus{border-color:var(--yellow);}
#sortSel{padding:10px;border-radius:10px;background:var(--card);border:1px solid var(--bd);color:var(--t);font-size:13px;}
.center-score{display:flex;align-items:center;justify-content:center;gap:14px;padding:14px;background:var(--card);border-radius:12px;margin-bottom:10px;}
.center-score .tm{font-weight:900;font-size:14px;flex:1;text-align:center;}
.center-score .sc{font-size:32px;font-weight:900;background:#0b172a;padding:4px 16px;border-radius:10px;white-space:nowrap;}
.ctabs{display:flex;gap:4px;background:var(--card);padding:3px;border-radius:10px;margin-bottom:10px;}
.ctabs button{flex:1;padding:8px;border-radius:8px;color:var(--t2);font-weight:700;font-size:13px;}
.ctabs button.on{background:var(--yellow);color:#0b172a;}
@media(min-width:800px){.modal-bg{align-items:center;}.modal{border-radius:16px;}.mc-odds{max-width:520px;}}
</style>
</head>
<body>
<header class="hdr">
  <div class="hdr-top">
    <div class="logo">⚡ SPORT <span>LIVE</span></div>
    <nav class="hdr-tabs" id="hdrTabs"></nav>
    <div class="hdr-actions">
      <button class="balance" id="balanceBtn">₽ <b id="balanceVal">10 000</b></button>
      <button class="hbtn" id="btnProfile">👤</button>
    </div>
  </div>
</header>
<div class="page">
  <div class="sec-h"><div class="sec-t">LIVE сейчас <span class="cnt" id="liveCount">0</span></div><div class="sec-more" id="seeAllLive" style="font-size:12px;font-weight:700;color:var(--yellow);cursor:pointer;">Все LIVE →</div></div>
  <div class="strip" id="liveStrip"></div>
  <div class="sec-h"><div class="sec-t"><span id="listTitle">Все матчи</span> <span class="cnt" id="listCount">0</span></div></div>
  <div class="fbar" id="filterBar"></div>
  <div class="search-row"><input id="searchInput" placeholder="🔍 Поиск: Спартак, NAVI, Махачев..."><select id="sortSel"><option value="def">По умолчанию</option><option value="live">Сначала LIVE</option><option value="coef">Мин. кэф П1</option></select></div>
  <div id="matchesList"></div>
  <div class="sec-h"><div class="sec-t">Результаты <span class="cnt" id="resCount">0</span></div></div>
  <div id="resList"></div>
</div>
<div class="coupon" id="coupon">
  <div class="cp-bar" id="cpBar"><span>🎫 Купон</span><span class="n" id="cpCount">0</span><span class="o" id="cpOdds">0.00</span><span id="cpClose" style="padding:4px 8px;color:var(--t3);">✕</span></div>
  <div class="cp-body">
    <div class="cp-type"><button data-type="single" class="on">Одиночная</button><button data-type="express">Экспресс</button></div>
    <div id="cpItems"></div>
    <div class="cp-stake"><button class="q" data-s="100">100</button><button class="q" data-s="500">500</button><button class="q" data-s="1000">1К</button><button class="q" data-s="5000">5К</button></div>
    <input id="cpStake" type="number" value="100" min="10">
    <div class="cp-sum"><div class="row"><span>Коэф</span><b id="cpSumOdds">0.00</b></div><div class="row"><span>Возможный выигрыш</span><b id="cpSumWin" style="color:var(--green2);">0 ₽</b></div></div>
    <button class="cp-place" id="cpPlace">Сделать ставку</button>
  </div>
</div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modalContent"></div></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
/* ================= КОНСТАНТЫ ================= */
var REAL_TICK = 1000;
var STORAGE_KEY = 'sportlive_v5';
var MAX_DAILY = 200000;
var MIN_STAKE = 10;
/* ================= УТИЛИТЫ ================= */
function $(id){ return document.getElementById(id); }
function $all(sel){ return Array.prototype.slice.call(document.querySelectorAll(sel)); }
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function pad2(n){ return String(n).padStart(2,'0'); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fmtMoney(v){ return Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ') + ' ₽'; }
function toast(msg, type){
  try{
    var t = $('toast'); if(!t) return;
    t.textContent = msg; t.className = 'toast on ' + (type || '');
    clearTimeout(window._tt); window._tt = setTimeout(function(){ t.classList.remove('on'); }, 2600);
  }catch(e){}
}
window.addEventListener('error', function(e){
  try{ toast('Ошибка: ' + (e.message || 'JS'), 'err'); }catch(_){}
});
/* ================= ДАННЫЕ ================= */
var SPORTS = [
  {id:'football', name:'Футбол', ic:'⚽'},
  {id:'ufc', name:'UFC', ic:'🥊'},
  {id:'hockey', name:'Хоккей', ic:'🏒'},
  {id:'cyber', name:'Кибер', ic:'🎮'}
];
var TEAMS = {
  football:[['Арсенал','Челси'],['Реал Мадрид','Барселона'],['Бавария','ПСЖ'],['Ман Сити','Ливерпуль'],['Интер','Ювентус'],['Атлетико','Севилья'],['Спартак','Зенит'],['ПСВ','Аякс'],['Боруссия','Лейпциг'],['Марсель','Лион'],['Порту','Бенфика'],['Наполи','Рома']],
  hockey:[['СКА','ЦСКА'],['Тампа-Бэй','Бостон'],['Ак Барс','Динамо М'],['Колорадо','Вегас'],['Торонто','Монреаль'],['Авангард','Салават'],['Трактор','Металлург'],['Эдмонтон','Флорида']],
  ufc:[['Махачев','Порье'],['Перейра','Анкалаев'],['Джонс','Миочич'],['Волков','Ган'],['Топурия','Холлоуэй'],['Чимаев','Усман']],
  cyber:[['NAVI','FaZe'],['Spirit','Gaimin'],['G2','Vitality'],['T1','Gen.G'],['OG','Liquid'],['Astralis','Heroic'],['MOUZ','VP']]
};
var LEAGUES = {
  football:['АПЛ','Ла Лига','Серия А','Бундеслига','Лига Чемпионов','РПЛ'],
  hockey:['НХЛ','КХЛ','КХЛ · Топ-матч'],
  ufc:['UFC Fight Night','UFC 306','UFC 307'],
  cyber:['CS2 Major','Dota 2 · TI','CS2 · BLAST']
};
var MAXMIN = {football:90, hockey:60, ufc:120, cyber:45};
var BASETOT = {football:2.6, hockey:5.4, ufc:3.2, cyber:26};
var EPOCH = Date.UTC(2025, 0, 1);
var CYCLE_MS = 5 * 60 * 1000;
function curCycle(){ return Math.floor((Date.now() - EPOCH) / CYCLE_MS); }
function cycleStartMs(c){ return EPOCH + c * CYCLE_MS; }
function makeRng(seed){
  var a = seed >>> 0;
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
// Перерывы как в Фонбете: [с_минуты, по_минуту, подпись]
var BREAKS = {
  football: [[44, 47, 'Перерыв · 2-й тайм']],
  hockey: [[19, 22, 'Перерыв · 2-й период'], [39, 42, 'Перерыв · 3-й период']],
  // UFC: 5 раундов по 20 сек + 5 сек перерыв (время в секундах)
  ufc: [[20, 25, 'Перерыв · Раунд 2'], [45, 50, 'Перерыв · Раунд 3'], [70, 75, 'Перерыв · Раунд 4'], [95, 100, 'Перерыв · Раунд 5']],
  cyber: [[14, 15, 'Перерыв · смена сторон'], [28, 29, 'Перерыв · 3-я карта']]
};
function breakInfo(m){
  var bs = BREAKS[m.sport] || [];
  for(var i=0;i<bs.length;i++) if(m.minute >= bs[i][0] && m.minute < bs[i][1]) return bs[i][2];
  return null;
}
/* ================= МАТЧ ================= */
var _mid = 1;
function price(p){ p = clamp(p, 0.02, 0.96); return Math.max(1.02, Math.round((0.93 / p) * 100) / 100); }
function winP(diff){ return 1 / (1 + Math.exp(-diff / 10)); }
function mkMatch(sport, home, away){
  var m = {
    id: _mid++, sport: sport, league: LEAGUES[sport][Math.floor(Math.random()*LEAGUES[sport].length)],
    home: home, away: away, hs: 0, as: 0,
    strH: 0.9 + Math.random()*0.5, strA: 0.9 + Math.random()*0.5,
    minute: sport === 'football' ? 5+Math.floor(Math.random()*50) : sport === 'hockey' ? 3+Math.floor(Math.random()*35) : sport === 'ufc' ? Math.floor(Math.random()*8) : 3+Math.floor(Math.random()*15),
    maxMin: MAXMIN[sport], finished:false, finishedAt:0, markets:{}, open:true, events:[],
    curH:0, curA:0, mapH:0, mapA:0, method:null, endRound:null, onBreak:false,
    status:'live', startAt:0
  };
  if(sport === 'football' && Math.random() < 0.5){ m.hs = 1; m.events.push({min:Math.floor(Math.random()*m.minute)+1, txt:'⚽ Гол — '+m.home}); }
  recalc(m, true);
  return m;
}
function goalCh(m){
  var t = m.minute / m.maxMin;
  if(m.sport === 'cyber') return 0.8;
  if(m.sport === 'hockey') return 0.18 * (0.6 + t);
  if(m.sport === 'ufc') return 0;
  return 0.06 * (0.5 + t);
}
// UFC: бой идет по раундам (минута 0-15 = 5 раундов по 3 мин).
// Каждый раунд решается один раз: сначала проверка KO, иначе раунд уходит сильнейшему.
function ufcRound(m, rng, silent){
  var rnd = rng ? rng() : Math.random();
  var round = clamp(Math.ceil(m.minute / 25), 1, 5);
  var sd = m.strH - m.strA;
  var koP = clamp(0.07 + sd * 0.03 + round * 0.012, 0.02, 0.28);
  if(rnd < koP){
    var hw = (rng ? rng() : Math.random()) * (m.strH + m.strA) < m.strH;
    if(hw) m.hs++; else m.as++;
    m.finished = true; m.onBreak = false; m.finishedAt = Date.now();
    m.method = 'KO'; m.endRound = round;
    m.events.push({min:Math.floor(m.minute), txt:'💥 KO/TKO — ' + (hw ? m.home : m.away) + ' (Р' + round + ')'});
    if(!silent){ toast('💥 KO! ' + m.home + ' ' + m.hs + ':' + m.as + ' ' + m.away, ''); checkBets(m); saveResults(m); }
    return;
  }
  var r2 = rng ? rng() : Math.random();
  var home = r2 * (m.strH + m.strA) < m.strH + (m.hs - m.as) * 0.03;
  if(home) m.hs++; else m.as++;
  m.events.push({min:Math.floor(m.minute), txt:'🥊 Раунд ' + round + ' — ' + (home ? m.home : m.away)});
  if(m.events.length > 30) m.events.shift();
  if(!silent) toast('🥊 Раунд ' + round + ': ' + m.home + ' ' + m.hs + ':' + m.as + ' ' + m.away, '');
}
function scoreOnce(m, rng){
  var r = rng ? rng() : Math.random();
  var home = r * (m.strH + m.strA) < m.strH;
  if(home) m.hs++; else m.as++;
  var label = m.sport==='hockey' ? '🥅 Шайба' : m.sport==='ufc' ? '🥊 Раунд' : m.sport==='cyber' ? '⚔️ Раунд' : '⚽ Гол';
  m.events.push({min:Math.floor(m.minute), txt:label+' — '+(home?m.home:m.away)});
  if(m.events.length > 30) m.events.shift();
  return home;
}
// Кибер (CS2, BO3): карта до 13 (при 12-12 до 16), матч до 2 карт
function cyberMap(m, home, silent){
  if(m.sport !== 'cyber' || m.finished) return;
  if(home) m.curH++; else m.curA++;
  var target = (m.curH >= 12 && m.curA >= 12) ? 16 : 13;
  if(m.curH >= target || m.curA >= target){
    var mapN = m.mapH + m.mapA + 1;
    var winner = m.curH > m.curA ? m.home : m.away;
    if(m.curH > m.curA) m.mapH++; else m.mapA++;
    m.events.push({min:Math.floor(m.minute), txt:'🗺 Карта ' + mapN + ' выиграна — ' + winner + ' (' + m.curH + ':' + m.curA + ')'});
    if(!silent) toast('🗺 Карта ' + mapN + ' — ' + winner, '');
    m.curH = 0; m.curA = 0;
    if(m.mapH >= 2 || m.mapA >= 2){
      m.finished = true; m.onBreak = false; m.finishedAt = Date.now();
      m.events.push({min:Math.floor(m.minute), txt:'🏁 Матч окончен — ' + (m.mapH > m.mapA ? m.home : m.away)});
      if(!silent){ checkBets(m); saveResults(m); }
    }
  }
}
function countdownOf(m){
  var s = Math.max(0, Math.floor((m.startAt - Date.now()) / 1000));
  return 'через ' + Math.floor(s / 60) + ':' + pad2(s % 60);
}
function tickMatch(m){
  if(m.finished) return;
  if(m.status === 'upcoming'){
    if(Date.now() >= m.startAt){
      m.status = 'live'; m.minute = 0; m.hs = 0; m.as = 0; m.events = [];
      m.curH = 0; m.curA = 0; m.mapH = 0; m.mapA = 0;
      recalc(m, true);
      toast('▶️ Начался: ' + m.home + ' — ' + m.away, '');
    }
    return;
  }
  m.minute += 1;
  var br = breakInfo(m);
  m.onBreak = !!br;
  if(m.sport === 'ufc'){
    // раунд по 20 сек решается на отметках 20,45,70,95,120 — потом перерыв
    if(m.minute % 25 === 20 && m.minute > 0) ufcRound(m, null);
  } else if(!br){
    var every = (m.sport === 'cyber');
    if((every || m.minute % 2 === 0) && Math.random() < goalCh(m)){
      var home = scoreOnce(m, null);
      if(m.sport === 'cyber'){
        cyberMap(m, home, false);
        if(!m.finished) toast('⚔️ Раунд — ' + (home ? m.home : m.away) + ' (' + m.hs + ':' + m.as + ')', '');
      } else {
        toast('⚽ ' + m.home + ' ' + m.hs + ':' + m.as + ' ' + m.away, '');
      }
    }
  }
  if(m.finished) return;
  recalc(m, false);
  if(m.minute >= m.maxMin){
    m.finished = true; m.onBreak = false; m.finishedAt = Date.now();
    if(m.sport === 'ufc' && !m.method){ m.method = 'DEC'; m.endRound = 5; m.events.push({min:15, txt:'📋 Решение судей — ' + (m.hs >= m.as ? m.home : m.away)}); }
    checkBets(m); saveResults(m);
  }
}
function overP(expF, L){ return clamp(1/(1+Math.exp(-(expF-L-0.5)*2.0)), 0.02, 0.98); }
function noise(v, amt){
  var n = 1 + (Math.random()-0.5) * amt;
  return Math.max(1.02, Math.round(v * n * 100) / 100);
}
function recalc(m, silent){
  try{
    var played = clamp(m.minute / m.maxMin, 0, 0.995);
    var left = 1 - played;
    var diff = m.hs - m.as, tot = m.hs + m.as, adiff = Math.abs(diff);
    var sd = (m.strH - m.strA) * 8;
    var hasX = (m.sport === 'football' || m.sport === 'hockey');
    var pH, pX, pA;
    if(hasX){
      var expLeft = BASETOT[m.sport] * left * (0.9 + Math.abs(m.strH - m.strA) * 0.3);
      var expDiff = sd * 0.55 + diff * (2 + played * 7);
      var w = winP(expDiff * 3);
      // НИЧЬЯ: при ровно к концу — падает к ~1.25 (как в Фонбете), при разнице — умирает
      var drawCap = m.sport === 'hockey' ? 0.85 : 0.88;
      var drawBase = m.sport === 'hockey' ? 0.18 : 0.24;
      var pD;
      if(diff === 0) pD = clamp(drawBase + played * (drawCap - drawBase), drawBase, drawCap);
      else {
        // ведем в счете: ничья тает медленно, в концовке — резко (проверено по рефам Фонбета)
        var dBase = m.sport === 'hockey' ? 0.20 : 0.19;
        var dDec = m.sport === 'hockey' ? 0.09 : 0.10;
        pD = (dBase - played * dDec) * Math.exp(-(adiff - 1) * 0.9);
        if(left < 0.15){
          var f0 = m.sport === 'hockey' ? 0.5 : 0.25, f1 = m.sport === 'hockey' ? 0.5 : 0.75;
          pD *= (f0 + f1 * left / 0.15);
        }
        pD = clamp(pD, 0.015, 0.3);
      }
      pH = w * (1 - pD); pA = (1 - w) * (1 - pD); pX = pD;
      var expF = tot + expLeft;
      m.markets['1X2'] = {lbl:['П1','X','П2'], val:[price(pH),price(pX),price(pA)], closed:[false,false,false]};
      m.markets['Двойной шанс'] = {lbl:['1X','12','X2'], val:[price(pH+pX),price(pH+pA),price(pX+pA)], closed:[false,false,false]};
      var phcap = clamp(w*(0.4+played*0.5), 0.03, 0.93);
      m.markets['Фора1 (-1.5)'] = {lbl:['Да','Нет'], val:[price(phcap),price(1-phcap)], closed:[false,false]};
      var pf2 = clamp(1 - winP(expDiff*2+14), 0.03, 0.95);
      m.markets['Фора2 (+1.5)'] = {lbl:['Да','Нет'], val:[price(1-pf2),price(pf2)], closed:[false,false]};
      var lines = m.sport === 'hockey' ? [4.5,5.5] : [1.5,2.5,3.5];
      lines.forEach(function(L){
        // если тотал уже пробит — кэф схлопывается как в Фонбете
        if(tot > L){ m.markets['Тотал '+L] = {lbl:['Б','М'], val:[1.04, 14.0], closed:[false,false]}; return; }
        var po = overP(expF, L);
        m.markets['Тотал '+L] = {lbl:['Б','М'], val:[price(po),price(1-po)], closed:[false,false]};
      });
      var pbtts = tot > 0 ? 0.62 : clamp(0.55 * (0.3 + expLeft/2.5), 0.15, 0.6);
      m.markets['Обе забьют'] = {lbl:['Да','Нет'], val:[price(pbtts),price(1-pbtts)], closed:[false,false]};
    } else if(m.sport === 'ufc'){
      // UFC: 5 раундов. Лидер забирает бой к концу, KO вероятнее у нокаутера впереди.
      var round = clamp(Math.ceil(m.minute / 3), 1, 5);
      var eff = sd * 2.2 + diff * (4 + played * 12);
      var ph = clamp(winP(eff), 0.03, 0.97);
      m.markets['Победитель'] = {lbl:['1','2'], val:[price(ph),price(1-ph)], closed:[false,false]};
      // осталось раундов: всего 5, сыграно tot; OVER = пережить нужное число раундов без KO
      var koBase = clamp(0.1 + Math.max(sd, -sd) * 0.012 + tot * 0.015, 0.04, 0.5);
      var koR = clamp(koBase + 0.03, 0.05, 0.3);
      [1.5, 2.5, 3.5].forEach(function(L){
        if(tot > L){ m.markets['Тотал '+L] = {lbl:['Б','М'], val:[1.05, 12.0], closed:[false,false]}; return; }
        var need = Math.max(0, (Math.floor(L) + 1) - tot); // раундов пережить
        var pOver = clamp(Math.pow(1 - koR, Math.max(0, need)), 0.03, 0.97);
        m.markets['Тотал '+L] = {lbl:['Б','М'], val:[price(pOver),price(1-pOver)], closed:[false,false]};
      });
      var pko = clamp(koBase + adiff * 0.1, 0.05, 0.8);
      m.markets['Способ победы'] = {lbl:['KO/TKO','Решением'], val:[price(pko),price(1-pko)], closed:[false,false]};
      var pfin = clamp(0.25 + adiff * 0.15 + played * 0.12, 0.08, 0.85);
      m.markets['Досрочная победа'] = {lbl:['Да','Нет'], val:[price(pfin),price(1-pfin)], closed:[false,false]};
      m.ufcRound = round;
    } else {
      // КИБЕР: раунды, счет толкает сильно, к концу фаворит 1.05
      var eff2 = sd * 1.6 + diff * (4 + played * 9);
      var ph2 = clamp(winP(eff2), 0.03, 0.97);
      m.markets['Победитель'] = {lbl:['1','2'], val:[price(ph2),price(1-ph2)], closed:[false,false]};
      var expT = tot + Math.max(0, BASETOT.cyber - tot) * left;
      [24.5, 26.5].forEach(function(L){
        if(tot > L){ m.markets['Тотал '+L] = {lbl:['Б','М'], val:[1.04, 14.0], closed:[false,false]}; return; }
        var po2 = overP(expT, L);
        m.markets['Тотал '+L] = {lbl:['Б','М'], val:[price(po2),price(1-po2)], closed:[false,false]};
      });
      var pf = clamp(winP(eff2 - 12), 0.04, 0.9);
      m.markets['Фора1 (-2.5)'] = {lbl:['Да','Нет'], val:[price(pf),price(1-pf)], closed:[false,false]};
    }
    if(!silent){
      Object.keys(m.markets).forEach(function(k){
        var mk = m.markets[k];
        mk.val = mk.val.map(function(v){ if(v >= 10) return v; return noise(v, 0.03); });
      });
    }
  }catch(e){}
}
/* ================= МЕНЕДЖЕР ================= */
var Manager = {
  matches: [], cycle: 0, seq: 0,
  spawn: function(sport, rng, fixedId, startMin){
    var pool = TEAMS[sport];
    var r = rng ? rng() : Math.random();
    var p = pool[Math.floor(r * pool.length) % pool.length];
    var m = mkMatch(sport, p[0], p[1]);
    if(rng){ m.strH = 0.9 + rng() * 0.5; m.strA = 0.9 + rng() * 0.5; }
    if(fixedId) m.id = fixedId;
    // одинаковый старт для всех: досимулируем seeded-события до стартовой минуты
    if(startMin && startMin > 0 && rng){
      for(var attempt = 0; attempt < 3; attempt++){
        m.minute = 0; m.hs = 0; m.as = 0; m.events = []; m.finished = false; m.method = null;
        if(m.sport === 'cyber'){ m.curH = 0; m.curA = 0; m.mapH = 0; m.mapA = 0; }
        for(var mm = 0; mm < startMin; mm++){
          if(m.finished) break;
          m.minute++;
          if(m.sport === 'ufc'){
            if(m.minute % 25 === 20 && m.minute > 0) ufcRound(m, rng, true);
            continue;
          }
          if(breakInfo(m)) continue;
          var every = (m.sport === 'cyber');
          if((every || m.minute % 2 === 0) && rng() < goalCh(m)){
            var sc = scoreOnce(m, rng);
            if(m.sport === 'cyber') cyberMap(m, sc, true);
          }
        }
        if(!m.finished) break;
      }
      if(m.finished){ m.finished = false; m.method = null; }
      m.onBreak = !!breakInfo(m);
      recalc(m, true);
    }
    this.matches.push(m); return m;
  },
  spawnSoon: function(sport, rng, id, startAt){
    var pool = TEAMS[sport];
    var p = pool[Math.floor(rng() * pool.length) % pool.length];
    var m = mkMatch(sport, p[0], p[1]);
    m.strH = 0.9 + rng() * 0.5; m.strA = 0.9 + rng() * 0.5;
    m.id = id; m.status = 'upcoming'; m.startAt = startAt;
    m.minute = 0; m.hs = 0; m.as = 0; m.events = [];
    recalc(m, true);
    this.matches.push(m); return m;
  },
  topUpSoon: function(){
    // держим ~7 прематчей со слотами от сетки цикла — одинаково у всех
    var self = this;
    var soon = this.matches.filter(function(m){ return m.status === 'upcoming'; });
    if(soon.length >= 7) return;
    var cyc = this.cycle, base = cycleStartMs(cyc);
    var lastStart = 0;
    soon.forEach(function(m){ if(m.startAt > lastStart) lastStart = m.startAt; });
    if(!lastStart) lastStart = Math.max(Date.now(), base);
    var sports = ['football', 'football', 'hockey', 'cyber', 'ufc', 'football', 'hockey', 'cyber'];
    var need = 7 - soon.length;
    for(var i = 0; i < need; i++){
      try{
        var rng = makeRng((cyc * 2654435761 + self.seq * 40503 + 99991 + i * 13) >>> 0);
        self.seq++;
        var s = sports[(soon.length + i) % sports.length];
        lastStart += 45000 + Math.floor(rng() * 60000);
        self.spawnSoon(s, rng, 20000 + self.seq, lastStart);
      }catch(e){}
    }
  },
  rollover: function(newCycle){
    // смена цикла БЕЗ потери живых ставок: уносим незаконченное, добиваем линию
    var keep = this.matches.filter(function(m){
      return !m.finished || (Date.now() - (m.finishedAt || 0) < 30000);
    });
    this.matches = keep; this.cycle = newCycle;
    this.topUpSoon();
  },
  init: function(){
    this.matches = []; this.seq = 0;
    var cycle = curCycle(); this.cycle = cycle;
    var now = Date.now();
    var elapsed = Math.floor((now - cycleStartMs(cycle)) / 1000);
    var want = {football:6, hockey:4, ufc:3, cyber:4};
    var self = this;
    // старты разбросаны по времени (span) — матчи на разных стадиях, у всех одинаково
    var span = {football:65, hockey:42, ufc:95, cyber:34};
    var base = {football:6, hockey:4, ufc:8, cyber:3};
    Object.keys(want).forEach(function(s){
      for(var i=0;i<want[s];i++){
        try{
          var rng = makeRng((cycle * 2654435761 + self.seq * 40503 + s.charCodeAt(0) * 97) >>> 0);
          self.seq++;
          var startMin = Math.min(MAXMIN[s] - 5, base[s] + ((elapsed + i * 37 + s.charCodeAt(0) * 11) % span[s]));
          self.spawn(s, rng, self.seq, startMin);
        }catch(e){}
      }
    });
    this.topUpSoon();
  },
  tick: function(){
    var self = this;
    // новый цикл — мягкий ролловер, ставки не горят
    if(curCycle() !== this.cycle){ this.rollover(curCycle()); renderList(); return; }
    this.matches.forEach(function(m){ try{ tickMatch(m); }catch(e){} });
    this.topUpSoon();
    var now = Date.now();
    this.matches = this.matches.map(function(m){
      if(m.finished && now - m.finishedAt > 30000){
        try{
          var rng = makeRng((self.cycle * 2654435761 + self.seq * 40503 + 777) >>> 0);
          self.seq++;
          var idx = self.matches.indexOf(m);
          var nm = mkMatch(m.sport, TEAMS[m.sport][Math.floor(rng()*TEAMS[m.sport].length)][0], TEAMS[m.sport][Math.floor(rng()*TEAMS[m.sport].length)][1]);
          nm.id = 10000 + self.seq; nm.minute = 0; nm.hs = 0; nm.as = 0; nm.events = []; recalc(nm, true);
          return nm;
        }
        catch(e){ return m; }
      }
      return m;
    });
    if(this.matches.length > 40){
      var fin = this.matches.filter(function(m){return m.finished;});
      var need = this.matches.length - 40;
      for(var i=0;i<need && fin.length;i++){ var idx = this.matches.indexOf(fin[i]); if(idx>-1) this.matches.splice(idx,1); }
    }
  },
  find: function(id){ return this.matches.find(function(m){return m.id===id;}); },
  liveCount: function(){ return this.matches.filter(function(m){return m.status === 'live' && !m.finished;}).length; },
  soonCount: function(){ return this.matches.filter(function(m){return m.status === 'upcoming';}).length; }
};

var State = { balance:10000, coupon:[], betType:'single', history:[], results:[], sport:'all', histFilter:'all', dailyDate:'', dailyAmount:0, lastBonus:'', favs:[], search:'', sort:'def', centerId:null, centerTab:'markets' };
function todayS(){ return new Date().toDateString(); }
function loadState(){
  try{
    var d = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); if(!d) return;
    if(typeof d.balance === 'number') State.balance = d.balance;
    if(Array.isArray(d.history)) State.history = d.history.slice(0,100);
    if(Array.isArray(d.results)) State.results = d.results.slice(0,50);
    if(Array.isArray(d.favs)) State.favs = d.favs.slice(0,50);

}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify({balance:State.balance, history:State.history.slice(0,100), results:State.results.slice(0,50), favs:State.favs, dailyDate:State.dailyDate, dailyAmount:State.dailyAmount, lastBonus:State.lastBonus})); }catch(e){}
}
function saveResults(m){

function refreshCoupon(){
  State.coupon = State.coupon.filter(function(c){
    var m = Manager.find(c.matchId); if(!m || m.finished) return false;
    var mk = m.markets[c.market]; if(!mk || !(mk.val[c.pick] > 1)) return false;
    if(mk.closed && mk.closed[c.pick]) return false;
    c.odds = mk.val[c.pick]; return true;
  });
}
function couponOdds(){ if(!State.coupon.length) return 0; var o = State.betType==='single' ? State.coupon[0].odds : State.coupon.reduce(function(a,c){return a*c.odds;},1); return Math.round(o*100)/100; }
function addToCoupon(mid, market, pick){
  var m = Manager.find(mid); if(!m) return;
  if(m.finished){ toast('Матч завершён','err'); return; }
  var mk = m.markets[market]; if(!mk) return;
  if(mk.closed && mk.closed[pick]){ toast('Рынок закрыт','err'); return; }
  var odds = mk.val[pick], lbl = mk.lbl[pick];
  var ex = State.coupon.findIndex(function(c){return c.matchId===mid && c.market===market && c.pick===pick;});
  if(ex > -1){ State.coupon.splice(ex,1); }

    if(State.betType === 'single') State.coupon = [];

      if(State.coupon.some(function(c){return c.matchId===mid;})){ toast('В экспрессе одна ставка на матч','err'); return; }
      if(State.coupon.length >= 12){ toast('Максимум 12','err'); return; }

function placeBet(){

  if(stake < MIN_STAKE){ toast('Минимум '+MIN_STAKE+' ₽','err'); return; }

  if(State.history.length > 100) State.history.length = 100;

}
function resultOf(mk, pick, m){
  var h = m.hs, a = m.as, t = h + a;
  var key = '';
  Object.keys(m.markets).forEach(function(k){ if(m.markets[k] === mk) key = k; });

  if(key === 'Победитель'){ return pick===0 ? (h>a?'win':'lose') : (a>h?'win':'lose'); }
  if(key === 'Двойной шанс'){ if(pick===0) return h>=a?'win':'lose'; if(pick===1) return h!==a?'win':'lose'; return a>=h?'win':'lose'; }
  if(key === 'Фора1 (-1.5)'){ var ok1 = (h-1.5) > a; return ((ok1 && pick===0)||(!ok1 && pick===1))?'win':'lose'; }
  if(key === 'Фора2 (+1.5)'){ var ok2 = (a+1.5) > h; return ((ok2 && pick===0)||(!ok2 && pick===1))?'win':'lose'; }
  if(key === 'Фора1 (-2.5)'){ var ok3 = (h-2.5) > a; return ((ok3 && pick===0)||(!ok3 && pick===1))?'win':'lose'; }

  var nav = e.target.closest('[data-nav]');
  if(nav){ State.sport = nav.dataset.nav; renderTabs(); renderFilters(); renderList(); return; }
  var fc = e.target.closest('[data-sport]');
  if(fc){ State.sport = fc.dataset.sport; renderTabs(); renderFilters(); renderList(); return; }
  var fav = e.target.closest('[data-fav]');
  if(fav){ e.stopPropagation(); var fid = parseInt(fav.dataset.fav); var ix = State.favs.indexOf(fid); if(ix>-1) State.favs.splice(ix,1); else State.favs.push(fid); saveState(); renderList(); return; }
  var od = e.target.closest('.odd,.mkt-odd');
  if(od && !od.classList.contains('cl')){
    e.stopPropagation();
    addToCoupon(parseInt(od.dataset.mid), od.dataset.mkt, parseInt(od.dataset.pick)); return;
  }
  var ct = e.target.closest('[data-ct]');
  if(ct){ State.centerTab = ct.dataset.ct; renderCenter(); return; }
  var lc = e.target.closest('.lcard');
  if(lc){ openCenter(parseInt(lc.dataset.mid)); return; }
  var card = e.target.closest('[data-card]');
  if(card){ openCenter(parseInt(card.dataset.card)); return; }
  var x = e.target.closest('.cp-item .x');
  if(x){ State.coupon = State.coupon.filter(function(c){return !(c.matchId==x.dataset.mid && c.market==x.dataset.mkt && c.pick==x.dataset.pick);}); updateCoupon(); paintSel(); saveState(); if(!State.coupon.length) $('coupon').classList.remove('show'); return; }
  var ct = e.target.closest('.cp-type button');
  if(ct){ State.betType = ct.dataset.type; $all('.cp-type button').forEach(function(b){b.classList.toggle('on',b===ct);}); if(State.betType==='single'&&State.coupon.length>1) State.coupon=[State.coupon[State.coupon.length-1]]; updateCoupon(); saveState(); return; }
  var q = e.target.closest('.cp-stake .q');
  if(q){ $('cpStake').value = q.dataset.s; updateCoupon(); return; }
  if(e.target.closest('#cpPlace')){ placeBet(); return; }
  if(e.target.closest('#cpClose')){ $('coupon').classList.remove('show'); return; }
  if(e.target.closest('#cpBar')){ $('coupon').classList.toggle('open'); return; }
  if(e.target.closest('#balanceBtn') || e.target.closest('#btnProfile')){ openProfile(); return; }
  if(e.target.closest('#seeAllLive')){ State.sport='live'; renderTabs(); renderFilters(); renderList(); return; }
  if(e.target.id === 'modalBg') closeModal();
});
document.addEventListener('input', function(e){
  if(e.target.id==='cpStake') updateCoupon();
  if(e.target.id==='searchInput'){ State.search = e.target.value.trim().toLowerCase(); renderList(); }
});
document.addEventListener('change', function(e){
  if(e.target.id==='sortSel'){ State.sort = e.target.value; renderList(); }
});
window.closeModal = closeModal; window.openHistory = openHistory; window.openProfile = openProfile;
window.deposit = deposit; window.doCashout = doCashout; window.claimBonus = claimBonus;
/* ================= INIT ================= */
(function init(){
  loadState();
  if(State.dailyDate !== todayS()){ State.dailyDate = todayS(); State.dailyAmount = 0; }
  updBal();
  Manager.init();
  if(!Manager.matches.length){
    for(var i=0;i<4;i++){ try{ Manager.spawn(['football','hockey','ufc','cyber'][i]); }catch(e){} }
  }
  renderTabs(); renderFilters(); renderList(); renderStrip(); renderResults(); updateCoupon();
  setInterval(mainTick, REAL_TICK);
  setInterval(saveState, 10000);
  setTimeout(function(){ toast('👋 Добро пожаловать в SportLive! Матчей: '+Manager.matches.length,'ok'); }, 700);
})();
</script>
</body>
