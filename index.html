<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a14">
<title>⚡ OpenBet — Live Betting</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0a0a14;
    --bg2: #12121f;
    --card: #1a1a2e;
    --card2: #1f1f38;
    --border: #2a2a45;
    --text: #fff;
    --muted: #888;
    --accent: #7b5cff;
    --accent2: #00d4ff;
    --green: #00e676;
    --red: #ff3860;
    --gold: #ffb800;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }
  body.has-coupon { padding-bottom: 140px; }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(circle at 20% 0%, rgba(123,92,255,.15), transparent 50%),
      radial-gradient(circle at 80% 100%, rgba(0,212,255,.1), transparent 50%);
    pointer-events: none; z-index: 0;
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg2); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  header {
    background: rgba(10,10,20,.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100;
    padding: 12px 20px;
  }
  .header-inner {
    max-width: 1400px; margin: 0 auto;
    display: flex; justify-content: space-between; align-items: center;
    gap: 10px; flex-wrap: wrap;
  }
  .logo { font-size: 19px; font-weight: 900; white-space: nowrap; }
  .logo span {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .nav { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
  .nav::-webkit-scrollbar { display: none; }
  .nav button {
    background: transparent; border: none; color: var(--muted);
    padding: 8px 12px; border-radius: 10px; cursor: pointer;
    font-weight: 700; font-size: 12px; font-family: inherit; transition: .2s;
    white-space: nowrap;
  }
  .nav button:hover, .nav button.active { color: #fff; background: var(--card); }
  .header-right { display: flex; align-items: center; gap: 6px; }
  .balance {
    background: var(--card); border: 1px solid var(--border);
    padding: 7px 12px; border-radius: 10px;
    font-weight: 800; font-size: 13px;
    display: flex; align-items: center; gap: 5px;
    font-variant-numeric: tabular-nums;
    transition: box-shadow .4s;
  }
  .balance.flash { box-shadow: 0 0 20px rgba(0,230,118,.6); }
  .balance .reset { font-size: 9px; color: var(--muted); font-weight: 500; margin-left: 3px; }
  .icon-btn {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; width: 34px; height: 34px;
    cursor: pointer; color: #fff; font-size: 15px;
    display: flex; align-items: center; justify-content: center;
    transition: .2s;
  }
  .icon-btn:hover { border-color: var(--accent); background: var(--card2); }
  .icon-btn.muted { opacity: .4; }

  .container {
    max-width: 1400px; margin: 0 auto;
    padding: 18px 20px; position: relative; z-index: 1;
  }

  .session-bar {
    display: flex; gap: 14px; align-items: center;
    padding: 9px 14px; background: var(--card);
    border: 1px solid var(--border); border-radius: 10px;
    margin-bottom: 14px; font-size: 12px; flex-wrap: wrap;
  }
  .session-bar .label { color: var(--muted); font-weight: 600; }
  .session-bar .value { font-weight: 800; font-variant-numeric: tabular-nums; }
  .session-bar .value.green { color: var(--green); }
  .session-bar .value.red { color: var(--red); }

  .live-drops {
    display: flex; gap: 6px; overflow-x: auto;
    padding-bottom: 6px; margin-bottom: 14px;
  }
  .live-drops::-webkit-scrollbar { height: 4px; }
  .live-drops::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .live-drops:empty { display: none; }
  .drop {
    min-width: 150px; background: var(--card);
    border: 1px solid var(--border); border-radius: 9px;
    padding: 8px 10px; font-size: 11px;
  }
  .drop-match {
    font-weight: 700; margin-bottom: 3px;
    overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; font-size: 10px; color: var(--muted);
  }
  .drop-event { color: var(--green); font-size: 11px; font-weight: 700; }

  .search-row {
    display: flex; gap: 8px;
    margin-bottom: 12px; flex-wrap: wrap;
    align-items: center;
  }
  .search-input {
    flex: 1; min-width: 180px;
    background: var(--card); border: 1px solid var(--border);
    color: #fff; padding: 9px 14px;
    border-radius: 10px; font-size: 13px;
    font-family: inherit;
  }
  .search-input:focus { outline: none; border-color: var(--accent); }
  .search-input::placeholder { color: var(--muted); }

  .filter {
    padding: 8px 14px; background: var(--card);
    border: 1px solid var(--border); border-radius: 10px;
    cursor: pointer; font-weight: 700; color: var(--muted);
    font-size: 12px; font-family: inherit; transition: .2s;
    white-space: nowrap;
  }
  .filter:hover, .filter.active {
    color: #fff; border-color: var(--accent);
    background: rgba(123,92,255,.1);
  }
  .filter.star.active {
    background: rgba(255,184,0,.1);
    border-color: var(--gold); color: var(--gold);
  }
  .filter.toggle.active {
    background: rgba(0,230,118,.1);
    border-color: var(--green); color: var(--green);
  }
  .filters-row {
    display: flex; gap: 6px;
    margin-bottom: 14px; flex-wrap: wrap;
    align-items: center;
  }
  .filters-row .label {
    font-size: 10px; color: var(--muted);
    text-transform: uppercase; font-weight: 700;
    letter-spacing: .5px; margin-right: 4px;
  }

  .match {
    background: linear-gradient(180deg, var(--card), var(--bg2));
    border: 1px solid var(--border); border-radius: 14px;
    padding: 12px; margin-bottom: 9px;
    display: grid; grid-template-columns: 1fr auto;
    gap: 10px; align-items: center;
    transition: border-color .2s;
  }
  .match:hover { border-color: #3a3a55; }
  .match.finished { opacity: .55; }
  .match-info { min-width: 0; }
  .match-top {
    display: flex; align-items: center; gap: 6px;
    margin-bottom: 8px; flex-wrap: wrap;
  }
  .match-league {
    font-size: 10px; color: var(--muted);
    text-transform: uppercase; letter-spacing: .4px; font-weight: 700;
  }
  .badge {
    font-size: 9px; padding: 2px 6px; border-radius: 4px;
    font-weight: 800; text-transform: uppercase; letter-spacing: .4px;
  }
  .badge.live { background: var(--red); color: #fff; }
  .badge.finished { background: #333; color: #888; }
  .badge.prematch { background: var(--accent); color: #fff; }

  .teams-row {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 6px; flex-wrap: wrap;
  }
  .team {
    display: flex; align-items: center; gap: 6px;
    font-weight: 700; font-size: 13px;
  }
  .team-avatar {
    width: 24px; height: 24px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 9px; color: #fff;
    flex-shrink: 0;
  }
  .team-score {
    color: var(--green); font-weight: 800;
    font-variant-numeric: tabular-nums;
    font-size: 15px;
    padding: 0 4px;
  }
  .team-name { white-space: nowrap; }
  .minute {
    font-size: 10px; color: var(--muted);
    font-weight: 600; margin-left: auto;
  }

  .stats-bar {
    display: flex; gap: 10px; flex-wrap: wrap;
    margin: 6px 0; padding: 6px 8px;
    background: rgba(0,0,0,.25);
    border-radius: 7px; font-size: 10px;
  }
  .stat-item {
    display: flex; align-items: center; gap: 4px;
    color: var(--muted);
  }
  .stat-item b { color: var(--text); font-weight: 700; }

  .form-row {
    display: flex; gap: 3px; align-items: center;
    font-size: 10px; margin-top: 4px;
  }
  .form-label { color: var(--muted); margin-right: 4px; font-weight: 600; }
  .form-dot {
    width: 13px; height: 13px; border-radius: 3px;
    display: flex; align-items: center; justify-content: center;
    font-size: 8px; font-weight: 900;
  }
  .form-dot.W { background: rgba(0,230,118,.25); color: var(--green); }
  .form-dot.D { background: rgba(255,184,0,.25); color: var(--gold); }
  .form-dot.L { background: rgba(255,56,96,.25); color: var(--red); }

  .odds { display: flex; gap: 5px; }
  .odds-btn {
    width: 84px;
    background: #0f0f1a;
    border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 6px; text-align: center;
    cursor: pointer; transition: border-color .2s; color: #fff;
    font-family: inherit; font-variant-numeric: tabular-nums;
    overflow: hidden;
  }
  .odds-btn:hover:not(:disabled):not(.disabled) {
    border-color: var(--accent); background: var(--card);
  }
  .odds-btn:disabled, .odds-btn.disabled {
    opacity: .35; cursor: not-allowed;
  }
  .odds-label {
    font-size: 10px; color: var(--muted);
    margin-bottom: 1px; font-weight: 600;
  }
  .odds-value {
    font-size: 15px; font-weight: 800;
    color: var(--accent2);
  }

  .extras {
    grid-column: 1 / -1; margin-top: 2px;
    border-top: 1px solid var(--border); padding-top: 6px;
  }
  .extras-toggle {
    background: transparent; border: none;
    color: var(--accent2); cursor: pointer;
    font-size: 11px; font-weight: 700;
    padding: 4px 0; font-family: inherit;
    transition: color .2s;
  }
  .extras-toggle:hover { color: #fff; }
  .extras-toggle.open { color: var(--muted); }
  .extras-grid {
    display: none;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 5px; margin-top: 8px;
  }
  .extras-grid.open { display: grid; }
  .odds-mini {
    background: #0f0f1a; border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 8px;
    cursor: pointer; display: flex;
    justify-content: space-between; align-items: center;
    font-family: inherit; color: #fff;
    transition: border-color .2s; gap: 5px;
    min-width: 0; overflow: hidden;
  }
  .odds-mini:hover:not(.disabled) { border-color: var(--accent); background: var(--card); }
  .odds-mini.disabled { opacity: .35; cursor: not-allowed; }
  .odds-mini-label { font-size: 10px; color: var(--muted); text-align: left; }
  .odds-mini-value {
    font-size: 12px; font-weight: 800;
    color: var(--accent2); white-space: nowrap;
  }

  .star-btn {
    background: transparent; border: none;
    font-size: 15px; cursor: pointer;
    padding: 3px; color: #444;
    transition: color .2s;
  }
  .star-btn.active { color: var(--gold); }

  .history-filters {
    display: flex; gap: 6px; margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .history-item {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px;
    margin-bottom: 8px; display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 10px; align-items: center;
  }
  .history-item.won { border-left: 3px solid var(--green); }
  .history-item.lost { border-left: 3px solid var(--red); }
  .history-item.pending { border-left: 3px solid var(--gold); }
  .history-main { min-width: 0; }
  .history-match { font-weight: 700; font-size: 12px; margin-bottom: 2px; }
  .history-meta { font-size: 10px; color: var(--muted); }
  .history-stake { text-align: right; }
  .history-stake .amount {
    font-weight: 800; font-size: 13px;
    font-variant-numeric: tabular-nums;
  }
  .history-status {
    font-weight: 800; padding: 3px 9px;
    border-radius: 5px; text-transform: uppercase;
    letter-spacing: .4px; font-size: 9px;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .history-status.won { background: rgba(0,230,118,.15); color: var(--green); }
  .history-status.lost { background: rgba(255,56,96,.15); color: var(--red); }
  .history-status.pending { background: rgba(255,184,0,.15); color: var(--gold); }
  .cashout-btn {
    background: linear-gradient(135deg, var(--green), #00b050);
    border: none; color: #000;
    padding: 5px 10px; border-radius: 6px;
    cursor: pointer; font-family: inherit;
    font-weight: 800; font-size: 10px;
    margin-top: 6px;
    grid-column: 1 / -1;
    width: fit-content;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 10px; margin-bottom: 20px;
  }
  .stat {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px;
  }
  .stat-label { font-size: 11px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
  .stat-value { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .stat-value.green { color: var(--green); }
  .stat-value.red { color: var(--red); }
  .stat-value.gold { color: var(--gold); }

  .chart-container {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px; margin-bottom: 16px;
  }
  .chart-title {
    font-size: 11px; color: var(--muted); font-weight: 700;
    text-transform: uppercase; letter-spacing: .5px;
    margin-bottom: 10px;
  }
  .chart-canvas { width: 100%; height: 180px; display: block; }

  .achievements-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 8px; margin-bottom: 20px;
  }
  .achievement {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px;
    text-align: center; opacity: .35;
  }
  .achievement.unlocked {
    opacity: 1;
    border-color: var(--gold);
    box-shadow: 0 0 20px rgba(255,184,0,.15);
  }
  .achievement-icon { font-size: 28px; margin-bottom: 6px; }
  .achievement-name { font-size: 10px; font-weight: 700; }
  .achievement-desc { font-size: 9px; color: var(--muted); margin-top: 3px; }

  .leaderboard {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px;
  }
  .lb-row {
    display: grid;
    grid-template-columns: 36px 1fr auto;
    gap: 10px; align-items: center;
    padding: 9px 0;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
  }
  .lb-row:last-child { border-bottom: none; }
  .lb-row.me {
    background: rgba(123,92,255,.1);
    margin: 0 -14px; padding: 9px 14px;
    border-radius: 8px;
    border-bottom: none;
  }
  .lb-rank { font-weight: 900; font-size: 15px; color: var(--muted); }
  .lb-rank.top1 { color: var(--gold); }
  .lb-rank.top2 { color: #c0c0c0; }
  .lb-rank.top3 { color: #cd7f32; }
  .lb-name { font-weight: 700; }
  .lb-name.me { color: var(--accent2); }
  .lb-value { font-weight: 800; color: var(--green); font-variant-numeric: tabular-nums; font-size: 12px; }

  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.85); backdrop-filter: blur(6px);
    display: none; align-items: center; justify-content: center;
    z-index: 1000; padding: 16px;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: linear-gradient(180deg, var(--card), var(--bg2));
    border: 1px solid var(--border); border-radius: 18px;
    padding: 22px; max-width: 420px; width: 100%;
    max-height: 90vh; overflow-y: auto;
  }
  .modal h3 { font-size: 16px; margin-bottom: 5px; }
  .modal .sub { color: var(--muted); font-size: 12px; margin-bottom: 14px; line-height: 1.4; }
  .modal .row {
    display: flex; justify-content: space-between;
    padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 12px;
  }
  .modal .row:last-of-type { border-bottom: none; }
  .modal .row .label { color: var(--muted); }
  .modal .row .value { font-weight: 700; font-variant-numeric: tabular-nums; }
  .modal input[type="number"] {
    width: 100%; background: #0f0f1a;
    border: 1px solid var(--border); color: #fff;
    padding: 11px 12px; border-radius: 10px;
    font-size: 15px; margin: 12px 0 8px;
    font-family: inherit; font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .modal input[type="number"]:focus { outline: none; border-color: var(--accent); }
  .quick-stakes { display: flex; gap: 5px; margin-bottom: 12px; flex-wrap: wrap; }
  .quick-stake {
    flex: 1; min-width: 52px; padding: 7px 4px;
    background: #0f0f1a; border: 1px solid var(--border);
    border-radius: 8px; color: #fff; font-size: 11px;
    font-weight: 700; cursor: pointer; font-family: inherit; transition: .2s;
  }
  .quick-stake:hover { border-color: var(--accent); background: var(--card); }
  .modal-actions { display: flex; gap: 8px; margin-top: 14px; }
  .btn {
    flex: 1; padding: 11px; border-radius: 10px;
    border: none; font-weight: 800; cursor: pointer;
    font-family: inherit; font-size: 13px; transition: .2s;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
  }
  .btn-primary:hover:not(:disabled) { transform: translateY(-1px); }
  .btn-primary:disabled { opacity: .4; cursor: not-allowed; }
  .btn-secondary {
    background: #0f0f1a; color: #fff;
    border: 1px solid var(--border);
  }
  .btn-coupon {
    background: var(--card);
    border: 1px solid var(--accent);
    color: var(--accent2);
  }

  .coupon-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: linear-gradient(180deg, var(--card), var(--bg2));
    border-top: 2px solid var(--accent);
    padding: 10px 16px;
    transform: translateY(100%);
    transition: transform .3s;
    z-index: 200;
    box-shadow: 0 -10px 40px rgba(0,0,0,.5);
  }
  .coupon-bar.active { transform: translateY(0); }
  .coupon-inner { max-width: 1400px; margin: 0 auto; }
  .coupon-items {
    display: flex; gap: 5px; overflow-x: auto;
    padding-bottom: 6px; margin-bottom: 6px;
  }
  .coupon-items::-webkit-scrollbar { height: 4px; }
  .coupon-items::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .coupon-item {
    background: #0f0f1a; border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 8px;
    display: flex; align-items: center; gap: 6px;
    min-width: 170px; font-size: 11px;
  }
  .coupon-item-info { flex: 1; min-width: 0; }
  .coupon-item-match {
    font-weight: 700; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; font-size: 11px;
  }
  .coupon-item-pick { color: var(--accent2); font-weight: 700; font-size: 10px; }
  .coupon-item-remove {
    background: transparent; border: none;
    color: var(--red); font-size: 16px;
    cursor: pointer; padding: 0 4px;
    font-family: inherit; line-height: 1;
  }
  .coupon-actions { display: flex; gap: 6px; justify-content: flex-end; }
  .coupon-clear {
    background: transparent; border: 1px solid var(--border);
    color: var(--muted); padding: 8px 14px;
    border-radius: 8px; cursor: pointer;
    font-family: inherit; font-weight: 700; font-size: 12px;
  }
  .coupon-place {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none; color: #fff;
    padding: 8px 16px; border-radius: 8px;
    cursor: pointer; font-family: inherit;
    font-weight: 800; font-size: 12px;
  }

  .skeleton {
    background: linear-gradient(90deg, var(--card) 25%, var(--card2) 50%, var(--card) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 14px;
  }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  .skeleton-match { height: 110px; margin-bottom: 10px; }

  .empty { text-align: center; padding: 50px 20px; color: var(--muted); }
  .empty .icon { font-size: 42px; margin-bottom: 10px; }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  @media (max-width: 720px) {
    header { padding: 10px 12px; }
    .nav button { padding: 6px 8px; font-size: 11px; }
    .logo { font-size: 15px; }
    .balance { padding: 6px 10px; font-size: 12px; }
    .balance .reset { display: none; }
    .match { grid-template-columns: 1fr; gap: 8px; padding: 10px; }
    .odds { justify-content: flex-start; flex-wrap: wrap; }
    .odds-btn { width: 70px; }
    .container { padding: 12px; }
    .extras-grid { grid-template-columns: repeat(2, 1fr); }
    .history-item { grid-template-columns: 1fr auto; }
    .history-status { grid-column: 1 / -1; text-align: center; }
    .session-bar { font-size: 11px; gap: 10px; }
    .team-name { font-size: 12px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">⚡ Open<span>Bet</span></div>
    <nav class="nav">

const HOCKEY_TEAMS = [

// ============================================================
// УТИЛИТЫ
// ============================================================

const $ = (id) => document.getElementById(id);
const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const pick = (arr) => arr[rand(0, arr.length - 1)];
const pickTwo = (arr) => {
  let a = pick(arr), b = pick(arr);
  while (a.name === b.name) b = pick(arr);
  return [a, b];
};

// Poisson через log для стабильности
function poisson(k, lambda) {
  if (k < 0) return 0;
  if (lambda <= 0) return k === 0 ? 1 : 0;
  if (k > 25) return 0;
  let logFact = 0;
  for (let i = 2; i <= k; i++) logFact += Math.log(i);
  return Math.exp(k * Math.log(lambda) - lambda - logFact);
}

// Вероятность → кэф с маржой
function toOdds(p, margin = 0.05) {
  if (p <= 0) return 999;
  if (p >= 1) return 1.01;
  return Math.floor((1 / (p * (1 + margin))) * 100) / 100;
}

// Валидность кэфа
function isOddValid(odd) {
  return odd !== null && odd !== undefined && odd >= 1.05 && odd <= 25 && !isNaN(odd);
}

function formatMoney(v) { return Math.round(v).toLocaleString('ru-RU'); }
function todayKey() { return new Date().toISOString().slice(0, 10); }
function sportIcon(sport) {
  return sport === 'football' ? '⚽' : sport === 'hockey' ? '🏒' : '🥊';
}

function teamColor(name) {
  const colors = ['#7b5cff','#00d4ff','#ff3860','#00e676','#ffb800','#ff6b6b','#4ecdc4','#a855f7','#3b82f6','#10b981'];
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  return colors[Math.abs(hash) % colors.length];
}

function teamInitials(name) {
  const words = name.split(/\s+/);
  if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
  return (words[0][0] + words[1][0]).toUpperCase();
}

function generateForm() {
  const form = [];
  for (let i = 0; i < 5; i++) {
    const r = Math.random();
    if (r < 0.45) form.push('W');
    else if (r < 0.75) form.push('D');
    else form.push('L');
  }
  return form;
}

// ============================================================
// КОЭФФИЦИЕНТЫ — ГЛАВНАЯ ЧАСТЬ
// ============================================================

/**
 * Ожидаемые голы на ОСТАВШЕЕСЯ время
 * attack / maxMinute дают интенсивность в голах/минуту
 * intensity — коэффициент по фазе матча
 */
function expectedGoalsRemaining(m) {
  const remaining = Math.max(0, m.maxMinute - m.minute);
  const isFootball = m.sport === 'football';

  // Фаза матча → интенсивность
  let intensity;
  if (isFootball) {
    if (m.minute < 15) intensity = 0.65;
    else if (m.minute < 30) intensity = 0.95;
    else if (m.minute < 45) intensity = 1.15;
    else if (m.minute < 60) intensity = 0.85;
    else if (m.minute < 75) intensity = 1.10;
    else intensity = 1.45;
  } else {
    if (m.minute < 20) intensity = 0.9;
    else if (m.minute < 40) intensity = 1.05;
    else intensity = 1.2;
  }

  // Голы за минуту × минуты × интенсивность
  const homeRate = (m.homeAttack / m.maxMinute) * intensity;
  const awayRate = (m.awayAttack / m.maxMinute) * intensity;

  // Momentum корректирует
  const lambdaHome = homeRate * remaining * (1 + m.momentum * 0.25);
  const lambdaAway = awayRate * remaining * (1 - m.momentum * 0.25);

  return {
    lambdaHome: Math.max(0, lambdaHome),
    lambdaAway: Math.max(0, lambdaAway),
  };
}

/**
 * 1X2 / ML
 */
function computeOdds(m) {
  if (m.status === 'finished') {
    if (m.sport === 'hockey' || m.sport === 'ufc') {
      if (m.scoreHome > m.scoreAway) return { home: 1.01, draw: null, away: 999 };
      if (m.scoreHome < m.scoreAway) return { home: 999, draw: null, away: 1.01 };
      return { home: null, draw: null, away: null };
    }
    if (m.scoreHome > m.scoreAway) return { home: 1.01, draw: null, away: 999 };
    if (m.scoreHome < m.scoreAway) return { home: 999, draw: null, away: 1.01 };
    return { home: null, draw: 1.01, away: null };
  }

  // UFC
  if (m.sport === 'ufc') {
    const diff = m.homeRating - m.awayRating;
    let pHome = 1 / (1 + Math.pow(10, -diff / 400));
    const progress = m.minute / m.maxMinute;
    pHome = 0.5 + (pHome - 0.5) * (1 - progress * 0.85);
    pHome = Math.max(0.03, Math.min(0.97, pHome));

    const oH = toOdds(pHome, 0.05);
    const oA = toOdds(1 - pHome, 0.05);
    return {
      home: isOddValid(oH) ? oH : null,
      away: isOddValid(oA) ? oA : null,
      draw: null,
    };
  }

  const { lambdaHome, lambdaAway } = expectedGoalsRemaining(m);

  let pHome = 0, pDraw = 0, pAway = 0;
  for (let h = 0; h <= 12; h++) {
    for (let a = 0; a <= 12; a++) {
      const p = poisson(h, lambdaHome) * poisson(a, lambdaAway);
      const fh = m.scoreHome + h;
      const fa = m.scoreAway + a;
      if (fh > fa) pHome += p;
      else if (fh === fa) pDraw += p;
      else pAway += p;
    }
  }
  const total = pHome + pDraw + pAway || 1;
  pHome /= total; pDraw /= total; pAway /= total;

  // Хоккей — нет ничьей
  if (m.sport === 'hockey') {
    const t = pHome + pAway || 1;
    const oH = toOdds(pHome / t, 0.05);
    const oA = toOdds(pAway / t, 0.05);
    return {
      home: isOddValid(oH) ? oH : null,
      away: isOddValid(oA) ? oA : null,
      draw: null,
    };
  }

  const oH = toOdds(pHome, 0.05);
  const oD = toOdds(pDraw, 0.05);
  const oA = toOdds(pAway, 0.05);
  return {
    home: isOddValid(oH) ? oH : null,
    draw: isOddValid(oD) ? oD : null,
    away: isOddValid(oA) ? oA : null,
  };
}

/**
 * Расширенные рынки
 */
function computeExtraMarkets(m) {
  if (m.status === 'finished') return {};

  // UFC
  if (m.sport === 'ufc') {
    const diff = m.homeRating - m.awayRating;
    let pHome = 1 / (1 + Math.pow(10, -diff / 400));
    const progress = m.minute / m.maxMinute;
    pHome = 0.5 + (pHome - 0.5) * (1 - progress * 0.85);
    pHome = Math.max(0.03, Math.min(0.97, pHome));
    const pAway = 1 - pHome;

    // Шанс финиша зависит от раунда
    const round = m.round;
    let pFinish;
    if (round === 1) pFinish = 0.35;
    else if (round === 2) pFinish = 0.30;
    else if (round === 3) pFinish = 0.25;
    else if (round === 4) pFinish = 0.15;
    else pFinish = 0.08;

    const pKO = pFinish * 0.60;
    const pSub = pFinish * 0.40;
    const pDec = 1 - pFinish;

    const raw = {};
    raw['Метод · KO/TKO'] = toOdds(pKO, 0.06);
    raw['Метод · Сабмишн'] = toOdds(pSub, 0.06);
    raw['Метод · Решение'] = toOdds(pDec, 0.06);

    // Тотал раундов
    const pOver15 = round >= 2 ? 1 : 1 - pFinish * 0.7;
    const pOver25 = round >= 3 ? 1 : 1 - pFinish * 0.9;
    raw['Тотал Б 1.5 раундов'] = toOdds(pOver15, 0.06);
    raw['Тотал М 1.5 раундов'] = toOdds(1 - pOver15, 0.06);
    raw['Тотал Б 2.5 раундов'] = toOdds(pOver25, 0.06);
    raw['Тотал М 2.5 раундов'] = toOdds(1 - pOver25, 0.06);

    raw['Бой досрочно'] = toOdds(pFinish, 0.06);
    raw['Пройти всю дистанцию'] = toOdds(pDec, 0.06);

    if (round <= 1) raw['Финиш в R1'] = toOdds(0.30, 0.08);
    if (round <= 2) raw['Финиш в R2'] = toOdds(0.25, 0.08);
    if (round <= 3) raw['Финиш в R3'] = toOdds(0.20, 0.08);
    if (round <= 4) raw['Финиш в R4+'] = toOdds(0.15, 0.08);

    raw[`${m.home} KO/TKO`] = toOdds(pHome * pKO, 0.08);
    raw[`${m.home} Сабмишн`] = toOdds(pHome * pSub, 0.08);
    raw[`${m.home} Решение`] = toOdds(pHome * pDec, 0.08);
    raw[`${m.away} KO/TKO`] = toOdds(pAway * pKO, 0.08);
    raw[`${m.away} Сабмишн`] = toOdds(pAway * pSub, 0.08);
    raw[`${m.away} Решение`] = toOdds(pAway * pDec, 0.08);

    return raw;
  }

  // Футбол / хоккей
  const isFootball = m.sport === 'football';
  const { lambdaHome, lambdaAway } = expectedGoalsRemaining(m);
  const lambdaTotal = lambdaHome + lambdaAway;
  const currentTotal = m.scoreHome + m.scoreAway;

  // Распределение оставшихся голов
  const remDist = [];
  for (let g = 0; g <= 15; g++) remDist.push(poisson(g, lambdaTotal));

  function overProb(line) {
    let p = 0;
    for (let g = 0; g <= 15; g++) {
      if (currentTotal + g > line) p += remDist[g];
    }
    return p;
  }

  function underProb(line) {
    let p = 0;
    for (let g = 0; g <= 15; g++) {
      if (currentTotal + g < line) p += remDist[g];
    }
    return p;
  }

  function handicapProb(line) {
    let p = 0;
    for (let h = 0; h <= 12; h++) {
      for (let a = 0; a <= 12; a++) {
        if ((m.scoreHome + h) - (m.scoreAway + a) > line) {
          p += poisson(h, lambdaHome) * poisson(a, lambdaAway);
        }
      }
    }
    return p;
  }

  let pBtts = 0;
  for (let h = 0; h <= 12; h++) {
    for (let a = 0; a <= 12; a++) {
      if (m.scoreHome + h >= 1 && m.scoreAway + a >= 1) {
        pBtts += poisson(h, lambdaHome) * poisson(a, lambdaAway);
      }
    }
  }

  const odds1X2 = computeOdds(m);
  const pHome = odds1X2.home && isOddValid(odds1X2.home) ? 1 / odds1X2.home : 0;
  const pDraw = odds1X2.draw && isOddValid(odds1X2.draw) ? 1 / odds1X2.draw : 0;
  const pAway = odds1X2.away && isOddValid(odds1X2.away) ? 1 / odds1X2.away : 0;

  let pEven = 0;
  for (let h = 0; h <= 12; h++) {
    for (let a = 0; a <= 12; a++) {
      if ((m.scoreHome + h + m.scoreAway + a) % 2 === 0) {
        pEven += poisson(h, lambdaHome) * poisson(a, lambdaAway);
      }
    }
  }

  function teamOverProb(attack, line, currentScore) {
    const remaining = Math.max(0, m.maxMinute - m.minute);
    const intensity = isFootball
      ? (m.minute < 15 ? 0.65 : m.minute < 45 ? 1.1 : m.minute < 75 ? 1.1 : 1.4)
      : (m.minute < 20 ? 0.9 : m.minute < 40 ? 1.05 : 1.2);
    const remLambda = (attack / m.maxMinute) * remaining * intensity;
    const needed = Math.floor(line) - currentScore;
    if (needed < 0) return 1;
    if (needed >= 12) return 0;
    let p = 0;
    for (let g = needed + 1; g <= 12; g++) p += poisson(g, remLambda);
    return p;
  }

  // Линии — реалистичные
  const lines = isFootball
    ? [0.5, 1.5, 2.5, 3.5, 4.5, 5.5]
    : [3.5, 4.5, 5.5, 6.5, 7.5, 8.5];

  const raw = {};

  if (odds1X2.home && odds1X2.draw && isOddValid(odds1X2.home) && isOddValid(odds1X2.draw)) {
    raw['1X'] = toOdds(pHome + pDraw, 0.04);
  }
  if (odds1X2.home && odds1X2.away && isOddValid(odds1X2.home) && isOddValid(odds1X2.away)) {
    raw['12'] = toOdds(pHome + pAway, 0.04);
  }
  if (odds1X2.draw && odds1X2.away && isOddValid(odds1X2.draw) && isOddValid(odds1X2.away)) {
    raw['X2'] = toOdds(pDraw + pAway, 0.04);
  }

  lines.forEach(line => {
    raw[`ТБ ${line}`] = toOdds(overProb(line), 0.06);
    raw[`ТМ ${line}`] = toOdds(underProb(line), 0.06);
  });

  raw['Ф1 −1.5'] = toOdds(handicapProb(-1.5), 0.06);
  raw['Ф2 −1.5'] = toOdds(1 - handicapProb(1.5), 0.06);
  raw['Ф1 +1.5'] = toOdds(1 - handicapProb(-1.5), 0.06);
  raw['Ф2 +1.5'] = toOdds(handicapProb(1.5), 0.06);

  raw['Обе · Да'] = toOdds(pBtts, 0.06);
  raw['Обе · Нет'] = toOdds(1 - pBtts, 0.06);

  raw['Чёт'] = toOdds(pEven, 0.06);
  raw['Нечет'] = toOdds(1 - pEven, 0.06);

  const teamLine = isFootball ? 0.5 : 1.5;
  const homeOver = teamOverProb(m.homeAttack, teamLine, m.scoreHome);
  const awayOver = teamOverProb(m.awayAttack, teamLine, m.scoreAway);
  raw[`${m.home} Б ${teamLine}`] = toOdds(homeOver, 0.06);
  raw[`${m.home} М ${teamLine}`] = toOdds(1 - homeOver, 0.06);
  raw[`${m.away} Б ${teamLine}`] = toOdds(awayOver, 0.06);
  raw[`${m.away} М ${teamLine}`] = toOdds(1 - awayOver, 0.06);

  if (isFootball && m.minute < 85) {
    const scores = ['0:0','1:0','0:1','1:1','2:0','0:2','2:1','1:2','2:2','3:0','0:3','3:1','1:3','3:2','2:3'];
    scores.forEach(sc => {
      const [h, a] = sc.split(':').map(Number);
      const dh = Math.max(0, h - m.scoreHome);
      const da = Math.max(0, a - m.scoreAway);
      const p = poisson(dh, lambdaHome) * poisson(da, lambdaAway);
      raw[`Счёт ${sc}`] = toOdds(p, 0.08);
    });
  }

  return raw;
}

function createMatches(count = 15) {
  const list = [];
  const prematchCount = Math.max(2, Math.round(count * 0.15));
  for (let i = 0; i < count; i++) {
    list.push(createRandomMatch(i < prematchCount));
  }
  // Перемешиваем чтобы прематч не был вверху
  for (let i = list.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [list[i], list[j]] = [list[j], list[i]];
  }
  return list;
}

let audio = null;
function beep(freq, duration, type = 'sine', volume = 0.08) {
  if (!soundOn) return;
  try {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audio.createOscillator();
    const gain = audio.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume, audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + duration);
    osc.connect(gain); gain.connect(audio.destination);
    osc.start(); osc.stop(audio.currentTime + duration);
  } catch (e) {}
}
function soundBet() { beep(600, 0.08); }
function soundWin() {
  beep(660, 0.12); setTimeout(() => beep(880, 0.12), 120);

}

function tickMatch(m) {
  if (m.status === 'prematch') {
    m.startsIn -= 1;
    if (m.startsIn <= 0) {
      m.status = 'live';
      m.minute = 0;
    }
    return;
  }

  if (m.status !== 'live') return;

  m.minute += 1;
  m.momentum *= 0.93;

  // UFC
  if (m.sport === 'ufc') {
    if (m.minute % 5 === 0) m.round = Math.min(5, m.round + 1);
    const homeAdv = (m.homeRating - m.awayRating) / 400;
    const homeWinsRound = Math.random() < (0.5 + homeAdv * 0.3);
    if (homeWinsRound) {
      m.momentum = Math.min(1, m.momentum + 0.25);
    } else {
      m.momentum = Math.max(-1, m.momentum - 0.25);
    }
    // Финиш 5% в минуту
    if (Math.random() < 0.05) {
      const winner = Math.random() < (0.5 + homeAdv) ? 'home' : 'away';
      if (winner === 'home') m.scoreHome += 10;
      else m.scoreAway += 10;
      m.status = 'finished';
      return;
    }
    if (m.minute >= m.maxMinute) m.status = 'finished';
    return;
  }

  // Футбол / хоккей
  if (m.minute >= m.maxMinute) {
    m.status = 'finished';
    return;
  }

  const { lambdaHome, lambdaAway } = expectedGoalsRemaining(m);
  // За 1 тик — вероятность гола = lambda (уже за оставшееся время / remaining)
  const remaining = Math.max(1, m.maxMinute - m.minute);
  const pHome = lambdaHome / remaining;
  const pAway = lambdaAway / remaining;

  if (Math.random() < pHome) {
    m.scoreHome += 1;
    m.momentum = Math.min(1, m.momentum + 0.35);
    addLiveDrop(m, m.home, `${m.scoreHome}:${m.scoreAway}`);
  } else if (Math.random() < pAway) {
    m.scoreAway += 1;
    m.momentum = Math.max(-1, m.momentum - 0.35);
    addLiveDrop(m, m.away, `${m.scoreHome}:${m.scoreAway}`);
  }
}

function addLiveDrop(m, scorer, score) {
  liveDrops.unshift({
    match: `${m.home} — ${m.away}`,
    event: `${sportIcon(m.sport)} ${scorer} · ${score}`,
    id: Date.now() + Math.random(),
  });
  if (liveDrops.length > 15) liveDrops.pop();
}

  if (liveOnly) filtered = filtered.filter(m => m.status === 'live');
  if (favOnly) filtered = filtered.filter(m => favorites.has(m.id));
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    filtered = filtered.filter(m =>
      m.home.toLowerCase().includes(q) ||
      m.away.toLowerCase().includes(q) ||
      m.league.toLowerCase().includes(q)
    );
  }

  filtered.sort((a, b) => {
    const order = { live: 0, prematch: 1, finished: 2 };
    if (currentSort === 'time') {
      if (order[a.status] !== order[b.status]) return order[a.status] - order[b.status];
      return a.minute - b.minute;
    }
    if (currentSort === 'odd-high' || currentSort === 'odd-low') {
      const oa = computeOdds(a).home || 99;
      const ob = computeOdds(b).home || 99;
      return currentSort === 'odd-high' ? ob - oa : oa - ob;
    }
    return 0;
  });

  const el = $('matches');
  if (!filtered.length) {
    el.innerHTML = `<div class="empty"><div class="icon">🎯</div>Матчей нет</div>`;

    const odds = computeOdds(m);

    const isPrematch = m.status === 'prematch';

    const extrasKeys = Object.keys(extras);

              <span class="odds-mini-label">${label}</span>
              <span class="odds-mini-value">${valid ? odd.toFixed(2) : '—'}</span>

    const homeAvatar = `<div class="team-avatar" style="background:${teamColor(m.home)}">${teamInitials(m.home)}</div>`;
    const awayAvatar = `<div class="team-avatar" style="background:${teamColor(m.away)}">${teamInitials(m.away)}</div>`;

function drawProfitChart() {
  const canvas = $('profitChart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);

  const w = rect.width, h = rect.height;
  const history = wallet.profitHistory;
  ctx.clearRect(0, 0, w, h);

  if (!history || history.length < 2) {
    ctx.fillStyle = '#888';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Играй — график появится', w / 2, h / 2);
    return;
  }

  const min = Math.min(...history.map(p => p.v));
  const max = Math.max(...history.map(p => p.v));
  const range = max - min || 1;

  ctx.strokeStyle = 'rgba(255,255,255,.05)';
  for (let i = 0; i <= 4; i++) {
    const y = (h / 4) * i;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  }

  const step = w / (history.length - 1);
  const gradient = ctx.createLinearGradient(0, 0, 0, h);
  gradient.addColorStop(0, 'rgba(123,92,255,.4)');
  gradient.addColorStop(1, 'rgba(123,92,255,0)');

  ctx.beginPath();
  history.forEach((p, i) => {
    const x = i * step;
    const y = h - ((p.v - min) / range) * h * 0.9 - h * 0.05;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.strokeStyle = '#7b5cff';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.lineTo(w, h);
  ctx.lineTo(0, h);
  ctx.closePath();
  ctx.fillStyle = gradient;
  ctx.fill();
}

function openBetModal(matchId, pickKey, odd) {
  if (!isOddValid(odd)) return;
  const m = matches.find(x => x.id === matchId);
  if (!m || m.status === 'finished') return;

  activeBet = { matchId, pick: pickKey, odd };

  const pickLabel = pickKey === 'home' ? m.home
    : pickKey === 'away' ? m.away
    : pickKey === 'draw' ? 'Ничья' : pickKey;

  $('betModalTitle').textContent = `${m.home} — ${m.away}`;
  $('betModalSub').textContent = `${pickLabel} · ${m.scoreHome}:${m.scoreAway} · ${m.minute}'`;
  $('betModalOdd').textContent = odd.toFixed(2);
  $('betModalStake').value = '';
  $('betModalPotential').textContent = '—';
  $('betModalCoupon').style.display = 'block';
  $('betModal').classList.add('active');
  updatePotential();
}

function closeBetModal() {
  $('betModal').classList.remove('active');
  activeBet = null;
}

function updatePotential() {
  if (!activeBet) return;
  const stake = parseFloat($('betModalStake').value) || 0;
  const potential = stake * activeBet.odd;
  $('betModalPotential').textContent = potential > 0 ? `${formatMoney(potential)} ₽` : '—';
}

function placeBet() {
  if (!activeBet) return;
  const stake = parseFloat($('betModalStake').value);
  if (!stake || stake < 10) return;
  if (stake > wallet.balance) return;

  if (activeBet.isExpress) {
    const selections = activeBet.selections.map(s => ({
      matchId: s.matchId, pick: s.pick, odd: s.odd,
      label: s.label, match: s.match, status: 'pending',
    }));
    wallet.balance -= stake;
    wallet.totalBet += stake;
    wallet.bets.unshift({
      id: Date.now(), type: 'express',
      match: `Экспресс · ${selections.length}`,
      selections,
      odd: activeBet.odd, stake,
      potential: Math.round(stake * activeBet.odd * 100) / 100,
      status: 'pending',
      createdAt: new Date().toISOString(),
    });
    expressCoupon = [];
    saveCoupon();
    renderCoupon();
  } else {
    const m = matches.find(x => x.id === activeBet.matchId);
    if (!m || m.status === 'finished') return;
    wallet.balance -= stake;
    wallet.totalBet += stake;
    wallet.bets.unshift({
      id: Date.now(), type: 'single',
      matchId: m.id,
      match: `${m.home} — ${m.away}`,
      sport: m.sport,
      pick: activeBet.pick,
      odd: activeBet.odd,
      stake,
      potential: Math.round(stake * activeBet.odd * 100) / 100,
      status: 'pending',
      minute: m.minute,
      score: `${m.scoreHome}:${m.scoreAway}`,
      createdAt: new Date().toISOString(),
    });
  }

  saveWallet();
  flashBalance();
  renderBalance();
  renderHistory();
  renderStats();
  renderAchievements();
  soundBet();
  vibrate(20);
  closeBetModal();
}

// ============================================================

function checkSelection(m, pick) {
  if (m.status !== 'finished') return 'pending';

  const total = m.scoreHome + m.scoreAway;

  if (pick === 'home' || pick === 'away' || pick === 'draw') {
    if (m.sport === 'hockey' || m.sport === 'ufc') {
      if (m.scoreHome > m.scoreAway) return pick === 'home' ? 'won' : 'lost';
      if (m.scoreHome < m.scoreAway) return pick === 'away' ? 'won' : 'lost';
      return 'lost';
    }
    if (m.scoreHome > m.scoreAway) return pick === 'home' ? 'won' : 'lost';
    if (m.scoreHome < m.scoreAway) return pick === 'away' ? 'won' : 'lost';
    return pick === 'draw' ? 'won' : 'lost';
  }

  if (pick === '1X') return (m.scoreHome >= m.scoreAway) ? 'won' : 'lost';
  if (pick === '12') return (m.scoreHome !== m.scoreAway) ? 'won' : 'lost';
  if (pick === 'X2') return (m.scoreHome <= m.scoreAway) ? 'won' : 'lost';

  const tO = pick.match(/^ТБ\s*(\d+\.?\d*)$/);
  const tU = pick.match(/^ТМ\s*(\d+\.?\d*)$/);
  if (tO) return total > parseFloat(tO[1]) ? 'won' : 'lost';
  if (tU) return total < parseFloat(tU[1]) ? 'won' : 'lost';

  const f1 = pick.match(/^Ф1\s*([−\-+]?\d+\.?\d*)$/);
  const f2 = pick.match(/^Ф2\s*([−\-+]?\d+\.?\d*)$/);
  if (f1) return (m.scoreHome - m.scoreAway) > parseFloat(f1[1].replace('−', '-')) ? 'won' : 'lost';
  if (f2) return (m.scoreAway - m.scoreHome) > parseFloat(f2[1].replace('−', '-')) ? 'won' : 'lost';

  if (pick === 'Обе · Да') return (m.scoreHome >= 1 && m.scoreAway >= 1) ? 'won' : 'lost';
  if (pick === 'Обе · Нет') return !(m.scoreHome >= 1 && m.scoreAway >= 1) ? 'won' : 'lost';
  if (pick === 'Чёт') return total % 2 === 0 ? 'won' : 'lost';
  if (pick === 'Нечет') return total % 2 !== 0 ? 'won' : 'lost';

  const homeTeam = pick.match(new RegExp(`^${escapeRegex(m.home)}\\s+(Б|М)\\s+(\\d+\\.?\\d*)$`));
  const awayTeam = pick.match(new RegExp(`^${escapeRegex(m.away)}\\s+(Б|М)\\s+(\\d+\\.?\\d*)$`));
  if (homeTeam) {
    const line = parseFloat(homeTeam[2]);
    return homeTeam[1] === 'Б'
      ? (m.scoreHome > line ? 'won' : 'lost')
      : (m.scoreHome < line ? 'won' : 'lost');
  }
  if (awayTeam) {
    const line = parseFloat(awayTeam[2]);
    return awayTeam[1] === 'Б'
      ? (m.scoreAway > line ? 'won' : 'lost')
      : (m.scoreAway < line ? 'won' : 'lost');
  }

  const cs = pick.match(/^Счёт\s+(\d+):(\d+)$/);
  if (cs) return (m.scoreHome === +cs[1] && m.scoreAway === +cs[2]) ? 'won' : 'lost';

  // UFC
  const wasFinish = m.minute < m.maxMinute;
  const isHomeWin = m.scoreHome > m.scoreAway;
  const isAwayWin = m.scoreAway > m.scoreHome;

  if (pick === 'Метод · KO/TKO') return (wasFinish && Math.random() < 0.6) ? 'won' : 'lost';
  if (pick === 'Метод · Сабмишн') return (wasFinish && Math.random() < 0.4) ? 'won' : 'lost';
  if (pick === 'Метод · Решение') return !wasFinish ? 'won' : 'lost';

  const ufcR = pick.match(/^Тотал (Б|М) (\d+)\.5 раундов$/);
  if (ufcR) {
    const line = parseInt(ufcR[2]);
    if (ufcR[1] === 'Б') return m.round > line ? 'won' : 'lost';
    return m.round < line ? 'won' : 'lost';
  }

  if (pick === 'Бой досрочно') return wasFinish ? 'won' : 'lost';
  if (pick === 'Пройти всю дистанцию') return !wasFinish ? 'won' : 'lost';

  const finishR = pick.match(/^Финиш в R(\d+)\+?$/);
  if (finishR) {
    const target = parseInt(finishR[1]);
    if (pick.includes('+')) return (wasFinish && m.round >= target) ? 'won' : 'lost';
    return (wasFinish && m.round === target) ? 'won' : 'lost';
  }

  const method = wasFinish ? (Math.random() < 0.6 ? 'KO' : 'Sub') : 'Dec';
  if (pick === `${m.home} KO/TKO`) return (isHomeWin && method === 'KO') ? 'won' : 'lost';
  if (pick === `${m.home} Сабмишн`) return (isHomeWin && method === 'Sub') ? 'won' : 'lost';
  if (pick === `${m.home} Решение`) return (isHomeWin && !wasFinish) ? 'won' : 'lost';
  if (pick === `${m.away} KO/TKO`) return (isAwayWin && method === 'KO') ? 'won' : 'lost';
  if (pick === `${m.away} Сабмишн`) return (isAwayWin && method === 'Sub') ? 'won' : 'lost';
  if (pick === `${m.away} Решение`) return (isAwayWin && !wasFinish) ? 'won' : 'lost';

  if (pick === `${m.home} в R1`) return (isHomeWin && m.round === 1 && wasFinish) ? 'won' : 'lost';
  if (pick === `${m.away} в R1`) return (isAwayWin && m.round === 1 && wasFinish) ? 'won' : 'lost';

  return 'lost';
}

function escapeRegex(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function settleBets() {
  let changed = false;

  wallet.bets.forEach(b => {
    if (b.status !== 'pending') return;

    // Экспресс
    if (b.type === 'express') {
      let anyLost = false;
      let allWon = true;
      let allDone = true;

      for (const sel of b.selections) {
        if (sel.status === 'lost') { anyLost = true; continue; }
        if (sel.status === 'won') continue;
        const m = matches.find(x => x.id === sel.matchId);
        if (!m || m.status !== 'finished') { allDone = false; allWon = false; continue; }
        const r = checkSelection(m, sel.pick);
        sel.status = r;
        if (r === 'lost') { anyLost = true; allWon = false; }
      }

      if (anyLost) {
        b.status = 'lost';
        soundLose();
        changed = true;
        wallet.profitHistory.push({ t: Date.now(), v: wallet.totalWon - wallet.totalBet });
        return;
      }

      if (allDone && allWon && b.selections.every(s => s.status === 'won')) {
        b.status = 'won';
        b.payout = Math.round(b.stake * b.odd * 100) / 100;
        wallet.balance += b.payout;
        wallet.totalWon += b.payout;
        soundWin();
        vibrate(50);
        changed = true;
        wallet.profitHistory.push({ t: Date.now(), v: wallet.totalWon - wallet.totalBet });
        if (wallet.profitHistory.length > 100) wallet.profitHistory.shift();
      }
      return;
    }

    // Одиночная
    const m = matches.find(x => x.id === b.matchId);
    if (!m || m.status !== 'finished') return;

    const r = checkSelection(m, b.pick);
    if (r === 'won') {
      b.status = 'won';
      b.payout = Math.round(b.stake * b.odd * 100) / 100;
      wallet.balance += b.payout;
      wallet.totalWon += b.payout;
      soundWin();
      vibrate(50);
    } else if (r === 'lost') {
      b.status = 'lost';
      soundLose();
    }
    changed = true;
    wallet.profitHistory.push({ t: Date.now(), v: wallet.totalWon - wallet.totalBet });
    if (wallet.profitHistory.length > 100) wallet.profitHistory.shift();
  });

  if (changed) {
    saveWallet();
    flashBalance();
    renderBalance();
    renderHistory();
    renderStats();
    renderAchievements();
  }
}

function exportCSV() {
  const rows = [['Дата', 'Матч', 'Тип', 'Исход', 'Кэф', 'Ставка', 'Потенциал', 'Статус', 'Выплата']];
  wallet.bets.forEach(b => {
    rows.push([
      new Date(b.createdAt).toLocaleString('ru-RU'),
      b.match,
      b.type || 'single',
      b.pick || '',
      b.odd,
      b.stake,
      b.potential,
      b.status,
      b.payout || 0,
    ]);
  });
  const csv = rows.map(r => r.map(v => `"${v}"`).join(',')).join('\n');
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `openbet_history_${Date.now()}.csv`;
  link.click();
}

}

$('betModalCoupon').onclick = () => {
  if (!activeBet) return;
  addToCoupon(activeBet.matchId, activeBet.pick, activeBet.odd,
    activeBet.pick === 'home' ? '1' : activeBet.pick === 'draw' ? 'X' : activeBet.pick === 'away' ? '2' : activeBet.pick);
  closeBetModal();
};
$('betModal').onclick = (e) => { if (e.target.id === 'betModal') closeBetModal(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeBetModal(); });

$('soundBtn').onclick = () => {
  soundOn = !soundOn;
  saveSoundPref();
  $('soundBtn').textContent = soundOn ? '🔊' : '🔇';
  $('soundBtn').classList.toggle('muted', !soundOn);
};

$('newLineBtn').onclick = () => {
  matches = createMatches(15);
  openExtras.clear();
  saveMatches();
  renderMatches();
  renderLeagueFilters();
};

$('resetBtn').onclick = () => {
  if (!confirm('Сбросить?')) return;
  wallet = {
    balance: 20000, dailyLimit: 20000, lastReset: todayKey(),
    bets: [], totalBet: 0, totalWon: 0,
    sessionStartBalance: 20000, profitHistory: [],
  };
  expressCoupon = [];
  saveWallet();
  saveCoupon();
  renderBalance();
  renderHistory();
  renderStats();
  renderCoupon();
  renderAchievements();
};

window.addEventListener('resize', () => {
  if ($('tab-stats').classList.contains('active')) drawProfitChart();
});

// ============================================================
// СТАРТ
// ============================================================

loadWallet();
loadCoupon();
loadSoundPref();
loadFavorites();

$('matches').innerHTML = Array(5).fill('<div class="skeleton skeleton-match"></div>').join('');

setTimeout(() => {
  const saved = loadMatches();
  matches = saved || createMatches(15);

  $('soundBtn').textContent = soundOn ? '🔊' : '🔇';
  $('soundBtn').classList.toggle('muted', !soundOn);

  renderBalance();
  renderLeagueFilters();
  renderMatches();
  renderHistory();
  renderStats();
  renderCoupon();
  renderAchievements();

  setInterval(tick, 1000);
  setInterval(saveMatches, 2000);
}, 300);

console.log('%c⚡ OpenBet v16', 'font-size: 20px; font-weight: bold; color: #7b5cff;');
</script>
