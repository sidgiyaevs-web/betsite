<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIVEZONE — Ставки на спорт</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">

  <!-- ШАПКА -->
  <header class="topbar">
    <div class="brand" id="brand">
      <span class="brand-mark">LIVE*ZONE*</span>
    </div>
    <nav class="topnav" id="topnav">
      <button class="tab" data-tab="main">Главная</button>
      <button class="tab" data-tab="live">🔴 LIVE <span class="live-count" id="liveCount">0</span></button>
      <button class="tab" data-tab="sport">🏆 Спорт</button>
      <button class="tab" data-tab="results">📋 Результаты</button>
    </nav>
    <div class="account">
      <div class="balance-box" id="balanceBox">
        <span class="balance-label">Баланс</span>
        <span class="balance-value" id="balanceValue">0.00 ₽</span>
      </div>
      <button class="btn btn-accent" id="depositBtn" title="Пополнить (200 000 ₽/день)">+</button>
      <button class="btn profile-btn" id="profileBtn">👤 Профиль</button>
      <button class="btn ghost" id="logoutBtn" hidden>Выйти</button>
    </div>
  </header>

  <!-- ПОИСК + СПОРТ-ФИЛЬТР -->
  <div class="sublayer">
    <div class="search-wrap">
      <input type="search" id="searchInput" placeholder="🔍 Поиск команд, турниров...">
    </div>
    <div class="sport-tabs" id="sportTabs"></div>
    <div class="view-switch" id="viewSwitch">
      <button class="vs-btn active" data-sort="default">По умолчанию</button>
      <button class="vs-btn" data-sort="live">Сначала LIVE</button>
      <button class="vs-btn" data-sort="time">По времени</button>
    </div>
  </div>

  <!-- КОНТЕНТ -->
  <main id="content"></main>

  <!-- КУПОН -->
  <div class="coupon-wrap">
    <div class="coupon" id="coupon">
      <div class="coupon-head">
        <span>🎟️ Купон <span id="couponCount">0</span></span>
        <span class="coupon-odds">Коэф <span id="couponOdds">0.00</span></span>
        <button class="coupon-clear" id="couponClear">✕</button>
      </div>
      <div id="couponBody"></div>
    </div>
  </div>

  <!-- МОДАЛКИ -->
  <div class="overlay" id="overlay" hidden></div>
  <div class="modal" id="authModal" hidden>
    <div class="modal-head">
      <span id="authTitle">Вход</span>
      <button class="modal-close" id="authClose">✕</button>
    </div>
    <div class="tabs-sm" id="authTabs">
      <button class="sm active" data-auth-tab="login">Вход</button>
      <button class="sm" data-auth-tab="register">Регистрация</button>
    </div>
    <form id="authForm">
      <input type="text" id="authLogin" placeholder="Логин" autocomplete="username">
      <input type="password" id="authPass" placeholder="Пароль" autocomplete="current-password">
      <button class="btn btn-accent w100" type="submit">Войти</button>
      <div class="form-msg" id="authMsg"></div>
    </form>
  </div>

  <div class="modal modal-md" id="profileModal" hidden>
    <div class="modal-head">
      <span>👤 Профиль</span>
      <button class="modal-close" id="profileClose">✕</button>
    </div>
    <div id="profileBody"></div>
  </div>

</div>
<div id="toasts" class="toasts"></div>
<script src="js/data.js"></script>
<script src="js/storage.js"></script>
<script src="js/engine.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
