<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a14">
<title>⚡ OpenBet — Live Betting</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0a0a14;
    --bg2: #0f0f1c;
    --card: rgba(26,26,46,.72);
    --card-solid: #1a1a2e;
    --card2: #1f1f38;
    --border: rgba(80,80,130,.28);
    --border-2: rgba(100,100,160,.4);
    --text: #fff;
    --muted: #8a8aa8;
    --accent: #7b5cff;
    --accent2: #00d4ff;
    --green: #00e676;
    --red: #ff3860;
    --gold: #ffb800;
    --shadow-sm: 0 2px 8px rgba(0,0,0,.25);
    --shadow-md: 0 6px 24px rgba(0,0,0,.35);
    --shadow-lg: 0 12px 48px rgba(0,0,0,.5);
  }
  body.light {
    --bg: #f0f2f7;
    --bg2: #e6e9f0;
    --card: rgba(255,255,255,.85);
    --card-solid: #fff;
    --card2: #f5f6fa;
    --border: rgba(100,100,140,.2);
    --border-2: rgba(100,100,140,.35);
    --text: #1a1a2e;
    --muted: #666;
    --shadow-sm: 0 2px 8px rgba(0,0,0,.08);
    --shadow-md: 0 6px 24px rgba(0,0,0,.12);
    --shadow-lg: 0 12px 48px rgba(0,0,0,.15);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    font-size: 14px;
    line-height: 1.4;
    transition: background .3s, color .3s;
  }
  body.has-coupon { padding-bottom: 140px; }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(circle at 15% -10%, rgba(123,92,255,.22), transparent 45%),
      radial-gradient(circle at 85% 110%, rgba(0,212,255,.14), transparent 45%);
    pointer-events: none; z-index: 0;
  }
  body.light::before {
    background:
      radial-gradient(circle at 15% -10%, rgba(123,92,255,.1), transparent 45%),
      radial-gradient(circle at 85% 110%, rgba(0,212,255,.08), transparent 45%);
  }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(120,120,180,.35); border-radius: 3px; }

  header {
    background: rgba(10,10,20,.85);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100;
    padding: 10px 20px;
    transition: background .3s;
  }
  body.light header { background: rgba(255,255,255,.85); }
  .header-inner {
    max-width: 1440px; margin: 0 auto;
    display: flex; justify-content: space-between; align-items: center;
    gap: 10px; flex-wrap: wrap;
  }
  .logo {
    font-size: 20px; font-weight: 900; white-space: nowrap;
    letter-spacing: -.3px;
  }
  .logo span {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
  .nav::-webkit-scrollbar { display: none; }
  .nav button {
    background: transparent; border: none; color: var(--muted);
    padding: 8px 12px; border-radius: 9px; cursor: pointer;
    font-weight: 700; font-size: 12px; font-family: inherit;
    transition: color .15s, background .15s;
    white-space: nowrap;
    position: relative;
  }
  .nav button:hover { color: var(--text); background: rgba(123,92,255,.08); }
  .nav button.active { color: var(--text); background: var(--card); }

  .header-right { display: flex; align-items: center; gap: 6px; }
  .balance {
    background: var(--card);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    padding: 8px 14px; border-radius: 11px;
    font-weight: 800; font-size: 13px;
    display: flex; align-items: center; gap: 6px;
    font-variant-numeric: tabular-nums;
    transition: box-shadow .4s, border-color .4s, transform .15s;
    cursor: pointer;
    user-select: none;
  }
  .balance:hover { border-color: var(--accent); transform: translateY(-1px); }
  .balance.flash-win { box-shadow: 0 0 24px rgba(0,230,118,.7); border-color: var(--green); }
  .balance.flash-lose { box-shadow: 0 0 24px rgba(255,56,96,.6); border-color: var(--red); }
  .balance.flash-bonus { box-shadow: 0 0 32px rgba(255,184,0,.8); border-color: var(--gold); }
  .icon-btn {
    background: var(--card);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 11px;
    width: 36px; height: 36px;
    cursor: pointer; color: var(--text); font-size: 15px;
    display: flex; align-items: center; justify-content: center;
    transition: border-color .15s, transform .15s;
  }
  .icon-btn:hover { border-color: var(--accent); transform: translateY(-1px); }
  .icon-btn.muted { opacity: .45; }

  .container {
    max-width: 1440px; margin: 0 auto;
    padding: 16px 20px;
    position: relative; z-index: 1;
  }

  .session-bar {
    display: flex; gap: 16px; align-items: center;
    padding: 10px 16px;
    background: var(--card);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 12px; font-size: 12px;
    flex-wrap: wrap;
    box-shadow: var(--shadow-sm);
  }
  .session-bar .label { color: var(--muted); font-weight: 600; }
  .session-bar .value { font-weight: 800; font-variant-numeric: tabular-nums; }
  .session-bar .value.green { color: var(--green); }
  .session-bar .value.red { color: var(--red); }

  .live-drops {
    display: flex; gap: 8px; overflow-x: auto;
    padding-bottom: 8px; margin-bottom: 12px;
  }
  .live-drops::-webkit-scrollbar { height: 4px; }
  .live-drops:empty { display: none; }
  .drop {
    min-width: 170px;
    background: var(--card);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 11px; font-size: 11px;
    animation: dropIn .35s cubic-bezier(.5,1.5,.5,1);
  }
  @keyframes dropIn {
    from { opacity: 0; transform: translateX(20px) scale(.95); }
  }
  .drop-match {
    font-weight: 700; margin-bottom: 3px;
    overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; font-size: 10px;
    color: var(--muted);
  }
  .drop-event { color: var(--green); font-size: 11px; font-weight: 700; }

  .search-row {
    display: flex; gap: 8px;
    margin-bottom: 10px; flex-wrap: wrap; align-items: center;
  }
  .search-input {
    flex: 1; min-width: 180px;
    background: var(--card);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    color: var(--text); padding: 10px 14px;
    border-radius: 11px; font-size: 13px;
    font-family: inherit;
    transition: border-color .15s;
  }
  .search-input:focus { outline: none; border-color: var(--accent); }
  .search-input::placeholder { color: var(--muted); }

  .filter {
    padding: 8px 14px;
    background: var(--card);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer; font-weight: 700;
    color: var(--muted);
    font-size: 12px; font-family: inherit;
    transition: color .15s, border-color .15s, background .15s;
    white-space: nowrap;
  }
  .filter:hover { color: var(--text); }
  .filter.active {
    color: var(--text); border-color: var(--accent);
    background: rgba(123,92,255,.15);
  }
  .filter.star.active {
    background: rgba(255,184,0,.12);
    border-color: var(--gold); color: var(--gold);
  }
  .filter.toggle.active {
    background: rgba(0,230,118,.1);
    border-color: var(--green); color: var(--green);
  }
  .filters-row {
    display: flex; gap: 6px;
    margin-bottom: 12px; flex-wrap: wrap; align-items: center;
  }
  .filters-row .label {
    font-size: 10px; color: var(--muted);
    text-transform: uppercase; font-weight: 700;
    letter-spacing: .5px; margin-right: 4px;
  }

  .match {
    background: var(--card);
    backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 10px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px;
    align-items: center;
    box-shadow: var(--shadow-sm);
    transition: border-color .15s;
  }
  .match:hover { border-color: var(--border-2); }
  .match.finished { opacity: .65; }

  .match-info { min-width: 0; }
  .match-top {
    display: flex; align-items: center; gap: 6px;
    margin-bottom: 8px; flex-wrap: wrap;
  }
  .match-league {
    font-size: 10px; color: var(--muted);
    text-transform: uppercase; letter-spacing: .5px; font-weight: 700;
  }
  .badge {
    font-size: 9px; padding: 3px 7px; border-radius: 5px;
    font-weight: 800; text-transform: uppercase;
    letter-spacing: .4px;
  }
  .badge.live {
    background: var(--red); color: #fff;
    box-shadow: 0 0 8px rgba(255,56,96,.5);
  }
  .badge.finished { background: rgba(100,100,120,.3); color: #aaa; }
  .badge.prematch { background: var(--accent); color: #fff; }
  .badge.break { background: var(--gold); color: #000; }
  .badge.countdown { background: var(--accent2); color: #000; }

  .teams-row {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 6px; flex-wrap: wrap;
  }
  .team {
    display: flex; align-items: center; gap: 8px;
    font-weight: 700; font-size: 13px;
  }
  .team-avatar {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 10px; color: #fff;
    flex-shrink: 0;
    border: 2px solid rgba(255,255,255,.12);
    box-shadow: 0 2px 6px rgba(0,0,0,.25);
    transition: transform .3s, box-shadow .3s;
  }
  .team-avatar.scored {
    animation: scorePulse 1.2s ease-out;
  }
  @keyframes scorePulse {
    0% { transform: scale(1); box-shadow: 0 0 0 rgba(0,230,118,.8); }
    30% { transform: scale(1.35); box-shadow: 0 0 20px rgba(0,230,118,.9); }
    100% { transform: scale(1); box-shadow: 0 2px 6px rgba(0,0,0,.25); }
  }
  .team-score {
    color: var(--green); font-weight: 800;
    font-variant-numeric: tabular-nums;
    font-size: 16px;
    padding: 0 4px;
    letter-spacing: -.5px;
    transition: transform .3s, color .3s;
  }
  .team-score.scored {
    animation: scoreFlash 1.2s ease-out;
  }
  @keyframes scoreFlash {
    0% { transform: scale(1); }
    30% { transform: scale(1.5); color: var(--green); text-shadow: 0 0 20px var(--green); }
    100% { transform: scale(1); }
  }
  .team-name { white-space: nowrap; }

  .period-progress {
    display: flex; gap: 4px; margin: 8px 0 6px;
  }
  .period-seg {
    height: 3px; flex: 1;
    background: rgba(120,120,160,.2);
    border-radius: 2px;
    position: relative;
    overflow: hidden;
  }
  .period-seg.done { background: var(--green); }
  .period-seg.active { background: rgba(123,92,255,.3); }
  .period-seg.active::after {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: var(--p, 0%);
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px;
    transition: width .5s linear;
  }

  .stats-bar {
    display: flex; gap: 12px; flex-wrap: wrap;
    margin: 8px 0 4px;
    padding: 8px 10px;
    background: rgba(0,0,0,.15);
    border-radius: 8px; font-size: 10px;
  }
  body.light .stats-bar { background: rgba(0,0,0,.04); }
  .stat-item { display: flex; align-items: center; gap: 4px; color: var(--muted); }
  .stat-item b { color: var(--text); font-weight: 700; font-variant-numeric: tabular-nums; }

  .ufc-final {
    display: flex; gap: 10px; align-items: center;
    margin: 10px 0 4px; padding: 10px 12px;
    background: linear-gradient(135deg, rgba(255,184,0,.18), rgba(255,56,96,.08));
    border: 1px solid rgba(255,184,0,.45);
    border-radius: 10px;
    font-size: 12px; font-weight: 700;
    box-shadow: 0 0 20px rgba(255,184,0,.15);
  }
  .ufc-final-icon { font-size: 22px; }
  .ufc-final-text { flex: 1; line-height: 1.5; }
  .ufc-final-text b { color: var(--gold); }
  .ufc-final-sub { color: var(--muted); font-weight: 600; font-size: 11px; }

  .odds { display: flex; gap: 6px; }
  .odds-btn {
    width: 90px;
    background: rgba(15,15,26,.7);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 8px 6px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, background .15s, transform .1s;
    color: var(--text);
    font-family: inherit; font-variant-numeric: tabular-nums;
    overflow: hidden;
  }
  body.light .odds-btn { background: rgba(245,246,250,.9); }
  .odds-btn:hover:not(:disabled):not(.disabled) {
    border-color: var(--accent);
    background: rgba(123,92,255,.08);
  }
  .odds-btn:active:not(:disabled):not(.disabled) { transform: scale(.97); }
  .odds-btn:disabled, .odds-btn.disabled { opacity: .35; cursor: not-allowed; }
  .odds-label {
    font-size: 10px; color: var(--muted);
    margin-bottom: 2px; font-weight: 600;
  }
  .odds-value {
    font-size: 15px; font-weight: 800;
    color: var(--accent2);
  }

  .extras {
    grid-column: 1 / -1; margin-top: 4px;
    border-top: 1px solid var(--border);
    padding-top: 8px;
  }
  .extras-toggle {
    background: transparent; border: none;
    color: var(--accent2); cursor: pointer;
    font-size: 11px; font-weight: 700;
    padding: 4px 0; font-family: inherit;
  }
  .extras-toggle.open { color: var(--muted); }
  .extras-grid {
    display: none;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 6px; margin-top: 8px;
  }
  .extras-grid.open { display: grid; }
  .odds-mini {
    background: rgba(15,15,26,.7);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 7px 9px;
    cursor: pointer; display: flex;
    justify-content: space-between; align-items: center;
    font-family: inherit; color: var(--text);
    transition: border-color .15s, background .15s;
    gap: 6px; min-width: 0; overflow: hidden;
  }
  body.light .odds-mini { background: rgba(245,246,250,.9); }
  .odds-mini:hover:not(.disabled) {
    border-color: var(--accent);
    background: rgba(123,92,255,.08);
  }
  .odds-mini.disabled { opacity: .35; cursor: not-allowed; }
  .odds-mini-label {
    font-size: 10px; color: var(--muted);
    text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .odds-mini-value {
    font-size: 12px; font-weight: 800;
    color: var(--accent2); white-space: nowrap;
  }

  .star-btn {
    background: transparent; border: none;
    font-size: 16px; cursor: pointer;
    padding: 3px; color: #444;
    transition: color .15s, transform .15s;
  }
  .star-btn:hover { transform: scale(1.15); }
  .star-btn.active { color: var(--gold); }

  .history-filters {
    display: flex; gap: 6px; margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .history-item {
    background: var(--card);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 12px; align-items: center;
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    transition: border-color .15s;
  }
  .history-item:hover { border-color: var(--border-2); }
  .history-item.won { border-left: 3px solid var(--green); }
  .history-item.lost { border-left: 3px solid var(--red); }
  .history-item.pending { border-left: 3px solid var(--gold); }
  .history-main { min-width: 0; }
  .history-match { font-weight: 700; font-size: 12px; margin-bottom: 2px; }
  .history-meta { font-size: 10px; color: var(--muted); }
  .history-stake { text-align: right; }
  .history-stake .amount {
    font-weight: 800; font-size: 13px;
    font-variant-numeric: tabular-nums;
  }
  .history-status {
    font-weight: 800; padding: 4px 10px;
    border-radius: 6px; text-transform: uppercase;
    letter-spacing: .4px; font-size: 9px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .history-status.won { background: rgba(0,230,118,.15); color: var(--green); }
  .history-status.lost { background: rgba(255,56,96,.15); color: var(--red); }
  .history-status.pending { background: rgba(255,184,0,.15); color: var(--gold); }

  .cashout-row {
    grid-column: 1 / -1;
    display: flex; gap: 8px; align-items: center;
    padding-top: 8px;
    border-top: 1px solid var(--border);
    margin-top: 4px;
  }
  .cashout-btn {
    background: linear-gradient(135deg, var(--green), #00b050);
    border: none; color: #000;
    padding: 7px 14px; border-radius: 8px;
    cursor: pointer; font-family: inherit;
    font-weight: 800; font-size: 11px;
  }
  .cashout-info { font-size: 11px; color: var(--muted); }
  .cashout-info b { color: var(--gold); }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 10px; margin-bottom: 20px;
  }
  .stat {
    background: var(--card);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 12px; padding: 14px;
    box-shadow: var(--shadow-sm);
  }
  .stat-label {
    font-size: 11px; color: var(--muted);
    margin-bottom: 4px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .3px;
  }
  .stat-value {
    font-size: 20px; font-weight: 800;
    font-variant-numeric: tabular-nums;
    letter-spacing: -.5px;
  }
  .stat-value.green { color: var(--green); }
  .stat-value.red { color: var(--red); }
  .stat-value.gold { color: var(--gold); }

  .chart-container {
    background: var(--card);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 12px; padding: 16px; margin-bottom: 16px;
    box-shadow: var(--shadow-sm);
  }
  .chart-title {
    font-size: 11px; color: var(--muted); font-weight: 700;
    text-transform: uppercase; letter-spacing: .5px;
    margin-bottom: 10px;
  }
  .chart-canvas { width: 100%; height: 180px; display: block; }

  .achievements-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 10px; margin-bottom: 20px;
  }
  .achievement {
    background: var(--card);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 10px;
    text-align: center;
    opacity: .4;
    transition: opacity .2s, border-color .2s, box-shadow .2s;
  }
  .achievement.unlocked {
    opacity: 1;
    border-color: var(--gold);
    box-shadow: 0 0 24px rgba(255,184,0,.18);
  }
  .achievement-icon { font-size: 30px; margin-bottom: 6px; }
  .achievement-name { font-size: 10px; font-weight: 700; margin-bottom: 2px; }
  .achievement-desc { font-size: 9px; color: var(--muted); }

  .leaderboard {
    background: var(--card);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 12px; padding: 14px;
    box-shadow: var(--shadow-sm);
  }
  .lb-header { color: var(--muted); font-size: 12px; margin-bottom: 12px; font-weight: 600; }
  .lb-header b { color: var(--gold); font-weight: 800; }
  .lb-row {
    display: grid; grid-template-columns: 40px 1fr auto;
    gap: 10px; align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
  }
  .lb-row:last-child { border-bottom: none; }
  .lb-row.me {
    background: rgba(123,92,255,.12);
    margin: 0 -14px; padding: 10px 14px;
    border-radius: 8px; border-bottom: none;
  }
  .lb-rank {
    font-weight: 900; font-size: 15px;
    color: var(--muted); text-align: center;
  }
  .lb-rank.top1 { color: var(--gold); }
  .lb-rank.top2 { color: #c0c0c0; }
  .lb-rank.top3 { color: #cd7f32; }
  .lb-name { font-weight: 700; }
  .lb-name.me { color: var(--accent2); }
  .lb-value {
    font-weight: 800; color: var(--green);
    font-variant-numeric: tabular-nums; font-size: 12px;
  }

  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.75);
    backdrop-filter: blur(8px);
    display: none; align-items: center; justify-content: center;
    z-index: 1000; padding: 16px;
    animation: fadeIn .2s;
  }
  @keyframes fadeIn { from { opacity: 0; } }
  .modal-overlay.active { display: flex; }
  .modal {
    background: linear-gradient(180deg, rgba(31,31,56,.98), rgba(18,18,31,.98));

// ============================================================
// УТИЛИТЫ
// ============================================================
const $ = (id) => document.getElementById(id);
const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const pick = (arr) => arr[rand(0, arr.length - 1)];
const pickTwo = (arr) => {
  let a = pick(arr), b = pick(arr);
  while (a.name === b.name) b = pick(arr);
  return [a, b];
};

function poisson(k, lambda) {
  if (k < 0) return 0;
  if (lambda <= 0) return k === 0 ? 1 : 0;
  if (k > 25) return 0;
  let logFact = 0;
  for (let i = 2; i <= k; i++) logFact += Math.log(i);
  return Math.exp(k * Math.log(lambda) - lambda - logFact);
}

function toOdds(p, margin = 0.05) {
  if (p <= 0) return 999;
  if (p >= 1) return 1.01;
  return Math.ceil((1 / (p * (1 + margin))) * 100) / 100;
}

function isOddValid(odd) {
  if (odd === null || odd === undefined) return false;
  if (typeof odd !== 'number' || isNaN(odd)) return false;
  return odd >= 1.01 && odd <= 50;
}

function formatMoney(v) { return Math.round(v).toLocaleString('ru-RU'); }
function todayKey() { return new Date().toISOString().slice(0, 10); }
function sportIcon(sport) {
  return sport === 'football' ? '⚽' : sport === 'hockey' ? '🏒' : '🥊';
}

function teamColor(name) {
  const colors = ['#7b5cff','#00d4ff','#ff3860','#00e676','#ffb800','#ff6b6b','#4ecdc4','#a855f7','#3b82f6','#10b981'];
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  return colors[Math.abs(hash) % colors.length];
}

function teamInitials(name) {
  const words = name.split(/\s+/);
  if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
  return (words[0][0] + words[1][0]).toUpperCase();
}

function generateForm() {
  const form = [];
  for (let i = 0; i < 5; i++) {
    const r = Math.random();
    if (r < 0.45) form.push('W');
    else if (r < 0.75) form.push('D');
    else form.push('L');
  }
  return form;
}

function formatTime(seconds) {
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return `${m}:${String(s).padStart(2, '0')}`;
}

// ============================================================
// КОЭФФИЦИЕНТЫ
// ============================================================
function expectedGoalsRemaining(m) {
  const remaining = Math.max(0, m.maxMinute - m.minute);
  const isFootball = m.sport === 'football';
  let intensity;
  if (isFootball) {
    if (m.minute < 15) intensity = 0.65;
    else if (m.minute < 30) intensity = 0.95;
    else if (m.minute < 45) intensity = 1.15;
    else if (m.minute < 60) intensity = 0.85;
    else if (m.minute < 75) intensity = 1.10;
    else intensity = 1.45;
  } else {
    if (m.minute < 20) intensity = 0.9;
    else if (m.minute < 40) intensity = 1.05;
    else intensity = 1.2;
  }
  const homeRate = (m.homeAttack / m.maxMinute) * intensity;
  const awayRate = (m.awayAttack / m.maxMinute) * intensity;
  return {
    lambdaHome: Math.max(0, homeRate * remaining * (1 + m.momentum * 0.25)),
    lambdaAway: Math.max(0, awayRate * remaining * (1 - m.momentum * 0.25)),
  };
}

function computeOdds(m) {
  if (m.status === 'finished') {
    if (m.sport === 'hockey' || m.sport === 'ufc') {
      if (m.scoreHome > m.scoreAway) return { home: 1.01, draw: null, away: 999 };
      if (m.scoreHome < m.scoreAway) return { home: 999, draw: null, away: 1.01 };
      return { home: null, draw: null, away: null };
    }
    if (m.scoreHome > m.scoreAway) return { home: 1.01, draw: null, away: 999 };
    if (m.scoreHome < m.scoreAway) return { home: 999, draw: null, away: 1.01 };
    return { home: null, draw: 1.01, away: null };
  }

  if (m.sport === 'ufc') {
    const diff = m.homeRating - m.awayRating;
    let pHome = 1 / (1 + Math.pow(10, -diff / 400));
    const progress = m.minute / m.maxMinute;
    pHome = 0.5 + (pHome - 0.5) * (1 - progress * 0.85);
    pHome = Math.max(0.03, Math.min(0.97, pHome));
    const oH = toOdds(pHome, 0.05);
    const oA = toOdds(1 - pHome, 0.05);
    return {
      home: isOddValid(oH) ? oH : null,
      away: isOddValid(oA) ? oA : null,
      draw: null,
    };
  }

  const { lambdaHome, lambdaAway } = expectedGoalsRemaining(m);
  let pHome = 0, pDraw = 0, pAway = 0;
  for (let h = 0; h <= 15; h++) {
    for (let a = 0; a <= 15; a++) {
      const p = poisson(h, lambdaHome) * poisson(a, lambdaAway);
      const fh = m.scoreHome + h;
      const fa = m.scoreAway + a;
      if (fh > fa) pHome += p;
      else if (fh === fa) pDraw += p;
      else pAway += p;
    }
  }
  const total = pHome + pDraw + pAway || 1;
  pHome /= total; pDraw /= total; pAway /= total;

  if (m.sport === 'hockey') {
    const pHomeOT = pHome + pDraw * 0.52;
    const pAwayOT = pAway + pDraw * 0.48;
    const oH = toOdds(pHomeOT, 0.05);
    const oA = toOdds(pAwayOT, 0.05);
    return {
      home: isOddValid(oH) ? oH : null,
      away: isOddValid(oA) ? oA : null,
      draw: null,
    };
  }

  const oH = toOdds(pHome, 0.05);
  const oD = toOdds(pDraw, 0.05);
  const oA = toOdds(pAway, 0.05);
  return {
    home: isOddValid(oH) ? oH : null,
    draw: isOddValid(oD) ? oD : null,
    away: isOddValid(oA) ? oA : null,
  };
}

function computeExtraMarkets(m) {
  if (m.status === 'finished') return {};

  if (m.sport === 'ufc') {
    const diff = m.homeRating - m.awayRating;
    let pHome = 1 / (1 + Math.pow(10, -diff / 400));
    const progress = m.minute / m.maxMinute;
    pHome = 0.5 + (pHome - 0.5) * (1 - progress * 0.85);
    pHome = Math.max(0.03, Math.min(0.97, pHome));
    const pAway = 1 - pHome;

    const round = m.round;
    let pFinish;
    if (round === 1) pFinish = 0.55;
    else if (round === 2) pFinish = 0.45;
    else if (round === 3) pFinish = 0.32;
    else if (round === 4) pFinish = 0.22;
    else pFinish = 0.12;
    if (m.minute >= m.maxMinute - 3) pFinish *= 0.5;

    const pKO = pFinish * 0.62;
    const pSub = pFinish * 0.32;
    const pDec = 1 - pFinish;

    const raw = {};
    raw['Метод · KO/TKO'] = toOdds(pKO, 0.06);
    raw['Метод · Сабмишн'] = toOdds(pSub, 0.06);
    raw['Метод · Решение'] = toOdds(pDec, 0.06);

    const pOver15 = round >= 2 ? 1 : 1 - pFinish * 0.85;
    const pOver25 = round >= 3 ? 1 : 1 - pFinish * 0.95;
    raw['Тотал Б 1.5 раундов'] = toOdds(pOver15, 0.06);
    raw['Тотал М 1.5 раундов'] = toOdds(1 - pOver15, 0.06);
    raw['Тотал Б 2.5 раундов'] = toOdds(pOver25, 0.06);
    raw['Тотал М 2.5 раундов'] = toOdds(1 - pOver25, 0.06);

    raw['Бой досрочно'] = toOdds(pFinish, 0.06);
    raw['Пройти всю дистанцию'] = toOdds(pDec, 0.06);

    if (round <= 1) raw['Финиш в R1'] = toOdds(pFinish * 0.40, 0.08);
    if (round <= 2) raw['Финиш в R2'] = toOdds(pFinish * 0.28, 0.08);
    if (round <= 3) raw['Финиш в R3'] = toOdds(pFinish * 0.20, 0.08);
    if (round <= 4) raw['Финиш в R4+'] = toOdds(pFinish * 0.12, 0.08);

    raw[`${m.home} KO/TKO`] = toOdds(pHome * pKO, 0.08);
    raw[`${m.home} Сабмишн`] = toOdds(pHome * pSub, 0.08);
    raw[`${m.home} Решение`] = toOdds(pHome * pDec, 0.08);
    raw[`${m.away} KO/TKO`] = toOdds(pAway * pKO, 0.08);
    raw[`${m.away} Сабмишн`] = toOdds(pAway * pSub, 0.08);
    raw[`${m.away} Решение`] = toOdds(pAway * pDec, 0.08);

    if (round <= 1) {
      raw[`${m.home} в R1`] = toOdds(pHome * pFinish * 0.20, 0.10);
      raw[`${m.away} в R1`] = toOdds(pAway * pFinish * 0.20, 0.10);
    }

    return raw;
  }

  const isFootball = m.sport === 'football';
  const { lambdaHome, lambdaAway } = expectedGoalsRemaining(m);
  const currentTotal = m.scoreHome + m.scoreAway;

  const MAX_GOALS = 15;
  const homeDist = [], awayDist = [];
  for (let g = 0; g <= MAX_GOALS; g++) {
    homeDist.push(poisson(g, lambdaHome));
    awayDist.push(poisson(g, lambdaAway));
  }

  const scoreMatrix = {};
  let sumAll = 0;
  for (let h = 0; h <= MAX_GOALS; h++) {
    for (let a = 0; a <= MAX_GOALS; a++) {
      const p = homeDist[h] * awayDist[a];
      const fh = m.scoreHome + h;
      const fa = m.scoreAway + a;
      const key = `${fh}:${fa}`;
      scoreMatrix[key] = (scoreMatrix[key] || 0) + p;
      sumAll += p;
    }
  }
  for (const k in scoreMatrix) scoreMatrix[k] /= sumAll;

  let pHome = 0, pDraw = 0, pAway = 0, pEven = 0, pBtts = 0;
  for (const [score, p] of Object.entries(scoreMatrix)) {
    const [h, a] = score.split(':').map(Number);
    if (h > a) pHome += p;
    else if (h === a) pDraw += p;
    else pAway += p;
    if ((h + a) % 2 === 0) pEven += p;
    if (h >= 1 && a >= 1) pBtts += p;
  }

  function pOver(line) {
    let p = 0;
    for (const [score, prob] of Object.entries(scoreMatrix)) {
      const [h, a] = score.split(':').map(Number);
      if (h + a > line) p += prob;
    }
    return p;
  }

  function pHandicap(line) {
    let p = 0;
    for (const [score, prob] of Object.entries(scoreMatrix)) {
      const [h, a] = score.split(':').map(Number);
      if (h - a > line) p += prob;
    }
    return p;
  }

  function pTeamOver(side, line) {
    let p = 0;
    for (const [score, prob] of Object.entries(scoreMatrix)) {
      const [h, a] = score.split(':').map(Number);
      const goals = side === 'home' ? h : a;
      if (goals > line) p += prob;
    }
    return p;
  }

  const lines = isFootball
    ? [0.5, 1.5, 2.5, 3.5, 4.5, 5.5]
    : [3.5, 4.5, 5.5, 6.5, 7.5, 8.5];

  const raw = {};

  if (isFootball) {
    raw['1X'] = toOdds(pHome + pDraw, 0.04);
    raw['12'] = toOdds(pHome + pAway, 0.04);
    raw['X2'] = toOdds(pDraw + pAway, 0.04);
  }

  lines.forEach(line => {
    const pO = pOver(line);
    const pU = 1 - pO;
    if (pO > 0.005 && pO < 0.995) {
      raw[`ТБ ${line}`] = toOdds(pO, 0.05);
      raw[`ТМ ${line}`] = toOdds(pU, 0.05);
    }
  });

  if (isFootball) {
    const pF1m15 = pHandicap(-1.5);
    const pF2p15 = 1 - pF1m15;
    const pF2m15 = 1 - pHandicap(1.5);
    const pF1p15 = 1 - pF2m15;
    if (pF1m15 > 0.005 && pF1m15 < 0.995) raw['Ф1 −1.5'] = toOdds(pF1m15, 0.05);
    if (pF1p15 > 0.005 && pF1p15 < 0.995) raw['Ф1 +1.5'] = toOdds(pF1p15, 0.05);
    if (pF2m15 > 0.005 && pF2m15 < 0.995) raw['Ф2 −1.5'] = toOdds(pF2m15, 0.05);
    if (pF2p15 > 0.005 && pF2p15 < 0.995) raw['Ф2 +1.5'] = toOdds(pF2p15, 0.05);
  } else {
    const pF1m15 = pHandicap(-1.5);
    const pF2m15 = 1 - pHandicap(1.5);
    raw['Ф1 −1.5'] = toOdds(pF1m15, 0.05);
    raw['Ф1 +1.5'] = toOdds(1 - pF1m15, 0.05);
    raw['Ф2 −1.5'] = toOdds(pF2m15, 0.05);
    raw['Ф2 +1.5'] = toOdds(1 - pF2m15, 0.05);
  }

  if (pBtts > 0.005 && pBtts < 0.995) {
    raw['Обе · Да'] = toOdds(pBtts, 0.05);
    raw['Обе · Нет'] = toOdds(1 - pBtts, 0.05);
  }

  if (pEven > 0.005 && pEven < 0.995) {
    raw['Чёт'] = toOdds(pEven, 0.05);
    raw['Нечет'] = toOdds(1 - pEven, 0.05);
  }

  const teamLine = isFootball ? 0.5 : 1.5;
  const homeOver = pTeamOver('home', teamLine);
  const awayOver = pTeamOver('away', teamLine);
  if (homeOver > 0.005 && homeOver < 0.995) {
    raw[`${m.home} Б ${teamLine}`] = toOdds(homeOver, 0.05);
    raw[`${m.home} М ${teamLine}`] = toOdds(1 - homeOver, 0.05);
  }
  if (awayOver > 0.005 && awayOver < 0.995) {
    raw[`${m.away} Б ${teamLine}`] = toOdds(awayOver, 0.05);
    raw[`${m.away} М ${teamLine}`] = toOdds(1 - awayOver, 0.05);
  }

  if (isFootball && m.minute < 85) {
    for (const [score, p] of Object.entries(scoreMatrix)) {
      const [h, a] = score.split(':').map(Number);
      if (h > 4 || a > 4) continue;
      if (p < 0.003) continue;
      raw[`Счёт ${score}`] = toOdds(p, 0.08);
    }
  }

  return raw;
}

function createMatches(count = 15) {
  const list = [];
  
  // РАСПРЕДЕЛЕНИЕ ПО ВРЕМЕНИ:
  // - 20% live прямо сейчас (minute 5-40) — стартовали раньше
  // - 40% прематч — начнутся через 1-60 минут (разное время)
  // - 40% live с разным прогрессом (0-90)
  
  const totalCount = count;
  const prematchCount = Math.floor(totalCount * 0.4);
  const liveStartedCount = Math.floor(totalCount * 0.2); // УЖЕ идут, стартовали до открытия
  
  // Прематчи с разным временем старта (от 1 до 60 минут)
  const startsTimes = [];
  for (let i = 0; i < prematchCount; i++) {
    // Разные интервалы: 1-3 мин, 3-10 мин, 10-30 мин, 30-60 мин
    let minutes;
    const bucket = Math.floor(i / prematchCount * 4);
    if (bucket === 0) minutes = rand(1, 3);
    else if (bucket === 1) minutes = rand(3, 10);
    else if (bucket === 2) minutes = rand(10, 30);
    else minutes = rand(30, 60);
    startsTimes.push(minutes * 60); // переводим в "тики" (1 тик = 1 сек, но у нас 1 тик = 1 игровая минута)
  }
  
  for (let i = 0; i < prematchCount; i++) {
    // startsIn — в тиках (секундах)
    const startsIn = startsTimes[i];
    list.push(createRandomMatch(true, startsIn));
  }
  
  // Live уже идут
  for (let i = 0; i < liveStartedCount; i++) {
    const m = createRandomMatch(false, 0);
    m.minute = rand(5, 40);
    list.push(m);
  }
  
  // Live только что стартовали
  while (list.length < totalCount) {
    const m = createRandomMatch(false, 0);
    m.minute = rand(0, 5);
    list.push(m);
  }
  
  // Перемешиваем
  for (let i = list.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [list[i], list[j]] = [list[j], list[i]];
  }
  return list;
}

function beep(freq, duration, type = 'sine', volume = 0.08) {
  if (!soundOn) return;
  try {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audio.createOscillator();
    const gain = audio.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume, audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + duration);
    osc.connect(gain); gain.connect(audio.destination);
    osc.start(); osc.stop(audio.currentTime + duration);
  } catch (e) {}
}

      if (m.status === 'prematch') {
        const newStartsIn = m.startsIn - elapsed;
        if (newStartsIn <= 0) return { ...m, status: 'live', minute: 0, startsIn: 0 };
        return { ...m, startsIn: newStartsIn };

      const newMinute = Math.min(m.maxMinute, m.minute + elapsed);
      return { ...m, minute: newMinute, status: newMinute >= m.maxMinute ? 'finished' : 'live' };
    });
    nextId = Math.max(...restored.map(m => m.id), 0) + 1;

function tickMatch(m) {
  if (m.status === 'countdown') {
    // Отсчёт до нового матча
    m.countdownLeft -= 1;
    if (m.countdownLeft <= 0) {
      // Создаём новый матч того же спорта
      const newM = createRandomMatch(false, 0);
      newM.id = m.id; // сохраняем id
      Object.assign(m, newM);
    }
    return;
  }

  if (m.status === 'prematch') {
    m.startsIn -= 1;
    if (m.startsIn <= 0) { m.status = 'live'; m.minute = 0; }
    return;
  }

  if (m.status !== 'live') return;

  if (m.breakLeft > 0) {
    m.breakLeft -= 1;
    if (m.breakLeft === 0) {
      if (m.sport === 'football' && m.period === 'HT') {
        m.period = '2H';
      } else if (m.sport === 'hockey' && m.period === 'BR1') {
        m.period = 'P2';
      } else if (m.sport === 'hockey' && m.period === 'BR2') {
        m.period = 'P3';
      }
    }
    return;
  }

  m.minute += 1;
  m.momentum *= 0.93;
  m.justScoredSide = null;

  if (m.sport === 'ufc') {
    const cycle = 7;
    const tick = m.minute % cycle;
    m.round = Math.min(5, Math.floor(m.minute / cycle) + 1);

    if (tick >= 5 && m.round < 5) {
      m.breakLeft = 1;
      return;
    }

    const homeAdv = (m.homeRating - m.awayRating) / 400;
    const homeWins = Math.random() < (0.5 + homeAdv * 0.3);
    if (homeWins) m.momentum = Math.min(1, m.momentum + 0.25);
    else m.momentum = Math.max(-1, m.momentum - 0.25);

    if (Math.random() < 0.06) {
      const winner = Math.random() < (0.5 + homeAdv) ? 'home' : 'away';
      const method = Math.random() < 0.6 ? 'KO/TKO' : 'Сабмишн';
      if (winner === 'home') { m.scoreHome = 1; m.scoreAway = 0; m.justScoredSide = 'home'; }
      else { m.scoreHome = 0; m.scoreAway = 1; m.justScoredSide = 'away'; }
      m.finalResult = { winner, method, round: m.round };
      m.status = 'finished';
      m.finishedAt = Date.now();
      return;
    }

    if (m.minute >= 33) {
      const winner = m.momentum > 0 ? 'home' : 'away';
      if (winner === 'home') { m.scoreHome = 1; m.scoreAway = 0; }
      else { m.scoreHome = 0; m.scoreAway = 1; }
      m.finalResult = { winner, method: 'Решение', round: 5 };
      m.status = 'finished';
      m.finishedAt = Date.now();
      return;
    }
    return;
  }

  if (m.sport === 'football') {
    if (m.minute === 45 && m.period === '1H') {
      m.period = 'HT';
      m.breakLeft = 3;
      return;
    }
    if (m.minute >= 90) {
      m.status = 'finished';
      m.finishedAt = Date.now();
      return;
    }

    const { lambdaHome, lambdaAway } = expectedGoalsRemaining(m);
    const remaining = Math.max(1, m.maxMinute - m.minute);
    const pHome = lambdaHome / remaining;
    const pAway = lambdaAway / remaining;

    if (Math.random() < pHome) {
      m.scoreHome += 1;
      m.momentum = Math.min(1, m.momentum + 0.35);
      m.justScoredSide = 'home';
      addLiveDrop(m, m.home, `${m.scoreHome}:${m.scoreAway}`);
    } else if (Math.random() < pAway) {
      m.scoreAway += 1;
      m.momentum = Math.max(-1, m.momentum - 0.35);
      m.justScoredSide = 'away';
      addLiveDrop(m, m.away, `${m.scoreHome}:${m.scoreAway}`);
    }
    return;
  }

  if (m.sport === 'hockey') {
    if (m.minute === 20 && m.period === 'P1') {
      m.period = 'BR1';
      m.breakLeft = 3;
      return;
    }
    if (m.minute === 40 && m.period === 'P2') {
      m.period = 'BR2';
      m.breakLeft = 3;
      return;
    }
    if (m.minute >= 60) {
      m.status = 'finished';
      m.finishedAt = Date.now();
      return;
    }

    const { lambdaHome, lambdaAway } = expectedGoalsRemaining(m);
    const remaining = Math.max(1, m.maxMinute - m.minute);
    const pHome = lambdaHome / remaining;
    const pAway = lambdaAway / remaining;

    if (Math.random() < pHome) {
      m.scoreHome += 1;
      m.momentum = Math.min(1, m.momentum + 0.35);
      m.justScoredSide = 'home';
      addLiveDrop(m, m.home, `${m.scoreHome}:${m.scoreAway}`);
    } else if (Math.random() < pAway) {
      m.scoreAway += 1;
      m.momentum = Math.max(-1, m.momentum - 0.35);
      m.justScoredSide = 'away';
      addLiveDrop(m, m.away, `${m.scoreHome}:${m.scoreAway}`);
    }
    return;
  }
}

function addLiveDrop(m, scorer, score) {
  liveDrops.unshift({
    match: `${m.home} — ${m.away}`,
    event: `${sportIcon(m.sport)} ${scorer} · ${score}`,
    id: Date.now() + Math.random(),
  });
  if (liveDrops.length > 15) liveDrops.pop();
}

function renderPeriodProgress(m) {
  if (m.status !== 'live' && m.status !== 'finished') return '';

  if (m.sport === 'football') {
    const h1 = Math.min(1, m.minute / 45);
    const h2 = Math.max(0, Math.min(1, (m.minute - 45) / 45));
    return `<div class="period-progress">
      <div class="period-seg ${h1 >= 1 ? 'done' : 'active'}" style="--p: ${h1 * 100}%"></div>
      <div class="period-seg ${h2 >= 1 ? 'done' : 'active'}" style="--p: ${h2 * 100}%"></div>
    </div>`;
  }
  if (m.sport === 'hockey') {
    const p1 = Math.min(1, m.minute / 20);
    const p2 = Math.max(0, Math.min(1, (m.minute - 20) / 20));
    const p3 = Math.max(0, Math.min(1, (m.minute - 40) / 20));
    return `<div class="period-progress">
      <div class="period-seg ${p1 >= 1 ? 'done' : 'active'}" style="--p: ${p1 * 100}%"></div>
      <div class="period-seg ${p2 >= 1 ? 'done' : 'active'}" style="--p: ${p2 * 100}%"></div>
      <div class="period-seg ${p3 >= 1 ? 'done' : 'active'}" style="--p: ${p3 * 100}%"></div>
    </div>`;
  }
  if (m.sport === 'ufc') {
    const segs = [];
    for (let i = 1; i <= 5; i++) {
      const done = m.round > i || (m.status === 'finished' && m.round >= i);
      const active = m.round === i && m.status === 'live';
      let p = 0;
      if (active) p = ((m.minute % 7) / 5) * 100;
      if (done) p = 100;
      segs.push(`<div class="period-seg ${done ? 'done' : active ? 'active' : ''}" style="--p: ${Math.min(100, p)}%"></div>`);
    }
    return `<div class="period-progress">${segs.join('')}</div>`;
  }
  return '';
}

function renderMatches() {
  let filtered = [...matches];

  if (currentFilter !== 'all') filtered = filtered.filter(m => m.sport === currentFilter);
  if (currentLeagueFilter !== 'all') filtered = filtered.filter(m => m.league === currentLeagueFilter);
  if (liveOnly) filtered = filtered.filter(m => m.status === 'live');
  if (favOnly) filtered = filtered.filter(m => favorites.has(m.id));
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    filtered = filtered.filter(m =>
      m.home.toLowerCase().includes(q) ||
      m.away.toLowerCase().includes(q) ||
      m.league.toLowerCase().includes(q)
    );
  }

  filtered.sort((a, b) => {
    const order = { live: 0, prematch: 1, finished: 2, countdown: 3 };
    if (currentSort === 'time') {
      if (order[a.status] !== order[b.status]) return order[a.status] - order[b.status];
      return a.minute - b.minute;
    }
    if (currentSort === 'odd-high' || currentSort === 'odd-low') {
      const oa = computeOdds(a).home || 99;
      const ob = computeOdds(b).home || 99;
      return currentSort === 'odd-high' ? ob - oa : oa - ob;
    }
    return 0;
  });

  const el = $('matches');
  if (!filtered.length) {
    el.innerHTML = `<div class="empty"><div class="icon">🎯</div><div class="text">Матчей нет</div></div>`;
    return;
  }

  el.innerHTML = filtered.map(m => {
    const odds = computeOdds(m);
    const isFinished = m.status === 'finished';
    const isPrematch = m.status === 'prematch';
    const isCountdown = m.status === 'countdown';
    const extras = (!isFinished && !isCountdown) ? computeExtraMarkets(m) : {};
    const extrasKeys = Object.keys(extras);
    const isOpen = openExtras.has(m.id);
    const isFav = favorites.has(m.id);

    const extrasHtml = extrasKeys.length ? `
      <div class="extras">
        <button class="extras-toggle ${isOpen ? 'open' : ''}" onclick="toggleExtras(${m.id})">
          ${isOpen ? '▲' : '▼'} Ещё ${extrasKeys.length} рынков
        </button>
        <div class="extras-grid ${isOpen ? 'open' : ''}">
          ${extrasKeys.map(label => {
            const odd = extras[label];
            const valid = isOddValid(odd);
            return `<button class="odds-mini ${valid ? '' : 'disabled'}"
              data-mid="${m.id}"
              data-mk="${encodeURIComponent(label)}"
              data-odd="${valid ? odd : ''}"
              ${valid ? '' : 'disabled'}>
              <span class="odds-mini-label">${label}</span>
              <span class="odds-mini-value">${valid ? odd.toFixed(2) : '—'}</span>
            </button>`;
          }).join('')}
        </div>
      </div>
    ` : '';

    const homeAvatar = `<div class="team-avatar ${m.justScoredSide === 'home' ? 'scored' : ''}" style="background:${teamColor(m.home)}">${teamInitials(m.home)}</div>`;
    const awayAvatar = `<div class="team-avatar ${m.justScoredSide === 'away' ? 'scored' : ''}" style="background:${teamColor(m.away)}">${teamInitials(m.away)}</div>`;

    const statsHtml = (m.status === 'live' || isFinished) && m.sport !== 'ufc' ? `
      <div class="stats-bar">
        <span class="stat-item">xG: <b>${((m.homeAttack * m.minute / m.maxMinute) || 0).toFixed(2)} — ${((m.awayAttack * m.minute / m.maxMinute) || 0).toFixed(2)}</b></span>
        <span class="stat-item">Влад: <b>${Math.round(50 + m.momentum * 30)}% — ${Math.round(50 - m.momentum * 30)}%</b></span>
        <span class="stat-item">Удары: <b>${Math.max(0, Math.round(m.minute * 0.15 + m.scoreHome * 2))} — ${Math.max(0, Math.round(m.minute * 0.12 + m.scoreAway * 2))}</b></span>
      </div>
    ` : '';

    let statusBadge;
    if (isFinished) statusBadge = '<span class="badge finished">Завершён</span>';
    else if (isCountdown) statusBadge = '<span class="badge countdown">⏱ СЛЕДУЮЩИЙ</span>';
    else if (isPrematch) statusBadge = '<span class="badge prematch">Скоро</span>';
    else if (m.breakLeft > 0) statusBadge = '<span class="badge break">⏸ ПЕРЕРЫВ</span>';
    else statusBadge = '<span class="badge live">LIVE</span>';

    let timeInfo = '';
    if (isCountdown) {
      timeInfo = `<span class="team-name" style="color:var(--accent2);font-size:12px;font-weight:800">⏱ Новый матч через ${formatTime(m.countdownLeft)}</span>`;
    } else if (isPrematch) {
      timeInfo = `<span class="team-name" style="color:var(--muted);font-size:11px">⏰ через ${formatTime(m.startsIn)}</span>`;
    } else if (m.status === 'live') {
      let label = '';
      if (m.sport === 'football') label = m.period === '1H' ? '1-й тайм' : m.period === 'HT' ? 'перерыв' : '2-й тайм';
      else if (m.sport === 'hockey') label = m.period === 'P1' ? '1-й период' : m.period === 'P2' ? '2-й период' : m.period === 'P3' ? '3-й период' : 'перерыв';
      else if (m.sport === 'ufc') label = `R${m.round}/5`;
      timeInfo = `<span class="team-name" style="color:var(--muted);font-size:11px">${label} · ${m.minute}'</span>`;
    }

    let ufcFinalHtml = '';
    if (m.sport === 'ufc' && isFinished && m.finalResult) {
      const winnerName = m.finalResult.winner === 'home' ? m.home : m.away;
      const methodIcon = m.finalResult.method === 'KO/TKO' ? '💥'
        : m.finalResult.method === 'Сабмишн' ? '🤼' : '📋';
      ufcFinalHtml = `
        <div class="ufc-final">
          <span class="ufc-final-icon">${methodIcon}</span>
          <div class="ufc-final-text">
            Победа: <b>${winnerName}</b><br>
            <span class="ufc-final-sub">${m.finalResult.method} · R${m.finalResult.round} · ${m.scoreHome}:${m.scoreAway}</span>
          </div>
        </div>
      `;
    }

    let scoreDisplay;
    if (isCountdown) {
      scoreDisplay = `<span class="team-score" style="color:var(--muted)">—:—</span>`;
    } else if (m.sport === 'ufc' && !isFinished) {
      scoreDisplay = `<span class="team-score" style="color:var(--muted)">—</span>`;
    } else {
      scoreDisplay = `<span class="team-score ${m.justScoredSide ? 'scored' : ''}">${m.scoreHome}:${m.scoreAway}</span>`;
    }

    return `
      <div class="match ${isFinished ? 'finished' : ''}">
        <div class="match-info">
          <div class="match-top">
            <span class="sport-icon">${sportIcon(m.sport)}</span>
            <span class="match-league">${m.league}</span>
            ${statusBadge}
            <button class="star-btn ${isFav ? 'active' : ''}" onclick="event.stopPropagation();toggleFav(${m.id})" style="margin-left:auto">${isFav ? '★' : '☆'}</button>
          </div>
          <div class="teams-row">
            <div class="team">${homeAvatar}<span class="team-name">${m.home}</span></div>
            ${scoreDisplay}
            <div class="team">${awayAvatar}<span class="team-name">${m.away}</span></div>
            ${timeInfo}
          </div>
          ${renderPeriodProgress(m)}
          ${ufcFinalHtml}
          ${statsHtml}
        </div>
        <div class="odds">
          ${renderOddsBtn(m, 'home', '1', odds.home, isFinished || isPrematch || isCountdown)}
          ${m.sport !== 'hockey' && m.sport !== 'ufc' ? renderOddsBtn(m, 'draw', 'X', odds.draw, isFinished || isPrematch || isCountdown) : ''}
          ${renderOddsBtn(m, 'away', '2', odds.away, isFinished || isPrematch || isCountdown)}
        </div>
        ${extrasHtml}
      </div>
    `;
  }).join('');
}

// ============================================================
// КЭШАУТ (для одиночных и экспрессов)
// ============================================================
function computeCashoutValue(b, m) {
  if (!m || m.status !== 'live' || b.status !== 'pending') return 0;

  // Экспресс
  if (b.type === 'express') {
    let currentValue = 1;
    for (const sel of b.selections) {
      const sm = matches.find(x => Number(x.id) === Number(sel.matchId));
      if (!sm) return 0;
      if (sm.status === 'finished') {
        // Событие уже рассчитано
        if (sel.status === 'lost') return 0;
        if (sel.status === 'won') continue;
        continue;
      }
      if (sm.status === 'live') {
        const odds = computeOdds(sm);
        const cur = odds[sel.pick];
        if (!cur || !isOddValid(cur)) return 0;
        currentValue *= 1 / cur;
      } else {
        return 0; // прематч — рано
      }
    }
    const fairValue = b.potential * currentValue;
    const payout = Math.max(b.stake * 0.1, Math.round(fairValue * 0.9 * 100) / 100);
    return Math.min(payout, b.potential * 0.98);
  }

  // Билдер
  if (b.type === 'builder') {
    const sm = matches.find(x => Number(x.id) === Number(b.matchId));
    if (!sm || sm.status !== 'live') return 0;
    let currentValue = 1;
    for (const sel of b.selections) {
      const cur = null; // для билдера — упрощённо
    }
    return Math.round(b.stake * 0.5 * 100) / 100;
  }

  // Одиночная
  const currentOdds = computeOdds(m);
  if (!b.pick || !currentOdds[b.pick]) {
    return Math.round(b.stake * 0.5 * 100) / 100;
  }
  const currentOdd = currentOdds[b.pick];
  const fairValue = b.potential / currentOdd;
  const payout = Math.max(b.stake * 0.1, Math.round(fairValue * 0.92 * 100) / 100);
  return Math.min(payout, b.potential);
}

function doCashout(betId) {
  const b = wallet.bets.find(x => x.id === betId);
  if (!b || b.status !== 'pending') return;

  let co = 0;
  if (b.type === 'express' || b.type === 'builder') {
    // Ищем любой live-матч из selections
    for (const sel of b.selections) {
      const sm = matches.find(x => Number(x.id) === Number(sel.matchId));
      if (sm && sm.status === 'live') {
        co = computeCashoutValue(b, sm);
        break;
      }
    }
  } else {
    const m = matches.find(x => x.id === b.matchId);
    if (m) co = computeCashoutValue(b, m);
  }

  if (co <= 0) return;

  b.status = 'won';
  b.payout = co;
  b.cashout = true;
  wallet.balance += co;
  wallet.totalWon += co;
  saveWallet();
  flashBalance('win');
  renderBalance();
  renderHistory();
  renderStats();
  renderAchievements();
  soundBet();
}

function openMatchFromHistory(matchId) {

    return;
  }
  alert(`${m.home} ${m.scoreHome}:${m.scoreAway} ${m.away}\n${m.minute}' · ${m.status === 'live' ? 'live' : ''}`);
}

    <div class="stat"><div class="stat-label">Профит</div><div class="stat-value ${profit >= 0 ? 'green' : 'red'}">${profit >= 0 ? '+' : ''}${formatMoney(profit)} ₽</div></div>
    <div class="stat"><div class="stat-label">Винрейт</div><div class="stat-value">${winrate}%</div></div>

function drawProfitChart() {
  const canvas = $('profitChart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);

  const w = rect.width, h = rect.height;
  const history = wallet.profitHistory;
  ctx.clearRect(0, 0, w, h);

  if (!history || history.length < 2) {
    ctx.fillStyle = '#888';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Играй — график появится', w / 2, h / 2);
    return;
  }

  const min = Math.min(...history.map(p => p.v));
  const max = Math.max(...history.map(p => p.v));
  const range = max - min || 1;

  ctx.strokeStyle = 'rgba(255,255,255,.05)';
  for (let i = 0; i <= 4; i++) {
    const y = (h / 4) * i;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  }

  const step = w / (history.length - 1);
  const gradient = ctx.createLinearGradient(0, 0, 0, h);
  gradient.addColorStop(0, 'rgba(123,92,255,.45)');
  gradient.addColorStop(1, 'rgba(123,92,255,0)');

  ctx.beginPath();
  history.forEach((p, i) => {
    const x = i * step;
    const y = h - ((p.v - min) / range) * h * 0.9 - h * 0.05;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.strokeStyle = '#7b5cff';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.lineTo(w, h);
  ctx.lineTo(0, h);
  ctx.closePath();
  ctx.fillStyle = gradient;
  ctx.fill();
}

function openBetModal(matchId, pickKey, odd) {
  if (!isOddValid(odd)) return;
  const m = matches.find(x => x.id === matchId);
  if (!m || m.status === 'finished' || m.status === 'countdown') return;

  activeBet = { matchId, pick: pickKey, odd, isBuilder: false };

  const pickLabel = pickKey === 'home' ? m.home
    : pickKey === 'away' ? m.away
    : pickKey === 'draw' ? 'Ничья' : pickKey;

  $('betModalTitle').textContent = `${m.home} — ${m.away}`;
  $('betModalSub').textContent = `${pickLabel} · ${m.scoreHome}:${m.scoreAway} · ${m.minute}'`;
  $('betModalOdd').textContent = odd.toFixed(2);
  $('betModalStake').value = '';
  $('betModalPotential').textContent = '—';
  $('betModalCoupon').style.display = 'block';
  // Показать билдер только для футбола/хоккея
  if (m.sport === 'football' || m.sport === 'hockey') {
    $('betModalBuilder').style.display = 'block';
  } else {
    $('betModalBuilder').style.display = 'none';
  }
  $('betModal').classList.add('active');
  updatePotential();
}

function closeBetModal() {
  $('betModal').classList.remove('active');
  activeBet = null;
}

function updatePotential() {
  if (!activeBet) return;
  const stake = parseFloat($('betModalStake').value) || 0;
  const potential = stake * activeBet.odd;
  $('betModalPotential').textContent = potential > 0 ? `${formatMoney(potential)} ₽` : '—';
}

function placeBet() {
  if (!activeBet) return;
  const stake = parseFloat($('betModalStake').value);
  if (!stake || stake < 10) return;
  if (stake > wallet.balance) return;

  if (activeBet.isExpress) {
    const selections = activeBet.selections.map(s => ({
      matchId: s.matchId, pick: s.pick, odd: s.odd,
      label: s.label, match: s.match, status: 'pending',
    }));
    wallet.balance -= stake;
    wallet.totalBet += stake;
    wallet.bets.unshift({
      id: Date.now(), type: 'express',
      match: `Экспресс · ${selections.length}`,
      selections,
      odd: activeBet.odd, stake,
      potential: Math.round(stake * activeBet.odd * 100) / 100,
      status: 'pending',
      createdAt: new Date().toISOString(),
    });
    expressCoupon = [];
    saveCoupon();
    renderCoupon();
  } else if (activeBet.isBuilder) {
    // Билдер
    const m = matches.find(x => x.id === activeBet.matchId);
    if (!m) return;
    const selections = activeBet.selections.map(s => ({
      matchId: activeBet.matchId, pick: s.pick, odd: s.odd,
      label: s.label, match: `${m.home} — ${m.away}`, status: 'pending',
    }));
    wallet.balance -= stake;
    wallet.totalBet += stake;
    wallet.bets.unshift({
      id: Date.now(), type: 'builder',
      matchId: m.id,
      match: `${m.home} — ${m.away} (билдер ${selections.length})`,
      selections,
      odd: activeBet.odd, stake,
      potential: Math.round(stake * activeBet.odd * 100) / 100,
      status: 'pending',
      createdAt: new Date().toISOString(),
    });
    delete builderBets[activeBet.matchId];
  } else {
    const m = matches.find(x => x.id === activeBet.matchId);
    if (!m || m.status === 'finished') return;
    wallet.balance -= stake;
    wallet.totalBet += stake;
    wallet.bets.unshift({
      id: Date.now(), type: 'single',
      matchId: m.id,
      match: `${m.home} — ${m.away}`,
      sport: m.sport,
      pick: activeBet.pick,
      odd: activeBet.odd,
      stake,
      potential: Math.round(stake * activeBet.odd * 100) / 100,
      status: 'pending',
      minute: m.minute,
      score: `${m.scoreHome}:${m.scoreAway}`,
      createdAt: new Date().toISOString(),
    });
  }

  saveWallet();
  flashBalance('win');
  renderBalance();
  renderHistory();
  renderStats();
  renderAchievements();
  soundBet();
  vibrate(20);
  closeBetModal();
}

// BILDER (Bet Builder)
// ============================================================
function addToBuilder() {
  if (!activeBet) return;
  const { matchId, pick, odd } = activeBet;

  if (!builderBets[matchId]) builderBets[matchId] = [];

  // Проверка на конфликт (ТБ и ТМ на одну линию)
  for (const b of builderBets[matchId]) {
    if (b.pick === pick) return; // уже есть
    // ТБ/ТМ конфликт
    const t1 = b.pick.match(/^(ТБ|ТМ)\s+([\d.]+)$/);
    const t2 = pick.match(/^(ТБ|ТМ)\s+([\d.]+)$/);
    if (t1 && t2 && t1[2] === t2[2] && t1[1] !== t2[1]) {
      alert('Конфликт: ТБ и ТМ на одну линию нельзя');
      return;
    }
  }

  builderBets[matchId].push({ pick, odd, label: pick === 'home' ? '1' : pick === 'away' ? '2' : pick === 'draw' ? 'X' : pick });

  const totalOdd = builderBets[matchId].reduce((a, c) => a * c.odd, 1);

  closeBetModal();
  // Открываем модалку билдера
  const m = matches.find(x => x.id === matchId);
  activeBet = {
    matchId,
    isBuilder: true,
    odd: totalOdd,
    selections: [...builderBets[matchId]],
  };
  $('betModalTitle').textContent = `🧩 Билдер · ${m.home} — ${m.away}`;
  $('betModalSub').textContent = builderBets[matchId].map(b => `${b.label} @ ${b.odd.toFixed(2)}`).join(' + ');
  $('betModalOdd').textContent = totalOdd.toFixed(2);
  $('betModalStake').value = '';
  $('betModalPotential').textContent = '—';
  $('betModalCoupon').style.display = 'none';
  $('betModalBuilder').style.display = 'none';
  $('betModal').classList.add('active');
  updatePotential();
}

// ============================================================
// РАСЧЁТ
// ============================================================
function checkSelection(m, pick) {
  if (!m || m.status !== 'finished') return 'pending';

  const total = m.scoreHome + m.scoreAway;

  if (m.sport === 'ufc') {
    if (!m.finalResult) {
      const winner = m.scoreHome > m.scoreAway ? 'home' : m.scoreAway > m.scoreHome ? 'away' : 'home';
      m.finalResult = { winner, method: 'Решение', round: 5 };
    }
    const fr = m.finalResult;
    const isHomeWin = fr.winner === 'home';
    const isAwayWin = fr.winner === 'away';
    const method = fr.method;
    const finalRound = fr.round;
    const wasFinish = method !== 'Решение';

    if (pick === 'home') return isHomeWin ? 'won' : 'lost';
    if (pick === 'away') return isAwayWin ? 'won' : 'lost';
    if (pick === 'Метод · KO/TKO') return method === 'KO/TKO' ? 'won' : 'lost';
    if (pick === 'Метод · Сабмишн') return method === 'Сабмишн' ? 'won' : 'lost';
    if (pick === 'Метод · Решение') return method === 'Решение' ? 'won' : 'lost';
    if (pick === 'Бой досрочно') return wasFinish ? 'won' : 'lost';
    if (pick === 'Пройти всю дистанцию') return !wasFinish ? 'won' : 'lost';

    const ufcR = pick.match(/^Тотал (Б|М) (\d+)\.5 раундов$/);
    if (ufcR) {
      const line = parseInt(ufcR[2]);
      if (ufcR[1] === 'Б') return finalRound > line ? 'won' : 'lost';
      return finalRound < line ? 'won' : 'lost';
    }
    const finishR = pick.match(/^Финиш в R(\d+)\+?$/);
    if (finishR) {
      const target = parseInt(finishR[1]);
      if (pick.includes('+')) return (wasFinish && finalRound >= target) ? 'won' : 'lost';
      return (wasFinish && finalRound === target) ? 'won' : 'lost';
    }
    if (pick === `${m.home} KO/TKO`) return (isHomeWin && method === 'KO/TKO') ? 'won' : 'lost';
    if (pick === `${m.home} Сабмишн`) return (isHomeWin && method === 'Сабмишн') ? 'won' : 'lost';
    if (pick === `${m.home} Решение`) return (isHomeWin && method === 'Решение') ? 'won' : 'lost';
    if (pick === `${m.away} KO/TKO`) return (isAwayWin && method === 'KO/TKO') ? 'won' : 'lost';
    if (pick === `${m.away} Сабмишн`) return (isAwayWin && method === 'Сабмишн') ? 'won' : 'lost';
    if (pick === `${m.away} Решение`) return (isAwayWin && method === 'Решение') ? 'won' : 'lost';
    if (pick === `${m.home} в R1`) return (isHomeWin && finalRound === 1 && wasFinish) ? 'won' : 'lost';
    if (pick === `${m.away} в R1`) return (isAwayWin && finalRound === 1 && wasFinish) ? 'won' : 'lost';
    return 'lost';
  }

  if (pick === 'home') return m.scoreHome > m.scoreAway ? 'won' : 'lost';
  if (pick === 'away') return m.scoreAway > m.scoreHome ? 'won' : 'lost';
  if (pick === 'draw') return m.scoreHome === m.scoreAway ? 'won' : 'lost';

  if (pick === '1X') return m.scoreHome >= m.scoreAway ? 'won' : 'lost';
  if (pick === '12') return m.scoreHome !== m.scoreAway ? 'won' : 'lost';
  if (pick === 'X2') return m.scoreHome <= m.scoreAway ? 'won' : 'lost';

  const tO = pick.match(/^ТБ\s*([\d.]+)$/);
  const tU = pick.match(/^ТМ\s*([\d.]+)$/);
  if (tO) return total > parseFloat(tO[1]) ? 'won' : 'lost';
  if (tU) return total < parseFloat(tU[1]) ? 'won' : 'lost';

  const f1 = pick.match(/^Ф1\s*([−\-+]?[\d.]+)$/);
  const f2 = pick.match(/^Ф2\s*([−\-+]?[\d.]+)$/);
  if (f1) return (m.scoreHome - m.scoreAway) > parseFloat(f1[1].replace('−', '-')) ? 'won' : 'lost';
  if (f2) return (m.scoreAway - m.scoreHome) > parseFloat(f2[1].replace('−', '-')) ? 'won' : 'lost';

  if (pick === 'Обе · Да') return (m.scoreHome >= 1 && m.scoreAway >= 1) ? 'won' : 'lost';
  if (pick === 'Обе · Нет') return !(m.scoreHome >= 1 && m.scoreAway >= 1) ? 'won' : 'lost';
  if (pick === 'Чёт') return total % 2 === 0 ? 'won' : 'lost';
  if (pick === 'Нечет') return total % 2 !== 0 ? 'won' : 'lost';

  const homeTeam = pick.match(new RegExp(`^${m.home.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\s+(Б|М)\\s+([\\d.]+)$`));
  const awayTeam = pick.match(new RegExp(`^${m.away.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\s+(Б|М)\\s+([\\d.]+)$`));
  if (homeTeam) {
    const line = parseFloat(homeTeam[2]);
    return homeTeam[1] === 'Б' ? (m.scoreHome > line ? 'won' : 'lost') : (m.scoreHome < line ? 'won' : 'lost');
  }
  if (awayTeam) {
    const line = parseFloat(awayTeam[2]);
    return awayTeam[1] === 'Б' ? (m.scoreAway > line ? 'won' : 'lost') : (m.scoreAway < line ? 'won' : 'lost');
  }

  const cs = pick.match(/^Счёт\s+(\d+):(\d+)$/);
  if (cs) return (m.scoreHome === +cs[1] && m.scoreAway === +cs[2]) ? 'won' : 'lost';

  return 'lost';
}

function settleBets() {
  let changed = false;

  wallet.bets.forEach(b => {
    if (b.status !== 'pending') return;

    if (b.type === 'express' || b.type === 'builder') {
      let anyLost = false;
      let allWon = true;
      let allDone = true;

      for (const sel of b.selections) {
        if (sel.status === 'lost') { anyLost = true; continue; }
        if (sel.status === 'won') continue;
        const m = matches.find(x => Number(x.id) === Number(sel.matchId));
        if (!m || m.status !== 'finished') { allDone = false; allWon = false; continue; }
        const r = checkSelection(m, sel.pick);
        sel.status = r;
        if (r === 'lost') { anyLost = true; allWon = false; }
      }

      if (anyLost) {
        b.status = 'lost';
        soundLose();
        flashBalance('lose');
        changed = true;
        wallet.profitHistory.push({ t: Date.now(), v: wallet.totalWon - wallet.totalBet });
        return;
      }

      if (allDone && allWon && b.selections.every(s => s.status === 'won')) {
        b.status = 'won';
        b.payout = Math.round(b.stake * b.odd * 100) / 100;
        wallet.balance += b.payout;
        wallet.totalWon += b.payout;
        soundWin();
        vibrate(50);
        flashBalance('win');
        changed = true;
        wallet.profitHistory.push({ t: Date.now(), v: wallet.totalWon - wallet.totalBet });
        if (wallet.profitHistory.length > 100) wallet.profitHistory.shift();
      }
      return;
    }

    const m = matches.find(x => Number(x.id) === Number(b.matchId));
    if (!m || m.status !== 'finished') return;

    const r = checkSelection(m, b.pick);
    if (r === 'won') {
      b.status = 'won';
      b.payout = Math.round(b.stake * b.odd * 100) / 100;
      wallet.balance += b.payout;
      wallet.totalWon += b.payout;
      soundWin();
      vibrate(50);
      flashBalance('win');
    } else {
      b.status = 'lost';
      soundLose();
      flashBalance('lose');
    }
    changed = true;
    wallet.profitHistory.push({ t: Date.now(), v: wallet.totalWon - wallet.totalBet });
    if (wallet.profitHistory.length > 100) wallet.profitHistory.shift();
  });

  if (changed) {
    saveWallet();
    renderBalance();
    renderHistory();
    renderStats();
    renderAchievements();
  }
}

function exportCSV() {
  const rows = [['Дата', 'Матч', 'Тип', 'Исход', 'Кэф', 'Ставка', 'Потенциал', 'Статус', 'Выплата']];
  wallet.bets.forEach(b => {
    rows.push([
      new Date(b.createdAt).toLocaleString('ru-RU'),
      b.match,
      b.type || 'single',
      b.pick || '',
      b.odd,
      b.stake,
      b.potential,
      b.status,
      b.payout || 0,
    ]);
  });
  const csv = rows.map(r => r.map(v => `"${v}"`).join(',')).join('\n');
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `openbet_history_${Date.now()}.csv`;
  link.click();
}

// ============================================================
// ГЛАВНЫЙ ЦИКЛ
// ============================================================
let tickCount = 0;

function tick() {
  resetWalletIfNewDay();

  matches.forEach(m => {
    if (m.status === 'live' || m.status === 'prematch' || m.status === 'countdown') tickMatch(m);
  });

  // Обрабатываем завершённые матчи: 8 секунд показываем финал, потом отсчёт 1 минута
  matches.forEach(m => {
    if (m.status === 'finished' && !m.countdownStarted) {
      m.finishedAt = m.finishedAt || Date.now();
      if (Date.now() - m.finishedAt > 8000) {
        m.countdownStarted = true;
        m.status = 'countdown';
        m.countdownLeft = 60; // 1 минута отсчёта
      }
    }
  });

  settleBets();

  // Периодически добавляем новые матчи если все кончились
  const activeCount = matches.filter(m => m.status === 'live' || m.status === 'prematch').length;
  if (activeCount < 5) {
    // Добавляем новые матчи чтобы линия не пустела
    const needCount = 8 - activeCount;
    for (let i = 0; i < needCount; i++) {
      const startsIn = rand(60, 600); // 1-10 минут
      matches.push(createRandomMatch(true, startsIn));
    }
    renderLeagueFilters();
  }

  renderMatches();
  renderLiveDrops();
  if ($('tab-stats').classList.contains('active')) renderStats();
  if ($('tab-history').classList.contains('active')) renderHistory();
}

// ============================================================
// ДЕЛЕГИРОВАНИЕ КЛИКОВ
// ============================================================
document.addEventListener('click', (e) => {
  const mainBtn = e.target.closest('.odds-btn[data-match-id]');
  if (mainBtn) {
    if (mainBtn.disabled || mainBtn.classList.contains('disabled')) return;
    const mid = parseInt(mainBtn.dataset.matchId);
    const pick = mainBtn.dataset.pick;
    const odd = parseFloat(mainBtn.dataset.odd);
    if (isNaN(mid) || !pick || !isOddValid(odd)) return;
    openBetModal(mid, pick, odd);
    return;
  }

  const miniBtn = e.target.closest('.odds-mini[data-mid]');
  if (miniBtn) {
    if (miniBtn.disabled || miniBtn.classList.contains('disabled')) return;
    const mid = parseInt(miniBtn.dataset.mid);
    const pick = decodeURIComponent(miniBtn.dataset.mk);
    const odd = parseFloat(miniBtn.dataset.odd);
    if (isNaN(mid) || !pick || !isOddValid(odd)) return;
    openBetModal(mid, pick, odd);
    return;
  }

  // Клик на баланс → бонус
  if (e.target.closest('#balanceBox')) {
    claimBonus();
    return;
  }
});
