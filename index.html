<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BETZONE</title>
<style>
:root{
  --bg:#0b0e12;
  --panel:#131820;
  --panel-2:#1a2029;
  --panel-3:#222a35;
  --border:#242c37;
  --border-2:#2f3845;
  --text:#e8ecf2;
  --text-2:#a9b3c0;
  --muted:#6b7480;
  --muted-2:#4f5762;
  --gold:#c9a961;
  --gold-2:#d8bc80;
  --gold-dim:rgba(201,169,97,.12);
  --green:#4ea87a;
  --green-bright:#5fc98e;
  --red:#c15c68;
  --red-bright:#e87b88;
  --live:#d0454f;
  --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;padding-bottom:120px;
  font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:4px;}
::-webkit-scrollbar-track{background:transparent;}

/* ===== HEADER ===== */
header{
  position:sticky;top:0;z-index:200;
  background:rgba(11,14,18,.95);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}
.hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px 12px;gap:12px;
}
.logo{
  font-size:19px;font-weight:800;
  letter-spacing:1px;color:var(--gold);
}
.logo span{color:var(--text);font-weight:500;}
.hdr-r{display:flex;align-items:center;gap:10px;}
.balance{
  background:var(--panel-2);
  border:1px solid var(--border);
  padding:7px 13px;border-radius:20px;
  font-size:13px;font-weight:700;
  cursor:pointer;transition:.18s;
  display:flex;align-items:center;gap:6px;
}
.balance:hover{border-color:var(--gold);}
.balance b{color:var(--green-bright);font-weight:800;}
.avatar{
  width:34px;height:34px;border-radius:50%;
  background:var(--panel-2);
  border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:13px;color:var(--text-2);
  cursor:pointer;transition:.18s;
}
.avatar:hover{border-color:var(--gold);color:var(--gold);}
.avatar.on{background:var(--gold);color:#0b0e12;border-color:var(--gold);}

/* ===== SPORT TABS ===== */
.stabs{
  display:flex;gap:6px;overflow-x:auto;
  padding:0 16px 12px;scrollbar-width:none;
}
.stabs::-webkit-scrollbar{display:none;}
.stab{
  flex-shrink:0;
  background:transparent;
  border:1px solid var(--border);
  color:var(--muted);
  padding:8px 14px;border-radius:9px;
  font-size:12.5px;font-weight:600;cursor:pointer;
  transition:.18s;white-space:nowrap;
  display:flex;align-items:center;gap:6px;
}
.stab:hover{color:var(--text-2);border-color:var(--border-2);}
.stab.on{
  background:var(--panel-3);
  border-color:var(--border-2);
  color:var(--text);
}
.stab .ic{font-size:14px;opacity:.9;}
.stab .bdg{
  background:var(--live);color:#fff;
  font-size:9px;font-weight:800;
  padding:1px 5px;border-radius:7px;
  margin-left:2px;
}

/* ===== SEARCH ===== */
.search-w{margin:0 16px 10px;position:relative;}
.search{
  width:100%;background:var(--panel);
  border:1px solid var(--border);
  border-radius:10px;
  padding:11px 36px 11px 40px;
  color:var(--text);font-size:13.5px;
  transition:.18s;
}
.search:focus{
  outline:none;border-color:var(--border-2);
  background:var(--panel-2);
}
.search::placeholder{color:var(--muted);}
.search-i{
  position:absolute;left:14px;top:50%;
  transform:translateY(-50%);
  font-size:14px;color:var(--muted);
  pointer-events:none;opacity:.7;
}
.search-x{
  position:absolute;right:12px;top:50%;
  transform:translateY(-50%);
  color:var(--muted);cursor:pointer;
  font-size:16px;display:none;
}
.search-x.on{display:block;}

/* ===== FILTERS ===== */
.filters{
  display:flex;gap:6px;overflow-x:auto;
  padding:0 16px 12px;scrollbar-width:none;
}
.filters::-webkit-scrollbar{display:none;}
.fchip{
  flex-shrink:0;background:transparent;
  border:1px solid var(--border);
  color:var(--muted);padding:6px 13px;
  border-radius:8px;font-size:12px;font-weight:600;
  cursor:pointer;transition:.18s;white-space:nowrap;
}
.fchip:hover{color:var(--text-2);}
.fchip.on{
  background:var(--gold-dim);
  color:var(--gold-2);
  border-color:rgba(201,169,97,.35);
}

/* ===== META ===== */
.meta{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px 12px;gap:10px;
}
.meta-c{font-size:11.5px;color:var(--muted);font-weight:600;}
.meta select{
  background:var(--panel);border:1px solid var(--border);
  color:var(--text-2);font-size:11.5px;font-weight:600;
  padding:6px 11px;border-radius:7px;cursor:pointer;
}
.meta select:focus{outline:none;border-color:var(--border-2);}

/* ===== MAIN ===== */
main{padding:0 16px;max-width:960px;margin:0 auto;}

/* ===== CARD (свернутая) ===== */
.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:14px 16px;
  margin-bottom:10px;
  cursor:pointer;
  transition:border-color .2s, background .2s;
  position:relative;
  overflow:hidden;
}
.card:hover{
  border-color:var(--border-2);
  background:var(--panel-2);
}
.card.live{
  border-color:rgba(208,69,79,.3);
}
.card.done{opacity:.6;}

.card-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;margin-bottom:12px;
}
.card-league{
  display:flex;align-items:center;gap:7px;
  font-size:11px;color:var(--muted);font-weight:600;
  text-transform:uppercase;letter-spacing:.4px;
  min-width:0;overflow:hidden;
}
.card-league span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.card-league .ic{font-size:13px;opacity:.8;}

.status{
  display:flex;align-items:center;gap:5px;
  font-size:11px;font-weight:700;
  padding:4px 9px;border-radius:7px;
  background:var(--panel-3);
  color:var(--text-2);white-space:nowrap;
  flex-shrink:0;
}
.status.live{
  background:rgba(208,69,79,.14);
  color:#e8848c;
}
.status.live .pulse{
  width:5px;height:5px;border-radius:50%;
  background:var(--live);
  animation:pl 1.5s infinite;
}
.status.done{
  background:var(--panel-3);
  color:var(--muted);
}
@keyframes pl{0%,100%{opacity:1;}50%{opacity:.35;}}

/* ===== TEAMS ===== */
.teams{
  display:flex;flex-direction:column;gap:8px;
  margin-bottom:12px;
}
.trow{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;
}
.tname{
  font-size:14.5px;font-weight:600;
  color:var(--text);
  display:flex;align-items:center;gap:10px;
  flex:1;min-width:0;
}
.tlogo{
  width:26px;height:26px;border-radius:7px;
  background:var(--panel-3);
  border:1px solid var(--border-2);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;color:var(--muted);
  flex-shrink:0;
  transition:.2s;
}
.tlogo.win{color:var(--gold);border-color:rgba(201,169,97,.4);}
.tlogo.lose{opacity:.4;}
.tname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tscore{
  font-size:19px;font-weight:800;
  color:var(--text);
  min-width:26px;text-align:center;
  font-variant-numeric:tabular-nums;
}
.tscore.win{color:var(--gold-2);}
.tscore.dim{color:var(--muted);}

/* ===== PROGRESS ===== */
.prog{
  height:3px;border-radius:3px;
  background:var(--panel-3);
  overflow:hidden;margin-top:4px;
}
.prog .bar{
  height:100%;
  background:linear-gradient(90deg,var(--live),#e8848c);
  border-radius:3px;
  transition:width .95s linear;
}

/* ===== CARD HINT ===== */
.hint{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;margin-top:12px;
  padding-top:12px;
  border-top:1px solid var(--border);
  font-size:11.5px;color:var(--muted);font-weight:600;
}
.hint .arrow{
  color:var(--gold);
  font-weight:700;
  display:flex;align-items:center;gap:4px;
}

/* ===== EXPANDED MARKETS ===== */
.markets{
  display:none;
  margin-top:12px;
  padding-top:12px;
  border-top:1px solid var(--border);
  animation:expand .25s ease-out;
}
.card.open .markets{display:block;}
.card.open .hint{display:none;}
@keyframes expand{
  from{opacity:0;transform:translateY(-4px);}
  to{opacity:1;transform:translateY(0);}
}

.mblock{margin-bottom:12px;}
.mblock:last-child{margin-bottom:0;}
.mname{
  font-size:10.5px;color:var(--muted);
  font-weight:700;
  text-transform:uppercase;letter-spacing:.5px;
  margin-bottom:6px;
  display:flex;align-items:center;gap:8px;
}
.mname::after{
  content:"";flex:1;height:1px;
  background:linear-gradient(90deg,var(--border),transparent 80%);
}
.grid{display:grid;gap:6px;}
.grid.g2{grid-template-columns:repeat(2,1fr);}
.grid.g3{grid-template-columns:repeat(3,1fr);}
.grid.g4{grid-template-columns:repeat(4,1fr);}

.odd{
  background:var(--panel-2);
  border:1px solid var(--border);
  border-radius:8px;
  padding:9px 6px;
  text-align:center;cursor:pointer;
  transition:background .15s, border-color .15s, transform .1s;
  display:flex;flex-direction:column;gap:2px;
  align-items:center;justify-content:center;
  min-height:46px;
  position:relative;
  overflow:hidden;
}
.odd:hover{
  border-color:var(--border-2);
  background:var(--panel-3);
}
.odd:active{transform:scale(.97);}
.odd .lbl{
  font-size:10px;color:var(--muted);
  font-weight:700;
  white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:100%;
}
.odd .val{
  font-size:14px;font-weight:800;
  color:var(--text);
  font-variant-numeric:tabular-nums;
  transition:color .25s;
}
.odd.sel{
  background:var(--gold-dim);
  border-color:rgba(201,169,97,.5);
}
.odd.sel .lbl{color:var(--gold-2);}
.odd.sel .val{color:var(--gold-2);}
.odd.closed{
  opacity:.35;cursor:not-allowed;
  background:var(--panel);
}
.odd.closed .val{
  text-decoration:line-through;
  color:var(--muted-2);
}
.odd.closed:hover{border-color:var(--border);background:var(--panel);}

/* flash animations */
.val.flash-up{animation:fUp 1.4s ease-out;}
.val.flash-down{animation:fDown 1.4s ease-out;}
@keyframes fUp{
  0%{color:#6ede9b;transform:scale(1.15);}
  40%{color:#6ede9b;transform:scale(1.05);}
  100%{color:var(--text);transform:scale(1);}
}
@keyframes fDown{
  0%{color:#e87b88;transform:scale(1.15);}
  40%{color:#e87b88;transform:scale(1.05);}
  100%{color:var(--text);transform:scale(1);}
}
.odd.sel .val.flash-up,
.odd.sel .val.flash-down{
  0%{transform:scale(1.15);}
  100%{transform:scale(1);}
}

/* ===== EMPTY ===== */
.empty{
  text-align:center;color:var(--muted);
  padding:60px 20px;
}
.empty .em{font-size:42px;display:block;margin-bottom:14px;opacity:.4;}
.empty .tt{font-size:15px;color:var(--text-2);font-weight:700;margin-bottom:6px;}
.empty .sb{font-size:12.5px;}

/* ===== COUPON ===== */
.coupon{
  position:fixed;bottom:0;left:0;right:0;z-index:250;
  background:var(--panel);
  border-top:1px solid var(--border-2);
  box-shadow:0 -8px 32px rgba(0,0,0,.55);
  transition:transform .3s cubic-bezier(.4,0,.2,1);
  max-height:84vh;display:flex;flex-direction:column;
  border-radius:18px 18px 0 0;
}
.cbar{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:13px 16px;cursor:pointer;
  user-select:none;
}
.cbar-l{
  display:flex;align-items:center;gap:10px;
  font-size:13px;font-weight:600;color:var(--text-2);
  min-width:0;flex:1;
}
.cbar-ic{font-size:18px;opacity:.8;}
.cbar-n{
  background:var(--panel-3);
  color:var(--text-2);
  font-size:11px;font-weight:800;
  padding:2px 8px;border-radius:7px;
  min-width:22px;text-align:center;
}
.cbar-n.has{
  background:var(--gold-dim);
  color:var(--gold-2);
}
.cbar-o{color:var(--gold-2);font-weight:800;font-size:14px;}
.cbtn{
  background:var(--gold);
  color:#0b0e12;font-weight:800;
  border:none;padding:10px 22px;border-radius:9px;
  cursor:pointer;font-size:13px;white-space:nowrap;
  transition:.18s;flex-shrink:0;
}
.cbtn:disabled{
  background:var(--panel-3);
  color:var(--muted);
  cursor:not-allowed;
}
.cbtn:not(:disabled):hover{background:var(--gold-2);}

.cbody{
  display:none;padding:0 16px 16px;
  overflow-y:auto;max-height:62vh;
  border-top:1px solid var(--border);
}
.coupon.open .cbody{display:block;}
.coupon.open{max-height:88vh;}

.ctype{
  display:flex;gap:4px;padding:12px 0;
  border-bottom:1px solid var(--border);
}
.ctype-b{
  flex:1;background:transparent;
  border:1px solid var(--border);
  color:var(--muted);padding:8px;
  border-radius:8px;cursor:pointer;
  font-size:12px;font-weight:700;transition:.15s;
}
.ctype-b:hover{color:var(--text-2);}
.ctype-b.on{
  background:var(--gold-dim);
  color:var(--gold-2);
  border-color:rgba(201,169,97,.4);
}

.citems{max-height:240px;overflow-y:auto;}
.citem{
  display:flex;align-items:flex-start;gap:10px;
  padding:12px 0;
  border-bottom:1px solid var(--border);
}
.citem .info{flex:1;min-width:0;}
.citem .pick{
  font-size:13px;font-weight:700;color:var(--text);
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
}
.citem .pick .bdg{
  background:var(--panel-3);color:var(--muted);
  font-size:10px;padding:2px 6px;border-radius:5px;
  font-weight:800;
}
.citem .teams{
  color:var(--muted);font-size:11.5px;
  margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;
}
.citem .mk{
  color:var(--muted-2);font-size:10.5px;
  margin-top:2px;
  text-transform:uppercase;letter-spacing:.3px;
  font-weight:700;
}
.citem .coef{
  color:var(--gold-2);font-weight:800;
  font-size:14px;white-space:nowrap;
  padding-top:1px;
}
.citem .rm{
  color:var(--muted);cursor:pointer;
  font-weight:800;padding:2px 6px;
  font-size:15px;line-height:1;
  transition:.15s;
}
.citem .rm:hover{color:var(--red-bright);}

.stake-row{
  display:flex;gap:6px;padding:12px 0 8px;
  flex-wrap:wrap;
}
.stake-in{
  flex:1;min-width:120px;
  background:var(--panel-2);
  border:1px solid var(--border);
  border-radius:8px;padding:11px 14px;
  color:var(--text);font-size:15px;font-weight:700;
  font-variant-numeric:tabular-nums;
}
.stake-in:focus{outline:none;border-color:var(--border-2);}
.stake-q{
  background:transparent;
  border:1px solid var(--border);
  color:var(--text-2);padding:0 12px;
  border-radius:8px;cursor:pointer;
  font-weight:700;font-size:12px;
  transition:.15s;
}
.stake-q:hover{
  border-color:var(--gold);
  color:var(--gold-2);
}
.csum{
  background:var(--panel-2);
  border-radius:10px;padding:12px 14px;
  margin-top:8px;
  display:flex;flex-direction:column;gap:6px;
}
.csum .row{
  display:flex;justify-content:space-between;
  font-size:12.5px;color:var(--muted);
}
.csum .row.total{
  border-top:1px solid var(--border);
  padding-top:8px;margin-top:4px;
  font-size:13px;color:var(--text-2);font-weight:700;
}
.csum .row.total b{
  color:var(--gold-2);font-size:16px;
}
.cempty{
  text-align:center;color:var(--muted);
  padding:30px 20px;font-size:13px;
}
.cempty .em{font-size:34px;display:block;margin-bottom:8px;opacity:.35;}

/* ===== MODAL ===== */
.mbg{
  position:fixed;inset:0;z-index:300;
  background:rgba(0,0,0,.75);
  backdrop-filter:blur(3px);
  -webkit-backdrop-filter:blur(3px);
  display:none;align-items:flex-end;justify-content:center;
}
.mbg.on{display:flex;}
.mbox{
  background:var(--panel);
  width:100%;max-width:640px;
  border-radius:18px 18px 0 0;
  max-height:90vh;overflow-y:auto;
  padding:20px;
  animation:slideUp .25s cubic-bezier(.4,0,.2,1);
}
@keyframes slideUp{
  from{transform:translateY(30px);opacity:0;}
  to{transform:translateY(0);opacity:1;}
}
.grip{
  width:36px;height:4px;border-radius:4px;
  background:var(--border-2);margin:0 auto 16px;
}
.mhead{
  display:flex;justify-content:space-between;
  align-items:flex-start;gap:12px;margin-bottom:16px;
}
.mtitle{font-size:17px;font-weight:800;color:#fff;}
.msub{font-size:12px;color:var(--muted);margin-top:4px;}
.mclose{
  color:var(--muted);cursor:pointer;
  font-size:22px;line-height:1;
  padding:0 4px;transition:.15s;
}
.mclose:hover{color:var(--text);}

.mscore{
  background:var(--panel-2);
  border-radius:12px;padding:18px;
  text-align:center;margin-bottom:16px;
  border:1px solid var(--border);
}
.mscore .big{
  font-size:34px;font-weight:800;color:#fff;
  font-variant-numeric:tabular-nums;
  letter-spacing:-1px;
}
.mscore .line{
  display:flex;justify-content:space-between;
  align-items:center;gap:12px;margin-top:8px;
  font-size:12px;color:var(--muted);font-weight:600;
}
.mscore .live-tag{
  color:#e8848c;font-weight:700;
  display:inline-flex;align-items:center;gap:5px;
}
.mscore .live-tag .pl{
  display:inline-block;width:5px;height:5px;
  border-radius:50%;background:var(--live);
  animation:pl 1.5s infinite;
}

.info-grid{
  display:grid;grid-template-columns:1fr 1fr;
  gap:8px;margin-bottom:16px;
}
.icell{
  background:var(--panel-2);
  border-radius:8px;padding:10px 12px;
  border:1px solid var(--border);
}
.icell .l{
  font-size:10px;color:var(--muted);
  text-transform:uppercase;font-weight:700;
  letter-spacing:.5px;margin-bottom:3px;
}
.icell .v{font-size:13px;font-weight:600;color:var(--text);}

/* ===== PROFILE ===== */
.prof-head{
  display:flex;align-items:center;gap:14px;
  margin-bottom:18px;
  padding-bottom:16px;
  border-bottom:1px solid var(--border);
}
.prof-av{
  width:56px;height:56px;border-radius:50%;
  background:var(--gold-dim);
  border:2px solid var(--gold);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:800;color:var(--gold);
}
.prof-name{font-size:16px;font-weight:800;color:#fff;}
.prof-sub{font-size:12px;color:var(--muted);margin-top:2px;}

.stat-grid{
  display:grid;grid-template-columns:repeat(2,1fr);
  gap:8px;margin-bottom:16px;
}
.stat-c{
  background:var(--panel-2);
  border-radius:10px;padding:12px;
  border:1px solid var(--border);
}
.stat-c .l{
  font-size:10.5px;color:var(--muted);
  text-transform:uppercase;font-weight:700;
  letter-spacing:.4px;margin-bottom:5px;
}
.stat-c .v{font-size:16px;font-weight:800;color:var(--text);}
.stat-c .v.g{color:var(--green-bright);}
.stat-c .v.r{color:var(--red-bright);}

<script>
/* ============================================================
   BETZONE ENGINE — FULL REWRITE
   ============================================================ */

/* ---------- SPORTS ---------- */
const SPORTS = [
  {id:'all',        name:'Все',        ic:'🔥'},
  {id:'football',   name:'Футбол',     ic:'⚽'},
  {id:'hockey',     name:'Хоккей',     ic:'🏒'},
  {id:'basketball', name:'Баскетбол',  ic:'🏀'},
  {id:'mma',        name:'UFC',        ic:'🥊'},
  {id:'tennis',     name:'Теннис',     ic:'🎾'},
  {id:'cyber',      name:'Киберспорт', ic:'🎮'},
];

const FILTERS = [
  {id:'all',   name:'Все'},
  {id:'live',  name:'🔴 Live'},
  {id:'today', name:'Сегодня'},
];

/* ---------- MATCH TEMPLATES ----------
   Каждый шаблон описывает матч. Движок сам генерирует события
   по кругу, следит за временем, счётом и обновляет кэфы.
*/

const TEMPLATES = {
  football: [
    {home:'Арсенал', away:'Челси', league:'АПЛ · 25-й тур'},
    {home:'Реал Мадрид', away:'Барселона', league:'Ла Лига · Класико'},
    {home:'Бавария', away:'ПСЖ', league:'Лига Чемпионов · 1/8'},
    {home:'Манчестер Сити', away:'Ливерпуль', league:'АПЛ · 25-й тур'},
    {home:'Ювентус', away:'Интер', league:'Серия А · Дерби Италии'},
  ],
  hockey: [
    {home:'Тампа-Бэй', away:'Бостон', league:'НХЛ · Плей-офф'},
    {home:'СКА', away:'ЦСКА', league:'КХЛ · Регулярка'},
    {home:'Торонто', away:'Монреаль', league:'НХЛ · Оригинал 6'},
    {home:'Ак Барс', away:'Динамо М', league:'КХЛ · Топ-матч'},
  ],
  basketball: [
    {home:'Лейкерс', away:'Голден Стэйт', league:'NBA · Регулярка'},
    {home:'Селтикс', away:'Нью-Йорк', league:'NBA · Дерби'},
    {home:'ЦСКА', away:'Зенит', league:'Евролига · Топ-16'},
    {home:'Милуоки', away:'Филадельфия', league:'NBA · Восток'},
  ],
  mma: [
    {home:'Махачев', away:'Порье', league:'UFC 305 · Main Event'},
    {home:'Волков', away:'Ган', league:'UFC Fight Night'},
    {home:'Перейра', away:'Анкалаев', league:'UFC 306 · Title'},
    {home:'Джонс', away:'Миочич', league:'UFC 309 · Heavyweight'},
  ],
  tennis: [
    {home:'Джокович', away:'Алькарас', league:'ATP Мастерс · 1/4'},
    {home:'Швёнтек', away:'Саболенко', league:'WTA · 1/2'},
    {home:'Медведев', away:'Зверев', league:'ATP · Финал'},
    {home:'Рублёв', away:'Циципас', league:'ATP · 1/8'},
  ],
  cyber: [
    {home:'NAVI', away:'FaZe', league:'CS2 Major · Плей-офф'},
    {home:'Team Spirit', away:'Gaimin', league:'Dota 2 · TI'},
    {home:'G2', away:'Vitality', league:'CS2 · BLAST'},
    {home:'T1', away:'Gen.G', league:'LoL · Worlds'},
  ],
};

/* ---------- MATCH DURATION (в секундах) ---------- */
const DURATION = {
  football: 240,     // 4 минуты
  hockey: 300,       // 5 минут
  basketball: 300,   // 5 минут
  mma: 100,          // ~5 раундов по 20 сек
  tennis: 180,       // 3 минуты
  cyber: 300,        // 5 минут
};

/* ---------- ВНУТРЕННЕЕ ВРЕМЯ МАТЧА (для отображения) ---------- */
const DISPLAY_TIME = {
  football: {max:90, unit:"'"},
  hockey: {max:60, unit:"'"},
  basketball: {max:48, unit:"'"},
  mma: {max:5, unit:'раунд'},
  tennis: {max:3, unit:'сет'},
  cyber: {max:3, unit:'карта'},
};

/* ============================================================
   MATCH CLASS
   ============================================================ */
class Match {
  constructor(sport, template, id){
    this.id = id;
    this.sport = sport;
    this.home = template.home;
    this.away = template.away;
    this.league = template.league;

    this.duration = DURATION[sport];
    this.startedAt = Date.now();
    this.finished = false;

    this.hs = 0;
    this.as = 0;

    // Внутреннее игровое время (в игровых единицах)
    this.gameTime = 0;

    // Рынки (создаются в buildMarkets)
    this.markets = {};

    // История кэфов для flash
    this.lastOdds = {};

    this.buildMarkets();
  }

  /* ---------- ПРОГРЕСС 0..1 ---------- */
  progress(){
    const el = (Date.now() - this.startedAt) / 1000;
    return Math.min(1, el / this.duration);
  }

  /* ---------- ИГРОВОЕ ВРЕМЯ (для отображения) ---------- */
  displayTime(){
    const p = this.progress();
    const cfg = DISPLAY_TIME[this.sport];
    if(this.sport === 'mma'){
      const total = 5;
      const cur = Math.min(total, Math.floor(p * total) + 1);
      const roundSec = 20;
      const inRound = Math.floor(((p*total) % 1) * roundSec);
      return `Раунд ${cur} · ${inRound}с`;
    }
    if(this.sport === 'tennis'){
      const sets = Math.min(3, Math.floor(p * 3) + 1);
      const games = Math.floor(((p*3) % 1) * 12);
      return `Сет ${sets} · ${games} гейм`;
    }
    if(this.sport === 'cyber'){
      const maps = Math.min(3, Math.floor(p * 3) + 1);
      const rounds = Math.floor(((p*3) % 1) * 30);
      return `Карта ${maps} · ${rounds} раунд`;
    }
    const mins = Math.floor(p * cfg.max);
    return `${mins}${cfg.unit}`;
  }

  /* ---------- СОЗДАНИЕ РЫНКОВ ---------- */
  buildMarkets(){
    const mk = {};
    if(this.sport === 'football'){
      mk['1X2'] = {type:'1x2', lbl:['1','X','2'], val:[2.10,3.40,3.20], closed:[false,false,false]};
      mk['Тотал 2.5'] = {type:'over', line:2.5, lbl:['Больше','Меньше'], val:[1.85,1.95], closed:[false,false]};
      mk['Обе забьют'] = {type:'btts', lbl:['Да','Нет'], val:[1.70,2.10], closed:[false,false]};
      mk['Точный счёт'] = {type:'exact', lbl:['1:0','1:1','2:1','2:2'], val:[7.5,6.2,8.5,11.0], closed:[false,false,false,false]};
    }
    if(this.sport === 'hockey'){
      mk['Победитель'] = {type:'1x2', lbl:['1','X','2'], val:[1.95,4.20,2.80], closed:[false,false,false]};
      mk['Тотал 5.5'] = {type:'over', line:5.5, lbl:['Больше','Меньше'], val:[1.90,1.90], closed:[false,false]};
      mk['Обе забьют'] = {type:'btts', lbl:['Да','Нет'], val:[1.35,3.10], closed:[false,false]};
      mk['Фора 1 (-1.5)'] = {type:'handicap', lbl:['Да','Нет'], val:[2.60,1.50], closed:[false,false]};
    }
    if(this.sport === 'basketball'){
      mk['Победитель'] = {type:'win', lbl:['1','2'], val:[1.90,1.90], closed:[false,false]};
      mk['Тотал 210.5'] = {type:'over', line:210.5, lbl:['Больше','Меньше'], val:[1.85,1.95], closed:[false,false]};
      mk['Фора 1 (-4.5)'] = {type:'handicap', lbl:['Да','Нет'], val:[1.90,1.90], closed:[false,false]};
      mk['4-я четверть'] = {type:'win', lbl:['1','2'], val:[2.05,1.75], closed:[false,false]};
    }
    if(this.sport === 'mma'){
      mk['Победитель'] = {type:'win', lbl:['1','2'], val:[1.55,2.40], closed:[false,false]};
      mk['Тотал раундов 2.5'] = {type:'over', line:2.5, lbl:['Больше','Меньше'], val:[1.80,2.00], closed:[false,false]};
      mk['Метод победы'] = {type:'method', lbl:['KO/TKO','Сабмишн','Решение'], val:[3.50,2.80,4.10], closed:[false,false,false]};
      mk['Раунд победы'] = {type:'round', lbl:['1','2','3','4+'], val:[4.20,5.50,7.00,9.00], closed:[false,false,false,false]};
    }
    if(this.sport === 'tennis'){
      mk['Победитель'] = {type:'win', lbl:['1','2'], val:[1.85,1.95], closed:[false,false]};
      mk['Тотал 22.5'] = {type:'over', line:22.5, lbl:['Больше','Меньше'], val:[1.90,1.90], closed:[false,false]};
      mk['Счёт по сетам'] = {type:'sets', lbl:['2:0','2:1','1:2','0:2'], val:[2.80,3.50,4.20,5.50], closed:[false,false,false,false]};
      mk['Обе берут сет'] = {type:'btts', lbl:['Да','Нет'], val:[1.80,2.00], closed:[false,false]};
    }
    if(this.sport === 'cyber'){
      mk['Победитель'] = {type:'win', lbl:['1','2'], val:[1.75,2.10], closed:[false,false]};
      mk['Тотал 2.5 карт'] = {type:'over', line:2.5, lbl:['Больше','Меньше'], val:[2.00,1.80], closed:[false,false]};
      mk['Обе берут карту'] = {type:'btts', lbl:['Да','Нет'], val:[1.60,2.30], closed:[false,false]};
      mk['Тотал раундов 26.5'] = {type:'over', line:26.5, lbl:['Больше','Меньше'], val:[1.90,1.90], closed:[false,false]};
    }
    this.markets = mk;
  }

  /* ---------- ОБНОВЛЕНИЕ (тик) ---------- */
  tick(){
    if(this.finished) return;

    const p = this.progress();

    // Генерируем события в зависимости от прогресса
    this.simulatePlay(p);

    // Обновляем кэфы по счёту
    this.recalcOdds();

    // Проверяем завершение
    if(p >= 1){
      this.finish();
    }
  }

  /* ---------- СИМУЛЯЦИЯ ИГРЫ ---------- */
  simulatePlay(p){
    const expected = this.expectedScore(p);

    // Для футбола/хоккея/баскета — счёт
    if(this.sport === 'football' || this.sport === 'hockey'){
      while(this.hs + this.as < expected.total){
        if(Math.random() < 0.5) this.hs++; else this.as++;
      }
    }
    if(this.sport === 'basketball'){
      while(this.hs < expected.hs) this.hs += 1 + Math.floor(Math.random()*2);
      while(this.as < expected.as) this.as += 1 + Math.floor(Math.random()*2);
    }
    if(this.sport === 'mma'){
      // В UFC счёт — это счёт по раундам
      const r = Math.min(5, Math.floor(p * 5));
      while(this.hs + this.as < r){
        if(Math.random() < 0.5) this.hs++; else this.as++;
      }
    }
    if(this.sport === 'tennis'){
      // Счёт — по сетам
      const r = Math.min(3, Math.floor(p * 3));
      while(this.hs + this.as < r){
        if(Math.random() < 0.5) this.hs++; else this.as++;
      }
    }
    if(this.sport === 'cyber'){
      // Счёт — по картам
      const r = Math.min(3, Math.floor(p * 3));
      while(this.hs + this.as < r){
        if(Math.random() < 0.5) this.hs++; else this.as++;
      }
    }
  }

  /* ---------- ОЖИДАЕМЫЙ СЧЁТ ПО ПРОГРЕССУ ---------- */
  expectedScore(p){
    if(this.sport === 'football'){
      // 0..4 гола за матч
      return {total: Math.floor(p * (2 + Math.random()*2))};
    }
    if(this.sport === 'hockey'){
      // 0..6 шайб за матч
      return {total: Math.floor(p * (3 + Math.random()*3))};
    }
    if(this.sport === 'basketball'){
      // 0..110 очков на команду
      const maxPer = 100 + Math.floor(Math.random()*20);
      return {
        hs: Math.floor(p * maxPer),
        as: Math.floor(p * maxPer)
      };
    }
    if(this.sport === 'mma'){
      // Количество завершённых раундов
      return {total: 0};
    }
    return {total:0};
  }

  /* ---------- ПЕРЕСЧЁТ КОЭФФИЦИЕНТОВ ---------- */
  recalcOdds(){
    const p = this.progress();
    const remaining = 1 - p;

    // ---- 1X2 / Победитель ----
    const m1x2 = this.markets['1X2'] || this.markets['Победитель'];
    if(m1x2){
      if(this.sport === 'football' || this.sport === 'hockey'){
        const lead = this.hs - this.as;
        let p1, px, p2;
        if(lead > 0){
          p1 = 0.4 + lead*0.2 + (1-remaining)*0.2;
          px = 0.25 * remaining;
          p2 = Math.max(0.05, 1 - p1 - px);
        } else if(lead < 0){
          p2 = 0.4 + Math.abs(lead)*0.2 + (1-remaining)*0.2;
          px = 0.25 * remaining;
          p1 = Math.max(0.05, 1 - p2 - px);
        } else {
          p1 = 0.35; p2 = 0.35; px = 0.30 * remaining + 0.05;
        }
        p1 = Math.max(0.02, p1); p2 = Math.max(0.02, p2); px = Math.max(0.02, px);
        // нормализуем
        const s = p1 + px + p2;
        p1 /= s; px /= s; p2 /= s;
        const margin = 1.06;
        m1x2.val = [
          Math.max(1.02, (1/p1) / margin),
          Math.max(1.02, (1/px) / margin),
          Math.max(1.02, (1/p2) / margin)
        ];
      } else {
        // 2-way: win
        const lead = this.hs - this.as;
        let p1, p2;
        if(lead > 0){
          p1 = 0.5 + lead*0.15 + (1-remaining)*0.15;
          p2 = Math.max(0.05, 1 - p1);
        } else if(lead < 0){
          p2 = 0.5 + Math.abs(lead)*0.15 + (1-remaining)*0.15;
          p1 = Math.max(0.05, 1 - p2);
        } else {
          p1 = 0.5; p2 = 0.5;
        }
        const s = p1 + p2;
        p1 /= s; p2 /= s;
        const margin = 1.05;
        m1x2.val = [
          Math.max(1.02, (1/p1) / margin),
          Math.max(1.02, (1/p2) / margin)
        ];
      }
    }

    // ---- Тотал Больше/Меньше ----
    for(const [name, m] of Object.entries(this.markets)){
      if(m.type === 'over'){
        const line = m.line;
        const totalScore = this.hs + this.as;
        const remainingTime = remaining;
        const projected = totalScore + this.projectedRemaining();
        const diff = projected - line;
        let pOver;
        if(Math.abs(diff) < 0.1){
          pOver = 0.5;
        } else {
          pOver = 1 / (1 + Math.exp(-diff * 1.2));
        }
        pOver = Math.max(0.05, Math.min(0.95, pOver));
        const margin = 1.06;
        m.val = [
          Math.max(1.02, (1/pOver) / margin),
          Math.max(1.02, (1/(1-pOver)) / margin)
        ];
      }

      // ---- Обе забьют ----
      if(m.type === 'btts'){
        const bothScored = this.hs > 0 && this.as > 0;
        // Если обе уже забили — закрываем рынок как WIN
        if(bothScored){
          m.closed = [true, true];
          m.val = [1.00, 1.00];
          m.result = 'win';
          continue;
        }
        // Если одна команда уже точно не забьёт (прошло >85% и у неё 0)
        const oneZero = (this.hs === 0 || this.as === 0) && p > 0.85;
        if(oneZero){
          m.closed = [true, true];
          m.val = [1.00, 1.00];
          m.result = 'lose';
          continue;
        }
        // Иначе считаем вероятность
        const pHome = Math.min(0.9, 0.2 + this.hs * 0.3 + remaining * 0.4);
        const pAway = Math.min(0.9, 0.2 + this.as * 0.3 + remaining * 0.4);
        let pBoth = pHome * pAway;
        pBoth = Math.max(0.05, Math.min(0.9, pBoth));
        const margin = 1.06;
        m.val = [
          Math.max(1.02, (1/pBoth) / margin),
          Math.max(1.02, (1/(1-pBoth)) / margin)
        ];
      }
    }
  }

  projectedRemaining(){
    // средний прирост за матч × оставшееся время
    if(this.sport === 'football') return (1 - this.progress()) * 2.5;
    if(this.sport === 'hockey') return (1 - this.progress()) * 4;
    return 0;
  }

  /* ---------- ЗАВЕРШЕНИЕ МАТЧА ---------- */
  finish(){
    this.finished = true;
    // В football, если счёт равный — добавляем ещё голы для драмы
    if((this.sport === 'football' || this.sport === 'hockey') && this.hs === this.as){
      if(Math.random() < 0.5) this.hs++;
      else this.as++;
    }
    // Закрываем все рынки
    for(const m of Object.values(this.markets)){
      m.closed = m.lbl.map(()=>true);
    }
  }
}

/* ============================================================
   MATCH MANAGER — управляет ротацией матчей 24/7
   ============================================================ */
const manager = {
  matches: [],       // активные матчи
  nextId: 1,
  perSport: {
    football: 4,
    hockey: 2,
    basketball: 2,
    mma: 2,
    tennis: 2,
    cyber: 2,
  },

  init(){
    // стартуем со случайным прогрессом, чтобы не все были на 0
    for(const sport in this.perSport){
      const count = this.perSport[sport];
      const templates = TEMPLATES[sport];
      const shuffled = [...templates].sort(()=>Math.random()-0.5);
      for(let i=0;i<count;i++){
        const tpl = shuffled[i % shuffled.length];
        const m = new Match(sport, tpl, this.nextId++);
        // случайный старт (0..60% матча уже прошло)
        m.startedAt = Date.now() - Math.floor(Math.random() * m.duration * 0.6 * 1000);
        this.matches.push(m);
      }
    }
  },

  tick(){
    // обновить матчи
    this.matches.forEach(m => m.tick());

    // заменить завершённые на новые
    this.matches.forEach((m, idx) => {
      if(m.finished){
        // генерируем новый того же спорта
        const templates = TEMPLATES[m.sport];
        const tpl = templates[Math.floor(Math.random() * templates.length)];
        const nm = new Match(m.sport, tpl, this.nextId++);
        this.matches[idx] = nm;
      }
    });
  },

  getLiveCount(){
    return this.matches.filter(m => !m.finished).length;
  }
};

const state = {

  filter: 'all',
  search: '',

};

/* ============================================================
   LOCALSTORAGE
   ============================================================ */
function saveState(){
  try{
    localStorage.setItem('betzone_v3', JSON.stringify({
      balance: state.balance,
      user: state.user,
      history: state.history,
    }));
  }catch(e){}
}
function loadState(){
  try{
    const raw = localStorage.getItem('betzone_v3');
    if(!raw) return;
    const d = JSON.parse(raw);
    if(d.balance != null) state.balance = d.balance;
    if(d.user) state.user = d.user;
    if(d.history) state.history = d.history;
  }catch(e){}
}

/* ============================================================
   MATCH CARD RENDER
   ============================================================ */
const SPORT_ICON = {
  football:'⚽', hockey:'🏒', basketball:'🏀',
  mma:'🥊', tennis:'🎾', cyber:'🎮'
};

function renderMatches(){
  const box = $('matches');
  let list = manager.matches.slice();

  // sport filter
  if(state.sport === 'live'){
    list = list.filter(m => !m.finished);
  } else if(state.sport !== 'all'){
    list = list.filter(m => m.sport === state.sport);
  }

  // chip filter
  if(state.filter === 'live') list = list.filter(m => !m.finished && m.progress() < 1);

  // search
  if(state.search){
    const q = state.search.toLowerCase();
    list = list.filter(m =>
      m.home.toLowerCase().includes(q) ||
      m.away.toLowerCase().includes(q) ||
      m.league.toLowerCase().includes(q)
    );
  }

  // sort
  if(state.sort === 'live'){
    list.sort((a,b)=> (a.finished?1:0) - (b.finished?1:0));
  } else if(state.sort === 'time'){
    list.sort((a,b)=> a.startedAt - b.startedAt);
  }

  $('metaCount').textContent = list.length + ' событий';

  if(!list.length){
    box.innerHTML = `<div class="empty">
      <span class="em">🔍</span>
      <div class="tt">Ничего не найдено</div>
      <div class="sb">Попробуйте изменить фильтр или поиск</div>
    </div>`;
    return;
  }

  box.innerHTML = list.map(m => renderCard(m)).join('');
}

function renderCard(m){
  const ic = SPORT_ICON[m.sport] || '🏆';
  const p = m.progress();

  // status
  let statusHTML;
  if(m.finished){
    statusHTML = `<div class="status done">Завершён</div>`;
  } else {
    statusHTML = `<div class="status live">
      <span class="pulse"></span>${m.displayTime()}
    </div>`;
  }

  // score (only live/finished)
  const showScore = true;
  const homeScoreClass = showScore
    ? (m.finished && m.hs > m.as ? 'win' : '')
    : '';
  const awayScoreClass = showScore
    ? (m.finished && m.as > m.hs ? 'win' : '')
    : '';

  const homeScore = showScore ? `<div class="tscore ${homeScoreClass}">${m.hs}</div>` : '';
  const awayScore = showScore ? `<div class="tscore ${awayScoreClass}">${m.as}</div>` : '';

  // letter
  const initial = n => (n||'?').trim().charAt(0).toUpperCase();

  // markets (only if expanded)
  const isExpanded = state.expandedCard === m.id;
  let marketsHTML = '';
  if(isExpanded && !m.finished){
    marketsHTML = renderMarkets(m);
  } else if(isExpanded && m.finished){
    marketsHTML = `<div style="padding:16px;text-align:center;color:var(--muted);font-size:12.5px;">
      Матч завершён · ${m.hs}:${m.as}
    </div>`;
  }

  // progress bar
  const progBar = `<div class="prog"><div class="bar" style="width:${(p*100).toFixed(1)}%"></div></div>`;

  return `<div class="card ${m.finished?'done':''} ${isExpanded?'open':''}"
              onclick="toggleCard(event,${m.id})">
    <div class="card-head">
      <div class="card-league">
        <span class="ic">${ic}</span>
        <span>${m.league}</span>
      </div>
      ${statusHTML}
    </div>
    <div class="teams">
      <div class="trow">
        <div class="tname">
          <div class="tlogo ${m.finished && m.hs>m.as?'win':''}">${initial(m.home)}</div>
          <span>${m.home}</span>
        </div>
        ${homeScore}
      </div>
      <div class="trow">
        <div class="tname">
          <div class="tlogo ${m.finished && m.as>m.hs?'win':''}">${initial(m.away)}</div>
          <span>${m.away}</span>
        </div>
        ${awayScore}
      </div>
    </div>
    ${(!m.finished) ? progBar : ''}
    ${(!isExpanded) ? `
      <div class="hint">
        <span>Показать коэффициенты</span>
        <span class="arrow">Открыть →</span>
      </div>` : ''}
    ${isExpanded ? `<div class="markets">${marketsHTML}</div>` : ''}
  </div>`;
}

function renderMarkets(m){
  let html = '';
  for(const [name, market] of Object.entries(m.markets)){
    const cols = market.lbl.length === 2 ? 2 :
                 market.lbl.length === 3 ? 3 : 4;
    html += `<div class="mblock">
      <div class="mname">${name}</div>
      <div class="grid g${cols}">
        ${market.lbl.map((l, i) => {
          const closed = market.closed && market.closed[i];
          const selected = state.coupon.find(c =>
            c.matchId === m.id && c.market === name && c.pickIdx === i
          );
          const val = market.val[i];
          // flash animation
          const last = m.lastOdds[name + '_' + i];
          let flash = '';
          if(last != null && val !== last){
            flash = val > last ? 'flash-up' : 'flash-down';
          }
          const key = `${m.id}::${name}::${i}::${val}`;
          const clickHandler = closed
            ? ''
            : `onclick="event.stopPropagation();toggleBet('${esc(key)}',${m.id},'${esc(name)}',${i},'${esc(l)}',${val})"`;
          return `<div class="odd ${selected?'sel':''} ${closed?'closed':''}" ${clickHandler}>
            <span class="lbl">${l}</span>
            <span class="val ${flash}" data-key="${m.id}_${name}_${i}">${val.toFixed(2)}</span>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }
  return html;
}

/* ============================================================
   CARD EXPAND
   ============================================================ */
function toggleCard(ev, id){
  // если кликнули на odd-btn — не переключаем
  if(ev.target.closest('.odd')) return;
  state.expandedCard = state.expandedCard === id ? null : id;
  renderMatches();
}

/* ============================================================
   COUPON
   ============================================================ */
function toggleBet(key, matchId, market, pickIdx, pickLbl, odds){
  const existing = state.coupon.findIndex(c =>
    c.matchId === matchId && c.market === market && c.pickIdx === pickIdx
  );
  if(existing > -1){
    state.coupon.splice(existing, 1);
  } else {
    if(state.betType === 'single'){
      state.coupon = [];
    } else {
      // экспресс: только 1 ставка на матч
      const sameMatch = state.coupon.find(c => c.matchId === matchId);
      if(sameMatch){
        toast('В экспрессе одна ставка на матч','err');
        return;
      }
      if(state.coupon.length >= 12){
        toast('Максимум 12 событий','err');
        return;
      }
    }
    const m = manager.matches.find(x => x.id === matchId);
    state.coupon.push({
      key, matchId, market, pickIdx, pickLbl, odds,
      home: m.home, away: m.away, sport: m.sport
    });
  }
  updateCoupon();
  renderMatches();
  saveState();
  if(state.coupon.length) toggleCoupon(true);
}

function removeBet(matchId, market, pickIdx){
  state.coupon = state.coupon.filter(c =>
    !(c.matchId === matchId && c.market === market && c.pickIdx === pickIdx)
  );
  updateCoupon();
  renderMatches();
  saveState();
}

function setBetType(type){
  state.betType = type;
  document.querySelectorAll('.ctype-b').forEach(b=>{
    b.classList.toggle('on', b.dataset.t === type);
  });
  if(type === 'single' && state.coupon.length > 1){
    state.coupon = [state.coupon[state.coupon.length - 1]];
  }
  updateCoupon();
  renderMatches();
  saveState();
}

function setStake(v){
  $('stakeInput').value = v;
  updateCoupon();
}

function updateCoupon(){
  const n = state.coupon.length;
  $('couponN').textContent = n;
  $('couponN').classList.toggle('has', n > 0);

  let odds = 0;
  if(state.betType === 'single'){
    odds = n ? state.coupon[0].odds : 0;
  } else {
    odds = n ? state.coupon.reduce((a,c)=>a*c.odds,1) : 0;
  }
  $('couponO').textContent = odds.toFixed(2);
  $('sumOdds').textContent = odds.toFixed(2);

  const items = $('couponItems');
  if(!n){
    items.innerHTML = `<div class="cempty">
      <span class="em">🎟️</span>
      Купон пуст.<br>Нажмите на матч, чтобы открыть коэффициенты.
    </div>`;
  } else {
    items.innerHTML = state.coupon.map(c => {
      const ic = SPORT_ICON[c.sport] || '🏆';
      return `<div class="citem">
        <div class="info">
          <div class="pick">
            <span class="bdg">${ic}</span>
            <span>${c.pickLbl}</span>
          </div>
          <div class="teams">${c.home} — ${c.away}</div>
          <div class="mk">${c.market}</div>
        </div>
        <div class="coef">${c.odds.toFixed(2)}</div>
        <span class="rm" onclick="removeBet(${c.matchId},'${esc(c.market)}',${c.pickIdx})">✕</span>
      </div>`;
    }).join('');
  }

  const stake = parseFloat($('stakeInput').value) || 0;
  $('sumStake').textContent = fmtMoney(stake);
  const potential = n ? stake * odds : 0;
  $('sumPotential').textContent = fmtMoney(potential);

  const btn = $('placeBtn');
  btn.disabled = !n || stake < 10 || stake > state.balance;

  $('navCoupon').style.display = n ? 'flex' : 'none';
  $('navCoupon').textContent = n;
}

function toggleCoupon(force){
  const c = $('coupon');
  if(force) c.classList.add('open');
  else c.classList.toggle('open');
}

function placeBet(e){
  if(e) e.stopPropagation();
  const stake = parseFloat($('stakeInput').value) || 0;
  if(stake < 10){ toast('Минимальная ставка 10 ₽','err'); return; }
  if(stake > state.balance){ toast('Недостаточно средств','err'); return; }
  if(!state.coupon.length) return;

  let odds = state.betType === 'single'
    ? state.coupon[0].odds
    : state.coupon.reduce((a,c)=>a*c.odds,1);
  const potential = stake * odds;

  state.balance -= stake;
  $('balanceVal').textContent = fmtMoney(state.balance);

  const histId = Date.now();
  state.history.unshift({
    id: histId,
    type: state.betType,
    stake, odds, potential,
    status: 'pending',
    createdAt: new Date().toISOString(),
    bets: state.coupon.map(c=>({...c}))
  });

  toast(`Ставка ${fmtMoney(stake)} принята`, 'ok');

  state.coupon = [];
  updateCoupon();
  renderMatches();
  saveState();

  // результат через 10-25 сек (рандом)
  const delay = 10000 + Math.random() * 15000;
  setTimeout(()=>{
    const item = state.history.find(h => h.id === histId);
    if(!item) return;
    const win = Math.random() < 0.42;
    item.status = win ? 'win' : 'lose';
    if(win){
      state.balance += item.potential;
      $('balanceVal').textContent = fmtMoney(state.balance);
      toast(`🎉 Выигрыш ${fmtMoney(item.potential)}`, 'ok');
    } else {
      toast('Ставка проиграла', 'err');
    }
    saveState();
  }, delay);
}

      <div class="mhead">
        <div>
          <div class="mtitle">Вход / Регистрация</div>
          <div class="msub">Демо-режим · данные хранятся локально</div>
        </div>
        <span class="mclose" onclick="closeModal()">✕</span>
      </div>
      <div class="login-form">
        <div class="afield">
          <label>Имя</label>
          <input id="lName" placeholder="Ваше имя" value="Игрок">
        </div>
        <div class="afield">
          <label>Email</label>
          <input id="lEmail" placeholder="you@example.com" value="player@betzone.demo">
        </div>
        <button class="asub" onclick="doLogin()">Войти</button>
      </div>
    `);
  }
}

function doLogin(){
  const name = $('lName').value.trim() || 'Игрок';
  const email = $('lEmail').value.trim() || 'player@betzone.demo';
  state.user = { name, email };
  $('avatar').textContent = name.charAt(0).toUpperCase();
  $('avatar').classList.add('on');
  closeModal();
  toast(`Добро пожаловать, ${name}`, 'ok');
  saveState();
}

function logout(){
  state.user = null;
  $('avatar').textContent = 'U';
  $('avatar').classList.remove('on');
  closeModal();
  toast('Вы вышли','inf');
  saveState();
}

function openDeposit(){ deposit(1000); }

function deposit(amount){
  state.balance += amount;
  $('balanceVal').textContent = fmtMoney(state.balance);
  toast(`Баланс пополнен на ${fmtMoney(amount)}`,'ok');
  saveState();
  if($('modalBg').classList.contains('on')){
    if(state.user) openProfile();
    else closeModal();
  }
}

/* ============================================================
   HISTORY
   ============================================================ */
function openHistory(){
  const html = `
    <div class="grip"></div>
    <div class="mhead">
      <div>
        <div class="mtitle">История ставок</div>
        <div class="msub">Всего: ${state.history.length}</div>
      </div>
      <span class="mclose" onclick="closeModal()">✕</span>
    </div>
    ${state.history.length === 0
      ? `<div class="empty">
          <span class="em">📭</span>
          <div class="tt">Ставок пока нет</div>
          <div class="sb">Сделайте первую ставку в линии</div>
        </div>`
      : state.history.map(h => {
          const date = new Date(h.createdAt);
          const time = date.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
          const day = date.toLocaleDateString('ru-RU');
          const typeLabel = {single:'Одиночная', express:'Экспресс'}[h.type] || h.type;
          const statusLabel = {win:'Выигрыш', lose:'Проигрыш', pending:'В игре'}[h.status];
          return `<div class="hitem">
            <div class="htop">
              <span>${day} · ${time} · ${typeLabel}</span>
              <span class="hstatus ${h.status}">${statusLabel}</span>
            </div>
            ${h.bets.map(b => `
              <div class="hpick">${b.pickLbl} · ${b.market}</div>
              <div class="hteams">${b.home} — ${b.away}</div>
            `).join('')}
            <div class="hbot">
              <span>${fmtMoney(h.stake)} · коэф. ${h.odds.toFixed(2)}</span>
              <span class="amt ${h.status==='lose'?'neg':''}">
                ${h.status==='win' ? '+'+fmtMoney(h.potential)
                  : h.status==='lose' ? '-'+fmtMoney(h.stake)
                  : fmtMoney(h.potential)}
              </span>
            </div>
          </div>`;
        }).join('')}
  `;
  openModal(html);
}

/* ============================================================
   ADMIN
   ============================================================ */
function openAdmin(){
  openModal(`
    <div class="grip"></div>
    <div class="mhead">
      <div>
        <div class="mtitle">Добавить событие</div>
        <div class="msub">Новый матч появится в линии</div>
      </div>
      <span class="mclose" onclick="closeModal()">✕</span>
    </div>
    <div class="aform">
      <div class="afield">
        <label>Вид спорта</label>
        <select id="aSport">
          <option value="football">⚽ Футбол</option>
          <option value="hockey">🏒 Хоккей</option>
          <option value="basketball">🏀 Баскетбол</option>
          <option value="mma">🥊 UFC</option>
          <option value="tennis">🎾 Теннис</option>
          <option value="cyber">🎮 Киберспорт</option>
        </select>
      </div>
      <div class="arow">
        <div class="afield"><label>Команда 1</label><input id="aHome" placeholder="Хозяева"></div>
        <div class="afield"><label>Команда 2</label><input id="aAway" placeholder="Гости"></div>
      </div>
      <div class="afield">
        <label>Турнир</label>
        <input id="aLeague" placeholder="АПЛ · 26-й тур">
      </div>
      <button class="asub" onclick="addCustomEvent()">Добавить</button>
    </div>
  `);
}

function addCustomEvent(){
  const sport = $('aSport').value;
  const home = $('aHome').value.trim();
  const away = $('aAway').value.trim();
  const league = $('aLeague').value.trim() || 'Товарищеский';
  if(!home || !away){ toast('Заполните обе команды','err'); return; }

  // Добавляем матч в ротацию — заменим один из завершённых или добавим
  const m = new Match(sport, {home, away, league}, manager.nextId++);
  // Находим индекс в списке для этого спорта, заменяем самый старый
  const sportMatches = manager.matches
    .map((x,i)=>({x,i}))
    .filter(o => o.x.sport === sport);
  if(sportMatches.length){
    // заменяем тот, что ближе к концу
    const target = sportMatches[sportMatches.length-1];
    manager.matches[target.i] = m;
  } else {
    manager.matches.push(m);
  }

  closeModal();
  renderMatches();
  renderSportsTabs();
  toast('Событие добавлено','ok');
}

/* ============================================================
   NAVIGATION
   ============================================================ */
function navTo(section){
  document.querySelectorAll('.nitem').forEach(n => n.classList.remove('on'));
  document.querySelector(`.nitem[data-nav="${section}"]`).classList.add('on');

  if(section === 'line'){ closeModal(); toggleCoupon(false); window.scrollTo({top:0,behavior:'smooth'}); }
  if(section === 'live'){ state.sport='all'; state.filter='live'; renderSportsTabs(); renderFilters(); renderMatches(); closeModal(); toggleCoupon(false); window.scrollTo({top:0,behavior:'smooth'}); }
  if(section === 'coupon'){ toggleCoupon(true); }
  if(section === 'history'){ openHistory(); }
  if(section === 'profile'){ openProfile(); }
}

/* ============================================================
   SETTERS
   ============================================================ */
function setSport(id){
  state.sport = id;
  state.expandedCard = null;
  renderSportsTabs();
  renderMatches();
}
function setFilter(id){
  state.filter = id;
  renderFilters();
  renderMatches();
}
function applySort(){
  state.sort = $('sortSelect').value;
  renderMatches();
}
function clearSearch(){
  $('searchInput').value = '';
  state.search = '';
  $('searchClear').classList.remove('on');
  renderMatches();
}

/* ============================================================
   ENGINE LOOP
   ============================================================ */
function engineTick(){
  // обновляем матчи
  manager.tick();

  // обновляем только раскрытую карточку — чтобы flash кэфов был виден
  if(state.expandedCard){
    // flash анимация уже добавлена в рендере, но нам нужно обновить DOM
    // Перерисовываем только одну карточку, чтобы не мигали все
    updateSingleCard(state.expandedCard);
  }

  // верхние бейджи
  renderSportsTabs();
  $('navLive').textContent = manager.matches.filter(m=>!m.finished).length;
  $('navCoupon').style.display = state.coupon.length ? 'flex' : 'none';
  $('navCoupon').textContent = state.coupon.length;

  // обновляем счётчик
  $('metaCount').textContent = getFilteredCount() + ' событий';
}

function updateSingleCard(id){
  const m = manager.matches.find(x => x.id === id);
  if(!m) return;
  const cardEl = document.querySelector(`.card[data-id="${id}"]`);
  if(!cardEl) return;
  // если раскрыт — обновляем весь блок
  const newHTML = renderCard(m);
  const tmp = document.createElement('div');
  tmp.innerHTML = newHTML;
  const newCard = tmp.firstElementChild;
  // сохраняем flash-классы
  cardEl.replaceWith(newCard);
}

function getFilteredCount(){
  let list = manager.matches;
  if(state.sport === 'live') list = list.filter(m=>!m.finished);
  else if(state.sport !== 'all') list = list.filter(m=>m.sport === state.sport);
  if(state.filter === 'live') list = list.filter(m=>!m.finished);
  if(state.search){
    const q = state.search.toLowerCase();
    list = list.filter(m =>
      m.home.toLowerCase().includes(q) ||
      m.away.toLowerCase().includes(q) ||
      m.league.toLowerCase().includes(q)
    );
  }
  return list.length;
}

/* ============================================================
   INIT
   ============================================================ */
function init(){
  loadState();
  $('balanceVal').textContent = fmtMoney(state.balance);
  if(state.user){
    $('avatar').textContent = state.user.name.charAt(0).toUpperCase();
    $('avatar').classList.add('on');
  }

  manager.init();
  renderSportsTabs();
  renderFilters();
  renderMatches();
  updateCoupon();

  // search
  $('searchInput').addEventListener('input', e => {
    state.search = e.target.value.trim();
    $('searchClear').classList.toggle('on', !!state.search);
    renderMatches();
  });

  // основной цикл — 1 сек
  setInterval(() => {
    engineTick();
  }, 1000);

  // редкая перерисовка списка (для прогресс-баров, статусов)
  setInterval(() => {
    if(!state.expandedCard) renderMatches();
  }, 3000);
}

init();
</script>
