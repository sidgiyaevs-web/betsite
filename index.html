  var minb = e.target.closest('.odd-mini[data-mid]');
  if(minb && !minb.disabled && !minb.classList.contains('disabled')){
    var mid2 = parseInt(minb.dataset.mid);
    var pk2 = decodeURIComponent(minb.dataset.mk);
    var odd2 = parseFloat(minb.dataset.odd);
    if(!isNaN(mid2) && pk2 && isValid(odd2)){ openBetModal(mid2,pk2,odd2); return; }
  }
  var eb = e.target.closest('[data-extras]');
  if(eb){
    var id = parseInt(eb.dataset.extras);
    if(openExtras.has(id)) openExtras.delete(id);
    else openExtras.add(id);
    renderMatches();
    return;
  }
  var cb = e.target.closest('[data-cashout]');
  if(cb){ e.stopPropagation(); doCashout(parseInt(cb.dataset.cashout)); return; }
  var hi = e.target.closest('[data-history]');
  if(hi && !e.target.closest('[data-cashout]')){
    var bid = parseInt(hi.dataset.history);
    var bet = wallet.bets.find(function(x){ return x.id===bid; });
    if(bet && bet.matchId){
      var m = matches.find(function(x){ return x.id===bet.matchId; });
      if(!m) toast('info','ℹ️','Матч заменён');
      else if(m.status==='finished') toast('info','ℹ️','Завершён: '+m.home+' — '+m.away);
      else toast('info','ℹ️',m.home+' — '+m.away+' · live');
    }
    return;
  }
  if(e.target.closest('#balanceBox')){ claimBonus(); return; }
});

$$('#navTabs .nav-tab').forEach(function(btn){
  btn.onclick = function(){
    $$('#navTabs .nav-tab').forEach(function(b){ b.classList.remove('active'); });
    this.classList.add('active');
    currentTab = this.dataset.tab;
    $$('.tab-content').forEach(function(c){ c.classList.remove('active'); });
    $('tab-'+currentTab).classList.add('active');
    if(currentTab==='history') renderHistory();
    if(currentTab==='stats') renderStats();
    if(currentTab==='achiv') renderAchiv();
    if(currentTab==='top') renderTop();
  };
});

$$('#sportFilters .sport-chip').forEach(function(btn){
  btn.onclick = function(){
    $$('#sportFilters .sport-chip').forEach(function(b){ b.classList.remove('active'); });
    this.classList.add('active');
    currentSport = this.dataset.sport;
    renderMatches();
  };
});

$$('.history-chip[data-hfilter]').forEach(function(btn){
  btn.onclick = function(){
    $$('.history-chip[data-hfilter]').forEach(function(b){ b.classList.remove('active'); });
    this.classList.add('active');
    currentHistory = this.dataset.hfilter;
    renderHistory();
  };
});

$('csvBtn').onclick = exportCSV;
$('betModalStake').addEventListener('input', updatePotential);
$$('.quick-stake').forEach(function(btn){
  btn.onclick = function(){
    var v = this.dataset.stake;
    $('betModalStake').value = v==='all' ? Math.floor(wallet.balance) : v;
    updatePotential();
  };
});
$('betModalConfirm').onclick = placeBet;
$('betModalCancel').onclick = closeBetModal;
$('betModalBuilder').onclick = addBuilder;
$('betModalCoupon').onclick = function(){
  if(!activeBet) return;
  var lbl = activeBet.pick==='home'?'П1':activeBet.pick==='draw'?'X':activeBet.pick==='away'?'П2':activeBet.pick;
  addCoupon(activeBet.matchId, activeBet.pick, activeBet.odd, lbl);
  closeBetModal();
};
$('betModal').onclick = function(e){ if(e.target.id==='betModal') closeBetModal(); };
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeBetModal(); });

$('soundBtn').onclick = function(){
  soundOn = !soundOn; saveSound();
  this.textContent = soundOn?'🔊':'🔇';
  this.classList.toggle('muted', !soundOn);
};
$('themeBtn').onclick = function(){
  theme = theme==='dark'?'light':'dark';
  applyTheme(); saveTheme();
};
function applyTheme(){
  if(theme==='light'){ document.body.classList.add('light'); $('themeBtn').textContent='☀️'; }
  else{ document.body.classList.remove('light'); $('themeBtn').textContent='🌙'; }
}
$('newLineBtn').onclick = function(){
  createBatch(); openExtras.clear(); builderBets={}; prevOdds={};
  saveMatches(); renderMatches();
  toast('info','🔄','Новая линия');
};
window.addEventListener('resize', function(){ if(currentTab==='stats') drawChart(); });

/* ============ СТАРТ ============ */
loadWallet(); loadCoupon(); loadSound(); loadTheme();
$('matches').innerHTML = Array(6).fill('<div class="skeleton skeleton-match"></div>').join('');

setTimeout(function(){
  try{
    matches = [];
    nextId = 1;
    var saved = loadMatches();
    if(saved && saved.length) matches = saved;
    else createBatch();
    $('soundBtn').textContent = soundOn?'🔊':'🔇';
    $('soundBtn').classList.toggle('muted', !soundOn);
    applyTheme();
    renderBalance(); renderMatches(); renderHistory(); renderStats(); renderCoupon(); renderAchiv(); updateBonus();
    setInterval(tick, 1000);
    setInterval(saveMatches, 3000);
    console.log('✅ OpenBet v25 запущен — '+matches.length+' матчей');
  }catch(err){
    console.error('❌', err);
    document.getElementById('matches').innerHTML = '<div style="padding:40px;text-align:center;color:#ff3860;grid-column:1/-1"><b>Ошибка:</b><br>'+err.message+'<br><small>'+(err.stack||'').slice(0,300)+'</small></div>';
  }
}, 100);
</script>
