async function fetchRealEvents(){

  const leagues=[39,140,135,78,61,2,3]; // + ЛЧ и ЛЕ
  let events=[];
  
  for(const l of leagues){
   const res=await fetch(`https://v3.football.api-sports.io/fixtures?league=${l}&season=2023`,{
    headers:{'x-apisports-key':API_KEY}
   });
   const data=await res.json();
   if(data.response){

     const dateStr=f.fixture.date;
     const st=new Date(dateStr).getTime();
     if(Math.abs(st-NOW)<86400000*2){ // только сегодня и завтра
      events.push({

       sp:'f',
       L:{k:'api'+l,n:'Лига '+l,cr:'Футбол',ct:'Матч',w:'League '+l,G:2.8,hs:.55,co:10,yc:4,top:1},

     }
    }
   }
  }
  
  if(events.length){
   localStorage.setItem(cacheKey,JSON.stringify(events));
   return events;
  }
 }catch(e){console.log('API error',e)}
