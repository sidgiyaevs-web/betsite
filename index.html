<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BETZONE — Спортивная линия</title>
<style>
/* ============================================================
   BETZONE — SPORTSBOOK DEMO
   Тёмная тема · жёлтый акцент · mobile-first
   ============================================================ */

:root{
  --bg:#0a0d12;
  --bg-2:#0f141b;
  --panel:#141a22;
  --panel-2:#1a212b;
  --panel-3:#222b37;
  --border:#252e3b;
  --border-2:#2f3947;
  --text:#eef3f9;
  --text-2:#b9c3d0;
  --muted:#7a8697;
  --muted-2:#5a6673;
  --accent:#ffc83d;
  --accent-2:#ffb400;
  --accent-dark:#1a1408;
  --gold:#ffc83d;
  --green:#26d07c;
  --green-2:#1eb568;
  --red:#ff4757;
  --red-2:#e03a48;
  --blue:#4a9dff;
  --purple:#9b6dff;
  --live:#ff2e4d;
  --shadow:0 8px 24px rgba(0,0,0,.5);
  --radius:14px;
  --radius-sm:10px;
  --radius-xs:8px;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;overflow-x:hidden;
  padding-bottom:96px;
  font-size:14px;line-height:1.4;
  -webkit-font-smoothing:antialiased;
}

/* ---------- SCROLLBAR ---------- */
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:6px;}

/* ---------- HEADER ---------- */
.top-header{
  position:sticky;top:0;z-index:200;
  background:linear-gradient(180deg,#0a0d12 0%,#0a0d12 70%,rgba(10,13,18,.95) 100%);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
.header-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px 10px;gap:12px;
}
.brand{
  font-size:22px;font-weight:900;letter-spacing:1.5px;
  color:var(--accent);font-style:italic;
  text-shadow:0 0 20px rgba(255,200,61,.3);
}
.brand span{color:var(--text);font-style:normal;}
.header-right{display:flex;align-items:center;gap:10px;}
.balance-pill{
  background:var(--panel-2);border:1px solid var(--border);
  padding:7px 12px;border-radius:20px;
  font-size:13px;font-weight:700;color:var(--green);
  display:flex;align-items:center;gap:6px;
  cursor:pointer;transition:.15s;
}
.balance-pill:hover{border-color:var(--accent);}
.balance-pill::before{content:"💰";font-size:12px;}
.avatar{
  width:34px;height:34px;border-radius:50%;
  background:linear-gradient(135deg,#2a3342,#1a212b);
  border:1px solid var(--border-2);
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:13px;color:var(--accent);
  cursor:pointer;transition:.15s;
}
.avatar:hover{border-color:var(--accent);}
.avatar.logged{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#000;}

/* ---------- SPORTS TABS ---------- */
.sports-tabs{
  display:flex;gap:8px;overflow-x:auto;padding:8px 16px 12px;
  scrollbar-width:none;
}
.sports-tabs::-webkit-scrollbar{display:none;}
.sport-tab{
  flex-shrink:0;
  background:var(--panel-2);border:1px solid var(--border);
  color:var(--text-2);padding:9px 16px;border-radius:12px;
  font-size:13px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;gap:7px;
  transition:.15s;white-space:nowrap;
}
.sport-tab:hover{border-color:var(--accent);color:var(--text);}
.sport-tab.active{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#1a1408;border-color:var(--accent);
  box-shadow:0 4px 14px rgba(255,200,61,.25);
}
.sport-tab .icon{font-size:15px;}
.sport-tab .badge{
  background:var(--live);color:#fff;font-size:10px;
  padding:1px 6px;border-radius:8px;font-weight:800;
  margin-left:2px;
}

/* ---------- HERO BANNER ---------- */
.hero{
  margin:12px 16px;padding:18px 18px 20px;
  background:
    radial-gradient(circle at 100% 0%,rgba(255,200,61,.14) 0%,transparent 55%),
    radial-gradient(circle at 0% 100%,rgba(74,157,255,.10) 0%,transparent 50%),
    linear-gradient(135deg,#161d27 0%,#0f141b 100%);
  border:1px solid var(--border);border-radius:var(--radius);
  position:relative;overflow:hidden;
}
.hero::before{
  content:"";position:absolute;top:-40%;right:-20%;
  width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,200,61,.18),transparent 70%);
  pointer-events:none;
}
.hero-label{
  font-size:11px;font-weight:800;letter-spacing:1.4px;
  color:var(--accent);text-transform:uppercase;margin-bottom:8px;
}
.hero-title{
  font-size:24px;font-weight:900;letter-spacing:-.3px;
  margin-bottom:8px;color:#fff;line-height:1.15;
}
.hero-sub{
  font-size:13px;color:var(--text-2);line-height:1.5;
  max-width:520px;
}

/* ---------- SEARCH ---------- */
.search-wrap{
  margin:14px 16px 0;position:relative;
}
.search-input{
  width:100%;
  background:var(--panel-2);border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:13px 16px 13px 42px;
  color:var(--text);font-size:14px;font-weight:500;
  transition:.15s;
}
.search-input:focus{outline:none;border-color:var(--accent);background:var(--panel-3);}
.search-input::placeholder{color:var(--muted);}
.search-icon{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  font-size:16px;color:var(--muted);pointer-events:none;
}
.search-clear{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  color:var(--muted);cursor:pointer;font-size:18px;display:none;
}
.search-clear.show{display:block;}

/* ---------- FILTERS ---------- */
.filters{
  display:flex;gap:8px;overflow-x:auto;padding:12px 16px;
  scrollbar-width:none;
}
.filters::-webkit-scrollbar{display:none;}
.filter-chip{
  flex-shrink:0;
  background:transparent;border:1px solid var(--border);
  color:var(--text-2);padding:8px 16px;border-radius:10px;
  font-size:13px;font-weight:600;cursor:pointer;
  transition:.15s;white-space:nowrap;
}
.filter-chip:hover{border-color:var(--border-2);color:var(--text);}
.filter-chip.active{
  background:var(--accent);color:#1a1408;border-color:var(--accent);
  font-weight:700;
}

/* ---------- SORT BAR ---------- */
.sort-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 16px 12px;gap:10px;
}
.results-count{font-size:12px;color:var(--muted);font-weight:600;}
.sort-select{
  background:var(--panel-2);border:1px solid var(--border);
  color:var(--text-2);font-size:12px;font-weight:600;
  padding:7px 12px;border-radius:8px;cursor:pointer;
}

/* ---------- MAIN ---------- */
main{padding:0 16px;max-width:1000px;margin:0 auto;}

/* ---------- SECTION TITLE ---------- */
.section-head{
  display:flex;align-items:center;justify-content:space-between;
  margin:20px 0 12px;gap:10px;
}
.section-title{
  font-size:16px;font-weight:800;color:#fff;
  display:flex;align-items:center;gap:8px;
}
.section-title .dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--accent);box-shadow:0 0 10px var(--accent);
}
.section-title .count{
  background:var(--panel-2);color:var(--muted);
  font-size:11px;padding:2px 8px;border-radius:8px;
  font-weight:700;margin-left:4px;
}
.section-link{
  font-size:12px;color:var(--accent);cursor:pointer;
  font-weight:700;
}

/* ---------- MATCH CARD ---------- */
.match-card{
  background:var(--panel);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px;
  margin-bottom:12px;transition:.2s;
  position:relative;overflow:hidden;
}
.match-card:hover{border-color:var(--border-2);}
.match-card.live-match::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--live);
  box-shadow:0 0 12px var(--live);
}
.match-top{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;margin-bottom:12px;
}
.match-league{
  display:flex;align-items:center;gap:6px;
  font-size:11px;color:var(--muted);font-weight:700;
  text-transform:uppercase;letter-spacing:.4px;
}
.match-league .sport-ico{font-size:14px;}
.match-status{
  display:flex;align-items:center;gap:5px;
  font-size:11px;font-weight:800;
  padding:4px 9px;border-radius:8px;
  background:var(--panel-2);color:var(--text-2);
}
.match-status.live{
  background:rgba(255,46,77,.14);color:var(--live);
}
.match-status.live .pulse{
  width:6px;height:6px;border-radius:50%;
  background:var(--live);animation:pulse 1.2s infinite;
}
@keyframes pulse{
  0%,100%{opacity:1;transform:scale(1);}
  50%{opacity:.4;transform:scale(.85);}
}

/* ---------- TEAMS ---------- */
.teams-block{
  display:flex;flex-direction:column;gap:8px;
  margin-bottom:12px;padding-bottom:12px;
  border-bottom:1px dashed var(--border);
}
.team-row{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;
}
.team-name{
  font-size:15px;font-weight:700;color:var(--text);
  display:flex;align-items:center;gap:9px;
  flex:1;min-width:0;
}
.team-name .logo{
  width:26px;height:26px;border-radius:7px;
  background:linear-gradient(135deg,var(--panel-3),var(--panel-2));
  border:1px solid var(--border-2);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:900;color:var(--accent);
  flex-shrink:0;
}
.team-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.team-score{
  font-size:20px;font-weight:900;color:#fff;
  min-width:32px;text-align:center;
  font-variant-numeric:tabular-nums;
}
.team-score.live-score{color:var(--accent);}

/* ---------- MARKETS ---------- */
.market-block{margin-bottom:10px;}
.market-block:last-child{margin-bottom:0;}
.market-name{
  font-size:10.5px;color:var(--muted);font-weight:800;
  text-transform:uppercase;letter-spacing:.6px;
  margin-bottom:6px;display:flex;align-items:center;gap:6px;
}
.market-name::after{
  content:"";flex:1;height:1px;
  background:linear-gradient(90deg,var(--border),transparent);
}
.odds-grid{
  display:grid;gap:6px;
  grid-template-columns:repeat(auto-fit,minmax(72px,1fr));
}
.odds-grid.cols-2{grid-template-columns:repeat(2,1fr);}
.odds-grid.cols-3{grid-template-columns:repeat(3,1fr);}
.odds-grid.cols-4{grid-template-columns:repeat(4,1fr);}

.odd-btn{
  background:var(--panel-2);border:1px solid var(--border);
  border-radius:var(--radius-xs);
  padding:9px 6px;text-align:center;cursor:pointer;
  transition:.15s;user-select:none;
  display:flex;flex-direction:column;gap:2px;
  align-items:center;justify-content:center;
  min-height:48px;
}
.odd-btn:hover{
  border-color:var(--accent);
  background:rgba(255,200,61,.06);
  transform:translateY(-1px);
}
.odd-btn:active{transform:scale(.97);}
.odd-btn .lbl{
  font-size:10px;color:var(--muted);font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-width:100%;
}
.odd-btn .val{
  font-size:14px;font-weight:800;color:var(--text);
  font-variant-numeric:tabular-nums;
}
.odd-btn.selected{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  border-color:var(--accent);
  box-shadow:0 4px 14px rgba(255,200,61,.3);
}
.odd-btn.selected .lbl{color:#1a1408;}
.odd-btn.selected .val{color:#1a1408;}
.odd-btn .up{color:var(--green);font-size:9px;font-weight:800;}
.odd-btn .down{color:var(--red);font-size:9px;font-weight:800;}

.match-more{
  display:block;text-align:center;margin-top:10px;
  font-size:12px;color:var(--accent);font-weight:700;
  cursor:pointer;padding:6px;
  border-top:1px dashed var(--border);
  padding-top:10px;
}
.match-more:hover{color:var(--accent-2);}

/* ---------- EMPTY ---------- */
.empty-state{
  text-align:center;color:var(--muted);
  padding:60px 20px;font-size:14px;
}
.empty-state .emoji{font-size:48px;display:block;margin-bottom:12px;opacity:.5;}
.empty-state .title{
  font-size:16px;color:var(--text-2);font-weight:700;margin-bottom:6px;
}
.empty-state .sub{font-size:13px;color:var(--muted-2);}

/* ---------- COUPON ---------- */
.coupon{
  position:fixed;bottom:0;left:0;right:0;z-index:250;
  background:var(--panel);border-top:2px solid var(--accent);
  box-shadow:0 -12px 40px rgba(0,0,0,.6);
  transition:transform .3s cubic-bezier(.4,0,.2,1);
  max-height:80vh;display:flex;flex-direction:column;
  border-radius:20px 20px 0 0;
}
.coupon-bar{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:12px 16px;cursor:pointer;
  user-select:none;
}
.coupon-bar-left{
  display:flex;align-items:center;gap:10px;
  font-size:13px;font-weight:700;color:var(--text-2);
  min-width:0;flex:1;
}
.coupon-icon{
  font-size:20px;
  filter:drop-shadow(0 0 6px rgba(255,200,61,.4));
}
.coupon-count{
  background:var(--accent);color:#1a1408;
  font-size:11px;font-weight:900;
  padding:2px 7px;border-radius:8px;
  min-width:20px;text-align:center;
}
.coupon-odds{
  color:var(--accent);font-weight:900;font-size:15px;
}
.coupon-place{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#1a1408;font-weight:900;
  border:none;padding:11px 20px;border-radius:10px;
  cursor:pointer;font-size:13px;white-space:nowrap;
  transition:.15s;flex-shrink:0;
}
.coupon-place:disabled{
  background:var(--panel-3);color:var(--muted);
  cursor:not-allowed;box-shadow:none;
}
.coupon-place:not(:disabled):hover{transform:translateY(-1px);}

.coupon-body{
  display:none;padding:0 16px 16px;
  overflow-y:auto;max-height:60vh;
  border-top:1px solid var(--border);
}
.coupon.open .coupon-body{display:block;}
.coupon.open{max-height:85vh;}

.bet-type-switch{
  display:flex;gap:6px;padding:12px 0;
  border-bottom:1px solid var(--border);
}
.bet-type-btn{
  flex:1;background:var(--panel-2);border:1px solid var(--border);
  color:var(--muted);padding:9px;border-radius:8px;
  cursor:pointer;font-size:12px;font-weight:700;
  transition:.15s;
}
.bet-type-btn.active{
  background:var(--accent);color:#1a1408;border-color:var(--accent);
}

.coupon-items{max-height:240px;overflow-y:auto;}
.coupon-item{
  display:flex;align-items:flex-start;gap:10px;
  padding:12px 0;border-bottom:1px solid var(--border);
  font-size:13px;
}
.coupon-item .info{flex:1;min-width:0;}
.coupon-item .pick{
  font-weight:700;color:var(--text);
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
}
.coupon-item .pick .pick-badge{
  background:var(--panel-3);color:var(--accent);
  font-size:10px;padding:2px 6px;border-radius:6px;
  font-weight:800;
}
.coupon-item .teams{
  color:var(--muted);font-size:11.5px;
  margin-top:3px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;
}
.coupon-item .market-name-small{
  color:var(--muted-2);font-size:10.5px;margin-top:2px;
  text-transform:uppercase;letter-spacing:.3px;font-weight:700;
}
.coupon-item .coef{
  color:var(--accent);font-weight:900;font-size:14px;
  white-space:nowrap;padding-top:1px;
}
.coupon-item .remove{
  color:var(--muted);cursor:pointer;font-weight:800;
  padding:2px 6px;font-size:16px;line-height:1;
  transition:.15s;
}
.coupon-item .remove:hover{color:var(--red);}

.stake-row{
  display:flex;gap:6px;padding:12px 0 8px;
  flex-wrap:wrap;
}
.stake-input{
  flex:1;min-width:120px;
  background:var(--panel-2);border:1px solid var(--border);
  border-radius:8px;padding:11px 14px;
  color:var(--text);font-size:15px;font-weight:700;
  font-variant-numeric:tabular-nums;
}
.stake-input:focus{outline:none;border-color:var(--accent);}
.stake-quick{
  background:var(--panel-2);border:1px solid var(--border);
  color:var(--text-2);padding:0 12px;border-radius:8px;
  cursor:pointer;font-weight:800;font-size:12px;
  transition:.15s;
}
.stake-quick:hover{border-color:var(--accent);color:var(--accent);}

.coupon-summary{
  background:var(--panel-2);border-radius:10px;
  padding:12px 14px;margin-top:8px;
  display:flex;flex-direction:column;gap:6px;
}
.coupon-summary .row{
  display:flex;justify-content:space-between;
  font-size:12.5px;color:var(--muted);
}
.coupon-summary .row.total{
  border-top:1px solid var(--border);padding-top:8px;
  margin-top:4px;font-size:14px;color:var(--text-2);font-weight:700;
}
.coupon-summary .row.total b{color:var(--accent);font-size:17px;}

.coupon-empty{
  text-align:center;color:var(--muted);
  padding:30px 20px;font-size:13px;
}
.coupon-empty .emoji{font-size:38px;display:block;margin-bottom:8px;opacity:.4;}

/* ---------- MODAL ---------- */
.modal-bg{
  position:fixed;inset:0;z-index:300;
  background:rgba(0,0,0,.8);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  display:none;align-items:flex-end;justify-content:center;
  padding:0;
}
.modal-bg.open{display:flex;}
.modal{
  background:var(--panel);width:100%;max-width:640px;
  border-radius:20px 20px 0 0;
  max-height:90vh;overflow-y:auto;
  padding:20px;
  animation:slideUp .25s cubic-bezier(.4,0,.2,1);
}
@keyframes slideUp{
  from{transform:translateY(30px);opacity:0;}
  to{transform:translateY(0);opacity:1;}
}
.modal-grip{
  width:40px;height:4px;border-radius:4px;
  background:var(--border-2);margin:0 auto 16px;
}
.modal-head{
  display:flex;justify-content:space-between;
  align-items:flex-start;gap:12px;margin-bottom:16px;
}
.modal-title{font-size:18px;font-weight:900;color:#fff;}
.modal-sub{font-size:12px;color:var(--muted);margin-top:4px;}
.modal-close{
  color:var(--muted);cursor:pointer;font-size:24px;
  line-height:1;padding:0 4px;transition:.15s;
}
.modal-close:hover{color:var(--red);}

.modal-score{
  background:
    radial-gradient(circle at 50% 0%,rgba(255,200,61,.12),transparent 70%),
    var(--panel-2);
  border-radius:12px;padding:18px;
  text-align:center;margin-bottom:16px;
  border:1px solid var(--border);
}
.modal-score .big{
  font-size:36px;font-weight:900;color:#fff;
  font-variant-numeric:tabular-nums;letter-spacing:-1px;
}
.modal-score .teams-line{
  display:flex;justify-content:space-between;
  align-items:center;gap:12px;margin-top:8px;
  font-size:12px;color:var(--muted);font-weight:700;
}
.modal-score .live-tag{
  color:var(--live);font-weight:900;
  display:inline-flex;align-items:center;gap:5px;
}

.info-grid{
  display:grid;grid-template-columns:1fr 1fr;
  gap:8px;margin-bottom:16px;
}
.info-cell{
  background:var(--panel-2);border-radius:8px;
  padding:10px 12px;border:1px solid var(--border);
}
.info-cell .lbl{
  font-size:10px;color:var(--muted);
  text-transform:uppercase;font-weight:800;
  letter-spacing:.5px;margin-bottom:3px;
}
.info-cell .val{font-size:13px;font-weight:700;color:var(--text);}

/* ---------- ADMIN ---------- */
.admin-form{display:flex;flex-direction:column;gap:10px;}
.admin-field{display:flex;flex-direction:column;gap:5px;}
.admin-field label{
  font-size:11px;color:var(--muted);
  text-transform:uppercase;font-weight:800;letter-spacing:.5px;
}
.admin-field input,
.admin-field select{
  background:var(--panel-2);border:1px solid var(--border);
  border-radius:8px;padding:11px 14px;
  color:var(--text);font-size:14px;width:100%;
  font-weight:600;
}
.admin-field input:focus,
.admin-field select:focus{outline:none;border-color:var(--accent);}
.admin-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.admin-check{
  display:flex;align-items:center;gap:8px;
  font-size:13px;color:var(--text-2);font-weight:600;
  padding:8px 0;
}
.admin-check input{width:auto;accent-color:var(--accent);}
.admin-submit{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#1a1408;font-weight:900;border:none;
  padding:13px;border-radius:10px;cursor:pointer;
  font-size:14px;margin-top:6px;transition:.15s;
}
.admin-submit:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(255,200,61,.3);}
.admin-danger{
  background:rgba(255,71,87,.12);color:var(--red);
  border:1px solid rgba(255,71,87,.3);
  padding:11px;border-radius:10px;cursor:pointer;
  font-weight:800;font-size:13px;margin-top:8px;
}

/* ---------- FAB ---------- */
.fab{
  position:fixed;bottom:100px;right:16px;
  width:52px;height:52px;border-radius:50%;
  background:linear-gradient(135deg,var(--blue),#2b7be5);
  color:#fff;border:none;font-size:26px;
  cursor:pointer;z-index:180;
  box-shadow:0 8px 24px rgba(74,157,255,.45);
  display:flex;align-items:center;justify-content:center;
  transition:.2s;
}
.fab:hover{transform:scale(1.08);}
.fab:active{transform:scale(.95);}

/* ---------- TOAST ---------- */
.toast{
  position:fixed;top:80px;left:50%;
  transform:translateX(-50%) translateY(-20px);
  background:var(--panel-3);color:var(--text);
  padding:12px 20px;border-radius:12px;
  font-size:13px;font-weight:700;z-index:400;
  box-shadow:var(--shadow);border:1px solid var(--border-2);
  opacity:0;pointer-events:none;transition:.3s;
  max-width:90vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.success{background:var(--green);color:#062;border-color:var(--green);}
.toast.error{background:var(--red);color:#fff;border-color:var(--red);}
.toast.info{background:var(--blue);color:#fff;border-color:var(--blue);}

/* ---------- BOTTOM NAV ---------- */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(15,20,27,.96);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--border);
  display:flex;z-index:220;
  padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));
}
.nav-item{
  flex:1;display:flex;flex-direction:column;
  align-items:center;gap:3px;
  color:var(--muted);font-size:10px;
  font-weight:700;cursor:pointer;
  padding:6px 0;transition:.15s;position:relative;
}
.nav-item .ico{font-size:20px;line-height:1;}
.nav-item.active{color:var(--accent);}
.nav-item:hover{color:var(--text-2);}
.nav-item .nav-badge{
  position:absolute;top:2px;right:calc(50% - 22px);
  background:var(--live);color:#fff;
  font-size:9px;font-weight:900;
  min-width:16px;height:16px;padding:0 4px;
  border-radius:8px;display:flex;
  align-items:center;justify-content:center;
}

/* ---------- HISTORY MODAL ---------- */
.history-item{
  background:var(--panel-2);border-radius:10px;
  padding:12px 14px;margin-bottom:8px;
  border:1px solid var(--border);
}
.history-top{
  display:flex;justify-content:space-between;
  align-items:center;margin-bottom:6px;
  font-size:12px;color:var(--muted);font-weight:700;
}
.history-status{
  padding:2px 8px;border-radius:6px;font-size:10px;
  font-weight:900;text-transform:uppercase;
}
.history-status.win{background:rgba(38,208,124,.15);color:var(--green);}
.history-status.lose{background:rgba(255,71,87,.15);color:var(--red);}
.history-status.pending{background:rgba(255,200,61,.15);color:var(--accent);}
.history-pick{font-size:13px;font-weight:700;color:var(--text);margin-bottom:3px;}
.history-teams{font-size:11.5px;color:var(--muted);}
.history-bottom{
  display:flex;justify-content:space-between;
  margin-top:8px;padding-top:8px;
  border-top:1px dashed var(--border);
  font-size:12px;color:var(--text-2);font-weight:700;
}
.history-bottom .amount{color:var(--green);font-weight:900;}
.history-bottom .amount.negative{color:var(--red);}

/* ---------- LOGIN ---------- */
.login-tabs{
  display:flex;gap:6px;margin-bottom:16px;
  background:var(--panel-2);padding:4px;border-radius:10px;
}
.login-tab{
  flex:1;padding:9px;text-align:center;
  border-radius:8px;cursor:pointer;
  font-size:13px;font-weight:700;color:var(--muted);
  transition:.15s;
}
.login-tab.active{background:var(--accent);color:#1a1408;}

/* ---------- SKELETON ---------- */
.skeleton{
  background:linear-gradient(90deg,var(--panel) 0%,var(--panel-2) 50%,var(--panel) 100%);
  background-size:200% 100%;
  animation:shimmer 1.5s infinite;
  border-radius:var(--radius);
  height:180px;margin-bottom:12px;
}
@keyframes shimmer{
  0%{background-position:200% 0;}
  100%{background-position:-200% 0;}
}

/* ---------- RESPONSIVE ---------- */
@media (min-width:640px){
  .modal-bg{align-items:center;padding:20px;}

  .hero{margin-left:20px;margin-right:20px;}
  .search-wrap{margin-left:20px;margin-right:20px;}
  .sort-bar{padding-left:20px;padding-right:20px;}
  main{padding:0 20px;}
}
@media (max-width:380px){

  .hero-title{font-size:20px;}
  .odd-btn{padding:7px 4px;min-height:44px;}
  .odd-btn .val{font-size:13px;}
}

  currentSport:'all',
  currentFilter:'all',
  searchQuery:'',
  sort:'default',
  coupon:[],
  betType:'single',
  balance:10000,
  user:null,
  history:[],

const sportIconMap = {
  football:'⚽', basketball:'🏀', hockey:'🏒',

  volleyball:'🏐', tabletennis:'🏓', esports:'⚔️'

/* ============================================================
   LOCALSTORAGE
   ============================================================ */
function saveState(){
  try{
    localStorage.setItem('betzone_state', JSON.stringify({
      balance: state.balance,
      coupon: state.coupon,
      betType: state.betType,
      user: state.user,
      history: state.history,
      customEvents: EVENTS.filter(e=>e.custom)
    }));
  }catch(e){ console.warn('LS error', e); }
}
function loadState(){
  try{
    const raw = localStorage.getItem('betzone_state');
    if(!raw) return;
    const data = JSON.parse(raw);
    if(data.balance !== undefined) state.balance = data.balance;
    if(data.coupon) state.coupon = data.coupon;
    if(data.betType) state.betType = data.betType;
    if(data.user) state.user = data.user;
    if(data.history) state.history = data.history;
    if(data.customEvents && Array.isArray(data.customEvents)){
      data.customEvents.forEach(e=>EVENTS.push(e));
    }
  }catch(e){ console.warn('LS load error', e); }
}

   РЕНДЕР: СПОРТИВНЫЕ ТАБЫ

function renderSportsTabs(){
  const box = document.getElementById('sportsTabs');
  box.innerHTML = SPORTS.map(s=>{

      if(total) badge = `<span class="badge">${total}</span>`;
    } else if(liveCount>0){
      badge = `<span class="badge">${liveCount}</span>`;
    }
    return `<div class="sport-tab ${state.currentSport===s.id?'active':''}" data-sport="${s.id}" onclick="setSport('${s.id}')">
      <span class="icon">${s.icon}</span>

function renderFilters(){

/* ============================================================
   РЕНДЕР: МАТЧИ
   ============================================================ */
function renderMatches(){
  const box = document.getElementById('matches');
  let list = EVENTS.slice();

  // фильтр по спорту
  if(state.currentSport==='live'){
    list = list.filter(e=>e.live);
  } else if(state.currentSport!=='all'){
    list = list.filter(e=>e.sport===state.currentSport);
  }

  // фильтр chips
  if(state.currentFilter==='live') list = list.filter(e=>e.live);
  else if(state.currentFilter==='today') list = list.filter(e=>e.date==='сегодня');
  else if(state.currentFilter==='tomorrow') list = list.filter(e=>e.date==='завтра');
  else if(state.currentFilter==='top') list = list.filter(e=>e.popular);
  else if(state.currentFilter==='high'){
    list = list.filter(e=>{
      const all = Object.values(e.markets).flatMap(m=>m.val);
      return Math.max(...all) >= 5;
    });
  }

  // поиск
  if(state.searchQuery){
    const q = state.searchQuery.toLowerCase();
    list = list.filter(e=>
      e.home.toLowerCase().includes(q) ||
      e.away.toLowerCase().includes(q) ||
      e.league.toLowerCase().includes(q)
    );
  }

  // сортировка
  if(state.sort==='live'){
    list.sort((a,b)=> (b.live?1:0) - (a.live?1:0));
  } else if(state.sort==='odds'){
    list.sort((a,b)=>{
      const maxA = Math.max(...Object.values(a.markets).flatMap(m=>m.val));
      const maxB = Math.max(...Object.values(b.markets).flatMap(m=>m.val));
      return maxB - maxA;
    });
  } else if(state.sort==='time'){
    list.sort((a,b)=>{
      const p = s => s==='сегодня'?1 : s==='завтра'?2 : 3;
      return p(a.date) - p(b.date);
    });
  }

  // счётчик
  document.getElementById('resultsCount').textContent = `${list.length} событий`;

  // пусто
  if(!list.length){
    box.innerHTML = `<div class="empty-state">
      <span class="emoji">🔍</span>
      <div class="title">Ничего не найдено</div>
      <div class="sub">Попробуйте изменить фильтр или поиск</div>
    </div>`;
    return;
  }

  // рендер карточек
  box.innerHTML = list.map(renderMatchCard).join('');
}

function renderMatchCard(e){
  const icon = sportIconMap[e.sport] || '🏆';
  const liveClass = e.live ? 'live-match' : '';

  const statusHTML = e.live
    ? `<div class="match-status live"><span class="pulse"></span>LIVE · ${e.minute}</div>`
    : `<div class="match-status">${e.minute}</div>`;

  const showScore = e.live;
  const homeScore = showScore ? `<div class="team-score live-score">${e.hs}</div>` : '';
  const awayScore = showScore ? `<div class="team-score live-score">${e.as}</div>` : '';

  const initial = n => n.trim().charAt(0).toUpperCase();

  let marketsHTML = '';
  let cnt = 0;
  for(const [name, m] of Object.entries(e.markets)){
    if(cnt >= 3) break; // показываем 3 рынка в карточке
    const cols = m.cols || 2;
    marketsHTML += `<div class="market-block">
      <div class="market-name">${name}</div>
      <div class="odds-grid cols-${cols}">
        ${m.lbl.map((l,i)=>{
          const key = `${e.id}::${name}::${l}::${m.val[i]}`;
          const selected = state.coupon.find(c=>c.key===key);
          return `<div class="odd-btn ${selected?'selected':''}"
                    onclick="event.stopPropagation();toggleBet('${escapeKey(key)}','${escapeKey(name)}','${escapeKey(l)}',${m.val[i]})">
            <span class="lbl">${l}</span>
            <span class="val">${m.val[i].toFixed(2)}</span>
          </div>`;
        }).join('')}
      </div>
    </div>`;
    cnt++;
  }

  const moreMarkets = Object.keys(e.markets).length > 3
    ? `<div class="match-more" onclick="openMatch(${e.id})">Все рынки (${Object.keys(e.markets).length}) →</div>`
    : `<div class="match-more" onclick="openMatch(${e.id})">Подробнее о матче →</div>`;

  return `<div class="match-card ${liveClass}">
    <div class="match-top">
      <div class="match-league">
        <span class="sport-ico">${icon}</span>
        <span>${e.league}</span>
      </div>
      ${statusHTML}
    </div>
    <div class="teams-block">
      <div class="team-row">
        <div class="team-name">
          <div class="logo">${initial(e.home)}</div>
          <span>${e.home}</span>
        </div>
        ${homeScore}
      </div>
      <div class="team-row">
        <div class="team-name">
          <div class="logo">${initial(e.away)}</div>
          <span>${e.away}</span>
        </div>
        ${awayScore}
      </div>
    </div>
    ${marketsHTML}
    ${moreMarkets}
  </div>`;
}

function escapeKey(s){ return s.replace(/'/g,"\\'"); }

/* ============================================================
   КУПОН
   ============================================================ */
function toggleBet(key, marketName, pick, odds){
  const idx = state.coupon.findIndex(c=>c.key===key);
  if(idx > -1){
    state.coupon.splice(idx,1);
  } else {
    if(state.betType==='single'){
      // одиночная — заменяем
      state.coupon = [{key, marketName, pick, odds}];
    } else {
      // экспресс / система — до 20 событий, без дублей по событию
      const eventId = key.split('::')[0];
      const sameEvent = state.coupon.find(c => c.key.split('::')[0]===eventId);
      if(sameEvent){
        toast('В экспрессе только одна ставка на событие','error');
        return;
      }
      if(state.coupon.length >= 20){
        toast('Максимум 20 событий в купоне','error');
        return;
      }
      state.coupon.push({key, marketName, pick, odds});
    }
  }
  updateCoupon();
  renderMatches();
  saveState();
  if(state.coupon.length > 0) toggleCoupon(true);
}

function removeBet(key){
  state.coupon = state.coupon.filter(c=>c.key!==key);
  updateCoupon();
  renderMatches();
  saveState();
}

function setBetType(type){
  state.betType = type;
  document.querySelectorAll('.bet-type-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.type===type);
  });
  if(type==='single' && state.coupon.length>1){
    state.coupon = [state.coupon[state.coupon.length-1]];
  }
  updateCoupon();
  renderMatches();
  saveState();
}

function setStake(v){
  document.getElementById('stakeInput').value = v;
  updateCoupon();
}

function updateCoupon(){
  const n = state.coupon.length;
  document.getElementById('couponCount').textContent = n;

  // общий коэффициент
  let totalOdds = 0;
  if(state.betType==='single'){
    totalOdds = n ? state.coupon[0].odds : 0;
  } else {
    totalOdds = n ? state.coupon.reduce((a,c)=>a*c.odds,1) : 0;
  }
  document.getElementById('couponOdds').textContent = totalOdds.toFixed(2);
  document.getElementById('sumOdds').textContent = totalOdds.toFixed(2);

  // элементы купона
  const items = document.getElementById('couponItems');
  if(!n){
    items.innerHTML = `<div class="coupon-empty">
      <span class="emoji">🎟️</span>
      Купон пуст.<br>Выберите коэффициент в линии.
    </div>`;
  } else {
    items.innerHTML = state.coupon.map(c=>{
      const [evId, marketName, pick] = c.key.split('::');
      const ev = EVENTS.find(e=>e.id==evId);
      const title = ev ? `${ev.home} — ${ev.away}` : '';
      const sport = ev ? sportIconMap[ev.sport] : '🏆';
      return `<div class="coupon-item">
        <div class="info">
          <div class="pick">
            <span class="pick-badge">${sport}</span>
            <span>${c.pick}</span>
          </div>
          <div class="teams">${title}</div>
          <div class="market-name-small">${marketName}</div>
        </div>
        <div class="coef">${c.odds.toFixed(2)}</div>
        <span class="remove" onclick="removeBet('${escapeKey(c.key)}')">✕</span>
      </div>`;
    }).join('');
  }

  // сумма ставки
  const stake = parseFloat(document.getElementById('stakeInput').value) || 0;
  document.getElementById('sumStake').textContent = stake.toFixed(0) + ' ₽';

  // потенциальный выигрыш
  let potential = 0;
  if(n && stake >= 10){
    potential = stake * totalOdds;
  }
  document.getElementById('sumPotential').textContent = potential.toFixed(0) + ' ₽';

  // кнопка
  const btn = document.getElementById('placeBtn');
  btn.disabled = !n || stake < 10 || stake > state.balance;

  // нав-бейдж
  const nb = document.getElementById('couponNavBadge');
  if(n){ nb.style.display='flex'; nb.textContent = n; }
  else nb.style.display = 'none';

  // бэйдж Live
  const liveCount = EVENTS.filter(e=>e.live).length;
  document.getElementById('liveBadge').textContent = liveCount;
}

function toggleCoupon(force){
  const c = document.getElementById('coupon');
  if(force) c.classList.add('open');
  else c.classList.toggle('open');
}

function placeBet(e){
  if(e) e.stopPropagation();
  const stake = parseFloat(document.getElementById('stakeInput').value) || 0;
  if(stake < 10){ toast('Минимальная ставка 10 ₽','error'); return; }
  if(stake > state.balance){ toast('Недостаточно средств','error'); return; }
  if(!state.coupon.length){ toast('Купон пуст','error'); return; }

  let totalOdds = state.betType==='single'
    ? state.coupon[0].odds
    : state.coupon.reduce((a,c)=>a*c.odds,1);
  const potential = stake * totalOdds;

  // списываем
  state.balance -= stake;
  updateBalanceUI();

  // пишем в историю
  state.history.unshift({
    id: Date.now(),
    type: state.betType,
    stake,
    odds: totalOdds,
    potential,
    status: 'pending',
    createdAt: new Date().toISOString(),
    bets: state.coupon.map(c=>({...c}))
  });

  toast(`✅ Ставка ${stake} ₽ принята!`, 'success');

  state.coupon = [];
  updateCoupon();
  renderMatches();
  saveState();

  // Симуляция результата через 8 сек
  const histId = state.history[0].id;
  setTimeout(()=>{
    const item = state.history.find(h=>h.id===histId);
    if(!item) return;
    const win = Math.random() > 0.45;
    item.status = win ? 'win' : 'lose';
    if(win){
      state.balance += item.potential;
      updateBalanceUI();
      toast(`🎉 Выигрыш! +${item.potential.toFixed(0)} ₽`, 'success');
    } else {
      toast(`😔 Ставка проиграла`, 'error');
    }
    saveState();
  }, 8000);
}

/* ============================================================
   БАЛАНС
   ============================================================ */
function updateBalanceUI(){
  document.getElementById('balancePill').textContent =
    state.balance.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' ₽';
}

   ============================================================ */
function openMatch(id){
  const e = EVENTS.find(x=>x.id===id);
  if(!e) return;

  const icon = sportIconMap[e.sport] || '🏆';
  const statusHTML = e.live
    ? `<span class="live-tag"><span class="pulse" style="display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--live);animation:pulse 1.2s infinite;"></span>LIVE · ${e.minute}</span>`
    : e.minute;

  let marketsHTML = '';
  for(const [name, m] of Object.entries(e.markets)){
    const cols = m.cols || 2;
    marketsHTML += `<div class="market-block">
      <div class="market-name">${name}</div>
      <div class="odds-grid cols-${cols}">
        ${m.lbl.map((l,i)=>{
          const key = `${e.id}::${name}::${l}::${m.val[i]}`;
          const selected = state.coupon.find(c=>c.key===key);
          return `<div class="odd-btn ${selected?'selected':''}"
                    onclick="toggleBet('${escapeKey(key)}','${escapeKey(name)}','${escapeKey(l)}',${m.val[i]})">
            <span class="lbl">${l}</span>
            <span class="val">${m.val[i].toFixed(2)}</span>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }

  const html = `
    <div class="modal-grip"></div>
    <div class="modal-head">
      <div>
        <div class="modal-title">${icon} ${e.home} — ${e.away}</div>
        <div class="modal-sub">${e.league}</div>
      </div>
      <span class="modal-close" onclick="closeModal()">✕</span>
    </div>

    <div class="modal-score">
      ${e.live
        ? `<div class="big">${e.hs} : ${e.as}</div>
           <div class="teams-line">
             <span>${e.home}</span>
             <span>${statusHTML}</span>
             <span>${e.away}</span>
           </div>`
        : `<div class="big" style="font-size:22px;">Матч ещё не начался</div>
           <div class="teams-line" style="justify-content:center;">
             <span>${statusHTML}</span>
           </div>`}
    </div>

    <div class="info-grid">
      <div class="info-cell"><div class="lbl">Вид спорта</div><div class="val">${icon} ${e.sport}</div></div>
      <div class="info-cell"><div class="lbl">Дата</div><div class="val">${e.date}</div></div>
      <div class="info-cell"><div class="lbl">Турнир</div><div class="val">${e.league}</div></div>
      <div class="info-cell"><div class="lbl">Статус</div><div class="val">${e.live?'🔴 LIVE':'⏰ Ожидание'}</div></div>
    </div>

    <div class="section-head"><div class="section-title"><span class="dot"></span>Рынки</div></div>
    ${marketsHTML}
  `;

  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalBg').classList.add('open');
}

function closeModal(){
  document.getElementById('modalBg').classList.remove('open');
}

    hockey:{'Победитель':{cols:3,lbl:['1','X','2'],val:[o1,4.00,o2]},'Тотал 5.5':{cols:2,lbl:['Больше','Меньше'],val:[1.90,1.90]}},
    mma:{'Победитель':{cols:2,lbl:['1','2'],val:[o1,o2]},'Тотал раундов 2.5':{cols:2,lbl:['Больше','Меньше'],val:[1.85,1.95]}},
    tennis:{'Победитель':{cols:2,lbl:['1','2'],val:[o1,o2]},'Тотал 22.5':{cols:2,lbl:['Больше','Меньше'],val:[1.90,1.90]}},
    cyber:{'Победитель':{cols:2,lbl:['1','2'],val:[o1,o2]},'Тотал 2.5 карт':{cols:2,lbl:['Больше','Меньше'],val:[2.00,1.80]}},
    volleyball:{'Победитель':{cols:2,lbl:['1','2'],val:[o1,o2]},'Тотал 3.5 партии':{cols:2,lbl:['Больше','Меньше'],val:[1.75,2.05]}},
  };

  EVENTS.push({
    id: Date.now(),
    sport, live, minute: live ? "1'" : minute,
    league, home, away, date,
    hs: 0, as: 0,
    custom: true,
    markets: defaults[sport]
  });

  closeModal();
  renderMatches();
  renderSportsTabs();
  updateCoupon();
  saveState();
  toast('✅ Событие добавлено','success');
}

function clearCustom(){
  EVENTS = EVENTS.filter(e=>!e.custom);
  state.coupon = [];
  updateCoupon();
  renderMatches();
  renderSportsTabs();
  saveState();
  toast('🗑 Все добавленные удалены','info');
  closeModal();
}

/* ============================================================
   ПРОФИЛЬ / АВТОРИЗАЦИЯ
   ============================================================ */
function openProfile(){
  if(state.user){
    const html = `
      <div class="modal-grip"></div>
      <div class="modal-head">
        <div>
          <div class="modal-title">👤 ${state.user.name}</div>
          <div class="modal-sub">${state.user.email}</div>
        </div>
        <span class="modal-close" onclick="closeModal()">✕</span>
      </div>
      <div class="info-grid">
        <div class="info-cell"><div class="lbl">Баланс</div><div class="val" style="color:var(--green);">${state.balance.toFixed(0)} ₽</div></div>
        <div class="info-cell"><div class="lbl">Ставок</div><div class="val">${state.history.length}</div></div>
        <div class="info-cell"><div class="lbl">Побед</div><div class="val" style="color:var(--green);">${state.history.filter(h=>h.status==='win').length}</div></div>
        <div class="info-cell"><div class="lbl">Проигрышей</div><div class="val" style="color:var(--red);">${state.history.filter(h=>h.status==='lose').length}</div></div>
      </div>
      <button class="admin-submit" onclick="deposit(5000)">💰 Пополнить на 5000 ₽</button>
      <button class="admin-danger" onclick="logout()">🚪 Выйти</button>
    `;
    document.getElementById('modalContent').innerHTML = html;
    document.getElementById('modalBg').classList.add('open');
  } else {
    const html = `
      <div class="modal-grip"></div>
      <div class="modal-head">
        <div>
          <div class="modal-title">👤 Вход / Регистрация</div>
          <div class="modal-sub">Демо-режим · данные не отправляются</div>
        </div>
        <span class="modal-close" onclick="closeModal()">✕</span>
      </div>
      <div class="admin-form">
        <div class="admin-field">
          <label>Имя</label>
          <input id="lName" placeholder="Ваше имя" value="Игрок">
        </div>
        <div class="admin-field">
          <label>Email</label>
          <input id="lEmail" placeholder="you@example.com" value="player@betzone.demo">
        </div>
        <button class="admin-submit" onclick="doLogin()">Войти</button>
      </div>
    `;
    document.getElementById('modalContent').innerHTML = html;
    document.getElementById('modalBg').classList.add('open');
  }
}

function doLogin(){
  const name = document.getElementById('lName').value.trim() || 'Игрок';
  const email = document.getElementById('lEmail').value.trim() || 'player@betzone.demo';
  state.user = { name, email };
  document.getElementById('avatar').textContent = name.charAt(0).toUpperCase();
  document.getElementById('avatar').classList.add('logged');
  closeModal();
  toast(`👋 Добро пожаловать, ${name}!`, 'success');
  saveState();
}

function logout(){
  state.user = null;
  document.getElementById('avatar').textContent = 'U';
  document.getElementById('avatar').classList.remove('logged');
  closeModal();
  toast('Вы вышли', 'info');
  saveState();
}

/* ---------- ДЕПОЗИТ ---------- */
function openDeposit(){ deposit(1000); }

function deposit(amount){
  state.balance += amount;
  updateBalanceUI();
  toast(`💰 Баланс пополнен на ${amount} ₽`, 'success');
  saveState();
  if(document.getElementById('modalBg').classList.contains('open')){
    if(state.user) openProfile();
    else closeModal();
  }
}

/* ============================================================
   ИСТОРИЯ
   ============================================================ */
function openHistory(){
  const html = `
    <div class="modal-grip"></div>
    <div class="modal-head">
      <div>
        <div class="modal-title">📜 История ставок</div>
        <div class="modal-sub">Всего: ${state.history.length}</div>
      </div>
      <span class="modal-close" onclick="closeModal()">✕</span>
    </div>
    ${state.history.length === 0
      ? `<div class="empty-state">
           <span class="emoji">📭</span>
           <div class="title">Ставок пока нет</div>
           <div class="sub">Сделайте первую ставку в линии</div>
         </div>`
      : state.history.map(h=>{
          const statusLabel = {
            win:'Выигрыш', lose:'Проигрыш', pending:'В игре'
          }[h.status];
          const time = new Date(h.createdAt).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
          const date = new Date(h.createdAt).toLocaleDateString('ru-RU');
          const typeLabel = {single:'Одиночная', express:'Экспресс', system:'Система'}[h.type];
          return `<div class="history-item">
            <div class="history-top">
              <span>${date} · ${time} · ${typeLabel}</span>
              <span class="history-status ${h.status}">${statusLabel}</span>
            </div>
            ${h.bets.map(b=>{
              const [evId, marketName, pick] = b.key.split('::');
              const ev = EVENTS.find(e=>e.id==evId);
              const title = ev ? `${ev.home} — ${ev.away}` : 'Матч';
              return `<div class="history-pick">${b.pick} · ${marketName}</div>
                      <div class="history-teams">${title}</div>`;
            }).join('')}
            <div class="history-bottom">
              <span>Ставка: ${h.stake.toFixed(0)} ₽ · Коэф: ${h.odds.toFixed(2)}</span>
              <span class="amount ${h.status==='lose'?'negative':''}">
                ${h.status==='win'? '+'+h.potential.toFixed(0)+' ₽'
                  : h.status==='lose'? '-'+h.stake.toFixed(0)+' ₽'
                  : h.potential.toFixed(0)+' ₽'}
              </span>
            </div>
          </div>`;
        }).join('')}
  `;
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalBg').classList.add('open');
}

/* ============================================================
   НИЖНЯЯ НАВИГАЦИЯ
   ============================================================ */
function navTo(section){
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.querySelector(`.nav-item[data-nav="${section}"]`).classList.add('active');

  if(section==='line'){ closeModal(); toggleCoupon(false); window.scrollTo({top:0,behavior:'smooth'}); }
  if(section==='live'){ setSport('live'); closeModal(); toggleCoupon(false); window.scrollTo({top:0,behavior:'smooth'}); }
  if(section==='coupon'){ toggleCoupon(true); }
  if(section==='history'){ openHistory(); }
  if(section==='profile'){ openProfile(); }
}

/* ============================================================
   TOAST
   ============================================================ */
let toastTimer;
function toast(msg, type){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' '+type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 2600);
}

/* ============================================================
   LIVE-ОБНОВЛЕНИЕ СЧЁТА
   ============================================================ */
setInterval(()=>{
  let changed = false;
  EVENTS.forEach(e=>{
    if(!e.live) return;
    if(e.sport==='football'){
      if(Math.random() < 0.06){
        if(Math.random()<0.5) e.hs++; else e.as++;
        const m = parseInt(e.minute)||1;
        e.minute = Math.min(90, m+1) + "'";
        changed = true;
      } else if(Math.random() < 0.4){
        const m = parseInt(e.minute)||1;
        e.minute = Math.min(90, m+1) + "'";
        changed = true;
      }
    }
    if(e.sport==='basketball' && Math.random() < 0.35){
      if(Math.random()<0.5) e.hs += 2 + Math.floor(Math.random()*2);
      else e.as += 2 + Math.floor(Math.random()*2);
      changed = true;
    }
    if(e.sport==='hockey' && Math.random() < 0.1){
      if(Math.random()<0.5) e.hs++; else e.as++;
      changed = true;
    }
  });
  if(changed){
    renderMatches();
    updateCoupon();
  }
}, 5000);

/* ============================================================
   ИНИЦИАЛИЗАЦИЯ
   ============================================================ */
function init(){
  loadState();
  updateBalanceUI();
  if(state.user){
    document.getElementById('avatar').textContent = state.user.name.charAt(0).toUpperCase();
    document.getElementById('avatar').classList.add('logged');
  }
  document.querySelectorAll('.bet-type-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.type===state.betType);
  });
  renderSportsTabs();
  renderFilters();
  renderMatches();
  updateCoupon();
}

init();
</script>
