<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b0b12">
<meta name="description" content="OpenBet — симулятор букмекерской платформы с live-кэфами">
<title>⚡ OpenBet — Live Betting Platform</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}

:root{
  --bg:#0b0b12;--bg2:#131320;--bg3:#1a1a2a;
  --card:#181826;--card-hover:#1e1e30;--card-active:#242438;
  --border:rgba(90,90,130,.15);--border-2:rgba(110,110,160,.3);
  --text:#fff;--text-2:#b8b8d0;--muted:#6e6e88;
  --accent:#7b5cff;--accent-2:#00d4ff;
  --green:#00e676;--red:#ff3860;--gold:#ffb800;--orange:#ff9500;
  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:20px;
}

body.light{
  --bg:#f5f6fa;--bg2:#ebeef5;--bg3:#e2e6f0;
  --card:#fff;--card-hover:#f8f9fc;--card-active:#f0f2f7;
  --border:rgba(90,90,130,.12);--border-2:rgba(90,90,130,.25);
  --text:#0e0e1c;--text-2:#4a4a60;--muted:#8585a0;
}

html{scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  transition:background .3s,color .3s;
}
body.has-coupon{padding-bottom:130px}

/* ============ HEADER ============ */
.header{
  position:sticky;top:0;z-index:100;
  background:var(--bg);border-bottom:1px solid var(--border);
  padding:12px 16px;backdrop-filter:blur(20px);
}
.header-inner{
  max-width:1240px;margin:0 auto;
  display:flex;justify-content:space-between;align-items:center;gap:12px
}
.logo{
  font-size:19px;font-weight:900;letter-spacing:-.4px;
  cursor:pointer;white-space:nowrap;user-select:none;
  display:flex;align-items:center;gap:8px;
}
.logo-icon{
  width:28px;height:28px;border-radius:8px;
  background:linear-gradient(135deg,#7b5cff,#00d4ff);
  display:flex;align-items:center;justify-content:center;
  font-size:15px;
}
.logo span{
  background:linear-gradient(135deg,#7b5cff,#00d4ff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.header-actions{display:flex;align-items:center;gap:6px}
.balance{
  background:var(--card);border:1px solid var(--border);
  padding:8px 14px;border-radius:var(--r-md);
  font-weight:800;font-size:13px;
  display:flex;align-items:center;gap:6px;
  font-variant-numeric:tabular-nums;cursor:pointer;user-select:none;
  transition:border-color .2s,box-shadow .2s;white-space:nowrap;
}
.balance:hover{border-color:var(--accent);transform:translateY(-1px)}
.balance.flash-bonus{border-color:var(--gold);box-shadow:0 0 24px rgba(255,184,0,.4)}
.balance.flash-win{border-color:var(--green);box-shadow:0 0 20px rgba(0,230,118,.4)}
.balance.flash-lose{border-color:var(--red);box-shadow:0 0 20px rgba(255,56,96,.4)}
.icon-btn{
  width:38px;height:38px;border-radius:var(--r-md);
  background:var(--card);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-size:15px;transition:all .15s;
}
.icon-btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.icon-btn:active{transform:translateY(0) scale(.96)}
.icon-btn.muted{opacity:.5}

/* ============ CONTAINER ============ */
.container{max-width:1240px;margin:0 auto;padding:16px}

/* ============ NAV TABS ============ */
.nav-tabs{
  display:flex;gap:6px;margin-bottom:14px;
  overflow-x:auto;padding-bottom:2px;scrollbar-width:none;
}
.nav-tabs::-webkit-scrollbar{display:none}
.nav-tab{
  padding:9px 16px;background:var(--card);border:1px solid var(--border);
  border-radius:var(--r-md);font-weight:700;color:var(--muted);
  font-size:13px;white-space:nowrap;transition:all .15s;
  display:flex;align-items:center;gap:6px;
}
.nav-tab:hover{color:var(--text)}
.nav-tab.active{color:var(--text);border-color:var(--accent);background:rgba(123,92,255,.1)}

/* ============ SESSION ============ */
.session{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--r-md);padding:12px 16px;margin-bottom:14px;
  display:flex;gap:18px;align-items:center;flex-wrap:wrap;font-size:12.5px
}
.session .label{color:var(--muted);font-weight:600}
.session .value{font-weight:800;font-variant-numeric:tabular-nums}
.session .value.green{color:var(--green)}
.session .value.red{color:var(--red)}
.session .value.gold{color:var(--gold)}
.session .spacer{margin-left:auto}
.bonus-hint{font-size:11.5px;color:var(--gold);font-weight:700;animation:bp 2s infinite}
@keyframes bp{0%,100%{opacity:1}50%{opacity:.55}}

/* ============ SPORT FILTERS ============ */
.sport-filters{
  display:flex;gap:6px;margin-bottom:14px;
  overflow-x:auto;padding-bottom:2px;scrollbar-width:none;
}
.sport-filters::-webkit-scrollbar{display:none}
.sport-chip{
  padding:9px 16px;background:var(--card);border:1px solid var(--border);
  border-radius:var(--r-md);font-weight:700;color:var(--muted);
  font-size:13px;white-space:nowrap;transition:all .15s;
  display:flex;align-items:center;gap:6px;
}
.sport-chip:hover{color:var(--text)}
.sport-chip.active{color:var(--text);border-color:var(--accent);background:rgba(123,92,255,.1)}

/* ============ MATCH CARD ============ */
.matches-list{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:900px){.matches-list{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1300px){.matches-list{grid-template-columns:repeat(3,1fr)}}

.match{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--r-lg);padding:18px;
  display:flex;flex-direction:column;gap:14px;
  transition:border-color .15s;position:relative;
}
.match:hover{border-color:var(--border-2)}
.match.finished{opacity:.55}
.match.ufc-live{border-left:3px solid var(--red)}

.match-head{display:flex;align-items:center;gap:10px}
.match-sport{font-size:16px}
.match-league{
  font-size:11px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.5px;font-weight:700;flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}
.match-status{
  font-size:10px;padding:4px 10px;border-radius:6px;
  font-weight:800;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap
}
.match-status.live{background:var(--red);color:#fff}
.match-status.live::before{content:'●';margin-right:4px;font-size:8px}
.match-status.break{background:var(--gold);color:#000}
.match-status.finished{background:rgba(120,120,140,.25);color:var(--muted)}
.match-status.countdown{background:var(--accent-2);color:#000}

/* Teams */
.teams{display:flex;flex-direction:column;gap:10px}
.team-line{display:flex;align-items:center;justify-content:space-between;gap:10px}
.team-info{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.team-logo-wrap{position:relative;flex-shrink:0}
.team-logo{
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:13px;color:#fff;
  border:2px solid rgba(255,255,255,.1);
}
.team-logo.scored{animation:avScore 1s ease}
@keyframes avScore{0%,100%{transform:scale(1)}40%{transform:scale(1.35);box-shadow:0 0 20px var(--green)}}
.team-rating{
  position:absolute;top:-3px;right:-3px;
  background:var(--bg);border:1px solid var(--border);
  border-radius:5px;font-size:9px;font-weight:800;
  padding:1px 5px;color:var(--accent-2);
}
.team-flag{
  position:absolute;bottom:-3px;right:-3px;font-size:13px;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))
}
.team-name{
  font-weight:700;font-size:15px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}
.team-score{
  font-weight:900;font-size:26px;font-variant-numeric:tabular-nums;
  letter-spacing:-1px;min-width:32px;text-align:right;
  transition:transform .3s,color .3s;
}
.team-score.scored{animation:scFlash 1s ease}
@keyframes scFlash{0%,100%{transform:scale(1)}30%{transform:scale(1.5);text-shadow:0 0 20px var(--green)}}

/* Match info */
.match-info{
  display:flex;align-items:center;gap:10px;font-size:12px;
  color:var(--muted);padding:8px 0;
  border-top:1px solid var(--border);border-bottom:1px solid var(--border);
}
.match-info .time{font-weight:700;color:var(--text-2);font-variant-numeric:tabular-nums}
.match-info .period{font-weight:600}

/* Progress */
.progress{display:flex;gap:3px;height:4px}
.progress-seg{
  flex:1;background:rgba(120,120,160,.18);
  border-radius:2px;overflow:hidden;position:relative;
}
.progress-seg.done{background:var(--green)}
.progress-seg.active::after{
  content:'';position:absolute;left:0;top:0;bottom:0;
  width:var(--p,0%);
  background:linear-gradient(90deg,var(--accent),var(--accent-2));
}

/* UFC Result */
.ufc-result{
  background:linear-gradient(135deg,rgba(255,184,0,.12),rgba(255,56,96,.05));
  border:1px solid rgba(255,184,0,.35);
  border-radius:var(--r-md);padding:12px;
  font-size:12.5px;font-weight:700;line-height:1.5
}
.ufc-result .win{color:var(--gold);font-weight:800}

/* Odds */
.odds-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.odds-row.two-col{grid-template-columns:1fr 1fr}
.odd-btn{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--r-md);padding:12px 8px;text-align:center;
  display:flex;flex-direction:column;gap:4px;transition:all .15s;
  font-family:inherit;color:var(--text)
}
.odd-btn:hover:not(:disabled):not(.disabled){
  border-color:var(--accent);background:var(--card-hover);
  transform:translateY(-1px)
}
.odd-btn:active:not(:disabled):not(.disabled){transform:translateY(0) scale(.98)}
.odd-btn:disabled,.odd-btn.disabled{opacity:.3;cursor:not-allowed}
.odd-btn.up{border-color:rgba(0,230,118,.4)}
.odd-btn.down{border-color:rgba(255,56,96,.4)}
.odd-label{font-size:11px;color:var(--muted);font-weight:600}
.odd-value{
  font-size:17px;font-weight:800;color:var(--accent-2);
  font-variant-numeric:tabular-nums;letter-spacing:-.3px
}

/* Extras */
.extras{border-top:1px solid var(--border);padding-top:12px}
.extras-toggle{
  color:var(--accent-2);font-size:12.5px;font-weight:700;
  display:flex;align-items:center;gap:6px;padding:4px 0
}
.extras-toggle:hover{color:var(--text)}
.extras-toggle.open{color:var(--muted)}
.extras-grid{
  display:none;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:10px
}
.extras-grid.open{display:grid}
@media(min-width:600px){.extras-grid{grid-template-columns:repeat(3,1fr)}}
.odd-mini{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:9px 10px;
  display:flex;justify-content:space-between;align-items:center;
  gap:8px;min-width:0;transition:all .15s;font-family:inherit;color:var(--text)
}
.odd-mini:hover:not(.disabled){border-color:var(--accent);transform:translateY(-1px)}
.odd-mini.disabled{opacity:.3;cursor:not-allowed}
.odd-mini-label{
  font-size:11px;color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left
}
.odd-mini-value{
  font-size:12.5px;font-weight:800;color:var(--accent-2);
  white-space:nowrap;font-variant-numeric:tabular-nums
}

/* Empty */
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-icon{font-size:48px;margin-bottom:12px;opacity:.5}
.empty-text{font-size:14px;font-weight:600}

/* History */
.history-filters{
  display:flex;gap:6px;margin-bottom:14px;
  overflow-x:auto;scrollbar-width:none
}
.history-filters::-webkit-scrollbar{display:none}
.history-chip{
  padding:8px 14px;background:var(--card);border:1px solid var(--border);
  border-radius:var(--r-md);font-weight:700;color:var(--muted);
  font-size:12.5px;white-space:nowrap
}
.history-chip.active{color:var(--text);border-color:var(--accent)}
.history-list{display:flex;flex-direction:column;gap:10px}
.history-item{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--r-lg);padding:14px 16px;
  display:flex;flex-direction:column;gap:10px;
  cursor:pointer;transition:border-color .15s
}
.history-item:hover{border-color:var(--border-2)}
.history-item.won{border-left:4px solid var(--green)}
.history-item.lost{border-left:4px solid var(--red)}
.history-item.pending{border-left:4px solid var(--gold)}
.history-head{
  display:flex;justify-content:space-between;
  align-items:flex-start;gap:12px
}
.history-match{font-weight:700;font-size:14px;line-height:1.3}
.history-meta{font-size:11.5px;color:var(--muted);margin-top:2px}
.history-amount{
  font-weight:800;font-size:15px;
  font-variant-numeric:tabular-nums;white-space:nowrap
}
.history-foot{
  display:flex;justify-content:space-between;
  align-items:center;gap:12px;padding-top:10px;
  border-top:1px solid var(--border)
}
.history-odd{font-size:12px;color:var(--muted)}
.history-odd b{color:var(--accent-2);font-weight:800}
.history-status{
  font-weight:800;padding:4px 12px;border-radius:6px;
  text-transform:uppercase;letter-spacing:.3px;
  font-size:10.5px;white-space:nowrap
}
.history-status.won{background:rgba(0,230,118,.15);color:var(--green)}
.history-status.lost{background:rgba(255,56,96,.15);color:var(--red)}
.history-status.pending{background:rgba(255,184,0,.15);color:var(--gold)}
.cashout-btn{
  background:linear-gradient(135deg,var(--green),#00b050);
  color:#000;padding:10px 18px;border-radius:var(--r-md);
  font-weight:800;font-size:12.5px;align-self:flex-start;
  transition:transform .15s
}
.cashout-btn:hover{transform:translateY(-1px)}

/* Stats */
.stats-grid{
  display:grid;grid-template-columns:repeat(2,1fr);
  gap:10px;margin-bottom:20px
}
@media(min-width:700px){.stats-grid{grid-template-columns:repeat(4,1fr)}}
.stat-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--r-lg);padding:16px
}
.stat-label{
  font-size:11.5px;color:var(--muted);margin-bottom:6px;
  font-weight:600;text-transform:uppercase;letter-spacing:.3px
}
.stat-value{
  font-size:22px;font-weight:800;
  font-variant-numeric:tabular-nums;letter-spacing:-.5px
}
.stat-value.green{color:var(--green)}
.stat-value.red{color:var(--red)}
.stat-value.gold{color:var(--gold)}
.chart-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--r-lg);padding:18px;margin-bottom:16px
}
.chart-title{
  font-size:12px;color:var(--muted);font-weight:700;
  text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px
}
.chart-canvas{width:100%;height:200px;display:block}

/* Achievements */
.ach-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:10px
}
.ach{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--r-lg);padding:18px 12px;
  text-align:center;opacity:.4;transition:all .2s
}
.ach.unlocked{
  opacity:1;border-color:var(--gold);
  box-shadow:0 0 24px rgba(255,184,0,.15)
}
.ach-icon{font-size:32px;margin-bottom:10px}
.ach-name{font-size:12px;font-weight:700;margin-bottom:3px}
.ach-desc{font-size:10.5px;color:var(--muted)}

/* Leaderboard */
.leaderboard{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--r-lg);padding:16px
}
.lb-header{color:var(--muted);font-size:12.5px;margin-bottom:14px;font-weight:600}
.lb-header b{color:var(--gold);font-weight:800}
.lb-row{
  display:grid;grid-template-columns:44px 1fr auto;
  gap:12px;align-items:center;padding:12px 0;
  border-bottom:1px solid var(--border);font-size:13px
}
.lb-row:last-child{border-bottom:none}
.lb-row.me{
  background:rgba(123,92,255,.12);margin:0 -16px;
  padding:12px 16px;border-radius:var(--r-md);border-bottom:none
}
.lb-rank{font-weight:900;font-size:16px;color:var(--muted);text-align:center}
.lb-rank.top1{color:var(--gold)}
.lb-rank.top2{color:#c0c0c0}
.lb-rank.top3{color:#cd7f32}
.lb-name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-name.me{color:var(--accent-2)}
.lb-value{
  font-weight:800;color:var(--green);
  font-variant-numeric:tabular-nums;font-size:13px
}

/* Tabs */
.tab-content{display:none}
.tab-content.active{display:block;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}}

/* Modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.8);
  backdrop-filter:blur(8px);display:none;
  align-items:center;justify-content:center;
  z-index:1000;padding:16px
}
.modal-overlay.active{display:flex}
.modal{
  background:var(--bg2);border:1px solid var(--border-2);
  border-radius:var(--r-xl);padding:24px;
  max-width:440px;width:100%;max-height:90vh;
  overflow-y:auto;animation:popIn .25s
}
@keyframes popIn{from{transform:scale(.94);opacity:0}}
.modal h3{font-size:17px;margin-bottom:6px}
.modal-sub{color:var(--muted);font-size:13px;margin-bottom:20px;line-height:1.5}
.modal-row{
  display:flex;justify-content:space-between;
  padding:10px 0;border-bottom:1px solid var(--border);font-size:13px
}
.modal-row:last-of-type{border-bottom:none}
.modal-row .label{color:var(--muted)}
.modal-row .value{font-weight:800;font-variant-numeric:tabular-nums}
.modal input[type="number"]{
  width:100%;background:var(--card);border:1px solid var(--border);
  padding:14px 16px;border-radius:var(--r-md);font-size:16px;
  margin:16px 0 12px;font-weight:800;font-variant-numeric:tabular-nums
}
.modal input[type="number"]:focus{outline:none;border-color:var(--accent)}
.quick-stakes{
  display:grid;grid-template-columns:repeat(6,1fr);
  gap:6px;margin-bottom:16px
}
.quick-stake{
  padding:10px 4px;background:var(--card);border:1px solid var(--border);
  border-radius:var(--r-sm);font-size:11.5px;font-weight:700;text-align:center
}
.quick-stake:hover{border-color:var(--accent)}
.modal-actions{display:flex;gap:8px;margin-top:16px}
.btn{
  flex:1;padding:14px;border-radius:var(--r-md);
  font-weight:800;font-size:14px;transition:all .15s
}
.btn:active:not(:disabled){transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff
}
.btn-secondary{background:var(--card);border:1px solid var(--border)}
.btn-coupon{
  background:rgba(123,92,255,.15);border:1px solid var(--accent);color:var(--accent-2)
}
.btn-builder{background:rgba(255,184,0,.15);border:1px solid var(--gold);color:var(--gold)}

/* Coupon */
.coupon-bar{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--bg2);border-top:2px solid var(--accent);
  padding:12px 16px;transform:translateY(100%);
  transition:transform .3s;z-index:200;
  box-shadow:0 -8px 40px rgba(0,0,0,.5)
}
.coupon-bar.active{transform:translateY(0)}
.coupon-inner{max-width:1240px;margin:0 auto}
.coupon-items{
  display:flex;gap:8px;overflow-x:auto;
  padding-bottom:8px;margin-bottom:8px
}
.coupon-items::-webkit-scrollbar{height:4px}
.coupon-item{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--r-md);padding:8px 12px;
  display:flex;align-items:center;gap:10px;
  min-width:200px;font-size:12px
}
.coupon-item-info{flex:1;min-width:0}
.coupon-item-match{
  font-weight:700;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis
}
.coupon-item-pick{
  color:var(--accent-2);font-weight:700;
  font-size:11px;margin-top:2px
}
.coupon-item-remove{

function computeExtras(m){
  if(m.status==='finished'||m.status==='countdown')return{};
  const raw={};
  const add=(l,p,mar=0.05)=>{const o=toOdd(p,mar);if(o)raw[l]=o;};

  // UFC
  if(m.sport==='ufc'){
    const d=m.homeRating-m.awayRating;let pH=1/(1+Math.pow(10,-d/400));const prog=m.minute/m.maxMinute;pH=0.5+(pH-0.5)*(1-prog*0.7);pH=clamp(pH,0.15,0.85);const pA=1-pH;const r=m.round;
    let pFin;if(r===1)pFin=0.5;else if(r===2)pFin=0.42;else if(r===3)pFin=0.3;else if(r===4)pFin=0.2;else pFin=0.1;
    const pKO=pFin*0.6,pSub=pFin*0.4,pDec=1-pFin;
    add('KO/TKO',pKO);add('Сабмишн',pSub);add('Решение',pDec);add('Бой досрочно',pFin);add('Вся дистанция',pDec);
    // ДИНАМИЧЕСКИЙ тотал раундов
    const curRound=m.round;
    const minInRound=m.minute%25;
    const curProgress=(curRound-1+minInRound/25)/5; // 0..1
    const pOver25=Math.max(0.05,1-curProgress-pFin*0.6);
    const pUnder25=1-pOver25;
    const pOver35=Math.max(0.05,1-curProgress-pFin*0.9);
    const pUnder35=1-pOver35;
    if(curRound<3)add('ТБ 2.5 раундов',pOver25);
    if(curRound<3)add('ТМ 2.5 раундов',pUnder25);
    if(curRound<4)add('ТБ 3.5 раундов',pOver35);
    if(curRound<4)add('ТМ 3.5 раундов',pUnder35);
    if(r<=1)add('Финиш в R1',pFin*0.4,0.08);
    if(r<=2)add('Финиш в R2',pFin*0.28,0.08);
    if(r<=3)add('Финиш в R3',pFin*0.2,0.08);
    if(r<=4)add('Финиш в R4+',pFin*0.12,0.08);
    add(`${m.home} KO/TKO`,pH*pKO,0.08);add(`${m.home} Сабмишн`,pH*pSub,0.08);add(`${m.home} Решение`,pH*pDec,0.08);
    add(`${m.away} KO/TKO`,pA*pKO,0.08);add(`${m.away} Сабмишн`,pA*pSub,0.08);add(`${m.away} Решение`,pA*pDec,0.08);
    return raw;
  }

  // Волейбол
  if(m.sport==='volleyball'){
    const setsLeft=Math.max(0,5-m.setsHome-m.setsAway);
    const setsPlayed=m.setsHome+m.setsAway;
    // Тотал сетов
    const totalSetsPred=m.setsHome+m.setsAway+2;
    add('ТБ 3.5 сетов',totalSetsPred>3.5?0.4:0.6);
    add('ТМ 3.5 сетов',totalSetsPred<=3.5?0.4:0.6);
    add('ТБ 4.5 сетов',totalSetsPred>4.5?0.35:0.65);
    add('ТМ 4.5 сетов',totalSetsPred<=4.5?0.35:0.65);
    // Победы в сетах
    if(m.setsHome+m.setsAway<5){
      const d=(m.homeAtk-m.awayAtk);const pH=clamp(0.5+d*0.3,0.2,0.8);
      const nextSet=m.setsHome+m.setsAway+1;
      add(`Победа в ${nextSet}-м сете · П1`,pH,0.06);
      add(`Победа в ${nextSet}-м сете · П2`,1-pH,0.06);
      if(nextSet<5){
        add(`Победа в ${nextSet+1}-м сете · П1`,pH*0.95,0.07);
        add(`Победа в ${nextSet+1}-м сете · П2`,(1-pH)*0.95,0.07);
      }
    }
    // Точный счёт
    add('Счёт 3:0',0.15,0.1);add('Счёт 3:1',0.2,0.1);add('Счёт 3:2',0.15,0.1);
    add('Счёт 0:3',0.15,0.1);add('Счёт 1:3',0.2,0.1);add('Счёт 2:3',0.15,0.1);
    // Обе выиграют минимум 1 сет
    const bothWon=m.setsHome>0&&m.setsAway>0;
    if(!bothWon){
      add('Обе выиграют хотя бы 1 сет · Да',0.75,0.06);
      add('Обе выиграют хотя бы 1 сет · Нет',0.25,0.06);
    }
    return raw;
  }

  // Футбол / хоккей
  const isF=m.sport==='football';
  const{lh,la}=goalsRemaining(m);
  const MAX=12;const hD=[],aD=[];
  for(let g=0;g<=MAX;g++){hD.push(poisson(g,lh));aD.push(poisson(g,la));}
  const matrix={};let sum=0;
  for(let h=0;h<=MAX;h++)for(let a=0;a<=MAX;a++){const p=hD[h]*aD[a];const fh=m.scoreHome+h,fa=m.scoreAway+a;const k=`${fh}:${fa}`;matrix[k]=(matrix[k]||0)+p;sum+=p;}
  for(const k in matrix)matrix[k]/=sum;
  let pH=0,pD=0,pA=0,pEven=0,pBtts=0;
  for(const[k,p]of Object.entries(matrix)){const[h,a]=k.split(':').map(Number);if(h>a)pH+=p;else if(h===a)pD+=p;else pA+=p;if((h+a)%2===0)pEven+=p;if(h>=1&&a>=1)pBtts+=p;}
  const pOver=(l)=>{let p=0;for(const[k,pr]of Object.entries(matrix)){const[h,a]=k.split(':').map(Number);if(h+a>l)p+=pr;}return p;};
  const pHand=(l)=>{let p=0;for(const[k,pr]of Object.entries(matrix)){const[h,a]=k.split(':').map(Number);if(h-a>l)p+=pr;}return p;};
  const pTeamOver=(side,l)=>{let p=0;for(const[k,pr]of Object.entries(matrix)){const[h,a]=k.split(':').map(Number);const g=side==='home'?h:a;if(g>l)p+=pr;}return p;};
  if(isF){add('1X',pH+pD,0.04);add('12',pH+pA,0.04);add('X2',pD+pA,0.04);}
  const lines=isF?[0.5,1.5,2.5,3.5,4.5,5.5]:[3.5,4.5,5.5,6.5,7.5,8.5];
  lines.forEach(l=>{add(`ТБ ${l}`,pOver(l),0.05);add(`ТМ ${l}`,1-pOver(l),0.05);});
  if(isF){const f1m=pHand(-1.5),f2m=1-pHand(1.5);add('Ф1 −1.5',f1m,0.05);add('Ф1 +1.5',1-f1m,0.05);add('Ф2 −1.5',f2m,0.05);add('Ф2 +1.5',1-f2m,0.05);}
  else{const f1m=pHand(-1.5),f2m=1-pHand(1.5);add('Ф1 −1.5',f1m,0.05);add('Ф1 +1.5',1-f1m,0.05);add('Ф2 −1.5',f2m,0.05);add('Ф2 +1.5',1-f2m,0.05);}
  add('Обе · Да',pBtts,0.05);add('Обе · Нет',1-pBtts,0.05);
  add('Чёт',pEven,0.05);add('Нечет',1-pEven,0.05);
  const tL=isF?0.5:1.5;const hO=pTeamOver('home',tL),aO=pTeamOver('away',tL);
  add(`${m.home} Б ${tL}`,hO,0.05);add(`${m.home} М ${tL}`,1-hO,0.05);add(`${m.away} Б ${tL}`,aO,0.05);add(`${m.away} М ${tL}`,1-aO,0.05);
  if(isF&&m.minute<150){for(const[k,p]of Object.entries(matrix)){const[h,a]=k.split(':').map(Number);if(h>4||a>4)continue;if(h===m.scoreHome&&a===m.scoreAway)continue;if(h<m.scoreHome||a<m.scoreAway)continue;add(`Счёт ${k}`,p,0.08);}}
  return raw;
}

/* ============ СОЗДАНИЕ ============ */
function newFootball(){const lgs=[...new Set(FOOTBALL.map(t=>t.lg))];const lg=pick(lgs);const teams=FOOTBALL.filter(t=>t.lg===lg);const[h,a]=pickTwo(teams);return{id:nextId++,sport:'football',league:lg,home:h.n,away:a.n,homeAtk:h.atk,awayAtk:a.atk,homeRating:h.rt,awayRating:a.rt,homeCountry:h.country,awayCountry:a.country,scoreHome:0,scoreAway:0,minute:0,maxMinute:180,status:'live',momentum:0,justScored:null};}
function newHockey(){const lgs=[...new Set(HOCKEY.map(t=>t.lg))];const lg=pick(lgs);const teams=HOCKEY.filter(t=>t.lg===lg);const[h,a]=pickTwo(teams);return{id:nextId++,sport:'hockey',league:lg,home:h.n,away:a.n,homeAtk:h.atk,awayAtk:a.atk,homeRating:h.rt,awayRating:a.rt,homeCountry:h.country,awayCountry:a.country,scoreHome:0,scoreAway:0,minute:0,maxMinute:120,status:'live',momentum:0,justScored:null};}
function newVolleyball(){const lgs=[...new Set(VOLLEYBALL.map(t=>t.lg))];const lg=pick(lgs);const teams=VOLLEYBALL.filter(t=>t.lg===lg);const[h,a]=pickTwo(teams);return{id:nextId++,sport:'volleyball',league:lg,home:h.n,away:a.n,homeAtk:h.atk,awayAtk:a.atk,homeRating:h.rt,awayRating:a.rt,homeCountry:h.country,awayCountry:a.country,setsHome:0,setsAway:0,pointsHome:0,pointsAway:0,minute:0,maxMinute:300,status:'live',momentum:0,justScored:null};}
function newUFC(){const divs=[...new Set(UFC.map(f=>f.div))];const div=pick(divs);const fighters=UFC.filter(f=>f.div===div);const[h,a]=pickTwo(fighters);return{id:nextId++,sport:'ufc',league:`UFC · ${div}`,home:h.n,away:a.n,homeRating:h.rt,awayRating:a.rt,homeCountry:h.country,awayCountry:a.country,scoreHome:0,scoreAway:0,minute:0,maxMinute:120,round:1,status:'live',momentum:0,finalResult:null,justScored:null};}

function createBatch(){
  // Футбол 5
  for(let i=0;i<5;i++)matches.push(newFootball());
  // Хоккей 3
  for(let i=0;i<3;i++)matches.push(newHockey());
  // Волейбол 3
  for(let i=0;i<3;i++)matches.push(newVolleyball());
  // UFC 3
  for(let i=0;i<3;i++)matches.push(newUFC());
  // Перемешать
  for(let i=matches.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[matches[i],matches[j]]=[matches[j],matches[i]];}
}

/* ============ СИМУЛЯЦИЯ ============ */
function tickMatch(m){
  if(m.status==='countdown'){m.countdownLeft-=1;if(m.countdownLeft<=0){const nm=m.sport==='football'?newFootball():m.sport==='hockey'?newHockey():m.sport==='volleyball'?newVolleyball():newUFC();nm.id=m.id;Object.assign(m,nm);}return;}
  if(m.status!=='live')return;
  m.minute+=1;m.momentum*=0.94;m.justScored=null;

  // UFC
  if(m.sport==='ufc'){
    const cycle=24;const tk=m.minute%cycle;m.round=Math.min(5,Math.floor(m.minute/cycle)+1);
    const adv=(m.homeRating-m.awayRating)/400;
    if(Math.random()<0.5+adv*0.3)m.momentum=Math.min(1,m.momentum+0.2);else m.momentum=Math.max(-1,m.momentum-0.2);
    if(Math.random()<0.04){const w=Math.random()<(0.5+adv*0.5)?'home':'away';const method=Math.random()<0.6?'KO/TKO':'Сабмишн';if(w==='home'){m.scoreHome=1;m.scoreAway=0;m.justScored='home';}else{m.scoreHome=0;m.scoreAway=1;m.justScored='away';}m.finalResult={winner:w,method,round:m.round};m.status='finished';m.finishedAt=Date.now();return;}
    if(m.minute>=120){const w=m.momentum>0?'home':'away';if(w==='home'){m.scoreHome=1;m.scoreAway=0;}else{m.scoreHome=0;m.scoreAway=1;}m.finalResult={winner:w,method:'Решение',round:5};m.status='finished';m.finishedAt=Date.now();return;}
    return;
  }

  // Волейбол — сет до 25, разница 2 (5-й до 15)
  if(m.sport==='volleyball'){
    if(m.minute>=300){m.status='finished';m.finishedAt=Date.now();return;}
    const d=(m.homeAtk-m.awayAtk);const pH=clamp(0.5+d*0.25,0.3,0.7);
    const isFifth=(m.setsHome===2&&m.setsAway===2);
    const target=isFifth?15:25;
    if(Math.random()<0.55){ // розыгрыш в среднем раз в 2 сек
      if(Math.random()<pH)m.pointsHome++;else m.pointsAway++;
    }
    if(m.pointsHome>=target&&m.pointsHome-m.pointsAway>=2){
      m.setsHome++;m.justScored='home';m.pointsHome=0;m.pointsAway=0;
    }else if(m.pointsAway>=target&&m.pointsAway-m.pointsHome>=2){
      m.setsAway++;m.justScored='away';m.pointsHome=0;m.pointsAway=0;
    }
    if(m.setsHome>=3||m.setsAway>=3){m.status='finished';m.finishedAt=Date.now();}
    return;
  }

  // Футбол/хоккей
  if(m.minute>=m.maxMinute){m.status='finished';m.finishedAt=Date.now();return;}
  const{lh,la}=goalsRemaining(m);const rem=Math.max(1,m.maxMinute-m.minute);
  const mult=m.sport==='football'?1.0:1.2;
  if(Math.random()<lh/rem*mult){m.scoreHome+=1;m.momentum=Math.min(1,m.momentum+0.4);m.justScored='home';}
  else if(Math.random()<la/rem*mult){m.scoreAway+=1;m.momentum=Math.max(-1,m.momentum-0.4);m.justScored='away';}
}

function renderBalance(){$('balance').textContent=fmt(wallet.balance);renderSession();}
function renderSession(){const prof=wallet.balance-wallet.sessionStart;const won=wallet.bets.filter(b=>b.status==='won').length;const lost=wallet.bets.filter(b=>b.status==='lost').length;const t=won+lost;const wr=t?((won/t)*100).toFixed(0)+'%':'—';const p=$('sessionProfit');p.textContent=(prof>=0?'+':'')+fmt(prof)+' ₽';p.className='value '+(prof>=0?'green':'red');$('sessionBets').textContent=wallet.bets.length;$('sessionWinrate').textContent=wr;}

function renderProgress(m){
  if(m.status==='countdown')return'';
  if(m.sport==='football'){const h1=Math.min(1,m.minute/90);const h2=Math.max(0,Math.min(1,(m.minute-90)/90));return`<div class="progress"><div class="progress-seg ${h1>=1?'done':'active'}" style="--p:${h1*100}%"></div><div class="progress-seg ${h2>=1?'done':'active'}" style="--p:${h2*100}%"></div></div>`;}
  if(m.sport==='hockey'){const p1=Math.min(1,m.minute/40);const p2=Math.max(0,Math.min(1,(m.minute-40)/40));const p3=Math.max(0,Math.min(1,(m.minute-80)/40));return`<div class="progress"><div class="progress-seg ${p1>=1?'done':'active'}" style="--p:${p1*100}%"></div><div class="progress-seg ${p2>=1?'done':'active'}" style="--p:${p2*100}%"></div><div class="progress-seg ${p3>=1?'done':'active'}" style="--p:${p3*100}%"></div></div>`;}
  if(m.sport==='ufc'){const segs=[];for(let i=1;i<=5;i++){const done=m.round>i||(m.status==='finished'&&m.round>=i);const active=m.round===i&&m.status==='live';let p=0;if(active)p=((m.minute%24)/24)*100;if(done)p=100;segs.push(`<div class="progress-seg ${done?'done':active?'active':''}" style="--p:${Math.min(100,p)}%"></div>`);}return`<div class="progress">${segs.join('')}</div>`;}
  if(m.sport==='volleyball'){const segs=[];for(let i=1;i<=5;i++){const won=m.setsHome>=i||m.setsAway>=i;const current=(m.setsHome+m.setsAway+1)===i&&m.status==='live';segs.push(`<div class="progress-seg ${won?'done':current?'active':''}" style="--p:${won?100:0}%"></div>`);}return`<div class="progress">${segs.join('')}</div>`;}
  return'';
}

function renderMatches(){
  let list=[...matches];
  if(currentSport!=='all')list=list.filter(m=>m.sport===currentSport);
  list.sort((a,b)=>{const ord={live:0,countdown:1,finished:2};if(ord[a.status]!==ord[b.status])return ord[a.status]-ord[b.status];const so={ufc:0,football:1,hockey:2,volleyball:3};if(a.sport!==b.sport)return(so[a.sport]||9)-(so[b.sport]||9);return a.minute-b.minute;});
  const el=$('matches');
  if(!list.length){el.innerHTML=`<div class="empty" style="grid-column:1/-1"><div class="empty-icon">🎯</div><div class="empty-text">Матчей нет</div></div>`;return;}
  el.innerHTML=list.map(m=>renderCard(m)).join('');
}

function renderCard(m){
  const odds=computeOdds(m);
  const isFin=m.status==='finished';
  const isCd=m.status==='countdown';
  const extras=(!isFin&&!isCd)?computeExtras(m):{};
  const keys=Object.keys(extras);
  const isOpen=openExtras.has(m.id);
  const extrasH=keys.length?`<div class="extras"><button class="extras-toggle ${isOpen?'open':''}" data-extras="${m.id}">${isOpen?'▲ Скрыть':`▼ Ещё ${keys.length} рынков`}</button><div class="extras-grid ${isOpen?'open':''}">${keys.map(l=>{const o=extras[l];return`<button class="odd-mini" data-mid="${m.id}" data-mk="${encodeURIComponent(l)}" data-odd="${o}"><span class="odd-mini-label">${l}</span><span class="odd-mini-value">${o.toFixed(2)}</span></button>`;}).join('')}</div></div>`:'';
  let badge;if(isFin)badge='<span class="match-status finished">Финиш</span>';else if(isCd)badge='<span class="match-status countdown">⏱ Далее</span>';else badge='<span class="match-status live">LIVE</span>';
  let infoText='';
  if(isCd){infoText=`<span class="time" style="color:var(--accent-2);font-weight:800">⏱ ${ft(m.countdownLeft)}</span>`;}
  else if(isFin){infoText=`<span class="period">Завершён</span>`;}
  else if(m.sport==='football'){infoText=`<span class="period">${m.minute<90?'1-й тайм':'2-й тайм'}</span> · <span class="time">${Math.floor(m.minute*0.5)}'</span>`;}
  else if(m.sport==='hockey'){const p=m.minute<40?'1-й':m.minute<80?'2-й':'3-й';infoText=`<span class="period">${p} период</span> · <span class="time">${Math.floor(m.minute*0.5)}'</span>`;}
  else if(m.sport==='ufc'){infoText=`<span class="period">Раунд ${m.round}/5</span>`;}
  else if(m.sport==='volleyball'){const sn=m.setsHome+m.setsAway+1;infoText=`<span class="period">Сет ${Math.min(5,sn)}</span> · <span class="time">${m.pointsHome}:${m.pointsAway}</span>`;}

  let ufcResult='';
  if(m.sport==='ufc'&&isFin&&m.finalResult){const w=m.finalResult.winner==='home'?m.home:m.away;ufcResult=`<div class="ufc-result">🏆 Победа: <span class="win">${w}</span> · ${m.finalResult.method} · Раунд ${m.finalResult.round}</div>`;}

  let scoreH,scoreA;
  if(isCd){scoreH='—';scoreA='—';}
  else if(m.sport==='ufc'&&!isFin){scoreH='—';scoreA='—';}
  else if(m.sport==='volleyball'){scoreH=m.setsHome;scoreA=m.setsAway;}
  else{scoreH=m.scoreHome;scoreA=m.scoreAway;}

  const hFlag=FLAGS[m.homeCountry]||'';
  const aFlag=FLAGS[m.awayCountry]||'';
  const homeLogo=`<div class="team-logo-wrap"><div class="team-logo ${m.justScored==='home'?'scored':''}" style="background:${teamColor(m.home)}">${teamInit(m.home)}</div><div class="team-rating">${m.homeRating||80}</div>${hFlag?`<div class="team-flag">${hFlag}</div>`:''}</div>`;
  const awayLogo=`<div class="team-logo-wrap"><div class="team-logo ${m.justScored==='away'?'scored':''}" style="background:${teamColor(m.away)}">${teamInit(m.away)}</div><div class="team-rating">${m.awayRating||80}</div>${aFlag?`<div class="team-flag">${aFlag}</div>`:''}</div>`;

  const isUFC=m.sport==='ufc';
  const twoCols=isUFC||odds.draw===null;
  const oddsRowCls=twoCols?'odds-row two-col':'odds-row';

  return`<div class="match ${isFin?'finished':''}">
    <div class="match-head"><span class="match-sport">${sIcon(m.sport)}</span><span class="match-league">${m.league}</span>${badge}</div>
    <div class="teams">
      <div class="team-line"><div class="team-info">${homeLogo}<span class="team-name">${m.home}</span></div><span class="team-score ${m.justScored==='home'?'scored':''}">${scoreH}</span></div>
      <div class="team-line"><div class="team-info">${awayLogo}<span class="team-name">${m.away}</span></div><span class="team-score ${m.justScored==='away'?'scored':''}">${scoreA}</span></div>
    </div>
    <div class="match-info">${infoText}</div>
    ${renderProgress(m)}
    ${ufcResult}
    <div class="${oddsRowCls}">
      ${renderOddBtn(m,'home',isUFC?'П1':'1',odds.home,isFin||isCd)}
      ${!isUFC&&odds.draw!==null?renderOddBtn(m,'draw','X',odds.draw,isFin||isCd):''}
      ${renderOddBtn(m,'away',isUFC?'П2':'2',odds.away,isFin||isCd)}
    </div>
    ${extrasH}
  </div>`;
}

function renderOddBtn(m,pk,l,v,dis){
  if(!isValid(v))return`<div class="odd-btn disabled"><span class="odd-label">${l}</span><span class="odd-value" style="color:var(--muted)">—</span></div>`;
  const k=`${m.id}-${pk}`;const prev=prevOdds[k];let cls='';if(prev!==undefined&&prev!==v)cls=v>prev?'up':'down';prevOdds[k]=v;
  return`<button class="odd-btn ${cls}" data-match-id="${m.id}" data-pick="${pk}" data-odd="${v}" ${dis?'disabled':''}><span class="odd-label">${l}</span><span class="odd-value">${v.toFixed(2)}</span></button>`;
}

function renderHistory(){
  const el=$('history');let list=[...wallet.bets];
  if(currentHistory!=='all')list=list.filter(b=>b.status===currentHistory);
  if(!list.length){el.innerHTML=`<div class="empty"><div class="empty-icon">📜</div><div class="empty-text">Ставок нет</div></div>`;return;}
  el.innerHTML=list.map(b=>{
    let meta='';
    if(b.type==='express')meta=`${b.selections.length} событий`;
    else if(b.type==='builder')meta=`${b.selections.length} в билдере`;
    else{const pl=b.pick==='home'?'П1':b.pick==='draw'?'X':b.pick==='away'?'П2':b.pick;meta=pl;}
    const m=matches.find(x=>x.id===b.matchId);
    let ch='';
    if(b.status==='pending'&&m&&m.status==='live'){const co=cashoutValue(b,m);if(co>0)ch=`<button class="cashout-btn" data-cashout="${b.id}">💰 Забрать ${fmt(co)} ₽</button>`;}
    return`<div class="history-item ${b.status}" data-history="${b.id}">
      <div class="history-head"><div><div class="history-match">${b.match}</div><div class="history-meta">${meta} · ${new Date(b.createdAt).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}</div></div><div class="history-amount">${fmt(b.stake)} ₽</div></div>
      <div class="history-foot"><div class="history-odd">Кэф <b>${b.odd.toFixed(2)}</b> · потенц. <b>${fmt(b.potential)} ₽</b></div><div class="history-status ${b.status}">${b.status==='won'?`+${fmt(b.payout)}`:b.status==='lost'?`-${fmt(b.stake)}`:'ожидание'}</div></div>
      ${ch}</div>`;
  }).join('');
}

function drawChart(){
  const c=$('profitChart');if(!c)return;
  const ctx=c.getContext('2d');const dpr=window.devicePixelRatio||1;const r=c.getBoundingClientRect();
  c.width=r.width*dpr;c.height=r.height*dpr;ctx.scale(dpr,dpr);
  const w=r.width,h=r.height;ctx.clearRect(0,0,w,h);
  const hist=wallet.profitHistory;
  if(!hist||hist.length<2){ctx.fillStyle='#6e6e88';ctx.font='13px sans-serif';ctx.textAlign='center';ctx.fillText('Играй — график появится',w/2,h/2);return;}
  const min=Math.min(...hist.map(p=>p.v),0);const max=Math.max(...hist.map(p=>p.v),0);const range=max-min||1;
  ctx.strokeStyle='rgba(110,110,140,.1)';
  for(let i=0;i<=4;i++){const y=(h/4)*i;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
  const step=w/(hist.length-1);
  const grad=ctx.createLinearGradient(0,0,0,h);grad.addColorStop(0,'rgba(123,92,255,.35)');grad.addColorStop(1,'rgba(123,92,255,0)');
  ctx.beginPath();
  hist.forEach((p,i)=>{const x=i*step;const y=h-((p.v-min)/range)*h*0.85-h*0.075;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);});
  ctx.strokeStyle='#7b5cff';ctx.lineWidth=2.5;ctx.stroke();
  ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.closePath();ctx.fillStyle=grad;ctx.fill();
}

function placeBet(){
  if(!activeBet)return;
  const stake=parseFloat($('betModalStake').value);
  if(!stake||stake<10||stake>wallet.balance)return;
  if(activeBet.isExpress){
    const sel=activeBet.selections.map(s=>({matchId:s.matchId,pick:s.pick,odd:s.odd,label:s.label,match:s.match,status:'pending'}));
    wallet.balance-=stake;wallet.totalBet+=stake;
    wallet.bets.unshift({id:Date.now(),type:'express',match:`Экспресс · ${sel.length}`,selections:sel,odd:activeBet.odd,stake,potential:Math.round(stake*activeBet.odd*100)/100,status:'pending',createdAt:new Date().toISOString()});
    coupon=[];saveCoupon();renderCoupon();
  }else if(activeBet.isBuilder){
    const m=matches.find(x=>x.id===activeBet.matchId);if(!m)return;
    const sel=activeBet.selections.map(s=>({matchId:m.id,pick:s.pick,odd:s.odd,label:s.label,match:`${m.home} — ${m.away}`,status:'pending'}));
    wallet.balance-=stake;wallet.totalBet+=stake;
    wallet.bets.unshift({id:Date.now(),type:'builder',matchId:m.id,match:`${m.home} — ${m.away} (билдер)`,sport:m.sport,selections:sel,odd:activeBet.odd,stake,potential:Math.round(stake*activeBet.odd*100)/100,status:'pending',createdAt:new Date().toISOString()});
    delete builderBets[activeBet.matchId];
  }else{
    const m=matches.find(x=>x.id===activeBet.matchId);
    if(!m||m.status==='finished')return;
    wallet.balance-=stake;wallet.totalBet+=stake;
    wallet.bets.unshift({id:Date.now(),type:'single',matchId:m.id,match:`${m.home} — ${m.away}`,sport:m.sport,pick:activeBet.pick,odd:activeBet.odd,stake,potential:Math.round(stake*activeBet.odd*100)/100,status:'pending',minute:m.minute,score:`${m.scoreHome||0}:${m.scoreAway||0}`,createdAt:new Date().toISOString()});
  }
  saveWallet();flashBalance('win');renderBalance();renderHistory();renderStats();renderAchiv();sBet();vibe(20);closeBetModal();
}

/* ============ КЭШАУТ ============ */
function cashoutValue(b,m){
  if(!m||m.status!=='live'||b.status!=='pending')return 0;
  if(b.type==='express'){
    let cv=1;
    for(const sel of b.selections){const sm=matches.find(x=>Number(x.id)===Number(sel.matchId));if(!sm)return 0;if(sm.status==='finished'){if(sel.status==='lost')return 0;continue;}if(sm.status==='live'){const odds=computeOdds(sm);const cur=odds[sel.pick];if(!isValid(cur))return 0;cv*=1/cur;}else return 0;}
    const fair=b.potential*cv;const pay=Math.max(b.stake*0.1,Math.round(fair*0.9*100)/100);return Math.min(pay,b.potential*0.98);
  }
  if(b.type==='builder'){const sm=matches.find(x=>Number(x.id)===Number(b.matchId));if(!sm||sm.status!=='live')return 0;return Math.round(b.stake*0.5*100)/100;}
  const cur=computeOdds(m);
  if(!b.pick||!isValid(cur[b.pick]))return Math.round(b.stake*0.5*100)/100;
  const fair=b.potential/cur[b.pick];const pay=Math.max(b.stake*0.1,Math.round(fair*0.92*100)/100);return Math.min(pay,b.potential);
}

function doCashout(id){
  const b=wallet.bets.find(x=>x.id===id);
  if(!b||b.status!=='pending')return;
  let co=0;
  if(b.type==='express'||b.type==='builder'){for(const sel of b.selections){const sm=matches.find(x=>Number(x.id)===Number(sel.matchId));if(sm&&sm.status==='live'){co=cashoutValue(b,sm);break;}}}
  else{const m=matches.find(x=>x.id===b.matchId);if(m)co=cashoutValue(b,m);}
  if(co<=0)return;
  b.status='won';b.payout=co;b.cashout=true;
  wallet.balance+=co;wallet.totalWon+=co;
  saveWallet();flashBalance('win');renderBalance();renderHistory();renderStats();renderAchiv();sBet();
}

/* ============ РАСЧЁТ ============ */
function checkSel(m,pick){
  if(!m||m.status!=='finished')return'pending';
  const tot=(m.scoreHome||0)+(m.scoreAway||0);

  // UFC
  if(m.sport==='ufc'){
    if(!m.finalResult){const w=m.scoreHome>m.scoreAway?'home':m.scoreAway>m.scoreHome?'away':'home';m.finalResult={winner:w,method:'Решение',round:5};}
    const fr=m.finalResult;const isH=fr.winner==='home',isA=fr.winner==='away';const md=fr.method,rr=fr.round,fin=md!=='Решение';
    if(pick==='home')return isH?'won':'lost';
    if(pick==='away')return isA?'won':'lost';
    if(pick==='KO/TKO')return md==='KO/TKO'?'won':'lost';
    if(pick==='Сабмишн')return md==='Сабмишн'?'won':'lost';
    if(pick==='Решение')return md==='Решение'?'won':'lost';
    if(pick==='Бой досрочно')return fin?'won':'lost';
    if(pick==='Вся дистанция')return !fin?'won':'lost';
    const o25=pick.match(/^(ТБ|ТМ)\s*2\.5 раундов$/);if(o25){if(o25[1]==='ТБ')return rr>2.5?'won':'lost';return rr<2.5?'won':'lost';}
    const o35=pick.match(/^(ТБ|ТМ)\s*3\.5 раундов$/);if(o35){if(o35[1]==='ТБ')return rr>3.5?'won':'lost';return rr<3.5?'won':'lost';}
    const fR=pick.match(/^Финиш в R(\d+)\+?$/);if(fR){const t=+fR[1];if(pick.includes('+'))return(fin&&rr>=t)?'won':'lost';return(fin&&rr===t)?'won':'lost';}
    if(pick===`${m.home} KO/TKO`)return(isH&&md==='KO/TKO')?'won':'lost';
    if(pick===`${m.home} Сабмишн`)return(isH&&md==='Сабмишн')?'won':'lost';
    if(pick===`${m.home} Решение`)return(isH&&md==='Решение')?'won':'lost';
    if(pick===`${m.away} KO/TKO`)return(isA&&md==='KO/TKO')?'won':'lost';
    if(pick===`${m.away} Сабмишн`)return(isA&&md==='Сабмишн')?'won':'lost';
    if(pick===`${m.away} Решение`)return(isA&&md==='Решение')?'won':'lost';
    return'lost';
  }

  // Волейбол
  if(m.sport==='volleyball'){
    if(pick==='home')return m.setsHome>m.setsAway?'won':'lost';
    if(pick==='away')return m.setsAway>m.setsHome?'won':'lost';
    const totS=m.setsHome+m.setsAway;
    const t35=pick.match(/^(ТБ|ТМ)\s*3\.5 сетов$/);if(t35){if(t35[1]==='ТБ')return totS>3.5?'won':'lost';return totS<3.5?'won':'lost';}
    const t45=pick.match(/^(ТБ|ТМ)\s*4\.5 сетов$/);if(t45){if(t45[1]==='ТБ')return totS>4.5?'won':'lost';return totS<4.5?'won':'lost';}
    // Точный счёт
    const cs=pick.match(/^Счёт (\d+):(\d+)$/);if(cs)return(m.setsHome===+cs[1]&&m.setsAway===+cs[2])?'won':'lost';
    // Обе выиграют
    if(pick.includes('Обе выиграют хотя бы 1 сет')){
      if(pick.includes('Да'))return(m.setsHome>0&&m.setsAway>0)?'won':'lost';
      return(!(m.setsHome>0&&m.setsAway>0))?'won':'lost';
    }
    // Победа в N-м сете — упрощённо 50/50 (реальная логика сложна)
    const setWin=pick.match(/^Победа в (\d+)-м сете · (П1|П2)$/);
    if(setWin)return Math.random()<0.5?'won':'lost';
    return'lost';
  }

  // Футбол/хоккей
  if(pick==='home')return m.scoreHome>m.scoreAway?'won':'lost';
  if(pick==='away')return m.scoreAway>m.scoreHome?'won':'lost';
  if(pick==='draw')return m.scoreHome===m.scoreAway?'won':'lost';
  if(pick==='1X')return m.scoreHome>=m.scoreAway?'won':'lost';
  if(pick==='12')return m.scoreHome!==m.scoreAway?'won':'lost';
  if(pick==='X2')return m.scoreHome<=m.scoreAway?'won':'lost';
  const tO=pick.match(/^ТБ\s*([\d.]+)$/);const tU=pick.match(/^ТМ\s*([\d.]+)$/);
  if(tO)return tot>parseFloat(tO[1])?'won':'lost';
  if(tU)return tot<parseFloat(tU[1])?'won':'lost';
  const f1=pick.match(/^Ф1\s*([−\-+]?[\d.]+)$/);const f2=pick.match(/^Ф2\s*([−\-+]?[\d.]+)$/);
  if(f1)return(m.scoreHome-m.scoreAway)>parseFloat(f1[1].replace('−','-'))?'won':'lost';
  if(f2)return(m.scoreAway-m.scoreHome)>parseFloat(f2[1].replace('−','-'))?'won':'lost';
  if(pick==='Обе · Да')return(m.scoreHome>=1&&m.scoreAway>=1)?'won':'lost';
  if(pick==='Обе · Нет')return!(m.scoreHome>=1&&m.scoreAway>=1)?'won':'lost';
  if(pick==='Чёт')return tot%2===0?'won':'lost';
  if(pick==='Нечет')return tot%2!==0?'won':'lost';
  const hT=pick.match(new RegExp(`^${m.home.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}\\s+(Б|М)\\s+([\\d.]+)$`));
  const aT=pick.match(new RegExp(`^${m.away.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}\\s+(Б|М)\\s+([\\d.]+)$`));
  if(hT){const l=parseFloat(hT[2]);return hT[1]==='Б'?(m.scoreHome>l?'won':'lost'):(m.scoreHome<l?'won':'lost');}
  if(aT){const l=parseFloat(aT[2]);return aT[1]==='Б'?(m.scoreAway>l?'won':'lost'):(m.scoreAway<l?'won':'lost');}
  const cs=pick.match(/^Счёт\s+(\d+):(\d+)$/);
  if(cs)return(m.scoreHome===+cs[1]&&m.scoreAway===+cs[2])?'won':'lost';
  return'lost';
}

function settleBets(){
  let changed=false;
  wallet.bets.forEach(b=>{
    if(b.status!=='pending')return;
    if(b.type==='express'||b.type==='builder'){
      let anyL=false,allW=true,allD=true;
      for(const sel of b.selections){
        if(sel.status==='lost'){anyL=true;continue;}
        if(sel.status==='won')continue;
        const m=matches.find(x=>Number(x.id)===Number(sel.matchId));
        if(!m||m.status!=='finished'){allD=false;allW=false;continue;}
        const r=checkSel(m,sel.pick);sel.status=r;
        if(r==='lost'){anyL=true;allW=false;}
      }
      if(anyL){b.status='lost';sLose();flashBalance('lose');changed=true;wallet.profitHistory.push({t:Date.now(),v:wallet.totalWon-wallet.totalBet});return;}
      if(allD&&allW&&b.selections.every(s=>s.status==='won')){
        b.status='won';b.payout=Math.round(b.stake*b.odd*100)/100;
        wallet.balance+=b.payout;wallet.totalWon+=b.payout;
        sWin();vibe(50);flashBalance('win');changed=true;
        wallet.profitHistory.push({t:Date.now(),v:wallet.totalWon-wallet.totalBet});
        if(wallet.profitHistory.length>100)wallet.profitHistory.shift();
      }
      return;
    }
    const m=matches.find(x=>Number(x.id)===Number(b.matchId));
    if(!m||m.status!=='finished')return;
    const r=checkSel(m,b.pick);
    if(r==='won'){b.status='won';b.payout=Math.round(b.stake*b.odd*100)/100;wallet.balance+=b.payout;wallet.totalWon+=b.payout;sWin();vibe(50);flashBalance('win');}
    else{b.status='lost';sLose();flashBalance('lose');}
    changed=true;
    wallet.profitHistory.push({t:Date.now(),v:wallet.totalWon-wallet.totalBet});
    if(wallet.profitHistory.length>100)wallet.profitHistory.shift();
  });
  if(changed){saveWallet();renderBalance();renderHistory();renderStats();renderAchiv();}
}

function exportCSV(){
  const rows=[['Дата','Матч','Тип','Исход','Кэф','Ставка','Потенциал','Статус','Выплата']];
  wallet.bets.forEach(b=>rows.push([new Date(b.createdAt).toLocaleString('ru-RU'),b.match,b.type||'single',b.pick||'',b.odd,b.stake,b.potential,b.status,b.payout||0]));
  const csv=rows.map(r=>r.map(v=>`"${v}"`).join(',')).join('\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`openbet_${Date.now()}.csv`;a.click();
}

/* ============ ГЛАВНЫЙ ЦИКЛ ============ */
function tick(){
  resetDaily();
  matches.forEach(m=>{if(m.status==='live'||m.status==='countdown')tickMatch(m);});
  // Завершённые → countdown
  matches.forEach(m=>{
    if(m.status==='finished'&&!m.countdownStarted){
      m.finishedAt=m.finishedAt||Date.now();
      if(Date.now()-m.finishedAt>5000){m.countdownStarted=true;m.status='countdown';m.countdownLeft=60;}
    }
  });
  settleBets();

  // Автопополнение по спортам
  const cnt={football:0,hockey:0,volleyball:0,ufc:0};
  matches.forEach(m=>{if((m.status==='live'||m.status==='countdown')&&cnt[m.sport]!==undefined)cnt[m.sport]++;});
  const targets={football:5,hockey:3,volleyball:3,ufc:3};
  ['football','hockey','volleyball','ufc'].forEach(sp=>{
    if(cnt[sp]<targets[sp]-1){
      const need=targets[sp]-cnt[sp];
      for(let i=0;i<need;i++){
        let m;
        if(sp==='football')m=newFootball();else if(sp==='hockey')m=newHockey();else if(sp==='volleyball')m=newVolleyball();else m=newUFC();
        matches.push(m);
      }
    }
  });

  // Обрезка
  if(matches.length>30){
    const seen=new Set();
    matches=matches.filter(m=>{const k=`${m.home}|${m.away}`;if(seen.has(k))return false;seen.add(k);return true;});
    if(matches.length>30)matches=matches.slice(0,30);
  }

  renderMatches();
  if(currentTab==='stats')renderStats();
  if(currentTab==='history')renderHistory();
  if(currentTab==='top')renderTop();
  if(currentTab==='achiv')renderAchiv();
}

/* ============ ДЕЛЕГИРОВАНИЕ ============ */
document.addEventListener('click',(e)=>{
  const mb=e.target.closest('.odd-btn[data-match-id]');
  if(mb&&!mb.disabled&&!mb.classList.contains('disabled')){
    const mid=parseInt(mb.dataset.matchId);const pk=mb.dataset.pick;const odd=parseFloat(mb.dataset.odd);
    if(!isNaN(mid)&&pk&&isValid(odd)){openBetModal(mid,pk,odd);return;}
  }
  const minb=e.target.closest('.odd-mini[data-mid]');
  if(minb&&!minb.disabled&&!minb.classList.contains('disabled')){
    const mid=parseInt(minb.dataset.mid);const pk=decodeURIComponent(minb.dataset.mk);const odd=parseFloat(minb.dataset.odd);
    if(!isNaN(mid)&&pk&&isValid(odd)){openBetModal(mid,pk,odd);return;}
  }
  const eb=e.target.closest('[data-extras]');
  if(eb){const id=parseInt(eb.dataset.extras);if(openExtras.has(id))openExtras.delete(id);else openExtras.add(id);renderMatches();return;}
  const cb=e.target.closest('[data-cashout]');
  if(cb){e.stopPropagation();doCashout(parseInt(cb.dataset.cashout));return;}
  const hi=e.target.closest('[data-history]');
  if(hi&&!e.target.closest('[data-cashout]')){
    const bid=parseInt(hi.dataset.history);const bet=wallet.bets.find(x=>x.id===bid);
    if(bet&&bet.matchId){const m=matches.find(x=>x.id===bet.matchId);
      if(!m)alert('Матч не найден');
      else if(m.status==='finished')alert(`Завершён: ${m.home} — ${m.away}`);
      else if(m.status==='countdown')alert(`Новый через ${ft(m.countdownLeft)}`);
      else alert(`${m.home} — ${m.away}\n${m.sport==='volleyball'?`Сеты ${m.setsHome}:${m.setsAway}`:`${m.scoreHome}:${m.scoreAway}`} · live`);
    }
    return;
  }
  if(e.target.closest('#balanceBox')){claimBonus();return;}
});

$('newLineBtn').onclick=()=>{matches=[];nextId=1;openExtras.clear();builderBets={};prevOdds={};createBatch();saveMatches();renderMatches();};
window.addEventListener('resize',()=>{if(currentTab==='stats')drawChart();});

/* ============ СТАРТ ============ */
