<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>BETAPP</title>
<style>
:root{--bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--text:#fff;--text-dim:#8b949e;--accent:#ffcc00;--green:#238636;--red:#da3633;--blue:#58a6ff;--border:#30363d}
body.light{--bg:#f5f5f7;--bg2:#fff;--bg3:#e8e8ed;--text:#1d1d1f;--text-dim:#6e6e73;--accent:#ff9500;--green:#34c759;--red:#ff3b30;--blue:#0071e3;--border:#d2d2d7}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
#authScreen{display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:100vh;padding:24px}
.logo{font-size:44px;font-weight:900;margin-bottom:6px}
.logo span{color:var(--accent)}
.subtitle{color:var(--text-dim);margin-bottom:32px;font-size:14px}
.auth-box{width:100%;max-width:380px;background:var(--bg2);padding:24px;border-radius:16px;border:1px solid var(--border)}
.auth-tabs{display:flex;gap:8px;margin-bottom:20px}
.auth-tab{flex:1;padding:10px;background:var(--bg3);border:none;border-radius:10px;color:var(--text-dim);font-weight:600;font-size:14px;cursor:pointer}
.auth-tab.active{background:var(--accent);color:#000}
.auth-box input{width:100%;padding:14px;margin-bottom:12px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:16px;outline:none}
.btn-primary{width:100%;padding:14px;background:var(--accent);color:#000;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer}
.msg{padding:10px;border-radius:8px;margin-bottom:12px;font-size:13px;text-align:center;display:none}
.msg.show{display:block}
.msg.err{background:var(--red);color:#fff}
.msg.ok{background:var(--green);color:#fff}
#appScreen{display:none;padding-bottom:100px}
.header{position:sticky;top:0;z-index:10;background:var(--bg2);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.header .logo{font-size:22px;margin:0}
.right-head{display:flex;gap:8px;align-items:center}
.theme-btn{background:var(--bg3);border:none;color:var(--text);width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:18px}
.balance{background:linear-gradient(135deg,var(--green),#2ea043);padding:8px 14px;border-radius:20px;font-weight:700;font-size:14px;cursor:pointer;color:#fff}
.freebet-badge{background:linear-gradient(135deg,var(--accent),#ff9500);color:#000;padding:8px 12px;border-radius:20px;font-weight:700;font-size:13px;cursor:pointer;display:none}
.freebet-badge.show{display:block}
.tabs{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;background:var(--bg2);border-bottom:1px solid var(--border);scrollbar-width:none;position:sticky;top:57px;z-index:9}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 16px;background:var(--bg3);border:none;border-radius:20px;color:var(--text-dim);font-weight:600;white-space:nowrap;cursor:pointer;font-size:14px}
.tab.active{background:var(--accent);color:#000}
.match{background:var(--bg2);margin:8px 12px;border-radius:12px;padding:14px;border:1px solid var(--border);cursor:pointer;position:relative}
.match.mybet{border:2px solid var(--accent)}
.match-header{display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px;align-items:center}
.league{color:var(--text-dim)}
.time{color:var(--accent);font-weight:700;display:flex;align-items:center;gap:4px}
.live-dot{display:inline-block;width:8px;height:8px;background:var(--red);border-radius:50%;animation:pulse-dot 1s infinite}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.3}}
.teams{font-size:16px;font-weight:600;margin-bottom:12px;line-height:1.3}
.score{color:var(--accent);font-weight:900;margin-left:6px;font-size:18px}
.lock-banner{background:var(--red);color:#fff;padding:8px 12px;border-radius:8px;font-size:12px;font-weight:600;text-align:center;margin-bottom:8px}
.lock-banner.restart{background:var(--accent);color:#000}
.lock-banner.break{background:var(--blue);color:#fff}
.odds-row{display:flex;gap:8px}
.odd{flex:1;background:var(--bg3);padding:10px 6px;border-radius:8px;text-align:center;cursor:pointer;border:2px solid transparent}
.odd.selected{background:var(--accent);border-color:var(--accent)}
.odd.selected .odd-label,.odd.selected .odd-value{color:#000}
.odd.locked{opacity:.4}
.odd-label{color:var(--text-dim);font-size:11px;margin-bottom:2px}
.odd-value{font-size:16px;font-weight:700;color:var(--text)}
.match-hint{font-size:10px;color:var(--text-dim);text-align:center;margin-top:6px;font-style:italic}
.badge{position:fixed;bottom:20px;right:20px;background:var(--accent);color:#000;width:60px;height:60px;border-radius:50%;display:none;justify-content:center;align-items:center;font-weight:900;font-size:22px;cursor:pointer;z-index:50;box-shadow:0 6px 24px rgba(255,204,0,.4)}
.badge.show{display:flex}
.slip{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:2px solid var(--accent);padding:16px;transform:translateY(100%);transition:transform .3s;max-height:75vh;overflow-y:auto;z-index:100;border-radius:16px 16px 0 0}
.slip.open{transform:translateY(0)}
.slip-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.slip-title{font-weight:700;font-size:18px}
.close-btn{background:var(--bg3);border:none;color:var(--text);width:32px;height:32px;border-radius:50%;font-size:20px;cursor:pointer}
.slip-item{background:var(--bg);padding:12px;border-radius:10px;margin-bottom:8px;font-size:14px;position:relative}
.slip-item .remove{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--red);font-size:20px;cursor:pointer}
.slip-item .m{color:var(--text-dim);font-size:12px;margin-top:4px}
.slip-item .o{color:var(--accent);font-weight:700}
.slip-express{background:var(--bg3);padding:8px;border-radius:8px;font-size:12px;color:var(--accent);text-align:center;margin-bottom:8px}
.input-row{display:flex;gap:8px;margin:12px 0}
.input-row input{flex:1;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:16px;outline:none}
.quick-btn{padding:12px 14px;background:var(--bg3);border:none;border-radius:10px;color:var(--text);font-weight:600;cursor:pointer;font-size:13px}
.use-freebet{background:var(--accent);color:#000;border:none;padding:10px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;width:100%;margin-bottom:8px;display:none}
.use-freebet.show{display:block}
.payout{background:var(--bg);padding:14px;border-radius:10px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;font-size:14px}
.payout strong{color:var(--accent);font-size:20px}
.profile{padding:16px}
.card{background:var(--bg2);border-radius:12px;padding:16px;margin-bottom:12px;border:1px solid var(--border)}
.card h3{font-size:16px;margin-bottom:12px;color:var(--accent)}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}
.row:last-child{border:none}
.row span:first-child{color:var(--text-dim)}
.history-item{background:var(--bg);padding:10px;border-radius:8px;margin-bottom:6px;font-size:13px}
.history-item .status{font-weight:700;margin-left:6px}
.status.pending{color:var(--accent)}
.status.win{color:var(--green)}
.status.lose{color:var(--red)}
.status.return{color:var(--blue)}
.status.cashout{color:#ff9500}
.cashout-btn{background:linear-gradient(135deg,#ff9500,#ffcc00);color:#000;border:none;padding:8px 12px;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer;margin-top:6px;width:100%}
.deposit-btn-big{width:100%;padding:14px;background:linear-gradient(135deg,var(--green),#2ea043);border:none;color:#fff;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer;margin-top:8px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-120px);background:var(--green);color:#fff;padding:14px 24px;border-radius:12px;font-weight:600;z-index:1000;transition:transform .3s;max-width:90%;text-align:center;font-size:14px}
.toast.show{transform:translateX(-50%) translateY(0)}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--border);display:flex;padding:10px 0 max(10px,env(safe-area-inset-bottom));z-index:40}
.nav-item{flex:1;background:none;border:none;color:var(--text-dim);font-size:11px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px}
.nav-item.active{color:var(--accent)}
.nav-item .icon{font-size:20px}
.spread-modal{position:fixed;inset:0;background:var(--bg);z-index:500;display:none;flex-direction:column;overflow:hidden}
.spread-modal.show{display:flex}
.spread-head{background:var(--bg2);padding:12px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-shrink:0;gap:8px}
.spread-head-left{flex:1;min-width:0}
.spread-back{background:none;border:none;color:var(--text);font-size:24px;cursor:pointer;padding:0 12px 0 0;flex-shrink:0}
.spread-league{font-size:11px;color:var(--text-dim);margin-bottom:2px}
.spread-teams-line{font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.spread-teams-line .sc{color:var(--accent);font-weight:900;font-size:20px}
.spread-meta{font-size:11px;color:var(--text-dim);margin-top:2px}
.spread-icon-btn{background:var(--bg3);border:none;color:var(--text);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:16px}
.spread-icon-btn.active{background:var(--accent);color:#000}
.spread-tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.spread-tabs::-webkit-scrollbar{display:none}
.spread-tab{padding:12px 16px;background:none;border:none;color:var(--text-dim);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
.spread-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.spread-body{flex:1;overflow-y:auto;padding-bottom:100px;background:var(--bg)}
.market-section{background:var(--bg2);margin:8px 12px;border-radius:12px;padding:14px;border:1px solid var(--border)}
.market-title{font-size:14px;font-weight:700;color:var(--accent);margin-bottom:12px}
.market-row{display:flex;gap:6px;margin-bottom:6px}
.market-row:last-child{margin-bottom:0}
.market-btn{flex:1;background:var(--bg3);border:2px solid transparent;border-radius:8px;padding:10px 4px;cursor:pointer;text-align:center;min-width:0}
.market-btn.selected{background:var(--accent);border-color:var(--accent)}
.market-btn.selected .mbl,.market-btn.selected .mbv{color:#000}
.market-btn.locked{opacity:.4}
.market-btn .mbl{display:block;color:var(--text-dim);font-size:10px;margin-bottom:2px;font-weight:600}
.market-btn .mbv{display:block;color:var(--text);font-size:14px;font-weight:700}
.total-selector{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.total-selector::-webkit-scrollbar{display:none}
.total-num{padding:8px 14px;background:var(--bg);border:2px solid var(--border);border-radius:8px;color:var(--text-dim);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.total-num.active{background:var(--accent);border-color:var(--accent);color:#000}
.score-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.score-cell{background:var(--bg3);border:2px solid transparent;border-radius:8px;padding:10px 6px;cursor:pointer;text-align:center}
.score-cell.selected{background:var(--accent);border-color:var(--accent)}
.score-cell.selected .scv{color:#000}
.score-cell .scl{font-size:10px;color:var(--text-dim);margin-bottom:2px}
.score-cell .scv{font-size:14px;font-weight:700;color:var(--text)}
.stats-body{padding:16px}
.stat-item{margin-bottom:16px}
.stat-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;font-weight:600}
.stat-bar{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;display:flex}
.stat-bar-home{background:var(--accent);height:100%}
.stat-bar-away{background:var(--green);height:100%}
.stat-val-home{color:var(--accent)}
.stat-val-away{color:var(--green)}
.no-data{color:var(--text-dim);text-align:center;padding:40px 20px;font-size:14px}
.sync-info{background:var(--bg);padding:8px 12px;border-radius:8px;font-size:11px;color:var(--text-dim);text-align:center;margin:8px 12px}
</style>
</head>
<body>
<div id="authScreen">
  <div class="logo">BET<span>APP</span></div>
  <div class="subtitle">Ставки на спорт • Live</div>
  <div class="auth-box">
    <div class="auth-tabs">
      <button class="auth-tab active" id="tabLogin" onclick="switchAuth('login')">Вход</button>
      <button class="auth-tab" id="tabReg" onclick="switchAuth('reg')">Регистрация</button>
    </div>
    <div id="msg" class="msg"></div>
    <input id="loginInput" placeholder="Логин">
    <input id="passInput" type="password" placeholder="Пароль">
    <input id="pass2Input" type="password" placeholder="Повтор пароля" style="display:none">
    <button class="btn-primary" id="submitBtn" onclick="submitAuth()">Войти</button>
  </div>
</div>
<div id="appScreen">
  <div class="header">
    <div class="logo">BET<span>APP</span></div>
    <div class="right-head">
      <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">🌙</button>
      <div class="freebet-badge" id="freebetBadge" onclick="showPage('roulette')">🎁 <span id="freebetAmount">0</span></div>
      <div class="balance" id="balance" onclick="showDeposit()">💰 10 000 ₽</div>
    </div>
  </div>
  <div id="pageBets">
    <div class="tabs" id="tabs"></div>
    <div class="sync-info" id="syncInfo">🕒 Синхронизация</div>
    <div id="matches"></div>
    <div id="ufcContainer" style="display:none"></div>
  </div>
  <div id="pageRoulette" style="display:none">
    <div style="padding:20px 16px;text-align:center">
      <div style="font-size:24px;font-weight:900;margin-bottom:8px">🎰 Колесо</div>
      <div style="color:var(--text-dim);font-size:14px;margin-bottom:24px">Раз в неделю</div>
      <div style="position:relative;width:280px;height:280px;margin:0 auto 24px">
        <div style="position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:30px solid var(--accent);z-index:10"></div>
        <div id="wheel" style="width:100%;height:100%;border-radius:50%;transition:transform 5s cubic-bezier(.17,.67,.15,1);background:conic-gradient(#ffcc00 0deg 60deg,#238636 60deg 120deg,#f85149 120deg 180deg,#58a6ff 180deg 240deg,#a371f7 240deg 300deg,#ff9500 300deg 360deg);border:6px solid var(--bg2)"></div>
      </div>
      <button class="btn-primary" id="spinBtn" onclick="spinWheel()" style="max-width:240px;margin-bottom:12px">КРУТИТЬ 🎰</button>
      <div id="cooldown" style="color:var(--text-dim);font-size:14px"></div>
    </div>
  </div>
  <div id="pageProfile" style="display:none">
    <div class="profile">
      <div class="card">
        <h3>👤 Профиль</h3>
        <div class="row"><span>Логин</span><span id="pName">—</span></div>
        <div class="row"><span>Баланс</span><span id="pBalance">—</span></div>
        <div class="row"><span>Фрибеты</span><span id="pFreebet">0 ₽</span></div>
        <div class="row"><span>Всего ставок</span><span id="pBets">0</span></div>
        <div class="row"><span>Выигрышей</span><span id="pWins">0</span></div>
        <div class="row"><span>В игре</span><span id="pInPlay">0 ₽</span></div>
        <div class="row"><span>Лимит</span><span id="pLimit">—</span></div>
        <button class="deposit-btn-big" onclick="showDeposit()">💳 Пополнить</button>
      </div>
      <div class="card">
        <h3>📜 История</h3>
        <div id="history"></div>
      </div>
      <button class="btn-primary" style="background:var(--red);color:#fff" onclick="logout()">Выйти</button>
    </div>
  </div>
</div>
<div class="badge" id="badge" onclick="toggleSlip()"><span id="badgeCount">0</span></div>
<div class="slip" id="slip">
  <div class="slip-head"><div class="slip-title">🎫 Купон</div><button class="close-btn" onclick="toggleSlip()">✕</button></div>
  <div id="slipItems"></div>
  <div id="slipExpress"></div>
  <button class="use-freebet" id="useFreebetBtn" onclick="toggleFreebet()">🎁 Использовать фрибет</button>
  <div class="input-row">
    <input id="stakeInput" type="number" value="100" min="10">
    <button class="quick-btn" onclick="setStake(100)">100</button>
    <button class="quick-btn" onclick="setStake(500)">500</button>
    <button class="quick-btn" onclick="setStake(1000)">1000</button>
  </div>
  <div class="payout"><span>Выигрыш:</span><strong id="payout">0 ₽</strong></div>
  <button class="btn-primary" onclick="placeBet()">Сделать ставку</button>
</div>
<div class="bottom-nav" id="bottomNav" style="display:none">
  <button class="nav-item active" onclick="showPage('bets')" id="navBets"><span class="icon">⚽</span>Линия</button>
  <button class="nav-item" onclick="showPage('roulette')" id="navRoulette"><span class="icon">🎰</span>Рулетка</button>
  <button class="nav-item" onclick="showPage('profile')" id="navProfile"><span class="icon">👤</span>Профиль</button>
</div>
<div id="resultModal" style="position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;justify-content:center;align-items:center;z-index:2000;padding:20px">
  <div style="background:var(--bg2);border-radius:20px;padding:32px 24px;max-width:340px;width:100%;text-align:center;border:2px solid var(--accent)">
    <div style="font-size:64px;margin-bottom:8px" id="resultEmoji">🎉</div>
    <h2 style="font-size:26px;margin-bottom:12px" id="resultTitle">Поздравляем!</h2>
    <div style="font-size:48px;font-weight:900;color:var(--accent);margin:16px 0" id="resultAmount">0 ₽</div>
    <p style="color:var(--text-dim);font-size:14px;margin-bottom:20px" id="resultText">Фрибет зачислен</p>
    <button class="btn-primary" onclick="closeResult()">Забрать 🎁</button>
  </div>
</div>
<div class="spread-modal" id="spreadModal">
  <div class="spread-head">
    <button class="spread-back" onclick="closeSpread()">←</button>
    <div class="spread-head-left" id="spreadHeadInfo"></div>
    <div style="display:flex;gap:6px;align-items:center">
      <button class="spread-icon-btn" id="statsBtn" onclick="toggleStats()">📊</button>
    </div>
  </div>
  <div class="spread-tabs" id="spreadTabs"></div>
  <div class="spread-body" id="spreadBody"></div>
</div>
<div class="toast" id="toast"></div>

<script>

let DB={},currentUser=null,balance=0,freebet=0,bets=[],betHistory=[];
let selectedSport='⚽ Футбол',authMode='login',useFreebet=false;
let shownGoalKeys={},currentSpreadMatch=null,currentSpreadTab='match',currentSpreadStat=false;
let totalLine=2.5,half1TotalLine=0.5,half2TotalLine=0.5,myBetMatchIds={};
const DAILY_LIMIT=1500000,WEEK_MS=7*24*60*60*1000;
const PRIZES=[500,1000,2500,5000,10000,15000];
const EPOCH_OFFSET=1735689600;
const SPORTS=['⚽ Футбол','🥊 UFC'];
const AVG_GOALS_PER_MATCH=2.7;

function toggleTheme(){const l=document.body.classList.toggle('light');localStorage.setItem('betapp_theme',l?'light':'dark');document.getElementById('themeBtn').textContent=l?'☀️':'🌙';}
(function(){if((localStorage.getItem('betapp_theme')||'dark')==='light'){document.body.classList.add('light');setTimeout(()=>{const b=document.getElementById('themeBtn');if(b)b.textContent='☀️';},100);}})();
try{DB=JSON.parse(localStorage.getItem('betapp_users')||'{}');currentUser=localStorage.getItem('betapp_current');}catch(e){DB={};}
function saveDB(){try{localStorage.setItem('betapp_users',JSON.stringify(DB));}catch(e){}}
function saveCurrent(){try{if(currentUser)localStorage.setItem('betapp_current',currentUser);else localStorage.removeItem('betapp_current');}catch(e){}}
function seededRandom(seed){const x=Math.sin(seed*12.9898)*43758.5453;return x-Math.floor(x);}

function factorial(n){if(n<=1)return 1;let r=1;for(let i=2;i<=n;i++)r*=i;return r;}

function ratingToOdds(rH,rA){
  const diff=(rH+1)-rA;
  let pH=1/(1+Math.exp(-diff*0.45));
  let pD=0.25+Math.max(0,(1-Math.abs(diff)/10)*0.07);
  pD=Math.max(0.20,Math.min(0.32,pD));
  let pA=1-pH-pD;
  if(pA<0.04){pA=0.04;pH=1-pD-pA;}
  if(pH<0.04){pH=0.04;pA=1-pD-pH;}
  const margin=1.05;
  let o1=1/(pH*margin),oX=1/(pD*margin),o2=1/(pA*margin);
  o1=Math.max(1.05,Math.min(25,o1));
  oX=Math.max(3.20,Math.min(5.50,oX));
  o2=Math.max(1.05,Math.min(30,o2));
  return [Math.round(o1*100)/100,Math.round(oX*100)/100,Math.round(o2*100)/100];
}

function getMatchOdds(match,state){
  const base=match.baseOdds;
  if(!state.live)return base.map(o=>o);
  const [h,a]=state.score;
  const diff=h-a;
  const min=state.minute;
  const timeLeft=Math.max(1,90-min);
  const progress=Math.min(min/90,1);
  const avgRate=AVG_GOALS_PER_MATCH/90;
  const expectedGoalsRemaining=timeLeft*avgRate;
  const homeStrength=match.homeRating+1;
  const awayStrength=match.awayRating;
  const homeShare=homeStrength/(homeStrength+awayStrength);
  const awayShare=1-homeShare;
  const lambdaHome=expectedGoalsRemaining*homeShare;
  const lambdaAway=expectedGoalsRemaining*awayShare;
  let p1=0,pX=0,p2=0;
  for(let gh=0;gh<=5;gh++){
    for(let ga=0;ga<=5;ga++){
      const pH=Math.exp(-lambdaHome)*Math.pow(lambdaHome,gh)/factorial(gh);
      const pA=Math.exp(-lambdaAway)*Math.pow(lambdaAway,ga)/factorial(ga);
      const p=pH*pA;
      const finalH=h+gh;
      const finalA=a+ga;
      if(finalH>finalA)p1+=p;
      else if(finalH===finalA)pX+=p;
      else p2+=p;
    }
  }
  const total=p1+pX+p2;
  if(total>0){p1/=total;pX/=total;p2/=total;}
  const margin=1.06;
  let o1=p1>0.01?1/(p1*margin):50;
  let oX=pX>0.01?1/(pX*margin):25;
  let o2=p2>0.01?1/(p2*margin):50;
  if(diff===0&&progress>0.85){oX=Math.max(1.15,oX*(1-(progress-0.85)*3));}
  if(progress>0.85){if(diff>0)o1=Math.max(1.03,o1*0.5);if(diff<0)o2=Math.max(1.03,o2*0.5);}
  o1=Math.max(1.01,Math.min(50,o1));
  oX=Math.max(1.05,Math.min(30,oX));
  o2=Math.max(1.01,Math.min(50,o2));
  return [Math.round(o1*100)/100,Math.round(oX*100)/100,Math.round(o2*100)/100];
}

function generateMatches(epoch){
  const matches=[];
  let id=100;
  let tOff=0;
  Object.keys(LEAGUES).forEach(league=>{
    const teams=LEAGUES[league];
    const r=(o)=>seededRandom(epoch*97+league.length*13+o);
    let count=1;
    if(league==='🏴 АПЛ'||league==='🇪🇸 Ла Лига'||league==='🇮🇹 Серия А'||league==='🏆 Лига Чемпионов')count=2;
    for(let i=0;i<count;i++){
      let t1=Math.floor(r(10+i*7)*teams.length);
      let t2=Math.floor(r(11+i*7)*teams.length);
      if(t2===t1)t2=(t1+1)%teams.length;
      const T1=teams[t1],T2=teams[t2];
      const odds=ratingToOdds(T1[1],T2[1]);
      tOff+=25+Math.floor(r(50+i)*25);
      matches.push({id:id++,league,home:T1[0],away:T2[0],homeRating:T1[1],awayRating:T2[1],baseOdds:odds,startOffset:tOff});
    }
  });
  return matches;
}

let MATCHES_CACHE=[],MATCHES_EPOCH=-1;
function refreshMatches(){const e=Math.floor(Date.now()/900000);if(e===MATCHES_EPOCH)return;MATCHES_EPOCH=e;MATCHES_CACHE=generateMatches(e);}
function findMatchById(id){refreshMatches();return MATCHES_CACHE.find(m=>m.id===id);}

const MATCH_DURATION=300,BREAK_DURATION=30,AFTER_DURATION=60;
const CYCLE=MATCH_DURATION+BREAK_DURATION+AFTER_DURATION;
const FIRST_HALF_SEC=145,SECOND_HALF_SEC=145;

function generateScenario(match,cI){
  const seed=match.id*7777777+cI*13;
  const r=(o)=>seededRandom(seed+o);
  const rG=r(1);
  let tg;
  if(rG<0.25)tg=0;else if(rG<0.55)tg=1;else if(rG<0.78)tg=2;else if(rG<0.92)tg=3;else if(rG<0.98)tg=4;else tg=5;
  const hs=match.homeRating+0.5,as=match.awayRating;
  const hp=hs/(hs+as);
  const i1=1+Math.floor(r(2)*4),i2=2+Math.floor(r(3)*5);
  const goals=[];
  for(let i=0;i<tg;i++){
    const mn=1+Math.floor(r(100+i)*90);
    const ha=r(200+i)<hp?0:1;
    goals.push([ha,mn]);
  }
  goals.sort((a,b)=>a[1]-b[1]);
  return {goals,injury1:i1,injury2:i2,totalGoals:tg,redHome:r(300)>0.92?(40+Math.floor(r(301)*40)):0,redAway:r(310)>0.92?(40+Math.floor(r(311)*40)):0,yellowHome:1+Math.floor(r(320)*4),yellowAway:1+Math.floor(r(330)*4)};
}

function getMatchState(match){
  const nowSec=Math.floor(Date.now()/1000)-EPOCH_OFFSET;
  const epochShift=Math.floor(Date.now()/900000);
  const cycleTotalSec=epochShift*5400+match.startOffset;
  const rawPos=(nowSec-cycleTotalSec)%CYCLE;
  const pos=rawPos<0?rawPos+CYCLE:rawPos;
  const cI=Math.floor((nowSec-cycleTotalSec)/CYCLE);
  const sc=generateScenario(match,cI);
  if(pos<FIRST_HALF_SEC){
    const p=pos/FIRST_HALF_SEC;
    const gm=Math.floor(p*(45+sc.injury1));
    let h=0,a=0;
    sc.goals.forEach(g=>{if(g[1]<=gm&&g[1]<=45+sc.injury1){if(g[0]===0)h++;else a++;}});
    let t=gm+"'";if(gm>45)t="45+"+(gm-45)+"'";
    return {phase:'first',live:true,minute:gm,timeStr:t,score:[h,a],scenario:sc,cycleIndex:cI};
  }
  if(pos<FIRST_HALF_SEC+BREAK_DURATION){
    const bL=FIRST_HALF_SEC+BREAK_DURATION-pos;
    let h=0,a=0;
    sc.goals.forEach(g=>{if(g[1]<=45+sc.injury1){if(g[0]===0)h++;else a++;}});
    return {phase:'break',live:false,isBreak:true,breakLeft:bL,minute:45,timeStr:'Перерыв',score:[h,a],scenario:sc,cycleIndex:cI};
  }
  if(pos<FIRST_HALF_SEC+BREAK_DURATION+SECOND_HALF_SEC){
    const pI2=pos-FIRST_HALF_SEC-BREAK_DURATION;
    const p=pI2/SECOND_HALF_SEC;
    const tS=45+sc.injury2;
    const gm=45+Math.floor(p*tS);
    let h=0,a=0;
    sc.goals.forEach(g=>{if(g[1]<=gm){if(g[0]===0)h++;else a++;}});
    let t=gm+"'";if(gm>90)t="90+"+(gm-90)+"'";
    return {phase:'second',live:true,minute:gm,timeStr:t,score:[h,a],scenario:sc,cycleIndex:cI};
  }
  const aP=pos-FIRST_HALF_SEC-BREAK_DURATION-SECOND_HALF_SEC;
  const aL=AFTER_DURATION-aP;
  let h=0,a=0;
  sc.goals.forEach(g=>{if(g[0]===0)h++;else a++;});
  return {phase:'after',live:false,isFinished:true,afterLeft:aL,minute:90+sc.injury2,timeStr:'Завершён',score:[h,a],scenario:sc,cycleIndex:cI};
}

function getTotalOdds(state,line){
  const [h,a]=state.score;
  const tG=h+a;
  const mn=state.minute;
  const tL=Math.max(1,90-mn);
  if(state.phase==='after'){if(tG>line)return[1.01,99.00];if(tG===line)return[1.01,1.01];return[99.00,1.01];}
  if(tG>line)return[1.01,99.00];
  if(tG===line)return[1.01,1.01];
  const needed=Math.floor(line)-tG+1;
  const eG=tL*(AVG_GOALS_PER_MATCH/90);
  let cumul=Math.exp(-eG),p=cumul;
  for(let k=1;k<needed;k++){p=p*eG/k;cumul+=p;}
  let pO=1-cumul;
  pO=Math.max(0.15,Math.min(0.85,pO));
  let o=Math.round((1/pO)*100)/100;
  let u=Math.round((1/(1-pO))*100)/100;
  if(o<1.15)o=1.15;if(u<1.10)u=1.10;if(o>8)o=8;if(u>8)u=8;
  return [o,u];
}

function getHalfTotalOdds(state,half,line){
  if(half===1){
    if(state.phase!=='first')return null;
    const [h,a]=state.score;
    const g1=h+a;
    const mn=state.minute;
    if(g1>line)return[1.01,99.00];
    if(g1===line)return[1.01,1.01];
    if(mn>=46)return[99.00,1.01];
    const tL=Math.max(1,45-mn);
    const n=Math.floor(line)-g1+1;
    const eG=tL*(1.25/45);
    let c=Math.exp(-eG),p=c;
    for(let k=1;k<n;k++){p=p*eG/k;c+=p;}
    let pO=1-c;
    pO=Math.max(0.20,Math.min(0.80,pO));
    let o=Math.round((1/pO)*100)/100,u=Math.round((1/(1-pO))*100)/100;
    if(o<1.15)o=1.15;if(u<1.15)u=1.15;if(o>6)o=6;if(u>6)u=6;
    return [o,u];
  } else {
    if(state.phase==='first'||state.phase==='break')return 'notStarted';
    if(state.phase==='after')return null;
    const g2=state.scenario.goals.filter(g=>g[1]>45&&g[1]<=state.minute).length;
    const mn=state.minute;
    if(g2>line)return[1.01,99.00];
    if(g2===line)return[1.01,1.01];
    if(mn>=91)return[99.00,1.01];
    const tL=Math.max(1,90-mn);
    const n=Math.floor(line)-g2+1;
    const eG=tL*(1.25/45);
    let c=Math.exp(-eG),p=c;
    for(let k=1;k<n;k++){p=p*eG/k;c+=p;}
    let pO=1-c;
    pO=Math.max(0.20,Math.min(0.80,pO));
    let o=Math.round((1/pO)*100)/100,u=Math.round((1/(1-pO))*100)/100;
    if(o<1.15)o=1.15;if(u<1.15)u=1.15;if(o>6)o=6;if(u>6)u=6;
    return [o,u];
  }
}

function getBttsOdds(state){
  const [h,a]=state.score;
  if(h>0&&a>0)return[1.01,25.00];
  const prog=state.minute/90;
  let y=0.65-prog*0.5;
  if(h>0||a>0)y+=0.15;
  y=Math.max(0.05,Math.min(0.9,y));
  return [Math.round((1/y)*100)/100,Math.round((1/(1-y))*100)/100];
}

function getNextGoalOdds(state){
  const [h,a]=state.score;
  const d=h-a;
  const prog=Math.min(state.minute/90,1);
  let hp=0.45+d*0.05,ap=0.45-d*0.05,np=0.10+prog*0.7;
  hp=Math.max(0.05,hp*(1-prog*0.5));
  ap=Math.max(0.05,ap*(1-prog*0.5));
  np=Math.max(0.05,np);
  const s=hp+ap+np;hp/=s;ap/=s;np/=s;
  return [Math.round((1/hp)*100)/100,Math.round((1/np)*100)/100,Math.round((1/ap)*100)/100];
}

function getDoubleChanceOdds(odds){
  const [o1,oX,o2]=odds;
  if(o1===0||oX===0||o2===0)return[0,0,0];
  const p1=1/o1,pX=1/oX,p2=1/o2;
  const s=p1+pX+p2;
  return [Math.round((1/((p1+pX)/s))*100)/100,Math.round((1/((p1+p2)/s))*100)/100,Math.round((1/((pX+p2)/s))*100)/100];
}

function getExactScoreOdds(state){
  const [h,a]=state.score;
  const mn=state.minute;
  const tl=Math.max(5,90-mn);
  const scores=['0:0','1:0','0:1','1:1','2:0','0:2','2:1','1:2','2:2'];
  const cur=h+':'+a;
  return scores.map(s=>{
    let prob;
    const [sh,sa]=s.split(':').map(Number);
    if(s===cur)prob=0.5+(1-tl/90)*0.45;
    else if(sh<h||sa<a)prob=0.005;
    else{const gd=(sh-h)+(sa-a);prob=Math.pow(0.35,gd)*(tl/90)*0.25;}
    prob=Math.max(0.005,Math.min(0.99,prob));
    return {score:s,odds:Math.min(99,Math.round((1/prob)*100)/100)};
  });
}

function getMatchStats(match,state){
  const seed=match.id*999+state.cycleIndex*31;
  const r=(o)=>seededRandom(seed+o);
  const prog=Math.min(state.minute/90,1);
  const bPH=45+Math.floor(r(1)*15);
  const pH=Math.min(70,Math.max(30,bPH+(state.score[0]-state.score[1])*2));
  const pA=100-pH;
  const aH=Math.floor(prog*(50+r(2)*40));
  const aA=Math.floor(prog*(50+r(3)*40));
  const dH=Math.floor(aH*0.4),dA=Math.floor(aA*0.4);
  const sH=Math.floor(prog*(8+r(4)*8)),sA=Math.floor(prog*(8+r(5)*8));
  const oH=Math.max(state.score[0],Math.floor(sH*0.4));
  const oA=Math.max(state.score[1],Math.floor(sA*0.4));
  const cH=Math.floor(prog*(3+r(6)*5)),cA=Math.floor(prog*(3+r(7)*5));
  const rH=state.minute>=state.scenario.redHome&&state.scenario.redHome>0?1:0;
  const rA=state.minute>=state.scenario.redAway&&state.scenario.redAway>0?1:0;
  const yH=Math.floor(prog*state.scenario.yellowHome);
  const yA=Math.floor(prog*state.scenario.yellowAway);
  return {possHome:pH,possAway:pA,attacksHome:aH,attacksAway:aA,dangerousHome:dH,dangerousAway:dA,shotsHome:sH,shotsAway:sA,onTargetHome:oH,onTargetAway:oA,cornersHome:cH,cornersAway:cA,redHome:rH,redAway:rA,yellowHome:yH,yellowAway:yA};
}

function checkLock(match,state){
  if(state.isFinished)return{locked:true,reason:'⏸ Матч завершён'};
  if(state.isBreak)return{locked:true,reason:'⏸ Перерыв'};
  if(!state.live)return{locked:false,reason:''};
  const rsp=(state.phase==='first'?FIRST_HALF_SEC/45:SECOND_HALF_SEC/45);
  const mToG=3/rsp;
  for(const g of state.scenario.goals){
    const m=g[1]-state.minute;
    if(m>0&&m<=mToG)return{locked:true,reason:'⏸ Ставки приостановлены'};
  }
  return{locked:false,reason:''};
}

function formatTimeLeft(sec){const s=Math.max(0,Math.floor(sec));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function getTodayKey(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function getTodayDeposit(){if(!currentUser||!DB[currentUser])return 0;const t=getTodayKey();
  if(!DB[currentUser].depositDate||DB[currentUser].depositDate!==t){DB[currentUser].depositDate=t;DB[currentUser].depositToday=0;saveDB();}
  return DB[currentUser].depositToday||0;}

  document.getElementById('tabLogin').classList.toggle('active',mode==='login');
  document.getElementById('tabReg').classList.toggle('active',mode==='reg');
  document.getElementById('pass2Input').style.display=mode==='reg'?'block':'none';
  document.getElementById('submitBtn').textContent=mode==='reg'?'Зарегистрироваться':'Войти';
  hideMsg();}
function showMsg(t,ok){const m=document.getElementById('msg');m.textContent=t;m.className='msg show '+(ok?'ok':'err');}
function hideMsg(){document.getElementById('msg').className='msg';}
function submitAuth(){
  const login=document.getElementById('loginInput').value.trim();
  const pass=document.getElementById('passInput').value;
  if(!login||login.length<3)return showMsg('Логин минимум 3 символа',false);
  if(!pass||pass.length<3)return showMsg('Пароль минимум 3 символа',false);
  if(authMode==='reg'){
    const p2=document.getElementById('pass2Input').value;
    if(pass!==p2)return showMsg('Пароли не совпадают',false);
    if(DB[login])return showMsg('Логин занят',false);
    DB[login]={pass,balance:10000,freebet:0,history:[],depositToday:0,depositDate:getTodayKey(),lastSpin:0,createdAt:Date.now()};
    saveDB();
    showMsg('✅ Успешно! Теперь войди',true);
    setTimeout(()=>switchAuth('login'),1200);
    return;
  }
  if(!DB[login])return showMsg('Нет такого аккаунта',false);
  if(DB[login].pass!==pass)return showMsg('Неверный пароль',false);
  currentUser=login;
  balance=DB[login].balance;
  freebet=DB[login].freebet||0;
  betHistory=DB[login].history||[];
  saveCurrent();
  enterApp();
}

  document.getElementById('bottomNav').style.display='flex';
  updateBalanceUI();

}
function logout(){if(!confirm('Выйти?'))return;
  DB[currentUser].balance=balance;
  DB[currentUser].freebet=freebet;
  DB[currentUser].history=betHistory;
  saveDB();
  currentUser=null;

function calculateCashout(bet){
  if(bet.status!=='pending')return 0;
  let tp=1;
  for(const it of bet.items){
    const m=findMatchById(it.matchId);
    if(!m)return 0;
    const s=getMatchState(m);
    if(s.isFinished)return 0;
    const odds=getMatchOdds(m,s);
    let pC=1/it.odds;
    const mk=it.marketKey||'';
    if(mk.startsWith('main_'))pC=1/odds[it.outcome];
    tp*=pC;
  }
  const ip=1/bet.totalOdds;
  let co=bet.stake*(tp/ip)*0.9;
  if(co>bet.potentialWin)co=bet.potentialWin*0.95;
  if(co<bet.stake*0.05)co=bet.stake*0.05;
  return Math.round(co);
}
function cashoutBet(id){
  const bet=betHistory.find(b=>b.id===id);
  if(!bet||bet.status!=='pending')return;
  const amt=calculateCashout(bet);
  if(amt<=0)return showToast('Кэшаут недоступен',false);
  if(!confirm('Забрать '+amt+' ₽ вместо '+bet.potentialWin.toFixed(0)+' ₽?'))return;
  bet.status='cashout';
  bet.cashoutAmount=amt;
  balance+=amt;
  DB[currentUser].balance=balance;
  DB[currentUser].history=betHistory;
  saveDB();
  updateBalanceUI();
  showToast('💸 Кэшаут: +'+amt+' ₽',true);
  renderProfile();
}

function isSelected(mId,mK,o){
  if(mK)return bets.some(b=>b.matchId===mId&&b.marketKey===mK&&b.outcome===o);
  return bets.some(b=>b.matchId===mId&&!b.marketKey&&b.outcome===o);
}
function addBet(mId,market,outcome,odds,label,mK){
  const m=findMatchById(mId);
  if(!m)return;
  const s=getMatchState(m);
  const lock=checkLock(m,s);
  if(lock.locked){showToast('⏸ '+lock.reason,false);return;}
  const k=mK||null;
  const fl=label||['1','X','2'][outcome]||'';
  const idx=bets.findIndex(b=>b.matchId===mId&&b.marketKey===k&&b.outcome===outcome);
  if(idx!==-1)bets.splice(idx,1);
  else bets.push({matchId:mId,outcome,odds,label:fl,home:m.home,away:m.away,market:market||'Исход',marketKey:k});
  renderMatches();
  renderSlip();
  if(currentSpreadMatch===mId)renderSpreadBody();
}
function removeBet(i){bets.splice(i,1);renderMatches();renderSlip();if(currentSpreadMatch)renderSpreadBody();}
function cleanLockedBets(){
  if(!bets.length)return;
  let ch=false;
  for(let i=bets.length-1;i>=0;i--){
    const b=bets[i];
    const m=findMatchById(b.matchId);
    if(!m)continue;
    const s=getMatchState(m);
    const l=checkLock(m,s);
    if(l.locked){bets.splice(i,1);ch=true;}
  }
  if(ch){renderMatches();renderSlip();}
}

function updatePayout(){
  const stake=Number(document.getElementById('stakeInput').value)||0;
  const tO=bets.reduce((a,b)=>a*b.odds,1);
  const win=stake*(bets.length?tO:0);
  let text=win.toFixed(0)+' ₽';
  if(useFreebet&&freebet>0)text+=' ('+Math.min(stake,freebet)+'₽ фрибет)';
  document.getElementById('payout').textContent=text;

function placeBet(){
  if(!bets.length)return showToast('Купон пуст',false);
  const stake=Number(document.getElementById('stakeInput').value)||0;
  if(stake<10)return showToast('Мин. ставка 10 ₽',false);
  let rms=stake,fbu=0;
  if(useFreebet&&freebet>0){fbu=Math.min(stake,freebet);rms=stake-fbu;}
  if(rms>balance)return showToast('Недостаточно средств',false);
  const tO=bets.reduce((a,b)=>a*b.odds,1);
  const pw=stake*tO;
  balance-=rms;
  freebet-=fbu;
  const items=bets.map(b=>{
    const m=findMatchById(b.matchId);
    const s=getMatchState(m);
    return{...b,cycleIndex:s.cycleIndex};
  });
  const record={id:Date.now(),items,stake,freebetUsed:fbu,totalOdds:tO,potentialWin:pw,status:'pending',createdAt:Date.now()};
  betHistory.push(record);
  items.forEach(it=>{myBetMatchIds[it.matchId]=true;});
  DB[currentUser].balance=balance;
  DB[currentUser].freebet=freebet;
  DB[currentUser].history=betHistory;
  saveDB();
  updateBalanceUI();
  updateFreebetUI();
  useFreebet=false;
  const fb=document.getElementById('useFreebetBtn');
  fb.textContent='🎁 Использовать фрибет';
  fb.style.background='var(--accent)';
  fb.style.color='#000';
  let msg='✅ Ставка '+stake+' ₽';
  if(fbu>0)msg+=' (фрибет '+fbu+' ₽)';
  showToast(msg+' | Потенциал: '+pw.toFixed(0)+' ₽');
  bets=[];
  renderMatches();
  renderSlip();
  toggleSlip();
}

function checkBetResults(){
  if(!currentUser)return;
  let changed=false;
  betHistory.forEach(bet=>{
    if(bet.status!=='pending')return;
    let allFin=true,allWon=true,anyRet=false;
    for(const item of bet.items){
      const m=findMatchById(item.matchId);
      if(!m){allFin=false;break;}
      const s=getMatchState(m);
      let fs=null;
      if(s.isFinished&&s.cycleIndex===item.cycleIndex)fs=s.score;
      else if(s.cycleIndex>item.cycleIndex){
        const sc=generateScenario(m,item.cycleIndex);
        let h=0,a=0;
        sc.goals.forEach(g=>{if(g[0]===0)h++;else a++;});
        fs=[h,a];
      }else{allFin=false;break;}
      const [h,a]=fs;
      const t=h+a;
      let won=false,isRet=false;
      const mk=item.marketKey||'';
      if(mk.startsWith('main_')){let o;if(h>a)o=0;else if(h===a)o=1;else o=2;won=(o===item.outcome);}
      else if(mk==='dc_1X')won=(h>=a);
      else if(mk==='dc_12')won=(h!==a);
      else if(mk==='dc_X2')won=(h<=a);
      else if(mk.startsWith('total_over_')){const l=parseFloat(mk.replace('total_over_',''));if(t>l)won=true;else if(t===l)isRet=true;}
      else if(mk.startsWith('total_under_')){const l=parseFloat(mk.replace('total_under_',''));if(t<l)won=true;else if(t===l)isRet=true;}
      else if(mk==='btts_yes')won=(h>0&&a>0);
      else if(mk==='btts_no')won=!(h>0&&a>0);
      else if(mk.startsWith('next_'))won=true;
      else if(mk.startsWith('exact_')){const sc=mk.replace('exact_','');won=(sc===h+':'+a);}
      else if(mk.startsWith('h1_over_')){const l=parseFloat(mk.replace('h1_over_',''));const sc=generateScenario(m,item.cycleIndex);const eH=45+sc.injury1;const g1=sc.goals.filter(g=>g[1]<=eH).length;if(g1>l)won=true;else if(g1===l)isRet=true;}
      else if(mk.startsWith('h1_under_')){const l=parseFloat(mk.replace('h1_under_',''));const sc=generateScenario(m,item.cycleIndex);const eH=45+sc.injury1;const g1=sc.goals.filter(g=>g[1]<=eH).length;if(g1<l)won=true;else if(g1===l)isRet=true;}
      else if(mk.startsWith('h2_over_')){const l=parseFloat(mk.replace('h2_over_',''));const sc=generateScenario(m,item.cycleIndex);const g2=sc.goals.filter(g=>g[1]>45).length;if(g2>l)won=true;else if(g2===l)isRet=true;}
      else if(mk.startsWith('h2_under_')){const l=parseFloat(mk.replace('h2_under_',''));const sc=generateScenario(m,item.cycleIndex);const g2=sc.goals.filter(g=>g[1]>45).length;if(g2<l)won=true;else if(g2===l)isRet=true;}
      else{let o;if(h>a)o=0;else if(h===a)o=1;else o=2;won=(o===item.outcome);}
      if(isRet)anyRet=true;
      if(!won&&!isRet)allWon=false;
    }
    if(allFin){
      if(anyRet&&!allWon){bet.status='lose';showToast('😔 Не сыграла',false);}
      else if(anyRet&&allWon){bet.status='win';balance+=bet.stake;DB[currentUser].balance=balance;updateBalanceUI();showToast('🔄 ВОЗВРАТ! +'+bet.stake+' ₽',true);}
      else if(anyRet){balance+=bet.stake;DB[currentUser].balance=balance;updateBalanceUI();showToast('🔄 ВОЗВРАТ: +'+bet.stake+' ₽',true);bet.status='return';}
      else if(allWon){bet.status='win';balance+=bet.potentialWin;DB[currentUser].balance=balance;updateBalanceUI();showToast('🎉 ВЫИГРЫШ! +'+bet.potentialWin.toFixed(0)+' ₽',true);}
      else{bet.status='lose';showToast('😔 Не сыграла',false);}
      changed=true;
    }
  });
  if(changed){
    DB[currentUser].balance=balance;
    DB[currentUser].history=betHistory;
    saveDB();
    if(document.getElementById('pageProfile').style.display!=='none')renderProfile();
  }
}

function ufcSeed(n){
  const x = Math.sin(n * 12.9898) * 43758.5453;
  return x - Math.floor(x);
}

function ufcGenerateFights(epoch){
  const weights = ['Тяжёлый','Полутяжёлый','Средний','Полусредний','Лёгкий','Полулёгкий','Легчайший','Наилегчайший'];
  const w1 = Math.floor(ufcSeed(epoch * 7 + 1) * weights.length);
  let w2 = Math.floor(ufcSeed(epoch * 7 + 2) * weights.length);
  if(w2 === w1) w2 = (w2 + 1) % weights.length;
  const chosen = [weights[w1], weights[w2]];
  const fights = [];
  let id = 9000;

  chosen.forEach(function(weight, idx){
    const pool = UFC_FIGHTERS.filter(function(f){return f.weight === weight;});
    if(pool.length < 2) return;
    const s1 = Math.floor(ufcSeed(epoch * 13 + idx * 31 + 1) * pool.length);
    let s2 = Math.floor(ufcSeed(epoch * 13 + idx * 31 + 2) * pool.length);
    if(s2 === s1) s2 = (s1 + 1) % pool.length;
    const f1 = pool[s1], f2 = pool[s2];

    const rankDiff = f2.rank - f1.rank;
    let pH = 1 / (1 + Math.exp(-rankDiff * 0.45));
    pH = Math.max(0.25, Math.min(0.75, pH));
    const o1 = Math.max(1.10, Math.min(8, Math.round((1/(pH*1.05))*100)/100));
    const o2 = Math.max(1.10, Math.min(8, Math.round((1/((1-pH)*1.05))*100)/100));

    const sc = ufcSeed(epoch * 17 + idx * 51 + 3);
    let totalRounds;
    if(sc < 0.20) totalRounds = 1;
    else if(sc < 0.40) totalRounds = 2;
    else if(sc < 0.65) totalRounds = 3;
    else if(sc < 0.82) totalRounds = 4;
    else totalRounds = 5;

    const mSc = ufcSeed(epoch * 19 + idx * 53 + 4);
    let method, methodLabel;
    if(mSc < 0.40){ method = 'KO'; methodLabel = 'KO/TKO'; }
    else if(mSc < 0.65){ method = 'SUB'; methodLabel = 'Сабмишен'; }
    else { method = 'DEC'; methodLabel = 'Решением'; }

    if(method === 'DEC'){
      totalRounds = ufcSeed(epoch * 23 + idx * 55 + 5) < 0.5 ? 3 : 5;
    }

    const winner = ufcSeed(epoch * 29 + idx * 57 + 6) < pH ? 0 : 1;

    let hR = 0, aR = 0;
    for(let i = 0; i < totalRounds; i++){
      const r = ufcSeed(epoch * 31 + idx * 59 + 10 + i);
      let rw;
      if(winner === 0) rw = r < 0.6 ? 0 : 1;
      else rw = r < 0.6 ? 1 : 0;
      if(i === totalRounds - 1 && method !== 'DEC') rw = winner;
      if(rw === 0) hR++; else aR++;
    }
    if(method === 'DEC' && hR === aR){
      if(winner === 0) hR++; else aR++;
    }

    fights.push({
      id: id++,
      league: '🥊 UFC • ' + weight,
      home: f1.name, away: f2.name,
      homeNick: f1.nickname, awayNick: f2.nickname,
      homeColor: f1.color, awayColor: f2.color,
      baseOdds: [o1, 0, o2],
      weight: weight,
      isUfc: true,
      baseTotal: totalRounds + 0.5,
      scenario: {totalRounds: totalRounds, roundsH: hR, roundsA: aR, winner: winner, method: method, methodLabel: methodLabel}
    });
  });

  return fights;
}

function ufcGetFights(){
  const epoch = Math.floor(Date.now() / 180000);
  if(!window.UFC_CACHE || window.UFC_CACHE.epoch !== epoch){
    window.UFC_CACHE = { epoch: epoch, fights: ufcGenerateFights(epoch) };
  }
  return window.UFC_CACHE.fights;
}

function ufcGetState(fight){
  const nowMs = Date.now();
  const epoch = Math.floor(nowMs / 180000);
  const posSec = (nowMs - epoch * 180000) / 1000;
  const sc = fight.scenario;
  const ROUND_SEC = 24;
  const FIGHT_SEC = ROUND_SEC * sc.totalRounds;
  const AFTER_SEC = 30;

  if(posSec < FIGHT_SEC){
    const rIdx = Math.floor(posSec / ROUND_SEC);
    const secLeft = ROUND_SEC - (posSec - rIdx * ROUND_SEC);
    return {
      phase: 'fight', live: true, locked: false,
      round: rIdx + 1, totalRounds: sc.totalRounds,
      timeStr: 'R' + (rIdx + 1) + ' • ' + Math.ceil(secLeft) + 'с',
      currentTotal: (sc.totalRounds - rIdx) + 0.5,
      score: null, winner: null, method: null, scenario: sc
    };
  }
  if(posSec < FIGHT_SEC + AFTER_SEC){
    return {
      phase: 'result', live: false, locked: true,
      round: sc.totalRounds, totalRounds: sc.totalRounds,
      timeStr: '✅ Завершён',
      currentTotal: fight.baseTotal,
      score: [sc.roundsH, sc.roundsA],
      winner: sc.winner, method: sc.methodLabel, methodShort: sc.method,
      scenario: sc
    };
  }
  const waitLeft = Math.ceil(180 - posSec);
  return {
    phase: 'wait', live: false, locked: true,
    round: 0, totalRounds: sc.totalRounds,
    timeStr: '⏸ Следующий бой через ' + ufcFmtTime(waitLeft),
    waitLeft: waitLeft,
    currentTotal: fight.baseTotal,
    score: [sc.roundsH, sc.roundsA],
    winner: sc.winner, method: sc.methodLabel, methodShort: sc.method,
    scenario: sc
  };
}

function ufcFmtTime(sec){
  sec = Math.max(0, Math.floor(sec));
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return m + ':' + (s < 10 ? '0' : '') + s;
}

function ufcGetOdds(fight, state){
  if(state.locked){
    if(state.winner === 0) return [1.01, 0, 50.00];
    if(state.winner === 1) return [50.00, 0, 1.01];
    return [1.01, 0, 1.01];
  }
  return [fight.baseOdds[0], 0, fight.baseOdds[2]];
}

function ufcTotalOdds(state){
  if(state.phase === 'fight'){
    const left = state.totalRounds - (state.round - 1);
    const overOdds = Math.max(1.30, Math.round((1.50 + left * 0.12) * 100) / 100);
    const underOdds = Math.max(1.30, Math.round((2.40 - left * 0.10) * 100) / 100);
    return { over: overOdds, under: underOdds };
  }
  return { over: 1.85, under: 1.95 };
}

function ufcAvatar(fighter, size, status){
  size = size || 44;
  const initials = fighter.name.split(' ').map(function(w){return w[0]||'';}).join('').substring(0,2).toUpperCase();
  const color = fighter.color || '#ffcc00';
  let ring = 'border:2px solid rgba(255,255,255,.15);';
  let glow = '';
  if(status === 'win'){
    ring = 'border:3px solid var(--green);';
    glow = 'box-shadow:0 0 0 2px rgba(35,134,54,.4),0 0 12px rgba(35,134,54,.6);';
  } else if(status === 'lose'){
    ring = 'border:3px solid var(--red);';
    glow = 'box-shadow:0 0 0 2px rgba(218,54,51,.4),0 0 12px rgba(218,54,51,.6);';
  }
  return '<div style="width:'+size+'px;height:'+size+'px;border-radius:50%;background:'+color+';display:flex;justify-content:center;align-items:center;font-weight:900;color:#fff;font-size:'+Math.floor(size*0.38)+'px;flex-shrink:0;'+ring+glow+'">'+initials+'</div>';
}

function ufcFind(name){
  return UFC_FIGHTERS.find(function(f){return f.name === name;}) || {name:name, nickname:'', color:'#555'};
}

function ufcRenderCard(fight){
  const st = ufcGetState(fight);
  const odds = ufcGetOdds(fight, st);
  const totalOdds = ufcTotalOdds(st);
  const f1 = ufcFind(fight.home);
  const f2 = ufcFind(fight.away);

  let status1 = '', status2 = '';
  if(st.phase === 'result' || st.phase === 'wait'){
    if(st.winner === 0){ status1 = 'win'; status2 = 'lose'; }
    else { status1 = 'lose'; status2 = 'win'; }
  }

  const liveBadge = st.live ? '<span style="background:var(--red);color:#fff;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:800;">🔴 LIVE</span>' : '';
  const doneBadge = (st.phase === 'result') ? '<span style="background:var(--green);color:#fff;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:800;">✅ ЗАВЕРШЁН</span>' : '';
  const lockBadge = (st.phase === 'wait') ? '<span style="background:#555;color:#fff;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:800;">🔒 СТАВКИ ЗАКРЫТЫ</span>' : '';

  let score1 = '', score2 = '';
  if(st.phase === 'result' || st.phase === 'wait'){
    score1 = '<div style="font-size:22px;font-weight:900;color:'+(st.winner===0?'var(--green)':'var(--red)')+'">'+st.score[0]+'</div>';
    score2 = '<div style="font-size:22px;font-weight:900;color:'+(st.winner===1?'var(--green)':'var(--red)')+'">'+st.score[1]+'</div>';
  }

  let body = '';
  if(st.phase === 'fight'){
    body = '<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:12px;color:var(--text-dim);">'
      + '<span style="font-weight:800;color:var(--accent);">'+st.timeStr+'</span>'
      + '<span>Раунд '+st.round+' из '+st.totalRounds+'</span>'
      + '</div>';
  } else if(st.phase === 'result'){
    const winnerName = st.winner === 0 ? fight.home : fight.away;
    const totalResult = fight.scenario.totalRounds < fight.baseTotal ? 'меньше' : 'больше';
    body = '<div style="text-align:center;padding:8px 0;">'
      + '<div style="font-size:15px;font-weight:900;color:var(--text);">Победил '+winnerName+'</div>'
      + '<div style="font-size:13px;color:var(--accent);margin-top:2px;">'+st.method+' в '+st.round+' раунде &nbsp; '+st.score[0]+':'+st.score[1]+'</div>'
      + '<div style="font-size:10px;color:var(--text-dim);margin-top:6px;">Тотал раундов: '+fight.baseTotal+' — сыграло «'+totalResult+'»</div>'
      + '</div>';
  } else {
    const winnerName = st.winner === 0 ? fight.home : fight.away;
    body = '<div style="text-align:center;padding:8px 0;">'
      + '<div style="font-size:14px;font-weight:900;color:var(--text);">Победил '+winnerName+'</div>'
      + '<div style="font-size:11px;color:var(--accent);margin-top:2px;">'+st.method+' в '+st.round+' раунде &nbsp; '+st.score[0]+':'+st.score[1]+'</div>'
      + '<div style="font-size:11px;color:var(--text-dim);margin-top:8px;">⏸ Следующий бой через '+ufcFmtTime(st.waitLeft)+'</div>'
      + '</div>';
  }

  function oddBtn(label, odd, action, disabled){
    const bg = disabled ? 'var(--bg3)' : 'var(--blue)';
    const col = disabled ? 'var(--text-dim)' : '#fff';
    return '<button '+(disabled?'disabled':'')+' onclick="'+action+'" style="flex:1;padding:8px 4px;border-radius:8px;border:none;background:'+bg+';color:'+col+';font-weight:800;font-size:13px;cursor:'+(disabled?'not-allowed':'pointer')+';">'+label+'<br><span style="font-size:13px;">'+odd.toFixed(2)+'</span></button>';
  }

  const locked = st.locked;

  return '<div style="background:var(--bg2);border-radius:12px;padding:12px;margin-bottom:10px;border:1px solid var(--border);">'
    + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">'
    + '<div style="font-size:12px;color:var(--text-dim);font-weight:700;">'+fight.league+'</div>'
    + '<div>'+liveBadge+doneBadge+lockBadge+'</div>'
    + '</div>'
    + '<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">'
    + ufcAvatar(f1, 44, status1)
    + '<div style="flex:1;"><div style="font-size:14px;font-weight:800;color:var(--text);">'+fight.home+'</div><div style="font-size:10px;color:var(--text-dim);">'+fight.homeNick+'</div></div>'
    + score1
    + '</div>'
    + '<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">'
    + ufcAvatar(f2, 44, status2)
    + '<div style="flex:1;"><div style="font-size:14px;font-weight:800;color:var(--text);">'+fight.away+'</div><div style="font-size:10px;color:var(--text-dim);">'+fight.awayNick+'</div></div>'
    + score2
    + '</div>'
    + body
    + '<div style="display:flex;gap:6px;margin-top:8px;">'
    + oddBtn('П1', odds[0], "ufcPlaceBet("+fight.id+",0)", locked)
    + oddBtn('П2', odds[2], "ufcPlaceBet("+fight.id+",1)", locked)
    + '</div>'
    + '<div style="display:flex;gap:6px;margin-top:6px;align-items:center;">'
    + '<div style="font-size:10px;color:var(--text-dim);width:80px;">Тотал: '+st.currentTotal+'</div>'
    + oddBtn('Б', totalOdds.over, "ufcPlaceTotalBet("+fight.id+",'over',"+st.currentTotal+")", locked)
    + oddBtn('М', totalOdds.under, "ufcPlaceTotalBet("+fight.id+",'under',"+st.currentTotal+")", locked)
    + '</div>'
    + '</div>';
}

function ufcRender(){
  const cont = document.getElementById('ufcContainer');
  if(!cont) return;
  const fights = ufcGetFights();
  let html = '<div style="padding:10px 0;">';
  fights.forEach(function(f){ html += ufcRenderCard(f); });
  html += '</div>';
  cont.innerHTML = html;
}

function ufcPlaceBet(fightId, side){
  const fights = ufcGetFights();
  const fight = fights.find(function(f){return f.id === fightId;});
  if(!fight) return;
  const st = ufcGetState(fight);
  if(st.locked){ showToast('Ставки закрыты', false); return; }
  const odds = ufcGetOdds(fight, st);
  const amount = prompt('Сумма ставки (баланс: ' + balance + ' ₽):', '100');
  if(!amount) return;
  const sum = parseInt(amount);
  if(!sum || sum <= 0) return;
  if(sum > balance){ showToast('Недостаточно средств', false); return; }
  balance -= sum;
  DB[currentUser].balance = balance;
  saveDB();
  window.UFC_BETS.push({
    fightId: fightId, side: side, amount: sum,
    odds: odds[side === 0 ? 0 : 2],
    home: fight.home, away: fight.away,
    epoch: Math.floor(Date.now() / 180000)
  });
  showToast('Ставка принята: ' + sum + ' ₽ @ ' + odds[side === 0 ? 0 : 2].toFixed(2), true);
  updateBalanceUI();
  ufcRender();
}

function ufcPlaceTotalBet(fightId, dir, totalLine){
  const fights = ufcGetFights();
  const fight = fights.find(function(f){return f.id === fightId;});
  if(!fight) return;
  const st = ufcGetState(fight);
  if(st.locked){ showToast('Ставки закрыты', false); return; }
  const odds = ufcTotalOdds(st);
  const amount = prompt('Сумма на Тотал ' + totalLine + ' (' + (dir === 'over' ? 'Больше' : 'Меньше') + ')\nБаланс: ' + balance + ' ₽', '100');
  if(!amount) return;
  const sum = parseInt(amount);
  if(!sum || sum <= 0) return;
  if(sum > balance){ showToast('Недостаточно средств', false); return; }
  balance -= sum;
  DB[currentUser].balance = balance;
  saveDB();
  window.UFC_BETS.push({
    fightId: fightId, side: dir === 'over' ? 0 : 1, amount: sum,
    odds: dir === 'over' ? odds.over : odds.under,
    home: fight.home, away: fight.away, isTotal: true, totalLine: totalLine,
    epoch: Math.floor(Date.now() / 180000)
  });
  showToast('Тотал принят: ' + sum + ' ₽', true);
  updateBalanceUI();
  ufcRender();
}

function ufcSettleBets(){
  const epoch = Math.floor(Date.now() / 180000);
  window.UFC_BETS.forEach(function(bet){
    if(bet.settled) return;
    if(bet.epoch >= epoch) return;
    const fights = ufcGenerateFights(bet.epoch);
    const fight = fights.find(function(f){return f.id === bet.fightId;});
    if(!fight || !fight.scenario) return;
    const sc = fight.scenario;
    let won = false;
    if(bet.isTotal){
      const ar = sc.totalRounds;
      if(bet.side === 0 && ar > bet.totalLine) won = true;
      if(bet.side === 1 && ar < bet.totalLine) won = true;
    } else {
      won = bet.side === sc.winner;
    }
    if(won){
      const win = Math.floor(bet.amount * bet.odds);
      balance += win;
      DB[currentUser].balance = balance;
      saveDB();
      showToast('🎉 UFC выигрыш: +' + win + ' ₽', true);
      updateBalanceUI();
    }
    bet.settled = true;
  });
}

function ufcTick(){
  if(selectedSport === '🥊 UFC') ufcRender();
  if(currentUser) ufcSettleBets();
}

function ufcInit(){
  setInterval(ufcTick, 1000);
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', ufcInit);
} else {
  ufcInit();
}
