/* ============ СТАВКИ ============ */
function openBetModal(matchId, pickKey, odd) {
  if (!isOddValid(odd)) return;
  const m = matches.find(x => x.id === matchId);
  if (!m || m.status === 'finished' || m.status === 'countdown') return;

  activeBet = { matchId, pick: pickKey, odd, isBuilder: false, isExpress: false };

  const pickLabel = pickKey === 'home' ? m.home
    : pickKey === 'away' ? m.away
    : pickKey === 'draw' ? 'Ничья' : pickKey;

  $('betModalTitle').textContent = `${m.home} — ${m.away}`;
  $('betModalSub').textContent = `${pickLabel} · ${m.scoreHome}:${m.scoreAway} · ${m.minute}'`;
  $('betModalOdd').textContent = odd.toFixed(2);
  $('betModalStake').value = '';
  $('betModalPotential').textContent = '—';
  $('betModalCoupon').style.display = 'block';
  $('betModalBuilder').style.display = (m.sport === 'football' || m.sport === 'hockey') ? 'block' : 'none';

  // Value детектор для 1X2
  if (pickKey === 'home' || pickKey === 'draw' || pickKey === 'away') {
    const v = computeValue(m, pickKey);
    if (v) {
      $('betModalValueRow').style.display = 'flex';
      const el = $('betModalValue');
      el.innerHTML = `<span class="value-badge ${v.isHot ? 'hot' : ''}">${v.isValue ? '▲' : '▼'} ${v.diff}%</span> vs ${v.marketOdd}`;
    } else {
      $('betModalValueRow').style.display = 'none';
    }
  } else {
    $('betModalValueRow').style.display = 'none';
  }

  $('betModal').classList.add('active');
  updatePotential();
}

function closeBetModal() {
  $('betModal').classList.remove('active');
  activeBet = null;
}

function updatePotential() {
  if (!activeBet) return;
  const stake = parseFloat($('betModalStake').value) || 0;
  const potential = stake * activeBet.odd;
  $('betModalPotential').textContent = potential > 0 ? `${fmtMoney(potential)} ₽` : '—';
}

function placeBet() {
  if (!activeBet) return;
  const stake = parseFloat($('betModalStake').value);
  if (!stake || stake < 10) return;
  if (stake > wallet.balance) return;

  if (activeBet.isExpress) {
    const selections = activeBet.selections.map(s => ({
      matchId: s.matchId, pick: s.pick, odd: s.odd,
      label: s.label, match: s.match, status: 'pending',
    }));
    wallet.balance -= stake;
    wallet.totalBet += stake;
    wallet.bets.unshift({
      id: Date.now(), type: 'express',
      match: `Экспресс · ${selections.length}`,
      selections,
      odd: activeBet.odd, stake,
      potential: Math.round(stake * activeBet.odd * 100) / 100,
      status: 'pending',
      createdAt: new Date().toISOString(),
    });
    expressCoupon = [];
    saveCoupon();
    renderCoupon();
  } else if (activeBet.isBuilder) {
    const m = matches.find(x => x.id === activeBet.matchId);
    if (!m) return;
    const selections = activeBet.selections.map(s => ({
      matchId: activeBet.matchId, pick: s.pick, odd: s.odd,
      label: s.label, match: `${m.home} — ${m.away}`, status: 'pending',
    }));
    wallet.balance -= stake;
    wallet.totalBet += stake;
    wallet.bets.unshift({
      id: Date.now(), type: 'builder',
      matchId: m.id,
      match: `${m.home} — ${m.away} (билдер ${selections.length})`,
      sport: m.sport,
      selections,
      odd: activeBet.odd, stake,
      potential: Math.round(stake * activeBet.odd * 100) / 100,
      status: 'pending',
      createdAt: new Date().toISOString(),
    });
    delete builderBets[activeBet.matchId];
  } else {
    const m = matches.find(x => x.id === activeBet.matchId);
    if (!m || m.status === 'finished') return;
    wallet.balance -= stake;
    wallet.totalBet += stake;
    wallet.bets.unshift({
      id: Date.now(), type: 'single',
      matchId: m.id,
      match: `${m.home} — ${m.away}`,
      sport: m.sport,
      pick: activeBet.pick,
      odd: activeBet.odd,
      stake,
      potential: Math.round(stake * activeBet.odd * 100) / 100,
      status: 'pending',
      minute: m.minute,
      score: `${m.scoreHome}:${m.scoreAway}`,
      createdAt: new Date().toISOString(),
    });
  }

  saveWallet();
  flashBalance('win');
  renderBalance();
  renderHistory();
  renderStats();
  renderAchievements();
  soundBet();
  vibrate(20);
  closeBetModal();
}

function addToBuilder() {
  if (!activeBet) return;
  const { matchId, pick, odd } = activeBet;
  if (!builderBets[matchId]) builderBets[matchId] = [];

  for (const b of builderBets[matchId]) {
    if (b.pick === pick) return;
    const t1 = b.pick.match(/^(ТБ|ТМ)\s+([\d.]+)$/);
    const t2 = pick.match(/^(ТБ|ТМ)\s+([\d.]+)$/);
    if (t1 && t2 && t1[2] === t2[2] && t1[1] !== t2[1]) {
      alert('Конфликт: ТБ и ТМ на одну линию нельзя');
      return;
    }
  }

  builderBets[matchId].push({
    pick, odd,
    label: pick === 'home' ? '1' : pick === 'away' ? '2' : pick === 'draw' ? 'X' : pick,
  });

  const totalOdd = builderBets[matchId].reduce((a, c) => a * c.odd, 1);
  const m = matches.find(x => x.id === matchId);

  closeBetModal();
  activeBet = {
    matchId,
    isBuilder: true,
    odd: totalOdd,
    selections: [...builderBets[matchId]],
  };
  $('betModalTitle').textContent = `🧩 Билдер · ${m.home} — ${m.away}`;
  $('betModalSub').textContent = builderBets[matchId].map(b => `${b.label} @ ${b.odd.toFixed(2)}`).join(' + ');
  $('betModalOdd').textContent = totalOdd.toFixed(2);
  $('betModalStake').value = '';
  $('betModalPotential').textContent = '—';
  $('betModalCoupon').style.display = 'none';
  $('betModalBuilder').style.display = 'none';
  $('betModalValueRow').style.display = 'none';
  $('betModal').classList.add('active');
  updatePotential();
}

/* ============ КУПОН ============ */
function addToCoupon(matchId, pickKey, odd, label) {
  if (!isOddValid(odd)) return;
  if (expressCoupon.find(c => c.matchId === matchId)) return;
  const m = matches.find(x => x.id === matchId);
  if (!m) return;

  expressCoupon.push({ matchId, pick: pickKey, odd, label, match: `${m.home} — ${m.away}` });

  renderCoupon();

function clearCoupon() {

  saveCoupon();

/* ============ КЭШАУТ ============ */
function computeCashoutValue(b, m) {
  if (!m || m.status !== 'live' || b.status !== 'pending') return 0;

  if (b.type === 'express') {
    let currentValue = 1;
    for (const sel of b.selections) {
      const sm = matches.find(x => Number(x.id) === Number(sel.matchId));
      if (!sm) return 0;
      if (sm.status === 'finished') {
        if (sel.status === 'lost') return 0;
        continue;
      }
      if (sm.status === 'live') {
        const odds = computeOdds(sm);
        const cur = odds[sel.pick];
        if (!cur || !isOddValid(cur)) return 0;
        currentValue *= 1 / cur;
      } else {
        return 0;
      }
    }
    const fairValue = b.potential * currentValue;
    const payout = Math.max(b.stake * 0.1, Math.round(fairValue * 0.9 * 100) / 100);
    return Math.min(payout, b.potential * 0.98);
  }

  if (b.type === 'builder') {
    let currentValue = 1;
    const sm = matches.find(x => Number(x.id) === Number(b.matchId));
    if (!sm || sm.status !== 'live') return 0;
    for (const sel of b.selections) {
      const check = checkSelection(sm, sel.pick, true);
      if (check === 'lost') return 0;
    }
    // Упрощённый расчёт — 50% от потенциального
    return Math.round(b.stake * 0.5 * 100) / 100;
  }

  const currentOdds = computeOdds(m);
  if (!b.pick || !currentOdds[b.pick]) {
    return Math.round(b.stake * 0.5 * 100) / 100;
  }
  const currentOdd = currentOdds[b.pick];
  const fairValue = b.potential / currentOdd;
  const payout = Math.max(b.stake * 0.1, Math.round(fairValue * 0.92 * 100) / 100);
  return Math.min(payout, b.potential);
}

function doCashout(betId) {
  const b = wallet.bets.find(x => x.id === betId);
  if (!b || b.status !== 'pending') return;

  let co = 0;
  if (b.type === 'express' || b.type === 'builder') {
    for (const sel of b.selections) {
      const sm = matches.find(x => Number(x.id) === Number(sel.matchId));
      if (sm && sm.status === 'live') {
        co = computeCashoutValue(b, sm);
        break;
      }
    }
  } else {
    const m = matches.find(x => x.id === b.matchId);
    if (m) co = computeCashoutValue(b, m);
  }

  if (co <= 0) return;

  b.status = 'won';
  b.payout = co;
  b.cashout = true;
  wallet.balance += co;
  wallet.totalWon += co;
  saveWallet();
  flashBalance('win');
  renderBalance();
  renderHistory();
  renderStats();
  renderAchievements();
  soundBet();
}

/* ============ РАСЧЁТ СТАВОК ============ */
function checkSelection(m, pick, isLive = false) {
  if (!m) return 'pending';
  if (!isLive && m.status !== 'finished') return 'pending';

  const total = m.scoreHome + m.scoreAway;

  if (m.sport === 'ufc') {
    if (!m.finalResult) {
      if (isLive) return 'pending';
      const winner = m.scoreHome > m.scoreAway ? 'home' : m.scoreAway > m.scoreHome ? 'away' : 'home';
      m.finalResult = { winner, method: 'Решение', round: 5 };
    }
    const fr = m.finalResult;
    const isHomeWin = fr.winner === 'home';
    const isAwayWin = fr.winner === 'away';
    const method = fr.method;
    const finalRound = fr.round;
    const wasFinish = method !== 'Решение';

    if (pick === 'home') return isHomeWin ? 'won' : 'lost';
    if (pick === 'away') return isAwayWin ? 'won' : 'lost';
    if (pick === 'Метод · KO/TKO') return method === 'KO/TKO' ? 'won' : 'lost';
    if (pick === 'Метод · Сабмишн') return method === 'Сабмишн' ? 'won' : 'lost';
    if (pick === 'Метод · Решение') return method === 'Решение' ? 'won' : 'lost';
    if (pick === 'Бой досрочно') return wasFinish ? 'won' : 'lost';
    if (pick === 'Пройти всю дистанцию') return !wasFinish ? 'won' : 'lost';

    const ufcR = pick.match(/^Тотал (Б|М) (\d+)\.5 раундов$/);
    if (ufcR) {
      const line = parseInt(ufcR[2]);
      if (ufcR[1] === 'Б') return finalRound > line ? 'won' : 'lost';
      return finalRound < line ? 'won' : 'lost';
    }
    const finishR = pick.match(/^Финиш в R(\d+)\+?$/);
    if (finishR) {
      const target = parseInt(finishR[1]);
      if (pick.includes('+')) return (wasFinish && finalRound >= target) ? 'won' : 'lost';
      return (wasFinish && finalRound === target) ? 'won' : 'lost';
    }
    if (pick === `${m.home} KO/TKO`) return (isHomeWin && method === 'KO/TKO') ? 'won' : 'lost';
    if (pick === `${m.home} Сабмишн`) return (isHomeWin && method === 'Сабмишн') ? 'won' : 'lost';
    if (pick === `${m.home} Решение`) return (isHomeWin && method === 'Решение') ? 'won' : 'lost';
    if (pick === `${m.away} KO/TKO`) return (isAwayWin && method === 'KO/TKO') ? 'won' : 'lost';
    if (pick === `${m.away} Сабмишн`) return (isAwayWin && method === 'Сабмишн') ? 'won' : 'lost';
    if (pick === `${m.away} Решение`) return (isAwayWin && method === 'Решение') ? 'won' : 'lost';
    return 'lost';
  }

  if (pick === 'home') return m.scoreHome > m.scoreAway ? 'won' : 'lost';
  if (pick === 'away') return m.scoreAway > m.scoreHome ? 'won' : 'lost';
  if (pick === 'draw') return m.scoreHome === m.scoreAway ? 'won' : 'lost';

  if (pick === '1X') return m.scoreHome >= m.scoreAway ? 'won' : 'lost';
  if (pick === '12') return m.scoreHome !== m.scoreAway ? 'won' : 'lost';
  if (pick === 'X2') return m.scoreHome <= m.scoreAway ? 'won' : 'lost';

  const tO = pick.match(/^ТБ\s*([\d.]+)$/);
  const tU = pick.match(/^ТМ\s*([\d.]+)$/);
  if (tO) return total > parseFloat(tO[1]) ? 'won' : 'lost';
  if (tU) return total < parseFloat(tU[1]) ? 'won' : 'lost';

  const f1 = pick.match(/^Ф1\s*([−\-+]?[\d.]+)$/);
  const f2 = pick.match(/^Ф2\s*([−\-+]?[\d.]+)$/);
  if (f1) return (m.scoreHome - m.scoreAway) > parseFloat(f1[1].replace('−', '-')) ? 'won' : 'lost';
  if (f2) return (m.scoreAway - m.scoreHome) > parseFloat(f2[1].replace('−', '-')) ? 'won' : 'lost';

  if (pick === 'Обе · Да') return (m.scoreHome >= 1 && m.scoreAway >= 1) ? 'won' : 'lost';
  if (pick === 'Обе · Нет') return !(m.scoreHome >= 1 && m.scoreAway >= 1) ? 'won' : 'lost';
  if (pick === 'Чёт') return total % 2 === 0 ? 'won' : 'lost';
  if (pick === 'Нечет') return total % 2 !== 0 ? 'won' : 'lost';

  const homeTeam = pick.match(new RegExp(`^${m.home.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\s+(Б|М)\\s+([\\d.]+)$`));
  const awayTeam = pick.match(new RegExp(`^${m.away.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\s+(Б|М)\\s+([\\d.]+)$`));
  if (homeTeam) {
    const line = parseFloat(homeTeam[2]);
    return homeTeam[1] === 'Б' ? (m.scoreHome > line ? 'won' : 'lost') : (m.scoreHome < line ? 'won' : 'lost');
  }
  if (awayTeam) {
    const line = parseFloat(awayTeam[2]);
    return awayTeam[1] === 'Б' ? (m.scoreAway > line ? 'won' : 'lost') : (m.scoreAway < line ? 'won' : 'lost');
  }

  const cs = pick.match(/^Счёт\s+(\d+):(\d+)$/);
  if (cs) return (m.scoreHome === +cs[1] && m.scoreAway === +cs[2]) ? 'won' : 'lost';

  return 'lost';
}

function settleBets() {
  let changed = false;

  wallet.bets.forEach(b => {
    if (b.status !== 'pending') return;

    if (b.type === 'express' || b.type === 'builder') {
      let anyLost = false;
      let allWon = true;
      let allDone = true;

      for (const sel of b.selections) {
        if (sel.status === 'lost') { anyLost = true; continue; }
        if (sel.status === 'won') continue;
        const m = matches.find(x => Number(x.id) === Number(sel.matchId));
        if (!m || m.status !== 'finished') { allDone = false; allWon = false; continue; }
        const r = checkSelection(m, sel.pick);
        sel.status = r;
        if (r === 'lost') { anyLost = true; allWon = false; }
      }

      if (anyLost) {
        b.status = 'lost';
        soundLose();
        flashBalance('lose');
        changed = true;
        wallet.profitHistory.push({ t: Date.now(), v: wallet.totalWon - wallet.totalBet });
        return;
      }

      if (allDone && allWon && b.selections.every(s => s.status === 'won')) {
        b.status = 'won';
        b.payout = Math.round(b.stake * b.odd * 100) / 100;
        wallet.balance += b.payout;
        wallet.totalWon += b.payout;
        soundWin();
        vibrate(50);
        flashBalance('win');
        changed = true;
        wallet.profitHistory.push({ t: Date.now(), v: wallet.totalWon - wallet.totalBet });
        if (wallet.profitHistory.length > 100) wallet.profitHistory.shift();
      }
      return;
    }

    const m = matches.find(x => Number(x.id) === Number(b.matchId));
    if (!m || m.status !== 'finished') return;

    const r = checkSelection(m, b.pick);
    if (r === 'won') {
      b.status = 'won';
      b.payout = Math.round(b.stake * b.odd * 100) / 100;
      wallet.balance += b.payout;
      wallet.totalWon += b.payout;
      soundWin();
      vibrate(50);
      flashBalance('win');
    } else {
      b.status = 'lost';
      soundLose();
      flashBalance('lose');
    }
    changed = true;
    wallet.profitHistory.push({ t: Date.now(), v: wallet.totalWon - wallet.totalBet });
    if (wallet.profitHistory.length > 100) wallet.profitHistory.shift();
  });

  if (changed) {
    saveWallet();
    renderBalance();
    renderHistory();
    renderStats();
    renderAchievements();
  }
}

/* ============ CSV ЭКСПОРТ ============ */
function exportCSV() {
  const rows = [['Дата', 'Матч', 'Тип', 'Исход', 'Кэф', 'Ставка', 'Потенциал', 'Статус', 'Выплата']];
  wallet.bets.forEach(b => {
    rows.push([
      new Date(b.createdAt).toLocaleString('ru-RU'),
      b.match,
      b.type || 'single',
      b.pick || '',
      b.odd,
      b.stake,
      b.potential,
      b.status,
      b.payout || 0,
    ]);
  });
  const csv = rows.map(r => r.map(v => `"${v}"`).join(',')).join('\n');
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `openbet_${Date.now()}.csv`;
  link.click();
}

/* ============ ГЛАВНЫЙ ЦИКЛ ============ */
function tick() {
  resetWalletIfNewDay();

  matches.forEach(m => {
    if (m.status === 'live' || m.status === 'prematch' || m.status === 'countdown') tickMatch(m);
  });

  // Завершённые → countdown через 5 сек
  matches.forEach(m => {
    if (m.status === 'finished' && !m.countdownStarted) {
      m.finishedAt = m.finishedAt || Date.now();
      if (Date.now() - m.finishedAt > 5000) {
        m.countdownStarted = true;
        m.status = 'countdown';
        m.countdownLeft = 30;
      }
    }
  });

  settleBets();

  // Добавляем новые матчи если мало
  const activeCount = matches.filter(m => m.status === 'live' || m.status === 'prematch').length;
  if (activeCount < 6) {
    const needCount = 8 - activeCount;
    for (let i = 0; i < needCount; i++) {
      const startsIn = rand(30, 180);
      matches.push(createRandomMatch(true, startsIn));
    }
    renderLeagueFilters();
  }

  renderMatches();
  renderLiveDrops();
  if ($('tab-stats').classList.contains('active')) renderStats();
  if ($('tab-history').classList.contains('active')) renderHistory();
  if ($('tab-multi').classList.contains('active')) renderMultiView();
  if ($('tab-top').classList.contains('active')) renderLeaderboard();
  if ($('tab-achiv').classList.contains('active')) renderAchievements();
}

/* ============ ДЕЛЕГИРОВАНИЕ КЛИКОВ ============ */
document.addEventListener('click', (e) => {
  // Кэф 1X2
  const mainBtn = e.target.closest('.odds-btn[data-match-id]');
  if (mainBtn && !mainBtn.disabled && !mainBtn.classList.contains('disabled')) {
    const mid = parseInt(mainBtn.dataset.matchId);
    const pick = mainBtn.dataset.pick;
    const odd = parseFloat(mainBtn.dataset.odd);
    if (!isNaN(mid) && pick && isOddValid(odd)) {
      openBetModal(mid, pick, odd);
      return;
    }
  }

  // Расширенный рынок
  const miniBtn = e.target.closest('.odds-mini[data-mid]');
  if (miniBtn && !miniBtn.disabled && !miniBtn.classList.contains('disabled')) {
    const mid = parseInt(miniBtn.dataset.mid);
    const pick = decodeURIComponent(miniBtn.dataset.mk);
    const odd = parseFloat(miniBtn.dataset.odd);
    if (!isNaN(mid) && pick && isOddValid(odd)) {
      openBetModal(mid, pick, odd);
      return;
    }
  }

  // Toggle extras
  const extrasBtn = e.target.closest('[data-extras-toggle]');
  if (extrasBtn) {
    const id = parseInt(extrasBtn.dataset.extrasToggle);
    if (openExtras.has(id)) openExtras.delete(id);
    else openExtras.add(id);
    renderMatches();
    return;
  }

  // Star (избранное)
  const starBtn = e.target.closest('[data-star]');
  if (starBtn) {
    e.stopPropagation();
    const id = parseInt(starBtn.dataset.star);
    if (favorites.has(id)) favorites.delete(id);
    else favorites.add(id);
    saveFavorites();
    renderMatches();
    return;
  }

  // Кэшаут
  const cashoutBtn = e.target.closest('[data-cashout]');
  if (cashoutBtn) {
    e.stopPropagation();
    doCashout(parseInt(cashoutBtn.dataset.cashout));
    return;
  }

  // Клик по истории
  const historyItem = e.target.closest('[data-history]');
  if (historyItem && !e.target.closest('[data-cashout]')) {
    const betId = parseInt(historyItem.dataset.history);
    const bet = wallet.bets.find(x => x.id === betId);
    if (bet && bet.matchId) {
      const m = matches.find(x => x.id === bet.matchId);
      if (!m) alert('Матч не найден — он был заменён');
      else if (m.status === 'finished') alert(`Матч завершён: ${m.home} ${m.scoreHome}:${m.scoreAway} ${m.away}`);
      else if (m.status === 'prematch') alert(`${m.home} vs ${m.away}\nНачнётся через ${formatTime(m.startsIn)}`);
      else if (m.status === 'countdown') alert(`Новый матч через ${formatTime(m.countdownLeft)}`);
      else alert(`${m.home} ${m.scoreHome}:${m.scoreAway} ${m.away}\n${m.minute}' · live`);
    }
    return;
  }

  // Клик по балансу — бонус
  if (e.target.closest('#balanceBox')) {
    claimBonus();
    return;
  }
});
