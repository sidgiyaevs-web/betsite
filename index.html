<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b0b12">
<title>⚡ OpenBet v26 — Real Life Engine</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
:root{--bg:#0a0a14;--bg2:#12121f;--card:#151528;--card-hover:#1c1c34;--border:rgba(100,100,160,.14);--border-2:rgba(130,130,200,.35);--text:#f0f0ff;--text-2:#b0b0d0;--muted:#5a5a80;--accent:#7c5cff;--accent-2:#00d4ff;--green:#00e676;--red:#ff3860;--gold:#ffb800;--r-sm:10px;--r-md:14px;--r-lg:18px;--r-xl:24px}
body.light{--bg:#f2f3f9;--bg2:#e8eaf2;--card:#fff;--card-hover:#f5f6fc;--border:rgba(90,90,130,.1);--border-2:rgba(90,90,130,.25);--text:#0e0e1c;--text-2:#3a3a55;--muted:#7a7a95}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .3s,color .3s}
body.has-coupon{padding-bottom:160px}
.header{position:sticky;top:0;z-index:100;border-bottom:1px solid var(--border);padding:12px 20px;backdrop-filter:blur(24px);background:rgba(10,10,20,.85)}
body.light .header{background:rgba(242,243,249,.9)}
.header-inner{max-width:1320px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:14px}
.logo{font-size:20px;font-weight:900;letter-spacing:-.5px;cursor:pointer;user-select:none;display:flex;align-items:center;gap:10px}
.logo-icon{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#7c5cff,#00d4ff);display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 4px 20px rgba(124,92,255,.5)}
.logo span{background:linear-gradient(135deg,#7c5cff,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header-actions{display:flex;align-items:center;gap:8px}
.balance{background:var(--card);border:1px solid var(--border);padding:10px 16px;border-radius:var(--r-md);font-weight:800;font-size:13.5px;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;transition:all .25s;white-space:nowrap;font-variant-numeric:tabular-nums}
.balance:hover{border-color:var(--accent);transform:translateY(-1px)}
.balance.flash-bonus{border-color:var(--gold);box-shadow:0 0 32px rgba(255,184,0,.55);transform:scale(1.04)}
.balance.flash-win{border-color:var(--green);box-shadow:0 0 24px rgba(0,230,118,.5);transform:scale(1.03)}
.balance.flash-lose{border-color:var(--red);box-shadow:0 0 24px rgba(255,56,96,.5)}
.icon-btn{width:42px;height:42px;border-radius:var(--r-md);background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .15s}
.icon-btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.icon-btn.muted{opacity:.5}
.container{max-width:1320px;margin:0 auto;padding:20px}
.nav-tabs{display:flex;gap:8px;margin-bottom:20px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.nav-tabs::-webkit-scrollbar{display:none}
.nav-tab{padding:11px 20px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);font-weight:700;color:var(--muted);font-size:13px;white-space:nowrap;transition:all .2s;display:flex;align-items:center;gap:7px}
.nav-tab:hover{color:var(--text);transform:translateY(-1px)}
.nav-tab.active{color:var(--text);border-color:var(--accent);background:rgba(124,92,255,.12);box-shadow:0 4px 20px rgba(124,92,255,.2)}
.session{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 22px;margin-bottom:20px;display:flex;gap:24px;align-items:center;flex-wrap:wrap;font-size:13px}
.session .label{color:var(--muted);font-weight:600}
.session .value{font-weight:800;font-variant-numeric:tabular-nums}
.session .value.green{color:var(--green)}
.session .value.red{color:var(--red)}
.session .value.gold{color:var(--gold)}
.session .spacer{margin-left:auto}
.bonus-hint{font-size:12px;color:var(--gold);font-weight:700;cursor:pointer;padding:7px 14px;border-radius:10px;background:rgba(255,184,0,.1);border:1px solid rgba(255,184,0,.25);transition:all .2s}
.bonus-hint:hover{background:rgba(255,184,0,.2);transform:translateY(-1px)}
.sport-filters{display:flex;gap:8px;margin-bottom:20px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.sport-filters::-webkit-scrollbar{display:none}
.sport-chip{padding:11px 20px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);font-weight:700;color:var(--muted);font-size:13px;white-space:nowrap;transition:all .2s;display:flex;align-items:center;gap:7px}
.sport-chip:hover{color:var(--text);transform:translateY(-1px)}
.sport-chip.active{color:var(--text);border-color:var(--accent);background:rgba(124,92,255,.12);box-shadow:0 4px 20px rgba(124,92,255,.2)}
.matches-list{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:900px){.matches-list{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1400px){.matches-list{grid-template-columns:repeat(3,1fr)}}
.match{background:var(--card);border:1px solid var(--border);border-radius:var(--r-xl);padding:20px;display:flex;flex-direction:column;gap:14px;transition:all .25s}
.match:hover{border-color:var(--border-2);transform:translateY(-2px)}
.match.finished{opacity:.55}
.match-head{display:flex;align-items:center;gap:10px}
.match-sport{font-size:20px}
.match-league{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.match-status{font-size:10px;padding:5px 12px;border-radius:8px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;white-space:nowrap}
.match-status.live{background:var(--red);color:#fff;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.65}}
.match-status.live::before{content:'●';margin-right:5px;font-size:9px}
.match-status.finished{background:rgba(120,120,140,.2);color:var(--muted)}
.match-status.countdown{background:var(--accent-2);color:#000}
.match-phase{font-size:10px;padding:4px 10px;border-radius:6px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;background:rgba(255,184,0,.15);color:var(--gold);border:1px solid rgba(255,184,0,.3);margin-left:auto;white-space:nowrap}
.match-phase.chaos{background:rgba(255,56,96,.15);color:var(--red);border-color:rgba(255,56,96,.4);animation:pulse 1s infinite}
.match-phase.pressure{background:rgba(0,230,118,.15);color:var(--green);border-color:rgba(0,230,118,.4)}
.teams{display:flex;flex-direction:column;gap:12px}
.team-line{display:flex;align-items:center;justify-content:space-between;gap:12px}
.team-info{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.team-logo-wrap{position:relative;flex-shrink:0}
.team-logo{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;color:#fff;border:2px solid rgba(255,255,255,.12);box-shadow:0 4px 14px rgba(0,0,0,.35)}
.team-logo.scored{animation:avScore 1.2s ease}
@keyframes avScore{0%,100%{transform:scale(1)}40%{transform:scale(1.42);box-shadow:0 0 32px var(--green)}}
.team-rating{position:absolute;top:-4px;right:-4px;background:var(--bg);border:1px solid var(--border);border-radius:6px;font-size:9px;font-weight:800;padding:2px 6px;color:var(--accent-2)}
.team-flag{position:absolute;bottom:-4px;right:-4px;font-size:14px}
.team-name{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team-score{font-weight:900;font-size:30px;font-variant-numeric:tabular-nums;letter-spacing:-1.5px;min-width:40px;text-align:right;transition:all .3s}
.team-score.scored{animation:scFlash 1.2s ease}
@keyframes scFlash{0%,100%{transform:scale(1)}30%{transform:scale(1.65);text-shadow:0 0 32px var(--green);color:var(--green)}}
.match-info{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);padding:10px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);font-weight:600;flex-wrap:wrap}
.match-info .time{font-weight:800;color:var(--text-2);font-variant-numeric:tabular-nums}
.match-commentary{font-size:11.5px;color:var(--accent-2);font-weight:600;padding:8px 12px;background:rgba(0,212,255,.06);border-left:3px solid var(--accent-2);border-radius:6px;min-height:28px;overflow:hidden;text-overflow:ellipsis}
.stat-row{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;padding:3px 0;color:var(--muted)}
.stat-row .lbl{min-width:70px;text-align:right;color:var(--text-2);font-size:10.5px;text-transform:uppercase;letter-spacing:.3px}
.stat-row .num{min-width:26px;text-align:center;font-weight:900;font-variant-numeric:tabular-nums;font-size:12px}
.stat-row .num.h{color:var(--accent-2)}
.stat-row .num.a{color:var(--red)}
.stat-row .bar{flex:1;height:4px;background:rgba(120,120,160,.15);border-radius:2px;overflow:hidden;display:flex}
.stat-row .bar i{display:block;height:100%;transition:width .4s}
.stat-row .bar .bh{background:var(--accent-2)}
.stat-row .bar .ba{background:var(--red)}
.progress{display:flex;gap:4px;height:5px}
.progress-seg{flex:1;background:rgba(120,120,160,.15);border-radius:3px;overflow:hidden;position:relative}
.progress-seg.done{background:var(--green)}
.progress-seg.active::after{content:'';position:absolute;left:0;top:0;bottom:0;width:var(--p,0%);background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .5s}
.match-toggle{background:rgba(124,92,255,.1);border:1px solid var(--accent);color:var(--accent-2);padding:10px 16px;border-radius:var(--r-md);font-weight:800;font-size:12.5px;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .15s}
.match-toggle:hover{background:rgba(124,92,255,.2)}
.match-toggle.open{color:var(--muted);border-color:var(--border)}
.match-toggle .arrow{transition:transform .2s;display:inline-block}
.match-toggle.open .arrow{transform:rotate(180deg)}
.match.collapsed .odds-row,.match.collapsed .extras,.match.collapsed .prob-bar,.match.collapsed .stats-extended{display:none}
.ufc-result{background:linear-gradient(135deg,rgba(255,184,0,.12),rgba(255,56,96,.05));border:1px solid rgba(255,184,0,.35);border-radius:var(--r-md);padding:14px;font-size:12.5px;font-weight:700}
.ufc-result .win{color:var(--gold);font-weight:800}
.odds-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.odds-row.two-col{grid-template-columns:1fr 1fr}
.odd-btn{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-md);padding:14px 10px;text-align:center;display:flex;flex-direction:column;gap:5px;transition:all .2s;font-family:inherit;color:var(--text)}
.odd-btn:hover:not(:disabled):not(.disabled){border-color:var(--accent);background:var(--card-hover);transform:translateY(-2px);box-shadow:0 6px 20px rgba(124,92,255,.2)}
.odd-btn:active:not(:disabled):not(.disabled){transform:scale(.97)}
.odd-btn:disabled,.odd-btn.disabled{opacity:.25;cursor:not-allowed}
.odd-btn.up{border-color:rgba(0,230,118,.5);background:rgba(0,230,118,.05)}
.odd-btn.down{border-color:rgba(255,56,96,.5);background:rgba(255,56,96,.05)}
.odd-label{font-size:11px;color:var(--muted);font-weight:700}
.odd-value{font-size:18px;font-weight:800;color:var(--accent-2);font-variant-numeric:tabular-nums}
.extras{border-top:1px solid var(--border);padding-top:14px}
.extras-toggle{color:var(--accent-2);font-size:13px;font-weight:800;display:flex;align-items:center;gap:8px;padding:6px 0;transition:color .2s}
.extras-toggle:hover{color:var(--accent)}
.extras-toggle.open{color:var(--muted)}
.extras-grid{display:none;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.extras-grid.open{display:grid;animation:fadeIn .3s}
@media(min-width:600px){.extras-grid{grid-template-columns:repeat(3,1fr)}}
.odd-mini{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;min-width:0;transition:all .2s;font-family:inherit;color:var(--text)}
.odd-mini:hover:not(.disabled){border-color:var(--accent);transform:translateY(-1px)}
.odd-mini.disabled{opacity:.25;cursor:not-allowed}
.odd-mini-label{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;font-weight:600}
.odd-mini-value{font-size:13px;font-weight:800;color:var(--accent-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:80px 20px;color:var(--muted)}
.empty-icon{font-size:60px;margin-bottom:16px;opacity:.4}
.empty-text{font-size:15px;font-weight:600}
.history-filters{display:flex;gap:8px;margin-bottom:20px;overflow-x:auto;scrollbar-width:none}
.history-filters::-webkit-scrollbar{display:none}
.history-chip{padding:10px 18px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);font-weight:700;color:var(--muted);font-size:12.5px;white-space:nowrap;transition:all .2s}
.history-chip:hover{color:var(--text);transform:translateY(-1px)}
.history-chip.active{color:var(--text);border-color:var(--accent);background:rgba(124,92,255,.12)}
.history-list{display:flex;flex-direction:column;gap:12px}
.history-item{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 18px;display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:all .2s}
.history-item:hover{border-color:var(--border-2);transform:translateY(-2px)}
.history-item.won{border-left:4px solid var(--green)}
.history-item.lost{border-left:4px solid var(--red)}
.history-item.pending{border-left:4px solid var(--gold)}
.history-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.history-match{font-weight:700;font-size:14.5px;line-height:1.35}
.history-meta{font-size:11.5px;color:var(--muted);margin-top:4px;font-weight:600}
.history-amount{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.history-foot{display:flex;justify-content:space-between;align-items:center;gap:14px;padding-top:12px;border-top:1px solid var(--border)}
.history-odd{font-size:12.5px;color:var(--muted);font-weight:600}
.history-odd b{color:var(--accent-2);font-weight:800}
.history-status{font-weight:800;padding:5px 14px;border-radius:8px;text-transform:uppercase;letter-spacing:.5px;font-size:10.5px;white-space:nowrap}
.history-status.won{background:rgba(0,230,118,.15);color:var(--green)}
.history-status.lost{background:rgba(255,56,96,.15);color:var(--red)}
.history-status.pending{background:rgba(255,184,0,.15);color:var(--gold)}
.cashout-btn{background:linear-gradient(135deg,var(--green),#00b050);color:#000;padding:11px 20px;border-radius:var(--r-md);font-weight:800;font-size:13px;align-self:flex-start}
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:22px}
@media(min-width:700px){.stats-grid{grid-template-columns:repeat(4,1fr)}}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px}
.stat-label{font-size:11.5px;color:var(--muted);margin-bottom:8px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.stat-value{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.8px}
.stat-value.green{color:var(--green)}
.stat-value.red{color:var(--red)}
.stat-value.gold{color:var(--gold)}
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:22px;margin-bottom:18px}
.chart-title{font-size:12.5px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.8px;margin-bottom:18px}
.chart-canvas{width:100%;height:220px;display:block}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.ach{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px 14px;text-align:center;opacity:.35;transition:all .3s}
.ach.unlocked{opacity:1;border-color:var(--gold);box-shadow:0 0 36px rgba(255,184,0,.2);transform:translateY(-2px)}
.ach-icon{font-size:38px;margin-bottom:12px}
.ach-name{font-size:12.5px;font-weight:800;margin-bottom:4px}
.ach-desc{font-size:10.5px;color:var(--muted);font-weight:600}
.leaderboard{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px}
.lb-header{color:var(--muted);font-size:13px;margin-bottom:16px;font-weight:700}
.lb-header b{color:var(--gold);font-weight:900}
.lb-row{display:grid;grid-template-columns:48px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--border);font-size:13.5px}
.lb-row:last-child{border-bottom:none}
.lb-row.me{background:rgba(124,92,255,.12);margin:0 -20px;padding:14px 20px;border-radius:var(--r-md);border-bottom:none}
.lb-rank{font-weight:900;font-size:17px;color:var(--muted);text-align:center}
.lb-rank.top1{color:var(--gold)}
.lb-rank.top2{color:#c0c0c0}
.lb-rank.top3{color:#cd7f32}
.lb-name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-name.me{color:var(--accent-2)}
.lb-value{font-weight:800;color:var(--green);font-variant-numeric:tabular-nums;font-size:13.5px}
.tab-content{display:none}
.tab-content.active{display:block;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(14px);display:none;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal-overlay.active{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border-2);border-radius:var(--r-xl);padding:28px;max-width:480px;width:100%;max-height:92vh;overflow-y:auto;animation:popIn .3s}
@keyframes popIn{from{transform:scale(.93);opacity:0}}
.modal h3{font-size:18px;margin-bottom:8px;font-weight:800}
.modal-sub{color:var(--muted);font-size:13px;margin-bottom:22px;line-height:1.5;font-weight:600}
.modal-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);font-size:13.5px}
.modal-row:last-of-type{border-bottom:none}
.modal-row .label{color:var(--muted);font-weight:600}
.modal-row .value{font-weight:800;font-variant-numeric:tabular-nums}
.modal input[type="number"]{width:100%;background:var(--card);border:1px solid var(--border);padding:16px;border-radius:var(--r-md);font-size:17px;margin:18px 0 14px;font-weight:800;font-variant-numeric:tabular-nums}
.modal input[type="number"]:focus{outline:none;border-color:var(--accent)}
.quick-stakes{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:18px}
.quick-stake{padding:11px 4px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);font-size:11.5px;font-weight:800;text-align:center}
.modal-actions{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;padding:15px;border-radius:var(--r-md);font-weight:800;font-size:14px;transition:all .2s}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff}
.btn-secondary{background:var(--card);border:1px solid var(--border)}
.btn-coupon{background:rgba(124,92,255,.15);border:1px solid var(--accent);color:var(--accent-2)}
.btn-builder{background:rgba(255,184,0,.15);border:1px solid var(--gold);color:var(--gold)}
.coupon-bar{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:2px solid var(--accent);padding:14px 20px;transform:translateY(100%);transition:transform .35s;z-index:200;box-shadow:0 -12px 48px rgba(0,0,0,.5)}
.coupon-bar.active{transform:translateY(0)}
.coupon-inner{max-width:1320px;margin:0 auto}
.coupon-items{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;margin-bottom:10px}
.coupon-item{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:10px 14px;display:flex;align-items:center;gap:12px;min-width:220px;font-size:12px}
.coupon-item-info{flex:1;min-width:0}
.coupon-item-match{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

var audio = null;
function beep(f,d,t,v){
  if(!soundOn) return;
  t=t||'sine'; v=v||0.08;
  try{
    if(!audio) audio=new (window.AudioContext||window.webkitAudioContext)();
    var o=audio.createOscillator(),g=audio.createGain();
    o.type=t; o.frequency.value=f;
    g.gain.setValueAtTime(v,audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audio.currentTime+d);
    o.connect(g); g.connect(audio.destination);
    o.start(); o.stop(audio.currentTime+d);
  }catch(e){}
}

/* ============ TOAST ============ */
function toast(type,icon,text){
  var c=$('toastContainer'); if(!c) return;
  var el=document.createElement('div');
  el.className='toast '+type;
  el.innerHTML='<span style="font-size:16px">'+icon+'</span><span>'+text+'</span>';
  c.appendChild(el);
  setTimeout(function(){
    el.style.transition='opacity .3s, transform .3s';
    el.style.opacity='0'; el.style.transform='translateX(120%)';
    setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },320);
  },3200);
}

/* ============================================================
   ФУТБОЛ — СИТУАТИВНЫЙ ДВИЖОК
   1 реальная сек = 9 игровых секунд (10 минут реальных = 90')
   Перерыв 30 секунд
   ============================================================ */
var FT_MATCH_REAL_MIN = 10;   // 10 минут реального времени
var FT_HALF_REAL_SEC = 300;   // 5 минут на тайм
var FT_BREAK_SEC = 30;         // 30 секунд перерыв
var FT_TICK_PER_GAME_MIN = 6.67; // 600 сек / 90 мин

  var lg = pick(lgs);
  var teams = FOOTBALL.filter(function(t){ return t.lg===lg; });
  var pair = pickTwo(teams);
  var h = pair[0], a = pair[1];
  var baseTempo = 0.75 + Math.random()*0.65;
  // Предматчевый "сценарий"
  var scenarios = ['even','home_fav','away_fav','open','defensive'];
  var scenario = scenarios[Math.floor(Math.random()*scenarios.length)];
  // Погода
  var weather = Math.random() < 0.75 ? 'good' : 'rain';
  return {
    id: nextId++, sport:'football', league:lg,
    home:h.n, away:a.n,
    homeAtk:h.atk, awayAtk:a.atk,
    homeDef:h.def, awayDef:a.def,
    homeRating:h.rt, awayRating:a.rt,
    homeCountry:h.country, awayCountry:a.country,
    homeStyle:h.style || 'balanced', awayStyle:a.style || 'balanced',
    scenario:scenario, weather:weather, baseTempo:baseTempo,
    scoreHome:0, scoreAway:0,
    minute:0, maxMinute:90,
    realTick:0,
    // ФАЗА
    phase:'calm',
    phaseSecLeft: 18 + Math.floor(Math.random()*25),
    // БАЗА СТАТИСТИКИ
    xgHome:0, xgAway:0,
    shotsHome:0, shotsAway:0,
    shotsOnTargetHome:0, shotsOnTargetAway:0,
    goalKicksHome:0, goalKicksAway:0,
    throwInsHome:0, throwInsAway:0,
    foulsHome:0, foulsAway:0,
    cornersHome:0, cornersAway:0,
    possessionHome:50,
    cardsHome:0, cardsAway:0,
    redHome:false, redAway:false,
    offsidesHome:0, offsidesAway:0,
    savesHome:0, savesAway:0,
    goals: [],
    // Таймеры следующих событий (в игровых секундах)
    nextThrowIn: 60 + Math.floor(Math.random()*180),
    nextGoalKick: 80 + Math.floor(Math.random()*200),
    nextFoul: 90 + Math.floor(Math.random()*200),
    nextCorner: 300 + Math.floor(Math.random()*500),
    nextShot: 120 + Math.floor(Math.random()*240),
    nextOffside: 400 + Math.floor(Math.random()*700),
    // ПЕРЕРЫВ
    half: 1,
    isBreak: false,
    breakTimer: 0,
    // СИГНАЛЫ
    justScored:null,
    status:'live', momentum:0,
    commentary: 'Матч начинается · ' + (weather==='rain' ? 'Дождь на поле' : 'Хорошая погода')
  };
}

function computeFootballPhaseIntensity(m){
  var phase = m.phase;
  var intensity = 1.0, goalBoost = 1.0;
  switch(phase){
    case 'calm': intensity = 0.35; goalBoost = 0.5; break;
    case 'pressure_home': intensity = 1.7; goalBoost = 1.9; break;
    case 'pressure_away': intensity = 1.7; goalBoost = 1.9; break;
    case 'chaos': intensity = 2.6; goalBoost = 2.4; break;
    case 'endgame': intensity = 2.1; goalBoost = 1.7; break;
  }
  intensity *= m.baseTempo;
  // Погода
  if(m.weather === 'rain') intensity *= 1.1;
  // Последние 15 минут
  if(m.minute >= 75 && phase !== 'endgame'){
    intensity *= 1.4;
    goalBoost *= 1.35;
  }
  // Равный счёт у конца
  if(Math.abs(m.scoreHome - m.scoreAway) <= 1 && m.minute > 70){
    intensity *= 1.5;
    goalBoost *= 1.4;
  }
  // Разгром
  if(Math.abs(m.scoreHome - m.scoreAway) >= 3){
    intensity *= 1.15;
    goalBoost *= 0.7;
  }
  return { intensity:intensity, goalBoost:goalBoost };
}

function maybeSwitchFootballPhase(m){
  m.phaseSecLeft -= 1;
  if(m.phaseSecLeft > 0) return;
  var roll = Math.random();
  var favorHome = (m.homeAtk - m.awayAtk) * 0.3;
  if(m.scenario === 'home_fav') favorHome += 0.15;
  if(m.scenario === 'away_fav') favorHome -= 0.15;
  if(m.scoreHome > m.scoreAway) favorHome += 0.1;
  if(m.scoreAway > m.scoreHome) favorHome -= 0.1;
  favorHome = clamp(favorHome, -0.4, 0.4);
  var newPhase;
  if(m.minute >= 80){
    newPhase = 'endgame';
    m.phaseSecLeft = 999;
  } else if(roll < 0.30){
    newPhase = 'calm';
    m.phaseSecLeft = 18 + Math.floor(Math.random()*25);
  } else if(roll < 0.50 + favorHome){
    newPhase = 'pressure_home';
    m.phaseSecLeft = 15 + Math.floor(Math.random()*20);
  } else if(roll < 0.70 + favorHome){
    newPhase = 'pressure_away';
    m.phaseSecLeft = 15 + Math.floor(Math.random()*20);
  } else {
    newPhase = 'chaos';
    m.phaseSecLeft = 12 + Math.floor(Math.random()*15);
  }
  if(m.redHome) newPhase = 'pressure_away';
  if(m.redAway) newPhase = 'pressure_home';
  m.phase = newPhase;
  if(newPhase === 'calm') m.commentary = 'Игра успокоилась · ' + Math.floor(m.minute) + "'";
  else if(newPhase === 'pressure_home') m.commentary = '🔥 ' + m.home + ' наращивает давление';
  else if(newPhase === 'pressure_away') m.commentary = '🔥 ' + m.away + ' наращивает давление';
  else if(newPhase === 'chaos') m.commentary = '⚡ Открытый футбол! Моменты у обоих ворот';
  else if(newPhase === 'endgame') m.commentary = '⏱ Финальный штурм!';
}

function footballExpectedLambda(m, side){
  var base = side==='home' ? m.homeAtk : m.awayAtk;
  var oppDef = side==='home' ? m.awayDef : m.homeDef;
  var homeAdv = side==='home' ? 1.20 : 0.90;
  var lambda = base * oppDef * homeAdv * 1.35;
  if(side==='home' && m.redHome) lambda *= 0.35;
  if(side==='away' && m.redAway) lambda *= 0.35;
  var mom = side==='home' ? m.momentum : -m.momentum;
  lambda *= (1 + mom * 0.35);
  return Math.max(0.05, lambda);
}

function simulateFootballTick(m){
  if(m.isBreak){
    m.breakTimer += 1;
    if(m.breakTimer >= FT_BREAK_SEC){
      m.isBreak = false;
      m.half = 2;
      m.minute = 45;
      m.commentary = '⚽ Второй тайм начался!';
    }
    return;
  }

  m.realTick += 1;
  m.minute += 1 / FT_TICK_PER_GAME_MIN;
  m.justScored = null;

  if(m.minute >= 45 && m.half === 1){
    m.minute = 45;
    m.isBreak = true;
    m.breakTimer = 0;
    m.commentary = '⏸ Перерыв. Счёт: ' + m.scoreHome + ':' + m.scoreAway;
    return;
  }
  if(m.minute >= 90){
    m.minute = 90;
    m.status = 'finished';
    m.finishedAt = Date.now();
    m.commentary = '🏁 Матч завершён: ' + m.scoreHome + ':' + m.scoreAway;
    return;
  }

  maybeSwitchFootballPhase(m);
  var I = computeFootballPhaseIntensity(m);
  var intensity = I.intensity;
  var goalBoost = I.goalBoost;

  // === АУТЫ ===
  m.nextThrowIn -= intensity * 1.5;
  if(m.nextThrowIn <= 0){
    var s1 = Math.random() < 0.5 ? 'home' : 'away';
    if(s1 === 'home') m.throwInsHome++; else m.throwInsAway++;
    if(Math.random() < 0.35) m.nextThrowIn = 8 + Math.floor(Math.random()*25);
    else m.nextThrowIn = 60 + Math.floor(Math.random()*180);
  }
  // === УДАРЫ ОТ ВОРОТ ===
  m.nextGoalKick -= intensity;
  if(m.nextGoalKick <= 0){
    var s2 = Math.random() < 0.5 ? 'home' : 'away';
    if(s2 === 'home') m.goalKicksHome++; else m.goalKicksAway++;
    m.nextGoalKick = 90 + Math.floor(Math.random()*240);
  }
  // === ФОЛЫ ===
  m.nextFoul -= intensity * 1.3;
  if(m.nextFoul <= 0){
    var s3 = Math.random() < 0.5 ? 'home' : 'away';
    if(s3 === 'home') m.foulsHome++; else m.foulsAway++;
    if(Math.random() < 0.10){
      if(s3 === 'home') m.cardsHome++; else m.cardsAway++;
      m.commentary = '🟨 Жёлтая — ' + (s3==='home' ? m.home : m.away) + ' · ' + Math.floor(m.minute) + "'";
    }
    if(Math.random() < 0.4) m.nextFoul = 15 + Math.floor(Math.random()*40);
    else m.nextFoul = 100 + Math.floor(Math.random()*240);
  }
  // === УГЛОВЫЕ ===
  m.nextCorner -= intensity;
  if(m.nextCorner <= 0){
    var s4 = Math.random() < 0.5 ? 'home' : 'away';
    if(s4 === 'home') m.cornersHome++; else m.cornersAway++;
    m.nextCorner = 200 + Math.floor(Math.random()*400);
  }
  // === УДАРЫ ===
  m.nextShot -= intensity * 1.4;
  if(m.nextShot <= 0){
    var s5 = Math.random() < 0.5 ? 'home' : 'away';
    var onT = Math.random() < 0.4;
    if(s5 === 'home'){
      m.shotsHome++;
      m.xgHome += 0.05 + Math.random()*0.2;
      if(onT){ m.shotsOnTargetHome++; if(Math.random() < 0.65) m.savesAway++; }
    } else {
      m.shotsAway++;
      m.xgAway += 0.05 + Math.random()*0.2;
      if(onT){ m.shotsOnTargetAway++; if(Math.random() < 0.65) m.savesHome++; }
    }
    m.nextShot = 60 + Math.floor(Math.random()*180);
  }
  // === ОФСАЙДЫ ===
  m.nextOffside -= intensity;
  if(m.nextOffside <= 0){
    var s6 = Math.random() < 0.5 ? 'home' : 'away';
    if(s6 === 'home') m.offsidesHome++; else m.offsidesAway++;
    m.nextOffside = 300 + Math.floor(Math.random()*600);
  }

  // === ВЛАДЕНИЕ ===
  var targetPoss = 50 + (m.homeAtk - m.awayAtk) * 10;
  if(m.phase === 'pressure_home') targetPoss += 10;
  if(m.phase === 'pressure_away') targetPoss -= 10;
  targetPoss += (m.scoreHome - m.scoreAway) * 3;
  if(m.redHome) targetPoss -= 20;
  if(m.redAway) targetPoss += 20;
  m.possessionHome = Math.round(m.possessionHome * 0.97 + targetPoss * 0.03);
  m.possessionHome = clamp(m.possessionHome, 25, 75);

  // === ГОЛЫ ===
  var pGoal = 0.0035 * goalBoost;
  var lamH = footballExpectedLambda(m, 'home');
  var lamA = footballExpectedLambda(m, 'away');
  var totalLam = lamH + lamA;
  if(totalLam > 0 && Math.random() < pGoal){
    var pHG = lamH / totalLam;
    if(Math.random() < pHG){
      m.scoreHome++; m.xgHome += 0.4 + Math.random()*0.5;
      m.shotsOnTargetHome++;
      m.goals.push({min: Math.floor(m.minute), side:'home'});
      m.momentum = Math.min(1, m.momentum + 0.6);
      m.justScored = 'home';
      m.commentary = '⚽ ГОЛ! ' + m.home + ' — ' + m.scoreHome + ':' + m.scoreAway + ' (' + Math.floor(m.minute) + "')";
      m.phase = 'pressure_away';
      m.phaseSecLeft = 20 + Math.floor(Math.random()*20);
    } else {
      m.scoreAway++; m.xgAway += 0.4 + Math.random()*0.5;
      m.shotsOnTargetAway++;
      m.goals.push({min: Math.floor(m.minute), side:'away'});
      m.momentum = Math.max(-1, m.momentum - 0.6);
      m.justScored = 'away';
      m.commentary = '⚽ ГОЛ! ' + m.away + ' — ' + m.scoreHome + ':' + m.scoreAway + ' (' + Math.floor(m.minute) + "')";
      m.phase = 'pressure_home';
      m.phaseSecLeft = 20 + Math.floor(Math.random()*20);
    }
  } else if(Math.random() < 0.006){
    var sM = Math.random() < 0.5 ? 'home' : 'away';
    if(sM === 'home'){
      m.shotsHome++; m.xgHome += 0.15;
      m.commentary = '🔥 Опасный момент — ' + m.home;
    } else {
      m.shotsAway++; m.xgAway += 0.15;
      m.commentary = '🔥 Опасный момент — ' + m.away;
    }
  }
}


/* ============ КОЭФЫ ФУТБОЛА ============ */
function computeFootballOdds(m){
  if(m.status==='finished' || m.status==='countdown') return {home:null, draw:null, away:null};
  var rem = m.maxMinute - m.minute;
  if(rem <= 0) return {home:null, draw:null, away:null};
  var lamH = footballExpectedLambda(m, 'home') * rem / 90;
  var lamA = footballExpectedLambda(m, 'away') * rem / 90;
  var pH = 0, pD = 0, pA = 0;
  for(var h=0; h<=10; h++){
    for(var a=0; a<=10; a++){
      var p = poisson(h, lamH) * poisson(a, lamA);
      var fh = m.scoreHome + h, fa = m.scoreAway + a;
      if(fh > fa) pH += p;
      else if(fh === fa) pD += p;
      else pA += p;
    }
  }
  var t = pH + pD + pA || 1;
  return {home: toOdd(pH/t, 0.05), draw: toOdd(pD/t, 0.05), away: toOdd(pA/t, 0.05)};
}

function computeFootballExtras(m){
  if(m.status==='finished' || m.status==='countdown') return {};
  var out = {};
  function add(l, p, mar){ var o = toOdd(p, mar||0.05); if(o!==null) out[l]=o; }
  var rem = m.maxMinute - m.minute;
  if(rem <= 0) return out;
  var lamH = footballExpectedLambda(m, 'home') * rem / 90;
  var lamA = footballExpectedLambda(m, 'away') * rem / 90;

  // Матрица
  var matrix = {};
  var totalP = 0;
  for(var h=0; h<=10; h++){
    for(var a=0; a<=10; a++){
      var p = poisson(h, lamH) * poisson(a, lamA);
      var fh = m.scoreHome + h, fa = m.scoreAway + a;
      var k = fh + ':' + fa;
      matrix[k] = (matrix[k]||0) + p;
      totalP += p;
    }
  }
  for(var kk in matrix) matrix[kk] /= totalP;

  var pH=0, pD=0, pA=0, pEven=0, pBtts=0;
  for(var k2 in matrix){
    var pp = k2.split(':');
    var hh = parseInt(pp[0]), aa = parseInt(pp[1]);
    if(hh > aa) pH += matrix[k2];
    else if(hh === aa) pD += matrix[k2];
    else pA += matrix[k2];
    if((hh+aa)%2===0) pEven += matrix[k2];
    if(hh >= 1 && aa >= 1) pBtts += matrix[k2];
  }

  add('1X', pH+pD, 0.04);
  add('12', pH+pA, 0.04);
  add('X2', pD+pA, 0.04);

  [0.5,1.5,2.5,3.5,4.5].forEach(function(line){
    var pOver = 0;
    for(var k in matrix){
      var pr = k.split(':');
      if(parseInt(pr[0]) + parseInt(pr[1]) > line) pOver += matrix[k];
    }
    add('ТБ ' + line, pOver, 0.05);
    add('ТМ ' + line, 1-pOver, 0.05);
  });

  // ТБ первого тайма
  if(m.minute < 45){
    var rem1 = 45 - m.minute;
    var lamH1 = footballExpectedLambda(m, 'home') * rem1 / 90;
    var lamA1 = footballExpectedLambda(m, 'away') * rem1 / 90;
    var mt1 = {}, t1 = 0;
    for(var h1=0; h1<=8; h1++){
      for(var a1=0; a1<=8; a1++){
        var p1 = poisson(h1, lamH1)*poisson(a1, lamA1);
        var kk1 = (m.scoreHome+h1)+':'+(m.scoreAway+a1);
        mt1[kk1] = (mt1[kk1]||0)+p1;
        t1 += p1;
      }
    }
    [0.5,1.5,2.5].forEach(function(line){
      var pOver = 0;
      for(var kk2 in mt1){
        var pr2 = kk2.split(':');
        if(parseInt(pr2[0])+parseInt(pr2[1]) > line) pOver += mt1[kk2]/t1;
      }
      add('ТБ 1-й тайм ' + line, pOver, 0.06);
      add('ТМ 1-й тайм ' + line, 1-pOver, 0.06);
    });
    var pH1=0, pD1=0, pA1=0;
    for(var kk3 in mt1){
      var pr3 = kk3.split(':');
      var hh3 = parseInt(pr3[0]), aa3 = parseInt(pr3[1]);
      if(hh3 > aa3) pH1 += mt1[kk3]/t1;
      else if(hh3 === aa3) pD1 += mt1[kk3]/t1;
      else pA1 += mt1[kk3]/t1;
    }
    add('1-й тайм · П1', pH1, 0.06);
    add('1-й тайм · X', pD1, 0.06);
    add('1-й тайм · П2', pA1, 0.06);
  }

  var pF1 = 0, pF1p = 0;
  for(var k3 in matrix){
    var pr4 = k3.split(':');
    var d = parseInt(pr4[0]) - parseInt(pr4[1]);
    if(d > 1.5) pF1 += matrix[k3];
    if(d > -1.5) pF1p += matrix[k3];
  }
  add('Ф1 −1.5', pF1, 0.05);
  add('Ф1 +1.5', pF1p, 0.05);
  add('Ф2 −1.5', 1-pF1p, 0.05);
  add('Ф2 +1.5', 1-pF1, 0.05);

  add('Обе · Да', pBtts, 0.05);
  add('Обе · Нет', 1-pBtts, 0.05);
  add('Чёт', pEven, 0.05);
  add('Нечет', 1-pEven, 0.05);

  // Гол в интервале
  if(m.minute < 90){
    var intervals = [
      {from:0,to:15,label:'0-15'},{from:15,to:30,label:'15-30'},
      {from:30,to:45,label:'30-45'},{from:45,to:60,label:'45-60'},
      {from:60,to:75,label:'60-75'},{from:75,to:90,label:'75-90'}
    ];
    intervals.forEach(function(iv){
      if(m.minute < iv.to){
        var from = Math.max(iv.from, m.minute);
        var span = iv.to - from;
        var lamHi = footballExpectedLambda(m, 'home') * span / 90;
        var lamAi = footballExpectedLambda(m, 'away') * span / 90;
        var pGoal = 1 - Math.exp(-(lamHi+lamAi));
        add('Гол ' + iv.label + ' мин', pGoal, 0.06);
      }
    });
  }

  // === СТАТИСТИЧЕСКИЕ РЫНКИ ===
  var remMin = rem;
  // Фолы
  var foulsNow = m.foulsHome + m.foulsAway;
  var foulsRate = m.minute > 5 ? (foulsNow / m.minute) * 90 : 24;
  var foulsExp = foulsNow + foulsRate * (remMin / 90);
  [20.5, 24.5, 28.5, 32.5].forEach(function(line){
    var z = (line - foulsExp) / Math.max(1, Math.sqrt(foulsExp * 0.3));
    var pOver = 1 - normalCDF(z);
    pOver = clamp(pOver, 0.05, 0.95);
    add('ТБ ' + line + ' фолов', pOver, 0.07);
    add('ТМ ' + line + ' фолов', 1-pOver, 0.07);
  });
  [10.5, 12.5, 14.5].forEach(function(line){
    var expH = m.foulsHome + (foulsRate/2) * (remMin/90);
    var expA = m.foulsAway + (foulsRate/2) * (remMin/90);
    var zH = (line - expH) / Math.max(1, Math.sqrt(expH*0.3));
    var zA = (line - expA) / Math.max(1, Math.sqrt(expA*0.3));
    add(m.home + ' ТБ ' + line + ' фолов', clamp(1-normalCDF(zH), 0.05, 0.95), 0.08);
    add(m.away + ' ТБ ' + line + ' фолов', clamp(1-normalCDF(zA), 0.05, 0.95), 0.08);
  });

  // Ауты
  var thNow = m.throwInsHome + m.throwInsAway;
  var thRate = m.minute > 5 ? (thNow / m.minute) * 90 : 42;
  var thExp = thNow + thRate * (remMin / 90);
  [38.5, 42.5, 46.5, 50.5].forEach(function(line){
    var z = (line - thExp) / Math.max(1, Math.sqrt(thExp * 0.25));
    var pOver = 1 - normalCDF(z);
    pOver = clamp(pOver, 0.05, 0.95);
    add('ТБ ' + line + ' аутов', pOver, 0.07);
    add('ТМ ' + line + ' аутов', 1-pOver, 0.07);
  });
  [19.5, 22.5].forEach(function(line){
    var expH = m.throwInsHome + (thRate/2)*(remMin/90);
    var expA = m.throwInsAway + (thRate/2)*(remMin/90);
    var zH = (line - expH) / Math.max(1, Math.sqrt(expH*0.25));
    var zA = (line - expA) / Math.max(1, Math.sqrt(expA*0.25));
    add(m.home + ' ТБ ' + line + ' аутов', clamp(1-normalCDF(zH), 0.05, 0.95), 0.08);
    add(m.away + ' ТБ ' + line + ' аутов', clamp(1-normalCDF(zA), 0.05, 0.95), 0.08);
  });

  // Удары от ворот
  var gkNow = m.goalKicksHome + m.goalKicksAway;
  var gkRate = m.minute > 5 ? (gkNow / m.minute) * 90 : 18;
  var gkExp = gkNow + gkRate * (remMin / 90);
  [14.5, 17.5, 20.5].forEach(function(line){
    var z = (line - gkExp) / Math.max(1, Math.sqrt(gkExp * 0.28));
    var pOver = 1 - normalCDF(z);
    pOver = clamp(pOver, 0.05, 0.95);
    add('ТБ ' + line + ' от ворот', pOver, 0.07);
    add('ТМ ' + line + ' от ворот', 1-pOver, 0.07);
  });

  // Угловые
  var cnNow = m.cornersHome + m.cornersAway;
  var cnRate = m.minute > 5 ? (cnNow / m.minute) * 90 : 10;
  var cnExp = cnNow + cnRate * (remMin / 90);
  [7.5, 9.5, 11.5, 13.5].forEach(function(line){
    var z = (line - cnExp) / Math.max(1, Math.sqrt(cnExp * 0.35));
    var pOver = 1 - normalCDF(z);
    pOver = clamp(pOver, 0.05, 0.95);
    add('ТБ ' + line + ' угловых', pOver, 0.07);
    add('ТМ ' + line + ' угловых', 1-pOver, 0.07);
  });

  // Офсайды
  var offNow = m.offsidesHome + m.offsidesAway;
  var offRate = m.minute > 5 ? (offNow / m.minute) * 90 : 4;
  var offExp = offNow + offRate * (remMin / 90);
  [2.5, 3.5, 4.5].forEach(function(line){
    var z = (line - offExp) / Math.max(1, Math.sqrt(offExp * 0.4));
    var pOver = 1 - normalCDF(z);
    pOver = clamp(pOver, 0.05, 0.95);
    add('ТБ ' + line + ' офсайдов', pOver, 0.08);
    add('ТМ ' + line + ' офсайдов', 1-pOver, 0.08);
  });

  // Жёлтые
  var crNow = m.cardsHome + m.cardsAway;
  var crRate = m.minute > 5 ? (crNow / m.minute) * 90 : 4;
  var crExp = crNow + crRate * (remMin / 90);
  [2.5, 3.5, 4.5, 5.5].forEach(function(line){
    var z = (line - crExp) / Math.max(1, Math.sqrt(crExp * 0.5));
    var pOver = 1 - normalCDF(z);
    pOver = clamp(pOver, 0.05, 0.95);
    add('ТБ ' + line + ' жёлтых', pOver, 0.08);
    add('ТМ ' + line + ' жёлтых', 1-pOver, 0.08);
  });

  // Удары всего
  var shNow = m.shotsHome + m.shotsAway;
  var shRate = m.minute > 5 ? (shNow / m.minute) * 90 : 22;
  var shExp = shNow + shRate * (remMin / 90);
  [18.5, 22.5, 26.5, 30.5].forEach(function(line){
    var z = (line - shExp) / Math.max(1, Math.sqrt(shExp * 0.3));
    var pOver = 1 - normalCDF(z);
    pOver = clamp(pOver, 0.05, 0.95);
    add('ТБ ' + line + ' ударов', pOver, 0.07);
    add('ТМ ' + line + ' ударов', 1-pOver, 0.07);
  });

  // Удары в створ
  var sotNow = m.shotsOnTargetHome + m.shotsOnTargetAway;
  var sotRate = m.minute > 5 ? (sotNow / m.minute) * 90 : 7;
  var sotExp = sotNow + sotRate * (remMin / 90);
  [6.5, 8.5, 10.5].forEach(function(line){
    var z = (line - sotExp) / Math.max(1, Math.sqrt(sotExp * 0.35));
    var pOver = 1 - normalCDF(z);
    pOver = clamp(pOver, 0.05, 0.95);
    add('ТБ ' + line + ' в створ', pOver, 0.08);
    add('ТМ ' + line + ' в створ', 1-pOver, 0.08);
  });

  // Точный счёт (топ-5)
  var sorted = [];
  for(var k4 in matrix) sorted.push([k4, matrix[k4]]);
  sorted.sort(function(a,b){ return b[1]-a[1]; });
  sorted.slice(0,5).forEach(function(s){
    if(s[1] > 0.02) add('Счёт ' + s[0], s[1]*1.03, 0.06);
  });

  // ТБ команды
  [0.5, 1.5, 2.5].forEach(function(line){
    var hO = 0, aO = 0;
    for(var k5 in matrix){
      var pr5 = k5.split(':');
      if(parseInt(pr5[0]) > line) hO += matrix[k5];
      if(parseInt(pr5[1]) > line) aO += matrix[k5];
    }
    add(m.home + ' ТБ ' + line, hO, 0.06);
    add(m.away + ' ТБ ' + line, aO, 0.06);
  });

  return out;
}

/* ============================================================
   ХОККЕЙ — периоды, удаления, power play, empty net, ОТ, буллиты
   ============================================================ */
var HK_PERIOD_SEC = 20;        // 20 "минут" в периоде (1 реальная сек = 1 игровая минута)
var HK_PERIODS = 3;
var HK_OT_SEC = 5;
var HK_BREAK_SEC = 2;          // перерыв между периодами (2 сек реальных)

function newHockey(){
  var lgs = [...new Set(HOCKEY.map(function(t){ return t.lg; }))];
  var lg = pick(lgs);
  var teams = HOCKEY.filter(function(t){ return t.lg===lg; });
  var pair = pickTwo(teams);
  var h = pair[0], a = pair[1];
  return {
    id: nextId++, sport:'hockey', league:lg,
    home:h.n, away:a.n,
    homeAtk:h.atk, awayAtk:a.atk,
    homeDef:h.def, awayDef:a.def,
    homeRating:h.rt, awayRating:a.rt,
    homeCountry:h.country, awayCountry:a.country,
    homeStyle:h.style || 'balanced', awayStyle:a.style || 'balanced',
    scoreHome:0, scoreAway:0,
    periodScores:[{h:0,a:0},{h:0,a:0},{h:0,a:0}],
    period:1, periodSec:0,
    minute:0, maxMinute:60,
    // Удаления (в секундах игровых)
    penaltyHome:0, penaltyAway:0,
    powerplay:null,
    emptyNet:null,
    shotsHome:0, shotsAway:0,
    savesHome:0, savesAway:0,
    hitsHome:0, hitsAway:0,
    faceoffsHome:0, faceoffsAway:0,
    // Перерыв между периодами
    isBreak:false, breakTimer:0,
    // Овертайм/буллиты
    overtime:false, shootout:false,
    finalResult:null,
    justScored:null,
    status:'live', momentum:0,
    commentary:'Матч начинается'
  };
}

function hockeyExpectedLambda(m, side){
  var base = side==='home' ? m.homeAtk : m.awayAtk;
  var oppDef = side==='home' ? m.awayDef : m.homeDef;
  var homeAdv = side==='home' ? 1.08 : 0.94;
  var lambda = base * (oppDef / 3.0) * homeAdv * 0.55;
  // Power play
  if(side==='home' && m.penaltyAway > 0) lambda *= 2.8;
  if(side==='away' && m.penaltyHome > 0) lambda *= 2.8;
  // Empty net
  if(side==='home' && m.emptyNet === 'away') lambda *= 5;
  if(side==='away' && m.emptyNet === 'home') lambda *= 5;
  var mom = side==='home' ? m.momentum : -m.momentum;
  lambda *= (1 + mom * 0.3);
  return Math.max(0.03, lambda);
}

function simulateHockeyTick(m){
  // Перерыв между периодами
  if(m.isBreak){
    m.breakTimer += 1;
    if(m.breakTimer >= HK_BREAK_SEC){
      m.isBreak = false;
      m.period += 1;
      m.periodSec = 0;
      m.penaltyHome = 0; m.penaltyAway = 0;
      m.emptyNet = null;
      if(m.period > 3){
        // Конец 3 периодов
        if(m.scoreHome === m.scoreAway){
          m.overtime = true;
          m.period = 4;
          m.commentary = '🔥 Овертайм! 5 минут';
        } else {
          m.status = 'finished';
          m.finishedAt = Date.now();
          m.commentary = '🏁 Матч завершён: ' + m.scoreHome + ':' + m.scoreAway;
        }
        return;
      }
      m.commentary = 'Период ' + m.period + ' начался';
    }
    return;
  }

  m.periodSec += 1;
  m.minute += 1;
  m.justScored = null;
  m.momentum *= 0.94;

  // Овертайм — 5 "минут"
  if(m.period === 4 && m.periodSec >= HK_OT_SEC){
    m.shootout = true;
    var hG = 0, aG = 0;
    for(var i=0;i<5;i++){
      if(Math.random() < 0.35) hG++;
      if(Math.random() < 0.35) aG++;
    }
    var guard = 0;
    while(hG === aG && guard++ < 30){
      if(Math.random() < 0.4) hG++;
      if(Math.random() < 0.4) aG++;
    }
    if(hG > aG){ m.scoreHome += 1; m.finalResult = {winner:'home', method:'Буллиты'}; }
    else { m.scoreAway += 1; m.finalResult = {winner:'away', method:'Буллиты'}; }
    m.status = 'finished';
    m.finishedAt = Date.now();
    m.commentary = '🎯 Буллиты! Победа ' + (hG>aG ? m.home : m.away);
    return;
  }

  // Проверка окончания периода
  if(m.period <= 3 && m.periodSec >= HK_PERIOD_SEC){
    m.isBreak = true;
    m.breakTimer = 0;
    m.commentary = '⏸ Перерыв. Счёт: ' + m.scoreHome + ':' + m.scoreAway;
    return;
  }

  // Уменьшение таймеров удалений
  if(m.penaltyHome > 0) m.penaltyHome = Math.max(0, m.penaltyHome - 1);
  if(m.penaltyAway > 0) m.penaltyAway = Math.max(0, m.penaltyAway - 1);

  // Empty net в последние 2 минуты 3 периода
  if(m.period === 3 && m.periodSec >= 18 && m.scoreHome !== m.scoreAway){
    if(m.scoreHome < m.scoreAway) m.emptyNet = 'home';
    else m.emptyNet = 'away';
  } else if(m.period !== 3) {
    m.emptyNet = null;
  }

  // Удаления (2 мин = 40 сек игровых в нашей шкале, ~2 тика)
  if(Math.random() < 0.03 && m.penaltyHome === 0 && m.penaltyAway === 0){
    if(Math.random() < 0.5){
      m.penaltyHome = 4;
      m.commentary = '🟨 Удаление — ' + m.home + ' (2 мин)';
    } else {
      m.penaltyAway = 4;
      m.commentary = '🟨 Удаление — ' + m.away + ' (2 мин)';
    }
  }

  // Ожидание голов за "минуту"
  var lamH = hockeyExpectedLambda(m, 'home') / 60;
  var lamA = hockeyExpectedLambda(m, 'away') / 60;

  if(Math.random() < lamH){
    m.scoreHome += 1;
    m.shotsHome++;
    m.justScored = 'home';
    m.momentum = Math.min(1, m.momentum + 0.4);
    var pp = m.penaltyAway > 0 ? ' (большинство!)' : (m.emptyNet==='away' ? ' (пустые ворота!)' : '');
    m.commentary = '🏒 ГОЛ! ' + m.home + ' — ' + m.scoreHome + ':' + m.scoreAway + pp;
    if(m.period <= 3) m.periodScores[m.period-1].h += 1;
  } else if(Math.random() < lamA){
    m.scoreAway += 1;
    m.shotsAway++;
    m.justScored = 'away';
    m.momentum = Math.max(-1, m.momentum - 0.4);
    var pp2 = m.penaltyHome > 0 ? ' (большинство!)' : (m.emptyNet==='home' ? ' (пустые ворота!)' : '');
    m.commentary = '🏒 ГОЛ! ' + m.away + ' — ' + m.scoreHome + ':' + m.scoreAway + pp2;
    if(m.period <= 3) m.periodScores[m.period-1].a += 1;
  } else {
    var r = Math.random();
    if(r < 0.10){ m.shotsHome++; m.savesAway++; }
    else if(r < 0.20){ m.shotsAway++; m.savesHome++; }
    else if(r < 0.25){ m.hitsHome++; m.commentary = '💥 ' + m.home + ' применил силовой'; }
    else if(r < 0.30){ m.hitsAway++; m.commentary = '💥 ' + m.away + ' применил силовой'; }
    else if(r < 0.33){ m.faceoffsHome++; }
    else if(r < 0.36){ m.faceoffsAway++; }
    else if(m.penaltyHome > 0){ m.commentary = '🔥 Большинство у ' + m.away; }
    else if(m.penaltyAway > 0){ m.commentary = '🔥 Большинство у ' + m.home; }
    else if(m.period === 3 && m.periodSec >= 18 && m.scoreHome !== m.scoreAway){
      m.commentary = '⚠ ' + (m.scoreHome<m.scoreAway ? m.home : m.away) + ' снимает вратаря!';
    }
  }
}

function computeHockeyOdds(m){
  if(m.status==='finished' || m.status==='countdown') return {home:null, draw:null, away:null};
  // Регулярное время — 60 мин, овертайм — отдельно
  var rem = m.period === 4 ? 5 : (60 - m.minute);
  if(rem <= 0) rem = 0.5;
  var lamH = hockeyExpectedLambda(m, 'home') * rem / 60;
  var lamA = hockeyExpectedLambda(m, 'away') * rem / 60;

  var pH = 0, pD = 0, pA = 0;
  for(var h=0; h<=8; h++){
    for(var a=0; a<=8; a++){
      var p = poisson(h, lamH) * poisson(a, lamA);
      var fh = m.scoreHome + h, fa = m.scoreAway + a;
      if(fh > fa) pH += p;
      else if(fh === fa) pD += p;
      else pA += p;
    }
  }
  var t = pH + pD + pA || 1;
  return {home: toOdd(pH/t, 0.05), draw: toOdd(pD/t, 0.05), away: toOdd(pA/t, 0.05)};
}

function computeHockeyExtras(m){
  if(m.status==='finished' || m.status==='countdown') return {};
  var out = {};
  function add(l, p, mar){ var o = toOdd(p, mar||0.05); if(o!==null) out[l]=o; }

  var rem = Math.max(1, 60 - m.minute);
  var lamH = hockeyExpectedLambda(m, 'home') * rem / 60;
  var lamA = hockeyExpectedLambda(m, 'away') * rem / 60;

  var matrix = {};
  var totalP = 0;
  for(var h=0; h<=8; h++){
    for(var a=0; a<=8; a++){
      var p = poisson(h, lamH) * poisson(a, lamA);
      var fh = m.scoreHome + h, fa = m.scoreAway + a;
      var k = fh + ':' + fa;
      matrix[k] = (matrix[k]||0) + p;
      totalP += p;
    }
  }
  for(var kk in matrix) matrix[kk] /= totalP;

  // Тоталы
  [3.5,4.5,5.5,6.5,7.5].forEach(function(line){
    var pOver = 0;
    for(var k in matrix){
      var pr = k.split(':');
      if(parseInt(pr[0]) + parseInt(pr[1]) > line) pOver += matrix[k];
    }
    add('ТБ ' + line, pOver, 0.05);
    add('ТМ ' + line, 1-pOver, 0.05);
  });

  // Форы
  var pF1 = 0, pF1p = 0;
  for(var k2 in matrix){
    var pr2 = k2.split(':');
    var d = parseInt(pr2[0]) - parseInt(pr2[1]);
    if(d > 1.5) pF1 += matrix[k2];
    if(d > -1.5) pF1p += matrix[k2];
  }
  add('Ф1 −1.5', pF1, 0.06);
  add('Ф1 +1.5', pF1p, 0.06);
  add('Ф2 −1.5', 1-pF1p, 0.06);
  add('Ф2 +1.5', 1-pF1, 0.06);

  // Двойной шанс
  var pH = 0, pD = 0, pA = 0;
  for(var k3 in matrix){
    var pr3 = k3.split(':');
    var hh = parseInt(pr3[0]), aa = parseInt(pr3[1]);
    if(hh > aa) pH += matrix[k3];
    else if(hh === aa) pD += matrix[k3];
    else pA += matrix[k3];
  }
  add('1X', pH+pD, 0.05);
  add('12', pH+pA, 0.05);
  add('X2', pD+pA, 0.05);

  // ТБ периода (если ещё идёт)
  if(m.period <= 3 && m.periodSec < HK_PERIOD_SEC){
    var remP = HK_PERIOD_SEC - m.periodSec;
    var lamHp = hockeyExpectedLambda(m, 'home') * remP / 60;
    var lamAp = hockeyExpectedLambda(m, 'away') * remP / 60;
    [0.5, 1.5, 2.5].forEach(function(line){
      var pOver = 0;
      for(var h2=0; h2<=6; h2++){
        for(var a2=0; a2<=6; a2++){
          if(h2+a2 > line) pOver += poisson(h2, lamHp) * poisson(a2, lamAp);
        }
      }
      add('ТБ ' + m.period + '-й период ' + line, pOver, 0.07);
      add('ТМ ' + m.period + '-й период ' + line, 1-pOver, 0.07);
    });
  }

  // Обе забьют
  var pBtts = 0;
  for(var k4 in matrix){
    var pr4 = k4.split(':');
    if(parseInt(pr4[0]) >= 1 && parseInt(pr4[1]) >= 1) pBtts += matrix[k4];
  }
  add('Обе · Да', pBtts, 0.06);
  add('Обе · Нет', 1-pBtts, 0.06);

  // Точный счёт
  var sorted = [];
  for(var k5 in matrix) sorted.push([k5, matrix[k5]]);
  sorted.sort(function(a,b){ return b[1]-a[1]; });
  sorted.slice(0,5).forEach(function(s){
    if(s[1] > 0.02) add('Счёт ' + s[0], s[1]*1.03, 0.06);
  });

  // Большинство / меньшинство
  if(m.penaltyHome > 0){
    add(m.away + ' забьёт в большинстве', 0.45, 0.08);
  }
  if(m.penaltyAway > 0){
    add(m.home + ' забьёт в большинстве', 0.45, 0.08);
  }

  // ТБ бросков
  var shNow = m.shotsHome + m.shotsAway;
  var shRate = m.minute > 3 ? (shNow/m.minute)*60 : 60;
  var shExp = shNow + shRate * (rem/60);
  [55.5, 60.5, 65.5].forEach(function(line){
    var z = (line - shExp) / Math.max(1, Math.sqrt(shExp*0.25));
    var pOver = 1 - normalCDF(z);
    pOver = clamp(pOver, 0.05, 0.95);
    add('ТБ ' + line + ' бросков', pOver, 0.08);
    add('ТМ ' + line + ' бросков', 1-pOver, 0.08);
  });

  return out;
}

/* ============================================================
   UFC — 5 раундов по 300 сек, stamina, HP, takedown, ground
   ============================================================ */
var UFC_ROUND_SEC = 300;
var UFC_BREAK_SEC = 60;
var UFC_MAX_ROUNDS = 5;

function newUFC(){
  var divs = [...new Set(UFC.map(function(f){ return f.div; }))];
  var div = pick(divs);
  var pool = UFC.filter(function(f){ return f.div===div; });
  var pair = pickTwo(pool);
  var h = pair[0], a = pair[1];
  return {
    id: nextId++, sport:'ufc', league:'UFC · '+div,
    home:h.n, away:a.n,
    homeRating:h.rt, awayRating:a.rt,
    homeCountry:h.country, awayCountry:a.country,
    homeFighter:{power:h.power, acc:h.acc, td:h.td, style:h.style, hpMax:h.hpMax, stamMax:h.stamMax},
    awayFighter:{power:a.power, acc:a.acc, td:a.td, style:a.style, hpMax:a.hpMax, stamMax:a.stamMax},
    homeHP:h.hpMax, awayHP:a.hpMax,
    homeStam:h.stamMax, awayStam:a.stamMax,
    round:1, roundSec:0, minute:0, maxMinute:UFC_MAX_ROUNDS*UFC_ROUND_SEC,
    phase:'fight',
    scoreHome:0, scoreAway:0,
    roundScores:[],
    status:'live', momentum:0,
    finalResult:null, justScored:null,
    commentary:'Начало боя'
  };
}

function simulateUFCTick(m){
  if(m.phase === 'break'){
    m.roundSec += 1;
    if(m.roundSec >= UFC_BREAK_SEC){
      m.phase = 'fight'; m.roundSec = 0;
      m.homeStam = Math.min(m.homeFighter.stamMax, m.homeStam + 18);
      m.awayStam = Math.min(m.awayFighter.stamMax, m.awayStam + 18);
      m.commentary = 'Раунд ' + m.round + ' начинается';
    }
    return;
  }
  m.roundSec += 1;
  m.minute += 1;

  var hAcc = m.homeFighter.acc * (m.homeStam / m.homeFighter.stamMax);
  var aAcc = m.awayFighter.acc * (m.awayStam / m.awayFighter.stamMax);
  var hPow = m.homeFighter.power * (0.7 + 0.3 * (m.homeStam / m.homeFighter.stamMax));
  var aPow = m.awayFighter.power * (0.7 + 0.3 * (m.awayStam / m.awayFighter.stamMax));

  var hAct = hAcc / 100 * 0.35;
  var aAct = aAcc / 100 * 0.35;
  var hTd = m.homeFighter.td / 100 * 0.05 * (m.homeStam / m.homeFighter.stamMax);
  var aTd = m.awayFighter.td / 100 * 0.05 * (m.awayStam / m.awayFighter.stamMax);

  // Takedown хозяина
  if(Math.random() < hTd && m.homeFighter.style !== 'striker'){
    m.commentary = m.home + ' проходит в партер!';
    m.awayHP -= hPow * 0.35;
    m.homeStam -= 2;
    if(Math.random() < 0.10 && m.awayHP < 40){
      finishUFC(m, 'home', 'Сабмишн', m.round);
      return;
    }
  }
  // Takedown гостя
  if(Math.random() < aTd && m.awayFighter.style !== 'striker'){
    m.commentary = m.away + ' проходит в партер!';
    m.homeHP -= aPow * 0.35;
    m.awayStam -= 2;
    if(Math.random() < 0.10 && m.homeHP < 40){
      finishUFC(m, 'away', 'Сабмишн', m.round);
      return;
    }
  }

  // Удар хозяина
  if(Math.random() < hAct){
    if(Math.random() < hAcc/100 * 0.55){
      m.awayHP -= hPow * 0.18;
      m.homeStam -= 1.2;
      m.awayStam -= 0.8;
      if(Math.random() < 0.02 && m.awayHP < 15){
        finishUFC(m, 'home', 'KO/TKO', m.round);
        return;
      }
    } else {
      m.homeStam -= 1.5;
    }
  }
  // Удар гостя
  if(Math.random() < aAct){
    if(Math.random() < aAcc/100 * 0.55){
      m.homeHP -= aPow * 0.18;
      m.awayStam -= 1.2;
      m.homeStam -= 0.8;
      if(Math.random() < 0.02 && m.homeHP < 15){
        finishUFC(m, 'away', 'KO/TKO', m.round);
        return;
      }
    } else {
      m.awayStam -= 1.5;
    }
  }

  if(m.homeStam < 5) m.homeStam = 5;
  if(m.awayStam < 5) m.awayStam = 5;
  if(m.homeHP < 0) m.homeHP = 0;
  if(m.awayHP < 0) m.awayHP = 0;

  // Конец раунда
  if(m.roundSec >= UFC_ROUND_SEC){
    var scoreDiff = (m.homeHP - m.awayHP) + (m.homeStam - m.awayStam) * 0.3;
    var rh = 10, ra = 10;
    if(scoreDiff > 15) ra = 8;
    else if(scoreDiff > 3) ra = 9;
    else if(scoreDiff < -15) rh = 8;
    else if(scoreDiff < -3) rh = 9;
    m.roundScores.push({h:rh, a:ra});

    if(m.round >= UFC_MAX_ROUNDS){
      var totH = 0, totA = 0;
      m.roundScores.forEach(function(rs){ totH += rs.h; totA += rs.a; });
      if(m.homeHP < 15 && m.awayHP > m.homeHP * 2){ finishUFC(m, 'away', 'KO/TKO', m.round); return; }
      if(m.awayHP < 15 && m.homeHP > m.awayHP * 2){ finishUFC(m, 'home', 'KO/TKO', m.round); return; }
      var winner = totH >= totA ? 'home' : 'away';
      finishUFC(m, winner, 'Решение', 5);
      return;
    }

    m.round += 1;
    m.phase = 'break';
    m.roundSec = 0;
    m.commentary = 'Перерыв. Раунд ' + (m.round - 1) + ' завершён';
  }
}

function finishUFC(m, winner, method, round){
  m.finalResult = {winner:winner, method:method, round:round};
  if(winner === 'home'){ m.scoreHome = 1; m.scoreAway = 0; m.justScored = 'home'; }
  else{ m.scoreHome = 0; m.scoreAway = 1; m.justScored = 'away'; }
  m.status = 'finished';
  m.finishedAt = Date.now();
  var name = winner === 'home' ? m.home : m.away;
  m.commentary = '🏆 ' + name + ' побеждает · ' + method + ' · R' + round;
}

function ufcProbHome(m){
  if(m.status === 'finished'){
    if(!m.finalResult) return 0.5;
    return m.finalResult.winner === 'home' ? 1 : 0;
  }
  if(m.status === 'countdown') return 0.5;
  var hpDiff = (m.homeHP - m.awayHP) / Math.max(1, m.homeFighter.hpMax);
  var stamDiff = (m.homeStam - m.awayStam) / Math.max(1, m.homeFighter.stamMax);
  var ratingDiff = (m.homeRating - m.awayRating) / 400;
  var base = 1 / (1 + Math.pow(10, -ratingDiff));
  var prog = m.minute / Math.max(1, m.maxMinute);
  var pH = base + hpDiff * 0.4 + stamDiff * 0.15;
  pH = clamp(pH, 0.05, 0.95);
  pH = 0.5 + (pH - 0.5) * (1 - prog * 0.3);
  return clamp(pH, 0.05, 0.95);
}

function computeUFCOdds(m){
  if(m.status === 'finished' || m.status === 'countdown') return {home:null, draw:null, away:null};
  var pH = ufcProbHome(m);
  return {home: toOdd(pH, 0.05), away: toOdd(1-pH, 0.05), draw: null};
}

function computeUFCExtras(m){
  if(m.status === 'finished' || m.status === 'countdown') return {};
  var out = {};
  function add(l, p, mar){ var o = toOdd(p, mar||0.05); if(o!==null) out[l]=o; }
  var pH = ufcProbHome(m);
  var pA = 1 - pH;

  var secLeftInRound = UFC_ROUND_SEC - m.roundSec;
  var isBreak = m.phase === 'break';
  var roundsPlayed = (m.round - 1) + (m.roundSec / UFC_ROUND_SEC);
  var rp = isBreak ? m.round : roundsPlayed;

  // Шанс финиша до конца боя
  var pFinishFuture = 0;
  var perRound = 0.25;
  for(var r=m.round; r<=UFC_MAX_ROUNDS; r++){
    var hazard = perRound;
    if(r === m.round) hazard = perRound * (secLeftInRound / UFC_ROUND_SEC);
    if(m.homeHP < 30 || m.awayHP < 30) hazard *= 1.8;
    if(m.homeHP < 15 || m.awayHP < 15) hazard *= 2.5;
    pFinishFuture = pFinishFuture + (1 - pFinishFuture) * hazard;
  }
  pFinishFuture = clamp(pFinishFuture, 0.05, 0.85);
  var pDec = 1 - pFinishFuture;
  var pKO = pFinishFuture * 0.6;
  var pSub = pFinishFuture * 0.4;

  add('KO/TKO', pKO, 0.06);
  add('Сабмишн', pSub, 0.06);
  add('Решение', pDec, 0.05);
  add('Бой досрочно', pFinishFuture, 0.05);
  add('Вся дистанция', pDec, 0.05);

  // Тоталы раундов — только пока линия не пройдена
  if(rp < 0.5){
    add('ТБ 0.5 раундов', 0.98, 0.02);
    add('ТМ 0.5 раундов', 0.02, 0.02);
  }
  if(rp < 1.5){
    var pO15 = clamp(1 - pFinishFuture * 0.15, 0.1, 0.95);
    add('ТБ 1.5 раундов', pO15, 0.05);
    add('ТМ 1.5 раундов', 1-pO15, 0.05);
  }
  if(rp < 2.5){
    var pO25 = clamp(1 - pFinishFuture * 0.5, 0.1, 0.95);
    add('ТБ 2.5 раундов', pO25, 0.05);
    add('ТМ 2.5 раундов', 1-pO25, 0.05);
  }
  if(rp < 3.5){
    var pO35 = clamp(1 - pFinishFuture * 0.7, 0.08, 0.95);
    add('ТБ 3.5 раундов', pO35, 0.05);
    add('ТМ 3.5 раундов', 1-pO35, 0.05);
  }
  if(rp < 4.5 && m.round >= 4){
    var pO45 = clamp(1 - pFinishFuture, 0.08, 0.95);
    add('ТБ 4.5 раундов', pO45, 0.05);
    add('ТМ 4.5 раундов', 1-pO45, 0.05);
  }

  // Победа в текущем раунде
  if(m.round <= UFC_MAX_ROUNDS && !isBreak){
    var pWinH = pH * pFinishFuture * (secLeftInRound / UFC_ROUND_SEC) * 1.5;
    var pWinA = pA * pFinishFuture * (secLeftInRound / UFC_ROUND_SEC) * 1.5;
    if(pWinH + pWinA > 0.05){
      add('Победа в R' + m.round + ' · ' + m.home, pWinH, 0.08);
      add('Победа в R' + m.round + ' · ' + m.away, pWinA, 0.08);
    }
  }

  // Метод + победитель
  add(m.home + ' KO/TKO', pH * pKO * 0.9, 0.08);
  add(m.home + ' Сабмишн', pH * pSub * 0.9, 0.08);
  add(m.home + ' Решение', pH * pDec * 0.9, 0.08);
  add(m.away + ' KO/TKO', pA * pKO * 0.9, 0.08);
  add(m.away + ' Сабмишн', pA * pSub * 0.9, 0.08);
  add(m.away + ' Решение', pA * pDec * 0.9, 0.08);

  return out;
}

/* ============================================================
   ВОЛЕЙБОЛ — посекундная симуляция, подача/приём/блок, setHistory
   ============================================================ */
function newVolleyball(){
  var pair = pickTwo(VOLLEYBALL);
  var h = pair[0], a = pair[1];
  return {
    id: nextId++, sport:'volleyball', league:h.lg,
    home:h.n, away:a.n,
    homeAtk:h.atk, awayAtk:a.atk,
    homeServe:h.serve, awayServe:a.serve,
    homeBlock:h.block, awayBlock:a.block,
    homeRating:h.rt, awayRating:a.rt,
    homeCountry:h.country, awayCountry:a.country,
    setsHome:0, setsAway:0, pointsHome:0, pointsAway:0,
    setHistory:[],
    roundSec:0,
    minute:0, maxMinute:2400,
    serving:'home',
    timeoutHomeUsed:false, timeoutAwayUsed:false,
    status:'live', momentum:0, justScored:null,
    commentary:'Матч начинается. Подача у ' + h.n
  };
}

function simulateVolleyballTick(m){
  m.roundSec += 1;
  m.minute += 1;
  if(m.roundSec < 5) return;
  m.roundSec = 0;

  var isFifth = (m.setsHome === 2 && m.setsAway === 2);
  var target = isFifth ? 15 : 25;

  var pHome;
  if(m.serving === 'home'){
    pHome = 0.5 + (m.homeServe - 1) * 0.18 - (m.awayBlock - 1) * 0.10;
  } else {
    pHome = 0.5 - (m.awayServe - 1) * 0.18 + (m.homeBlock - 1) * 0.10;
  }
  pHome = clamp(pHome, 0.30, 0.70);

  if(Math.random() < pHome){
    m.pointsHome++;
    m.serving = 'home';
  } else {
    m.pointsAway++;
    m.serving = 'away';
  }

  if(!m.timeoutHomeUsed && m.pointsAway - m.pointsHome >= 8 && (m.setsHome + m.setsAway) < 3){
    m.timeoutHomeUsed = true;
    m.commentary = '⏸ Тайм-аут ' + m.home;
  }
  if(!m.timeoutAwayUsed && m.pointsHome - m.pointsAway >= 8 && (m.setsHome + m.setsAway) < 3){
    m.timeoutAwayUsed = true;
    m.commentary = '⏸ Тайм-аут ' + m.away;
  }

  if(m.pointsHome >= target && m.pointsHome - m.pointsAway >= 2){
    m.setsHome++;
    m.setHistory.push({winner:'home', h:m.pointsHome, a:m.pointsAway});
    m.justScored = 'home';
    m.commentary = '🎯 ' + m.home + ' берёт сет ' + m.pointsHome + ':' + m.pointsAway;
    m.pointsHome = 0; m.pointsAway = 0;
    m.timeoutHomeUsed = false; m.timeoutAwayUsed = false;
  } else if(m.pointsAway >= target && m.pointsAway - m.pointsHome >= 2){
    m.setsAway++;
    m.setHistory.push({winner:'away', h:m.pointsHome, a:m.pointsAway});
    m.justScored = 'away';
    m.commentary = '🎯 ' + m.away + ' берёт сет ' + m.pointsHome + ':' + m.pointsAway;
    m.pointsHome = 0; m.pointsAway = 0;
    m.timeoutHomeUsed = false; m.timeoutAwayUsed = false;
  }

  if(m.setsHome >= 3 || m.setsAway >= 3){
    m.status = 'finished';
    m.finishedAt = Date.now();
    m.commentary = '🏆 ' + (m.setsHome > m.setsAway ? m.home : m.away) + ' побеждает ' + m.setsHome + ':' + m.setsAway;
  }
}

function volleyProbHome(m){
  if(m.status === 'finished') return m.setsHome > m.setsAway ? 1 : 0;
  if(m.status === 'countdown') return 0.5;
  var d = (m.homeAtk - m.awayAtk) * 0.18 + (m.homeServe - m.awayServe) * 0.08 - (m.homeBlock - m.awayBlock) * 0.05;
  var base = clamp(0.5 + d, 0.15, 0.85);
  var isFifth = (m.setsHome === 2 && m.setsAway === 2);
  var target = isFifth ? 15 : 25;
  var curScore = (m.pointsHome - m.pointsAway) / target;
  var setScore = m.setsHome - m.setsAway;
  var pH = base + curScore * 0.15 + setScore * 0.10;
  var remainPoints = target - Math.max(m.pointsHome, m.pointsAway);
  if(remainPoints < 5){
    pH += (m.pointsHome - m.pointsAway) * 0.04;
  }
  return clamp(pH, 0.05, 0.95);
}

function computeVolleyballOdds(m){
  if(m.status === 'finished' || m.status === 'countdown') return {home:null, draw:null, away:null};
  var pH = volleyProbHome(m);
  return {home: toOdd(pH, 0.05), away: toOdd(1-pH, 0.05), draw: null};
}

function computeVolleyballExtras(m){
  if(m.status === 'finished' || m.status === 'countdown') return {};
  var out = {};
  function add(l, p, mar){ var o = toOdd(p, mar||0.05); if(o!==null) out[l]=o; }
  var pH = volleyProbHome(m);
  var pA = 1 - pH;

  var setsPlayed = m.setsHome + m.setsAway;
  if(setsPlayed < 5){
    var pHomeSet = clamp(0.5 + (m.homeAtk - m.awayAtk) * 0.18, 0.3, 0.7);
    var cnt = {3:0, 4:0, 5:0};
    for(var t=0; t<200; t++){
      var sh = m.setsHome, sa = m.setsAway, g = 0;
      while(sh < 3 && sa < 3 && g++ < 10){
        if(Math.random() < pHomeSet) sh++; else sa++;
      }
      var total = sh + sa;
      if(total <= 3) cnt[3]++;
      else if(total === 4) cnt[4]++;
      else cnt[5]++;
    }
    var p3 = cnt[3]/200, p4 = cnt[4]/200, p5 = cnt[5]/200;
    if(p3 > 0.02){ add('ТМ 3.5 сетов', p3, 0.06); add('ТБ 3.5 сетов', p4+p5, 0.06); }
    if(p5 > 0.02){ add('ТБ 4.5 сетов', p5, 0.06); add('ТМ 4.5 сетов', p3+p4, 0.06); }
  }

  var curTotal = m.pointsHome + m.pointsAway;
  var isFifth = (m.setsHome === 2 && m.setsAway === 2);
  var target = isFifth ? 15 : 25;
  var expectedFinish = target * 2 - 3;
  var lines = isFifth ? [24.5, 26.5, 28.5] : [44.5, 46.5, 48.5];
  lines.forEach(function(line){
    if(curTotal < line){
      var pOver = clamp(0.5 + (expectedFinish - line) * 0.06, 0.15, 0.85);
      add('ТБ ' + line + ' (сет)', pOver, 0.07);
      add('ТМ ' + line + ' (сет)', 1-pOver, 0.07);
    }
  });

  add('Победа в сете · П1', pH, 0.06);
  add('Победа в сете · П2', pA, 0.06);

  if(setsPlayed < 5){
    add('Счёт 3:0', 0.15, 0.10);
    add('Счёт 3:1', 0.20, 0.10);
    add('Счёт 3:2', 0.15, 0.10);
    add('Счёт 0:3', 0.15, 0.10);
    add('Счёт 1:3', 0.20, 0.10);
    add('Счёт 2:3', 0.15, 0.10);
  }

  if(m.setsHome === 0 && m.setsAway === 0){
    add('Обе возьмут сет · Да', 0.88, 0.06);
    add('Обе возьмут сет · Нет', 0.12, 0.06);
  }

  return out;
}
/* ============ УНИВЕРСАЛЬНЫЕ ОБЁРТКИ ============ */
function computeOdds(m){
  if(m.sport==='football') return computeFootballOdds(m);
  if(m.sport==='hockey') return computeHockeyOdds(m);
  if(m.sport==='volleyball') return computeVolleyballOdds(m);
  if(m.sport==='ufc') return computeUFCOdds(m);
  return {home:null, draw:null, away:null};
}
function computeExtras(m){
  if(m.sport==='football') return computeFootballExtras(m);
  if(m.sport==='hockey') return computeHockeyExtras(m);
  if(m.sport==='volleyball') return computeVolleyballExtras(m);
  if(m.sport==='ufc') return computeUFCExtras(m);
  return {};
}

function tickMatch(m){
  if(m.status==='countdown'){
    m.countdownLeft -= 1;
    if(m.countdownLeft <= 0){
      var nm;
      if(m.sport==='football') nm=newFootball();
      else if(m.sport==='hockey') nm=newHockey();
      else if(m.sport==='volleyball') nm=newVolleyball();
      else nm=newUFC();
      nm.id = m.id;
      for(var k in m) delete m[k];
      for(var k2 in nm) m[k2]=nm[k2];
    }
    return;
  }
  if(m.status!=='live') return;
  if(m.sport==='football'){ simulateFootballTick(m); return; }
  if(m.sport==='hockey'){ simulateHockeyTick(m); return; }
  if(m.sport==='volleyball'){ simulateVolleyballTick(m); return; }
  if(m.sport==='ufc'){ simulateUFCTick(m); return; }
}

function createBatch(){
  matches = [];
  nextId = 1;
  for(var i=0;i<4;i++) matches.push(newFootball());
  for(var j=0;j<2;j++) matches.push(newHockey());
  for(var k=0;k<2;k++) matches.push(newVolleyball());
  for(var l=0;l<2;l++) matches.push(newUFC());
  for(var m=matches.length-1;m>0;m--){
    var r=Math.floor(Math.random()*(m+1));
    var tmp=matches[m]; matches[m]=matches[r]; matches[r]=tmp;
  }
}

/* ============ РЕНДЕР ПРОГРЕССА / ИНФО / РЕЗУЛЬТАТА ============ */
function renderProgress(m){
  if(m.status==='countdown') return '';
  if(m.sport==='football'){
    var h1 = Math.min(1, m.minute / 45);
    var h2 = Math.max(0, Math.min(1, (m.minute - 45) / 45));
    return '<div class="progress"><div class="progress-seg '+(h1>=1?'done':'active')+'" style="--p:'+(h1*100)+'%"></div><div class="progress-seg '+(h2>=1?'done':'active')+'" style="--p:'+(h2*100)+'%"></div></div>';
  }
  return '';
}

function sportInfoText(m){
  if(m.sport==='football'){
    if(m.isBreak) return '<span style="color:var(--accent-2);font-weight:800">⏸ Перерыв · '+Math.max(0, FT_BREAK_SEC - m.breakTimer)+'с</span>';
    var half = m.minute < 45 ? '1-й тайм' : '2-й тайм';
    var mins = Math.floor(m.minute);
    return '<span>'+half+'</span> · <span class="time">'+mins+"'</span>";
  }
  return '';
}

function matchPhaseBadge(m){
  if(m.status !== 'live' || m.sport !== 'football') return '';
  var p = m.phase;
  if(p === 'chaos') return '<span class="match-phase chaos">⚡ Хаос</span>';
  if(p === 'pressure_home') return '<span class="match-phase pressure">🔥 '+m.home+'</span>';
  if(p === 'pressure_away') return '<span class="match-phase pressure">🔥 '+m.away+'</span>';
  if(p === 'endgame') return '<span class="match-phase chaos">⏱ Финал</span>';
  return '<span class="match-phase">Спокойно</span>';
}

function renderCard(m){
  var odds = computeOdds(m);
  var isFin = m.status==='finished';
  var isCd = m.status==='countdown';
  var extras = (!isFin && !isCd) ? computeExtras(m) : {};
  var keys = Object.keys(extras);
  var isOpen = openExtras.has(m.id);
  var isExpanded = expandedMatches.has(m.id) || isFin || isCd || m.sport !== 'football';

  var extrasH = keys.length ? (
    '<div class="extras">'+
    '<button class="extras-toggle '+(isOpen?'open':'')+'" data-extras="'+m.id+'">'+
    (isOpen?'▲ Скрыть':'▼ Ещё '+keys.length+' рынков')+
    '</button>'+

function renderOddBtn(m,pk,l,v,dis){
  if(!isValid(v)) return '<div class="odd-btn disabled"><span class="odd-label">'+l+'</span><span class="odd-value" style="color:var(--muted)">—</span></div>';
  var k=m.id+'-'+pk;
  var prev=prevOdds[k];
  var cls='';
  if(prev!==undefined && Math.abs(prev-v)>0.001) cls = v>prev?'up':'down';
  prevOdds[k]=v;
  return '<button class="odd-btn '+cls+'" data-match-id="'+m.id+'" data-pick="'+pk+'" data-odd="'+v+'" '+(dis?'disabled':'')+'><span class="odd-label">'+l+'</span><span class="odd-value">'+v.toFixed(2)+'</span></button>';
}

function renderMatches(){
  var list = matches.slice();
  if(currentSport!=='all') list = list.filter(function(m){ return m.sport===currentSport; });
  list.sort(function(a,b){
    var ord={live:0,countdown:1,finished:2};
    if(ord[a.status]!==ord[b.status]) return ord[a.status]-ord[b.status];
    var so={ufc:0,football:1,hockey:2,volleyball:3};
    if(a.sport!==b.sport) return (so[a.sport]||9)-(so[b.sport]||9);
    return a.minute-b.minute;
  });
  var el=$('matches');
  if(!list.length){
    el.innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="empty-icon">🎯</div><div class="empty-text">Матчей нет</div></div>';
    return;
  }
  var html='';
  for(var i=0;i<list.length;i++){
    try{ html += renderCard(list[i]); }
    catch(e){ console.error('card err', e); html += '<div class="match" style="padding:20px;color:var(--red)">Ошибка #'+list[i].id+'</div>'; }
  }
  el.innerHTML = html;
}

      '<div class="history-foot"><div class="history-odd">Кэф <b>'+b.odd.toFixed(2)+'</b> · потенц. <b>'+fmt(b.potential)+' ₽</b></div><div class="history-status '+b.status+'">'+(b.status==='won'?'+'+fmt(b.payout):b.status==='lost'?'-'+fmt(b.stake):'ожидание')+'</div></div>'+

function renderStats(){
  var won=0, lost=0, pend=0;
  for(var i=0;i<wallet.bets.length;i++){
    if(wallet.bets[i].status==='won') won++;
    else if(wallet.bets[i].status==='lost') lost++;

  }
  var t=won+lost;
  var wr = t ? ((won/t)*100).toFixed(1) : '0.0';
  var prof = wallet.totalWon - wallet.totalBet;

  $('statsGrid').innerHTML =
    '<div class="stat-card"><div class="stat-label">Баланс</div><div class="stat-value gold">'+fmt(wallet.balance)+' ₽</div></div>'+
    '<div class="stat-card"><div class="stat-label">Поставлено</div><div class="stat-value">'+fmt(wallet.totalBet)+' ₽</div></div>'+
    '<div class="stat-card"><div class="stat-label">Выиграно</div><div class="stat-value green">'+fmt(wallet.totalWon)+' ₽</div></div>'+
    '<div class="stat-card"><div class="stat-label">Профит</div><div class="stat-value '+(prof>=0?'green':'red')+'">'+(prof>=0?'+':'')+fmt(prof)+' ₽</div></div>'+

function drawChart(){
  var c=$('profitChart'); if(!c) return;
  var ctx=c.getContext('2d');
  var dpr=window.devicePixelRatio||1;
  var r=c.getBoundingClientRect();
  c.width=r.width*dpr; c.height=r.height*dpr;
  ctx.scale(dpr,dpr);
  var w=r.width,h=r.height;
  ctx.clearRect(0,0,w,h);
  var hist = wallet.profitHistory;
  if(!hist || hist.length<2){
    ctx.fillStyle='#5a5a80';
    ctx.font='13px sans-serif';
    ctx.textAlign='center';
    ctx.fillText('Играй — график появится', w/2, h/2);
    return;
  }
  var min=Math.min.apply(null,hist.map(function(p){return p.v;}).concat([0]));
  var max=Math.max.apply(null,hist.map(function(p){return p.v;}).concat([0]));
  var range=max-min||1;
  ctx.strokeStyle='rgba(110,110,140,.1)';
  for(var i=0;i<=4;i++){ var y=(h/4)*i; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
  var step=w/(hist.length-1);
  var grad=ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,'rgba(124,92,255,.35)');
  grad.addColorStop(1,'rgba(124,92,255,0)');
  ctx.beginPath();
  hist.forEach(function(p,i){
    var x=i*step;
    var yy=h-((p.v-min)/range)*h*0.85-h*0.075;
    if(i===0) ctx.moveTo(x,yy); else ctx.lineTo(x,yy);
  });
  ctx.strokeStyle='#7c5cff';
  ctx.lineWidth=2.5;
  ctx.stroke();
  ctx.lineTo(w,h); ctx.lineTo(0,h); ctx.closePath();
  ctx.fillStyle=grad; ctx.fill();
}
