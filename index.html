<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b0e12">
<title>LIVEZONE — Live Sports Simulator</title>
<style>
/* === ЧАСТЬ 1: CSS БАЗА === */

:root{
  --bg:#0b0e12;
  --bg-2:#0f141b;
  --p:#141a22;
  --p2:#1a212b;
  --p3:#222b37;
  --p4:#2a3344;
  --bd:#232a35;
  --bd2:#2f3743;
  --bd3:#3a4353;
  --t:#eef2f8;
  --t2:#a9b4c3;
  --t3:#7a8595;
  --muted:#5a6474;
  --muted2:#3f4858;
  --g:#d4af5c;
  --g2:#e8c877;
  --g3:#f2dc9c;
  --gd:rgba(212,175,92,.12);
  --glow:rgba(212,175,92,.3);
  --gr:#4fb482;
  --gr2:#6ed09a;
  --grd:rgba(79,180,130,.14);
  --r:#d35a68;
  --r2:#e87a88;
  --rd:rgba(211,90,104,.14);
  --lv:#e04a56;
  --lvd:rgba(224,74,86,.14);
  --bl:#5c94dd;
  --bld:rgba(92,148,221,.14);
  --pu:#9b6dff;
  --r14:14px;
  --r10:10px;
  --r8:8px;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);
  color:var(--t);
  min-height:100vh;
  padding-bottom:96px;
  font-size:14px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;
}
body.no-scroll{overflow:hidden;}

::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:6px;}
::-webkit-scrollbar-thumb:hover{background:var(--bd3);}

button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit;}
input,select,textarea{font-family:inherit;}
a{color:inherit;text-decoration:none;}
img,svg{display:block;max-width:100%;}

/* АНИМАЦИИ */
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.35;}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.5;transform:scale(.85);}}
@keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
@keyframes slideUp{from{transform:translateY(40px);opacity:0;}to{transform:translateY(0);opacity:1;}}
@keyframes slideDown{from{transform:translateY(-10px);opacity:0;}to{transform:translateY(0);opacity:1;}}
@keyframes flashUp{0%{color:#6ede9b;transform:scale(1.15);}60%{color:#6ede9b;transform:scale(1.02);}100%{color:var(--t);transform:scale(1);}}
@keyframes flashDown{0%{color:#e87b88;transform:scale(1.15);}60%{color:#e87b88;transform:scale(1.02);}100%{color:var(--t);transform:scale(1);}}
@keyframes evIn{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
@keyframes goalIn{from{opacity:0;}to{opacity:1;}}
@keyframes goalScale{0%{transform:scale(.4) rotate(-6deg);opacity:0;}60%{transform:scale(1.1) rotate(2deg);opacity:1;}100%{transform:scale(1) rotate(0);opacity:1;}}
@keyframes lmPulse{0%{transform:scale(.98);box-shadow:0 0 0 0 var(--glow);}50%{box-shadow:0 0 0 14px rgba(212,175,92,0);}100%{transform:scale(1);}}
@keyframes progressGlow{0%,100%{opacity:1;}50%{opacity:.7;}}

/* ХЕЛПЕРЫ */
.hidden{display:none!important;}
.flex{display:flex;}
.center{text-align:center;}
.no-scroll{overflow:hidden;}

/* HEADER */
.hdr{
  position:sticky;top:0;z-index:200;
  background:rgba(11,14,18,.94);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--bd);
}
.hdr-inner{
  display:flex;align-items:center;gap:12px;
  padding:12px 16px 10px;
}
.brand{
  display:flex;align-items:center;gap:8px;
  font-size:17px;font-weight:900;letter-spacing:1.4px;
  color:var(--g);flex-shrink:0;
  user-select:none;
}
.brand-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--g);
  box-shadow:0 0 10px var(--glow);
  animation:pulse 2s infinite;
}
.brand i{font-style:normal;color:var(--t);font-weight:600;letter-spacing:.8px;}

.hdr-nav{
  display:flex;align-items:center;gap:2px;
  flex:1;overflow-x:auto;scrollbar-width:none;padding:2px 0;
  min-width:0;
}
.hdr-nav::-webkit-scrollbar{display:none;}
.hdr-nav button{
  flex-shrink:0;
  padding:7px 12px;border-radius:8px;
  font-size:13px;font-weight:600;
  color:var(--t3);
  transition:background .15s,color .15s;
  white-space:nowrap;
}
.hdr-nav button:hover{color:var(--t2);background:var(--p);}
.hdr-nav button.on{color:var(--t);background:var(--p2);}

.hdr-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;}

.icon-btn{
  width:34px;height:34px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  background:var(--p);border:1px solid var(--bd);
  color:var(--t3);font-size:15px;
  transition:all .15s;
}
.icon-btn:hover{color:var(--g);border-color:var(--gd);background:var(--p2);}
.icon-btn:active{transform:scale(.95);}
.icon-btn.on{color:var(--g);border-color:var(--gd);background:var(--gd);}

.balance{
  display:flex;align-items:center;gap:6px;
  background:var(--p2);border:1px solid var(--bd);
  padding:7px 12px;border-radius:9px;
  font-size:13px;font-weight:600;
  cursor:pointer;transition:all .15s;
  white-space:nowrap;
}
.balance:hover{border-color:var(--gd);}
.balance:active{transform:scale(.98);}
.balance b{color:var(--g2);font-weight:800;}
.balance::before{content:"₽";color:var(--t3);font-weight:700;font-size:12px;}

/* FILTER BAR */
.fbar{
  display:flex;gap:6px;
  padding:0 16px 12px;
  overflow-x:auto;scrollbar-width:none;
}
.fbar::-webkit-scrollbar{display:none;}
.fchip{
  flex-shrink:0;
  padding:7px 14px;border-radius:9px;
  background:transparent;border:1px solid var(--bd);
  font-size:12.5px;font-weight:600;
  color:var(--t3);transition:all .15s;
  white-space:nowrap;
}
.fchip:hover{color:var(--t2);border-color:var(--bd2);}
.fchip:active{transform:scale(.97);}
.fchip.on{
  background:var(--gd);border-color:rgba(212,175,92,.4);
  color:var(--g2);font-weight:700;
}
.fchip.live-dot::before{
  content:"";display:inline-block;
  width:6px;height:6px;border-radius:50%;
  background:var(--lv);margin-right:6px;vertical-align:middle;
  animation:blink 1.4s infinite;
}
.fbar-divider{
  width:1px;background:var(--bd);margin:0 4px;flex-shrink:0;
}

/* PAGE */
.page{
  padding:14px 16px 24px;
  max-width:1280px;margin:0 auto;width:100%;
}
.section-head{
  display:flex;align-items:center;justify-content:space-between;
  margin:22px 0 12px;gap:12px;
}
.section-head:first-child{margin-top:6px;}
.section-title{
  display:flex;align-items:center;gap:9px;
  font-size:15px;font-weight:800;color:var(--t);
  letter-spacing:.2px;
}
.section-title .dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--g);
  box-shadow:0 0 8px var(--glow);
}
.section-title .count{
  font-size:12px;font-weight:600;color:var(--muted);
  margin-left:4px;
}
.section-more{
  font-size:12.5px;font-weight:600;color:var(--g2);
  cursor:pointer;transition:color .15s;
}
.section-more:hover{color:var(--g3);}

/* SEARCH */
.search-bar{
  padding:12px 16px 0;
  max-width:1280px;margin:0 auto;width:100%;
}
.search-input{
  width:100%;
  background:var(--p);border:1px solid var(--bd);
  border-radius:var(--r10);
  padding:11px 16px;
  color:var(--t);font-size:14px;
  transition:all .15s;
}
.search-input:focus{
  outline:none;border-color:var(--bd2);
  background:var(--p2);
}
.search-input::placeholder{color:var(--t3);}

/* SKELETON */
.skel{
  background:linear-gradient(90deg,var(--p) 0%,var(--p2) 50%,var(--p) 100%);
  background-size:200% 100%;
  animation:shimmer 1.5s infinite;
  border-radius:var(--r14);
}
.skel-card{height:105px;margin-bottom:9px;}
.skel-live{width:255px;height:130px;flex-shrink:0;}

/* EMPTY */
.empty{
  text-align:center;color:var(--muted);
  padding:60px 20px;
}
.empty .em{font-size:42px;display:block;margin-bottom:14px;opacity:.4;}
.empty .tt{font-size:15px;color:var(--t2);font-weight:700;margin-bottom:6px;}
.empty .sb{font-size:12.5px;color:var(--t3);}

/* TOAST */
.toast{
  position:fixed;top:80px;left:50%;
  transform:translateX(-50%) translateY(-16px);
  background:var(--p2);
  border:1px solid var(--bd2);
  color:var(--t);
  padding:12px 20px;border-radius:var(--r10);
  font-size:13px;font-weight:600;
  z-index:400;
  box-shadow:0 8px 32px rgba(0,0,0,.55);
  opacity:0;pointer-events:none;
  transition:all .3s;
  max-width:90vw;text-align:center;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.ok{border-color:rgba(79,180,130,.4);color:var(--gr2);}
.toast.err{border-color:rgba(211,90,104,.4);color:var(--r2);}
.toast.inf{border-color:rgba(92,148,221,.4);color:#8fb7e0;}

/* GOAL OVERLAY */
.goal-overlay{
  position:fixed;inset:0;z-index:500;
  background:rgba(11,14,18,.88);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  display:none;align-items:center;justify-content:center;
  pointer-events:none;
}
.goal-overlay.on{display:flex;animation:goalIn .35s ease-out;}
.goal-text{
  font-size:72px;font-weight:900;
  color:var(--g);
  letter-spacing:6px;
  text-shadow:0 0 40px var(--glow),0 8px 40px rgba(0,0,0,.8);
  animation:goalScale .6s cubic-bezier(.34,1.56,.64,1);
  text-align:center;line-height:1;
}
.goal-text small{
  display:block;font-size:16px;font-weight:700;
  color:var(--t2);letter-spacing:4px;
  margin-top:14px;text-shadow:none;
}

/* BOTTOM NAV */
.bnav{
  position:fixed;bottom:0;left:0;right:0;
  z-index:220;
  background:rgba(16,19,25,.96);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--bd);
  display:flex;
  padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));
}
.bnav-item{
  flex:1;display:flex;flex-direction:column;
  align-items:center;gap:3px;
  color:var(--muted);font-size:10px;
  font-weight:600;padding:6px 0;
  cursor:pointer;transition:all .15s;
  position:relative;
}
.bnav-item .ic{font-size:19px;line-height:1;opacity:.75;}
.bnav-item.on{color:var(--g2);}
.bnav-item.on .ic{opacity:1;}
.bnav-item:hover{color:var(--t2);}
.bnav-bdg{
  position:absolute;top:2px;right:calc(50% - 22px);
  background:var(--lv);color:#fff;
  font-size:9px;font-weight:800;
  min-width:15px;height:15px;padding:0 4px;
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
}

/* RESPONSIVE */
@media (max-width:640px){
  .hdr-inner{padding:10px 14px 8px;}
  .brand{font-size:15px;letter-spacing:1.1px;}
  .hdr-nav{display:none;}
  .page{padding:12px 14px 24px;}
  .fbar{padding:0 14px 10px;}
  .balance{padding:6px 10px;font-size:12px;}
  .goal-text{font-size:52px;letter-spacing:4px;}
  .goal-text small{font-size:13px;letter-spacing:2px;}
}
@media (min-width:641px){
  .bnav{display:none;}
  body{padding-bottom:24px;}
}
/* === КОНЕЦ ЧАСТИ 1 === */
  /* === ЧАСТЬ 2: CSS ГЛАВНАЯ + КАРТОЧКИ === */

/* LIVE STRIP */
.live-strip{
  display:flex;gap:10px;
  overflow-x:auto;scrollbar-width:none;
  margin:0 -16px;padding:0 16px 6px;
}
.live-strip::-webkit-scrollbar{display:none;}

.live-card{
  flex-shrink:0;width:260px;
  background:var(--p);
  border:1px solid var(--bd);
  border-radius:var(--r14);
  padding:12px 14px;
  cursor:pointer;
  transition:all .18s;
  position:relative;overflow:hidden;
}
.live-card::before{
  content:"";position:absolute;
  left:0;top:0;bottom:0;width:3px;
  background:var(--lv);
  box-shadow:0 0 10px rgba(224,74,86,.4);
}
.live-card:hover{
  border-color:var(--bd3);
  transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(0,0,0,.35);
}
.live-card:active{transform:translateY(0);}

.live-card-top{
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;margin-bottom:10px;
}
.live-tag{
  display:flex;align-items:center;gap:5px;
  font-size:10.5px;font-weight:800;letter-spacing:.6px;
  color:var(--lv);text-transform:uppercase;
}
.live-tag::before{
  content:"";width:5px;height:5px;border-radius:50%;
  background:var(--lv);animation:blink 1.4s infinite;
}
.live-time{
  font-size:11.5px;font-weight:700;
  color:var(--t2);
  font-variant-numeric:tabular-nums;
  letter-spacing:.3px;
}

.live-teams{
  display:flex;flex-direction:column;gap:6px;
  margin-bottom:10px;
}
.live-team{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;font-size:13px;font-weight:700;
}
.live-team .logo-s{
  width:22px;height:22px;border-radius:6px;
  background:var(--p3);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  overflow:hidden;
}
.live-team .logo-s svg{width:100%;height:100%;}
.live-team span{
  flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--t2);
}
.live-team b{
  font-size:17px;font-weight:800;color:var(--t);
  font-variant-numeric:tabular-nums;
  min-width:22px;text-align:center;
}

.live-card-btn{
  display:block;width:100%;
  text-align:center;
  padding:7px;border-radius:8px;
  background:var(--gd);
  border:1px solid rgba(212,175,92,.3);
  color:var(--g2);
  font-size:11.5px;font-weight:700;
  transition:all .15s;
}
.live-card:hover .live-card-btn{background:rgba(212,175,92,.2);}

/* MATCH CARD */
.mc{
  background:var(--p);
  border:1px solid var(--bd);
  border-radius:var(--r14);
  padding:13px 15px;
  margin-bottom:9px;
  cursor:pointer;
  transition:all .18s;
  position:relative;overflow:hidden;
}
.mc:hover{
  border-color:var(--bd3);
  background:var(--p2);
}
.mc:active{transform:scale(.99);}
.mc.live{border-color:rgba(224,74,86,.25);}
.mc.live::before{
  content:"";position:absolute;
  left:0;top:0;bottom:0;width:2px;
  background:var(--lv);
}
.mc.finished{opacity:.75;}

.mc-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;margin-bottom:11px;
}
.mc-league{
  display:flex;align-items:center;gap:7px;
  font-size:10.5px;font-weight:700;
  color:var(--t3);
  text-transform:uppercase;letter-spacing:.5px;
  min-width:0;overflow:hidden;
}
.mc-league .ic{font-size:13px;opacity:.85;flex-shrink:0;}
.mc-league span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.mc-status{
  display:flex;align-items:center;gap:5px;
  font-size:10.5px;font-weight:800;
  padding:4px 9px;border-radius:7px;
  background:var(--p3);color:var(--t3);
  white-space:nowrap;flex-shrink:0;
  text-transform:uppercase;letter-spacing:.5px;
  font-variant-numeric:tabular-nums;
}
.mc-status.live{
  background:var(--lvd);
  color:var(--r2);
}
.mc-status.live::before{
  content:"";width:5px;height:5px;border-radius:50%;
  background:var(--lv);
  animation:blink 1.4s infinite;
}
.mc-status.final{background:var(--p3);color:var(--muted);}

.mc-teams{
  display:flex;flex-direction:column;gap:7px;
  margin-bottom:10px;
}
.mc-team{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;
}
.mc-team-name{
  display:flex;align-items:center;gap:10px;
  flex:1;min-width:0;
  font-size:14px;font-weight:600;color:var(--t);
}
.mc-logo{
  width:28px;height:28px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;overflow:hidden;
  background:var(--p3);
  transition:all .2s;
}
.mc-logo svg{width:100%;height:100%;}
.mc-logo.win{box-shadow:0 0 12px var(--glow);}
.mc-logo.lose{opacity:.45;}
.mc-team-name span{
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.mc-score{
  font-size:18px;font-weight:800;color:var(--t);
  font-variant-numeric:tabular-nums;
  min-width:22px;text-align:center;
  transition:color .3s;
}
.mc-score.win{color:var(--g2);}
.mc-score.lose{color:var(--t3);}

.mc-info{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;
  padding-top:10px;
  border-top:1px solid var(--bd);
  font-size:11.5px;font-weight:600;color:var(--muted);
}
.mc-hint{
  display:flex;align-items:center;gap:5px;
  color:var(--g2);
}
.mc-hint::after{content:"→";}

/* PROGRESS BAR (у live карточек) */
.mc-progress{
  height:3px;border-radius:3px;
  background:var(--p3);
  overflow:hidden;margin-top:10px;
}
.mc-progress-bar{
  height:100%;
  background:linear-gradient(90deg,var(--lv),#eb8b94);
  border-radius:3px;
  transition:width .95s linear;
}

/* LIVE PULSE индикатор */
.mc-live-pulse{
  display:flex;align-items:center;gap:5px;
  font-size:11px;font-weight:700;
  color:var(--r2);
}
.mc-live-pulse::before{
  content:"";width:6px;height:6px;border-radius:50%;
  background:var(--lv);
  animation:pulse 1.4s infinite;
}

/* СЧЁТ БОЛЬШИМИ ЦИФРАМИ */
.mc-score-big{
  display:flex;align-items:center;justify-content:center;
  gap:12px;
  padding:8px 0;
}
.mc-score-big .num{
  font-size:22px;font-weight:900;color:#fff;
  font-variant-numeric:tabular-nums;
  min-width:32px;text-align:center;
}
.mc-score-big .sep{
  color:var(--muted);
  font-size:18px;
  font-weight:400;
}

/* БЕЙДЖИ */
.badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:2px 7px;border-radius:6px;
  font-size:10px;font-weight:800;
  letter-spacing:.3px;text-transform:uppercase;
}
.badge.live{background:var(--lvd);color:var(--r2);}
.badge.hot{background:rgba(255,140,66,.14);color:#ff8c42;}
.badge.new{background:var(--grd);color:var(--gr2);}
.badge.premium{background:var(--gd);color:var(--g2);}

/* ЗВЕЗДА (избранное) */
.mc-fav{
  position:absolute;top:13px;right:13px;
  width:28px;height:28px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  background:transparent;color:var(--muted);
  font-size:15px;
  transition:all .15s;
  z-index:2;
}
.mc-fav:hover{color:var(--g);background:var(--gd);}
.mc-fav.on{color:var(--g);}

/* HOVER EFFECT — линии */
.mc::after{
  content:"";position:absolute;
  top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--gd),transparent);
  opacity:0;transition:opacity .2s;
}
.mc:hover::after{opacity:1;}

/* ГРУППА МАТЧЕЙ ПО ЛИГЕ */
.league-group{
  margin-bottom:18px;
}
.league-header{
  display:flex;align-items:center;gap:8px;
  padding:8px 12px;
  background:var(--p);
  border:1px solid var(--bd);
  border-radius:var(--r10);
  margin-bottom:8px;
  font-size:12px;font-weight:800;
  color:var(--t2);
  text-transform:uppercase;
  letter-spacing:.4px;
}
.league-header .ic{font-size:15px;}
.league-header .count{
  margin-left:auto;
  font-size:11px;font-weight:600;
  color:var(--muted);
}

/* === КОНЕЦ ЧАСТИ 2 === */
  /* === ЧАСТЬ 3: CSS MATCH CENTER === */

.mcenter{
  position:fixed;inset:0;z-index:300;
  background:var(--bg);
  display:none;flex-direction:column;
  overflow-y:auto;
}
.mcenter.on{display:flex;}

/* HEADER MATCH CENTER */
.mch{
  position:sticky;top:0;z-index:10;
  background:rgba(11,14,18,.94);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--bd);
  padding:12px 16px;
  display:flex;align-items:center;gap:12px;
}
.mch-back{
  width:34px;height:34px;border-radius:9px;
  background:var(--p);border:1px solid var(--bd);
  color:var(--t2);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;flex-shrink:0;
  transition:all .15s;
}
.mch-back:hover{color:var(--g);border-color:var(--gd);}
.mch-back:active{transform:scale(.95);}

.mch-info{flex:1;min-width:0;}
.mch-title{
  font-size:14px;font-weight:800;
  color:var(--t);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.mch-sub{
  font-size:11px;font-weight:600;
  color:var(--t3);margin-top:2px;
  display:flex;align-items:center;gap:6px;
}
.mch-sub .live-dot{
  width:5px;height:5px;border-radius:50%;
  background:var(--lv);
  animation:blink 1.4s infinite;
}
.mch-actions{display:flex;gap:6px;flex-shrink:0;}
.mch-fav{
  width:34px;height:34px;border-radius:9px;
  background:var(--p);border:1px solid var(--bd);
  color:var(--t3);
  display:flex;align-items:center;justify-content:center;
  font-size:15px;transition:all .15s;
}
.mch-fav:hover{color:var(--g);border-color:var(--gd);}
.mch-fav.on{color:var(--g);background:var(--gd);border-color:var(--gd);}

/* SCOREBOARD */
.mcc-score{
  background:
    radial-gradient(circle at 50% 0%,rgba(212,175,92,.06),transparent 70%),
    var(--p);
  border-bottom:1px solid var(--bd);
  padding:20px 16px 16px;
  text-align:center;
  position:relative;
}
.mcc-lg{
  font-size:11px;font-weight:700;
  color:var(--t3);
  text-transform:uppercase;letter-spacing:.6px;
  margin-bottom:14px;
  display:flex;align-items:center;justify-content:center;
  gap:8px;
}
.mcc-lg .lt{
  color:var(--lv);font-weight:800;
  display:flex;align-items:center;gap:4px;
}
.mcc-lg .lt::before{
  content:"";width:5px;height:5px;border-radius:50%;
  background:var(--lv);animation:blink 1.4s infinite;
}

.mcc-main{
  display:flex;align-items:center;justify-content:center;
  gap:20px;margin-bottom:14px;
}
.mcc-side{
  flex:1;display:flex;flex-direction:column;
  align-items:center;gap:8px;
  max-width:140px;
}
.mcc-logo{
  width:56px;height:56px;border-radius:14px;
  background:var(--p3);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  transition:all .3s;
}
.mcc-logo svg{width:100%;height:100%;}
.mcc-nm{
  font-size:13px;font-weight:700;
  color:var(--t);
  text-align:center;line-height:1.25;
}
.mcc-num{
  display:flex;align-items:center;gap:8px;
  font-size:44px;font-weight:900;color:#fff;
  font-variant-numeric:tabular-nums;
  letter-spacing:-1.5px;
  text-shadow:0 2px 20px rgba(0,0,0,.4);
}
.mcc-num .sep{
  color:var(--muted);
  font-size:32px;font-weight:400;
}

/* CLOCK */
.mcc-clock{
  display:flex;align-items:center;justify-content:center;
  gap:10px;flex-wrap:wrap;
}
.mcc-clock-main{
  display:flex;align-items:center;gap:8px;
  background:var(--p2);
  border:1px solid var(--bd);
  border-radius:9px;
  padding:6px 14px;
  font-size:14px;font-weight:800;
  color:var(--t);
  font-variant-numeric:tabular-nums;
  letter-spacing:.4px;
}
.mcc-clock-main .live-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--lv);
  animation:blink 1.4s infinite;
}
.mcc-clock-sub{
  font-size:10.5px;font-weight:600;
  color:var(--muted);letter-spacing:.3px;
}

/* PROGRESS */
.mcc-prog{
  margin:14px auto 0;
  max-width:420px;height:3px;
  background:var(--p3);
  border-radius:3px;
  overflow:hidden;position:relative;
}
.mcc-prog-bar{
  height:100%;width:0;
  background:linear-gradient(90deg,var(--lv),#eb8b94);
  border-radius:3px;
  transition:width .95s linear;
}
.mcc-prog-mark{
  position:absolute;top:-2px;width:1px;height:7px;
  background:var(--muted2);
}

/* TABS */
.mcc-tabs{
  position:sticky;top:59px;z-index:9;
  display:flex;gap:2px;
  background:rgba(11,14,18,.96);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--bd);
  overflow-x:auto;scrollbar-width:none;
  padding:0 12px;
}
.mcc-tabs::-webkit-scrollbar{display:none;}
.mcc-tab{
  flex-shrink:0;
  padding:13px 14px;
  font-size:12.5px;font-weight:700;
  color:var(--t3);
  border-bottom:2px solid transparent;
  transition:all .15s;
  white-space:nowrap;
  letter-spacing:.3px;
  text-transform:uppercase;
}
.mcc-tab:hover{color:var(--t2);}
.mcc-tab.on{
  color:var(--g2);
  border-bottom-color:var(--g);
}

.mcc-body{
  flex:1;
  padding:16px;
  max-width:1280px;margin:0 auto;width:100%;
}
.mcc-pane{display:none;}
.mcc-pane.on{display:block;}

.mcc-overview{
  display:grid;
  grid-template-columns:1fr;
  gap:14px;
}
@media (min-width:980px){
  .mcc-overview{grid-template-columns:minmax(0,1fr) 340px;}
}

/* PITCH (поле) */
.pitch-wrap{
  background:var(--p);
  border:1px solid var(--bd);
  border-radius:var(--r14);
  padding:12px;
  position:relative;
  overflow:hidden;
}
.pitch-wrap::after{
  content:"";position:absolute;inset:0;
  pointer-events:none;
  background:radial-gradient(circle at 50% 0%,rgba(212,175,92,.04),transparent 70%);
}
.pitch-svg{
  width:100%;height:auto;display:block;
  border-radius:var(--r10);
  background:#0f2a1a;
  transition:background .3s;
}
.pitch-svg[data-sport="basketball"]{background:#3a2a1a;}
.pitch-svg[data-sport="hockey"]{background:#1a2a3a;}
.pitch-svg[data-sport="tennis"]{background:#1a3a2a;}
.pitch-svg[data-sport="mma"]{background:#1a0f0f;}
.pitch-svg[data-sport="cyber"]{background:#1a1a2a;}

/* PLAYER (на поле) */
.player-marker{
  transition:transform .3s linear;
  cursor:pointer;
}
.player-marker circle{
  transition:fill .3s,stroke .3s;
}
.player-marker text{
  pointer-events:none;
  user-select:none;
}

/* BALL */
.ball-marker{
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.5));
}

/* FEED */
.feed{
  background:var(--p);
  border:1px solid var(--bd);
  border-radius:var(--r14);
  display:flex;flex-direction:column;
  max-height:520px;
  overflow:hidden;
}
.feed-head{
  padding:12px 14px;
  border-bottom:1px solid var(--bd);
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;flex-shrink:0;
}
.feed-title{
  font-size:12px;font-weight:800;
  letter-spacing:.6px;text-transform:uppercase;
  color:var(--t2);
  display:flex;align-items:center;gap:8px;
}
.feed-title::before{
  content:"";width:5px;height:5px;border-radius:50%;
  background:var(--lv);
  animation:blink 1.4s infinite;
}
.feed-count{
  font-size:11px;color:var(--t3);font-weight:600;
}
.feed-body{
  overflow-y:auto;flex:1;
  padding:6px 0;
}
.feed-event{
  display:flex;gap:10px;
  padding:9px 14px;
  border-bottom:1px solid var(--bd);
  animation:evIn .35s cubic-bezier(.4,0,.2,1);
  font-size:12.5px;
  transition:background .2s;
}
.feed-event:hover{background:var(--p2);}
.feed-event:last-child{border-bottom:none;}
.feed-event.highlight{
  background:linear-gradient(90deg,rgba(212,175,92,.10),transparent 80%);
  border-left:2px solid var(--g);
}
.feed-event.highlight .feed-min{
  color:var(--r2);
  font-weight:900;
}
.feed-event.highlight .feed-ico{
  background:var(--lvd);
  color:var(--r2);
}
.feed-min{
  flex-shrink:0;width:48px;
  font-size:11px;font-weight:800;
  color:var(--g2);
  font-variant-numeric:tabular-nums;
  letter-spacing:.3px;
  padding-top:1px;
}
.feed-ico{
  flex-shrink:0;width:20px;height:20px;
  border-radius:50%;
  background:var(--p3);
  display:flex;align-items:center;justify-content:center;
  font-size:10.5px;
}
.feed-text{
  flex:1;min-width:0;
  color:var(--t2);
  line-height:1.4;
}
.feed-text b{color:var(--t);font-weight:700;}

/* LIVE MOMENT */
.live-moment{
  margin-top:14px;
  padding:18px;
  border-radius:var(--r14);
  background:
    radial-gradient(circle at 50% 0%,rgba(212,175,92,.15),transparent 70%),
    linear-gradient(135deg,var(--p2) 0%,var(--p) 100%);
  border:1px solid var(--bd2);
  position:relative;overflow:hidden;
  display:none;
}
.live-moment.on{
  display:block;
  animation:lmPulse 1.2s ease-out;
}
.lm-tag{
  font-size:10.5px;font-weight:800;
  color:var(--g2);
  letter-spacing:1.2px;text-transform:uppercase;
  margin-bottom:10px;
  display:flex;align-items:center;gap:6px;
}
.lm-tag::before{content:"🔥";font-size:13px;}
.lm-main{
  font-size:22px;font-weight:900;
  color:#fff;letter-spacing:-.4px;
  margin-bottom:6px;line-height:1.15;
}
.lm-sub{
  font-size:13px;font-weight:600;
  color:var(--t2);
}

/* MOMENTUM */
.momentum{
  margin-top:14px;
  padding:16px;
  border-radius:var(--r14);
  background:var(--p);
  border:1px solid var(--bd);
}
.mom-title{
  font-size:11.5px;font-weight:800;
  letter-spacing:.7px;text-transform:uppercase;
  color:var(--t3);margin-bottom:12px;
}
.mom-row{
  display:flex;align-items:center;gap:12px;
  margin-bottom:8px;font-size:12.5px;font-weight:600;
}
.mom-row:last-child{margin-bottom:0;}
.mom-row .name{
  width:90px;flex-shrink:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--t2);
}
.mom-bar{
  flex:1;height:8px;border-radius:4px;
  background:var(--p3);
  overflow:hidden;position:relative;
}
.mom-fill{
  height:100%;
  border-radius:4px;
  transition:width .5s ease-out;
}
.mom-fill.home{background:linear-gradient(90deg,var(--g),var(--g2));}
.mom-fill.away{background:linear-gradient(90deg,var(--bl),#7aabee);}
.mom-row .val{
  width:38px;flex-shrink:0;text-align:right;
  font-weight:800;font-variant-numeric:tabular-nums;
  color:var(--t);
}

/* STATS */
.stats-grid{
  display:flex;flex-direction:column;gap:2px;
}
.stat-row{
  display:grid;
  grid-template-columns:52px 1fr 52px;
  align-items:center;gap:12px;
  padding:11px 14px;
  background:var(--p);
  border:1px solid var(--bd);
  border-radius:var(--r10);
}
.stat-row + .stat-row{margin-top:-1px;border-radius:0;}
.stat-row:first-child{border-radius:var(--r10) var(--r10) 0 0;}
.stat-row:last-child{border-radius:0 0 var(--r10) var(--r10);}
.stat-val{
  font-size:14px;font-weight:800;color:var(--t);
  font-variant-numeric:tabular-nums;
  text-align:center;
}
.stat-val.dim{color:var(--t3);font-weight:600;}
.stat-name{
  font-size:11.5px;font-weight:600;
  color:var(--t3);text-align:center;
  text-transform:uppercase;letter-spacing:.5px;
}
.stat-bar{
  grid-column:1 / -1;
  display:flex;height:3px;border-radius:3px;
  background:var(--p3);overflow:hidden;
  margin-top:6px;
}
.stat-bar-home{background:var(--g);transition:width .4s;}
.stat-bar-away{background:var(--bl);transition:width .4s;margin-left:auto;}

/* LINEUPS */
.lineup{display:grid;grid-template-columns:1fr;gap:14px;}
@media (min-width:760px){.lineup{grid-template-columns:1fr 1fr;}}
.lineup-team{
  background:var(--p);
  border:1px solid var(--bd);
  border-radius:var(--r14);
  padding:14px;
}
.lineup-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;margin-bottom:12px;
  padding-bottom:10px;
  border-bottom:1px solid var(--bd);
}
.lineup-team-name{
  font-size:14px;font-weight:800;
  color:var(--t);
}
.lineup-schema{
  font-size:11px;font-weight:800;
  padding:3px 8px;border-radius:6px;
  background:var(--gd);color:var(--g2);
  letter-spacing:.4px;
}
.lineup-list{display:flex;flex-direction:column;gap:6px;}
.lplayer{
  display:flex;align-items:center;gap:10px;
  padding:7px 8px;border-radius:8px;
  transition:background .15s;
}
.lplayer:hover{background:var(--p2);}
.lplayer.off{opacity:.4;text-decoration:line-through;}
.lplayer-num{
  width:24px;height:24px;border-radius:6px;
  background:var(--p3);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;
  color:var(--t2);flex-shrink:0;
}
.lplayer-name{
  flex:1;min-width:0;
  font-size:13px;font-weight:600;
  color:var(--t);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.lplayer-pos{
  font-size:10.5px;font-weight:800;
  color:var(--t3);
  padding:2px 6px;border-radius:5px;
  background:var(--p3);
  letter-spacing:.4px;
}
.lplayer-rate{
  font-size:12px;font-weight:800;
  color:var(--gr2);
  font-variant-numeric:tabular-nums;
  min-width:32px;text-align:right;
}
.lplayer-rate.mid{color:var(--g2);}
.lplayer-rate.low{color:var(--r2);}
.lplayer-cards{display:flex;gap:3px;}
.card-y{
  width:8px;height:11px;border-radius:1.5px;
  background:#e5c342;display:inline-block;
}
.card-r{
  width:8px;height:11px;border-radius:1.5px;
  background:#e04a56;display:inline-block;
}

/* === КОНЕЦ ЧАСТИ 3 === */
  /* === ЧАСТЬ 4: CSS MARKETS + COUPON + MODALS === */

/* MARKETS */
.mkts{
  display:flex;flex-direction:column;gap:14px;
}
.mkt{
  background:var(--p);
  border:1px solid var(--bd);
  border-radius:var(--r14);
  overflow:hidden;
}
.mkt-h{
  padding:11px 14px;
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;
  background:var(--p2);
  border-bottom:1px solid var(--bd);
  cursor:pointer;
  user-select:none;
}
.mkt-h:hover{background:var(--p3);}
.mkt-name{
  font-size:12px;font-weight:800;
  color:var(--t);letter-spacing:.4px;
  text-transform:uppercase;
}
.mkt-toggle{
  color:var(--t3);font-size:11px;
  transition:transform .2s;
}
.mkt.collapsed .mkt-toggle{transform:rotate(-90deg);}
.mkt.collapsed .mkt-body{display:none;}

.mkt-body{padding:0;}

.mkt-sublabel{
  padding:10px 12px 4px;
  background:var(--p2);
  border-top:1px solid var(--bd);
  border-bottom:1px solid var(--bd);
  font-size:11px;font-weight:800;
  color:var(--t3);
  text-transform:uppercase;letter-spacing:.5px;
}

.mkt-g{
  display:grid;gap:1px;
  background:var(--bd);
}
.mkt-g.g1{grid-template-columns:1fr;}
.mkt-g.g2{grid-template-columns:repeat(2,1fr);}
.mkt-g.g3{grid-template-columns:repeat(3,1fr);}
.mkt-g.g4{grid-template-columns:repeat(4,1fr);}
.mkt-g.g5{grid-template-columns:repeat(5,1fr);}
.mkt-g.g6{grid-template-columns:repeat(6,1fr);}

/* ODD */
.odd{
  background:var(--p);
  padding:11px 8px;
  cursor:pointer;
  transition:background .15s;
  position:relative;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:3px;
  min-height:52px;
  user-select:none;
}
.odd:hover{background:var(--p2);}
.odd:active{transform:scale(.97);}
.odd.sel{
  background:var(--gd);
}
.odd.sel .odd-lbl{color:var(--g2);}
.odd.sel .odd-val{color:var(--g2);}
.odd.closed{
  opacity:.35;
  cursor:not-allowed;
  background:var(--p);
}
.odd.closed:hover{background:var(--p);}
.odd.closed .odd-val{
  text-decoration:line-through;
  color:var(--muted);
}
.odd.closed .odd-lbl{opacity:.6;}

.odd-lbl{
  font-size:10px;font-weight:700;
  color:var(--t3);
  text-transform:uppercase;
  letter-spacing:.4px;
  text-align:center;line-height:1.2;
}
.odd-val{
  font-size:14.5px;font-weight:800;
  color:var(--t);
  font-variant-numeric:tabular-nums;
  transition:color .3s,transform .2s;
}
.odd-val.up{
  animation:flashUp 1.4s ease-out;
}
.odd-val.dn{
  animation:flashDown 1.4s ease-out;
}

/* SUSPENDED NOTICE */
.susp{
  padding:14px;
  background:var(--lvd);
  border:1px solid rgba(224,74,86,.25);
  border-radius:var(--r10);
  display:flex;align-items:center;gap:10px;
  font-size:12.5px;font-weight:700;
  color:var(--r2);
  margin-bottom:12px;
  animation:slideDown .3s;
}
.susp::before{
  content:"⚠️";font-size:16px;
  animation:pulse 1s infinite;
}

/* COUPON */
.cp{
  position:fixed;bottom:0;left:0;right:0;z-index:260;
  background:var(--p);
  border-top:1px solid var(--bd2);
  border-radius:18px 18px 0 0;
  box-shadow:0 -12px 40px rgba(0,0,0,.6);
  transition:transform .3s cubic-bezier(.4,0,.2,1);
  max-height:86vh;
  display:flex;flex-direction:column;
  transform:translateY(calc(100% - 60px));
}
.cp.on{transform:translateY(0);}

.cp-bar{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;
  padding:14px 16px;
  cursor:pointer;
  user-select:none;
  flex-shrink:0;
  min-height:60px;
}
.cp-bar-l{
  display:flex;align-items:center;gap:10px;
  font-size:13px;font-weight:700;
  color:var(--t2);
  min-width:0;flex:1;
}
.cp-bar-l .ic{font-size:17px;opacity:.85;}
.cp-count{
  background:var(--p3);
  color:var(--t2);
  font-size:11px;font-weight:800;
  padding:2px 8px;border-radius:7px;
  min-width:22px;text-align:center;
}
.cp-count.has{
  background:var(--gd);
  color:var(--g2);
}
.cp-odds{
  color:var(--g2);
  font-weight:800;font-size:14px;
}

.cp-actions{display:flex;gap:6px;align-items:center;flex-shrink:0;}
.cp-close{
  width:32px;height:32px;border-radius:8px;
  background:var(--p2);
  border:1px solid var(--bd);
  color:var(--t3);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;line-height:1;
  transition:all .15s;
}
.cp-close:hover{
  color:var(--r2);
  border-color:rgba(211,90,104,.4);
  background:var(--rd);
}
.cp-close:active{transform:scale(.92);}

.cp-btn{

  .replace(/"/g, '&quot;')
  .replace(/'/g, '&#39;');

/* ---------- RNG (детерминированный) ---------- */
function makeRng(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0;
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* Осветление / затемнение цвета */
function shadeColor(hex, percent){
  const num = parseInt(hex.slice(1), 16);
  const amt = Math.round(2.55 * percent);
  const R = clamp((num >> 16) + amt, 0, 255);
  const G = clamp((num >> 8 & 0x00FF) + amt, 0, 255);
  const B = clamp((num & 0x0000FF) + amt, 0, 255);
  return '#' + (0x1000000 + R*0x10000 + G*0x100 + B).toString(16).slice(1);
}

  /* ---------- ВРЕМЯ ---------- */
  gameMinutes(){
    const elapsed = Date.now() - this.startedAt;
    const gameElapsed = (elapsed / 1000) * FT_MULT;
    return clamp(gameElapsed, 0, this.gameDuration);
  }

  progress(){
    return clamp(this.gameMinutes() / this.gameDuration, 0, 1);
  }

  realElapsed(){
    return (Date.now() - this.startedAt) / 1000;
  }

  displayClock(){
    if(this.finished) return 'FT';
    const g = this.gameMinutes();
    const mm = Math.floor(g);
    const ss = Math.floor((g - mm) * 60);
    return pad2(mm) + ':' + pad2(ss);
  }

  simText(){
    const el = clamp(this.realElapsed(), 0, this.realDuration);
    const mm = Math.floor(el / 60), ss = Math.floor(el % 60);
    const tmm = Math.floor(this.realDuration / 60), tss = this.realDuration % 60;
    return `Симуляция ${pad2(mm)}:${pad2(ss)} / ${pad2(tmm)}:${pad2(tss)}`;
  }

  /* ---------- SUSPENSION ---------- */
  suspendOdds(ms){
    this.suspended = true;
    this.suspendedUntil = Date.now() + ms;
  }

  isSuspended(){
    return this.suspended && Date.now() < this.suspendedUntil;
  }

  /* ---------- LIVE MOMENT ---------- */
  setLiveMoment(title, sub){
    this.liveMoment = {title, sub, ts: Date.now()};
  }

  /* ---------- МОМЕНТУМ ---------- */
  momentumShift(team, amount){
    if(team === 'h'){
      this.momentum.h = clamp(this.momentum.h + amount, 5, 95);
    } else {
      this.momentum.a = clamp(this.momentum.a + amount, 5, 95);
    }
    const total = this.momentum.h + this.momentum.a;
    this.momentum.h = clamp(this.momentum.h / total * 100, 5, 95);
    this.momentum.a = 100 - this.momentum.h;
  }

  /* ---------- СОБЫТИЯ ---------- */
  pushEvent(ev){
    ev.ts = Date.now();
    this.events.unshift(ev);
    if(this.events.length > 150) this.events.length = 150;
    if(this.onEvent) this.onEvent(ev);
  }

  /* ---------- TICK (главный) ---------- */
  tick(){
    if(this.finished) return;
    const now = Date.now();

    // Half time
    if(!this.halfTimeDone && this.gameMinutes() >= HALF_TIME_AT){
      this.halfTimeDone = true;
      this.pushEvent({
        type: 'HALF_TIME',
        min: 45,
        team: null,
        text: 'Перерыв. Команды уходят на отдых.',
        highlight: true,
      });
      this.setLiveMoment('⏸ Перерыв', 'Второй тайм начнётся через мгновение');
      this.pausedUntil = now + 3000;
      return;
    }

    // Full time
    if(this.gameMinutes() >= this.gameDuration){
      this.finish();
      return;
    }

    // Пауза (перерыв)
    if(this.pausedUntil && now < this.pausedUntil) return;

    // Восстановление после suspension
    if(this.suspended && now >= this.suspendedUntil){
      this.suspended = false;
    }

    // Генерация события
    if(now - this.lastEventAt >= this.nextEventIn){
      this.rollEvent();
      this.lastEventAt = now;
      this.nextEventIn = rnd(2000, 5000);
    }

    // Пересчёт кэфов
    this.recalcOdds();
  }

  /* ---------- ВЫБОР СОБЫТИЯ ---------- */
  rollEvent(){
    const poss = this.possession;
    const weights = this.getEventWeights();
    const totalW = weights.reduce((s, e) => s + e.w, 0);
    let r = this.rng() * totalW;
    let chosen = weights[0];

    for(const e of weights){
      r -= e.w;
      if(r <= 0){ chosen = e; break; }
    }

    this.executeEvent(chosen.type, poss);
  }

  /* ---------- ВЕСА СОБЫТИЙ (зависит от спорта) ---------- */
  getEventWeights(){
    const g = this.gameMinutes();
    const lead = Math.abs(this.hs - this.as);

    if(this.sport === 'football'){
      return [
        {type: 'PASS',      w: 38},

        {type: 'SHOT_OFF',  w: 8},

        {type: 'BLOCKED',   w: 3},
        {type: 'CORNER',    w: 4},
        {type: 'FOUL',      w: 6},
        {type: 'YELLOW',    w: 2.5},
        {type: 'OFFSIDE',   w: 2},
        {type: 'SUB',       w: 1.5},
        {type: 'RED',       w: 0.2},
        {type: 'PENALTY',   w: 0.15},
        {type: 'GOAL',      w: 2.5},
      ];
    }

    if(this.sport === 'hockey'){
      return [
        {type: 'PASS',      w: 30},
        {type: 'ATTACK',    w: 25},
        {type: 'SHOT_OFF',  w: 14},
        {type: 'SHOT_ON',   w: 12},
        {type: 'HIT',       w: 6},
        {type: 'FOUL',      w: 5},
        {type: 'YELLOW',    w: 3},
        {type: 'GOAL',      w: 3.5},
        {type: 'SUB',       w: 1.5},
      ];
    }

    if(this.sport === 'tennis'){
      return [
        {type: 'POINT',        w: 45},
        {type: 'ACE',          w: 8},
        {type: 'DOUBLE_FAULT', w: 5},
        {type: 'BREAK',        w: 4},
        {type: 'SET_END',      w: 3},
      ];
    }

    if(this.sport === 'mma'){
      return [
        {type: 'HIT',        w: 40},
        {type: 'ATTACK',     w: 20},
        {type: 'DANGEROUS',  w: 15},
        {type: 'SHOT_ON',    w: 10},
        {type: 'ROUND_END',  w: 8},
        {type: 'GOAL',       w: 0.8},
      ];
    }

    if(this.sport === 'cyber'){
      return [
        {type: 'ROUND_WIN',  w: 35},
        {type: 'HIT',        w: 25},
        {type: 'ATTACK',     w: 18},
        {type: 'DANGEROUS',  w: 12},
        {type: 'MAP_END',    w: 5},
        {type: 'GOAL',       w: 1},
      ];
    }

    return [{type: 'PASS', w: 100}];
  }

  /* ---------- ИСПОЛНЕНИЕ СОБЫТИЯ ---------- */
  executeEvent(type, team){
    if(this.sport === 'football') return this.executeFootball(type, team);
    if(this.sport === 'hockey')   return this.executeHockey(type, team);
    if(this.sport === 'tennis')   return this.executeTennis(type, team);
    if(this.sport === 'mma')      return this.executeMma(type, team);
    if(this.sport === 'cyber')    return this.executeCyber(type, team);
  }

  /* === ФУТБОЛ === */
  executeFootball(type, team){
    const minute = Math.floor(this.gameMinutes());
    const teamName = team === 'h' ? this.home : this.away;
    const oppName  = team === 'h' ? this.away : this.home;
    const setPoss  = () => { this.possession = team === 'h' ? 'a' : 'h'; };
    const keepPoss = () => { this.possession = team; };

    switch(type){
      case 'PASS':
        this.stats.passes[team]++;
        this.state = 'BUILD_UP';
        this.attackingTeam = team;
        this.setBall(team, 'BUILD_UP');
        this.rng() < 0.35 ? setPoss() : keepPoss();
        this.pushEvent({type, min: minute, team, text: `Передача у <b>${teamName}</b>`});
        break;

      case 'ATTACK':
        this.stats.dangerous[team]++;
        this.state = 'ATTACK';
        this.attackingTeam = team;
        this.setBall(team, 'ATTACK');
        keepPoss();
        this.pushEvent({type, min: minute, team, text: `Атака <b>${teamName}</b>`});
        break;

      case 'DANGEROUS':
        this.stats.dangerous[team]++;
        this.state = 'DANGEROUS';
        this.attackingTeam = team;
        this.setBall(team, 'DANGEROUS');
        keepPoss();
        this.pushEvent({type, min: minute, team, text: `Опасный момент у ворот <b>${oppName}</b>`, highlight: true});
        this.momentumShift(team, 6);
        break;

      case 'SHOT_OFF':
        this.stats.shots[team]++;
        this.stats.offTarget[team]++;
        this.state = 'SHOT';
        this.setBall(team, 'SHOT');
        setPoss();
        this.pushEvent({type, min: minute, team, text: `Удар мимо от <b>${teamName}</b>`});
        break;

      case 'SHOT_ON':
        this.stats.shots[team]++;
        this.stats.onTarget[team]++;
        this.state = 'SHOT_ON';
        this.setBall(team, 'SHOT_ON');
        this.suspendOdds(1200);
        setPoss();
        this.pushEvent({type, min: minute, team, text: `🎯 Удар в створ!`, highlight: true});
        this.setLiveMoment('🎯 Удар в створ', teamName);
        break;

      case 'BLOCKED':
        this.stats.shots[team]++;
        this.stats.blocked[team]++;
        this.state = 'SHOT';
        this.setBall(team, 'SHOT');
        setPoss();
        this.pushEvent({type, min: minute, team, text: `Удар заблокирован`});
        break;

      case 'CORNER':
        this.stats.corners[team]++;
        this.state = 'CORNER';
        this.setBall(team, 'CORNER');
        keepPoss();
        this.pushEvent({type, min: minute, team, text: `⚑ Угловой у <b>${teamName}</b>`});
        break;

      case 'FOUL':
        this.stats.fouls[team === 'h' ? 'a' : 'h']++;
        this.pushEvent({type, min: minute, team, text: `Нарушение правил`});
        setPoss();
        break;

      case 'YELLOW':
        this.stats.yellow[team]++;
        this.pushEvent({type, min: minute, team, text: `🟨 Жёлтая у <b>${teamName}</b>`, highlight: true});
        this.momentumShift(team, -3);
        break;

      case 'RED':
        this.stats.red[team]++;
        this.suspendOdds(2000);
        this.pushEvent({type, min: minute, team, text: `🟥 КРАСНАЯ! <b>${teamName}</b>`, highlight: true});
        this.setLiveMoment('🟥 Красная карточка', teamName);
        break;

      case 'OFFSIDE':
        this.stats.offsides[team]++;
        this.pushEvent({type, min: minute, team, text: `🚩 Офсайд`});
        setPoss();
        break;

      case 'SUB':
        this.stats.subs[team]++;
        this.pushEvent({type, min: minute, team, text: `🔄 Замена`});
        break;

      case 'PENALTY':
        this.suspendOdds(3000);
        this.pushEvent({type, min: minute, team, text: `⚽ ПЕНАЛЬТИ!`, highlight: true});
        this.setLiveMoment('⚽ Пенальти', teamName);
        setTimeout(() => {
          if(this.finished) return;
          if(this.rng() < 0.75){
            this.scoreGoal(team, 'penalty');
          } else {
            this.pushEvent({type: 'PEN_MISS', min: Math.floor(this.gameMinutes()), team, text: 'Вратарь парирует'});
          }
        }, 2500);
        break;

      case 'GOAL':
        this.scoreGoal(team);
        break;
    }
  }

  /* === ХОККЕЙ === */
  executeHockey(type, team){
    const minute = Math.floor(this.gameMinutes());
    const teamName = team === 'h' ? this.home : this.away;
    const setPoss = () => { this.possession = team === 'h' ? 'a' : 'h'; };
    const keepPoss = () => { this.possession = team; };

    switch(type){
      case 'PASS':
        this.stats.passes[team]++;
        this.state = 'BUILD_UP';
        this.setBall(team, 'BUILD_UP');
        this.rng() < 0.4 ? setPoss() : keepPoss();
        this.pushEvent({type, min: minute, team, text: `Передача у <b>${teamName}</b>`});
        break;
      case 'ATTACK':
        this.state = 'ATTACK';
        this.stats.dangerous[team]++;
        this.setBall(team, 'ATTACK');
        keepPoss();
        this.pushEvent({type, min: minute, team, text: `Атака <b>${teamName}</b>`});
        break;
      case 'SHOT_OFF':
        this.stats.shots[team]++;
        this.state = 'SHOT';
        this.setBall(team, 'SHOT');
        setPoss();
        this.pushEvent({type, min: minute, team, text: `Бросок мимо от <b>${teamName}</b>`});
        break;
      case 'SHOT_ON':
        this.stats.shots[team]++;
        this.stats.onTarget[team]++;
        this.state = 'SHOT_ON';
        this.setBall(team, 'SHOT_ON');
        this.suspendOdds(1000);
        setPoss();
        this.pushEvent({type, min: minute, team, text: `🥅 Бросок в створ!`, highlight: true});
        this.setLiveMoment('🥅 Бросок в створ', teamName);
        break;
      case 'HIT':
        this.pushEvent({type, min: minute, team, text: `💥 Силовой приём`});
        break;
      case 'FOUL':
        this.stats.fouls[team === 'h' ? 'a' : 'h']++;
        this.pushEvent({type, min: minute, team, text: `Удаление 2 мин`});
        setPoss();
        break;
      case 'YELLOW':
        this.stats.yellow[team]++;
        this.pushEvent({type, min: minute, team, text: `Малый штраф`});
        break;
      case 'SUB':
        this.stats.subs[team]++;
        this.pushEvent({type, min: minute, team, text: `Смена звена`});
        break;
      case 'GOAL':
        this.scoreGoal(team);
        break;
    }
  }

  /* === ТЕННИС === */
  executeTennis(type, team){
    const minute = Math.floor(this.gameMinutes());
    const teamName = team === 'h' ? this.home : this.away;

    switch(type){
      case 'POINT': {
        const winner = this.rng() < 0.5 ? 'h' : 'a';
        const wName = winner === 'h' ? this.home : this.away;
        if(winner === 'h') this.hs++; else this.as++;
        this.pushEvent({type, min: minute, team: winner, text: `Очко выигрывает <b>${wName}</b>`});
        this.recalcOdds();
        break;
      }
      case 'ACE':
        this.pushEvent({type, min: minute, team, text: `🎾 Эйс от <b>${teamName}</b>`});
        break;
      case 'DOUBLE_FAULT':
        this.pushEvent({type, min: minute, team, text: `❌ Двойная ошибка`});
        break;
      case 'BREAK': {
        const w = this.rng() < 0.5 ? 'h' : 'a';
        const wN = w === 'h' ? this.home : this.away;
        if(w === 'h') this.hs += 1; else this.as += 1;
        this.pushEvent({type, min: minute, team: w, text: `💥 Брейк! <b>${wN}</b>`, highlight: true});
        break;
      }
      case 'SET_END':
        this.pushEvent({type, min: minute, team: null, text: `Сет завершён`, highlight: true});
        break;
    }
  }

  /* === UFC === */
  executeMma(type, team){
    const minute = Math.floor(this.gameMinutes());
    const teamName = team === 'h' ? this.home : this.away;

    switch(type){
      case 'HIT':
        this.pushEvent({type, min: minute, team, text: `Удар <b>${teamName}</b>`});
        break;
      case 'ATTACK':
        this.state = 'ATTACK';
        this.attackingTeam = team;
        this.setBall(team, 'ATTACK');
        this.pushEvent({type, min: minute, team, text: `Атака <b>${teamName}</b>`});
        break;
      case 'DANGEROUS':
        this.state = 'DANGEROUS';
        this.setBall(team, 'DANGEROUS');
        this.pushEvent({type, min: minute, team, text: `Опасно! <b>${teamName}</b>`, highlight: true});
        this.setLiveMoment('🔥 Атака', teamName);
        break;
      case 'SHOT_ON':
        this.state = 'SHOT_ON';
        this.setBall(team, 'SHOT_ON');
        this.suspendOdds(1500);
        this.pushEvent({type, min: minute, team, text: `Мощный удар!`});
        break;
      case 'ROUND_END': {
        const round = Math.min(5, Math.floor(this.gameMinutes() / 18) + 1);
        this.pushEvent({type, min: minute, team: null, text: `Раунд ${round} завершён`, highlight: true});
        break;
      }
      case 'GOAL': {
        const winner = this.rng() < 0.5 ? 'h' : 'a';
        const wName = winner === 'h' ? this.home : this.away;
        this.scoreGoal(winner, 'ko');
        this.setLiveMoment('🥊 КО!', wName);
        break;
      }
    }
  }

  /* === КИБЕР === */
  executeCyber(type, team){
    const minute = Math.floor(this.gameMinutes());
    const teamName = team === 'h' ? this.home : this.away;

    switch(type){
      case 'ROUND_WIN': {
        const winner = this.rng() < 0.5 ? 'h' : 'a';
        const wName = winner === 'h' ? this.home : this.away;
        if(winner === 'h') this.hs++; else this.as++;
        this.pushEvent({type, min: minute, team: winner, text: `Раунд берёт <b>${wName}</b>`});
        break;
      }
      case 'HIT':
        this.pushEvent({type, min: minute, team, text: `Фраг <b>${teamName}</b>`});
        break;
      case 'ATTACK':
        this.state = 'ATTACK';
        this.attackingTeam = team;
        this.setBall(team, 'ATTACK');
        this.pushEvent({type, min: minute, team, text: `Пуш <b>${teamName}</b>`});
        break;
      case 'DANGEROUS':
        this.state = 'DANGEROUS';
        this.setBall(team, 'DANGEROUS');
        this.pushEvent({type, min: minute, team, text: `Решающий момент у <b>${teamName}</b>`, highlight: true});
        break;
      case 'MAP_END':
        this.pushEvent({type, min: minute, team: null, text: `Карта завершена`, highlight: true});
        break;
      case 'GOAL': {
        const winner = this.rng() < 0.5 ? 'h' : 'a';
        this.scoreGoal(winner, 'map');
        break;
      }
    }
  }

  /* ---------- УСТАНОВКА МЯЧА ---------- */
  setBall(team, state){
    const isH = team === 'h';
    const positions = {
      BUILD_UP:  {x: isH ? 250 : 800, y: 340},
      ATTACK:    {x: isH ? 420 : 630, y: rnd(150, 530)},
      DANGEROUS: {x: isH ? 700 : 350, y: rnd(200, 480)},
      SHOT:      {x: isH ? 900 : 150, y: rnd(250, 430)},
      SHOT_ON:   {x: isH ? 1000 : 50, y: rnd(290, 390)},
      CORNER:    {x: isH ? 1010 : 40, y: this.rng() < 0.5 ? 60 : 620},
    };
    const t = positions[state] || {x: 525, y: 340};
    this.ballPos.tx = t.x;
    this.ballPos.ty = t.y;
    this.ballPos.visible = true;
  }

  /* ---------- ГОЛ ---------- */
  scoreGoal(team, kind){
    if(team === 'h') this.hs++;
    else this.as++;

    const minute = Math.floor(this.gameMinutes());
    const teamName = team === 'h' ? this.home : this.away;

    this.pushEvent({
      type: 'GOAL',
      min: minute,
      team,
      text: `⚽ <b>ГОЛ!</b> Забивает <b>${teamName}</b>. ${this.hs}:${this.as}`,
      highlight: true,
    });

    this.setLiveMoment('⚽ ГОЛ!', `${teamName} · ${this.hs}:${this.as}`);
    this.suspendOdds(2500);
    this.momentumShift(team, 10);

    if(typeof window.showGoalOverlay === 'function'){
      window.showGoalOverlay(`${this.home} ${this.hs} : ${this.as} ${this.away}`);
    }

    setTimeout(() => {
      if(!this.finished){
        this.state = 'KICK_OFF';
        this.possession = team === 'h' ? 'a' : 'h';
      }
    }, 2000);
  }

  /* ---------- ЗАВЕРШЕНИЕ ---------- */
  finish(){
    this.finished = true;
    this.finishedAt = Date.now();

    // Разница в счёте — не ничья
    if((this.sport === 'football' || this.sport === 'hockey') &&
       this.hs === this.as && this.rng() < 0.5){
      if(this.rng() < 0.5) this.hs++;
      else this.as++;
    }

    // Закрываем все рынки
    for(const m of Object.values(this.markets)){
      m.closed = m.lbl.map(() => true);
    }

    this.pushEvent({
      type: 'FULL_TIME',
      min: Math.floor(this.gameDuration),
      team: null,
      text: `🏁 МАТЧ ЗАВЕРШЁН. Итог ${this.hs}:${this.as}`,
      highlight: true,
    });

    this.setLiveMoment('🏁 Завершён', `${this.hs} : ${this.as}`);
    this.state = 'FULL_TIME';

    if(typeof window.saveMatchToHistory === 'function'){
      window.saveMatchToHistory(this);
    }
    if(typeof window.checkCouponResults === 'function'){
      window.checkCouponResults(this);
    }
  }

  /* ---------- ЗАГЛУШКА (пересчёт кэфов — в Части 10) ---------- */
  recalcOdds(){
    if(typeof this._recalcOddsImpl === 'function'){
      this._recalcOddsImpl();
    }
  }

  /* ---------- ЗАГЛУШКА (рынки — в Части 9) ---------- */
  buildMarkets(){
    if(typeof window.buildMarketsForSport === 'function'){
      return window.buildMarketsForSport(this.sport);
    }
    return {};
  }
}

/* === КОНЕЦ ЧАСТИ 7 === */
  /* === ЧАСТЬ 8: MANAGER + SPORTS ENGINES === */

/* ---------- SPORTS ENGINES ----------
   Каждый спорт имеет свою конфигурацию:
   - скорости времени
   - логику счёта
   - победителя
*/
const SportEngine = {

  /* КОНФИГИ СПОРТОВ */
  config: {

      scoreUnit: 'шайба',

      scoreUnitShort: 'Ш',

      halfAt: 20,            // перерыв после 1-го периода

    },

      icon: '🎾',
      duration: 3,           // 3 сета
      realDuration: 300,

      scoreUnitShort: 'С',
      hasDraw: false,

    },
    mma: {
      name: 'UFC / MMA',
      icon: '🥊',
      duration: 5,           // 5 раундов
      realDuration: 300,
      scoreUnit: 'раунд',
      scoreUnitPlural: 'раунда',

      hasDraw: false,

    },
    cyber: {
      name: 'Киберспорт',

      duration: 3,           // 3 карты
      realDuration: 300,

      scoreUnitPlural: 'карты',
      scoreUnitShort: 'К',
      hasDraw: false,
      hasHalves: false,
      maxScore: 3,
    },
  },

  /* ПОЛУЧИТЬ КОНФИГ */
  get(sportId){
    return this.config[sportId] || this.config.football;
  },

  /* ФОРМАТИРОВАНИЕ СЧЁТА */
  formatScore(match){
    const cfg = this.get(match.sport);
    if(match.sport === 'tennis'){
      return `${match.hs} : ${match.as} (сеты)`;
    }
    if(match.sport === 'mma'){
      return `${match.hs} : ${match.as} (раунды)`;
    }
    if(match.sport === 'cyber'){
      return `${match.hs} : ${match.as} (карты)`;
    }
    return `${match.hs} : ${match.as}`;
  },

  /* ОПРЕДЕЛИТЬ ПОБЕДИТЕЛЯ */
  getWinner(match){
    if(!match.finished) return null;
    if(match.hs > match.as) return 'h';
    if(match.as > match.hs) return 'a';

/* ---------- MANAGER — управляет всеми матчами ---------- */
const Manager = {
  matches: [],
  nextId: 1,
  maxLiveMatches: 16,
  rotationDelay: 8000,     // через сколько заменять завершённый матч

  /* ИНИЦИАЛИЗАЦИЯ */
  init(){
    this.matches = [];
    this.nextId = 1;

    // 3 футбольных матча с разным стартом
    for(let i = 0; i < 3; i++){
      this.spawnMatch('football', -rndInt(20, 280));
    }

    // По 2 матча остальных спортов
    const sports = ['hockey', 'tennis', 'mma', 'cyber'];
    for(const sport of sports){
      for(let i = 0; i < 2; i++){
        this.spawnMatch(sport, -rndInt(20, 260));
      }
    }

    // Ещё немного футбола для объёма
    for(let i = 0; i < 2; i++){
      this.spawnMatch('football', -rndInt(20, 260));
    }

    // Логируем стартовое состояние
    console.log(`[LIVEZONE] Manager.init → создано ${this.matches.length} матчей`);
    this.matches.forEach(m => {
      console.log(`  #${m.id} ${m.sport}: ${m.home} vs ${m.away} | LIVE ${m.displayClock()}`);
    });
  },

  /* СОЗДАТЬ НОВЫЙ МАТЧ */
  spawnMatch(sport, startOffsetSec){
    const teams = TEAMS[sport];
    if(!teams || !teams.length) return null;

    const t = pick(teams);
    const leagues = LEAGUES[sport];
    const league = pick(leagues);

    const cfg = SportEngine.get(sport);

    const match = new Match({
      id: this.nextId++,
      sport,
      league,
      home: t.home,
      away: t.away,
      city: t.city,
      startedAt: Date.now() + (startOffsetSec || 0) * 1000,
      seed: Math.random() * 1e9 | 0,
    });

    // Досчитываем счёт к текущему прогрессу
    this.catchUpScore(match);

    // Подключаем пересчёт кэфов
    match._recalcOddsImpl = function(){
      if(typeof recalcOddsImpl === 'function'){
        recalcOddsImpl.call(this);
      }
    };

    this.matches.push(match);
    return match;
  },

  /* ДОСЧИТАТЬ СЧЁТ К ПРОГРЕССУ (для старта с середины) */
  catchUpScore(match){
    const p = match.progress();
    if(p <= 0) return;

    const cfg = SportEngine.get(match.sport);
    let expectedTotal = 0;

    if(match.sport === 'football'){
      expectedTotal = Math.floor(p * (2 + match.rng() * 2));
    } else if(match.sport === 'hockey'){
      expectedTotal = Math.floor(p * (3 + match.rng() * 3));
    } else if(match.sport === 'tennis'){
      expectedTotal = Math.floor(p * 3);
    } else if(match.sport === 'mma'){
      expectedTotal = Math.floor(p * 3);
    } else if(match.sport === 'cyber'){
      expectedTotal = Math.floor(p * 2);
    }

    // Раскидываем по командам
    for(let i = 0; i < expectedTotal; i++){
      if(match.rng() < 0.5) match.hs++;
      else match.as++;
    }

    // Синхронизируем статистику
    if(match.sport === 'football'){
      match.stats.shots.h = Math.floor(p * 6 + match.rng() * 4);
      match.stats.shots.a = Math.floor(p * 5 + match.rng() * 4);
      match.stats.onTarget.h = Math.floor(match.stats.shots.h * 0.4);
      match.stats.onTarget.a = Math.floor(match.stats.shots.a * 0.4);
      match.stats.corners.h = Math.floor(p * 5 + match.rng() * 3);
      match.stats.corners.a = Math.floor(p * 4 + match.rng() * 3);
      match.stats.yellow.h = Math.floor(p * 1.5);
      match.stats.yellow.a = Math.floor(p * 1.8);
      match.stats.possession.h = Math.floor(40 + match.rng() * 20);
      match.stats.possession.a = 100 - match.stats.possession.h;
    }
    if(match.sport === 'hockey'){
      match.stats.shots.h = Math.floor(p * 12 + match.rng() * 8);
      match.stats.shots.a = Math.floor(p * 11 + match.rng() * 8);
      match.stats.fouls.h = Math.floor(p * 3);
      match.stats.fouls.a = Math.floor(p * 3);
    }
  },

  /* ТИК ВСЕХ МАТЧЕЙ */
  tick(){
    this.matches.forEach(m => m.tick());

    // Ротация завершённых
    const now = Date.now();
    this.matches = this.matches.map(m => {
      if(m.finished && m.finishedAt && now - m.finishedAt > this.rotationDelay){
        // Заменяем на новый того же спорта
        const newMatch = this.spawnMatch(m.sport, -5);
        if(newMatch){
          console.log(`[LIVEZONE] Заменён #${m.id} → #${newMatch.id} (${m.sport})`);
          return newMatch;
        }
      }
      return m;
    });

    // Если матчей стало мало — добавляем
    while(this.matches.length < this.maxLiveMatches){
      const sports = ['football', 'hockey', 'tennis', 'mma', 'cyber'];
      const s = pick(sports);
      this.spawnMatch(s, -rndInt(0, 30));
    }
  },

  /* ПОИСК */
  find(id){
    return this.matches.find(m => m.id === id);
  },

  /* ФИЛЬТРАЦИЯ */
  filter(sport, onlyLive){
    let list = this.matches.slice();
    if(sport && sport !== 'all'){
      if(sport === 'live'){
        list = list.filter(m => !m.finished);
      } else {
        list = list.filter(m => m.sport === sport);
      }
    }
    if(onlyLive){
      list = list.filter(m => !m.finished);
    }
    return list;
  },

  /* КОЛИЧЕСТВО LIVE */
  liveCount(){
    return this.matches.filter(m => !m.finished).length;
  },

  /* СОРТИРОВКА */
  sort(list, mode){
    const arr = list.slice();
    if(mode === 'live'){
      arr.sort((a, b) => (a.finished ? 1 : 0) - (b.finished ? 1 : 0));
    } else if(mode === 'time'){
      arr.sort((a, b) => a.startedAt - b.startedAt);
    } else if(mode === 'popularity'){
      arr.sort((a, b) => (b.popular ? 1 : 0) - (a.popular ? 1 : 0));
    }
    return arr;
  },
};

/* ---------- СПЕЦИФИКА СПОРТОВ: КОРРЕКТИРОВКА КОЭФОВ ----------
   В зависимости от вида спорта, скорости счёта и т.д.
*/
function adjustOddsForSport(sport, baseOdds, ctx){
  const {lead, remain, totalScore} = ctx;

  if(sport === 'tennis'){
    // Теннис: сет почти не меняется после победы
    // Если один игрок взял 2 сета — кэф на него резко падает
    if(Math.abs(lead) >= 2){
      return baseOdds.map(o => lead > 0 ? o * 0.4 : o * 2.5);
    }
    if(Math.abs(lead) === 1){
      return baseOdds.map(o => lead > 0 ? o * 0.75 : o * 1.35);
    }
  }

  if(sport === 'mma'){
    // UFC: нокаут резко меняет расклад
    // Чем меньше времени осталось, тем важнее текущий счёт раундов
    if(remain < 0.3 && lead !== 0){
      return baseOdds.map(o => lead > 0 ? o * 0.5 : o * 2);
    }
  }

  if(sport === 'hockey'){
    // Хоккей: голы реже, каждый гол сильно меняет кэф
    if(Math.abs(lead) >= 2){
      return baseOdds.map(o => lead > 0 ? o * 0.55 : o * 2.2);
    }
  }

  if(sport === 'cyber'){
    // Кибер: карта почти решает матч
    if(Math.abs(lead) >= 2){
      return baseOdds.map(o => lead > 0 ? o * 0.35 : o * 3);
    }
  }

  return baseOdds;
}

/* ---------- ОПРЕДЕЛЕНИЕ РЕЗУЛЬТАТА СТАВКИ ---------- */
function determineResult(market, pickIdx, match){
  if(!market) return 'lose';

  const h = match.hs, a = match.as;
  const total = h + a;
  const lbl = market.lbl[pickIdx];

  switch(market.type){
    case '1x2':
      if(pickIdx === 0) return h > a ? 'win' : 'lose';
      if(pickIdx === 1) return h === a ? 'win' : 'lose';
      if(pickIdx === 2) return a > h ? 'win' : 'lose';
      break;

    case 'dc':
      if(pickIdx === 0) return (h >= a) ? 'win' : 'lose';
      if(pickIdx === 1) return (h !== a) ? 'win' : 'lose';
      if(pickIdx === 2) return (a >= h) ? 'win' : 'lose';
      break;

    case 'win':
      return (pickIdx === 0) ? (h > a ? 'win' : 'lose') : (a > h ? 'win' : 'lose');

    case 'over': {
      const isOver = total > market.line;
      return ((pickIdx === 0) === isOver) ? 'win' : 'lose';
    }

    case 'btts': {
      const both = h > 0 && a > 0;
      return ((pickIdx === 0) === both) ? 'win' : 'lose';
    }

    case 'itb1':
      return ((h > market.line) === (pickIdx === 0)) ? 'win' : 'lose';

    case 'itb2':
      return ((a > market.line) === (pickIdx === 0)) ? 'win' : 'lose';

    case 'hand1':
      return ((h + market.line - a > 0) === (pickIdx === 0)) ? 'win' : 'lose';

    case 'hand2':
      return ((a + market.line - h > 0) === (pickIdx === 0)) ? 'win' : 'lose';

    case 'parity':
      return ((total % 2 === 0) === (pickIdx === 0)) ? 'win' : 'lose';

    case 'exact':
      return lbl === `${h}:${a}` ? 'win' : 'lose';

    case 'firstgoal': {
      const first = match.events.filter(e => e.type === 'GOAL').pop();
      if(!first) return pickIdx === 2 ? 'win' : 'lose';
      if(pickIdx === 0) return first.team === 'h' ? 'win' : 'lose';
      if(pickIdx === 1) return first.team === 'a' ? 'win' : 'lose';
      return 'lose';
    }

    case 'corners': {
      const c = match.stats.corners.h + match.stats.corners.a;
      return ((c > market.line) === (pickIdx === 0)) ? 'win' : 'lose';
    }

    case 'cards': {
      const c = match.stats.yellow.h + match.stats.yellow.a +
                (match.stats.red.h + match.stats.red.a) * 2;
      return ((c > market.line) === (pickIdx === 0)) ? 'win' : 'lose';
    }

    case 'shots': {
      const s = match.stats.shots.h + match.stats.shots.a;
      return ((s > market.line) === (pickIdx === 0)) ? 'win' : 'lose';
    }

    case 'period1': {
      // Победитель 1-го периода — примерно по общему счёту
      if(pickIdx === 0) return h > a ? 'win' : 'lose';
      if(pickIdx === 1) return h === a ? 'win' : 'lose';
      if(pickIdx === 2) return a > h ? 'win' : 'lose';
      break;
    }

    case 'method':
    case 'round':
      // Случайный исход для этих рынков (демо)
      return Math.random() < 0.33 ? 'win' : 'lose';
  }

  return 'lose';
}

/* ---------- ГЛАВНАЯ ФУНКЦИЯ: ПЕРЕСЧЁТ ВСЕХ КОЭФОВ ---------- */
function recalcOddsImpl(){
  const match = this;
  const p = match.progress();
  const remain = 1 - p;
  const lead = match.hs - match.as;
  const g = match.gameMinutes();
  const totalScore = match.hs + match.as;

  // Итерируем по всем рынкам
  for(const [name, market] of Object.entries(match.markets)){
    // Пропускаем уже закрытые
    if(market.closed && market.closed.every(x => x)) continue;

    const newVal = calcMarketOdds(match, name, market, {
      p, remain, lead, g, totalScore,
    });

    // Проверка закрытия (если результат уже известен)
    if(newVal === null) continue;

    // Проверка флэша — сравнить со старым
    if(!match.lastOdds) match.lastOdds = {};

    newVal.forEach((v, i) => {
      const key = `${name}_${i}`;
      const last = match.lastOdds[key];
      if(last != null && Math.abs(v - last) > 0.01){
        // Запоминаем флэш
        if(!match.flashes) match.flashes = {};
        match.flashes[key] = {
          dir: v > last ? 'up' : 'down',
          ts: Date.now(),
        };
      }
      match.lastOdds[key] = v;
    });

    market.val = newVal;
  }

  // Записываем историю для графика
  if(match.recordOdds){
    match.recordOdds();
  }
}

/* ---------- ВЫБОР АЛГОРИТМА ПО ТИПУ РЫНКА ---------- */
function calcMarketOdds(match, name, market, ctx){
  const {p, remain, lead, g, totalScore} = ctx;
  const S = match.sport;

  switch(market.type){
    case '1x2':       return odds1x2(match, market, ctx);
    case 'dc':        return oddsDoubleChance(match, market, ctx);
    case 'win':       return oddsWin(match, market, ctx);
    case 'over':      return oddsOver(match, market, ctx);
    case 'btts':      return oddsBtts(match, market, ctx);
    case 'itb1':      return oddsItb1(match, market, ctx);
    case 'itb2':      return oddsItb2(match, market, ctx);
    case 'hand1':     return oddsHand1(match, market, ctx);
    case 'hand2':     return oddsHand2(match, market, ctx);
    case 'parity':    return oddsParity(match, market, ctx);
    case 'exact':     return oddsExact(match, market, ctx);
    case 'firstgoal': return oddsFirstGoal(match, market, ctx);
    case 'corners':   return oddsCorners(match, market, ctx);
    case 'cards':     return oddsCards(match, market, ctx);
    case 'shots':     return oddsShots(match, market, ctx);
    case 'period1':   return odds1x2(match, market, ctx);  // как 1X2
    case 'method':    return oddsMethod(match, market, ctx);
    case 'round':     return oddsRound(match, market, ctx);
    default:          return market.val;
  }
}

/* ---------- 1X2 / WIN ---------- */
function odds1x2(match, market, ctx){
  const {remain, lead} = ctx;
  const twoWay = market.lbl.length === 2;
  let pH, pD, pA;

  // Базовая сила команд (если есть)
  const homeAdvantage = 0.05; // домашнее преимущество

  if(lead > 0){
    pH = clamp(0.5 + lead * 0.15 + (1 - remain) * 0.2 + homeAdvantage, 0.05, 0.95);
    pD = twoWay ? 0 : 0.20 * remain + 0.03;
    pA = Math.max(0.02, 1 - pH - pD);
  } else if(lead < 0){
    pA = clamp(0.5 + Math.abs(lead) * 0.15 + (1 - remain) * 0.2, 0.05, 0.95);
    pD = twoWay ? 0 : 0.20 * remain + 0.03;
    pH = Math.max(0.02, 1 - pA - pD);
  } else {
    pH = 0.40 * remain + 0.15 + homeAdvantage;
    pA = 0.40 * remain + 0.15;
    pD = twoWay ? 0 : 0.30 * remain + 0.05;
  }

  // Нормализация
  const sum = pH + pD + pA;
  pH /= sum;
  pD /= sum;
  pA /= sum;

  const margin = 1.06;

  if(twoWay){
    return [
      clamp(1 / pH / margin, 1.02, 99),
      clamp(1 / pA / margin, 1.02, 99),
    ];
  }
  return [
    clamp(1 / pH / margin, 1.02, 99),
    clamp(1 / pD / margin, 1.02, 99),
    clamp(1 / pA / margin, 1.02, 99),
  ];
}

/* ---------- ДВОЙНОЙ ШАНС ---------- */
function oddsDoubleChance(match, market, ctx){
  const {remain, lead} = ctx;
  // 1X, 12, X2
  let pH, pD, pA;

  if(lead > 0){
    pH = clamp(0.55 + lead * 0.1 + (1 - remain) * 0.15, 0.1, 0.9);
    pD = 0.20 * remain + 0.05;
    pA = Math.max(0.03, 1 - pH - pD);
  } else if(lead < 0){
    pA = clamp(0.55 + Math.abs(lead) * 0.1 + (1 - remain) * 0.15, 0.1, 0.9);
    pD = 0.20 * remain + 0.05;
    pH = Math.max(0.03, 1 - pA - pD);
  } else {
    pH = 0.38 * remain + 0.15;
    pA = 0.38 * remain + 0.15;
    pD = 0.24 * remain + 0.1;
  }

  const sum = pH + pD + pA;
  pH /= sum; pD /= sum; pA /= sum;

  const p1X = pH + pD;
  const p12 = pH + pA;
  const pX2 = pD + pA;

  const margin = 1.06;

  return [
    clamp(1 / Math.max(p1X, 0.02) / margin, 1.02, 99),
    clamp(1 / Math.max(p12, 0.02) / margin, 1.02, 99),
    clamp(1 / Math.max(pX2, 0.02) / margin, 1.02, 99),
  ];
}

/* ---------- ПОБЕДИТЕЛЬ (2-way) ---------- */
function oddsWin(match, market, ctx){
  const {remain, lead} = ctx;
  let pH, pA;

  if(lead > 0){
    pH = clamp(0.5 + lead * 0.15 + (1 - remain) * 0.25, 0.03, 0.97);
    pA = 1 - pH;
  } else if(lead < 0){
    pA = clamp(0.5 + Math.abs(lead) * 0.15 + (1 - remain) * 0.25, 0.03, 0.97);
    pH = 1 - pA;
  } else {
    pH = 0.5;
    pA = 0.5;
  }

  const margin = 1.05;

  return [
    clamp(1 / pH / margin, 1.02, 99),
    clamp(1 / pA / margin, 1.02, 99),
  ];
}

/* ---------- ТОТАЛ (OVER/UNDER) ---------- */
function oddsOver(match, market, ctx){
  const {g, remain} = ctx;
  const S = match.sport;
  let totalScore = match.hs + match.as;
  let ratePerMin = 0.014; // голов в минуту (футбол)

  if(S === 'hockey') ratePerMin = 0.025;
  if(S === 'tennis') {
    // теннис — не по времени, а по геймам
    // используем прогресс напрямую
    const projected = totalScore + remain * 20;
    const diff = projected - market.line;
    let pOver = 1 / (1 + Math.exp(-diff * 0.2));
    pOver = clamp(pOver, 0.03, 0.97);
    const margin = 1.06;
    return [
      clamp(1 / pOver / margin, 1.02, 99),
      clamp(1 / (1 - pOver) / margin, 1.02, 99),
    ];
  }
  if(S === 'mma') ratePerMin = 0.002;    // почти нет гола
  if(S === 'cyber') ratePerMin = 0.005;

  const minutesLeft = match.gameDuration - g;
  const projected = totalScore + minutesLeft * ratePerMin;
  const diff = projected - market.line;

  let pOver = 1 / (1 + Math.exp(-diff * 1.5));
  pOver = clamp(pOver, 0.03, 0.97);

  // Особые случаи — если счёт уже превышает линию, OVER = 1.00 (закрыто)
  if(totalScore > market.line && market.type === 'over'){
    // Рынок решён
    return [1.00, 1.00];
  }

  const margin = 1.06;

  return [
    clamp(1 / pOver / margin, 1.02, 99),
    clamp(1 / (1 - pOver) / margin, 1.02, 99),
  ];
}

/* ---------- ОБЕ ЗАБЬЮТ ---------- */
function oddsBtts(match, market, ctx){
  const {remain} = ctx;
  const both = match.hs > 0 && match.as > 0;

  // Если обе забили — рынок WIN (закрываем)
  if(both){
    market.closed = [true, true];
    market.result = 'win';
    return [1.00, 1.00];
  }

  // Если одна команда точно не забьёт (осталось мало времени и счёт 0)
  const oneZero = (match.hs === 0 || match.as === 0) && remain < 0.1;
  if(oneZero){
    market.closed = [true, true];
    market.result = 'lose';
    return [1.00, 1.00];
  }

  // Вероятности забить ещё
  const pHomeScores = clamp(0.15 + match.hs * 0.3 + remain * 0.55, 0.02, 0.95);
  const pAwayScores = clamp(0.15 + match.as * 0.3 + remain * 0.55, 0.02, 0.95);
  let pYes = clamp(pHomeScores * pAwayScores, 0.03, 0.95);

  const margin = 1.06;

  return [
    clamp(1 / pYes / margin, 1.02, 99),
    clamp(1 / (1 - pYes) / margin, 1.02, 99),
  ];
}

/* ---------- ИНДИВИДУАЛЬНЫЙ ТОТАЛ ХОЗЯЕВ ---------- */
function oddsItb1(match, market, ctx){
  const {g, remain} = ctx;
  const S = match.sport;
  let rate = 0.012;
  if(S === 'hockey') rate = 0.02;
  if(S === 'tennis' || S === 'mma' || S === 'cyber') rate = 0.005;

  const minutesLeft = match.gameDuration - g;
  const projected = match.hs + minutesLeft * rate;
  const diff = projected - market.line;

  let pOver = 1 / (1 + Math.exp(-diff * 1.5));
  pOver = clamp(pOver, 0.03, 0.97);

  if(match.hs > market.line){
    return [1.00, 1.00];
  }

  const margin = 1.06;
  return [
    clamp(1 / pOver / margin, 1.02, 99),
    clamp(1 / (1 - pOver) / margin, 1.02, 99),
  ];
}

/* ---------- ИНДИВИДУАЛЬНЫЙ ТОТАЛ ГОСТЕЙ ---------- */
function oddsItb2(match, market, ctx){
