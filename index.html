<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1a1c2e">
<title>⚡ OpenBet — Live Betting</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
input{outline:none}
:root{
  --bg:#f4f5f8;--card:#fff;--border:#e8eaf0;--border-2:#dfe2ea;
  --text:#0d0e1c;--text-2:#4a4d63;--muted:#878a9e;
  --accent:#e60023;--accent-hover:#c50020;--accent-light:#ffe5e9;
  --green:#00a854;--green-light:#e6f7ee;
  --red:#e60023;--red-light:#ffe5e9;
  --gold:#f0b400;--gold-light:#fff8e1;
  --odd-bg:#f0f2f6;--odd-bg-hover:#e5e8ef;
  --header-bg:#1a1c2e;--header-text:#fff;
  --r-sm:8px;--r-md:12px;--r-lg:16px;
  --shadow-1:0 1px 3px rgba(20,20,40,.06);
  --shadow-2:0 8px 32px rgba(20,20,40,.14);
}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.coupon-open{overflow:hidden}

/* ============ TOP HEADER ============ */
.top-header{position:sticky;top:0;z-index:100;background:var(--header-bg);color:var(--header-text);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:60px}
.top-header .title{font-size:22px;font-weight:800;letter-spacing:-.4px}
.top-header .title.center{flex:1;text-align:center}
.top-header .actions{display:flex;align-items:center;gap:8px}
.top-header .action-btn{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;transition:background .15s}
.top-header .action-btn:hover{background:rgba(255,255,255,.18)}
.top-header .action-btn.with-dot{position:relative}
.top-header .action-btn.with-dot::after{content:'';position:absolute;top:6px;right:6px;width:8px;height:8px;background:var(--accent);border-radius:50%;border:1.5px solid var(--header-bg)}
.top-header .back-btn{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;transition:background .15s}
.top-header .back-btn:hover{background:rgba(255,255,255,.18)}

/* ============ SPORT TABS ============ */
.sport-tabs{background:#fff;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;position:sticky;top:60px;z-index:99}
.sport-tabs::-webkit-scrollbar{display:none}
.sport-tabs-inner{display:flex;padding:0 8px;min-width:max-content}
.sport-tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 18px;font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap;transition:color .15s;border-bottom:3px solid transparent;margin-bottom:-1px}
.sport-tab.active{color:var(--text);border-bottom-color:var(--accent)}
.sport-tab .icon{font-size:22px;line-height:1}
.sport-tab .count{font-size:10px;color:var(--muted);font-weight:500}
.sport-tab.active .count{color:var(--accent)}

/* ============ FILTER ROW ============ */
.filter-row{background:#fff;padding:12px 16px;display:flex;gap:10px;align-items:center;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--border)}
.filter-row::-webkit-scrollbar{display:none}
.filter-chip{padding:8px 16px;border-radius:20px;background:#f0f2f6;font-size:13px;font-weight:600;color:var(--text-2);white-space:nowrap;transition:all .15s;display:flex;align-items:center;gap:6px}
.filter-chip.active{background:var(--accent);color:#fff}
.filter-chip .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.filter-chip.active .dot{background:#fff}

/* ============ MAIN ============ */
.main{padding-bottom:80px}
.main.no-pad{padding-bottom:0}

/* League block */
.league-block{background:#fff;margin-bottom:8px}
.league-head{background:#eef0f5;padding:10px 16px;display:flex;align-items:center;gap:10px}
.league-head .league-icon{width:26px;height:26px;border-radius:4px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.league-head .league-name{font-size:13px;font-weight:700;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.league-head .league-filter{font-size:16px;color:var(--muted);background:none;padding:4px}

/* Match row */
.match-row{display:grid;grid-template-columns:18px 1fr 60px 60px 60px;padding:0;border-bottom:1px solid var(--border);background:#fff;cursor:pointer;transition:background .12s;position:relative}
.match-row:hover{background:#fafbfd}
.match-row:last-child{border-bottom:none}
.match-row .arrow{color:#c0c4d0;font-size:16px;display:flex;align-items:center;justify-content:center;padding-left:4px}
.match-row .teams{display:flex;flex-direction:column;gap:3px;min-width:0;padding:12px 8px 12px 4px;position:relative}
.match-row .team-line{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--text);overflow:hidden}
.match-row .team-line.loser{color:var(--text-2);font-weight:500}
.match-row .team-logo{width:18px;height:18px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;color:#fff}
.match-row .team-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.match-row .team-score{font-weight:800;font-size:14px;margin-left:auto;padding-left:6px}
.match-row .team-score.red{color:var(--accent)}
.match-row .time{font-size:11px;color:var(--muted);font-weight:500;padding-left:26px;margin-top:2px;display:flex;align-items:center;gap:4px}
.match-row .time.live{color:var(--green);font-weight:700}
.match-row .time .live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.match-row .cards-indicators{position:absolute;left:0;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:3px;padding-left:2px}
.match-row .ind-yellow{width:3px;height:14px;background:#ffc107;border-radius:1px}
.match-row .ind-red{width:3px;height:14px;background:var(--accent);border-radius:1px}

.odd-cell{display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:var(--text);border-left:1px solid var(--border);transition:all .12s;cursor:pointer;min-height:60px;padding:8px 4px;position:relative}
.odd-cell:hover{background:var(--odd-bg-hover)}
.odd-cell.selected{background:var(--accent);color:#fff}
.odd-cell.disabled{color:#c0c4d0;cursor:not-allowed}
.odd-cell.up{color:var(--green);animation:flash .6s}
.odd-cell.down{color:var(--red);animation:flash .6s}
.odd-cell.dash{color:#c0c4d0;cursor:default}
.odd-cell.dash:hover{background:transparent}
@keyframes flash{0%,100%{opacity:1}50%{opacity:.3}}
.odd-cell .hdr{position:absolute;top:2px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--muted);font-weight:500}
.odd-cell.selected .hdr{color:rgba(255,255,255,.7)}

/* Show all */
.show-all{display:block;margin:12px 16px;padding:14px;text-align:center;background:#fff;border-radius:var(--r-md);color:var(--text);font-size:14px;font-weight:600;border:1px solid var(--border);cursor:pointer;transition:all .15s;width:calc(100% - 32px)}
.show-all:hover{background:#fafbfd;border-color:var(--border-2)}

/* ============ MATCH HEADER ============ */
.match-header{padding:16px;background:linear-gradient(180deg,#3a3d52 0%,#282a3d 100%);color:#fff}
.match-header .crumbs{font-size:11px;color:rgba(255,255,255,.6);font-weight:500;margin-bottom:6px}
.match-header .league-line{display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:700;margin-bottom:14px}
.match-header .league-line .updown{background:rgba(255,255,255,.1);border-radius:6px;padding:6px 10px;font-size:13px;cursor:pointer}
.match-header .match-meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:rgba(255,255,255,.7);margin-bottom:12px}
.match-header .match-meta .icons{display:flex;gap:14px;font-size:20px}
.match-header .match-meta .icons span{cursor:pointer;opacity:.7;transition:opacity .15s}
.match-header .match-meta .icons span:hover{opacity:1}
.match-header .score-line{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:6px 0}
.match-header .team-big{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700;min-width:0}
.match-header .team-big.right{flex-direction:row-reverse;text-align:right}
.match-header .team-big .logo{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;background:rgba(255,255,255,.15);flex-shrink:0}
.match-header .team-big .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.match-header .score-center{font-size:24px;font-weight:900;letter-spacing:-1px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:70px}
.match-header .score-center .timer{font-size:12px;color:rgba(255,255,255,.7);font-weight:600;letter-spacing:0}
.match-header .score-center .timer.live{color:#00e676}
.match-header .half-scores{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.12);font-size:10px;color:rgba(255,255,255,.55);text-align:center}
.match-header .half-scores b{color:#fff;font-weight:800;font-size:14px;display:block;margin-top:2px}

/* ============ MARKET TABS ============ */
.market-tabs{display:flex;background:#fff;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;position:sticky;top:60px;z-index:50}
.market-tabs::-webkit-scrollbar{display:none}
.market-tabs-inner{display:flex;padding:0 4px;min-width:max-content}
.market-tab{padding:14px 16px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;cursor:pointer}
.market-tab.active{color:var(--text);border-bottom-color:var(--text)}
.market-tab.icon-only{padding:14px 12px;font-size:18px}

/* ============ MARKET CARD ============ */
.market-card{background:#fff;margin:8px 8px 0;border-radius:var(--r-md);overflow:hidden;box-shadow:var(--shadow-1)}
.market-card:last-child{margin-bottom:16px}
.market-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;user-select:none}
.market-head .star{font-size:16px;color:#c0c4d0;margin-right:8px;cursor:pointer;transition:color .15s}
.market-head .star.active{color:var(--gold)}
.market-head .title{font-size:15px;font-weight:700;color:var(--text);flex:1}
.market-head .chevron{font-size:14px;color:var(--muted);transition:transform .2s}
.market-card.collapsed .chevron{transform:rotate(180deg)}
.market-card.collapsed .market-body{display:none}
.market-body{padding:0 12px 12px}

/* Grids */
.odds-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.odds-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.odds-pair{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}

.odd-btn{background:var(--odd-bg);border-radius:var(--r-sm);padding:12px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--text);transition:all .12s;cursor:pointer;min-height:48px;border:none;text-align:left}
.odd-btn:hover:not(.disabled){background:var(--odd-bg-hover)}
.odd-btn.selected{background:var(--accent);color:#fff}
.odd-btn .lbl{color:var(--muted);font-weight:600;font-size:13px;flex-shrink:0}
.odd-btn.selected .lbl{color:rgba(255,255,255,.85)}
.odd-btn .val{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;margin-left:auto}
.odd-btn.disabled{opacity:.35;cursor:not-allowed}

.odds-labeled{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px}
.odds-labeled .col-head{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:0 4px;margin-bottom:6px}

/* Line selector */
.line-selector{display:flex;gap:4px;padding:0 0 10px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--border);margin-bottom:10px}
.line-selector::-webkit-scrollbar{display:none}
.line-opt{padding:8px 14px;background:#f0f2f6;border-radius:var(--r-sm);font-size:13px;font-weight:700;color:var(--text-2);white-space:nowrap;cursor:pointer;transition:all .15s;border:1.5px solid transparent}
.line-opt.active{background:#fff;color:var(--text);border-color:var(--text);font-weight:800}

/* Stats params */
.stat-params{display:flex;background:#fff;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;padding:0 8px}
.stat-params::-webkit-scrollbar{display:none}
.stat-param{padding:12px 14px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;transition:all .15s}
.stat-param.active{color:var(--text);border-bottom-color:var(--accent)}

.stat-counter{display:flex;justify-content:center;align-items:center;gap:16px;padding:16px;background:#f8f9fc;border-radius:var(--r-md);margin:8px;text-align:center}
.stat-counter .cnt-h,.stat-counter .cnt-a{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;min-width:40px}
.stat-counter .cnt-h{color:var(--accent)}
.stat-counter .cnt-a{color:var(--text)}
.stat-counter .lbl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}

/* ============ BOTTOM TAB BAR ============ */
.tab-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr);z-index:200;padding-bottom:env(safe-area-inset-bottom)}
.tab-bar-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 8px;font-size:10px;font-weight:600;color:var(--muted);transition:color .15s;position:relative;cursor:pointer;background:none;border:none}
.tab-bar-item.active{color:var(--text)}
.tab-bar-item .tab-icon{font-size:20px;line-height:1}
.tab-bar-item .badge{position:absolute;top:4px;right:calc(50% - 20px);min-width:18px;height:18px;background:var(--accent);color:#fff;border-radius:9px;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px;box-sizing:border-box}

/* ============ FLOATING COUPON WIDGET ============ */
.floating-coupon{position:fixed;bottom:70px;left:8px;right:8px;background:#fff;border-radius:var(--r-md);padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow-2);z-index:190;cursor:pointer;transition:transform .2s;border:1px solid var(--border)}
.floating-coupon:hover{transform:translateY(-2px)}
.floating-coupon .fc-icon{width:34px;height:34px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;flex-shrink:0}
.floating-coupon .fc-info{flex:1;min-width:0}
.floating-coupon .fc-match{font-size:11px;color:var(--muted);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.floating-coupon .fc-pick{font-size:13px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.floating-coupon .fc-odd{font-size:18px;font-weight:900;color:var(--text);flex-shrink:0;font-variant-numeric:tabular-nums}

/* ============ COUPON PANEL ============ */
.coupon-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;opacity:0;pointer-events:none;transition:opacity .3s}
.coupon-overlay.active{opacity:1;pointer-events:auto}
.coupon-panel{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:20px 20px 0 0;z-index:310;transform:translateY(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);max-height:88vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.coupon-panel.active{transform:translateY(0)}
.coupon-head{padding:18px 16px 8px;display:flex;align-items:center;gap:12px;position:relative}
.coupon-head .grab{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:36px;height:4px;background:#e0e2ea;border-radius:2px}
.coupon-head .settings{font-size:18px;color:var(--muted);width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.coupon-head .tabs{display:flex;gap:20px;flex:1;justify-content:center}
.coupon-head .tabs .ct{font-size:15px;font-weight:600;color:var(--muted);cursor:pointer;padding-bottom:8px;border-bottom:2px solid transparent;transition:all .15s;background:none}
.coupon-head .tabs .ct.active{color:var(--text);border-bottom-color:var(--accent)}
.coupon-head .close-btn{font-size:20px;color:var(--muted);width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:#f0f2f6;cursor:pointer}

.coupon-body{flex:1;overflow-y:auto;padding:8px 16px 16px}
.coupon-empty{padding:40px 20px;text-align:center;color:var(--muted)}
.coupon-empty .icon{font-size:48px;margin-bottom:12px;opacity:.4}
.coupon-empty .txt{font-size:14px;font-weight:600}

.coupon-item{background:#f8f9fc;border-radius:var(--r-md);padding:14px;margin-bottom:10px;position:relative}
.coupon-item .ci-head{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:8px}
.coupon-item .ci-score{background:#dbeafe;color:#2563eb;font-weight:800;padding:2px 8px;border-radius:4px;font-size:11px}
.coupon-item .ci-league{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.coupon-item .ci-remove{font-size:22px;color:var(--muted);width:24px;height:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:none;line-height:1}
.coupon-item .ci-pick{font-size:15px;font-weight:700;color:var(--text);display:flex;justify-content:space-between;align-items:center;gap:8px}
.coupon-item .ci-odd{font-size:22px;font-weight:900;color:var(--text);font-variant-numeric:tabular-nums}

.coupon-type{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.coupon-type .ct-btn{padding:10px 16px;background:#f0f2f6;border-radius:var(--r-sm);font-size:14px;font-weight:700;color:var(--text-2);cursor:pointer;border:1.5px solid transparent;transition:all .15s}
.coupon-type .ct-btn.active{background:#fff;border-color:var(--text);color:var(--text)}
.coupon-type .swap{margin-left:auto;width:36px;height:36px;background:#f0f2f6;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer}

.coupon-stake{display:flex;align-items:stretch;background:#fff;border:1px solid var(--border-2);border-radius:var(--r-md);margin-bottom:8px;overflow:hidden}
.coupon-stake .stake-input{flex:1;padding:14px 16px;font-size:16px;font-weight:700;border:none;background:transparent;width:100%;color:var(--text)}
.coupon-stake .stake-input::placeholder{color:var(--muted);font-weight:500}
.coupon-stake .stake-right{display:flex;flex-direction:column;justify-content:center;align-items:flex-end;padding:8px 12px;border-left:1px solid var(--border);gap:4px}
.coupon-stake .balance-label{font-size:10px;color:var(--muted);font-weight:500}
.coupon-stake .balance-val{font-size:14px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums}
.coupon-stake .add-btn{width:26px;height:26px;background:var(--accent);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;cursor:pointer;margin-top:2px}

.coupon-limits{display:flex;gap:8px;font-size:11px;color:var(--muted);margin-bottom:12px;padding:0 4px;align-items:center}
.coupon-limits .lmt{padding:6px 10px;background:#f0f2f6;border-radius:6px;font-weight:700;color:var(--text-2);font-variant-numeric:tabular-nums}
.coupon-limits .lmt b{color:var(--text);font-weight:800}
.coupon-limits .settings-btn{margin-left:auto;width:32px;height:32px;background:#f0f2f6;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer}

.coupon-actions{display:flex;gap:10px;margin-bottom:8px}
.coupon-actions .potential{flex:1;background:#f8f9fc;border-radius:var(--r-md);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);font-weight:600}
.coupon-actions .potential b{color:var(--text);font-weight:800;font-size:15px}

.coupon-place{width:100%;padding:16px;background:var(--accent);color:#fff;border-radius:var(--r-md);font-size:16px;font-weight:800;cursor:pointer;transition:background .15s;letter-spacing:.3px}
.coupon-place:hover{background:var(--accent-hover)}
.coupon-place:disabled{background:#e0e2ea;color:var(--muted);cursor:not-allowed}

/* ============ HISTORY / STATS / ACHIEVEMENTS / TOP ============ */
.section-title{font-size:20px;font-weight:800;padding:16px;letter-spacing:-.4px}

.history-filters{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none}
.history-filters::-webkit-scrollbar{display:none}
.history-chip{padding:8px 14px;background:#fff;border:1px solid var(--border);border-radius:20px;font-size:12.5px;font-weight:700;color:var(--muted);white-space:nowrap;cursor:pointer;transition:all .15s}
.history-chip.active{background:var(--text);border-color:var(--text);color:#fff}

.history-list{padding:0 8px}
.history-item{background:#fff;border-radius:var(--r-md);padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:all .15s;position:relative;overflow:hidden}
.history-item:hover{transform:translateX(2px)}
.history-item::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px}
.history-item.won::before{background:var(--green)}
.history-item.lost::before{background:var(--red)}
.history-item.pending::before{background:var(--gold)}
.history-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px}
.history-match{font-weight:700;font-size:14px;line-height:1.3}
.history-meta{font-size:11.5px;color:var(--muted);margin-top:3px;font-weight:600}
.history-amount{font-weight:800;font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.history-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:10px;border-top:1px solid var(--border)}
.history-odd{font-size:12px;color:var(--muted);font-weight:600}
.history-odd b{color:var(--text);font-weight:800}
.history-status{font-weight:800;padding:4px 12px;border-radius:6px;text-transform:uppercase;letter-spacing:.3px;font-size:10.5px}
.history-status.won{background:var(--green-light);color:var(--green)}
.history-status.lost{background:var(--red-light);color:var(--red)}
.history-status.pending{background:var(--gold-light);color:var(--gold)}
.cashout-btn{background:var(--green);color:#fff;padding:10px 18px;border-radius:var(--r-sm);font-weight:800;font-size:12.5px;margin-top:10px;cursor:pointer}

.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 16px;margin-bottom:16px}
@media(min-width:700px){.stats-grid{grid-template-columns:repeat(4,1fr)}}
.stat-card{background:#fff;border-radius:var(--r-md);padding:16px}
.stat-label{font-size:11px;color:var(--muted);margin-bottom:6px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.stat-value{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.stat-value.green{color:var(--green)}
.stat-value.red{color:var(--red)}
.stat-value.gold{color:var(--gold)}

.chart-wrap{padding:0 16px 16px}
.chart-card{background:#fff;border-radius:var(--r-md);padding:18px}
.chart-title{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px}
.chart-canvas{width:100%;height:180px;display:block}

.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:0 16px}
.ach{background:#fff;border-radius:var(--r-md);padding:18px 12px;text-align:center;opacity:.4;transition:all .2s}
.ach.unlocked{opacity:1;border:1.5px solid var(--gold)}
.ach-icon{font-size:32px;margin-bottom:8px}
.ach-name{font-size:12px;font-weight:700;margin-bottom:3px}
.ach-desc{font-size:10.5px;color:var(--muted);font-weight:600}

.leaderboard{background:#fff;border-radius:var(--r-md);margin:0 16px 16px;padding:16px}
.lb-header{color:var(--muted);font-size:12.5px;margin-bottom:12px;font-weight:600}
.lb-header b{color:var(--text);font-weight:800}
.lb-row{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);font-size:13px}
.lb-row:last-child{border-bottom:none}
.lb-row.me{background:var(--accent-light);margin:0 -16px;padding:12px 16px;border-radius:var(--r-sm);border-bottom:none}
.lb-rank{font-weight:900;font-size:16px;color:var(--muted);text-align:center}
.lb-rank.top1{color:var(--gold)}
.lb-rank.top2{color:#c0c0c0}
.lb-rank.top3{color:#cd7f32}
.lb-name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-name.me{color:var(--accent)}
.lb-value{font-weight:800;color:var(--green);font-variant-numeric:tabular-nums;font-size:13px}

/* ============ SECTION TAB SWITCH ============ */
.section-tabs{display:flex;background:#fff;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.section-tabs::-webkit-scrollbar{display:none}
.section-tabs-inner{display:flex;padding:0 8px;min-width:max-content}
.section-tab{padding:14px 18px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;cursor:pointer;background:none}
.section-tab.active{color:var(--text);border-bottom-color:var(--accent)}

/* ============ EMPTY / LOADING ============ */
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-icon{font-size:56px;margin-bottom:16px;opacity:.4}
.empty-text{font-size:15px;font-weight:600}

.skeleton{background:linear-gradient(90deg,#f0f2f6 25%,#e8eaf0 50%,#f0f2f6 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:var(--r-md);height:80px;margin:0 8px 8px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ============ TOAST ============ */
.toast-container{position:fixed;top:80px;right:16px;z-index:2000;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:320px}
.toast{background:#1a1c2e;color:#fff;border-radius:var(--r-md);padding:14px 18px;font-size:13px;font-weight:600;box-shadow:var(--shadow-2);animation:toastIn .3s;pointer-events:auto;display:flex;align-items:center;gap:10px}
.toast.win{background:#00a854}
.toast.lose{background:#e60023}
.toast.info{background:#1a1c2e}
.toast.gold{background:#f0b400;color:#1a1c2e}
@keyframes toastIn{from{transform:translateX(120%);opacity:0}}

/* ============ MOBILE ============ */
@media(min-width:768px){
  body{max-width:480px;margin:0 auto;box-shadow:0 0 40px rgba(0,0,0,.08)}
  .tab-bar{max-width:480px;left:50%;transform:translateX(-50%)}
  .floating-coupon{max-width:464px;left:50%;transform:translateX(-50%)}
  .coupon-panel{max-width:480px;left:50%;transform:translateX(-50%) translateY(100%)}
  .coupon-panel.active{transform:translateX(-50%) translateY(0)}
  .toast-container{max-width:320px;right:calc(50% - 240px + 16px)}
}
</style>
</head>
<body>

<!-- ============ КОРЕНЬ ============ -->
<div id="app"></div>

<!-- ============ TOAST ============ -->
<div class="toast-container" id="toastContainer"></div>

<!-- ============ COUPON OVERLAY ============ -->
<div class="coupon-overlay" id="couponOverlay"></div>

<!-- ============ COUPON PANEL ============ -->
<div class="coupon-panel" id="couponPanel">
  <div class="coupon-head">
    <div class="grab"></div>
    <button class="settings" id="couponSettings">⚙️</button>
    <div class="tabs">
      <button class="ct active" data-ctab="coupon">Купон</button>
      <button class="ct" data-ctab="history">История</button>
      <button class="ct" data-ctab="promo">Промо</button>
    </div>
    <button class="close-btn" id="couponClose">✕</button>
  </div>
  <div class="coupon-body" id="couponBody"></div>
</div>

<!-- ============ SCRIPT ============ -->
<script src="app.js"></script>

</body>
</html>
